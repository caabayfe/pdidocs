<g class="r g1 box" id="n-f"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Field Services</text><text class="lbl m" x="480" y="197">Please deploy item</text><text class="lbl m" x="480" y="214">to the user</text></g>
