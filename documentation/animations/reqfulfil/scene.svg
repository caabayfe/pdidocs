<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g1" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g2" d="M552 193 H598" marker-end="url(#ah)"/>
