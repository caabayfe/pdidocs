<svg viewBox="0 0 960 440" role="img" aria-labelledby="increportt increportd"><title id="increportt">Reporting an incident</title><desc id="increportd">A report from the portal, by email or by phone becomes an incident; the caller is emailed and the incident goes to a support team's queue.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B65C02"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F845A"/></marker></defs><g id="cam">
<g class="r g0 box " ><rect x="30" y="60" width="170" height="70" rx="10"/><text class="lbl b m" x="115.0" y="86" style="font-size:14px">Portal</text><text class="lbl m " x="115.0" y="106">Get Help › Create Incident</text></g>
<g class="r g0 box " ><rect x="30" y="185" width="170" height="70" rx="10"/><text class="lbl b m" x="115.0" y="211" style="font-size:14px">Email</text><text class="lbl m " x="115.0" y="231">to the service desk</text></g>
<g class="r g0 box " ><rect x="30" y="310" width="170" height="70" rx="10"/><text class="lbl b m" x="115.0" y="336" style="font-size:14px">Phone / walk-in</text><text class="lbl m " x="115.0" y="356">an agent logs it</text></g>
<path class="e r g1" d="M200 95 L330 200" marker-end="url(#ah)"/><path class="e r g1" d="M200 220 H330" marker-end="url(#ah)"/><path class="e r g1" d="M200 345 L330 240" marker-end="url(#ah)"/>
<g class="r g1 box " ><rect x="330" y="170" width="180" height="100" rx="10"/><text class="lbl b m" x="420.0" y="196" style="font-size:14px">Incident INC…</text><text class="lbl m " x="420.0" y="216">state New</text><text class="lbl m " x="420.0" y="232">caller = you</text><text class="lbl m " x="420.0" y="248">urgency you chose</text></g>
<path class="eg r g2" d="M510 200 H600" marker-end="url(#ahG)"/>
<g class="r g2 box " ><rect x="600" y="150" width="170" height="70" rx="10"/><text class="lbl b m" x="685.0" y="176" style="font-size:14px">Email to you</text><text class="lbl m g" x="685.0" y="196">“Incident … was created”</text></g>
<path class="e r g3" d="M510 245 H600" marker-end="url(#ah)"/>
<g class="r g3 box " ><rect x="600" y="240" width="170" height="70" rx="10"/><text class="lbl b m" x="685.0" y="266" style="font-size:14px">Support team</text><text class="lbl m " x="685.0" y="286">picks it up from the queue</text></g>
</g></svg>