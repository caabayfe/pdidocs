<svg viewBox="0 0 960 440" role="img" aria-labelledby="inccopyt inccopyd"><title id="inccopyt">Copy an incident</title><desc id="inccopyd">A new incident for another caller, from an existing one</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="eg r g3" d="M669 236 V290" marker-end="url(#ah)"/>
<path class="ea r g5" d="M858 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-m"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="180">More actions</text><text class="lbl m" x="102" y="197">Copy Incident</text><text class="lbl bl m" x="102" y="214">itil, any state</text></g>
<g class="r g1 box" id="n-d"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="180">Dialog</text><text class="lbl m" x="291" y="197">Caller</text><text class="lbl m" x="291" y="214">(required)</text></g>
<g class="r g2 box" id="n-a"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Include</text><text class="lbl m" x="480" y="197">attachments</text><text class="lbl g m" x="480" y="214">ticked by default</text></g>
<g class="r g3 box" id="n-c"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="180">Copy</text><text class="lbl m" x="669" y="197">saved at once,</text><text class="lbl m" x="669" y="214">then opens</text></g>
<g class="r g4 box" id="n-n"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="172">Work note</text><text class="lbl m" x="858" y="188">copied from</text><text class="lbl m" x="858" y="206">INC...</text><text class="lbl a m" x="858" y="222">only link back</text></g>
<g class="r g3 box" id="n-f"><rect x="594" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="669" y="320">Copied</text><text class="lbl m" x="669" y="337">description, category,</text><text class="lbl m" x="669" y="354">CI, group, priority</text></g>
<g class="r g5 box" id="n-x"><rect x="783" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="858" y="320">Not copied</text><text class="lbl m" x="858" y="337">assignee, state,</text><text class="lbl m" x="858" y="354">notes, watch list</text></g>
</g></svg>