<svg viewBox="0 0 960 440" role="img" aria-labelledby="inclogt inclogd"><title id="inclogt">Log an incident</title><desc id="inclogd">From the caller&#x27;s words to a saved incident</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="ea r g0" d="M102 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-c"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="180">Caller</text><text class="lbl m" x="102" y="197">search by name</text><text class="lbl m" x="102" y="214">location fills in</text></g>
<g class="r g1 box" id="n-k"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="180">Channel, category</text><text class="lbl m" x="291" y="197">how they reached you</text><text class="lbl m" x="291" y="214">subcategory follows</text></g>
<g class="r g2 box" id="n-ci"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Configuration item</text><text class="lbl m" x="480" y="197">what is affected</text><text class="lbl g m" x="480" y="214">can fill the team</text></g>
<g class="r g3 box" id="n-p"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="188">Impact × Urgency</text><text class="lbl m" x="669" y="206">Priority fills in</text></g>
<g class="r g4 box" id="n-s"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="172">Save</text><text class="lbl m" x="858" y="188">INC number</text><text class="lbl m" x="858" y="206">caller is emailed</text><text class="lbl a m" x="858" y="222">short description required</text></g>
<g class="r g0 box" id="n-vip"><rect x="27" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="102" y="320">VIP caller</text><text class="lbl m" x="102" y="337">icon, field turns red</text><text class="lbl a m" x="102" y="354">treat accordingly</text></g>
</g></svg>