<svg viewBox="0 0 960 440" role="img" aria-labelledby="chgcabt chgcabd"><title id="chgcabt">The change advisory board</title><desc id="chgcabd">From the invitation to the decision</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 243 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 243 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 243 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 243 H787" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-d"><rect x="30" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="230">Network CAB</text><text class="lbl m" x="102" y="247">network changes,</text><text class="lbl m" x="102" y="264">moderate risk or higher</text></g>
<g class="r g1 box" id="n-i"><rect x="219" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="230">Invitation</text><text class="lbl m" x="291" y="247">calendar attachment,</text><text class="lbl m" x="291" y="264">answer records it</text></g>
<g class="r g2 box" id="n-w"><rect x="408" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="238">CAB Workbench</text><text class="lbl m" x="480" y="256">calendar, meeting</text></g>
<g class="r g3 box" id="n-a"><rect x="598" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="230">Each agenda item</text><text class="lbl m" x="669" y="247">Approve, Reject,</text><text class="lbl m" x="669" y="264">Next, Pause, Demote</text></g>
<g class="r g4 box" id="n-c"><rect x="787" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="238">CAB approval</text><text class="lbl m" x="858" y="256">on the change</text></g>
</g></svg>