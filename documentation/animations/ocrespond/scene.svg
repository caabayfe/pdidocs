<svg viewBox="0 0 960 440" role="img" aria-labelledby="ocrespondt ocrespondd"><title id="ocrespondt">When on-call work reaches you</title><desc id="ocrespondd">From an unassigned incident to the person who takes it</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="ea r g4" d="M591 236 V290" marker-end="url(#ah)"/>
<path class="ea r g5" d="M813 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-t"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="172">Incident</text><text class="lbl m" x="147" y="188">to a group</text><text class="lbl m" x="147" y="206">with a shift</text><text class="lbl bl m" x="147" y="222">nobody assigned</text></g>
<g class="r g1 box" id="n-r"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="172">Trigger rule</text><text class="lbl m" x="369" y="188">starts an</text><text class="lbl m" x="369" y="206">on-call subflow</text><text class="lbl a m" x="369" y="222">none on pdi2</text></g>
<g class="r g2 box" id="n-c"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="180">You are contacted</text><text class="lbl m" x="591" y="197">email, SMS</text><text class="lbl m" x="591" y="214">or a call</text></g>
<g class="r g3 box" id="n-a"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="172">ACC, or press 1</text><text class="lbl m" x="813" y="188">you become</text><text class="lbl m" x="813" y="206">the assignee</text><text class="lbl g m" x="813" y="222">work note: acknowledged</text></g>
<g class="r g4 box" id="n-n"><rect x="503" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="320">REJ, or no answer</text><text class="lbl m" x="591" y="337">the next person,</text><text class="lbl m" x="591" y="354">then the next level</text></g>
<g class="r g5 box" id="n-k"><rect x="725" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="320">Catch-all</text><text class="lbl m" x="813" y="337">nobody accepted:</text><text class="lbl m" x="813" y="354">person, all or manager</text></g>
</g></svg>