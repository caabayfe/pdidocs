<svg viewBox="0 0 960 440" role="img" aria-labelledby="chguapprt chguapprd"><title id="chguapprt">Approve a change</title><desc id="chguapprd">When you are asked to approve</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="e r g4" d="M147 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-e"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="180">Email</text><text class="lbl m" x="147" y="197">short description,</text><text class="lbl m" x="147" y="214">priority, category</text></g>
<g class="r g1 box" id="n-t"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="188">My Tasks</text><text class="lbl m" x="369" y="206">Approve Request</text></g>
<g class="r g2 box" id="n-r"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="180">Read the plan</text><text class="lbl m" x="591" y="197">done, tested,</text><text class="lbl m" x="591" y="214">undone how?</text></g>
<g class="r g3 box" id="n-a"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="172">Approve</text><text class="lbl m" x="813" y="188">or Reject with</text><text class="lbl m" x="813" y="206">a reason</text><text class="lbl a m" x="813" y="222">reason required</text></g>
<g class="r g4 box" id="n-m"><rect x="59" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="312">Or by email</text><text class="lbl m" x="147" y="328">approve or reject link,</text><text class="lbl m" x="147" y="346">reason in the body</text><text class="lbl bl m" x="147" y="362">only your replies count</text></g>
</g></svg>