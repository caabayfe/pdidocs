<svg viewBox="0 0 960 440" role="img" aria-labelledby="incslat incslad"><title id="incslat">Meet an incident&#x27;s deadlines</title><desc id="incslad">The resolution clock of an incident</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g2" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g3" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g4" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g5" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="ea r g1" d="M102 236 V290" marker-end="url(#ah)"/>
<path class="e r g6" d="M480 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-s"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="180">Starts</text><text class="lbl m" x="102" y="197">priority set,</text><text class="lbl m" x="102" y="214">counted from creation</text></g>
<g class="r g2 box" id="n-h"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="172">50% used</text><text class="lbl m" x="291" y="188">warning to</text><text class="lbl m" x="291" y="206">the assignee</text><text class="lbl a m" x="291" y="222">and the CI&#x27;s supporter</text></g>
<g class="r g3 box" id="n-q"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">75% used</text><text class="lbl m" x="480" y="197">warning to the</text><text class="lbl m" x="480" y="214">assignee and manager</text></g>
<g class="r g4 box" id="n-b"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="172">Breached</text><text class="lbl m" x="669" y="188">email to the</text><text class="lbl m" x="669" y="206">assignee and manager</text><text class="lbl r2 m" x="669" y="222">clock keeps running</text></g>
<g class="r g5 box" id="n-c"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="172">Closed</text><text class="lbl m" x="858" y="188">the SLA</text><text class="lbl m" x="858" y="206">completes</text><text class="lbl g m" x="858" y="222">met if resolved in time</text></g>
<g class="r g1 box" id="n-p"><rect x="27" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="102" y="320">Paused</text><text class="lbl m" x="102" y="337">Awaiting Caller,</text><text class="lbl m" x="102" y="354">or Resolved</text></g>
<g class="r g6 box" id="n-t"><rect x="405" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="480" y="320">Record Information</text><text class="lbl m" x="480" y="337">Resolution SLA</text><text class="lbl m" x="480" y="354">timer</text></g>
</g></svg>