<svg viewBox="0 0 960 440" role="img" aria-labelledby="inclifet inclifed"><title id="inclifet">The life of an incident</title><desc id="inclifed">An incident moves from New to In Progress when assigned, may go On Hold while waiting, is Resolved when fixed, can be reopened, and is finally Closed.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B65C02"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F845A"/></marker></defs><g id="cam">
<g class="r g0 box " ><rect x="30" y="170" width="140" height="80" rx="10"/><text class="lbl b m" x="100.0" y="196" style="font-size:14px">New</text><text class="lbl m " x="100.0" y="216">logged, not yet</text><text class="lbl m " x="100.0" y="232">being worked on</text></g>
<path class="e r g1" d="M170 210 H230" marker-end="url(#ah)"/>
<g class="r g1 box " ><rect x="230" y="170" width="150" height="80" rx="10"/><text class="lbl b m" x="305.0" y="196" style="font-size:14px">In Progress</text><text class="lbl m " x="305.0" y="216">someone is assigned</text><text class="lbl m g" x="305.0" y="232">deadlines run</text></g>
<path class="ea r g2" d="M285 250 V310" marker-end="url(#ahA)"/><path class="ea r g2" d="M325 310 V250" marker-end="url(#ahA)"/>
<g class="r g2 box " ><rect x="215" y="310" width="180" height="100" rx="10"/><text class="lbl b m" x="305.0" y="336" style="font-size:14px">On Hold</text><text class="lbl m a" x="305.0" y="356">Awaiting Caller · Change</text><text class="lbl m a" x="305.0" y="372">Problem · Vendor</text><text class="lbl m " x="305.0" y="388">caller's reply resumes it</text></g>
<path class="e r g3" d="M380 210 H450" marker-end="url(#ah)"/>
<g class="r g3 box " ><rect x="450" y="170" width="150" height="80" rx="10"/><text class="lbl b m" x="525.0" y="196" style="font-size:14px">Resolved</text><text class="lbl m " x="525.0" y="216">fix recorded</text><text class="lbl m g" x="525.0" y="232">caller is told</text></g>
<path class="eg r g4" d="M525 170 C525 90 305 90 305 165" marker-end="url(#ahG)"/><text class="lbl g m r g4" x="415" y="98" style="font-size:12px">Reopen (with a comment)</text>
<path class="e r g5" d="M600 210 H670" marker-end="url(#ah)"/>
<g class="r g5 box " ><rect x="670" y="170" width="150" height="80" rx="10"/><text class="lbl b m" x="745.0" y="196" style="font-size:14px">Closed</text><text class="lbl m " x="745.0" y="216">by the caller, a team</text><text class="lbl m " x="745.0" y="232">lead, or automatically</text></g>
<g class="r g5 box " ><rect x="840" y="190" width="100" height="50" rx="10"/><text class="lbl b m" x="890.0" y="216" style="font-size:14px">Canceled</text><text class="lbl m " x="890.0" y="236">logged by mistake</text></g>
</g></svg>