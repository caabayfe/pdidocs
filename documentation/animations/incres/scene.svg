<svg viewBox="0 0 960 440" role="img" aria-labelledby="increst incresd"><title id="increst">Resolve an incident</title><desc id="incresd">From the fix to the caller&#x27;s answer</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 243 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 243 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 243 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 243 H787" marker-end="url(#ah)"/>
<path class="ea r g2" d="M480 286 V340" marker-end="url(#ah)"/>
<path class="ea r g2" d="M480 200 V146" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-f"><rect x="30" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="230">Caller can work</text><text class="lbl m" x="102" y="247">fixed, or</text><text class="lbl m" x="102" y="264">workaround agreed</text></g>
<g class="r g1 box" id="n-r"><rect x="219" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="238">Press Resolve</text><text class="lbl m" x="291" y="256">in the header</text></g>
<g class="r g2 box" id="n-n"><rect x="408" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="230">Code and notes</text><text class="lbl m" x="480" y="247">the caller reads</text><text class="lbl m" x="480" y="264">the notes</text></g>
<g class="r g3 box" id="n-s"><rect x="598" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="230">Resolved</text><text class="lbl m" x="669" y="247">caller is emailed</text><text class="lbl g m" x="669" y="264">children resolve too</text></g>
<g class="r g4 box" id="n-c"><rect x="787" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="230">Caller answers</text><text class="lbl m" x="858" y="247">confirm or reopen</text><text class="lbl a m" x="858" y="264">closes after 7 days</text></g>
<g class="r g2 box" id="n-dup"><rect x="405" y="340" width="150" height="86" rx="10"/><text class="lbl b m" x="480" y="370">Duplicate</text><text class="lbl m" x="480" y="387">asks for the</text><text class="lbl m" x="480" y="404">parent incident</text></g>
<g class="r g2 box" id="n-ke"><rect x="405" y="60" width="150" height="86" rx="10"/><text class="lbl b m" x="480" y="82">Known error</text><text class="lbl m" x="480" y="98">attach the</text><text class="lbl m" x="480" y="116">article first</text><text class="lbl r2 m" x="480" y="132">a rule checks it</text></g>
</g></svg>