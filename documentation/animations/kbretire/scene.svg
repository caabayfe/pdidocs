<svg viewBox="0 0 960 440" role="img" aria-labelledby="kbretiret kbretired"><title id="kbretiret">Retire or replace an article</title><desc id="kbretired">Withdrawing an article, and pointing readers to its replacement</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g5" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="ea r g4" d="M480 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-r"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="172">Retire</text><text class="lbl m" x="102" y="188">latest published</text><text class="lbl m" x="102" y="206">version</text><text class="lbl bl m" x="102" y="222">author or manager</text></g>
<g class="r g1 box" id="n-q"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="180">Replace it?</text><text class="lbl m" x="291" y="197">Yes: pick a</text><text class="lbl m" x="291" y="214">published article</text></g>
<g class="r g2 box" id="n-f"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Retire flow</text><text class="lbl m" x="480" y="197">the knowledge</text><text class="lbl m" x="480" y="214">base decides</text></g>
<g class="r g3 box" id="n-d"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="172">Retired</text><text class="lbl m" x="669" y="188">every version</text><text class="lbl m" x="669" y="206">of the article</text><text class="lbl g m" x="669" y="222">gone from search</text></g>
<g class="r g5 box" id="n-v"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="172">Readers</text><text class="lbl m" x="858" y="188">old links open</text><text class="lbl m" x="858" y="206">the replacement</text><text class="lbl g m" x="858" y="222">if one was named</text></g>
<g class="r g4 box" id="n-a"><rect x="405" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="480" y="320">Approval flow</text><text class="lbl m" x="480" y="337">Pending retirement,</text><text class="lbl m" x="480" y="354">owner and managers</text></g>
</g></svg>