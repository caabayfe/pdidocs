<svg viewBox="0 0 960 440" role="img" aria-labelledby="requapprt requapprd"><title id="requapprt">Approve an order</title><desc id="requapprd">When someone in your team orders something</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M346 193 H392" marker-end="url(#ah)"/>
<path class="e r g2" d="M568 193 H614" marker-end="url(#ah)"/>
<path class="ea r g3" d="M480 236 V290" marker-end="url(#ah)"/>
<path class="e r g4" d="M258 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-e"><rect x="170" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="258" y="180">Email</text><text class="lbl m" x="258" y="197">&quot;… needs your</text><text class="lbl m" x="258" y="214">approval&quot;</text></g>
<g class="r g1 box" id="n-t"><rect x="392" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="180">My Tasks</text><text class="lbl m" x="480" y="197">item, for whom,</text><text class="lbl m" x="480" y="214">price, quantity</text></g>
<g class="r g2 box" id="n-a"><rect x="614" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="702" y="180">Approve</text><text class="lbl m" x="702" y="197">next approval,</text><text class="lbl m" x="702" y="214">or fulfilment</text></g>
<g class="r g3 box" id="n-r"><rect x="392" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="320">Reject</text><text class="lbl m" x="480" y="337">reason required</text><text class="lbl r2 m" x="480" y="354">request closed</text></g>
<g class="r g4 box" id="n-m"><rect x="170" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="258" y="320">Or reply by email</text><text class="lbl m" x="258" y="337">approve or reject</text><text class="lbl m" x="258" y="354">in the subject</text></g>
</g></svg>