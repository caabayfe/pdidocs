<svg viewBox="0 0 960 440" role="img" aria-labelledby="ocsetupt ocsetupd"><title id="ocsetupt">Set up an on-call shift</title><desc id="ocsetupd">From an empty group to someone on call</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="eg r g5" d="M858 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-d"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="172">Define Schedule</text><text class="lbl m" x="102" y="188">group, name,</text><text class="lbl m" x="102" y="206">days and times</text><text class="lbl bl m" x="102" y="222">groups you manage</text></g>
<g class="r g1 box" id="n-m"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="180">Members</text><text class="lbl m" x="291" y="197">rosters and</text><text class="lbl m" x="291" y="214">their rotation</text></g>
<g class="r g2 box" id="n-e"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Escalation Setup</text><text class="lbl m" x="480" y="197">catch-all:</text><text class="lbl m" x="480" y="214">who is told last</text></g>
<g class="r g3 box" id="n-r"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="172">Review</text><text class="lbl m" x="669" y="188">saved as</text><text class="lbl m" x="669" y="206">a draft</text><text class="lbl a m" x="669" y="222">nobody on call yet</text></g>
<g class="r g4 box" id="n-p"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="172">Publish</text><text class="lbl m" x="858" y="188">the shift</text><text class="lbl m" x="858" y="206">goes live</text><text class="lbl g m" x="858" y="222">rosters decide</text></g>
<g class="r g5 box" id="n-t"><rect x="783" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="858" y="320">Trigger rule</text><text class="lbl m" x="858" y="337">starts the on-call</text><text class="lbl m" x="858" y="354">subflow</text></g>
</g></svg>