<svg viewBox="0 0 960 440" role="img" aria-labelledby="helpwayst helpwaysd"><title id="helpwayst">Ways to get help</title><desc id="helpwaysd">Four ways in, one ticket to follow</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g5" d="M346 328 H392" marker-end="url(#ah)"/>
<path class="e r g5" d="M568 328 H614" marker-end="url(#ah)"/>
<path class="e r g4" d="M147 181 V233 H258 V285" marker-end="url(#ah)"/>
<path class="e r g4" d="M369 181 V233 H258 V285" marker-end="url(#ah)"/>
<path class="e r g4" d="M591 181 V233 H258 V285" marker-end="url(#ah)"/>
<path class="e r g4" d="M813 181 V233 H258 V285" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-ec"><rect x="59" y="95" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="125">Employee Center</text><text class="lbl m" x="147" y="142">search or a topic</text><text class="lbl g m" x="147" y="159">almost always</text></g>
<g class="r g1 box" id="n-ch"><rect x="281" y="95" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="116">Chat</text><text class="lbl m" x="369" y="134">Now Support,</text><text class="lbl m" x="369" y="150">bottom right</text><text class="lbl bl m" x="369" y="168">quick questions</text></g>
<g class="r g2 box" id="n-em"><rect x="503" y="95" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="116">Email</text><text class="lbl m" x="591" y="134">new email,</text><text class="lbl m" x="591" y="150">or a reply</text><text class="lbl bl m" x="591" y="168">away from the portal</text></g>
<g class="r g3 box" id="n-ph"><rect x="725" y="95" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="116">Phone</text><text class="lbl m" x="813" y="134">+1-200-120-2020</text><text class="lbl m" x="813" y="150">9am-5pm PST</text><text class="lbl a m" x="813" y="168">urgent</text></g>
<g class="r g4 box" id="n-t"><rect x="170" y="285" width="176" height="86" rx="10"/><text class="lbl b m" x="258" y="324">One ticket</text><text class="lbl m" x="258" y="340">INC or REQ number</text></g>
<g class="r g5 box" id="n-m"><rect x="392" y="285" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="324">An email</text><text class="lbl m" x="480" y="340">at each step</text></g>
<g class="r g5 box" id="n-f"><rect x="614" y="285" width="176" height="86" rx="10"/><text class="lbl b m" x="702" y="315">My Requests</text><text class="lbl m" x="702" y="332">follow it, answer</text><text class="lbl m" x="702" y="349">in Activity</text></g>
</g></svg>