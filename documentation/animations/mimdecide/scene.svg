<svg viewBox="0 0 960 440" role="img" aria-labelledby="mimdecidet mimdecided"><title id="mimdecidet">Promote or reject a candidate</title><desc id="mimdecided">The major incident manager&#x27;s decision</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="ea r g4" d="M147 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-c"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="180">Candidate</text><text class="lbl m" x="147" y="197">read the work notes,</text><text class="lbl m" x="147" y="214">look for other reports</text></g>
<g class="r g1 box" id="n-p"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="180">Promote</text><text class="lbl m" x="369" y="197">work notes,</text><text class="lbl m" x="369" y="214">business impact</text></g>
<g class="r g2 box" id="n-m"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="180">Major incident</text><text class="lbl m" x="591" y="197">the same record</text><text class="lbl bl m" x="591" y="214">mode: promote</text></g>
<g class="r g3 box" id="n-a"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="172">Assignee</text><text class="lbl m" x="813" y="188">you, if in its group;</text><text class="lbl m" x="813" y="206">else set it yourself</text><text class="lbl a m" x="813" y="222">no major incident team</text></g>
<g class="r g4 box" id="n-r"><rect x="59" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="312">Reject</text><text class="lbl m" x="147" y="328">give the reason</text><text class="lbl m" x="147" y="346">assignee, proposer emailed</text><text class="lbl r2 m" x="147" y="362">ordinary incident again</text></g>
</g></svg>