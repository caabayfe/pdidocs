<svg viewBox="0 0 960 440" role="img" aria-labelledby="prbraiset prbraised"><title id="prbraiset">Raise a problem</title><desc id="prbraised">From recurring incidents to a problem in Assess</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 243 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 243 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 243 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 243 H787" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-n"><rect x="30" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="238">Problem › Create New</text><text class="lbl a m" x="102" y="256">not from an incident</text></g>
<g class="r g1 box" id="n-f"><rect x="219" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="230">Fill the form</text><text class="lbl m" x="291" y="247">statement, category,</text><text class="lbl m" x="291" y="264">CI, impact, urgency</text></g>
<g class="r g2 box" id="n-a"><rect x="408" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="222">Assign</text><text class="lbl m" x="480" y="238">group and a</text><text class="lbl m" x="480" y="256">problem coordinator</text><text class="lbl a m" x="480" y="272">only coordinators</text></g>
<g class="r g3 box" id="n-s"><rect x="598" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="230">Save</text><text class="lbl m" x="669" y="247">with an assignee</text><text class="lbl g m" x="669" y="264">straight to Assess</text></g>
<g class="r g4 box" id="n-l"><rect x="787" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="238">Link incidents</text><text class="lbl m" x="858" y="256">from each incident</text></g>
</g></svg>