<g class="r g2 box" id="n-s"><rect x="408" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="230">Submit AQI</text><text class="lbl m" x="480" y="247">with comments</text><text class="lbl m" x="480" y="264">for the author</text></g>
<g class="r g3 box" id="n-sc"><rect x="598" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="222">Score</text><text class="lbl m" x="669" y="238">sum of the yes</text><text class="lbl m" x="669" y="256">answers</text><text class="lbl g m" x="669" y="272">70 passes</text></g>
<g class="r g4 box" id="n-e"><rect x="787" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="230">Email</text><text class="lbl m" x="858" y="247">AQI Review for KB…</text><text class="lbl m" x="858" y="264">to the author</text></g>
