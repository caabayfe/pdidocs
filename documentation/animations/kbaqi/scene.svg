<svg viewBox="0 0 960 440" role="img" aria-labelledby="kbaqit kbaqid"><title id="kbaqit">Check article quality</title><desc id="kbaqid">Scoring an article against the AQI checklist</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 243 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 243 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 243 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 243 H787" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-p"><rect x="30" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="222">Perform AQI</text><text class="lbl m" x="102" y="238">classic form,</text><text class="lbl m" x="102" y="256">reviewer roles</text><text class="lbl a m" x="102" y="272">KCS demo only</text></g>
