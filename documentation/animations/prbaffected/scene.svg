<svg viewBox="0 0 960 440" role="img" aria-labelledby="prbaffectedt prbaffectedd"><title id="prbaffectedt">Your incident waits for a fix</title><desc id="prbaffectedd">When a bigger cause is behind your incident</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M346 193 H392" marker-end="url(#ah)"/>
<path class="e r g2" d="M568 193 H614" marker-end="url(#ah)"/>
<path class="ea r g3" d="M480 236 V290" marker-end="url(#ah)"/>
<path class="ea r g4" d="M702 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-i"><rect x="170" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="258" y="188">Your incident</text><text class="lbl m" x="258" y="206">the cause is bigger</text></g>
<g class="r g1 box" id="n-h"><rect x="392" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="172">On Hold</text><text class="lbl m" x="480" y="188">waiting for the</text><text class="lbl m" x="480" y="206">problem team</text><text class="lbl g m" x="480" y="222">nothing to do</text></g>
<g class="r g2 box" id="n-f"><rect x="614" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="702" y="180">Fix is in</text><text class="lbl m" x="702" y="197">resolved by itself,</text><text class="lbl m" x="702" y="214">usual email</text></g>
<g class="r g3 box" id="n-w"><rect x="392" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="320">Need to keep working?</text><text class="lbl m" x="480" y="337">ask on your incident</text><text class="lbl m" x="480" y="354">for a workaround</text></g>
<g class="r g4 box" id="n-o"><rect x="614" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="702" y="328">Still broken?</text><text class="lbl m" x="702" y="346">reopen as usual</text></g>
</g></svg>