<svg viewBox="0 0 960 440" role="img" aria-labelledby="mimfollowt mimfollowd"><title id="mimfollowt">When many people have the same problem</title><desc id="mimfollowd">What you see while the team fixes it</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="ea r g4" d="M813 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-r"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="188">You report it</text><text class="lbl m" x="147" y="206">as usual</text></g>
<g class="r g1 box" id="n-l"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="180">Joined to the</text><text class="lbl m" x="369" y="197">bigger problem</text><text class="lbl g m" x="369" y="214">same number for you</text></g>
<g class="r g2 box" id="n-u"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="180">Updates</text><text class="lbl m" x="591" y="197">in Activity,</text><text class="lbl m" x="591" y="214">and by email</text></g>
<g class="r g3 box" id="n-f"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="180">Fixed for all</text><text class="lbl m" x="813" y="197">yours is resolved</text><text class="lbl m" x="813" y="214">with it</text></g>
<g class="r g4 box" id="n-o"><rect x="725" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="328">Still broken?</text><text class="lbl m" x="813" y="346">reopen as usual</text></g>
</g></svg>