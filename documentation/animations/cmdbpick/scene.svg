<svg viewBox="0 0 960 440" role="img" aria-labelledby="cmdbpickt cmdbpickd"><title id="cmdbpickt">Pick the application</title><desc id="cmdbpickd">So your report reaches the right team</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="ea r g4" d="M591 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-f"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="180">The form asks</text><text class="lbl m" x="147" y="197">which application</text><text class="lbl m" x="147" y="214">or service</text></g>
<g class="r g1 box" id="n-t"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="188">Start typing</text><text class="lbl m" x="369" y="206">its name</text></g>
<g class="r g2 box" id="n-p"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="188">Pick it</text><text class="lbl m" x="591" y="206">from the list</text></g>
<g class="r g3 box" id="n-r"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="188">Right team</text><text class="lbl m" x="813" y="206">gets your report</text></g>
<g class="r g4 box" id="n-n"><rect x="503" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="320">Can&#x27;t find it?</text><text class="lbl m" x="591" y="337">pick the closest,</text><text class="lbl m" x="591" y="354">explain in the description</text></g>
</g></svg>