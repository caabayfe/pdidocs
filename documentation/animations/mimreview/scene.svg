<svg viewBox="0 0 960 440" role="img" aria-labelledby="mimreviewt mimreviewd"><title id="mimreviewt">Resolve and review</title><desc id="mimreviewd">Closing a major incident and learning from it</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="ea r g5" d="M102 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-f"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="188">Fix confirmed</text><text class="lbl r2 m" x="102" y="206">can&#x27;t be reopened</text></g>
<g class="r g1 box" id="n-r"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="180">Resolve</text><text class="lbl m" x="291" y="197">code and notes</text><text class="lbl m" x="291" y="214">for everyone</text></g>
<g class="r g2 box" id="n-c"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="188">Children resolved</text><text class="lbl m" x="480" y="206">same code, notes</text></g>
<g class="r g3 box" id="n-p"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="180">Post incident report</text><text class="lbl m" x="669" y="197">overview, findings,</text><text class="lbl m" x="669" y="214">timeline</text></g>
<g class="r g4 box" id="n-d"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="180">Draft review</text><text class="lbl m" x="858" y="197">in the workspace</text><text class="lbl a m" x="858" y="214">publish within 24 h</text></g>
<g class="r g5 box" id="n-dm"><rect x="27" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="102" y="328">Not major after all?</text><text class="lbl m" x="102" y="346">Demote, give reason</text></g>
</g></svg>