<svg viewBox="0 0 960 440" role="img" aria-labelledby="incasgt incasgd"><title id="incasgt">Incident assignment</title><desc id="incasgd">An incident is saved; the group is filled from the CI, the assignee is checked against the group, and a new incident with an assignee moves to In Progress.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<g class="r g0 box"><rect x="40" y="170" width="170" height="80" rx="10"/><text class="lbl b m" x="125" y="205">Incident saved</text><text class="lbl m" x="125" y="225">group, CI, assignee</text></g>
<path class="e r g1" d="M210 210 H280" marker-end="url(#ah)"/>
<g class="r g1 box"><rect x="280" y="170" width="190" height="80" rx="10"/><text class="lbl b m" x="375" y="200">Group from CI</text><text class="lbl m" x="375" y="220">order 100 · task rule</text><text class="lbl g m" x="375" y="238">only if group is empty</text></g>
<path class="e r g2" d="M470 210 H540" marker-end="url(#ah)"/>
<g class="r g2 box"><rect x="540" y="170" width="190" height="80" rx="10"/><text class="lbl b m" x="635" y="200">Member of group?</text><text class="lbl m" x="635" y="220">order 100</text><text class="lbl r2 m" x="635" y="238">no → save refused</text></g>
<path class="e r g3" d="M730 210 H800" marker-end="url(#ah)"/>
<g class="r g3 box"><rect x="800" y="170" width="130" height="80" rx="10"/><text class="lbl b m" x="865" y="205">In Progress</text><text class="lbl m" x="865" y="225">order 1100</text></g>
</g></svg>
