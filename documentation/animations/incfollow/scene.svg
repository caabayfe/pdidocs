<svg viewBox="0 0 960 440" role="img" aria-labelledby="incfollowt incfollowd"><title id="incfollowt">Follow your incident</title><desc id="incfollowd">Where your incident is, and how to talk to the team</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 243 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 243 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 243 H725" marker-end="url(#ah)"/>
<path class="ea r g4" d="M591 286 V340" marker-end="url(#ah)"/>
<path class="eg r g5" d="M369 200 V146" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-m"><rect x="59" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="238">My Requests</text><text class="lbl m" x="147" y="256">top of the page</text></g>
<g class="r g1 box" id="n-p"><rect x="281" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="230">Your incident</text><text class="lbl m" x="369" y="247">state, urgency,</text><text class="lbl m" x="369" y="264">who works on it</text></g>
<g class="r g2 box" id="n-a"><rect x="503" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="230">Activity tab</text><text class="lbl m" x="591" y="247">type and Send,</text><text class="lbl m" x="591" y="264">or reply by email</text></g>
<g class="r g3 box" id="n-t"><rect x="725" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="230">The team replies</text><text class="lbl m" x="813" y="247">&quot;Comment added&quot;</text><text class="lbl m" x="813" y="264">email</text></g>
<g class="r g4 box" id="n-h"><rect x="503" y="340" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="370">On Hold</text><text class="lbl m" x="591" y="387">they wait for you</text><text class="lbl a m" x="591" y="404">your reply restarts it</text></g>
<g class="r g5 box" id="n-r"><rect x="281" y="60" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="98">Fixed it yourself?</text><text class="lbl m" x="369" y="116">press Resolve</text></g>
</g></svg>