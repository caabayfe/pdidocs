<svg viewBox="0 0 960 440" role="img" aria-labelledby="prbcloset prbclosed"><title id="prbcloset">Other ways a problem ends</title><desc id="prbclosed">Accept the risk, cancel, or reopen</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g4" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="e r g3" d="M147 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-a"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="180">Assess or RCA</text><text class="lbl m" x="147" y="197">not worth fixing,</text><text class="lbl m" x="147" y="214">or not a problem</text></g>
<g class="r g1 box" id="n-r"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="180">Accept Risk</text><text class="lbl m" x="369" y="197">cause, reason,</text><text class="lbl m" x="369" y="214">workaround</text></g>
<g class="r g2 box" id="n-c"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="180">Closed</text><text class="lbl m" x="591" y="197">can&#x27;t be edited</text><text class="lbl r2 m" x="591" y="214">incidents NOT resolved</text></g>
<g class="r g4 box" id="n-re"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="180">Re-Analyze</text><text class="lbl m" x="813" y="197">back to RCA</text><text class="lbl a m" x="813" y="214">problem manager only</text></g>
<g class="r g3 box" id="n-d"><rect x="59" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="320">Duplicate or Cancel</text><text class="lbl m" x="147" y="337">original problem,</text><text class="lbl m" x="147" y="354">or a reason</text></g>
</g></svg>