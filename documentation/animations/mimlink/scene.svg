<svg viewBox="0 0 960 440" role="img" aria-labelledby="mimlinkt mimlinkd"><title id="mimlinkt">Link the other reports</title><desc id="mimlinkd">One major incident, many reports following it</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 243 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 243 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 243 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 243 H787" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-s"><rect x="30" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="238">Select reports</text><text class="lbl m" x="102" y="256">e.g. Incident › Open</text></g>
<g class="r g1 box" id="n-l"><rect x="219" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="230">Link to Major</text><text class="lbl m" x="291" y="247">list action,</text><text class="lbl m" x="291" y="264">choose, OK</text></g>
<g class="r g2 box" id="n-f"><rect x="408" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="238">Follows its state</text><text class="lbl m" x="480" y="256">from now on</text></g>
<g class="r g3 box" id="n-c"><rect x="598" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="230">Comments copied</text><text class="lbl m" x="669" y="247">caller is emailed</text><text class="lbl g m" x="669" y="264">write once, on the parent</text></g>
<g class="r g4 box" id="n-r"><rect x="787" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="238">Resolved with it</text><text class="lbl m" x="858" y="256">same code, notes</text></g>
</g></svg>