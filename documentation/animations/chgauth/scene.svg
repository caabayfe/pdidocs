<g class="r g2 box" id="n-z"><rect x="503" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="230">Authorize</text><text class="lbl m" x="591" y="247">manager or CAB</text><text class="lbl bl m" x="591" y="264">by risk</text></g>
<g class="r g3 box" id="n-s"><rect x="725" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="238">Scheduled</text><text class="lbl m" x="813" y="256">approved</text></g>
