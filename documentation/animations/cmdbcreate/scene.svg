<g class="r g6 box" id="n-n"><rect x="27" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="102" y="320">New</text><text class="lbl m" x="102" y="337">classes without rules:</text><text class="lbl m" x="102" y="354">plain form, no check</text></g>
