<svg viewBox="0 0 960 440" role="img" aria-labelledby="cmdbcreatet cmdbcreated"><title id="cmdbcreatet">Create a configuration item</title><desc id="cmdbcreated">Creating a CI without making a duplicate</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="ea r g5" d="M858 236 V290" marker-end="url(#ah)"/>
<path class="ea r g6" d="M102 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-l"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="172">CI list</text><text class="lbl m" x="102" y="188">CMDB Workspace,</text><text class="lbl m" x="102" y="206">Create CI</text><text class="lbl a m" x="102" y="222">sn_cmdb_editor</text></g>
<g class="r g1 box" id="n-c"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="180">Class</text><text class="lbl m" x="291" y="197">only classes with</text><text class="lbl m" x="291" y="214">identification rules</text></g>
<g class="r g2 box" id="n-i"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Identifiers</text><text class="lbl m" x="480" y="197">what tells this CI</text><text class="lbl m" x="480" y="214">apart, plus owner</text></g>
<g class="r g3 box" id="n-r"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="180">Relationships</text><text class="lbl m" x="669" y="197">CIs, people,</text><text class="lbl m" x="669" y="214">groups</text></g>
<g class="r g4 box" id="n-k"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="172">Create</text><text class="lbl m" x="858" y="188">checked against</text><text class="lbl m" x="858" y="206">the CMDB</text><text class="lbl g m" x="858" y="222">new CI</text></g>
