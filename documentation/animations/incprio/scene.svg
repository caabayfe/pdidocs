<svg viewBox="0 0 960 440" role="img" aria-labelledby="incpriot incpriod"><title id="incpriot">Setting the priority</title><desc id="incpriod">A three by three grid of impact and urgency gives the priority, from 1 Critical to 4 Low.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B65C02"/></marker><marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F845A"/></marker></defs><g id="cam">
<text class="lbl b m r g0" x="500" y="40" style="font-size:14px">Urgency: how soon does it hurt?</text>
<g class="r g0"><text class="lbl b m" x="70" y="250" style="font-size:14px" transform="rotate(-90 70 250)">Impact: how many are affected?</text></g>
<text class="lbl b m r g0" x="320" y="80">1 - High</text>
<text class="lbl b m r g0" x="500" y="80">2 - Medium</text>
<text class="lbl b m r g0" x="680" y="80">3 - Low</text>
<text class="lbl b e2 r g0" x="215" y="135">1 - High</text>
<text class="lbl b e2 r g0" x="215" y="230">2 - Medium</text>
<text class="lbl b e2 r g0" x="215" y="325">3 - Low</text>
<g class="r g0 cell c11"><rect x="230" y="95" width="170" height="85" rx="8"/><text class="lbl b m" x="315" y="143" style="font-size:15px">1 Critical</text></g>
<g class="r g0 cell c12"><rect x="410" y="95" width="170" height="85" rx="8"/><text class="lbl b m" x="495" y="143" style="font-size:15px">2 High</text></g>
<g class="r g0 cell c13"><rect x="590" y="95" width="170" height="85" rx="8"/><text class="lbl b m" x="675" y="143" style="font-size:15px">3 Moderate</text></g>
<g class="r g0 cell c21"><rect x="230" y="190" width="170" height="85" rx="8"/><text class="lbl b m" x="315" y="238" style="font-size:15px">2 High</text></g>
<g class="r g0 cell c22"><rect x="410" y="190" width="170" height="85" rx="8"/><text class="lbl b m" x="495" y="238" style="font-size:15px">3 Moderate</text></g>
<g class="r g0 cell c23"><rect x="590" y="190" width="170" height="85" rx="8"/><text class="lbl b m" x="675" y="238" style="font-size:15px">4 Low</text></g>
<g class="r g0 cell c31"><rect x="230" y="285" width="170" height="85" rx="8"/><text class="lbl b m" x="315" y="333" style="font-size:15px">3 Moderate</text></g>
<g class="r g0 cell c32"><rect x="410" y="285" width="170" height="85" rx="8"/><text class="lbl b m" x="495" y="333" style="font-size:15px">4 Low</text></g>
<g class="r g0 cell c33"><rect x="590" y="285" width="170" height="85" rx="8"/><text class="lbl b m" x="675" y="333" style="font-size:15px">4 Low</text></g>
</g></svg>