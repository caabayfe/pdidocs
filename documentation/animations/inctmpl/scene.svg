<svg viewBox="0 0 960 440" role="img" aria-labelledby="inctmplt inctmpld"><title id="inctmplt">Fill in and reply with templates</title><desc id="inctmpld">Three kinds of template on an incident</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="eg r g5" d="M291 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-i"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="180">Incident</text><text class="lbl m" x="102" y="197">side panel</text><text class="lbl m" x="102" y="214">and ⋯ menu</text></g>
<g class="r g1 box" id="n-t"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="172">Templates</text><text class="lbl m" x="291" y="188">fill in fields,</text><text class="lbl m" x="291" y="206">preview, Apply</text><text class="lbl a m" x="291" y="222">own templates only</text></g>
<g class="r g2 box" id="n-r"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="172">Response Templates</text><text class="lbl m" x="480" y="188">pick a message,</text><text class="lbl m" x="480" y="206">Copy to clipboard</text><text class="lbl r2 m" x="480" y="222">admins only on pdi2</text></g>
<g class="r g3 box" id="n-n"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="180">Work notes</text><text class="lbl m" x="669" y="197">or comments:</text><text class="lbl m" x="669" y="214">paste, or quick action r</text></g>
<g class="r g4 box" id="n-e"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="172">Compose Email</text><text class="lbl m" x="858" y="188">⋯ menu; r inserts</text><text class="lbl m" x="858" y="206">a response template</text><text class="lbl bl m" x="858" y="222">no incident email template</text></g>
<g class="r g5 box" id="n-u"><rect x="216" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="291" y="320">Undo template</text><text class="lbl m" x="291" y="337">puts the last</text><text class="lbl m" x="291" y="354">values back</text></g>
