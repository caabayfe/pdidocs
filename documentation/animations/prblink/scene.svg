<svg viewBox="0 0 960 440" role="img" aria-labelledby="prblinkt prblinkd"><title id="prblinkt">Link incidents to a problem</title><desc id="prblinkd">Linked, or on hold for the fix</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 243 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 243 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 243 H725" marker-end="url(#ah)"/>
<path class="eg r g4" d="M147 286 V340" marker-end="url(#ah)"/>
<path class="ea r g2" d="M369 200 V146" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-i"><rect x="59" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="238">Incident</text><text class="lbl m" x="147" y="256">Related Records</text></g>
<g class="r g1 box" id="n-p"><rect x="281" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="230">Set Problem</text><text class="lbl m" x="369" y="247">classic or workspace</text><text class="lbl a m" x="369" y="264">not from the problem</text></g>
<g class="r g2 box" id="n-h"><rect x="503" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="238">On Hold</text><text class="lbl m" x="591" y="256">Awaiting Problem</text></g>
<g class="r g3 box" id="n-r"><rect x="725" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="222">Problem fixed</text><text class="lbl m" x="813" y="238">incident resolved</text><text class="lbl m" x="813" y="256">for you</text><text class="lbl g m" x="813" y="272">only if on hold</text></g>
<g class="r g4 box" id="n-k"><rect x="59" y="340" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="370">Known error article</text><text class="lbl m" x="147" y="387">attach it to the</text><text class="lbl m" x="147" y="404">incident: it links</text></g>
<g class="r g2 box" id="n-s"><rect x="281" y="60" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="98">Only linked</text><text class="lbl m" x="369" y="116">stays with its team</text></g>
</g></svg>