<svg viewBox="0 0 960 440" role="img" aria-labelledby="incesct incescd"><title id="incesct">Escalate an incident</title><desc id="incescd">Three ways to take an incident further</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 243 H281" marker-end="url(#ah)"/>
<path class="e r g1" d="M457 243 H503" marker-end="url(#ah)"/>
<path class="e r g1" d="M679 243 H725" marker-end="url(#ah)"/>
<path class="e r g2" d="M147 286 V340" marker-end="url(#ah)"/>
<path class="ea r g3" d="M147 200 V146" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-i"><rect x="59" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="238">Incident</text><text class="lbl m" x="147" y="256">in your hands</text></g>
<g class="r g1 box" id="n-pr"><rect x="281" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="230">Propose major</text><text class="lbl m" x="369" y="247">classic form menu</text><text class="lbl a m" x="369" y="264">not in the workspace</text></g>
<g class="r g1 box" id="n-d"><rect x="503" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="238">Manager decides</text><text class="lbl m" x="591" y="256">promote or reject</text></g>
<g class="r g1 box" id="n-l"><rect x="725" y="200" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="230">Link other reports</text><text class="lbl m" x="813" y="247">resolved with it</text><text class="lbl g m" x="813" y="264">link, don&#x27;t duplicate</text></g>
<g class="r g2 box" id="n-w"><rect x="59" y="340" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="370">Related work</text><text class="lbl m" x="147" y="387">task, child, outage,</text><text class="lbl m" x="147" y="404">request, copy</text></g>
<g class="r g3 box" id="n-pc"><rect x="59" y="60" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="82">Problem or change</text><text class="lbl m" x="147" y="98">create it on its own,</text><text class="lbl m" x="147" y="116">set it in Related Records</text><text class="lbl r2 m" x="147" y="132">no create button</text></g>
</g></svg>