<svg viewBox="0 0 960 440" role="img" aria-labelledby="chgcloset chgclosed"><title id="chgcloset">Review, close or cancel</title><desc id="chgclosed">How a change ends</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M346 193 H392" marker-end="url(#ah)"/>
<path class="e r g2" d="M568 193 H614" marker-end="url(#ah)"/>
<path class="ea r g3" d="M258 236 V290" marker-end="url(#ah)"/>
<path class="ea r g4" d="M480 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-w"><rect x="170" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="258" y="188">Work done</text><text class="lbl a m" x="258" y="206">open tasks block close</text></g>
<g class="r g1 box" id="n-r"><rect x="392" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="188">Review</text><text class="lbl m" x="480" y="206">check the result</text></g>
<g class="r g2 box" id="n-c"><rect x="614" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="702" y="180">Close</text><text class="lbl m" x="702" y="197">close code, notes</text><text class="lbl g m" x="702" y="214">Successful … Unsuccessful</text></g>
<g class="r g3 box" id="n-x"><rect x="170" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="258" y="320">Cancel Change</text><text class="lbl m" x="258" y="337">give the reason</text><text class="lbl r2 m" x="258" y="354">tasks canceled too</text></g>
<g class="r g4 box" id="n-v"><rect x="392" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="320">Revert to New</text><text class="lbl m" x="480" y="337">fix the plan, or</text><text class="lbl m" x="480" y="354">Copy Change</text></g>
</g></svg>