<g class="r g2 box" id="n-o"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Order Now</text><text class="lbl m" x="480" y="197">one item per order</text><text class="lbl bl m" x="480" y="214">no cart</text></g>
<g class="r g3 box" id="n-c"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="180">Confirm</text><text class="lbl m" x="669" y="197">delivery details,</text><text class="lbl m" x="669" y="214">instructions</text></g>
