<svg viewBox="0 0 960 440" role="img" aria-labelledby="kbadmint kbadmind"><title id="kbadmint">Set up a knowledge base</title><desc id="kbadmind">From a request to a knowledge base people can read and write</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 243 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 243 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 243 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 243 H787" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-r"><rect x="30" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="222">Request</text><text class="lbl m" x="102" y="238">Request Knowledge</text><text class="lbl m" x="102" y="256">Base, in the catalog</text><text class="lbl bl m" x="102" y="272">anyone</text></g>
<g class="r g1 box" id="n-a"><rect x="219" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="230">Approval</text><text class="lbl m" x="291" y="247">one fixed</text><text class="lbl m" x="291" y="264">account</text></g>
<g class="r g2 box" id="n-k"><rect x="408" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="222">Knowledge base</text><text class="lbl m" x="480" y="238">requester</text><text class="lbl m" x="480" y="256">is the owner</text><text class="lbl g m" x="480" y="272">knowledge_manager</text></g>
<g class="r g3 box" id="n-f"><rect x="598" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="222">Flows</text><text class="lbl m" x="669" y="238">publish and</text><text class="lbl m" x="669" y="256">retire</text><text class="lbl a m" x="669" y="272">empty: instant</text></g>
<g class="r g4 box" id="n-u"><rect x="787" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="222">User criteria</text><text class="lbl m" x="858" y="238">who reads,</text><text class="lbl m" x="858" y="256">who contributes</text><text class="lbl r2 m" x="858" y="272">none: no access</text></g>
</g></svg>