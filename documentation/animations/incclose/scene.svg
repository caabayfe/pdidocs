<svg viewBox="0 0 960 440" role="img" aria-labelledby="inccloset incclosed"><title id="inccloset">Close or reopen an incident</title><desc id="incclosed">What happens after Resolved</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="ea r g4" d="M147 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-r"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="180">Resolved</text><text class="lbl m" x="147" y="197">waiting for</text><text class="lbl m" x="147" y="214">the caller</text></g>
<g class="r g1 box" id="n-w"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="180">Who closes</text><text class="lbl m" x="369" y="197">caller, team lead,</text><text class="lbl m" x="369" y="214">or 7 days pass</text></g>
<g class="r g2 box" id="n-c"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="172">Closed</text><text class="lbl m" x="591" y="188">caller is emailed,</text><text class="lbl m" x="591" y="206">maybe a survey</text><text class="lbl r2 m" x="591" y="222">can&#x27;t be reopened</text></g>
<g class="r g3 box" id="n-n"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="180">Comes back?</text><text class="lbl m" x="813" y="197">log a new incident,</text><text class="lbl m" x="813" y="214">name the old one</text></g>
<g class="r g4 box" id="n-o"><rect x="59" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="312">Reopen</text><text class="lbl m" x="147" y="328">say what&#x27;s wrong</text><text class="lbl m" x="147" y="346">(required)</text><text class="lbl a m" x="147" y="362">back to In Progress</text></g>
</g></svg>