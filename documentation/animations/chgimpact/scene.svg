<svg viewBox="0 0 960 440" role="img" aria-labelledby="chgimpactt chgimpactd"><title id="chgimpactt">See what a change affects</title><desc id="chgimpactd">From the change&#x27;s CI to the services it hits</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g5" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="eg r g1" d="M291 236 V290" marker-end="url(#ah)"/>
<path class="ea r g4" d="M669 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-f"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="180">Configuration item</text><text class="lbl m" x="102" y="197">set on the</text><text class="lbl m" x="102" y="214">change</text></g>
<g class="r g1 box" id="n-b"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="172">Tree icon</text><text class="lbl m" x="291" y="188">CI dependency</text><text class="lbl m" x="291" y="206">view</text><text class="lbl g m" x="291" y="222">no role needed</text></g>
<g class="r g2 box" id="n-a"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="172">Affected CIs</text><text class="lbl m" x="480" y="188">the CI is added;</text><text class="lbl m" x="480" y="206">Add the others</text><text class="lbl a m" x="480" y="222">in New only</text></g>
<g class="r g3 box" id="n-s"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="172">Impacted Services</text><text class="lbl m" x="669" y="188">rebuilt from every</text><text class="lbl m" x="669" y="206">affected CI</text><text class="lbl bl m" x="669" y="222">when it leaves New</text></g>
<g class="r g5 box" id="n-d"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="180">Approvers and CAB</text><text class="lbl m" x="858" y="197">read the lists</text><text class="lbl m" x="858" y="214">before deciding</text></g>
<g class="r g1 box" id="n-m"><rect x="216" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="291" y="320">Map tab</text><text class="lbl m" x="291" y="337">the CI and five</text><text class="lbl m" x="291" y="354">levels around it</text></g>
<g class="r g4 box" id="n-o"><rect x="594" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="669" y="320">Outages</text><text class="lbl m" x="669" y="337">Create outage</text><text class="lbl m" x="669" y="354">on the list</text></g>
</g></svg>