<svg viewBox="0 0 960 440" role="img" aria-labelledby="reqbehalft reqbehalfd"><title id="reqbehalft">Request for a caller</title><desc id="reqbehalfd">When the caller needs something new</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M346 193 H392" marker-end="url(#ah)"/>
<path class="e r g2" d="M568 193 H614" marker-end="url(#ah)"/>
<path class="ea r g3" d="M702 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-i"><rect x="170" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="258" y="188">Incident or call</text><text class="lbl m" x="258" y="206">needs something new</text></g>
<g class="r g1 box" id="n-c"><rect x="392" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="480" y="188">Create request</text><text class="lbl m" x="480" y="206">in the workspace</text></g>
<g class="r g2 box" id="n-r"><rect x="614" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="702" y="180">Request</text><text class="lbl m" x="702" y="197">links back to</text><text class="lbl m" x="702" y="214">where it came from</text></g>
<g class="r g3 box" id="n-f"><rect x="614" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="702" y="312">Who is it for?</text><text class="lbl m" x="702" y="328">checkout can&#x27;t change</text><text class="lbl m" x="702" y="346">Requested for</text><text class="lbl a m" x="702" y="362">check on screen</text></g>
</g></svg>