<svg viewBox="0 0 960 440" role="img" aria-labelledby="kbfeedbackt kbfeedbackd"><title id="kbfeedbackt">From a flag to a fixed article</title><desc id="kbfeedbackd">What happens to what readers say about an article</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g2" d="M173 243 H219" marker-end="url(#ah)"/>
<path class="e r g3" d="M362 243 H408" marker-end="url(#ah)"/>
<path class="e r g4" d="M552 243 H598" marker-end="url(#ah)"/>
<path class="e r g5" d="M741 243 H787" marker-end="url(#ah)"/>
<path class="ea r g1" d="M102 286 V340" marker-end="url(#ah)"/>
<path class="eg r g6" d="M858 200 V146" marker-end="url(#ah)"/>
<path class="ea r g7" d="M858 286 V340" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-a"><rect x="30" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="230">Article</text><text class="lbl m" x="102" y="247">search or browse</text><text class="lbl m" x="102" y="264">in Employee Center</text></g>
<g class="r g2 box" id="n-f"><rect x="219" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="222">Flag Article</text><text class="lbl m" x="291" y="238">Actions menu,</text><text class="lbl m" x="291" y="256">comment mandatory</text><text class="lbl bl m" x="291" y="272">only a flag</text></g>
<g class="r g3 box" id="n-t"><rect x="408" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="222">Feedback task</text><text class="lbl m" x="480" y="238">to the author,</text><text class="lbl m" x="480" y="256">or the reviser</text><text class="lbl a m" x="480" y="272">emailed</text></g>
<g class="r g4 box" id="n-x"><rect x="598" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="230">Fix it</text><text class="lbl m" x="669" y="247">Edit Article or</text><text class="lbl m" x="669" y="264">Create Article</text></g>
<g class="r g5 box" id="n-r"><rect x="787" y="200" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="222">Resolved</text><text class="lbl m" x="858" y="238">resolution code</text><text class="lbl m" x="858" y="256">and notes</text><text class="lbl a m" x="858" y="272">reader emailed</text></g>
<g class="r g1 box" id="n-v"><rect x="27" y="340" width="150" height="86" rx="10"/><text class="lbl b m" x="102" y="362">Helpful, stars</text><text class="lbl m" x="102" y="378">and comments:</text><text class="lbl m" x="102" y="396">only counted</text><text class="lbl a m" x="102" y="412">no task on pdi2</text></g>
<g class="r g6 box" id="n-ok"><rect x="783" y="60" width="150" height="86" rx="10"/><text class="lbl b m" x="858" y="82">Accept</text><text class="lbl m" x="858" y="98">the reader</text><text class="lbl m" x="858" y="116">closes it</text><text class="lbl g m" x="858" y="132">Closed</text></g>
<g class="r g7 box" id="n-no"><rect x="783" y="340" width="150" height="86" rx="10"/><text class="lbl b m" x="858" y="370">Reject</text><text class="lbl m" x="858" y="387">back to</text><text class="lbl m" x="858" y="404">Work in progress</text></g>
</g></svg>