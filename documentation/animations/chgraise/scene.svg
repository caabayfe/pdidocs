<svg viewBox="0 0 960 440" role="img" aria-labelledby="chgraiset chgraised"><title id="chgraiset">Raise a change</title><desc id="chgraised">From the kind of change to a calculated risk</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M173 193 H219" marker-end="url(#ah)"/>
<path class="e r g2" d="M362 193 H408" marker-end="url(#ah)"/>
<path class="e r g3" d="M552 193 H598" marker-end="url(#ah)"/>
<path class="e r g4" d="M741 193 H787" marker-end="url(#ah)"/>
<path class="eg r g0" d="M102 236 V290" marker-end="url(#ah)"/>
<path class="ea r g4" d="M858 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-k"><rect x="30" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="102" y="180">Choose the kind</text><text class="lbl m" x="102" y="197">normal, emergency,</text><text class="lbl m" x="102" y="214">standard, template</text></g>
<g class="r g1 box" id="n-t"><rect x="219" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="291" y="172">Describe it</text><text class="lbl m" x="291" y="188">CI or service,</text><text class="lbl m" x="291" y="206">assignment group</text><text class="lbl a m" x="291" y="222">group needed past New</text></g>
<g class="r g2 box" id="n-p"><rect x="408" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="480" y="180">Planning</text><text class="lbl m" x="480" y="197">justification,</text><text class="lbl m" x="480" y="214">implement, backout, test</text></g>
<g class="r g3 box" id="n-s"><rect x="598" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="669" y="188">Schedule</text><text class="lbl m" x="669" y="206">planned start, end</text></g>
<g class="r g4 box" id="n-r"><rect x="787" y="150" width="143" height="86" rx="10"/><text class="lbl b m" x="858" y="180">Calculate Risk</text><text class="lbl m" x="858" y="197">only when pressed</text><text class="lbl bl m" x="858" y="214">decides who approves</text></g>
<g class="r g0 box" id="n-std"><rect x="27" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="102" y="320">Routine work?</text><text class="lbl m" x="102" y="337">look for a</text><text class="lbl m" x="102" y="354">standard change first</text></g>
<g class="r g4 box" id="n-h"><rect x="783" y="290" width="150" height="86" rx="10"/><text class="lbl b m" x="858" y="328">Start in &lt; 3 days</text><text class="lbl m" x="858" y="346">risk becomes High</text></g>
</g></svg>