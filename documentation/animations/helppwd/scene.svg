<svg viewBox="0 0 960 440" role="img" aria-labelledby="helppwdt helppwdd"><title id="helppwdt">Reset your password</title><desc id="helppwdd">Resetting a forgotten password yourself</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8590A2"/></marker></defs>
<g id="cam">
<path class="e r g1" d="M235 193 H281" marker-end="url(#ah)"/>
<path class="e r g2" d="M457 193 H503" marker-end="url(#ah)"/>
<path class="e r g3" d="M679 193 H725" marker-end="url(#ah)"/>
<path class="ea r g4" d="M591 236 V290" marker-end="url(#ah)"/>
<g class="r g0 box" id="n-e"><rect x="59" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="147" y="172">Enrol</text><text class="lbl m" x="147" y="188">register your</text><text class="lbl m" x="147" y="206">mobile phone</text><text class="lbl a m" x="147" y="222">do it first</text></g>
<g class="r g1 box" id="n-i"><rect x="281" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="369" y="180">Identify</text><text class="lbl m" x="369" y="197">user name</text><text class="lbl m" x="369" y="214">and captcha</text></g>
<g class="r g2 box" id="n-v"><rect x="503" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="172">Verify</text><text class="lbl m" x="591" y="188">email address</text><text class="lbl m" x="591" y="206">and SMS code</text><text class="lbl bl m" x="591" y="222">both required</text></g>
<g class="r g3 box" id="n-r"><rect x="725" y="150" width="176" height="86" rx="10"/><text class="lbl b m" x="813" y="180">Reset</text><text class="lbl m" x="813" y="197">emailed link,</text><text class="lbl m" x="813" y="214">valid 1 hour</text></g>
<g class="r g4 box" id="n-c"><rect x="503" y="290" width="176" height="86" rx="10"/><text class="lbl b m" x="591" y="320">Call the desk</text><text class="lbl m" x="591" y="337">3 failures:</text><text class="lbl m" x="591" y="354">blocked 24 hours</text></g>
</g></svg>