title: Major incident management
icon: flame
summary: >-
  When one failure hits many people or a critical service, it is run as a major incident: one
  team leads the response, the other reports are linked to it, people are kept informed, and the
  response is reviewed afterwards.
order: 2
roles:
  - id: affected
    name: Affected employee
    audience: user
    description: anyone whose work is stopped by the outage, whether they reported it or not
  - id: agent
    name: Service desk agent or resolver
    audience: operator
    description: spots that an incident is bigger than one person and proposes it; links the other reports
  - id: manager
    name: Major incident manager
    audience: operator
    description: decides whether a candidate is a major incident, leads the response and owns the review
  - id: communicator
    name: Communication manager
    audience: operator
    description: keeps stakeholders and users informed while the major incident lasts
lifecycle:
  - state: Candidate
    meaning: proposed as a major incident; a major incident manager decides
  - state: Major incident
    meaning: accepted; the response is under way
  - state: Rejected
    meaning: the candidate was an ordinary incident after all
  - state: Demoted
    meaning: was a major incident, no longer treated as one
understand: [overview, lifecycle, who-is-told]
tables: [incident, incident_alert, incident_alert_task, major_incident_trigger_rule]
capabilities:
  - id: follow
    title: Follow an outage
    summary: What you see when your incident is part of a major incident, and where to look for news.
    roles: [affected]
    counterpart: link
    configure: link
  - id: propose
    title: Propose a major incident
    summary: Flag an incident as a major incident candidate, with why and what is affected.
    roles: [agent]
  - id: decide
    title: Promote or reject a candidate
    summary: Decide whether a candidate becomes a major incident.
    roles: [manager]
  - id: link
    title: Link the other reports
    summary: Attach every incident about the same failure to the major incident.
    roles: [agent, manager]
    counterpart: follow
  - id: run
    title: Run the response
    summary: Lead the response from the workbench, with the team, the affected services and the conference.
    roles: [manager]
  - id: communicate
    title: Communicate
    summary: Send business and technical updates through communication plans and tasks.
    roles: [communicator, manager]
  - id: review
    title: Resolve, demote and review
    summary: Resolve the major incident with its children, or demote it, and publish the post-incident review.
    roles: [manager]
