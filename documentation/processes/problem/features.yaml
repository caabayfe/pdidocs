# The features of problem management (ADR-0040): every application `snagentic docs census
# problem` finds, each with a decision. Problems are worked on the classic form on pdi2: the
# Service Operations Workspace has no problem lists and the workspace problem plugin
# (com.snc.uib.sow_problem) is not installed, so the workspace features below are questions.
# Out-of-scope and question decisions were proposed by the documentation agent on 2026-10-19 and
# wait for the process owner's confirmation.
features:
  - id: core
    title: Problem handling (raise, link, assess, root cause, workaround, fix, close)
    found: [global]
    status: documented
    capabilities: [affected, raise, link, investigate, workaround, fix, close]
  - id: assign-to-me
    title: Assign to me from the problem and problem task lists
    found: [global:Assign to me]
    status: documented
    capabilities: [investigate]
  - id: workspace
    title: Problems in the Service Operations Workspace (New, Assign to me)
    found:
      - sn_itsm_workspace:New
      - sn_itsm_workspace:Assign to me
      - sn_sow_itsm_common:Assign to me
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › problem (New), opened by its address › header Save; More actions › Create Outage, Delete; Related records › Affected CIs, Problem Tasks, Change Requests, Outages, Attached Knowledge
    status: question
    question: Q01
  - id: agent-assist
    title: Agent Assist on problems and problem tasks
    found: [sn_itsm_workspace:Agent Assist]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › problem › side panel › Recommendations (Recommended actions, Search), Agent Assist
    status: question
    question: Q03
  - id: dependency-views
    title: Dependency views of the problem's CI, service and offering
    found:
      - sn_sow_itsm_common:CI dependency view
      - sn_sow_itsm_common:Service dependency view
      - sn_sow_itsm_common:Service offering dependency view
    status: question
    question: Q04
  - id: collaborate-chat
    title: Collaborate (chat from the workspace)
    found: [sn_oe_sfs]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › problem › side panel › Collaborate
    status: question
    question: Q05
  - id: sms
    title: Send an SMS about the problem (Notify)
    found: [sn_sow_itsm_common:Send Sms]
    status: question
    question: Q06
  - id: playbook
    title: Playbooks on problems and problem tasks
    found: [global:Playbook]
    status: out-of-scope
    note: The workspace Playbook panel is assigned to problem and problem task, but pdi2 has no playbook (process definition) for either.
  - id: response-templates
    title: Response templates (Responses)
    found: [sn_templated_snip]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › problem › side panel › Response Templates, Templates
    status: question
    question: Q07
  - id: interactions
    title: Associate a problem with an interaction
    found: [sn_sow_interaction]
    status: question
    question: Q08
  - id: sla-breakdowns
    title: SLAs and SLA breakdowns on problems
    found: [sn_sla_brkdwn]
    status: question
    question: Q09
  - id: communication-plans
    title: Communication plans
    found: [sn_comm_management]
    status: out-of-scope
    note: Only a table reference (comm_plan); no communication action reaches problem on pdi2.
  - id: cab-meetings
    title: CAB meetings
    found: [sn_change_cab]
    status: out-of-scope
    note: CAB meeting agendas belong to change management.
  - id: alert-simulation
    title: Alert simulation sessions
    found: [sn_em_tbac]
    status: out-of-scope
    note: Only a table reference; asked under incident.
  - id: automation-errors
    title: Automation error tasks
    found: [sn_svc_err]
    status: out-of-scope
    note: Only a table reference (automation_error_code_task); asked under incident.
