title: Problem management
icon: layers
summary: >-
  When incidents keep coming back, or one has a cause worth removing, a problem record finds the
  root cause, shares a workaround while it lasts, and gets the cause fixed so the incidents stop.
it_summary: >-
  Find and remove the cause behind recurring incidents: assess, analyse, share the workaround, fix it through a change, and resolve the incidents waiting for it.
order: 3
roles:
  - id: affected
    name: Affected employee
    audience: user
    description: anyone whose incident is waiting on a problem fix
  - id: agent
    name: Service desk agent or resolver
    audience: operator
    description: raises problems from recurring incidents and links incidents to them
  - id: coordinator
    name: Problem coordinator
    audience: operator
    description: owns a problem through its lifecycle; only coordinators can be assigned a problem
  - id: analyst
    name: Problem task analyst
    audience: operator
    description: works the problem tasks, such as a root cause analysis
  - id: manager
    name: Problem manager
    audience: operator
    description: runs the process and can reopen closed problems
lifecycle:
  - state: New
    meaning: raised; nobody has looked at it yet
  - state: Assess
    meaning: a coordinator is checking it is a real problem
  - state: Root Cause Analysis
    meaning: confirmed; the cause is being found
  - state: Fix in Progress
    meaning: the cause is known and a fix is under way
  - state: Resolved
    meaning: the fix is in; waiting to confirm it worked
  - state: Closed
    meaning: completed, canceled, a duplicate, or the risk accepted
understand: [overview, lifecycle, who-is-told]
tables: [problem, problem_task]
capabilities:
  - id: affected
    title: When a problem is behind your incident
    summary: What happens to your incident while a problem is worked, and when it is fixed.
    roles: [affected]
    counterpart: link
    configure: link
  - id: raise
    title: Raise a problem
    summary: Record a problem when incidents keep coming back or one has a cause worth removing.
    roles: [agent, coordinator]
  - id: link
    title: Link incidents to a problem
    summary: Connect each incident to its problem, and put it on hold while it waits for the fix.
    roles: [agent, coordinator]
    counterpart: affected
  - id: investigate
    title: Assess and find the root cause
    summary: Assess the problem, confirm it, and run root cause analysis with problem tasks.
    roles: [coordinator, analyst]
  - id: workaround
    title: Share a workaround and known error
    summary: Tell the support teams how to get people working meanwhile, and publish a known error article.
    roles: [coordinator]
  - id: fix
    title: Fix and resolve
    summary: Plan the fix, raise the change, resolve the problem and complete it.
    roles: [coordinator]
  - id: close
    title: Accept the risk, cancel or reopen
    summary: Close a problem without a fix, mark it a duplicate, or analyse it again.
    roles: [coordinator, manager]
