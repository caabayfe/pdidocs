title: Request management
icon: cart
summary: >-
  When you need something new (a laptop, software, access, a service), you request it from the
  catalog in Employee Center; it is approved if needed, fulfilled by the right teams and delivered.
it_summary: >-
  Fulfil what employees order: approvals by the manager and by price, catalog tasks for Procurement and Field Services, and the request closed when every item is delivered.
order: 5
roles:
  - id: requester
    name: Requester
    audience: user
    description: any employee ordering something for their work
  - id: approver
    name: Approving manager
    audience: user
    description: the requester's manager or department head, asked to approve some items
  - id: fulfiller
    name: Fulfiller
    audience: operator
    description: a member of a fulfilment team (Procurement, Field Services) working catalog tasks
  - id: agent
    name: Service desk agent
    audience: operator
    description: orders on someone's behalf and keeps requests moving
lifecycle:
  - state: Pending Approval
    meaning: waiting for an approval
  - state: Approved
    meaning: approved; being fulfilled
  - state: Closed Complete
    meaning: delivered
  - state: Closed Incomplete
    meaning: closed without being completed
  - state: Closed Cancelled
    meaning: canceled
  - state: Closed Rejected
    meaning: an approver said no
understand: [overview, lifecycle, approvals, who-is-told]
tables: [sc_request, sc_req_item, sc_task]
capabilities:
  - id: find
    title: Find what you need
    summary: Browse the catalog by category, search it, or start from a bundle such as New Hire.
    roles: [requester]
  - id: order
    title: Order something
    summary: Find the item in Employee Center, answer its questions and order it.
    roles: [requester]
  - id: follow
    title: Follow your request
    summary: See where your request is, add information, and know what to expect.
    roles: [requester]
  - id: statuses
    title: Your request's statuses and emails
    summary: What each status and stage means, and every email you get, from order to delivery.
    roles: [requester]
  - id: approve
    title: Approve a request
    summary: Approve or reject what your team member ordered.
    roles: [approver]
  - id: fulfil
    title: Fulfil catalog tasks
    summary: Work the catalog tasks assigned to your team and close them when done.
    roles: [fulfiller]
  - id: on-behalf
    title: Order on someone's behalf
    summary: Raise a request for a caller from an incident or an interaction.
    roles: [agent]
  - id: manage
    title: Manage a request
    summary: Follow, add to or cancel a request and its items.
    roles: [agent, fulfiller]
