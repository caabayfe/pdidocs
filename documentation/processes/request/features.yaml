# The features of request management (ADR-0040): every application `snagentic docs census
# request` finds, each with a decision. Out-of-scope and question decisions were proposed by the
# documentation agent on 2026-10-19 and wait for the process owner's confirmation; a walk of the
# Service Operations Workspace and Employee Center adds what it shows.
features:
  - id: core
    title: Request handling (find, order, follow, approve, fulfil, manage)
    found: [global]
    status: documented
    capabilities: [find, order, follow, statuses, approve, fulfil, manage]
  - id: on-behalf
    title: Order for a caller from an incident (Create request, the incident's Requests list › New)
    found: [sn_sow_inc:New]
    status: documented
    capabilities: [on-behalf]
    note: >-
      New on the incident's Requests related list (roles itil or sn_request_write, open incident)
      opens the same catalog page as Create request; the page names only Create request.
  - id: assign-to-me
    title: Assign a catalog task to yourself (Assign to me)
    found: [sn_sow_itsm_common:Assign to me]
    status: documented
    capabilities: [fulfil]
  - id: add-task
    title: Add a catalog task to a requested item (Catalog Tasks › New)
    found: [sn_sow_req:New]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › requested item (Work in Progress) › Related records › Catalog Tasks, Approvers, Group approvals
    status: documented
    capabilities: [manage]
  - id: copy-request
    title: Copy a request
    found: [global:Copy]
    status: documented
    capabilities: [manage]
  - id: dependency-views
    title: Dependency views from the catalog task's configuration item
    found:
      - sn_sow_itsm_common:CI dependency view
      - sn_sow_itsm_common:Service dependency view
      - sn_sow_itsm_common:Service offering dependency view
    status: documented
    capabilities: [cmdb/impact]
  - id: discuss
    title: Discuss (Sidebar discussions, Collaborate chat)
    found: [sn_oe_sfs]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › requested item › side panel › Collaborate
    status: documented
    capabilities: [discuss]
  - id: sms
    title: Send an SMS about the request (Notify)
    found: [sn_sow_itsm_common:Send Sms]
    status: question
    question: Q12
  - id: response-templates
    title: Response templates (Responses)
    found: [sn_templated_snip]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › requested item › side panel › Response Templates, Templates
    status: question
    question: Q13
  - id: asset-workspace
    title: Requested items in the Asset Workspace
    found: [sn_itam_workspace]
    status: question
    question: Q14
  - id: mobile-push
    title: Now Mobile push notifications about requests
    found: [sn_scmobile]
    status: question
    question: Q07
  - id: app-intake
    title: App Engine app intake notifications
    found: [sn_app_intake]
    status: out-of-scope
    note: >-
      Event-driven emails of App Engine's app intake (requests to build an application on the
      platform), platform governance rather than IT fulfilment.
  - id: interaction-associate
    title: Associate a record with an interaction
    found: [sn_sow_interaction]
    status: out-of-scope
    note: >-
      Call handling in the workspace, decided under incident; a request ordered from an
      interaction links back to it by itself (see on-behalf).
  - id: communication-plans
    title: Communication plans
    found: [sn_comm_management]
    status: out-of-scope
    note: Only a table reference (comm_plan refers to task); communication plans are for incidents and major incidents.
  - id: cab-meetings
    title: CAB meetings
    found: [sn_change_cab]
    status: out-of-scope
    note: CAB meeting agendas belong to change management; only a table reference.
  - id: sla-breakdowns
    title: SLA breakdowns
    found: [sn_sla_brkdwn]
    status: out-of-scope
    note: Only a table reference; pdi2 has no SLA definition on sc_request, sc_req_item or sc_task (all eleven are on incident).
  - id: alert-simulation
    title: Alert simulation sessions
    found: [sn_em_tbac]
    status: out-of-scope
    note: Only a table reference (simulated alerts refer to task); nothing about requests.
  - id: automation-errors
    title: Automation error tasks
    found: [sn_svc_err]
    status: out-of-scope
    note: Only a table reference (automation error tasks refer to task); nothing about requests.
