title: Knowledge management
icon: book
summary: >-
  Knowledge articles answer common questions and explain how to fix common problems, so you can
  help yourself without waiting. Search them in Employee Center, rate them, and tell the authors
  when one is wrong or missing.
it_summary: >-
  Write, publish, keep current and retire knowledge articles in the Knowledge Center: each knowledge base decides who reads, who writes and whether publishing needs approval, and feedback from readers comes back as tasks.
order: 7
roles:
  - id: reader
    name: Reader
    audience: user
    description: anyone who reads articles in Employee Center or the Knowledge portal; no role is needed, each knowledge base's user criteria decide what they see
  - id: author
    name: Author
    audience: operator
    description: writes and updates articles in the knowledge bases they may contribute to (the knowledge role, or itil when writing from an incident)
  - id: manager
    name: Knowledge manager
    audience: operator
    description: the owner or a manager of a knowledge base (knowledge_manager); approves publishing and retiring where the knowledge base asks for it, and works the feedback on its articles
  - id: quality-reviewer
    name: Quality reviewer
    audience: operator
    description: checks articles against the quality checklist (knowledge_coach, knowledge_domain_expert)
  - id: admin
    name: Knowledge administrator
    audience: operator
    description: creates and sets up knowledge bases, templates and who may read and contribute (knowledge_admin)
lifecycle:
  - state: Draft
    meaning: being written; only authors and managers see it
  - state: Review
    meaning: waiting for approval to publish
  - state: Scheduled for publish
    meaning: approved; it is published on its publish date
  - state: Published
    meaning: readers can find it
  - state: Pending retirement
    meaning: waiting for approval to retire
  - state: Retired
    meaning: withdrawn; readers no longer find it
  - state: Outdated
    meaning: an older version, replaced by a newer published one
understand: [overview, lifecycle, who-is-told]
tables: [kb_knowledge, kb_feedback, kb_feedback_task, kb_submission, kb_article_checklist_summary, kb_knowledge_base]
capabilities:
  - id: find
    title: Find and read an article
    summary: Search or browse knowledge in Employee Center, open an article, and keep it for later.
    roles: [reader]
  - id: rate
    title: Rate an article or say what is wrong
    summary: Say whether an article helped, give it stars, comment, or flag it as wrong or unclear.
    roles: [reader]
    counterpart: feedback
    configure: feedback
  - id: write
    title: Write an article
    summary: Create a draft in the Knowledge Center, in the right knowledge base and category, from a template where one applies.
    roles: [author]
  - id: publish
    title: Publish an article
    summary: Publish a draft, at once or after the knowledge base's approvers agree, now or on a set date.
    roles: [author, manager]
  - id: update
    title: Update a published article
    summary: Check out a new version, edit it and publish it; the old version becomes outdated.
    roles: [author]
  - id: feedback
    title: Work feedback and knowledge gaps
    summary: Act on feedback tasks raised by flags, low ratings and reported gaps, and resolve them by fixing or writing an article.
    roles: [author, manager]
    counterpart: rate
  - id: retire
    title: Retire or replace an article
    summary: Withdraw an article that is no longer right, point readers to its replacement, and watch expiring articles.
    roles: [author, manager]
  - id: quality
    title: Check article quality
    summary: Score an article against the quality checklist (AQI) and send the results to its author.
    roles: [quality-reviewer, manager]
  - id: administer
    title: Set up knowledge bases
    summary: Request or create a knowledge base, name its owner and managers, choose who may read and contribute, and choose its publish and retire flows.
    roles: [admin, manager]
