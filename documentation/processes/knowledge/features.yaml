      - global:Update display value for topic tables
      - global:Update AIS result improvement rules
      - global:Public Info
      - global:Restrict guest user to knowledge base
    status: documented
    capabilities: [find]
    note: Covered by find; the Employee Center article page and search need a screen walk as an employee.
