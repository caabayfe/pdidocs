    found: ["global:KM: Article Expiry Warning"]
    status: documented
    capabilities: [retire]
    note: The monthly warning is off (glide.knowman.enable_article_expiry_notification false); should authors and managers be warned, or is the Knowledge Center's Expiring Articles list enough?
