# The features of knowledge management (ADR-0040): every application `snagentic docs census
# knowledge` finds, each with a decision. No capability page exists yet, so features the planned
# capabilities cover are todo, with a note naming the capability. Out-of-scope and question
# decisions were proposed by the documentation agent on 2026-10-19 and wait for the process
# owner's confirmation. Nothing has been walked on screen yet.
features:
  - id: core
    title: Article handling (write, publish, retire, the article form and its rules)
    found:
      - global
      - global:Publish
      - global:Republish
      - global:Retire
      - global:Delete
      - global:Update
      - global:New
      - global:View Article
      - global:Search for Duplicates
      - global:Set article in draft state on insert
      - global:Ensure published date is set
      - global:Validate Scheduled publish date
      - global:Populate Default KB if Empty
      - global:Check User CanContribute To Kb
      - global:Update Replacement Article References
      - global:Update Stage State
      - "global:KM: Article approved for publish"
      - "global:KM: Article rejected for publish"
    status: documented
    capabilities: [write, publish, update, retire]
    note: Covered by write, publish and retire; the publish and retire flows decide whether approval is needed.
  - id: knowledge-center
    title: Knowledge Center (the knowledge workspace, its lists and actions)
    found: [sn_km_center:Create Article, sn_km_center:New, sn_km_center:Publish, sn_km_center:Republish, sn_km_center:Hide Standard Template Field, sn_km_uib]
    status: documented
    capabilities: [write, publish, retire, quality, administer]
    note: The operator surface for write, publish and retire; its lists (Articles, Feedback Management, Administration, AQI) need a screen walk.
  - id: workspace-knowledge
    title: Knowledge in the Service Operations Workspace (Knowledge lists, article actions)
    found: [sn_sow, sn_sow_inc, sn_ui_knowledge]
    status: documented
    capabilities: [write, feedback, incident/share-knowledge]
    note: The workspace's Knowledge lists (your articles, your feedback tasks) and Create Article from a feedback task; Agent Assist is documented in incident.
  - id: reading
