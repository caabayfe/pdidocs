# The features of on-call scheduling (ADR-0040): every application `snagentic docs census
# on-call` finds, with a decision. No capability pages exist yet, so the features the planned
# capabilities will cover are todo, naming the capability. No group has a shift on pdi2
# (2026-10-19), so nothing here has been seen working. Out-of-scope and question decisions were
# proposed by the documentation agent on 2026-10-19 and wait for the process owner's confirmation.
features:
  - id: core
    title: On-Call Scheduling (shifts, rosters, members, coverage, its rules and checks)
    found: [global]
    status: documented
    capabilities: [set-up-shift]
  - id: shifts
    title: Create, publish and maintain a shift (New, Publish, Move to Draft, Migrate Now, Export Shift)
    found:
      - global:New
      - global:Publish
      - global:Move to Draft
      - global:Migrate Now
      - global:Export Shift
      - global:Export Shift Extra
      - global:Draft Shift - Make Inactive
      - global:Draft Shift - Display Message
      - global:Old Engine - Display Message
      - global:Validate Rota
    status: documented
    capabilities: [set-up-shift]
  - id: members
    title: Roster members, swaps and moves (Add, Remove, Move, Edit…)
    found: [global:Add, global:Remove, global:Move, global:Edit..., global:Delete]
    status: documented
    capabilities: [set-up-shift]
  - id: reminders
    title: Shift reminders and calendar subscriptions (Resend Reminders, Send Subscriptions)
    found:
      - global:Resend Reminders
      - global:Send Subscriptions
      - global:On-Call Reminder
      - global:On-Call Reminder Table
      - global:On-Call Subscription
      - global:No Reminders
    status: documented
    capabilities: [set-up-shift, own-schedule]
  - id: time-off
    title: Time off and cover requests
    found:
      - global:On-Call Time Off Submitted
      - global:On-Call Time Off Approved
      - global:On-Call Time Off Rejected
      - global:OC PTO Coverage replacement notification
      - global:OC send time off created notification
      - global:Extra time - clear cache
    status: documented
    capabilities: [own-schedule, set-up-shift]
  - id: escalation-policy
    title: Escalation policy, catch-all and contact preferences
    found:
      - global:Edit Escalation Policy
      - global:Override Escalation Policy
      - global:Reset Escalation Policy
      - global:Edit Escalation and Contact Preferences
      - global:Catch-All is Group Manager
      - global:Catch-All is Individual
      - global:Catch-All is Notify All
      - global:Custom Escalation Hide Fields
      - global:Force device to Email warning
      - global:Force device to SMS warning
      - global:Toggle override user preference
    status: documented
    capabilities: [escalation]
  - id: trigger-rules
    title: Trigger rules and the on-call flows (On-Call Assign and Notify, Assign By Acknowledgement, Escalations by Email)
    found: [global]
    status: documented
    capabilities: [escalation, respond]
  - id: calendars
    title: On-call calendars, schedules and reports (who is on call)
    found: [global]
    status: documented
    capabilities: [see-on-call, own-schedule]
  - id: conference-calls
    title: Conference calls and SMS from a task (Start Conference Call, Manage Conference Calls, Send SMS)
    found: [global:Start Conference Call, global:Manage Conference Calls, global:Send SMS, sn_sow_itsm_common:Send Sms]
    status: question
    question: shared/Q01
  - id: task-wide
    title: Actions every task has (Assign to me, Visual Task Board, live feed, SLA timeline, outages, proposed changes)
    found:
      - global:Add to Visual Task Board
      - global:Assign to me
      - global:Create Outage
      - global:Follow on Live Feed
      - global:Show Live Feed
      - global:Metrics Timeline
      - global:Show SLA Timeline
      - global:Repair SLAs
      - global:Refresh Impacted Services
      - global:Remediate
      - global:Proposed Change Verification Log
      - global:Verify Proposed Changes
      - sn_sow_itsm_common
      - sn_sow_interaction
      - sn_oe_sfs
      - sn_templated_snip
    status: out-of-scope
    note: Reached because the time off request extends the approval task table; they belong to the incident and other task processes, not to on-call. Proposed by the documentation agent.
  - id: task-references
    title: Tables in other applications that refer to any task
    found: [sn_change_cab, sn_gf, sn_comm_management, sn_em_tbac, sn_sla_brkdwn, sn_svc_err]
    status: out-of-scope
    note: They refer to task in general, not to on-call records. Proposed by the documentation agent.
  - id: workspace-on-call
    title: On-call in the Service Operations Workspace (Teams, Schedules, on-call escalation tab)
    found: ["sn_sow:Check on-call is active"]
    status: question
    question: shared/Q04
  - id: mobile-push
    title: On-Call Mobile Push Notifications (store application)
    found: [sn_on_call_m_notif]
    status: question
    question: shared/Q09
