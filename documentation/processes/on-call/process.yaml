title: On-call scheduling
icon: phone
summary: >-
  Some IT teams keep someone on call outside office hours, so that an urgent problem reaches a
  person who can act on it straight away. This is IT's own planning; you don't need to do anything
  to use it, and on pdi2 no team has an on-call shift yet.
it_summary: >-
  Plan who in each support group is on call, see who that is now, manage your own shifts and time off, and let the on-call flows assign and escalate urgent work. No group has a shift on pdi2 yet.
order: 8
roles:
  - id: agent
    name: Service desk agent or resolver
    audience: operator
    description: >-
      looks up who is on call for a group before calling or inviting them (the itil role, or
      oc_read for read-only access to the on-call calendar)
  - id: major-incident-manager
    name: Major incident manager
    audience: operator
    description: finds the on-call people of each group a major incident needs and brings them in
  - id: member
    name: On-call group member
    audience: operator
    description: >-
      a member of a support group with a shift; is on call when the roster says so, receives the
      on-call notifications and accepts or rejects assignments; no extra role needed
  - id: rota-manager
    name: Shift manager
    audience: operator
    description: >-
      the group's manager, or a user with rota_manager named on the group's preferences; manages
      that group's shifts, rosters, members, time off and escalation
  - id: rota-admin
    name: On-call administrator
    audience: operator
    description: >-
      rota_admin (included in sn_on_call_admin): creates, edits and deletes any shift, sets the
      on-call properties and the trigger rules that start the on-call flows
lifecycle:
  - state: Live
    meaning: an on-call escalation is running; people are being contacted in turn
  - state: Completed
    meaning: someone accepted, was assigned, or the escalation ran out of steps
  - state: Cancelled
    meaning: stopped, for example because the record was assigned another way
understand: [overview, lifecycle, who-is-told]
tables: [cmn_rota, cmn_rota_roster, cmn_rota_member, roster_schedule_span, roster_schedule_span_proposal, on_call_escalation]
capabilities:
  - id: see-on-call
    title: See who is on call
    summary: Find who is on call for a group now or at a given time, from the on-call calendars, and bring them into a discussion.
    roles: [agent, major-incident-manager, member]
  - id: own-schedule
    title: Your shifts, preferences and time off
    summary: See when you are on call, set how you want to be contacted, and ask for time off or cover.
    roles: [member]
  - id: set-up-shift
    title: Set up and maintain a shift
    summary: Create a group's shift, its rosters and members, and keep coverage, swaps and time off up to date.
    roles: [rota-manager, rota-admin]
  - id: escalation
    title: Set the escalation and trigger rules
    summary: Decide who is contacted, how and in what order, and which records start the on-call flows.
    roles: [rota-manager, rota-admin]
  - id: respond
    title: When on-call work reaches you
    summary: What happens when an incident goes to a group with a shift, how you are told, and how to accept or reject it.
    roles: [member, agent]
