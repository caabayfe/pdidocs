title: Change management
icon: refresh
summary: >-
  Any change to a system people rely on goes through change management: it is planned, its risk
  assessed, approved by the right people, scheduled, implemented and reviewed, so changes don't
  break what works.
it_summary: >-
  Plan, assess, authorize and implement changes: the risk decides who approves, the change advisory board reviews the riskier ones, and change tasks track the work.
order: 4
roles:
  - id: business-approver
    name: Business approver
    audience: user
    description: a manager or service owner asked to approve a change, usually from Employee Center or email
  - id: requester
    name: Change requester
    audience: operator
    description: plans the change, requests approval and sees it through to closure (itil)
  - id: implementer
    name: Implementer
    audience: operator
    description: works the change tasks that carry out and test the change
  - id: it-approver
    name: Technical approver
    audience: operator
    description: a support group member or manager approving a change in the workspace or on the form
  - id: cab
    name: CAB member or manager
    audience: operator
    description: decides on higher-risk and emergency changes in the change advisory board
  - id: manager
    name: Change manager
    audience: operator
    description: owns the process, the policies and the change models
lifecycle:
  - state: New
    meaning: being planned
  - state: Assess
    meaning: the technical approvers are checking it (normal changes)
  - state: Authorize
    meaning: waiting for management or CAB approval
  - state: Scheduled
    meaning: approved and planned for its window
  - state: Implement
    meaning: being carried out
  - state: Review
    meaning: done; checking the result
  - state: Closed
    meaning: finished, successful or not
  - state: Canceled
    meaning: not going ahead
understand: [overview, lifecycle, approvals, who-is-told]
tables: [change_request, change_task]
capabilities:
  - id: approve
    title: Approve a change
    summary: Approve or reject a change you are asked about, in Employee Center or by email.
    roles: [business-approver]
    counterpart: authorize
    configure: authorize
  - id: raise
    title: Raise a change
    summary: Choose the kind of change, plan it, schedule it and calculate its risk.
    roles: [requester]
  - id: standard
    title: Use a standard change
    summary: Pick a pre-approved template for routine work, or propose a new one.
    roles: [requester]
  - id: authorize
    title: Get it approved
    summary: Request approval; the technical, management or CAB approvals follow from the risk.
    roles: [requester, manager]
    counterpart: approve
  - id: review-approval
    title: Approve as a technical approver
    summary: Approve or reject the changes waiting for you in the workspace or on the form.
    roles: [it-approver]
    configure: authorize
  - id: cab
    title: The change advisory board
    summary: Prepare and run CAB meetings and decide on the changes on the agenda.
    roles: [cab]
  - id: implement
    title: Schedule and implement
    summary: Schedule the change, carry it out through change tasks and record the result.
    roles: [requester, implementer]
  - id: close
    title: Review, close or cancel
    summary: Close the change with its outcome, or cancel it or send it back to New.
    roles: [requester]
