# The features of change management (ADR-0040): every application `snagentic docs census change`
# finds, each with a decision. The pages describe the classic change form; what the Service
# Operations Workspace adds for changes and change tasks still needs a walk. Todo, out-of-scope and
# question decisions were proposed by the documentation agent on 2026-10-19 and wait for the
# process owner's confirmation.
features:
  - id: core
    title: Change handling (raise, assess, authorize, schedule, implement, review, close)
    found:
      - global
    status: documented
    capabilities: [approve, raise, standard, authorize, review-approval, implement, close]
  - id: cab
    title: The change advisory board (CAB Workbench, agendas, attendees)
    found: [sn_change_cab]
    status: documented
    capabilities: [cab]
  - id: workspace
    title: Work a change or change task in the Service Operations Workspace
    found:
      - sn_itsm_workspace:New
      - sn_itsm_workspace:Create Change Task
      - sn_itsm_workspace:Set State field on WS
      - sn_sow_itsm_common:Assign to me
      - sn_sow_itsm_common:New
      - global:Link change to incident in Wkspace
      - global:Set Emergency Model in Workspace
      - global:Set Normal Model in Workspace
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › change request (normal, New) › header Save; More actions › Compose Email, Delete
    status: todo
    note: >-
      The workspace's Tasks lists (Assigned to you, Assigned to your group) are on the task table,
      so changes and change tasks show there; New from an incident or problem creates a linked
      change. The pages only describe the classic form.
  - id: impact
    title: Affected CIs, impacted services, outages and dependency views
    found:
      - global:Add CI to Affected CIs
      - global:Add CI to Affected CIs on change
      - global:Refresh Impacted Services
      - global:Create Outage
      - sn_sow_itsm_common:CI dependency view
      - sn_sow_itsm_common:Service dependency view
      - sn_sow_itsm_common:Service offering dependency view
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › change request › Related records › Affected CIs, Impacted Services/CIs, Outages
    status: todo
    note: >-
      The change form has Affected CIs, Impacted Services/CIs and Outages related lists that
      approvers read; incident/see-impact covers the incident form only.
  - id: agent-assist
    title: Agent Assist on a change or change task
    found: [sn_itsm_workspace:Agent Assist]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › change request › side panel › Recommendations, Agent Assist
    status: todo
    note: >-
      Assigned to change_request and change_task (active records, workspace side panel);
      incident/assist describes the incident sources only.
  - id: discuss
    title: Sidebar discussions on a change
    found: [sn_oe_sfs]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › change request › side panel › Collaborate
    status: todo
    note: >-
      Open create collab chat modal is on task with Next Experience on (glide.ui.polaris.experience
      true); incident/discuss describes the incident only.
  - id: notify
    title: SMS and conference calls (Notify)
    found:
      - sn_sow_itsm_common:Send Sms
      - global:Send SMS
      - global:Start Conference Call
      - global:Manage Conference Calls
    status: question
    note: Notify is off on pdi2 (glide.enable.notify_on_task false), so these are hidden; are SMS or conference calls about changes wanted at all?
  - id: proposed-ci-changes
    title: Proposed CI changes (Apply, Verify, Verification Log)
    found:
      - global:Apply Proposed Changes
      - global:Verify Proposed Changes
      - global:Proposed Change Verification Log
    status: question
    note: Do changes carry proposed CMDB changes that are applied when the change is implemented, or is the CMDB updated otherwise?
  - id: discovery
    title: Discovery after a change (Initiate Discovery, Trigger Auto Discovery)
    found: [global:Initiate Discovery, global:Trigger Auto Discovery]
    status: question
    note: Is Discovery set up to rescan a change's CIs after implementation on this instance?
  - id: deployment-pipeline
    title: Changes raised by the deployment pipeline
    found: [sn_deploy_pipeline]
    status: question
    note: Do application deployments through the Deployment Pipeline raise change requests here, and who approves them?
  - id: sla-breakdowns
    title: SLA breakdowns
    found: [sn_sla_brkdwn]
    status: question
    note: Are SLAs measured on changes or change tasks, and does anyone read the breakdown reports?
  - id: alert-simulation
    title: Alert simulation sessions
    found: [sn_em_tbac]
    status: question
    note: Is event management's alert simulation in use on this instance?
  - id: automation-errors
    title: Automation error tasks
    found: [sn_svc_err]
    status: question
    note: Do automation errors create change tasks here, and who works them?
  - id: response-templates
    title: Response templates
    found: [sn_templated_snip]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: Service Operations Workspace › change request › side panel › Response Templates, Templates, Email template
    status: question
    note: The workspace side panel offers Response Templates, but pdi2 has none for change_request or change_task; should requesters and implementers get some?
  - id: communication-plans
    title: Communication plans
    found: [sn_comm_management]
    status: out-of-scope
    note: Only a table reference (comm_plan); communication plans are documented for incidents and major incidents.
  - id: interactions
    title: Associate an interaction with a record
    found: [sn_sow_interaction]
    status: out-of-scope
    note: An action on the interaction, documented in incident; nothing to do on the change.
  - id: playbook
    title: Playbooks
    found: [global:Playbook]
    status: out-of-scope
    note: The action shows only when a playbook runs on the record; pdi2 has no playbook for changes or change tasks.
  - id: remediation-tasks
    title: Remediate
    found: [global:Remediate]
    status: out-of-scope
    note: Only for remediation, duplicate-reconciliation and certification tasks, never a change.
