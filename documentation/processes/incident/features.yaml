# The features of incident management (ADR-0040): every application `snagentic docs census
# incident` finds, and what a walk of the Service Operations Workspace form showed, each with a
# decision. Out-of-scope and question decisions were proposed by the documentation agent on
# 2026-10-18 and wait for the process owner's confirmation.
features:
  - id: core
    title: Incident handling (log, prioritise, assign, work, resolve, close)
    found:
      - global
      - sn_itsm_workspace:Assign to me
      - sn_itsm_workspace:New
      - sn_itsm_workspace:Create Request
      - sn_sow_itsm_common:Assign to me
      - sn_sow_inc:Add
      - sn_sow_inc:New
      - sn_sow_inc:Remove ({{count}})
      - sn_sow_inc:Reopen
      - sn_sow_inc:Resolve
      - sn_sow_inc:Create Incident Task
      - sn_sow_inc:Create child incident
      - sn_sow_inc:Create request
      - sn_sow_inc:Close interaction from incident
      - sn_sow_inc:Closure information visibility on load
      - sn_sow_inc:Hide active field for SOW
      - sn_sow_inc:Hide notes section
      - sn_sow_inc:Resolution details visibility on load
      - sn_sow_inc:Resolution details visibility on state
      - sn_sow_inc:Set Resolution notes for Parent Incident
      - sn_sow_inc:Set Resolution notes for Resolution Code
      - sn_sow_inc:(SOW) Make Parent Incident mandatory
      - sn_sow_inc:(SOW-Incident-Overview) Make Parent Incident mandatory
      - sn_sow_inc:Hide Parent incident if it's a Major Incident
      - sn_sow_inc:Hide fields on SOW modal
      - sn_sow_inc:Hide origin table and record on Incident form
      - sn_sow_inc:Show and make Parent incident mandatory if Resolution code is Duplicate
      - sn_sow_inc:Show and make Parent incident mandatory if Resolution code is Duplicate in SOW Summary Modal view
      - sn_sow_interaction
    status: documented
    capabilities: [report, follow, log, prioritise, assign, work, resolve, confirm, close, escalate]
  - id: communication-plans
    title: Communication plans (Create new communication, Incident Communication Plans)
    found:
      - sn_comm_management
      - sn_sow_inc:Open new communication modal
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › More actions › Create new communication; Related records › Incident Communication Plans
    status: documented
    capabilities: [communicate, major-incident/communicate]
  - id: discuss
    title: Discuss (Sidebar discussions)
    found: [sn_sow_collab, sn_oe_sfs]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › header › Sidebar discussions (All, Unread, This record, Mentions; New discussion)
    status: documented
    capabilities: [discuss]
  - id: collaborate-chat
    title: Collaborate (chat from the side panel)
    found: [sn_oe_sfs, sn_sow_collab]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › side panel › Collaborate › Chat
    status: documented
    capabilities: [discuss]
    note: The same Sidebar discussions, listed for the record; its + starts one.
  - id: knowledge
    title: Knowledge from an incident (Create Knowledge, Report Knowledge Gap, Attached Knowledge)
    found:
      - sn_sow_inc:Create Knowledge
      - sn_sow_inc:Edit knowledge
      - sn_sow_inc:Report Knowledge Gap
      - global:Incident Create Knowledge
      - global:Report Knowledge Gap
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › More actions › Report Knowledge Gap; Related records › Attached Knowledge
    status: documented
    capabilities: [share-knowledge]
  - id: copy-incident
    title: Copy Incident
    found: [sn_sow_inc:Copy Incident, global:Copy Incident]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › More actions › Copy Incident
    status: documented
    capabilities: [log]
  - id: agent-assist
    title: Agent Assist and Recommendations
    found: [sn_itsm_workspace:Agent Assist]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › side panel › Recommendations, Agent Assist
    status: documented
    capabilities: [assist]
  - id: templates
    title: Templates and response templates
    found: [sn_itsm_workspace:Templates, sn_templated_snip]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › side panel › Response Templates, Templates, Email template; More actions › Compose Email
    status: documented
    capabilities: [use-templates]
  - id: attachments
    title: Attachments
    found: [sn_itsm_workspace:Attachments, "global:(BP) Hide Attachment Link when Closed"]
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › side panel › Attachments
    status: documented
    capabilities: [work]
  - id: dependency-views
    title: Dependency views, affected CIs and impacted services
    found:
      - sn_sow_itsm_common:CI dependency view
      - sn_sow_itsm_common:Service dependency view
      - sn_sow_itsm_common:Service offering dependency view
    seen:
      by: Documentation agent, as admin
      on: 2026-10-18
      where: Service Operations Workspace › incident › Related records › Affected CIs, Impacted Services/CIs
    status: documented
    capabilities: [see-impact]
  - id: sms
    title: Send an SMS about the incident (Notify)
    found: [sn_sow_itsm_common:Send Sms]
    status: question
    question: shared/Q01
  - id: reset-password
    title: Reset a caller's password
    found: [sn_sow_pwd_reset]
    status: documented
    capabilities: [reset-password]
  - id: slas
    title: Service levels (SLA definitions, warnings, timers)
    found:
      - global:SLA warning Parm
      - global:SLA breached Parm
      - global:SLA warning CI Supported By
      - global:SLA breached CI Supported By
      - global:Task SLA Empty Schedule Warning
    status: documented
    capabilities: [meet-deadlines]
  - id: survey
    title: Satisfaction survey after closure
    found: [global:Auto assessment business rule]
    status: documented
    capabilities: [survey]
  - id: post-incident-review
    title: Post-incident review
    found:
      - sn_sow_inc:Insert PIR Records On Resolved
      - sn_sow_inc:Update pir data - Incident task
      - sn_sow_inc:sn_sow_inc_post_incident_review
    status: question
    question: Q42
  - id: sla-breakdowns
    title: SLA breakdowns
    found: [sn_sla_brkdwn]
    status: question
    question: shared/Q10
  - id: major-incident
    title: Major incident management
    found: [sn_major_inc_mgmt]
    status: out-of-scope
    note: Documented as its own process, major-incident.
  - id: cab-meetings
    title: CAB meetings
    found: [sn_change_cab]
    status: out-of-scope
    note: CAB meeting agendas belong to change management.
  - id: atf-slas
    title: Test SLA definitions
    found: [sn_slm_atf]
    status: out-of-scope
    note: SLA definitions that automated tests use; nobody works with them.
  - id: alert-simulation
    title: Alert simulation sessions
    found: [sn_em_tbac]
    status: question
    question: shared/Q12
  - id: automation-errors
    title: Automation error tasks
    found: [sn_svc_err]
    status: question
    question: shared/Q13
