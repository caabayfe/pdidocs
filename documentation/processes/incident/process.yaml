title: Incident management
icon: alert
summary: >-
  When something you use for work stops working or gets in your way, report it as an incident.
  The service desk sorts it, the right support team fixes it, and you are kept informed until it
  is closed.
it_summary: >-
  Log, prioritise, route, work and resolve incidents in the Service Operations Workspace, against deadlines set by priority, and keep the caller informed until each one is closed.
order: 1
roles:
  - id: caller
    name: Caller
    audience: user
    description: anyone who reports that something is not working, for themselves or someone else
  - id: agent
    name: Service desk agent
    audience: operator
    description: logs, sorts, prioritises and routes incidents, often while on the phone with the caller
  - id: resolver
    name: Resolver
    audience: operator
    description: a member of a support team who investigates and fixes the incident
  - id: team-lead
    name: Team lead
    audience: operator
    description: a support lead with extra rights, such as closing incidents on a caller's behalf
  - id: major-incident-manager
    name: Major incident manager
    audience: operator
    description: takes charge when one problem hits many people or a critical service
lifecycle:
  - state: New
    meaning: logged; nobody is working on it yet
  - state: In Progress
    meaning: someone is assigned and working on it
  - state: On Hold
    meaning: waiting for the caller, a change, a problem fix or a vendor
  - state: Resolved
    meaning: the fix is in; the caller can confirm or reopen it
  - state: Closed
    meaning: finished; it can no longer be reopened
  - state: Canceled
    meaning: not needed after all (for example a duplicate logged by mistake)
understand: [overview, lifecycle, priority-and-deadlines, who-is-told, glossary]
tables: [incident, task_sla, incident_task]
capabilities:
  - id: report
    title: Report an incident
    summary: Tell IT what is wrong, from Employee Center, by email or by phone.
    roles: [caller]
  - id: follow
    title: Follow your incident
    summary: See where it is, answer the service desk's questions and add information.
    roles: [caller]
  - id: log
    title: Log and categorise an incident
    summary: Record the caller's issue on the incident form so the right team can act on it.
    roles: [agent]
  - id: prioritise
    title: Set the priority
    summary: Choose impact and urgency; the priority, and with it the deadline, follows.
    roles: [agent, resolver]
  - id: assign
    title: Assign an incident
    summary: Get the incident to the right team and the right person.
    roles: [agent, resolver]
  - id: work
    title: Work on an incident
    summary: Investigate, keep the caller informed, put it on hold when you wait, and watch the deadlines.
    roles: [resolver]
  - id: resolve
    title: Resolve an incident
    summary: Record the fix so the caller is told and can confirm it.
    roles: [resolver]
    counterpart: confirm
  - id: confirm
    title: Confirm the fix, or reopen
    summary: Say whether the fix works; close it, or reopen it with what is still wrong.
    roles: [caller]
    counterpart: resolve
    configure: close
  - id: close
    title: Close, reopen or cancel an incident
    summary: Finish an incident once the fix is confirmed, reopen it when it is not, or cancel one logged by mistake.
    roles: [resolver, team-lead]
  - id: escalate
    title: Escalate and link related work
    summary: Raise a major incident, or create a change, a request or a child incident from an incident.
    roles: [agent, resolver, major-incident-manager]
  - id: communicate
    title: Communicate about an incident
    summary: Send scheduled email updates about an incident to the people it affects, and see its communication plans.
    roles: [resolver, major-incident-manager]
  - id: discuss
    title: Discuss an incident with colleagues
    summary: Start a Sidebar discussion from the incident, invite colleagues, a group's on-call people or the caller, and find it again later.
    roles: [agent, resolver, team-lead, major-incident-manager]
  - id: share-knowledge
    title: Create and link knowledge from an incident
    summary: Attach an article that helped, write a new one from a resolved incident, or report that one is missing.
    roles: [agent, resolver]
  - id: assist
    title: Find answers with Agent Assist
    summary: Search knowledge, the catalog, other incidents and outages from the side panel, and attach, link or copy what you find.
    roles: [agent, resolver, team-lead]
  - id: use-templates
    title: Fill in and reply with templates
    summary: Fill in an incident with a record template, reply with a response template, and write emails with Compose Email.
    roles: [agent, resolver]
  - id: see-impact
    title: See what the incident's configuration item affects
    summary: Open the CI's dependency map, and keep the incident's affected CIs and impacted services up to date.
    roles: [agent, resolver]
  - id: reset-password
    title: Reset a caller's password
    summary: Check who the caller is, then reset their password or unlock their account from the incident assigned to you.
    roles: [agent]
  - id: meet-deadlines
    title: Meet an incident's deadlines
    summary: Watch the response and resolution SLAs in the workspace, know what starts, pauses and stops them, and what the warning emails mean.
    roles: [agent, resolver, team-lead]
  - id: survey
    title: Tell IT how it went
    summary: Answer the short satisfaction survey you get by email when your incident is closed.
    roles: [caller]
