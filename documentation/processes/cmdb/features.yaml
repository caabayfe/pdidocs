# The features of configuration management (ADR-0040): every application `snagentic docs census
# cmdb` finds, each with a decision. Out-of-scope and question decisions were proposed by the
# documentation agent on 2026-10-19 and wait for the process owner's confirmation; no screen walk
# has been done yet.
features:
  - id: core
    title: Configuration items on tickets, their states, owners and dependencies
    found:
      - global
    status: documented
    capabilities: [pick-service, choose-ci, impact, maintain, quality]
  - id: cmdb-workspace
    title: CMDB Workspace (My work, Intelligent search, CMDB Health, certification)
    found:
      - sn_cmdb_ws
      - global:Open in CMDB Workspace
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: CMDB Workspace › Home, My Work, CMDB 360, Insights, Management; a service CI › Summary, Attributes, Tags, Resources, Activity, Relationships, Services and Offerings, Health
    status: documented
    capabilities: [maintain, quality]
  - id: create-edit-cis
    title: Create CIs in the CMDB Workspace (Create CI, New; bulk Edit hidden on purpose)
    found:
      - sn_cmdb_ws:Create CI
      - sn_cmdb_ws:New
      - sn_cmdb_ws:Edit ({{count}})
    status: documented
    capabilities: [create-ci]
  - id: ci-page
    title: A CI's page in the CMDB Workspace (Open map; the old form buttons don't show)
    found:
      - sn_cmdb_pg_templts
    seen:
      by: Documentation agent, as admin
      on: 2026-10-19
      where: CMDB Workspace › a service CI (cmdb_ci_service) › header Open map; More actions › Configure attributes, Configure resources (no Create incident or Create change on this class)
    status: documented
    capabilities: [maintain]
    note: >-
      Explore CI (sn_cmdb_ws.explore_ci.record.enabled) replaces the cmdb_browse form for saved CIs, so Create incident, Create change, Open dependency view and View CMDB 360 Data never show; the owner decides whether to keep it.
  - id: affected-cis-incident
    title: Add and remove affected CIs on an incident
    found:
      - sn_sow_inc
    status: documented
    capabilities: [impact, incident/see-impact]
  - id: affected-cis-tasks
    title: Add and remove affected CIs on changes and problems
    found:
      - sn_sow_itsm_common:Add
      - sn_sow_itsm_common:Remove ({{count}})
      - global:Add
      - global:Remove ({{count}})
    status: documented
    capabilities: [change/see-impact]
    note: >-
      The problem pages don't describe the same Add and Remove on a problem's Affected CIs yet.
  - id: subscribe
    title: Subscribe to a CI (Subscribe, Unsubscribe)
    found: [global:Subscribe, global:Unsubscribe]
    status: question
    question: shared/Q16
  - id: proposed-changes
    title: Proposed CI changes from a change request
    found:
      - global:Proposed Change
      - global:Save Proposed Change
      - global:Save Proposed Delete
    status: question
    question: shared/Q17
  - id: service-conversion
    title: Classify services (Convert to business service, technology management service, service instance)
    found:
      - global:Convert to business service
      - global:Convert to technology management service
      - global:Convert to Service Instance
      - global:Bulk Convert Service Instances
    status: question
    question: Q10
  - id: unverified-cis
    title: Unverified CIs (Merge CI, Create Asset)
    found: [global:Merge CI, global:Create Asset]
    status: question
    question: Q11
  - id: query-builder
    title: CMDB Query Builder saved results
    found:
      - sn_cmdb_ws:u_cmdb_qb_result_1859dc7fe9d74abd9844d8a3be7019d78c1705b0
      - sn_cmdb_ws:u_cmdb_qb_result_917e91fecfba01ca08f922d6e68deae68a03c0dc
      - sn_cmdb_ws:u_cmdb_qb_result_9a270798bac9295a427ea2f23828e832e265a7bb
      - sn_cmdb_ws:u_cmdb_qb_result_b00b22494898682e88f2afc87b19e98790d548d6
      - sn_cmdb_ws:u_cmdb_qb_result_d3bda2a94c2c358b33baadf23f7d36b956043856
    status: question
    question: Q12
  - id: cmdb-360
    title: CMDB 360 (multisource data)
    found: [global:CMDB 360 Data Preview, sn_cmdb_pg_templts:View CMDB 360 Data]
    status: out-of-scope
    note: >-
      Off on pdi2: glide.identification_engine.multisource_enabled is false and nothing discovers
      CIs, so both actions are hidden.
  - id: agent-workspace
    title: CMDB in the legacy Agent Workspace
    found: [sn_cmdb_workspace]
    status: out-of-scope
    note: Its forms, lists and actions belong to the Agent Workspace, which is inactive on pdi2.
  - id: itam-workspace
    title: New CI from the ITAM Workspace
    found: [sn_itam_workspace]
    status: out-of-scope
    note: Asset management's workspace (view itam_workspace), not a documented process.
  - id: itsm-workspace
    title: New affected CI (ITSM workspace)
    found: [sn_itsm_workspace]
    status: out-of-scope
    note: Its New on task_ci is excluded by its own declarative action exclusion, so it never shows.
  - id: itom-licensing
    title: ITOM licence counting
    found: [sn_itom_license, sn_itom_licensing]
    status: out-of-scope
    note: Only tables that refer to CIs, for counting licensed CIs; nobody works with them.
  - id: alert-simulation
    title: Alert simulation sessions
    found: [sn_em_tbac]
    status: out-of-scope
    note: Only tables that refer to CIs; whether alert simulation is used is asked in incident.
  - id: automation-errors
    title: Automation error messages
    found: [sn_svc_err]
    status: out-of-scope
    note: Only a table that refers to CIs; whether automation errors are worked is asked in incident.
  - id: noc-favorites
    title: NOC favourites
    found: [sn_nocpit]
    status: out-of-scope
    note: Only a table that refers to CIs (favourites in a network operations view).
