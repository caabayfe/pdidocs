title: Configuration management (CMDB)
icon: database
summary: >-
  The CMDB records the services, applications, servers and devices IT runs, who owns them and how
  they depend on each other, so incidents and changes name the right thing and reach the right team.
it_summary: >-
  Keep the configuration items right: they route incidents and changes, show what a failure affects, and need owners and regular checks.
order: 6
roles:
  - id: employee
    name: Employee
    audience: user
    description: says which service is affected when reporting a problem
  - id: agent
    name: Service desk agent or resolver
    audience: operator
    description: picks the configuration item on incidents, problems and changes, and checks what depends on it
  - id: owner
    name: CI owner
    audience: operator
    description: keeps the data of the configuration items they own or manage right
  - id: cmdb-manager
    name: CMDB manager
    audience: operator
    description: watches data quality, duplicates and the life cycle of configuration items
lifecycle:
  - state: Installed / Operational
    meaning: in service
  - state: In Maintenance / Repair in Progress
    meaning: being worked on
  - state: Non-Operational
    meaning: installed but not working
  - state: Retired
    meaning: out of service
understand: [overview, ci-states, ownership]
tables: [cmdb_ci, cmdb_ci_service, cmdb_rel_ci, task_ci]
capabilities:
  - id: pick-service
    title: Say which service is affected
    summary: Choose the application or service on the forms that ask for it.
    roles: [employee]
    configure: choose-ci
  - id: choose-ci
    title: Choose the right configuration item
    summary: Set the configuration item and the service on a ticket, and let it route the work.
    roles: [agent]
  - id: impact
    title: See what depends on a configuration item
    summary: Open the dependency view, and keep the affected and impacted lists right.
    roles: [agent]
  - id: maintain
    title: Keep your configuration items right
    summary: Own and update your CIs, answer certification audits, and use the CMDB Workspace.
    roles: [owner]
  - id: quality
    title: Watch CMDB quality
    summary: Health scores, duplicates and the Data Manager's retirement and archiving.
    roles: [cmdb-manager]
  - id: create-ci
    title: Create a configuration item
    summary: Create CIs in the CMDB Workspace without duplicates, and change them one at a time.
    roles: [owner, cmdb-manager]
