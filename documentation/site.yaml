title: IT service management on pdi2
instance: pdi2
footer: Prepared with snagentic from the pdi2 configuration. Checked against the instance's mirror; where a value is not visible in the mirror, the page says so.
surfaces:
  user:
    - { id: employee-center, name: Employee Center, record: sp_portal/70cd9f3b734b13001fdae9c54cf6a72f }
    - { id: email, name: email }
    - { id: phone, name: the service desk's phone }
  operator:
    - { id: workspace, name: Service Operations Workspace }
    - { id: classic, name: the classic incident form }
# Words end users shouldn't meet on their pages (spec 010a).
vocabulary: [work notes, assignment group, assigned to, contact type, incident state, business rule, UI action, configuration item]

# The employee guide (ADR-0037): where employees start, then what they want to do.
employees:
  title: Employee guide
  intro: How to get help from IT on pdi2, how Employee Center works, and what happens after you ask.
  start: [getting-help/channels, getting-help/employee-center]
  tasks:
    - title: Something isn't working
      icon: alert
      summary: Report it, follow it, and confirm the fix.
      pages: [incident/report, incident/follow, incident/confirm, incident/survey]
    - title: If many people are affected
      icon: flame
      summary: When your problem is part of a bigger one, or waits for a lasting fix.
      pages: [major-incident/follow, problem/affected]
    - title: I need something
      icon: cart
      summary: Find it in the catalog, order it, and follow it until it is delivered.
      pages: [request/find, request/order, request/follow, request/statuses]
    - title: Find an answer yourself
      icon: book
      summary: Search the knowledge base, read an article, and say when one is wrong.
      pages: [knowledge/find, knowledge/rate]
    - title: My account
      icon: user
      summary: Reset your password and choose which emails you get.
      pages: [getting-help/password, getting-help/notifications]
    - title: I'm asked to approve
      icon: check
      summary: What your team ordered, or a change your team will make.
      pages: [request/approve, change/approve]
  # The processes explained under How it works, most used first.
  how: [incident, request, knowledge, major-incident, problem, change]
# Every build narrates the animations and records their videos (unchanged ones are reused).
media: { voice: piper, video: true }
