<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="only light"><title>Choose the configuration item</title>
<style>:root{--ink:#172B4D;--ink2:#44546F;--mute:#8590A2;--line:#DCDFE4;--bg:#FFFFFF;--panel:#F7F8F9;
--blue:#0C66E4;--blueL:#E9F2FF;--navy:#0B2545;--teal:#1F845A;--tealL:#DCFFF1;--amber:#B65C02;--amberL:#FFF7D6;
--red:#C9372C;--redL:#FFECEB;--purple:#6E5DC6;--purpleL:#F3F0FF;--grey:#626F86;--greyL:#F1F2F4;
--ease:cubic-bezier(.22,.8,.24,1);color-scheme:only light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 8px}
.hdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.hdr h3{margin:0;font-size:16px;font-weight:650}
.tag{font-size:11px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.tag.obs{background:var(--tealL);color:var(--teal)} .tag.con{background:var(--purpleL);color:var(--purple)} .tag.src{background:var(--blueL);color:var(--blue)}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#fff,#FAFBFC);overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
svg text{font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
#cam{transform-box:view-box;transform-origin:0 0;transition:transform 1.8s var(--ease);will-change:transform}
.r{opacity:0;transform:translateY(8px);transform-box:fill-box;transform-origin:center;transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.hl{transition:fill .7s var(--ease),stroke .7s var(--ease),opacity .7s var(--ease),stroke-width .7s var(--ease)}
.tok{opacity:0}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes dash{to{stroke-dashoffset:-40}}
.subt{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:88%;padding:6px 12px;border-radius:6px;background:rgba(11,37,69,.86);color:#fff;font-size:13.5px;line-height:1.35;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
.subt.on{opacity:1}
.cap{min-height:64px;margin-top:8px;padding:8px 12px;border-left:3px solid var(--blue);background:var(--panel);border-radius:0 6px 6px 0;transition:border-color .4s}
.cap > b{display:block;font-size:14px;margin-bottom:2px}
.cap span{color:var(--ink2);font-size:13.5px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ctl button{height:30px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink);font:600 13px "Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;white-space:nowrap}
.ctl button:hover,.ctl button:focus-visible{border-color:var(--blue);outline:none;color:var(--blue)}
.ctl button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.ctl button.pri:hover{color:#fff;background:var(--blue);border-color:var(--blue)}
.ctl button.on{background:var(--blueL);border-color:var(--blue);color:var(--blue)}
.bar{position:relative;flex:1;min-width:140px;height:22px;cursor:pointer}
.bar .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.bar .fi{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--blue);width:0}
.bar i{position:absolute;top:6px;width:2px;height:10px;background:#fff;border-left:1px solid #B3B9C4}
.bar .kn{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--navy);box-shadow:0 0 0 3px rgba(12,102,228,.18)}
.tm{font-size:12px;color:var(--mute);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.foot{margin-top:6px;font-size:11.5px;color:var(--mute)}
.record .ctl{display:none}
@media (prefers-reduced-motion: reduce){#cam,.r,.hl{transition:none!important}*{animation:none!important}}
</style>
<style>
.e{fill:none;stroke:#8590A2;stroke-width:1.5}
.ea{fill:none;stroke:var(--amber);stroke-width:1.6;stroke-dasharray:6 4;animation:dash 1.4s linear infinite}
.eg{fill:none;stroke:var(--teal);stroke-width:1.6;stroke-dasharray:6 4;animation:dash 1.4s linear infinite}
.lbl{font-size:10.5px;fill:var(--ink2)} .lbl.b{font-weight:700;fill:var(--ink)} .lbl.a{fill:var(--amber)} .lbl.g{fill:var(--teal)} .lbl.r2{fill:var(--red)} .lbl.bl{fill:var(--blue)}
.lbl.m{text-anchor:middle} .lbl.e2{text-anchor:end}
.box rect{fill:#fff;stroke:var(--line);stroke-width:1.3}
.s0 .g0,.s1 .g1,.s2 .g2,.s3 .g3,.s4 .g4{opacity:1;transform:none}

<script>window.Player = function (o) {
  const $ = (id) => document.getElementById(id);
  const root = $("stage"), cam = $("cam"), cap = $("cap"), bar = $("bar"), fi = $("fi"), kn = $("kn");

  if (record) document.body.classList.add("record");

  const T = window.TIMING && window.TIMING.starts ? window.TIMING : (() => {
    const a = []; let t = 0.6;
    steps.forEach((s) => { a.push(t); t += est(s); });
    return { starts: a, total: t + 1.6 };
  })();
  const hasAudio = !!(au && au.getAttribute("src"));
  let t = 0, playing = false, userPaused = false, mode = "silent", cur = -1, last = 0, raf = [], holdUntil = 0, cc = true;
  let pref = false, activated = false, inView = false;
  const tell = (on) => { if (!record) try { parent.postMessage({ snagenticSound: on }, "*"); } catch (_) {} };
  T.starts.forEach((s, k) => {
    if (k === 0) return;
    const i = document.createElement("i"); i.style.left = (s / T.total) * 100 + "%"; bar.appendChild(i);
  });
  if (!hasAudio) { bListen.style.display = "none"; bCC.style.display = "none"; }
  const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  function camTo(c) {
    if (!cam) return;
    const [s, cx, cy] = c || [1, VB[0] / 2, VB[1] / 2];
    let tx = VB[0] / 2 - s * cx, ty = VB[1] / 2 - s * cy;

    if (s <= 1.001) return c;
    const M = 14, sel = (j) => ".g" + j;
    const bb = (e) => { try { const b = e.getBBox(); return b.width || b.height ? { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height } : null; } catch (_) { return null; } };
    const uni = (a, b) => !a ? b : !b ? a : { x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) };
    let B = null;
    cam.querySelectorAll(sel(k)).forEach((e) => { B = uni(B, bb(e)); });
    const vis = [];
    cam.querySelectorAll(Array.from({ length: k + 1 }, (_, j) => sel(j)).join(",")).forEach((g) => {

    if (steps[k].on && !reduce) steps[k].on();

  const idx = (x) => { let k = 0; for (let j = 0; j < N; j++) if (x >= T.starts[j]) k = j; return k; };
  function draw() { const p = (t / T.total) * 100; fi.style.width = p + "%"; kn.style.left = p + "%"; tm.textContent = fmt(t) + " / " + fmt(T.total); }
  function seek(x) { t = Math.max(0, Math.min(T.total - 0.05, x)); if (mode === "audio") au.currentTime = t; const k = idx(t); if (k !== cur) apply(k); draw(); }
  function setPlay(v) {
    playing = v; bPlay.textContent = v ? "\u275A\u275A" : "\u25B6"; bPlay.title = v ? "Pause (Space)" : "Play (Space)";
    if (mode === "audio") { if (v) au.play().catch(() => { stopAudio(false); setPlay(true); }); else au.pause(); }
    if (hasAudio && mode !== "audio") { bPlay.textContent = "\u25B6"; bPlay.title = "Play with sound (Space)"; }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!playing) return;
    if (mode === "audio") { t = au.currentTime; if (au.ended || t >= T.total - 0.02) stopAudio(true); }
    else if (record) { t += dt; if (t >= T.total) { t = T.total; playing = false; window.snagenticPlayer.done = true; } }
    else { if (now < holdUntil) return; t += dt; if (t >= T.total) { holdUntil = now + 2600; t = 0; apply(0); } }
    const k = idx(t); if (k !== cur) apply(k); draw();
  }
  function startAudio() { mode = "audio"; bListen.classList.add("on"); bListen.textContent = "\u{1f507} Turn sound off"; bListen.title = "Turn sound off (M)"; userPaused = false; au.currentTime = 0; t = 0; apply(0); setPlay(true); }
  function stopAudio(ended) {
    au.pause(); mode = "silent"; bListen.classList.remove("on"); bListen.textContent = "\u{1f50a} Listen with sound"; bListen.title = "Restart with sound (M)";
    sub.classList.remove("on"); root.classList.remove("audio");
    if (ended) { setPlay(false); userPaused = true; }
  }
  // The main button always leads to narration: silent, it plays with sound from here; narrated, it
  // pauses.
  function playButton() {
    if (hasAudio && mode !== "audio") { mode = "audio"; au.currentTime = t; userPaused = false; apply(cur); setPlay(true); markOn(); tell(true); return; }
    userPaused = playing; setPlay(!playing);
  }
  const markOn = () => { bListen.classList.add("on"); bListen.textContent = "\u{1f507} Turn sound off"; bListen.title = "Turn sound off (M)"; };
  bListen.onclick = () => { if (mode === "audio") { stopAudio(false); tell(false); } else { startAudio(); tell(true); } };
  bPlay.onclick = playButton;
  root.addEventListener("click", playButton);
  if (!record) addEventListener("message", (e) => {
    const d = e.data || {};
    if (typeof d.snagenticSoundPref === "boolean") pref = d.snagenticSoundPref;
    if (d.snagenticActivate && !activated) { activated = true; if (pref && hasAudio && inView && mode !== "audio" && !userPaused) startAudio(); }
  });
  bCC.onclick = () => { cc = !cc; bCC.classList.toggle("on", cc); sub.classList.toggle("on", mode === "audio" && cc && !!steps[cur].sub); };
  $("prev").onclick = () => seek(T.starts[Math.max(0, cur - (t - T.starts[cur] > 1.2 ? 0 : 1))] + 0.01);
  $("next").onclick = () => seek(T.starts[Math.min(N - 1, cur + 1)] + 0.01);
  bar.onclick = (e) => { const r = bar.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * T.total); };
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") { e.preventDefault(); bPlay.click(); }
    else if (e.key === "ArrowRight") $("next").click();
    else if (e.key === "ArrowLeft") $("prev").click();
    else if (e.key === "m" || e.key === "M") bListen.click();
    else if (e.key === "c" || e.key === "C") bCC.click();
  });
  window.flow = function (tok, path, ms, delay, loop) {
    const e = $(tok), p = $(path);
    if (!e || !p) return;
    const L = p.getTotalLength(), st = performance.now() + (delay || 0);
    const f = (now) => {
      const u = (now - st) / ms;
      if (u < 0) { raf.push(requestAnimationFrame(f)); return; }
      const v = loop ? u % 1 : Math.min(1, u);
      const q = p.getPointAtLength(L * (v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2));
      e.setAttribute("cx", q.x); e.setAttribute("cy", q.y);
      e.style.opacity = loop ? (v < 0.08 ? v / 0.08 : v > 0.92 ? (1 - v) / 0.08 : 1) : 1;
      if (loop || u < 1) raf.push(requestAnimationFrame(f));
    };
    raf.push(requestAnimationFrame(f));
  };
  if (record) { apply(0); draw(); }
  else if (reduce) { apply(N - 1); t = T.total; draw(); }
  else {
    apply(0); draw();
    new IntersectionObserver((es) => es.forEach((en) => {
      const visible = en.isIntersecting && en.intersectionRatio >= 0.35;
      inView = visible;
      if (visible && !userPaused && !playing) { if (pref && activated && hasAudio) startAudio(); else setPlay(true); }
      if (!visible && playing) setPlay(false);
    }), { threshold: [0, 0.35, 0.6] }).observe(root);
  }
  requestAnimationFrame((n) => { last = n; frame(n); });
  const wrap = document.querySelector(".wrap");
  const postH = () => { try { parent.postMessage({ snagenticAnimH: Math.ceil(wrap.getBoundingClientRect().height) + 6 }, "*"); } catch (_) {} };
  addEventListener("load", postH); addEventListener("resize", postH); new ResizeObserver(postH).observe(wrap);
  window.snagenticPlayer = {
    total: T.total, starts: T.starts, done: false,
    start: () => { t = 0; apply(0); draw(); setPlay(true); return Date.now() / 1000; },
  };
};
