default_value: "<style> p { margin: 0; } .resources-header { color: rgb(var(--now-color_text--primary, 21, 25, 32)); font-weight: var(--now-heading--title-secondary--font-weight, 600); font-size: var(--now-global-font-size--xl, 24px); line-height: 29px; margin: 0 0 var(--now-global-space--md, 0.75rem) 0; font-family: var(--now-font-family, 'Lato'); } .resources-content { color: rgb(var(--now-color_text--tertiary, 69, 77, 91)); font-size: var(--now-global-font-size--md, 16px); line-height: 19px; margin: 0 0 var(--now-global-space--xl, 1.5rem) 0; font-family: var(--now-font-family, 'Lato'); } a { text-decoration: none; font-size: var(--now-global-font-size--md, 16px); line-height: 19px; font-family: var(--now-font-family, 'Lato'); }</style><div><h2 class='resources-header'>How do you choose which apps to install?</h2><p class='resources-content'>To guide your progress, we group apps into 4 tracks: build a foundation, enhance the experience, optimize the functionality, and add advanced features. Think of these as crawl, walk, run, and fly phases.</p><p class='resources-content'>Each track builds on preceding ones, which helps you expand and scale your approach. The suggested sequence is a starting point. Each step does NOT necessarily need to be fully completed before initiating a subsequent step. What you need and what you're ready for should also guide your installations.</p></div><div><h2 class='resources-header'>Why are these apps recommended?</h2><p class='resources-content'>Within each track, you'll see recommended apps and optional apps. Recommended apps will help you make the most progress toward the adoption blueprint. They're based on what you've already installed and your overall use of what is available.</p></div><div><h2 class='resources-header'>When should I check my subscription?</h2><p class='resources-content'>If you see&nbsp;<em>Check subscription</em>&nbsp;next to a listed app, go to the subscription management module in production to confirm your entitlement to that app before installing it.</p></div>"
