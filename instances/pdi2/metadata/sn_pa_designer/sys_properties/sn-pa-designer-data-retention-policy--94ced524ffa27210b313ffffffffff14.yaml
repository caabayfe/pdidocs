description: |-
  The number of days to wait after a sys_pd_context has reached a terminal state (see below) before automatically archiving via scheduled script execution. A value of 0 will result in archival taking place at the next scheduled script execution. The default value is set to 6 weeks. Since archiving results in sys_pd_context_log records being deleted, this value can be increased for debugging purposes or for customizing a slower archiving schedule.

  Terminal states related to this policy include: COMPLETE, CANCELLED, and SKIPPED. ERROR state is not automatically archived, but can be done so manually using sys_pd_context UI Actions.

  Requires playbook.admin role to write new values.
