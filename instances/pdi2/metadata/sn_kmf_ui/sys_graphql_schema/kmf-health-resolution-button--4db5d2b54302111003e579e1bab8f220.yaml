name: KMF Health Resolution Button
namespace: resolution
paths: KMFComponent:health,KMFComponent:warnings,KMFComponentEjbca:children,KMFComponentEjbca:health,KMFComponentEjbca:warnings,KMFComponentInstancePKI:children,KMFComponentInstancePKI:health,KMFComponentInstancePKI:warnings,KMFComponentVault:children,KMFComponentVault:health,KMFComponentVault:warnings,KMFHealth:children,KMFHealth:date,KMFHealth:health,KMFHealth:instanceType,KMFHealth:warnings,KMFRootComponent:EJBCA_PKI,KMFRootComponent:FILE_KEY_STORE,KMFRootComponent:GLIDE_ENCRYPTER,KMFRootComponent:IHMAC,KMFRootComponent:IKEK,KMFRootComponent:INSTANCE_PKI,KMFRootComponent:KEY_SECURE,KMFRootComponent:VAULT_PKI,KMFRootComponentEjbca:IAEK,KMFRootComponentEjbca:ISK,KMFRootComponentEjbca:LDAP,KMFRootComponentInstancePKI:CRL_ENDPOINT,KMFRootComponentInstancePKI:ICSK,KMFRootComponentInstancePKI:ISSUING_CERTIFICATE,KMFRootComponentVault:IAEK,KMFRootComponentVault:ISK,KMFRootComponentVault:VAULT_CONNECTIVITY,Query:resolve
requires_acl_authorization: 'true'
requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
      query: Query
  }

  type Query {
     resolve: KMFHealth
  }

  type KMFHealth {
  	# Overall health.
  	health: KMFHealthStatus!
  	warnings: [String]
  	# Type of instance this check is running on.
  	instanceType: KMFInstanceType!
  	# Date at which the check was run.
  	date: String!
  	# Components
  	children: KMFRootComponent!
  }

  type KMFRootComponent {
  	KEY_SECURE: KMFComponent!
  	FILE_KEY_STORE: KMFComponent!
  	GLIDE_ENCRYPTER: KMFComponent!
  	IKEK: KMFComponent!
  	IHMAC: KMFComponent!
  	EJBCA_PKI: KMFComponentEjbca!
  	VAULT_PKI: KMFComponentVault!
  	INSTANCE_PKI: KMFComponentInstancePKI!
  }

  type KMFComponentEjbca {
  	# Component health.
  	health: KMFHealthStatus!
  	warnings: [String]
  	children: KMFRootComponentEjbca
  }

  type KMFRootComponentEjbca {
  	LDAP: KMFComponent!
  	IAEK: KMFComponent!
  	ISK: KMFComponent!
  }

  type KMFComponentVault {
  	# Component health.
  	health: KMFHealthStatus!
  	warnings: [String]
  	children: KMFRootComponentVault
  }

  type KMFRootComponentVault {
  	VAULT_CONNECTIVITY: KMFComponent!
  	IAEK: KMFComponent!
  	ISK: KMFComponent!
  }

  type KMFComponentInstancePKI {
  	# Component health.
  	health: KMFHealthStatus!
  	warnings: [String]
  	children: KMFRootComponentInstancePKI
  }

  type KMFRootComponentInstancePKI {
  	ISSUING_CERTIFICATE: KMFComponent!
  	ICSK: KMFComponent!
  	CRL_ENDPOINT: KMFComponent!
  }

  type KMFComponent {
  	# Component health.
  	health: KMFHealthStatus!
  	warnings: [String]
  }

  enum KMFHealthStatus {
  	RED,
  	YELLOW,
  	GREEN,
  	GRAY
  }

  enum KMFInstanceType {
  	DEVELOPER,
  	THUNDERDOME,
  	DATACENTER,
  	SELF_HOSTED,
  	TEST_INSTANCE,
  	UNKNOWN
  }
sys_name: KMF Health Resolution Button
sys_policy: ''
type_names: ''
