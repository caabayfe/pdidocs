description: |-
  Script to validate nowassist va application.
  The following validations are performed:
  * Validate plugins
  * Validate that now assist is enabled via sn_nowassist_settings record
  * Standard capalbility validations:
    * Validate that the capability exists in sys_one_extend_capability table
    * Validate that one definition config in sys_one_extend_definition_config table is set as 'default'
    * Validate that generative AI capability exists is sys_generative_ai_config table
  * Validated capabilities:
    * VA Skill Search
      * Validate connectivity
      * Validate request/response
      * Validate that a skill has been returned in the response
    * VA Skill Follow-up
      * Validate connectivity
      * Validate request/response
name: Now Assist VA application
