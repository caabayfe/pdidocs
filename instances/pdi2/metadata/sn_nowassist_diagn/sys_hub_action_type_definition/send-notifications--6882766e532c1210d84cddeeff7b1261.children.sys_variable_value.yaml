  value: |-
    (function execute(inputs, outputs) {
        const notificationUtil = new sn_nowassist_diagn.MonitoringNotificationUtil(inputs.execution);
        const configs = JSON.parse(inputs.configs);
        const timeRange = `sys_created_on>=${inputs.startingFrom}^sys_created_on<${inputs.endingAt}`;
        const matchedConfigs = notificationUtil.evaluateConditionsFor(inputs.log, configs, inputs.startingFrom, inputs.endingAt);
        matchedConfigs.forEach((matchedConfig) => {
            const count = matchedConfig.matches.length;
            if (count === 1) {
                matchedConfig.url = notificationUtil.constructURL({
                    type: MonitoringNotificationUtil.URL_TYPE_RECORD,
                    sysId: matchedConfig.matches[0],
                    table: inputs.log
                });
            } else {
                matchedConfig.url = notificationUtil.constructURL({
                    type: MonitoringNotificationUtil.URL_TYPE_LIST,
                    query: matchedConfig.condition + '^' + timeRange,
                    table: inputs.log
                });
            }
            matchedConfig.recipients.forEach((recipient) => {
                notificationUtil.createNotificationRecord(inputs.execution, matchedConfig.configId, matchedConfig.url, matchedConfig.subject, matchedConfig.message, recipient.type, recipient.user);
            });
        });
    })(inputs, outputs);
