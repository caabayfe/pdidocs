<!-- Loading state -->
<div ng-if="c.loading" class="auth-container">
    <div class="auth-card">
        <div class="auth-spinner"></div>
        <p class="auth-message">Checking authorization status...</p>
    </div>
</div>

<!-- Authorization required -->
<div ng-if="!c.loading && !c.data.tokenFound" class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">
            <span class="glyphicon glyphicon-lock"></span>
        </div>
        <h3 class="auth-title">Authorization Required</h3>
        <p class="auth-message">Click Proceed to authorize access, or Cancel to decline.</p>
        <div class="auth-actions">
            <button class="auth-btn auth-btn-secondary" ng-click="c.onCancel()">
                <span class="glyphicon glyphicon-remove"></span> Cancel
            </button>
            <button class="auth-btn" ng-click="c.openAuthWindow()" ng-disabled="!c.data.redirectUrl">
                <span class="glyphicon glyphicon-log-in"></span> Proceed
            </button>
        </div>
    </div>
</div>

<!-- Authorization successful -->
<div ng-if="!c.loading && c.data.tokenFound" class="auth-container">
    <div class="auth-card">
        <div class="auth-icon success">
            <span class="glyphicon glyphicon-ok-circle"></span>
        </div>
        <h3 class="auth-title">Authorization Successful</h3>
        <p class="auth-message">You may close this window.</p>
    </div>
</div>
