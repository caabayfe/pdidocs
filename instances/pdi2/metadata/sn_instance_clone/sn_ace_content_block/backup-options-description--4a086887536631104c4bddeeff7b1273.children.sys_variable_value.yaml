  value: '{"html":"<p>Specifies which backup the clone request will use. Please carefully review the important notes below:<br><br>Most recent: clone will use the latest nightly backup, <u>unless</u> an upgrade or a major change to the instance occurred.<br><br>On-demand backup: a new backup will begin at your specified clone start time. Your clone will only begin <u>after</u> the backup completes, pushing back the time at which the cloning process can start.<br></p>"}'
