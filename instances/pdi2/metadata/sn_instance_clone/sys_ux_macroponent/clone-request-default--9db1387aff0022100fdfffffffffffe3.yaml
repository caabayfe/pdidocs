required_translations: |-
  [ {
    "message" : "<div>\n<div>\n<p>Determines the clone frequency if the clone is recurring.</p>\n</div>\n</div>\n<div>\n<div>\n<div data-testid=\"sn-styleable-container\">\n<div>\n<div>&nbsp;</div>\n</div>\n</div>\n</div>\n</div>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<hr>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>A new backup will begin at your specified clone start time.</p>\n<p>Note: Your clone will only begin after the backup completes, pushing back the time at which the cloning process can start.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Excludes all tables listed on the Exclusion list, including child tables. When excluding tables, your target instance will still have the same table schema and hierarchy (i.e. empty usable tables) as the source instance.</p>\n<p>Note: ServiceNow out-of-the-box table exclusions will still be excluded and are not affected by this setting.</p>\n<p>Disable this setting if you need the data from your excluded tables (full clone). Recommended for upgrade or deployment testing.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Limits the number of days of historical data for Task and its child tables (e.g. Incident, Problem, Change) for this clone.</p>\n<p>Note: Selecting 'Last 90 days' can <span style=\"text-decoration: underline;\">increase</span> clone time, due to the post-clone deletion process of records older than 90 days.</p>\n<p>To reduce clone time, consider excluding large tables altogether. When excluding tables, your target instance will have the same table schema and hierarchy (i.e. empty usable tables) as the source instance.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Preserves in-progress update sets in the global application scope. The default is to not preserve update sets.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Preserves the theme of the target instance. The default setting is to preserve the theme.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Prevents the cloning of audit and log records from the source instance. This will create empty but usable audit and log tables on the target instance.</p>\n<p>Note: If you exclude audit and log data from your clone, the Activity Stream for records will not match the source instance. This is because the Activity Stream relies on the audit table to generate the history.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Prevents the cloning of files (incl. videos, images, documents, zip files) from the sys_attachment table.</p>\n<p>Note: ServiceNow out-of-the-box attachments and other system-relevant files (e.g. catalog item images, theming images, icons) are not affected by this setting.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Specifies which backup the clone request will use. Please carefully review the important notes below:<br>Most recent: clone will use the latest nightly backup, <span style=\"text-decoration: underline;\">unless</span> an upgrade or a major change to the instance occurred.<br>On-demand backup: a new backup will begin at your specified clone start time. Your clone will only begin <span style=\"text-decoration: underline;\">after</span> the backup completes, pushing back the time at which the cloning process can start.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Total number of clones</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Troubleshooting:</p>\n<ul>\n<li>Ensure you have the clone_admin role on both source and target instances</li>\n<li>If you're adding an instance, ensure you have the oauth_admin role on the target instance</li>\n</ul>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Use the same backup as another clone request</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>You have successfully submitted the clone request.</p>",
    "code" : "",
    "comment" : ""
