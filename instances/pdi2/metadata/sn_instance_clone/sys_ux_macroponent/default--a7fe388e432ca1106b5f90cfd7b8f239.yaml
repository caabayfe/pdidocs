    "message" : "<p>Confirm which of your instances you want to include in the Multi-Instance View for clone activity.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Congratulations</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Each instance will establish 'trust' with the primary instance and relay its clone data.</p>\n<p>&nbsp;</p>",
