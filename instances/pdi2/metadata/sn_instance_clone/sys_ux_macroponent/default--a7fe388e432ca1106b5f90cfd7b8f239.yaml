    "message" : "<p><a href=\"/now/clone/ui/configurations\">Click here</a> to turn off multi-instance view.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Confirm where you want to view your consolidated clone dashboard.</p>",
    "code" : "",
    "comment" : ""
