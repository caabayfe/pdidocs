required_translations: '[{"message":"<p>It is a new, streamlined user experience for cloning. We&#39;ve brought all your existing clone profiles, exclusions, preservers and scripts into the new console. We&#39;ve simplified the request page, added an on-demand backup option, and provided more visibility into clone progress. Clones from the console are stored on a new table. To learn more about the changes click <a href=\"https://support.servicenow.com/kb?id&#61;kb_article_view&amp;sysparm_article&#61;KB1425858\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">here</a>.</p>","comment":""},{"message":"<p>Rollbacks remove the latest cloning updates on a cloning target. You can only roll back the latest cloning updates. Rollbacks must occur no more than seven days after the cloning or two if instance is sharded.  From the dashboard, click on the tile for the clone you want to rollback and you will see the option in the upper right hand corner of the page.</p>","comment":""},{"message":"<p>Clone times vary significantly, with the largest contributor to clone durations being the database size of the source instance.</p>","comment":""},{"message":"What is cloning?","comment":""},{"message":"How much time does it take to clone?","comment":""},{"message":"What is the Clone Admin Console?","comment":""},{"message":"FAQs","comment":""},{"message":"What is a clone profile?","comment":""},{"message":"FAQs accordion","comment":""},{"message":"<p>From the dashboard, click on the tile for the clone you want to cancel and you will see the option in the upper right hand corner of the page.</p>","comment":""},{"message":"<p>A clone profile can be used as a template for different use cases.  For example if you are cloning from production to UAT, you may want to keep more data, however if you are cloning to a development environment you might exclude tables.</p>","comment":""},{"message":"How to cancel clone?","comment":""},{"message":"Find detailed answers to these and other questions in this <a href=\"https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0715621\" target=\"_blank\" aria-label=\"Clone FAQs Article opens new tab\" >Clone FAQs Article.</a>","comment":""},{"message":"<p>Use the System Clone application to copy everything in a database from one instance to another. <br /><br /> Cloning is typically used to copy a production instance to a pre-production instance to test changes. Cloning data comes from the most recent, nightly backup. </p>","comment":""},{"message":"Get started with cloning","comment":""},{"message":"How to rollback a clone?","comment":""}]'
