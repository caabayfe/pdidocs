required_translations: '[{"message":"Reset to defaults","comment":""},{"message":"reset form","comment":""},{"message":"Exclusions","comment":""},{"message":"Target Instance","comment":""},{"message":"Add","comment":""},{"message":"add","comment":""},{"message":"Cancel","comment":""},{"message":"Exclude attachment data","comment":""},{"message":"Prevents the cloning of files (incl. videos, images, documents, zip files) from the sys_attachment table.<br><br>Note: ServiceNow out-of-the-box attachments and other system-relevant files (e.g. catalog item images, theming images, icons) are not affected by this setting.","comment":""},{"message":"Learn More","comment":""},{"message":"https://docs.servicenow.com/csh?topicname=t_StartAClone.html&version=latest","comment":""},{"message":"Accessible Label","comment":""},{"message":"Learn more","comment":""},{"message":"Open Docs","comment":""},{"message":"Apply On-demand Backup","comment":""},{"message":"A new backup will begin at your specified clone start time.<br><br>Note: Your clone will only begin after the backup completes, pushing back the time at which the cloning process can start.","comment":""},{"message":"https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0715621","comment":""},{"message":"Exclude audit and log data","comment":""},{"message":"Prevents the cloning of audit and log records from the source instance. This will create empty but usable audit and log tables on the target instance.<br><br>Note: If you exclude audit and log data from your clone, the Activity Stream for records will not match the source instance. This is because the Activity Stream relies on the audit table to generate the history.","comment":""},{"message":"<p>Backup options</p>","comment":""},{"message":"Duplicate","comment":""},{"message":"Delete Clone Profile?","comment":""},{"message":"Would you like to duplicate this profile?","comment":""},{"message":"Delete","comment":""},{"message":"Cleanup Scripts","comment":""},{"message":"Preserve theme","comment":""},{"message":"Preserves the theme of the target instance. The default setting is to preserve the theme.","comment":""},{"message":"Exclude tables specified in Exclusion list","comment":""},{"message":"Excludes all tables listed on the Exclusion list, including child tables. When excluding tables, your target instance will still have the same table schema and hierarchy (i.e. empty usable tables) as the source instance.<br><br>Note: ServiceNow out-of-the-box table exclusions will still be excluded and are not affected by this setting.<br><br>Disable this setting if you need the data from your excluded tables (full clone). Recommended for upgrade or deployment testing.","comment":""},{"message":"https://docs.servicenow.com/csh?topicname=t_ExcludeATableFromCloning.html&version=latest","comment":""},{"message":"Preservers","comment":""},{"message":"Clone Profile Name","comment":""},{"message":"delete","comment":""},{"message":"Update","comment":""},{"message":"update","comment":""},{"message":"User 1","comment":""},{"message":"user1@servicenow.com","comment":""},{"message":"User 2","comment":""},{"message":"user2@servicenow.com","comment":""},{"message":"User 3","comment":""},{"message":"user3@servicenow.com","comment":""},{"message":"<p>Specifies which backup the clone request will use. Please carefully review the important notes below:<br><br>Use most recent: <u>unless</u> an upgrade or a major change to the instance occurred, clone will use the latest nightly backup.<br><br>On-demand backup: a new backup will begin at your specified clone start time. Your clone will only begin <u>after</u> the backup completes, pushing back the time at which the cloning process can start.</p>","comment":""},{"message":"No. of days of In-progress Global Update Sets to be preserved","comment":""},{"message":"Preserves in-progress update sets in the global application scope. The default is to not preserve update sets.","comment":""},{"message":"Optional Settings","comment":""},{"message":"Default","comment":""},{"message":"Amount of data copied from the Task table","comment":""},{"message":"Limits the number of days of historical data for Task and its child tables (e.g. Incident, Problem, Change) for this clone.<br><br>Note: Selecting ''Last 90 days'' can <u>increase</u> clone time, due to the post-clone deletion process of records older than 90 days.<br><br>To reduce clone time, consider excluding large tables altogether. When excluding tables, your target instance will have the same table schema and hierarchy (i.e. empty usable tables) as the source instance.","comment":""},{"message":"Ok","comment":""},{"message":"Select ''Ok'' to proceed","comment":""},{"message":"General","comment":""},{"message":"Enter a label","comment":""},{"message":"Definitions","comment":""}]'
