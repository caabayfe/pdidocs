required_translations: '[{"message":"Review the details of your clone request before submitting.","comment":""},{"message":"OK","comment":""},{"message":"Yes","comment":""},{"message":"0","comment":""},{"message":"Definitions","comment":""},{"message":"Clone Scheduled Start Time","comment":""},{"message":"Warning!","comment":""},{"message":"","comment":""},{"message":"User 1","comment":""},{"message":"user1@servicenow.com","comment":""},{"message":"User 2","comment":""},{"message":"user2@servicenow.com","comment":""},{"message":"User 3","comment":""},{"message":"user3@servicenow.com","comment":""},{"message":"${item.value}","comment":""},{"message":"${blockcontext.hasCustomPreserver.messages.msg1}","comment":""},{"message":"Clone request","comment":""},{"message":"Amount of data copied from the Task table","comment":""},{"message":"Limits the number of days of historical data for Task and its child tables (e.g. Incident, Problem, Change) for this clone.<br><br>Note: Selecting ''Last 90 days'' can <u>increase</u> clone time, due to the post-clone deletion process of records older than 90 days.<br><br>To reduce clone time, consider excluding large tables altogether. When excluding tables, your target instance will have the same table schema and hierarchy (i.e. empty usable tables) as the source instance.","comment":""},{"message":"Learn More","comment":""},{"message":"https://docs.servicenow.com/csh?topicname=t_StartAClone.html&version=latest","comment":""},{"message":"${blockcontext.highlightText}","comment":""},{"message":"${blockcontext.footer}","comment":""},{"message":"Accessible Label","comment":""},{"message":"Learn more","comment":""},{"message":"Open Docs","comment":""},{"message":"${blockcontext.selectItems}","comment":""},{"message":"<p>${blockcontext.description}</p>","comment":""},{"message":"${blockcontext.title}","comment":""},{"message":"Other settings","comment":""},{"message":"Backup selection","comment":""},{"message":"No. of Occurrences","comment":""},{"message":"<p>Total number of clones</p>","comment":""},{"message":"Clone profile","comment":""},{"message":"Lock settings at time of clone request","comment":""},{"message":" ","comment":""},{"message":"Authenticate","comment":""},{"message":"Authenticate target instance","comment":""},{"message":"Exclusions","comment":""},{"message":"Prev","comment":""},{"message":"Apply On-demand Backup","comment":""},{"message":"A new backup will begin at your specified clone start time.<br><br>Note: Your clone will only begin after the backup completes, pushing back the time at which the cloning process can start.","comment":""},{"message":"https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0715621","comment":""},{"message":"<p>Specifies which backup the clone request will use. Please carefully review the important notes below:<br><br>Most recent: clone will use the latest nightly backup, <u>unless</u> an upgrade or a major change to the instance occurred.<br><br>On-demand backup: a new backup will begin at your specified clone start time. Your clone will only begin <u>after</u> the backup completes, pushing back the time at which the cloning process can start.<br></p>","comment":""},{"message":"<p></p>","comment":""},{"message":"<p>The world works with ServiceNow</p>","comment":""},{"message":"${blockcontext.users}","comment":""},{"message":"${blockcontext.selectedUsers}","comment":""},{"message":"Email updates about this clone","comment":""},{"message":"Source Instance","comment":""},{"message":"Target Instance","comment":""},{"message":"Continue","comment":""},{"message":"<p>Use the same backup as another clone request</p>","comment":""},{"message":"<p>------</p>","comment":""},{"message":"Any update sets, development work, and data in the target instance will be overwritten. Do you want to proceed?","comment":""},{"message":"Cancel","comment":""},{"message":"Proceed","comment":""},{"message":"Clone Request Success","comment":""},{"message":"Username","comment":""},{"message":"Reset to defaults","comment":""},{"message":"${blockcontext.sourceInstances}","comment":""},{"message":"Note:  This form is not for creating a new instance; it is to add your existing instance for use with clone.","comment":""},{"message":"Enter a label","comment":""},{"message":"General","comment":""},{"message":"Preservers","comment":""},{"message":"Email Upon Completion","comment":""},{"message":"Password","comment":""},{"message":"Exclude tables specified in Exclusion List","comment":""},{"message":"Exclude audit and log data","comment":""},{"message":"Exclude attachment data","comment":""},{"message":"Clone Request error","comment":""},{"message":"Cleanup Scripts","comment":""},{"message":"<p>Backup options</p>","comment":""},{"message":"Clone Profile","comment":""},{"message":"${blockcontext.cloneProfiles}","comment":""},{"message":"${blockcontext.hasCustomPreserver.messages.msg2}","comment":""},{"message":"Basic Details","comment":""},{"message":"No. of days of In-progress Global Update Sets to be preserved","comment":""},{"message":"Preserves in-progress update sets in the global application scope. The default is to not preserve update sets.","comment":""},{"message":"Add New Clone Instance","comment":""},{"message":"Prevents the cloning of files (incl. videos, images, documents, zip files) from the sys_attachment table.<br><br>Note: ServiceNow out-of-the-box attachments and other system-relevant files (e.g. catalog item images, theming images, icons) are not affected by this setting.","comment":""},{"message":"Exclusion settings","comment":""},{"message":"Clone request summary","comment":""},{"message":"Preserver settings","comment":""},{"message":"Lock the settings and options for your clone profile at the time of the clone request. Any subsequent changes to the clone profile, regardless of when the clone runs, will not apply to the request.","comment":""},{"message":"${blockcontext.targetInstances}","comment":""},{"message":"<div style=\"margin-left: 0.15rem\">${blockcontext.hasCustomPreserver.messages.msg3}</div>","comment":""},{"message":"Preserve theme","comment":""},{"message":"Preserves the theme of the target instance. The default setting is to preserve the theme.","comment":""},{"message":"Preserver Theme","comment":""},{"message":"Preserve in Progress Global Update Sets","comment":""},{"message":"Optional Settings","comment":""},{"message":"Calendar","comment":""},{"message":"<p>Determines the clone frequency if the clone is recurring.</p>","comment":""},{"message":"External email address(es)","comment":""},{"message":"${blockcontext.frequencyCard.estimatedEndDateLabel}","comment":""},{"message":"Clone will use the start date and time from the top of the page as the first occurrence.","comment":""},{"message":"Confirm and Submit Clone Request","comment":""},{"message":"To clone to an instance, you must have admin privileges on the target instance.  Single sign on cannot be used to login to target.","comment":""},{"message":"Prevents the cloning of audit and log records from the source instance. This will create empty but usable audit and log tables on the target instance.<br><br>Note: If you exclude audit and log data from your clone, the Activity Stream for records will not match the source instance. This is because the Activity Stream relies on the audit table to generate the history.","comment":""},{"message":"<p>Clone Frequency</p>","comment":""},{"message":"Instance URL","comment":""},{"message":"<p>You have successfully submitted the clone request.</p>","comment":""},{"message":" Authenticate Target","comment":""},{"message":"Exclude tables specified in Exclusion list","comment":""},{"message":"Excludes all tables listed on the Exclusion list, including child tables. When excluding tables, your target instance will still have the same table schema and hierarchy (i.e. empty usable tables) as the source instance.<br><br>Note: ServiceNow out-of-the-box table exclusions will still be excluded and are not affected by this setting.<br><br>Disable this setting if you need the data from your excluded tables (full clone). Recommended for upgrade or deployment testing.","comment":""},{"message":"https://docs.servicenow.com/csh?topicname=t_ExcludeATableFromCloning.html&version=latest","comment":""},{"message":"Add","comment":""}]'
