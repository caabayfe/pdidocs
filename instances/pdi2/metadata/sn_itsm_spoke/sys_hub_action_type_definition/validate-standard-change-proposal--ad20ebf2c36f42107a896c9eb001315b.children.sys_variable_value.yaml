    (function execute(inputs, outputs) {
    	var utils = new global.StdChangeUtils();
        if (inputs.proposal.proposal_type != utils.PROPOSAL_TYPE_RETIRE) {
    	    var result = utils.validateProposal(inputs.proposal, true /* Show errors */, true /* Validate tasks */);
    	    if (!result) {
    		    var link = '<a href="std_change_proposal.do?sys_id=' + current.getUniqueValue() + '"><b>' + current.number + '<b></a>';
    		    gs.addErrorMessage(gs.getMessage('Cannot approve the Proposal {0}, validation has failed.', link));
    	    }
    		outputs.answer = result;
        } else
    		outputs.answer = true;
    })(inputs, outputs);
