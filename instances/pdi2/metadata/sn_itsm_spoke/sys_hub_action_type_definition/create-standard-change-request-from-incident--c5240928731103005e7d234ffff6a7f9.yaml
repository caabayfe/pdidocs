description: |-
  This action is a representative example and is not intended to be functional. Standard Change Requests must be initiated from a published Standard Change Template exposed in Service Catalog.<br/>
  Creates a Standard Change Request from the given Incident and Standard Change Template ID.<br/>
  The Short Description and Configuration Item fields are set based on given Incident values
  <p style='margin-top: 10px'>
  <b>Input:</b><br/>
  <em>Incident</em> - the incident record from which to create the change<br/>
  <em>Standard Change Template ID</em> - the SysId of the Standard Change Template to use to create the Standard Change Request<br/>
  <b>Output:</b><br/>
   The created Standard Change Request
  </p>
