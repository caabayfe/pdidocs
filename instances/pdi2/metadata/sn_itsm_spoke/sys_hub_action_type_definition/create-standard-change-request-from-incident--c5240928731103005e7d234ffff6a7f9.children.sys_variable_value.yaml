  value: |-
    (function execute(inputs, outputs) {
        outputs.error = false;

        if (!inputs.standard_change_template_id) {
            outputs.error_message = gs.getMessage('Standard Change Template id not provided');
            outputs.error = true;
            return;
        }

        var standardChangeTemplate = '';
        if (GlidePluginManager.isActive('com.snc.change_management.standard_change_catalog')) {
            standardChangeTemplate = global.StandardChangeTemplate.findById(inputs.standard_change_template_id);

            if (!standardChangeTemplate) {
                outputs.error_message = gs.getMessage('Standard Change Template not found');
                outputs.error = true;
                return;
            }
        }

        if (!inputs.incident_id) {
            outputs.error_message = gs.getMessage('Incident id not provided');
            outputs.error = true;
            return;
        }

        var incGr = new GlideRecordSecure('incident');
        if (!incGr.get(inputs.incident_id)) {
            outputs.error_message = gs.getMessage('Incident not found');
            outputs.error = true;
            return;
        }

        if (incGr.rfc) {
            outputs.error_message = gs.getMessage('Incident already associated to change {0}', incGr.rfc.getDisplayValue());
            outputs.error = true;
            return;
        }

        var changeProcess = global.StandardChangeProcess.newChangeProcess(standardChangeTemplate, {
            short_description: incGr.short_description,
            cmdb_ci: incGr.cmdb_ci
        });

        if (changeProcess.insert()) {
            var chgGr = changeProcess.getGlideRecord();
            outputs.record = chgGr.canRead() ? chgGr : null;
            outputs.standard_change_request = chgGr.getUniqueValue();
            incGr.setValue('rfc', outputs.standard_change_request);

            if (!incGr.update()) {
                outputs.error_message = gs.getMessage('Failed to associate change to incident');
                outputs.error = true;
            }

            return;
        }

        var errorMessage = gs.getMessage('Could not create Standard Change Request.');
        var lastErrorMessage = changeProcess.getGlideRecord().getLastErrorMessage();
        if (lastErrorMessage)
            errorMessage += ' ' + lastErrorMessage;

        outputs.error_message = errorMessage;
        outputs.error = true;

    })(inputs, outputs);
