<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	
	<div class="navbar navbar-default section_zero" style="margin-bottom: -1px !important;margin-left: 1px!important;">
			<div class="col-sm-4" style="font-size:13px;float:left;">
				<ul role="tablist" class="nav nav-segmented sn-tabs-basic">
					<li>
						<a tabIndex="0" href="#" id="dhx_prev_icon" aria-label="Previous" uib-tooltip="Previous" tooltip-append-to-body="true" tooltip-placement="bottom" tooltip-class="calendar_tooltip" onclick="gotoLastMonth()">
							<span class="icon-vcr-left"></span>
						</a>
					</li>
					<li id="today">
						<a tabIndex="0" href="#" id="dhx_today_icon" aria-label="Today" uib-tooltip="Today" tooltip-append-to-body="true" tooltip-placement="bottom" tooltip-class="calendar_tooltip" onclick="gotoCurrentDay()">
							<span>${gs.getMessage("Today")}</span>
						</a>
					</li>
					<li>
						<a tabIndex="0" href="#" id="dhx_next_icon" aria-label="Next" uib-tooltip="Next Month" tooltip-append-to-body="true" tooltip-placement="bottom" tooltip-class="calendar_tooltip" onclick="gotoNextMonth()">
							<span class="icon-vcr-right"></span>
						</a>
					</li>
				</ul>
			</div>
			
			<div class="col-sm-4" style="padding-top: 6px;font-weight: bold;font-size: 15px;"><center><span id="calenderMonthYearInfo"></span></center></div>
			
			<div class="col-sm-4 text-right">
				<ul role="tablist" class="nav nav-segmented sn-tabs-basic">
					<li id="day">
						<a tabIndex="0" href="#" aria-label="Day" uib-tooltip="Day" tooltip-append-to-body="true" tooltip-placement="bottom" tooltip-class="calendar_tooltip day_mode_tooltip" id="sn_dhtmlx_cal_day" aria-hidden="false" aria-disabled="false" aria-pressed="false" onclick="dailyClicked(this)">${gs.getMessage("Day")}
						</a>
					</li>
					<li id="week">
						<a tabIndex="0" href="#" aria-label="Week" uib-tooltip="Week" tooltip-append-to-body="true" tooltip-placement="bottom" tooltip-class="calendar_tooltip" id="sn_dhtmlx_cal_week" aria-hidden="false" aria-disabled="false" aria-pressed="false" onclick="weeklyClicked(this)">${gs.getMessage("Week")}</a>
					</li>
					<li class="active" id="month">
						<a tabIndex="0" href="#" aria-label="Month" uib-tooltip="Month" tooltip-append-to-body="true" tooltip-placement="bottom" tooltip-class="calendar_tooltip" id="sn_dhtmlx_cal_month" aria-hidden="false" aria-disabled="false" aria-pressed="true" onclick="monthlyClicked(this)">${gs.getMessage("Month")}</a>
					</li>
				</ul>
			</div>
	</div> 
	<iframe  id="schedule_calender_frame" src="show_schedule.do?sysparm_type=scheduled_installation_calender&amp;sysparm_include_view=monthly,daily,weekly" frameborder="0" style="overflow: hidden; height: 600px; width: 100%; position: absolute;"></iframe>
	
</j:jelly>
