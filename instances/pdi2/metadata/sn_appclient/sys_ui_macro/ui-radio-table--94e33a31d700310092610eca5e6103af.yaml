description: |-
  Radio button entry for UI Pages, implements being disabled as well as checked
  id = the id to use for this entry.  If omitted this will be <name>_<value>
  name = the name of the radio button GROUP
  value = the value to use for this button
  text = the text to show for this button
  chkdval = the value to be set as checked
  onchange = javascript to be performed when this entry is selected
