<p style="font-family: SourceSansProSemiBold;">The class attribute was added to the CI identifier which is not supported.</p>
<p>1. Navigate to <a title="CI Identifiers" href="/cmdb_identifier_list.do" target="_blank" rel="noopener noreferrer nofollow">CI Identifiers</a>.</p>
<p>2. Remove the class attribute from the CI Identifier for the table. </p>
<p>3. Click Retry Discovery.</p>
<p>For more information, refer to documentation on <a title="Identification engine error messages" href="/api/now/v1/context_doc_url/CSHelp:IDEngineErrorMsg" target="_blank" rel="noopener noreferrer nofollow">Identification engine error messages</a>.</p>
