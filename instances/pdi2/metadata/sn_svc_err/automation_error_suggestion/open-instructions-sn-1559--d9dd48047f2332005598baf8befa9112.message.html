<p style="font-family: SourceSansProSemiBold;">There are no containment or hosting rules defined for the dependent class.</p>
<p>1. Navigate to Metadata Editor.</p>
<p>2. Add containment or hosting rules for the dependent class.</p>
<p>3. Click Retry Discovery.</p>
<p>For more information, refer to documentation on <a title="Identification engine error messages" href="/api/now/v1/context_doc_url/CSHelp:IDEngineErrorMsg" target="_blank" rel="noopener noreferrer nofollow">Identification engine error messages</a>.</p>
