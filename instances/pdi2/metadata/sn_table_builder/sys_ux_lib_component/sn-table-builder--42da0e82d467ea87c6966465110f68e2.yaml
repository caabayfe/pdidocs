  Within the Now Platform, domains keep information confined to certain users or groups. However, you can inherit the domain form templates from other domains without needing access to specific record information.
  You can use these templates as-is for a specific view. You can also customize their fields and layout, but this will require you to create an override. An override allows you to make a custom configuration to a template that has been inherited from another domain.
  These overrides can apply to a section and a form, and any overrides you create will apply to the domain you're viewing in addition to any lower domains.
