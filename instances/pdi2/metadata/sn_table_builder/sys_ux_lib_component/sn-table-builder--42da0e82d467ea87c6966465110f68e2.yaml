  dot-walking a reference field
  Within the Now Platform, a field exists on only one table. So if the field gets updated, any changes are reflected everywhere that field is referenced.
  You can select one of the fields on a related table (known as “related fields”) by dot-walking from a reference field. Dot-walking involves going from a reference field to the referenced table for that field. Then, you can select a field from either the referenced table or a related table.
  Learn more
  You can dot-walk from any of the available reference fields.
