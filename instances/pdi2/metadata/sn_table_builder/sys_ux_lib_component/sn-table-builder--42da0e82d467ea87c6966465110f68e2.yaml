  What is Form Builder?
  Form Builder is a drag-and-drop builder tool that helps you create custom forms for showing current data and collecting information.
  Create and customize form views
  Form views determine how your form looks. You can customize each form view's appearance by adding different form elements and choosing section layouts.
  Configure field properties
  Each field on a form view has specific field properties that you can modify, including the label, choices that appear, and the state of a field.
  Set up form logic using UI Policies
  Fields can also have UI Policies, which change whether a field is read-only or mandatory based on specific conditions.
  These are only a few things you can do with Form Builder. To learn what else you can do, read the release notes on the Product Documentation site.
