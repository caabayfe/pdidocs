  Enabling choices for a field
  When you enable choices for a field, the field converts into a dropdown and shows a predefined set of choices that the user can choose from. You can decide what choices appear in this set by editing the choices.
  Deactivating and deleting choices
  If you want the choice to no longer appear in a dropdown for a field, you can deactivate it. This choice will still exist as a record on the Now Platform.
  If you want to permanently remove a choice from the field and from the Now Platform, you can delete it. However, you must deactivate the choice before you can delete it.
