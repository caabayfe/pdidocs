output_schema: |-
  [
   {
   "name": "result",
  "label": "result",
  "description": "result desc",
  "readOnly":"false",
  "fieldType": "object",
  "valueType": "object",
  "mandatory": "false",
  "defaultValue": ""
   }
  ]
private: 'false'
props: |-
  [
   {
   "name": "id",
  "label": "Instance Id",
  "description": "instance id",
  "readOnly":"false",
  "fieldType": "String",
  "valueType": "String",
  "mandatory": "true",
  "defaultValue": ""
   }
  ]
query: |-
  query($id: String!){
  	snDiagramBuilder {
  		BuilderQueries {
  			getInstanceById(id: $id) {
  				name
  				sysId
  				diagramJSON
  				tableName
  				readOnly
  				configuration {
  					id
  					name
  					props
  					theme
  					leftPanel
  					leftComponent
  					rightPanel
  					rightComponent
  					header
  					alertsComponent
  					appScope
  					nodeDef {
  						name
  						sysId
  					}
                                          paletteConfiguration{
  						name
  						options
  					}
  					actions{
  						name
  						id
  						componentTagName
  						enable
  						order
  					}
  					diagramTemplate
  					layout
                                          enableSearch
  					diagramOptions
  				}
  			}
  		}
  	}
  }
required_translations: |-
  [ {
    "message" : "Instance Id",
    "comment" : ""
  }, {
    "message" : "instance id",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Get configuration by instance
