query: |-
  query ($instanceId: String!) {
  		snDiagramBuilder {
  			BuilderQueries {
  				getDiagramActionsByInstanceId(instanceId: $instanceId){
  					id: sysId
                                          key
  					name
  					logo: icon
  					description
  					order
  					category: subCategory
  					scope: category
  					nodeType {
  						sysId
  						shapeTemplate,
  					}
  				}
  			}
  		}
  	}
