schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	getConfigById(id: String!): ConfigurationData
  	getActionPickerOnLoadData(configId: String!): ActionCategorySet
  	getActionsByCategory(configId: String!, categoryId: String!): [DiagramAction]
  	getActionsBySearchTerm(configId: String!, searchTerm: String!): ActionCategorySet
  	getInstanceById(id: String!): InstanceData
  	getInstancesByIds(ids: [String]!): [InstanceData]
  	getShapeTemplates(templateIds: [String]!): [ShapeTemplateDetailed]
  	getShapeTemplateJsonById(templateId: String!): JSONString
  	getShapeTemplatesArrayJson(templateIds: [String]!): JSONString
  	getShapeTemplatesArrayJsonForActions(actionIds: [String]!, configId: String): JSONString
  	getShapeTemplatesArrayJsonForNodeTypes(nodeTypeIds: [String]!): JSONString
  	getShapeTemplateJsonForAction(actionId: String!): JSONString
  	getDiagramActionDataById(diagramActionId: String!): DiagramAction
  	getDiagramActionsDataArray(diagramActionIds: [String]): [DiagramAction]
  	getCustomShapes: [Shape]
  	getExtensions: [Extension]
  	getActionArgumentsById(actionId: String!): [ActionArguments]
  	getDiagramActionsByInstanceId(instanceId: String!): [DiagramAction]
  }

  type DiagramAction {
  	key: String!
  	sysId: String!
  	name: String!
  	icon: String
  	description: String
  	categoryId: String
  	category: String
  	subCategory: String
  	order: String
  	nodeType: NodeType
  	connectors: [NodeConnector]
  	actionDependencies: String
  }

  type NodeTypeAttribute {
  	attributeName: String
  	attributeType: String
  	sysId: String
  }

  type NodeType {
  	sysId: String!
  	name: String!
  	shapeTemplate: String
  	nodeType: String
  	description: String
  	order: String
  	attributes: [NodeTypeAttribute]
  	allowDelete: Boolean,
  	nodeTypeHandlers: [NodeTypeHandler]
  	menuOptions: [ContextMenuOption]
  }

  type NodeTypeHandler {
  	sysId: String!
  	type: String!
  	active: Boolean
  	script: String
  }

  type ContextMenuOption {
  	sysId: String!
  	name: String!
  	script: String
  	showOption: String
  	disableOption: String
  }

  type NodeConnector {
  	sysId: String!
  	name: String!
  	active: Boolean
  	direction: String!
  	order: String
  	isDynamic: Boolean
  	enablePortContextMenu: Boolean
  }

  type ShapePropertyData {
  	source: String!,
  	property: ShapeProperty
  }

  type ShapeProperty {
  	value: String
  	isCustom: String
  	customValue: String
  	bindingFunction: String
  }

  type JSONString {
  	content: String
  }

  type InstanceData {
  	sysId: String!
  	name: String!
  	configuration:ConfigurationData!
  	diagramJSON:String
  	tableName: String!
  	readOnly: Boolean!
  }

  type ConfigurationData {
  	id: String!
  	appScope:String!
  	name: String!
  	props: String
  	theme: String
  	leftPanel:Boolean!
  	leftComponent:String!
  	rightPanel:Boolean!
  	rightComponent:String!
  	header:Boolean!
  	alertsComponent: String!
  	nodeDef: [NodeDefinition]
  	categories: [Category]
  	actions:[BuilderActions]
  	diagramTemplate: String
  	layout: String
  	contentAlignment: String
  	enableDragging: Boolean
  	enableAnimation: Boolean
  	enableSearch: Boolean!
  	diagramOptions: String
  	paletteConfiguration: Palette
  }

  type ShapeTemplate {
  	name:String!
  	shape:String! 
  }

  type BuilderActions {
  	name:String!
  	id:String!
  	componentTagName:String!
  	enable:Boolean!
  	order:Int
  }

  type Palette {
  	name: String!
  	sysId: String!
  	options: String!
  }

  type Mutation {
  	runActionById(actionId: String!,diagramJSON: String!,instanceId: String!):[BuilderActions]
  	deleteInstanceById(instanceId: String!): Boolean!
  }
  type ActionCategorySet {
  	categories: [Category]
  	actions: [DiagramAction]
  }

  type Category {
  	name: String!
  	sysId: String!
  	icon: String
  	description: String
  	order: String
  	parent: String
  	installed: Boolean
  }

  type NodeDefinition {
  	sysId: String!
  	name: String!
  	description: String
  	category: String
  	subCategory: String
  	order: String
  }

  type ShapeTemplateDetailed {
  	id: String!
  	type: String!
  	properties: String
  	script: String!
  }

  type Shape {
  	sysId: String!
  	componentName: String!
  	componentType: String!
  	isCustom: Boolean
  	script: String
  }

  type ActionArguments{
  	argumentId:String!
  	name:String!
  	defaultValue:String!
  	direction:String!
  	type:String!
  	order: Int!
  	mandatory:Boolean!
  	actionId:String!
  	actionName:String!
  }

  type Extension {
  	sysId: String!
  	name: String!
  	script: String!
  }
