  			"children": [
  				{
  					"id": "3c2079635b031010640430ad5981c71e",
  					"label": "Uppercase",
  					"description": "<p>Converts the input String to all uppercase characters.</p>\r\n\t\t\t<p><b>Input:</b></p>\r\n\t\t\t<p>\r\n\t\t\t\t<ul>\r\n\t\t\t\t\t<li><strong>String</strong></li>\r\n\t\t\t\t</ul>\r\n\t\t\t</p>\r\n\t\t\t<p><b>Output:</b></p>\r\n\t\t\t<p>\r\n\t\t\t\t<ul>\r\n\t\t\t\t\t<li><strong>String in all uppercase characters</strong></li>\r\n\t\t\t\t</ul>\r\n\t\t\t</p>\r\n\t\t\t<p><b>Example:</b></p>\r\n\t\t\t<p>\r\n\t\t\t\tInput:\r\n  <pre>\"ExamPle inpuT stRing.\"</pre>\r\n  Result:\r\n  <pre>\"EXAMPLE INPUT STRING.\"</pre>\r\n\t\t\t</p>\r\n\t\t\t<p>Note: If input data type is not String, the data is not transformed at runtime.</p>\r\n\t\t\t<p><a href=\"/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions\" target=\"_blank\">Read More.</a></p>",
