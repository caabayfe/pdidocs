  							"mandatory": false,
  							"defaultValue": null
  						}
  					]
  				},
  				{
  					"id": "d700f1635b031010640430ad5981c735",
  					"label": "Trim",
  					"description": "<p>Removes white space from the beginning and end of the input String.</p>\r\n            <p><b>Input:</b></p>\r\n            <p>\r\n            <ul>\r\n            <li><strong>String</strong></li>\r\n            </ul>\r\n            </p>\r\n            <p><b>Output:</b></p>\r\n            <p>\r\n            <ul>\r\n            <li><strong>String</strong> - Transformed String with trimmed white space.</li>\r\n            </ul>\r\n            </p>\r\n            <p><b>Example:</b></p>\r\n            <p>\r\n            Input:\r\n            <pre>\"      Example input string.       \"</pre>\r\n            Result:\r\n            <pre>\"Example input string.\"</pre>\r\n            </p>\r\n            <p>Note: Does not remove white space within the input String. If input data type is not String, the data is not transformed at runtime.</p>\r\n            <p><a href=\"/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions\" target=\"_blank\">Read More.</a></p>",
  					"operationTable": "sys_rte_eb_trim_operation",
