  				{
  					"id": "convert_to_date",
  					"label": "Convert to Date",
  					"description": "<p>Converts the input String to a Date/Time.</p>\r\n<p><b>Input:</b></p>\r\n<p>\r\n  <ul>\r\n    <li><strong>String formatted as specified in Input Date Format</strong></li>\r\n  </ul>\r\n</p>\r\n<p><b>Parameters:</b></p>\r\n<p>\r\n  <ul>\r\n    <li><strong>Input Date Format</strong> -  Date/time or date format of the input String.</li>\r\n    <li><strong>Custom Format</strong> - Valid date/time or date format represented as a String. Required only if Custom Format is selected as the Date Format.</li>\r\n  </ul>\r\n</p>\r\n<p><b>Output:</b></p>\r\n<p>\r\n  <ul>\r\n    <li><strong>Date/Time</strong></li>\r\n  </ul>\r\n</p>\r\n<p>If the date/time value for the <b>Custom Format</b> is incomplete, the transform creates a full date/time value using default dates and times. The transform defaults to the current year, the current month, day 1 of a month, hour 0, minute 0, and second 0.</p>\r\n<p><b>Example:</b></p>\r\n<p>\r\n  Input:\r\n  <pre>\"1995-11-20\"</pre>\r\n  Input Date Format:\r\n  <pre>ISO Date (2004-06-28)</pre>\r\n  Result:\r\n  <pre>1995-11-20 00:00:00</pre>\r\n</p>\r\n<p><b>Example:</b></p>\r\n<p>\r\n  Input:\r\n  <pre>\"On Dec 2019 at 11:59 PM\"</pre>\r\n  Input Date Format:\r\n  <pre>\"Custom (enter below)\"</pre>\r\n  Custom Format:\r\n  <pre>\"'On' MMM yyyy 'at' hh:mm a\"</pre>\r\n  Result:\r\n  <pre>\"2019-10-01 23:59:00\"</pre>\r\n</p>\r\n<p>Note: Runtime Date/Time values are not localized and appear in the UTC (Coordinated Universal Time) time zone.</p>\r\n<p>Note: If input data type is not String, the data is not transformed at runtime.</p>\r\n<style>\r\n  .date-table {\r\n    background-color: #f5f5f5;\r\n    padding: 8.5px;\r\n    margin: 0 auto 12px auto;\r\n    width: 85%;\r\n    line-height: 1.42857;\r\n    color: #4a4a4a;\r\n    border: solid #ccc 1px;\r\n  }\r\n  .date-table tbody tr th {\r\n    text-align: right;\r\n  }\r\n  .date-table th, tbody tr td:nth-child(2) {\r\n    text-align: center;\r\n    padding: 2px;\r\n  }\r\n  .date-table tbody tr td:nth-child(2) {\r\n        padding: 0 5px;\r\n  }\r\n  .date-table tbody tr td {\r\n    border: solid #ccc 1px;    \r\n  }\r\n  .date-table tbody tr th, td {\r\n    padding: 0 5px;\r\n  }\r\n  .date-table tr:nth-child(even) {\r\n    background-color: #f5f5f5; \r\n  }\r\n  .date-table tr:nth-child(odd) {\r\n    background-color: #ffffff; \r\n  }\r\n  .date-table thead th {\r\n    background-color: #f5f5f5;\r\n  }\r\n</style>\r\n<table class=\"date-table\">\r\n  <caption><strong>Common Date Formats</strong></caption>\r\n  <thead>\r\n    <tr>\r\n      <th></th>\r\n      <th>Format</th>\r\n      <th>Example</th>\r\n    </tr>\r\n  </thead>\r\n  <tbody>\r\n    <tr>\r\n      <th>Year</th>\r\n      <td>y</td>\r\n      <td>1970, 1971, ... 2004, 2005</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Month</th>\r\n      <td>MM</td>\r\n      <td>01, 02, ... 11, 12</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Month Name</th>\r\n      <td>MMM</td>\r\n      <td>Jan, Feb, ... Nov, Dec</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Day in Month</th>\r\n      <td>dd</td>\r\n      <td>01, 02, ... 30, 31</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Day Name</th>\r\n      <td>EEE</td>\r\n      <td>Sun, Mon, ... Fri, Sat</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Hour (12-hour)</th>\r\n      <td>h</td>\r\n      <td>1, 2, ... 11, 12</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Hour (24-hour)</th>\r\n      <td>HH</td>\r\n      <td>00, 01, ... 22, 23</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Minute in Hour</th>\r\n      <td>mm</td>\r\n      <td>00, 01, ... 58, 59</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Second in Minute</th>\r\n      <td>ss</td>\r\n      <td>00, 01, ... 58, 59</td>\r\n    </tr>\r\n    <tr>\r\n      <th>Escape Character<br>(Single Quote)</th>\r\n      <td>'</td>\r\n      <td><strong>'at'</strong> h:mm a = <strong>at</strong> 1:30 PM</td>\r\n    </tr>\r\n  </tbody>\r\n</table>\r\n<p><a href=\"/api/now/v1/context_doc_url/CSHelp:Date-Time-Transform-Functions\" target=\"_blank\">Read More.</a></p>",
  					"operationTable": "sys_rte_eb_to_date_operation",
  					"inputs": [
