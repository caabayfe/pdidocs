<div class="ec-common-calendar-header cd_nav">
  <div class="cd_dateNav">
    <div class="first-block">
      <div class="first-row-block">
        <div class="date-picker-block">
          <sp-date-picker id="date-picker-field" field="balanceDateField" ng-model="selectedDate"
                          sn-change="gotoDate()"></sp-date-picker>
        </div>
        <button id="cal_today" type="button" class="btn btn-default" ng-click="todayButton()" data-placement="auto"
                data-toggle="tooltip" data-original-title="${Go to today}">${Today}</button>
        <button id="cal_prev" class="btn btn-default btn-nav-icon fa fa-angle-left" ng-click="prevButton()"
                data-placement="auto" data-toggle="tooltip" data-original-title="{{c.navTooltips.left}}"><span
                                                                                                              class="sr-only">${Previous}</span></button>
        <button id="cal_next" type="button" class="btn btn-default btn-nav-icon fa fa-angle-right"
                ng-click="nextButton()" data-placement="auto" data-toggle="tooltip"
                data-original-title="{{c.navTooltips.right}}"><span class="sr-only">${Next}</span></button>
      </div>
      <div class="middle-row-block">
        <div class="ec-common-cal-date" aria-live="polite" aria-label="{{headerContent}}">{{headerContent}}</div>
      </div>
    </div>
    <div class="last-row-block">
      <div ng-if="!c.isSmallFormFactor" class="btn-group" role="group">
        <button id="dayViewBtn" type="button" class="btn btn-default modebtn"
                ng-class="{'active': viewScale == 'day'}" ng-click="switchDayWeekView('day');renderTooltip()"
                data-placement="auto" data-toggle="tooltip" data-original-title="${Day view}">${Day}</button>
        <button id="weekViewBtn" type="button" class="btn btn-default modebtn"
                ng-class="{'active': viewScale == 'week'}" ng-click="switchDayWeekView('week');renderTooltip()"
                data-placement="auto" data-toggle="tooltip" data-original-title="${Week view}">${Week}</button>
        <button id="monthViewBtn" type="button" class="btn btn-default modebtn"
                ng-class="{'active': viewScale == 'month'}" ng-click="switchDayWeekView('month');renderTooltip()"
                data-placement="auto" data-toggle="tooltip" data-original-title="${Month view}">${Month}</button>
      </div>
      <div class = "keyboard-container">
        <div class="keyboard-helper" ng-hide="c.isSmallFormFactor">
          <keyboard-help></keyboard-help>
        </div>
      </div>
    </div>
  </div>
</div>
