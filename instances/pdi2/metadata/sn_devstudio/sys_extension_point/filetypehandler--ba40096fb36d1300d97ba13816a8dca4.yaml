api_name: sn_devstudio.FileTypeHandler
description: A class that knows how to query for particular sys_metadata types and provide special handling instructions for them if the default handler is not appropriate. The handlesFileType method should return a string indicating which metadata type the handler is for. The filesForKey method should accept a record type and a builder, and return an array of builder-generated objects. The recordType will be the same as what handlesFileType returns.
name: FileTypeHandler
