  value: |-
    (function execute(inputs, outputs) {
      
      var gr = new GlideRecord("vtb_lane");
      var sys_id;
      try{
      	sys_id = JSON.parse(inputs.task_board).value;
      }catch(e)
      {
        sys_id = inputs.task_board.sys_id;
      }
      gs.info(sys_id);
      gr.addQuery("board",sys_id);
      gr.query();
      var lanes = [];
      while(gr.next()){
        lanes.push({label : gr.getValue("name"),name: gr.getValue("sys_id")});
      }
      outputs.lanes = {data : lanes};
      
    })(inputs, outputs);
