description: |-
  Create a Freeform Visual Task Board (VTB). Any task type can be added to this board. 

  <br><br>The default lanes are: Todo, Doing, and Done. These lanes can be modified with actions: Reorder Lane, Rename Lane, Add Lane, and Delete Lane. 

  <br><br>You must configure the board owner field.<br>

  <br><p>Optional:<br>You can configure the look and feel of the VTB
  <ul><li>Default View</li>
  <li>Label Visibility</li>
  <li>Picker Visibility</li>
  <li>Background Color: e.g. vtb-board-color-1</li>
  </ul></p>
