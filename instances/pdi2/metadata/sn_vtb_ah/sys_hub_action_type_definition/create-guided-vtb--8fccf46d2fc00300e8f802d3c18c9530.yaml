description: |-
  Create a data driven Visual Task Board (VTB) bound to a single Task Table along with the field(s) the lanes are derived.

  <br><br>The lanes cannot be changed on a Guided VTB, as the lanes are determined by the column chosen.  

  <br><br>You must configure the board owner field.<br>

  <br><p>Optional:<br>You can configure the look and feel of the VTB
  <ul><li>Default View</li>
  <li>Label Visibility</li>
  <li>Picker Visibility</li>
  <li>Background Color: e.g. vtb-board-color-1</li>
  </ul></p>
