    (function execute(inputs, outputs) {
        
      var board = new sn_vtb.FlexibleBoard(inputs["tableName"]);  
     
      board.setName(inputs["name"]);  
      board.setOwner(inputs["ownerId"]);
      board.setFilter(inputs["filter"]);
      board.setDefaultListView(inputs["defaultView"]);
      board.setPickerVisibility(inputs["pickerVisibility"]);
      board.setLabelsVisibility(inputs["labelVisibility"]);
      board.setBackgroundColor(inputs["backgroundColor"]);
     
      outputs["boardId"] = board.createBoard();  
      
    })(inputs, outputs);
