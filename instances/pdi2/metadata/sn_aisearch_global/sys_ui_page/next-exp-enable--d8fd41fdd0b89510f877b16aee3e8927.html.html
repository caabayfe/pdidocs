<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<html>
		<g2:evaluate>
			var isPolarisEnabled = ('true' == gs.getProperty('glide.ui.polaris.experience', 'false'));
			var hasRole = gs.hasRole('ais_admin');
		</g2:evaluate>

		<j2:if test = "$[hasRole]">
			<g2:ui_form>
				<j2:if test = "$[isPolarisEnabled]">
					<h3>${gs.getMessage("Next Experience is enabled")}</h3>
				</j2:if>
				<j2:if test = "$[!isPolarisEnabled]">
					<h3>${gs.getMessage("Next Experience is disabled")}</h3>
					<p><button type="submit" class="btn btn-primary">${gs.getMessage("Enable Next Experience")}</button></p>
				</j2:if>
			</g2:ui_form>
		</j2:if>
	</html>
</j:jelly>
