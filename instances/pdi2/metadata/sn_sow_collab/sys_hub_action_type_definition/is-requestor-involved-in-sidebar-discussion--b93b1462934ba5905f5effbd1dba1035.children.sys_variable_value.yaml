    (function execute(inputs, outputs) {
      if (!inputs.incident_sys_id || !inputs.chat_sys_id)
        	return;
      var incidentGr = new GlideRecord('incident');
      if (incidentGr.get(inputs.incident_sys_id))
        new sn_sow_collab.SOWSidebarNotificationsUtils().sendFirstEmail(incidentGr, inputs.chat_sys_id);
    })(inputs, outputs);
