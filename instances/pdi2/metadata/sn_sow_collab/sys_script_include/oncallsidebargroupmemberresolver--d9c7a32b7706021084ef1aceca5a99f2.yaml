description: |-
  Implements extension point sn_oe_sfs.SidebarGroupMemberResolver
  Extension point for resolving the members of a given group that would be added into the sidebar discussion based on custom requirements.

  BUs can return the users based on their logic by adding implementations of this extension point.
  For Example ITSM team can use this to return the on-call members of the group that needs to be added to the Sidebar discussion.
