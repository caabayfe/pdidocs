required_translation_keys: '[{"message":"ADD LOGIC AND AUTOMATION"},{"message":"Let''s set up your email notification."},{"message":"Complete all required fields to create this email notification"},{"message":"Complete all required fields to save this email notification"},{"message":"For example, \"Pending approval notification\""},{"message":"Name"},{"message":"For example, \"Notification sent to a manager when an approval is pending\""},{"message":"Short description"},{"message":"Notification trigger settings"},{"message":"Emails can be automatically sent after something happens. You can also choose to have an email sent when a table is modified."},{"message":"For example, an email can be sent to a manager when someone reports an incident."},{"message":"Recipients"},{"message":"Select who will receive this notification."},{"message":"Email content"},{"message":"You can select a template or write a message from scratch. If you select a template, you can override it to change the content."},{"message":"*You can only preview after you have created an email notification"},{"message":"*You can only preview after you have saved an email notification"},{"message":"*You can''t preview this email notification because your permissions don''t allow you to access the selected table"},{"message":"Cancel"},{"message":"Create"},{"message":"Save"},{"message":"We encountered an error while retrieving the email notification"},{"message":"Your changes have been saved"},{"message":"We encountered an error while saving the email notification"},{"message":"Your email notification has been created"},{"message":"When a record is created or updated"},{"message":"Only when a record is created"},{"message":"Only when a record is updated"},{"message":"When triggered via Flow Action"},{"message":"When event is fired"},{"message":"+ Set conditions (optional). Select a table first to add conditions."},{"message":"Send email notification"},{"message":"If you choose an option that depends on a record, you will also have to choose a table."},{"message":"You''ll need to request access to this table to use its data"},{"message":"Event name"},{"message":"Select which event fires to send the email notification."},{"message":"Users and groups from table fields"},{"message":"You can add users and groups from the table you selected."},{"message":"Add"},{"message":"We encountered an error while searching for people and groups"},{"message":"People and groups"},{"message":"You can add people and groups as recipients by searching for their name."},{"message":"Preview"},{"message":"Preview this email notification"},{"message":"Close"},{"message":"Change the email template?"},{"message":"If you change the template for this email notification, your overrides to the current template will be deleted."},{"message":"Change template"},{"message":"Email template"},{"message":"If you want to use content in a predefined layout, you can select an email template. You can also edit the template’s content to fit a specific use case."},{"message":"Override template"},{"message":"Template subject"},{"message":"Template email message"},{"message":"Use the subject of the email message to briefly describe the contents of the email."},{"message":"Subject"},{"message":"Include a subject line. For example, “New incident report”"},{"message":"Preview records"},{"message":"Select a record to preview how the content in the email notification dynamically changes."},{"message":"Click to choose a record for your preview"},{"message":"You can only add users and groups from tables you can access"},{"message":"Once selected, you may have the option to set conditions that trigger this notification. You can also add variables to the subject and email message."},{"message":"Table"},{"message":"Select a table"},{"message":"Tables in this app"},{"message":"Recommended tables"},{"message":"All other tables"},{"message":"No users or groups have been selected to receive this"},{"message":"Users"},{"message":