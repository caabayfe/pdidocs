  value: |-
    (function populateBreadCrumbs(pageId, pageParams) {
        // Add your code here
        
        var gr = new GlideRecord(pageParams.table);
        var res = [];
        if (gr.get(pageParams.sysId)) {
            res.push({
                'label': gr.getValue('name')
            });
            var cbGr = new GlideRecord(pageParams.table);
            var cbId = gr.getValue('parent') || '';
            var tableId = gr.getValue('document_id');
            var tableName = gr.getValue('document_table');
            while (cbId) {
                cbGr.get(cbId);
                res.push({
                    'label': cbGr.getValue('name'),
                    'href': '/now/ace-app-builder/ace-record-page/' + pageParams.aceAppConfigId + '/sn_ace_content_block/' + cbId
                });
                cbId = cbGr.getValue('parent');
            }
            if (res.length > 1) {
                tableName = cbGr.getValue('document_table') || '';
                tableId = cbGr.getValue('document_id') || '';
            }
            var mainGr = new GlideRecord(tableName);
            mainGr.get(tableId);
            res.push({
                'label': mainGr.getValue('name'),
                'href': '/now/ace-app-builder/ace-record-page/' + pageParams.aceAppConfigId + '/' + tableName + '/' + tableId
            });
        }
        return res.reverse();
    }(pageId, pageParams));
