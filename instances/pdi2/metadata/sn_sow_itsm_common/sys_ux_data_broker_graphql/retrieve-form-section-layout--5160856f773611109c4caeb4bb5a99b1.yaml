api_name: sn_sow_chg.Retrieve Form Section Layout
batch_exclude: 'false'
description: Retrieve Form Section Layout
mutates_server_data: 'false'
name: Retrieve Form Section Layout
output_schema: ''
private: 'false'
props: |-
  [{
    "name": "table",
    "label": "Table",
    "description": "Table to be used for the layout",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  },
  {
    "name": "sysId",
    "label": "SysId",
    "description": "sys_id to be used for the layout",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  },
  {
    "name": "views",
    "label": "Views",
    "description": "View to be used for the layout",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  }]
query: |-
  query (
    $table: String!, $sysId: String!, $views: String!) {
      GlideViewQuery_Query {
        uiView(table: $table, sysId: $sysId, views: $views) {
          view
          glideLayoutItem(table: $table, sysId: $sysId) {
            _query {
              GlideLayout_Query {
                formLayout(table: $table, sysId: $sysId, view: "$$parent.viewName$$") {
                  isValidRecord
                  table
                  sysId
                  sectionLayout {
                    sysId
                    caption
                    captionDisplay
                    rows {
                      fields
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
required_translations: |-
  [ {
    "message" : "SysId",
