api_name: sn_sow_chg.Retrieve Field Highlighted Value
batch_exclude: 'false'
description: Retrieves the variant and color for a field defined in the UX Highlighted Values
mutates_server_data: 'false'
name: Retrieve Field Highlighted Value
output_schema: ''
private: 'false'
props: |-
  [{
    "name": "table",
    "label": "Table",
    "description": "Table to be used for the highlighted value",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  },
  {
    "name": "sysId",
    "label": "SysId",
    "description": "sys_id to be used for the highlighted value",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  },
  {
    "name": "fields",
    "label": "Fields",
    "description": "List of fields to be queried for the highlighted value",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  }]
query: |-
  query ($table: String!, $sysId: String!, $fields: String) {
    GlideHighlightedValues_Query {
      HighlightedValueStyleItem(table: $table, sysId: $sysId, fields: $fields) {
        field
        variantName
        colorName
      }
    }
  }
required_translations: |-
