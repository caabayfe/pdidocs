query: |-
  query ($table: String!, $sysId: String!, $view: String, $actionLayoutId: String) {
    GlideUxActionLayout_Query {
      getActionLayout(
        table: $table
        sysId: $sysId
        view: $view
        actionLayoutId: $actionLayoutId
      ) {
        actionLayoutItems {
          ... on GlideUxActionLayout_UxActionGroupType {
            name
            label
            color
            icon
            shouldBeInOverflow
            type
            actions {
              ... on GlideUxActionLayout_UxUiActionType {
                name
                label
                color
                shouldBeInOverflow
                order
                sysId
                clientScript
                hint
                hasClientScript
                itemName
              }
              ... on GlideUxActionLayout_UxDeclarativeActionType {
                name
                label
                color
                shouldBeInOverflow
                assignmentId
                tooltip
                actionPayload
                actionDispatch
                actionType
                clientScript
                confirmationMessage
                confirmationRequired
                scriptedClientCondition
                modelConditions {
                  field
                  operator
                  value
                  newQuery
                  or
                }
                payloadMap {
                  name
                  value
                }
              }
            }
          }
          ... on GlideUxActionLayout_UxUiActionType {
            name
            label
            color
            icon
            shouldBeInOverflow
            sysId
            clientScript
            hint
            hasClientScript
            icon
            itemName
          }
          ... on GlideUxActionLayout_UxDeclarativeActionType {
            name
            label
            color
            icon
            shouldBeInOverflow
            assignmentId
            tooltip
            actionPayload
            actionDispatch
            actionType
            clientScript
            confirmationMessage
            confirmationRequired
            scriptedClientCondition
            modelConditions {
              field
              operator
              value
              newQuery
              or
            }
            payloadMap {
              name
              value
            }
          }
        }
        actionLayoutId
      }
    }
  }
