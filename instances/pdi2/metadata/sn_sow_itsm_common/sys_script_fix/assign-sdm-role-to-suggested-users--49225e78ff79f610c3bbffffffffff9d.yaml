description: |-
  This script will assign the Service Desk Manager (sn_service_desk_manager) role to users who are managers of:
  1. An assignment group that has the SDA role (sn_service_desk_agent) assigned
  2. Users who either have the SDA role assigned directly to them or are part of a group that has the SDA role assigned
  3. An assignment group specified in the Service Desk Group Inclusion user criteria record
  4. Users that are in an assignment group specified in the Service Desk Group Inclusion user criteria record
name: Assign SDM role to suggested users
