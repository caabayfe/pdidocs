description: |-
  Number of closed requests with SLAs is measured daily as unit #.
  The goal for this indicator is to minimize.
  It is the count on data source Benchmark.RequestedItems.SLA, which is using the table:
  task_sla
  with the following conditions:
  SLA definition Type = SLA
  Stage != Cancelled
  Task Task type = Requested Item
  Task Closed on Today
