description: Backfill subscription_entitlement.program_type and .product_family_3 for STRY64822683 (AI Native Mixed-SKU). These fields were always present in the MDM payload but were never extracted before this release, so existing rows have them blank. Re-extracts just these two fields from the most recently stored MDM entitlement payload (read-only against the payload; no reprocessing) and writes them directly onto the matching subscription_entitlement rows, then reloads the subscription_entitlement cache so getAllActiveEntitlement() reflects the backfilled data immediately.
