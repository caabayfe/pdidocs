description: EligibleLicenseQueryBuilder is a ServiceNow utility class that generates encoded queries to identify subscriptions eligible for mapping to custom applications & custom tables. It applies all filtering by entitlement model (EMS or legacy), selecting active or optionally expired primary subscriptions, and excluding store app and grandfathered licenses. The class centralizes subscription eligibility logic, dynamically determines reference fields, and returns queries ready for GlideRecord operations, ensuring consistent and maintainable filtering across the system.
