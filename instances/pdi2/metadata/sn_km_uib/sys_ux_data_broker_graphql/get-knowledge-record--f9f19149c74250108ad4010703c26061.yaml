api_name: sn_km_uib.Get knowledge record
batch_exclude: 'false'
description: Fetches the knowledge record details based on sys id
mutates_server_data: 'false'
name: Get knowledge record
output_schema: ''
private: 'true'
props: |-
  [
    {
      "name": "sys_id",
      "label": "Sys Id",
      "description": "knowledge record id",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    },
    {
      "name": "ts_query_kb_id",
      "label": "Search Id",
      "description": "Search Log Id",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": ""
    },
    {
      "name": "top_click_rank",
      "label": "Top Click Rank",
      "description": "Top Result clicked by user",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": ""
    }
  ]
query: |-
  query ($sys_id: String!, $ts_query_kb_id: String, $top_click_rank: String) {
    AppKnowledge_Query {
      getArticleDetails(articleID: $sys_id, searchId: $ts_query_kb_id, topClickRank: $top_click_rank) {
        articleHTML
        isEditable
        articleSysId
        infoMessage
        errorMessage
        templateFieldData {
          column
          content
          fieldStyle
          headingStyle
          label
          type
          collapsed
          collapsible
        }
        versionDetails {
        	isInstalled
          isEnabled
          history {
            sysClassName
            sysId
            versionLabel
            versionNumber
            versionText
          }
          showHistory
          versionDisplay
          versionDisplayLabel
          newVersionAvailable
          warningMessage
        }
        languageDetails {
          label
          sysId
          language
          selected
        }
        kbDocSysId
        showFeedbackOptions
        showStarRating
        showYNRating
        showFlag
        showFeedbackComments
        enableActionableFeedbackForRating
        enableActionableFeedbackForHelpful
        enableActionableFeedbackForFlag
        isKBAdmin
        isKBOwner
        commentsThreshold
        hasComments
        docviewerEnabled
        articleInfo {
  				author
  				authorUserName
  				displayAttachments
  				kbCategory
  				workflowState
  				kbKnowledgeBase
  				number
  				shortDescription
  				sysId
  				sysUpdatedOn
  				sysViewCount
  				rating
  				revisedBy
          baseVersion
          isExpired
          officeDocUrl
  		sysClassName
          articleType
          internalAssets {
                js
          }
        }
        totalUsefulCount
        usefulYesCount
      }
    }

    GlideDomain_Query {
      user {
        sys_id
        language
        avatar
        fullName
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Get knowledge record
sys_policy: ''
type: query
use_record_domain: 'false'
