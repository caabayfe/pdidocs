api_name: sn_km_uib.Get knowledge categories encoded record
batch_exclude: 'false'
description: Fetches all the knowledge categories based on the encoded record
mutates_server_data: 'false'
name: Get knowledge categories encoded record
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "encodedRecord",
      "label": "Encoded record",
      "description": "Encoded record",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "hasValue",
      "label": "Has value",
      "description": "Has value",
      "fieldType": "boolean",
      "mandatory": true
    },
    {
      "name": "value",
      "label": "Value",
      "description": "Value",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query($encodedRecord :String!, $hasValue: Boolean!, $value: String!){
    AppKnowledge_Query {
      first: getCategoriesFromEncodedRecord(encodedRecord: $encodedRecord) {
        label
        id
        childrenAvailable
      }
      second: getCategories(id: $value, isSelected: true) @include(if: $hasValue){
        label
        id
        parentId
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Get knowledge categories encoded record
sys_policy: ''
type: query
use_record_domain: 'false'
