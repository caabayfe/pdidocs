api_name: sn_km_uib.Fetch Knowledge Comments
batch_exclude: 'false'
description: Fetches all the knowledge comments based on the article record id.
mutates_server_data: 'false'
name: Fetch Knowledge Comments
output_schema: ''
private: 'true'
props: |-
  [
    {
      "name": "id",
      "label": "Knowledge Record",
      "description": "Knowledge Record",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "getRootComments",
      "label": "Get Root Comments",
      "description": "Get Root Comments",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($id: String!, $getRootComments: Boolean!) {
    AppKnowledge_Query {
      getComments(id: $id, getRootComments: $getRootComments) {
        id
        created: createdOn
        text
        parent
        user {
          name
          id
          avatar
        }
        reactionCount: likesCount
        isReacted: isLiked
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Fetch Knowledge Comments
sys_policy: ''
type: query
use_record_domain: 'false'
