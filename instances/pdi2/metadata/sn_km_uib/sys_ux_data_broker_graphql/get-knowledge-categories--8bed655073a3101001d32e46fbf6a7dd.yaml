api_name: sn_km_uib.Get knowledge categories
batch_exclude: 'false'
description: Fetches all the knowledge categories based on the parent record id (Knowledge base ID or Category ID)
mutates_server_data: 'false'
name: Get knowledge categories
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "id",
      "label": "Parent record",
      "description": "Parent record",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "hasValue",
      "label": "Has value",
      "description": "Has value",
      "fieldType": "boolean",
      "mandatory": true
    },
    {
      "name": "value",
      "label": "Value",
      "description": "Value",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query($id: String!, $hasValue: Boolean!, $value: String!) {
  	AppKnowledge_Query {
  		first: getCategories(id: $id, isSelected: false) {
  			label
  			id
  			childrenAvailable
  		}
  		second: getCategories(id: $value, isSelected: true) @include(if: $hasValue) {
  			label
  			id
  			parentId
  		}
  	}
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Get knowledge categories
sys_policy: ''
type: query
use_record_domain: 'false'
