      relatedContent{
        getRelatedArticles(maxRecords:$maxRecords,displayField:$displayField,secondaryFields:$secondaryFields,articleId:$articleId,knowledgeBase:$knowledgeBase,sourceId:$sourceId,sourceTable:$sourceTable,sourceColumn:$sourceColumn,targetColumn:$targetColumn){
