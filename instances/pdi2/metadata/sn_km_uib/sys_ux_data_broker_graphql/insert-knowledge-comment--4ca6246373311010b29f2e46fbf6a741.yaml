api_name: sn_km_uib.Insert knowledge comment
batch_exclude: 'false'
description: Inserts the knowledge comment on the basis of the article record ID
mutates_server_data: 'true'
name: Insert knowledge comment
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "content",
      "label": "Comment content",
      "description": "Comment content",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "articleId",
      "label": "Article ID",
      "description": "Article ID",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "parentId",
      "label": "Parent ID",
      "description": "Parent ID",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  mutation ($content: String!, $articleId: String!, $parentId: String!) {
    AppKnowledge_Mutation {
      addComment(comment: $content, articleId: $articleId, parentId: $parentId)
    }
  }
required_translations: ''
