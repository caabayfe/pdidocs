api_name: sn_km_uib.Version Compare GQL
batch_exclude: 'false'
description: |-
  Returns the content of the articles by field types.
  firstVersion: sys_id of the first version
  secondVersion: sys_id of the second version
mutates_server_data: 'false'
name: Version Compare GQL
output_schema: ''
private: 'true'
props: |-
  [
  {
      "name": "table",
      "label": "Table Name",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": "kb_knowledge"
    },
    {
      "name": "firstVersion",
      "label": "First Version",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    },
    {
      "name": "secondVersion",
      "label": "Second Version",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    }
  ]
query: |-
  query($table: String!,$firstVersion: String!,$secondVersion: String!) {
   firstVersion: GlideRecord_Query {
      kb_version(sys_id: $firstVersion) {
        _results {
          knowledge {
            value
          }
          snapshot {
            value
          }
          version {
            value
          }
          _query {
            AppKnowledge_Query {
              getArticleByFieldTypes(table: $table, sys_id: "$$parent.knowledge$$", snapshot: "$$parent.snapshot$$", types: ["string", "html", "translated_html"], exclude: ["article_id", "language", "topic", "number", "meta", "meta_description", "display_number", "sys_created_by", "sys_updated_by", "description", "category", "article_type"]) {
                name
                type
                label
                value
              }
            }
          }
        }
      }
    }
  secondVersion: GlideRecord_Query {
      kb_version(sys_id: $secondVersion) {
        _results {
          knowledge {
            value
          }
          snapshot {
            value
          }
          version {
            value
          }
          _query {
            AppKnowledge_Query {
              getArticleByFieldTypes(table: $table , sys_id: "$$parent.knowledge$$", snapshot: "$$parent.snapshot$$", types: ["string", "html", "translated_html"], exclude: ["article_id", "language", "topic", "number", "meta", "meta_description", "display_number", "sys_created_by", "sys_updated_by", "description", "category", "article_type"]) {
                name
                type
                label
                value
              }
            }
          }
        }
      }
    }
      }
required_translations: ''
schema_version: 1.0.0
sys_name: Version Compare GQL
sys_policy: ''
type: query
use_record_domain: 'false'
