          "2833dbe2331a446682680bf38cafd23e": {
            "id": "2833dbe2331a446682680bf38cafd23e",
            "stepType": "ScriptOutput",
            "name": "Send Greeting Message",
            "output_type": "single_part",
            "script": "(function execute() {\n  // Taken from Now Assist - Greeting topic\n  var aisHelper = new sn_nowassist_va.NowAssistAISearchHelper();\n  var logger = aisHelper.getLogger(aisHelper.getLoggerContext(vaSystem));\n  vaVars.isNASS = vaSystem.isNASSConversation();\n  var greeting = new sn_cs.SinglePartOutMsg();\n  var userName = \"\";\n  try {\n    if (gs.isLoggedIn()) {\n      userName = vaInputs.user.first_name.getDisplayValue()\n        ? vaInputs.user.first_name.getDisplayValue()\n        : gs.getUser().getFirstName();\n    }\n  } catch (error) {\n    logger.error(\n      \"[NowAssistGreetingHelper] Error trying to derive name of user for conversation: {conversation}\"\n    );\n  }\n\n  var configuredGreeting =\n    global.NowAssistGreetingHelper.constructGreetingMessage({\n      userName: userName,\n      requesterLang: vaContext.getRequesterLang(),\n      greetingMessage: vaSystem.getContextProfileMessage(\"greeting\"),\n      greetingGuestMessage: vaSystem.getContextProfileMessage(\"greeting_guest\"),\n      channel: getCurrentChannel(),\n    });\n  if (configuredGreeting.type === \"html\") {\n    greeting.setHtmlPart(configuredGreeting.message);\n  } else if (configuredGreeting.type === \"json\") {\n    greeting.setAnimationPayloadPart(configuredGreeting.message);\n  } else {\n    greeting.setTextPart(configuredGreeting.message);\n  }\n  return greeting;\n})();\n\nfunction getCurrentChannel() {\n  var channel = vaContext.deviceType;\n  if (channel == \"mweb\") {\n    // Sends either self_service or chat_client. Need this to differentiate b/w web client experiences\n    return vaContext.experience;\n  }\n  return channel;\n}\n",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
