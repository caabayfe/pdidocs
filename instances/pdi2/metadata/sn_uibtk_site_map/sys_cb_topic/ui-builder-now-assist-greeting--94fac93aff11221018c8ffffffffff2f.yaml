          "5f057dccd44642fbbb338c4d525dec45": {
            "id": "5f057dccd44642fbbb338c4d525dec45",
            "name": "Set agent context",
            "script": "(function execute() {\n    // Setup to match Now Assist - Greeting topic\n    vaVars.global_agentContext = JSON.stringify({\n        \"conversationId\": vaSystem.getConversationId()\n    });\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
