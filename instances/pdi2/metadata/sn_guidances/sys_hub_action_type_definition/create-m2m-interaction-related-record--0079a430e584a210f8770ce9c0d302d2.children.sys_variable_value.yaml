  value: |-
    (function execute(inputs, outputs) {
      if(inputs.knowledge.canRead() && inputs.interaction.canRead()) {
    	var M2M_KB_INTERACTION = 'interaction_related_record';
      	var articleID = inputs.knowledge.getUniqueValue();
      	var interactionID = inputs.interaction.getUniqueValue();
      
      	var kbInteraction = new GlideRecord(M2M_KB_INTERACTION);
    	kbInteraction.addQuery("knowledge_article",articleID);
    	kbInteraction.addQuery("interaction",interactionID);
      kbInteraction.addQuery("type",'knowledge');
    	kbInteraction.query();
    	if (!kbInteraction.next()) {
          kbInteraction.initialize();
          kbInteraction.knowledge_article = articleID;
          kbInteraction.interaction = interactionID;
          kbInteraction.type = 'knowledge';
          kbInteraction.insert();
          outputs.createdrecord = kbInteraction;	    
    	}
      }
      else
        throw "User does not have read access to Knowldege or Task record. Error in flow action: Create m2m_kb_task record for attach article guidance";
      
    })(inputs, outputs);
