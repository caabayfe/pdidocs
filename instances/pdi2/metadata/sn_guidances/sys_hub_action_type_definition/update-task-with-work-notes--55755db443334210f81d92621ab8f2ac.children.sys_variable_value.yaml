  value: |-
    (function execute(inputs, outputs) {
      if(inputs.kbGr.canRead() && inputs.taskGr.canRead()) {
      var kbGr = inputs.kbGr; 
      var taskGr = inputs.taskGr;
      var kbGrDetails = gs.getMessage("Knowledge kbGr {0}: ", kbGr.number);
    if (gs.getProperty("glide.ui.security.allow_codetag", "true") != "true")
    	kbGrDetails = kbGrDetails + kbGr.short_description + "\n" + inputs.worknotes;
    else {
    	var displayValue;
    	kbGrDetails='';
     	var queryParameter = 'kb_view.do?sys_kb_id=';
     	var shortDesc = GlideStringUtil.escapeHTML(kbGr.short_description).trim();
     	displayValue = shortDesc + ": " + "<a title='" + shortDesc + "' href='";
    	displayValue += queryParameter+kbGr.getUniqueValue() + "' >";
    	displayValue += kbGr.number + "</a>";
     	kbGrDetails += "[code]" + displayValue + "[/code] " + "\n" + inputs.worknotes;
     }

      if(taskGr["work_notes"] != undefined)
        taskGr["work_notes"] = kbGrDetails;

      taskGr.update();
      }
      else
        gs.addErrorMessage(gs.getMessage("Unable to add KB link to the task."));
      
    })(inputs, outputs);
