  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      if(inputs.kbGr.canRead() && inputs.taskGr.canRead()) {
      var article = inputs.kbGr;
      var taskGr = inputs.taskGr;
      var articleDetails = gs.getMessage("Knowledge article {0}: ", article.number);
    if (gs.getProperty("glide.ui.security.allow_codetag", "true") != "true")
    	articleDetails = articleDetails + article.short_description + "\n" + inputs.comments;
    else {
    	var displayValue;
    	articleDetails='';
     	var queryParameter = 'kb_view.do?sys_kb_id=';
     	var shortDesc = GlideStringUtil.escapeHTML(article.short_description).trim();
     	displayValue = "<a title='" + shortDesc + "' href='";
    	displayValue += queryParameter+article.getUniqueValue() + "' >";
    	displayValue += article.number + " : " + shortDesc + "</a>";
     	articleDetails += "[code]" + displayValue + "[/code]" + "\n" + inputs.comments;
     }
     
      var fields = gs.getProperty("glide.knowman.attach.fields", "work_notes,comments").split(",");
       
      for(var i = 0;i < fields.length; i++)
        taskGr[fields[i]] = articleDetails;
      
      taskGr.update();
      }
      else
        gs.addErrorMessage(gs.getMessage("Unable to attach article to the task."));
      
    })(inputs, outputs);
