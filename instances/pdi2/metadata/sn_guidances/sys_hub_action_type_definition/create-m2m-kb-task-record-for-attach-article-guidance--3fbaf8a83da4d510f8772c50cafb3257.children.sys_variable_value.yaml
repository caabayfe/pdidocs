  value: |-
    (function execute(inputs, outputs) {
      if(inputs.knowledgeArticleGr.canRead() && inputs.taskGr.canRead()) {
    	var M2M_KB_TASK = 'm2m_kb_task';
      	var articleID = inputs.knowledgeArticleGr.getUniqueValue();

      	var taskID = inputs.taskGr.getUniqueValue();
      
      	var kbTask = new GlideRecord(M2M_KB_TASK);
        kbTask.addQuery("kb_knowledge",articleID);
        kbTask.addQuery("task",taskID);
        kbTask.query();
        if (!kbTask.next()) {
            kbTask.initialize();
            kbTask.kb_knowledge = articleID;
            kbTask.task = taskID;
            kbTask.insert();
            outputs.createdrecord = kbTask;	    
        }

      //create record in kb_use with used flag true
      var kbUse = new GlideRecord("kb_use");
      kbUse.initialize();
      kbUse.used = true;
      kbUse.user.setValue(gs.getUserID());
      kbUse.article = articleID;
      kbUse.session_id = gs.getSessionID();
    	kbUse.sys_domain = gs.getSession().getCurrentDomainID();
      kbUse.insert();
      
      
      // Increment user count for the kb article
      var gr = new GlideRecord('kb_knowledge');
    	if(gr.get(articleID)){
    		var currentCount = gr.getValue('use_count');
    		if(!currentCount)
    			currentCount = 0;
    		gr.setValue('use_count',parseInt(currentCount)+1);
    		gr.update();
    	}
      }
      else
        throw "User does not have read access to Knowldege or Task record. Error in flow action: Create m2m_kb_task record for attach article guidance";
      
    })(inputs, outputs);
