name: resolution shaper styles
style: |-
  .qtip.timeline{
  					font-size:13px;
  					background-color:RGB(var(--now-container--color,255,255,255));
  					line-height:140%;
  					z-index: 10000000 !important;
  					border-color:RGB(var(--now-color_border--primary));
  				}
  				.timelineMainContainer{
  					overflow: hidden;
  					display:none;
  				}
  				 .timelineHeader{
  					white-space: nowrap;
  					font-size: 18px;
  					margin-left: 10px;
  					color:RGB(var(--now-heading--title-primary--color));
  					.subTitle{
  						padding-right: 15px;
  					}
  				}
  				.timelineContainer{
  					width:100%;
  					height:80px;
  					position:relative;
  					paddingBottom: 20px;
  				}
  				.dataContainer{
  					display:inline-block;
  					background-color:transparent;
  					color:RGB(var(--now-highlighted-value--primary--color));
  					border-left:solid 2px ${$navpage-nav-border};
  					display:none;position:absolute;
  					padding:5px 15px 5px 15px;
  					top:-10px;right:0px;
  					width:110px;
  				}
  			.dataSeparator{
  			position:absolute;
  			width:80%;
  			height:2px;
  			background-color:${$navpage-nav-border};
  			left:10%;top:50%
  				}
  				.datarow{
  					line-height:100%;
  				}
  				.timeData{
  					color:RGB(var(--now-color_text--primary));
  					font-size:13px;
  					display:block;
  				}
  				.userData{
  					color:RGB(var(--now-color_text--secondary));
  					margin-top: 2px;
  					font-size:11px;
  					display:block;
  				}
  				.loadingTimeline{
  					width:100%;
  					text-align:center;
  				}
  				.subTitle{
  					white-space: nowrap; 
  					font-size: 13px; 
  					color: RGB(var(--now-heading--title-secondary--color));
  				}
  				#timelineToggle{
  					display:inline-block;
  					padding-top: 5px;
  					position: absolute;
  					right: -6px;
  					font-size: 18px;
  					color: inherit;
  				}
  				.rsContainer{			
  					width:calc(100% - 110px);
  					float:left; 
  					height:60px;
  					display:inline-block;
  				}
  				.show-hide-info-message{
  					display:none;
  				}
sys_name: resolution shaper styles
