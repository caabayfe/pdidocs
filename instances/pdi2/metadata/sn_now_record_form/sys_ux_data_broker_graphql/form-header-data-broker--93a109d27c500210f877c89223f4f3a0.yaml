api_name: sn_now_record_form.Form Header Data Broker
batch_exclude: 'false'
description: Fetches the form header configuration for a record
mutates_server_data: 'false'
name: Form Header Data Broker
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table",
      "description": "Table name",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    }, {
      "name": "sysId",
      "label": "Sys Id",
      "description": "Record sys Id",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    },{
      "name": "workspaceConfigId",
      "label": "Workspace Config ID",
      "description": "Workspace Config sys Id",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": ""
    },{
      "name": "headerConfigId",
      "label": "Header Config ID",
      "description": "Header Config sys Id ",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": ""
    }, {
      "name": "highlightedValueConfigId",
      "label": "Highlighted Value Config ID",
      "description": "Highlighted Value Config sys Id ",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": ""
    }
  ]
query: |-
  query ($table: String!, $sysId: String, $workspaceConfigId: String, $headerConfigId: String, $highlightedValueConfigId: String) {
  headerConfig: GlideHeaderQuery_Query {
  	headerItems( table: $table, sysId: $sysId, workspaceConfigId: $workspaceConfigId, headerConfigId: $headerConfigId, highlightedValueConfigId: $highlightedValueConfigId ) {
  		headerSysId
  		recordDisplayValue
  		tableDisplayValue
  		hideTags
  		primaryItem {
  			fieldName
  			fieldLabel
  			displayValue
  		}
  		subheadingItem {
  			fieldName
  			fieldLabel
  			displayValue
  		}
  		headerImageItem {
  			fieldName
  			fieldLabel
  			headerImage
  		}
  		secondaryItems {
  			fieldName
  			fieldLabel
  			displayValue
  			highlightedValueStyle {
  				field
  				value
  				status
  				showIcon
  				variantName
  				colorName
  				iconName
  			}
  			referenceItem {
  				table
  				sysId
  			}
  		}
  	}
  }
  }
required_translations: |-
  [ {
    "message" : "Header Config ID",
