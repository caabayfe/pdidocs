query: |-
  query (
    $table: String!
    $sysId: String!
    $view: String
    $query: String
    $parentTable: String
    $parentRecordSysId: String
    $expandGlideVars: Boolean
  ) {
    GlideLayout_Query {
      formLayout(
        table: $table
        view: $view
        sysId: $sysId
        query: $query
        parentTable: $parentTable
        parentRecordSysId: $parentRecordSysId
        expandGlideVars: $expandGlideVars
      ) {
        relatedLists(includeEmptyOmittedRelatedLists: true) {
          sourceTable
          targetTable
          count
          filter
          displayLabel
          label
          value
          relatedField
          omitIfEmpty
        }
      }
    }
  }
