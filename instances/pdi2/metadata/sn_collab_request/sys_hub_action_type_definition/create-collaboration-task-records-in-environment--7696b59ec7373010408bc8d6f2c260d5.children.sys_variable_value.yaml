  value: |-
    (function execute(inputs, outputs) {
      var collabTasksString = inputs["collaboration_tasks"] || [];
      var fields = sn_collab_request.CollabTaskConstants.fields.collabTask;
      var collabTasks = JSON.parse(collabTasksString);
      
      if (collabTasks.length === 0) {
        throw "No collaboration tasks found";
      }
      
      var restRequests = collabTasks.map(function (collabTask) {
        var descriptor = collabTask[fields.COLLAB_DESCRIPTOR_SYS_ID];
        var id;
        
        if(global.JSUtil.toBoolean(collabTask[fields.IS_INVITEE_GROUP]) || collabTask[fields.IS_INVITEE_GROUP] === "1") {
          id = "group_" + collabTask[fields.GROUP_INVITEE_SYS_ID];
        } else {
          id = "user_" + collabTask[fields.INVITEE_SYS_ID];
        }
        
        id += "_" + descriptor + "_" + Date.now();
        
        if (collabTask.sys_id) {
          delete collabTask.sys_id;
        }
        
        return {
             "body": gs.base64Encode(JSON.stringify(collabTask)),
             "id": id,
             "method":"POST",
             "url":"/api/now/table/sn_collab_request_dev_collab_task",
             "headers":[
                {
                   "name":"Content-Type",
                   "value":"application/json"
                },
                {
                   "name":"Accept",
                   "value":"application/json"
                }
             ]
          };
          
      });
      
      outputs["request_body"] = {
        batch_request_id: "invite_collaborators_" + Date.now(),
        rest_requests: restRequests
      };
    })(inputs, outputs);
