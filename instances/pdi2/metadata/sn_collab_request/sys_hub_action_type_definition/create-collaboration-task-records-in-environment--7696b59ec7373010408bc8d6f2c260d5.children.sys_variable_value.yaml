  value: |-
    (function execute(inputs, outputs) {
      var users = [];
      var groups = [];

      if(inputs["error_code"] || inputs["status_code"] !== 200) {
        throw gs.getMessage("Batch Request did not succeed");
      }
      
      try {
        var responseJSON = JSON.parse(inputs.response_body);
        var servicedRequests = responseJSON.serviced_requests || [];
        
        servicedRequests.forEach(function(servicedRequest) {
          var errorOnInsert = servicedRequest.status_code !== 201;
          var requestIdSplit = (servicedRequest.id || "").split("_");
          var isGroup = requestIdSplit[0] === "group";
          
          var result = {
            inviteeId: requestIdSplit[1],
            collaborationTaskId: null,
            errorOnInsert: errorOnInsert
          };
          
          if (!errorOnInsert) {
            // decode and parse body to get inserted recorded details
            var decodedBody = gs.base64Decode(servicedRequest.body);
            var parsedBody = JSON.parse(decodedBody);
            
            result.collaborationTaskId = (parsedBody.result || {}).sys_id;
          }
          
          if (isGroup) {
            groups.push(result);
          } else {
            users.push(result);
          }
        });
      } catch (e) {
        throw gs.getMessage("Error parsing through batch response in Create Collaboration Task Records in Environment action.");
      }
      
      outputs["users"] = users;
      outputs["groups"] = groups;
    })(inputs, outputs);
