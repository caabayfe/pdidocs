  value: "(function execute(inputs, outputs) {\n// ... code ...\nvar responseParsed = JSON.parse(inputs.responsebody);\nvar rolesResponseData = responseParsed.serviced_requests\noutputs.haserror = false;\nfor(var roleData in rolesResponseData){\n    if(rolesResponseData[roleData].status_code !== 201 ){\n        var responseBodyParsed = JSON.parse(gs.base64Decode(rolesResponseData[roleData].body));\n        outputs.errormessage = responseBodyParsed.error.message;\n        outputs.status = rolesResponseData[roleData].status_code;\n        outputs.haserror = true;\n        break;\n    }else{\n        outputs.haserror = false;\n        outputs.status = rolesResponseData[roleData].status_code;\n    }\n}\n})(inputs, outputs);\n\t\t"
