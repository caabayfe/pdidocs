"Ending point for the range of values for the vertical axis of the visualization."},{"message":"Axis position"},{"message":"Position of the primary axis."},{"message":"Show grid"},{"message":"Adds grid lines to the chart."},{"message":"Axis style"},{"message":"Style of the Y axis. Clean - Hides Y axis line, keeping just  axis values. No tick lines -  Removes all tick marks from the Y axis. Standard - Adds a line and tick marks to the Y axis."},{"message":"Y axis"},{"message":"Hide yAxis"},{"message":"Hides the vertical axis"},{"message":"Title to display on the horizontal axis of the visualization."},{"message":"Wrap labels"},{"message":"Wraps long element labels in the axis."},{"message":"Max label size, px"},{"message":"Maximum label size for the element names on the axis, in pixels."},{"message":"Truncation type"},{"message":"Determines where to truncate long element labels."},{"message":"Legend"},{"message":"Show legend"},{"message":"Toggles the display of the legend on the visualization."},{"message":"Show legend value"},{"message":"Displays the value corresponding to the area of the chart you hover on. The value displays as a tooltip and in the chart legend."},{"message":"Legend position"},{"message":"Legend location relative to the chart."},{"message":"Horizontal alignment"},{"message":"Horizontal alignment of elements in the legend."},{"message":"Max legend item width, px"},{"message":"Defines number of pixels after which the item of the legend will be truncated."},{"message":"Expand legend vertically"},{"message":"When enabled the legend will takes as much space as needed to fit legend without scrolling instead of maximum 2 lines."},{"message":"Data label"},{"message":"Show data labels"},{"message":"Displays the score for each data point."},{"message":"Data label position"},{"message":"Display data labels above, at the top, middle, or bottom of the bars."},{"message":"Show stacked value as"},{"message":"Determines how the data labels are shown for stacked bar chart."},{"message":"Show overlapping labels"},{"message":"Display values that overlap."},{"message":"Colors"},{"message":"Metric (bubble size)"},{"message":"Dimensions"},{"message":"Show 0 when no data available"},{"message":"Choose the display format when there is no value in the selected dataset or for the configuration."},{"message":"Value label size"},{"message":"Sets the size of the value label."},{"message":"Min value"},{"message":"Start value of the dial scale. If not set defined automatically."},{"message":"Max value"},{"message":"End value of the dial scale. If not set defined automatically."},{"message":"Inner radius"},{"message":"Decimal number to set the ratio of inner radius to outer radius of the dial chart. Allowed value from 0.7 to 0.95."},{"message":"Choose the display format when there is no value in the selected dataset or for the configuration"},{"message":"Gauge arc angle"},{"message":"Define the arc angle"},{"message":"Decimal number to set the ratio of inner radius to outer radius of the gauge chart. Allowed value from 0.7 to 0.95."},{"message":"Ranges"},{"message":"Start value of the gauge scale. If not set defined automatically."},{"message":"End value of the gauge scale. If not set defined automatically."},{"message":"Labels"},{"message":"Score label"},{"message":"Defines what should be shown in the secondary label above score value."},{"message":"Show label as primary"},{"message":"Changes placing of score and label. Should be used to emphasize e.g. the range label over exact value of the score."},{"message":"Show range limit"},{"message":"Shows the range limits values at the chart."},{"message":"Show range labels"},{"message":"Shows labels of the ranges."},{"message":"Legend orientation"},{"message":"Determines the layout of the legend within the visualization."},{"message":"Map settings"},{"message":"Map"},{"message":"Map to plot the data."},{"message":"Enables the data labels."},{"message":"Enables data labels."},{"message":"Hides the vertical axis."},{"message":"Style of the Y axis. Clean - Hides Y axis line, keeping just axis values. No tick lines -  Removes all tick marks from the Y axis. Standard - Adds a line and tick marks to the Y axis."},{"message":"Bar data label position"},{"message":"Show value on the same line"},{"message":"Displays the value on the same line in the legend. When false, shows the value on a second line."},{"message":"Show legend percentage"},{"message":"Displays the percentage with the value in the legend."},{"message":"Data label type"},{"message":"Determines the amount of information to provide in the data label."},{"message":"Max label size"},{"message":"Maximum size for the data labels, in characters."},{"message":"Determines where to truncate long labels."},{"message":"Show score update time"},{"message":"Displays the time of the last update of the single score."},{"message":"Use relative score time"},{"message":"Uses relative time to show the last update of the single score."},{"message":"Show score date"},{"message":"Shows the date of the score."},{"message":"Wrap elements"},{"message":"The default behaviour (ellipsis/truncation) is disabled and the elements will instead just wrap when too big."},{"message":"Score alignment"},{"message":"Aligns all single score visualization content to the starting edge, center, or ending edge of the visualization. Sparklines occupy the entire width and don''t change with the alignment."},{"message":"Score size"},{"message":"Adjusts the size of the score displayed in the visualization."},{"message":"Metric label position"},{"message":"Position for the metric label."},{"message":"Sparkline style"},{"message":"Style of sparkline chart."},{"message":"Score icon"},{"message":"Add icon to be shown in front of the score value."},{"message":"Icon style"},{"message":"Defines the style of the icon. When the chosen style has a background, the color is applied to the background. Otherwise, the color is applied to the icon itself."},{"message":"Trend by"},{"message":"Show range picker by default"},{"message":"When enabled the date range selector is visible on the data visualization. Otherwise, it is still available under the \"More options\" menu."},{"message":"Line stroke width"},{"message":"Sets the line stroke width for the items on the chart in pixels."},{"message":"Disable tooltip"},{"message":"Removes tooltips on hover."},{"message":"Show markers"},{"message":"Displays a symbol at each data point on the chart, including when values are zero or missing, making it easier to identify specific values."},{"message":"Show continuous line"},{"message":"When there is no data for a specific time, there will be no gap in the chart and it shows continuous line."},{"message":"Hide primary axis"},{"message":"Primary axis title"},{"message":"Primary axis range - from"},{"message":"Primary axis range - to"},{"message":"Primary axis position"},{"message":"Hide secondary axis"},{"message":"Hides the secondary vertical axis."},{"message":"Secondary axis title"},{"message":"Title to display on the secondary vertical axis of the visualization."},{"message":"Secondary axis range - from"},{"message":"Starting point for the range of values for the secondary vertical axis of the visualization."},{"message":"Secondary axis range - to"},{"message":"Ending point for the range of values for the secondary vertical axis of the visualization."},{"message":"Secondary axis position"},{"message":"Position of the secondary axis."},{"message":"Hide tertiary axis"},{"message":"Hides the tertiary vertical axis."},{"message":"Tertiary axis title"},{"message":"Title to display on the tertiary vertical axis of the visualization."},{"message":"Tertiary axis range - from"},{"message":"Starting point for the range of values for the tertiary vertical axis of the visualization."},{"message":"Tertiary axis range - to"},{"message":"Ending point for the range of values for the tertiary vertical axis of the visualization."},{"message":"Tertiary axis position"},{"message":"Position of the tertiary axis."},{"message":"Hide axis 4"},{"message":"Hides the 4th vertical axis."},{"message":"Axis 4 axis title"},{"message":"Title to display on the 4th vertical axis of the visualization."},{"message":"Axis 4 axis range - from"},{"message":"Starting point for the range of values for the 4th vertical axis of the visualization."},{"message":"Axis 4 axis range - to"},{"message":"Ending point for the range of values for the 4th vertical axis of the visualization."},{"message":"Axis 4 axis position"},{"message":"Position of the 4th axis."},{"message":"Hide axis 5"},{"message":"Hides the 5th vertical axis."},{"message":"Axis 5 axis title"},{"message":"Title to display on the 5th vertical axis of the visualization."},{"message":"Axis 5 axis range - from"},{"message":"Starting point for the range of values for the 5th vertical axis of the visualization."},{"message":"Axis 5 axis range - to"},{"message":"Ending point for the range of values for the 5th vertical axis of the visualization."},{"message":"Axis 5 axis position"},{"message":"Position of the 5th axis."},{"message":"Style of the Y axis. Clean - Hides Y axis line, keeping just axis values. No tick lines - Removes all tick marks from the Y axis. Standard - Adds a line and tick marks to the Y axis."},{"message":"X axis title"},{"message":"Hide xAxis"},{"message":"Hides the horizontal axis"}]'
