query: |-
  query ($table: String!, $sys_id: String!) {
    GlideSHN_Query(table: $table, sys_id: $sys_id) {
      totalMsg
      currentNum
      notificationTitle
      content {
        short_description
        message
        sys_id
        priority
      }
    }
  }
