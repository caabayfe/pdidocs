description: |-
  Number of overdue tasks is measured daily as unit #.
  The goal for this indicator is to minimize.
  It is the count on data source Unclosed.DataManager.Tasks, which is using the table: 
  cmdb_data_management_task
  with the following conditions:
  Active = true .and. State in (Pending, Open, Work in Progress) .and. or Active = true .and. Assigned to is empty .and. Assignment group is empty
  Additional conditions:
  Due date is not empty .and. Due date < Today
