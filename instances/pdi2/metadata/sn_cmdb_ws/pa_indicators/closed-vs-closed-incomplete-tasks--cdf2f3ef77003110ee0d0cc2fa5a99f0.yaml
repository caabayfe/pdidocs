description: |-
  Closed vs closed incomplete tasks is measured daily as unit #.
  The goal for this indicator is to maximize.
  It is the count on data source Closed.DataManager.Tasks, which is using the table: 
  cmdb_data_management_task
  with the following conditions:
  State in (Closed Complete, Closed Incomplete, Closed Skipped, Closed Cancelled) .and. Closed on Today
  Additional conditions:
  State = Closed Complete .or. State = Closed Incomplete
