description: This preset is a combination of 1) the CMDB config for the nodemap as it is tied to the (CMDB) MapSearchFilter controller and 2) the OOB COE preset delivered with the nodemap component. The COE preset is essentially merged into ours. The merged preset config in this preset will reference both the OOB COE controller and the CMDB MapSearchFilter controller as well which is possible since the CMDB MapSearchFilter controller has a dependency on the COE contoller so both controller can be referenced in the Properties and Event Handlers of this preset.
