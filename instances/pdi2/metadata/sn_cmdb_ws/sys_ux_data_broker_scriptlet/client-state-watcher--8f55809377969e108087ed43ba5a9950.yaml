api_name: sn_cmdb_ws.Client state watcher
batch_exclude: 'false'
description: This data broker is just used to watch client state (or a macroponent input prop) and upon change it will then trigger the handlers you have setup. This is helpful since there is no way in UXF to watch client state directly.
mutates_server_data: 'false'
name: Client state watcher
output_schema: ''
private: 'false'
props: |-
  [
    {
    "name": "state",
    "label": "Any client state variable that changes to trigger a handler",
    "description": "Can be any client state variable that when it changes will force the handler of your choice to execute.",
    "readOnly": false,
    "fieldType": "json",
    "mandatory": true
  },
    {
    "name": "optionalState",
    "label": "Any optional client state variable that changes to trigger a handler",
    "description": "Can be any client state variable that when it changes will force the handler of your choice to execute.",
    "readOnly": false,
    "fieldType": "json",
    "mandatory": false
  }
  ]
