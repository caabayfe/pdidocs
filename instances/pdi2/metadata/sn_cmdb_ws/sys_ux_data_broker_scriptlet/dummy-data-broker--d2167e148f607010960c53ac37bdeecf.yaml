api_name: sn_cmdb_ws.Dummy Data Broker
batch_exclude: 'false'
description: This data broker is just used to watch client state and then trigger the "Edit to destination" handler which will be attached to it. That handler does not work when used directly as it fires before all other handlers regardless of order. By adding this indirect mechanism to add the "link the destination" handler, it fires after other handlers are completed. The "link to destination" handler firing first when it's last is a UXF bug
