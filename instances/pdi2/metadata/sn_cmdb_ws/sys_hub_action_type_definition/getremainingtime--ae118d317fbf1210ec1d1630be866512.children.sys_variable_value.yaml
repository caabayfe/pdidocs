  value: |-
    (function execute(inputs, outputs) {
        var task = inputs.task;
        var percent = inputs.percent;

        outputs.remaining_time = 0;
        outputs.remaining_duration = new GlideDuration(0);
        
        if(!task.due_date) {
           
            return;
        }
            
        var rightNow = new GlideDateTime();
        var startDate = task.sys_created_on.getGlideObject();
        var endDate = task.due_date.getGlideObject();
        var usedDuration = 0;
        var totalDuration = endDate.getNumericValue() - startDate.getNumericValue();
        var percentageDuration = 0;
        var modifiedDuration = 0;
        var waitTime = 0;

        usedDuration = rightNow.getNumericValue() - startDate.getNumericValue();
        percentageDuration = Math.floor(totalDuration * (percent / 100));
            
        modifiedDuration = percentageDuration - usedDuration;

        // return the number of seconds this timer should wait
        if(modifiedDuration > 0) {
            outputs.remaining_time = modifiedDuration;
            outputs.remaining_duration = new GlideDuration(modifiedDuration);
        }

    })(inputs, outputs);
