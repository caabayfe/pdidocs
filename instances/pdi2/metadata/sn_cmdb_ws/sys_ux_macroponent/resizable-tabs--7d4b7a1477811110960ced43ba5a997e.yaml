description: |-
  Manages the user's prefs for the tabs component and resizable panes component. 

  NOTE: This is using client state in addition to saving user prefs on backend because 
  1) if you bind the component input configs directly to the output of the user prefs data broker, then you force the user to wait for a network roundtrip when page events occur and the components need to be re-rendered making the UX feel choppy whereas with client state it'll be instantaneous, and 
  2) there is no concept of defaults for user prefs and if the component inputs are binded directly to the output of the user prefs data broker, then the inputs will initially get null and behave unexpectedly. You could choose to not bind directly and instead use an intermediate script to set defaults, but then you still have problem #1 and you'll have to check the broker's repsone on every single execution for nulls so not ideal. With client state added, you can set initial values to be used if no user prefs exist, no scripts needed.
