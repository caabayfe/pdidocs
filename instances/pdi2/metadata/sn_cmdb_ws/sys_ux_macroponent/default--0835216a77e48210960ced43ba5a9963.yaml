    "message" : "<p><span style=\"font-size: 11pt;\">There were zero matching records for the currently set filter condition.&nbsp;</span></p>\n<p><span style=\"font-size: 11pt;\">To capture (more) metrics, go to the <a href=\"/now/cmdb/unifiedmap\" target=\"_blank\" rel=\"noopener\">Unified Map</a> page and add <span style=\"font-family: terminal, monaco; background-color: #fbeeb8;\"><strong>/perfLogging/true</strong></span>&nbsp;</span><span style=\"font-size: 11pt;\">to end of the URL. </span><span style=\"font-size: 11pt;\">Then for each new page refresh that loads or a search is performed using the search box, then a new perf metrics record entry will get added to the <a href=\"http://localhost:8080/now/nav/ui/classic/params/target/sn_cmdb_ws_um_perf_metrics_list.do%3Fsysparm_query%3D%26sysparm_first_row%3D1%26sysparm_view%3D\" target=\"_blank\" rel=\"noopener\">perf metrics table</a> and then be reflected on this dashboard.</span></p>\n<p><span style=\"font-size: 11pt;\">Be sure to wait 4 seconds or so after each query completes so that metrics are captured since the nodemap component is firing mapReady a bunch of times and this \"capture\" logic simply waits about 4 seconds after the last one to assume nodemap is done rendering.</span></p>",
