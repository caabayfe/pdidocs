    "message" : "(Maximum value is 90 days)",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<div>\n<div>Add the classes that you prefer seeing CMDB 360 data for in the Coverage charts. The total number of records that you can drill down to in the Coverage charts, is limited by the &lsquo;maximum number of records in a list view&rsquo; global setting (100,000 by default). By default, the classes of records in the drill-down set are random.</div>\n<div>&nbsp;</div>\n<div>The system calculates a record limit per class, to be included in the drill-down set of records:</div>\n<div>\n<ul>\n<li><strong>Automatic data weights:</strong> The &lsquo;maximum number of records in a list view&rsquo; is evenly divided between all added classes.</li>\n</ul>\n</div>\n<div>\n<ul>\n<li><strong>Manual data weights:</strong> The &lsquo;maximum number of records in a list view&rsquo; is divided between the added classes, according to the specified class weights.</li>\n</ul>\n</div>\n<div>If the number of actual records per added class, doesn&rsquo;t reach the computed limit for that class, then the system gives priority to random classes when generating the coverage charts data.</div>\n</div>",
