description: |-
  Get a dataset that consists of:  
  1) a base set of properties for each CI, 
  2) connections between CIs defined on cmdb_rel_ci as well as any defined "references" between CI classes, and 
  3) Service Mapping data if the passed in sysid is for an application service.
  Since data is hierarchical in structure, API takes a levels param to indicate how many parents and children to include. Default max nodes is 250 (configurable thru sys props). No limit on # of connections.
