description: |-
  CMDBWSProxyScriptExecutor is a proxy class used to invoke scripted APIs from the CMDB WS scope since the CMDB WS app release cycle is not in tandem with the platform family release where Scripted APIs are defined & built. We need to invoke scripted APIs gracefully; hence this class is used.

  Usage: initialize CMDBWSProxyScriptExecutor with the namespace object & the scripted API class we need to

  Note: Only static scripted APIs are supported. Object creation feature will be for the future (post ES6 compatibility).
