api_name: sn_cmdb_ws.Explore CI - Fetch Related Lists
batch_exclude: 'false'
description: Fetches related list items for given record
mutates_server_data: 'false'
name: Explore CI - Fetch Related Lists
output_schema: ''
private: 'true'
props: |-
  [
    {
      "name": "table",
      "label": "Table",
      "fieldType": "table_name",
      "readOnly": false,
      "mandatory": true,
      "description": "Table name"
    },
    {
      "name": "sysId",
      "label": "Sys ID",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "Sys ID of the record"
    },
     {
      "name": "view",
      "label": "view",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "View name to get related lists"
    },
   {
      "name": "query",
      "label": "Query",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": false,
      "description": "Query string to apply to the record"
    }
  ]
query: |-
  query ($table: String!, $sysId: String!, $view: String, $query: String) {
    GlideLayout_Query {
      formLayout(table: $table, view: $view, sysId: $sysId, query: $query) {
        relatedLists {
          sourceTable
          targetTable
          count
          filter
          displayLabel
          label
          value
          relatedField
        }
      }
    }
  }
