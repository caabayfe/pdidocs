  value: |-
    (function execute(inputs, outputs) {
      try {
          var jsonObject = JSON.parse(inputs.progressResponse);
          if (typeof jsonObject != undefined && jsonObject != null) {

          var result = jsonObject["result"];
          if (typeof result != undefined && result != null) {
            var status = result.status;
            var statusLabel = result.status_label;
            var statusMessage = result.status_message;
            var statusDetail = result.status_detail;
            var error = result.error;
            var percentComplete = result.percent_complete;

            if (typeof result.backout_problem_count != undefined && result.backout_problem_count != null)
              outputs.backout_problem_count = result.backout_problem_count;

            if (typeof result.backout_problem_url != undefined && result.backout_problem_url != null)
              outputs.backout_problem_url = result.backout_problem_url;

            outputs.status = status;
            outputs.status_label = statusLabel;
            outputs.status_message = statusMessage;
            outputs.status_detail = statusDetail;
            outputs.error = error;
            outputs.percent_complete = percentComplete;
          }
        }
      } catch (error) {
        outputs.status = "3";
        outputs.status_label = "Failed";
        outputs.error = error;
      }
    })(inputs, outputs);
