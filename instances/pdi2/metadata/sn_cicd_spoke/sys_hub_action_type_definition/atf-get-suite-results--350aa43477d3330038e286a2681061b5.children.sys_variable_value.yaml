  value: |-
    (function execute(inputs, outputs) {
    try {  
          var jsonObject = JSON.parse(inputs.resultsResponse);
      	  if (typeof jsonObject != undefined && jsonObject != null) {
          
          var result_json = jsonObject["result"];
          if (typeof result_json != undefined && result_json != null) {
              var status = result_json.status;
              var status_label = result_json.status_label;
              var status_message = result_json.status_message;
              var status_detail = result_json.status_detail;
              var error = result_json.error;
              var test_suite_status = result_json.test_suite_status;
              var test_suite_duration = result_json.test_suite_duration;
              var rolledup_test_success_count = result_json.rolledup_test_success_count;
              var rolledup_test_failure_count = result_json.rolledup_test_failure_count;
              var rolledup_test_error_count = result_json.rolledup_test_error_count;
              var rolledup_test_skip_count = result_json.rolledup_test_skip_count;
              var test_suite_name = result_json.test_suite_name;
    		  var suite_status = result_json.test_suite_status;

              outputs.status = status;
              outputs.status_label = status_label;
              outputs.status_message = status_message;
              outputs.status_detail = status_detail;
              outputs.error = error;
              outputs.test_suite_status = test_suite_status;
              outputs.test_suite_duration = test_suite_duration;
              outputs.rolledup_test_success_count = rolledup_test_success_count;
              outputs.rolledup_test_failure_count = rolledup_test_failure_count;
              outputs.rolledup_test_error_count = rolledup_test_error_count;
              outputs.rolledup_test_skip_count = rolledup_test_skip_count;
              outputs.test_suite_name = test_suite_name;
              outputs.test_suite_status = suite_status;
            
              if (typeof result_json.links != undefined && result_json.links != null) {
                if (typeof result_json.links.results != undefined && result_json.links.results != null) {
                  outputs.result_url = result_json.links.results.url;
                }
              }
            } 
        }
      } catch (error) {
        outputs.status = "3";
        outputs.status_label = "Failed";
        outputs.error = error;
      }
    })(inputs, outputs);
