description: |-
  <p>Commit multiple retrieved update sets in order onto the provided instance. The contents of the retrieved update sets are based on the provided instance.</p>
  <p><b>Inputs:</b></p>
  <ul>
      <li><b>Instance URL</b> - The URL of the Instance where the retrieved update sets come from and where they should be committed.</li>
      <li><b>Credential Alias</b> - The Connection and Credential alias must be of type "Credential" and must have user with "sn_cicd.sys_ci_automation" role."</li>
      <li><b>Retrieved Update Set IDs</b> - Sys Ids of the retrieved update sets to be committed that exist on the provided instance.</li>
      <li><b>API Version</b> - This optional parameter allows the version of the related CICD REST API to be specified. When not present, the latest version of the API will be used.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
      <li><b>Error</b> - Reason for error. Populated only when an error occurs.</li>
      <li><b>HTTP Status</b> - The HTTP status code of the response</li>
      <li><b>Status Label</b> - The label corresponding to the 'status'. Will be one of "Pending", "Running", "Successful", "Failed", "Cancelled"</li>
      <li><b>Status Message</b> - More information on why the operation failed if available. Can be empty.</li>
      <li><b>Status Detail</b> - More details on why the operation failed if available. Can be empty.</li>
      <li><b>Progress Id</b> - The sys_id of the execution tracker for this request. Can be used to track the progress of the request.</li>
      <li><b>Progress URL</b> - The URL of REST endpoint to get progress from sys_id of the execution tracker for this request.</li>
      <li><b>Commit Items</b> - A JSON array of objects (object structure below) listing information for the retrieved update sets specified that failed a preflight validation check. Can be empty.</li>
      <ul>
          <li><b>remote_update_set_id</b> - Sys Id of one of the specified retrieved update sets to be committed representing this commit item.</li>
          <li><b>local_update_set_id</b> - The sys_id of the sys_update_set record that was created for this commit if applicable.</li>
          <li><b>status</b> - Status of the retrieved update set. Will be one of "not_processed", "failed", "errored", "successful", "skipped"</li>
          <li><b>status_message</b> - More information on the result of the operation if available. Can be empty.</li>
          <li><b>tracker_id</b> - Sys Id of the execution tracker used to track the progress of this commit.</li>
          <li><b>url</b> - The URL of REST endpoint to get progress from sys_id of the execution tracker for this commit.</li>
      </ul>
  </ul>
  <p> To use this action, a corresponding CICD connection and credential must be created and associated with the Instance URL used above.  <a target="_blank" href="https://docs.servicenow.com/search?q=Create+a+Connection+%26+Credential+alias">Learn More</a></p>
