  value: |-
    (function execute(inputs, outputs) {
      try {
    	var jsonObject = JSON.parse(inputs.scanResponse);
      	if (typeof jsonObject != undefined && jsonObject != null) {
          var result = jsonObject["result"];
          if (typeof result != undefined && result != null) {
            var status = result.status;
            var statusLabel = result.status_label;
            var statusMessage = result.status_message;
            var statusDetail = result.status_detail;
            var error = result.error;
            
        //check for links to be available    
        if (typeof result.links != undefined && result.links != null) {
          if (typeof result.links.progress != undefined && result.links.progress != null) {
            var progressUrl = result.links.progress.url;
            var progressId = result.links.progress.id;
          }
            
          if (typeof result.links.source != undefined && result.links.source != null) {
            var sourceId = result.links.source.id;
            var sourceUrl = result.links.source.url;
          }
          
          if (typeof result.links.results != undefined && result.links.results != null) {
            var resultId = result.links.results.id;
            var resultUrl = result.links.results.url;
          }

          if (typeof result.links.findings != undefined && result.links.findings != null) {
            var findingLabel = result.links.findings.label;
            var findingUrl = result.links.findings.url;
          }
        }

            outputs.status = status;
            outputs.status_label = statusLabel;
            outputs.status_message = statusMessage;
            outputs.status_detail = statusDetail;
            outputs.error = error;
            outputs.progress_url = progressUrl;
            outputs.progress_id = progressId;
            outputs.source_id = sourceId;
            outputs.source_url = sourceUrl;
            outputs.result_id = resultId;
            outputs.result_url = resultUrl;
            outputs.finding_label = findingLabel;
            outputs.finding_url = findingUrl;
          }
        }
      }catch (error) {
        outputs.status = "3";
        outputs.status_label = "Failed";
        outputs.error = error;
      }
    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
