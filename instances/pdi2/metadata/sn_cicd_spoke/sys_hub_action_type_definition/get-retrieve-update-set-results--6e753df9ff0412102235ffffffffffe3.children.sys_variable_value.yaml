  value: |-
    (function execute(inputs, outputs) {
      try {
          var jsonObject = JSON.parse(inputs.progressResponse);
          if (typeof jsonObject != undefined && jsonObject != null) {

          var result = jsonObject["result"];
          if (typeof result != undefined && result != null) {
            var status = result.status;
            var statusLabel = result.status_label;
            var statusMessage = result.status_message;
            var statusDetail = result.status_detail;
            var error = result.error;
            var percentComplete = result.percent_complete;

            if (typeof result.remote_update_set_id != undefined && result.remote_update_set_id != null) {
              outputs.remote_update_set_id = result.remote_update_set_id;
            }

            if (typeof result.was_previewed != undefined && result.was_previewed != null && result.was_previewed) {
              outputs.was_previewed = result.was_previewed;
              if (typeof result.has_preview_problem != undefined && result.has_preview_problem != null) {
                outputs.has_preview_problem = result.has_preview_problem;

                if (typeof result.preview_problem_count != undefined && result.preview_problem_count != null)
                  outputs.preview_problem_count = result.preview_problem_count;

                if (typeof result.preview_problem_url != undefined && result.preview_problem_url != null)
                  outputs.preview_problem_url = result.preview_problem_url;

              }
            }

            outputs.status = status;
            outputs.status_label = statusLabel;
            outputs.status_message = statusMessage;
            outputs.status_detail = statusDetail;
            outputs.error = error;
            outputs.percent_complete = percentComplete;
          }
        }
      } catch (error) {
        outputs.status = "3";
        outputs.status_label = "Failed";
        outputs.error = error;
      }
    })(inputs, outputs);
