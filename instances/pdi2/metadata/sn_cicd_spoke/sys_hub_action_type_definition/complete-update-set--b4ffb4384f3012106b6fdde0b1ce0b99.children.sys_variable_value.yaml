  value: |-
    (function execute(inputs, outputs) {
        try {
            var jsonObject = JSON.parse(inputs.response);
            if (typeof jsonObject != undefined && jsonObject != null) {
                var result = jsonObject["result"];
                // success
                if (typeof result != undefined && result != null) {   
                    var state = result.state;
                    var name = result.name;
                    outputs.state = state;
                    outputs.name = name;
                    outputs.status = "2";
                } else {
                    var errorObj = jsonObject["error"];
                    if (typeof errorObj != undefined && errorObj != null) {
                        throw errorObj.message;
                    }
                }          
            }        
        } catch (error) {
            outputs.status = "3";
            outputs.status_label = "Failed";
            outputs.error = error;
        }
    })(inputs, outputs);
