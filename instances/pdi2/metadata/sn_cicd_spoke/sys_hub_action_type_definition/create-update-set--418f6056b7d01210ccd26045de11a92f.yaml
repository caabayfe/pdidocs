description: |-
  <p>Given an update set name and application ID or scope name, this action will create the update set on the given instance</p>
  <p><b>Inputs:</p>
  </b>
  <ul>
     <li><b>Update Set Name</b> - The name of the update set you wish to create</li>
     <li><b>Application ID</b> - The application ID of the application the update set will be created in</li>
    <li><b>Scope</b> - The scope name of the application the update set will be created in</li>
    <li><b>Description</b> - The description about the update set</li>
     <li><b>Instance URL</b> - The URL of the instance where you wish to install the application</li>
     <li><b>Credential Alias</b> - The connection and credential alias must be of type "Credential" and must have user with "sn_cicd.sys_ci_automation" role</li>
     <li><b>API Version</b> - This optional parameter allows the version of the related CICD REST API to be specified.  When not present, the latest version of the API will be used.</li>
  </ul>
  <p><b>Outputs:</p>
  </b>
  <ul>
     <li><b>Status</b> - Will be set to "2", if the request is "Successful". Will be set to "3", if the request is "Failed"</li>
     <li><b>Error</b> - Reason for error. Populated only when an error occurs</li>
     <li><b>HTTP Status</b> - The HTTP status code of the response. Will be set to “201” if update set is created</li>
     <li><b>Status Label</b> - The label corresponding to the 'status'. Will be one of "Successful", "Failed"</li>
     <li><b>Status Message</b> - More information on why the operation failed if available. Can be empty.</li>
     <li><b>Status Detail</b> - More details on why the operation failed if available. Can be empty.</li>
     <li><b>Update Set ID</b> - The sys id of the update set that is created by this action. Can be empty if the action failed</li>
     <li><b>Update Set Name</b> - The name of the update set that is created by this action. Can be empty if the action failed</li>
  </ul>
  <p><b>Error Messages:</p>
  </b>
  <ul>
     <li>Missing CI/CD Role (sn_cicd.sys_ci_automation)</li>
     <li>Create update set is disabled</li>
     <li>Missing required parameter: update_set_name</li>
     <li>Missing required parameter: sys_id or scope required</li>
     <li>Invalid app scope</li>
     <li>Invalid app sys_id</li>
     <li>Unable to create update set</li>
    <li>The current user does not have permission to create update set</li>
  </ul>
  <p> To use this action, a corresponding CICD connection and credential must be created and associated with the instance URL used above <a target="_blank" href="https://docs.servicenow.com/search?q=Create+a+Connection+%26+Credential+alias">Learn More</a></p>
