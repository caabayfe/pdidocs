description: |-
  <p>This flow will set multiple update sets to be in completed state given the list of sys_ids onto the provided instance.</p>
  <p><b>Inputs:</p>
  </b>
  <ul>
      <li><b>Update Set IDs</b> - List of Sys Id of the update sets to be completed that exist on the provided instance.</li>  
      <li><b>Instance URL</b> - The URL of the Instance where the update sets are coming from and where they should be set to completed.</li>
      <li><b>Credential Alias</b> - The Connection and Credential alias must be of type "Credential" and must have user with "sn_cicd.sys_ci_automation" role."</li>
  </ul>
  <p><b>Outputs:</p>
  </b>
  <ul>
      <li><b>Status</b> - Status will be one of the following: 2 (Successful) or 3 (Failed).</li>
      <li><b>Result</b> - An object where the key is the Sys id and the value is the corresponding action response</li>  
      <ul>
      	<li><b>HTTP Status</b> - The HTTP status code of the response</li>
          <li><b>Error</b> - Reason for error. Populated only when an error occurs.</li>  
      	<li><b>State</b> - The state of the update set after execution</li>
      	<li><b>Name</b> - The name of the update set being executed</li>      
      </ul>
  </ul>
  <p> To use this action, a corresponding CICD connection and credential must be created and associated with the Instance URL used above.  <a target="_blank" href="https://docs.servicenow.com/search?q=Create+a+Connection+%26+Credential+alias">Learn More</a></p>
