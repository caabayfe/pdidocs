copied_from_name: Apply Changes From Source Contro
description: |-
  <p>Import Application from Source Control using Repository URL on the given instance.</p>
  <p><b>Inputs:</p>
  </b>
  <ul>
     <li><b>Repo URL</b> - The URL (HTTPS or SSH) to the Git repository where the application files reside.</li>
     <li><b>Branch Name</b> - Branch name on the Git repository to import.</li>
     <li><b>Credential Sys ID</b> - The sys_id of the basic authentication or SSH credential with access to remote git repository. If left empty, API will use the credential sys_id set in the "glide.source_control. default_basic_auth_credential_sys_id" or "glide.source_control. default_ssh_private_key_credential_sys_id" property.</li>
     <li><b>MID Server Sys ID</b> - The sys_id of the MID server (ecc_agent) used for the connection.</li>
     <li><b>Auto Upgrade Base Application</b> - This field will only be used when importing a customization to a store application. Set to false if base store app should not upgrade when the application is built on newer version of base app compared to what is installed on the instance. Else leave as default, true. </li>
     <li><b>Instance URL</b> - The URL of the Instance on which app needs to be imported.</li>
     <li><b>Credential Alias</b> - The Connection and Credential alias must be of type "Credential" and must have user with "sn_cicd.sys_ci_automation" role."</li>
     <li><b>API Version</b> - This optional parameter allows the version of the related CICD REST API to be specified.  When not present, the latest version of the API will be used.</li>
  </ul>

  <p><b>Outputs:</p>
  </b>
  <ul>
     <li><b>HTTP Status</b> - The HTTP status code of the response.</li>
     <li><b>Status</b> - Will be set to "0", if the request is "Pending". Will be set to "1", if the request is in "Running" state. Will be set to "2", if the request is "Successful". Will be set to "3", if the request is "Failed". Will be set to "4", if the request is "Cancelled".</li>
     <li><b>Status Label</b> - The label corresponding to the 'status'. Will be one of "Pending", "Running", "Successful", "Failed", "Cancelled"</li>
     <li><b>Status Message</b> - More information on why the operation failed if available. Can be empty.</li>
     <li><b>Status Detail</b> - More details on why the operation failed if available. Can be empty.</li>
     <li><b>Error</b> - Reason for error. Populated only when an error occurs.</li>
  </ul>

  <p> To use this subflow, a corresponding CICD connection and credential must be created and associated with the Instance URL used above.  <a target="_blank" href="https://docs.servicenow.com/search?q=Create+a+Connection+%26+Credential+alias">Learn More</a></p>
