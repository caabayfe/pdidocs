job_details: "Prameters\n -Name: keyType\n - Type : String\n - Supported Values: IRK, SEK\n \n\t\t\tThis job will revoke the grant access rule for the keyType provided and delete the External Key Records\n\t\t\tassociated with other instances\n \n 1. If the keyType is IRK check if instance rekey job completed\n\t\t\tsuccessfully\n 2. If the jobs did not complete successfully queue job to run in 24 hours\n 3. If jobs\n\t\t\tdid complete successfully revoke grant rule for IRKs\n 4. If revocation was not successful queue job to\n\t\t\trun in 24 hours\n 5. If the keyType is SEK check if SEK rekey job completed successfully\n 6. If the\n\t\t\tjobs did not complete successfully queue job to run in 24 hours\n 7. If jobs did complete successfully\n\t\t\trevoke grant rule for SEKs\n 8. If revocation was not successful queue job to run in 24 hours.\n\t\t"
name: Revoke Grant Rule Job
