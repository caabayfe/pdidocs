handler_class: com.glide.kmf.rekey.controller.SEKRekeyJobController
job_details: "1. The job will query the Storage Encrypted data on the instance in property configured batches and\n            fetch the records that should be rekeyed\n 2. The job will then rekey all fetched Storage Encrypted data\n            and log the status\n 3. After all the batches are processed successfully the job will check the status\n            4. The job will delete the SEK usage flags for the SEKs that successfully rekeyed all the data\n 4. IF\n            the job succeeded and all the instance keys were successfully rekeyed\n 5. The job will attempt to revoke\n            the SEK grant rule access on bagheera and return 0\n 6. IF there are any failures the job will schedule\n            itself to retry at a later time based on property configured Exponential Backoff with jitter and return 1\n            \n Properties used in this Job\n \n glide.crypto.core.sek.rekey.retry_threshold -> The number of\n            retries for this Job (default: 3, min: 0, max:10)\n glide.crypto.core.sek.rekey.retry_min_timeout ->\n            The minimum time to wait between retries (default: 3 seconds, min: 1 second, max: 3 hours)\n            glide.crypto.core.sek.rekey.retry_max_timeout -> The maximum time to wait between retries (default: 3\n            seconds, min: 1 second, max: 3 hours)\n glide.crypto.core.sek.rekey.batch_size -> The batch size to\n            process rekeys in (default: 100, min: 80, max: 500)\n        "
name: SEK Rekey Job
sys_name: SEK Rekey Job
