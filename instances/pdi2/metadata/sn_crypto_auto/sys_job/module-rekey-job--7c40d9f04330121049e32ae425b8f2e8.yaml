application: ''
handler_class: com.glide.kmf.rekey.controller.ModuleRekeyJobController
job_details: "1. The job will query the KMF module key table in property configured batches and fetch the module\n            keys that should be rekeyed\n 2. The job will then rekey all fetched module keys and log the status\n            3. After all the batches are processed successfuly the job will check the status\n 4. The job will delete\n            the unused IKEK/IHMACs that were processed as part of the Module Rekey job\n 5. IF the job succeeded and\n            all the module keys were successfully rekeyed return 0\n 6. IF there are any failures the job will\n            schedule itself to retry at a later time based on property configured Exponential Backoff with jitter and\n            return 1\n \n Properties used in this Job\n \n glide.crypto.core.module.rekey.retry_threshold ->\n            The number of retries for this Job (default: 3, min: 0, max:10)\n            glide.crypto.core.module.rekey.retry_min_timeout -> The minimum time to wait between retries (default: 3\n            seconds, min: 1 second, max: 3 hours)\n glide.crypto.core.module.rekey.retry_max_timeout -> The\n            maximum time to wait between retries (default: 3 seconds, min: 1 second, max: 3 hours)\n            glide.crypto.core.module.rekey.batch_size -> The batch size to process rekeys in (default: 100, min: 80,\n            max: 500)\n        "
name: Module Rekey Job
sys_name: Module Rekey Job
