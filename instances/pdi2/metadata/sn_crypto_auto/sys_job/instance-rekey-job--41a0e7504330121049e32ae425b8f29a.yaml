application: ''
handler_class: com.glide.kmf.rekey.controller.InstanceRekeyJobController
job_details: "1. The job will query the KMF instance key table in property configured batches and fetch the\n            instance keys that should be rekeyed\n 2. The job will then rekey all fetched instance keys and log the\n            status\n 3. After all the batches are processed successfully the job will check the status\n 4. IF the\n            job succeeded and all the instance keys were successfully rekeyed\n 5. The job will attempt to revoke the\n            IRK grant rule access on bagheera if at least 1 record was from another instance and return 0\n 6. IF\n            there are any failures the job will schedule itself to retry at a later time based on property configured\n            Exponential Backoff with jitter and return 1\n \n Properties used in this Job\n \n            glide.crypto.core.instance.rekey.retry_threshold -> The number of retries for this Job (default: 3, min:\n            0, max:10)\n glide.crypto.core.instance.rekey.retry_min_timeout -> The minimum time to wait between\n            retries (default: 3 seconds, min: 1 second, max: 3 hours)\n            glide.crypto.core.instance.rekey.retry_max_timeout -> The maximum time to wait between retries (default:\n            3 seconds, min: 1 second, max: 3 hours)\n glide.crypto.core.instance.rekey.batch_size -> The batch\n            size to process rekeys in (default: 100, min: 80, max: 500)\n        "
name: Instance Rekey Job
sys_name: Instance Rekey Job
