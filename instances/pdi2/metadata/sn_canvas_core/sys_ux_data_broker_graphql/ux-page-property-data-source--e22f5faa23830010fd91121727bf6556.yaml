api_name: sn_canvas_core.UX Page Property Data Source
batch_exclude: 'false'
description: Fetches all UX Page Properties associated with the UX Page Registry
mutates_server_data: 'false'
name: UX Page Property Data Source
output_schema: ''
private: 'false'
props: |-
  [
  {
      "name": "uxPageRegistrySysId",
      "label": "UX Page Registry",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "Reference to a UX Page registry"
    }
  ]
query: |-
  query ($uxPageRegistrySysId: String){
    GlideRecord_Query {
  sys_ux_page_registry(sys_id:$uxPageRegistrySysId) {
        _results{
          auth_routes{
            value
          }
          _query{
           GlideRecord_Query {
            sys_ux_page_property(queryConditions: "page=$$parent.sys_id$$") {
                _results {
                  name {
                    value
                  }
                  type {
                    value
                  }
                  value {
                    value
                  }
                  route {
                    _reference {
                      route_type {
                        value
                      }
                      fields {
                        value
                      }
                    }
                  }
                  page {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
script: ''
sys_name: UX Page Property Data Source
sys_policy: ''
type: ''
use_record_domain: 'false'
