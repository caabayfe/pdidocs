query: |-
  mutation ($segment_sys_id: String!, $agent_sys_id: String!, $interaction_sys_id: String!, $wrap_up_code: String, $notes: String, $include_session_messages_on_success: Boolean) {
    now {
      wrapUpSegment {
        updateSegment(
          segment_sys_id: $segment_sys_id
          agent_sys_id: $agent_sys_id
          interaction_sys_id: $interaction_sys_id
          wrap_up_code: $wrap_up_code
          notes: $notes
          include_session_messages_on_success: $include_session_messages_on_success
        ) {
          message
          success
          sessionMessages {
            text
            type
          }
        }
      }
    }
  }
