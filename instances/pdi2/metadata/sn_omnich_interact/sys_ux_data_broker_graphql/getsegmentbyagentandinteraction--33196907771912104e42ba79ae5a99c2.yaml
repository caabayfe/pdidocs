api_name: sn_omnich_interact.getSegmentByAgentAndInteraction
batch_exclude: 'false'
description: ''
mutates_server_data: 'true'
name: getSegmentByAgentAndInteraction
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "agent_id",
      "label": "Agent id",
      "description": "Sys Id of current logged in user",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "interaction_id",
      "label": "Interaction id",
      "description": "Interaction sys id of the current record",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($agent_id: String!, $interaction_id: String!) {
    now {
      wrapUpSegment {
        segmentByAgentAndInteraction(agent_id: $agent_id, interaction_id: $interaction_id) {
          segment {
            sys_id
            agent
            external
            interaction
            state
            segment_table
            segmented
            external_segment_id
            segment_id
            notes
            opened_on
            refreshed_on
            submitted_on
            awaiting_confirmation
            confirmed_on
            timed_out
            ai_notes
            ai_wrap_up_code {
              code
              description
              active
              external
              sys_id
              translated_code
              translated_description
            }
            wrap_up_configuration {
              name
              duration
              sys_id
              enable_codes
              show_timer
              enforce_duration
              conditions
              external
              enable_ai_code
              enable_ai_notes
              use_third_party_ai
              use_ai_code_as_default
              default_code {
                code
                description
                active
                external
                sys_id
              }
              allowed_codes {
                code
                description
                active
                external
                sys_id
              }
            }
          }
          message
          success
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Agent id",
    "comment" : ""
  }, {
