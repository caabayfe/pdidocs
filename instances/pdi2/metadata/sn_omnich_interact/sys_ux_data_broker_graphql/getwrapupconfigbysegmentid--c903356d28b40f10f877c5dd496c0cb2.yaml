api_name: sn_omnich_interact.getWrapUpConfigBySegmentId
batch_exclude: 'false'
description: ''
mutates_server_data: 'true'
name: getWrapUpConfigBySegmentId
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "segment_id",
      "label": "Segment id",
      "description": "Sys Id of the wrap-up segment",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query getConfigBySegmentId($segment_id: String!) {
    now {
      wrapUpSegment {
        segmentById(segment_id: $segment_id) {
          segment {
            opened_on
            refreshed_on
            wrap_up_configuration {
              sys_id
              duration
              enforce_duration
              show_timer
            }
          }
          success
          message
        }
      }
    }
  }
required_translations: ''
