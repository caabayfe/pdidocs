schema: |-
  schema {
  	query: Query,
  	mutation: Mutation
  }

  type Query {
  	actions(table: String!, sysId : String!) : [Action],
  	actionToolbarControls(table: String!, sysId: String!) : [ActionToolbarControl],
  	searchParams(commandName: String!, query: String!, table: String!, sysId: String!, index: Int!, paginationToken: String) : ParameterSearchResponse,
  	wwnaActions(table: String!, sysId : String!) : [Action]
  }

  type Mutation {
  	invokeAction(table: String!, sysId: String!, message: String!, context: String!) : ActionResult
  }

  type ActionToolbarControl { 
      sysID: String,
      name: String,
      iconName: String,
  	iconImage: String,
  	actionID: String,
  	parameterValues: String,
      autoSubmit: Boolean,
  	privateEnabled: Boolean
  }

  type Action {
  	commandName: String,
  	sysId: String,
  	name: String,
  	acceptsStringParameter: Boolean,
  	parameterLabel: String,
  	parameterHint: String,
  	executionMode: String,
  	params: [Parameter],
  	actionType: String,
  	actionGroup: String,
  	tableName: String
  }

  type Parameter {
  	noResultsMessage: String,
  	noMatchingResultsMessage: String,
  	name: String,
  	order: Int,
  	queryMode: String,
  	sysId: String
  }

  type ParameterSearchResponse {
  	items: [ParameterSearchResult],
  	dispatchAction: SeismicAction
  }

  type ParameterSearchResult {
  	displayValue: String,
  	value: String,
  	details: Details,
  	badge: Badge,
  	aisDetails: AISDetails
  }

  type AISDetails {
  	title: String,
  	titleLabel: String,
  	summary: String,
  	detailLabelType: String,
  	detailLabelSeparator: String,
  	detailLabelOne: String,
  	detailValueOne: String,
  	detailLabelTwo: String,
  	detailValueTwo: String,
  	textHeaderLabelOne: String,
  	textHeaderLabelTwo: String,
  	textHeaderLabelThree: String,
  	nextPaginationToken: String,
  	prevPaginationToken: String
  }

  type Details {
  	title: String,
  	body: String
  }

  type Badge {
  	number: Int,
  	tooltip: String
  }

  type ActionResult {
  	message: String,
  	success: Boolean,
  	dispatchAction: SeismicAction
  }

  type SeismicAction {
  	type: String,
  	payload: String
  }
