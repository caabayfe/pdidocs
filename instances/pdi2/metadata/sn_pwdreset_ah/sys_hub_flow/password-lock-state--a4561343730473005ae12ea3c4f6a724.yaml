description: |-
  <html></html><p>Get a local ServiceNow user accounts lock status</p>
   <p><b>Inputs:</b>
    </p><ul><li><b>Password Reset Request</b> - Password request record.</li></ul>

   <p><b>Outputs:</b>
    </p><ul><li><b>Status</b> - Will be set to Success if the request succeeds or Error if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li><li><b>Locked</b> - True if the user is locked. False if the user is not locked. Populated only if Status is Success.</li></ul>

   <p><b>Error Messages:</b>
    </p><ul><li>User Inactive</li><li>Invalid User Record</li><li>Invalid Request</li><li>The request has no process associated with it.</li><li>The user associated with request is not valid.</li><li>The process associated with request is not valid.</li><li>There are more than one credential stores defined for process.</li><li>The credential store associated with request is not valid.</li></ul>
