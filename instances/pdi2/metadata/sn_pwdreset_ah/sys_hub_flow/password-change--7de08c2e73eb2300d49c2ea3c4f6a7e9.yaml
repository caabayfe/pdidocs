description: |-
  <html></html><p>Changes the password of an authenticated and unlocked user account to the provided new password. Verifies the new password conforms to the password format and history policies. Produces an error if the user is not authenticated or is locked out. Use “Reset Password” to unlock a locked user account and require a password change.</p>
   <p><b>Inputs:</b>
    </p><ul><li><b>Password Reset Request</b> - Password request record.</li><li><b>Current Password</b> - The current password of the user.</li><li><b>New Password</b> - The new password the user wants to set.</li></ul>


   <p><b>Outputs:</b>
    </p><ul><li><b>Status</b> - Will be set to Success if the request succeeds or Error if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>

   <p><b>Error Messages:</b>
    </p><ul><li>Invalid User Record</li><li>User is locked</li><li>Invalid Request</li><li>The request has no process associated with it.</li><li>The user associated with request is not valid.</li><li>The process associated with request is not valid.</li><li>There are more than one credential stores defined for process.</li><li>The credential store associated with request is not valid.</li><li>The current password is incorrect</li><li>You used that password recently. Choose a different password</li></ul>
