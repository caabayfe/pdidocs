description: |-
  <html></html><p>Resets the password. Provides a temporary password and prompts user to change the password. Ensures that new password conforms to the password format and history policies.</p>
   <p><b>Inputs:</b>
    </p><ul><li><b>Password Reset Request</b> - Password request record.</li><li><b>Password</b> - Password for the user being reset.</li></ul>

   <p><b>Outputs:</b>
    </p><ul><li><b>Status</b> - Will be set to Success if the request succeeds or Error if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>

   <p><b>Error Messages:</b>
    </p><ul><li>Invalid User Record</li><li>Invalid Request</li><li>The request has no process associated with it.</li><li>The user associated with request is not valid.</li><li>The process associated with request is not valid.</li><li>There are more than one credential stores defined for process.</li><li>The credential store associated with request is not valid.</li><li>non_fatal_failure (In case of password policy failure including history policy)</li></ul>
  <html></html>
