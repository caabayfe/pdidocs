  value: |-
    (function execute(inputs, outputs) {
      var SUBFLOW_TIMEOUT = parseInt(gs.getProperty('password_reset.subflow.timeout', 60000));
      var subflow = inputs.subflow;
      var subflowInputs = {
           "user_name": inputs.user.user_name,
           "password_reset_process": inputs.password_reset_process
      };
      outputs.password_never_expires = false;
      try {
            var result = sn_fd.FlowAPI.executeSubflow(subflow, subflowInputs, SUBFLOW_TIMEOUT);
            outputs.last_password_reset_date = result.last_password_reset_date;
            outputs.password_expiration_date = result.password_expiration_date;
            outputs.status = result.status;
            outputs.error_message = result.error_message;
            outputs.password_never_expires = result.password_never_expires;
        } catch (error) {
            outputs.status = "Error";
            outputs.error_message = gs.getMessage("Flow stopped executing");
        }
    })(inputs, outputs);
