description: |-
  <p> Updates the Password Expiration records based on the given user and process</p>
  <p>
      <b>Inputs:</b>
  </p>
  <ul>
      <li>
          <b>Last Password Reset Date</b> - Date of last password reset request
      </li>
      <li>
          <b>Password Expiration Date</b> - Date when the password gets expired.
      </li>
      <li>
          <b>Password Reset Process</b> - Password reset process record.
      </li>
      <li>
          <b>User</b> - User record.
      </li>
  <li><b>Password  Never Expires</b> - This represents whether the user's password expires or never expires.</li>
  <li><b>Get Password Expiration Details Status</b> - This represents if the Call Password Expiration Details Subflow's status is success or error.</li>
  <li><b>Get Password Expiration Details Error Message</b> - This represents the error message thrown by the Call Password Expiration Details Subflow.</li>
  </ul>
  <p>
      <b>Outputs:</b>
  </p>
  <ul>
      <li><b>Status</b> - Will be set to 'Success' if the request succeeds or 'Error' if a failure occurs.</li>
      <li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li>
  </ul>
  <p><b>Error Messages:</b></p>
  <p>Invalid Password expiration details</p>
