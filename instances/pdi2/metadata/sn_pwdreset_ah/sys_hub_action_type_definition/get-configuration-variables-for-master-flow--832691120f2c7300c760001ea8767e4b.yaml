description: |-
  <p> Validates the 'Password Reset Request' and returns configuration variables for that provider’s password reset process.  The output variables are used to drive the Password Reset Master Subflow.</p>
  <p>
   <b>Inputs:</b>
  </p>
   <ul><li><b>Password Reset Request</b> - Password request record.</li><li><b>New Password</b> - New Password.</li><li><b>Action</b> Current action choices i.e. Reset Password, Change Password, Unlock Account, Get Lock State.</li></ul>

  <p>
   <b>Outputs:</b>
  </p>
   <ul><li><b>Status</b> - Will be set to 'Success' if the request succeeds or 'Error' if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li><li><b>Is Flow</b> - 'True' if the password reset process is configured to execute via Integration Hub flows. 'False' if the password reset process is configured to execute via workflows</li><li><b>Action Type</b> - Type of flow to be executed. eg: Change Password or Reset Password.</li><li><b>Request Status</b> - Status of the password reset request.</li><li><b>Subflow</b> - Internal name of the subflow to be executed.</li>
  <li><b>Send Expiration Reminder</b> - 'True' if the password expiration feature for the process is enabled. 'False' if the expiration feature is disabled for the process</li>
  <li><b>Process</b> - Password process record associated with the password reset request.</li>
  <li><b>User</b> - User record associated with the password reset request.</li>
  </ul>
  <p>
   <b>Error Messages:</b>
  </p>
    <ul><li>Invalid Request Record</li></ul>
