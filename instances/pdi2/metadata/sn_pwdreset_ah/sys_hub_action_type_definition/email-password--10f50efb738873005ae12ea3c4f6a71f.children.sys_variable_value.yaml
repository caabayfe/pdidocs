  value: |-
    (function execute(inputs, outputs) {
        var request = inputs.requestID;
        var process = request.process;
        var userGr = new GlideRecord("sys_user");
        userGr.get(request.user);
      
        var isDefaultSelfServiceProcess = process.sys_id.equals('c6b0c20667100200a5a0f3b457415ad5');
        outputs.status = 'Success';
        if (request.process.send_email) {
            try {
                var util = new PasswordResetUtil();
                outputs = util.sendConfirmation(userGr.email, inputs.password, process.cred_store, isDefaultSelfServiceProcess, userGr, outputs);
            } catch (e) {
                outputs.status = "Error";
                outputs.errorMessage = gs.getMessage("Error while sending resetted password via email");
            }
        }
    })(inputs, outputs);
