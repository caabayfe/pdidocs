- document: sys_hub_step_instance
  document_key: ab758f4773c073005ae12ea3c4f6a707
  order: '600'
  sys_class_name: sys_variable_value
  sys_created_by: admin
  sys_created_on: 2019-03-12 12:51:57
  sys_id: 77758f4773c073005ae12ea3c4f6a738
  sys_mod_count: '23'
  sys_tags: ''
  sys_updated_by: admin
  sys_updated_on: 2024-06-17 14:52:58
  value: |-
    (function execute(inputs, outputs) {
        outputs.status = 'Error';
        var request = inputs.requestID;
        if (request != null && typeof(request) === 'object' && request.getTableName() == 'pwd_reset_request') {
          
            if (!request.user) {
                outputs.errorMessage = gs.getMessage('The user associated with request is not valid');
                return;
            }
          
            var userGr = new GlideRecord("sys_user");
            userGr.addQuery("sys_id", request.user);
            userGr.query();
            if (!userGr.next()) {
                outputs.errorMessage = gs.getMessage('The user associated with request is not valid');
                return;
            }

            var process = request.process;
            if (!process || !process.name) {
                outputs.errorMessage = gs.getMessage('The process associated with request is not valid');
                return;
            }

            var credStore = process.cred_store;
            if (!credStore || !credStore.name) {
                outputs.errorMessage = gs.getMessage('The credential store associated with request is not valid.');
                return;
            }

            outputs.userrecord = userGr;
            outputs.useremail = userGr.email;
            outputs.userName = userGr.user_name;
            outputs.first_name = userGr.first_name;
            outputs.unlockAccount = process.unlock_account; // flag for unlock account.
            outputs.is_auto_gen_password_enabled = process.auto_gen_password;
            outputs.is_email_sms_password_enabled = process.send_email;
            outputs.forcePasswordChange = process.password_needs_reset; // flag that tells the password needs to be reset on the first login.    

            var util = new global.PasswordResetScopedUtil();
            // check if an account lookup script is provided and call the specified extension
            if (!credStore.account_lookup.nil()) {
                try {
                    outputs.userName = util.passwordExtensionScript(userGr.sys_id.toString(), credStore.account_lookup.sys_id.toString());
                } catch (e) {
                    outputs.errorMessage = gs.getMessage('Error while processing the user account lookup field');
                    return;
                }
            }
            try {
                outputs.temppassword = util.generatePassword(credStore);
            } catch (e) {
                outputs.errorMessage = gs.getMessage('Error while generating a temporary user password');
                return;
            }
            outputs.status = 'Success';
        } else {
            outputs.errorMessage = gs.getMessage('Invalid Request');
        }
    })(inputs, outputs);
