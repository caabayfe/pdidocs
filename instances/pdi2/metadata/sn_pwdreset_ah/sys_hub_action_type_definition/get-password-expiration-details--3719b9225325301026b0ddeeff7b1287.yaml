description: |-
  <p> Calls appropriate subflow by using the expiration configuration of the password reset process.</p>
  <p>
      <b>Inputs:</b>
  </p>
  <ul>
      <li>
          <b>Subflow</b> - Internal name of the subflow.
      </li>
      <li>
          <b>User</b> - User record.
      </li>
    <li>
          <b>Password Reset Process</b> - Password Reset Process record.
      </li>
  </ul>

  <p>
      <b>Outputs:</b>
  </p>
  <ul>
      <li><b>Last Password Reset Date</b> - Date of last password reset request</li>
      <li><b>Password Expiration Date</b> - Date when the password gets expired.</li>
  <li><b>Password  Never Expires</b> - This represents whether the user's password expires or never expires.</li>
      <li><b>Status</b> - Will be set to 'Success' if the request succeeds or 'Error' if a failure occurs.</li>
      <li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <p>Error messages for this action is populated from the corresponding subflow executed.</p>
