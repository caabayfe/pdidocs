    (function execute(inputs, outputs) {
    // ... code ..
        if(typeof(inputs.user) == 'object' && inputs.user.getTableName() == 'sys_user') {
          outputs.status = 'Success'
          var passwordResetUtil = new PasswordResetUtil();
          passwordResetUtil.localUserHelper(inputs);
          outputs = passwordResetUtil.isUserValid(inputs,outputs);
          if(outputs.status == 'Success') {
            outputs = passwordResetUtil.getActiveUserLockstate(inputs,outputs);
          }
        } else {
          outputs.status = 'Error';
          outputs.errorMessage = gs.getMessage('Invalid User Record');
        }
    })(inputs, outputs);
