description: |-
  <html></html><p>Validate&#39;s password for a local ServiceNow user.</p>
   <p><b>Inputs:</b>
    </p><ul><li><b>User</b> - User Record.</li><li><b>Password</b> - The current password of the user.</li></ul>
   
   
   <p><b>Outputs:</b>
    </p><ul><li><b>History Check Passed</b> - will be set to &#39;True&#39; if the password is not in history limit or &#39;False&#39; if the password is in history limit. Populated only when status is success.</li><li><b>Status</b> - Will be set to &#39;Success&#39; if the request succeeds or &#39;Error&#39; if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>
   
   <p><b>Error Messages:</b>
    </p><ul><li>Invalid User Record</li></ul>
