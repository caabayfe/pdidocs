description: |-
  <html></html><p>Authenticate a local ServiceNow user&#39;s password.</p>
   <p><b>Inputs:</b>
    </p><ul><li><b>User</b> - User Record.</li><li><b>Password</b> - The current password of the user.</li></ul>
   
   
   <p><b>Outputs:</b>
    </p><ul><li><b>Authenticated</b> - will be set to &#39;True&#39; if the password matches with current user password or &#39;False&#39; if the password does not match with current user password. Populated only when status is success.</li><li><b>Status</b> - Will be set to &#39;Success&#39; if the request succeeds or &#39;Error&#39; if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>
   
   <p><b>Error Messages:</b>
    </p><ul><li>Invalid User Record</li></ul>
