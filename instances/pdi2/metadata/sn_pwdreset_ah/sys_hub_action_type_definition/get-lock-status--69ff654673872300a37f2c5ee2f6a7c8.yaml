description: "\n      <html></html><p>Get a local ServiceNow user accounts lock status</p>\n      <p><b>Inputs:</b>\n      </p><ul><li><b>User</b> - User Record</li></ul>\n\n      <p><b>Output:</b>\n      </p><ul><li><b>Status</b> - Will be set to Success if the request succeeds or Error if a failure occurs.</li><li><b>Locked</b> - True if the user is locked. False if the user is not locked. Populated only if Status is Success.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>\n\n      <p><b>Error Messages:</b>\n      </p><ul><li>Invalid User Record</li><li>User Inactive</li></ul>\n\n\n    "
