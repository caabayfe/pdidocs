  value: |-
    (function execute(inputs, outputs) {
        if (!isValidRequest()) {
            setOutputToError();
            return;
        }
        var REQUEST_STATUS = {
                INPROGRESS: 0,
                VERIFIED: 2
            },
            REQUEST_ACTION_TYPE = {
                RESET_PASSWORD: 1,
                UNLOCK_ACCOUNT: 2,
                RESET_UNLOCK_ACCOUNT: 3,
                CHANGE_PASSWORD: 4
            };

        var request = inputs.requestRecord;
        outputs.status = "Success";
        outputs.is_flow = request.process.cred_store.type.use_flow;
        outputs.req_status = request.status;
        outputs.is_password_empty = (inputs.password + "") ? false : true;
        outputs.send_expiration_reminder = request.process.send_expiration_reminder;
        var isGetUserLockStateSubflow = inputs.action == '4';

        var processGr = new GlideRecord("pwd_process");
        processGr.get(request.process.sys_id);

        var userGr = new GlideRecord("sys_user");
        userGr.get(request.user.sys_id);

        outputs.process = processGr;
        outputs.user = userGr;

        var resetRequestActionType = request.action_type,
            resetRequestStatus = request.status,
            subflow = '';

        if (resetRequestActionType == REQUEST_ACTION_TYPE.UNLOCK_ACCOUNT) {
            outputs.action_type = 'Unlock Account';
            subflow = request.process.cred_store.type.unlock_user_flow; //Unlock Account
        } else if (resetRequestActionType == REQUEST_ACTION_TYPE.CHANGE_PASSWORD) {
            outputs.action_type = 'Change Password';
            subflow = request.process.cred_store.type.pwd_change_flow; //Change Password
        } else {
            outputs.action_type = (resetRequestActionType == REQUEST_ACTION_TYPE.RESET_PASSWORD) ? 'Reset Password' : 'Reset and Unlock Account';
            if (isGetUserLockStateSubflow) {
                subflow = request.process.cred_store.type.get_lock_state_flow; // Get lock state
            } else {
                subflow = request.process.cred_store.type.passd_reset_flow; //Reset Password.
            }
        }
        outputs.subflow = subflow.sys_scope.scope.toString() + "." + subflow.internal_name.toString();

        function isValidRequest() {
            return inputs.requestRecord != null && typeof(inputs.requestRecord) === 'object' && inputs.requestRecord.getTableName() == 'pwd_reset_request';
        }

        function setOutputToError() {
            outputs.status = "Error";
            outputs.error_message = gs.getMessage("Invalid Request Record");
        }
    })(inputs, outputs);
