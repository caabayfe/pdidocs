  value: |-
    (function execute(inputs, outputs) {
        outputs.status = "Success";
        var getExpirationDetailsStatus = inputs.getExpirationDetailsStatus;

        //Outputting error if both the dates are empty
        if (getExpirationDetailsStatus == 'Success' && inputs.lastPasswordResetDate == "" && inputs.passwordExpirationDate == "") {
            outputs.status = "Error";
            outputs.error_message = gs.getMessage("Invalid Password expiration details");
            return;
        }
        var userId = inputs.user.sys_id;
        var processId = inputs.passwordResetProcess.sys_id;
        var errorCount = 0;
        var passwordExpirationDays = inputs.passwordResetProcess.getValue("pwd_validity_days");
        var expirationWarnDays = inputs.passwordResetProcess.getValue("expiration_warn_days");
        var lastPasswordResetDate = inputs.lastPasswordResetDate || addDaysToDate(inputs.passwordExpirationDate, passwordExpirationDays * -1);
        try {
            var expirationGr = new GlideRecord("pwd_expiration");
            expirationGr.addQuery("user", userId);
            expirationGr.addQuery("pwd_process", processId);
            expirationGr.query();

            if (expirationGr.next()) {
                errorCount = expirationGr.getValue("error_count");
            } else {
                expirationGr.setValue("user", userId);
                expirationGr.setValue("pwd_process", processId);
            }
            expirationGr.setValue("send_notification", false);
            //handling 'Transient Error' & 'Invalid User' user-case
            if (getExpirationDetailsStatus == 'Error') {
                expirationGr.setValue("error_count", ++errorCount);
                expirationGr.setValue("last_error_log", inputs.getExpirationDetailsErrorMessage);
                if (errorCount >= gs.getProperty("pwd_reset.password_expiration.error_count", 5)) {
                    expirationGr.setValue("active", false);
                }
            } else { //Handling success scenario
                expirationGr.setValue("pwd_expiration_date", "");
                expirationGr.setValue("active", true);
                if (!inputs.passwordNeverExpires) {
                    var passwordExpirationDate = inputs.passwordExpirationDate || addDaysToDate(inputs.lastPasswordResetDate, passwordExpirationDays);
                    expirationGr.setValue("send_notification", sendReminder(passwordExpirationDate, expirationWarnDays));
                    expirationGr.setValue("pwd_expiration_date", passwordExpirationDate);
                }
                expirationGr.setValue("pwd_reset_date", lastPasswordResetDate);
                expirationGr.setValue("last_refresh_date", new GlideDateTime());
                expirationGr.setValue("error_count", 0);
            }
            expirationGr.update();
        } catch (ex) {
            outputs.status = "Error";
            outputs.error_message = gs.getMessage("Invalid Password expiration details: {0}", ex.getMessage());
        }
    })(inputs, outputs);

    function addDaysToDate(date, passwordExpirationDays) {
        if (!date)
          return null;
        var newDate = new GlideDateTime(date);
        newDate.addDaysUTC(passwordExpirationDays);
        return newDate;
    }

    function getDate(date) {
        var gDate = new GlideDate();
        gDate.setValue(date);
        return new GlideDateTime(gDate.getValue());
    }

    function sendReminder(passwordExpirationDate, expirationWarnDays) {
        var presentDate = new GlideDateTime();
        passwordExpirationDate = getDate(passwordExpirationDate);
        return getDate(addDaysToDate(presentDate.getValue(), expirationWarnDays)).compareTo(passwordExpirationDate) != -1 && getDate(presentDate.getValue()).compareTo(passwordExpirationDate) != 1;
    }
