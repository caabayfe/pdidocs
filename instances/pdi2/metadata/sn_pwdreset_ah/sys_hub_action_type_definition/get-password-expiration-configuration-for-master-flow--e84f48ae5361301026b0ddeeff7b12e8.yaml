description: |-
  <p> Validates the 'Password Reset Process record' and returns password expiration configuration for that process. The
      output variables are used to drive the Password Expiration Details Master Subflow.</p>
  <p>
      <b>Inputs:</b>
  </p>
  <ul>
      <li><b>Password Reset Process</b> - Password reset process record.</li>
  </ul>

  <p>
      <b>Outputs:</b>
  </p>
  <ul>
      <li>
          <b>Subflow</b> - Internal name of the subflow to be executed.
      </li>
      <li>
          <b>Status</b> - Will be set to 'Success' if the request succeeds or 'Error' if a failure occurs.
      </li>
      <li>
          <b>Error Message</b> - Reason for error. Populated only when an error occurs.
      </li>
  </ul>
  <p>
      <b>Error Messages:</b>
  </p>
  <ul>
      <li>Invalid Credential Store Type</li>
  </ul>
