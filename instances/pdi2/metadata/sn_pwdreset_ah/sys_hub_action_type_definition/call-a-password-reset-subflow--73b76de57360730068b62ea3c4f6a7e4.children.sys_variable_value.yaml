  value: |-
    (function execute(inputs, outputs) {
        var SUBFLOW_TIMEOUT = parseInt(gs.getProperty('password_reset.subflow.timeout', 60000));
        var subflow = inputs.subflow;
        var request = inputs.request;
        var action = inputs.action;
        var RESET_PASSWORD = '1';
        var CHANGE_PASSWORD = '2';
        var GET_LOCK_STATE = '4';
        var isGetLockStateSubflow = (inputs.action == GET_LOCK_STATE);

        var subflowInputs = {
            "password_reset_request": request
        };

        if (inputs.new_password) {
            if (action == CHANGE_PASSWORD) {
                subflowInputs['old_password'] = inputs.old_password;
                subflowInputs['new_password'] = inputs.new_password;
            } else if (action == RESET_PASSWORD) {
                subflowInputs['password'] = inputs.new_password;
            }
        }

        try {
            var runner = sn_fd.FlowAPI.getRunner()
                .subflow(subflow)
                .withInputs(subflowInputs)
                .timeout(SUBFLOW_TIMEOUT)
                .inForeground();

            var overrideAlias = request.process.cred_store.child_alias;
            var baseAlias = request.process.cred_store.type.base_alias;

            //Overriding Connection Alias if configured at Credential Store
            if (!gs.nil(baseAlias) && !gs.nil(overrideAlias))
                runner = runner.withConnectionAliasOverride(baseAlias, overrideAlias);

            //Call Subflow
            var result = runner.run();

            var subflowOutputs = result.getOutputs();

            outputs.status = subflowOutputs['status'];
            outputs.error_message = subflowOutputs['error_message'];
        } catch (error) {
            outputs.status = 'Error';
            outputs.error_message = gs.getMessage("Flow stopped executing");
        }
    })(inputs, outputs);
