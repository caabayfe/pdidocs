description: |-
  <p> Validates that a flow is available for a given credential store provider and returns configuration variables for that provider’s password reset process.  The output variables are used to drive the Password Reset logic.
  </p>
  <p><b>Inputs:</b>
  </p><ul><li><b>Password Reset Request</b> - Password request record.</li></ul>

  <p><b>Outputs:</b>
  </p><ul><li><b>Unlock Account</b> - States if the user should automatically be unlocked if they are locked.</li><li><b>Force Password Change</b> - States if the user will be forced to change Password on their next login</li><li><b>User Name</b> - Use this when communicating with the provider. The response is based on the provider’s configuration and the logic can be customized per provider e.g. first.name or first_name.</li><li><b>Is Auto Gen Password Enabled</b> - States if auto generate password is enabled.</li><li><b>Is Email/SMS Password Enabled</b> - States if the auto-generated password is sent to the user via an Email/SMS.</li><li><b>Status</b> - Will be set to 'Success' if the request succeeds or 'Error' if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>

  <p><b>Error Messages:</b>
  </p><ul><li>Invalid Request</li><li>The request has no process associated with it.</li><li>The process associated with request is not valid.</li><li>The user associated with request is not valid.</li><li>There are more than one credential stores defined for process.</li><li>The credential store associated with request is not valid.</li></ul>
