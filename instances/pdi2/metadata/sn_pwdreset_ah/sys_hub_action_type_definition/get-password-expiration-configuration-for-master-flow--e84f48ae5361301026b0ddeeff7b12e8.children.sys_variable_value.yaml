  value: |-
    (function execute(inputs, outputs) {
      outputs.status = "Error";
      var passwordResetProcess = inputs.passwordResetProcess;
      if (passwordResetProcess.cred_store == null || passwordResetProcess.cred_store == "") {
        outputs.error_message = gs.getMessage("Invalid Credential Store, could not fetch password reset expiration details");
        return;
      }
      var credentialStoreType = passwordResetProcess.cred_store.type;
      if (credentialStoreType == null || credentialStoreType == "") {
        outputs.error_message = gs.getMessage("Invalid Credential Store Type, could not fetch password reset expiration details");
        return;
      }
      var subflow = passwordResetProcess.cred_store.type.pwd_expiration_details_flow;
      if (subflow == null || subflow == "") {
        outputs.error_message = gs.getMessage("Unable to fetch subflow details from credential store type.");
        return;
      }
      outputs.subflow = subflow.sys_scope.scope.toString() + "." + subflow.internal_name.toString();
      outputs.status = "Success";
    })(inputs, outputs);
