description: |-
  <html></html><p>Given a password reset request and status value, it updates the password reset request status.</p>
   <p><b>Inputs:</b>
    </p><ul><li><b>Password Reset Request</b> - Password request record.</li><li><b>Status</b> - Status of the request having two choices Completed With Success or Completed With Failure.</li></ul>
   <p><b>Outputs:</b>
    </p><ul><li><b>Status</b> - Will be set to Success if it succeeds or Error if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>
