description: |-
  <html></html><p>Update a local ServiceNow user&#39;s password.</p>
   <p><b>Inputs:</b>
    </p><ul><li><b>User</b> - User Record.</li><li><b>Password</b> - The new password the user wants to set.</li><li><b>Force Password Change</b> - Forces the user to change password on next login.</li><li><b>Unlock Account</b> - Unlocks the user if account is locked.</li></ul>
   
   
   <p><b>Outputs:</b>
    </p><ul><li><b>Status</b> - Will be set to &#39;Success&#39; if the request succeeds or &#39;Error&#39; if a failure occurs.</li><li><b>Error Message</b> - Reason for error. Populated only when an error occurs.</li></ul>
   
   <p><b>Error Messages:</b>
    </p><ul><li>Invalid User Record</li></ul>
