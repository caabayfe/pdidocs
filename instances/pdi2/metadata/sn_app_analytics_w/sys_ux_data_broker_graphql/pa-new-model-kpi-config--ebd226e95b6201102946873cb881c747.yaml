api_name: sn_app_analytics_w.PA New Model KPI Config
batch_exclude: 'false'
description: To Load the configuration metadata for PA New Model KPI
mutates_server_data: 'false'
name: PA New Model KPI Config
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "kpiSysId",
      "label": "KPI Sys ID",
      "description": "Sys ID of the KPI",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    }
  ]
query: |-
  query snParKpi($kpiSysId: String!) {
     GlideKpiConfig_Query {
        kpiConfigDetail(kpiSysId: $kpiSysId) {
           conditions{
              value
              displayValue
           }
           description
           dimensions{
              value
              label
           }
           calendar {
              value
              label
           }
           calendarFrequency {
              label
              value
           }
           aggregate {
              type
              typeLabel
              fieldLabel
              field
           }
           unit {
              label
              value
           }
           precision
           name
           sysId
           scoreStartDate
           scoreEndDate
           table {
              label
              value
           }
           direction {
              label
              value
           }
        }
     }
  }
required_translations: |-
  [ {
    "message" : "KPI Sys ID",
    "comment" : ""
  }, {
    "message" : "Sys ID of the KPI",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: PA New Model KPI Config
sys_policy: ''
type: query
use_record_domain: 'false'
