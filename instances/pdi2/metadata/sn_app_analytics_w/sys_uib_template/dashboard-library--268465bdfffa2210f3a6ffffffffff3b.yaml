description: Includes all dashboards accessible to users. Users can filter dashboards by various criteria, such as recently opened, bookmarked, certified, those they've created, and by category. The Library section also allows users to create new dashboards. Users with analytics admin roles have an enhanced library view, enabling them to access usage data and other metadata. Admins can also deactivate, activate, or delete dashboards from this view.
