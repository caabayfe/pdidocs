description: Includes all data visualizations accessible to users. Users can filter data visualizations by various criteria, such as recently opened, bookmarked, certified, and those they've created. The Library section also allows users to create new data visualizatiuons. Users with analytics admin roles have an enhanced library view, enabling them to access usage data and other metadata. These users can also deactivate, activate, or delete data visualizations from this view.
