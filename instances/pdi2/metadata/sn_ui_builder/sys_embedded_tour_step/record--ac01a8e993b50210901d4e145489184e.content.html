Use the <b>stage</b>, to the right of the <b>Content tree</b>, to build and modify the page on the stage. 

 
<br /><br />
From the <b>stage</b>, you can arrange column layouts and components. 

 <br /><br />

<b>Quick tip</b>: On the <b>stage</b>, the body, column layouts and columns are outlined in magenta. Components are outlined in blue.
