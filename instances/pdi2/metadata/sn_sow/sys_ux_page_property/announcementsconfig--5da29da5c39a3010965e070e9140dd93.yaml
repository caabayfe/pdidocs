value: |-
  {
      "sys_ux_banner_announcement": {
        "transforms": {
          "default": {
            "propValues": {
              "highlightedHeaderBkgColor": "${color}"
            }
          }
        }
      },
      "incident": {
        "transforms": {
          "major_incident_stateISNOTEMPTY": {
            "query": "major_incident_stateISNOTEMPTY",
            "propValues": {
              "highlightedHeaderBkgColor": {
                "$": "sys_highlighted_value",
                "table": "incident",
                "sysId": "${sys_id}",
                "field": "major_incident_state"
              }
            }
          }
        }
      },
      "cmdb_ci_outage": {
        "transforms": {
          "has_task_number": {
            "query": "task_numberISNOTEMPTY",
            "propValues": {
              "task_sys_class_name": "${task_number.sys_class_name}",
              "highlightedHeaderBkgColor": {
                "$": "sys_highlighted_value",
                "table": "${task_number.sys_class_name}",
                "sysId": "${task_number}",
                "field": "priority"
              }
            }
          }
        }
      }
    }
