choices: Browser,CTI
description: |-
  This configuration is for the SOW contact page. This property allows users to use Computer Telephony Interface (CTI) or telephony for the browser to connect with the end user.
  CTI enables the end user to connect from his browser while the contact person can be communicated on the phone via configured provider in the property.
  Browser telephony helps connect the end user with the contact person from the browser only.
