description: Advanced Work Assignment (AWA) helps to automatically assign work items to your agents based on their availability, capacity, and skills (if defined). You can define different service channels to request assistance,such as chat, cases, and incidents with individual agent capacity and utilization conditions. AWA pushes work to qualified agents using work item queues, routing conditions, and assignment criteria that you define. Agents see their assignments in their Agent Workspace inbox.
