  value: |-
    (function execute(inputs, outputs) {
      
    var catItem = new sn_sc.CatItem();
    catItem.setTableName('sc_cat_item_producer');

    var templateId = gs.getProperty('sn_app_eng_studio.glide.sc.builder.aes_catalog_builder_template', '211f71ca73202010ae42d31ee2f6a785');
      
    var attributesMap = {};
    attributesMap["name"] = inputs.item_name;
    attributesMap["short_description"] = inputs.item_short_description;
    attributesMap["sc_template"] = templateId; 
      
    catItem.setAttributes(attributesMap);
      
    outputs.item_sys_id = catItem.create(true);
     
    })(inputs, outputs);
