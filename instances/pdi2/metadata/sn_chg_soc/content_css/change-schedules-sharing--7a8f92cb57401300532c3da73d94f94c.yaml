name: Change Schedules - Sharing
style: |-
  
  div.soc-sharing-search-active {
  	border-bottom: 1px solid ${$color-lighter};
  }

  .sn-widget-list-content_actions .btn-icon::before {
  	line-height: 0px;
  }

  li.soc-permission-profile-container {
  	width: 100%;
  }

  li.soc-permission-profile-container .soc-permission-profile {
  	display: flex;
  	flex-direction: row;
  	width: 100%;
  }

  li.soc-permission-profile-container .soc-permission-profile .sn-soc-profile-details {
  	flex-grow: 1;
  }

  .soc-aside-share {
  	height: 100%;
  }

  .soc-share-container {
  	display: flex;
  	flex-direction: column;
  	height: 100%;
  }

  .soc-share-container .soc-expand-panel {
  	flex-grow: 1;
  	overflow-y: auto;
  }

  .soc-share-container .soc-fixed-panel {
  	flex-grow: 0;
  	background-color: #fff;
  	width: 100%;
  	height: 118px;
  	min-height: 118px;
  }

  .soc-sharing-everyone {
  	padding: 19px 15px 19px 7px;
  	border-top: 1px solid ${$color-lighter};
  }

  .soc-sharing-nav-buttons {
  	height: 48px;
  	white-space: normal;
  	word-wrap: break-word;
  	border-bottom: 1px solid ${$color-lighter};
  }

  .soc-sharing-nav-buttons .btn.btn-icon {
  	border-radius: 0;
  	font-size: 15px;
  	margin: 0;
  	padding: 0;
  	position: relative;
  	height: 100%;
  	width: 25%;
  	border: none;
  	color: ${$color-dark};
  }

  .soc-sharing-nav-buttons .btn:hover,
  	.soc-sharing-nav-buttons .btn:active,
  	.soc-sharing-nav-buttons .btn:focus {
  	background-color: transparent;
  	border: none;
  	box-shadow: none;
  	outline: none;
  }

  .soc-sharing-nav-buttons .btn:focus {
  	border: none;
  	outline: dotted 1px;
  }

  .soc-sharing-nav-buttons .btn:hover:after {
  	height: 3px;
  	background-color: ${$color-accent};
  }

  .soc-sharing-nav-buttons .btn:hover.icon-double-chevron-left {
  	border-left: 1px solid ${$color-lightest};
  }

  .soc-sharing-nav-buttons .btn.state-active {
  	color: ${$color-accent};
  }

  .soc-sharing-nav-buttons .btn.state-active:after {
  	height: 3px;
  	background-color: ${$color-accent};
  }

  .soc-sharing-nav-buttons .btn:active {
  	opacity: .5;
  	border: none;
  }

  .soc-sharing-nav-buttons .btn:after {
  	content: "";
  	height: 3px;
  	right: 0;
  	bottom: 0;
  	left: 0;
  	position: absolute;
  	background-color: transparent;
  }

  .soc-sharing-add-content-main {
  	position: relative;
  	height: 100%;
  }

  .soc-sharing-add-content-main .sn-aside-header .btn.btn-icon {
  	background-color: transparent;
  	font-size: 18px;
  }

  .soc-sharing-add-content-main .sn-aside-header .btn.btn-icon:hover {
  	color: black
  }

  .soc-sharing-add-content-main .sn-aside-header button.btn.btn-icon.icon-cross {
  	position: relative;
  	top: 0;
  	right: 5px;
  }

  .soc-sharing-add-content-main .sn-aside-header button.icon-chevron-left {
  	width: 31px;
  	height: 31px;
  }

  .soc-sharing-add-content-main .soc-sharing-side-content-list {
  	overflow-y: auto;
  }

  .soc-sharing-add-content-main .soc-sharing-side-content-list .state-default {
  	display: none;
  }

  .soc-sharing-add-content-main .soc-sharing-side-content-list .state-default.active {
  	display: block;
  }

  .soc-sharing-add-content-main .sn-aside-body ul.sn-widget-list li .sn-widget-list-action {
  	display: -webkit-flex;
  	display: flex;
  	float: right;
  	font-size: 16px;
  	margin-left: 0px;
  	opacity: 0;
  }

  .soc-sharing-add-content-main .sn-aside-body ul.sn-widget-list li .sn-widget-list-action:focus {
  	opacity: 1;
  }

  .soc-sharing-add-content-main .sn-aside-body ul.sn-widget-list li:hover .sn-widget-list-action,
  	.soc-sharing-add-content-main .sn-aside-body ul.sn-widget-list li:focus .sn-widget-list-action {
  	opacity: 1;
  }

  .soc-sharing-add-content-main .sn-aside-body ul.sn-widget-list li button.btn.btn-icon.sn-widget-list-action {
  	width: 28px;
  	height: 28px;
  	font-size: 16px;
  	text-align: center;
  }

  .soc-sharing-add-content-main .sn-aside-body ul.sn-widget-list li button.btn.btn-icon.sn-widget-list-action:focus {
  	border: none;
  }

  .soc-sharing-add-content-main .sn-widget-profile-type {
  	color: ${$color-light};
  	text-align: center;
  	margin-top: 5px;
  }

  .soc-sharing-non-admin.icon-delete {
  	color: black
  }

  .icon-add-circle-empty.soc-sharing-identity-avatar-share-panel {
  	font-size: 32px;
  }

  .soc-sharing-list-identities-avatars .soc-sharing-identity-avatar-share-panel {
  	float: left;
  	margin-left: 3px;
  	padding: 0px;
  }

  div.sn-soc-profile div.sn-soc-profile-avatar div.sn-avatar-container {
  	width: 32px;
  }

  .sn-avatar-container .avatar .sub-avatar.soc-sharing-no-avatar {
  	background: ${$color-lighter} center;
  	font-size: 14px;
  }

  .sn-avatar-container .avatar .sub-avatar.soc-sharing-avatar-more {
  	font-size: 14px;
  	background-color: black
  }

  .sn-avatar-light-background {
  	background-color: ${$color-light} !important;
  }

  .soc-sharing-rights {
  	color: black;
   	font-size: 13px;
  }

  .soc-sharing-no-data {
  	font-size: 15px;
  	color: black;
  	padding: 10px;
  }

  .soc-sharing-loading-permissions-list {
  	line-height: 1;
  	padding: 10px 0 10px 20px;
  	vertical-align: middle;
  	font-size: 20px;
  	font-weight: normal;
  }

  .sn-add-users-search-container {
  	width: 100%;
  }

  .invite-users-view {
  	display: flex;
  	flex-grow: 1;
  	flex-direction: column;
  	height: 100%;
  	min-height: 0;
  	min-width: 0;
  }

  .invite-users-view .sn-add-users-separator {
  	top: 9px;
  	border-bottom: 1px solid ${$color-lightest} !important;
  	display: block;
  	-webkit-flex: none;
  	flex: none;
  	height: auto;
  }

  .invite-users-view .invite-users-input-cntnr .to-title {
  	padding: 17px 0px 0 10px;
  	float: left;
  }

  .invite-users-view .invite-users-input-cntnr [contenteditable=true]:empty:not(:focus ):before {
  	content: attr(placeholder);
  	color: #a9a9a9;
  }

  .invite-users-view .invite-users-input-cntnr .email-invitation {
  	height: 53px;
  	border-bottom: 1px solid ${$color-lighter};
  	margin-bottom: 0;
  }

  .invite-users-view .invite-users-input-cntnr .email-invitation span.input-group-checkbox {
  	display: block;
  	padding: 15px 15px 15px 10px;
  }

  .invite-users-view .invite-users-input-cntnr .email-invitation span.input-group-checkbox label {
  	margin-left: 0;
  }

  .invite-users-view .invite-users-input-cntnr .invite-message {
  	position: relative;
  	min-height: 100px;
  	padding: 10px;
  }

  .invite-users-view .invite-users-input-cntnr .sn-add-users-search .twitter-typeahead input {
  	font-size: 13px;
  	margin-top: 10px;
  	margin-bottom: 10px;
  }

  .invite-users-view .invite-users-input-cntnr .sn-add-users-user {
  	font: inherit;
  }

  .soc-sharing-invitation-info-item {
  	border-top: 1px solid ${$color-lighter};
  	font: 13px "SourceSansPro", "Helvetica Neue", "Helvetica", Arial, sans-serif;
  	font-weight: normal;
  	height: 60px;
  	padding-top: 15px;
  }

  .soc-sharing-invitation-info-item button {
  	width: 45%;
  	margin-left: 3%;
  }

  .soc-sharing-invitation-info-item label {
  	margin: 7px auto;
  }

