  	padding-inline-start: 0px;
  }

  li.sn-soc-suggestion {
  	border-bottom: 1px solid ${$color-lighter};
  }

  li.sn-soc-suggestion:focus, li.sn-soc-suggestion:active, li.sn-soc-suggestion:hover {
  	outline: none;
  }

