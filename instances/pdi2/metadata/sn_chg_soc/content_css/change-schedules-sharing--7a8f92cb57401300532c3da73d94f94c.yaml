  }

  div.sn-soc-profile-details {
  	display: flex;
  	flex-wrap: wrap;
  	padding-left: 10px;
  	align-items: center;
  }

  div.soc-widget-profile {
  	outline: none;
  }

  .soc-fixed-panel div.sn-aside-group-title {
  	border-top: 1px solid ${$color-lightest};
  	border-bottom: none;
  }

  span.sn-soc-profile-detail {
  	width: 100%;
  	font-style: normal;
  	font-variant-ligatures: normal;
  	font-variant-caps: normal;
  	font-variant-numeric: normal;
  	font-variant-east-asian: normal;
  	font-weight: normal;
  	font-stretch: normal;
  	line-height: normal;
  	font-family: SourceSansPro, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .soc-truncate-tooltip {
  	word-wrap: break-word;
  }

  .soc-truncate {
  	white-space: nowrap;
  	overflow: hidden;
  	text-overflow: ellipsis;
  }

  span.sn-widget-profile-name {
  	max-width: 305px;
  	line-height: normal;
  }

  span.sn-soc-profile-name {
  	color: ${$color-darkest};
  	font-size: 15px;
  	max-width: 182;
  }

  span.sn-soc-profile-email {
  	color: ${$color-dark};
  	font-size: 13px;
  	padding: 2px 0px;
  }

  ul.sn-widget-list_v2 li.soc-permission-profile-container {
  	overflow-y: auto;
  }

  li.sn-soc-suggestion:hover, li.sn-soc-suggestion:active, li.sn-soc-suggestion:focus {
  	background-color: ${$color-lighter};
  }

  div.soc-sharing-invitation-search {
  	display: flex;
  }

  div.soc-sharing-invitation-search-label {
  	flex-grow: 0;
  	padding: 15px 15px 15px 10px;
  }

  div.soc-sharing-invitation-search-content {
  	flex-grow: 1;
  	display: flex;
  	flex-wrap: wrap;
  }
  .sn-navhub-title input:hover,
  div.sn-navhub-title input.soc-suggestions:focus, div.sn-navhub-title input.soc-suggestions:active, div.sn-navhub-title input.soc-suggestions:hover {
  	border:1px solid transparent;
  	outline:none;
  }

  .sn-navhub-title input.soc-suggestions {
  	font-size: 13px;
  	padding: 14px 15px 15px 10px;
  }

  .sn-aside-body .notification.notification-info {
  	border-radius: 0;
  }

  .dashboard-permissions-view-container {
  	display: -webkit-flex;
  	display: flex;
  	-webkit-flex-direction: column;
  	flex-direction: column;
  }

  .avatar-container.avatar-large.sn-canvas-avatar-large {
  	width: 140px;
  	height: 140px;
  }

  .sn-canvas-avatar-initials {
  	top: 50%;
  	left: 50%;
  	position: absolute;
  	font-size: 24px;
  	transform: translate(-50%, -50%);
  }

  .sn-canvas-user-info-access-section {
  	max-height: 100%;
  	margin-bottom: 75%;
  	position: relative;
  	width: 100%;
  }

  .sn-canvas-user-info-action-section {
  	display: flex;
  	padding: 8px;
  	border-top: 1px solid ${$color-lightest};
  }

  .sn-canvas-user-info-remove-button {
  	margin: 10px 5px;
  	flex: 1 1 auto;
  }

  .sn-canvas-user-info-access-control {
  	width: 100%;
  	padding: 10px 12px 2px;
  }

  div.soc-expand-panel div.soc-add-access-button-container {
  	flex 1 1 auto;
  	padding: 0px;
  }

  div.sn-widget-button.sn-widget-button_row .btn {
  	padding: 0px 10px 0px 10px;
  }

  .tt-cursor {
  	background-color: ${$color-lightest};
  }

  .tt-cursor .sn-widget-list-item {
  	background-color: ${$color-lightest};
  }

  div.sn-add-users-user {
  	max-width: 255px;
  }

  .msie9 .sn-navhub-title {
  	width: auto;
  }

  .msie9 .sn-navhub-title .twitter-typeahead div.tt-menu.tt-open.sn-sharing {
  	height: 0.60vh;
  	position: relative !important;
  	left: 0 !important;
  	top: 0 !important;
  }

  .msie9 .sn-navhub-title .twitter-typeahead div.tt-menu.tt-open.sn-sharing .sn-widget-list-content.sn-widget-list-content_static {
  	position: fixed !important;
  }

  .msie9 .sn-add-users-user {
  	margin-left: 15px;
  }

  .msie9 .sn-add-users-user .icon.icon-cross {
  	width: 13px !important;
  	float: right !important;
  }

  .msie10 div.tt-menu.tt-open.sn-sharing, .msie11 div.tt-menu.tt-open.sn-sharing {
  	position: relative !important;
  	left: 0 !important;
  	top: 0 !important;
  }

  .msie10 div.tt-menu.tt-open.sn-sharing .sn-widget-list-item, .msie11 div.tt-menu.tt-open.sn-sharing .sn-widget-list-item {
  	padding-left: 0;
  }

  .accessibility .sn-aside-body ul.sn-widget-list li .sn-widget-list-action {
  	opacity: 1;
  }
