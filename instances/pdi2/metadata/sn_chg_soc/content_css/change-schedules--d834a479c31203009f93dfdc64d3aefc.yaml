  }

  div.gantt_cell .gantt_tree_content {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
  }

  .icon-style {
      color: #343d47;
      text-align: center;
  }

  div.icon-vcr-right:before {
      padding: 14px 0px;
  }

  div.icon-vcr-down:before {
      padding: 14px 0px;
  }

  div.gantt_tree_icon {
  	color: #343D47;
  	font-size: 11px;
  }

  div.gantt_tree_icon.gantt_open, div.gantt_tree_icon.gantt_close {
      background-image: none;
  }

  .gantt_grid_head_cell {
      text-align: left;
      padding-left: 10px;
  }

  .gantt_grid_scale {
      background-color: #F7F7F7;
  }

  .gantt_task_scale {
      background-color: #F7F7F7;
  }

  .gantt_selected:focus {
      outline: none;
  }

  .gantt_marker.today-marker {
      background-color: #80BEFF;
      width: 1px;
  }

  .gantt_marker.today-marker .gantt_marker_content {
      border-radius: 5px;
      left: -4px;
      opacity: 1;
  }

  @media (forced-colors: active)  {
      .soc-change .gantt_task_content {
          border: 1px solid CanvasText;
          forced-color-adjust: none;
      }

      .soc-change [uib-tooltip-popup].tooltip {
          opacity: 1;
      }

      .soc-change .tooltip-inner {
          color:  CanvasText;
          border: 1px solid CanvasText;
          background-color: Canvas;
      }

      .soc-change .tooltip .tooltip-arrow {
          border-color: Canvas;
      }

      .soc-change .tooltip.top .tooltip-arrow {
          border-top-color: CanvasText;
      }

      .soc-change .tooltip.bottom .tooltip-arrow {
          border-bottom-color: CanvasText;
      }

      .soc-change .tooltip.left .tooltip-arrow {
          border-left-color: CanvasText;
      }

      .soc-change .tooltip.right .tooltip-arrow {
          border-right-color: CanvasText;
      }

  }
