api_name: sn_km_center.EditorSelector
description: "\n            Determines which knowledge article editor is available to users in Knowledge Center. The return value of this extension point is used in UI Builder (UIB) experience screen conditions (e.g., __script_data__.knowledgeCenterRecordNamespace.editor=TINYMCE) to control which record screen is displayed. Implementations can return any editor key (such as 'TINYMCE', 'ECE', or a key for a third-party editor) as long as the UI and screen conditions are configured to recognize it.\n        "
name: EditorSelector
