description: Autofix enabled is normally read-only. This policy locks it specifically for the OOB scans that do not support autofix (Article length, Bad links, Image alt tags [script-based], Stale or expiring article, Potential duplicate articles, Article readability). Reverse-if-false leaves it editable for everything else — the 3 autofix-capable OOB scans (Multiple H1 tags, Image alt tags [AI], Title relevancy) and any custom scan an admin creates. See sys_script "Restrict Autofix enabled changes to non-autofix-capable OOB scans" for the matching server-side enforcement.
