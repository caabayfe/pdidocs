<div class="modal-header" role="alert-dialog">
    <h4 class="modal-title">
      ${Removing CIM}
      <button type="button" class="close pull-right" ng-click="dismiss()" aria-label="Close modal" role="button">×</button>
    </h4>
  </div>

  <div class="modal-body">
    <div class="row padder padder-v">
      <div class="col-xs-12">
        <span>
          Are you sure you want to remove CIM initiative <span style="font-weight: 600">{{reco.register.number}}</span> from the benchmarks recommendation: <span style="font-weight: 600">{{reco.name}}</span>
        </span>
      </div>
      <span class="sr-only">${End of dialog}</span>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="dismiss()">Cancel</button>
    <button type="button" class="btn btn-default btn-primary" ng-click="removeExistingRegister()">Remove</button>
  </div>
