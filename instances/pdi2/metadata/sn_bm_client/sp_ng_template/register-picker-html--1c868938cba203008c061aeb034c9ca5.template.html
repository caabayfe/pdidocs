<div class="modal-header" role="alert-dialog">
    <h4 class="modal-title" >
      ${Existing Improvement Initiatives}
      <button type="button" class="close pull-right" ng-click="dismiss()" aria-label="Close modal" role="button">×</button>
    </h4>
  </div>

  <div class="modal-body">
    <div class="row padder padder-v">
      <div class="col-xs-12"><p>${Select an existing Improvement Initiative to link to this benchmarks recommendation}</p></div>
      <div style="margin-top: 10px;margin-bottom: 10px;" class="col-xs-12 col-sm-10" >
        <sp-reference-field field="field" ng-class="{'field-has-reference': field.value != '', 'field-empty-reference': field.value == ''}"/>
      </div>
      <div class="col-xs-12" style="margin-top: 10px"><span>${Can't find it?} <a id="{{lastEvent.target.id}}" ng-click="openRegister($event)" class="btn btn-link" style="padding: 0px;line-height: 1.1;" href>Create new</a></span></div>
      <span class="sr-only">${End of dialog}</span>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-default" ng-click="dismiss()">Cancel</button>
    <button type="button" class="btn btn-primary" ng-class="{'disabled': !field.value}" ng-click="updateExistingRegister(field.value)">Save</button>
  </div>
