required_translation_keys: '[{"key":"now-alert-status-critical","message":"critical","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This is the highest severity."},{"key":"now-alert-status-high","message":"high","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This is the second highest severity."},{"key":"now-alert-status-moderate","message":"moderate","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This severity is in the middle."},{"key":"now-alert-status-warning","message":"warning","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This severity is non-critical and may be safe to ignore."},{"key":"now-alert-status-info","message":"info","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This severity is really just for informational purposes."},{"key":"now-alert-status-positive","message":"positive","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This severity indicates an action was successful, for instance."},{"key":"now-alert-status-low","message":"low","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This severity is low priority."},{"key":"now-alert-status-ai","message":"ai","comment":"Adjective. Conveys the severity of an alert to a screen reader user who can''t see the alert color - e.g. critical, high, moderate, warning, info, low, ai. This severity is informational and conveys that the alert is related to AI predictions."},{"code":"now-alert-open-button","message":"Open","comment":"As a verb. Opens a link when button is clicked on."},{"message":"Open and dismiss alert"},{"code":"now-alert-acknowledge-button","message":"OK","comment":"An acknowledgement of an alert, as in \"OK, I understand\""},{"message":"Dismiss alert"},{"message":"Show less"},{"message":"Show more"},{"key":"now-alert-expand-button-description","message":"This button is unnecessary because the full alert text is available to assistive technology.","comment":"Comment to screen reader users about the fact that an expand/collapse button does not have any perceivable effect on the alert, since the full untruncated text is always read out to screen reader users."},{"code":"now-alert-status-level","message":"Alert level: {localizedStatus}.","comment":"Conveys alert level. Alert doesn''t necessarily mean warning but is a class of statuses"},{"code":"now-alert-auto-dismiss-timer-label","message":"s","comment":"Number of seconds remaining on the countdown timer"},{"message":"Alert level: {0}."},{"message":"Auto Dismiss Countdown"},{"code":"now-alert-list-all-alerts-dismissed","message":"All alerts have been dismissed","comment":"These are instructions given to screen reader users who have presed shift + alt + q key to dismiss all the alerts."},{"code":"now-alert-list-new-alert","message":"You have a new alert.","comment":"These are instructions given to screen reader users when there is a new alert added on screen."},{"message":"Collapsed alert list with {0} alerts."},{"message":"Expanded alert list with {0} alerts."},{"message":"Show alerts"},{"message":"Hide alerts"},{"message":"Dismiss All"},{"message":"Dismiss all alerts"},{"code":"now-field-error-message","message":"{fieldType} is {error}","comment":"Describes the error message"}]'
