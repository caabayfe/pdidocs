api_name: sn_list_menu.List Menu GQL
batch_exclude: 'false'
description: ''
mutates_server_data: 'false'
name: List Menu GQL
output_schema: ''
private: 'true'
props: |-
  [{
      "name": "configurationId",
      "label": "List Menu Configuration ID",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "The ID of the configuration you want to populate the list-menu with."
  }]
query: |-
  query ($configurationId: String!) {
  	GlideListMenu_Query {
  	  	getListMenuLayout(configurationId: $configurationId) {
  			listMenu {
  				categoryItems {
  				  	isExpanded
  				  	displayValue
  				  	id
  				  	label
  				  	selectionPath
  				  	type
  				  	children {
  						...listMenuItem
  				  	}
  				}
  				menuItems {
  				  	...listMenuItem
  				}
  				targetTablePrefix
  			}
  	  }
  	}
  }
    
  fragment listMenuItem on GlideListMenu_ListMenuItemType {
  	columns
  	conditions
  	displayValue
  	id
  	label
  	order
  	table
  	targetTable
  	selectionPath
  }
required_translations: ''
schema_version: 1.0.0
script: ''
sys_name: List Menu GQL
sys_policy: ''
type: query
use_record_domain: 'false'
