<style>
  @media(max-width:767px){
    #prechat{
      max-height: 97vh;
    }
  }
  @media(min-width:768px){
    .modal {
      text-align: center;
      padding: 0!important; 
    }

    .modal:before {
      content: '';
      display: inline-block;
      height: 80vh;
      vertical-align: middle;
      margin-right: -4px;
    }
    .modal-dialog {
      display: inline-block;
      text-align: left;
      vertical-align: middle;
    }
    #topic-list{
      max-height: 260px;
    }
  }
  .prechat-modal{
    padding: 30px;
    min-height: 170px;
  }
  #topic-list{
    overflow-y: auto;
    max-width: 538px;
  }
  .remove-margin
  {
    margin-top:0px;
    margin-bottom:0px;
  }
  .remove-margin-top
  {
    margin-top:0px;
  }
  .topic-item{
    border-bottom: 1px solid #d3d3d3;
    padding: 15px 0px;
  }
  .topic-item:last-child{
    border-bottom: 0px;
  }
  .close{
    margin-top: -2px;
  }
</style>
<div class="prechat-modal" id="prechat" ng-if="!isConversationGngOn">
  <button type="button" class="close pull-right" ng-click="closeModal()" aria-label="Close modal">×</button>
  <h4 class="remove-margin-top">${Select a topic to start the conversation}</h4>
  <div id="topic-list">
    <div ng-click="preChat(topic)" class="topic-item" ng-repeat="topic in c.data.topicList | filter:searchTopic as filtered">
      <a href="javascript:void(0)" ng-bind="topic"></a>
    </div> 
  </div>
</div>
<div class="prechat-modal"  ng-if="isConversationGngOn">
  <button type="button" class="close pull-right" ng-click="closeModal()" aria-label="Close modal">×</button>
  <h4 class="remove-margin-top">${Do you want to start a new conversation?}</h4>
  <div ng-click="startNewConversation()" class="topic-item">
    <a href="javascript:void(0)">${Yes}</a>
  </div>
  <div ng-click="closeModal();openChat();" class="topic-item">
    <a href="javascript:void(0)" ng-bind="conversationMsg"></a>
  </div>
</div>
