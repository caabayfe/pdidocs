<div id="todo-requested-item-approval-panel">
    <sp-widget widget="data.detailsHeaderWidget"></sp-widget>
  	<hr>
    <div id="requested-item-header">{{data.CONST.i18n.REQUESTED_ITEMS}}</div>
    <div id="requested-item-header-row" class="row">
        <div id="ritm-catalog-item-label" class="ritm-heading-row-first col-sm-6">{{data.CONST.i18n.CATALOG_ITEMS}}</div>
        <div class="ritm-heading-row col-sm-2 hidden-xs">{{data.CONST.i18n.PRICE}}</div>
        <div class="ritm-heading-row col-sm-2 hidden-xs">{{data.CONST.i18n.QUANTITY}}</div>
        <div class="ritm-heading-row col-sm-2 hidden-xs">{{data.CONST.i18n.TOTAL}}</div>
    </div>
  	<div ng-repeat="item in data.items">
      <sp-widget widget="item.ritmVariablesWidget"></sp-widget>
  	</div>
    <div id="ritm-total-price">
        <span id="total-price-label">{{data.CONST.i18n.TOTAL_PRICE}}</span>
        <span id="total-price-value">{{data.ritmTotalPrice}}</span>
    </div>
    <sp-widget widget="data.approvalActionsWidget"></sp-widget>
</div>
