<div class="panel b esc-description-list">
	<dl ng-repeat-start="section in c.options.sections" ng-class="{'esc-description-list-inline': c.options.inline}">
		<dt ng-repeat-start="q in section.items">
			<strong>{{q.item}}</strong>
		</dt>
		<dd ng-repeat-end class="esc-description-list-description">
			<span ng-if="q.description" ng-bind-html="q.description"></span>
			<img ng-if="q.image" src="{{q.image}}.iix?t=small" />
			<br ng-if="q.image && q.caption" />
			<span ng-if="q.caption" ng-bind-html="q.caption"></span>
		</dd>
	</dl>
	<hr ng-repeat-end ng-if="!$last" />
</div>
