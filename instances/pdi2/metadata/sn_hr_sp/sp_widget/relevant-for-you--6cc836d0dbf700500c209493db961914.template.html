<div id="recommendations-dashboard-section" class="recommendations-dashboard-section panel panel-default b panel-wrapper instance-{{c.data.instanceId}}" ng-if = "(c.data.widgetsData.length > 0 && c.data.instanceId.length > 0) || data.showEmptyState === 'true'" ng-class="(c.data.listType === 'simple-link' || c.data.cardType === 'wrap') || (data.showEmptyState === 'true' && (c.data.widgetsData.length === 0 || c.data.instanceId.length === 0)) ? '': 'recommended-card-section'">
  <div class="panel-heading b-b">
    <h3 id="{{data.instanceId}}-widget-title" class="panel-title">
      {{::c.data.title}}
    </h3>
  </div>
  <div class="rfy-empty-state" ng-if = "data.showEmptyState === 'true' && (c.data.widgetsData.length === 0 || c.data.instanceId.length === 0)">
    <p>
      ${We don't have any recommendations to show you yet.}
    </p>
  </div>
  <div class="panel-body" ng-if = "c.data.widgetsData.length > 0 && c.data.instanceId.length > 0"  aria-labelledby="{{data.instanceId}}-widget-title" role="region">
    <div class="contents-section {{c.data.instanceId}}-contents-section" id="{{c.data.listType}}-contents-section" ng-class="(c.data.cardType === 'single' && c.data.listType === 'card-list') ? 'content-section-single-cards' : ''">
      <div id="body-content" class="{{c.options.card_behaviour}} {{c.data.listType}} {{c.data.instanceId}}-body-content" ng-repeat="widgetData in c.data.widgetsData" ng-class="c.data.listType === 'simple-link' ? '': 'card-body-content'">
        <div class="flex-item-card" id="{{c.data.listType}}-widget-body" ng-class="{'card-border' : c.data.listType === 'card-list'}">
          <sp-widget widget="widgetData"></sp-widget>
        </div>
      </div>
    </div>
    <div tabindex="-1" role="button" aria-label="${Click to swipe the cards to left}" ng-show="c.showLeftArrow()" ng-if="c.data.cardType === 'single' && c.data.listType === 'card-list'" class="swipe-button" id="{{c.data.instanceId}}-left-swipe" ng-click="c.moveLeft()"><span class="glyphicon glyphicon-menu-left" id="icon"></span></div>
    <div tabindex="-1" role="button" aria-label="${Click to swipe the cards to right}" ng-show="c.showRightArrow()" ng-if="c.data.cardType === 'single' && c.data.listType === 'card-list'" class="swipe-button" id="{{c.data.instanceId}}-right-swipe" ng-click="c.moveRight()" ng-style="{marginLeft: c.getRightSwipeMargin()}"><span class="glyphicon glyphicon-menu-right" id="icon"></span></div>
  </div>
</div>
