<p ng-if="data.task.description && !data.task.finished" ng-bind-html="c.description"></p>
<sp-widget ng-if = "data.recommendedWidget" widget="::data.recommendedWidget"></sp-widget>
<div id="esc-task-completed" ng-if="data.task.finished" class="completed-task">
	<widget id="esc-task-status" options="data.esc_task_status_options"></widget>
</div>
<div class="document-acknowledge-task" ng-class="::{'hidden-xs' : options.hide_xs}" ng-if="data.task.assigned_to_me" ng-init="init(user.sys_id)">
  <div><hr-skip-task/></div>
  <sp-widget id="eSignFrame" widget="data.widget"></sp-widget>
</div>
<div ng-if="!data.task.assigned_to_me && !data.task.finished">
	<hr-task-action caption="{{data.caption}}" timestamp="::data.task.created" created="true" />
</div>
<div ng-if="data.task.finished">
  <div ng-if="data.task.state == '7'">
    <hr-task-action caption="${Task cancelled. No further action on your part is required}" completed-by="{{data.completed_by}}" status="{{data.task.stateLabel}}" timestamp="::data.task.closed_at"/>
  </div>
</div>
