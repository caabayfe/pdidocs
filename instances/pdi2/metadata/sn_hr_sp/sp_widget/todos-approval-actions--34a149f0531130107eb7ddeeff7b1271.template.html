<div id="todo-approval-actions" ng-if="data.isApprover">
  <div ng-if="!data.isPosted">
    <div class="textbox" id="todo-acceptance-panel-textboxdiv" ng-if="data.useCommentBox">
      <textarea aria-label="${comments}"  class="form-control"  aria-label="${comments}" type="text" id="comments" name="comments" ng-model="c.data.comments" placeholder='{{data.CONST.PLACEHOLDER_MESSAGE}}'></textarea>
    </div>
    <div id="todo-approval-panel-reject" class="approval-buttons btn-toolbar">
      <button aria-label="${Reject}" class="btn btn-default button-width" name="submit" value=${Submit} ng-click="$event.stopPropagation();onActionClick('rejected')">
        ${Reject}
      </button>
      <button aria-label="${Approve}" class="btn btn-primary button-width" name="accept" ng-click="$event.stopPropagation();onActionClick('approved')" type="button"  id="hr-acceptance-panel-Acceptance">
        ${Approve}
      </button>
    </div>
  </div>
  <div ng-if="data.isPosted" class="approval-completion">
    <task-action caption="{{c.data.caption}}" small_caption ="{{data.comment}}" time_stamp="{{data.timeStamp}}"/>
  </div>  
</div>
