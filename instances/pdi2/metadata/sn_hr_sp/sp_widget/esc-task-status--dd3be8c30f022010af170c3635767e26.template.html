<div class="task-status-body" ng-class="{'border-success': c.options.success_icon, 'border-skipped': c.options.skipped_task}">
  
  <!-- Icon -->
  <div class="color-rejected">
    <i class="{{c.options.icon}}" ng-class="{'color-success': c.options.success_icon, 'text-muted': c.options.skipped_task}" aria-hidden="true"></i>
  </div>
  
  <div class="task-status-data">
    <!-- Header -->
    <span ng-if="c.options.header" class="task-status-header">{{c.options.header}}</span>
   
    <!-- Time stamp -->
    <span ng-if="c.options.time" class="task-status-info">
      <span>{{c.options.state}}</span>
      <sn-time-ago timestamp="c.options.time"></sn-time-ago>
    </span>
    
    <!-- Link -->
    <a ng-if="c.options.link" class="task-status-link" href="{{::c.options.link.url}}" target="{{::c.options.anchor_target}}">{{::c.options.link_text}}</a>
  </div>
</div>
