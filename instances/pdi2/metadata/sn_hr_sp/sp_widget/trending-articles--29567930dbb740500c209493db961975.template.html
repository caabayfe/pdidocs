<div class = "panel kb-articles" ng-if = "data.response && data.response.length > 0">
  <div class = "panel-heading">
    <h4 class = "h4 panel-title" id="header-{{data.sysId}}">
     {{::data.title}}
    </h4>
  </div>
  <div class = "panel-body">
   <ul class = "list-group">
  <li class = 'list-group-item' ng-repeat="a in ::data.response">
  <a  aria-label="{{options.title}},{{data.title}},{{a.short_description}}" ng-click="c.articleOpened(a.short_description)" href="?id=kb_article&sys_id={{::a.sys_id}}">{{::a.short_description}}</a>
  </li>
  </ul>
    <hr>
  </div>
<!-- your widget template -->
</div>
