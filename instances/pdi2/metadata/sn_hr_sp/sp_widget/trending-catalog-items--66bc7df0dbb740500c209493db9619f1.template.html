<div class = "panel catalog-items" ng-if = "data.results && data.results.length > 0">
  <div class = "panel-heading">
    <h4 class = "h4 panel-title" id="header-{{data.sysId}}">
      {{::data.title}}
    </h4>
  </div>
    <div class = "panel-body">
   <ul class = "list-group">
  <li class = 'list-group-item' ng-repeat="a in ::data.results">
  <a  aria-label="{{options.title}},{{data.title}},{{a.name}}" ng-click="c.catalogItemOpened(a.name)" href={{::a.href}}>{{::a.name}}</a>
  <p class = "margin-bottom">{{a.short_description}}</p>
  </li>
  </ul>
  </div>
<!-- your widget template -->
</div>
