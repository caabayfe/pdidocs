<div id="todos-recommendations" ng-if = "data.results && data.results.length > 0">
	<div class="panel">
		<div class="panel-heading">
			<h4 tabindex="0" class="h4 panel-title">{{::data.title}}</h4>
		</div>
		<div class="panel-body">
			<ul class="list-group">
				<li class='list-group-item' ng-repeat="a in ::data.results"> <a href="?id=kb_article&sys_id={{::a.sys_id}}">{{::a.short_description}}</a>
				</li>
			</ul>
		</div>
	</div>
	<!-- your widget template -->
</div>
