<div class="default-todo-line-item"  ng-if="data.task.finished">
   <hr-task-action caption="${{{data.task.description}}}" 
      timestamp="::data.task.createdTime"
      />
</div> 

<div class="panel panel-{{::options.color}} b task-activity"  ng-if="!data.task.finished">
    <h4>{{data.task.description}}</h4>
    <div>
      <a class="task-link" ng-href="{{trustedUrl}}" target="_blank" >
        <i alt="${Click here to open the To-Do}" class="fa fa-hand-o-right"></i>
        ${Click here to open the To-Do}
      </a>
  </div>
</div>
