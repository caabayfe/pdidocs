<div class="widget-ticket-attachment-gallery" ng-class="{'--loading': loading, '--empty': !attachments.length && !uploading, '--touch': touchEnabled}" ng-if="canRead"}>
<h3>${Attachments}</h3>
<div class="__gallery">
  <button title="${Add attachment}" ng-click="uploading = !uploading" class="__add btn btn-link" ng-disabled="loading" ng-show="canAttach">
      <span class="glyphicon glyphicon-paperclip"></span>
  </button>
	<ul ng-if="attachments.length && !uploading" class="__attachments">
    <li ng-repeat="document in attachments | limitTo : limitThumbnails">

      <a aria-haspopup="true" data-toggle="dropdown" id="{{::document.sys_id}}_popup" ng-if="!!document.thumb_src" class="__thumbnail">
	      <img alt="{{::document.file_name}}" ng-src="{{document.thumb_src_small}}"/>
      </a>
      <div class="__preview dropdown-menu {{::document.sys_id}}_popup" ng-if="!!document.thumb_src" >
	      <img alt="{{::document.file_name}}" ng-src="{{document.thumb_src_medium}}"/>
      </div>
      
      <span
        ng-if="!document.thumb_src"
        class="__thumbnail --missing fa {{::document.icon}}"
        alt="{{::document.file_name}}"
        aria-hidden="true"
      />

      <div class="__caption">
        <a href="{{::document.downloadUrl}}"><span ng-bind-html="document.file_name" class="ng-binding"></span></a>
        <span>{{::document.size}}</span>
      </div>

      <div class="__toolbar" data-id="{{::document.sys_id}}" ng-if="!loading">
        <button title="${Rename attachment}" ng-click="toolbarCtrl.rename(document.sys_id)" class="btn btn-link" ng-if="canWrite">
          <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span>
        </button>
        <a title="${Download attachment}" href="{{document.downloadUrl}}" class="btn btn-link">
          <span class="glyphicon glyphicon-download-alt"></span>
        </a>
        <button title="${Remove attachment}" ng-click="toolbarCtrl.remove(document.sys_id)" class="btn btn-link" ng-if="canWrite">
          <span class="glyphicon glyphicon-remove" aria-hidden="true"></span>
        </button>
      </div>

    </li>
  	<li ng-if="attachments.length > limitThumbnails" class="__more">
      <button ng-click="attachmentListCtrl.toggleLimit()" ng-bind="dynamicMessages.showMore" class="btn btn-link" aria-expanded="false"/>
  	</li>
  	<li ng-if="limitThumbnails > maxThumbnails" class="__more">
      <button ng-click="attachmentListCtrl.toggleLimit()" class="btn btn-link" aria-expanded="true">${View less}</button>
  	</li>
  </ul>
  <span ng-if="!attachments.length && emptyListText" class="__noresults" ng-bind="emptyListText" />
	<div ng-if="uploading" ng-disabled="loading" ng-file-drop="toolbarCtrl.uploadImmediate($files)" ng-multiple="true" class="__upload">
    <span>${Drag and Drop or...}</span>
    <button ng-click="toolbarCtrl.upload()" ng-disabled="loading" class="btn btn-secondary">
      ${Browse files}
    </button>
 		<input type="file" ng-file-select="toolbarCtrl.uploadImmediate($files)" multiple="true" />
  </div>

  <sn-confirm-modal
      ng-if="!!current"
      modal-name="attachment-gallery-confirm-delete"
      title="${Delete Attachment}"
      cancel="toolbarCtrl.dismissRequest()"
      alert="toolbarCtrl.removeImmediate(current.sys_id)"
      alert-button="${Delete}"
      cancel-button="${Cancel}">
      <p ng-bind="dynamicMessages.confirmDelete" style="word-wrap: break-word;" />
  </sn-confirm-modal>

  <sn-confirm-modal
      ng-if="!!current"
      modal-name="attachment-gallery-confirm-rename"
      title="${Rename Attachment}"
      cancel="toolbarCtrl.dismissRequest()"
      ok="toolbarCtrl.renameImmediate(current.sys_id)"
      ok-button="${Rename}"
      cancel-button="${Cancel}">
      <input type="text" value="{{current.name}}" class="__thumbnail_name form-control"/>
  </sn-confirm-modal>

</div>
</div>
