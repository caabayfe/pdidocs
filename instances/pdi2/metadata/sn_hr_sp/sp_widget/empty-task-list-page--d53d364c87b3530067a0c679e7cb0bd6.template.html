<div class = "panel-body text-center" role="button" aria-hidden="false">
   <div ng-if ="c.isFutureState" class="future-state">
      <p ng-if ="!c.isInvalidURL" >
         <i alt="{{c.message}}"  class="fa fa-3x fa-smile-o icon-no-results" aria-hidden="true"></i>
      </p>
      <h3 ng-if="!c.isInvalidURL" class="future-state-title">
         {{c.title }}
      </h3>
      <h4 class ="future-state-message">{{c.message}}</h4>
   </div>
   <div  ng-if ="!c.isFutureState" class="running-state">
      <p ng-if ="! c.isInvalidURL">
         <i alt="{{c.message}}" class="fa fa-3x icon-no-results" ng-class="c.icon" aria-hidden="true"></i>
      </p>
      <h4 class ="running-state-mmessage">{{c.message}}</h4>
   </div>
</div>
