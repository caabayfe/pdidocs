<p ng-if="data.task.description" ng-bind-html="c.description"></p>
    <sp-widget ng-if = "data.recommendedWidget" widget="::data.recommendedWidget"></sp-widget>
<div class="panel panel-{{::options.color}} b task-activity" ng-if="data.task.assigned_to_me && !data.task.finished">
  <div><hr-skip-task /></div>
  <div id="task_link">
    <h4>{{data.task.short_description}}</h4>
    <a class="task-link" ng-href="{{trustedUrl}}" ng-click="clickOnTaskLink();" target="_blank" >
      <i alt="${Click here to open link}" class="fa fa-hand-o-right"></i>
      	${Click here to open link}
    </a>
  </div>
  <div class="ng-binding ng-scope">
    <strong>${Note:}</strong> ${Once the task is complete, it will soon move to the completed tab.}
  </div>
  <hr-show-updating />
</div>
<div ng-if="!data.task.assigned_to_me && !data.task.finished">
	<hr-task-action caption="{{data.caption}}" timestamp="::data.task.created" created="true"/>
</div>
<div ng-if="data.task.finished">
	<hr-task-action  caption="${Your task is complete.}"  completed-by="{{data.completed_by}}" status="{{data.task.stateLabel}}" timestamp="::data.task.closed_at"/>
</div>
