description: Organizes a user's assigned records. List categories provide specific groups to help users sort and find specific records easily. You can tailor the list to show specific items depending on the user's role. You can create filtered lists with select list columns and assign the list to specific teams to help them focus their efforts. This template includes the list menu, which appears in the left pane to provide additional navigation capabilities for default lists and lists created by the user. The list page template is intended for use in large displays as a fullscreen experience.
