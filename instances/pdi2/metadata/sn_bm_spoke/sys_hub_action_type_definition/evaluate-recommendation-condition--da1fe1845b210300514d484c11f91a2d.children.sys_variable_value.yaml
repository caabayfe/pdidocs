  value: |-
    (function execute(inputs, outputs) {
      var reval       = new sn_bm_client.RecommendationEvaluator();
      var count       = Number(inputs.count);
      var threshold   = Number(inputs.threshold);
      var score       = 1.0;
      var scaleFactor = sn_bm_common.CommonConstants.RECO_SCALE_FACTOR;
      var condition   = (gs.nil(inputs.gr.query_conditions + '')) ? '' : inputs.gr.query_conditions + '';

      if (gs.nil(inputs.gr)) {
        outputs.result = false;
        outputs.score = score;
        return;
      }

      if ((inputs.gr.type + '') == 'indicator_value')
        count = reval.getIndicatorValue(inputs.gr.indicator + '', inputs.activityGR.date + '');

      else if ((inputs.gr.type + '') == 'usage')
        count = reval.getTableCount(inputs.gr.table + '', condition);

      /* Evaluation result: true/false */
      if ((inputs.direction + '') == 'min')
        outputs.result = (count < threshold);
      else if ((inputs.direction + '') == 'max')
        outputs.result = (count > threshold);
      else if ((inputs.direction + '') == 'equal')
        outputs.result = (count == threshold);

      /* Evaluation score: scaled distance from threshold */
      var score = (threshold <= 0) ? 1.0 : scaleFactor * Math.abs(count - threshold) / threshold;
      score = Math.min(scaleFactor, score);
      score = (outputs.result) ? score : 0;

      var pluginId = inputs.gr.plugin_id.id + '';
      if (!gs.nil(pluginId)) {
        var pluginEval = new GlidePluginManager().isActive(pluginId) === false;
        outputs.result = pluginEval || outputs.result;
        score          = (pluginEval) ? scaleFactor : score;
      }
      var scriptResult = new GlideScopedEvaluator().evaluateScript(inputs.gr, 'script');
      if (!gs.nil(scriptResult) &&  inputs.gr.advanced + '' == 'true') {
        outputs.result = outputs.result || scriptResult.evaluation;
        scriptResult.score = Math.min(scaleFactor, scriptResult.score);
        score = gs.nil(scriptResult.score) ? score : (score + scriptResult.score) / 2.0;
      }

      outputs.score = (score === Infinity || isNaN(score) || score === 0) ? 1.0 : score;
      outputs.score = (outputs.result) ? outputs.score : 0;

    })(inputs, outputs);
