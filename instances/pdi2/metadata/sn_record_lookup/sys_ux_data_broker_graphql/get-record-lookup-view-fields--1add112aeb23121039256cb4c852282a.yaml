api_name: sn_record_lookup.Get record lookup view fields
batch_exclude: 'false'
description: Fetchs lookup view fields for search and linked cards
mutates_server_data: 'false'
name: Get record lookup view fields
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "table",
          "label": "Table",
          "description": "Table name",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "searchView",
          "label": "Search view",
          "description": "Search view",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "selectedView",
          "label": "Linked card view",
          "description": "Linked card view",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "isSearchViewValid",
          "label": "Is search view name valid",
          "description": "Is search view name valid",
          "readOnly": false,
          "fieldType": "boolean",
          "mandatory": false,
          "defaultValue": false
      },
      {
          "name": "isSelectedViewValid",
          "label": "Is selected view name valid",
          "description": "Is selected view name valid",
          "readOnly": false,
          "fieldType": "boolean",
          "mandatory": false,
          "defaultValue": false
      }
  ]
query: |-
  query getFieldList($table: String!, $searchView: String!, $selectedView: String!, $isSearchViewValid: Boolean!, $isSelectedViewValid: Boolean!) {
    GlideLayout_Query {
      ... @include(if: $isSearchViewValid) {
        searchViewFields: formLayout(table: $table, view: $searchView, sysId: "-1") {
          sectionLayout {
            ...sectionLayoutFields
          }
        }
      }
      ... @include(if: $isSelectedViewValid) {
        selectedViewFields: formLayout(table: $table, view: $selectedView, sysId: "-1") {
          sectionLayout {
            ...sectionLayoutFields
          }
        }
      }
    }
  }

  fragment sectionLayoutFields on GlideLayout_sectionLayoutType {
    caption
    captionDisplay
    rows {
      fields
    }
  }
required_translations: |-
  [ {
    "message" : "Linked card view",
    "comment" : ""
  }, {
    "message" : "Search view",
    "comment" : ""
  }, {
    "message" : "Table",
    "comment" : ""
  }, {
    "message" : "Table name",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Get record lookup view fields
sys_policy: protected
type: query
use_record_domain: 'false'
