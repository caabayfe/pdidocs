api_name: sn_ci_analytics.VAComparisonModelEncodedQueryUtils
caller_access: ''
client_callable: 'false'
description: |-
  Utility to convert VA Comparison Model (JSON) to VA URI (STRING) and vice-versa.

  API
  decodeVAURIQuery({string} encodedString, {boolean} exposeSkeleton) - Converts VA Encoded String (encodedString) to VA Comparison JSON Model. To expose intermediate Node structure, use exposeSkeleton = true
  encodeVAURIQuery({object} jsonQuery) - Converts VA Comparison Model (jsonQuery) to VA Encoded String


  EXAMPLE: decodeVAURIQuery()
  [INPUT]

  Self%20solved/matches/false/NEW_QUERY+Feedback/is%20one%20of/%5B%22Good%22%2C%22Bad%22%5D/AND+Events/is/Bot%20Output/AND>Prop1/equals/%7B%22event_trigger%22%3Atrue%2C%22api_key%22%3A%22ABDABMASBKJT7843BF7834YT8B78FB373%22%7D/IN_WHICH+Prop2/is/Completed/OR^+Duration/%3E/20000/AND

  [OUTPUT]

  [
    {
      "field": "Self solved",
      "operator": "matches",
      "conditionValue": false,
      "comparisonType": "NEW_QUERY",
      "children": []
    },
    {
      "field": "Feedback",
      "operator": "is one of",
      "conditionValue": ["Good", "Bad"],
      "comparisonType": "AND",
      "children": []
    },
    {
      "field": "Events",
      "operator": "is",
      "conditionValue": "Bot Output",
      "comparisonType": "AND",
      "children": [
        {
          "field": "Prop1",
          "operator": "equals",
          "conditionValue": {"event_trigger": true, "api_key": "ABDABMASBKJT7843BF7834YT8B78FB373"},
          "comparisonType": "IN_WHICH",
          "children": []
        },
        {
          "field": "Prop2",
          "operator": "is",
          "conditionValue": "Completed",
          "comparisonType": "OR",
          "children": []
        }
      ]
    },
    {
      "field": "Duration",
      "operator": ">",
      "conditionValue": 20000,
      "comparisonType": "AND",
      "children": []
    }
  ]


  EXAMPLE: encodeVAURIQuery()
  [INPUT]

  [
    {
      "field": "Self solved",
      "operator": "matches",
      "conditionValue": false,
      "comparisonType": "NEW_QUERY",
      "children": []
    },
    {
      "field": "Feedback",
      "operator": "is one of",
      "conditionValue": ["Good", "Bad"],
      "comparisonType": "AND",
      "children": []
    },
    {
      "field": "Events",
      "operator": "is",
      "conditionValue": "Bot Output",
      "comparisonType": "AND",
      "children": [
        {
          "field": "Prop1",
          "operator": "equals",
          "conditionValue": {"event_trigger": true, "api_key": "ABDABMASBKJT7843BF7834YT8B78FB373"},
          "comparisonType": "IN_WHICH",
          "children": []
        },
        {
          "field": "Prop2",
          "operator": "is",
          "conditionValue": "Completed",
