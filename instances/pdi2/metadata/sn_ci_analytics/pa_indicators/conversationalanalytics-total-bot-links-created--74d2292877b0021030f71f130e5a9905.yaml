description: |-
  ConversationalAnalytics: Total Bot Links Created is measured daily as unit #.
  The goal for this indicator is not set.
  It is the count on data source ConversationalAnalytics.UserSearchMetrics.BotLinks, which is using the table: 
  sn_ci_analytics_st_cs_event
  with the following conditions:
  Event Type = Bot Output Result Clicked .or. Event Type = Bot Output Triggered .or. Event Type = Bot Output Zero Clicks .and. Created on Today
  Additional conditions:
  Event Type = Bot Output Triggered
