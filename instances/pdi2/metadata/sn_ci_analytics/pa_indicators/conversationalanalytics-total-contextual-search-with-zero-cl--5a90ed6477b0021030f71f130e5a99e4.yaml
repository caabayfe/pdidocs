  It is the count on data source ConversationAnalytics.UserSearchMetrics.ContextualSearch, which is using the table: 
  sn_ci_analytics_st_cs_event
  with the following conditions:
  Event Type = Contextual Search Result Clicked .or. Event Type = Contextual Search Triggered .or. Event Type = Contextual Search Zero Clicks .or. Event Type = Contextual Search Zero Results .and. Created on Today
  Additional conditions:
  Event Type = Contextual Search Zero Clicks
