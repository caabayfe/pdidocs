description: |-
  Converstional Analytics: Total AI Search Triggered is measured daily as unit #.
  The goal for this indicator is not set.
  It is the count on data source ConversationalAnalytics.UserSearchMetrics.AISearch, which is using the table: 
  sn_ci_analytics_st_cs_event
  with the following conditions:
  Event Type = AI Search Result Clicked .or. Event Type = AI Search Triggered .or. Event Type = AI Search Zero Clicks .or. Event Type = AI Search Zero Results
  Additional conditions:
  Event Type = AI Search Triggered
