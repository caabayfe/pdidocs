message: The average execution time for this scheduled collection job is too long.
name: Scheduled collection job with high average execution time
severity: warning
solution_description: |-
  Check the job logs to identify possible sources of slowness. The following values may help identify the root cause.
  - The score collection relative start and end interval
  - The number of different indicator sources used by the indicators
  - If the job includes inefficient scripted indicators or breakdowns
  - If there are slow queries during the job execution
