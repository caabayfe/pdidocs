            "script": "(function execute() {\n    var info = gs.getProperty('glide.buildtag');\n    var build = 'tokyo';\n    var patch = '';\n    if(info && info != ''){\n        var arr = info.split('__');\n        var build = arr[0].split('-')[1];\n        var patch = '';\n        if (arr.length == 2) {\n            patch = arr[1].split('-')[0].slice(5);\n        }\n    }\n    var instanceURL = gs.getProperty('glide.servlet.uri');\n    var instanceName = gs.getProperty('instance_name');\n    var ais_enable = gs.getProperty('glide.ais.enabled') && gs.getProperty(\"sn_ci_diagnostics.ais_enable\", \"false\");\n    var gr = new GlideRecord('sys_upgrade_history');\n    gr.addEncodedQuery('to_versionLIKEglide-');\n    gr.query();\n    if(gr.next()){\n       var latestUpgrade = {};\n       latestUpgrade.from = gr.getValue('from_version');\n       latestUpgrade.to = gr.getValue('to_version');\n       latestUpgrade.dateTime = gr.getValue('upgrade_finished');\n    }\n    var systemInfo = {'instanceName':instanceName, 'instanceURL':instanceURL, 'build':build, 'patch':patch, 'ais_enable':ais_enable, 'latestUpgrade':latestUpgrade};\n    vaVars.systemInformation = JSON.stringify(systemInfo);\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
