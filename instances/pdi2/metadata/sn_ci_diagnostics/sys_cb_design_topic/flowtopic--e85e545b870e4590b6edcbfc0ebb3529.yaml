            "stepType": "LinkOutput",
            "name": "Download Support Data",
            "url": {
              "value": "(function execute() {\n    var transcript = JSON.stringify(vaSystem.getTranscript());\n    var diagnosticData = {};\n    diagnosticData.systemInformation = JSON.parse(vaVars.systemInformation);\n    if(vaVars.global_diagnosticdata && vaVars.global_diagnosticdata != ''){\n        var plugindata = JSON.parse(vaVars.global_diagnosticdata);\n        var pluginName = JSON.parse(vaVars.selectedPlugin).name;\n        var pluginCategory = JSON.parse(vaVars.selectedPlugin).categoryName;\n        var appendData = {};\n        appendData[pluginName] = plugindata;\n        diagnosticData[pluginCategory] = appendData;\n    }\n    diagnosticData.transcript = transcript;\n    var interactionSysId = vaSystem.getInteractionSysId();\n    var gr = new GlideRecord('interaction');\n    gr.get(interactionSysId);\n    var gsa = new GlideSysAttachment();\n    var id = gsa.write(gr, \"diagnostic_data.json\", 'text/plain', JSON.stringify(diagnosticData, null, 4));\n    return '/sys_attachment.do?sys_id='+id;\n})()\n",
              "mode": "script"
            },
