          "b148c9cb19ad473b9638e968b2fa9bf0": {
            "id": "b148c9cb19ad473b9638e968b2fa9bf0",
            "name": "Get Applicable Diagnostics records",
            "script": "(function execute() {\n    var ifRequiredPluginNotInstalled = function(pluginIds){\n        if(!pluginIds || pluginIds == ''){\n            return false;\n        }\n        var plugins = pluginIds.split(',');\n        var pm = new GlidePluginManager();\n        for(var i=0; i < plugins.length; i++){\n            if(!pm.isActive(plugins[i]))\n              return true;\n        }\n        return false;\n    };\n    var gr = new GlideRecord('ci_diagnostic_content');\n    var selectionObj = JSON.parse(vaVars.selections);\n    var sysids = '';\n    for(var i=0; i < selectionObj.length; i++){\n        if (i!=0){\n           sysids = sysids + ',';\n        }\n        sysids = sysids +  selectionObj[i];\n    }\n    gr.addQuery('sys_id','IN',sysids);\n    gr.query();\n    var recs = {}\n    var allRecords = [];\n    while(gr.next()){\n        var requiredPlugins = gr.getValue('plugin_dependency')\n        if(ifRequiredPluginNotInstalled(requiredPlugins)){\n             continue;\n        }\n        var obj = {};\n        var category = gr.category.name;\n        obj.sysId = gr.getUniqueValue();\n        obj.name = gr.getValue('name');\n        obj.desc = gr.getValue('description');\n        obj.category = gr.getValue('category');\n        obj.categoryName = gr.category.name + '';\n        obj.topic = gr.support_topic.name + '';\n        obj.dataCollectionTopic = gr.data_collection_topic.name + '';\n        obj.healthCheckTopic = gr.category.health_check_topic.name + '';\n        if (recs[category] && recs[category].length > 0 ) {\n            recs[category].push(obj);\n        }else {\n            var arr = [];\n            arr.push(obj);\n            recs[category] = arr;\n        }\n        allRecords.push(obj);\n    }\n    vaVars.pluginRecords = JSON.stringify(allRecords);\n    vaVars.categories = JSON.stringify(recs);\n}\n)()",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
