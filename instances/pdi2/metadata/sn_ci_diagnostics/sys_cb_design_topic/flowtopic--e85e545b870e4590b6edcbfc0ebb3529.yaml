 arr.push(obj);\n            recs[category] = arr;\n        }\n        allRecords.push(obj);\n    }\n    vaVars.pluginRecords = JSON.stringify(allRecords);\n    vaVars.categories = JSON.stringify(recs);\n}\n)()","id":"b148c9cb19ad473b9638e968b2fa9bf0","name":"Get Applicable Diagnostics records","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"ReferenceChoiceInputPrompt","mode":"external","id":"be2f7d6d62334ab79a0338ced4983748","name":"Select plugin","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"variable_id":"2a1eb1ae35b34c9dae7a9d4425b7c982","message":{"type":"String","mode":"string","value":"gs.getMessageLang(\"Based on your input, I found below solutions. Could you please select one from the list to proceed further?\", vaContext.getRequesterLang())"},"request_feedback":false,"skippable":{"type":"Applicability","mode":"script","value":"false"},"skipreprompt":{"type":"Applicability","mode":"script","value":"false"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true},"expression_mode":"script","script":"(function execute() {\n    /* Code your script logic here. For example, you might want to call an external web service\n       to find the best local Italian restaurants.  Call a Restaurants Web Service then use the results\n       to populate an options array.\n\n        var options = [];\n        options.push({ ''value'': ''best_italian_1'', ''label'': gs.getMessageLang(\"Best Italian Restaurant Ever\", vaContext.getRequesterLang()), ''render_style'': ''data'' });\n        options.push({ ''value'': ''best_italian_2'', ''label'': gs.getMessageLang(\"Even Better Italian Restaurant\", vaContext.getRequesterLang()), ''render_style'': ''data'' });\n        return options;\n    */\n\n    var options = [];\n    var plugins = JSON.parse(vaVars.pluginRecords);\n    for(var i=0; i<plugi