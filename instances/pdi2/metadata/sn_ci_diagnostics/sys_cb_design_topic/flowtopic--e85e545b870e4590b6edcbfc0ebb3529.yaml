            "name": "Cleanup",
            "script": "(function execute() {\n    vaVars.pluginName = null;\n    vaVars.selections = null;\n    vaVars.pluginRecords = null;\n    vaVars.selectedPlugin = null;\n    vaVars.executeOption = null;\n    vaVars.categories = null;\n    vaVars.selectedCategory = null;\n    vaVars.global_search_kb = false;\n    vaVars.global_issue_description = null;\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
          "a701d259a7fc4ed088a223c0b70a7389": {
            "id": "a701d259a7fc4ed088a223c0b70a7389",
            "name": "Capture Sys Ids",
            "script": "(function execute() {\n    vaVars.global_issue_description = vaInputs.issue_description;\n    var output=[];\n    if(vaInputs.searchresults && vaInputs.searchresults != '') {\n        var results = JSON.parse(vaInputs.searchresults);\n        if(results && results.length && results.length > 0 ){\n            for(var i = 0; i < results.length; i++){\n                var result = results[i];\n                var sysId=result.propValues.model.sys_id;\n                output.push(sysId);\n            }\n        }\n    }\n    vaVars.selections=JSON.stringify(output);\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
