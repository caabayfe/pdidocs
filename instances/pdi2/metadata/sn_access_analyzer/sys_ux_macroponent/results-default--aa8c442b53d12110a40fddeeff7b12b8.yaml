required_translations: |-
  [ {
    "message" : "<div>\n<div>Evaluation process is carried out by impersonating a user and determining the ACL permission on the resource. Permission rules allow access to the specified resource if all three of these checks evaluate to true:</div>\n<div>1. Access handlers must evaluate to &ldquo;Passed&rdquo;, or is empty/undefined</div>\n<div>2. Data filters must evaluate to &ldquo;Passed&rdquo;, or is empty/undefined</div>\n<div>3. Access control rules (ACLs) evaluates to &ldquo;Passed&rdquo;</div>\n<br />\n<div>The three checks are evaluated independently in the order displayed above.</div>\n</div>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>An internal system check using hidden source code on the platform. This is a system security check that you cannot modify. Access handler can grant or deny access to a resource without evaluating ACLs. If Access handler is ignored, then the ACLs are evaluated. You cannot modify the Access handler checks in any way. For example, an Access handler implementation is used for access checks on application resources such as read-only access.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Data filter is a form of access control designed to work along with the existing Access Control rules (ACLs) on your instance.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Rules for access control lists (ACLs) restrict access to data by requiring users to pass a set of requirements before they can interact with it.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<ul>\n<li>[Passed] Access granted</li>\n<li>[Blocked] Access denied</li>\n<li>[Skipped] Did not evaluate</li>\n<li>[Undefined] No rule found</li>\n</ul>",
    "code" : "",
    "comment" : ""
  }, {
