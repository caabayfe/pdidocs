    "message" : "<p><span xml:lang=\"EN-US\" data-contrast=\"auto\">From the Groups tab, you can check the group the user needs to be added and add the user to the group.</span><span data-ccp-props=\"{&quot;201341983&quot;:0,&quot;335559685&quot;:720,&quot;335559739&quot;:200,&quot;335559740&quot;:276}\">&nbsp;</span></p>",
