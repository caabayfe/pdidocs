  [ {
    "message" : "<p>For comparing the access, you can perform the following analysis:  </p>\n<p>Level 1: Compare the users record to understand the attributes, roles, and groups.  </p>\n<p>Level 2: Compare the users access to run the root cause analysis by finding the access issues.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Query ACL operations are executed when the user tries to query on a field. The Query ACL is of 2 types.<br>&nbsp; 1. query_match: A query that includes (is, is not, is empty, etc).<br>&nbsp; 2. query_range: A query that includes (starts with, ends with, contains, etc).<br>You can now choose a table and field when evaluating the Query access of a user on a field.</p>",
