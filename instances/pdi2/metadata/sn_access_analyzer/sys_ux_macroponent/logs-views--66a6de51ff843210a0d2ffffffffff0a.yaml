    "message" : "<div>\n<ul>\n<li>Passed: ACL requirements were met and access was granted</li>\n<li>Blocked: ACL requirements were not met and access was not granted</li>\n<li>Skipped: ACL requirements were not checked because they were not required</li>\n<li>Undefined: No ACL requirements were set</li>\n</ul>\n</div>\n<div>&nbsp;</div>",
