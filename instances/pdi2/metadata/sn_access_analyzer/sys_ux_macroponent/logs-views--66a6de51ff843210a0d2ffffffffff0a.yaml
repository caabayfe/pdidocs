  [ {
    "message" : "<div>\n<p><span xml:lang=\"EN-US\" data-contrast=\"auto\">The \"session user\" and \"session roles\" shown here represent the effective user and roles consumed at the moment of this particular ACL (Access Control List) evaluation&mdash;these may differ from the physical user or agent initiator, depending on agent configuration.</span><span data-ccp-props=\"{}\">&nbsp;</span></p>\n</div>\n<div>\n<p><strong><span xml:lang=\"EN-US\" data-contrast=\"auto\">Session user:</span></strong><span xml:lang=\"EN-US\" data-contrast=\"auto\"> This is the user identity actually evaluated during the access check, and it may be the original invoking user or an agent identity based on agent configuration.</span><span data-ccp-props=\"{}\">&nbsp;</span></p>\n</div>\n<div>\n<p><strong><span xml:lang=\"EN-US\" data-contrast=\"auto\">Session roles:</span></strong> <span xml:lang=\"EN-US\" data-contrast=\"auto\">These are the roles currently active for the session. Roles may be assigned based on agent configuration, or may reflect a reduced set due to role masking, which determines the access checks that are performed.</span><span data-ccp-props=\"{}\">&nbsp;</span></p>\n<p><span data-ccp-props=\"{}\"><a href=\"https://iam.service-now.com/api/now/v1/context_doc_url/configure-next-best-action-agent\" target=\"_blank\" rel=\"noreferrer noopener\"><span xml:lang=\"EN-US\" data-contrast=\"none\"><span data-ccp-charstyle=\"Hyperlink\">Learn more about agent configuration</span></span></a></span></p>\n</div>",
    "code" : "",
