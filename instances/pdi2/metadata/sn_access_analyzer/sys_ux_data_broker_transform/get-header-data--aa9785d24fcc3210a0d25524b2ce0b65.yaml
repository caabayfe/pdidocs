api_name: sn_access_analyzer.Get results data for header
batch_exclude: 'false'
description: |-
  To create the header payload for the following scenarios:
  "requestId" is mandatory, "resultSysId" is optional

  "requestId" : Access request unique ID (not sys_id) from the "sn_access_analyzer_request" (request) table, that maps to results and logs tables within Access Analyzer
  "resultSysId": Sys id of the result record from the results table, that corresponds to the access request unique ID.


  1. If only "requestId" is passed, the flow will create payload for the reusable results page
  2. If "requestId" and "resultSysId" are passed, the flow will create payload for the reusable logs page
mutates_server_data: 'false'
