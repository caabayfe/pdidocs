category: security
description: All client-callable script includes must be protected by required role checks. If these scripts are not secured, any user—including those without proper authorization—could execute them, potentially accessing or modifying sensitive data or functions. To mitigate this risk, enforce role-based restrictions on every script include that can be called from the client side.
documentation_url: /api/now/v1/context_doc_url/CSHelp:Access_Controls
finding_type: scan_finding
name: Access Controls on Client callable Script Includes
priority: '2'
resolution_details: |-
  Remediation_Steps:
  1. Elevate to security_admin role
  2. Navigate to System Security > Access Control (ACL)
  3. Create new ACL for flagged Client Callable Script Include.
  Key_Verification:
  1. Confirm flagged Client Callable Script Include have ACL.
  2. Any logged-in users with minimum snc_internal can access an unprotected CCSI by default. Attacker can run a GlideAjax on console or do a custom HTTP request xmlhttp.do and can execute functions defined in Client callable script include. Create ACL around script include with Type as "client_callable_script_include" and define required roles.
