active: 'true'
category: security
description: The flagged user has roles assigned directly instead of through group inheritance. Direct assignments reduce visibility and complicate access audits — group-based access is preferred for governance.
documentation_url: /api/now/v1/context_doc_url/t_AddAUserToAGroup
finding_type: scan_finding
name: Users with Direct Role Assignments (Bypassing Groups)
priority: '3'
resolution_details: |-
  Remediation_Steps:
  1. Navigate to User Administration > Users and open the flagged user record. Document all directly assigned roles.
  2. Navigate to User Administration > Groups to identify existing or create new appropriate groups for these roles.
  3. Assign the identified roles to the appropriate groups and add the user to these groups.
  4. Wait for role inheritance to take effect (this may require completion of background jobs).
  5. Return to the user record and remove the direct role assignments.
  Key_Verification:
  1. Confirm the user retains the same effective permissions through group inheritance.
  2. Verify that the inherited field shows true for these roles in the sys_user_has_role table.
