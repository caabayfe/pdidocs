priority: '4'
resolution_details: |-
  Remediation_Steps:
  1. Go to User Adminstration --> Users, find the flagged inactive user.
  2. Review Assigned Roles --> click Edit
  3. Remove all roles assigned to flagged inactive user
       a. Remove the conflicting role if its directly assigned to the user.
