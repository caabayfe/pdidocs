active: 'true'
category: security
description: External users are typically given limited access using the snc_external role. This external user currently has access to one or more classified or sensitive data tables/fields. Such access is needs to be reviewed for external accounts and may result in unauthorized data exposure.
documentation_url: /api/now/v1/context_doc_url/explicit-role-plugin
finding_type: scan_finding
name: External users with access to classified data
priority: '1'
resolution_details: |-
  Remediation_Steps:
  1. Navigate to User Administration > Users and open the flagged external user record.
  2. Under the Roles related list for that user, click Edit and remove the flagged role(s) that grant access to classified data.
       a. If the role is assigned directly to the user, remove it from the user’s role list.
       b. If the role is assigned via a group, remove the user from that group. (Before doing so, review potential effects on other users in the group.)
  3. Review the Access Control List (ACL) for the relevant classified data to ensure that it is properly configured and restricts access as intended. (Elevate to security_admin role)
  Key_Verification:
  1. Use the Access Analyzer to confirm the external user cannot access classified data.
  2. Alternatively, impersonate the external user and verify that access to classified data is no longer possible.
run_condition: GlidePluginManager.isActive('com.glide.explicit_roles')
score_max: '100'
score_min: '0'
score_scale: '1'
short_description: External users with access to classified data
sys_name: External users with access to classified data
sys_policy: read
