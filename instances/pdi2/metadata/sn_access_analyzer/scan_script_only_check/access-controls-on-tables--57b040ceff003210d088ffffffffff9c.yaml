name: Access controls on Tables
priority: '2'
resolution_details: |-
  Remediation_Steps:
  1. Elevate to security_admin role
  2. Navigate to System Security > Access Control (ACL)
  3. Create new ACL for flagged Table.
  Key_Verification:
  1. Confirm flagged Table have ACL. Access control lists (ACLs) restrict access to data by requiring users to pass a set of requirements before they can interact with it.
