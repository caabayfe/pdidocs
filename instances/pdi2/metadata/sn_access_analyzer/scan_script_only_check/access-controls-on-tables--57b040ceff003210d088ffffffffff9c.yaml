description: This table does not have appropriate access controls in place. As a result, all of its data may be visible to users who do not need it for their roles. Without restrictions, confidential or sensitive information could be exposed to a broader audience, increasing risk. Make sure your tables are protected with correctly configured ACLs so that only authorized users can view or modify data relevant to them.
