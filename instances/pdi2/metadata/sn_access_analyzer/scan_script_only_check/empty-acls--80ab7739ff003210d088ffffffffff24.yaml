description: This Access Control List (ACL) record is flagged because it does not include a role, security attribute, data condition, controlled by reference or script. Without these essential conditions, sensitive data may become accessible to unintended users. To protect your environment, please ensure every ACL is configured with specific conditions, such as required roles or security attributes, to restrict data access and prevent unauthorized entry.
documentation_url: https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB1553688
finding_type: scan_finding
name: Empty ACLs
priority: '2'
resolution_details: |-
  Remediation_Steps:
  1. Elevate to security_admin role
  2. Navigate to System Security > Access Control (ACL) and open the flagged empty ACL.
  3. Define one or more condition for access enforcement.
  Key_Verification:
  1. Confirm that all ACLs have at least one condition—whether a role, security attribute, data condition, or script.
  2. Use Access Analyzer to confirm specific user, role or group can access the data.
