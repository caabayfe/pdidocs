category: security
description: When a UI Page lacks an Access Control List (ACL), it becomes accessible to all logged-in internal users by default. Without further script-level authorization check—such as 'gs.hasRole('user_admin')' —any internal user could potentially access this page. This makes it possible to perform actions like changing other user's passwords simply by knowing their user ID. For strong security, always enforce both ACLs and script-level checks to limit sensitive actions to authorized users only.
documentation_url: /api/now/v1/context_doc_url/CSHelp:acl-rule-types
finding_type: scan_finding
name: Access controls on UI Pages
priority: '2'
resolution_details: |-
  Remediation_Steps:
  1. Elevate to security_admin role
  2. Navigate to System Security > Access Control (ACL)
  3. Create new ACL for flagged UI Page.
  Key_Verification:
  1. Confirm flagged UI Page have ACL. UI Pages making call to server side code should have ACL's implemented.
