<div class="popover" id="popover-{{member.sys_id}}">
  <div class="popover-header">
    <div class="popover-title">${Profile}</div>
    <div>
      <button class="close-button" ng-click="closepopover('popover-'+member.sys_id)" aria-label="Close view profile popover">
        &times;
      </button>
    </div>
  </div>
  <div class="popover-body">
    <div class="col-12">
      <div class="row user-info">
        <div class="avatar-info col-3" aria-hidden="true">
          <sn-avatar class="avatar-extra-large" primary="member.sys_id" show-presence="false"></sn-avatar>
        </div>
        <div class="info col-9">
          <a class="popover-user-name" ng-href="?id=employee_profile&sys_id={{member.sys_id}}">{{member.name + ' '+ member.pronoun}}</a>
          <div class="popover-user-title">{{member.title}}</div>
          <div class="popover-user-title">{{member.department}}</div>
        </div>
      </div>
      <div class="contact-section">
        <div class="contact-row" ng-class="{'hide-element': !member.email}">
          <fa name="envelope-o" size="2"></fa>
          <a class="contact" href="mailto:{{member.email}}" aria-label="${Send an email to {{member.name}}}">
            {{member.email}}
          </a>
        </div>
        <div class="contact-row" ng-class="{'hide-element': !member.phone}">
          <fa name="phone" size="2"></fa>
          <a class="contact" href="tel:{{member.phone}}" aria-label="${Call {{member.name}}}">
            {{member.phone}}
          </a>
        </div>
      </div>
      <div class="my-team-footer">
        <a class="widget-button btn btn-primary view-org-chart" id="view_org_chart_{{member.sys_id}}" ng-href="?id=my_org_chart&p={{member.sys_id}}">
          ${View org chart}
        </a>
      </div>
    </div>
  </div>
</div>
