<style>
  .popover {
    padding: 0 !important;
    width: 30.2rem !important;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, .2) !important;
  }

  .popover-content {
    padding: 0 !important;
  }

  .title-container {
    display: flex;
    justify-content: space-between;
    padding: 1.6rem;
  }

  h4 {
    margin: 0;
  }

  .close-button {
    border: 0;
    padding: 0;
    cursor: pointer;
    background: transparent;
    font-style: normal;
    font-weight: 400;
    font-size: 16px;
    color: rgba(0, 0, 0, 0.7);
  }

  .visibility-label {
    font-size: 1.6rem !important;
  }

  .visibility-input-popover {
    padding: 0.8rem 1.6rem 1.6rem 1.6rem;
  }

  .visibility-input-modal {
    padding: 1.6rem 1.6rem 4rem 1.6rem;
  }

  .visibility-select-dropdown {
    margin-top: 0.4rem;
  }

  .button-group {
    display: flex;
    justify-content: flex-end;
  }

  .button-group-popover {
    padding: 0 1.6rem 0.8rem 1.6rem;
  }

  .button-group-modal {
    padding: 1.6rem;
  }

  .save-button {
    margin-left: 0.8rem;
  }
</style>
<div id="visibility_box_{{c.data.widgetMappingId}}">
  <div class='panel-heading b-b title-container'>
    <h4>{{::c.data.widgetTitle}}</h4>
    <button ng-if="c.isModalOpen" class="close-button" ng-click="c.close()" aria-label="${Close modal}"><i class="fa fa-close"></i></button>
  </div>
  <div ng-class="{'visibility-input-popover': c.isPopoverOpen,'visibility-input-modal b-b': c.isModalOpen}">
    <label for="visibility_input_{{c.data.widgetMappingId}}" class="visibility-label">${Visible to}</label>
    <select name="visibility_input" id="visibility_input_{{c.data.widgetMappingId}}" class="sn-select-basic visibility-select-dropdown" ng-model="c.currentVisibility">
      <option ng-repeat="item in c.data.visibilityOptions" value={{::item.value}}>{{::item.label}}</option>
    </select>
  </div>
  <div
    ng-class="{'button-group button-group-popover': c.isPopoverOpen,'button-group button-group-modal':c.isModalOpen}">
    <button class='btn btn-default cancel-button' ng-click="c.close()">${Cancel}</button>
    <button class='btn btn-primary save-button' ng-click="c.savePreference()">${Save}</button>
  </div>
</div>
