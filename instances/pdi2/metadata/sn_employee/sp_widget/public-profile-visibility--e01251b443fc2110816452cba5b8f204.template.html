<div id="profile_visibility_{{c.data.widgetMappingId}}" class="visibility-container" ng-if="data.accessibilityMsg">
  <i ng-class="c.lockIcon"></i>
  <div class="visibility-text">
    <span class="visibility-msg">{{::data.msg}}</span>
    <button ng-if="c.isMobileDevice" class="btn btn-link edit-visibility" ng-click="c.openModal()">
      {{c.data.accessibilityMsg.toLowerCase()}}<i class="fa fa-pencil" aria-label="${Edit}"></i>
    </button>
    <button ng-if="!c.isMobileDevice" class="btn btn-link edit-visibility"
      uib-popover-template="'{{c.VISIBILITY_TEMPLATE}}'" popover-trigger="outsideClick" popover-placement="bottom"
      popover-is-open="c.isPopoverOpen" ng-click="c.openPopover();" aria-label="${Edit}">
      {{c.data.accessibilityMsg.toLowerCase()}}<i class="fa fa-pencil"></i>
    </button>
  </div>
</div>
