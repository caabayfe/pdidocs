<uib-tabset ng-if="data.canRead && data.tabs.length > 0" id="std-uib-tabset" class="std-uib-tabset">
   <uib-tab class= "uib-vis-tab" ng-repeat="tab in data.tabs" index="$index" heading="{{tab.name}}" ng-click="$event.stopPropagation();onTabClick(tab)" title="{{tab.name}}" ng-keyup="c.keyUpOnTabs($event)" add-uib-tab-accessibility>
      <div ng-class="{'panel b wrapper': tab.type != 'activity' && tab.type != 'attachments'}">
         <div class="text-a-c" ng-if="!tab.widget">
            <i class="fa fa-spinner fa-pulse fa-2x fa-fw"></i>
            <span class="sr-only">${Loading}...</span>
         </div>
         <sp-widget ng-if= "tab.widget"  widget= "tab.widget" page="{table:data.table, sys_id:data.sys_id}"></sp-widget>
      </div>
   </uib-tab>
   <li ng-if="data.canRead" class="nav-item dropdown" id="moreDropdown" ng-class="{'hide-item': !c.showMore}" data-toggle="tooltip" title="{{c.more_title}}" data-original-title="{{c.more_title}}">
      <button id="more-btn" class="options-btn pull-left nav-link dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" ng-keyup="c.keyUpOnDropDown($event)" tabindex="-1">
      <span class="more-btn-flex">
      <span class="buttontext" id="more-btn-text">{{c.more_title}}</span>
      </span>
      <span class="arrow-icon glyphicon glyphicon-chevron-down"></span>
      </button>
      <div class="dropdown-menu pull-right" id="dropDownMenu" role="listbox">
         <uib-tab class="uib-more-tab" ng-repeat="tab in data.tabs" heading="{{tab.name}}" id="{{tab.name}}" ng-click="$event.stopPropagation();tabSelectedInMore(tab)" data-toggle="tooltip" title="{{tab.name}}">
         </uib-tab>
      </div>
   </li>
</uib-tabset>
