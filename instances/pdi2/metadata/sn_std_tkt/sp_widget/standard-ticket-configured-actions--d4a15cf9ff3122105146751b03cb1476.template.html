<div class="action-btn">
  <sp-widget widget="c.actionModal" ng-if="c.actionModal"></sp-widget>
    <div ng-if="c.data.action_buttons.length > 0" class="action-display">
      <button
        class="btn btn-default"
        ng-repeat="action in c.data.action_buttons track by action.id"
        ng-click="!action.disabled && c.triggerAction(action.id)"
        ng-disabled="action.disabled"
        title="{{action.tooltip || action.label}}" style="margin:2px;">
        {{action.label}}
      </button>
    </div>
  </div>
