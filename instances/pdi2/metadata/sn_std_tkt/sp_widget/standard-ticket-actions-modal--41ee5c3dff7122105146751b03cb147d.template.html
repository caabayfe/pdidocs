<div class="panel panel-default">
    <div class="padder-md actions-modal-header text-base">
        <h1 class="h3">
            {{data.action_button.label}}
        </h1>
        <i class="fa fa-close pull-right" autofocus="true" tabindex="0" ng-click="handleCancel()" data-toggle="tooltip" data-original-title="${Close modal}" aria-label="${Close modal}"></i>
    </div>

    <div class="wrapper-md clearfix b-t">
        <div ng-if="data.action_button.formModel" class="form-group">
            <sp-model form-model="::data.action_button.formModel" mandatory="[]"/>
        </div>
    </div>

    <div class="panel-footer clearfix">
        <div class="pull-right">
            <button name="cancel" class="btn btn-default" ng-click="handleCancel()" aria-label="${Cancel}">
                ${Cancel}
            </button>
            <button class="btn btn-primary" ng-disabled="!c.enableSubmit" name="execute" ng-click="handleSubmit()" aria-label="${Execute}">
                ${Execute}
            </button>
        </div>
    </div>
</div>
