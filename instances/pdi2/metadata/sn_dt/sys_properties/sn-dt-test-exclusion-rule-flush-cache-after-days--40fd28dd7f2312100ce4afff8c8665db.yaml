description: |-
  The "Test Exclusion Rule" record producer utilizes scoped cache to prevent unncessary REST calls to retrieve languages supported by third-party translation providers. Please set the number of days before the cache is wiped and new REST calls are made to retrieve lists of supported languages.

  Note: The Test Exclusion Rule cache will also be cleared any time the instance level cache is cleared.
ignore_cache: 'true'
