<?xml version="1.0" encoding="utf-8" ?>
    <j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <style>
    body {
    font-size: 14px;
    }
    h1 {
    font-size: 22px;
    }
    h2 {
    font-size: 18px;
    margin-top: 0px;
    margin-bottom: 20px;
    font-weight: 700;
    }
    h3 {
    font-size: 14px;
    }
    .spin-loader {
    width: calc(0.75rem + var(--now-icon--scale-size, 1) * 1.5rem / 2);
    height: calc(0.75rem + var(--now-icon--scale-size, 1) * 1.5rem / 2);
    fill: #4f52bd;
    transform: translateY(-50%);
    }
    .-spin {
    animation: 2s linear 0s infinite normal none running spin;
    }
    .container {
    background-color: #f2f4fa;
    width: 100%;
    padding: 20px;
    border-radius: 10px;
    }
    .kbu-table {
    border-collapse: collapse;
    border-spacing: 0;
    font-size: 14px;
    box-shadow: rgba(56, 56, 56, 0.25) 0px 0.125rem 0.25rem 0px;
    width: 100%;
    table-layout: fixed;
    word-break: break-all;
    }
    .kbu-table thead {
    border-top: solid 1px #f2f2f2;
    border-bottom: solid 1px #f2f2f2;
    border-collapse: collapse;
    background-color: #f2f2f2;
    }
    .kbu-table thead th {
    color: #000;
    padding: 10px;
    font-weight: 700;
    text-align: left;
    }
    .kbu-table th {
    width: 200rem;
    }
    .kbu-table tbody td {
    color: #333;
    padding: 10px;
    font-weight: 400;
    text-shadow: 1px 1px 1px #fff;
    text-overflow: ellipsis;
    }
    tr:nth-child(even) {
    background-color: #f2f2f2;
    }
    .column {
    float: left;
    width: 20rem;
    padding: 0 5px 5px 5px;
    }
    .row {
    margin: 0 -5px;
    width: 100%;
    }
    .row:after {
    display: flex;
    flex-wrap: wrap;
    content: "";
    display: table;
    clear: both;
    }
    .kbu-card {
    box-shadow: rgba(56, 56, 56, 0.25) 0px 0.125rem 0.25rem 0px;
    border-color: rgb(218, 221, 226);
    border-width: 1px;
    border-style: solid;
    border-radius: 5px;
    padding: 12px;
    background-color: white;
    font-size: 14px;
    text-align: center;
    min-width: fit-content;
    min-height: fit-content;
    white-space: pre-line;
    }
    .divider {
    width: 10px;
    height: auto;
    display: inline-block;
    padding: 5px;
    }
    .kbu-card-content {
    font-size: 14px;
    }
    .kbu-card-content-count {
    font-size: 20px;
    padding: 7px;
    }
    .message {
    display: none;
    }
    button{
    margin: 0 0 5px 0px;
    }
    </style>
    <div class="container">
    <div class="title">
        <h2 id="pageheading"></h2>
    </div>
    <div class="row" id="kb-list">
        <div class="column">
        <div class="kbu-card">
            <div class="kbu-card-content" id="topics-count">
            </div>

            <div class="kbu-card-content-count" id="topic-count"></div>
        </div>
        </div>

        <div class="column">
        <div class="kbu-card">
            <div class="kbu-card-content" id="kbs-count">
            
            </div>

            <div class="kbu-card-content-count" id="kb-count"></div>
        </div>
        </div>
    </div>
    &#160;
    <div class="message" id="none-message">
    </div>
    <div></div>
    <table class="kbu-table" id="un-kb-table">
        <thead></thead>
        <tbody></tbody>
    </table>
    <br />
    <div>
        <button
        class="btn btn-default"
        id="refreshButton"
        onclick="getTranslatedVersionsWithoutTopic()"
        >
        
        </button>
        <div class="divider" />
        <button
        class="btn btn-default"
        id="linkKBsButton"
        onclick="linkTranslatedVersionsWithoutTopic()"
        >
        
        </button>
    </div>
    </div>
</j:jelly>
