<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<div id="select_service_portal" style="display:block; padding: 5px 10px">
		<div id="portal_selector" style="padding-bottom:25px">
			<div>
				<label for="portal" class="control-label">${gs.getMessage('Which service portal do you want to use for your preview?')}</label>
			</div>
			<div class="col-lg-3 col-md-5 col-sm-6 col-xs-7 input-group">
				<select id="portalField" class="form-group no-bottom-margin" style="width:360px">
				</select>
			</div>
		</div><br />
		<div class="modal-footer">
			<span class="pull-right">
				<button class="btn btn-default" id="cancel_button" onclick="cancel(); return false" style="min-width: 5em;" type="submit">
					${gs.getMessage('Cancel')}
				</button>
				<button class="btn btn-primary" id="ok_button" onclick="ok()" style="min-width: 5em;" title="" type="submit">
					${gs.getMessage('Preview')}
				</button>
			</span>
		</div>
	</div>
</j:jelly>
