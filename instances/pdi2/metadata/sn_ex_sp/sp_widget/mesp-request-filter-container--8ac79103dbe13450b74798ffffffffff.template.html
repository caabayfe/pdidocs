<div class="mesp-search-container">
  <div class="mesp-search-input-wrapper">
    <span class="fa fa-search mesp-search-icon"></span>
    <input 
      type="text" 
      class="mesp-search-input" 
      ng-model="c.searchText" 
      ng-change="c.onSearchTextChange()"
      placeholder="${Search for keyword}"
      aria-label="${Search}" />
    <button 
      ng-if="c.searchText.length > 0" 
      class="mesp-search-clear-button" 
      ng-click="c.resetSearch()" 
      aria-label="${Clear search}">
      <span class="fa fa-times-circle mesp-clear-icon"></span>
    </button>
  </div>
</div>
