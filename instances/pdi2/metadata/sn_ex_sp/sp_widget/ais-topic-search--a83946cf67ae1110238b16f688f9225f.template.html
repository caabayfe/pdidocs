<form ng-submit="c.submitSearch()" aria-label={{::data.searchLandmark}} role="search" id="form-content-search">
    <div ng-class="{'input-group-typeahead-mobile' : data.isMobileApp}" class="input-group input-group-{{::c.data.size}} input-group-typeahead flex-mobile" role="presentation">
        <!-- uses ui.bootstrap.typeahead -->
      <div ng-class="{'aisearch-mobile-textContainer' : data.isMobileApp}">
        <input ng-if="!data.isMobileApp" name="ta-content-search" placeholder="{{::data.searchMsg}}" ng-model="c.searchTerm" autocomplete="off"
            typeahead-is-open="c.typeaheadOpen" typeahead-show-hint="false"
            uib-typeahead="state as state.name for state in c.getSearchSuggestions($viewValue)"
            typeahead-append-to-body="false" typeahead-loading="c.typeaheadLoading"
            typeahead-wait-ms="c.data.typeaheadWaitMS" typeahead-min-length="0" typeahead-focus-first="false"
            typeahead-on-select="c.onSelect($item, $model, $label)" typeahead-template-url="sn-ec-typeahead-item"
            typeahead-popup-template-url="sn-ec-typeahead-popup" class="form-control input-typeahead" role="combobox"
            aria-autocomplete="list" title="{{::data.title}}" data-toggle="tooltip" data-placement="top"
            aria-label="{{::data.searchMsg}}" aria-haspopup="false"
            ng-keydown="inputKeydown($event)">
        <span ng-if="!data.isMobileApp" class="sr-only" aria-busy="{{c.typeaheadLoading}}" aria-live="polite">{{suggestionAnnouncement}}</span>
        <input id="aisearch-mobile" enterkeyhint="search" type="search" ng-if="data.isMobileApp" class="flex-mobile form-control input-typeahead aisearch-mobile-textAlign" name="ta-content-search-mobile" placeholder="{{::data.searchMsgMobile}}" ng-model="c.searchTerm" autocomplete="off"
            role="combobox"
            aria-autocomplete="list" title="{{::data.title}}" data-toggle="tooltip" data-placement="top"
            aria-haspopup="false"
            ng-keydown="inputKeydown($event)">
        <i ng-if="data.isMobileApp" tab-index=-1 class="fa fa-search aisearch-mobile-searchIcon"></i>
      </div>
        <span ng-if="!data.isMobileApp" class="input-group-btn">
            <button name="ta-search" type="submit" class="btn btn-default align-icon" title="{{::data.searchMsgBtn}}"
                aria-label="{{::data.searchMsgBtn}}" data-toggle="{{!isTouchDevice() ? 'tooltip' : undefined}}"
                data-placement="bottom">
                <i class="fa fa-search"></i>
            </button>
        </span>
    </div>
</form>
