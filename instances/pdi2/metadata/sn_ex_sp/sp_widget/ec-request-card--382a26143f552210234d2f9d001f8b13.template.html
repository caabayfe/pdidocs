<div class="request-card-container"  tabindex="-1">
  <a class="request-card" ng-href="{{c.data.url}}" tabindex="-1" ng-class="{'draft-card': c.data.status=='Draft'}">
    <div class="request-card-header" tabindex="-1">
     <span class="label request-card-label" ng-class="getLabelBackground(c.data.status)" id="request-status-{{c.data.sysID}}" tabindex="-1">
          {{c.data.status}}</span>
      <sn-time-ago class="request-card-timestamp" timestamp="c.data.timestamp" tabindex="-1"></sn-time-ago>
    </div>
  	<div class="request-card-title"
          id = "request-card-title-{{c.data.sysID}}" tabindex="0"
          aria-labelledby="request-status-{{c.data.sysID}} request-title-{{c.data.sysID}} request-card-title-{{c.data.sysID}}"
          ng-keydown="c.navigateOnKeyEnter($event)"
          ec-multiline-ellipsis-tooltip
          ec-ellipsis-tooltip-title="{{c.data.title}}"
          ec-ellipsis-tooltip-data-toggle="tooltip"
          ec-ellipsis-tooltip-data-container="body">{{c.data.title}}</div>
    <div class="request-card-secondary">
    	<span class="request-card-secondary-field-item" 
              ng-repeat="field in c.data.secondaryData track by $index" 
              ng-if="field" 
              tabindex=-1>{{field}}</span>
    </div>
    
    <div class="request-card-action" ng-if="c.data.actionConfig">
      <button type="button" class="btn" ng-click="handleAction($event)">
        {{ c.data.actionConfig.label }}
      </button>
    </div>
  
    <span id="request-title-{{c.data.sysID}}" class="sr-only">${ Request , }</span>
  </a>
</div>
