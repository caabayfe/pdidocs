<uib-tabset id="std-uib-tabset{{data.tabName}}" ng-if="data.tabs && data.tabs.length > 0">
  <uib-tab class="secondary-info-tab" ng-repeat="tab in data.tabs" index="$index" heading="{{tab.name}}" ng-click="$event.stopPropagation();onTabClick(tab)" ng-keyup="c.keyUpOnTabs($event)" add-uib-tab-accessibility>
    <div>
      <sp-widget widget="tab.widget"></sp-widget>  
    </div>
  </uib-tab>
  <li class="nav-item dropdown" id="moreDropdown{{data.tabName}}" data-original-title="{{c.more_title}}">
    <button id="more-btn{{data.tabName}}" class="options-btn pull-left nav-link dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" ng-keyup="c.keyUpOnDropDown($event)" tabindex="-1">
      <span class="buttontext" id="more-btn-text{{data.tabName}}">{{c.more_title}}</span>
      <span class="arrow-icon glyphicon glyphicon-chevron-down"></span>
    </button>
    <div class="dropdown-menu pull-right" id="dropDownMenu{{data.tabName}}" role="listbox">
      <uib-tab class="secondary-info-more-tab" ng-repeat="tab in data.tabs" heading="{{tab.name}}" id="{{tab.name}}" ng-click="$event.stopPropagation();tabSelectedInMore(tab)">
      </uib-tab>
    </div>
  </li>
</uib-tabset>
