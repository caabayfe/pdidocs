<div class="tabs-container">
  <div class="tab-container" ng-init="c.init()">
    <div class="tabs" ng-ref="tabWrapper">
      <ul class="nav nav-tabs">
        <li ng-repeat="tab in c.tabs" ng-class="{active: tab === c.activeTab}" ng-attr-data-tab="{{tab.sys_id}}" class="nav-tab">
          <a href="" ng-click="c.selectTab(tab)" ec-multiline-ellipsis-tooltip
              ec-ellipsis-tooltip-title="{{tab.label}}"
              ec-ellipsis-tooltip-data-toggle="tooltip"
              ec-ellipsis-tooltip-data-container="body">{{ tab.label }}</a>
        </li>
        <li class="dropdown" ng-if="c.data.overflowTabs.length > 0">
          <a href="javascript:void(0)" class="dropdown-toggle" data-toggle="dropdown" ng-click="c.toggleDropdown()">More<span class="caret"></span></a>
          <ul class="dropdown-menu dropdown-open-left" >
            <li ng-repeat="tab in c.data.overflowTabs">
              <a href="" ng-click="c.selectFromDropdown(tab)"
              ec-multiline-ellipsis-tooltip
              ec-ellipsis-tooltip-title="{{tab.label}}"
              ec-ellipsis-tooltip-data-toggle="tooltip"
              ec-ellipsis-tooltip-data-container="body">{{ tab.label }}</a>
            </li>
          </ul>
        </li> 
      </ul>  
    </div>
  </div>
  
  <div class="tab-content">
    <div class="tab-filter-content" ng-if="!isTabSwitching">
        <sp-widget widget="c.data.requestFilters"></sp-widget>
    </div>
    <div>
      <div class="skeleton-loader-container" ng-if="isLoading">
        <div ng-include="'ec-card-skeleton-loader'"></div>
      </div>
      <div class="tab-request-content" ng-if="!isLoading">
        <sp-widget widget="c.data.requestContent"></sp-widget>
      </div>
    </div>
  </div>
</div>
