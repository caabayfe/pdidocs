<div class= "empty-state-container" ng-if="!data.hasContent">
  <i class="fa empty-icon" ng-class="data.emptyIcon"></i>
  <span class="empty-title">{{data.emptyTitle}}</span>
  <span class="empty-description">{{data.emptyDescription}}</span>
</div>

<div class="requests-container" ng-if="data.hasContent">  
  <div class="request-card-widget" id="reqCard-{{requests.data.sysID}}" ng-repeat="requests in requestCards track by $index">
    <sp-widget widget="requests"></sp-widget>
  </div>
</div>

<div>
  <div class="skeleton-loader-container" ng-if="isLoading">
    <div ng-include="'ec-card-skeleton-loader'"></div>
  </div>
</div>

<div class="button-container" ng-if = "c.data.showMore && !isLoading">
  <button class="btn btn-default" ng-click="c.getMoreRequests(false)" ng-keydown="loadMoreKeydown($event)">{{data.showMoreButtonText}}</button>
</div>
