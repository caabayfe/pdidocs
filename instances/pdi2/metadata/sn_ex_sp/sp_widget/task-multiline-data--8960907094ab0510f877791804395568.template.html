<div class="data-container">
  <!-- your widget template -->
  <div class="info-field-container" ng-repeat="($index1,record) in data.childData">
    <div class="info-field {{c.fieldClass}}" ng-repeat="($index2,data) in record" >
      <a ng-if="data.type === 'sys_user' && data.sysId" class="info-user-link" ng-href="?id=hri_user_profile&sys_id={{data.sysId}}" aria-labelledby="taskMultilineUserField_{{$index1}}_{{$index2}}">
        <sn-avatar primary="data.sysId" class="info-user-avatar" show-presence="true" enable-context-menu="false"></sn-avatar>
      </a>
      <div>
        <div id="taskMultilineFieldLabel_{{$index1}}_{{$index2}}" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{data.label}}" class="info-field-label">{{data.label}}</div>
        <div ng-if="!(data.fieldType == 'translated_html' || data.fieldType =='html')" aria-labelledby="taskMultilineFieldLabel_{{$index1}}_{{$index2}}">
          <div ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{data.value}}" ng-if="(data.fieldType !== 'url' || (data.fieldType === 'url' && data.value === '${(empty)}')) && (data.type !== 'sys_user' || !data.sysId)" class="info-field-value">{{data.value}}</div>
          <a ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{data.value}}" ng-if="(data.fieldType === 'url' && data.value !== '${(empty)}')" class="info-field-value" ng-href="{{data.value}}" target="_blank">{{data.value}}</a>
          <a id="taskMultilineUserField_{{$index1}}_{{$index2}}" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{data.value}}" ng-if="data.type === 'sys_user' && data.sysId" class="info-field-value" ng-href="?id=hri_user_profile&sys_id={{field.sysId}}">{{data.value}}</a>
        </div>
        <div ng-if="data.fieldType == 'translated_html' || data.fieldType =='html'" ng-init="popoverOpened=false" ng-mouseenter="popoverOpened=true" ng-mouseleave="popoverOpened=false" aria-labelledby="taskMultilineFieldLabel_{{$index1}}_{{$index2}}">
                <div uib-popover-html="data.htmlValue" 
            popover-trigger="none" popover-placement="top" popover-is-open="popoverOpened" popover-title="{{data.label}}" class="info-field-value" ng-bind-html="data.htmlValue"></div>
      </div>
        </div>
    </div>
  </div>
  <div class="empty-container" ng-if="!data.childData || data.childData.length === 0">
  <p>${We don’t have information to show here.}</p>
  </div>
</div>
