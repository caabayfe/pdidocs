<div class="inline favorite"
     ng-class="{'mobile': data.isMobile}"
     ng-if="data.show_favorite"
     id="favorite_button_container_{{::data.sys_id}}">
  <button class="btn btn-favorite favorite-button" 
          ng-click="c.toggleFav($event)"
          ng-keydown="c.handleFavoriteKeydown($event)"
          data-favorite-id="favorite_button_{{::data.sys_id}}"
          aria-label="{{data.isFavorite ? data.unFavoriteLabel : data.favoriteLabel}}"
          data-toggle="tooltip"
          data-container="body"
          data-placement="bottom"
          data-original-title="{{data.isFavorite ? data.unFavoriteTitle : data.favoriteTitle}}">
    <i class="fa icon favorite-{{::data.color}}" 
       ng-class="data.isFavorite? data.checkIcon : data.unCheckIcon"></i>
  </button>
  <div class="sr-only" aria-live="polite" id="favorite_sr_{{::data.sys_id}}"></div>
</div>
