
<div class="alert alert-dismissible banner-content" ng-if="data.isNodeUnderHeavyLoad && data.showBanner" ng-class="c.bannerClass">
  <button ng-if="c.data.showCloseIcon" aria-label="${Close Messages}" id="close-messages-btn" class="close" ng-click="c.dismissBanner()"><span class="fa fa-times fa-sm close-icon" aria-hidden="true"></span></button>
  <div>
    <i ng-class="c.bannerIconClass"></i>
    <span id="banner-message">{{c.data.bannerText}}</span>
  </div>
</div>
