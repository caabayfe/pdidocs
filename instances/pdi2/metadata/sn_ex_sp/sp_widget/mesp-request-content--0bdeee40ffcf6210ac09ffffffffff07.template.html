<div>
    <div class="empty-state-container" ng-if="!c.data.hasContent">
        <img ng-src="{{c.data.mespEmptyStateImage}}" alt="{{c.data.emptyStateTitle}}" class="empty-state-image" />
        <span class="empty-title">{{c.data.emptyStateTitle}}</span>
      	<button class="btn-clear" ng-if="data.hasActiveFilters" ng-click="c.clearActiveFilters()" >
          {{c.data.clearButtonText}}
        </button>
    </div>


    <div class="skeleton-loader-container" ng-if="isLoading">
        <sp-widget widget="data.mespRequestSkeletonLoader"> </sp-widget>
    </div>


    <div class="request-card-container" ng-if="!isLoading && data.hasContent">
      <div class="request-card-widget" id="reqCard-{{requests.data.sysID}}" ng-click="c.openRequestDetail(requests)" ng-repeat="requests in requestCards track by $index">
        <sp-widget widget="requests"> </sp-widget>
      </div>
      <!--  Div to detect scroll -->
      <div id="scroll-trigger" class="scroll-trigger-container"></div>
    </div>
  
      <div class="skeleton-loader-container" ng-if="isLoading">
        <sp-widget widget="data.mespRequestSkeletonLoader"> </sp-widget>
    </div>
    
</div>
