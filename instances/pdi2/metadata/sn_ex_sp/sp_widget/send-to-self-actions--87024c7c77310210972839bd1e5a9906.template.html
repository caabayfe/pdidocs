<div class="panel panel-default" ng-if=data.sendChannel> 
  <div class="button-container">      
    <div class="dropdown" ng-if="c.enableSendEmail && c.enableSendSMS">
      <button id="dropDownButton" class="btn btn-default dropdown-toggle" type="button" data-toggle="dropdown" aria-label="${Send to myself}" aria-controls="menu">
        ${Send to myself}
        <i class="fa fa-caret-down" aria-hidden="true"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-right" role="menu" aria-labelledby="dropDownButton">
        <li role="presentation"><a ng-click="c.onClick('email')" href="javascript:void(0)" role="menuitem">${Send as Email}</a></li>
        <li role="presentation"><a ng-click="c.onClick('sms')" href="javascript:void(0)" role="menuitem" >${Send as SMS}</a></li>
      </ul>
    </div>
    <button class="btn btn-default send-to-self-button" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{c.buttonsConfig.email.title}}" ec-ellipsis-tooltip-data-toggle="tooltip" ec-ellipsis-tooltip-data-container="body" ng-click="c.onClick('email')" ng-if="c.enableSendEmail && !c.enableSendSMS">{{c.buttonsConfig.email.title}}</button>
    <button class="btn btn-default send-to-self-button" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{c.buttonsConfig.sms.title}}" ec-ellipsis-tooltip-data-toggle="tooltip" ec-ellipsis-tooltip-data-container="body" ng-click="c.onClick('sms')" ng-if="!c.enableSendEmail && c.enableSendSMS">{{c.buttonsConfig.sms.title}}</button>
  </div>
  <div>
    ${Send this article to yourself to read later}
  </div>
</div>
