<a class="content-card" ng-click="c.redirect($event)" tabindex="-1" aria-label="{{::c.primaryField}}, {{::c.type}}" ng-href="{{::c.url}}" ng-attr-target="{{::c.target}}">
    <div class="content-card-body">
        <div class="flexbox header-container">
            <div id="card_badge_{{::c.sysId}}" class="card-badge">
                <i class="{{c.iconClass}} fa card-icon" aria-hidden="true"></i>
                <span class="type-padding">{{::c.type}}</span>
            </div>
            
        </div>
        <div>
            <div ng-if="c.view === 'card'" class="card-text-container">
                <div id="primary_field_{{::c.sysId}}" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{::c.primaryField}}"
                    class="item-title text-ellipsis text-ellipsis-two-line">
                    <span>{{::c.primaryField}}</span>
                </div>
                <div class="card-image-container" ng-class="{image: c.image}">
                    <img id="fav_image_{{::c.sysId}}" ng-if="c.image" class="item-image" aria-hidden="true" ng-src="{{c.image}}" />
                    <div id="secondary_field_{{::c.sysId}}" class="item-description text-ellipsis text-ellipsis-four-line">
                        <span>{{::c.secondaryField}}</span>
                    </div>
                </div>
            </div>
            <div ng-if = "c.view === 'list'" class="card-image-container"  ng-class="{image: c.image}">
                <img id="lis_fav_image_{{::c.sysId}}" ng-if="c.image" class="item-image" aria-hidden="true" ng-src="{{c.image}}" />
                <div class="card-text-container">
                    <div id="list_primary_field_{{::c.sysId}}" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{::c.primaryField}}" class="item-title text-ellipsis text-ellipsis-one-line">
                      <span>{{::c.primaryField}}</span>
                    </div>
                    <div id="list_secondary_field_{{::c.sysId}}" class="item-description text-ellipsis text-ellipsis-two-line">
                        <span>{{::c.secondaryField}}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</a>
<div class="auto-margin-left">
    <sp-widget widget="data.favoriteWidget"></sp-widget>
</div>
