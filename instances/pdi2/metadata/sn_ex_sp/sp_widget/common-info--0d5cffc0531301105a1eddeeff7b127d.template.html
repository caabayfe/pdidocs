<div class="common-info" ng-if="data.commonLinkField">
  <div class="common-info-left-container">
    <div ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{data.commonLinkField.label}}" class="common-info-left-label">{{data.commonLinkField.label}}</div>
    <div class="common-info-left-value">
      <a class="common-info-left-text" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{data.commonLinkField.value}}" ng-if="(data.url && !(data.commonLinkField.fieldType == 'translated_html' || data.commonLinkField.fieldType =='html'))" id="{{data.taskSysId}}_todo_link" href="{{data.url}}"> {{data.commonLinkField.value}}
      <i class="fa fa-external-link" title="${External link}" tabindex="-1" ng-if="(data.url && data.external)" href="{{data.url}}" target="_blank"/> </a>
      <div ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{data.commonLinkField.value}}" ng-if="(!data.url && !(data.commonLinkField.fieldType == 'translated_html' || data.commonLinkField.fieldType =='html'))">{{data.commonLinkField.value}}</div>
      <a ng-if="(data.url && (data.commonLinkField.fieldType == 'translated_html' || data.commonLinkField.fieldType =='html'))" id="{{data.taskSysId}}_todo_link" href="{{data.url}}" ng-init="popoverOpened=false" ng-mouseenter="popoverOpened=true" ng-mouseleave="popoverOpened=false">
        <div uib-popover-html="data.commonLinkField.htmlValue" popover-trigger="none" popover-placement="bottom" popover-is-open="popoverOpened" popover-title="{{data.commonLinkField.label}}" class="info-field-value" ng-bind-html="data.commonLinkField.htmlValue"></div>
        <i class="fa fa-external-link" title="${External link}" tabindex="-1" ng-if="(data.url && data.external)" href="{{data.url}}" target="_blank"/>
      </a>
      <div ng-if="(!data.url && (data.commonLinkField.fieldType == 'translated_html' || data.commonLinkField.fieldType =='html'))" ng-init="popoverOpened=false" ng-mouseenter="popoverOpened=true" ng-mouseleave="popoverOpened=false">
        <div uib-popover-html="data.commonLinkField.htmlValue" popover-trigger="none" popover-placement="bottom" popover-is-open="popoverOpened" popover-title="{{data.commonLinkField.label}}" class="info-field-value" ng-bind-html="data.commonLinkField.htmlValue"></div>
      </div>
    </div>
  </div>
  <div ng-if="data.commonStaticFields" class="common-info-right-container">
    <div class="right-container">
      <div class="common-info-field" ng-repeat="field in data.commonStaticFields">
        <div ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{field.label}}" class="common-info-right-label">{{field.label}}</div>
        <a ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{field.value}}" ng-if="field.fieldType == 'url'" class="common-info-right-value common-info-right-url-link" href="{{field.value}}" target="_blank">{{field.value}}</a>
        <div ng-if="(field.fieldType != 'url') && !(field.fieldType == 'translated_html' || field.fieldType =='html')" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{field.value}}" class="common-info-right-value">{{field.value}}</div>
        <div ng-if="field.fieldType == 'translated_html' || field.fieldType =='html'" class="common-info-right-value" ng-init="popoverOpened=false" ng-mouseenter="popoverOpened=true" ng-mouseleave="popoverOpened=false">
          <div uib-popover-html="field.htmlValue" popover-trigger="none" popover-placement="bottom" popover-is-open="popoverOpened" popover-title="{{field.label}}" class="info-field-value" ng-bind-html="field.htmlValue"></div>
        </div>
      </div>
    </div> 
  </div>
</div>
