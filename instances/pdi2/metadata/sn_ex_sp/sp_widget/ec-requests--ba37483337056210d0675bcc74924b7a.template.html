<div class = "request-container panel panel-default b panel-wrapper">
  <div class = "panel-heading">
    <h3 class="panel-title" id="widget-title">{{data.requestHeader}}</h3>
  </div>
  <div class = "request-content-container">
    <div class="skeleton-loader-container" ng-if="c.isLoading">
      <div ng-include="'header-skeleton-loader'"></div>
    </div>
    <div ng-class="{'content-loading': c.isLoading}">
      <sp-widget widget="c.data.widget"></sp-widget>
    </div>
  </div>
</div>
