<div ng-class="data.isMobileApp ? 'link-container-mobile': 'link-container'" 
     ng-if="data.json_data && data.json_data.length > 0 && (!data.isMobileApp || hasNonGuidedQuickLinks())">
  <div ng-bind-html="widgetTitleHtml"></div>
  <div class="all-link-container">
    <!-- DESKTOP VIEW -->
    <a class="quick-link" 
       ng-style="item.type == 'guided_help' && {'cursor': 'pointer'}" 
       ng-if="!data.isMobileApp" 
       ng-repeat="item in data.json_data" 
       ng-href="{{item.url}}" 
       ng-click="clicked(item, $event)"
       data-toggle="tooltip" 
       data-container="body"
       aria-labelledby="{{data.instanceId}}-item-{{$index}}"
       id="{{data.instanceId}}-item-{{$index}}"
       title="{{item.title}}"
       ng-attr-target="{{item.target}}">
      <div class="content">
        <div class="content-container"> 
          <span class="card-title"> {{item.title}}</span>
          <div class="icon-container" ng-if="(item.target == '_blank')"> 
            <i class="fa fa-external-link"></i>
          </div>
        </div>
      </div>
      <span class="sr-only"
            id="{{data.instanceId}}-ext-link-{{$index}}"
            ng-if="(item.target == '_blank')">${, opens in a new window}
      </span>
    </a>

    <!-- MESP VIEW -->
    <a class="quick-link" 
       ng-if="data.isMobileApp && item.type != 'guided_help'"
       ng-repeat="item in data.json_data" 
       ng-href="{{item.url}}{{item.target == '_blank' ? '' : '&view=mobile'}}"
       data-toggle="tooltip" 
       data-container="body"
       aria-labelledby="{{data.instanceId}}-item-{{$index}}"
       id="{{data.instanceId}}-item-{{$index}}"
       title="{{item.title}}"
       ng-attr-target="{{item.target}}">
      <div class = "content">
        <div class="content-container container-mobile">
          <span class = "view-mobile card-title"> {{item.title}} </span> 
          <div class="icon-container" ng-if="(item.target == '_blank')"> 
            <i class="fa fa-external-link"></i>
          </div>
        </div>
      </div>
      <div class = "line"></div>
      <span class="sr-only"
            id="{{data.instanceId}}-ext-link-{{$index}}"
            ng-if="(item.target == '_blank')">${, opens in a new window}
      </span>
    </a>
  </div>
</div>
