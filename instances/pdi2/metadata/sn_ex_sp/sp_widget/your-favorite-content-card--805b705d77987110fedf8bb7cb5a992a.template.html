<div class="list-item-container flexbox" ng-if="c.listType == 'simple_list'" >
  <a id="favorite_card_{{c.sysId}}" tabindex="-1" ng-click="c.redirect($event)" ng-href="{{::c.url}}" ng-attr-target="{{::c.target}}" class="list-item" class="list-item">
    <div class="list-item-badge">
      <div class="{{c.iconClass}} fa item-icon" aria-hidden="true"></div>
      <div aria-label="{{c.primaryField}}, {{c.type}}, {{c.favoriteTitle}}" role="link" ng-click="c.redirect($event)" tabindex="0" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{::c.primaryField}}" class="list-item-title text-ellipsis text-ellipsis-two-line">{{c.primaryField}}</div>
    </div>
  </a>
  <div class="favorite-icon-list">
    <sp-widget widget="data.favoriteWidget"></sp-widget>
  </div>
</div>

<div class="card-item-container flexbox" ng-if="c.listType == 'card_list'">
  <a class="card-item" ng-click="c.redirect($event)"  aria-label="{{c.primaryField}}, {{c.type}}, {{c.favoriteTitle}}" ng-href="{{::c.url}}" ng-attr-target="{{::c.target}}">
    <div class="card-header">
      <div class="{{c.iconClass}} fa item-icon" aria-hidden="true"></div>
      <span class="card-header-text">{{::c.type}}</span>
    </div>
    <div ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{::c.primaryField}}" class="card-body item-title text-ellipsis text-ellipsis-two-line">
      <span ng-bind-html="c.primaryField"></span>
    </div>
  </a>
  <div class="favorite-icon-card">
    <sp-widget widget="data.favoriteWidget"></sp-widget>
  </div>
</div>
