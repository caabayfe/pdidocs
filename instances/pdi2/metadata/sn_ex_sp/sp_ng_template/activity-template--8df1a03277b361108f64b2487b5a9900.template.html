<a class="activity-container" ng-href="{{activity.itemUrl}}" target="{{activity.target}}" aria-label="{{activity.itemCount}} {{activity.itemName}}" ng-keydown="c.keyboardAction($event)">
  <div class="activity-title-container">
    <span class="activity-icon" ng-class="activity.icon == 'empty' ? 'empty-icon' : 'has-icon'" ng-if="data.showIcons == 'true'" aria-hidden="true">
      <i class="fa fa-{{activity.icon}}"></i>
    </span>
    <span class="activity-title text-ellipsis text-ellipsis-one-line" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="{{activity.itemName}}">{{activity.itemName}}</span>
  </div>
  <div class="activity-count-container">
    <span class="activity-count">{{activity.itemCount}}</span>
    <span aria-hidden="true">
      <i class="right-arrow fa fa-angle-right flip-icon-rtl"></i>
    </span>
  </div>
</a>
