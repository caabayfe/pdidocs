<style>
  .remove-image-container {
    margin: 16px;
  }
  
  .remove-image-text {
    margin-top: 24px;
  }
  
  .remove-image-actions {
    margin-top: 24px;
    margin-bottom: 16px; 
    display: flex; 
    justify-content: flex-end;
  }
  
  .remove-image-actions .btn-danger {
    margin-left: 8px;
  }
  
.ec-remove-modal-header {
  display: flex;
  align-items: center;
}

.ec-remove-modal-title {
  margin: 0;
  display: flex;
  flex-grow: 1;
  font-style: normal;
  font-weight: 600;
}

.ec-remove-modal-close-btn {
  border: 0;
  padding: 0;
  cursor: pointer;
  background: transparent;
  font-style: normal;
  font-weight: 600;
}
  
  #internal .modal-dialog {
    width: fit-content;
    margin: auto;
    padding: 96px 24px 24px 24px;
  }
  
  @media screen and (max-width: 360px) {
    .remove-image-actions {
      flex-direction: column;
    }
    
    .remove-image-actions .btn-danger{
      margin-left: 0;
      margin-top: 12px;
    }
  }

 
</style>
<div class="remove-image-container">
  <div class = "ec-remove-modal-header">
    <h4 class = "ec-remove-modal-title">${Confirm}</h4>
    <button type="button" 
            class="ec-remove-modal-close-btn fa fa-close" 
            ng-click="dismissModal()"
            aria-label="Close modal"
            data-toggle="tooltip"
            title="${Close}"
            autofocus />
  </div>
  <div class="remove-image-text">
    {{c.data.removeMessage}}
    <div class="remove-image-actions">
      <button type="button" class="btn btn-default" ng-click="dismissModal()">${No, keep it}</button>
      <button type="button" class="btn btn-danger" ng-click="deleteBanner()">${Yes, remove image}</button>
    </div>
  </div>
</div>
