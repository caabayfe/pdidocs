<a class="ta-item" ng-href="{{match.model.target != '_blank' ? match.model.url : ''}}" target="{{match.model.target}}">
    <div ng-if="!match.model.templateID" ec-multiline-ellipsis-tooltip>
        <div class="menu-text" tabindex="-1" invoke-multi-level-parent-func invoke-events="keydown"
            invoke-event-handlers="listItemAccessibility" invoke-with-model="index">
            <i class="ta-icon fa fa-{{match.model.glyph}}" ng-if="match.model.glyph"></i>
            <span ng-bind-html="match.label | uibTypeaheadHighlight:query" ec-multiline-ellipsis-tooltip
                ec-ellipsis-tooltip-title="{{match.label}}" data-original-title="match.label">
            </span>
        </div>
        <i ng-if="match.model.showClear" class="fa fa-times-circle-o" aria-hidden="true" invoke-multi-level-parent-func
            invoke-events="click, keydown" invoke-event-handlers="clearSuggestions, clearIconAccessibility"
            invoke-with-model="match" data-toggle="tooltip" title="${clear recent search:} {{match.label}}"
            data-placement="top" data-container="body" tabindex="-1"></i>
    </div>
    <div ng-if="match.model.templateID" ng-include="match.model.templateID"></div>
</a>
