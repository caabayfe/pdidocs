<div class="typeahead-popup dropdown-menu"
    aria-label="{{::$parent.c.options.title}} {{::$parent.c.data.searchSuggestionsMsg}}"
    ng-show="isOpen() && !moveInProgress" ng-style="{top: position().top+4+'px', left: position().left+'px'}"
    role="listbox" aria-hidden="{{!isOpen()}}">
    <ul role="group" ng-repeat="(key, value) in $parent.c.data.modified">
        <span ng-if="query==='' && key==='USER_HISTORY'" class="dropdown-header">${Recent searches}</span>
        <li role='option' aria-hidden='true' style='display: none'></li>
        <li ng-repeat="match in matches | filter: {model : {type : key}}"
            ng-init="index = match.model.item_index"
            ng-class="{active: isActive(index) }"
            ng-click="selectMatch(index, $event)" role="option"
            class="content-search-option"
            id="{{::match.id}}" data-index="{{index}}"
            aria-selected="{{isActive(index)}}">
            <div uib-typeahead-match index="index" match="match" query="query" template-url="templateUrl"></div>
        </li>
    </ul>
</div>
