<div tabindex=-1 ng-class="c.data.card_behaviour=='single' ? 'cards-flex-container fix-action-overflow' : 'cards-grid-container'">
  <div class="activity-card-holder" ng-class="{'activity-card-holder-carousel' : (c.data.card_behaviour=='single')}" ng-repeat="item in c.listViewData track by $index">
    <a ng-class="{'activity-card-carousel' : c.data.card_behaviour=='single',
                  'card-with-action' : (item.isActionWidgetVisible || (!item.isActionWidgetVisible && c.data.showViewDetails == 'true')) && c.data.card_behaviour=='wrap',
                  'card-with-action-carousel' : (item.isActionWidgetVisible || (!item.isActionWidgetVisible && c.data.showViewDetails == 'true')) && c.data.card_behaviour=='single'}" 
       aria-hidden="{{c.setCardAriaHidden($index)}}" class="activity-card" ng-href="{{item.itemUrl}}" target="{{item.target}}"
       tabindex="{{c.setCardTabIndex($index)}}">
      <div class="item-description"><span ng-if="item.badge" class="item-badge"
                                          ng-attr-style="background-color:{{item.badgeColor || ''}};color:{{item.badgeTextColor || ''}}">{{::item.badge}}</span>
      </div>
      <div class="card-image">
        <img ng-if="item.image" class="image-item" aria-hidden="true"
             ng-src="{{item.image}}" />
        <div ng-class="item.image ? 'card-text-container' : ''">
          <div ng-if="item.title" class="item-title text-ellipsis-two-line text-ellipsis">
            <p id="item_title_{{$index}}" ec-multiline-ellipsis-tooltip
               ec-ellipsis-tooltip-title="{{::item.title}}">{{::item.title}}</p>
          </div>
          <div ng-if="item.description"
               class="item-description text-ellipsis-two-line text-ellipsis">
            <p ec-multiline-ellipsis-tooltip
               ec-ellipsis-tooltip-title="{{::item.description}}">
              {{::item.description}}
            </p>
          </div>
        </div>
      </div>
      <div class="field-name">
        <div ng-if="item.field1Value"
             class="item-field text-ellipsis-two-line text-ellipsis flex-grow"
             ng-class="item.field2Value ? 'fix-width' : 'full-fix-width'">
          <p ec-multiline-ellipsis-tooltip
             ec-ellipsis-tooltip-title="{{::item.field1Label}}">{{::item.field1Label}}
          </p>
        </div>
        <div ng-if="item.field2Value"
             class="item-field text-ellipsis-two-line text-ellipsis flex-grow"
             ng-class="item.field1Value ? 'fix-width' : 'full-fix-width'">
          <p ec-multiline-ellipsis-tooltip
             ec-ellipsis-tooltip-title="{{::item.field2Label}}">{{::item.field2Label}}
          </p>
        </div>
      </div>
      <div class="field-value">
        <div ng-if="item.field1Value" class="item-value field-container text-ellipsis"
             ng-class="item.field2Value ? 'fix-width' : 'full-fix-width'">
          <p ec-multiline-ellipsis-tooltip
             ec-ellipsis-tooltip-title="{{::item.field1Value}}">{{::item.field1Value}}
          </p>
        </div>
        <div ng-if="item.field2Value" class="item-value field-container text-ellipsis"
             ng-class="item.field1Value ? 'fix-width' : 'full-fix-width'">
          <p ec-multiline-ellipsis-tooltip
             ec-ellipsis-tooltip-title="{{::item.field2Value}}">{{::item.field2Value}}
          </p>
        </div>
      </div>
    </a>
    <div ng-if="item.isActionWidgetVisible" ng-class="{'my-item-actions' : (c.data.card_behaviour=='wrap'),'my-item-actions-carousel' : (c.data.card_behaviour=='single')}">
      <sp-widget widget="item.actionsWidget"></sp-widget>
    </div>
    <div ng-if="!item.isActionWidgetVisible && c.data.showViewDetails == 'true'" ng-class="{'view-details-container' : (c.data.card_behaviour=='wrap'),'view-details-container-carousel' : (c.data.card_behaviour=='single')}">
      <button id="view_details_btn_{{$index}}" tabindex="0" ng-class="{'btn-sm' : c.data.card_behaviour == 'single'}" class="btn btn-default view-details" ng-click="c.redirect($event, item.itemUrl, item.target)" aria-labelledby="item_title_{{$index}} view_details_btn_{{$index}}" ec-multiline-ellipsis-tooltip ec-ellipsis-tooltip-title="${View details}">
        ${View details}
      </button>
    </div>
  </div>
</div>
