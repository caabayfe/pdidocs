<div class="ec-mobile-filter-container" ng-if="data.showFilterContainer">
  <div class="ec-mobile-filter-btn-container">
    <button id="ec-mobile-filter-btn" class="btn btn-default btn-md btn-block dropdown-toggle" data-toggle="modal" data-target="#ec-mobile-filter-modal">
      <i class="fa fa-solid fa-filter"></i> ${Filters} {{c.filterPills.length > 0 ? '(' + c.filterPills.length + ')' : ''}}
    </button>
  </div>
  <div class="modal modal-lg" id="ec-mobile-filter-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog">
      <div class="modal-content" title="${Filters}" ng-keydown="c.handleAccessibilityInFlyout($event)">
        <div class="modal-header">
          <div class="display-flex space-between">
            <h4 class="modal-title" id="mobileFilterModal" aria-label="${Filters}">${Filters}</h4>
            <button id="ec-flyout-close-btn" class="close" data-dismiss="modal" aria-label="${Close}">
              <i aria-hidden="true" class="fa fa-times"></i>
            </button>
          </div>
        </div>
        <div class="modal-body">
          <div class="filter-container" id="accordion">
              <div ng-repeat="fc in c.filtersData" ng-if="fc.filters.length">
               	<div class="category-style">
                  <div aria-label="{{fc.title}}" aria-expanded="true" role="button" aria-controls="{{fc.categoryId}}" tabindex="0" class="accordion-toggle panel-anchor-color" data-toggle="collapse" data-target="#{{fc.categoryId}}">
                    {{fc.title}}<span ng-show="fc.selectedFilters.length > 0">({{fc.selectedFilters.length}})</span>
                  </div>
                 </div>
                <div class="collapse in" id="{{fc.categoryId}}">
                  <div ng-repeat="filter in fc.filters" class="{{filter.groupAllFilters === '1' && !$last ? 'mg-bt-sm' : 'mg-bt-lg'}}">
                    <div class="filter-style"> 
                      <button class="intermediate-select-style" aria-checked="mixed" aria-label="{{c.getFilterAriaLabel(filter)}}" ng-show="c.areSomeSubfilterSelected(filter)" ng-click="c.onFilterValueChange(fc, filter, undefined, true)">
                        <i class="fa fa-minus-square"></i>
                      </button>
                      <input ng-change="c.onFilterValueChange(fc, filter, undefined, true)" ng-show="!c.areSomeSubfilterSelected(filter)" ng-model="filter.selected" type="checkbox" name="{{filter.filterId}}" id="{{fc.categoryId + '-' +filter.filterId}}"
                             aria-label="{{c.getFilterAriaLabel(filter)}}"/>
                      <label for="{{fc.categoryId + '-' +filter.filterId}}" ng-class="{'filter-group-label-style' : filter.isGroup}">{{filter.filterName}}</label>
                    </div>
                    <div class="subfilter-wrapper" ng-if="filter.subFilters">
                      <div ng-repeat="subfilter in filter.subFilters" class="subfilter-style">
                        <input ng-change="c.onFilterValueChange(fc, filter, subfilter, true)" ng-model="subfilter.selected" type="checkbox" name="{{subfilter.filterId}}" id="mb-{{fc.categoryId + '-' +filter.filterId + '-' + subfilter.filterId}}"
                               aria-label="${Filter} {{subfilter.filterName}}"/>
                        <label for="mb-{{fc.categoryId + '-' +filter.filterId + '-' + subfilter.filterId}}">{{subfilter.filterName}}</label>
                      </div> 
                    </div>
                  </div>
                </div>
                <div ng-hide="$last">
                  <hr class="mg-tp-emty mg-bt-emty {{$index}}"/>
                </div>
              </div>
            </div>
        </div>
        <div class="modal-footer filter-footer-container">
          <div class="display-flex space-between">
            <div class="display-flex">
              <button class="btn btn-link clear-filter-button" onclick="clearAllFiltersMobile()" ng-disabled="!c.enableClearBtn" aria-label="${Clear}">${clear}</button>
            </div>
            <div class="display-flex modal-footer-style">
              <button id="ec-flyout-cancel-btn" class="btn btn-default" data-dismiss="modal" aria-label="${Cancel}">${Cancel}</button>  
              <button id="ec-flyout-apply-btn" class="btn btn-primary" data-dismiss="modal" ng-disabled="!c.enableApplyBtn" onclick="applyFilterMobile()" aria-label="${Apply}">${Apply}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
