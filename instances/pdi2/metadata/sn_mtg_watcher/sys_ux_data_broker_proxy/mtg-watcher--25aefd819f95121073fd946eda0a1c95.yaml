api_name: sn_mtg_watcher.Meeting Watcher
batch_exclude: 'false'
description: |-
  Watches for the status of specific Meeting records. For example, whenever a Meeting is started, the Meeting watcher is fired, and the information about the meeting is returned.
  To set up you will need a meeting sys_id. After adding the meeting watcher, an Asynchronous Message Bus (AMB) channel will be created and subscribed by the data resource to watch for meeting status updates. You can add events to handle status updates from the Meeting watcher.
