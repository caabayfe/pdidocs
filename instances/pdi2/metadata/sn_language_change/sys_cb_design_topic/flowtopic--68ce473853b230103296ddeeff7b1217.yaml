ontrolData) {\n    /* Build a message for the custom control that will be recorded in the transcript\n\n        return ''The CustomControl myCustomInputControl just rendered, with controlData: ''\n            + JSON.stringify(controlData);\n   */\n\n  return ''The Language Switch Custom Control was rendered with: ''\n  + ''Prompt: ''\n  + controlData.label + '' ''\n  + controlData.translatedLabel + '' ''\n  + ''Buttons: ''\n  + controlData.defaultYes + ''|'' + controlData.translatedYes + '' ''\n  + controlData.defaultNo + ''|'' + controlData.translatedNo;\n}\n","inputResponseHandlerFunction":"function(controlData, responseValue) {\n    /* Provide an input response handler function for the custom control\n\n        vaVars.script_var_1 = vaVars.script_var_1\n            + '', and I want to ''\n            + responseValue.action;\n   */\n\n  vaVars.answer = responseValue.yesOrNo;\n}\n","inputResponseMessageTranscriptFunction":"function(controlData, responseValue) {\n    /* Build a message for the custom input control that will be recorded in the transcript\n\n        return ''The CustomControl myCustomInputControl just responded with response: ''\n            + JSON.stringify(responseValue)\n            + '', and with controlData: ''\n            + JSON.stringify(controlData);\n    */\n\n    return ''The Language Switch Custom Control was responded to with the response: '' \n    + responseValue.yesOrNo;\n}\n","skippable":{"type":"Applicability","mode":"script","value":"false"},"unsupportedDeviceMessage":{"type":"String","mode":"script","value":"(function execute() {\n    return ''Sorry the language switch control is not supported on this channel.'';\n})()\n"},"id":"0823be3670ad44e29455d279de4d96be","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"TerminateGoal","goal_id":"primary","confirmation_msg":{"type":"String","mode":"string","value":""},"id":"4c74e2c383b34e46bf05a90f6d681012","name":"End","