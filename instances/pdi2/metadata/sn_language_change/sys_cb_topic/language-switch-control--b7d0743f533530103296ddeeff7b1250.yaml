            "id": "0823be3670ad44e29455d279de4d96be",
            "stepType": "CustomInput",
            "name": "LANGUAGE_SWITCH_CONTROL",
            "generateDataFunction": "function() {\n    var language = 'English';\n    var languageGR = new GlideRecord('sys_language');\n    if (languageGR.isValid()) {\n      languageGR.addQuery('id', vaVars.global_runtime_detected_language);\n      languageGR.query();\n    \n      if(languageGR.next()) {\n        language = languageGR.getValue('name');\n      }\n    }\n\n    var detectedLanguageCode = vaVars.global_runtime_detected_language;\n    var requesterLanguage = gs.getMessageLang(language, vaContext.getRequesterLang());\n    var translatedLanguage = gs.getMessageLang(language, detectedLanguageCode);\n\n    return {\t\n        \"label\": gs.getMessageLang('I have detected you are typing in {0}. Would you like to continue the conversation in {0}?', vaContext.getRequesterLang(), requesterLanguage),\n        \"translatedLabel\": gs.getMessageLang('I have detected you are typing in {0}. Would you like to continue the conversation in {0}?', detectedLanguageCode, translatedLanguage),\n        \"languageCode\": detectedLanguageCode,\n        \"defaultYes\": gs.getMessageLang('Yes', vaContext.getRequesterLang()),\n        'defaultNo' : gs.getMessageLang('No', vaContext.getRequesterLang()),\n        \"translatedYes\": gs.getMessageLang('Yes', detectedLanguageCode),\n        \"translatedNo\": gs.getMessageLang('No', detectedLanguageCode)\n    };\n}\n",
            "messageTranscriptFunction": "function(controlData) {\n    /* Build a message for the custom control that will be recorded in the transcript\n\n        return 'The CustomControl myCustomInputControl just rendered, with controlData: '\n            + JSON.stringify(controlData);\n   */\n\n  return 'The Language Switch Custom Control was rendered with: '\n  + 'Prompt: '\n  + controlData.label + ' '\n  + controlData.translatedLabel + ' '\n  + 'Buttons: '\n  + controlData.defaultYes + '|' + controlData.translatedYes + ' '\n  + controlData.defaultNo + '|' + controlData.translatedNo;\n}\n",
            "inputResponseHandlerFunction": "function(controlData, responseValue) {\n    /* Provide an input response handler function for the custom control\n\n        vaVars.script_var_1 = vaVars.script_var_1\n            + ', and I want to '\n            + responseValue.action;\n   */\n\n  vaVars.answer = responseValue.yesOrNo;\n}\n",
            "inputResponseMessageTranscriptFunction": "function(controlData, responseValue) {\n    /* Build a message for the custom input control that will be recorded in the transcript\n\n        return 'The CustomControl myCustomInputControl just responded with response: '\n            + JSON.stringify(responseValue)\n            + ', and with controlData: '\n            + JSON.stringify(controlData);\n    */\n\n    return 'The Language Switch Custom Control was responded to with the response: ' \n    + responseValue.yesOrNo;\n}\n",
