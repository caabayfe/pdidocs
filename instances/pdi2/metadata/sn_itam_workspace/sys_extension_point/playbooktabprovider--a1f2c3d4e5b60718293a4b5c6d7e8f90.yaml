api_name: sn_itam_workspace.PlaybookTabProvider
description: Extension point that decides whether the Playbook tab on the shared Asset Workspace SRP record page should be hidden for a given table. Each consuming app (HAM, BAM, ...) ships a script include implementing this interface and registers it via a sys_extension_instance. Implementations are dispatched by table name so the base data broker stays generic (no hard-coding).
