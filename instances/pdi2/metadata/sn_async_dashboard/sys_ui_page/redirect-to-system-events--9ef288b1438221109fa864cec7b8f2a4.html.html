<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

<g:evaluate var="jvar_start_time" jelly="true">

	var gdt = new GlideDateTime();
	gdt.subtract(5 * 60 * 60 * 1000);
	var start_time = gdt.getDisplayValueInternal();

	start_time;
</g:evaluate>

<g:evaluate var="jvar_end_time" jelly="true">
	var gdt = new GlideDateTime();
	var end_time = gdt.getDisplayValueInternal();

	end_time;
</g:evaluate>

<div id="start_time" style="display:none;">${jvar_start_time}</div>
<div id="end_time" style="display:none;">${jvar_end_time}</div>
</j:jelly>
