requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	getVAMappings: MappingsResponse
  	getTranslationOptions(languages: [String]): TranslationOptions
  	getLfRequestedItemDetails(sysIds: [String]!, languages: [String]): LfRequestedItemResponse
  	getNLUEditors: NLUEditorsResponse
  	getModelLookupCount(modelId: String!): ModelLookupCount
  	getUniqueUtterancesForIntent(intentId: String!, utterances: String!): UniqueUtterancesForIntentResponse 
  	nlu_batch_test_utterance(queryConditions: String!): TestUtterancesResponse
  	getEntityCount(modelId: String!): EntityCount
  }

  type Mutation {
  	translateModel(modelId: String!, language: String!, mode: String): ModelDetailsResponse
  	deleteUtterances(modelId: String!, utteranceIds: [String]!): DeleteUtterancesResponse
  	saveMapings(mappings: MappingsInput): ModelDetailsResponse
  	saveLabelFeedback(nluData: NLUData!, feedback: LabelType!, options: FeedbackOptions): LabelFeedbackResp
  	moveUtterancesToIntent(srcIntentId: String!, targetIntentId: String!, utteranceIds: [String]!, entityIds: [String]): MoveUtterancesToIntentResp
  	updateUtterance(sysId: String!, utterance: String, intent: String, source: String): UpdateUtteranceResponse
  	updateTestUtterance(sysId: String!, utterance: String!, intents: String!, source: String!): UpdateTestUtteranceResponse
  }

  type TestUtterancesResponse {
  	status: String!
  	testUtterances: [TestUtterance]
  	_table_metadata: TableMetadata
  }

  type TestUtterance {
  	sys_id: String
  	utterance: String
  	intent: String
  	source: String
  	sys_updated_on: UpdatedOn
  	test_set: String
  }

  type UpdatedOn {
  	value: String
  	displayValue: String
  }

  type TableMetadata {
  	canRead: Boolean
  	canWrite: Boolean
  	canCreate: Boolean
  	canDelete: Boolean
  }

  type UpdateUtteranceResponse {
  	status: String!,
  	sys_id: String,
  	sys_created_on: String,
  	sys_updated_on: String,
  	utterance: String,
  	source: String,
  	original_utterance: String,
  	primary_utterance: String,
  	intent: String,
  	sys_policy: String
  }

  type UpdateTestUtteranceResponse {
  	status: String!
  	sys_id: String
  	utterance: String
  	intents: String
  	source: String
  	sys_updated_on: String
  }

  type DeleteUtterancesResponse {
  	status: String!
  	deletedUtteranceIds: [String]
  }

  type MoveUtterancesToIntentResp {
  	status: String!
  	movedEntityIds: [String]
  }

  type UniqueUtterancesForIntentResponse {
  	status: String!
  	uniqueIds: [String]
  }

  type ModelDetailsResponse {
  	status: String!
  	sysId: String
  	message: String
  }

  # getVAMappingDetails:
  type MappingsResponse {
  	status: String!
  	data: [ModelGroup]
  	message: String
  }

  type ModelGroup {
  	models: [ModelData]!
  	mappings: MappingsData
  }

  type ModelData {
  	id: String!
  	name: String!
  	language: String!
  	isPrimary: Boolean
  	intents: [NLUObject]!
  	entities: [NLUObject]!
  }

  type NLUObject {
  	id: String
  	name: String!
  	topic: String
  }

  type MappingsData {
  	models: NLUGroupMapping!
  	intents: [NLUGroupMapping]!
  	entities: [NLUGroupMapping]!
  }

  type NLUGroupMapping {
  	primary: String!
  	secondary: [String]!
  }

  # getTranslationOptions
  type TranslationOptions {
  	status: String!
  	message: String
  	data: [LanguageOptions]
  }

  type LanguageOptions {
  	code: String!
  	thirdPartyTranslate: Boolean
  	machineTranslate: Boolean
  	exportImport: Boolean
  }

  # saveMapings
  input MappingsInput {
  	models: NLUGroupMappingInput!
  	intents: [NLUGroupMappingInput]!
  	entities: [NLUGroupMappingInput]!
  }

  type LfRequestedItemResponse {
  	status: String!
  	message: String
  	data: [LfRequestedItemData]
  }

  type LfRequestedItemData {
  	modelSysId: String
  	language: String
  	canRead: Boolean
  	exists: Boolean
  	details: LfRequestedItemDetails
  }

  type LfRequestedItemDetails {
  	status: String
  	isClosed: Boolean
  	sysId: String
  	link: String
  	closedOn: String
  }

  type NLUEditorsResponse {
  	status: String,
  	editors: [NLUEditors]
  }

  type NLUEditors {
  	firstName: String
  	lastName: String
  	email: String
  	sysId: String
  }

  type ModelLookupCount {
  	count: String
  	status: String
  	error: String
  }

  type EntityCount {
  	count: Int!
  }

  input NLUGroupMappingInput {
  	primary: String!
  	secondary: [String]!
  }

  # Test Panel Feedback: 
  enum LabelType {
  	positive
  	negative
  	irrelevant
  }

  input FeedbackOptions {
  	addUtteranceToIntent: Boolean
  }

  # From test panel, we will get:
  # 1. model -> when there is no prediction
  # 2. intent -> for top prediction
  input NLUData {
  	utterance: String!
  	intent: String
  	model: String
  	intent_name: String
  	model_name: String
  }

  type LabelFeedback {
  	text: String!
  	label: String
  	label_reference: String
  	label_table: String
  	label_type: LabelType
  }

  type LabelFeedbackResp {
  	status: String!
  	data: LabelFeedback
  	message: String
  }
sys_name: NLU Graphql API
sys_policy: ''
type_names: ''
