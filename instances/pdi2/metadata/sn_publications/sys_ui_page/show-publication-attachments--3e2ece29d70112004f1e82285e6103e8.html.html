<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:evaluate jelly="true">
		var pubId = jelly.sysparm_sys_id;
		var attachmentGr = new GlideRecord('sys_attachment');
		attachmentGr.addQuery('table_name', 'sn_publications_publication');
		attachmentGr.addQuery('table_sys_id', pubId);
		attachmentGr.query();		
	</g:evaluate>
	
	<g:for_each_record file="${attachmentGr}">
		<div class="attachments-content" style="padding:10px;font-size:16px" id="attachments-content"><a href="sys_attachment.do?sys_id=${attachmentGr.getValue('sys_id')}"><span title="" class="icon-paperclip snc-article-footer-metadata-attachments-paperclip" data-original-title="${attachmentGr.getValue('file_name')}"></span>${attachmentGr.getValue('file_name')}</a></div>
	</g:for_each_record>
</j:jelly>
