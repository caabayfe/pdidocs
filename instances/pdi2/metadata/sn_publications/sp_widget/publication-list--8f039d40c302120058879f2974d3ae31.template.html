<div class="panel panel-{{options.color}} b">

  <div class="panel-heading">
    <h2 class="panel-title">${Publications}</h2>
  </div>
	<div ng-if="c.data.list.length" aria-label="{{c.data.list_label}}" role="list">
    <div ng-if="c.data.list.length" ng-repeat="item in c.data.list track by item.sys_id" class="list-group-item" role="listitem">
      <div>

            <div><a href="?id=publication&table=sn_publications_publication&sys_id={{item.sys_id}}">{{item.title}}</a></div>

            <small class="text-muted" ng-repeat="f in item.secondary_fields">
              <span class="sr-only">{{f.aria_label}}</span>
              <span aria-hidden="true"ng-if="!$first"> • </span>
              <span aria-hidden="true">{{f.display_value}}</span>
            </small>

            <div ng-bind-html="c.getContent(item.text)"></div>

          </div>  
    </div>
  </div>
  
<div ng-if="!c.data.list.length" class="list-group-item">
  ${Article not found}
</div>
</div>
