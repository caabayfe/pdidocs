  value: |-
    (function execute(inputs, outputs) {
      // ... code ...
     
        var totalCount = 0;
        var minCount = 2000;
        var recipientsList = inputs.publication_record.recipient_lists;
        recipientsList = recipientsList.split(",");
        for (var i = 0; i < recipientsList.length; ++i) {
          var user_m2m = new GlideRecord("sn_publications_recipientslist_user_m2m");
          user_m2m.addQuery("recipients_list", recipientsList[i]);
          user_m2m.query();
          if (user_m2m.getRowCount() > 0) totalCount += user_m2m.getRowCount();
          else {
            if (GlidePluginManager.isActive("com.snc.cs_base")) {
              var consumer_m2m = new GlideRecord("sn_publications_recipientslist_consumer_m2m");
              consumer_m2m.addQuery("recipients_list", recipientsList[i])
              consumer_m2m.query();
              totalCount += consumer_m2m.getRowCount();;
          }
           
          }
        }
        inputs.publication_record.state = 1;
        inputs.publication_record.percentage = 0;
        inputs.publication_record.update();

        if (totalCount > minCount)
          gs.eventQueue(
            "sn_publications.build_rl_publication",
            inputs.publication_record,
            totalCount
          );
        else {
          new RecipientsListApi().buildRecipientsListForPublication(
            inputs.publication_record.getUniqueValue()
          );
          inputs.publication_record.state = 2;
          inputs.publication_record.percentage = 100;
          inputs.publication_record.update();
        }
      
    })(inputs, outputs);
