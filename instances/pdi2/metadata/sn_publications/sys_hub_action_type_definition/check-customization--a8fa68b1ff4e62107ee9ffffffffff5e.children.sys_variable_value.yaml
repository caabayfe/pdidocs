  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
    // Constants for Workflow VERSION IDs
    const WORKFLOW_INSTANT_PUBLISH_BASE = "e7de79b7c3401300e7c7d44d81d3aece";
    const WORKFLOW_PUBLISH_WITH_APPROVAL_BASE = "33987078c3d01300e7c7d44d81d3ae2f";
    const WORKFLOW_INSTANT_PUBLISH = "f6d5c49a93201300ac40f5be867ffb3f";
    const WORKFLOW_PUBLISH_WITH_APPROVAL = "5be6c89a93201300ac40f5be867ffba1";
    //Constants for Legacy Workflow IDs
    const INSTANT_PUBLISH = "a9587563d76302004f1e82285e6103ae"
    const APPROVAL_PUBLISH = "51a2f923d76302004f1e82285e610355" 

    function checkWorkflowExist(workflowId) {
      var workflowGR = new GlideRecord("wf_workflow");
      workflowGR.addQuery("sys_id", workflowId);
      workflowGR.query();
      if (workflowGR.next()) {
        return true;
      }
      return false;
    }

    function checkWorkfFlowVersionCustomization() {

      if (!(checkWorkflowExist(INSTANT_PUBLISH) && checkWorkflowExist(APPROVAL_PUBLISH))) { //zboot case where workflow will not present
        gs.info("Action: Publication Flow: Legacy Workflows not found - ZBOOT Case");
        return false
      }
    var customization = false;
      const approvalWorkflowSysId = [
        WORKFLOW_PUBLISH_WITH_APPROVAL,
        WORKFLOW_PUBLISH_WITH_APPROVAL_BASE
        ];
      const instantWorkflowSysId = [
        WORKFLOW_INSTANT_PUBLISH,
        WORKFLOW_INSTANT_PUBLISH_BASE
      ];

      //Check if anyone of approvalWorkflowSysId is customized
        var grWorkflow = new GlideRecord("wf_workflow_version");
        grWorkflow.addEncodedQuery("active=true^published=true");
        grWorkflow.addQuery("sys_id", "IN", approvalWorkflowSysId);
        grWorkflow.query();
        if (!grWorkflow.next()) {
          gs.info("Fix Script: Publication Flow Migration - Customization: True [WORKFLOW_PUBLISH_WITH_APPROVAL]");
          customization = true;
        }
    	if (customization){
    		gs.info("Fix Script: Publication Flow Migration - Customization: Return True ");
    		return customization
    	}
    	
       //Check if anyone of instantWorkflowSysId is customized
    	var grWorkflow1 = new GlideRecord("wf_workflow_version");
        grWorkflow1.addEncodedQuery("active=true^published=true");
        grWorkflow1.addQuery("sys_id", "IN", instantWorkflowSysId);
        grWorkflow1.query();
        if (!grWorkflow1.next()) {
          gs.info("Fix Script: Publication Flow Migration - Customization: True [WORKFLOW_INSTANT_PUBLISH]");
          customization = true;
        }

      
      return customization;
    }




    outputs.customization = checkWorkfFlowVersionCustomization()
    })(inputs, outputs);
