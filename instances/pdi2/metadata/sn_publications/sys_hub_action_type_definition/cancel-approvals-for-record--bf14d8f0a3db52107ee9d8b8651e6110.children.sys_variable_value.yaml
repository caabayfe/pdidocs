    (function execute(inputs, outputs) {
      
        var source_record = inputs.publication_record.sys_id;

        var publicationRecord = new GlideRecord("sn_publications_publication");
        publicationRecord.addQuery("sys_id", source_record);
        publicationRecord.query();
        while (publicationRecord.next()) {
          new global.WorkflowApprovalUtils().cancelAll(publicationRecord);
        }
      
    })(inputs, outputs);
