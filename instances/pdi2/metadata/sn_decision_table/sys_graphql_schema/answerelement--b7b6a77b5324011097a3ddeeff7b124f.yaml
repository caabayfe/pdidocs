  	max_length: String
  	order: String
  	reference: String
  	reference_qual_condition: String
  	choice: String
  	choice_table: String
  	choice_field: String
  	sys_scope: String
  	comments: String
  }

  type AnswerElementDetails {
  	sys_class_name: GlideField
  	sys_id: GlideField
