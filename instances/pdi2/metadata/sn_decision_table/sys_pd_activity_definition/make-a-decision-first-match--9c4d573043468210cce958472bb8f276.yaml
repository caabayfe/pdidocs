description: |-
  <p>Execute rules in a decision table. When this activity runs, it will immediately finish and continue the process execution. The activity returns the result of the first matching decision rule, based on the rank of the rules. To return results from all matching rules, add the decision table to a subflow.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Decision Table</b> - decision table to execute</li>
  <li><b>Decision Table Inputs</b> - input data the decision table will evaluate</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Decision Result</b> - result value(s) from the first matching decision row</li>
  </ul>
