  value: |-
    (function execute(inputs, outputs) {
        var MULTI_RESULT = "sys_decision_multi_result";
        var REFERENCE = "reference";
        var GLIDE_VAR =  "glide_var";
        var RESULT_ELEMENTS = "result_elements";

        var inputsJSON = JSON.parse(inputs.inputs);
        var decisionInputs = {};
        var decisionSysId = inputs.model.sys_id;

        Object.keys(inputsJSON).forEach(function (input) {
            //Decision Table should not have an input named uiModel
            if (input !== 'uiModel') {
                decisionInputs[input] = inputsJSON[input].value;
            }
        });

        //execute the decision table
        var answerGr = new sn_dt.DecisionTableAPI().getDecision(decisionSysId, decisionInputs);
        if (!answerGr) {
            outputs.decision_result = {};
            return;
        }

        var answerTableName = answerGr.getTableName();
        outputs.decision_result = {
            record: {
                    table: answerTableName,
                    sysId: answerGr.getUniqueValue()
                }
        };
        if (answerTableName !== MULTI_RESULT) {
            outputs.decision_result.flowInternalFieldType = REFERENCE;
        } else {
            outputs.decision_result.flowInternalFieldType = GLIDE_VAR;
            outputs.decision_result.glideVarElementField = RESULT_ELEMENTS;
        };
    })(inputs, outputs);
