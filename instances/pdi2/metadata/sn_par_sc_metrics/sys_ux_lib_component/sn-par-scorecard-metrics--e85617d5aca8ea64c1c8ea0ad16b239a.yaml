required_translation_keys: '[{"message":"Add one or more metrics to show in the indicator list."},{"message":"Configure"},{"message":"Delete"},{"code":"data-visualizations","message":"Type","comment":"Multi score type label."},{"code":"data-visualizations","message":"Period","comment":"Number of time periods label."},{"code":"data-visualizations","message":"Step","comment":"Noun. Period step label."},{"message":"Previous period"},{"message":"Previous 2 periods"},{"message":"Previous 6 periods"},{"message":"Custom Interval"},{"message":"Latest score"},{"message":"Shows the score from the last time data was collected."},{"message":"Latest score bar"},{"message":"Enables the visualization of the latest score as a bar. It helps in spotting larger values shown as longer bars, from smaller values shown as shorter bars."},{"message":"Previous scores"},{"message":"Show scores from previous data collection periods. Select the number of previous periods whose scores you want to see."},{"message":"Change (Change %)"},{"message":"Shows the difference between the previous score and the latest score both as an absolute value and as a percent."},{"code":"data-visualizations","message":"Change","comment":"Noun. The difference between the previous score and the latest score."},{"message":"Shows the difference between the previous score and the latest score."},{"message":"Change %"},{"message":"Shows the difference between the previous score and the latest score, as a percentage of the previous score."},{"message":"Gap (Gap %)"},{"message":"Shows the difference between the current and target scores both as an absolute value and as a percent."},{"message":"Gap"},{"message":"Shows the difference between the current score and the target. For indicators with a Maximize direction, the gap calculation is Score–Target. For indicators with a Minimize direction, the calculation is Target–Score. Thus a positive value is always good, and a negative value is always bad. A value appears only if the indicator has a defined target."},{"message":"Gap %"},{"message":"Shows the percentage difference between the current and target scores. As with Gap, a positive Gap % is always good, and a negative Gap % is always bad, regardless of the direction of the indicator. A value appears only if the indicator has a defined target. OFF by default."},{"code":"data-visualizations","message":"Trend","comment":"Visual representation of the direction and pattern of change."},{"message":"Shows the linear trend in score values over the predefined time period."},{"code":"data-visualizations","message":"Target","comment":"Noun. Shows the desired score for the indicator."},{"message":"Shows the desired score for the indicator. A value appears only if the indicator has a defined target."},{"message":"Distribution"},{"message":"Displays the frequency of each breakdown element as a histogram."},{"message":"Metrics"},{"message":"Close"},{"message":"Select analytics to show in the indicator list."},{"message":"Select one analytic to show in the pivot."},{"message":"Apply"},{"code":"data-visualizations","message":"SCORES","comment":"Shows information about scorecard scores."},{"message":"CHANGE"},{"message":"GAP"},{"message":"OTHERS"},{"code":"data-visualizations","message":"Up","comment":"Rounding up rounds to the next larger whole number."},{"message":"Rounding up rounds to the next larger whole number."},{"code":"data-visualizations","message":"Down","comment":"Rounding down rounds to the next smaller whole number."},{"message":"Rounding down rounds to the next smaller whole number."},{"code":"data-visualizations","message":"Ceiling","comment":"Ceiling rounds to the next larger whole number."},{"message":"Ceiling rounds to the next larger whole number."},{"code":"data-visualizations","message":"Floor","comment":"Floor rounds to the next smaller whole number."},{"message":"Floor rounds to the next smaller whole number."},{"code":"data-visualizations","message":"Half up","comment":"Half up rounding rounds to the next larger half unit."},{"message":"Half up rounding rounds to the next larger half unit."},{"code":"data-visualizations","message":"Half down","comment":"Half down rounding rounds to the next smaller half unit."},{"message":"Half down rounding rounds to the next smaller half unit."},{"code":"data-visualizations","message":"Half even","comment":"Half even rounds to the nearest even number. 2.5 rounds to 2; 3.5 rounds to 4."},{"message":"Half even rounds to the nearest even number. 2.5 rounds to 2; 3.5 rounds to 4."},{"message":"d/h/m/s"},{"message":"Day/Hour/Minute/Second"},{"message":"Day"},{"message":"d"},{"message":"day"},{"message":"days"},{"message":"Hour"},{"message":"h"},{"message":"hour"},{"message":"hours"},{"message":"Minute"},{"message":"m"},{"message":"minute"},{"message":"minutes"},{"message":"Second"},{"message":"s"},{"code":"data-visualizations","message":"second","comment":"Noun. Time unit."},{"code":"data-visualizations","message":"seconds","comment":"Noun. Time unit. Plural."},{"message":"Q{quarterNumber}"},{"message":"W{weekNumber}"},{"message":"[FQ]Q"},{"message":"[FY]YYYY"},{"code":"data-visualizations","message":"Time series","comment":"Chart type group."},{"code":"data-visualizations","message":"Bars","comment":"Chart type group."},{"code":"data-visualizations","message":"Pie and donuts","comment":"Chart type group."},{"message":"Others"},{"message":"Vertical bar"},{"message":"Horizontal bar"},{"message":"Pie"},{"message":"Donut"},{"message":"Semi donut"},{"message":"Single score"},{"message":"Line"},{"message":"Trend by (X axis)"},{"message":"Column"},{"message":"Area"},{"message":"Spline"},{"message":"Stepline"},{"message":"Count"},{"message":"Sum"},{"message":"Average"},{"message":"Count distinct"},{"message":"Standard deviation"},{"code":"data-visualizations","message":"Min","comment":"Minimum"},{"code":"data-visualizations","message":"Max","comment":"Maximum"},{"message":"Reference currency"},{"message":"Actual