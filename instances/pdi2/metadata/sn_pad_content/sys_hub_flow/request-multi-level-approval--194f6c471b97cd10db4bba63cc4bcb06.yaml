description: |-
  <p>Request Multi-Level Approval, for use with Playbook experience. Creates a multi level approval record for assigned to Manager and Manager's Manager</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Assigned To</b> - User required to provide flow data inputs.</li>
  <li><b>Comments</b> - Comments for approval record</li>
  <li><b>Due Date</b> - Due date for approval record</li>
  <li><b>Table</b> - Table to query</li>
  <li><b>Record</b> - Record Associated for Approval</li>

  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Approval State</b> - State can be approved or rejected.</li>
  <li><b>Query for List filter</b> - Query for list filter.</li>
  </ul>
