description: |-
  <p>Request Ad hoc Approval, for use with Playbook experience. Creates Ad hoc approval records for Users or Group members.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Approver</b> - List of Approver for approval record.</li>
  <li><b>Approver Group</b> - User group for approval record.</li>
  <li><b>Table</b> - Table to query</li>
  <li><b>Record</b> - Record Associated for Approval</li>

  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Approval Record</b> - Approval Records.</li>
  <li><b>Approval State</b> - Approval Record state.</li>
  <li><b>Flow Data Created Date</b> - Date format generated for list filter query</li>
  </ul>
