copied_from_name: Update Record Activity
description: |-
  <p>Update Record process activity, that optionally waits for user to complete flow data record. This flow may be used within an activity definition to update a specified record and fields.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Assignment Group</b> - (Optional) Group required to provide flow data inputs.</li>
  <li><b>Assigned To</b> - (Optional) User required to provide flow data inputs.</li>
  <li><b>Table</b> - Default table specified in Flow Data table input</li>
  <li><b>Record</b> - Default record specified in Flow Data record input</li>
  <li><b>Fields</b> - Default fields specified in Flow Data fields input</li>
  <li><b>Fields to show after update</b> - Playbook record fields to render within Agent Workspace, after the update is complete.</li>
  <li><b>Wait for user input</b> - When checked, does not wait for flow data to be in a completed state.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul><li><b>Table</b> - Table specified by flow data.</li>
  <li><b>Record</b> - Record updated by flow..</li>
  <li><b>Automated</b> - True/False based on whether the flow waited for user input or not.</li>
  </ul>
