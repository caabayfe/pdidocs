description: |-
  <p>Creates a child case for a given parent case.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Parent</b> - Parent case to associate with the child record.</li>
  <li><b>Assignment Group</b> - Case assignment group</li>
  <li><b>Assigned To</b> - Case assigned to</li>
  <li><b>Short Description</b> - Case short description</li>
  <li><b>Description</b> - Case description</li>
  <li><b>Priority</b> - Case priority</li>
  <li><b>Collect Data From User</b> - Make this as true to collect all the above inputs from agent experience. If this input is checked all above input values will be ignored.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Case Record</b> - Child case record.</li>
  </ul>
