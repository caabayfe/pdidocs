description: |-
  <p>Creates a child task for a given parent task.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Parent</b> - Parent Task to associate with the child record.</li>
  <li><b>Assigned To</b> - Task assigned to</li>
  <li><b>Short Description</b> - Task short description</li>
  <li><b>Description</b> - Task description</li>
  <li><b>Priority</b> - Task priority</li>
  <li><b>Collect Data From User</b> - Make this as true to collect all the above inputs from agent experience. If this input is checked all above input values will be ignored.</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Task Record</b> - Child task record.</li>
  </ul>
