      }
  ]
query: |-
  query (
  	$tableName: String!
  	$path: String
  	$includeTags: Boolean
  	$includeKeywords: Boolean
  	$variableMode: GlidePredicateBuilder_DotWalkVariableModeEnumType
  	$includeExcludedOperators: Boolean
  	$includeExtendedOperators: Boolean
  	$disableDotwalking: Boolean
  	$fieldInclusionList: [String]
  	$fieldExclusionList: [String]
  ) {
  	GlidePredicateBuilder_Query {
  		getPanelData(
  			tableName: $tableName
  			path: $path
  			includeTags: $includeTags
  			includeKeywords: $includeKeywords
  			disableDotwalking: $disableDotwalking
  			variableMode: $variableMode
  			fieldInclusionList: $fieldInclusionList
  			fieldExclusionList: $fieldExclusionList
  		) {
  			panelData {
  				dotwalkPath {
  					internalValue
  					displayValue
  					source
  					reference
  					precedingSeparatorTerm
  				}
  				panelDefinitions {
  					source
  					searchResults {
  						source
  						firstRow
  						lastRow
  						allItemsLoaded
  						searchTerm
  						loadMoreRequestParams {
  							name
  							value
  						}
  					}
  					items {
  						itemType
  						internalValue
  						displayValue
  						reference
  						selectable
  						initialPanelOnly
  						precedingSeparatorTerm
  						excludeFromPath
  						metadata {
  							name
  							value
  						}
  					}
  				}
  			}
  			infoMessages {
  				status
  				header
  				content
  			}
  		}
  		getTableMetadata(
  			tableName: $tableName
  			path: $path
  			includeExcludedOperators: $includeExcludedOperators
  			includeExtendedOperators: $includeExtendedOperators
  			fieldInclusionList: $fieldInclusionList
  			fieldExclusionList: $fieldExclusionList
  		) {
  			tableMetadata {
  				name
  				label
  				fieldMetadata {
  					excludedOperators
  					extendedOperators
  					name
  					label
  					type
  					referenceTable
  					referenceTableDefaultField
  					referenceKey
  					dynamicSchemaData {
  						name
  						value
  					}
  					dictionaryAttributes {
  						name
  						value
  					}
  					recordHierarchies {
  						sysId
  						name
  						label
  						table
  						referenceField
  						pathField
  					}
  				}
  			}
  			infoMessages {
  				header
  				content
  				status
  			}
  		}
  	}
  }
