          "name": "fieldInclusionList",
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "json"
      },
      {
          "defaultValue": [],
          "description": "Optional list of fields that will be filtered from the response",
          "fieldType": "json",
          "label": "fieldExclusionList",
          "mandatory": false,
          "name": "fieldExclusionList",
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
