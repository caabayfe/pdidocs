          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "boolean"
      },
      {
          "defaultValue": [],
          "description": "Optional list of fields that the response will be limited to",
          "fieldType": "json",
          "label": "fieldInclusionList",
