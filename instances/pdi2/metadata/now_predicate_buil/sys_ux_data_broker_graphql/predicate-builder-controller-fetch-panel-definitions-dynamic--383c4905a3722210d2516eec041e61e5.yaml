api_name: now_predicate_buil.Predicate Builder Controller - Fetch Panel Definitions Dynamic Categories
batch_exclude: 'false'
description: Get the panel definitions for dynamic attribute categories given a table and data attribute store field.
mutates_server_data: 'true'
name: Predicate Builder Controller - Fetch Panel Definitions Dynamic Categories
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "tableName",
          "label": "Table Name",
          "description": "The table for which a panel definition is being requested",
          "readOnly": false,
          "fieldType": "table_name",
          "valueType": "string",
          "mandatory": true,
          "defaultValue": ""
      },
      {
          "name": "fieldName",
          "label": "Field Name",
          "description": "The data attribute store field to get the categories for.",
          "readOnly": false,
          "fieldType": "fieldName",
          "valueType": "string",
          "mandatory": true,
          "defaultValue": ""
      },
      {
          "name": "disableDotwalking",
          "label": "Disable Dotwalking",
          "description": "Flag to disable dotwalking",
          "defaultValue": false,
          "fieldType": "boolean",
          "mandatory": false,
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "boolean"
      },
      {
          "name": "searchTerm",
          "label": "Search Term",
          "description": "String to filter the results by",
          "defaultValue": "",
          "fieldType": "string",
          "mandatory": false,
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "string"
      },
      {
          "name": "firstRow",
          "label": "First Row",
          "description": "The starting index of panel definitions to fetch",
          "defaultValue": 0,
          "fieldType": "number",
          "mandatory": false,
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "int"
      },
      {
          "name": "lastRow",
          "label": "Last Row",
          "description": "The last index of panel definitions to fetch, exclusive",
          "defaultValue": 100,
          "fieldType": "number",
          "mandatory": false,
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "int"
      }
  ]
query: |-
  query (
  	$tableName: String!
  	$fieldName: String!
  	$disableDotwalking: Boolean
  	$searchTerm: String
  	$firstRow: Int
  	$lastRow: Int
  ) {
  	GlidePredicateBuilder_Query {
  		getDynamicCategoriesPanelData(
  			tableName: $tableName
  			fieldName: $fieldName
  			disableDotwalking: $disableDotwalking
  			searchTerm: $searchTerm
  			firstRow: $firstRow
  			lastRow: $lastRow
  		) {
  			panelData {
  				dotwalkPath {
  					internalValue
  					displayValue
  					source
  					reference
  				}
  				panelDefinitions {
  					source
  					searchResults {
  						source
  						firstRow
  						lastRow
  						allItemsLoaded
  						searchTerm
  						loadMoreRequestParams {
  							name
  							value
  						}
  					}
  					items {
  						itemType
  						internalValue
  						displayValue
  						reference
  						selectable
  						initialPanelOnly
  						precedingSeparatorTerm
  						excludeFromPath
  					}
  				}
  			}
  			infoMessages {
  				status
  				header
  				content
  			}
  		}
  	}
  }
required_translations: ''
