api_name: now_predicate_buil.Predicate Builder Controller - Decode Encoded Query String
batch_exclude: 'false'
description: Get a decoded query model from an encoded query string
mutates_server_data: 'false'
name: Predicate Builder Controller - Decode Encoded Query String
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "tableName",
          "label": "Table Name",
          "description": "Name of the table to associate with the encoded query",
          "readOnly": false,
          "fieldType": "table_name",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "encodedQuery",
          "label": "Encoded query",
          "description": "Filter string to populate the condition builder",
          "readOnly": false,
          "fieldType": "string",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "fixedEncodedQuery",
          "label": "Fixed Encoded query",
          "description": "Fixed filter string to populate the condition builder",
          "readOnly": false,
          "fieldType": "string",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      }
  ]
query: |-
  query ($tableName: String, $encodedQuery: String, $fixedEncodedQuery: String) {
  	GlidePredicateBuilder_Query {
  		getDecodedQuery(tableName: $tableName, encodedQuery: $encodedQuery) {
  			decodedQuery {
  				...decodedQuery
  			}
  			tableMetadata {
  				...tableMetadata
  			}
  			infoMessages {
  				...infoMessages
  			}
  		}
  	}
  	GlidePredicateBuilder_FixedQuery: GlidePredicateBuilder_Query {
  		getDecodedQuery(tableName: $tableName, encodedQuery: $fixedEncodedQuery) {
  			decodedQuery {
  				...decodedQuery
  			}
  			tableMetadata {
  				...tableMetadata
  			}
  			infoMessages {
  				...infoMessages
  			}
  		}
  	}
  }

  fragment decodedQuery on GlidePredicateBuilder_DecodedQueryType {
  	conditions {
  		...conditions
  	}
  	orderBy {
  		field {
  			...field
  		}
  		type
  	}
  	groupBy {
  		field {
  			...field
  		}
  	}
  	relatedListQuery {
  		relationType
  		relationValue
  		relatedTableName
  		relationOperator
  		relatedTableLabel
  		relatedListIdentifier
  		conditions {
  			...conditions
  		}
  	}
  }

  fragment tableMetadata on GlidePredicateBuilder_TableMetadataType {
  	name
  	label
  	fieldMetadata {
  		name
  		label
  		type
  		dotwalkable
  		referenceTable
  		referenceTableDefaultField
  		referenceKey
  		excludedOperators
  		extendedOperators
  		dynamicSchemaData {
  			name
  			value
  		}
  		dictionaryAttributes {
  			name
  			value
  		}
  		recordHierarchies {
  			sysId
  			name
  			label
  			table
  			referenceField
  			pathField
  		}
  	}
  }

  fragment infoMessages on GlidePredicateBuilder_InfoMessageType {
  	status
  	header
  	content
  }

  fragment dotWalkPath on GlidePredicateBuilder_DotwalkPathType {
  	internalValue
  	displayValue
  	source
  	reference
  	precedingSeparatorTerm
  }

  fragment field on GlidePredicateBuilder_FieldType {
  	internalValue
  	displayValue
  	type
  	dotwalkPath {
  		...dotWalkPath
  	}
  }

  fragment conditions on GlidePredicateBuilder_ConditionType {
  	conditionType
  	field {
  		...field
  	}
  	operator {
  		internalValue
  		displayValue
  	}
  	value {
  		internalValue
  		displayValue
  		dotwalkPath {
  			...dotWalkPath
  		}
  	}
  	conditionMetadataList {
  		key
  		value
  	}
  }
required_translations: |-
  [ {
    "message" : "Encoded query",
    "comment" : ""
  }, {
    "message" : "Name of the table to associate with the encoded query",
    "comment" : ""
  }, {
    "message" : "Table Name",
    "comment" : ""
  }, {
    "message" : "The encoded query to decode into a query model",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Predicate Builder Controller - Decode Encoded Query String
sys_policy: ''
type: query
use_record_domain: 'false'
