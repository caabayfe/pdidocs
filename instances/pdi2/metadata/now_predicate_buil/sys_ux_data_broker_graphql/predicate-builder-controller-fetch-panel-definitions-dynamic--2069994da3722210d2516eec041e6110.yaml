api_name: now_predicate_buil.Predicate Builder Controller - Fetch Panel Definitions Dynamic Attributes
batch_exclude: 'false'
description: Get the panel definitions for dynamic attribute attributes given a categoryNamespacedName or namespaceName
mutates_server_data: 'true'
name: Predicate Builder Controller - Fetch Panel Definitions Dynamic Attributes
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "namespaceName",
          "label": "Namespace Name",
          "description": "The dynamic namespace name of the attributes being requested– used for uncategorized attributes",
          "readOnly": false,
          "fieldType": "string",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "categoryNamespacedName",
          "label": "Category Namespaced Name",
          "description": "The complete category namespaced name of the attributes being requested",
          "readOnly": false,
          "fieldType": "string",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "searchTerm",
          "label": "Search Term",
          "description": "String to filter the results by",
          "defaultValue": "",
          "fieldType": "string",
          "mandatory": false,
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "string"
      },
      {
          "name": "firstRow",
          "label": "First Row",
          "description": "The starting index of panel definitions to fetch",
          "defaultValue": 0,
          "fieldType": "number",
          "mandatory": false,
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "int"
      },
      {
          "name": "lastRow",
          "label": "Last Row",
          "description": "The last index of panel definitions to fetch, exclusive",
          "defaultValue": 100,
          "fieldType": "number",
          "mandatory": false,
          "readOnly": false,
          "selectable": false,
          "typeMetadata": null,
          "valueType": "int"
      }
  ]
query: |-
  query (
  	$namespaceName: String
  	$categoryNamespacedName: String
  	$searchTerm: String
  	$firstRow: Int
  	$lastRow: Int
  ) {
  	GlidePredicateBuilder_Query {
  		getDynamicAttributesPanelData(
  			namespaceName: $namespaceName
  			categoryNamespacedName: $categoryNamespacedName
  			searchTerm: $searchTerm
  			firstRow: $firstRow
  			lastRow: $lastRow
  		) {
  			panelData {
  				dotwalkPath {
  					internalValue
  					displayValue
  					source
  					reference
  				}
  				panelDefinitions {
  					source
  					searchResults {
  						source
  						firstRow
  						lastRow
  						allItemsLoaded
  						searchTerm
  						loadMoreRequestParams {
  							name
  							value
  						}
  					}
  					items {
  						itemType
  						internalValue
  						displayValue
  						reference
  						selectable
  						initialPanelOnly
  						precedingSeparatorTerm
  						excludeFromPath
  						metadata {
  							name
  							value
  						}
  					}
  				}
  			}
  			infoMessages {
  				status
  				header
  				content
  			}
  		}
  	}
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Predicate Builder Controller - Fetch Panel Definitions Dynamic Attributes
sys_policy: ''
