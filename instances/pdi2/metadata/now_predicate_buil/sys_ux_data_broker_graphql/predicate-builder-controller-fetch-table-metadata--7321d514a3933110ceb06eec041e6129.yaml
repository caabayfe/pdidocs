api_name: now_predicate_buil.Predicate Builder Controller - Fetch Table Metadata
batch_exclude: 'false'
description: Get the table metadata for a table and path
mutates_server_data: 'true'
name: Predicate Builder Controller - Fetch Table Metadata
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "tableName",
          "label": "Table Name",
          "description": "The table for which a panel definition is being requested and the source for the dotwalk path if one is provided",
          "readOnly": false,
          "fieldType": "table_name",
          "valueType": "string",
          "mandatory": true,
          "defaultValue": ""
      },
      {
          "name": "path",
          "label": "Path",
          "description": "Dotwalk Path",
          "readOnly": false,
          "fieldType": "string",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "includeExtendedOperators",
          "label": "Include extended operators",
          "description": "Boolean flag to include extended operators set through dictionary attributes",
          "readOnly": false,
          "fieldType": "boolean",
          "valueType": "boolean",
          "mandatory": false,
          "defaultValue": false
      }
  ]
query: |-
  query (
    $tableName: String!
    $path: String
    $includeTags: Boolean
    $includeKeywords: Boolean
    $includeExtendedOperators: Boolean
  ) {
    GlidePredicateBuilder_Query {
      getTableMetadata(
        tableName: $tableName
        path: $path
        includeTags: $includeTags
        includeKeywords: $includeKeywords
        includeExtendedOperators: $includeExtendedOperators
      ) {
        tableMetadata {
          name
          label
          fieldMetadata {
            excludedOperators
            extendedOperators
            name
            label
            type
            referenceTable
            referenceTableDefaultField
            referenceKey
            dynamicSchemaData {
              name
              value
            }
            dictionaryAttributes {
              name
              value
            }
            recordHierarchies {
              sysId
              name
              label
              table
              referenceField
              pathField
            }
          }
        }
        infoMessages {
          header
          content
          status
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Dotwalk Path",
    "comment" : ""
  }, {
    "message" : "Path",
    "comment" : ""
  }, {
    "message" : "Table Name",
    "comment" : ""
  }, {
    "message" : "The table for which a panel definition is being requested and the source for the dotwalk path if one is provided",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Predicate Builder Controller - Fetch Table Metadata
sys_policy: ''
type: query
use_record_domain: 'false'
