api_name: now_predicate_buil.Predicate Builder Controller - Encode Decoded Query
batch_exclude: 'false'
description: Get an encoded query string from a decoded query
mutates_server_data: 'true'
name: Predicate Builder Controller - Encode Decoded Query
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "decodedQuery",
          "label": "Decoded Query",
          "description": "Decoded query model in JSON string format",
          "readOnly": false,
          "fieldType": "table_name",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "useHasItemVariableSyntax",
          "label": "Use HASITEMVARIBLE Syntax",
          "description": "If true, the variablesHASITEMVARIABLE:sys_id syntax will be used for all variables terms as opposed to the default variables.sys_id syntax",
          "readOnly": false,
          "fieldType": "boolean",
          "valueType": "boolean",
          "mandatory": false,
          "defaultValue": false
      },
      {
          "name": "fixedDecodedQuery",
          "label": "Fixed Decoded Query",
          "description": "Fixed decoded query model in JSON string format",
          "readOnly": false,
          "fieldType": "table_name",
          "valueType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "fixedQueryMode",
          "label": "Fixed Query Mode",
          "description": "Mode can either be simple (classic) or distributed",
          "readOnly": false,
          "fieldType": "choice",
          "valueType": "choice",
          "mandatory": false,
          "defaultValue": "SIMPLE",
          "typeMetadata": {
                  "choices": [
                    {
                         "label": "Simple",
                         "value": "SIMPLE"
                    },
                    {
                         "label": "Distributed",
                         "value": "DISTRIBUTED"
                    }
           ]
      }
    }
  ]
query: |-
  query ($decodedQuery: String, $useHasItemVariableSyntax: Boolean, $fixedDecodedQuery: String, $fixedQueryMode: GlidePredicateBuilder_FixedQueryModeEnumType) {
  	GlidePredicateBuilder_Query {
  		getEncodedQuery(decodedQuery: $decodedQuery, fixedDecodedQuery: $fixedDecodedQuery, fixedQueryMode: $fixedQueryMode, useHasItemVariableSyntax: $useHasItemVariableSyntax) {
  			encodedQuery
  			fixedEncodedQuery
  			fixedQueryMode
  			combinedEncodedQuery
  			infoMessages {
  				status
  				header
  				content
  			}
  		}
  	}
  }
required_translations: |-
  [ {
    "message" : "Decoded Query",
    "comment" : ""
  }, {
    "message" : "Decoded query model in JSON string format",
    "comment" : ""
