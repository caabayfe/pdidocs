name: Change Schedules - Color Picker
style: |-
  .sn-color-picker {
  	padding: 0px;
  }

  .sn-color-picker .popover-content {
  	padding: 15px;
  }

  .sn-color-picker .cp-container {
  	width: 140px;
  	padding: 0px;
  }

  .sn-color-picker .cp-container.rgb {
  	width: 160px;
  }

  .sn-color-picker .cp-container.alpha {
  	width: 169px;
  }

  .sn-color-picker .cp-container.pallet {
  	width: 160px;
  }

  .sn-color-picker .cp-container .cp-control-group {
  	margin-bottom: 5px;
  	-webkit-user-select: none;
  	-moz-user-select: none;
  	-ms-user-select: none;
  	user-select: none;
  }

  .sn-color-picker .cp-container .cp-control-group:last-child {
  	margin-bottom: 0;
  }

  .sn-color-picker .cp-container .cp-control-group .cp-control {
  	box-sizing: border-box;
  	margin-right: 5px;
  	position: relative;
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container {
  	box-sizing: content-box;
  	height: 33px;
  	margin: -12px -15px 15px -15px;
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab {
  	display: inline-block;
  	box-sizing: border-box;
  	width: 50%;
  	height: 32px;
  	background-color: ${$color-lightest};
  	position: relative;
  	font-size: 15px;
  	border-bottom: 1px solid ${$color-light};
  	fill: ${$color-darkest};
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab {
  	fill: ${$color-darkest};
  }

  @media not all and (min-resolution:.001dpcm) { @supports (-webkit-appearance:none) { /* Safari only */
  	.sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab:focus { /* focus on all elements in the modal */
  		outline: 2px solid ${$color-accent} !important;
  		box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075), 0 0 8px ${$color-accent};
  	}
  }}

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab:focus {
  	fill: ${$color-light};
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab:hover {
  	fill: ${$color-light};
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab:active {
  	fill: ${$color-accent};
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab.state-active {
  	fill: ${$color-accent};
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab.state-active:hover {
  	fill: ${$color-accent};
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab:disabled {
  	background-color: ${$color-lightest};
  }

  .sn-color-picker .cp-container .cp-control-group.cp-tab-container .cp-tab .icon-bucket {
  	width: 17px;
  	height: 17px;
  }

  .sn-color-picker .cp-container .cp-control-group .cp-control:last-child {
  	margin-right: 0;
  }

  .sn-color-picker .cp-container .cp-control-group .cp-btn {
  	flex-grow: 1;
  	display: inline-block;  /* Required for IE. Ignored elsewhere*/
  	position: relative;
  }

  .sn-color-picker .cp-container .cp-control-group.save-cancel {
  	display:flex;
  	flex-wrap: wrap;
  	margin: 10px -2.5px 0px -2.5px;
  }

  .sn-color-picker .cp-container .cp-control-group.save-cancel .cp-btn {
  	flex-basis: 43%;
  	margin: 5px 2.5px 0 2.5px;
  }

  .sn-color-picker .cp-container .cp-control-group.save-cancel .cp-btn button {
  	width: 100%;
  	height: 24px;
  	padding: 0px;
  	font-size: 12px;
  	line-height: 12px;
  }

  .sn-color-picker .cp-container .cp-control-group.hsl-group {
  	display: flex;
  	flex-wrap: wrap;
  }

  .sn-color-picker .cp-container .saturation-luminance,
  .sn-color-picker .cp-container .hue,
  .sn-color-picker .cp-container .alpha,
  .sn-color-picker .cp-container .swatch,
  .sn-color-picker .cp-container .pallet-toggle,
  .sn-color-picker .cp-container .pallet-color {
  	display: inline-block;
  	border: 1px solid ${$color-light};
  	border-radius: 3px;
  }

  .sn-color-picker .cp-container .hue,
  .sn-color-picker .cp-container .alpha {
  	height: 111px;
  	width: 24px;
  }

  .sn-color-picker .cp-container .saturation-luminance {
      height: 111px;
      width: 111px;
      background: linear-gradient(-45deg, black, rgba(0,0,0,0.5), hsla(0, 0%, 50%, 0), rgba(255,255,255,0.5), white),
                  linear-gradient(45deg, hsl(0, 0%, 50%),  hsla(0, 0%, 50%, 0.5), hsla(0, 0%, 50%, 0) ) ;
      cursor: crosshair;
  }

  .sn-color-picker .cp-container .saturation-luminance.compact-lhs {
  	height: 114px;
  	width: 114px;
  }

  .sn-color-picker .cp-container .saturation-luminance .cp-hsl-lens {
  	box-sizing: border-box;
  	position: absolute;
  	width: 6px;
  	height: 6px;
  	border-radius: 3px;
  	border: 1px solid ${$color-lightest};
  	background-color: rgba(0,0,0,0.5);
  }

  .sn-color-picker .cp-container .hue.vertical {
  	height: 111px;
  	width: 24px;
  	background: linear-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
  	padding: 0px;
  }

  .sn-color-picker .cp-container .hue.horizontal {
  	height: 24px;
  	width: 114px;
  	background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
  	padding: 0px;
  }

  .sn-color-picker .cp-container .hue .cp-hsl-slider {
  	box-sizing: border-box;
  	position: absolute;
  	border: 1px solid black;
  	border-radius: 2px;
  	background-color: rgba(255,255,255,0.5);
  }

  .sn-color-picker .cp-container .hue.vertical .cp-hsl-slider {
  	width: 22px;
  	height: 4px;
  }
  .sn-color-picker .cp-container .hue.horizontal .cp-hsl-slider {
  	width: 4px;
  	height: 22px;
  }

  .sn-color-picker .cp-container .alpha {
      background-image: linear-gradient(0deg, white, rgba(0,0,0,0));
      background-color: red;
  }

  .sn-color-picker .cp-container .swatch {
      width: 111px;
      height: 24px;
  }

  .sn-color-picker .cp-container .swatch.no-toggle.compact-rhs {
  	width: 40px;
  	height: 24px;
  }

  .sn-color-picker .cp-container .swatch.no-toggle,
  .sn-color-picker .cp-container .swatch.with-alpha {
      width: 140px;
  }

  .sn-color-picker .cp-container .swatch.no-toggle.with-alpha {
      width: 169px;
  }

  .sn-color-picker .cp-container .hex-field-container .hex-label {
  	font-size: 12px;
  	margin-bottom: 0px;
  }

  .sn-color-picker .cp-container .hex-field-container .hex-field {
  	box-sizing: border-box;
  	width: 100%;
  	height: 24px;
  	font-size: 12px;
  	padding-left: 3px;
  	border: 1px solid ${$color-light};
  	border-radius: 3px;
  }

  .sn-color-picker .cp-container .rgb-field-container {
  	width: 40px;
  }

  .sn-color-picker .cp-container .rgb-field-container .rgb-field-element {
  	margin-bottom: 5px;
  }

  .sn-color-picker .cp-container .rgb-field-container .rgb-field-element:last-child {
  	margin-bottom: 0px;
  }

  .sn-color-picker .cp-container .rgb-field-container .rgb-field-element .rgb-label {
  	display: inline-block;
  	font-size: 12px;
  	margin-right: 5px;
  	width: 7px;
  }
  .sn-color-picker .cp-container .rgb-field-container .rgb-field-element .rgb-field {
  	box-sizing: border-box;
  	font-size: 12px;
  	width: 28px;
  	height: 24px;
  	padding-left: 3px;
  	border: 1px solid ${$color-light};
  	border-radius: 3px;
  }

  .sn-color-picker .cp-container .cp-control-group.cp-pallet {
  	display: flex;
  	flex-flow: wrap;
  }

  .sn-color-picker .cp-container .pallet-color {
  	width: 28px;
  	height: 28px;
  	cursor: pointer;
  }

  .sn-color-picker .cp-container .pallet-toggle {
  	width: 24px;
  	height: 24px;
  	cursor: pointer;
  	font-size: 10px;
  	background-color: ${$color-lightest};
  }

  .sn-color-picker .cp-container .pallet-toggle.to-hsl {
      background: linear-gradient(-45deg, rgba(0,0,0,1), rgba(0,0,0,0), rgba(255,255,255,1)),
                  linear-gradient(45deg, hsla(0, 0%, 50%, 1), hsla(0, 0%, 50%, 0));
  }

  .sn-color-picker .cp-container .pallet-toggle.to-pallet {
      background-image: url(data:image/png;base64,);
  }

  .sn-color-picker .cp-container .pallet-color {
      margin: 0px 5px 5px 0px;
  }

  .sn-color-picker .cp-container .pallet-color:nth-child(5n+0) {
      margin-right: 0;
  }

  .sn-color-picker .cp-container .pallet-color:nth-child(n+21) {
      margin-bottom: 0;
  }

  .sn-color-picker .dead-centre {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
  }

  .sn-color-picker .cp-container .pallet-color .selected-color {
      font-size: 11px;
      text-shadow: #000 0px 0px 1px,   #000 0px 0px 1px,   #000 0px 0px 1px,
                   #000 0px 0px 1px,   #000 0px 0px 1px,   #000 0px 0px 1px;
      color: ${$color-lightest};
  }
sys_name: Change Schedules - Color Picker
