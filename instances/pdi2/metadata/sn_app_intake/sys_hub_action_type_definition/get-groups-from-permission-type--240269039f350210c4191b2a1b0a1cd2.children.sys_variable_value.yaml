  value: |-
    (function execute(inputs, outputs) {
        var permissionTypeGR = new GlideRecordSecure('sn_app_intake_permission_type');
        var groupSysIds = [];
        var groupsStr = '';

        if (typeof inputs.groups === 'string' || inputs.groups == null || typeof inputs.groups.getUniqueValue !== 'function') {
            groupsStr = inputs.groups;
        } else {
            var inputGroups = [];
            inputGroups.push(inputs.groups.getUniqueValue() || '');
            while (inputs.groups.next()) {
                inputGroups.push(inputs.groups.getUniqueValue());
            }
            groupsStr = inputGroups.join();
        }

        if (!groupsStr) {
            outputs.groupsysids = '';
            return;
        }

        permissionTypeGR.addQuery('sys_id', 'IN', groupsStr);
        permissionTypeGR.query();
        while (permissionTypeGR.next()) {
            groupSysIds.push(permissionTypeGR.getValue('group'));
        }
        outputs.groupsysids = groupSysIds.join(',');
    })(inputs, outputs);
