required_translation_keys: '[{"message":"Device-specific experiences"},{"message":"Create tailored experience for each device"},{"message":"With device views, you can create optimized mobile and tablet experiences with smoother tap interactions and more flexible layouts that go beyond breakpoint-based designs."},{"message":"Device specific experiences"},{"message":"Create tailored experiences for each device"},{"message":"A device view provides tailored layouts and compositions that load only when accessed from that device."},{"message":"Unlike breakpoint-based changes, this enables more optimized mobile and tablet experiences with better tap interactions and flexible layouts."},{"message":"Build with flexibility"},{"message":"Build on a new canvas for each view"},{"message":"Creating a device view gives a blank canvas to build layouts and compositions from scratch."},{"message":"The flexibility lets you work efficiently when designs differ significantly across devices."},{"message":"Streamlined workflow"},{"message":"Shared foundation: data, properties and events"},{"message":"The following are shared across views for a streamlined workflow, and changes made in one view apply to all:"},{"message":"Data scripts"},{"message":"Properties and policies"},{"message":"Events"},{"message":"When to use device view"},{"message":"Learn more"},{"message":"Go to release notes"},{"message":"Discover what''s new for Australia"}]'
