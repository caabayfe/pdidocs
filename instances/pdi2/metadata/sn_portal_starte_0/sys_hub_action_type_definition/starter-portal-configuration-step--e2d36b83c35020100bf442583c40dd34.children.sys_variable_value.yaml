  value: |-
    (function execute(inputs, outputs) {
      
      // Update UX page property for "Configure" button
      var uxRegistryId = inputs["exp_registry_id"];
      var uxAppConfigId = inputs["exp_config_id"];
      var templateRegistryId = "c5bbbde2c3121010f46b42583c40dd06";
      
      var gr = new GlideRecord("sys_ux_page_property");
      gr.addQuery("page", uxRegistryId);
      gr.addQuery("name", "chrome_header");
      gr.addQuery("route", "");
      gr.query();
      var portalGenerator = new sn_portal_starte_0.StarterPortalGenerator();
      
      while(gr.next()) {
        var jsonValue = gr.getValue("value");
        
        if(jsonValue.contains(templateRegistryId)) {
          	var propertyId = gr.getUniqueValue();
        	var jsonValue = gr.getValue("value");
        	var newJsonValue = jsonValue.replace(templateRegistryId, uxAppConfigId);
        
        	portalGenerator.updatePageProperty(propertyId, newJsonValue);
        
        }
      }
      
      // Update UI Views
      var viewNames = {};
      viewNames["settings_view"] = inputs["settings_view"];
      viewNames["approval_view"] = inputs["approval_view"];
      
      portalGenerator.updateUiViewNames(inputs["app_sys_id"], uxRegistryId, viewNames);
     
    })(inputs, outputs);
