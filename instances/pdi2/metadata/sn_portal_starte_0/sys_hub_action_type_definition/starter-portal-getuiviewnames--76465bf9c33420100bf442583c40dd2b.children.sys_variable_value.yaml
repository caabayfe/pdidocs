  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      var outputSettingsViewName;
      var outputApprovalViewName;
      
      var appId = inputs["app_sys_id"];
      var appGr = new GlideRecord("sys_app");
      appGr.get(appId);
      
      var scopeName = appGr.getValue("scope");
      
      function getOutputViewIndex() {
        var tableName = "sys_ui_view";
        var gr = new GlideRecord(tableName);
        gr.addQuery("sys_scope", appId);
        gr.orderByDesc("sys_created_on");
        gr.query();
        
        if(gr.next()) {
          var nameVal = gr.getValue("name");
          var indexVal = nameVal.split("_")[0];
          var isNumber = /^\d+$/.test(indexVal);
          
          if(isNumber)
            return indexVal;
        }
      }
      
      var indexValue = getOutputViewIndex();
      outputApprovalViewName = "custom_portal_approval" + "_" + scopeName;
      outputSettingsViewName = "custom_portal_settings" + "_" + scopeName;
      
      if(indexValue) {
        outputApprovalViewName = indexValue + "_" + outputApprovalViewName;
      	outputSettingsViewName = indexValue + "_" + outputSettingsViewName;
      }
      
      outputs["settings_view"] = outputSettingsViewName;
      outputs["approval_view"] = outputApprovalViewName;
      
    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
