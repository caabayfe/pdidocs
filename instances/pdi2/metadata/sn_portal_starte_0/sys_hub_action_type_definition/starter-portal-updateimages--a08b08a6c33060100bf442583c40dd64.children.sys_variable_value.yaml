  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      var outputLandingImageName;
      var outputLoginImageName;
      
      var appId = inputs["app_sys_id"];
      var appGr = new GlideRecord("sys_app");
      appGr.get(appId);
      
      var scopeName = appGr.getValue("scope");
      
      function getOutputViewIndex() {
        var tableName = "db_image";
        var gr = new GlideRecord(tableName);
        gr.addQuery("sys_scope", appId);
        gr.orderByDesc("sys_created_on");
        gr.query();
        
        if(gr.next()) {
          var nameVal = gr.getValue("name");
          var indexVal = nameVal.split("_")[0];
          var isNumber = /^\d+$/.test(indexVal);
          
          if(isNumber)
            return indexVal;
        }
      }
      
      var indexValue = getOutputViewIndex();
      
      if(indexValue) {
        outputLandingImageName = indexValue + "_" + scopeName + ".custom_portal_banner.svg";
      	outputLoginImageName = indexValue + "_" + scopeName + ".custom_portal_login.svg";
      
        var imageNames = {};
        imageNames["landing_image"] = outputLandingImageName;
        imageNames["login_image"] = outputLoginImageName;
      
        
        var expRegistryId = inputs["exp_registry_id"];
      	var portalGenerator = new sn_portal_starte_0.StarterPortalGenerator();
        portalGenerator.updateDbImageNames(appId, expRegistryId, imageNames);
      }
      
    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
