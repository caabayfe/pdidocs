  value: |-
    (function execute(inputs, outputs) {

            var url_path = inputs['experience_url'];
            var application_scope = inputs['scope'];

            var acl = UxFrameworkScriptables.getFullPathByRelativeUrl(url_path, application_scope).replace("/", ".") + ".*";
            var rolesObj = inputs["selected_roles"];

            var aclGR = new GlideRecord("sys_security_acl");
            if (aclGR.get("name", acl)) {
                rolesObj.forEach(function(item, index) {
                    var userRoleGR = new GlideRecord("sys_user_role");
                    userRoleGR.get(item.id);

                    if (userRoleGR) {
                        var roleId = userRoleGR.getUniqueValue();
                        var aclSysId = aclGR.getUniqueValue();

                        var portalGenerator = new sn_portal_starte_0.StarterPortalGenerator();

                        if (portalGenerator)
                            portalGenerator.insertAclRoles(aclSysId, roleId);
                        else
                            gs.error("portal generator script include not found");
                    }
                    });
            }

    })(inputs, outputs);
