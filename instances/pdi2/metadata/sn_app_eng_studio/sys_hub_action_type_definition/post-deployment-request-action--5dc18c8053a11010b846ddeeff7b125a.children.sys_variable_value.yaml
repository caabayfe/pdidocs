  value: |-
    (function execute(inputs, outputs) {
      if(inputs.status_code !== 201) {
        outputs['status_code'] = inputs.status_code;
        outputs['body'] = inputs.response_body;
        outputs['error_message'] = inputs.error_message;
        outputs['has_error'] = true;
      } else {
        try {
          var parsedResponse = JSON.parse(inputs.response_body);
          var result = parsedResponse.result;
          
          outputs['requestor_name'] = result.requestor_first_name + ' ' + result.requestor_last_name;
      	  outputs['app_name'] = result.app_name;
          
          var pipelineConfigChecks = new sn_pipeline.PipelineConfigChecks();
          var grController = pipelineConfigChecks.getControllerRecord();
          var instanceUrl = grController ? grController.instance_url : gs.getProperty("glide.servlet.uri");
          
          outputs['deployment_request_url'] = instanceUrl + 'nav_to.do?uri=/sn_app_eng_studio_deployment_request.do?sys_id=' + result.sys_id;
      	  outputs['number'] = result.number;
          
          outputs['status_code'] = inputs.status_code;
          outputs['body'] = inputs.response_body;
          outputs['error_message'] = inputs.error_message;
          outputs['has_error'] = false;
        } catch(e) {
          outputs['status_code'] = inputs.status_code;
          outputs['body'] = inputs.response_body;
          outputs['error_message'] = inputs.error_message;
          outputs['has_error'] = true;
        }
      }
    })(inputs, outputs);
