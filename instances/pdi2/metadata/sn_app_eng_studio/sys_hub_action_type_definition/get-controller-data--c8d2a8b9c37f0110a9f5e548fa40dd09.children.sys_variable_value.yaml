    (function execute(inputs, outputs) {
      var aesControllerUtils = new AesControllerUtils();
      var controllerConfigurationData = aesControllerUtils.getControllerConfigurationData();
      
      outputs.is_controller_configured = controllerConfigurationData.is_controller_configured;
      
      if(controllerConfigurationData.is_controller_configured) {
        outputs.controller_instance_url = controllerConfigurationData.controller_instance_url;
        outputs.controller_cred_ref = controllerConfigurationData.controller_cred_ref;
      }
    })(inputs, outputs);
