description: |-
  <p>Given a change request, this flow executes a given CI action.</p>
  <p><b>Inputs:</p>
  </b>
  <ul>
     <li><b>Change request</b> - ID of the change request you wish to implement.</li>
     <li><b>CI action</b> - ID of the sn_cimaf_action record which needs to be executed</li>
     <li><b>Action parameters</b> - JSON containing required and optional parameters to execute CI action</li>
  </ul>
  <p><b>Outputs:</p>
  </b>
  <ul>
     <li><b>Status</b> - Will be set to "Success", if the request is completed. Will be set to "Error", if the request failed due to an error.</li>
     <li><b>Error message</b> - Reason for error. Populated only when an error occurs.</li>
  </ul>
  <p><b>Error Messages:</p>
  </b>
  <ul>
     <li>Invalid update on record</li>
     <li>Missing required parameters</li>
     <li>CI action execution failure</li>
  </ul>
