api_name: sn_sow_inc.Load form sections and record data
batch_exclude: 'false'
description: Retrieve form sections and record data
mutates_server_data: 'false'
name: Load form sections and record data
output_schema: ''
private: 'false'
props: |-
  [{
    "name": "table",
    "label": "Table",
    "description": "Table to be used for the layout",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  },
  {
    "name": "sysId",
    "label": "SysId",
    "description": "sys_id to be used for the layout",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  },
  {
    "name": "views",
    "label": "Views",
    "description": "View to be used for the layout",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  }]
query: |-
  query ($table: String!, $sysId: String!, $views: String!) {
    GlideViewQuery_Query {
      uiView(table: $table, sysId: $sysId, views: $views) {
        view
        glideLayoutItem(table: $table, sysId: $sysId) {
          _query {
            GlideLayout_Query {
              formLayout(table: $table, sysId: $sysId, view: "$$parent.viewName$$") {
                isValidRecord
                table
                sysId
                sectionLayout {
                  sysId
                  caption
                  captionDisplay
                  rows {
                    fields
                  }
                }
                recordValues {
                  name
                  value
                  displayValue
                }
                fieldStates {
                  name
                  hidden
                  mandatory
                  readonly
                }
                elementsData {
                  name: elementName
                  dictionary: dictionaryData {
                    type: dictionaryType
                    label
                  }
                  ... on GlideLayout_ReferenceElementType {
                    reference
                  }
                }
              }
            }
          }
        }
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Load form sections and record data
sys_policy: ''
type: query
use_record_domain: 'false'
