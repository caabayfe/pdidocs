  value: |-
    (function execute(inputs, outputs) {
      var currentDateTime =new GlideDateTime();//currentdate
      var plannedStartDate = inputs.plannedStartDate;//startdate
      if(!gs.nil(plannedStartDate)){
      var duration =new GlideDateTime.subtract(currentDateTime,plannedStartDate);
      outputs.duration=duration;
      outputs.pendingtext=gs.getMessage('This activity will automatically run at the scheduled time {0}',plannedStartDate.getDisplayValue());
      }
      else{
        outputs.duration=0;
      outputs.pendingtext=gs.getMessage('This activity will start immediately ');
      }
    })(inputs, outputs);
