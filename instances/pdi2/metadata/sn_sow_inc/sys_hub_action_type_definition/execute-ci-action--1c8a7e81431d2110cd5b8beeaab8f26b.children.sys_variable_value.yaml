  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      if(gs.nil(inputs.ciActionSysId) || gs.nil(inputs.ciSysId)){
        outputs.status = "error";
        outputs.error_message = "Missing or invalid mandatory input paramter(s)";
      }
      var ciActionEngine = new sn_cimaf.CIActionEngine();
      var actionParams = {};
      if(!gs.nil(inputs.actionParameters)){
        actionParams = inputs.actionParameters;
      }
      try{
        var actionRequestId = ciActionEngine.execute(inputs.ciActionSysId, inputs.ciSysId, actionParams);
        if(gs.nil(actionRequestId)){
          outputs.status = "error";
          outputs.error_message = "Unable to submit CI action execution request.";
        }else {
          outputs.status = "success";
          outputs.ci_action_request_sys_id = actionRequestId;
        }
      } catch(e){
        gs.error("[Flow action: Execute CI action] Exception occured during CI action {0} execution request submission for CI {1} with params {2} {3}", inputs.ciActionSysId, inputs.ciSysId, JSON.stringify(actionParams), e);
        outputs.status = "error";
        outputs.error_message = "Unable to submit CI action execution request."; 
      }
    })(inputs, outputs);
