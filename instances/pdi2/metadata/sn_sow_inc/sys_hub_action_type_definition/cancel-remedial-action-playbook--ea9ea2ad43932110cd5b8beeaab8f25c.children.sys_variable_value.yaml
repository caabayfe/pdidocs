  value: |-
    (function execute(inputs, outputs) {
        if (gs.nil(inputs.parentRecord) || gs.nil(inputs.cancellationReason)) {
            outputs.status = "Error";
            gs.error("[Flow action - Cancel remedial action playbook] : undefined input params");
            return;
        }
        try {
            var cancelPlaybookResponse = sn_playbook.PlaybookExperience.cancelPlaybooksByParentRecord(inputs.parentRecord, inputs.cancellationReason);
            outputs.status = "Success";
            outputs.response = cancelPlaybookResponse;
        } catch (e) {
            outputs.status = "Error";
            gs.error("[Flow action - Cancel remedial action playbook] : error cancelling given playbook {0}", e.getMessage());
        }
    })(inputs, outputs);
