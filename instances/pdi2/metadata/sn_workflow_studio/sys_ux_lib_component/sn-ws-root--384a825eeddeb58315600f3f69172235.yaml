"message":"New"},{"message":"What''s a "},{"message":"Help me decide"},{"message":"Playbooks guide users through complex processes by providing step-by-step instructions. They combine subflows and actions to automate parts of a process to ensure consistent execution and user guidance."},{"message":"Flows run a repeatable multi-step process when a set of trigger conditions are met. Flows combine actions and flow logic to automate a process."},{"message":"Subflows automate a repeatable multi-step process that also produces an output needed by another process. Playbooks, flows, or scripts can call a subflow to run a sequence of reusable actions and flow logic to complete the process and produce output values."},{"message":"Actions automate a repeatable task or operation within a flow or subflow. Actions take flow data as inputs, run a sequence of steps to complete a task, and pass data back to the flow as outputs."},{"message":"Spokes are pre-built integration applications containing Workflow Studio content such as subflows and actions. Each spoke integrates with a particular external system."},{"message":"Data streams manage and process large datasets, often used to pull data from external sources. They work with flows and actions to automate data handling."},{"message":"Decision tables allow you to define complex business rules. They can be integrated into flows to ensure decisions are made consistently based on predefined criteria."},{"message":"Triggers are a set of start conditions that determine when to run a flow. Triggers allow you to reuse conditions across multiple flows and to push changes to all flows that use the trigger as a template."},{"message":"Answer a few questions about your use case to figure out which automation might work for you."},{"message":"Help me decide which automation to create"},{"message":"Generating \"{0}\" with Now Assist..."},{"message":"Creating \"{0}\"..."},{"message":"A server error occurred. See the server logs or contact your S