schema: |-
  schema {
      query: Query
  }

  type Query {
  	getActionPropertyMap (actionIdMap: String!): ActionPropertyResponse!,
  	getTranslatedFlowFromDatabase (flowSysId: String!): Response!
  }

  type MenuOption {
  	sysId: String,
  	name: String,
  	script: String,
  	showOption: String,
  	displayName: String,
  	icon: String
  }

  type NodeTypeHandler {
  	script: String,
  	type: String
  }

  type NodeType {
  	active: String,
  	description: String,
  	shapeTemplate: String,
  	nodeType: String,
  	sysId: String,
  	allowDelete: Boolean,
  	menuOptions: [MenuOption],
  	nodeTypeHandlers: [NodeTypeHandler]
  }

  type Spot {
  	sysId: String,
  	x: String,
  	y: String
  }

  type ConnectorPort {
  	shapeTemplate: String,
  	active: Boolean,
  	offsetX: String,
  	offsetY: String,
  	spot: Spot
  }

  type Connector {
  	active: Boolean,
  	name: String,
  	direction: String,
  	order: String,
  	sysId: String,
  	fromMaxLinks: String,
  	toMaxLinks: String
  	connectorPort: ConnectorPort
  }

  type AdditionalProperty {
  	allowChildren: Boolean,
  	iconBackground: String,
  }

  type ActionProperty {
  	name: String!,
  	key: String!,
  	sysId: String!,
  	description: String,
  	icon: String,
  	category: String,
  	categoryId: String,
  	subCategory: String,
  	order: Int,
  	nodeType: NodeType,
  	connectors: [Connector],
  	additionalProperties: AdditionalProperty
  }

  type ActionPropertyResponse {
  	actionProperties: [ActionProperty],
  	errors: [String]
  }

  type Response {
  	data: String!
  	errors: [String]!
  }
