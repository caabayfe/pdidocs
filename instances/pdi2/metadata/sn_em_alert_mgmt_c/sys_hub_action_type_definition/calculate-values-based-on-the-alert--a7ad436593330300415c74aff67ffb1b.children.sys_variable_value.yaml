  value: |-
    (function execute(inputs, outputs) {
      //helper functions
      var getNodeOrCi = function() {
        var lCI = inputs.ci;
        var lNode = inputs.node;
        
        if (lCI == null)
          lCI = "";
        
        if (lNode == null) 
          lNode = "";
       
        if(inputs.ci) {
          return "CI: [" + lCI + "]";
        }
        return "Node: [" + lNode + "]";
      }
      
      var getIncidentUrgency = function(){
        var incidentSeverity;
        if(inputs.severity == 1 || inputs.severity == 2)
          incidentSeverity = 1;
        else if (inputs.severity == 3 || inputs.severity == 4)
           incidentSeverity = 2;
        else if (inputs.severity == 5)
           incidentSeverity = 3;
        
        return incidentSeverity;
      }
      
      var getImpactedServicesText = function(impactedServicesList, ci) {
        var numberOfImpactedServices = 0;
        if (impactedServicesList){
          numberOfImpactedServices = impactedServicesList.split(",").length;
        }
        
    	var impactedServicesText="";
       
    	if(ci != null && ci !== "") {
           
    		if(numberOfImpactedServices > 0) {
             
    			var lCi = ci; 
    			if (lCi == null) {
    				lCi = "";
    			}
    			impactedServicesText="Total impacted services by the CI: "+ "["+ lCi +"] ";
    			if(numberOfImpactedServices > 1){
    				impactedServicesText+="are ";
    			} else {
    				impactedServicesText+="is ";
    			}
    			impactedServicesText+=numberOfImpactedServices+".";
    		} else {
    			impactedServicesText="";
    		} 
    	} 
        
    	return impactedServicesText;
      }
      
      var getIncidentImpact = function(){
        var incidentImpact;
        if (inputs.alertGr.sn_priority_group){
        	if(inputs.alertGr.sn_priority_group == 1 || inputs.alertGr.sn_priority_group == 2)
          		incidentImpact = 1;
        	else if (inputs.alertGr.sn_priority_group == 3)
           		incidentImpact = 2;
        	else if (inputs.alertGr.sn_priority_group == 4)
           		incidentImpact = 3;
        }
        return incidentImpact;
      }
      
      var impactedServicesList;
      var affectedCis = '';
      try {
        var evtMgmtAlertUtils = new global.EvtMgmtAlertUtils();
        var isLegacy = typeof evtMgmtAlertUtils.getGroupCisAndImpactedServices !== 'function';
        if (!isLegacy) {
          var cisAndImpactedServicesJson = evtMgmtAlertUtils.getGroupCisAndImpactedServices(inputs.alertGr.group, inputs.alertGr.cmdb_ci);
          if (!cisAndImpactedServicesJson) {
          	// this is a corner case where the JS is updated but the node isn't, so we have to revert to legacy code
            isLegacy = true;
          } else {
            var cisAndImpactedServices = JSON.parse(cisAndImpactedServicesJson);
            impactedServicesList = cisAndImpactedServices.impactedServices;
            affectedCis = cisAndImpactedServices.cis;
          }
        }
        if (isLegacy) {
          impactedServicesList = evtMgmtAlertUtils.getAllImpactedServices(inputs.alertGr.group, inputs.alertGr.cmdb_ci);
        } 
      } catch (ex) {
        var commons = new global.EvtMgmtCommons();
        gs.error(commons.getExceptionMessage(ex, true));
        // just log the error, but allow execution to continue so we still create the incident
      }
      
      //setting the calculated fields
      outputs.ciOrNode=getNodeOrCi();
      outputs.incidentUrgency=getIncidentUrgency();
      outputs.impactedServices = getImpactedServicesText(impactedServicesList, inputs.ci);
      outputs.affectedcis = affectedCis;
      outputs.contacttype = "Alert";
      outputs.impactedserviceslist = impactedServicesList;
      outputs.incidentimpact = getIncidentImpact();
      
    })(inputs, outputs);
