  value: |-
    (function execute(inputs, outputs) {
      //Getting all the impacted services
      var alertImpactedService = new global.EvtMgmtAlertUtils().getAllImpactedServices(inputs.alertGr.group, inputs.alertGr.cmdb_ci);
      if (alertImpactedService) {
        var allImpactedServices = alertImpactedService.split(',');
      	var i = 0;
      	while (i < allImpactedServices.length)
      	{
    	  var gr = new GlideRecord("task_cmdb_ci_service");
    	  gr.initialize();
    	  gr.setValue("cmdb_ci_service", allImpactedServices[i]);
    	  gr.setValue("task", inputs.incidentGr.getUniqueValue());
    	  gr.setValue("manually_added", false);
    	  gr.update();
    	  i++;
        }
      }
    })(inputs, outputs);
