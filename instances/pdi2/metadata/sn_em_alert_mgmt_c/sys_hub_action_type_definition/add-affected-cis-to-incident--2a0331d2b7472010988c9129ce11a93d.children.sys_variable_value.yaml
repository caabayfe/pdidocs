  value: |-
    (function execute(inputs, outputs) {
      if (!inputs.affectedCis) {
        // nothing to do here, since legacy service-watch doesn't return affected CIs
        return;
      } 
      if (gs.getProperty('evt_mgmt.populate_affected_cis_for_incident', 'true') !== 'true') {
        // customer opted out of affected CIs
        return;
      }
      var affectedCis = inputs.affectedCis.split(",");
      // This check should be redundant, since we are also checking in the Java code, but no harm in having it here too.
      var maxCis = gs.getProperty('evt_mgmt.max_affected_cis_for_incident', 100);
      if (affectedCis.length > maxCis) {
        gs.warn(gs.getMessage("Create Incident - {0} affected CIs were not added to incident {1} because there is a limit of {2}.", 
                              [""+affectedCis.length, inputs.taskGr.number, maxCis]));
        return;
      }
      for (var i=0; i < affectedCis.length; i++) {
        var ci = affectedCis[i];
        if (!ci) continue; // could be a blank ci if nothing was returned
        if (ci == inputs.taskGr.cmdb_ci) continue; // DEF0446189 + DEF0560158: avoid duplicated entry exception
        var gr = new GlideRecord("task_ci");
        gr.initialize();
        gr.setValue("ci_item", ci);
        gr.setValue("task", inputs.taskGr.getUniqueValue());
        gr.insert();
      }
    })(inputs, outputs);
