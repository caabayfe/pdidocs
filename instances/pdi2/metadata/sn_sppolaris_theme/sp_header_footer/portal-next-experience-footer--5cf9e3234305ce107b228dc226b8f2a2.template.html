<div class="scrub-footer" ng-if="c.data.footer && showFooter" ng-init="portalFooterLoaded()" role="contentinfo">
  
  <!-- Top Container -->
  <div class="sf-main" ng-if="c.data.footer.menus.navigation_links.length || c.data.smallScreen">
    
    <!-- Logo Container -->
    <div class="sf-logo-container" ng-if="c.data.footer.logo.content || c.data.smallScreen" ng-style="c.sfLogoContainerCSS">
      <img class="sf-logo"
           ng-if="c.data.footer.logo.imageUrl"
           alt={{c.data.footer.logo.altText}}
           ng-src={{c.data.footer.logo.imageUrl}}
           ng-style="c.sfLogoCSS">
      <div class="sf-logo-content" ng-show="c.data.footer.logo.content">
        <p ng-repeat="line in c.data.footer.logo.content">{{line}}</p>
      </div>
    </div>
    
    <!-- Navigation Links Container -->
    <div class="sf-links-container" id="sf-links-container">
      <div class="masonry-root">
        <div class="sf-menu masonry-cell" ng-repeat="menu in c.data.footer.menus.navigation_links" ng-if="!menu.items.length" ng-style="c.masonryCellCSS">
          <div class="sf-link">
            <a class="sitemap-link" ng-click="portalFooterClicked($event, 'Navigation Menu Clicked - '+ menu.label)" ng-href={{menu.href}} ng-attr-target={{menu.url_target}}>{{menu.label}}</a>
          </div>
        </div>
        <div class="sf-menu masonry-cell" ng-repeat="menu in c.data.footer.menus.navigation_links" ng-if="menu.items.length>0" ng-style="c.masonryCellCSS">
          <div class="sf-menu-label" ng-if="menu.items.length" ng-attr-id={{menu.sysId}} role="heading" aria-level=2>
            {{menu.label}}
          </div>
          <ul >
            <li class="sf-link" role="listitem" ng-repeat="link in menu.items">
            <a class="sitemap-link" ng-click="portalFooterClicked($event, 'Navigation Menu Link Clicked - '+ link.label)" ng-href={{link.href}} ng-attr-target={{link.url_target}} aria-label = "{{link.label}} {{menu.label}}">{{link.label}}</a>
          </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  
  <hr ng-if="c.data.footer.menus.navigation_links.length" aria-hidden="true">
  
  <!-- Bottom Container -->
  <div class="sf-bottom" ng-if="(c.data.footer.menus.bottom_links && c.data.footer.menus.bottom_links.length) || (c.data.footer.menus.social_icons && c.data.footer.menus.social_icons.length) || c.data.footer.copyright">
    
    <!-- Branding when no Navigation Links-->
    <div class="sf-bottom-left" ng-style="c.sfBottomLeftCSS">
      <div class="sf-logo-container" ng-if="(!c.data.footer.logo.content || (!c.data.footer.menus.navigation_links.length && c.data.footer.logo.content)) && !c.data.smallScreen" ng-style="c.sfLogoContainerCSS">
        <img class="sf-logo"
             ng-if="c.data.footer.logo.imageUrl"
             alt="brand-logo"
             ng-style="c.sfLogoCSS"
             ng-src={{c.data.footer.logo.imageUrl}}>
        <div class="sf-logo-content" ng-show="c.data.footer.logo.content">
          <p ng-repeat="line in c.data.footer.logo.content">{{line}}</p>
        </div>
      </div>
    </div>
    
    <div class="sf-bottom-right" ng-style="c.sfBottomRightCSS">
      <!-- Bottom Links Container -->
      <ul class="sf-bottom-links ">
        <li class="sf-bottom-link" ng-repeat="link in c.data.footer.menus.bottom_links">
          <a class="footer-link" ng-click="portalFooterClicked($event, 'Bottom Icon Clicked - '+ link.label)" ng-href={{link.href}} ng-attr-target={{link.url_target}}>{{link.label}}</a>
        </li>
      </ul>
      
      <!-- Social Icons Container -->
      <ul class="sf-social-icons">
        <li class="sf-social-icon" ng-repeat="icon in c.data.footer.menus.social_icons" >
          <a class="social-icon"
             ng-href={{icon.href}}
             title={{icon.label}}
             ng-click="portalFooterClicked($event, 'Social Icon Clicked - '+ icon.label)"
             ng-class="'fa fa-' + icon.glyph"
             ng-attr-target={{icon.url_target}}
             aria-label={{icon.label}}
             ng-style="c.sfSocialIconsCSS">
          </a>
        </li>
      </ul>
      
      <!-- Copyright -->
      <div class="sf-copyright">
        {{c.data.footer.copyright}}
      </div>
    </div> 
  </div>
        
    
</div>
