  value: By default, chat interaction tabs that are not in focus do not inform Service Desk Agents (SDA) when an end user has responded. This can lead to end users feeling frustrated waiting for help, and SDAs needing to pivot more between unfocused chat interactions to see if end users have responded. Enable this property to instead add animation to chat interaction tabs to notify SDAs of end user response from unfocused chat interactions.
