  value: '{"html":"<ol><li>This setup is provided by ServiceNow, allowing you to consume an Azure Enterprise application that we recommend. This application is pre-configured with all the necessary configurations and permissions, so the customer only needs to authorize it for usage. This approach is relatively easier to set up, as it involves fewer manual steps, which can often be error-prone. By using this pre-configured app, you can streamline the setup process and reduce the risk of configuration issues.</li><br><li>In order to use this mode of setup, you are advised to obtain at least two Azure tenants as this mode has a limitation of mapping one Microsoft Azure Tenant to one ServiceNow instance. One tenant should be reserved for testing in lower environments, while the other should be designated for production use. For more information, read <a href=\"https://www.servicenow.com/docs/csh?context=setup-multi-tenant\" target=\"_blank\">this</a> on the ServiceNow docs.</li></ol>"}'
