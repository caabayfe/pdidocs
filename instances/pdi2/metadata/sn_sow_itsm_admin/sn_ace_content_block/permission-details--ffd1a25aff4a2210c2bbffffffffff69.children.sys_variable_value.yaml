  value: '{"html":"Following are API permissions required for ServiceNow integration with Microsoft Teams for Notify connector and Meeting Extensions. <br> <ul><li>API Permissions for <b>Notify connector for Microsoft Teams</b><br><br><ol><li><b>Users.Read.All (Application) - </b>Allows the app to get the details of the users, such as their Azure ID, which is required to start the meeting.</li> <li><b>OnlineMeetings.ReadWrite.All (Application) - </b>Permission required to initiate an online meeting.</li> <li><b>Calls.InitiateGroupCall.All (Application) - </b>Permission required to invite multiple participants to a call on behalf of a Bot.</li> <li><b>Calls.JoinGroupCall.All (Application) - </b>Permission allows the bot to join the meeting as a participant. In order to read call details, the bot must first be a meeting participant.</li> <li><b>Calls.JoinGroupCallAsGuest.All (Application) - </b>Allows the app to anonymously join group calls and scheduled meetings in your organization, without a signed-in user. The app will be joined as a guest to meetings in your tenant.</li></ol></li> <br><li>API Permissions for <b>Meeting Extensions</b><br><br><ol><li><b>TeamsAppInstallation.ReadWriteForChat.All (Application) - </b>Permission required to add our app to an online meeting, as part of Meeting Extensibility.</li>  <li><b>TeamsTab.ReadWriteForChat.All (Application) - </b>Permission allows the app to open a tab with incident details within a meeting as part of Meeting Extensibility. </li></ol></li></ul>"}'
  variable: f9d9fc5453db5110c733ddeeff7b120b
