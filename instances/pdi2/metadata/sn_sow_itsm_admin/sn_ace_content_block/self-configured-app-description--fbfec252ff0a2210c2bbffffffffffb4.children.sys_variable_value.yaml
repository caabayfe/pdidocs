  value: '{"html":"<ol><li>This setup involves more manual steps, but it is preferred by some customers because it offers greater granular control and visibility over the app creation process. In this setup, you need to manually create and maintain the app or bot on Azure, as well as add each permission individually. This process is more challenging due to the increased number of manual steps involved.</li><br><li>When a user operates multiple ServiceNow instances, including both lower environments and a production environment, but has only a single Microsoft Azure tenant, the Self Configured option provides the necessary flexibility. This allows the customer to create multiple Azure applications for each ServiceNow instance directly from the Azure portal.  For more information, read <a href=\"https://www.servicenow.com/docs/csh?context=setup-single-tenant\" target=\"_blank\">this</a> on the ServiceNow docs.</li></ol>"}'
