required_translations: '[{"message":"Configure","comment":""},{"message":"Configure email notification","comment":""},{"message":"Create trigger rules for a major incident. Get started by activating one of the out-of-the-box rules, or take a more measured approach by creating your own trigger rules to meet the needs of your organization.","comment":""},{"message":"<p><span style=\"background-color: rgb(var(--now-color_grouped--purple-0, #efdefa)); border-radius: 2px; padding: 0px 4px 2px 2px;\">No default settings configured</span></p>","comment":""},{"message":"<span style=\"background-color: RGB(var(--now-color_grouped--purple-0, #EFDEFA)); border-radius: 2px; padding: 0px 4px 2px 2px;\">No playbook assigned</span>","comment":""},{"message":"Set up communications","comment":""},{"message":"Configure SMS","comment":""},{"message":"Configure email","comment":""},{"message":"Assign manager role","comment":""},{"message":"assign manager role","comment":""},{"message":"Configure timeline","comment":""},{"message":"Communications","comment":""},{"message":"Set the default event filters and visibility settings for all post-incident report timelines.","comment":""},{"message":"Trigger rules define the criteria for proposing a standard incident as a Major Incident.","comment":""},{"message":"Trigger rules","comment":""},{"message":"Select and assign playbooks for major incidents.","comment":""},{"message":"Playbooks","comment":""},{"message":"Configure trigger rules","comment":""},{"message":"Timeline configurations","comment":""},{"message":"Communication plans","comment":""},{"message":"Communication plans are made up of a plan definition, which specifies the audience to which a communication will be sent, and a set of tasks. Tasks include the message to be sent, the mode of communication (called a ''channel''), and the frequency at which the communication will be sent.","comment":""},{"message":"Configure playbooks","comment":""},{"message":"<span style=\"background-color: RGB(var(--now-color_grouped--purple-0, #EFDEFA));border-radius: 2px; padding: 0px 4px 2px 2px;\">No notification configured</span>","comment":""},{"message":"<p>Configure automated notification alerts for different situations like Major Incident state change, updates to  assigned  users or groups, etc.</p>","comment":""},{"message":"<p>Templates deliver consistent information on specific system activities and improve the efficiency of creating multiple email notifications for similar actions.</p>","comment":""},{"message":"<span style=\"background-color: RGB(var(--now-color_grouped--purple-0, #EFDEFA));border-radius: 2px; padding: 0px 4px 2px 2px;\">No plan set up</span>","comment":""},{"message":"A playbook can help drive a major incident to faster resolution as it will guide users through the major incident management process, making sure each step is followed along the way.","comment":""},{"message":"<p>Set up communication plans for various stages & milestones of an incident.</p>","comment":""},{"message":"Templates","comment":""},{"message":"<p>   Review and complete the below steps to configure Major Incident Management for your instance.    To configure each card, you will need the table-specific roles.   <br><br>   Please refer to the    <a href=\"https://www.servicenow.com/docs/csh?context=roles-in-sow\" target=\"_blank\" rel=\"noopener noreferrer\">     product documentation   </a>    for more details. </p>","comment":""},{"message":"Major incident managers","comment":""},{"message":"Designate users as MI managers in your ServiceNow instance. An MI Manager is responsible for managing a major incident and helping drive it to resolution with the help of responders.","comment":""},{"message":"Major Incident Management","comment":""},{"message":"Email notifications","comment":""},{"message":"Communications are made up of two parts: templates and tasks. Configure both to ensure the right stakeholders are notified at appropriate times during a major incident.","comment":""},{"message":"<span style=\"background-color: RGB(var(--now-color_grouped--purple-0, #EFDEFA)); border-radius: 2px; padding: 0px 4px 2px 2px;\">No rule configured</span>","comment":""},{"message":"<span style=\"background-color: RGB(var(--now-color_grouped--purple-0, #EFDEFA));border-radius: 2px; padding: 0px 4px 2px 2px;\">No user assigned the Manager role</span>","comment":""}]'
