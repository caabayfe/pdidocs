required_translations: '[{"message":"A playbook can help drive a major incident to faster resolution as it will guide users through the major incident management process, making sure each step is followed along the way.","comment":""},{"message":"Search","comment":""},{"message":"","comment":""},{"message":"Major Incident Management","comment":""},{"message":"Playbooks","comment":""},{"message":"<p>We recommend the out of the box playbooks shown below for MIM to all our customers. You can directly assign these playbooks to MIM or create a copy and then assign the copy to MIM</p>","comment":""},{"message":"${item.label}","comment":""},{"message":"Playbook Card Repeater","comment":""},{"message":"<p>No playbook assigned to MIM</p>","comment":""},{"message":"Status","comment":""},{"message":"Updated","comment":""},{"message":"<p>Select and assign playbooks for major incidents.</p> ","comment":""},{"message":"Assigned playbooks","comment":""},{"message":"Create new playbook","comment":""},{"message":"<p>You can create a new playbook or clone an existing one in  <a href=\"/now/process/home\" style=\"text-decoration: underline; color: RGB(var(--now-text-link--primary--color, var(--now-color--secondary-1,1,119,142)));\" target=\"_blank\">Process Automation Designer<now-icon class=\"now-text-link-icon now-m-inline-start--xxs\" style=\"margin-left: 0.3rem; color: RGB(var(--now-text-link--primary--color, var(--now-color--secondary-1,1,119,142)));\" icon=\"open-link-fill\" dir=\"ltr\"></now-icon></a></p><p>Once done, come back to SOW Admin Center and assign the playbook to MIM.</p>","comment":""},{"message":"<p>Select and assign playbooks from the list of available playbooks. You can also assign the recommended playbooks directly. </p>","comment":""},{"message":"Confirm","comment":""},{"message":"<p style=\"margin-bottom: 0px; margin-top: 0.25rem;\">Only the Active playbooks with Published status can be assigned to MIM. Other playbooks will be not be assigned.</p>","comment":""},{"message":"Playbooks assigned to MIM","comment":""},{"message":"Assign","comment":""},{"message":"Assign playbook","comment":""},{"message":"Available playbooks","comment":""},{"message":"View details","comment":""},{"message":"Assign to MIM","comment":""},{"message":"Recommended Playbooks","comment":""},{"message":"${item.activeStatus}","comment":""}]'
