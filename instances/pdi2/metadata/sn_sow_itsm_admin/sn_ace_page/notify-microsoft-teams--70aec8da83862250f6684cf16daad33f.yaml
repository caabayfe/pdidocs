required_translations: '[{"message":"ServiceNow provides two setup options for the Notify Connector for Microsoft Teams. Ensure that you review the following information to understand the key differences between these options.","comment":""},{"message":"","comment":""},{"message":"<ol><li>This setup is provided by ServiceNow, allowing you to consume an Azure Enterprise application that we recommend. This application is pre-configured with all the necessary configurations and permissions, so the customer only needs to authorize it for usage. This approach is relatively easier to set up, as it involves fewer manual steps, which can often be error-prone. By using this pre-configured app, you can streamline the setup process and reduce the risk of configuration issues.</li><br><li>In order to use this mode of setup, you are advised to obtain at least two Azure tenants as this mode has a limitation of mapping one Microsoft Azure Tenant to one ServiceNow instance. One tenant should be reserved for testing in lower environments, while the other should be designated for production use. For more information, read <a href=\"https://www.servicenow.com/docs/csh?context=setup-multi-tenant\" target=\"_blank\">this</a> on the ServiceNow docs.</li></ol>","comment":""},{"message":"Notify for Microsoft Teams Setup","comment":""},{"message":"<ol><li>This setup involves more manual steps, but it is preferred by some customers because it offers greater granular control and visibility over the app creation process. In this setup, you need to manually create and maintain the app or bot on Azure, as well as add each permission individually. This process is more challenging due to the increased number of manual steps involved.</li><br><li>When a user operates multiple ServiceNow instances, including both lower environments and a production environment, but has only a single Microsoft Azure tenant, the Self Configured option provides the necessary flexibility. This allows the customer to create multiple Azure applications for each ServiceNow instance directly from the Azure portal.  For more information, read <a href=\"https://www.servicenow.com/docs/csh?context=setup-single-tenant\" target=\"_blank\">this</a> on the ServiceNow docs.</li></ol>","comment":""},{"message":"Following are API permissions required for ServiceNow integration with Microsoft Teams for Notify connector and Meeting Extensions. <br> <ul><li>API Permissions for <b>Notify connector for Microsoft Teams</b><br><br><ol><li><b>Users.Read.All (Application) - </b>Allows the app to get the details of the users, such as their Azure ID, which is required to start the meeting.</li> <li><b>OnlineMeetings.ReadWrite.All (Application) - </b>Permission required to initiate an online meeting.</li> <li><b>Calls.InitiateGroupCall.All (Application) - </b>Permission required to invite multiple participants to a call on behalf of a Bot.</li> <li><b>Calls.JoinGroupCall.All (Application) - </b>Permission allows the bot to join the meeting as a participant. In order to read call details, the bot must first be a meeting participant.</li> <li><b>Calls.JoinGroupCallAsGuest.All (Application) - </b>Allows the app to anonymously join group calls and scheduled meetings in your organization, without a signed-in user. The app will be joined as a guest to meetings in your tenant.</li></ol></li> <br><li>API Permissions for <b>Meeting Extensions</b><br><br><ol><li><b>TeamsAppInstallation.ReadWriteForChat.All (Application) - </b>Permission required to add our app to an online meeting, as part of Meeting Extensibility.</li>  <li><b>TeamsTab.ReadWriteForChat.All (Application) - </b>Permission allows the app to open a tab with incident details within a meeting as part of Meeting Extensibility. </li></ol></li></ul>","comment":""},{"message":"Configure","comment":""},{"message":"Configure Pre-published apps","comment":""}]'
