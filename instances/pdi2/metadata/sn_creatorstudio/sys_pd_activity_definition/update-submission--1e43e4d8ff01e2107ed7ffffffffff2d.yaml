  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Description</b> - A description about the task to be created</li>
  <li><b>Fields to update</b> -  Name of the fields to be updated in csv format (visible only to admins)</li>
  <li><b>Priority</b> -Urgency of completion about the task to be updated </li>
  <li><b>Record</b> - Record to be updated (visible only to admins)</li>
  <li><b>Short description</b> - A brief description about the task to be created</li>
  <li><b>State</b> -  Value of the state of the task</li>
  <li><b>Table</b> - Table name of the record (visible only to admins)</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Record Updated</b> - True/False</li>
  <li><b>Message</b> - Output message of the activity</li>
