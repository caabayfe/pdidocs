name: Request App Schema
namespace: requestApp
paths: AgentRole:label,AgentRole:sysId,ApplicationPaginated:applicationsCount,ApplicationPaginated:pagination,ApplicationPaginated:results,ApplicationsCount:totalAppCount,ApplicationsCount:totalBookmarkedAppCount,ApplicationsCount:totalOwnedAppCount,ApplicationsCount:totalSharedAppCount,Applicaton:canRead,Applicaton:color,Applicaton:created,Applicaton:createdBy,Applicaton:description,Applicaton:icon,Applicaton:lastAccessed,Applicaton:name,Applicaton:sysId,Created:displayValue,Created:value,Error:errorType,Error:message,Error:scopeId,Error:sysId,Error:tableName,LastAccessed:displayValue,LastAccessed:value,Mutation:createNewRequestAppRequest,Mutation:prepareForDeletion,Mutation:updateRequestApp,NewRequestAppRequest:sysId,Pagination:currentPage,Pagination:pageSize,Pagination:totalPageCount,Pagination:totalRecordCount,ProcessDefinition:active,ProcessDefinition:designerState,ProcessDefinition:label,ProcessDefinition:status,ProcessDefinition:sysId,Query:getApplications,Query:getRequestApp,RecordProducer:name,RecordProducer:sysId,RequestApp:agentRoles,RequestApp:color,RequestApp:createdBy,RequestApp:createdOn,RequestApp:description,RequestApp:icon,RequestApp:isDeleting,RequestApp:logo,RequestApp:name,RequestApp:processes,RequestApp:requestTable,RequestApp:requestTableInfo,RequestApp:requestTableLabel,RequestApp:scope,RequestApp:scopeId,RequestApp:services,RequestApp:sysId,RequestApp:version,RequestTableInfo:canRead,RequestTableInfo:scopeMatchesApp,RequestTableInfo:supportsRequestTypeTriggerCondition,ScReference:displayValue,ScReference:value,Service:active,Service:formImageUrl,Service:isCheckedOut,Service:name,Service:publishedRef,Service:requestTable,Service:scopeId,Service:state,Service:stateValue,Service:sysId
requires_acl_authorization: 'true'
requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	getRequestApp(scopeId: String!, filterConditions: RequestAppQueryFilterConditions): GetRequestAppResult
  	getApplications(payload: AppRequestPayload!, isAppCountRequired: Boolean): GetApplications
  }

  type Mutation {
  	createNewRequestAppRequest(payload: CreateNewRequestAppRequestPayload!): GetNewRequestAppRequestResult
  	updateRequestApp(payload: UpdateRequestAppPayload!): UpdateRequestAppResult
  	prepareForDeletion(payload: PrepareForDeletionPayload!): PrepareForDeletionResult
  }

  # Resolver result types
  union GetRequestAppResult = RequestApp | Error
  union GetServiceResult = Service | Error
  union GetProcessResult = ProcessDefinition | Error
  union GetNewRequestAppRequestResult = NewRequestAppRequest | Error
  union GetApplications = ApplicationPaginated | Error
  union UpdateRequestAppResult = RequestApp | Error
  union PrepareForDeletionResult = RequestApp | Error

  enum SortOrder {
  	ASC
  	DESC
  }

  enum Filter {
  	ALL,
  	SHARED,
  	OWNED,
  	BOOKMARKS
  }

  input RequestAppQueryFilterConditions {
  	services: String
  	processes: String
  }

  input CreateNewRequestAppRequestPayload {
  	name: String!
  	description: String!
  	additionalComments: String
  	url: String!
  }

  input AppRequestPayload {
  	sortField: String
  	sortOrder: SortOrder
  	currentPage: Int
  	pageSize: Int
  	filter: Filter
  	searchProperties: SearchProperties
  }

  input UpdateRequestAppPayload {
  	sysId: String!
  	name: String
  	description: String
  	icon: String
  	color: String
  }

  input PrepareForDeletionPayload {
  	sysId: String!
  }

  type RequestApp {
  	sysId: String
  	name: String
  	description: String
  	logo: String
  	icon: String
  	color: String
  	version: String
  	scopeId: String
  	scope: String
  	createdOn: String 
  	createdBy: String 
  	requestTable: String
  	requestTableLabel: String
  	requestTableInfo: RequestTableInfo
  	agentRoles: [AgentRole]
  	isDeleting: Boolean
  	services: [GetServiceResult] @source(value: "queryParams")
  	processes: [GetProcessResult] @source(value: "queryParams")
  }

  type RequestTableInfo {
  	supportsRequestTypeTriggerCondition: Boolean
  	canRead: Boolean
  	scopeMatchesApp: Boolean
  }

  type ScReference {
  	value: String! @source(value: "sys_id.value")
  	displayValue: String @source(value: "title.display_value")
  }

  type RecordProducer {
  	sysId: String @source(value: "sysId")
  	name: String @source(value: "name")
  }

  type ProcessDefinition {
  	sysId: String
  	label: String
  	active: String
  	status: String
  	designerState: String
  }

  type Service {
  	sysId: String
  	name: String
  	scopeId: String
  	state: String
  	stateValue: String
  	active: String
  	isCheckedOut: String
  	requestTable: String
  	formImageUrl: String
  	publishedRef: String
  }

  type NewRequestAppRequest {
  	sysId: String
  }

  type Applicaton {
  	name: String
  	description: String
  	icon: String
  	color: String
  	created: Created
  	createdBy: String
  	canRead: Boolean
  	sysId: String
  	lastAccessed: LastAccessed
  }

  type Created {
  	value: String
  	displayValue: String
  }

  type LastAccessed {
  	value: String
  	displayValue: String 
  }

  type Pagination {
  	totalRecordCount: Int
  	totalPageCount: Int
  	currentPage: Int
  	pageSize: Int
  }

  type ApplicationPaginated {
  	results: [Applicaton]
  	pagination: Pagination
  	applicationsCount: ApplicationsCount
  }

  type ApplicationsCount {
  	totalAppCount:Int
  	totalOwnedAppCount:Int
  	totalSharedAppCount:Int
  	totalBookmarkedAppCount: Int
  }

  type AgentRole {
  	sysId: ID!
  	label: String
  }

  # Error data types
  type Error {
  	errorType: String!
  	message: String!
  	tableName: String
  	sysId: String
  	scopeId: String
  }

  input SearchProperties {
  	keyword: String
  }
sys_name: Request App Schema
sys_policy: read
type_names: GetApplications,GetNewRequestAppRequestResult,GetProcessResult,GetRequestAppResult,GetServiceResult,PrepareForDeletionResult,UpdateRequestAppResult
