  value: |-
    (function execute(inputs, outputs) {

        var workspaceConfigService = new sn_creatorstudio.WorkspaceConfigurationService();

        //Create default sys_ui_list in Default view
        ListService.createUIList(inputs.requestTableName);

        //Create Category
        var categoryListId = workspaceConfigService.createListCategory(inputs.appName);

        //Create Applicability
        var applicability = workspaceConfigService.createListApplicability(inputs.appName, inputs.appSysId);

        //Create Lists with applicability m2m records
        workspaceConfigService.createListMenuItems(categoryListId, inputs.requestTableName, applicability);

        //Create PAR dashboard records
        workspaceConfigService.createParDashboard(inputs.appName, inputs.requestTableName, inputs.agentRoleSysId);

    })(inputs, outputs);
