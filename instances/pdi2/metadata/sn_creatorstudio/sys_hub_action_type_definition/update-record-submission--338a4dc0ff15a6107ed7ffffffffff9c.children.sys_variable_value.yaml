  value: |-
    (function execute(inputs, outputs) {
        /**
         * Get field choices for a table and field
         * @param {string} tableName
         * @param {string} fieldName
         * @returns {Array<string>} - Valid choice values
         */
        const getFieldChoices = (tableName, fieldName) => {
            const choices = new GlideChoiceList();
            const choiceList = choices.getChoiceList(tableName, fieldName);

            let validChoices = [];
            for (let i = 0; i < choiceList.getSize(); i++) {
                validChoices.push(choiceList.getChoice(i).getValue());
            }
            return validChoices;
        };

        /**
         * Validates that a field value is non-empty and among valid choices
         * Assumes caller has already checked that fieldName is in mustValidateFields
         * @param {string} tableName
         * @param {string} fieldName
         * @param {string} fieldValue
         * @throws {Error} if validation fails
         */
        const validateChoiceField = (tableName, fieldName, fieldValue) => {
            if (!fieldValue) {
                throw new Error(gs.getMessage(
                    "The '{0}' field cannot be empty.", [fieldName]
                ));
            }
            
            const validChoices = getFieldChoices(tableName, fieldName);

            if (!validChoices.includes(fieldValue)) {
                throw new Error(gs.getMessage(
                    "The '{0}' field value is invalid.", [fieldName]
                ));
            }
        };


        try {
            const { table: tableName, record_id: recordId, fields_to_update: fieldsToUpdateCsv } = inputs;

            if (!tableName || !recordId) {
                throw new Error(gs.getMessage('Table name or record ID is missing.'));
            }

            const record = new GlideRecordSecure(tableName);
            if (!record.get(recordId)) {
                throw new Error(gs.getMessage(
                    'Record with sys_id [{0}] not found in table [{1}].',
                    [recordId, tableName]
                ));
            }

            if (!fieldsToUpdateCsv?.trim()) {
                outputs.status = 200;
                outputs.recordupdated = false;
                outputs.message = gs.getMessage('No fields specified for update.');
                return;
            }

            const fieldsToUpdate = fieldsToUpdateCsv.split(',').map(field => field.trim());
            const mustValidateFields = ['state', 'priority'];
            const expectedFields = ['state', 'priority', 'short_description', 'description'];

            for (const fieldName of fieldsToUpdate) {
                if (!expectedFields.includes(fieldName) || !record.isValidField(fieldName)) {
                    throw new Error(gs.getMessage(
                        "Invalid field specified for update: '{0}'.", [fieldName]
                    ));
                }

                const fieldValue = inputs[fieldName] || "";

                if (mustValidateFields.includes(fieldName)) {
                    validateChoiceField(tableName, fieldName, fieldValue);
                }

                record.setValue(fieldName, fieldValue);
            }

            const updated = record.update();
            outputs.status = 200;
            outputs.recordupdated = Boolean(updated);
            outputs.message = updated
                ? gs.getMessage('Record updated successfully.')
                : gs.getMessage('Record update failed.');

        } catch (error) {
            outputs.status = 400;
            outputs.recordupdated = false;
            outputs.message = gs.getMessage(
                'Error during record update: {0}', [error.message]
            );
        }

    })(inputs, outputs);
