<div class="notifications-bell-container" ng-if="c.data.notificationConfig.enable_bell_icon">
  <button class="btn btn-default btn-bell" ng-class="{'show-count-label': c.data.notificationConfig.enable_badge_count, 'show-no-label': c.data.notificationsBadgeCount<=0}"
          ng-click="c.toggleNotificationsTray()" aria-label="{{notificationAriaLabel}}"  data-toggle="tooltip" data-placement="bottom" data-title="${Notifications}" tabindex="0" ng-keydown="c.escapeClose($event)">
    <i class="fa fa-bell" aria-hidden="true"></i>
    <span ng-if="c.data.notificationsBadgeCount>0 && c.data.notificationConfig.enable_badge_count" class="count-badge" tabindex="-1" > 
      {{c.data.notificationsBadgeCount > 9 ? '9+' : c.data.notificationsBadgeCount}}
    </span>
    <span ng-if="c.data.notificationsBadgeCount>0 && !c.data.notificationConfig.enable_badge_count" class="countless-badge" tabindex='-1'><!--indicator-->
    </span>
  </button>
  <!-- Live region to announce when the tray opens -->
  <div aria-live="polite" aria-atomic="true" class="notification-button-toggle sr-only"> 
  	<!-- initially blank --> 
  </div>
 
  <div ng-if="isNotificationsTrayOpen" class="notifications-tray">
  	<sp-widget class="notifications-tray-widget" widget="c.data.notificationsTrayWidget"></sp-widget>
  </div>
</div>
