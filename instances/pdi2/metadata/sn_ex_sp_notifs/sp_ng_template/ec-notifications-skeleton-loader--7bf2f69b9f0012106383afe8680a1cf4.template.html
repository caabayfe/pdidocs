<style>
    .skeleton-item {
        --color-dark: #575F6E;
        --color-light: #BDC2CB;
        display: flex;
        width: 100%;
        border-radius: 4px;
        row-gap:3%;
        justify-content: space-between;
        align-items: flex-start;
        padding: 1.6rem;
        padding-left: 3.2rem;
      	height: min-content;
      	animation: none !important;
	background-color: #ffffff;
    }
    
    .skeleton-item-icon {
        flex: 0 0 10%; 
        background-color: var(--color-light);
        animation: shimmer 1.5s ease-in-out infinite;
        min-width: 32px;
        min-height: 32px;
        max-width: 32px;
        max-height: 32px;
        border-radius: 50%;
    }
    
    .skeleton-item-content {
        display: flex;
        flex: 0 0 72%; 
        row-gap: 8px;
        flex-direction: column;
        justify-content: space-evenly;
        flex-wrap: nowrap;
        align-items: center;
        
        .rectangle {
            animation: shimmer 1.5s ease-in-out infinite;
            background-color: var(--color-light);
            border-radius: 8px;
            height: 16px;
            width: 100%;
        }
    }
    
    
    .skeleton-item-action {
        border-radius: 8px;
        height: 16px;
        flex: 0 0 12%; 
        background-color: var(--color-light);
        animation: shimmer 1.5s ease-in-out infinite;
    }

</style>

<div class="skeleton-item">
    <div ng-class="{'skeleton-item-icon': !isRTL, 'skeleton-item-action': isRTL }"></div>
    <div class="skeleton-item-content">
        <div class="rectangle"></div>
        <div class="rectangle"></div>
    </div>
    <div ng-class="{'skeleton-item-icon': isRTL, 'skeleton-item-action': !isRTL }"></div>
</div>
