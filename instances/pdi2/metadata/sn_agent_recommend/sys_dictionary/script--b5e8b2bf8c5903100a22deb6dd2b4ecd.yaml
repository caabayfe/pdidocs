default_value: |-
  (function(MLResults) {
    /**
     * MLResults comes from Agent Assist Recommendation, it is a list of record IDs
     * This script determines whether MLResults match certain requirement. If so, pass to Trend Definition. 
     * The return value should be an object containing 3 elements, "abort", "recordsForTrend" and "varForMsg"
     * 
     * return {
     *     abort: false,    // true or false
     *     recordsForTrend: [id1, id2],    // a list of IDs of records which match requirement
     *     varsForMsg: {    // a list of variables which correspond to the placeholders in Recommendation message.
     *         count: MLResult.length
     *     }
     * };
     */
    
    return {
     abort: false,
     recordsForTrend: MLResults,
     varForMsg: {
      count: MLResults.length
     }
    };
   })(MLResults);
