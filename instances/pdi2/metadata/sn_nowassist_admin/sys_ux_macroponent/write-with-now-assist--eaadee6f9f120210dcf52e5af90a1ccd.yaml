required_translations: |-
  [ {
    "message" : "<div>\n<div>To use the Now Assist context menu, first check the skills tab to see which skills are enabled. You'll need to activate a skill before you can access its features through the context menu</div>\n</div>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>A new Now Assist context menu configuration will be created, copying all settings from the existing configuration.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>The Now Assist menu uses AI to help agents summarize, create, and edit content in emails, chats, articles, and risk explanations. It offers content adjustments for length, tone, and refinement, boosting productivity and communication.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>You can configure how you want the Now Assist context menu to appear and behave in your products using Now Assist skills.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<ul>\n<li><strong>Get suggestions:</strong> Generate a first draft or response suggestion when Now Assist has context.</li>\n<li><strong>Elaborate:</strong> Expand your content with more details after an initial draft by Now Assist or an agent.</li>\n<li><strong>Shorten:</strong> Reduce your text while maintaining the original meaning after an initial draft by Now Assist or an agent.</li>\n<li><strong>Adjust tone:</strong> Modify your content's tone to casual, formal, or sympathetic.</li>\n<li><strong>Add Skills: </strong>Associate custom skills created through Now Assist Skill kit as actions in the Now Assist context menu.</li>\n</ul>",
    "code" : "",
    "comment" : ""
