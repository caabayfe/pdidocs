  }, {
    "message" : "<p>When you select Azure Open AI as the preferred provider for this skill, your data processing location for GenAI requests will change from Asia-Pacific &amp; Japan&nbsp;(APJ) to a global location. Your ServiceNow instance location will remain APJ, and only GenAI processing is affected.</p>\n<p><br>This skill is powered by a third-party GenAI model offered under <a href=\"https://learn.microsoft.com/en-us/azure/ai-services/openai/how-to/deployment-types#global-standard\" target=\"_blank\" rel=\"noopener\"> Global Standard deployment.<img style=\"margin-left: 2px;\" title=\"open-link-right-fill.png\" src=\"images/open-link-right-fill.png\" width=\"12\" height=\"12\"></a>&nbsp;GenAI processing leverages Microsoft Azure&rsquo;s global infrastructure to dynamically route traffic to the best available data center for each request. This skill's processing location may differ from the data center location your organization chose for its ServiceNow deployment.</p>\n<p>Please consider your organization&rsquo;s data policies before enabling the skill.</p>\n<p>By selecting &ldquo;I agree&rdquo;, you agree to the terms and conditions described above.&nbsp;</p>",
