required_translations: '[{"message":"Included in license","comment":""},{"message":"|","comment":""},{"message":"Turn on","comment":""},{"message":"Cancel","comment":""},{"message":"FAQ resource","comment":""},{"message":"Settings","comment":""},{"message":"Success!","comment":""},{"message":"Now Assist panel is turned on for your users.","comment":""},{"message":"Turn on Now Assist panel","comment":""},{"message":"Business Impact: Productivity","comment":""},{"message":"Unavailable Icon","comment":""},{"message":"<br />","comment":""},{"message":"Turn off","comment":""},{"message":"Summary","comment":""},{"message":"Manage","comment":""},{"message":"Now Assist panel","comment":""},{"message":"Toggle Voice Input","comment":""},{"message":"You can now use generative AI skills in the Now Assist panel. Activate skills with guided setups in the Now Assist Features page. You can configure and customize more settings for the panel in <a href=\"now/conversation/settings/assistants\" target=\"_blank\" style=\"text-decoration: none;\">Assistants page in CI Admin console.</a>","comment":""},{"message":"Helpful resources","comment":""},{"message":"Unavailable","comment":""},{"message":"FAQs","comment":""},{"message":"Turn off?","comment":""},{"message":"Now Assist panel is now on","comment":""},{"message":"Details","comment":""},{"message":"<br />Manage settings for Now Assist panel across Agents and creators, along with all other assistants from the <a href=\"now/conversation/settings/assistants\" target=\"_blank\" style=\"text-decoration: none;\" rel=\"noopener noreferrer nofollow\">CI Admin console.</a>","comment":""},{"message":"Use case examples","comment":""},{"message":"<p>This will allow users with the necessary roles to use generative AI skills in the Now Assist panel. You can activate skills and choose Now Assist panel as a display option. You can also configure optional settings for the panel.</p>","comment":""},{"message":"<span>Enable voice input to access Now Assist skills in the Now Assist panel with a microphone.</span>","comment":""},{"message":"LLM Service: ","comment":""},{"message":"Product Touchpoint: Next Experience Unified Navigation","comment":""},{"message":"By turning off the Now Assist panel, users won''t be able to access generative AI skills in the sidebar across the platform. The option in skill guided setups to display skills in the Now Assist panel will be inaccessible. Any additional settings you have configured for the panel will also be turned off. Users will still have access to skills that use UI actions.","comment":""},{"message":"<span>Configure optional features for the Now Assist panel.</span>","comment":""},{"message":"<p>Now Assist panel can be accessed globally via the sparkle icon in the Next Experience Unified Navigation. The panel understands where users are in the application and can personalize responses accordingly, streamlining the completion of tasks. Agents can leverage the panel to summarize a record, chat, or generate resolution notes. Access globally, get work done locally.</p>","comment":""},{"message":"Requires product plugin install","comment":""},{"message":"You must turn on Now Assist panel before you can enable voice input.","comment":""},{"message":"Unavailable Popover Text","comment":""},{"message":"<p>Chat with AI-powered Now Assist to get help with your work—summarize, draft, and create what you need. <br/>Now Assist panel is globally accessible to all users in your org based on their designated permissions.<br/> Now Assist panel can be used for both Agents and Creators.</p>","comment":""},{"message":"Voice Input","comment":""}]'
