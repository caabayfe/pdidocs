required_translations: |-
  [
      {
          "message": "What is data sharing?"
      },
      {
          "message": "AI algorithms require data to identify patterns and learn. Without data, AI models cannot make predictions or generate useful content. When you use generative AI capabilities across the Now Platform, ServiceNow collects and uses that data to improve our models."
      },
      {
          "message": "Why does ServiceNow want to use my data?"
      },
      {
          "message": "Sharing your data enables ServiceNow to enhance the user experience, tailor products to your business needs, and improve model accuracy. Your input can help AI models learn from real-world scenarios, allowing for smarter and more contextually aware interactions."
      },
      {
          "message": "What data is ServiceNow using?"
      },
      {
          "message": "ServiceNow uses the inputs, outputs, and edits to the outputs of the application. We may also collect data used or generated in connection with the generative AI application, such as the script or record in which the application is called or used."
      },
      {
          "message": "How does ServiceNow protect my data privacy?"
      },
      {
          "message": "Personal identifiable information (PII) and sensitive data are anonymized and cleansed from any data collected. ServiceNow will never resell or share your data. For more information, reach out to the Now Support team or your Account Executive."
      },
      {
          "message": "How do I opt back in to data sharing?"
      },
      {
          "message": "You must work with the Now Support team or your Account Executive if you wish to opt back in to data sharing."
      }
  ]
