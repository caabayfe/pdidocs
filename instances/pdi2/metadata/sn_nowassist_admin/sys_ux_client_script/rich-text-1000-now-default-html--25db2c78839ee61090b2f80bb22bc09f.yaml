      "message": "<p>When you select Global routing for Large Language Model (LLM) and Small Language Model (SLM) requests,<br>your data processing location will change from regional to a global data center.<br>Your ServiceNow instance location will continue to be regional.<br><br>AI systems powered by third-party Gen AI models may leverage their global infrastructure to dynamically route traffic to the best available data center for each request.<br>The AI system&rsquo;s processing location may differ from the data center location your organization chose for its ServiceNow deployment.<br><br><strong>Note:</strong> AI systems include Out-of-the-Box (OOB) skills, agents, agentic workflows, and custom skills, agents, and agentic workflows.<br><br>Make sure to review your organization&rsquo;s data policies before you enable the Global routing option.<br><br><strong>Global standard deployment help</strong><br>{0}<br></p>"
