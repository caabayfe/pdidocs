app_dependencies: |-
  Quebec or later release.
  Required Plugins
  ServiceNow IntegrationHub Runtime (com.glide.hub.integration.runtime)
  ServiceNow IntegrationHub Action Step - REST (com.glide.hub.action_step.rest)
  ServiceNow IntegrationHub Action Template - Data Stream (com.glide.hub.action_type.datastream)
  Legacy IntegrationHub Usage Dashboard (com.glide.hub.usage.dashboard)
  To integrate with ServiceNow ITBM Agile 2.0, the Agile Development 2.0 (com.snc.sdlc.agile.2.0) plugin must be installed and activated.
  To integrate with Jenkins the ServiceNow DevOps plugin for Jenkins is required
  From store: (https://store.servicenow.com/sn_appstore_store.do#!/store/application/9a304cc7db185810df5ff3251d9619f3) 
  From market place: https://plugins.jenkins.io/servicenow-devops/
  To integrate with Azure DevOps, the ServiceNow DevOps extension on Visual Studio Marketplace (https://marketplace.visualstudio.com/items?itemName=ServiceNow.vss-services-servicenow-devops) is required.
  App spokes
  Jenkins V2 Spoke – 1.1.2
  Jira Spoke –  3.1.1
  GitHub Spoke – 2.2.2
