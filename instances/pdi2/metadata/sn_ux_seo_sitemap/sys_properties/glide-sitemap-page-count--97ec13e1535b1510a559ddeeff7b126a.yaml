description: |-
  This property is used to configure the sitemap page count. The default value will be 750 and the minimum and maximum values are 1 and 5000 respectively. If the given value
  is not within this range then 750 will be considered by default. If the instance supports multiple languages and the hreflang information is configured, then our recommendation is to limit max. page count to 750.
