required_translations: '[{"message":"<p>Success Dashboard includes and leverages instrumentation that measures the successful usage of Knowledge Articles, Virtual Agent and Catalog Items that helps the employee in self-serving their service needs. The out-of-the box instrumentation that is used are:</p>\r\n<ul style=\"list-style-type: square; list-style-position: inside;\"><li>Deflection using Knowledge Articles</li><li>Deflection using Virtual Agent</li><li>Fulfilment Automation Level for Catalog Items</li></ul>","comment":""},{"message":"","comment":""},{"message":"What are the KPIs available with Success Dashboard indicators?","comment":""},{"message":"<h2>Helpful Resources</h2>","comment":""},{"message":"Explore","comment":""},{"message":"ITSM Success Dashboard","comment":""},{"message":"Configure KPIs","comment":""},{"message":"What are the various product capabilities tracked on Success Dashboard?","comment":""},{"message":"Configure","comment":""},{"message":"Key performance indicators (KPIs)","comment":""},{"message":"Manage the KPIs and their contributing indicators to be displayed on the Success Dashboard.","comment":""},{"message":"<h2>Success Dashboard Overview</h2>","comment":""},{"message":"When do we see data on the dashboard?","comment":""},{"message":"<p></p>","comment":""},{"message":"<div>Process Mining is a for-fee product in ITSM Enterprise subscription<br />As an analyst, you can:\n<ul style=\"list-style-type: disc; list-style-position: inside;\"><li>Proactively assess and improve ITSM, CSM, Financial Services Operations, and HR Service Delivery processes.​ ​</li><li>Accelerate digital transformation​. Find areas of improvement and automation based on data and your best practice content.</li></ul>\n</div>\n<div>As a process owner, you can:\n<ul style=\"list-style-type: disc; list-style-position: inside;\"><li>Get visibility into processes and start collaboration.​</li><li>Assess process bottlenecks, find areas of weakness, and find potential areas to optimize.​</li></ul>\n</div>","comment":""},{"message":"<p><strong><span style=\"font-size: 14pt;\">Success Dashboard Overview</span></strong></p>\r\n<p> </p>\r\n<p><span style=\"font-size: 10pt;\">This short video will give you an introduction and overview of Success Dashboard</span></p>","comment":""},{"message":"<p>As part of our framework, there is provision for you to add, remove and update the contributing indicators. Along with customization to KPIs, you can update the contextual information associated to the KPIs and the Time Savings that is realized using the ServiceNow Products.</p>","comment":""},{"message":"<h2>Hello, World</h2>","comment":""},{"message":"Can we have a custom instrumentation?","comment":""},{"message":"What are the benefits of Process Mining?","comment":""},{"message":"<p>Success Dashboard indicators comes with multiple prescribed KPIs that measure value realized by using ServiceNow products like <strong>Self-solved Percentage</strong>, <strong>Call Deflection Percentage</strong>, <strong>% structured tickets completed</strong>, and <strong>Productivity Moments</strong>. Along with product performance, the Success Dashboard indicators help you measure quality of your service metrics like <strong>Customer Satisfaction</strong>, <strong>Mean Time to Resolve</strong>, <strong>% Breached SLA</strong>, and <strong>% First Assignment Resolution</strong>.</p>","comment":""},{"message":"<p>Data for KPIs dependent on instrumentation such as, <strong>Self-solved using Knowledge</strong>, <strong>Self-solved using Virtual Agent</strong>, <strong>Issue Auto Resolution</strong>, and <strong>VA Ticket Submissions </strong>would be ONLY  available from the day when instrumentations are added, and PA daily jobs starts (first run) collecting data. For the KPIs that aren’t dependent on the instrumentation, the data would be available when PA daily jobs starts (first run). For historical data, execute ‘historical data collection jobs’ available with base system to collect last two months’ data.</p>","comment":""},{"message":"Go to Success Dashboard","comment":""},{"message":"<p>You have a KPI hierarchy that tracks success across multiple products and channels in one product. Each KPI has following levels.</p>\n<ul style=\"list-style-type: square; list-style-position: inside;\"><li>Top level Primary Indicators<br /> \n<ul style=\"list-style-type: circle; list-style-position: inside;\"><li>Second level Primary Indicator<br /><br />\n<ul style=\"list-style-position: inside; list-style-type: disc;\"><li>Contributing Indicators (third level)</li></ul>\n</li></ul>\n</li></ul>\n<p>For more information, refer <a href=\"/api/now/v1/context_doc_url/itsm_success_dashboard\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">ITSM Success Dashboard indicators components.</a></p>","comment":""},{"message":"What are the customizations that we can do?","comment":""},{"message":"<h2>FAQs</h2>","comment":""},{"message":"What kind of instrumentation available with base system?","comment":""},{"message":"<p>Yes, Success Dashboard provides the flexibility to let you use in-house instrumentation that has been implemented. To use the custom instrumentation, Contributing Indicators must be tailored accordingly and registered to Success Dashboard. For more information, refer <a href=\"/api/now/v1/context_doc_url/configure-success-dashboards\" target=\"_blank\" rel=\"noopener noreferrer nofollow\">Configuring ITSM Success Dashboard indicators.</a></p>","comment":""},{"message":"Success Dashboard process workshop","comment":""},{"message":"Documentation","comment":""},{"message":"Self-service Analytics","comment":""},{"message":"Process Mining","comment":""},{"message":"ITSM Process Mining Content Pack","comment":""}]'
