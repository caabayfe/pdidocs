required_translations: |-
  [ {
    "message" : "<div>Process Mining is a for-fee product in ITSM Enterprise subscription<br />As an analyst, you can:\n<ul style=\"list-style-type: disc;\">\n<li>Proactively assess and improve ITSM,&nbsp;CSM,&nbsp;Financial Services Operations, and&nbsp;HR Service Delivery&nbsp;processes.​ ​</li>\n<li>Accelerate digital transformation​. Find areas of improvement and automation based on data and your best practice content.</li>\n</ul>\n</div>\n<div>As a process owner, you can:\n<ul style=\"list-style-type: disc;\">\n<li>Get visibility into processes and start collaboration.​</li>\n<li>Assess process bottlenecks, find areas of weakness, and find potential areas to optimize.​</li>\n</ul>\n</div>",
    "comment" : ""
  }, {
    "message" : "<p>As part of our framework, there is provision for you to add, remove and update the contributing indicators. Along with customization to KPIs, you can update the contextual information associated to the KPIs and the Time Savings that is realized using the ServiceNow Products.</p>",
    "comment" : ""
  }, {
    "message" : "<p>Data for KPIs dependent on instrumentation such as,&nbsp;<strong>Self-solved using Knowledge,&nbsp;Self-solved using Virtual Agent,&nbsp;Issue Auto Resolution, </strong>and<strong>&nbsp;VA Ticket Submissions</strong>&nbsp;would be ONLY &nbsp;available from the day when instrumentations are added, and PA daily jobs starts (first run) collecting data. For the KPIs that aren&rsquo;t dependent on the instrumentation, the data would be available when PA daily jobs starts (first run). For historical data, execute &lsquo;historical data collection jobs&rsquo; available with base system to collect last two months&rsquo; data.</p>",
    "comment" : ""
  }, {
    "message" : "<p>Success Dashboard includes and leverages instrumentation that measures the successful usage of Knowledge Articles, Virtual Agent and Catalog Items that helps the employee in self-serving their service needs. The out-of-the box instrumentation that is used are:</p>\n<ul>\n<li>Deflection using Knowledge Articles</li>\n<li>Deflection using Virtual Agent</li>\n<li>Fulfillment Automation Level for Catalog Items</li>\n</ul>",
    "comment" : ""
  }, {
    "message" : "<p>Success Dashboard indicators comes with multiple prescribed KPIs that measure value realized by using ServiceNow products like&nbsp;<strong>Self-solved Percentage,&nbsp;Call Deflection Percentage,&nbsp;% structured tickets completed, </strong>and<strong>&nbsp;Productivity Moments</strong>. Along with product performance, the Success Dashboard indicators help you measure quality of your service metrics like&nbsp;<strong>Customer Satisfaction,&nbsp;Mean Time to Resolve,&nbsp;% Breached SLA, and&nbsp;% First Assignment Resolution</strong></p>",
    "comment" : ""
  }, {
    "message" : "<p>Yes, Success Dashboard provides the flexibility to let you use in-house instrumentation that has been implemented. To use the custom instrumentation, Contributing Indicators must be tailored accordingly and registered to Success Dashboard. For more information, refer <a href=\"/api/now/v1/context_doc_url/configure-success-dashboards\" target=\"_blank\" rel=\"noopener\">Configuring ITSM Success Dashboard indicators.</a></p>",
    "comment" : ""
  }, {
    "message" : "<p>You have a KPI hierarchy that tracks success across multiple products and channels in one product. Each KPI has following levels.</p>\n<ul>\n<li>Top level Primary Indicators</li>\n<li>Second level Primary Indicators</li>\n<li>Contributing Indicators (third level)</li>\n</ul>\n<p>For more information, refer <a href=\"/api/now/v1/context_doc_url/itsm_success_dashboard\" target=\"_blank\" rel=\"noopener\">ITSM Success Dashboard indicators components.</a></p>",
    "comment" : ""
  }, {
