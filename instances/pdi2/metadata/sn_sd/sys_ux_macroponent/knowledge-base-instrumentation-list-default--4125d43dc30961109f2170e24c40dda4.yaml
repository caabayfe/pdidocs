required_translations: |-
  [ {
    "message" : "<p><span style=\"font-size: 12pt;\"><strong>What is knowledge deflection?</strong></span></p>\n<p><span style=\"font-size: 12pt;\">The&nbsp;Knowledge deflection enables admin to view the list of knowledge base articles that are read and no incidents are created in a 24 hour time interval by a user.&nbsp;This configuration is available in the base system.</span></p>\n<p><span style=\"font-size: 12pt;\">The knowledge base instrumentation also tracks the&nbsp;KB read pattern and the user pattern.</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 12pt;\"><strong>How would it reflect on dashboard?</strong></span></p>\n<p><span style=\"font-size: 12pt;\">The data is displayed on <strong>Self-Solved using Knowledge</strong> under <strong>Self-Solved percentage</strong> and on <strong>Self-solved </strong>KPI under <strong>Call Deflection percentage</strong> on the dashboard.</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-size: 12pt;\"><strong>How you can customize it?</strong></span></p>\n<p><span style=\"font-size: 12pt;\">You can modify the following</span></p>\n<ul type=\"disc\">\n<li style=\"font-size: 12pt;\"><span style=\"font-size: 12pt;\">Refresh window: The time to wait for incident creation before confirming a knowledge deflection</span></li>\n<li style=\"font-size: 12pt;\"><span style=\"font-size: 12pt;\">Knowledge bases considered for deflection</span></li>\n<li style=\"font-size: 12pt;\"><span style=\"font-size: 12pt;\">Users that this rule applies to (e.g. if you want to exclude your fulfillers, you can add this as a condition)</span></li>\n</ul>\n<p><span style=\"font-size: 12pt;\">Alternatively, you can have your own method of measuring such deflections using SSA or any other instrumentation.</span></p>",
    "comment" : ""
  }, {
    "message" : "<p><span style=\"font-size: 12pt;\">You can change configurations anytime later by selecting the deflection from within the table.</span></p>",
    "comment" : ""
  }, {
    "message" : "All Active Tasks",
    "comment" : ""
  }, {
    "message" : "Knowledge deflection",
    "comment" : ""
  } ]
