api_name: sn_sd.Fetch PO findings for SD KPIs
batch_exclude: 'false'
description: Fetches the PO insights for success dashboard KPIs.
mutates_server_data: 'false'
name: Fetch PO findings for SD KPIs
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project ID",
      "description": "PO Project ID",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: ID!) {
    GlidePromin_Query {
      Findings(projectId: $projectId) {
        id,
        message,
        createdOn,
        frequency,
        impactedKpis {
          id
        }, 
        avgDuration
      }
    }
  }
required_translations: |-
  [ {
    "message" : "PO Project ID",
    "comment" : ""
  }, {
    "message" : "Project ID",
    "comment" : ""
  } ]
