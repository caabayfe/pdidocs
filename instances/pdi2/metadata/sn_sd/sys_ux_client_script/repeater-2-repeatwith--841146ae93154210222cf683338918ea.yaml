required_translations: |-
  [
      {
          "message": "No, ServiceNow® Benchmarks is included with ITSM or ITOM license."
      },
      {
          "message": "Do customers need to pay for ServiceNow® Benchmarks?"
      },
      {
          "message": "Only designated roles within the organization have access to the organization's Benchmarks data. A customer cannot see another customer's ServiceNow® Benchmarks data. ServiceNow® Benchmarks is governed by the same security requirements as our customer instances."
      },
      {
          "message": "Is my ServiceNow® Benchmarks data secure? Who else can see my Benchmarks?"
      },
      {
          "message": "ServiceNow® Benchmarks KPIs are based on usage data. We take high-level usage data such as Number of Incidents or Number of Requests, anonymize it, aggregate and normalize it. With the Istanbul and later releases, ServiceNow® Benchmarks reports lives in your instance. Only users with specific roles are able to see the data specific to their instance."
      },
      {
          "message": "Is there any other security risk opting into ServiceNow® Benchmarks?"
      },
      {
          "message": "Anyone in your organization who has \"Benchmarks Admin\" or \"Benchmarks Viewer role\" can see the ServiceNow® Benchmarks reports."
      },
      {
          "message": "Who in my organization can see the ServiceNow® Benchmark data?"
      },
      {
          "message": "Yes, ServiceNow® Benchmarks is tightly integrated with Performance Analytics product and PA capabilities are used to collect ServiceNow® Benchmarks values and allow easy drill down and analysis in to your Instance data."
      },
      {
          "message": "Is ServiceNow® Benchmarks using Performance Analytics (PA)?"
      },
      {
          "message": "The ServiceNow® Performance Analytics engine collects the high-level usage count data from all customer instances. This collection happens on daily basis. This data is then anonymized and aggregated to create monthly global benchmark reports. This does not include any company data."
      },
      {
          "message": "Where does the data come from?"
      }
  ]
