name: Get translated FAQs string
preset: ''
required_translations: |-
  [
      {
          "message": "What is Process Mining?"
      },
      {
          "message": "Process Mining helps process owners to quickly analyze the bottlenecks in the existing process and optimize their business processes."
      },
      {
          "message": "How would it reflect on dashboard?"
      },
      {
          "message": "Process Mining will be displayed for all the indicators which have the contributing indicator mapped with Process Mining. It is displayed in the side panel under Insights section."
      },
      {
          "message": "How do we customize it?"
      },
      {
          "message": "You can customize any out of box record with the Process Mining project or you can create a new record  with the contributing indicator mapped with Process Mining."
      }
  ]
