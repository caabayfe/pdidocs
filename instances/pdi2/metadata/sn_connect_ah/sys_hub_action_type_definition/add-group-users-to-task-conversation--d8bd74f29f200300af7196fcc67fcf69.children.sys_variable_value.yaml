  value: |-
    (function execute(inputs, outputs) {
      var conversation = sn_connect.Conversation.get(inputs.task_id, inputs.task_table);

      var gr = new GlideRecord('sys_user_grmember');
      gr.addQuery('group', inputs.group_id);
      gr.query();
      while (gr.next())
        conversation.addSubscriber(gr.user);

    })(inputs, outputs);
