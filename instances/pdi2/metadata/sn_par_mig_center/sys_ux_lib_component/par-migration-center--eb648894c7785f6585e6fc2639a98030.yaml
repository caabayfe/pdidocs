m Analytics experience."},{"message":"{dashboardCount} dashboard(s) and {reportCount} report(s) have been successfully activated in Platform Analytics experience."},{"message":"{dashboardCount} dashboard(s) and {filterCount} filter(s) have been successfully activated in Platform Analytics experience."},{"message":"{dashboardCount} dashboard(s) and {widgetCount} widget(s) have been successfully activated in Platform Analytics experience."},{"message":"{reportCount} report(s) and {filterCount} filter(s) have been successfully activated in Platform Analytics experience."},{"message":"{reportCount} report(s) and {widgetCount} widget(s) have been successfully activated in Platform Analytics experience."},{"message":"{filterCount} filter(s) and {widgetCount} widget(s) have been successfully activated in Platform Analytics experience."},{"message":"{dashboardCount} dashboard(s), {reportCount} report(s), and {filterCount} filter(s) have been successfully activated in Platform Analytics experience."},{"message":"{dashboardCount} dashboard(s), {reportCount} report(s), and {widgetCount} widget(s) have been successfully activated in Platform Analytics experience."},{"message":"{dashboardCount} dashboard(s), {filterCount} filter(s), and {widgetCount} widget(s) have been successfully activated in Platform Analytics experience."},{"message":"{reportCount} report(s), {filterCount} filter(s), and {widgetCount} widget(s) have been successfully activated in Platform Analytics experience."},{"message":"{dashboardCount} dashboard(s), {reportCount} report(s), {filterCount} filter(s), and {widgetCount} widget(s) have been successfully activated in Platform Analytics experience."},{"message":"Items have been successfully activated in Platform Analytics experience."},{"message":"Go to Library"},{"message":"Go to Data visualizations Library"},{"message":"Go to Filters Library"},{"message":"Cancel"},{"message":"Successfully activated!"},{"message":"Migration complete"},{"message":"Migration is starting"},{"message":"Move all your content"},{"message":"Initializing all your analytics content"},{"message":"Take me to Dashboard Library"},{"message":"Activate all content"},{"message":"Deactivate"},{"message":"Migrating {0}% of content"},{"message":"Migration already running"},{"message":"Starting migration"},{"message":"View Logs"},{"message":"No Logs"},{"message":"View Logs ({0})"},{"message":"View"},{"message":"Dashboard"},{"message":"Owner"},{"message":"Created on"},{"message":"Migrated on"},{"message":"Current version"},{"message":"Core UI"},{"message":"Compare"},{"message":"Report"},{"message":"Created by user"},{"message":"Widget"},{"message":"Created by"},{"message":"Filter"},{"message":"Reports"},{"message":"PA widgets"},{"message":"Interactive filters"},{"message":"Content blocks"},{"message":"Other"},{"message":"Dashboards"},{"message":"PA Widgets with compatibility mode"},{"message":"Reports with compatibility mode"},{"message":"Fully migrated"},{"message":"Compatibility mode"},{"message":"Select See All Content to view all of your content in the Migration Center."},{"message":"New content available"},{"message":"Refresh"},{"message":"Search"},{"message":"Activate selected"},{"message":"No logs"},{"message":"There are no migration logs for this artifact."},{"message":"Back to migration center"},{"message":"Elevate your Analytics Experience"},{"message":"Discover new capabilities"},{"message":"Frequently asked questions"},{"message":"5 minutes"},{"message":"1 hour"},{"message":"1 hour "},{"message":"More information"},{"message":"Preparing to migrate your analytics content"},{"message":"Migrate"},{"message":"Set the field Do not migrate in bulk to true for any artifacts that you do not want to migrate."},{"message":"Dashboard count"},{"message":"Report count"},{"message":"Estimated time"},{"message":"Prevent users from creating Core UI analytics content during migration."},{"message":"Install the latest version of the migration center plugin to initiate the migration."},{"message":"Install plugins"},{"message":"Learn about Platform Analytics Experience"},{"message":"Dashboards with compatible:"},{"message":"Embedded dashboards"},{"message":"Visualizations"},{"message":"Migrated dashboard"},{"message":"Migrated report"},{"message":"Core UI dashboard"},{"message":"Core UI report"},{"message":"This dashboard will not be migrated to Platform Analytics experience because of their custom content. You can still view and edit them in Core UI."},{"message":"Info"},{"message":"Error"},{"message":"Warning"},{"message":"Description"},{"message":"Type"},{"message":"View Original Artifact"},{"message":"Not applicable"},{"message":"Click here to learn more"},{"message":"Elevate your analytics using Platform Analytics experiences"},{"message":"Step into a world of effortless insights and seamless data navigation with Next Experience Analytics, your gateway to a more intuitive and collaborative analytical journey. Unleash the power of dynamic charts that effortlessly weave together data from diverse sources, eliminating the need to juggle multiple reports and filters."},{"message":"Welcome to the Platform Analytics experience – Where Insights Flow Effortlessly."},{"message":"Centralized analytics experience"},{"message":"Simple, flexible tools enable you to create visualizations and filters from the context of your dashboards. Access Next Experience and Core UI content through the same navigation."},{"message":"Data-agnostic visualizations"},{"message":"Select from a single set of visualizations to represent any data source: tables, indicators, User Experience Analytics, and others. These visualizations have a modern look and feel. They support an ever-increasing number of styles and analytical options."},{"message":"Unified visualization designer"},{"message":"Use a single tool to build data visualizations from any data source. Create any data visualization in a designer that shows you the visualization as you configure it. Use visualizations as templates for similar visualizations.. If authorized, contribute visualizations to a library for all to use."},{"message":"In-line dashboard editor"},{"message":"Create and customize dashboards within your workflow, without requiring UI Builder. If authorized, contribute dashboards to a common library. Any user can duplicate any dashboard they can read and create their own personal version of it."},{"message":"What does migration mean?"},{"message":"Your existing dashboards, reports, interactive filters, and Performance Analytics widgets are moved to the Platform Analytics Experience. You get a single set of data visualizations and unified filters for all data sources. You can access all your analytics through a unified navigation menu. If you use indicators, you get new tools to alert you of significant changes."},{"message":"Which components get replaced?"},{"message":"Reports and PA widgets are replaced with Data Visualizations, which can show data from tables, indicators, and other sources.  Indicators technically stay the same but are sometimes referred to as KPIs. Interactive filters and breakdown dashboards are migrated as unified filters."},{"message":"Where should the migration be run?"},{"message":"Run and test the migration on a single, non-production instance. Evaluate the result thoroughly. If you are satisfied with the results, retrigger and finalize the migration in a production instance. You cannot move the migrated material from a non-production instance to a production instance using update sets."},{"message":"For the trial run, use a non-production environment that most closely resembles your production instance in terms of dashboard content. Doing so provides the most meaningful outcome to review. Ensure to run the migration during off-peak hours. "},{"message":"Which roles are required to conduct the migration?"},{"message":"The migration requires the role sys_admin to initiate the migration. If possible, conduct the migration in consultation with pa_admin, report_admin, or dashboard_admin users."},{"message":"How can the success or failure of the migration be tracked?"},{"message":"The Migration Center is specifically designed for monitoring the success or failure of migrations and all the analytics assets that are part of the migration. For each asset, you can see the status of the migration and review the logs associated with it. You can also compare migrated dashboards and source dashboards side by side."},{"message":"What is Compatibility Mode?"},{"message":"Reports and PA widgets that cannot be migrated are imported into your dashboard as wrapped versions of these artifacts from the source dashboards. They require a separate loading process. These artifacts include, but are not limited to, funnel reports, word clouds, some custom filters, and custom content blocks."},{"message":"For more information, see the following link: "},{"message":"Content migrated in compatibility mode"},{"message":"Dashboards with visualizations or other widgets migrated in compatibility mode may take slightly longer to load.  For an optimal experience, consider replacing content migrated in compatibility mode with supported content."},{"message":"How do I navigate to my migrated content?"},{"message":"In the navigation, migrated dashboards and reports are under Analytics Center > Library. All the administration menus for Reports and Performance Analytics are moved to Analytics Administration."},{"message":"What happens to the CoreUI dashboards and content once they are migrated?"},{"message":"After migration, the status of the CoreUI dashboards is set to inactive (active is set to false), but they are not deleted from the instance."},{"message":"Will the migration impact Service Portal content?"},{"message":"No, the migration will not impact Service Portal content. The service portal will continue to support reports and PA widgets. Both the report admin and PA admin will still be able to create old reports and PA widgets on the portal."},{"message":"What will not be migrated?"},{"message":"Please refer to the article below for a comprehensive list of what cannot be migrated based on each release."},{"message":"CoreUI Dashboards migration  - Troubleshooting and Guidelines"},{"message":"Discover the dashboards that are ready to migrate from the library"},{"message":"Selected analytics content can be migrated from the list UI actions"},{"message":"Trigger the migration for all the analytics content on your instance"},{"message":"Review, edit and decide what to activate from the Migration Center review phase"},{"message":"This visualization is in compatibility mode because the act as filter feature is not supported on migration. It can be configured manually in a new visualization."},{"message":"This visualization is in compatibility mode because the report drilldown feature is not supported on migration. It can be configured manually in a new visualization."},{"message":"This visualization is migrated without sorting by dot-walked fields because this functionality is not supported."},{"message":"This visualization is migrated without a drilldown list view because this functionality is not supported."},{"message":"Migrated static content blocks may look different on migrated dashboards."},{"message":"Conditional options are removed from static content blocks on migration."},{"message":"This content is in compatibility mode because we are unable to migrate its configurations."},{"message":"This visualization has been copied from the library to retain the Act as filter functionality on this dashboard."},{"message":"Changes made to this visualization on this dashboard, are not propagated to the library."},{"message":"Something went wrong with new properties."},{"message":"A map report on this dashboard has unsupported aggregate configuration"},{"message":"We are unable to migrate this component."},{"message":"Dashboard migrated without the \"Restrict to roles\" configuration. Update the sharing information on the migrated dashboard."},{"message":"Dashboard migrated without the dashboard \"Group\" configuration because this functionality is not supported."},{"message":"This visualization is migrated without header and title custom colors because this functionality is not supported."},{"message":"The dashboard has a missing layout configuration record."},{"message":"This content was not configured and is migrated as an unconfigured visualization."},{"message":"Configure this content in the Visualization Designer."},{"message":"The dashboard has missing preferences configuration."},{"message":"The dashboard breakdown filter cannot be migrated. It can be configured manually in a new filter."},{"message":"A report on this dashboard has an unmigrated drilldown configuration. You can configure the drilldowns in the Visualization Designer."},{"message":"This visualization is migrated without the visualization selector because this functionality is not supported"},{"message":"This visualization is migrated without the time range selector because this functionality is not supported."},{"message":"This breakdown widget did not have a configured breakdown or groupBy. To configure a breakdown or groupBy, open the widget in the Visualization Designer."},{"message":"This visualization is migrated without the custom colors field because this functionality is not supported."},{"message":"Default colors are used in the migrated visualization."},{"message":"This content was migrated with the default color palette. Custom palettes are not currently supported for the {0} visualization in Platform Analytics."},{"message":"The date filter cannot be migrated because we cannot find the target configuration. It can be configured manually in a new filter."},{"message":"The multiple default date values on interactive filters cannot be migrated. Only one default value is selected."},{"message":"This interactive filter is migrated without the exclusion list information because we are unable to migrate its configuration."},{"message":"This interactive filter is migrated without the default choice list information because we are unable to migrate its configuration."},{"message":"This interactive filter cannot be migrated. It can be configured manually in a new filter."},{"message":"This breakdown filter cannot be migrated. It can be configured manually in a new filter."},{"message":"This visualization is in compatibility mode because the empty breakdown element configuration is not supported."},{"message":"Sort condition not migrated. Selected sort fields are not supported for "},{"message":"This visualization is migrated without sorting by information because this functionality is not supported."},{"message":"Cannot find element details. sysId = {sysId}"},{"message":"Cannot find second breakdown details. sysId = {sysId}"},{"message":"This visualization is migrated without show bar configuration because this functionality is not supported."},{"message":"This visualization is migrated without the time series aggregation configuration because it does not match aggregation of the main metric."},{"message":"This visualization is migrated without bullet score because this functionality is not supported."},{"message":"This visualization is in compatibility mode because the compare score with previous periods feature is not supported."},{"message":"This visualization has been copied from the library to retain the Real time update functionality on this dashboard."},{"message":"The dashboard has missing report source configuration."},{"message":"This visualization is migrated without selected manual elements configuration because is missing the details."},{"message":"This visualization is in compatibility mode because the additional indicators follow elements feature is not supported."},{"message":"This visualization is in compatibility mode because PA widget has Previous period chart enabled and this functionality is not supported."},{"message":"Selective transition"},{"message":"Move to the new experience your way"},{"message":"Unsupported card variant"},{"message":"Go to Dashboard Library"},{"message":"Review in Migration Center"},{"message":"Start migrating all your content"},{"message":"Last refreshed {0}.{1}"}]'
