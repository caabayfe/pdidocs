  value: |-
    (function execute(inputs, outputs) {
        var gr = new GlideRecord("sn_um_upgrade_sessions");
        gr.get(inputs.upgrade_session);
        if(inputs.store_upgrade_preview ) {
            gr.setValue("upgrade_preview", inputs.upgrade_preview);
            gr.setValue("upgrade_preview_store", inputs.upgrade_preview);
            gr.setValue("upgrade_preview_execution_tracker_store", inputs.upgrade_preview_execution_tracker);
            gr.update();
        } else {
            gr.setValue("upgrade_preview", inputs.upgrade_preview);
            gr.setValue("upgrade_preview_execution_tracker", inputs.upgrade_preview_execution_tracker);
            gr.update();
        }
    })(inputs, outputs);
