  value: |-
    (function execute(inputs, outputs) {
        // ... code ...
        var executionTrackerId  = sn_uc.UpgradePreviewUtil.generateChangelist(inputs.current_patch_id, inputs.target_patch_id);
        outputs['execution_tracker_id'] = executionTrackerId;

         const apiUtil = new sn_upgrade_mgmt.UpgradeManagementApiUtilOverview();

        // encoding because the strings contains '?' character starts breaking when we receive it
        // use `JSON.parse(decodeURIComponent(experience_property.value))` in the page
        outputs['upgrade_details'] = encodeURIComponent(JSON.stringify(apiUtil.getUpgradeDetails(true)));

    })(inputs, outputs);
