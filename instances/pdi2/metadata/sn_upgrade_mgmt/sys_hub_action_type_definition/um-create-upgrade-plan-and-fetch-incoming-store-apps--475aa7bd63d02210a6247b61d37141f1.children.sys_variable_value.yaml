  value: |-
    
    // This step is preview store apps activities
    // It sets prev upgrade plans to inactive and creates a new one
    // It also triggers the API that fetches incoming store apps and stores them in a table
    // Input - target patch id
    // Output - upgrade plan sys id & execution tracker for store apps api call
    (function execute(inputs, outputs) {
        var apiUtil = new sn_upgrade_mgmt.StoreAppsFlowUtils();
    	var result = apiUtil.createUpgradePlanAndFetchIncomingStoreApps(inputs.target_patch_id, inputs.sysId);
        
        outputs['store_incoming_apps_exec_tracker'] = result.store_incoming_apps_exec_tracker; 
        outputs['upgrade_plan_sysid'] = result.upgrade_plan_sysid;
    })(inputs, outputs);
