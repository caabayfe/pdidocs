    "message" : "<p>Ending the session only stops the guided upgrade flow you have proceeded through.</p>\n<ul>\n<li>Any changes like generated tests, skipped records, and store applications updated will remain in the instance.</li>\n<li>If your instance has already been upgraded, that upgrade will not be rolled back.</li>\n<li>If your instance has not been upgraded, the upgrade will not proceed.</li>\n<li>You cannot end the session when the upgrade is in progress.</li>\n</ul>\n<p>Once your upgrade is canceled, you will need to start the process from the beginning.</p>",
