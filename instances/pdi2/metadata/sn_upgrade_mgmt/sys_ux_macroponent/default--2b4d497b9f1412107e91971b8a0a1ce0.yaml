    "message" : "<p style=\"margin: 0; margin-bottom: 16px; font-size: var(--Typography-Size-Text-text-md, 16px);\">Monitor the status of an ongoing upgrade using the Upgrade Monitor module. You can also view the upgrade summary and the list of records causing conflicts in your instance once the upgrade is complete.</p>",
