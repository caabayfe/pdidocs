  value: |-
    var gr = global.StandardChangeTemplate.findAll('name', 'Replace printer toner');
    if (gr._next())
    	var standardChangeGr = global.StandardChangeProcess.newChange(new global.StandardChangeTemplate(gr)).getGlideRecord();
        var sys_id = standardChangeGr.getUniqueValue();
        standardChangeGr.get(sys_id);
    	if (!standardChangeGr.chg_model.nil()) {
    		standardChangeGr.setValue("chg_model", "");
    		standardChangeGr.update();
    	}
    outputs.record_id =  sys_id;
