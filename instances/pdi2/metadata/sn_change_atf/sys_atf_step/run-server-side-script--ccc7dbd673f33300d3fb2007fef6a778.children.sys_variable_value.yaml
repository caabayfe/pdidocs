    (function(outputs, steps, stepResult, assertEqual) {
      //update planned start date
    	var changeSysId;
    	describe("Update planned start date", function() {
            it("Update planned start date", function() {
    			var now = new Date();
        var defaultDate = now - 1000 * 60 * 60 * 24 * 4;
       var prePlannedStartDate = new Date(defaultDate);
    	var plannedStartDate = new Date(prePlannedStartDate.getTime() - (prePlannedStartDate.getTimezoneOffset() * 60000 )).toISOString().split("T")[0];		
    					
        gs.info("Calculated Fourdays Before Date  :: " +plannedStartDate);
    							
    	var crGr = new GlideRecord("change_request");
    	crGr.addQuery("short_description", "QST High Risk and Impact as Leave Alone With Ui Action");
    	crGr.query();
    	gs.info("Change Request Count  :: " + crGr.getRowCount());
    	crGr.next();	
    	changeSysId = crGr.getUniqueValue();
    	crGr.setValue("start_date", plannedStartDate);
        crGr.update();
    	outputs.record_id =changeSysId;	
    				return true;
            });

        });

    })(outputs, steps, stepResult, assertEqual);
