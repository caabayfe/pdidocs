api_name: global.Data Visualization API for metricbase data source
api_url: /api/now/analytics/data
batch_exclude: 'false'
description: Returns Data visualization API results for the metricbase data source. Supports single data source and only trend visualization.
http_method: POST
mutates_server_data: 'false'
name: Data Visualization API for metricbase data source
output_schema: ''
parameters: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Metric",
      "description": "Metric to use as data source",
      "readOnly": false,
      "fieldType": "table_name",
      "mandatory": true,
      "defaultValue": "mb_demo_drone"
    },
    {
      "name": "filterQuery",
      "label": "Data source condition",
      "description": "The query conditions used for table data source",
      "readOnly": false,
      "fieldType": "condition_string",
      "mandatory": false,
      "typeMetadata": {
        "table": "@table"
      },
      "defaultValue": "nameLIKEasf"
    },
    {
      "name": "transforms",
      "label": "Metric transform",
      "description": "Metric transform. Required for trend visualizations.",
      "readOnly": false,
      "fieldType": "json",
      "mandatory": false,
      "defaultValue": "[{\"metric\":\"mb_demo_mt_external_temperature\",\"transform\":{\"transform\":\"Reference\",\"name\":\"chart-subjects\"}}]"
    },
    {
      "name": "groupBy",
      "label": "Group by",
      "description": "Group results by. Optional for trend visualizations and supports only one group.",
      "readOnly": false,
      "fieldType": "json",
      "mandatory": false,
      "defaultValue": ["fleet"]
    },
    {
      "name": "startTime",
      "label": "Date range start",
      "description": "Start of date range. Can be defined as period(such as P7D) or absolute time.",
      "readOnly": false,
      "fieldType": "date",
      "mandatory": false,
      "defaultValue": "P7D"
    },
    {
      "name": "endTime",
      "label": "Date range end",
      "description": "End of date range. Required when the start time is defined as absolute time.",
      "readOnly": false,
      "fieldType": "date",
      "mandatory": false,
      "defaultValue": "2022-04-07T16:55:26.322Z"
    },
    {
      "name": "filterConfigurations",
      "label": "Filter configurations",
      "description": "Bind this to @state.parFilters to make the data resource react to filters on the page.",
      "readOnly": false,
      "fieldType": "json",
      "mandatory": false,
      "defaultValue": []
    }
  ]
request_body: |-
  {
    "dataConfigurations": [
      {
        "sourceType": "metricBase",
        "order": 0,
        "filterQuery": "{{filterQuery}}",
        "table": "{{table}}",
        "transforms": {{transforms}},
        "groupBy": {{groupBy}},
        "startTime": "{{startTime}}",
        "endTime": "{{endTime}}",
        "trendBy": "anything",
        "trendInterval": "date"
      }
    ],
    "filterConfigurations": {{filterConfigurations}}
  }
required_translations: |-
  [ {
    "message" : "Data source condition",
    "comment" : ""
