            assertEqual({
                name: "state  validation",
                shouldbe: "6",
                value: incidentGr.getValue("state")
            });
            assertEqual({
                name: "Close notes validation",
                shouldbe: "Related problem PRB0001001 closed.",
                value: incidentGr.getValue("close_notes")
            });
            if (GlidePluginManager.isActive('com.snc.best_practice.incident.sandiego'))
                assertEqual({
                    name: "Close code validation",
                    shouldbe: "Resolved by problem",
                    value: incidentGr.getValue("close_code")
                });
            else
                assertEqual({
                    name: "Close code validation",
                    shouldbe: "Solved (Permanently)",
                    value: incidentGr.getValue("close_code")
                });
        }
