description: |-
  <p>Translate text to multiple languages using Microsoft Azure Translator Service.</p>
  <p>
  	<b>Inputs:</b>
  </p>
  <ul>
  	<li>
  		<strong>Text</strong> - Text to be translated.
  	
  	</li>
  	<li>
  		<strong>Target Languages</strong> - Array String containing a set of language codes to which the text needs to be translated. Ex: ['fr','it']
  		    
  	
  	</li>
  	<li>
  		<strong>Source Language</strong> - Source language code of the text. Ex: en
  	
  	</li>
  	<li>
  		<strong>Additional Parameters</strong> - Array of objects containing additional context parameters. Supported parameter is textType and its value should be html or plain. 
  		
  		<ul>
  			<br/> Ex: [{'parameter_name': 'textType', 'parameter_value': 'html'}].
  		</ul>
  	</li>
  </ul>
  <p>
  	<b>Outputs:</b>
  </p>
  <ul>
  	<li>
  		<strong>Translations</strong> - Array cof objects ontaining texts translated to the given target languages.
  		
  		<ul>
  			<br/> Sample translations response
  		
  			<br/>[
  		
  			<br/>{'target_language':'fr', 'translated_text':'Bonjour'},
  		
  			<br/>{'target_language':'it', 'translated_text':'ciao'}
         
  			<br/>]
         
  		</ul>
  	</li>
  	<li>
  		<strong>Detected Language</strong> - Language code detected by Microsoft Azure Translator Service for the given text. Returned only if source language code is not populated in input.
  	
  	</li>
  	<li>
  		<strong>Status</strong> - 'Success' if the request succeeds or 'Error' if a failure occurs.
  	</li>
  	<li>
  		<strong>Error Message</strong> - Reason for error. Populated only when an error occurs.
  	</li>
  	<li>
  		<strong>Error Code</strong> - Code for error. Populated only when an error occurs.
  	</li>
  </ul>
  <p>
  	<b>Error Codes - Error Messages:</b>
  </p>
  <ul>
  	<li>40052 - Text ('text' field) has exceeded its maximum length.</li>
  	<li>40053 - Source language is invalid</li>
  	<li>40054 - Target language is invalid.</li>
  	<li>40055 - Request is not authorized because credentials are missing or invalid.</li>
  	<li>40056 - Text cannot be translated to target languages.</li>
  	<li>40050 - Error code to populate error messages from Microsoft Translator instead of standardized error messages.</li>
  	<li>40051 - Unknown error occurred.</li>
  </ul>

  <p>To use this subflow, a corresponding Microsoft Azure Translator Service connection and credential must be created and associated with the Microsoft Translation Connection & Credential alias. <a target="_blank"  href="/api/now/v1/context_doc_url/Microsoft_Azure_Translator_Service_Spoke">Learn More</a></p> 
