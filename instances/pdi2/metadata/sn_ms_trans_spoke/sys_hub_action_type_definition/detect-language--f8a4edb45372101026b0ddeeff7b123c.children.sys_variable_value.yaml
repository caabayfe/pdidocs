  value: |-
    (function execute(inputs, outputs) {
        var textsToDetect = inputs.textsToDetect;
        var requestPayload = [];
        for (var i = 0; i < textsToDetect.length; i++) {
            requestPayload.push({
                'Text': textsToDetect[i]
            });
        }
        outputs.request_payload = JSON.stringify(requestPayload);
    })(inputs, outputs);
