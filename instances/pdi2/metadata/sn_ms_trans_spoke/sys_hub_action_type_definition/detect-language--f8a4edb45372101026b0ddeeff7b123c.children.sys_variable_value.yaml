  sys_updated_on: 2020-10-02 11:14:07
  value: |-
    (function execute(inputs, outputs) {
        var responseBody = JSON.parse(inputs.responseBody);
        var texts = inputs.texts;
        var temporaryDetections = inputs.temporaryDetections;
        if ((temporaryDetections !== undefined) && (temporaryDetections !== null) && (temporaryDetections !== "")) {
            try {
                temporaryDetections = JSON.parse(inputs.temporaryDetections);
            } catch (error) {
                gs.error("Temporary Translations is not JSON format. Error:" + error + "Flow Variable received:" + temporaryDetections);
            }
        } else {
            temporaryDetections = {};
        }
        if (inputs.statusCode === 200) {
            outputs.status = "Success";
            var detections = [];
            if (typeof responseBody !== 'undefined' && responseBody.length > 0) {
                for (var i = 0; i < responseBody.length; i++) {
                    var detection = {
                        'alternatives': null
                    };
                    var detectedLanguage = {
                        'code': responseBody[i].language,
                        'confidence': responseBody[i].score
                    };
                    detection["detected_language"] = detectedLanguage;
                    if (responseBody[i].alternatives) {
                        var alternatives = [];
                        var alternativesLength = Math.min(responseBody[i].alternatives.length, 4);
                        for (var j = 0; j < alternativesLength; j++) {
                            alternatives.push({
                                'confidence': responseBody[i].alternatives[j].score,
                                'code': responseBody[i].alternatives[j].language
                            });
                        }
                        detection["alternatives"] = alternatives;
                    }
                    temporaryDetections[texts[i]] = detection;
                    temporaryDetections[texts[i]]["status"] = "Success";
                    detections.push(detection);
                }
            }
            outputs.detections = detections;
        } else {
            var errorObj = new MicrosoftTranslationErrorHandler().detectLanguageHandler(responseBody.error.code, responseBody.error.message);
            outputs.status = "Error";
            outputs.error_code = errorObj.errorCode;
            outputs.error_message = errorObj.errorMessage;
            for (var j = 0; j < texts.length; j++) {
                var detection = {
                    'status': 'Error',
                    'error_code': errorObj.errorCode,
                    'error_message': errorObj.errorMessage
                };
                temporaryDetections[texts[j]] = detection;
            }
            gs.error("Error while detecting the language of text using Microsoft Translator. Error:" + responseBody.error.message + " Response received:" + responseBody);
        }
        outputs.temporary_detections = JSON.stringify(temporaryDetections);
    })(inputs, outputs);
