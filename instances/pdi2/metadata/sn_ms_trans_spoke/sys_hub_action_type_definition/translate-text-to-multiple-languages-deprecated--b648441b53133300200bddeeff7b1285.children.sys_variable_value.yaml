  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
       var responseBody = JSON.parse(inputs.responseBody);
        if (inputs.statusCode == 200) {
            outputs.status = "Success";
            var translationMap = responseBody[0].translations;
            var translations = [];
            for (var i = 0; i < translationMap.length; i++) {
                var translation = {};
                translation['translated_text'] = translationMap[i].text;
                translation['target_language'] = translationMap[i].to;
                translations.push(translation);
            }
            outputs.translations = translations;
            if (responseBody[0].detectedLanguage)
                outputs.detected_language = responseBody[0].detectedLanguage.language;
        } else {
            errorObj = new MicrosoftTranslationErrorHandler().translateTextHandler(responseBody.error.code, responseBody.error.message);
            outputs.status = "Error";
            outputs.error_code = errorObj.errorCode;
            outputs.error_message = errorObj.errorMessage;
            gs.error("Error while translating the text to language using Microsoft Translator. Error:" + responseBody.error.message + " Response recieved:" + inputs.responseBody);
        }
    })(inputs, outputs);
