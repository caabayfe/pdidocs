description: |-
  <p>NOTE: This action is not intended to use directly, instead use <strong>Detect Language</strong> subflow.</p>
  <p>Splits input texts into batches using smart batching</p>
  <p>
      <b>Inputs:</b>
  </p>
  <ul>
      <li>
          <strong>Texts</strong> - String array containing an array of texts to be language detected.
      </li>
  </ul>
  <p>
      <b>Outputs:</b>
  </p>
  <ul>
      <li>
          <strong>Split Texts</strong> - Array of objects containing texts to detect
          <ul>
              <li>
                  <strong>Split Text</strong> - Object containing array of text to detect
                  <ul>
                      <br /> Sample split texts response
                      <br />[
                      <br />{'texts_to_detect':["world","hello"]}
                      <br />]
                  </ul>
              </li>
          </ul>
      </li>
  </ul>
