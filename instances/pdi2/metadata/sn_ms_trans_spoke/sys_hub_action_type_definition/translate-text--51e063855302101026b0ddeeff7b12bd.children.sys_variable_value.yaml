  value: |-
    (function execute(inputs, outputs) {
        if (inputs.additionalParameters) {
            var additionalParameters = inputs.additionalParameters;
            if (Array.isArray(additionalParameters)) {
                for (var index = 0; index < additionalParameters.length; index++) {
                    var eachParameter = additionalParameters[index];
                    if (eachParameter['parameter_name'] && eachParameter['parameter_name'].toUpperCase() === 'TEXTTYPE') {
                        outputs.text_type = eachParameter['parameter_value'];
                        break;
                    }
                }
            }
        }
        if (inputs.exclusionFrameworkApplied) {
            outputs.text_type = "html";
        }
        var textsToTranslate = inputs.textsToTranslate;
        if (inputs.targetLanguages)
            outputs.to = inputs.targetLanguages.join();
        var requestPayload = [];
        for (var i = 0; i < textsToTranslate.length; i++) {
            requestPayload.push({
                'Text': textsToTranslate[i]
            });
        }
        outputs.request_payload = JSON.stringify(requestPayload);
    })(inputs, outputs);
