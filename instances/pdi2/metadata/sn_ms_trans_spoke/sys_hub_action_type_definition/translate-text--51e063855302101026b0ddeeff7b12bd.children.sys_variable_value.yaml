  value: |-
    (function execute(inputs, outputs) {
        var responseBody = JSON.parse(inputs.responseBody);
        var texts = inputs.texts;
        var indices = inputs.textIndices;
        var temporaryTranslations = inputs.temporaryTranslations;
        if ((temporaryTranslations !== undefined) && (temporaryTranslations !== null) && (temporaryTranslations !== "")) {
            try {
                temporaryTranslations = JSON.parse(inputs.temporaryTranslations);
            } catch (error) {
                gs.error("Temporary Translations is not JSON format. Error:" + error + "Flow Variable received:" + temporaryTranslations);
            }
        } else {
            temporaryTranslations = {};
        }
        if (inputs.statusCode === 200) {
            outputs.status = "Success";
            var translations = [];
            for (var i = 0; i < responseBody.length; i++) {
                var translation = {
                    'text_translations': []
                };
                var eachResponse = responseBody[i];
                var translationMap = eachResponse.translations;
                if (eachResponse["detectedLanguage"]) {
                    translation['detected_language'] = eachResponse["detectedLanguage"].language;
                }
                for (var j = 0; j < translationMap.length; j++) {
                    var targetLanguage = translationMap[j].to;
                    var translatedText = translationMap[j].text;
                    var text_translation = {
                        'translated_text': translatedText,
                        'target_language': targetLanguage
                    };
                    if (temporaryTranslations[indices[i]]) {
                        if (temporaryTranslations[indices[i]].status === "Success") {
                            temporaryTranslations[indices[i]].text_translations[targetLanguage] = translatedText;
                        }
                    } else {
                        temporaryTranslations[indices[i]] = {};
                        if (translation.detected_language) {
                            temporaryTranslations[indices[i]]['detected_language'] = translation.detected_language;
                        }
                        temporaryTranslations[indices[i]].text_translations = {};
                        temporaryTranslations[indices[i]].text_translations[targetLanguage] = translatedText;
                        temporaryTranslations[indices[i]]['status'] = "Success";
                        translation['text_translations'].push(text_translation);
                    }
                }
                translations.push(translation);
            }
            outputs.translations = translations;
        } else {
            var errorObj = new MicrosoftTranslationErrorHandler().translateTextHandler(responseBody.error.code, responseBody.error.message);
            outputs.status = "Error";
            outputs.error_code = errorObj.errorCode;
            outputs.error_message = errorObj.errorMessage;
            for (var j = 0; j < texts.length; j++) {
                var translation = {
                    'status': 'Error',
                    'error_code': errorObj.errorCode,
                    'error_message': errorObj.errorMessage
                };
                temporaryTranslations[indices[j]] = translation;
            }
            gs.error("Error while translating the text to language using Microsoft Translator. Error:" + responseBody.error.message + " Response received:" + inputs.responseBody);
        }
        outputs.temporary_translations = JSON.stringify(temporaryTranslations);
    })(inputs, outputs);
