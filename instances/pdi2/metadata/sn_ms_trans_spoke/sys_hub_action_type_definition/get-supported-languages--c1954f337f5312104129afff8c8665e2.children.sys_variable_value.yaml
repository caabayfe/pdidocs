  value: |-
    (function execute(inputs, outputs) {
        try {
            var response = JSON.parse(inputs.response);
            if (response.hasOwnProperty('error')) {
                outputs.error_code = response.error.code;
                outputs.error_message = response.error.message;
            } else {
                outputs.supported_languages = response;
            }
        } catch (e) {
            outputs.error_message = e;
            gs.error(gs.getMessage("Error occured while getting Microsoft Azure supported languages: ") + e);
        }
    })(inputs, outputs);
