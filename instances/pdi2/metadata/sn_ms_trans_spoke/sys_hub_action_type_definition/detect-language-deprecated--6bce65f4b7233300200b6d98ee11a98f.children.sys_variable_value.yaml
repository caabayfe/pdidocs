  value: |-
    (function execute(inputs, outputs) {
        // ... code ...
        var responseBody = JSON.parse(inputs.responseBody);
        if (inputs.statusCode === 200) {
            outputs.status = "Success";
            if (typeof responseBody !== 'undefined' && responseBody.length > 0) {
                var detectedLanguage = {};
                detectedLanguage['code'] = responseBody[0].language;
                detectedLanguage['confidence'] = responseBody[0].score;
                outputs.detected_language = detectedLanguage;
                outputs.alternatives = null;

                if (responseBody[0].alternatives) {
                    var alternatives = [];
                    var alternativesLength = Math.min(responseBody[0].alternatives.length, 4);
                    for (var i = 0; i < alternativesLength; i++) {
                        var alternative = {};
                        alternative['confidence'] = responseBody[0].alternatives[i].score;
                        alternative['code'] = responseBody[0].alternatives[i].language;
                        alternatives.push(alternative);
                    }
                    outputs.alternatives = alternatives;
                }
            }
        } else {
            errorObj = new MicrosoftTranslationErrorHandler().detectLanguageHandler(responseBody.error.code, responseBody.error.message);
            outputs.status = "Error";
            outputs.error_code = errorObj.errorCode;
            outputs.error_message = errorObj.errorMessage;
            gs.error("Error while detecting the language of text using Microsoft Translator. Error:" + responseBody.error.message + " Response recieved:" + responseBody);
        }
    })(inputs, outputs);
