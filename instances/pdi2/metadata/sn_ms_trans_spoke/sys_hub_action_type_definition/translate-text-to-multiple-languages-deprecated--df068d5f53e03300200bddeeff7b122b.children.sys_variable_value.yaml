  value: |-
    (function execute(inputs, outputs) {
        // ... code ...
        if (inputs.additionalParameters) {
            var additionalParameters = JSON.parse(inputs.additionalParameters);
            if (Array.isArray(additionalParameters)) {
                for (var index = 0; index < additionalParameters.length; index++) {
                    var eachParameter = additionalParameters[index];
                    if (eachParameter['parameter_name'].toUpperCase() === 'TEXTTYPE') {
                        outputs.textType = eachParameter['parameter_value'];
                        break;
                    }
                }
            }
        }

        if (inputs.targetLanguages)
            outputs.to = JSON.parse(inputs.targetLanguages).join();

    })(inputs, outputs);
