  value: |-
    (function execute(inputs, outputs) {
        var texts = inputs.texts;
        var temporaryTranslations_raw = JSON.parse(inputs.temporaryTranslations);
        var temporaryTranslations = {};
        for (var key in temporaryTranslations_raw) {
            temporaryTranslations[parseInt(key)] = temporaryTranslations_raw[key]
        }
        if (inputs.exclusionFrameworkApplied) {
            var textsToBeTransformed = [];
            for (var i = 0; i < texts.length; i++) {
                if (temporaryTranslations[i].text_translations) {
                    var translations = [];
                    for (var key in temporaryTranslations[i].text_translations) {
                        translations.push(temporaryTranslations[i].text_translations[key]);
                    }
                    textsToBeTransformed.push(translations);
                } else {
                    textsToBeTransformed.push([]);
                }
            }
            var response = new sn_dt_spoke.TransformTextAPI().transformTranslatedTexts(inputs.config, textsToBeTransformed);
            var transformedTexts = response.transformedTexts;
            for (var i = 0; i < texts.length; i++) {
                if (temporaryTranslations[i].text_translations) {
                    var tl = 0;
                    for (var key in temporaryTranslations[i].text_translations) {
                        temporaryTranslations[i].text_translations[key] = transformedTexts[i][tl];
                        tl++;
                    }
                }
            }
        }
        var rearrangeJSONResult = new MicrosoftTranslationBatchingUtil().rearrangeJSONResult(inputs.texts, temporaryTranslations, true);
        outputs.translations = rearrangeJSONResult.translations;
        outputs.status = rearrangeJSONResult.status;
    })(inputs, outputs);
