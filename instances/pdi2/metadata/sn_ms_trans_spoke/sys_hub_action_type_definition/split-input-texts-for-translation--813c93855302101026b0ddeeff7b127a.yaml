description: |-
  <p>NOTE: This action is not intended to use directly, instead use <strong>Translate Texts</strong> subflow.</p>
  <p>Splits input texts into batches using smart batching</p>
  <p>
      <b>Inputs:</b>
  </p>
  <ul>
      <li>
          <strong>Texts</strong> - String array containing an array of texts to be translated.
      </li>
      <li>
          <strong>Target Languages</strong> - String array containing an array of language codes to which the text needs
          to be translated. Ex: ['fr','it']
      </li>
      <li>
          <strong>Config</strong> - String containing the Sys Id of the configuration record
      </li>
  </ul>
  <p>
      <b>Outputs:</b>
  </p>
  <ul>
      <li>
          <strong>Split Texts</strong> - Array of objects containing texts to translate and target languages
          <ul>
              <li>
                  <strong>Split Text</strong> - Object containing array of text to translate and target languages
                  <ul>
                      <br /> Sample split texts response
                      <br />[
                      <br />{'texts_to_translate':["world","hello"], 'target_languages':['fr','de']}
                      <br />]
                  </ul>
              </li>
          </ul>
      </li>
      <li>
          <strong>Exclusion Framework Applied</strong> - True/False which mentioned whether the exclusion framework rules are applied.
      </li>
  </ul>
flow_priority: ''
