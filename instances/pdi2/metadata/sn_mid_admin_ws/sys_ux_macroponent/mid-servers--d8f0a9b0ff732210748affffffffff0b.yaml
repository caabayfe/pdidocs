required_translations: |-
  [ {
    "message" : " Generate single-use registration key ",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p><span data-teams=\"true\">If you only need a ServiceNow-issued token for an expired&nbsp;cert or if you want to set up a new MID manually without going through the flow:</span></p>\n<ul>\n<li>Select the MID Server user to generate a registration key for that user.&nbsp;</li>\n<li>Replace these properties in your config.xml to register or re-register a MID Server.</li>\n<li>This key can only be used once and expires in 24 hours.</li>\n</ul>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p><span style=\"font-size: 12pt;\">Instance-issued certificates offer stronger, hassle-free security over the basic authentication your MID Servers are using. Certificates are issued per-server, rotate automatically, and eliminate password management.&nbsp;<a href=\"https://www.servicenow.com/docs/csh?topicname=mid-ipki-install-command.html&version=latest\">Learn more.</a></span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p><span style=\"font-size: 16px;\">Currently supporting Cloud Discovery and synthetic monitoring.</span></p>",
    "code" : "mid_onboarding_hosted_mid_description",
    "comment" : ""
  }, {
    "message" : "<p><span style=\"font-size: 16px;\">Install and manage a MID Server in your network for discovery and orchestration of on-premises infrastructure</span></p>",
    "code" : "install_and_manage_a_midserver_in_your_network_for_discovery_and_orchestration_of_onpremises_infrastructure",
    "comment" : ""
  }, {
    "message" : "<p><span style=\"font-size: 16px;\">Request a cloud-native hosted MID Server for faster onboarding and minimal maintenance, managed by ServiceNow.</span></p>",
    "code" : "install_and_manage_a_midserver_in_your_network_for_discovery_and_orchestration_of_onpremises_infrastructure",
    "comment" : ""
  }, {
    "message" : "<ul>\n<li style=\"font-size: 12pt;\"><span style=\"font-size: 12pt;\"><strong>Stronger security:</strong> Each MID server identity is mapped to a unique certificate</span></li>\n<li style=\"font-size: 12pt;\"><span style=\"font-size: 12pt;\"><strong>Zero maintenance:</strong> Certificates rotate automatically with no password resets</span></li>\n<li style=\"font-size: 12pt;\"><span style=\"font-size: 12pt;\"><strong>Your choice:</strong> Migrate everything at once, or test with a few servers</span></li>\n</ul>",
    "code" : "",
    "comment" : ""
  }, {
