"Add criteria between steps"},{"message":"Remove step?"},{"message":"Remove"},{"message":"There are criteria between steps ({constraints}) using this step. Removing the step will remove all criteria that use it."},{"message":"Update step?"},{"message":"Update"},{"message":"There are criteria between steps ({constraints}) using this step. Updating the step will remove all criteria that use it."},{"message":"Update step relation?"},{"message":"Unable to add next step."},{"message":"Step relationships like \"not directly followed by\" or \"never followed by\" mean the next step can''t exist. To continue, start a new sequence."},{"message":"Occurrence"},{"message":"If the value occurs multiple times in the process, select which occurrence the step refers to."},{"message":"Copy or paste"},{"message":"Copy"},{"message":"Paste"},{"message":"Copy or paste condition"},{"message":"or"},{"message":"Add or condition"},{"message":"Remove condition"},{"message":"Remove row"},{"message":"While"},{"message":"Add step criteria"},{"message":"Select all matching items (max {maxCount})"},{"message":"Confirm"},{"message":"Close side panel"},{"message":"What are breakdown fields?"},{"message":"Breakdown fields are used to segment the process, enabling the analysis of specific subsets of the process data."},{"message":"Examples of fields that can be used as breakdowns include Category and Priority, which enable a more focused process analysis based on the classification or importance of records."},{"message":"Why configure breakdown fields?"},{"message":"Configuring breakdown fields enables analysis of process subsets, provides users with recommendations for the most suitable "},{"message":"Breakdown definitions"},{"message":"in their projects, and surfaces recommendations for Automated root cause analysis fields in this process configuration."},{"message":"Resources"},{"message":"Fields available in your {tableLabel} process data"},{"message":"Breakdown definitions in the Project Builder"},{"message":"Breakdown filters on the Analyst Workbench"},{"message":"What are child tables?"},{"message":"Child tables include data of dependent subprocesses that are important for the execution of the parent process. For example, the "},{"message":"Incident"},{"message":"table serves as the parent table with general information about incidents, while the "},{"message":"Incident Task"},{"message":"is the child table that stores specific tasks related to each incident."},{"message":"Why configure child tables?"},{"message":"Analyzing child tables helps uncover inefficiencies in subprocesses that impact the main process''s performance. Including child tables in the process configuration provides users with a list of related processes to add as an extra dimension of analysis to their project."},{"message":"Use cases in the Project Builder"},{"message":"Intent analysis"},{"message":"What is Intent analysis?"},{"message":"Intent analysis groups similar records into clusters by identifying patterns in fields containing unstructured textual information, such as Description or Short Description."},{"message":"Why configure Intent analysis?"},{"message":"The goal of cluster analysis is to understand requester intent and link it to process inefficiencies."},{"message":"When a user identifies an inefficiency on the process graph—such as records taking an extra step or an unexpected route—they can initiate cluster analysis to highlight prevailing themes or topics mentioned in those records."},{"message":"For example, it can reveal that records reverting from the Resolved state to New are often service requests for laptop issues."},{"message":"How to configure Intent analysis?"},{"message":"Select one of the existing clustering definitions or create a new one."},{"message":"When creating a new clustering definition, select one or more fields containing relevant textual data, such as descriptions, to help the system identify similar records."},{"message":"Note that Intent analysis won''t be available unless the clustering definition is selected in the process configuration."},{"message":"Cluster Analysis in Process Mining"},{"message":"Create and train a clustering solution"},{"message":"Improvement opportunity definitions"},{"message":"What are improvement opportunity definitions?"},{"message":"Improvement opportunity definitions highlight potential areas for process optimization based on a set of patterns. There are two types: "},{"message":"automated"},{"message":", which use pre-built patterns, and "},{"message":"rule-based"},{"message":", which rely on user-defined patterns."},{"message":"Why create improvement opportunity definitions?"},{"message":"These definitions help identify process issues without manual analysis. By creating them in the process configuration, you make them accessible to all projects based on that process. Users can then copy these definitions into their projects without needing to create them manually."},{"message":"How to create improvement opportunity definitions?"},{"message":"The simplest way to create automated definitions is by following the system recommendations available through the \"Get recommendations\" button. Note that the Process Perspectives on the Process details page of the process configuration must be filled out to enable recommendations."},{"message":"Additionally, you can create both automated and rule-based improvement opportunity definitions manually by clicking the \"Add new\" button."},{"message":"Working with improvement opportunities"},{"message":"KPI categories"},{"message":"What are KPI categories?"},{"message":"KPI categories are predefined buckets that organize Key Performance Indicators (KPIs) into  groups based on common process objectives."},{"message":"Why categorize KPIs?"},{"message":"This categorization automates the selection of relevant KPIs during the creation of automated improvement opportunity definitions."},{"message":"It is also required for displaying process mining-related insights on Performance Analytics dashboards that utilize these KPIs."},{"message":"How to categorise KPIs?"},{"message":"For each category, select the KPIs that are relevant to your process."},{"message":"Performance Analytics indicators"},{"message":"What is a KPI dashboard?"},{"message":"KPI dashboards include data visualizations, filters, and other components to track Key Performance Indicators (KPIs) for the process. They leverage Platform Analytics dashboards to deliver insights directly within process mining projects."},{"message":"Why configure KPI dashboard?"},{"message":"The selected Platform Analytics dashboard will be accessible on the KPI Dashboard page in the process mining projects, allowing users to track trends in related KPIs."},{"message":"How to configure a KPI dashboard?"},{"message":"Select one of the existing Platform Analytics dashboards or create a new one."},{"message":"Users can override this configuration in their process mining projects."},{"message":"Platform Analytics dashboard overview"},{"message":"Create a dashboard with the in-line editor"},{"message":"What is a state?"},{"message":"A state represents the status of a record within a workflow. It shows how the record progresses toward completion."},{"message":"Why define a state?"},{"message":"Defining a state improves analysis by revealing domain-specific insights—such as idle time—and helps visualize the entire process lifecycle."},{"message":"process steps illustration"},{"message":"A record''s progression through states in a workflow"},{"message":"What is Intent and activity analysis?"},{"message":"Understand the requester''s intent and gain insight into the related tasks and actions needed to complete them."},{"message":"Why configure Intent and activity analysis?"},{"message":"The goal is to understand the requester''s intent and gather insights to enhance the agent''s tasks and activities performed to resolve the requests."},{"message":"It enhances visibility into the specific actions and tasks agents perform to resolve different types of requests. It allows you to identify whether tasks directly contribute to fulfilling the service request or are non-value-adding activities like administrative work, redundancies, or overhead. Additionally, it reveals the sequence of tasks, offering better insight into workflows and highlighting opportunities to enhance agent and team performance."},{"message":"How to configure Intent and activity analysis?"},{"message":"Select or create a cluster definition to group requests by similar intent."},{"message":"Set up the fields usually used for agent activities, like work notes and comments."},{"message":"Specify the users whose activities should be excluded, typically system or admin user(s)."},{"message":"What is Automated root cause analysis?"},{"message":"Automated root cause analysis identifies key factors behind process inefficiencies by revealing which process attributes are most likely to cause them."},{"message":"Why configure Automated root cause analysis?"},{"message":"When a user identifies an inefficiency on the process graph—such as an extra step, longer transition, or unexpected route—they can initiate a root cause analysis for quick diagnosis of the issue."},{"message":"For example, it can reveal that requests created by email are three times more likely to move from Resolved state to New."},{"message":"How to configure root cause analysis?"},{"message":"Select fields that categorize the process data. For example, choosing the Assignment Group field allows the analysis to compare records handled by different groups. If one group has significantly more inefficient records, it may indicate a potential issue in that group."},{"message":"Note that Automated root cause analysis won''t be available unless the it is set up in the process configuration."},{"message":"Automated Root Cause Analysis in Process Mining"},{"message":"Process Mining Academy: Understanding Root Cause Analysis"},{"message":"Transition work notes analysis"},{"message":"What is Transition work notes analysis?"},{"message":"Transition work notes analysis helps to understand the operational reasons behind activity transitions by examining the work notes and comments recorded around the time of these transitions."},{"message":"Since work notes are not always documented simultaneously with the activity transition, a time window is used to relate work notes to that specific transition."},{"message":"How to configure Transition work notes analysis?"},{"message":"Select the fields that capture work notes from process actors."},{"message":"Exclude notes from system users and bots to improve the quality of the analysis."},{"message":"Define the time window in which the work note must occur to be associated with a transition."},{"message":"Set the minimum and maximum word count for work notes to include in the analysis. Notes outside this range will be excluded."},{"message":"Note that Transition work notes analysis won''t be available unless it is set up in the process configuration."},{"message":"Transition work notes analysis in Process Mining"},{"message":"What is touchpoint analysis?"},{"message":"Touchpoint analysis studies specific interactions within a process to identify where and how human involvement occurs, particularly spotlighting inefficient, redundant, or excessive activities. By pinpointing these areas, it enables process optimization through automation or other improvements, enhancing performance and reducing operational costs."},{"message":"Why configure touchpoint analysis?"},{"message":"Configuring touchpoint analysis is needed for the precise calculation of unique updates per record. It requires specifying which fields are frequently updated by humans and should be included in the touchpoint calculation, such as work notes, comments, priority, and assignment group. Without configuration, the touchpoint analysis cannot be utilized."},{"message":"How to configure touchpoint analysis?"},{"message":"Identify up to five fields that are frequently updated by humans."},{"message":"Specify which users and their updates should be excluded from the calculation."},{"message":"Set a time interval to group multiple updates into a single touchpoint. This helps streamline the analysis and provides a clearer view of human interaction within the process."},{"message":"What is idle time analysis?"},{"message":"Idle time analysis focuses on the periods when a case is assigned to a team but not yet assigned to a specific resource. This is the time during which the case remains inactive, waiting for someone to take action."},{"message":"Why configure idle time analysis?"},{"message":"Analyzing idle time helps identify inefficiencies, such as delays in task assignment or workflow bottlenecks, enabling teams to improve coordination and reduce waiting times within processes."},{"message":"Prerequisites for idle time analysis"},{"message":"Ensure that the state, team, and agent definitions are fully completed on the process details page."},{"message":"Verify that the mapping of states to responsibilities is complete as part of the state definition."},{"message":"What is a team?"},{"message":"A team is a group of users responsible for handling records within a workflow."},{"message":"Why define a team?"},{"message":"Defining a team enhances insights by enabling domain-specific analysis. It helps to evaluate team efficiency, track handover of work, and analyze metrics like idle time."},{"message":"Team definition illustration"},{"message":"The flow of a record’s assignment groups"},{"message":"Agent definition"},{"message":"What is an agent?"},{"message":"An agent is a person assigned to handle and resolve records in a workflow."},{"message":"Why define an agent?"},{"message":"Defining an agent enables analysis of idle time and handover of work, helping to improve process efficiency."},{"message":"Agent definition illustration"},{"message":"The flow of a record''s agents"},{"message":"What are activity fields?"},{"message":"Activity fields are used in process mining and determine what you will see on the process map."},{"message":"Why configure activity fields?"},{"message":"Adding activity fields provides users with recommendations for the most suitable Activity definitions in their projects."},{"message":"Activity definitions in the Project Builder"},{"message":"View highlighted path representation"},{"message":"Description for {title}"},{"message":"Filters applied"},{"message":"Change process map graph settings"},{"message":"Return to full graph"},{"message":"Switch back to process map"},{"message":"Just now"},{"message":"View error details"},{"message":"Activities"},{"message":"Connections"},{"message":"Displayed connections"},{"message":"Incoming"},{"message":"Outgoing"},{"message":"Zoom"},{"message":"Zoom out"},{"message":"Zoom in"},{"message":"Recenter and autofit"},{"message":"Case follow simulation is not available due to the high count of edges"},{"message":"Case follow simulation"},{"message":"Last status update: {date}"},{"message":"There are new actions taken on Improvement opportunities. Please refresh the data on top."},{"message":"On activity: {fromNodeLabel} ({fromNodeTable})"},{"message":"On {variantsCount} variant(s)"},{"message":"On Insight: {title}"},{"message":"Control-flow"},{"message":"Example: State"},{"message":"Control-flow perspective"},{"message":"Field representing the progression of records through steps "},{"message":"The control-flow perspective of a process describes the order in which its activities are executed. It is usually the starting point for a process mining analysis."},{"message":"Resource"},{"message":"Example: Assignment group"},{"message":"The agent definition describes the resources required for the execution of a process and how they interact with each other."},{"message":"Example: Assigned to"},{"message":"Which other fields would you like to analyze?"},{"mess