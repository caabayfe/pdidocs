paths: AdditionalColor:hook,AdditionalColor:value,BooleanType:value,Color:additional,Color:neutral,Color:primary,Color:secondary,ColorsStyle:colors,ColorsStyle:createdOn,ColorsStyle:generatedColors,ColorsStyle:id,ColorsStyle:name,ColorsStyle:style,ColorsStyle:type,ColorsStyle:updatedOn,ComponentPropertyResult:customization,ComponentPropertyResult:style,CustomFont:customization,CustomFont:typography,Customization:id,Customization:value,Domain:id,Domain:label,Domain:path,Experience:id,Experience:title,Experience:uri,Font:value,FontAsset:assetId,FontAsset:m2mStyleAssetId,FontAsset:name,FontAsset:properties,FontAsset:url,FontProperties:style,FontProperties:subFamily,FontProperties:weight,IllustrationStyle:customization,IllustrationStyle:imagery,ImageryStyle:createdOn,ImageryStyle:id,ImageryStyle:logos,ImageryStyle:name,ImageryStyle:style,ImageryStyle:type,ImageryStyle:updatedOn,Logger:message,Logger:messageType,Logo:assetId,Logo:attachmentId,Logo:file,Logo:fileName,Logo:fileType,Logo:m2mStyleAssetId,Logo:props,M2MUXAppTheme:id,M2MUXAppTheme:isDuplicateThemeRecordExistInM2MAppTheme,M2MUXAppTheme:isPublished,M2MUXAppTheme:order,M2MUXAppTheme:theme,MobileApp:id,MobileApp:isThemeBuilderTheme,MobileApp:mobileTheme,MobileApp:mobileThemeName,MobileApp:name,MobileApp:sysScope,MultiThemeInfo:m2mAppThemeEntriesExist,MultiThemeInfo:m2mAppThemeExists,Mutation:addFeedback,Mutation:createDuplicateTheme,Mutation:createLogo,Mutation:createTheme,Mutation:createVariant,Mutation:deleteCustomFontFamily,Mutation:deleteTheme,Mutation:deleteVariant,Mutation:getCustomization,Mutation:publishTheme,Mutation:removeLogo,Mutation:revertIllustrationOverride,Mutation:unpublishTheme,Mutation:updateAdditionalBrandColors,Mutation:updateBrandColors,Mutation:updateColorOverride,Mutation:updateComponentFontProperties,Mutation:updateComponentProp,Mutation:updateGroupName,Mutation:updateLogo,Mutation:updateShape,Mutation:updateTheme,Mutation:updateThemeOrder,Mutation:updateThemeRecordForMobile,Mutation:updateTypography,Mutation:uploadCustomFonts,Mutation:uploadIllustration,Query:getAllExperiences,Query:getAllThemeNames,Query:getAllThemes,Query:getCompanyUILogosrc,Query:getCustomization,Query:getMobileApps,Query:getMultiThemeInfo,Query:getTheme,Scope:id,Scope:label,Shape:value,ShapeStyle:corner,ShapeStyle:createdOn,ShapeStyle:id,ShapeStyle:name,ShapeStyle:style,ShapeStyle:type,ShapeStyle:updatedOn,StringType:value,Theme:createdBy,Theme:createdOn,Theme:customization,Theme:description,Theme:domain,Theme:id,Theme:name,Theme:scope,Theme:styles,Theme:updatedBy,Theme:updatedOn,ThemeName:groupName,ThemeName:id,ThemeName:name,ThemeName:variants,ThemeNameVariant:id,ThemeNameVariant:name,ThemePaginationResult:hasNext,ThemePaginationResult:hasNonThemeBuilderThemes,ThemePaginationResult:rowCount,ThemePaginationResult:themes,TypographyStyle:createdOn,TypographyStyle:fonts,TypographyStyle:id,TypographyStyle:name,TypographyStyle:style,TypographyStyle:type,TypographyStyle:typography,TypographyStyle:updatedOn,UnknownStyle:createdOn,UnknownStyle:id,UnknownStyle:name,UnknownStyle:style,UnknownStyle:type,UnknownStyle:updatedOn
