schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	getTheme(id: ID!): M2MUXAppThemeResult,
  	getAllExperiences: [Experience]
  	getAllThemeNames(encodedQuery: String): [ThemeName]
  	getAllThemes(encodedQuery: String, start:Int, pageSize:Int): ThemePaginationResult
  	getCustomization(themeId: ID!): CustomizationResult
  	getMobileApps: [MobileApp]
  	getCompanyUILogosrc(companyId: ID!): Logo
  	getMultiThemeInfo: MultiThemeInfo
  }

  type Mutation {
  	createTheme(createThemeInput: CreateThemeInput!): ThemeResult
  	deleteTheme(deleteThemeInput: DeleteThemeInput!): StringTypeResult
  	createDuplicateTheme(createDuplicateThemeInput: CreateDuplicateThemeInput!): ThemeResult
  	updateTheme(updateThemeInput: UpdateThemeInput!): ThemeResult
  	updateBrandColors(updateBrandColorsInput: UpdateBrandColorsInput!): ColorsStyleResult
  	updateAdditionalBrandColors(updateAdditionalBrandColorsInput: UpdateAdditionalBrandColorsInput!): ColorsStyleResult
  	updateShape(updateShapeInput: UpdateShapeInput!): ShapeStyleResult	
  	updateTypography(updateTypographyInput: UpdateTypographyInput!): TypographyStyleResult
  	updateGroupName(themeId:String! groupName:String!): CustomizationResult
  	getCustomization(themeId: ID!): CustomizationResult
  	createLogo(createLogoInput: CreateLogoInput!): ImageryStyleResult
  	updateLogo(updateLogoInput: UpdateLogoInput!): StringTypeResult
  	removeLogo(removeLogoInput: RemoveLogoInput!): BooleanTypeResult
  	updateColorOverride(updateColorOverrideInput: UpdateColorOverrideInput!): ColorsStyleResult 
  	updateComponentProp(updateComponentPropInput: UpdateComponentPropInput) : ComponentUpdateResult
  	updateComponentFontProperties(updateComponentFontPropertiesInput: UpdateComponentFontPropertiesInput) : ComponentUpdateResult
  	addFeedback(feedback: String!): Boolean
  	updateThemeRecordForMobile(themeId: String!): Boolean
  	createVariant(createVariantInput:CreateVariantInput!):ThemeResult
  	deleteVariant(deleteVariantInput:DeleteVariantInput!): ThemeResult
  	publishTheme(themeId: String! newOrder: Int!): M2MUXAppThemeResult
  	unpublishTheme(m2mAppThemeId: String!): M2MUXAppThemeResult
  	updateThemeOrder(themeId: String! order:Int!): M2MUXAppThemeResult
  	uploadIllustration(uploadIllustrationInput: UploadIllustrationInput!): IllustrationStyleResult
  	revertIllustrationOverride(revertIllustrationInput: RevertIllustrationInput!): IllustrationStyleResult	
  	uploadCustomFonts(uploadCustomFontsInput: UploadCustomFontsInput!): CustomFontResult
  	deleteCustomFontFamily(deleteCustomFontFamilyInput: DeleteCustomFontsInput!): CustomFontResult
  }

  type ThemeName {
  	id: String
  	name: String
  	groupName: String
  	variants: [ThemeNameVariant]
  }

  type MultiThemeInfo {
  	m2mAppThemeExists: Boolean,
  	m2mAppThemeEntriesExist: Boolean
  }

  type ThemeNameVariant {
  	id: String
  	name: String
  }

  type ThemePaginationResult {
  	rowCount: Int
  	hasNext: Boolean
  	hasNonThemeBuilderThemes: Boolean
  	themes: [M2MUXAppTheme] @source(value: "themes")
  }

  type M2MUXAppTheme {
  	order: Int
  	id: String
  	isPublished: Boolean
  	isDuplicateThemeRecordExistInM2MAppTheme: Boolean
  	theme: Theme @source(value: "themeId")
  }

  type Theme {
  	id: ID @source(value: "sys_id.value")
  	name: String @source(value: "name.value") 
  	description: String
  	styles : [Style] @source(value: "sys_id.value")
  	updatedOn: String @source(value: "sys_updated_on.value")
  	createdOn: String @source(value: "sys_created_on.value")
  	createdBy: String @source(value: "sys_created_by.display_value")
  	updatedBy: String @source(value: "sys_updated_by.display_value")
  	domain: Domain
  	scope: Scope
  	customization: Customization @source(value: "sys_id.value")
  }

  type MobileApp {
  	id: ID @source(value: "sys_id.value")
  	name: String @source(value: "name.value")
  	mobileTheme: Theme @source(value: "mobile_theme.value")
  	sysScope: String @source(value: "sys_scope.value")
  	mobileThemeName:String @source(value:"mobile_theme.display_value")
  	isThemeBuilderTheme:Boolean @source(value: "mobile_theme.value")
  }

  type Customization {
  	id: String!
  	value: String!
  }

  type Domain {
  	id: String 
  	label: String
  	path: String
  }

  type Scope {
  	id: String 
  	label: String
  }

  interface Style {
  	id: ID @source(value: "sys_id.value")
  	type: String @source(value: "type.value")
  	name: String @source(value: "name.value")
  	style: String @source(value: "style.value")
  	updatedOn: String @source(value: "sys_updated_on.value")
  	createdOn: String @source(value: "sys_created_on.value")
  }

  type UnknownStyle implements Style {
  	id: ID @source(value: "sys_id.value")
  	type: String @source(value: "type.value")
  	name: String @source(value: "name.value")
  	style: String @source(value: "style.value")
  	updatedOn: String @source(value: "sys_updated_on.value")
  	createdOn: String @source(value: "sys_created_on.value")
  }

  type ColorsStyle implements Style {
  	id: ID @source(value: "sys_id.value")
  	type: String @source(value: "type.value")
  	name: String @source(value: "name.value")
  	style: String @source(value: "style.value")
  	generatedColors: String @source(value: "style.value")
  	colors: Color @source(value: "style.value")
  	updatedOn: String @source(value: "sys_updated_on.value")
  	createdOn: String @source(value: "sys_created_on.value")
  }

  type ImageryStyle implements Style {
  	id: ID @source(value: "sys_id.value")
  	type: String @source(value: "type.value")
  	name: String @source(value: "name.value")
  	style: String @source(value: "style.value")
  	logos: [Logo] @source(value: "sys_id.value")
  	updatedOn: String @source(value: "sys_updated_on.value")
  	createdOn: String @source(value: "sys_created_on.value")
  }
  type IllustrationStyle {
  	imagery: ImageryStyle,
  	customization: Customization
  }

  type ShapeStyle implements Style {
  	id: ID @source(value: "sys_id.value")
  	type: String @source(value: "type.value")
  	name: String @source(value: "name.value")
  	style: String @source(value: "style.value")
  	corner: Shape @source(value: "style.value")
  	updatedOn: String @source(value: "sys_updated_on.value")
  	createdOn: String @source(value: "sys_created_on.value")
  }

  type TypographyStyle implements Style {
  	typography: Font @source(value: "style.value")
  	id: ID @source(value: "sys_id.value")
  	type: String @source(value: "type.value")
  	name: String @source(value: "name.value")
  	style: String @source(value: "style.value")
  	updatedOn: String @source(value: "sys_updated_on.value")
  	createdOn: String @source(value: "sys_created_on.value")
  	fonts: [FontAsset] @source(value: "sys_id.value")
  }

  type CustomFont {
  	typography: TypographyStyle,
  	customization: Customization @source(value: "customization.sys_id.value")
  }

  type Color {
  	primary: String,
  	neutral: String,
  	secondary: String,
  	additional: [AdditionalColor]

  }

  type AdditionalColor {
  	hook: String!,
  	value: String!
  }


  type Shape {
  	value: String
  }

  type Font {
  	value: String
  }

  type Logo {
  	assetId: ID
  	props: String
  	file: String
  	fileName: String
  	fileType: String
  	m2mStyleAssetId: String
  	attachmentId: String
  }

  type FontAsset {
  	name: String
  	url: String
  	properties: FontProperties
  	assetId: ID
  	m2mStyleAssetId: String
  }

  type FontProperties {
  	style: String
  	weight: String
  	subFamily: String
  }

  type Experience {
  	id: ID 
  	title: String
  	uri: String
  }

  type BooleanType {
  	value: Boolean!
  }

  type StringType {
  	value: String!
  }

  enum ErrorType {
  	critical
  	warning
  	info
  }

  type Logger {
  	messageType: ErrorType!
  	message: String
  }

  type ComponentPropertyResult {
  	style: String
  	customization: Customization
  }

  union ThemeResult = Theme | Logger
  union CustomizationResult = Customization | Logger
  union ColorsStyleResult = ColorsStyle | Logger
  union ShapeStyleResult = ShapeStyle | Logger
  union TypographyStyleResult = TypographyStyle | Logger
  union ImageryStyleResult = ImageryStyle | Logger
  union IllustrationStyleResult = IllustrationStyle | Logger
  union CustomFontResult = CustomFont | Logger

  union BooleanTypeResult = BooleanType | Logger
  union StringTypeResult = StringType | Logger
  union ComponentUpdateResult = ComponentPropertyResult | Logger
  union M2MUXAppThemeResult = M2MUXAppTheme | Logger

  input CreateThemeInput {
  	name: String!,
  	description: String
  }
  input DeleteThemeInput {
  	id: String!,
  }

  input CreateDuplicateThemeInput {
  	id: String!,
  }

  input UpdateThemeInput {
  	id: ID!
  	name: String!,
  	description: String
  }

  input CreateVariantInput {
  	name: String!
  	groupName: String!,
  	themeId: String
  	isDark: Boolean
  	colors: ColorInput
  	variantStyle: String
  }

  input ColorInput {
  	primary: String,
  	neutral: String,
  	secondary: String,
  }

  input DeleteVariantInput{
  	id:String!,
  	themeId:String!
  }

  input DeleteCustomFontsInput {
  	fontIds: [ID]!
  	themeId: String!
  }


  input UpdateBrandColorsInput {
  	id: ID!,
  	themeId: ID!
  	primary: String
  	secondary: String
  	neutral: String
  	isSecondaryColorUpdated: Boolean
  	propertyOverrides: [Property!]
  	isVariant: Boolean
  }

  input UpdateAdditionalBrandColorsInput {
  	id: ID!
  	additional: [AdditionalColorInput]
  	themeId: ID!
  	isVariant: Boolean
  }

  input AdditionalColorInput {
  	hook: String
  	value: String
  }

  input UpdateTypographyInput {
  	id: ID!,
  	properties: [Property!]!
  }

  input UpdateShapeInput {
  	id: ID!,
  	properties: [Property!]!
  }

  input Property {
  	id: String!,
  	value: String!
  }

  input UploadIllustrationInput {
  	styleId: ID!
  	file: String!
  	fileName: String!
  	fileType: String!
  	tokenId: String!
  	themeId: String!
  }
  input RevertIllustrationInput {
  	styleId: ID!
  	themeId: String!
  	tokenId: String!
  }
  input UploadCustomFontsInput {
  	fontsPayload: [FontsInput]!
  	themeId: String!
  }

  input FontsInput {
  	font: String!
  	metadata: FileMetaData!
  }

  input FileMetaData {
  	fontWeight: String,
  	fontStyle: String,
  	fontFamily: String,
  	fontSubfamily: String,
  	fontFileName: String,
  }
  input CreateLogoInput {
  	styleId: ID!
  	file: String!
  	fileName: String!
  	fileType: String!
  }

  input UpdateLogoInput {
  	assetId: ID!
  	file: String!
  	fileName: String!
  	fileType: String!
  }

  input RemoveLogoInput {
  	m2mStyleAssetId: ID!
  }

  input UpdateColorOverrideInput {
  	id: ID!
  	themeId: ID!
  	override: Property!
  	propertyOverrides: [Property!]
  	isVariant: Boolean
  	isRevert: Boolean
  }

  input UpdateComponentPropInput {
  	id: ID!
  	themeId: ID!
  	isVariant: Boolean
  	override: ComponentOverrideProperty
  	isRevert: Boolean
  }

  input UpdateComponentFontPropertiesInput {
  	id: ID!
  	themeId: ID!
  	isVariant: Boolean
  	override: [ComponentOverrideProperty!]
  	isRevert: Boolean
  	fontFamily: String
  }

  input ComponentOverrideProperty {
  	id: String!
  	value: String
  	hook: String
  	component: String,
  	type: String!
  	isRevert: Boolean
  }
sys_name: Theme Builder
sys_policy: ''
