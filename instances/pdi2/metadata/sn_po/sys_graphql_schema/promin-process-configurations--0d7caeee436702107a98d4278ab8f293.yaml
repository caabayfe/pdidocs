schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	getTableColumns(table: String!, types: [String!]): GetTableColumnsResponse
  	prominProcessPermissions: ProcessPermissionsResponse
  	getProcessKPICategoryChoices(sysParamQuery: String!): CategoryChoiceResponse
  	getTableColumnChoices(table: String!,field: String!): TableColumnChoicesResponse
  	getTableMetadata(table: String!): TableMetadataResponse
  	generateAIRecommendations(table: String!): GenerateAIRecommendationsResponse
  	generateStateResponsibilityMapping(table: String!, stateField: String!): GenerateStateResponsibilityMappingResponse
  }

  type Mutation {
  	createProminProcessConfiguration(table: String!, isContentPack: Boolean!): NewConfigurationRespone
  	saveProcessConfig(sysId: String!, processConfigPayload: ProcessConfigPayload!): SaveProcessConfigResponse
  	createClusteringDefinition(table: String!, name: String!, fields: [String!]): CreateClusteringDefinitionResponse
  	createChildTableConfig(processDefId: String!, table: String!, sourceField: String!, targetField: String!): BasicResponse
  	updateChildTableConfig(childConfigId: String!, sourceField: String!): BasicResponse
  	deleteChildTableConfig(childConfigId: String!): BasicResponse
  	upsertProcessPerspectiveField(processId: String!, fieldPayload: PerspectiveFieldPayload!): PerspectiveFieldResponse
  	deleteProcessPerspectiveField(id: String!): PerspectiveFieldResponse
  	deleteFindingDef(findingIds: String!,table: String!): BasicResponse
  	mutateProcessCategoryKPI(processId: String!, payload: ProcessCategoryKpiPayload!): ProcessCategoryResponse
  	deleteProcessConfigurations(processIds: [String]!, isContentPack: Boolean!): DeleteProcessConfigurationsResponse
  	upsertControlFlowFieldMapping(processId: String!, fieldPayload: String!): ControlFlowFieldMapping
  	saveExcludeDataFilters(processId: String!, excludeType: ExcludeType, table: String!, filterQuery: String!): SaveProcessConfigResponse
  	exportToUpdateset(id: String!): ExportUpdateSetResponse
  }

  enum ExcludeType {
  	TEAMS
  	USERS
  }

  enum PerspectiveType {
  	CONTROL_FLOW
  	RESOURCE_GROUP
  	RESOURCE_USER
  	OTHER
  }

  input PerspectiveFieldPayload {
  	fieldId: String
  	fieldName: String!
