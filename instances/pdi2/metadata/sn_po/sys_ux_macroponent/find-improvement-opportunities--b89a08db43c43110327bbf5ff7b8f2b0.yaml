  }, {
    "message" : "Some improvement opportunities will be surfaced automatically based on patterns. Common definitions like: “Extra step, Rework and outlier detector”  will be utilized to provide automated opportunities. ",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "The library of improvement opportunity definitions offers reusable definitions for multiple projects. A process configuration is required to manage this library, but it is currently missing.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "There are two types of opportunities that could be setup. Using a combination of both for your analysis is a recommended way of optimizing the process. \n\nWhat are the available types of opportunities?",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "These are opportunities that are set based on a specific criteria using a “Rule engine” that could be set based on specifics. For example: long resolution time. The records that match the logic of these specifications will be classified as match for the improvement opportunties.",
