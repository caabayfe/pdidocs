  [ {
    "message" : "- scope your analysis",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "A data source is at the core of defining your analysis. it could be a data table, report, or your own external sheet. On top of having a choice of sources, you could also craft specific conditions that narrow down your optimization scope and contextualize your analysis.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "A state represents the status of a record within a workflow. It shows how the record progresses toward completion.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "A team is a group of users responsible for handling records within a workflow.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Activities",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Activities are actions that are performed in a process. That could be any kind of action, such as creating a document, making a phone call, sending an email, or any other task that's part of a process. Activities can be performed manually by humans or automatically by machines. An activity is implemented within a certain processing time and can have other characteristics, such as a responsible person or cost rate.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Activities are typically recorded in chronological order, allowing process mining algorithms to analyze the sequence of events and uncover insights about the process flow, bottlenecks, variations, and potential improvements. By analyzing the events, process mining techniques can provide valuable information about the actual execution of a process.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Activities list body container",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Activity definition does not appear on the process graph, but can be used in the findings and process steps",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Activity form body container",
    "code" : "",
    "comment" : ""
  }, {
