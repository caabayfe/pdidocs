  }, {
    "message" : "Breakdown",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Breakdown filters in process mining are used to segment and analyze the process data based on specific criteria or attributes. They allow you to break down the process analysis into smaller subsets, focusing on specific dimensions or perspectives of the process.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Breakdown form body container",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Breakdowns",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Breakdowns list body container",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "By applying the right breakdown filters, you can focus on specific aspects of the process and derive more meaningful Improvement areas. This will also allow your team to slice and compare different aspects of a process.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Cancel",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Case idle time metrics help track the duration when cases are awaiting assignment to agents but are expected to progress by the provider. These metrics identify delays during unassigned periods, highlighting inefficiencies where cases are stagnant in the process. By analyzing idle time, teams can improve task allocation and resource management, reducing delays and ensuring smooth case flow, ultimately boosting productivity and compliance with service level agreements.",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Child entities available to be added to your scope as defined in the ",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Choose from recommended breakdown fields",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Choosing the right fields depends on what your team is aiming to achieve. Commonly tracked activities include: assignment groups, state, category and more. A combination of those is usually used to gain visibility in various aspects of process improvement, such as process discovery and conformance.",
