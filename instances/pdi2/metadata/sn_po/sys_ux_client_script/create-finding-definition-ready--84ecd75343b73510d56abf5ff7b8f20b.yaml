name: create finding definition ready
preset: ''
required_translations: |-
  [
      {
          "message": "Improvement opportunity definition"
      },
      {
          "message": "Rule-based"
      },
      {
          "message": "By setting up your own rules, you can focus on specific areas of the process that you'd want to learn more about, allowing for the identification of improvement opportunities for a given use case."
      },
      {
          "message": "Examples of rule based improvement opportunity definitions"
      },
      {
          "message": "Ping-Pong"
      },
      {
          "message": "Surfaces areas in the process where records continuously bounce between two steps. Identifying these loops helps determine the necessary improvements."
      },
      {
          "message": "Ping-Pong is seen here between both assignment groups, caused by continuous reassignment"
      },
      {
          "message": "Extra step"
      },
      {
          "message": "Surfaces variants (routes) in the process that differ by only one additional step, which could possibly be automated or eliminated to save time."
      },
      {
          "message": "Slow duration (Transition)"
      },
      {
          "message": "Surfaces a group of records that have an unusual duration that's higher than the average duration of another group of records. This helps uncover slower progression for a significant group of records."
      },
      {
          "message": "Extreme duration (Transition)"
      },
      {
          "message": "Surfaces transitions that take significantly longer than the median duration. This helps uncover potential duration anomalies."
      },
      {
          "message": "Right-hand side transition takes significantly longer than the median duration (3 days) to complete"
      },
      {
          "message": "Extreme repetition"
      },
      {
          "message": "Surfaces transitions that are repeated significantly more than the median repetition. This helps uncover potential repetition anomalies."
      },
      {
          "message": "Repeating pattern"
      },
      {
          "message": "Surfaces the repetition of a specific order of steps. This could signal a chance to improve or automate certain parts or the process that are revisited."
      },
      {
          "message": "Rework"
      },
      {
          "message": "Surfaces repeated process steps. This helps in identifying situations where there could be frequent repetition of work."
      },
      {
          "message": "Extreme touchpoints (Node)"
      },
      {
          "message": "Surfaces steps with an unusually large number of record updates than the median. This highlights steps that require extremely high effort."
      },
      {
          "message": "\"Work in progress\" required 85 record updates to move to any next step which is over 20 times the median."
      },
      {
          "message": "High touchpoints (Node)"
      },
      {
          "message": "Surfaces a group of records in a step that has, on average, more updates than another group. This points to high-effort steps demonstrated by some records while others required fewer updates."
      },
      {
          "message": "Extreme duration (Node)"
      },
      {
          "message": "Surfaces records that stay in a step for a significantly longer duration than the median. This helps uncover extremely delayed steps."
      },
      {
          "message": "Some records took 115 days to move from \\\"Work in progress\\\" to any next step which is over 50 times the median."
      },
      {
          "message": "Slow duration (Node)"
      },
      {
          "message": "Surfaces a group of records that, on average, stay longer in a step than another group. It points to delayed steps demonstrated by some records while others progressed faster."
      },
      {
          "message": "Group of records (G2) took longer to move from “On hold” to any next step."
      }
  ]
