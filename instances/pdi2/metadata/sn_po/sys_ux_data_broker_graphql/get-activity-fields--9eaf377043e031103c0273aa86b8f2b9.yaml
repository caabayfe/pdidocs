query: |-
  query($tableName: String!, $currentTableName: String!, $entityId: String!) {
    snPo {
      GlidePromin {
        prominAllowedColumnList(tableName: $tableName, currentTableName: $currentTableName, entityId: $entityId) {
          success
          message
          fields {
            name
            label
            internalType
          }
        }
      }
    }
  }
