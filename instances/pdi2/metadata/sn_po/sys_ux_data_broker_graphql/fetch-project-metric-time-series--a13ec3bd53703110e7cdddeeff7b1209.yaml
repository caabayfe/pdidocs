api_name: sn_po.Fetch project metric time series
batch_exclude: 'false'
description: Fetch project metric time series
mutates_server_data: 'false'
name: Fetch project metric time series
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "versionId",
          "label": "Version ID",
          "description": "Version ID",
          "fieldType": "string",
          "mandatory": true
      }
  ]
query: |-
  query ($versionId: ID!) {
    GlidePromin_Query {
      timeSeries(versionId: $versionId) {
        unit
        bins {
          value
          time
          frequency
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Version ID",
    "comment" : ""
  } ]
