api_name: sn_po.Get project info
batch_exclude: 'false'
description: ''
mutates_server_data: 'false'
name: Get project info
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project Id",
      "description": "Sys ID of the project to get information for",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: String!) {
    snPo {
      GlidePromin {
        getProjectInfo(projectId: $projectId) {
          success
          errorMessage
          projectInfo {
            isShared
            autoRetiredMessage
            userInfo {
              isSnPoAdmin
              isSnPoPowerUser
              isSnPoAnalyst
              isSnAiaViewer
            }
            permissions {
              auto_retire
              getLEProgressTypeFieldPresent
              iscreatorUserPresent
              isMaint
              isCreator
              promin_project {
                canCreate
                canDelete
                canRead
                canWrite
                fields {
                  auto_retire {
                    canWrite
                  }
                  content_pack {
                    canWrite
                  }
                  goal {
                    canWrite
                  }
                  is_template {
                    canWrite
                  }
                  source {
                    canWrite
                  }
                }
              }
              promin_activity_def {
                canCreate
                canDelete
                canRead
                canWrite
              }
              promin_project_entity {
                canCreate
                canDelete
                canRead
                canWrite
                fields {
                  custom_end_condition {
                    canWrite
                  }
                  custom_start_condition {
                    canWrite
                  }
                  external_dataset {
                    canWrite
                  }
                  filter {
                    canWrite
                  }
                  include_approvals {
                    canWrite
                  }
                  report_source {
                    canWrite
                  }
                  source_type {
                    canWrite
                  }
                  table {
                    canWrite
                  }
                }
              }
              promin_breakdown_field {
                canCreate
                canDelete
                canRead
                canWrite
              }
              promin_finding_def {
                canCreate
                canDelete
                canRead
                canWrite
                fields {
                  copied_from {
                    canWrite
                  }
                }
              }
              promin_automated_finding {
                canCreate
                canWrite
              }
              promin_automated_finding_configuration {
                canCreate
                canWrite
              }
              promin_process_def {
                canCreate
                canWrite
                canRead
              }
            }
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Project Id",
    "comment" : ""
  }, {
    "message" : "Sys ID of the project to get information for",
    "comment" : ""
  } ]
