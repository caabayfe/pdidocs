props: |-
  [
    {
      "name": "sourceType",
      "label": "source type selection in the project creation",
      "description": "source type is required only for archived record",
      "fieldType": "string"
    },
    {
      "name": "excludeNonAuditedTables",
      "label": "Exclude non-audited tables",
      "description": "Exclude non-audit enabled tables from response",
      "fieldType": "boolean"
    }
  ]
query: |-
  query ($sourceType: String, $excludeNonAuditedTables: Boolean) {
    snPo {
      GlidePromin {
        prominAllowedTableList(sourceType: $sourceType, excludeNonAuditedTables: $excludeNonAuditedTables) {
          success
          message
          tables {
            name
            label
          }
        }
      }
    }
  }
