name: Fetch Project information
output_schema: ''
private: 'false'
props: |-
  [ 
   {
      "name": "projectId",
      "label": "project Id",
      "description": "project Id",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: String!) {
    snPo {
      GlidePromin {
        prominProjectPermissions(projectId: $projectId) {
          iscreatorUserPresent
          getLEProgressTypeFieldPresent
        }
      }
    }
  }
