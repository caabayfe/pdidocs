api_name: sn_po.Get project details
batch_exclude: 'false'
description: Get project details
mutates_server_data: 'false'
name: Get project details
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "project Id",
      "description": "project Id",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: ID!) {
    GlidePromin_Query {
      projectConfiguration(projectId: $projectId) {
        ... on GlidePromin_Project {
          projectNumber
          projectId
          name
          description
          status {
            label
            value
          }
          state {
            label
            value
          }
          lastMined
          domain
          retired
          source
          projectEntities {
            entityId
            name
            parentId
            table {
              name
              label
            }
            filter {
              value
              displayValue
            }
            sourceType {
              label
              value
            }
            sourceId
            relationType {
              label
              value
            }
            parentId
            activities {
              id
              field
              label
              displayName
            }
            activitiesOfInterest {
              id
              field
              label
            }
            breakdowns {
              id
              field
              fieldLabel
              table
              filter
              displayName
            }
            customStartCondition {
              entityId
              field
              predicate
              values
              context {
                subType
              }
              subType
              kind
              left {
                field
              }
              right {
                field
              }
            }
            customStopCondition {
              entityId
              field
              predicate
              values
              context {
                subType
              }
              subType
              kind
              left {
                field
              }
              right {
                field
              }
            }
            touchPointFields
            touchPointEnabled
            hasCropOrTransition
            touchPointTimeRange
            touchPointExcludedUsers
            idleTimeEnabled
          }
          goal
          paDashboardId
          paDashboardName
          canAccessPaDashboard
          findingsCount
          automatedFindingsCount
          sysCreatedBy
          errorMessage
          permissions {
            canWrite
            canMine
            canDelete
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "project Id",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Get project details
sys_policy: ''
type: query
use_record_domain: 'false'
