    {
      "name": "slaBreachEntityPayload",
      "label": "Sla Breach Entity payload",
      "description": "New Sla Breach Entity payload being configured",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  mutation ($slaBreachEntityPayload: String!) {
    snPo {
      GlidePromin {
        createProminSlaBreachEntity(
          slaBreachEntityPayload: $slaBreachEntityPayload
        ) {
          success
          message
          entityId
        }
      }
    }
  }
