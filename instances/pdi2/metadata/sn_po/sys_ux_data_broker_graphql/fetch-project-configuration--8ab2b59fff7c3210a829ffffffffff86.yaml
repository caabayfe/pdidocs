api_name: sn_po.Fetch project configuration
batch_exclude: 'false'
description: Fetch configuration of the project
mutates_server_data: 'true'
name: Fetch project configuration
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project ID",
      "description": "Sys ID of the project whose latest version is to be fetched",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query snProminProcessListConnected($projectId: ID!) {
    GlidePromin_Query {
      projectConfiguration(projectId: $projectId) {
        name
        projectId
        projectEntities {
          entityId
          touchPointEnabled
          parentId
          name
          table {
            name
            label
          }
        }
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Fetch project configuration
sys_policy: ''
type: query
use_record_domain: 'false'
