api_name: 'sn_po.Get process configuration '
batch_exclude: 'false'
description: Get process configuration details
mutates_server_data: 'true'
name: 'Get process configuration '
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table name",
      "description": "Table name to get process config details",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($table: String!) {
    GlidePromin_Query {
      configuration {
        process(table: $table, isContentPack: false) {
          id
          breakdownConfig {
            importanceField
            classificationFields
          }
          recommendedActivityFields
          perspectiveConfig {
            controlFlow {
              id
              fieldName
              grouped
              includeInNewProject
            }
            resourceUser {
              id
              fieldName
              grouped
            }
            resourceGroup {
              id
              fieldName
              grouped
              includeInNewProject
            }
            other {
              id
              fieldName
              grouped
            }
          }
          touchPoints {
            fields
            users
            timeRange
            enabledForProjects
          }
          idleTime {
            groupTable
            groupFilter
            groupFilterDisplay
            userTable
            userFilter
            userFilterDisplay
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Table name",
    "comment" : ""
  }, {
    "message" : "Table name to get process config details",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: 'Get process configuration '
sys_policy: ''
type: query
use_record_domain: 'false'
