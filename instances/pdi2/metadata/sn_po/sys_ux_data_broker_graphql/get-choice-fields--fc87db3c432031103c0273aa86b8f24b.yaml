api_name: sn_po.Get choice fields
batch_exclude: 'false'
description: Get choice fields of a field from a given table
mutates_server_data: 'false'
name: Get choice fields
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table",
      "description": "Table name",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "column",
      "label": "Column",
      "description": "Column name",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($table: String!, $column: String!) {
    GlideChoiceColumn_Query {
      getChoiceFields(table: $table, column: $column) {
        displayValue
        rawValue
        isDisabled
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Column",
    "comment" : ""
  }, {
    "message" : "Column name",
    "comment" : ""
  }, {
    "message" : "Table",
    "comment" : ""
  }, {
    "message" : "Table name",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Get choice fields
sys_policy: ''
type: query
use_record_domain: 'false'
