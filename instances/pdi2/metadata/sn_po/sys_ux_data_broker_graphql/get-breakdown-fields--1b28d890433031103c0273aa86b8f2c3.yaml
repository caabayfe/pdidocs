api_name: sn_po.Get breakdown fields
batch_exclude: 'false'
description: Get fields for breakdown configuration for a given table
mutates_server_data: 'true'
name: Get breakdown fields
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "tableName",
      "label": "Table name",
      "description": "Table name to get fields from",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "currentTableName",
      "label": "Current table name",
      "description": "Current table context",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "entityId",
      "label": "Entity ID",
      "description": "The sys_id of current entity",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query($tableName: String!, $currentTableName: String!, $entityId: String!) {
    snPo {
      GlidePromin {
        prominAllowedColumnList(tableName: $tableName, currentTableName: $currentTableName, entityId: $entityId) {
          success
          message
          fields {
            name
            label
            internalType
            referenceTable
          }
        }
      }
    }
  }
