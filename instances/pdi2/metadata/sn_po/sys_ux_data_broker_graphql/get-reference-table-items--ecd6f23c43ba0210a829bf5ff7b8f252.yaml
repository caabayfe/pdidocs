api_name: sn_po.Get reference table items
batch_exclude: 'false'
description: Get reference table items
mutates_server_data: 'true'
name: Get reference table items
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "table",
      "description": "The current entity table being configured",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "searchTerm",
      "label": "searchTerm",
      "description": "searchTerm to search the field values",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($table: String!, $searchTerm: String) {
  			snPo {
  				GlideProminFindings {
  					getReferenceItems(table: $table, searchTerm: $searchTerm) {
  						success
  						rowCount
  						items {
  							id
  							label
  						}
  					}
  				}
  			}
  		}
required_translations: |-
