api_name: sn_po.getPlaybookExecutionsCount
batch_exclude: 'false'
description: This endpoint will get the playbook executions for provided encodedQuery. Query contains the playbook definition ID
mutates_server_data: 'false'
name: getPlaybookExecutionsCount
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "encodedQuery",
      "label": "encoded query",
      "description": "encoded query to get the rows count",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($encodedQuery: String) {
    snPo {
      GlidePromin {
        getPlaybookExecutionsCount(encodedQuery: $encodedQuery) {
          count
        }
      }
    }
  }
