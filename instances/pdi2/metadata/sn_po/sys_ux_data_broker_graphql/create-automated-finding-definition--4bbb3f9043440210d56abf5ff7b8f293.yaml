api_name: sn_po.Create automated finding definition
batch_exclude: 'false'
description: Create automated finding definition
mutates_server_data: 'true'
name: Create automated finding definition
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "findingPayload",
      "label": "Finding payload",
      "description": "New current finding payload being configured",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  mutation ($findingPayload: String!) {
    snPo {
      GlidePromin {
        createProminAutomatedFinding(findingPayload: $findingPayload) {
          success
          message
          entityId
          status
          findingId
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Finding payload",
    "comment" : ""
  }, {
    "message" : "New current finding payload being configured",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Create automated finding definition
sys_policy: ''
type: query
use_record_domain: 'false'
