api_name: sn_po.create promin process configuration
batch_exclude: 'false'
description: creates new promin process configuration
mutates_server_data: 'true'
name: create promin process configuration
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "table name",
      "description": "New process configuration is being created for supplied table",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "isContentPack",
      "label": "Is content pack",
      "description": "Is the newly created process configuration a content pack",
      "fieldType": "boolean",
      "mandatory": true
    }
  ]
query: |-
  mutation($table: String!, $isContentPack: Boolean!) {
    snPo {
      GlideProminProcessConfigurations {
        createProminProcessConfiguration(table: $table, isContentPack: $isContentPack) {
          success
          message
          configId
        }
      }
    }
  }
