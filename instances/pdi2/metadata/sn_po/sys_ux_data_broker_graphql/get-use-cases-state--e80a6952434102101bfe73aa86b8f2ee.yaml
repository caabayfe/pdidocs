api_name: sn_po.Get use cases state
batch_exclude: 'false'
description: Get use cases state for include approvals toggle and SLA breach toggle
mutates_server_data: 'true'
name: Get use cases state
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project ID",
      "description": "Sys ID of the current project",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: ID!) {
    snPo {
      GlidePromin {
        getUseCasesState(projectId: $projectId) {
          success
          message
          entities {
            id
            includeApprovals {
              value
              visible
              disabled
              dependentEntityIds
            }
            includeSLABreach {
              value
              visible
              disabled
              dependentEntityIds
            }
            childTables {
              name
              label
              value
              disabled
              dependentEntityIds
            }
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Project ID",
    "comment" : ""
  }, {
    "message" : "Sys ID of the current project",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Get use cases state
sys_policy: ''
type: query
use_record_domain: 'false'
