api_name: sn_po.get idle time configuration
batch_exclude: 'false'
description: get the idle time configuration including new configuration changes and existing project fields
mutates_server_data: 'true'
name: get idle time configuration
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "entityId",
      "label": "Entity Id",
      "description": "Entity Id",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "processId",
      "label": "process Id",
      "description": "Process Id",
      "fieldType": "string",
      "mandatory": false
    }
  ]
query: |-
  query ($entityId: String!, $processId: String) {
    snPo {
      GlidePromin {
        idleTimeConfiguration(entityId: $entityId, processId: $processId) {
          success
          status
          isIdleTimeConfigValid
          fields {
            perspectiveType
            perspectiveField
            name
            internalType
            label
            referenceTable
          }
          projectActivityDefinitions {
            sysId
            field
          }
          message
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Entity Id",
    "comment" : ""
  }, {
    "message" : "Process Id",
    "comment" : ""
  }, {
    "message" : "process Id",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: get idle time configuration
sys_policy: ''
type: query
use_record_domain: 'false'
