api_name: sn_po.Fetch source tables
batch_exclude: 'false'
description: Fetch source tables
mutates_server_data: 'false'
name: Fetch source tables
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "queryConditions",
      "label": "queryConditions",
      "description": "queryConditions filter",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($queryConditions: String) {
    GlideRecord_Query {
      sys_dictionary(
        queryConditions: $queryConditions
        pagination: { limit: 4000 }
      ) {
        _results {
          name {
            value
          }
          sys_id {
            value
          }
          _query {
            GlideRecord_Query {
              sys_db_object(queryConditions: "name=$$parent.name$$") {
                _results {
                  sys_name {
                    displayValue
                  }
                }
              }
            }
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "queryConditions",
    "comment" : ""
  }, {
    "message" : "queryConditions filter",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Fetch source tables
sys_policy: ''
type: query
use_record_domain: 'false'
