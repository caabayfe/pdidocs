name: Get capacity based license info for process mining project
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "project Id",
      "description": "project Id",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: String!) {
    snPo {
      GlidePromin {
        prominGetCapacityBasedLicenseInfo(projectId: $projectId) {
          hasCapacityBasedLicense
          usageLimit
        }
      }
    }
  }
