api_name: sn_po.Create promin activity
batch_exclude: 'false'
description: Create process mining activity for an entity
mutates_server_data: 'true'
name: Create promin activity
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "activityPayload",
      "label": "Activity payload",
      "description": "New current activity payload being configured",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  mutation ($activityPayload: String!) {
    snPo {
      GlidePromin {
        createProminActivity(activityPayload: $activityPayload) {
          success
          message
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Activity payload",
    "comment" : ""
  }, {
    "message" : "New current activity payload being configured",
    "comment" : ""
  } ]
