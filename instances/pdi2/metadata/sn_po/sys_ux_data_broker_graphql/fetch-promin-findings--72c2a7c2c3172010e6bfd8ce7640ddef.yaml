api_name: sn_po.Fetch Promin findings
batch_exclude: 'false'
description: ''
mutates_server_data: 'false'
name: Fetch Promin findings
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "versionId",
      "label": "Version ID",
      "description": "Version ID",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($versionId: ID!) {
    GlidePromin_Query {
      Findings(versionId: $versionId) {
        id
        message
        category
        totalDuration
        frequency
        categoryDescription
        findingState
        type
        typeLabel
        categoryLabel
        caseIds
        impactedKpis {
          id
          name
          label
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Version ID",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Fetch Promin findings
sys_policy: ''
type: query
use_record_domain: 'false'
