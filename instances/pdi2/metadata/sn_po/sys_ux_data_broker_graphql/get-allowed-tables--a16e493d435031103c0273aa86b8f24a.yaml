api_name: sn_po.Get allowed tables
batch_exclude: 'false'
description: Get allowed tables which can be used as data source for mining
mutates_server_data: 'true'
name: Get allowed tables
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "sourceType",
      "label": "Source type",
      "description": "Source type to fetch allowed tables from",
      "fieldType": "string",
      "mandatory": false
    }
  ]
query: |-
  query($sourceType:String) {
    snPo {
      GlidePromin {
        prominAllowedTableList(sourceType: $sourceType) {
          success
          message
          tables {
            name
            label
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Source type",
    "comment" : ""
  }, {
    "message" : "Source type to fetch allowed tables from",
    "comment" : ""
  } ]
