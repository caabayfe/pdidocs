api_name: sn_po.Update automated finding definition
batch_exclude: 'false'
description: update automated finding definition
mutates_server_data: 'true'
name: Update automated finding definition
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "findingPayload",
      "label": "Finding payload",
      "description": "New current finding payload being configured",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "sysId",
      "label": "Sys Id",
      "description": "Sys ID of finding definition being edited",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  mutation ($sysId: String!, $findingPayload: String!) {
    snPo {
      GlidePromin {
        updateProminAutomatedFinding(
          findingPayload: $findingPayload,
          sysId: $sysId
        ) {
          success
          message
          status
          findingId
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Finding payload",
    "comment" : ""
  }, {
    "message" : "New current finding payload being configured",
    "comment" : ""
  }, {
    "message" : "Sys ID of finding definition being edited",
    "comment" : ""
  }, {
    "message" : "Sys Id",
    "comment" : ""
  } ]
