name: Get process category KPIs
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table name",
      "description": "Process configuration table to get category KPIs from",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($table: String!) {
    GlidePromin_Query {
      configuration {
        process(table: $table, isContentPack: false) {
          categoryKpis {
            id
            category
            categoryLabel
            impactedKpis {
              id
              label
            }
          }
        }
      }
    }
  }
