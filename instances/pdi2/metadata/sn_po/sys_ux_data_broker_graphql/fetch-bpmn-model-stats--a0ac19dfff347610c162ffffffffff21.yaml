api_name: 'sn_po.Fetch BPMN Model Stats '
batch_exclude: 'false'
description: Fetches the header stats for BPMN Process details
mutates_server_data: 'true'
name: 'Fetch BPMN Model Stats '
output_schema: ''
private: 'false'
props: |-
  [{
        "name": "versionId",
        "label": "Version ID",
        "description": "Version ID",
        "fieldType": "string",
        "mandatory": true
    }]
query: |-
  query ($versionId: ID!) {
    GlidePromin_Query {
      version(versionId: $versionId) {
        state {
          label
          value
        }
        projectDefinition {
          name
          projectId
          domain
          projectEntities {
            sourceType {
              value
            }
            parentId
            table {
              label
            }
          }
        }
      }
      scheduleBpmnModel(versionId: $versionId) {
        caseFreq
        totalDuration
        meanDuration
        stdDeviation
        medianDuration
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: 'Fetch BPMN Model Stats '
sys_policy: ''
type: query
use_record_domain: 'false'
