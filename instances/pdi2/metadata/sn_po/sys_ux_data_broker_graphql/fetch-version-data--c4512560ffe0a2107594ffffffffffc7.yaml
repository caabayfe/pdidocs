api_name: sn_po.Fetch Version Data
batch_exclude: 'false'
description: Fetches the given version's data
mutates_server_data: 'false'
name: Fetch Version Data
output_schema: ''
private: 'false'
props: |-
  [{
        "name": "versionId",
        "label": "Version ID",
        "description": "Version ID",
        "fieldType": "string",
        "mandatory": true
    }]
query: |-
  query ($versionId: ID!) {
    GlidePromin_Query {
      version(versionId: $versionId) {
        id
        projectDefinition {
          name
          projectId
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Version ID",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Fetch Version Data
sys_policy: ''
type: query
use_record_domain: 'false'
