api_name: sn_po.Mining summary fetch
batch_exclude: 'false'
description: Mining summary fetch
mutates_server_data: 'true'
name: Mining summary fetch
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "versionId",
      "label": "version Id",
      "description": "version Id of a project",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($versionId: ID!) {
    GlidePromin_Query {
      miningSummary(versionId: $versionId) {
        ... on GlidePromin_MiningSummaryElement {
          startTime
          completionTime
          totalRecordsInScope
          warnings
          statusMessage
          findingSummary {
            status
            ruleFindingDefIds
            automatedFindingDefIds
          }
          errorContext {
            totalEntitlement
            usedRecords
            projectRecordCount
            contractNotStarted
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "version Id",
    "comment" : ""
  }, {
    "message" : "version Id of a project",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Mining summary fetch
sys_policy: ''
type: query
use_record_domain: 'false'
