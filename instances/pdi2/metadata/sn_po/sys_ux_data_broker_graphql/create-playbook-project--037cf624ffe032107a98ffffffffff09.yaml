api_name: sn_po.Create playbook project
batch_exclude: 'false'
description: Playbook project creation service
mutates_server_data: 'true'
name: Create playbook project
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "playbookId",
      "label": "playbook Id",
      "description": "playbook Id",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "snapshotId",
      "label": "snapshot Id",
      "description": "snapshot Id",
      "fieldType": "string",
      "mandatory": false
    },
    {
      "name": "projectName",
      "label": "project name",
      "description": "name of the project",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "description",
      "label": "description",
      "description": "description of the project",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "filterCondition",
      "label": "filterCondition",
      "description": "filterCondition of the project",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "restricted",
      "label": "restricted",
      "description": "restricted flag",
      "fieldType": "boolean",
      "mandatory": false
    },
    {
      "name": "autoRetire",
      "label": "autoRetire",
      "description": "autoRetire flag",
      "fieldType": "boolean",
      "mandatory": false
    }
  ]
query: |-
  mutation (
    $playbookId: ID!
    $snapshotId: ID
    $projectName: String!
    $description: String!
    $filterCondition: String!
    $restricted: Boolean = false
    $autoRetire: Boolean = false
  ) {
    GlidePromin_Mutation {
      createPlayBookProject(
        playbookId: $playbookId
        snapshotId: $snapshotId
        projectName: $projectName
        description: $description
        filterCondition: $filterCondition
        restricted: $restricted
        autoRetire: $autoRetire
      ) {
        projectId
        projectEntities {
          table {
            label
            name
          }
          name
          filter {
            value
          }
        }
      }
    }
  }
required_translations: ''
