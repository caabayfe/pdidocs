props: |-
  [
    {
      "name": "processIds",
      "label": "Process IDs",
      "description": "Sys IDs of process configurations to be deleted",
      "fieldType": "array",
      "mandatory": true
    },
    {
      "name": "isContentPack",
      "label": "Is content pack",
      "description": "Whether the process configurations being deleted are content packs or not",
      "fieldType": "array",
      "mandatory": true
    }
  ]
query: |-
  mutation ($processIds: [String]!, $isContentPack: Boolean!) {
    snPo {
      GlideProminProcessConfigurations {
        deleteProcessConfigurations(
          processIds: $processIds
          isContentPack: $isContentPack
        ) {
          success
          unableToDeleteConfigs
        }
      }
    }
  }
