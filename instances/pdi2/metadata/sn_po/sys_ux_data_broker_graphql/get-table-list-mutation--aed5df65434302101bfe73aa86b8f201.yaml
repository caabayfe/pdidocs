api_name: sn_po.Get table list mutation
batch_exclude: 'false'
description: Get list of all tables filtered by a search term
mutates_server_data: 'true'
name: Get table list mutation
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "sourceType",
      "label": "Source type",
      "description": "Source type of the tables to be returned",
      "fieldType": "string"
    },
    {
      "name": "searchTerm",
      "label": "Search term",
      "description": "Search text based on the which the tables are filtered",
      "fieldType": "string"
    }
  ]
query: |-
  query ($sourceType: String, $searchTerm: String) {
    snPo {
      GlidePromin {
        getTableList(sourceType: $sourceType, searchTerm: $searchTerm) {
          success
          tables {
            id
            label
          }
          rowCount
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Search term",
