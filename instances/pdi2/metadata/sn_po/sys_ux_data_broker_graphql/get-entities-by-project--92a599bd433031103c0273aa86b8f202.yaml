api_name: sn_po.Get entities by project
batch_exclude: 'false'
description: ''
mutates_server_data: 'true'
name: Get entities by project
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project ID",
      "description": "Project ID",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: ID!) {
    GlidePromin_Query {
      projectConfiguration(projectId: $projectId) {
        ... on GlidePromin_Project {
          projectEntities {
            entityId
            name
            parentId
            table {
              name
              label
            }
            filter {
              value
            }
            sourceType {
              value
            }
            sourceId
            relationType {
              label
              value
            }
            parentId
            activities {
              id
              field
              label
              displayName
              type
              fieldType
            }
            activitiesOfInterest {
              id
              field
              label
              displayName
            }
            breakdowns {
              id
              field
              fieldLabel
              table
              filter
              displayName
            }
            customStartCondition {
              entityId
              field
              predicate
              values
              context {
                subType
              }
              subType
              kind
              left {
                field
              }
              right {
                field
              }
            }
            customStopCondition {
              entityId
              field
              predicate
              values
              context {
                subType
              }
              subType
              kind
              left {
                field
              }
              right {
                field
              }
            }
            touchPointFields
            touchPointEnabled
            touchPointExcludedUsers
            touchPointTimeRange
            idleTimeEnabled
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Project ID",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Get entities by project
sys_policy: ''
type: query
use_record_domain: 'false'
