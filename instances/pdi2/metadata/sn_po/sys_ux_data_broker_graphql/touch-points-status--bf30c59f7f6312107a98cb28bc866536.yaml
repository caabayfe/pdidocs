api_name: sn_po.touch points status
batch_exclude: 'false'
description: get the touch points information including the comparison of process and project configuration changes
mutates_server_data: 'true'
name: touch points status
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project Id",
      "description": "Project Id",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "processId",
      "label": "process Id",
      "description": "Process Id",
      "fieldType": "string",
      "mandatory": false
    }
  ]
query: |-
  query ($projectId: String!, $processId: String) {
    snPo {
      GlidePromin {
        touchPointsStatus(projectId: $projectId, processId: $processId) {
          success
          status
          fields {
            id
            label
          }
          newIncomingFields {
            id
            label
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Entity Id",
    "comment" : ""
  }, {
    "message" : "Process Id",
    "comment" : ""
  }, {
    "message" : "process Id",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: touch points status
sys_policy: ''
