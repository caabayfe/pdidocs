props: |-
  [
    {
      "name": "queryConditions",
      "label": "query conditions",
      "description": "table query conditions",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($queryConditions: String) {
  	GlideRecord_Query {
  	  permissions: sn_ac_m2m_request_source(queryConditions: $queryConditions, pagination: {limit: 100, offset: 0}) {
  		_results {
  		  _query {
  			reqData: GlideRecord_Query {
  			  sn_ac_automation_request(queryConditions: "sys_id=$$parent.auto_request$$", pagination: {limit: 100}) {
  				_results {
  				  sys_id {
  					displayValue
  				  }
  				}
  			    }
  		       }
  		  }
  	      }
  	  }
        }
    }
required_translations: |-
  [ {
    "message" : "query conditions",
