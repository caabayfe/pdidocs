api_name: sn_po.Create multiple promin activities
batch_exclude: 'false'
description: Create multiple process mining activities for an entity
mutates_server_data: 'true'
name: Create multiple promin activities
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "activityPayload",
      "label": "Activity payload",
      "description": "New current activity payload being configured",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  mutation ($activityPayload: String!) {
    snPo {
      GlidePromin {
        createMultipleProminActivities(activityPayload: $activityPayload) {
          success
          message
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Activity payload",
    "comment" : ""
  }, {
    "message" : "New current activity payload being configured",
    "comment" : ""
  } ]
