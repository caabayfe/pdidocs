api_name: sn_po.Get breakdown field details
batch_exclude: 'false'
description: Get details about the breakdown field being configured
mutates_server_data: 'true'
name: Get breakdown field details
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "tableName",
      "label": "Table name",
      "description": "Table name of current entity for which activities are being configured",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "field",
      "label": "Field",
      "description": "Field which is being configured",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query($tableName: String!, $field: String!) {
    snPo {
      GlidePromin {
        prominGetActivityFieldDetails(tableName: $tableName, field: $field) {
          success
          message
          fieldDetails {
            internalType
            referenceTable
            label
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Field",
    "comment" : ""
  }, {
    "message" : "Field which is being configured",
    "comment" : ""
  }, {
    "message" : "Table name",
    "comment" : ""
  }, {
    "message" : "Table name of current entity for which activities are being configured",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Get breakdown field details
