api_name: sn_po.Fetch table details
batch_exclude: 'false'
description: Fetches the table details for the model
mutates_server_data: 'false'
name: Fetch table details
output_schema: ''
private: 'false'
props: |-
  [
  	{
  		"name": "versionId",
  		"label": "Version ID",
  		"description": "Version ID",
  		"fieldType": "string",
  		"mandatory": true
  	}
  ]
query: |-
  query ($versionId: ID!) {
    GlidePromin_Query {
      version(versionId: $versionId) {
        projectDefinition {
          projectEntities {
            parentId
            entityId
            name
            table {
              name
            }
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Version ID",
    "comment" : ""
  } ]
