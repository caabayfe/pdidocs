query: |-
  query ($currentEntityTable: String!, $referenceEntityTable: String!, $relationType: String!, $parentEntitySource: String!, $childEntitySource: String!) {
    snPo {
      GlidePromin {
        prominGetTablesRefFields(currentEntityTable: $currentEntityTable, referenceEntityTable: $referenceEntityTable, relationType: $relationType, parentEntitySource: $parentEntitySource, childEntitySource: $childEntitySource) {
          success
          message
          fields {
            name
            label
            refTable
          }
        }
      }
    }
  }
