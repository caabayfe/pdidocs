api_name: sn_po.Fetch Project Permissions
batch_exclude: 'false'
description: |-
  This API gives response for the table and field level ACLs 
  1. promin_activity_def
  2. promin_project_entity
  3. promin_breakdown_field
mutates_server_data: 'false'
name: Fetch Project Permissions
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "project Id",
      "description": "project Id",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: String!) {
    snPo {
      GlidePromin {
        prominProjectPermissions(projectId: $projectId) {
          auto_retire
          getLEProgressTypeFieldPresent
          promin_project {
            canCreate
            canDelete
            canRead
            canWrite
            fields {
              auto_retire {
                canWrite
              }
              content_pack {
                canWrite
              }
              goal {
                canWrite
              }
              is_template {
                canWrite
              }
              source {
                canWrite
              }
            }
          }
          promin_activity_def {
            canCreate
            canDelete
            canRead
            canWrite
          }
          promin_project_entity {
            canCreate
            canDelete
            canRead
            canWrite
            fields {
              custom_end_condition {
                canWrite
              }
              custom_start_condition {
                canWrite
              }
              external_dataset {
                canWrite
              }
              filter {
                canWrite
              }
              include_approvals {
                canWrite
              }
              report_source {
                canWrite
              }
              source_type {
                canWrite
              }
              table {
                canWrite
              }
            }
          }
          promin_breakdown_field {
            canCreate
            canDelete
            canRead
            canWrite
          }
          promin_finding_def {
            canCreate
            canDelete
            canRead
            canWrite
            fields {
              copied_from {
                canWrite
              }
            }
          }
          promin_automated_finding {
            canCreate
            canWrite
          }
          promin_automated_finding_configuration {
            canCreate
            canWrite
          }
          promin_process_def {
            canCreate
            canWrite
            canRead
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "project Id",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Fetch Project Permissions
sys_policy: ''
type: query
use_record_domain: 'false'
