api_name: sn_po.Update automated finding configuration
batch_exclude: 'false'
description: Update automated finding configuration
mutates_server_data: 'true'
name: Update automated finding configuration
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "findingConfigPayload",
      "label": "finding configuration payload",
      "description": "New current finding configuration payload being configured",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  mutation ($findingConfigPayload: String!) {
    snPo {
      GlidePromin {
        updateProminAutomatedFindingConfig(
          findingConfigPayload: $findingConfigPayload
        ) {
          success
          message
          errorMessages {
              configuration
              message
           }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "New current finding configuration payload being configured",
    "comment" : ""
  }, {
    "message" : "finding configuration payload",
    "comment" : ""
  } ]
schema_version: 1.0.0
