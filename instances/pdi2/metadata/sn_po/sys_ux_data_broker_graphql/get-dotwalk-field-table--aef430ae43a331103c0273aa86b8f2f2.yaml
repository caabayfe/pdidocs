query: |-
  query ($rootTable: String!, $field: String!) {
    snPo {
      GlidePromin {
        prominGetDotwalkFieldTable(rootTable: $rootTable, field: $field) {
          success
          message
          table {
            name
            label
          }
        }
      }
    }
  }
