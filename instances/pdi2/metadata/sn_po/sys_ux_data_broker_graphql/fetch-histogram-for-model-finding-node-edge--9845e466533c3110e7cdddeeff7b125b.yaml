api_name: sn_po.Fetch histogram for model/finding/node/edge
batch_exclude: 'false'
description: Fetch histogram for model/finding/node/edge
mutates_server_data: 'false'
name: Fetch histogram for model/finding/node/edge
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "sourceId",
          "label": "Source ID",
          "description": "Source ID",
          "fieldType": "string",
          "mandatory": true
      },
      {
          "name": "source",
          "label": "Source",
          "description": "Histogram Source",
          "fieldType": "string",
          "mandatory": true
      }
  ]
query: |-
  query ($source: GlidePromin_HistogramSourceType!, $sourceId: String!) {
    GlidePromin_Query {
      histogram(source: $source,  sourceId: $sourceId) {
        type
        bins {
          leftRangeInclusive
          rightRangeExclusive
          value
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Histogram Source",
    "comment" : ""
  }, {
    "message" : "Source",
    "comment" : ""
  }, {
    "message" : "Source ID",
    "comment" : ""
  } ]
