api_name: sn_po.Fetch Promin header state
batch_exclude: 'false'
description: Fetches the header data for Process details
mutates_server_data: 'false'
name: Fetch Promin header state
output_schema: ''
private: 'false'
props: |-
  [{
        "name": "versionId",
        "label": "Version ID",
        "description": "Version ID",
        "fieldType": "string",
        "mandatory": true
    }]
query: |-
  query ($versionId: ID!) {
    GlidePromin_Query {
      version(versionId: $versionId) {
        id
        isObsolete
        filterSets {
          id
        }
        state {
          label
          value
        }
        projectDefinition {
          name
          projectId
          domain
          restricted
          paDashboardId
          paDashboardName
          canAccessPaDashboard
          projectEntities {
            sourceType {
              value
            }
            parentId
            entityId
            table {
              name
              label
            }
          }
          permissions {
            canMine
            canWrite
            canDelete
            canShare
          }
        }
        miningStats {
          totalRecords
          accessibleRecords
          recordsWithAudit
        }
        rootAggregates {
          modelId
          entityId
          model {
            caseCount
            variantCount
            avgCaseDuration
            trimmedAverage
            stdDeviation
            medianDuration
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Version ID",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Fetch Promin header state
sys_policy: ''
type: query
use_record_domain: 'false'
