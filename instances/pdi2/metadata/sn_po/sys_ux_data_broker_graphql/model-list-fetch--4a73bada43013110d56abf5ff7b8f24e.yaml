query: |-
  query snProminProcessListConnected(
    $limit: Int
    $orderBy: GlidePromin_ModelSummarySortField
    $orderByDesc: Boolean
    $projectPermissionType: GlidePromin_ProjectPermissionType
    $query: String
  ) {
    GlidePromin_Query {
      modelSummaryResult(
        offset: 0
        limit: $limit
        orderBy: $orderBy
        orderByDesc: $orderByDesc
        projectPermissionType: $projectPermissionType
        query: $query
      ) {
        modelSummaries {
          canViewWorkbench
          aggregate {
            entityId
            model {
              caseCount
              variantCount
              avgCaseDuration
              stdDeviation
            }
          }
          version {
            id
            trackerId
            name
            lastMined
            projectDefinition {
              name
              projectId
              description
              owner {
                sysId
                displayName
              }
              state {
                label
                value
              }
              watchList
              status {
                label
                value
              }
              lastMined
              permissions {
                canWrite
                canMine
                canDelete
              }
              projectEntities {
                entityId
                parentId
                name
                table {
                  name
                  label
                }
                activities {
                  id
                  field
                  label
                  displayName
                }
                activitiesOfInterest {
                  id
                  field
                  label
                  displayName
                }
              }
            }
          }
        }
      }
    }
  }
