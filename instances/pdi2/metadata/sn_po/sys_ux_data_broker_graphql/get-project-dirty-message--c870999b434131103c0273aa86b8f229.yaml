api_name: sn_po.Get project dirty message
batch_exclude: 'false'
description: Gets the message to show based on the project dirty flag
mutates_server_data: 'false'
name: Get project dirty message
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project ID",
      "description": "The sys_id of the current project",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "currentTableDisplayName",
      "label": "Current table display name",
      "description": "The table display name to be shown in the dirty message",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($projectId: String!, $currentTableDisplayName: String!) {
    snPo {
      GlidePromin {
        prominGetProjectDirtyMessage(projectId: $projectId, currentTableDisplayName: $currentTableDisplayName) {
          success
          message
          status
        }
      }
    }
  }
