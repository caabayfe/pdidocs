api_name: sn_po.Fetch Promin root model transitions
batch_exclude: 'false'
description: Fetches the transitions for Process Mining
mutates_server_data: 'false'
name: Fetch Promin root model transitions
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "versionId",
          "label": "Version ID",
          "description": "Version ID",
          "fieldType": "string",
          "mandatory": true
      }
  ]
query: |-
  query ($versionId: ID!) {
      GlidePromin_Query {
          scheduleModel(versionId: $versionId) {
              ... on GlidePromin_Model {
                  projectEntities{
                      parentId
                      entityId
                      name
                      table {
                          name
                          label
                      }
                      activities {
                          id
                          field
                          label
                          displayName
                      }
                  }
                  aggregates {
                      entityId
                      model {
                          caseCount
                      }
                  }
                  
                  nodes {
                      key
                      label

                      activityId
                      entityId
                      activity {
                          id
                          field
                          label
                          displayName
                      }

                      isStart
                      isEnd

                      absoluteFreq
                      caseFreq
                      maxReps

                      fieldLabel
                      field
                      value
                  }
                  edges {
                      from
                      to
                      absoluteFreq
                      caseFreq
                      maxReps
                      totalDuration
                      maxDuration
                      minDuration
                      avgDuration
                      trimmedAverage
                      stdDeviation
                      medianDuration
                  }
              }
          }
      }
  }
required_translations: |-
  [ {
    "message" : "Version ID",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Fetch Promin root model transitions
sys_policy: ''
type: query
use_record_domain: 'false'
