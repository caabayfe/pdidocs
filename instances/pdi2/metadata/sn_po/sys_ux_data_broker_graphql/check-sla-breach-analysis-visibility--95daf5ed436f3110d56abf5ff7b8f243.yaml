api_name: sn_po.Check SLA breach analysis visibility
batch_exclude: 'false'
description: Check if SLA breach analysis is supported for input comma separated tables
mutates_server_data: 'true'
name: Check SLA breach analysis visibility
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "tableNames",
      "label": "Table names",
      "description":  "Table names to check breach analysis visibility",
      "fieldType": "string",
      "mandatory": false
    }
  ]
query: |-
  query ($tableNames: String!) {
    snPo {
      GlidePromin {
        prominIsSlaVisible(tableNames: $tableNames) {
          success
          result {
            table
            visible
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "Table names",
    "comment" : ""
  }, {
    "message" : "Table names to check breach analysis visibility",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Check SLA breach analysis visibility
sys_policy: ''
type: query
use_record_domain: 'false'
