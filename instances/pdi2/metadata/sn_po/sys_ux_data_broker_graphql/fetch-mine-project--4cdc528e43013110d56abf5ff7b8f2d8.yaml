api_name: sn_po.Fetch mine project
batch_exclude: 'false'
description: Fetch mine project
mutates_server_data: 'true'
name: Fetch mine project
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "sysId",
      "label": "sys Id",
      "description": "sysId Id",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "preview",
      "label": "preview",
      "description": "preview",
      "fieldType": "boolean",
      "mandatory": true
    }
  ]
query: |-
  mutation MineModel($sysId: ID!, $preview: Boolean!) {
  	GlidePromin_Mutation {
  		mineModel(projectId: $sysId, preview: $preview) {
  			versionId: id
  			projectDefinition {
  				projectId
  			}
  			isObsolete
  			state {
  				label
  				value
  			}
  			trackerId
  			progress
  		}
  	}
  }
required_translations: |-
  [ {
    "message" : "preview",
    "comment" : ""
  }, {
    "message" : "sys Id",
    "comment" : ""
  }, {
    "message" : "sysId Id",
    "comment" : ""
  } ]
