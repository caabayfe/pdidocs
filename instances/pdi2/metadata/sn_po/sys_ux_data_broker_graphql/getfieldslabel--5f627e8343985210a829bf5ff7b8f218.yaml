api_name: sn_po.getFieldsLabel
batch_exclude: 'false'
description: get field labels
mutates_server_data: 'true'
name: getFieldsLabel
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table name",
      "description": "Table name to get fields from",
      "fieldType": "string",
      "mandatory": true
    },
    {
      "name": "fields",
      "label": "Fields",
      "description": "List of fields to look up lable for",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query ($table: String!, $fields: [String]!) {
    snPo {
      GlidePromin {
        getFieldsLabel(table: $table, fields: $fields) {
          success
          fields {
            id
            label
          }
        }
      }
    }
  }
