api_name: sn_po.Fetch project version
batch_exclude: 'false'
description: Fetch latest version of the project
mutates_server_data: 'true'
name: Fetch project version
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "projectId",
      "label": "Project ID",
      "description": "Sys ID of the project whose latest version is to be fetched",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query snProminProcessListConnected($projectId: ID!) {
    GlidePromin_Query {
      version(projectId: $projectId) {
        id
        trackerId
        name
        lastMined
      }
      projectConfiguration(projectId: $projectId) {
        name
        projectId
        description
        owner {
          sysId
          displayName
        }
        state {
          label
          value
        }
        watchList
        status {
          label
          value
        }
        lastMined
        permissions {
          canWrite
          canMine
          canDelete
        }
        projectEntities {
          entityId
          touchPointEnabled
          parentId
          name
          table {
            name
            label
          }
          activities {
            id
            field
            label
            displayName
          }
          activitiesOfInterest {
            id
            field
            label
            displayName
          }
        }
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Fetch project version
sys_policy: ''
type: query
use_record_domain: 'false'
