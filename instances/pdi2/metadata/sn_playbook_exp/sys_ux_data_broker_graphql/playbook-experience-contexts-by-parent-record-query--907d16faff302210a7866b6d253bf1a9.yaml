batch_exclude: 'false'
description: |-
  Fetches playbook contexts for specified parent record 

  Default Playbook Experience Record Sys Id:  "98e09a560f2200102920c912d4767e1a"  (Global Playbook Experience)
mutates_server_data: 'false'
name: Playbook Experience Contexts By Parent Record Query
output_schema: ''
