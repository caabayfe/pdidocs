query: |-
  query ($parentTable: String!, $parentSysId: String!, $playbookExperienceId: String, $recordGeneratorQuery: String) {
    GlidePlaybookContext_Query {
      getPlaybookContextsByParentRecord(
        parentTable: $parentTable
        parentSysId: $parentSysId
        playbookExperienceId: $playbookExperienceId
        query: $recordGeneratorQuery
      ) {
        provider
        ambChannel
        playbookContexts {
          configProperties {
            showActivityState
            showAutomatedManualIndicator
            filterFields
            maxFormFieldsOnCard
            slaConfiguration
            expandFirstPrioritizedCard
            pendingActivityDisplay
            stageVisibility
          }
          title
          sysId
          parentTable
          parentRecord
          cancellationReason
          canceledBy
          state {
            value
            displayValue
          }
          lanes {
            name
            laneId
            restartRule
            title
            order
            contextId
            state {
              value
            }
            cards {
              title
              contextId
              playbookContextId
              state {
                value
                displayValue
              }
              laneName
              aiAgentStagingUiResponse
              isAiAgentEnabled
              aiAgentConversationId
              aiAgentStatus {
                value
                displayValue
              }
              laneContext {
                name
                title
                order
                state {
                  value
                  displayValue
                }
                restartRule
              }
              assignedTo {
                value
                displayValue
                avatar
              }
              executionIndex
              executionIteration
              order
              activityDefinitionId
              activityType {
                value
                displayValue
              }
              activityId
              activityProperties {
                name
                label
                value
                displayValue
                elementData {
                  type
                  reference
                }
                relatedProperties {
                  name
                  label
                  value
                  displayValue
                  elementData {
                    type
                    reference
                  }
                }
              }
              filterData {
                name
                label
                value
                displayValue
              }
              associatedTable
              associatedRecord
              associatedRecordModCount
              cardRendererTag
              show
              authorizedActions
              prioritized
              restartRule
              activityUI
              errors {
                type
                message
              }
              optional
              name
              parentActivityContextId
            }
            show
            optionalActivities {
              activityId
              label
              description
              activityType
            }
            authorizedActions
          }
          authorizedActions
          canRestart
          restartable
        }
      }
    }
  }
