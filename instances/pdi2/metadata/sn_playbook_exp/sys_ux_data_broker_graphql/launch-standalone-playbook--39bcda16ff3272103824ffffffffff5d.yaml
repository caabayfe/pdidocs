api_name: sn_playbook_exp.Launch Standalone Playbook
batch_exclude: 'false'
description: GraphQL Mutation to launch a Playbook with optional input parameters.
mutates_server_data: 'false'
name: Launch Standalone Playbook
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "processDefinitionId",
          "label": "Process Definition ID",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": true,
          "defaultValue": ""
      },
      {
          "name": "parentRecord",
          "label": "Parent Record",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": false,
          "defaultValue": ""
      },
      {
          "name": "input",
          "label": "Input Parameters",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": false,
          "defaultValue": ""
      }
  ]
query: |-
  mutation ($processDefinitionId: String!, $parentRecord: ID, $input: String) {
  		snPlaybookExp {
  			playbook {
  				launchPlaybook(processDefinitionId: $processDefinitionId, parentRecord: $parentRecord, input: $input) {
  					__typename
  					...launchPlaybookResult
  				}
  			}
  		}
  	}

  	fragment launchPlaybookResult on snPlaybookExp_playbook_TriggerPlaybookResult {
  		... on snPlaybookExp_playbook_PlaybookContext {
  			sys_id
  			parent_table
  			parent_record
  		}
  		... on snPlaybookExp_playbook_TriggerPlaybookError {
  			errorType
  			message
  			parent_table
  			parent_record
  			process_definition_id
  			input
  		}
  	}
required_translations: ''
schema_version: 1.0.0
sys_name: Launch Standalone Playbook
sys_policy: read
type: query
use_record_domain: 'false'
