api_name: sn_playbook_exp.Playbook Experience Trigger Playbook If Not Running Mutation
batch_exclude: 'false'
description: GraphQL Mutation to manually trigger a Playbook if one is not already running on provided parent record.
mutates_server_data: 'false'
name: Playbook Experience Trigger Playbook If Not Running Mutation
output_schema: ''
private: 'false'
props: |-
  [
      {
          "name": "scopedName",
          "label": "Process Definition Scoped Name",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": true,
          "defaultValue": ""
      },
      {
          "name": "parentTable",
          "label": "Table Name",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": true,
          "defaultValue": ""
      },
      {
          "name": "parentRecord",
          "label": "Parent Record",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": true,
          "defaultValue": ""
      },
      {
          "name": "onlyIfNoProcessRunning",
          "label": "Only If No Process Running",
          "readOnly": false,
          "fieldType": "string",
          "mandatory": true,
          "defaultValue": ""
      }
  ]
query: |-
  mutation ($scopedName: String!, $parentTable: String!, $parentRecord: ID!, $onlyIfNoProcessRunning: Boolean) {
  		snPlaybookExp {
  			playbook {
  				triggerPlaybook(scopedName: $scopedName, parentTable: $parentTable, parentRecord: $parentRecord, onlyIfNoProcessRunning: $onlyIfNoProcessRunning) {
  					__typename
  					...triggerPlaybookResult
  				}
  			}
  		}
  	}

  	fragment triggerPlaybookResult on snPlaybookExp_playbook_TriggerPlaybookResult {
  		... on snPlaybookExp_playbook_PlaybookContext {
  			sys_id
  			parent_table
  			parent_record
  		}
  		... on snPlaybookExp_playbook_TriggerPlaybookError {
  			errorType
  			message
  			parent_table
  			parent_record
  		}
  	}
required_translations: |-
  [ {
    "message" : "Only If No Process Running",
    "comment" : ""
  }, {
    "message" : "Parent Record",
    "comment" : ""
  }, {
    "message" : "Process Definition Scoped Name",
    "comment" : ""
  }, {
    "message" : "Table Name",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Playbook Experience Trigger Playbook If Not Running Mutation
sys_policy: ''
type: query
use_record_domain: 'false'
