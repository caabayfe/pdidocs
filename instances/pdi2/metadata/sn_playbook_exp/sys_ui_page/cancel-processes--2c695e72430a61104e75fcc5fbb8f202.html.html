<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<div style="display: flex; flex-direction: column">
		<p>${gs.getMessage('Provide a reason for canceling the processes. This information will show up in the Playbook.')}</p>
		<p>${gs.getMessage('Some processes can’t be canceled right away. They will remain in the Pending Cancel state until their activities finish running.')}</p>
		<label style="margin-top: var(--now-global-space--md,10px); font-size: smaller">${gs.getMessage('Reason for cancelation')}</label>
		<textarea id="reason_to_cancel" placeholder="${gs.getMessage('Enter reason here...')}" class="form-control"></textarea>
		<div class="modal-footer">
			<button id='dismiss_cancel' class="btn btn-default" data-action="discard" data-dismiss="GlideModal">${gs.getMessage('Close')}</button>
			<button id='confirm_cancel' class="btn btn-destructive" disabled="true">${gs.getMessage('Cancel Process')}</button>
		</div>
	</div>
</j:jelly>
