name: solaris_ps_command.sh
parent: ec515c705352320023bdae4a16dc3488
script: |-
  #!/bin/sh
  # Copyright © ServiceNow, Inc. 2017. All rights reserved.
  # 
  # NOTE: this takes two arguments: base dir in $1, zone name in $2
  #
  # Only get our processes, not our child zone processes
  # Core of this script is very similar to 'Solaris - Active Processes' probe parameter ps.sh.
  #
  ZONENAME=$2
  IFS="
  "
  ZONECMD=/usr/bin/zonename
  PSCMD="/usr/bin/ps"
  PSARGS="-o pid,ppid"
  AWKCMD="awk"

  # Solaris 10 and older have ucb/ps installed; Solaris 11 does not by default.
  # But Solaris 11 /usr/bin/ps generates /usr/ucb/ps compatible output for when -
  # is not at the front of the first command argument.
  #
  SOLVERSION=`uname -r`

  BASE_DIR=$1
  CALLPOINT_DIR=`dirname $0`
  ADME_PID=`cat $CALLPOINT_DIR/../adme_collector.pid` 

  # First output just the heading for ps's output, tacking on a COMMAND column
  #echo PID PPID COMMAND

  # Check for existence of zonename command
  if [ ! -z "$ZONENAME" ]; then
          ZONEPARAM="-z ${ZONENAME}"
  elif [ -f $ZONECMD ]; then
      # exists: limit ps to display processes for this zone
          ZONEPARAM="-z `$ZONECMD`"
  else
      # doesn't exist: ps to display all processes 
          ZONEPARAM="-e"
  fi

  # Replace awk command with nawk if it is available 
  # awk has a byte limit of 2559 bytes on older solaris machines
  if hash nawk 2>/dev/null; then
    AWKCMD="nawk"
  fi

  cp /dev/null "${BASE_DIR}/process_samples/process_sample.log"
  cp "${BASE_DIR}/process_samples/all_processes.log" "${BASE_DIR}/process_samples/all_processes_tmp.log"
  # Iterate through each line of ps output...
  for LINE in `$PSCMD $ZONEPARAM $PSARGS | grep -v "PID PPID" | sort | uniq`; do
      PID=`echo $LINE | $AWKCMD '{print $1}'`
      # Check that this line isn't the header, and it's valid in /proc
      if [ "$PID" != "PID" -a -f "/proc/$PID/status" ]; then
          # run ucb/ps as root get full, non-truncated command+args even for processes we don't own.
          # Check if Solaris 11, which may not have /usr/ucb/ps installed.
          # SNC runtime script preprocessor requires ${sudo:...} contain literal string, not a $myvar.
          case $SOLVERSION in
              "5.11") CMD=`${sudo:/usr/bin/ps} awwx $PID | tail +2 | $AWKCMD '{$1="";$2="";$3="";$4="";print $0}'`;;
              *) CMD=`${sudo:/usr/ucb/ps} -awwx $PID | tail +2 | $AWKCMD '{$1="";$2="";$3="";$4="";print $0}'`;;
          esac
          # tack on the command+args to the output        
          echo $LINE $CMD  >> "${BASE_DIR}/process_samples/process_sample.log"
      fi
  done
  cat "${BASE_DIR}/process_samples/process_sample.log" "${BASE_DIR}/process_samples/all_processes_tmp.log" | grep -v "$BASE_DIR" | sort > "${BASE_DIR}/process_samples/all_processes.log"
