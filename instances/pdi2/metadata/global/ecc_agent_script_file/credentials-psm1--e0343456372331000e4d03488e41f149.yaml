script: |-
  <######################
   #	If protected with DPAPI so that it can be passed securely from java process to PowerShell process, unprotect it
   #  and optionally convert it to a secure string, so that it can be used to create the credential object.
   ######################>
  function unprotect {
  	param([string]$protectedText, [Switch]$AsSecureString)

  	# when protected, the text has the format of "ENC_VAL[base64_encoding]"
  	# use regex to detect the pattern and pluck out the base64_ecoding part
  	Add-Type -AssemblyName System.Security
  	if (-Not ($protectedText -match "^ENC_VAL\[((?:[A-Za-z0-9+\/]{4})*(?:[A-Za-z0-9+\/]{2}==|[A-Za-z0-9+\/]{3}=)?)\]$")) {
  		$unprotectedText = $protectedText
  	} else {
  		$base64String = $Matches[1]
  		$protectedBytes = [Convert]::FromBase64String($base64String)
  		$unprotectedBytes = [Security.Cryptography.ProtectedData]::Unprotect($protectedBytes, $null, 'CurrentUser')
  		$unprotectedText = [Text.Encoding]::UTF8.GetString($unprotectedBytes)
  		$unprotectedBytes.Clear()
  	}

  	if ($AsSecureString) {
  		$secureString = New-Object 'Security.SecureString'
  		$chars = $unprotectedText.ToCharArray();
  		for($idx = 0; $idx -lt $chars.Count ; $idx++ ) {
  			$secureString.AppendChar($chars[$idx])
  			$chars[$idx] = 0
  		}
  		$secureString.MakeReadOnly()
  		$unprotectedText = $null
  		return $secureString
  	}
  	return $unprotectedText;
  }

  <######################
   #	Turn password into a SecureString, with the convenience of handling null password or password protected with DPAPI.
   ######################>
  function securePassword {
  	param([string]$password)

  	if ($password) {
  		$passwordSecure = unprotect $password -AsSecureString
  	} else {
  		# If no password was supplied, use an empty instance of SecureString
  		$passwordSecure = new-object System.Security.SecureString;
  		# Add (*) as a marker to differentiate with the debug log messages from the other Credentials.psm1 module
  		SNCLog-DebugInfo "`t(*) No password was supplied"
  	}

  	return $passwordSecure;
  }

  <######################
   #	Turn user/secure password into a credential object for use in cmdlets that take a credential
   ######################>
  function getSecureCredential {
  	param([string]$user, [System.Security.SecureString]$passwordSecure)
  	
  	return new-object -typename System.Management.Automation.PSCredential -argumentlist "$user",$passwordSecure;
  }

  <######################
   #	Turn user/password into a credential object for use in cmdlets that take a credential
   ######################>
  function getCred {
  	param([string]$user, [string]$password)

  	$user = unprotect $user
  	$passwordSecure = securePassword $password
  	return getSecureCredential $user $passwordSecure
  }

  <######################
   #  Turn user/password into a credential object for use in cmdlets that take a credential
   ######################>
  function getCredential {
  	$cred = getCred $env:SNC_username $env:SNC_password
  	return $cred;
  }

  function getDummyCredential {
  	param([string]$username, [string]$password)

  	$passwordSecure = unprotect $password -AsSecureString;
  	$cred = new-object -typename System.Management.Automation.PSCredential -argumentlist "$username",$passwordSecure;
  	return $cred;
  }

  <######################
   # Test the given user and password on the given computer using the test-wsman cmdlet.
   ######################>
  function testCredentialWinRM {
  	$cred = getCredential
  	try {
  		$results = testRemoteHostRunningWinRM -credential $cred
  	} catch [InvalidOperationException] {
  		handleExit 1
  	}

  	return $cred;
  }

  function testNoCredentialWinRM {
  	try {
  		$results = testRemoteHostRunningWinRM
  	} catch [InvalidOperationException] {
  		handleExit 1
  	}
  }

  <######################
   #  Test the given user and password on the given computer using a Get-CimInstance
   #  call to fetch the operating system information.  It uses EA (ErrorAction) Stop to force
   #  the exception handling to handle the error.  This is particularly useful for the error
   #  0x800706BA - The RPC server is unavailable which normally does not get caught in the
   #  exception handling.  If the user and password authenticate successfully against the system,
   #  return a credential object for that user/password
   ######################>
  function testCredentialWMI {
  	param([boolean]$debug)

  	$cred = getCredential
  	try {
  		if ($PSVersionTable.PSVersion.Major -lt 6) {
  			SNCLog-DebugInfo "(*) Running testCredentialWMI: Get-WmiObject win32_operatingsystem -computer $computer -credential $($cred.UserName) -impersonation 3 -authentication 6 -EA Stop"
  			# There isn't a built-in way to control the timeout for Get-WmiObject
  			$null = Get-WmiObject win32_operatingsystem -computer $computer -credential $cred -impersonation 3 -authentication 6 -ErrorAction Stop;
  		} else {
  			SNCLog-DebugInfo "(*) Running testCredentialWMI: CreateNewCimSession -ComputerName $computer -Credential $($cred.UserName)"
  			$cimsession = CreateNewCimSession -Host $computer -Credential $cred -OperationTimeoutSec 5
  			$null = Get-CimInstance win32_operatingsystem -CimSession $cimsession -ErrorAction Stop
  		}
  		return $cred;
  	} catch {
  		SNCLog-DebugInfo "(*) testCredentialWMI failed: " + $_.Exception.Message
  		throw
  	} finally {
  		if ($cimsession) {
  			Remove-CimSession -Session $cimsession -ErrorAction SilentlyContinue
  			$cimsession = $null
  		}
  	}
  }

  function testNoCredentialWMI {
  	param([boolean]$debug)

  	try {
  		if ($PSVersionTable.PSVersion.Major -lt 6) {
  			SNCLog-DebugInfo "(*) Running testNoCredentialWMI without explicit credential: Get-WmiObject win32_operatingsystem -computer $computer -impersonation 3 -authentication 6 -EA Stop"
  			$null = Get-WmiObject win32_operatingsystem -computer $computer -impersonation 3 -authentication 6 -ErrorAction Stop;
  		} else {
  			SNCLog-DebugInfo "(*) Running testNoCredentialWMI: CreateNewCimSession -ComputerName $computer"
  			$cimsession = CreateNewCimSession -Host $computer -OperationTimeoutSec 5
  			$null = Get-CimInstance win32_operatingsystem -CimSession $cimsession -ErrorAction Stop
  		}
  	} catch {
  		SNCLog-DebugInfo "(*) testNoCredentialWMI failed: " + $_.Exception.Message
  		throw	
  	} finally {
  		if ($cimsession) {
  			Remove-CimSession -Session $cimsession -ErrorAction SilentlyContinue
  			$cimsession = $null
  		}
  	}
  }

  <######################
   #  Test the ability to reach a given computer without credentials using a Get-CimInstance
   #  call to fetch the operating system information.  It uses EA (ErrorAction) Stop to force
   #  the exception handling to handle the error.  This is particularly useful for the error
   #  0x800706BA - The RPC server is unavailable which normally does not get caught in the
   #  exception handling.  Bail out of the script if the computer can't be reached.
   ######################>
  function testNoCredentialAccessWMI {
  	param([boolean]$debug)

  	try {
  		if ($PSVersionTable.PSVersion.Major -lt 6) {
  			$null = Get-WmiObject win32_operatingsystem -computer $computer -impersonation 3 -authentication 6 -ErrorAction Stop;
  		} else {
  			$cimsession = CreateNewCimSession -Host $computer -OperationTimeoutSec 5
  			$null = Get-CimInstance win32_operatingsystem -CimSession $cimsession -ErrorAction Stop
  		}
  	} catch [System.Exception] {
  		[Console]::Error.WriteLine("Failed to access target system.  Please check credentials and firewall settings on the target system to ensure accessibility: " + $_.Exception.Message)

  		if ($debug) {
  			[Console]::Error.WriteLine("`r`n Stack Trace: " + $_.Exception.StackTrace)
  		}
  		handleExit 3;
  	} finally {	
  		if ($cimsession) {
  			Remove-CimSession -Session $cimsession -ErrorAction SilentlyContinue
  			$cimsession = $null
  		}
  	}
  }

  <######################
   #  Start an impersonation context where script code executed between this call and the EndImpersonate call is executed
   #  in the security context of the given credential
   #
   #  Return: a context that should be passed to EndImpersonation when the security context of the given credential
   #  is not needed anymore
   ######################>
  function startImpersonation {
      param([System.Management.Automation.PSCredential]$cred)

  	# If no credential is provided, use the global credential
  	if (-not $cred) { $cred = $global:cred}

  	if (-not $cred) {
  		SNCLog-DebugInfo "(*) No credential is provided for impersonation"
  		return $null
  	}

  	SNCLog-DebugInfo "(*) Starting impersonation with credential: $($cred.UserName)"

  	if ($PSVersionTable.PSVersion.Major -lt 6) {
          $context = $null
  		$signature = "[DllImport(""advapi32.dll"", SetLastError = true)] `
                  public static extern bool LogonUser(string lpszUsername, string lpszDomain, string lpszPassword, `
                  int dwLogonType, int dwLogonProvider, ref IntPtr phToken);";

          $LogOnUser = Add-Type -memberDefinition $signature -name "Win32LogOnUser" -passThru;

          [IntPtr]$userToken = [Security.Principal.WindowsIdentity]::GetCurrent().Token;

          # The 9 means LOGON32_LOGON_NEW_CREDENTIALS: See definition at http://msdn.microsoft.com/en-us/library/aa378184%28VS.85%29.aspx
          if ($LogOnUser::LogOnUser($cred.GetNetworkCredential().UserName, $cred.GetNetworkCredential().Domain,
                      $cred.GetNetworkCredential().Password, 9, 0, [ref]$userToken)) {

              $Identity = new-object security.Principal.WindowsIdentity $userToken
              $context = $Identity.Impersonate();
          }
          return $context
      }

  	# This is for PowerShell 7.x
  	if (-not ("Win32Security" -as [type])) {
  		# Win32Security signature definition
  		$signature = @"
  			using System;
  			using System.Runtime.InteropServices;
  			using Microsoft.Win32.SafeHandles;
  			public static class Win32Security {
  				[DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
  				public static extern bool LogonUser(string lpszUsername, string lpszDomain, string lpszPassword,
  					int dwLogonType, int dwLogonProvider, out SafeAccessTokenHandle phToken);

  				[DllImport("advapi32.dll", SetLastError=true)]
  				public static extern bool ImpersonateLoggedOnUser(SafeAccessTokenHandle hToken);

  				[DllImport("advapi32.dll", SetLastError=true)]
  				public static extern bool RevertToSelf();
  			}
  "@ # closing delimiter must be at the first column

  		# Compiles and adds the Win32Security class to the session
  		Add-Type -TypeDefinition $signature -PassThru | Out-Null
  	}

      $token = $null
      if (-not [Win32Security]::LogonUser($cred.GetNetworkCredential().UserName, $cred.GetNetworkCredential().Domain, 
  										$cred.GetNetworkCredential().Password, 9, 0, [ref]$token)) {
          $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
          SNCLog-DebugInfo "`tLogonUser failed with code $err"
          return $null
  	}
  	[Win32Security]::ImpersonateLoggedOnUser($token) | Out-Null
      return $token
  }

  <######################
   #    End a given impersonation context that was started with StartImpersonation
   ######################>
  function endImpersonation {
  	param([System.Object]$context)

  	if (-not $context) {
  		SNCLog-DebugInfo "(*) No context to end impersonation"
  		return
  	}

  	SNCLog-DebugInfo "(*) Running endImpersonation"

  	if ($PSVersionTable.PSVersion.Major -lt 6) {
  		if ($context -is [System.Security.Principal.WindowsImpersonationContext]) {
  			$context.Undo()
  			$context.Dispose()
  		} else {
  			Write-Warning "(*) Failed to process impersonation context: $context";
  		}
  	} else {
  		if ($context -is [Microsoft.Win32.SafeHandles.SafeAccessTokenHandle]) {
  			[Win32Security]::RevertToSelf() | Out-Null
  			$context.Dispose()
  		} else {
  			Write-Warning "(*) Failed to process impersonation context: $context";
  		}
  	}
  }

  <#
  .SYNOPSIS
      Create a new CimSession to use with Get-CimInstance or Invoke-CimMethod working against a remote computer.
  .DESCRIPTION
      By default, New-CimSession creates a CIM session using WSMan protocol - the same protocol used for PS remoting (WinRM)
      If we want to create a CIM session using DCOM protocol - the same protocol used by WMI cmdlets, we need to pass a CIM session options.
      In the CIM session options, we can set the protocol as well the authentication and impersonation level.	
      By default, all CIM sessions created using DCOM have the PacketPrivacy(6) and PacketIntegrity(5) switch parameters set to true.
      In our code base, we set the impersonation level to Impersonate(3) and the authentication level to PacketPrivacy(6).
  .PARAMETER Host
      The name of the remote computer. If not specified, uses the global $computer variable.
  .PARAMETER Credential
      The PSCredential object for authentication. If not specified, uses the global $cred variable.
  .PARAMETER OperationTimeoutSec
      The timeout in seconds for operations performed on the CIM session.
  .PARAMETER SkipTestConnection
      Skip the initial connectivity test during session creation, allowing for manual verification with TestConnection() afterward.
  .NOTES
      There is no option to control the connection timeout in New-CimSession. The OperationTimeoutSec parameter only applies to the operations performed on the CIM session.
  #>
  function CreateNewCimSession {
  	param([string]$Host, [System.Management.Automation.PSCredential]$Credential, [uint32]$OperationTimeoutSec, [switch]$SkipTestConnection)

  	if ($OperationTimeoutSec -eq 0 -and $global:CimSessionOperationTimeoutSec -and $global:CimSessionOperationTimeoutSec -gt 0) {
  		$OperationTimeoutSec = $global:CimSessionOperationTimeoutSec
  	}

  	# if host is not explicitly specified, use the global variable $computer
  	if (-not ($Host)) {
  		$Host = $computer;
  	}

  	# if credential is not explicitly specified, use the global variable $cred
  	if (-not ($Credential)) {
  		$Credential = $cred;
  	}

  	# Create a DComSessionOptions for the cim session with the impersonation level set to Impersonate and the authentication level set to PacketPrivacy
  	# It is equivalent to $so =New-CimSessionOption -Protocol Dcom. Just want to be explicit. 
  	$so = New-CimSessionOption -Impersonation Impersonate -PacketPrivacy

  	# care must be taken in using single quote here: $so, $Credential, and $OperationTimeoutSec are objects
  	# they will be expanded when the script block is created
  	$cmd = 'New-CimSession -ComputerName $Host -SessionOption $so'

  	if ($Credential) {
  		if ($global:isMid) {
  			SNCLog-DebugInfo ("(*) New-CimSession: Omit the credential, because $Host is the local host")
  		} else {
  			$cmd += ' -Credential $Credential'
  		}
  	}

  	if ($OperationTimeoutSec) {
  		$cmd += ' -OperationTimeoutSec $OperationTimeoutSec'
  	}

  	if ($SkipTestConnection) {
  		$cmd += ' -SkipTestConnection'
  	}
      SNCLog-DebugInfo ("(*) Running create CIM session script: " + $ExecutionContext.InvokeCommand.ExpandString($cmd))
  	$sb = [Scriptblock]::Create($cmd)
  	& $sb
  }

  <#
  .SYNOPSIS
      Gets or creates shared CIM sessions for cross-module operations
  .DESCRIPTION
      Manages CIM sessions that can be reused across multiple modules
      to avoid connection overhead and improve performance.
  #>
  function Get-SharedCimSession {
      param(
          [string]$ComputerName,
          [PSCredential]$Credential
      )
      
      if (-not ($ComputerName)) {
          $ComputerName = $global:computer;
      }

      # Generate cache key
      $userName = if ($Credential) { $Credential.UserName } else { "currentuser" }
      $cacheKey = "$ComputerName|$userName"

      # Check if $global:SNC_session matches the requested cache key
      if ($global:SNC_session -and $global:SNC_session -is [Microsoft.Management.Infrastructure.CimSession]) {
          # Extract session's cache key
          $sessionComputerName = $global:SNC_session.ComputerName
          # When MID found a working credential, it stores it in $global:cred
          # and use it to create a new session stored in $global:SNC_session
          $sessionUserName = if ($global:cred) {
              $global:cred.UserName
          } else {
              "currentuser"
          }
          $sessionCacheKey = "$sessionComputerName|$sessionUserName"

          # If it matches, return the existing session
          if ($sessionCacheKey -eq $cacheKey) {
              SNCLog-DebugInfo "(*) Reusing existing `$global:SNC_session for $cacheKey"
              return $global:SNC_session
          }
      }

      # Check if we have a cached session for this key
      if ($global:SNC_CimSessionCache -and $global:SNC_CimSessionCache.ContainsKey($cacheKey)) {
          $wrapper = $global:SNC_CimSessionCache[$cacheKey]
          
          # Check how long it's been idle
          $idleMinutes = ((Get-Date) - $wrapper.LastAccess).TotalMinutes
          
          # Test connection if idle for more than 5 minutes
          if ($idleMinutes -gt 5) {
              SNCLog-DebugInfo "(*) Session idle for $([math]::Round($idleMinutes, 1)) minutes, testing connection"
              try {
                  if ($wrapper.Session.TestConnection()) {
                      SNCLog-DebugInfo "(*) Cached session $($wrapper.Session.InstanceId) is still alive"
                      $wrapper.LastAccess = Get-Date
                      return $wrapper.Session
                  } else {
                      SNCLog-DebugInfo "(*) Cached session is dead, removing"
                      Remove-CimSession -CimSession $wrapper.Session -ErrorAction SilentlyContinue
                      $global:SNC_CimSessionCache.Remove($cacheKey)
                  }
              } catch {
                  SNCLog-DebugInfo "(*) TestConnection failed: $($_.Exception.Message)"
                  Remove-CimSession -CimSession $wrapper.Session -ErrorAction SilentlyContinue
                  $global:SNC_CimSessionCache.Remove($cacheKey)
              }
          } else {
              # Recently used, trust it
              SNCLog-DebugInfo "(*) Reusing cached session $($wrapper.Session.InstanceId) (idle for $([math]::Round($idleMinutes, 1)) minutes)"
              $wrapper.LastAccess = Get-Date
              return $wrapper.Session
          }
      }

      # Create a new session
      SNCLog-DebugInfo "(*) Creating new CIM session for $cacheKey"
      $newSession = CreateNewCimSession -Host $ComputerName -Credential $Credential
      
      # Create wrapper object with session and metadata
      $wrapper = [PSCustomObject]@{
          Session = $newSession
          LastAccess = Get-Date
      }
      
      # Global cache to store session wrappers keyed by "ComputerName|UserName"
      if (-not $global:SNC_CimSessionCache) {
          $global:SNC_CimSessionCache = @{}
      }
      $global:SNC_CimSessionCache[$cacheKey] = $wrapper
      return $newSession
  }

  <#
  .SYNOPSIS
      Closes the shared CIM session
  .DESCRIPTION
      Properly disposes of the shared CIM session and clears the module variable.
  #>
  function Remove-SharedCimSessions {
      if ($global:SNC_CimSessionCache -and $global:SNC_CimSessionCache.Count -gt 0) {
          SNCLog-DebugInfo "(*) Closing all cached CIM sessions..."
          foreach ($cacheKey in $global:SNC_CimSessionCache.Keys) {
              $wrapper = $global:SNC_CimSessionCache[$cacheKey]
              Remove-CimSession -CimSession $wrapper.Session -ErrorAction SilentlyContinue
              SNCLog-DebugInfo "(*) Closed cached CIM session $($wrapper.Session.InstanceId) for $cacheKey"
          }
          $global:SNC_CimSessionCache.Clear()
      }
  }

  <#
  .SYNOPSIS
      Registers cleanup handlers for CIM session management
  .DESCRIPTION
      Sets up automatic cleanup of CIM sessions when PowerShell terminates.
  #>
  function Register-CimSessionCleanup {
      try {
          SNCLog-DebugInfo "(*) Register-CimSessionCleanup on PowerShell.Exiting event"
          Unregister-Event -SourceIdentifier "Powershell.Exiting" -ErrorAction SilentlyContinue
          Register-EngineEvent -SourceIdentifier "Powershell.Exiting" -Action { Remove-SharedCimSessions } -ErrorAction SilentlyContinue
      } catch {
          SNCLog-DebugInfo "(*) Register-CimSessionCleanup failed: " + $_.Exception.Message
      }
  }

  # Auto-register cleanup on module import
  Register-CimSessionCleanup
