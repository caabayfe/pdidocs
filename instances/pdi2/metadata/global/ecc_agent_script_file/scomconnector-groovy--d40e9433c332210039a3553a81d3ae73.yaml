script: |-
  package com.service_now.mid.probe.tpcon.test

  import com.glide.collections.StringMap
  import com.glide.util.Log
  import com.glide.util.ProcessRunner
  import com.glide.util.StringUtil
  import com.glide.util.XMLUtil
  import com.service_now.mid.MIDServer
  import com.service_now.mid.probe.event.IEventSender
  import com.service_now.mid.probe.tpcon.OperationStatus
  import com.service_now.mid.probe.tpcon.OperationStatusType
  import com.service_now.mid.probe.tpcon.ThirdPartyConnector
  import com.snc.commons.eventmgmt.Event
  import org.w3c.dom.Document
  import org.w3c.dom.NodeList
  import com.service_now.mid.services.FileSystem
  import java.text.SimpleDateFormat
  import java.lang.Integer
  import java.sql.Connection;
  import java.sql.DriverManager;
  import java.sql.ResultSet;
  import java.sql.Statement;
  import java.text.DateFormatSymbols;

  //for casetask CSTASK248459, am and pm doesn't work in CANADA locale
  import java.util.Locale;
  import java.text.ParseException;

  import groovy.json.JsonSlurper



  /**
   * @author tal
   */
  public class SCOMConnector extends ThirdPartyConnector {


      private static String TEST_CONNECTOR_SIGNATURE = "1";

      private static TimeZone GMT = TimeZone.getTimeZone("GMT");

      //DEF0081351 change start
      private Long fMinLastModified = null;  //keep lowest value of alert timestamp
      private Long fMaxLastModified = null; //keep highest value of alert timestamp
      private String fMaxLastModifiedAlertId = null; //keep alertId with highest timestamp
      private int fEventsInText = 0; //keep number of events returned from SCOM
      private static int SCOM_ALERT_BULK_SIZE_DEFAULT = 500;
      private int fAlertsBulkSize = SCOM_ALERT_BULK_SIZE_DEFAULT;
      private static int MAX_NUMBER_OF_RETRIES_FOR_GETTING_LOST_EVENTS_DEFAULT = 0;
      private static int MAX_NUMBER_OF_RETRIES_FOR_GETTING_NEXT_DATE_DEFAULT = 10;
      private int fMaxNumberOfRetriesForGettingLostEvents = MAX_NUMBER_OF_RETRIES_FOR_GETTING_LOST_EVENTS_DEFAULT;
      private int fMaxNumberOfRetriesForGettingNextDate = MAX_NUMBER_OF_RETRIES_FOR_GETTING_NEXT_DATE_DEFAULT;
      private static Boolean DEBUG_MODE_ENABLED_DEFAULT= true;
      private static boolean fIsDebugEnabled = DEBUG_MODE_ENABLED_DEFAULT;
      private static Boolean LOG_PAYLOAD_MODE_ENABLED_DEFAULT= false;
      private static Boolean fIslogPayloadForDebug = LOG_PAYLOAD_MODE_ENABLED_DEFAULT;
      private static int DEFAULT_LENGTH_OF_SCOM_ALERT_CONTEXT= 512;
      private static int fContextLength = DEFAULT_LENGTH_OF_SCOM_ALERT_CONTEXT;

      enum SendEventsStatusEnum{
          CHECK_BEFORE_SEND, SEND_IN_ANY_CASE, DO_NOT_SEND
      }
      //DEF0081351 change end

      public OperationStatus execute() {
          fIsDebugEnabled = getIsDebugEnabled();
          fIslogPayloadForDebug = getIsLogPayloadEnabled();
          debug("in execute()")
          String user = context.getUsername();
          if (StringUtil.nil(user)) {
              writeError("FAILURE: Username not provided")
              return new OperationStatus(OperationStatusType.FAILURE);
          }
          String password = context.getPassword();
          def version = getParamValue(context.parameters.scom_version,"2007");

          String sysId = context.parameters.connectorSysId;
          String scom2012 = "SCOMClient2012"  + sysId + ".exe";
          String scom2007 = "SCOMClient"  + sysId + ".exe";

          organizeDllFiles();
          organizeExeFiles(scom2012,  scom2007);
          overrwriteOmDll();

          String signature = context.getLastDiscoverySignature();
          String lastTimeSignature = null;
          String lastEventID = null;

          debug("SCOM signature = " + signature)
          if (signature != null) {
              def dotIdx = signature.indexOf('.')
              if (dotIdx != -1) {
                  lastTimeSignature = signature.substring(0, dotIdx)
                  lastEventID = signature.substring(dotIdx + 1)
              } else {
                  lastTimeSignature = signature
                  lastEventID = ""
              }
          }
          fAlertsBulkSize = Integer.valueOf(getParamValue(context.parameters.scom_alert_bulk_size, String.valueOf(SCOM_ALERT_BULK_SIZE_DEFAULT))) //DEF0081351
          fContextLength =  Integer.valueOf(getParamValue(context.parameters.scom_context_length, String.valueOf(DEFAULT_LENGTH_OF_SCOM_ALERT_CONTEXT))); // DEF0430455
          String events = getLatestEvents(context.getHost(), user, password, lastTimeSignature, scom2012, scom2007);

          if (StringUtil.notNil(events) && events.trim().startsWith("NEEBULA_ERROR:")) {
              String error = events.substring("NEEBULA_ERROR:".length());
              writeError("SCOM connector failed. " + error);
              return new OperationStatus(OperationStatusType.FAILURE);
          }

          boolean isFirstRun = StringUtil.nil(lastTimeSignature) || "null".equals(lastTimeSignature);
          parseAndProcessEvents(events, isFirstRun, lastEventID, lastTimeSignature, SendEventsStatusEnum.CHECK_BEFORE_SEND); //DEF0081351

          //DEF0081351 change start
          //treat case of possible events loss
          //do not treat first run case
          if (isFirstRun){
              return new OperationStatus(OperationStatusType.SUCCESS);
          }

          fMaxNumberOfRetriesForGettingLostEvents = Integer.valueOf(getParamValue(context.parameters.max_retries_get_events, String.valueOf(MAX_NUMBER_OF_RETRIES_FOR_GETTING_LOST_EVENTS_DEFAULT)));
          if (fMaxNumberOfRetriesForGettingLostEvents == 0){ //do not perform the following heuristics
              return new OperationStatus(OperationStatusType.SUCCESS);
          }

          if (fEventsInText >= fAlertsBulkSize) { //need special treatment for lost events
              debug("DEF0081351 alertsBulkSize = " + fAlertsBulkSize + "; fEventsInText = " + fEventsInText)
              
              fMaxNumberOfRetriesForGettingNextDate = Integer.valueOf(getParamValue(context.parameters.max_retries_get_next_date, String.valueOf(MAX_NUMBER_OF_RETRIES_FOR_GETTING_NEXT_DATE_DEFAULT)));

              Long minLastModifiedFromTheFirstGet = fMinLastModified;
              Long maxLastModifiedFromTheFirstGet = fMaxLastModified;
              String maxLastModifiedFromTheFirstGetAlertId = fMaxLastModifiedAlertId;
              
              Long fromDateTime = Long.valueOf(lastTimeSignature) //here lastTimeSignature can't be null since we do not got here for first run
              Long toDateTime = minLastModifiedFromTheFirstGet //start searching from the min modification time of the previous batch
              
              debug("DEF0081351 start backtracking. fromDateTime = " + fromDateTime.toString() + "; toDateTime = " + toDateTime);

              toDateTime = getNextDate(context.getHost(), user, password, fromDateTime, scom2012, scom2007, toDateTime) //get next time period where number of events <= alertsBulkSize
              if (fEventsInText == 0 && toDateTime == minLastModifiedFromTheFirstGet){
                  //we are good, no lost events
                  //last signature is was updated before
                  debug("DEF0081351 events bulk size is equal to the number of events sent to SN. Execute() finished");
                  setDiscoverySignature(maxLastModifiedFromTheFirstGet, maxLastModifiedFromTheFirstGetAlertId);
                  return new OperationStatus(OperationStatusType.SUCCESS);
              }

              if (toDateTime == null){
                  //we've failed to get next minimal date with number of events < alert buld size
                  writeError("DEF0081351 execute(): failed to get next minimal date greater than " + fromDateTime + " with number of events < " + fAlertsBulkSize + ". Execute() finished");
                  setDiscoverySignature(maxLastModifiedFromTheFirstGet, maxLastModifiedFromTheFirstGetAlertId);
                  return new OperationStatus(OperationStatusType.SUCCESS); //do not want to stuck the connector
              }
              
              def numberOfRetries = 0
              while ((fEventsInText > 0) && (numberOfRetries++ < fMaxNumberOfRetriesForGettingLostEvents) && (toDateTime != null) ){
                  debug("DEF0081351 alertsBulkSize = " + fAlertsBulkSize + "; try #" + numberOfRetries + ", going to send = " + fEventsInText + " events, fromDateTime = " + fromDateTime.toString() + ", toDateTime = " + toDateTime)
                  
                  //do process events fromDateTime toDateTime                         
                  if (!getAndProcessEvents(context.getHost(), user, password, fromDateTime.toString(), scom2012, scom2007, toDateTime, SendEventsStatusEnum.SEND_IN_ANY_CASE)) {
                      writeError("DEF0081351 execute(): Failure in getAndProcessEvents while trying to send events that we missed due to small scom_alert_bulk_size (" + scom_alert_bulk_size + ")." +
                      "Number of events to send " + fEventsInText + ", fromDateTime = " + fromDateTime.toString() + ", toDateTime = " + toDateTime + "Exiting while loop");
                      break;
                  }
                  debug("DEF0081351 after getAndProcessEvents fromDateTime = " + fromDateTime.toString() + " maxLastModifiedFromTheFirstGet = " + maxLastModifiedFromTheFirstGet.toString() + " maxLastModifiedFromTheFirstGetAlertId= " + maxLastModifiedFromTheFirstGetAlertId);
                  fromDateTime = toDateTime;
                  if (fromDateTime == maxLastModifiedFromTheFirstGet){
                      debug("DEF0081351 fromDate=toDate=" + maxLastModifiedFromTheFirstGet + ". Exiting while loop");
                      break;
                  }
                  toDateTime = getNextDate(context.getHost(), user, password, fromDateTime, scom2012, scom2007, maxLastModifiedFromTheFirstGet);
              }
              if (toDateTime == null){
                  //we've failed to get next minimal date with number of events < alert bulk size
                  writeError("DEF0081351 failed to get next minimal date with number of events < " + fAlertsBulkSize + " after " + numberOfRetries + " retries. Execute() finished");
              }
              setDiscoverySignature(maxLastModifiedFromTheFirstGet, maxLastModifiedFromTheFirstGetAlertId);
          }
          //DEF0081351 change end

          return new OperationStatus(OperationStatusType.SUCCESS);
      }

       //DEF0081351 change start
      private Long getNextDate(String host, String user, String password, Long fromDateTime, String scom2012, String scom2007, Long toDateTime){
          debug("DEF0081351 getNextDate1 start: fromDateTime = " + fromDateTime.toString() + " toDateTime = " + toDateTime.toString());
          
          Long nextToDate = toDateTime;
          if (!getAndProcessEvents(host, user, password, fromDateTime.toString(), scom2012, scom2007, nextToDate, SendEventsStatusEnum.DO_NOT_SEND)){ 
              writeError("DEF0081351 getNextDate2: FAILURE in getAndProcessEvents for period from " + fromDateTime + " to " + nextToDate);
              return null;
          }

          if (fEventsInText == 0){ //we are good, nothing to do return nextToDate that is equal to toDateTime
              debug("DEF0081351 getNextDate3 finished: fromDateTime = " + fromDateTime + " nextToDate = " + nextToDate + ", no events found");
              return nextToDate;
          }
          
          def numberOfRetries = 0;
          while (((fEventsInText == 0) || (fEventsInText >= fAlertsBulkSize.toInteger())) && (numberOfRetries++ < fMaxNumberOfRetriesForGettingNextDate)) {

              if (fEventsInText >= fAlertsBulkSize) {
                  nextToDate = (fromDateTime + nextToDate)/2;
              } else if (fEventsInText == 0) {
                  Long savedFromDate = fromDateTime;
                  //increment fromdate
                  fromDateTime = nextToDate;
                  //update nextdate
                  nextToDate = nextToDate + (nextToDate-savedFromDate);
                  if (nextToDate>toDateTime){
                      nextToDate = toDateTime;
                  }
              }

              debug("DEF0081351 getNextDate4: alertsBulkSize = " + fAlertsBulkSize + "; try #" + numberOfRetries + " fEventsInText = " + fEventsInText + " fromDateTime = " + fromDateTime.toString() + " nextToDate = " + nextToDate);
              if (!getAndProcessEvents(host, user, password, fromDateTime.toString(), scom2012, scom2007, nextToDate, SendEventsStatusEnum.DO_NOT_SEND)){ 
                  writeError("DEF0081351 getNextDate5: FAILURE in getAndProcessEvents for period from " + fromDateTime + " to " + nextToDate);
                  return null;
              }
          }
          if (numberOfRetries >= fMaxNumberOfRetriesForGettingNextDate) {
              nextToDate = null;
          }
          debug("DEF0081351 getNextDate6 finished: fromDateTime = " + fromDateTime + " nextToDate = " + nextToDate + ", number of events to send in the next run = "  + fEventsInText);
          return nextToDate;
      }

      private boolean getAndProcessEvents(String host, String user, String password, String fromDateTime, String scom2012, String scom2007, Long toDateTime, SendEventsStatusEnum status){
          String events = getLatestEvents(host, user, password, fromDateTime, scom2012, scom2007, toDateTime);
          if (StringUtil.notNil(events) && events.trim().startsWith("NEEBULA_ERROR:")) {
              String error = events.substring("NEEBULA_ERROR:".length())
              writeError("SCOM connector failed. " + error)
              return false;
          }
          parseAndProcessEvents(events, false, null, null, status)
          return true;
      }

      private String getLatestEvents(String host, String user, String password, String lastTimeSignature, String scom2012, String scom2007) {
          return getLatestEvents(host, user, password, lastTimeSignature, scom2012, scom2007, null);
      }

      private void setDiscoverySignature(Long maxLastModified, String maxLastModifiedAlertId){
          debug("REGINA setDiscoverySignature " + maxLastModified + "." + maxLastModifiedAlertId);
          if (maxLastModified != null && maxLastModifiedAlertId != null) {
              context.setLastDiscoverySignature(maxLastModified + "." + maxLastModifiedAlertId);
              debug("DEF0081351 set signature to " + maxLastModified + "." + maxLastModifiedAlertId);
          } else if (maxLastModified != null) {
              context.setLastDiscoverySignature(maxLastModified);
              debug("DEF0081351 set signature to " + maxLastModified);
          }
      }
      //DEF0081351 change end

      private String getLatestEvents(String host, String user, String password, String lastTimeSignature, String scom2012, String scom2007, Long minLastModified) { //DEF0081351

          debug("getLatestEvents called")

          ProcessRunner runner = new ProcessRunner();
          def version = getParamValue(context.parameters.scom_version,"2007");
          def commandTosearch = "2012".equals(version) ? scom2012 : scom2007;

          // Check the last SCOMClient invocation has ended
          if(commandTosearch.length() > 24) // tasklist trancate the command to 25 charecters
              commandTosearch = commandTosearch.substring(0, 23)
          runner.runCommand("tasklist | findstr " + commandTosearch);
          String res = runner.getOutput();
          if (res.contains("SCOMClient")) {
              writeError("Previous SCOMClient instance is still running. Aborting this cycle ");
              return "NEEBULA_ERROR: " +  "Previous SCOMClient instance is still running. Aborting this cycle ";
          }

          //DEF0081351 change start
          //treat case of possible events loss
          def params = "${fAlertsBulkSize} ${lastTimeSignature}";
          if (minLastModified != null){
              params = params + " 0 ${minLastModified}";
          }
          //DEF0081351 change end

          // Write the sql file to the target host
          if (StringUtil.nil(lastTimeSignature) || "null".equals(lastTimeSignature)) {
              def daysToRetrieve = getParamValue(context.parameters.scom_initial_sync_in_days,"7");
              params = "${fAlertsBulkSize} 0 ${daysToRetrieve}"; //DEF0081351 
          } else if (lastTimeSignature.equals(TEST_CONNECTOR_SIGNATURE)) {
              params = "1";
          }

          def useWindowsAuth = getParamValue(context.parameters.login_with_windows_authentication,"false");
          def pwd = "\"" + password + "\"";
          if(useWindowsAuth.equals("true")) {
              pwd = "###";
              user = "###";
          }
          def command = "${scomLocation(scom2012, scom2007)} ${useWindowsAuth} ${host} ${user} ${pwd} " + params;
          def commandDebug = "${scomLocation(scom2012, scom2007)} ${useWindowsAuth}  ${host} ${user} **** " + params;
          debug("SCOM Connector: running command: " + commandDebug)
          int commandRes = runner.runCommand(command);
          String events = runner.getOutput();

          debug("Debug: SCOM client command results is: " + commandRes + ", output is: "  +  runner.getOutput());


          if (runner.error) {
              writeError("Error running SCOM client: " + runner.error);
              return "NEEBULA_ERROR: " +  runner.error;
          }

          if (commandRes < 0) {
              writeError("Error running SCOM client, error identifier is " + commandRes + ".");
              return "NEEBULA_ERROR: " + " error identifier is " + commandRes + ".";
          }


          return events;
      }

      private scomLocation(String scom2012, String scom2007) {

          // path parameter from connector's definition
          def currentDir = System.getProperty("user.dir")
          def pathPrefix = currentDir + "\\extlib\\"

          // use different exe for SCOM 2012

          def version = getParamValue(context.parameters.scom_version,"2007");
          def path = pathPrefix + ("2012".equals(version) ? scom2012 : scom2007);
          // if there are whitespaces in the path need to wrap with double quotes
          return "\"" + path + "\""
      }

      private void parseAndProcessEvents(String events, boolean isFirstRun, String lastEventID, String lastSignatureTimestamp, SendEventsStatusEnum status) {//DEF0081351
          //DEF0081351 change start
          fMinLastModified = null;
          fEventsInText = 0;
          //DEF0081351 change end

          // STRY54854858 connector tags
          def connectorTags = ""+context.parameters.connectorTags
          def tagJson = null
          if(connectorTags != null && connectorTags.length() > 0) {
              tagJson = new JsonSlurper().parseText(connectorTags)
          }
          // STRY54854858 connector tags ends

          def emsSystem = context.name;
          if (StringUtil.nil(events)) {
              debug("Got no events from SCOM client")
              return;
          }

          events = events.trim();

          IEventSender sender = MIDServer.getSingleton(IEventSender.class);

          //keep biggest value of alert timestamp (Newer alert)
          Long maxLastModified;
          //keep Newer alert ID
          String lastModifiedAlertId = null;


          String[] lines = events.split("NEEBULA_LINE_SEPARATOR");
          if (lines == null || lines.length < 2) {
              return;
          }


          int eventsInText = 0;
          int eventsSent = 0;
          // Skip the first line
          StringMap params = new StringMap();
          String alertId = null;
          String currentTimestamp;
          for (int lineNum = 1; lineNum < lines.length; lineNum++) {
              String line = lines[lineNum].trim();

              if (line.startsWith("Alert ID:")) {
                  eventsInText++;
                  if (!params.isEmpty() && alertId != null && currentTimestamp != null) {
                      debug("Processing #alert " + alertId + " #alertTimestamp: " + currentTimestamp + " #ResolutionState: " + params.get("ResolutionState"));
                      if (isShouldSendEvent(lastSignatureTimestamp, currentTimestamp, alertId, lastEventID, status)) {//DEF0081351
                          def dateFormat = getParamValue(context.parameters.scom_date_format, "M/d/yyyy h:mm:ss a");
                          if (sendEvent(alertId, params, sender, emsSystem, isFirstRun, dateFormat, tagJson)) {
                              eventsSent++;
                          }
                      }
                  }
                  alertId = line.substring(9).trim();
                  params = new StringMap();
                  continue;
              }

              int colonPos = line.indexOf(':');
              if (colonPos <= 0) {
                  continue;
              }

              String fieldName = line.substring(0, colonPos);
              String fieldValue = line.substring(colonPos + 1).trim();
              params.put(fieldName, fieldValue);

              if (fieldName.equals("LastModified")) {
                  currentTimestamp = fieldValue;
                  if (maxLastModified == null) {
                      maxLastModified = Long.valueOf(currentTimestamp);
                      lastModifiedAlertId = alertId;
                      debug("Update Latest Alert Values: maxLastModified - " + maxLastModified + " lastModifiedAlertId - " + lastModifiedAlertId);
                  } else {
                      Long currentLastModified = Long.valueOf(currentTimestamp);
                      if (currentLastModified > maxLastModified) {
                          maxLastModified = currentLastModified;
                          lastModifiedAlertId = alertId;
                          debug("Update Latest Alert Values: maxLastModified - " + maxLastModified + " lastModifiedAlertId - " + lastModifiedAlertId);
                      }
                  }
                  //DEF0081351 change start
                  if (fMinLastModified == null) {
                      fMinLastModified = Long.valueOf(currentTimestamp);
                      debug("Update Min Alert Values: minLastModified - " + fMinLastModified);
                  } else {
                      Long currentLastModified = Long.valueOf(currentTimestamp);
                      if (currentLastModified < fMinLastModified) {
                          fMinLastModified = currentLastModified;
                          debug("Update Min Alert Values: minLastModified - " + fMinLastModified);
                      }
                  }
                  //DEF0081351 change end
              }

          } // End of loop over lines

          // Send the last event if needed
          if (!params.isEmpty() && alertId != null && currentTimestamp != null) {
              //debug("Processing #alert " + alertId + " #alertTimestamp: " + currentTimestamp + " #ResolutionState: " + params.get("ResolutionState"));
              if (isShouldSendEvent(lastSignatureTimestamp, currentTimestamp, alertId, lastEventID, status)) {//DEF0081351
                  def dateFormat = getParamValue(context.parameters.scom_date_format, "M/d/yyyy h:mm:ss a");
                  if (sendEvent(alertId, params, sender, emsSystem, isFirstRun, dateFormat, tagJson)){
                      eventsSent++;
                  }
              }
          }

          //Update Newer alert timestamp
          if (maxLastModified != null) {
              if(StringUtil.notNil(lastSignatureTimestamp)) {
                  //handle the case "No new alerts from SCOM" for deny sending redundant events to an instance.
                  if (maxLastModified == Long.parseLong(lastSignatureTimestamp)) {
                      maxLastModified++;
                  }
                  //handle case where signature from the instance is bigger than Newer alert timestamp.
                  if(maxLastModified < Long.parseLong(lastSignatureTimestamp)){
                      maxLastModified = Long.parseLong(lastSignatureTimestamp);
                  }
              }


              if (lastModifiedAlertId != null) {
                  context.setLastDiscoverySignature(maxLastModified.toString() + "." + lastModifiedAlertId);
              } else {
                  context.setLastDiscoverySignature(maxLastModified.toString());
              }
          }

          updateMaxModified(maxLastModified, lastModifiedAlertId);//DEF0081351

          fEventsInText = eventsInText; //DEF0081351
          debug("SCOM Adapter summary: Events in client reply: " + eventsInText + ". Events sent to server: " + eventsSent);
         
      }

      //DEF0081351 change start
      private void updateMaxModified(Long maxLastModified, String lastModifiedAlertId){
          if ((fMaxLastModified == null) || (maxLastModified > fMaxLastModified)) {
              fMaxLastModified = maxLastModified;
              fMaxLastModifiedAlertId = lastModifiedAlertId;
              debug("Update Max Alert Values: maxLastModified = " + fMaxLastModified + " alertId = " + fMaxLastModifiedAlertId);
          }
      }
      //DEF0081351 change end

      //Make decision to sand/not send new event to the instance.
      private boolean isShouldSendEvent(String lastSignatureTimestamp, String eventTimestamp, String alertId, String lastEventID, SendEventsStatusEnum status){//DEF0081351
          //DEF0081351 change start
          if (status.equals(SendEventsStatusEnum.DO_NOT_SEND))
              return false;

          if (status.equals(SendEventsStatusEnum.SEND_IN_ANY_CASE))
              return true;
          //DEF0081351 change end

          // First iteration. Signature is null. Should process each new event
          if(StringUtil.nil(lastSignatureTimestamp))
              return true;

          //event which already sent to instance.
          if(alertId.equals(lastEventID) && Long.parseLong(eventTimestamp) <= Long.parseLong(lastSignatureTimestamp))
              return false;

          return  (StringUtil.notNil(eventTimestamp) && Long.parseLong(eventTimestamp) >= Long.parseLong(lastSignatureTimestamp));
      }


      private static boolean sendEvent(String alertId, StringMap params, IEventSender sender, String emsSystem, boolean openOnly, String dateFormat, Object tagJson) {
          debug("Attemp to send event for alertId: " + alertId);
          Event event = new Event();

          try {
              event.setEmsSystem(emsSystem)
              event.setMessageKey(alertId);
              String hostName = findHost(params);

              if (!StringUtil.nil(hostName)) {
                  event.setHostAddress(hostName);
              }

              event.setText(params.get("Name"));
              event.setType(params.get("Name"));

              if (params.containsKey("Description")) {
                  if (event.getText() == null) {
                      event.setText(params.get("Description"));
                  } else {
                      event.setText(event.getText() + ", Description: " + params.get("Description"))
                  }
                  params.remove("Description");
              }

              // 0 is New and 255 is closed
              if (StringUtil.notNil(params.get("ResolutionState")) && ("255".equals(params.get("ResolutionState")))) {
                  if (openOnly) {
                      return false;
                  }
                  event.setResolutionState("Closing")
              } else {
                  event.setResolutionState("New");
              }


              if (params.containsKey("LastModifiedDate")) {
                  String timeOfEvent = convertTimeFormat(params.get("LastModifiedDate"), dateFormat);
                  event.setTimeOfEvent(timeOfEvent);
              }

              String scomSeverity = params.get("SCOMSeverity");
              if ("Error".equals(scomSeverity)) {
                  event.setSeverity("2");
              } else if ("Warning".equals(scomSeverity)) {
                  event.setSeverity("4")
              } else if ("Information".equals(scomSeverity)) {
                  event.setSeverity("5");
              } else {
                  event.setSeverity("3");
              }

              // Truncate the Context since its too large
              String alertContext = params.get("Context");
              if (alertContext && fContextLength > 0) {
              params.put("Context", alertContext.substring(0, Math.min(alertContext.length(), fContextLength)));
              } else if (alertContext && fContextLength <= 0) {
              params.put("Context", "");
              }

              if (params.containsKey("MonitoringObjectName")) {
                  event.setResource(params.get("MonitoringObjectName"));
              } else if (params.containsKey("MonitoringObjectPath")) {
                  event.setResource(params.get("MonitoringObjectPath"));
              }

              if (params.containsKey("MetricName")) {
                  event.setMetricName(params.get("MetricName"));
              }

              event.setAdditionalParameters(params);

              event.setSource("SCOM");

              // populate connector tags in event additional info
              if(tagJson != null) {
                  tagJson.each { tagName, tagValue ->
                      event.setField(tagName, tagValue)
                  }
              }

              sender.sendEvent(event);
              logPayloadDebug("Sending event: " + event + " for alertId: " + alertId + "\n ");
              //debug("Sending event for alertId: " + alertId + "\n");
              return true;
          } catch (Exception e) {
              writeError("Failed to send event. " + e + ". " + event);
          }
          return false;
      }

      private static String convertTimeFormat(String dateStr, String dateFormat) {
          // both times are in GMT
          // but need to convert from input format to expected "yyyy-MM-dd HH:mm:ss"

          SimpleDateFormat sdfInput = new SimpleDateFormat(dateFormat);
          // parsing New Zealand time format
          if ( dateStr.contains("a.m.") || dateStr.contains("p.m.")){
              DateFormatSymbols symbols = sdfInput.getDateFormatSymbols();
              symbols = (DateFormatSymbols) symbols.clone();
              String[] arr= new String[2];
              arr[0] = "a.m.";
              arr[1] = "p.m.";
              symbols.setAmPmStrings(arr);
              sdfInput.setDateFormatSymbols(symbols);
          }
          sdfInput.setTimeZone(GMT);
          Date d  = null;
  	try {
  	   d = sdfInput.parse(dateStr);
  	}catch(ParseException e) {
  	   //for casetask CSTASK248459, am and pm doesn't work in CANADA locale, so adding Locale.ENGLISH here
  	   Log.error("**** Date ParseException, so checking with English Locale once");
  	   sdfInput = new SimpleDateFormat(dateFormat, Locale.ENGLISH);
             // parsing New Zealand time format
             if ( dateStr.contains("a.m.") || dateStr.contains("p.m.")){
              	DateFormatSymbols symbols = sdfInput.getDateFormatSymbols();
              	symbols = (DateFormatSymbols) symbols.clone();
              	String[] arr= new String[2];
              	arr[0] = "a.m.";
              	arr[1] = "p.m.";
              	symbols.setAmPmStrings(arr);
              	sdfInput.setDateFormatSymbols(symbols);
             }
             sdfInput.setTimeZone(GMT);
  	   d = sdfInput.parse(dateStr);
  	}

          SimpleDateFormat sdfOutput = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss");
          sdfOutput.setTimeZone(GMT);
          String timeOfEvent = sdfOutput.format(d);

          return timeOfEvent;

      }

      @Override
      OperationStatus testConnection() {
          fIsDebugEnabled = getIsDebugEnabled();
          fIslogPayloadForDebug = getIsLogPayloadEnabled();
          boolean eventOpStatusSuccess = testEventConnection();
          boolean metricOpStatusSuccess = true;
          if ("true".equals(context.parameters.kpi))
              metricOpStatusSuccess = testMetricConnection();

          if (!eventOpStatusSuccess || !metricOpStatusSuccess) {
              return new OperationStatus(OperationStatusType.FAILURE);
          }

          return OperationStatus.success();
      }

      boolean testEventConnection() {

          debug("testEventConnection called")
          String host = context.host
          String user = context.username
          if (StringUtil.nil(user)) {
              writeError("testEventConnection FAILURE: Username not provided")
              return false;
          }
          String password = context.password

          String sysId = context.parameters.connectorSysId;
          String scom2012 = "SCOMClient2012"  + sysId + ".exe";
          String scom2007 = "SCOMClient"  + sysId + ".exe";

          organizeDllFiles();
          organizeExeFiles(scom2012,  scom2007);
          overrwriteOmDll();

          try {
              String events = getLatestEvents(host, user, password, TEST_CONNECTOR_SIGNATURE, scom2012, scom2007);

              if (StringUtil.notNil(events) && events.trim().startsWith("NEEBULA_ERROR:")) {
                  String error = events.substring("NEEBULA_ERROR:".length());
                  writeError("SCOM Event connector failed. " + error);
                  return false;
              }

              // If there are alerts found, there will be 'Alert ID' string. If there are no alerts in SCOM, older implementation had empty
              // return value, new implementation reads something like: 'NEEBULA_LINE_SEPARATORCriteria: LastModified > '1/25/2015 10:13:02 PM'. Max alerts:1'
              if (StringUtil.notNil(events) && !events.contains("Alert ID") && !events.contains("NEEBULA_LINE_SEPARATOR")) {
                  writeError("SCOM Event  connector failed, string not empty, and no alert id. Events content: --" + events + "--");
                  return false;
              }

          } catch (Exception e) {
              writeError("SCOM test event connection failed" + e)
              return false;
          }
          return true;
      }

      boolean testMetricConnection() {
          debug("SCOM metric test connection is called!!");
          String sqlCommand = " select top 1  DateTime from Perf.vPerfRaw";
          Connection conn = null;
          Statement statement = null;
          ResultSet rs = null;
          String error = null;
          String jdbcURL;
          try {
              String databaseUserName = context.getDatabaseUser();
              String databasePassword = context.getDatabasePassword();
              String databasePort = context.parameters.database_port;
              String host =  context.parameters.database_host;
              String instanceName =  context.parameters.instanceName;
              Class.forName("com.microsoft.sqlserver.jdbc.SQLServerDriver");

          debug("SCOM Metrics Test Connection: databaseUserName: " + databaseUserName + ", databasePassword: ##########" + ", databasePort: " + databasePort + ", host: " + host + ", instanceName: " + instanceName);
              if( StringUtil.notNil(databaseUserName) && StringUtil.notNil(databasePassword) ) {
                  debug("TestMetricConnection: connecting with local database user");
                  jdbcURL = getJDBCUrl(false, host,  databasePort, instanceName);
                  conn = DriverManager.getConnection(jdbcURL, databaseUserName, databasePassword);
              } else {
                  debug("TestMetricConnection: connecting with Windows Authentication");
                  jdbcURL = getJDBCUrl(true, host,  databasePort, instanceName);
                  conn = DriverManager.getConnection(jdbcURL);
              }

              statement = conn.createStatement();
              statement.setFetchSize(1);
              rs = statement.executeQuery(sqlCommand);
          } catch (Exception e) {
              error = e.getMessage();
          } finally {
              try { if (conn != null) conn.close(); } catch (Exception e) {};
              try { if (rs != null) rs.close(); } catch (Exception e) {};
              try { if (statement != null) statement.close(); } catch (Exception e) {};
          }

          if (StringUtil.notNil(error)) {
              Log.error("TestMetricConnection: " + error);
              String errorMessage = "\n\nCollect metrics (Test Connector):\n"
              if(StringUtil.notNil(jdbcURL))
                  errorMessage = errorMessage + "Using JDBC URL: " + jdbcURL + "\n";
              errorMessage = errorMessage + error;
              writeError(errorMessage);
              return false;
          }
          debug("TestMetricConnection: SCOM metric test connection: success");
          return true;
      }

      private String getJDBCUrl  (boolean useWindowsAuthentication, String host,  String databasePort, String instanceName) {
          String jdbcURL;

          if(useWindowsAuthentication)
              jdbcURL = "jdbc:sqlserver://" + host + ";DatabaseName=OperationsManagerDW;integratedSecurity=true";
          else
              jdbcURL = "jdbc:sqlserver://" + host + ";DatabaseName=OperationsManagerDW";
          if(StringUtil.notNil(instanceName))
              jdbcURL = jdbcURL + ";instanceName=" + instanceName;
          else
              jdbcURL = jdbcURL + ";port=" + databasePort;
          debug("TestMetricConnection: JDBC URL: " + jdbcURL);

          return jdbcURL;
      }

      private String checkForPowershellVersion  () {
          String retString = null;
          ProcessRunner runner = new ProcessRunner();
          runner.setCloseOutputToStart(true);
          runner.runCommand("powershell (Get-Host).Version.major");
          String powershellVersionStr = runner.getOutput();
          if(StringUtil.notNil(powershellVersionStr)) {
              int powershellVersion = 0;
              try{
                  powershellVersion = Integer .parseInt(powershellVersionStr);
              } catch (NumberFormatException e) {

              }

          debug("SCOM Connector: PowerSell version : " + powershellVersion);
              if(powershellVersion > 0 && powershellVersion <= 2) {
                  debug("Collect metrics: ERROR PowerShell version (" + powershellVersion + ") is not supported. The supported version is > 2 .");
                  retString = "\nCollect metrics :\nERROR PowerShell version (" + powershellVersion + ") is not supported. The supported version is > 2 .";
              }
          }
      }

      private static String findHost(Map<String, String> params) {

          // First try PrincipalName
          String hostName = params.get("PrincipalName");
          if (StringUtil.notNil(hostName))
              return hostName;

          String alertContext = params.get("Context");
          if (StringUtil.notNil(alertContext)) {

              Document doc = XMLUtil.parse(alertContext);
              if (doc != null) {
                  NodeList nodeList = doc.getElementsByTagName("HostName");
                  if (nodeList != null && nodeList.length > 0) {
                      hostName = XMLUtil.getAllText(nodeList.item(0));
                      if (StringUtil.notNil(hostName)) {
                          return hostName;
                      }
                  }

                  nodeList = doc.getElementsByTagName("LoggingComputer");
                  if (nodeList != null && nodeList.length > 0) {
                      hostName = XMLUtil.getAllText(nodeList.item(0));
                      if (StringUtil.notNil(hostName)) {
                          return hostName;
                      }
                  }
              }
          }

          hostName = params.get("NetbiosComputerName");
          if (StringUtil.nil(hostName))
              hostName = params.get("MonitoringObjectPath");

          return hostName;
      }

      // if there is a file called Microsoft.EnterpriseManagement.OperationsManager.dll.'version-name', and the connector is the same version
      // overwrite the Microsoft.EnterpriseManagement.OperationsManager.dll file.
      private void overrwriteOmDll(){
          def scomVersion = getParamValue(context.parameters.scom_version, "2007");
          def currentDir = System.getProperty("user.dir");
          def extlibPath = currentDir + "\\extlib\\";
          def dllOm = extlibPath+"Microsoft.EnterpriseManagement.OperationsManager.dll";
          def dllOmWithVersion = dllOm + "." + scomVersion;
          def sourceFile = new File("$dllOmWithVersion");
          if (sourceFile.exists()) {
              copyFile(dllOmWithVersion, dllOm, false);
          }
      }


      private void organizeExeFiles(String scom2012, String scom2007) {
          def currentDir = System.getProperty("user.dir")

          def scom07Build = currentDir + "\\bin\\sw_wmi\\bin\\scom2007\\SCOMClient.exe"
          def scom07BuildConfig = currentDir + "\\bin\\sw_wmi\\bin\\scom2007\\SCOMClient.exe.config"
          def scom12Build = currentDir + "\\bin\\sw_wmi\\bin\\scom2012\\SCOMClient2012.exe"
          def scom12BuildConfig = currentDir + "\\bin\\sw_wmi\\bin\\scom2012\\SCOMClient2012.exe.config"

          def destPath07 = currentDir + "\\extlib\\" + "\\" + scom2007;
          def destPath07Config = currentDir + "\\extlib\\" + "\\" + scom2007 + ".config"
          def destPath12 = currentDir + "\\extlib\\" + "\\" + scom2012;
          def destPath12Config = currentDir + "\\extlib\\" + "\\" + scom2012 + ".config"



          // Define the default content to replace if files are empty
          def defaultContent = """<?xml version="1.0" encoding="utf-8"?>
          <configuration>
          <startup useLegacyV2RuntimeActivationPolicy="true">
          <supportedRuntime version="v4.0"/>
          <supportedRuntime version="v2.0.50727"/>
          </startup>
          </configuration>""";

         // Mixed mode assembly is built against version 'v2.0.50727' of the runtime- DEF0221688
          // Handle scom07 config
          def scom07 = new File(scom07BuildConfig);
          if (scom07.exists()) {
              if (scom07.text.trim().isEmpty()) {
              debug("scom07 config file is empty. Replacing with default content..");
              scom07.text = defaultContent;
              } else {
              def newConfig = scom07.text.replace('<startup>','<startup useLegacyV2RuntimeActivationPolicy="true">');
              scom07.text = newConfig;
              }
          }

          // Handle scom12 config
          def scom12 = new File(scom12BuildConfig);
          if (scom12.exists()) {
              if (scom12.text.trim().isEmpty()) {
              debug("scom12 config file is empty. Replacing with default content...");
              scom12.text = defaultContent;
              } else {
              def newConfig = scom12.text.replace('<startup>','<startup useLegacyV2RuntimeActivationPolicy="true">');
              scom12.text = newConfig;
              }
          }
          debug(" Copying the SCOM exe and config files from : " + currentDir + "\\bin\\sw_wmi\\bin\\" + " and placing to : " + currentDir + "\\extlib\\" + " folder in MID server");
          copyFile(scom07Build, destPath07);
          copyFile(scom07, destPath07Config);
          copyFile(scom12Build, destPath12);
          copyFile(scom12, destPath12Config);

      }

      private static void organizeDllFiles() {
          def currentDir = System.getProperty("user.dir")

          def etcPath = currentDir + "\\etc\\"
          def extlibPath = currentDir + "\\extlib\\"

          def dll_1 = "Microsoft.EnterpriseManagement.Core.dll"
          def dll_2 = "Microsoft.EnterpriseManagement.OperationsManager.dll"
          def dll_3 = "Microsoft.EnterpriseManagement.Runtime.dll"

          def dll_4 = "Microsoft.EnterpriseManagement.OperationsManager.Common.dll"
          def dll_5 = "Microsoft.EnterpriseManagement.OperationsManager.dll"

          copyFile(etcPath + dll_1, extlibPath + dll_1);
          copyFile(etcPath + dll_2, extlibPath + dll_2);
          copyFile(etcPath + dll_3, extlibPath + dll_3);
          copyFile(etcPath + dll_4, extlibPath + dll_4);
          copyFile(etcPath + dll_5, extlibPath + dll_5);

      }
      private static void copyFile(sourcePath, destPath) {
          copyFile(sourcePath, destPath,  true);
      }

      private static void copyFile(sourcePath, destPath, greaterThan) {
          def shouldCopy = true

          def updateTimeSource
          def updateTimeDest

          def sourceFile = new File("$sourcePath");
          if (sourceFile.exists()) {
              updateTimeSource = sourceFile.lastModified()
          }
          else {
              shouldCopy = false;
          }

          def destFile = new File("$destPath");
          if (destFile.exists()) {
              updateTimeDest = destFile.lastModified()
              if (greaterThan && updateTimeSource<=updateTimeDest) {
                  shouldCopy = false
              }
              else if (!greaterThan && updateTimeSource==updateTimeDest) {
                  shouldCopy = false
              }
          }

          if (shouldCopy) {
              debug("Copying  " + sourcePath + " to " + destPath);
              (new AntBuilder()).copy(file:sourcePath, tofile:destPath, preservelastmodified : 'true')
          }

      }
      void writeError(String errorMessage){
          Log.error(errorMessage);
          // the method in the context could not exist;
          if (context.metaClass.respondsTo(context, "addErrorMessage", String))
              context.addErrorMessage(errorMessage);
      }

      String getParamValue(String paramValue, String defaultValue){
          String newParamValue = paramValue;
          if (!newParamValue)
              newParamValue = defaultValue;
          def versionsToMap = ["2016", "2019", "2022", "2025"];
          if (versionsToMap.contains(newParamValue))
              newParamValue = "2012";

          return newParamValue;
      }

      private boolean getIsLogPayloadEnabled(){
          return Boolean.valueOf(getParamValue(context.parameters.logPayloadForDebug, String.valueOf(LOG_PAYLOAD_MODE_ENABLED_DEFAULT)));
      }

      private static void logPayloadDebug(String msz){
          if(fIslogPayloadForDebug){
              Log.debug(msz);
          }
      }
          
      private boolean getIsDebugEnabled(){
          return Boolean.valueOf(getParamValue(context.parameters.debug_enabled, String.valueOf(DEBUG_MODE_ENABLED_DEFAULT)));
      }

     private static void debug(String errorMessage){
          if (fIsDebugEnabled){
              Log.debug(errorMessage);
          }
      }
