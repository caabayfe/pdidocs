name: linux_netstat_command.sh
parent: ec515c705352320023bdae4a16dc3488
script: |-
  #!/bin/sh
  # Copyright © ServiceNow, Inc. 2017. All rights reserved.
  BASE_DIR=$1
  cp "${BASE_DIR}/connection_samples/all_connections.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log"
  #match tcp | match LISTEN | filter :: | remote process_name | print 'on pid local_ip:port' | separate ip:port
  sudo netstat -antp | grep tcp | grep LISTEN | sed 's/::ffff://g' | cut -d '/' -f1 | awk -F' ' '{print "on " $7 " " $4}' | grep -v - | sed 's/\(::\):\([0-9]\)/\1 \2/g' | sed 's/\([0-9]\):\([0-9]\)/\1 \2/g' | sort | uniq > "${BASE_DIR}/connection_samples/connection_sample.log"
  sudo netstat -antp | grep tcp | grep ESTABLISHED |  sed 's/::ffff://g' | cut -d '/' -f1 | awk -F' ' '{print "to " $7 " " $5 " " $4}' | sed 's/\(::\):\([0-9]\)/\1 \2/g' | sed 's/\([0-9]\):\([0-9]\)/\1 \2/g' | sort | uniq >> "${BASE_DIR}/connection_samples/connection_sample.log"
  cat "$BASE_DIR/connection_samples/connection_sample.log" "$BASE_DIR/connection_samples/all_connections_tmp.log" | sort > "${BASE_DIR}/connection_samples/all_connections.log"
