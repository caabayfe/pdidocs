parent: ec515c705352320023bdae4a16dc3488
script: |-
  #!/bin/sh
  # Copyright © ServiceNow, Inc. 2020. All rights reserved.
  BASE_DIR=$1
  cp "${BASE_DIR}/connection_samples/all_connections.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log"
  #PID format $6 -  users:(("sshd",pid=18174,fd=3),("sshd",pid=18163,fd=3))
  #LISTEN | filter :: | through awk -> split $6 on ")," - loop through array - extract pid using substr - print 'on pid local_ip:port' | seperate ip:port | replace * with 0.0.0.0 | sort
  sudo ss -tlnp | sed "s/pid=//g" | sed "s/fd=//g" | grep LISTEN | grep -v "::" | awk -F' ' '{ n = split($6,a,"\),"); for(i=1;i<=n;i++) { split(a[i],b,","); print "on " b[2] " " $4}}' | sed 's/:/ /g' | sed 's/*/0.0.0.0/g' | sort | uniq > "${BASE_DIR}/connection_samples/connection_sample.log"
  sudo ss -tenp | sed "s/pid=//g" | sed "s/fd=//g" | grep ESTAB | grep users | awk -F' ' '{ n = split($6,a,"\),"); for(i=1;i<=n;i++) { split(a[i],b,","); print "to " b[2] " " $5 " " $4}}'  | sed 's/::ffff://g' | sed 's/:/ /g' | sed 's/*/0.0.0.0/g' | sort | uniq >> "${BASE_DIR}/connection_samples/connection_sample.log"
  cat "$BASE_DIR/connection_samples/connection_sample.log" "$BASE_DIR/connection_samples/all_connections_tmp.log" | sort > "${BASE_DIR}/connection_samples/all_connections.log"
