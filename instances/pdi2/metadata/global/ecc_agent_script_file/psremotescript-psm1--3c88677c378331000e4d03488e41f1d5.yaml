name: PSRemoteScript.psm1
parent: af2f7456372331000e4d03488e41f1b1
script: |-
  <# 
   .Synopsis
    Create PowerShell session.

   .Description
    Returns the created PowerShell session object to be used.
    Uses env vars to get the hostname and credential

   .Example
     # Create a powershell session.
     Create-PSSession

   Requires -Version 2.0
  #>
  function Create-PSSession {
      param([string]$ConfigurationName)
      if (-not $ConfigurationName) {
          $ConfigurationName = $env:SNC_ConfigurationName
      }
      return CreatePSSessionWithURI -host $computer -ConfigurationName $ConfigurationName
  }
