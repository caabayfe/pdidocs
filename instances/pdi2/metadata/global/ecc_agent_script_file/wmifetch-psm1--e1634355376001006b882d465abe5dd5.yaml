  function getBinaryValue {
      param($reg, [uint32]$hive, [string]$key, [string]$value)
      
      if ($script:CimSession){
          $fetchedValue = $reg | Invoke-CimMethod -CimSession $script:CimSession -MethodName "GetBinaryValue" -Arguments @{hDefKey=$hive; sSubKeyName=$key; sValueName=$value} -ErrorAction Stop;
