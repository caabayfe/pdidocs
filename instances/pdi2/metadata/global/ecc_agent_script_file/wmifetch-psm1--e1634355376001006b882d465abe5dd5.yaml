      if ($fetchedValue.ReturnValue -ne 0) {
          throw "failed to get registry $hive\$key\$value";
      }
      
      $bytes = $fetchedValue.uValue | ForEach-Object { [String]::Format("{0:x2}", $_) };
      return [string]::Join("", $bytes);
