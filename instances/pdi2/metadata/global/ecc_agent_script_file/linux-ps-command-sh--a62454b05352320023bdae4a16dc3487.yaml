script: |-
  #!/bin/sh
  # Copyright © ServiceNow, Inc. 2017. All rights reserved.
  BASE_DIR=$1
  CALLPOINT_DIR=`dirname $0`
  ADME_PID=`cat $CALLPOINT_DIR/../adme_collector.pid` 
  cp "${BASE_DIR}/process_samples/all_processes.log" "${BASE_DIR}/process_samples/all_processes_tmp.log"
  ps awwxo pid,ppid,command | sed -n '/<defunct>/!p' | grep -v "  PID  PPID COMMAND" | grep -v  "awwxo pid,ppid,command" | grep -v "$BASE_DIR" | sort | uniq > "${BASE_DIR}/process_samples/process_sample.log"
  cat "$BASE_DIR/process_samples/process_sample.log" "$BASE_DIR/process_samples/all_processes_tmp.log" | sort > "${BASE_DIR}/process_samples/all_processes.log"
