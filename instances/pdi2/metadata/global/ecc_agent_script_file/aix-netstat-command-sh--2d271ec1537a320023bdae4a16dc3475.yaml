name: aix_netstat_command.sh
parent: ec515c705352320023bdae4a16dc3488
script: |-
  #!/bin/sh
  # Copyright © ServiceNow, Inc. 2017. All rights reserved.
  BASE_DIR=$1
  cp "${BASE_DIR}/connection_samples/all_connections.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log"
  #netstat output | match tcp | collepse all space into one space | remove CLOSED conneciton | sort | uniq
  sudo netstat -Aan | grep tcp | tr -s ' ' | grep -v CLOSED | sort | uniq > "${BASE_DIR}/connection_samples/connections_list.log"
  #get pid of each connection 
  while read line; do 
  	rmsock `echo $line | cut -d ' ' -f1` tcpcb | cut -d ' ' -f9; 
  done < "${BASE_DIR}/connection_samples/connections_list.log" >"${BASE_DIR}/connection_samples/connections_pid.log"
  #combine connection result with PID added | remove keyword with before which is error
  #TODO: filter any other error type?
  paste "${BASE_DIR}/connection_samples/connections_list.log" "${BASE_DIR}/connection_samples/connections_pid.log" | grep -v "before" > "${BASE_DIR}/connection_samples/connections_with_pid.log"
  #cat connections | match LISTEN | print result | separate ip.port 
  cat  "${BASE_DIR}/connection_samples/connections_with_pid.log" | grep LISTEN | awk -F' ' 'length($8)>0{print "on " $8 " " $5 }' | sed 's/\(.*\)\./\1 /' > "${BASE_DIR}/connection_samples/connection_sample.log"
  cat  "${BASE_DIR}/connection_samples/connections_with_pid.log" | grep ESTABLISHED | awk -F' ' 'length($8)>0{print "to " $8 " " $5 " " $6 }' | sed 's/\(.*\)\./\1 /' | awk -F' ' '{print $1" " $2" " $4" " $5" " $3 }' | sed 's/\(.*\)\./\1 /' >> "${BASE_DIR}/connection_samples/connection_sample.log"
  cat "${BASE_DIR}/connection_samples/connection_sample.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log" | sort > "${BASE_DIR}/connection_samples/all_connections.log"
