name: solaris_netstat_command.sh
parent: ec515c705352320023bdae4a16dc3488
script: |-
  #!/bin/sh
  # Copyright © ServiceNow, Inc. 2017. All rights reserved.

  BASE_DIR=$1
  cp "${BASE_DIR}/connection_samples/all_connections.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log"
  #netstat output for IPv4 | match LISTEN | print result | separate ip.port 
  sudo netstat -anuP tcp -f inet | grep LISTEN | awk -F' ' '{print "on " $4 " " $1}' | sed 's/\(.*\)\./\1 /' | sort | uniq > "${BASE_DIR}/connection_samples/connection_sample.log"
  sudo netstat -anuP tcp -f inet | grep ESTABLISHED | awk -F' ' '{print "to " $4 " " $1 " " $2}' | sed 's/\(.*\)\./\1 /' | awk -F' ' '{print $1 " " $2 " " $4 " " $5 " " $3 }' | sed 's/\(.*\)\./\1 /' | sort | uniq >> "${BASE_DIR}/connection_samples/connection_sample.log"
  cat "${BASE_DIR}/connection_samples/connection_sample.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log" | sort > "${BASE_DIR}/connection_samples/all_connections.log"
