name: hpux_lsof_command.sh
parent: ec515c705352320023bdae4a16dc3488
script: |-
  #!/bin/sh
  # Copyright © ServiceNow, Inc. 2017. All rights reserved.

  BASE_DIR=$1
  cp "${BASE_DIR}/connection_samples/all_connections.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log"
  sudo lsof -iTCP -n -P | grep 'LISTEN' | grep -v "::" | awk -F' ' '{print "on " $2 " " $9}' | sed 's/:/ /g' | sort | uniq > "${BASE_DIR}/connection_samples/connection_sample.log"
  sudo lsof -iTCP -n -P | grep 'ESTABLISHED' | grep -v "::" |  sed 's/->/ /g' | awk -F' ' '{print "to " $2 " " $10 " " $9}' | sed 's/:/ /g' | sort | uniq >> "${BASE_DIR}/connection_samples/connection_sample.log"
  cat "${BASE_DIR}/connection_samples/connection_sample.log" "${BASE_DIR}/connection_samples/all_connections_tmp.log" | sort > "${BASE_DIR}/connection_samples/all_connections.log"
