description: |-
  Validate an integer time based on a time format e.g.  'HH:mm:ss' for 24 hour and 'hh:mm:ss a' for 12 am/pm. Dots may substitute colons.
  Platform provides global variable: g_user_date_time_format which is driven by combination of: glide.sys.date_format and glide.sys.time_format (separated by a space)
  The following are valude for 24 hours
  00:00:00 to 23:59:59

  e.g.
  01:12:20 is valid
  1:12:20 is NOT valid

  The following are valude for 12 hours
  01:00:00 am|pm to 12:59:59 am|pm
  e.g.
  1:00:00 pm and 1:00:00 am are NOT valid (must prefix with 0) unless the time format 'h:mm:ss a' is used.
internal_type: integer_time
sys_name: integer_time
