name: aix_connection.sh
probe: 53d141350b02101088b90bdb35673a20
sys_name: aix_connection.sh
sys_policy: ''
value: |-
  #!/bin/sh
  exists()
  {
  	command -v "$1" >/dev/null 2>&1
  }

  if exists lsof; then
  	connectionInfo=`sudo lsof -iTCP -n -P -F pcnfT 2> /dev/null`
  	echo "lsof output"
  	echo "$connectionInfo"
  	exit 0
  fi
  connectionInfo=`sudo netstat -Aan | grep tcp | tr -s ' ' | grep -v CLOSED | sort | 
  while read pcb proto tqr tqs la fa state; do
  	printf "$proto $tqr $tqs $la $fa $state ";
  	rmsock $(echo $pcb | cut -d ' ' -f1) tcpcb | cut -d ' ' -f9,10
  done | awk '{
  	print $1 " " $2 " " $3 " " $4 " " $5 " " $6 " " $7 "/" $8;
  }' | grep -v "before" | sed 's/\(.*\)::1/\1127.0.0.1/' 2> /dev/null`
  if [ "$?" -eq "0" ]; then
  	echo "netstat output"
  	echo "$connectionInfo"
  	exit 0
  fi
  echo "both lsof and netstat commands failed"
  exit 1
value_script: ''
