name: findcat.sh
probe: f39d6a930a0a0b780004c15893b3cfe4
sys_name: findcat.sh
sys_policy: ''
value: |-
  version=`find $1 -name catalina.jar 2>/dev/null -exec unzip -c {} org/apache/catalina/util/ServerInfo.properties \; | grep server.info`
  if [ -z "$version" ]; then
  version=`find -L $1 -name catalina.jar 2>/dev/null -exec unzip -c {} org/apache/catalina/util/ServerInfo.properties \; | grep server.info`
  fi

  if [ -z "$version" ]; then
   echo "Unable to find catalina.jar. Check catalina.home path." >&2
   exit 1
  else
   echo $version
  fi
value_script: ''
