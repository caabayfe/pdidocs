name: get-nginx-ver.sh
probe: 997b1168d7432100a866ee5b5e61031e
sys_name: get-nginx-ver.sh
sys_policy: ''
value: |-
  #!/bin/sh
  #

  # For an example NGINX running on centos, result of "nginx -v" command
  # is appeared as a warning, to avoid appear ther result, the warnings from the command
  # is tested and if result is a warning we pass the result in the outpout. 
  cmd=$1

  ANS=`${cmd} -v 2>/dev/null`

  if [ "$ANS" = "" ];then
        ANS=`${cmd} -v 2>&1`
  fi
  echo $ANS
value_script: ''
