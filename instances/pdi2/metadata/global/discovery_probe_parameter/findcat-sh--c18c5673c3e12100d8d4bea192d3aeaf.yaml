name: findcat.sh
probe: f3301ebfc3a12100d8d4bea192d3ae0a
sys_name: findcat.sh
sys_policy: ''
value: |-
  ppid=$1
  config=$2

  function find_config {
      # If -Dweblogic.RootDirectory parameter is not given, try and find the domain directory
      # By using the PPID of the process (which usually ties back to the startWeblogic.sh script)
      if [ "$config" == "undefined" ]; then
          full_path=`ps -p $ppid -o cmd= | awk '{print $2}'`
          # $full_path will be null if the PPID ties back to the init process
          if [ -n "$full_path" ]; then
              if test -e $full_path; then
                  cut_sh=`dirname $full_path`
                  cut_bin=`dirname $cut_sh`
                  final_path="$cut_bin/config/config.xml"
                  if test -e $final_path; then
                      cat $final_path
                  else
                      echo "$final_path is not a valid path. Could not find the config.xml file for this weblogic server." 1>&2
                      return 1
                  fi
              else
                  # This is the case when the current instance is a Managed Server 
                  # and its PPID does not tie back to the startWeblogic.sh script. 
                  # We should be grabbing the information from the related AdminServer 
                  # so this will happen occasionally and is expected behavior.
                  echo "This is not an AdminServer"
              fi
          else
              echo "Could not find the config.xml file for this weblogic server, this server was probably started via NodeManager and not through a dedicated startup script." 1>&2
              return 1
          fi
      else
          if test -e "$config"; then
              cat $config
          else
              echo "$config is not a valid path. Make sure that the -Dweblogic.RootDirectory parameter is set correctly." 1>&2
              return 1
          fi
      fi
  }

  find_config
value_script: ''
