name: should_filter_hotfix
probe: df4905820a0a0ba500b7ea51b460326c
sys_name: should_filter_hotfix
sys_policy: ''
value: ''
value_script: |-
  answer="false";
  // First check if we have a Windows filter enabled
  var discovery_spkg_filter_gr = new GlideRecord("discovery_spkg_filter");
  discovery_spkg_filter_gr.addQuery("filter", "exclude");
  discovery_spkg_filter_gr.addQuery("type", "windows");
  discovery_spkg_filter_gr.addQuery("enable", "1");
  discovery_spkg_filter_gr.query();

  if (discovery_spkg_filter_gr.hasNext()){
      var spkg_filter_gr = new GlideRecord("discovery_spkg_keys");
      spkg_filter_gr.addQuery("key", "Hotfix");
      spkg_filter_gr.addQuery("active", 1);
      spkg_filter_gr.query();

      // Return if we have a hotfix filtering
      answer = spkg_filter_gr.hasNext();
  }
  else{
      answer="false";
  }
