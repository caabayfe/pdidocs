name: chunk_size
probe: 04912e1d93f202007d8a705bb47ffb65
sys_name: chunk_size
sys_policy: ''
value: |-
  (function() {
      var namespace = probe.getParameter('namespace');

      // Larger chunk sizes will be faster
      if (namespace == 'root/emc') return 100;

      // Pure has a bug that seems to truncate responses when chunksize > 3
      if (namespace == 'purestorage') return 3;

      // 3Par claims it supports multirequests but it doesn't.  To be safe
      // we'll return 1 for everything else until we can verify that it supports
      // larger chunks
     return 1;
  })();
value_script: ''
