value_script: |-
  // ...com.ibm.ws.bootstrap.WSLauncher com.ibm.ws.runtime.WsServer /opt/IBM/WPS/profiles/ccmdb/config localhostNode01Cell ccmdb01 server1
  // from the command line parameters
  // last == server name
  // last - 1 == node name
  // last - 2 == cell name
  // last - 3 == config path
  // last - 4 == launched program
  // last - 5 == launcher (always predictable)

  var params = parameters.split(" ");
  var plength = params.length - 1; // starts with 0

  var configPath = params[plength - 3];
  var cellName = params[plength - 2];
  var nodeName = params[plength - 1];
  var serverName = params[plength];

  answer = configPath + "/cells/" + cellName + "/cell.xml";
