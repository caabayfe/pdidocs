value: ''
value_script: |-
  // In a Cloudera install, the HBase service config appears in a folder with the following pattern:
  // /var/run/cloudera-scm-agent/process/*-hbase-MASTER
  // /var/run/cloudera-scm-agent/process/*-hbase-REGIONSERVER
  var matches = parameters.match(/(\/var\/run\/cloudera-scm-agent\/process\/\d+-hbase-(MASTER|REGIONSERVER))/);

  if (matches) { // Cloudera Distribution
      answer = matches[1] + '/hbase-site.xml';  
  } else { // Apache Distribution
      answer = g_probe_parameters['hbase_home'] + '/conf/hbase-site.xml'; // default to
  }
