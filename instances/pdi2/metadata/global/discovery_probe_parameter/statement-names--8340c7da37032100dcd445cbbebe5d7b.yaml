name: statement_names
probe: 5355955237402000627d8c00dfbe5ddf
sys_name: statement_names
sys_policy: ''
value: ''
value_script: |-
  // Aggregates CIM statement names for all classifications

  // enumerate all active CIM classifications
  var classifierRecord = new GlideRecord('discovery_classy_cim');
  classifierRecord.addActiveQuery();
  classifierRecord.query();

  // foreach classification, record the statement names in order
  var statementNames = [];

  while (classifierRecord.next()) {
    var classifierId = '' + classifierRecord.sys_id;

    // query for criteria in this classification
    var criteriaRecord = new GlideRecord('discovery_class_criteria');
    criteriaRecord.addActiveQuery();
    criteriaRecord.addQuery('classy', classifierId);
    criteriaRecord.query();

    // foreach criteria, record the statement name
    while (criteriaRecord.next()) {
      var statementName = '' + criteriaRecord.name;
      if (!JSUtil.contains(statementNames, statementName))
        statementNames.push(statementName);
    }
  }

  // Get queries that CIM - Classify wants to make
  var classifyQueries = new GlideRecord('discovery_probes_cim_query');
  classifyQueries.addQuery('probe', '5355955237402000627d8c00dfbe5ddf');    // sys_id of CIM - Classify probe
  classifyQueries.query();
  while (classifyQueries.next()) {
     var result = SncDiscoveryCodeSigningUtil.isRecordTrusted('discovery_probes_cim_query', classifyQueries.getUniqueValue(), 'ecc_queue');
     if (result)
          statementNames.push('' + classifyQueries.name);
  }

  answer = statementNames.join(ProbeHandlerCim.STATEMENT_PARAMETER_DELIMITER);
