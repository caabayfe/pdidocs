name: GetEnvFiles.ps1
probe: 8a405889ff401000dada361332f49d51
sys_name: GetEnvFiles.ps1
sys_policy: ''
value: |2-
      # Environment specified location
      $envPath = '${envPath}'; 
      # Property specified location
      $propertyPath = '${defaultPropertyPath}';

      $res = $envPath.IndexOf('${')

      if ($envPath -and ($res -ne 0)) {  #Make sure it's substituted correctly..
          $dirPath = $envPath;
      } else {
          $dirPath = $propertyPath;
      }

      $dirPath = $dirPath.replace("\\", "\");  #Need it for the case where someone uses c:\abc

      $finalCommand = 'dir /w ' + '"' + $dirPath + '"';

      launchProcess -computer $computer -cred $cred -command $finalCommand
value_script: ''
