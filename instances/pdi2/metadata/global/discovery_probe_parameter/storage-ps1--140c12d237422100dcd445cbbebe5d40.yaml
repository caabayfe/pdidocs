sys_name: storage.ps1
sys_policy: ''
value: |-
  function processIscsiSessions($iscsiSessions) {
      Write-Host '{"iscsiSessions":[' -NoNewLine

      if ($iscsiSessions -isnot [system.array]) {
          $iscsiSessions = @($iscsiSessions) 
      }

      for ($i = 0; $i -lt $iscsiSessions.length; $i++) {
          for ($j = 0; $j -lt $iscsiSessions[$i].Devices.length; $j++) {
              processIscsiSession $iscsiSessions[$i] $iscsiSessions[$i].Devices[$j]

              if (($j+1) -ne $iscsiSessions[$i].Devices.length) {
                  Write-Host ',' -NoNewline
              }
          }

          if (($i+1) -ne $iscsiSessions.length) {
              Write-Host ',' -NoNewline
          }
      }

      Write-Host ']}'
  }

  function writeJson($str) {
      if ($str -eq $null) {
          Write-Host ""
      }

      $str = $str.ToString().Replace('"','\"').Replace('\','\\\\').Replace("`n",'\n').Replace("`r",'\r').Replace("`t",'\t')
      Write-Host $str -NoNewline
  }

  function processIscsiSession($iscsiSession, $iscsiSessionDevice) {
      Write-Host '{' -NoNewLine
      Write-Host '"targetIqn":"' -NoNewLine; writeJson $iscsiSessionDevice.TargetName; Write-Host '",' -NoNewLine
      Write-Host '"initiatorIqn":"' -NoNewLine; writeJson $iscsiSession.InitiatorName; Write-Host '",' -NoNewLine
      Write-Host '"deviceId":"' -NoNewLine; writeJson $iscsiSessionDevice.LegacyName -NoNewLine; Write-Host '",' -NoNewLine
      Write-Host '"ScsiLun":"' -NoNewLine; writeJson $iscsiSessionDevice.ScsiLun -NoNewLine; Write-Host '"' -NoNewLine
      Write-Host '}' -NoNewLine
  }

  function warn($warnStr) {
      Write-Host '[[==PROBE:warning==]]'
      Write-Host '{' -NoNewLine
      Write-Host '"warning":"' -NoNewLine; writeJson $warnStr -NoNewLine; Write-Host '"' -NoNewLine
      Write-Host '}' -NoNewLine
  }

  ##
  # Get powershell from first host name and then try from ip
  # @return ps session
  function getPSSession() {
      try { $computerName = [System.Net.DNS]::GetHostEntry($computer).HostName } catch {}

      if ($cred) {
          if ($computerName) {
              $ps = CreatePSSessionWithComputerName -Host $computerName -Credential $cred -ErrorAction SilentlyContinue
          }
          if (!$ps) {
              $ps = CreatePSSessionWithComputerName -Host $computer -Credential $cred -ErrorAction SilentlyContinue
          }       
      } else {
          if ($computerName) {
              $ps = CreatePSSessionWithComputerName -Host $computerName -ErrorAction SilentlyContinue
          }
          if (!$ps) {
              $ps = CreatePSSessionWithComputerName -Host $computer -ErrorAction SilentlyContinue
          }
      }

      return $ps
  }

  if ($cred) {
      $iscsiSessions = Get-WmiObject -Computer $computer -Credential $cred -Namespace root\wmi -Class MSiSCSIInitiator_SessionClass -ErrorAction SilentlyContinue
  } else {
      $iscsiSessions = Get-WmiObject -Computer $computer -Namespace root\wmi -Class MSiSCSIInitiator_SessionClass -ErrorAction SilentlyContinue
  }

  if ($iscsiSessions -ne $null) {
      Write-Host "[[==PROBE:iscsi==]]"
      processIscsiSessions $iscsiSessions
  }

  if ($SNC_session -eq $null) {
      $ps = getPSSession
  } else {
      $ps = $SNC_session
  }

  if (!$ps) {
      warn "Unable to establish a powershell session to obtain fibre channel information. Please check that you have proper credentials. Also check that WinRM is enabled and that either the MID server host and the target host are in the same domain or the target host is a trusted host."
      return
  }

  Write-Host '[[==PROBE:fcinfo_details==]]'
  invoke-command  -Session $ps -scriptblock {fcinfo /details} -ErrorAction SilentlyContinue -ErrorVariable a
  if ($a[0]) {
      warn "Unable to invoke fcinfo command on the target host. Please check to see if fcinfo is installed."
      return
  }


  Write-Host '[[==PROBE:fcinfo_ports==]]'
  invoke-command  -Session $ps -scriptblock {fcinfo /ports} -ErrorAction SilentlyContinue

  [regex]$numAdaptersRegex = "There are (\d+) adapters"
  $numAdaptersOutput = invoke-command -Session $ps -scriptblock {fcinfo} -ErrorAction SilentlyContinue
  $numAdapters = $numAdaptersRegex.Matches($numAdaptersOutput) | foreach { $_.Groups[1].Value }

  Write-Host '[[==PROBE:fcinfo_fcpmap==]]'
  for ($i = 0; $i -lt $numAdapters; $i++) {
      invoke-command -Session $ps -scriptblock { param($p) fcinfo /fcpmap /ai:$p } -Args $i -ErrorAction SilentlyContinue
  }
value_script: ''
