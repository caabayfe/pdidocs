value_script: |-
  // -classpath /usr/local/jboss-4.0.5.GA/bin/run.jar:/lib/tools.jar org.jboss.Main
  // value script, input vars are command, name, parameters, set answer
  var i = parameters.indexOf('-classpath');
  if (i > -1) {
    var s = parameters.substring(i); 
    var cpath = s.split(" ")[1];

    var runjarclasspath = cpath.split(":")[0];

    answer = runjarclasspath.substring(0, runjarclasspath.lastIndexOf("bin/run.jar")) + "server/default/conf/jboss-service.xml";
  }
