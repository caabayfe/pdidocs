sys_name: findweblist.sh
sys_policy: ''
value: |-
  XMLLIST=`find $1 -name web.xml -print 2>/dev/null`
  if [ -z "$XMLLIST" ]; then
  XMLLIST=`find -L $1 -name web.xml -print 2>/dev/null`
  fi

  for var in $XMLLIST
  do
  echo $var
  done
