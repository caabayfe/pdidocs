name: oracleversion.ps1
probe: 3c48298adf3221001e02a3cf6bf2639a
sys_name: oracleversion.ps1
sys_policy: ''
value: |-
  $exePath = '${commandVal}';
  $res = $exePath.IndexOf('${');

  #Make sure it's substituted correctly.
  Try{
  	if($exePath  -and ($res -ne 0)){

  		$oracleHome = $exePath -replace "\\bin\\oracle.exe","";
  		$oracleHome = $oracleHome -replace "/bin/oracle.exe","";

  		Write-Host "snc_ora_home=$oracleHome";

  		$sqlplusExePath = $exePath -replace "oracle.exe","sqlplus.exe";
  		$finalCommand = '"' + $sqlplusExePath + '" -V';
  		[string]$result1 = launchProcess -computer $computer -cred $cred -command $finalCommand;
  		if($result1 -ne $null -and $result1 -ne ""){
  			$matchFound = $result1 -match ".*:\sRelease\s([0-9\.]*)\s[\w]*";
  			if($matchFound) {
  				$VERSION = 'snc_ora_version=' + $matches[1];
  				Write-Host $VERSION;
  			} else {
  				throw "Could not determine oracle instance version from result:$result1.";
  			}
  		} else {
  			throw "Could not determine Oracle instance version.";
  		}
  	} else {
  		throw "Oracle exe path is invalid.";
  	}
  }
  Catch{
  	Write-Error $_.Exception.Message;
  	Exit 4;
  }
value_script: ''
