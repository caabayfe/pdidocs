name: filename
probe: 60fe930b0a0a0a6f005e409232b3b8bd
sys_name: filename
sys_policy: ''
value: ''
value_script: |-
  // --defaults-extra-file=/glide/mysql/data/my.cnf
  // --defaults-file=/etc/my.cnf
  // if defaults-extra-file exists, use it. if the paths are relative, use basedir

  answer = "/etc/my.cnf";
  var matches = null;
  var path = null;

  matches = parameters.match(/--defaults-extra-file=([0-9a-zA-Z_\-\.\/]+)/);
  if (matches)
      path = matches[1];
  else {
      matches = parameters.match(/--defaults-file=([0-9a-zA-Z_\-\.\/]+)/);
      if (matches)
          path = matches[1];
  }

  if (path != undefined) {
      if (path[0] != '/') {
          matches = parameters.match(/--basedir=([0-9a-zA-Z_\-\.\/]+)/);
          if (matches) {
              path = matches[1] + '/' + path;
              answer = path;
          }
      } else
          answer = path;
  }
