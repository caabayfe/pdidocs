name: get-zones.sh
probe: 17c3b4ce0a0a032700d51f4b08a8bd1e
sys_name: get-zones.sh
sys_policy: ''
value: |-
  #!/bin/sh
  #
  IFS="
  "
  ADMCMD=/usr/sbin/zoneadm
  ZNAMECMD=/usr/bin/zonename
  CFGCMD=/usr/sbin/zonecfg

  printf "<zones>\n"

  if [ -f $ADMCMD -and -f $ZNAMECMD ]; then
      MYZONENAME=`$ZNAMECMD`

      if [ "$MYZONENAME" = "global" ]; then
          MYZONEID="0"
          for LINE in `$ADMCMD list -cip`; do
              ZID=`echo $LINE | cut -d":" -f5`
              ZNAME=`echo $LINE | cut -d":" -f2`
              ZSTATUS=`echo $LINE | cut -d":" -f3`
              ZPATH=`echo $LINE | cut -d":" -f4`

              if [ "$ZNAME" != "global" ]; then
                      printf "<zone>\n"

                      printf "<id>%s</id>\n" $ZID

                      printf "<name>%s</name>\n" $ZNAME
                          
                      printf "<status>%s</status>\n" $ZSTATUS

                      printf "<path>\n"
                      $CFGCMD -z $ZNAME info zonepath
                      printf "</path>\n"

                      printf "<net>\n"
                      $CFGCMD -z $ZNAME info net
                      printf "</net>\n"

                      printf "</zone>\n"
              fi
          done
      else
          MYZONEID=`$ADMCMD -z $MYZONENAME list -p  | cut -d":" -f5`
      fi

      printf "<id>%s</id>\n" $MYZONEID
  fi

  printf "</zones>"
value_script: ''
