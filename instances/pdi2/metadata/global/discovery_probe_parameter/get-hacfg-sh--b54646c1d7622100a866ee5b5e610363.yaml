name: get-hacfg.sh
probe: 86b5c2c1d7622100a866ee5b5e6103fe
sys_name: get-hacfg.sh
sys_policy: ''
value: |-
  #!/bin/sh
  #
  CFG_LOCATION=$1

  # If the configuration path contains some white spaces it was wrapped in double quotes
  # Following command removes doublequotes from the begining and the end of the path
  CFG_LOCATION=`echo $CFG_LOCATION | sed -e 's/^\"*//' -e 's/\"*$//'`

  IFS='
  '

  # if  no path for haproxy.cfg then exit 
  if [ ! -f $CFG_LOCATION ]; then
  	echo "Cannot locate config file: $CFG_LOCATION"
  	exit 1
  fi

  KeyWords='defaults|frontend|backend|listen|bind|disabled|default_backend|balance|acl|mode|server|use_backend'
  grep -v '^\s*#' $CFG_LOCATION | egrep $KeyWords

  echo "<HOST-IP-INFORMATION>"

  HOSTLIST=`grep -v '^\s*#' $CFG_LOCATION | grep '^\s*server'`
  for i in $HOSTLIST;do
  	HOST=`echo $i | sed -e 's/^[ \t]*//'`
  	HOSTINFO=`echo $HOST | sed 's/\s\+/ /g' | cut -d ' ' -f3`
  	HOSTNAME=`echo $HOSTINFO | cut -d ':' -f1`
  	if [ `echo "$HOSTNAME" | grep [A-Za-z]` ];then
  		PINGINFO=`ping -c 1 $HOSTNAME 2>/dev/null | grep PING` 
  		IP=`echo $PINGINFO | cut -d '(' -f2 | cut -d ')' -f1`
  		if [ ! -z "$IP" -a "$IP" != " " ];then
  			echo $HOSTNAME ':' $IP
  		fi
  	fi
  done
value_script: ''
