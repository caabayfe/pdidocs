name: is_azure.sh
probe: c52d09cbdbed76003398f1351d96192d
sys_name: is_azure.sh
sys_policy: ''
value: |-
  #!/bin/bash

  MANUFACTURER=`sudo dmidecode -s system-manufacturer 2>/dev/null`
  PRODUCT=`sudo dmidecode -s system-product-name 2>/dev/null`
  if [ "$MANUFACTURER" = "Microsoft Corporation" ] && [ "$PRODUCT" = "Virtual Machine" ]; then
      echo "true"
  else
      echo "false"
  fi
value_script: ''
