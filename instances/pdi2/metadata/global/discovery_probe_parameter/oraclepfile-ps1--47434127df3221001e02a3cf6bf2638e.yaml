name: oraclepfile.ps1
probe: 51c1cde3df3221001e02a3cf6bf2630f
sys_name: oraclepfile.ps1
sys_policy: ''
value: |-
  $exePath = '${commandVal}';
  $res1 = $exePath.IndexOf('${');

  $sid = '${sidVal}';
  $res2 = $sid.IndexOf('${');

  #Make sure it's substituted correctly.
  Try{
  	if($exePath  -and ($res1 -ne 0)){
  			 $oracleHome = $exePath -replace "\\bin\\oracle.exe","";
  			 $oracleHome = $oracleHome -replace "/bin/oracle.exe","";
  		if($sid -and ($res2 -ne 0)){
  			$pfilesList="$oracleHome\database\spfile$sid.ora","$oracleHome\database\spfile.ora","$oracleHome\database\init$sid.ora";
  			$found = $false;
  			for($i=0; $i -lt $pfilesList.length; $i++){
  				$finalCommand = '(IF EXIST "' + $pfilesList[$i] + '" (type "' + $pfilesList[$i] + '") ELSE (echo "FILE_DOES_NOT_EXIST"))';
  				[string]$result = launchProcess -computer $computer -cred $cred -command $finalCommand; 
  				if($result -ne $null -and $result -ne "" -and (-not ($result -like "*FILE_DOES_NOT_EXIST*" ) )){
  					Write-Host $result;
  					$found = $true;
  					break;
  				}
  			}
  			if(-not $found) {
  				throw "Could not able to find the Server Parameter(spfile) file.";
  			}
  		} else {
  			throw "Invalid value of SID:$sid.";
  		}
  	} else {
  			throw "Invalid value of oracle exe path:$exePath.";
  	}
  }
  Catch{
  	Write-Error $_.Exception.Message; 
  	Exit 4;
  }
value_script: ''
