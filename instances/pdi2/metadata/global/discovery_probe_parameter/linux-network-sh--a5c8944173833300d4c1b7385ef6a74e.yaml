name: linux_network.sh
probe: e643f2c2a9fe15610038fc84ebfc075a
sys_name: linux_network.sh
sys_policy: ''
value: |-
  #!/bin/sh
  networkInfo=`ifconfig -a 2> /dev/null && echo SNC_ROUTING_TABLE_SNC && route -n 2> /dev/null`
  if [ "$?" -eq "0" ]; then
      echo "net-tools output"
      echo "$networkInfo"
      exit 0
  fi
  networkInfo=`ip address show 2> /dev/null && echo SNC_ROUTING_TABLE_SNC && ip route 2> /dev/null`
  if [ "$?" -eq "0" ]; then
      echo "iproute output"
      echo "$networkInfo"
      exit 0
  fi
  echo "both net-tools and iproute commands failed"
  exit 1
value_script: ''
