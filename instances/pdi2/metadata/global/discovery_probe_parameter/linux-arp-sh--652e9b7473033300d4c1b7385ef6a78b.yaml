name: linux_arp.sh
probe: 251b065b9f02310020eede0f842e7040
sys_name: linux_arp.sh
sys_policy: ''
value: |-
  #!/bin/sh
  arpInfo=`arp -n 2> /dev/null`
  if [ "$?" -eq "0" ]; then
      echo "net-tools output"
      echo "$arpInfo"
      exit 0
  fi
  arpInfo=`ip neighbor 2> /dev/null`
  if [ "$?" -eq "0" ]; then
      echo "iproute output"
      echo "$arpInfo"
      exit 0
  fi
  echo "both net-tools and iproute commands failed"
  exit 1
value_script: ''
