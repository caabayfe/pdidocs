name: get-apcfg.sh
probe: ef1c9c3d0a0a0b1000d1016807e46dae
sys_name: get-apcfg.sh
sys_policy: ''
value: |-
  #!/bin/sh
  #
  HTTPD=$1
  DIR=$2
  CFG=$3


  # Remove the first char from the input parameters, which is '-'. 
  # This character is used to identify which input parameter is empty
  HTTPD=`echo $HTTPD | sed 's/^.//'`
  DIR=`echo $DIR | sed 's/^.//'`
  CFG=`echo $CFG | sed 's/^.//'`


  # If the path contains white space it is wrapped in double quotes
  # In this case we need to remove these double quotes.
  DIR=`echo $DIR | sed -e 's/^\"*//' -e 's/\"*$//'`
  CFG=`echo $CFG | sed -e 's/^\"*//' -e 's/\"*$//'`


  if [ "$HTTPD" != "apache2ctl" ] &&[ "$HTTPD" = "" -o ! -x $HTTPD ]; then
  	echo "$HTTPD is not  executable" 1>&2
  	exit 1
  fi

  IFS="
  "
  # Find the configuation file path for apache server
  for i in `$HTTPD -V`; do
  	NAME=`echo $i | cut -d" " -f3|cut -d"=" -f1`
  	VALUE=`echo $i | cut -d" " -f3|cut -d"=" -f2| sed -e 's/^\"*//' -e 's/\"*$//'`
          # Strip down to the right of the "=", then strip away leading and trailing quotes.
  	
  	if [ "$NAME" = "HTTPD_ROOT" ]; then
  		DEFAULT_ROOT=$VALUE
  	fi
  	
  	if [ "$NAME" = "SERVER_CONFIG_FILE" ]; then
  		DEFAULT_CFG=$VALUE
  	fi
  done

  if [ "$DIR" = "" ]; then
  	DIR=$DEFAULT_ROOT
  fi

  if [ "$CFG" = "" ]; then
  	CFG=$DEFAULT_CFG
  fi

  if [ "`echo $CFG | cut -c1`" = "/" ]; then
  	CFG_LOCATION=$CFG
  else
  	CFG_LOCATION=$DIR/$CFG
  fi

  if [ ! -f $CFG_LOCATION ]; then
  	echo "Cannot locate config file: $CFG_LOCATION"  1>&2
  	exit 1
  fi

  KeyWords='ServerName|Listen|Port'
  grep -v '^\s*#' $CFG_LOCATION | egrep $KeyWords
  #Translation: Search for comment lines, now allowing for leading whitespace.

  echo "--- LOAD BALANCER MODULES INFO ---"
  MODJK=""
  MODPROXY=""
  MODJK=`$HTTPD -M 2>/dev/null | grep 'jk_module'`
  MODPROXY=`$HTTPD -M 2>/dev/null | grep 'proxy_module'`

  echo "MODJK  " $MODJK
  echo "MODPROXY  " $MODPROXY
  echo "CFG_LOCATION  "$CFG_LOCATION
value_script: ''
