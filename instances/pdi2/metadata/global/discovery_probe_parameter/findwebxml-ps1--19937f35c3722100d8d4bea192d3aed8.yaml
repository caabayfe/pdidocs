sys_name: findwebxml.ps1
sys_policy: ''
value: |-
  $path = "${deploy_dir}"
  if ($path -ne "undefined") {
      $cmd = "cd $path & dir web.xml /b/s"
      $result = launchProcess -computer $computer -cred $cred -command $cmd
      $result | ForEach-Object {Write-Host $_}
  }
