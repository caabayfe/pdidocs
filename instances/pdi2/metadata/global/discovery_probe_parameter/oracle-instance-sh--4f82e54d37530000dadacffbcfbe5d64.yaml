active: 'true'
name: oracle_instance.sh
probe: 3f82e14d37530000dadacffbcfbe5dbb
sys_name: oracle_instance.sh
sys_policy: ''
value: |-
  SID=$1
  ORATABS="/var/opt/oracle/oratab /etc/oratab /var/opt/unix/oratab /etc/oracle/oratab /etc/opt/oracle/oratab /shared/opt/oracle/oratab"
  FAILED=0
  ERR=""

  get_pfile() {
      PFILES="${ORA_HOME}/dbs/spfile${SID}.ora ${ORA_HOME}/dbs/spfile.ora ${ORA_HOME}/dbs/init${SID}.ora"
      for PFILE in $PFILES; do
          if [ -f $PFILE ]; then
              FAILED=`strings $PFILE 1> /dev/null 2>&1; echo $?`
              [ "$FAILED" != 0 ] && ERR="Could not read Oracle (s)pfile: $PFILE. $ERR" && return
              echo "snc_pfile_contents="
              strings $PFILE
              return
          fi
      done
      FAILED=1
      ERR="No Oracle (s)pfile found (or insufficient permissions). $ERR"
  }

  get_version() {
      VERSION=`echo exit | ORACLE_HOME=$ORA_HOME $ORA_HOME/bin/sqlplus /NOLOG 2>&1 | sed -n 's/.*: Release \([0-9\.]*\) .*/\1/p'`
      [ "$VERSION" != "" ] && echo "snc_ora_version=$VERSION" && return
      VERSION=`${ORA_HOME}/bin/lsnrctl status 2>&1 | grep Version | sed -ne 's/.*: Version \([0-9.]*\) .*/\1/p'`
      [ "$VERSION" != "" ] && echo "snc_ora_version=$VERSION" && return
      VERSION=`echo $ORA_HOME | sed -ne 's/.*\/\([0-9.]*\)\/.*/\1/p'`
      [ "$VERSION" != "" ] && echo "snc_ora_version=$VERSION" && return
      FAILED=1
      ERR="Could not determine Oracle instance version. $ERR"
  }

  runit() {
      [ ! $SID ] && echo "No Oracle SID was provided" && exit 1
      for ORATAB in $ORATABS; do
          if [ -f $ORATAB ]; then
              INSTANCES=`cat $ORATAB | sed -n 's/^\([^:#]*\):\([^:]*\):.*/\1:\2/p'`
              for INST in $INSTANCES; do
                  if [ "X`echo $INST | cut -d ':' -f 1`" = "X$SID" ]; then
                      ORA_HOME=`echo $INST | cut -d ':' -f 2`
                      echo "snc_ora_home=$ORA_HOME"
                      get_version
                      get_pfile
                      return
                  fi
              done
          fi
      done
      FAILED=1
      ERR="No Oracle oratab file found. $ERR"
  }

  runit
  [ "$FAILED" != 0 ] && echo "snc_error=$ERR"
  exit 0
value_script: ''
