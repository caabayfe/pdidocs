sys_name: ec2_data.sh
sys_policy: ''
value: |-
  #!/bin/sh

  if [ -f  /sys/hypervisor/compilation/compiled_by ]; then
      cat /sys/hypervisor/compilation/compiled_by
  elif [ -f  /sys/devices/virtual/dmi/id/product_uuid ]; then
      ${sudo:cat /sys/devices/virtual/dmi/id/product_uuid}
  else
      echo "No EC2 Data"
  fi
