name: unix_fqdn.sh
probe: b5fca69eef30110098d5925495c0fb64
sys_name: unix_fqdn.sh
sys_policy: ''
value: |-
  #!/bin/sh
  hostname=`hostname 2> /dev/null`
  if [ "$?" -ne "0" ]; then
      echo "Unable to find a hostname!"
      exit 1
  fi
  echo $hostname | grep '\.' >/dev/null 2>&1
  if [ "$?" -eq "0" ]; then
  	echo $hostname
  else
  	# search for keyword starting at the beginning of the line with optional whitespace
  	domain=`grep '^[\s]*domain' /etc/resolv.conf`
  	if [ -z "$domain" ]; then
  		domain=`grep '^[\s]*search' /etc/resolv.conf`
  	fi
  	if [ "$domain" ]; then
  		# use parameter parsing to tokenize 
  		set -- $domain
  		if [ $2 ]; then
  			echo $hostname.$2
  		fi
  	fi
  fi
  exit 0
value_script: ''
