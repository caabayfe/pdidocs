name: get_domains.sh
probe: 2e6eeca4c381010031e65ad8cbba8fdd
sys_name: get_domains.sh
sys_policy: ''
value: |-
  #!/bin/bash
  ROOT_TAG=domains
  LIST_TAG=domain_list
  DISK_DATA_TAG=disk_data

  echo "<$ROOT_TAG>"

  echo "<$LIST_TAG>"
  virsh list --all
  RESULT=$?
  if [ $RESULT -ne 0 ] ; then
  	exit $RESULT
  fi
  echo "</$LIST_TAG>"

  for DOMID in `virsh list --all | tail -n +3 | awk '{print $2}'`
  do
  	virsh dumpxml $DOMID
  	 
  	#the greps track down the <source file='XYZ'> tags
  	#the first sed removes all the stuff leading up to and including the first quote
  	#the second sed removes everything after the second quote
  	for DISKID in `virsh dumpxml $DOMID | 
  		grep source | 
  		grep 'file\s*=\s*' | 
  		sed -e 's/\s*<source .*file\s*=\s*['"'"'"]//' | 
  		sed -e 's/['"'"'"].*//'`
  	do
  		echo "<$DISK_DATA_TAG file='$DISKID'>"
  		virsh domblkinfo $DOMID $DISKID
  		echo "</$DISK_DATA_TAG>"
  	done
  done
  echo "</$ROOT_TAG>"
value_script: ''
