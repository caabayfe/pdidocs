name: findconfig.ps1
probe: 0f89dc44c3122100d8d4bea192d3aea2
sys_name: findconfig.ps1
sys_policy: ''
value: |-
  $root = "${root}"
  $config = "${config}"
  $platform = "${home}"
  $path = $null

  # First check if -Dweblogic.DirectoryRoot is defined
  # Ex: -DweblogicDirectoryRoot=C:\Oracle\Middleware\user_projects\domains\weblogic
  if ($root -ne "undefined") {
      # If so, check if -Dweblogic.ConfigFile is defined
      # Ex: -Dweblogic.ConfigFile = myconfig.xml
      if ($config -ne "undefined") {
          $path = $root + "\config\" + $config
      # If -Dweblogic.ConfigFile is not defined, assume it is in the default path
      } else {
          $path = $root + "\config\config.xml"
      }
  } elseif ($platform -ne "undefined") {
      $defaultPath = Split-Path $platform
      $defaultPath += "\user_projects\domains"
      # Retrieve config.xml filepath
      $cmd = "for /r $defaultPath %a in (*) do if `"%~nxa`"==`"config.xml`" echo %~dpnxa"
      [string]$result = launchProcess -computer $computer -cred $cred -command $cmd
      # Need to check this case
      if ($result -ne $null -and $result -ne "1") {
         $path = $result
      }
  } else {
      $path = $null
  }

  if ($path -ne $null) {
      $finalCommand = "type $path"
      $output = launchProcess -computer $computer -cred $cred -command $finalCommand
      # This needs to be wrapped in XML declaration + root because the ecc queue automatically eats this
      # CDATA is because the SAX Parser throws an exception for malformatted XML
      $final = "<?xml version='1.0' encoding='UTF-8'?><config><![CDATA[" + $output + "]]></config>"
  } else {
      $final = "Could not find config.xml file, please explicitly define the -Dweblogic.RootDirectory path in the weblogic server's startup parameters."
  }
  Write-Host $final
value_script: ''
