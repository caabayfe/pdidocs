name: linux_fqdn.sh
probe: 0d277610ef30110098d5925495c0fbc5
sys_name: linux_fqdn.sh
sys_policy: ''
value: |-
  #!/bin/sh
  hostname=`hostname -f 2> /dev/null`
  if [ "$?" -ne "0" ]; then
      echo "Unable to find a hostname!"
      exit 1
  fi
  echo $hostname | grep "\." >/dev/null 2>&1
  if [ "$?" -eq "0" ]; then
  	echo $hostname
  else
  	domain=`dnsdomainname 2> /dev/null`
  	if [ $domain ]; then
  		echo $hostname.$domain
  	else
  		# search for keyword starting at the beginning of the line with optional whitespace
  		domain=`grep ^[[:space:]]*domain /etc/resolv.conf`
  		if [ -z "$domain" ]; then
  			domain=`grep ^[[:space:]]*search /etc/resolv.conf`
  		fi
  		if [ "$domain" ]; then
  			# use parameter parsing to tokenize 
  			set -- $domain
  			if [ $2 ]; then
  				echo $hostname.$2
  			fi
  		fi
  	fi
  fi
  exit 0
value_script: ''
