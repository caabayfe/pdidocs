value: |2-
    /**********************************************
     * Use Service-now.com WMIAPI to gather stats
     * This script requires the admin share (admin$) enabled and point to the windows system directory (like \WINDOWS or \WINNT).
    ***********************************************/
    var CMD_RETRIES = 3;
    var FOR_READING = 1;
    var OUTPUT_FILE = "application_disco_output.txt";
    var DEBUG = false;
    var MAX_TIMEOUT = 60000; //60 seconds; This timeout dictates how long each command can run.

    var scanner = getScanner();
    if (scanner) 
        var output = run();

    scanner.appendToRoot("output", output);

    /*******************************************
     * Function definitions
     ******************************************/
    function run() {
        var sysDir = "C:\\WINDOWS\\system32";
        sysDir = setSystemDirectory(scanner.fetchTable("Win32_OperatingSystem"));

        // Environment specified location
        var envPath = "${envPath}"; 
        // Property specified location
        var propertyPath = "${defaultPropertyPath}";

        if (envPath && envPath.indexOf("${") != 0) // Make sure it's substituted correctly..
            dirPath = envPath;
        else
            dirPath = propertyPath;

        // Running the command and pipe the output to a file and read the file back... 
        // the "2>&1" redirect both stdout and stderr to the file
        executeCommand(sysDir + "\\cmd.exe /c dir /w \"" + dirPath + "\" > %SystemRoot%\\temp\\" + OUTPUT_FILE + " 2>&1");
        var output = readFile(OUTPUT_FILE);

        //Clean up the temp file created...
        executeCommand(sysDir + "\\cmd.exe /c del %SystemRoot%\\temp\\" + OUTPUT_FILE);

        return output;
    }

    function setSystemDirectory(items) {
        for(var i = 0; i < items.length; i++) {
            var item = items[i];
            sysDir = item.SystemDirectory;
        }

        return sysDir;
    }

    function executeCommand(command) {
        for(var i = 0; i < CMD_RETRIES; i++) {
            var oProcess = GetObject('winmgmts:\\\\' + gCurrentMachine + '\\root\\CIMV2:Win32_Process')
            var oMethod = oProcess.Methods_.Item("Create");
            var oInParam = oMethod.InParameters.SpawnInstance_();
            oInParam.CommandLine = command;

            var oOutParam = oProcess.ExecMethod_(oMethod.Name, oInParam);
            var retValue = oOutParam.ReturnValue;
            var pid = oOutParam.ProcessID;
  	  debug("Running command: " + command);
            debug("The return value is " + retValue);
            debug("The process ID is " + pid);

            //If the command returns successfully, let's get out of here...
        	  if (retValue == 0)  
                break;
         }
         
         waitForProcessComplete(pid); 
     }

    function readFile(fileName) {
        var fileObj = new ActiveXObject("Scripting.FileSystemObject");
        try {
            var objTextFile = fileObj.OpenTextFile("\\\\" + gCurrentMachine + "\\admin$\\temp\\" + fileName, FOR_READING);
            var output = objTextFile.ReadAll();
            objTextFile.close();
        } catch (e) {
            return "Exception in readFile: " + e.message;
        }

        return output;
    }

    function waitForProcessComplete(pid) {
        var myDate = new Date();
        myDate.setTime(myDate.getTime()+MAX_TIMEOUT)

        while (processExists(pid) == true && ((new Date()) < myDate)) 
             WScript.Sleep(100);
    }

    function processExists(pid) {
        try {
            var wql = "SELECT * FROM Win32_Process WHERE ProcessId=" + pid;
  	  debug("Running wql query: " + wql);
            var procs = GetObject('WinMgmts:\\\\' + gCurrentMachine + "\\root\\CIMV2").ExecQuery(wql);
            for (var en = new Enumerator(procs); !en.atEnd(); en.moveNext())
                return true;

            return false;
        } catch (e) {
            return false;
        }
    }
   
    function debug(msg) {
         if (DEBUG == true)
             WScript.echo(msg);
    }
value_script: ''
