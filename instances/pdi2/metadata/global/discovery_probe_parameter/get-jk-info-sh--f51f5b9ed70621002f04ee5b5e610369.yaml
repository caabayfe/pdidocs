name: get-jk-info.sh
probe: 9a38a29fd73121002f04ee5b5e6103bc
sys_name: get-jk-info.sh
sys_policy: ''
value: |-
  #!/bin/sh
  #
  CFG_LOCATION=$1

  IFS="
  "
  # looking for the key words  corresponding to the mod_jk in the httpd.conf file.

  SERVERROOT=`grep '^\s*ServerRoot' $CFG_LOCATION | sed 's/\<ServerRoot\>//g' | tr -d ' '`

  KeyWords='ServerName|VirtualHost|Listen|ServerRoot|JkWorkersFile|JkMount'
  grep -v '^\s*#' $CFG_LOCATION | egrep $KeyWords

  # Read information for workers in JkWorkersFile path 
  WPATH=`grep  '^\s*JkWorkersFile' $CFG_LOCATION | cut -d ' ' -f2`
  if [ ! -z "$WPATH" ]; then
  	grep '^\s*worker' $WPATH
  fi

  # collect all mod_jk information from included files 

  INCLUDES=`grep '^\s*Include' $CFG_LOCATION`
                 
  for i in $INCLUDES; do
  	FILE=`echo "$i"|sed 's/\s*\<Include\>//g'|tr -d ' '`
  	if [ "$(echo $FILE | head -c1)" != "\/" ]; then
  		FILE=`echo "$SERVERROOT""/""$FILE"`
      fi

      if [ -n "$(find $FILE 2>/dev/null)" ]; then
      	WPATH=`grep '^\s*JkWorkersFile' $FILE | cut -d ' ' -f2`
      	if [ ! -z "$WPATH" ]; then
      		grep '^\s*worker' $WPATH
      	fi
      	KeyLines=`grep -v '^\s*#' $FILE | egrep $KeyWords`
      	for line in $KeyLines; do
      		LINE=`echo $line |cut -d ':' -f 2-`
      		echo $LINE
      	done
      fi
  done
  # collect information corresponding hosts and IP addresses 
  echo "<<HOST-INFORMATION>>"
  cat /etc/hosts
value_script: ''
