name: linux_aws.bash
probe: 15bac0329f70120004141f80a57fcf36
sys_name: linux_aws.bash
sys_policy: ''
value: |-
  #!/bin/bash

  METADATA_URL="http://169.254.169.254/latest/dynamic/instance-identity/document"

  if hash wget 2>/dev/null; then
      # Check once to see if target exists and give 1 second timeout
      wget --spider -t 1 -T 1 ${METADATA_URL} 2>/dev/null
      if [ $? -eq 0 ]; then
          wget -qO- ${METADATA_URL}
      fi
  elif hash curl 2>/dev/null; then
      curl --connect-timeout 1 $METADATA_URL 2> /dev/null
  elif hash python 2>/dev/null; then
      python -c "exec(\"import urllib\\nimport sys\\ntry:\\n\\tresponse = urllib.urlopen('${METADATA_URL}')\\n\\tid = response.read()\\n\\tprint id\\nexcept:\\n\\tsys.stdout.write('')\")"
  fi
value_script: ''
