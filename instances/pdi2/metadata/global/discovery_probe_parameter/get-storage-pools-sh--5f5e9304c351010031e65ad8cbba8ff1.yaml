name: get_storage_pools.sh
probe: 5e0e5304c351010031e65ad8cbba8fc4
sys_name: get_storage_pools.sh
sys_policy: ''
value: |-
  #!/bin/bash
  ROOT_TAG=storage_pools
  POOL_TAG=poolio
  LIST_TAG=pool_list

  echo "<$ROOT_TAG>"

  echo "<$LIST_TAG>"
  virsh pool-list --all
  RESULT=$?
  if [ $RESULT -ne 0 ] ; then
  	exit $RESULT
  fi
  echo "</$LIST_TAG>"

  for POOLID in `virsh pool-list --all | tail -n +3 | awk '{print $1}'`
  do
  	virsh pool-refresh $POOLID > /dev/null
  	echo "<$POOL_TAG id='$POOLID'>"
  	virsh pool-dumpxml $POOLID

  	for VOLID in `virsh vol-list --pool $POOLID | tail -n +3 | awk '{print $1}'`
  	do
  		virsh vol-dumpxml --pool $POOLID $VOLID
  	done
  	echo "</$POOL_TAG>"
  done
  echo "</$ROOT_TAG>"
value_script: ''
