name: powershell_param_confFilePath
probe: 0e6ce562ef1221007f04b25495c0fbf3
sys_name: powershell_param_confFilePath
sys_policy: ''
value: ''
value_script: |-
  var answer = undefined; 
  var path = undefined; 

  //--config   "c:\program files\mongodb\conf\mongodb.conf"
  //--config="c:\program files\mongodb\conf\mongodb.conf"
  //-f  "c:\program files\mongodb\conf\mongodb.conf"

  matches = parameters.match(/(\-f|\-\-config)([\s]+|=)"([a-zA-z]:\\[0-9a-zA-Z_\-\.\\\s]+)"/);
  if (matches) {
      if ((matches[1])&&(matches[2])&&(matches[3]))
          path = matches[3];
  }


  //--config   c:\mongodb\conf\mongodb.conf
  //--config=c:\mongodb\conf\mongodb.conf
  //-f  c:\mongodb\conf\mongodb.conf

  matches = parameters.match(/(\-f|\-\-config)([\s]+|=)([a-zA-z]:\\[0-9a-zA-Z_\-\.\\]+)/);
  if (matches) {
      if ((matches[1])&&(matches[2])&&(matches[3]))
          path = matches[3];
  }

  if (path != undefined) {
          answer = path;
  }
