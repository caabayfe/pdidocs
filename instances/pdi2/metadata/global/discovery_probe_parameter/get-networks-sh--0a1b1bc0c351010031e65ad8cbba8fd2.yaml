name: get_networks.sh
probe: 2b6a97c0c351010031e65ad8cbba8f7b
sys_name: get_networks.sh
sys_policy: ''
value: |-
  #!/bin/bash
  ROOT_TAG=networks
  LIST_TAG=network_list

  echo "<$ROOT_TAG>"

  echo "<$LIST_TAG>"
  virsh net-list --all
  RESULT=$?
  if [ $RESULT -ne 0 ] ; then
  	exit $RESULT
  fi
  echo "</$LIST_TAG>"

  for NETID in `virsh net-list --all | tail -n +3 | awk '{print $1}'`
  do
  	virsh net-dumpxml $NETID
  done
  echo "</$ROOT_TAG>"
value_script: ''
