name: mysqlconfig.ps1
probe: 8e812c67df1221001e02a3cf6bf26303
sys_name: mysqlconfig.ps1
sys_policy: ''
value: |-
  $mysqlConfigPath = '${configFilePathVal}';
  $res = $mysqlConfigPath.IndexOf('${');
  #Make sure it's substituted correctly..
  if($mysqlConfigPath  -and ($res -ne 0)) {
    $finalCommand = 'type "' + $mysqlConfigPath + '"';
    launchProcess -computer $computer -cred $cred -command $finalCommand 
  } else {
    Write-Error "Configuration file path not specified as part of running MySql process"
    Exit 4
  }
value_script: ''
