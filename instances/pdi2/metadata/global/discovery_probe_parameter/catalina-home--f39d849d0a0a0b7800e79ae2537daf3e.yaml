  // -Dcatalina.home=/glide/instances/devsqlserver_16002
  // value script, input vars are command, name, parameters, set answer
  var i = parameters.indexOf('-Dcatalina.base');
  var names = ['-Dcatalina.home', '-Dcatalina.base'];
  for (var i = 0; i < names.length; i++) {
    var j = parameters.indexOf(names[i]);
    if (j > -1) {
      var s = parameters.substring(j); 
