name: mysqlinfo.ps1
probe: ea4afa31df5221001e02a3cf6bf263e2
sys_name: mysqlinfo.ps1
sys_policy: ''
value: |-
  $mysqlExePath = '${commandVal}';
  $res = $mysqlExePath.IndexOf('${');
  #Make sure it's substituted correctly..
  if($mysqlExePath  -and ($res -ne 0)) {
    $finalCommand = '"' + $mysqlExePath + '" -V';
    launchProcess -computer $computer -cred $cred -command $finalCommand
  } else {
    Write-Error "MySql exe path not specified as part of running MySql process";
    Exit 4
  }
value_script: ''
