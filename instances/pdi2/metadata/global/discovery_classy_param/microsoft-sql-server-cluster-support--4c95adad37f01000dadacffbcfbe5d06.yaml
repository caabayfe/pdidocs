name: Microsoft SQL Server Cluster Support
sys_name: Microsoft SQL Server Cluster Support
sys_policy: ''
type: Cluster
value: |-
  resourceType: "SQL Server",
  isMatch: function(process, resource) {
      var resName = /SQL Server \(([A-z][A-z0-9_$]{0,15})\)/;
      var instName = resName.exec(resource.name);
      instName = gs.nil(instName) ? "MSSQLSERVER" : instName[1];
      instName = new RegExp("^" + instName + "@.+$", "i");
      if (process.name.match(instName))
          return true;
  }
