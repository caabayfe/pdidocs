template: "assignment_group=26b8a93db7517210693cfeb0be11a93c^category=System Software^short_description=Replace failed SSD in LHR Storage Array LHR-D04-R22 to restore redundancy.^description=This change replaces a failed 3.84TB SSD in Storage Array SN: 123098 located in Rack LHR-D04-R22 to restore the array to full operational redundancy.^justification=The current SSD failure reduces the storage array to a degraded state, increasing the risk of data loss; replacing the drive is mandatory to re-establish RAID redundancy and ensure data integrity.^implementation_plan=Identify and locate the failed drive via management software, physically hot-swap the SSD, and then monitor the array's rebuild process until completion.^risk_impact_analysis=Risk is low, as the array is currently operating in a degraded (but functional) state; impact is limited to a brief I/O performance hit during the rebuild, but no application downtime is anticipated.^backout_plan=If the array does not initiate the rebuild or fails during the process, reinsert the old drive (if stable) or leave the slot empty and escalate the issue to the storage vendor.^test_plan=Verify that the storage array management console shows the new drive as online/good, confirm that the RAID rebuild process completes successfully, and check system logs for errors.^EQ"
