description: Tabbed form sections remember the last used tab. For test results with any kind of successful status, only the 'additional details' tab is displayed and therefore remembered. Navigating to a test result with a failure or error will then load with the 'additional details' tab active. For test results with a failure or error, explicitly set the tab with failure information (either client error details or failure details) to active.
