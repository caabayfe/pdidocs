description: Before-query business rules are not allowed on out-of-scope tables. Before-query rules can be added to tables within your same scope. This prevents things like setting the table to one in your scope, setting the Query flag, and then changing the table to an out-of-scope one. There are exceptions for BRs that existed before this restriction was in place.
field: collection
global: 'true'
isolate_script: 'false'
messages: |-
  Business rules that modify queries cannot be created for out-of-scope tables
  Query has been set to false because an out-of-scope table was selected
name: No query for out-of-scope tables
