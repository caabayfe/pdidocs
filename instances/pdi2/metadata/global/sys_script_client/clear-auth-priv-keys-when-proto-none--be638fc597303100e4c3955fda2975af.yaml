description: |-
  - Clears the auth/priv key fields if protocols for either are set to 'none'
  - Sets auth/priv protocol fields to 'none' if the respective key fields are blank
  - Cancels form submission if auth or priv key fields have less than 8 characters
  - Cancels form submission if privacy protocol/key is set when auth protocol is none (noAuthPriv security level doesn't exist)
field: active
global: 'true'
isolate_script: 'false'
messages: |-
  Key must be at least 8 characters in length
  Privacy protocol cannot be set if authentication protocol is none
name: Clear auth/priv keys when proto none
