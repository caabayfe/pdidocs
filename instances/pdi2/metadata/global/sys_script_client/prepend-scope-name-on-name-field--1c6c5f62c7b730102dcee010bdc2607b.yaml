description: |-
  Prepends the scope name (followed by a period) to the front of the 'name' field on the db_image record when:
  - The user first enters the name of the image into the field. 
  - The user empties out the contents of the name field and then subsequently adds a new name.

  Scope name (followed by a period) will NOT be prepended onto the 'name' field on the db_image record if:
  - The user makes a manual modification to value of the 'name' field
  - The scope of the record is global
  - The user completely clears out the contents of the name field and does not proceed to add a new name
field: name
