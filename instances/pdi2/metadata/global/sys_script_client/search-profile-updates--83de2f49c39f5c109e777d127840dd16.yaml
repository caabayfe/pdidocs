description: |-
  Runs a number of updates when a user changes Search Profile for a Search Application Configuration.

  First, the script warns the user if they are sure they want to change the Search Profile because they will lose any NavTab configurations. If the user clicks 'confirm' in the warning modal the script will:
  - Fetch the new NavTab records associated with this new Search profile
  - Validate all existing Facet records and warn users if any Facets are invalid after the profile changed. "Invalid" here means the table name for the Facet is not defined in the new Search Profile's search sources
field: search_profile
global: 'true'
isolate_script: 'true'
messages: |-
  Warning. By switching the Search Profile the following search facets are invalid. Please either remove the facet record or update the search sources in the Search Profile to include the table these facets are mapped to.
  Confirmation
  Are you sure you want to change the Search Profile? Doing so will remove all configurations made to the Source Facet Bucket.
