messages: |-
  Only the following characters are valid for the path: a-z, A-Z, 0-9, '/', '{}', and '_'
  Path cannot contain nested path variables, for example '/{myvar{nested}}' is invalid
  Path cannot contain unclosed curly braces, for example '/{myvar' is invalid
  Slash characters cannot be nested in curly braces, for example '{myvar/abc}' is invalid
  Only one path variable is allowed per slash-delimited URL section, for example '/{myvar}_{abc}' is invalid
