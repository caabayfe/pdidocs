messages: |-
  {0}{2}Map field and transform value (Single field){3} - Mapping rule that transforms specific values from a single event field to another event field.{1}{4}
  {0}{2}Create or update field and set constant value (Constant){3} - Mapping rule that sets a constant value to a new field.{1}{4}
  {0}{2}Map field (Copy field){3} - Mapping rule that copies the exact value of a field to the specified mapped field.{1}{4}
  {0}{2}Map field and transform value using regex{3} - Mapping rule that transforms a regular expression (regex) to a new value and maps it to a different field.{1}{4}
  {0}{2}Map field using regex{3} - Mapping rule that copies the exact value of a regular expression (regex) to a new field.{1}{4}
  {0}{2}Map field and copy value from regex group{3} - Mapping rule that copies the exact value of a regular expression (regex) group to a new field.{1}{4}
  {0}{2}Advanced mapping using script{3} - Script to implement an advanced mapping rule.{1}{4}
  {0}{2}Map field from reference table{3} - Mapping rule that copies the exact value of a reference table field to the specified mapped field.{1}{4}
  {0}When the flag 'Run after binding' is set to true the rule is executed after the CI binding phase.{1}{2}
  {0}Use the prefix below to retrieve values from the CI record:{1}{8}{0}{2}'{6}'{3} to retrieve a field from the CI record. Dot-walk to a related record is also possible. Example: {6}asset.model{1}{8}{0}{2}'{7}'{3} to retrieve a value from the {4} cmdb key value table {5}. Example: {7}subscription notes{1}{8}{0}{2}Warning{3}: Using this feature may cause degradation in performance, if overused.{1}{8}
