description: |-
  Warning users that the marking duplicate of an existing PRB to a target PRB would lead to closure of related PTASK in current PRB. The message shows up if below conditions are satisfied
  1. Moving of PTASKs is specified
  2. Cascade closure of PTASK is enabled 
  3. There are Open PTASK in the current PRB
  4. The target PRB is Closed
