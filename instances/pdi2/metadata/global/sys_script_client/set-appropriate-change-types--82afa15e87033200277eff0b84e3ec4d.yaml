description: |-
  Change Type can be modified when the Change State is New. Setting the appropriate options of the Type choice list by following the below rules:
  - Changes of type other than 'Standard' cannot be updated to 'Standard'.
  - Changes of type 'Standard' can be updated to any other type. 
  - Changes of type 'Standard' cannot have the model updated while in Type Compatibility mode (System Property: 'com.snc.change_management.change_model.type_compatibility'). 
