description: |-
  Save legacy dashboards permissions
  > Give read access to all the entities (groups, users and roles) which are currently defined in pa_dashboards
         >> Give pa_viewer and pa_contributor - view rights to the existing dashboards
         >> Give pa_admin and pa_power_user – write and delete rights to the existing dashboards

  >>> If the dashboardbelongs to a group and there are no permissions defined on the pa_dashboards and pa_dashboards_group tables, then
   * we transfer pa_viewer and pa_contributor roles to pa_dashboard_group and we give pa_power_user and pa_admin role, writting access to pa_dashboards.
   * Else we give pa_viewer and pa_contributor read access on pa_dashboards and pa_power_user and pa_admin writting access on the same table - pa_dashboards.
name: Save legacy dashboards permissions
