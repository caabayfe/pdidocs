description: " In the San Diego release, a script action was introduced to re-encrypt the SSH private key using the new KMF key.\n During this script action, the \"Encrypt SSH private key\" business rule was temporarily deactivated, creating a record in the sys_update_xml table. This record prevents upgrading the business rule to the new version introduced in  the Washington release.\nUsing this fix job, if the old version of the business rule still exists and a record for it is present in the sys_update_xml table, we set replace_on_upgrade to true to ensure the business rule gets upgraded.\n  "
name: Allow Upgrade SSH Private Key BR
record_for_rollback: 'true'
