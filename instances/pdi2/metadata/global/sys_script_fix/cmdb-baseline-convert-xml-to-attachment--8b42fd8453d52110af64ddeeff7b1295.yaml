description: |-
  This script captures the data from XML field on the records of 'CMDB Baseline Entry' table and copies it to a new attachment on the same record. Only one attachment will be created if and only if there is no attachment already. Once eveyrthing is converted, please set following property to true: com.cmdb.baseline.entry.attachment
  After setting that property to true, 'CMDB Baseline Diff' formatter will be using the attachment to find the diff and read the XML in streaming fashion to avoid excessive memory usage. If the property is set to false, it will fallback to using old code which uses existing XML field to find the diff, and which can use more memory.
name: CMDB Baseline convert XML to attachment
