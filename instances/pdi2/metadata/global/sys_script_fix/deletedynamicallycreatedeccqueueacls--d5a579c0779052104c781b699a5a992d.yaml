description: In the old ecc_queue table definition, the ecc_queue.* read/write ACLs were generated dynamically with randomly assigned sys_ids. Because of this, maintaining these ACLs is not feasible. This FixScript deletes the dynamically generated ACLs, and during the upgrade, they are replaced with fixed ACLs.
name: DeleteDynamicallyCreatedEccQueueACLs
