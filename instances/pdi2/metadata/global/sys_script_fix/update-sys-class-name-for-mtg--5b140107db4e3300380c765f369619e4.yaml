description: |-
  A sys_class_name column has been added to the mtg_meeting, mtg_attendee, mtg_agenda_item, mtg_runtime_state tables. The cab_meeting, cab_attendee, cab_agenda_item, cab_runtime_state tables extend them and will inherit sys_class_name field. 

  If any children of mtg tables have active sys_class_name column, this fix script sets active to false for the columns. 
  Also it updates sys_class_name field value if any existing records from the mtg tables or extending tables do not have sys_class_name value.
name: Update sys_class_name for mtg
