description: As a part of sandiego release, in highlighted value condition table (sys_highlighted_value_condition), color and variant fields were newly added, and their default values are positive and tertiary respectively. In zbooted instances, for all the OOB records, both the values were empty, which is working as expected but coming to the upgraded instances, default values are applied to the OOB records, and color field is showing as positive (instead of empty) and variant field is showing as tertiary (instead of empty) and causing problem for existing customers using it, because, as per new implementation, going forward status field is deprecated, and if status field exists, color field would take the precedence and hence the color is being applied, instead of status field value.
name: Clear color from highlighted condition
record_for_rollback: 'true'
sys_name: Clear color from highlighted condition
