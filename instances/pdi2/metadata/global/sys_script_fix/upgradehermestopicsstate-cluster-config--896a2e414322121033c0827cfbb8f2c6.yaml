description: |-
  This fix script populates the bootstrap_hash field in the hermes_cluster_config table by computing a hash value from the bootstrap_servers field. The hash is generated using the sn_hermes.HermesUtil().getClusterBootstrapHash() utility function. This ensures that each cluster record has a unique and consistent hash value based on its bootstrap servers.
  +
  This fix script updates the cluster_bootstrap_hash field in the hermes_topics_state table by referencing the corresponding bootstrap_hash field from the hermes_cluster_config table. The script uses the data_center and service_id fields to locate the appropriate cluster configuration. After successfully migrating the data, the data_center column is removed from the hermes_topics_state table as it is no longer required.
name: UpgradeHermesTopicsState&Cluster Config
