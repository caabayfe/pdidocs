description: This fix script updates the dashboard_sys_id column in the dashboard_stats, dashboard_executions, and dashboard_stats_executions tables. The column is changed from a reference to pa_dashboards to document_id to support statistics for both pa_dashboards (classic) and par_dashboard (next experience). This allows the total views of dashboards to be displayed on analytics center pages. The fix script does not exceed 60 seconds in execution time because it only updates 3 rows and does not grow exponentially.
name: Update dashboard sysid with doc id
