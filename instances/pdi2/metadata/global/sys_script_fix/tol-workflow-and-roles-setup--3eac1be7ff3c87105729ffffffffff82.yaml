description: This script sets the value of the 'com.sn_itam.enable_flow_designer.transfer_order_line' system property to control deactivation of the legacy TOL workflow during upgrades or fresh installations. It also sets read_roles only if not already set, and write_roles only if currently 'admin' (the Zurich-era default) — preserving any customer customisations while correcting the Zurich baseline (roles were introduced in Australia's XML).
