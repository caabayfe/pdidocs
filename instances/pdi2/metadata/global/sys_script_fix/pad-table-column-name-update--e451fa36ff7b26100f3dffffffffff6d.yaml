description: |-
  This fix script performs a two-phase update for the ai_agent_execution_mode field in both the sys_pd_activity_definition and sys_pd_derivative tables.

  Phase 1: Updates the dictionary entry (label = Complete independently, type = radio, default = off) and modifies sys_choice records (manual → Off/off, automatic → On/on).

  Phase 2: Sets the ai_agent_execution_mode field value to off for all existing records in both tables except the 4 OOB activities that supprt autocompletion.
