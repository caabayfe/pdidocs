description: |-
  As part of a new security directive in Y, the platform introduced a new Deny Unless decision typed ACL in addition to regular ACLs which now default to Allow If. Allow Ifs grant access to a resource as long as one of them passes. Whereas Deny Unlesses restrict access as soon as one of them fails. Deny Unlesses also run before Allow Ifs. 

  For new customers we have added new complementary Deny Unlesses for our out of box tables. For upgrading customers we have decided to deactivate the new Deny Unlesses so we don't break any features in case a customer has added custom Allow Ifs to our tables.
name: '[PAD] Deactivate deny unless on upgrade'
record_for_rollback: 'true'
