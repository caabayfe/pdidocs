description: The active field added to sys_sg_native_client has a default value of true, but that default doesn't apply retroactively to records that predate the field. Records that go through a fresh plugin activation (rather than an update-set merge) end up with active left NULL rather than explicitly false, since the field is absent from the update.xml payload and never gets set at all. This fix script resets existing records with active either false or NULL/empty back to active=true.
name: Reset active flag on pre-existing native
record_for_rollback: 'false'
sys_name: Set active flag on pre-existing native clients
