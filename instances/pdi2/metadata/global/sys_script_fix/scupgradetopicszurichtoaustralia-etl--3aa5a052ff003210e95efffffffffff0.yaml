description: In Australia, the Stream Connect team introduced a Topic Alias that acts as a wrapper around Hermes Topics. This Topic Alias will now be used in Stream Connect in Consumers, Producers, etc., anywhere that Hermes Topics were referenced. These Topic Aliases are linked to the underlying Hermes Topic through an M2M record. To not interrupt customer operations, this fix script will automatically identify the Streams / Subscriptions where Hermes Topics are actively used, proactively create Topic Aliases, link them to Hermes Topics, and replace those Hermes Topic references with Topic Alias references.
name: SCUpgradeTopicsZurichToAustralia (ETL)
