description: Repoint the default (cmdb_ci) retirement definition at install status and operational status on a fresh instance only. The shipped definition keys off life_cycle_stage, which is only populated once CSDM life cycle migration is activated - on an instance without it, nothing is ever recognised as retired. Restricted to zboot so an existing instance's cmdb_ci definition is never altered by this script; the CSDM life cycle migration check and the Data Manager policy check are deferred to app-cmdb-ws, which owns the full conditional logic for existing instances.
name: Repoint Default Retirement Def
