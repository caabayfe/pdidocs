template: |-
  short_description=Change VLAN on a Cisco switchport^description=Change the port of a Cisco switch to a new VLAN. This would commonly occur when moving a server from one IP network to another.^implementation_plan=--Logon to the switch using SSH
  --Type the following commands

  switch# configure terminal
  switch(config)# interface {type slot/port | port-channel number}
  switch(config-if)# switchport access vlan vlan-id

  For example

  switch# configure terminal
  switch(config)# interface Gi1/1
  switch(config-if)# switchport access vlan 101

  --Save the switch config file^backout_plan=Check the previous version of the switchport config in the configuration management database and revert^test_plan=Run the "show vlan 101" command to view the new configuration (changing 101 for the correct VLAN number)^EQ
