template: |-
  short_description=Add network switch to cabinet^description=This standard change template describes adding a new network switch to a datacenter cabinet^implementation_plan=-- Physically rack switch in top of cabinet
  -- Ensure that redundant power supply is connected to the backup power circuit in the cabinet
  -- Ensure that first GBIC fibre connector (Gi0/1) connects to primary distribution switch
  -- Ensure that second GBIC fibre connector (Gi1/1) connects to secondary distribution switch
  -- Connect console port to cabinet management console
  -- Add switch to network management console
  -- Add switch to network monitoring console
  -- Add switch to ServiceNow CMDB
  ^backout_plan=-- Physically remove switch and all associated cabling
  -- Remove switch from management, monitoring and ServiceNow CMDB^test_plan=-- Run connectivity tests by connecting laptop to copper interface
  -- Ensure that switch is showing as healthy in network monitoring console^EQ
