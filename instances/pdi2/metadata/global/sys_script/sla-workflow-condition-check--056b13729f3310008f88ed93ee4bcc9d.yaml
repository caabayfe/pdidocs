description: |-
  Ensure that an SLA workflow (a Workflow for the task_sla table, referenced in an SLA definition) does not contain a condition, by rejecting setting a condition from the Workflow IDE properties page if it is referenced in an SLA definition (the contract_sla table)

  A workflow for the task_sla table can still set a condition, if it isn't referenced in an SLA definition.
