description: |-
  Warns the user of stop word changes that require the index to be rebuilt.  The warning is issued:
  - If record is deleted that had a stop mode "neither index nor query".
  - If record's stop mode is updated to something else and was "neither index nor query".
  - If record's word is updated to something else and stop mode is  "neither index nor query".
