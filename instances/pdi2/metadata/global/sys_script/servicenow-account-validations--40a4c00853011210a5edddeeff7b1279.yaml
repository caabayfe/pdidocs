description: |-
  Validates the 'from' address of ServiceNow email accounts ONLY. ServiceNow email account domains are identified using System property 'glide.email_accounts.servicenow_domains' and leverages the below logic to validate it:

  1) Relax the validation when the user provides a non-ServiceNow email account from address. 
  2) Make sure the instance name is the first part of the 'from' address when the from address has Servicenow-owned domain.
