<p>Sets quantity value on the current catalog item.</p>
<h4>Additional Considerations</h4>
<p>In order to use this step you must have already opened a catalog item page using the “Open a Catalog Item” step. This step cannot be used after “Order Catalog Item” step.<br /><span style="color: #ff6600;">This step can not be used with Record Producers.</span></p>
