<p class="p1"><span class="s1">Opens a new form for the selected table and Form UI.</span></p>
<h4>Additional Considerations</h4>
<p class="p1"><span class="s1">Use the <code>Form UI</code> field to specify testing in the standard platform UI or workspace UI.</span></p>
<p class="p1"><span class="s1">Optionally, you can specify the form’s view <code>name</code>. Keep in mind that this can only be done for users that have access to that view.</span></p>
