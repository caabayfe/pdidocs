<p class="p1"><span class="s1">Validates whether a UI Action is visible on the current form.</span></p>
<p class="p1"><span class="s1">You can assert that any number of UI Actions are either visible or not visible.</span></p>
<h4>Additional Considerations</h4>
<p class="p1"><span class="s1">The default visible UI Actions can vary depending on the currently impersonated user. </span></p>
