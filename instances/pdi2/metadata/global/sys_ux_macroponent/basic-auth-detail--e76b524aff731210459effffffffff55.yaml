    "message" : "<p>Basic Authentication is not the most recommended authentication mechanism. ServiceNow supports alternative, more secure methods of authentication. It is recommended upgrading your machine identity to a more secure method.</p>\n<ul>\n<li>Refer to the <a href=\"/api/now/v1/context_doc_url/machine-identity-inbound-integration\" target=\"_blank\" rel=\"noopener\">Inbound Integration</a> documentation. Once you're familiar, explore the new Inbound Integration experience <a href=\"/now/machine-identity-console/inbound-integrations\" target=\"_blank\" rel=\"noopener\">OAuth Configuration link</a>.</li>\n<li>Use the <a href=\"/api/now/v1/context_doc_url/certificate-auth\" target=\"_blank\" rel=\"noopener\">Mutual authentication (MTLS)</a> as an alternate authentication option.</li>\n</ul>\n<p>To learn more about why Basic Authentication is not recommended, read section 4 in the <a href=\"https://orca.security/resources/blog/owasp-non-human-identities-top-10/\" target=\"_blank\" rel=\"noopener\">OWASP Non-Human Identities</a> article.</p>",
