  [ {
    "message" : "<p style=\"text-align: left;\"><span style=\"font-size: 12pt;\">The Machine Identity Console has not been activated, which may be due to one of the following reasons:</span></p>\n<ol>\n<li style=\"text-align: left; font-weight: bold; font-size: 12pt;\"><span style=\"font-size: 12pt;\"><strong>An admin manually deactivated the Machine Identity Console property.</strong></span></li>\n<li style=\"text-align: left; font-weight: bold; font-size: 12pt;\"><span style=\"font-size: 12pt;\">The property was automatically deactivated because your instance exceeded 30M threshold count of Unique API Request in last 30 days.</span></li>\n</ol>\n<p style=\"text-align: left;\"><span style=\"font-size: 12pt;\">In either case, <a href=\"https://support.servicenow.com/kb_knowledge.do?sys_id=8f61e58793ac2694c2513f986cba107c&amp;sysparm_view=&amp;sysparm_domain=null&amp;sysparm_domain_scope=null\" target=\"_blank\" rel=\"noopener\">Click here</a> to read this knowledge base article for the next steps.</span></p>",
