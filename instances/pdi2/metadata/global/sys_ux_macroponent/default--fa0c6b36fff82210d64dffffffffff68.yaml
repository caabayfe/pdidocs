required_translations: |-
  [ {
    "message" : "<p data-end=\"233\" data-start=\"206\">MFA protects against:</p>\n<ul>\n<li data-end=\"233\" data-start=\"206\"><strong>Phishing</strong>: Prevents attackers from accessing accounts even if credentials are stolen.</li>\n<li data-end=\"233\" data-start=\"206\"><strong>Credential Stuffing</strong>: Blocks automated login attempts using leaked username-password pairs.</li>\n<li data-end=\"233\" data-start=\"206\"><strong>Man-in-the-Middle (MitM) Attacks</strong>: Adds a second layer of verification that can't be intercepted.</li>\n<li data-end=\"233\" data-start=\"206\"><strong>Brute Force Attacks</strong>: Makes password-guessing techniques ineffective without the second factor.</li>\n</ul>",
    "comment" : ""
  }, {
    "message" : "<p data-end=\"254\" data-start=\"187\">Passwords are often the weakest link in security. Users commonly:</p>\n<ol>\n<li data-end=\"254\" data-start=\"187\">Reuse passwords across multiple accounts</li>\n<li data-end=\"254\" data-start=\"187\">Choose weak or easily guessable passwords</li>\n<li data-end=\"254\" data-start=\"187\">Fall victim to phishing attacks and credential stuffing</li>\n</ol>\n<p data-end=\"547\" data-start=\"407\">Even strong, complex passwords can be compromised through data breaches or malware, making password-only authentication highly vulnerable.</p>",
    "comment" : ""
  }, {
    "message" : "<p data-end=\"411\" data-start=\"221\">Many industry regulations and compliance frameworks require the implementation of Multi-Factor Authentication (MFA) to protect sensitive data and ensure secure access control. These include:</p>\n<ul>\n<li data-end=\"411\" data-start=\"221\">GDPR (General Data Protection Regulation)</li>\n<li data-end=\"411\" data-start=\"221\">NIST 800-63B (National Institute of Standards and Technology &ndash; Digital Identity Guidelines)</li>\n<li data-end=\"411\" data-start=\"221\">PCI-DSS (Payment Card Industry Data Security Standard)</li>\n<li data-end=\"411\" data-start=\"221\">SOX (Sarbanes-Oxley Act &ndash; Financial Data Protection)</li>\n</ul>\n<p data-end=\"820\" data-start=\"686\">Implementing MFA not only strengthens security but also helps organizations meet regulatory obligations and avoid potential penalties.</p>",
    "comment" : ""
  }, {
    "message" : "<p data-end=\"431\" data-start=\"219\">By enforcing MFA, organizations strengthen their defense against cyber threats, support regulatory compliance, and protect sensitive data &mdash; all while delivering a secure and user-friendly authentication experience.</p>\n<p data-end=\"514\" data-start=\"433\">MFA should not be optional. It should be the default standard for strong security.</p>",
    "comment" : ""
  }, {
    "message" : "<p>Multi-Factor Authentication (MFA) is one of the most effective defenses against unauthorized access. By requiring a second step of verification, MFA significantly reduces the risk of account takeovers.</p>\n<p>Even if an attacker obtains a user's password through phishing, credential stuffing, or a data breach, they cannot access the account without the additional authentication factor. This makes MFA a critical security control for protecting sensitive systems and data.</p>",
    "comment" : ""
  }, {
    "message" : "<p>Multi-Factor Authentication (MFA) is one of the most effective security measures for protecting user accounts against unauthorized access. By requiring at least two distinct forms of authentication, MFA significantly lowers the risk of account compromise, data breaches, and identity theft.</p>",
    "comment" : ""
  }, {
    "message" : "Defending Against Common Threats",
    "comment" : ""
  }, {
    "message" : "Enforcing MFA ensures compliance and reduces the risk of data breaches.",
    "comment" : ""
  }, {
    "message" : "MFA Blocks 99.9% of Attacks on Compromised Accounts",
    "comment" : ""
  }, {
    "message" : "Passwords Alone Are Not Enough",
    "comment" : ""
  }, {
    "message" : "Regulatory & Compliance Requirements",
