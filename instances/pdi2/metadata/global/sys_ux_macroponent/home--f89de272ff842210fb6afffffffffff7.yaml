    "message" : "<p style=\"margin: 0px; padding: 0px; text-justify: inter-word;\">Auto-assignment adds users to the Conditional Script Writer group if they are internal users and have a functional role. It is recommended to de-activate auto-assignment.</p>",
    "code" : "",
    "comment" : ""
  }, {
