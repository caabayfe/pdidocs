    "message" : "Add the VA chat widget to any portal. This is important when using VA to send IAR notifications to users.",
    "comment" : ""
  }, {
    "message" : "All issues are assigned to the bot user while IAR processes it. If you're tracking the SLA of a case based on the assignee, assigning the case to a bot user might impact your SLA. Review and update your SLA definitions based on your requirements before  turning on IAR for any issue.",
    "comment" : ""
  }, {
    "message" : "Any issue created is processed through IAR when an active IAR Configuration exists for the issue type, and it qualifies the specified entry conditions. IAR attempts to identify the requester's intent using Now Intelligence with the case description. We deliver any available matching Virtual Agent conversation to the issue requester in case of an intent match. In addition, IAR provides relevant AI Search results when Virtual Agent topics are not found.",
