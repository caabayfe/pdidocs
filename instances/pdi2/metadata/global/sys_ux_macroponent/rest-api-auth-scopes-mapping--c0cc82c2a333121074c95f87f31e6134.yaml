required_translations: |-
  [ {
    "message" : "<p style=\"margin: 0in; line-height: 95%; font-size: 12pt; font-family: Aptos, sans-serif;\"><span style=\"font-size: 9.0pt; line-height: 95%; font-family: Verdana, sans-serif; color: RGB(var(--now-label-value-inline_label--color, var(--now-display-type--body-inline_label--color, var(--now-display-type--body-inline--color, var(--now-display-type--body_label--color, var(--now-display-type_label--color, var(--now-color_text--tertiary, var(--now-color--neutral-12))))))));\">The Auth scope determines the level of access a client has to various APIs, select an Auth scope carefully to avoid unnecessary access to sensitive data.</span></p>\n<p style=\"margin: 0in; line-height: 95%; font-size: 12pt; font-family: Aptos, sans-serif;\"><span style=\"font-size: 9.0pt; line-height: 95%; font-family: Verdana, sans-serif; color: RGB(var(--now-label-value-inline_label--color, var(--now-display-type--body-inline_label--color, var(--now-display-type--body-inline--color, var(--now-display-type--body_label--color, var(--now-display-type_label--color, var(--now-color_text--tertiary, var(--now-color--neutral-12))))))));\">Key considerations:</span></p>\n<ul style=\"margin-top: 0in; margin-bottom: 0in;\">\n<li style=\"margin: 0in 0in 0in 0px; line-height: 95%; font-size: 12pt; font-family: Aptos, sans-serif;\"><span style=\"font-size: 9.0pt; line-height: 95%; font-family: Verdana, sans-serif; color: RGB(var(--now-label-value-inline_label--color, var(--now-display-type--body-inline_label--color, var(--now-display-type--body-inline--color, var(--now-display-type--body_label--color, var(--now-display-type_label--color, var(--now-color_text--tertiary, var(--now-color--neutral-12))))))));\">The <strong>useraccount</strong> scope grants access to all resources available to the signed-in user. Use this scope with caution - it is not recommended for most integrations and may introduce security risks.</span></li>\n<li style=\"margin: 0in 0in 0in 0px; line-height: 95%; font-size: 12pt; font-family: Aptos, sans-serif;\"><span style=\"font-size: 9.0pt; line-height: 95%; font-family: Verdana, sans-serif; color: RGB(var(--now-label-value-inline_label--color, var(--now-display-type--body-inline_label--color, var(--now-display-type--body-inline--color, var(--now-display-type--body_label--color, var(--now-display-type_label--color, var(--now-color_text--tertiary, var(--now-color--neutral-12))))))));\">Note that editing the value in 'Limit authorization to the following APIs' field affects all clients that share this scope.</span></li>\n</ul>",
