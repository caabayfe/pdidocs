name: Log Protection Information & Agreement
output_prop_mapping: ''
required_sys_props: ''
required_translations: |-
  [ {
    "message" : "<div>\n<p lang=\"EN-US\" xml:lang=\"EN-US\"><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\"><span lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\">This plugin allows you to enforce protection rules around whether records can be updated, deleted, or inserted for the following system log tables:</span>&nbsp;</span></p>\n</div>\n<div>\n<ul>\n<li><span lang=\"EN-US\" style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" xml:lang=\"EN-US\" data-contrast=\"auto\">syslog</span></li>\n<li><span lang=\"EN-US\" style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" xml:lang=\"EN-US\" data-contrast=\"auto\">syslog_app_scope</span></li>\n<li><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\">syslog_transaction</span></li>\n<li><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\">sys_outbound_http_log</span></li>\n<li><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\">sysevent</span></li>\n<li><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\">sys_audit</span></li>\n<li><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\">sys_push_notification&nbsp;</span></li>\n</ul>\n</div>\n<div>\n<p lang=\"EN-US\" xml:lang=\"EN-US\"><span lang=\"EN-US\" style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" xml:lang=\"EN-US\" data-contrast=\"auto\">For each system log table you can specify one of 4 protection levels:</span></p>\n<ol>\n<li><span lang=\"EN-US\" style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" xml:lang=\"EN-US\" data-contrast=\"auto\">Block changes (Only block the attempt)</span></li>\n<li><span lang=\"EN-US\" style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" xml:lang=\"EN-US\" data-contrast=\"auto\">Log changes (Only log the attempt)</span></li>\n<li><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\">Block and log changes (Block and log the attempt)</span></li>\n<li><span style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\">Allow changes (Don&rsquo;t block and don&rsquo;t log the attempt)</span></li>\n</ol>\n</div>\n<div>\n<p lang=\"EN-US\" xml:lang=\"EN-US\"><span lang=\"EN-US\" style=\"font-size: 12pt; font-family: arial, helvetica, sans-serif;\" xml:lang=\"EN-US\" data-contrast=\"auto\">According to the policies, any record-modifying operations from the user interface or via script will be intercepted by the platform and be blocked and/or logged.</span></p>\n</div>",
    "comment" : ""
  }, {
    "message" : "<div>\n<p><span lang=\"EN-US\" style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\" xml:lang=\"EN-US\" data-contrast=\"auto\">For each of the protected log tables, you can assign a combination of &ldquo;Block&rdquo;, &ldquo;Log&rdquo;, or &ldquo;Do nothing&rdquo; for update and delete operations.</span></p>\n<p><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\">The valid options are:</span></p>\n</div>\n<div>\n<ul>\n<li><span lang=\"EN-US\" style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\" xml:lang=\"EN-US\" data-contrast=\"auto\">Block and log the attempt</span></li>\n<li><span lang=\"EN-US\" style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\" xml:lang=\"EN-US\" data-contrast=\"auto\">Only block the attempt</span></li>\n<li><span lang=\"EN-US\" style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\" xml:lang=\"EN-US\" data-contrast=\"auto\">Only log the attempt</span></li>\n<li><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\">Don&rsquo;t block and don&rsquo;t log the attempt</span></li>\n</ul>\n</div>\n<div>\n<p><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\">When blocking is configured for an update/delete/insert operation, all UI actions allowing that operation will be removed, and any attempts to perform the operation on the table via script will not succeed.</span></p>\n</div>\n<div>\n<p><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\">When logging is configured, any attempt via UI action or script to update/delete/insert records in the table will not be restricted, however, the change will be logged in <em>protected_table_log</em>.</span></p>\n</div>\n<div>\n<p><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\">When &ldquo;Don&rsquo;t block and don&rsquo;t log the attempt&rdquo; is configured, the plugin will not track or restrict modifications to the data in that table.</span></p>\n</div>",
    "comment" : ""
  }, {
    "message" : "<div>\n<p><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><span lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\">The platform will use the Log Protection levels assigned to update, delete, and insert operations of system log tables to block and/or log any attempted operation. Any operations from the user interface or via script will be intercepted by the platform and be blocked and/or logged.</span>&nbsp;</span></p>\n</div>\n<div>\n<p><span lang=\"EN-US\" style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\" xml:lang=\"EN-US\" data-contrast=\"auto\">An admin with the <em>security_admin</em> role elevation can override the default log protection levels for each of the tables</span><span style=\"font-family: arial, helvetica, sans-serif; font-size: 16px;\">&nbsp;</span><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\">to adjust the behavior based on customizations made to your platform. However, there are some tables whose protection levels cannot be changed: syslog and syslog_app_scope have fixed values for update and delete protections, and protected_table_configuration has fixed protection values for all three operations. Additionally, insert protections for sysevent cannot be set to block changes.</span></p>\n</div>",
    "comment" : ""
  }, {
    "message" : "<p><span style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\"><span lang=\"EN-US\" xml:lang=\"EN-US\" data-contrast=\"auto\">Attempts to modify the system log tables are logged to the <em>protected_table_log</em> table.&nbsp; Entries written to this table are driven by the configuration.&nbsp; If a protection level of &ldquo;Log&rdquo; is not specified for a table, then any attempt to modify the given table will not be logged to <em>protected_table_log</em>.</span></span></p>\n<p><span lang=\"EN-US\" style=\"font-family: arial, helvetica, sans-serif; font-size: 12pt;\" xml:lang=\"EN-US\" data-contrast=\"auto\">Also, any configuration changes made for this plugin will also be logged to <em>protected_table_log</em>. </span></p>",
    "comment" : ""
  }, {
    "message" : "Admin Panel",
    "comment" : ""
  }, {
