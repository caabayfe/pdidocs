  }, {
    "message" : "<p style=\"text-align: left;\"><span style=\"font-size: 16px;\">The small, medium and large lists are loaded sequentially and their contents do not overlap.&nbsp; For example, loading the large list will also load the small and medium lists if they have not been loaded previously.</span></p>",
    "comment" : ""
  }, {
    "message" : "<p><span style=\"font-size: 12pt;\">You can also add your own items to the exclusion lists.&nbsp; The full exclusion list includes a combination of your own entries and any ServiceNow provided exclusion lists that are installed.</span></p>\n<p><span style=\"font-size: 12pt;\">When adding custom list items including localizations, some suggestions are:</span></p>\n<ul>\n<li><span style=\"font-size: 12pt;\">Add any relevant brand or product names</span></li>\n<li><span style=\"font-size: 12pt;\">Add common locations, such as company headquarters</span></li>\n<li><span style=\"font-size: 12pt;\">Add company-specific internal terms or abbreviations</span></li>\n</ul>",
    "comment" : ""
  }, {
