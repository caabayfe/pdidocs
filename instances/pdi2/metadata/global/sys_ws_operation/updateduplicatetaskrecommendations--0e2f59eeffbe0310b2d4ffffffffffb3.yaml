    "main_ci": "5041517993324b1082bab0fdfaba1098",
    "main_ci_justification": "Selected 5041517993324b1082bab0fdfaba1098 as the main CI because the key metric leaders are tied for oldest sys_created_on (2026-08-19 22:29:20), highest related items count (2), and highest relationships count (0), while d041517993324b1082bab0fdfaba1099 is the only record with the most recent sys_updated_on (2026-08-19 22:31:15). Even so, 5041517993324b1082bab0fdfaba1098 has the more complete and higher-quality attribute set, including discovery_source, first_discovered, and last_discovered, as well as a newer os_version and higher cpu_count, making it the better anchor record for consolidation.",
