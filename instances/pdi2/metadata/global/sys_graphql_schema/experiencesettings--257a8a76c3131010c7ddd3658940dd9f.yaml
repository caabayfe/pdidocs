name: ExperienceSettings
namespace: settings
paths: Button:group,Button:icon,Button:label,Button:order,Button:route,Button:sysId,Button:viewportRoute,General:description,General:path,General:title,Mutation:generalUpdate,Mutation:navigationUpdate,Mutation:searchUpdate,Mutation:themeUpdate,Mutation:toolbarUpdate,Mutation:utilitiesUpdate,Navigation:footerBottom,Navigation:footerSysId,Navigation:footerTop,Navigation:headerSysId,Navigation:menu,Navigation:menuSysId,Query:navigation,Query:search,Query:settings,Query:theme,Query:toolbar,Query:utilities,Route:id,Route:label,Search:searchPrivate,Search:searchPublic,Search:sysId,SearchSource:id,SearchSource:label,Settings:applicationType,Settings:panelSysId,Theme:id,Theme:label,Theme:order,ThemeResponse:panelSysId,ThemeResponse:primaryThemeId,ThemeResponse:themes,Toolbar:buttons,Toolbar:routes,Toolbar:sysId,Utilities:globalSearch,Utilities:headerSysId,Utilities:notifications,Utilities:searchSources,Utilities:searchSysId,Utilities:selectedSearchSource
requires_acl_authorization: 'false'
requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
      query: Query
  	mutation: Mutation
  }

  type Query {
     theme(sysId: ID!): ThemeResponse
     toolbar(sysId: ID!): Toolbar
     utilities(sysId: ID!): Utilities
     navigation(sysId: ID!): Navigation
     search(sysId: ID!): Search
     settings(sysId: ID!): Settings
  }

  type Mutation {
      themeUpdate(sysId: ID!, primaryThemeId: ID!): ThemeResponse
  	generalUpdate(sysId: ID!, title: String!, description: String, path: String!): General
  	navigationUpdate(sysId: ID!, menu: Boolean!, footerTop: Boolean!, footerBottom: Boolean!): Navigation
  	toolbarUpdate(sysId: ID, buttons: [ButtonInput]): Toolbar
  	utilitiesUpdate(sysId: ID!, notifications: Boolean!, globalSearch: Boolean!, selectedSearchSource: ID!): Utilities
  	searchUpdate(sysId: ID!, searchPublic: Boolean!, searchPrivate: Boolean!): Search
  }


  input ButtonInput {
  	sysId: ID!
  	order: Int!
  	icon: String!
  	label: String!
  	route: String
  	viewportRoute: String
  	group: String!
  	deleted: Boolean
  	new: Boolean
  }


  type Button {
  	sysId: ID!
  	order: Int
  	icon: String
  	label: String
  	route: String
  	viewportRoute: String
  	group: String
  }

  type General {
  	title: String!
  	description: String
  	path: String!
  }

  type Navigation {
  	headerSysId: ID!
  	menu: Boolean!
  	footerTop: Boolean!
  	footerBottom: Boolean!
  	menuSysId: ID!
  	footerSysId: ID!
  }

  type Route {
  	id: String
  	label: String
  }

  type Toolbar {
  	sysId: ID!
  	routes: [Route]
  	buttons: [Button]
  }

  type Theme {
  	id: ID!
  	label: String!
  	order: Int
  }

  type ThemeResponse {
  	panelSysId: ID!
  	primaryThemeId: ID
  	themes: [Theme]
  }

  type Utilities {
  	headerSysId: ID!
  	searchSysId: ID!
  	notifications: Boolean!
  	globalSearch: Boolean!
  	selectedSearchSource: String
  	searchSources: [SearchSource]
  }

  type SearchSource {
  	id: ID!
  	label: String!
  }

  type Search {
  	sysId: ID!
  	searchPublic: Boolean!
  	searchPrivate: Boolean!
  }

  type Settings {
  	panelSysId: ID!
  	applicationType: String!
  }
sys_name: ExperienceSettings
sys_policy: ''
type_names: ''
