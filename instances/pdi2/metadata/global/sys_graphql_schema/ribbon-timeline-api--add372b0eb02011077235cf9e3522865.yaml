name: Ribbon Timeline API
namespace: resolutionShaperTimeline
paths: AuditEntry:fieldLabel,AuditEntry:fieldName,AuditEntry:newValue,AuditEntry:oldValue,Caller:id,Entry:auditEntries,Entry:initials,Entry:journalEntry,Entry:presenceUserId,Entry:sysCreatedBy,Entry:sysCreatedOn,Entry:sysCreatedOnAdjusted,Entry:type,Fulfiller:id,JournalEntry:fieldLabel,JournalEntry:fieldName,JournalEntry:newValue,JournalEntry:sysId,Query:timeLineData,RSConfig:callerLabel,RSConfig:closedState,RSConfig:fulfillerLabel,RSConfig:newState,RSConfig:requestLabel,RSConfig:requestorStates,RSConfig:table,TimelineData:caller,TimelineData:entries,TimelineData:fulfillers,TimelineData:resolutionShaperConfig
requires_acl_authorization: 'true'
requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
  	query: Query
  }

  type Query {
  	timeLineData(timelineinput: TimelineInput) : TimelineData
  }

  input TimelineInput {
  	table: String!
  	sysId: String!
  	fulfillerRole: String
  	callerField: String
  }

  type TimelineData {
  	resolutionShaperConfig: RSConfig
  	entries: [Entry]
  	fulfillers: [Fulfiller]
  	caller: Caller
  }

  type RSConfig {
  	table:String
  	requestorStates:String
  	newState:String
  	closedState:String
  	fulfillerLabel:String
  	callerLabel:String
  	requestLabel:String
  }

  type Entry {
  	sysCreatedOn:String
  	sysCreatedOnAdjusted:String
  	sysCreatedBy:String
  	presenceUserId:String
  	type:String
  	initials:String
  	auditEntries:[AuditEntry]
  	journalEntry:JournalEntry
  }

  type AuditEntry {
  	fieldName:String
  	fieldLabel:String
  	oldValue:String
  	newValue:String
  }

  type JournalEntry {
  	fieldName:String
  	fieldLabel:String
  	sysId:String
  	newValue:String
  }

  type Fulfiller {
  	id:String
  }

  type Caller {
  	id:String
  }
sys_name: Ribbon Timeline API
sys_policy: ''
type_names: ''
