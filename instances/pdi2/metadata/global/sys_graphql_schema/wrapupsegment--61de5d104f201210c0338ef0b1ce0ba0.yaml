name: WrapUpSegment
namespace: wrapUpSegment
paths: Mutation:createSegment,Mutation:updateSegment,Mutation:updateSegmentAiDetails,Query:segmentByAgentAndInteraction,Query:segmentById,Segment:agent,Segment:ai_notes,Segment:ai_notes_defined_at,Segment:ai_wrap_up_code,Segment:ai_wrap_up_code_defined_at,Segment:awaiting_confirmation,Segment:confirmed_on,Segment:external,Segment:external_segment_id,Segment:interaction,Segment:notes,Segment:opened_on,Segment:refreshed_on,Segment:segment_id,Segment:segment_table,Segment:segmented,Segment:state,Segment:submitted_on,Segment:sys_id,Segment:timed_out,Segment:wrap_up_code,Segment:wrap_up_configuration,SegmentResult:message,SegmentResult:segment,SegmentResult:sessionMessages,SegmentResult:success,SessionMessage:text,SessionMessage:type,WrapUpCode:active,WrapUpCode:code,WrapUpCode:description,WrapUpCode:external,WrapUpCode:sys_id,WrapUpCode:translated_code,WrapUpCode:translated_description,WrapUpConfiguration:allowed_codes,WrapUpConfiguration:conditions,WrapUpConfiguration:default_code,WrapUpConfiguration:duration,WrapUpConfiguration:enable_ai_code,WrapUpConfiguration:enable_ai_notes,WrapUpConfiguration:enable_codes,WrapUpConfiguration:enforce_duration,WrapUpConfiguration:external,WrapUpConfiguration:name,WrapUpConfiguration:show_timer,WrapUpConfiguration:sys_id,WrapUpConfiguration:use_ai_code_as_default,WrapUpConfiguration:use_third_party_ai
requires_acl_authorization: 'true'
requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
  	query : Query
  	mutation : Mutation
  }

  type Query {
  	segmentById(
  		segment_id : String!
  	) : SegmentResult

  	segmentByAgentAndInteraction(
  		agent_id : String! 
  		interaction_id : String! 
  	) : SegmentResult
  }

  type Mutation {
  	createSegment(
  		agent_sys_id : String!
  		interaction_sys_id : String!
  		opened_on : String
  		wrap_up_configuration_sys_id : String
  		external : Boolean!
  		segmented : Boolean!
  		external_segment_id : String
  		configuration : Configuration,
  		ai_wrap_up_code : String,
  		ai_notes : String
  	) : SegmentResult

  	updateSegment(
  		segment_sys_id : String
  		agent_sys_id : String
  		interaction_sys_id : String
  		external_segment_id : String
  		wrap_up_code : String
  		notes : String
  		confirmed_on : String
  		include_session_messages_on_success : Boolean
  		configuration : Configuration
  	) : SegmentResult
  	
  	updateSegmentAiDetails(
  		segment_sys_id : String
  		agent_sys_id : String
  		interaction_sys_id : String
  		external_segment_id : String
  		ai_wrap_up_code : String
  		ai_notes : String
  		is_external_request : Boolean
  	) : SegmentResult
  }
  # params in snake_case for configuration to be in sync with rest api
  input Configuration {
  	allowed_codes : [AllowedCodes]
  	default_code  : String
  	duration : String
  	show_timer : Boolean 
  	enable_ai_code : Boolean
  	enable_ai_notes : Boolean
  	use_third_party_ai : Boolean
  	use_ai_code_as_default : Boolean
  }

  input AllowedCodes {
  	code : String
  	translation : [Translation]
  	description : String
  }

  input Translation {
  	language : String
  	code : String
  	description : String
  }

  type WrapUpCode {
  	code : String
  	description : String
  	active : Boolean
  	external: Boolean
  	sys_id : String
  	translated_code : String
  	translated_description : String
  }

  type WrapUpConfiguration {
  	name : String
  	sys_id : String
  	enforce_duration : Boolean
  	duration : String
  	show_timer : Boolean
  	conditions : String
  	enable_codes : Boolean
  	allowed_codes : [WrapUpCode]
  	default_code : WrapUpCode
  	external : Boolean
  	enable_ai_code : Boolean
  	enable_ai_notes : Boolean
  	use_third_party_ai : Boolean
  	use_ai_code_as_default : Boolean
  }

  type Segment {
  	sys_id : String
  	agent : String
  	interaction : String
  	opened_on : String
  	refreshed_on : String
  	wrap_up_configuration : WrapUpConfiguration

  	external : Boolean
  	segmented : Boolean
  	external_segment_id : String
  	segment_table : String
  	segment_id : String

  	state : String
  	wrap_up_code : WrapUpCode
  	notes : String	

  	submitted_on : String
  	awaiting_confirmation : Boolean
  	confirmed_on : String
  	timed_out : Boolean
  	
  	ai_wrap_up_code : WrapUpCode
  	ai_notes : String
  	ai_wrap_up_code_defined_at : String	
  	ai_notes_defined_at : String
  }

  type SessionMessage {
  	text : String
  	type : String
  }

  type SegmentResult {
  	message : String
  	success : Boolean
  	segment : Segment
  	sessionMessages : [SessionMessage]
  }
sys_name: WrapUpSegment
sys_policy: ''
type_names: ''
