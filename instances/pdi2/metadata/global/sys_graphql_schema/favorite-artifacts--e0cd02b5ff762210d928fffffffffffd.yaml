name: Favorite Artifacts
namespace: favoriteArtifacts
paths: DeleteFavoriteSuccess:message,DeleteFavoriteSuccess:success,Error:errorType,Error:header,Error:message,FavoritesData:category,FavoritesData:description,FavoritesData:id,FavoritesData:name,FavoritesData:scope,FavoritesData:scopeName,FavoritesData:state,FavoritesData:type,FavoritesResult:data,FavoritesResult:resultsExceedLimit,Mutation:createFavorite,Mutation:deleteFavorite,Query:getFavorites
requires_acl_authorization: 'false'
requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  ### QUERY
  type Query {
  	getFavorites(
  		category: String
  		type: String
  		scope: String
  		offset: Int
  		limit: Int
  	): FavoritesResultOrError
  }

  ### MUTATION
  type Mutation {
  	createFavorite(
  		name: String!
  		type: String!
  		scope: String
  		category: String
  		artifactId: String
  		artifactTable: String
  	): FavoritesDataOrError

  	deleteFavorite(artifactId: String!): DeleteFavoriteOrError
  }


  ### OUTPUT TYPES
  type FavoritesResult {
  	data : [FavoritesData]
  	resultsExceedLimit: Boolean!
  }

  type FavoritesData {
  	id: String
  	name: String
  	description: String
  	scope: String
  	scopeName: String
  	category: String
  	state: String
  	type: String
  }

  type DeleteFavoriteSuccess {
  	success: Boolean!
  	message: String
  }

  type Error {
  	errorType: ErrorFlavor!
  	message: String
  	header: String
  }

  ### UNION TYPES
  union FavoritesDataOrError = FavoritesData | Error
  union FavoritesResultOrError = FavoritesResult | Error
  union DeleteFavoriteOrError = DeleteFavoriteSuccess | Error

  ### ENUMS
  enum ErrorFlavor {
  	QUERY_FAILED
  	MUTATION_FAILED
  	UNAUTHORIZED
  	NOT_FOUND
  	VALIDATION_FAILED
  	UNKNOWN
  }
sys_name: Favorite Artifacts
