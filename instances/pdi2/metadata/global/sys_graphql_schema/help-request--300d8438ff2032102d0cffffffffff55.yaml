name: Help Request
namespace: helpRequest
paths: HelpCreationOrUpdationResponse:message,HelpCreationOrUpdationResponse:requestId,HelpCreationOrUpdationResponse:requestNumber,HelpCreationOrUpdationResponse:success,HelpRequestAdditionalData:assignedTo,HelpRequestAdditionalData:helpRequestedOnInteraction,HelpRequestEligibility:additionalData,HelpRequestEligibility:canCancelHelp,HelpRequestEligibility:canRequestHelp,HelpRequestEligibility:helpRequestedId,Mutation:createHelpRequest,Mutation:createOrUpdateSupervisorHelpAction,Mutation:updateHelpRequest,Query:helpRequestEligibility,Query:reasonCodesForInteraction,ReasonCode:code,ReasonCode:description,ReasonCode:id,SupervisorHelpActionCreateOrUpdateResponse:action_sys_id,SupervisorHelpActionCreateOrUpdateResponse:message,SupervisorHelpActionCreateOrUpdateResponse:success
requires_acl_authorization: 'true'
requires_authentication: 'true'
requires_snc_internal_role: 'true'
schema: |-
  schema {
  	query : Query
  	mutation: Mutation
  }

  type Query {
  	helpRequestEligibility(
  		interaction_id : String!
  	) : HelpRequestEligibility

  	reasonCodesForInteraction(
  		interaction_id : String!
  	) : [ReasonCode]
  }

  type Mutation {
  	createHelpRequest(
  		interaction: String!
  		reason_code: String!
  		description: String
  		additional_metadata: String
  	) : HelpCreationOrUpdationResponse

  	updateHelpRequest(
  		interaction: String!
  		help_request_id: String!
  		state: String
  		additional_metadata: String
  	) : HelpCreationOrUpdationResponse

  	createOrUpdateSupervisorHelpAction(
  		interaction: String!
  		action_sys_id: String
  		action: String
  		help_request: String
  		additional_metadata: String
  	):SupervisorHelpActionCreateOrUpdateResponse

  }

  type HelpRequestEligibility {
  	canRequestHelp : Boolean
  	canCancelHelp : Boolean
  	helpRequestedId : String
  	additionalData : HelpRequestAdditionalData
  }

  type HelpRequestAdditionalData {
  	helpRequestedOnInteraction : Boolean
  	assignedTo : String
  }

  type ReasonCode {
  	id : String
  	code : String
  	description : String
  }

  type HelpCreationOrUpdationResponse {
  	success: Boolean
  	message: String
  	requestId: String
  	requestNumber: String
  }

  type SupervisorHelpActionCreateOrUpdateResponse {
  	action_sys_id: String
  	success: Boolean
  	message: String
  }
