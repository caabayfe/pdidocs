schema: |-
  schema {
      query: Query
  	mutation: Mutation
  }

  type Query {
  	getActivityDefinitions: [ActivityDefinition]
  	getActivityStartRules: [StartRule]
  	getActivityTypes: [ActivityType]
  	getLaneStartRules: [StartRule]
  	getTriggerTypes: [TriggerType]
  	getVarDictionaryHintLimit: String

  }

  type ActivityDefinition {
  	value: String @source(value: "sys_id.value")
  	activity_type: ActivityType @source(value: "activity_type.value")
  	badge: String @source(value: "badge.value")
  	label: String @source(value: "label.value")
  	name: String @source(value: "name.value")
  	input_display_preferences: String @source(value: "input_display_preferences.value")
  	experience_display_preferences: String @source(value: "experience_display_preferences.value")
  	source_id: String @source(value: "source.value")
  	source_type: String @source(value: "source_type.value")
  	flow_subflow_definition: SourceDefinition @source(value: "source.value")
  	action_type_definition: SourceDefinition @source(value: "source.value")
  	additional_functionality: String @source(value: "additional_functionality.value")
  	variable_meta: [ActivityDefinitionMetaData] @source(value: "source.value")
  	enable_ai_agent: String @source(value: "enable_ai_agent.value")
  	ai_agent_field_display_preferences: String @source(value: "ai_agent_field_display_preferences.value")
  }

  type ActivityDefinitionMetaData {
  	elementName: String @source(value: "element.value")
  	dependent_on_field: String @source(value: "dependent_on_field.value")
  }

  type ActivityType {
  	value: String @source(value: "sys_id.value")
  	name: String @source(value: "name.value")
  	icon: String @source(value: "icon.value")
  	color: String @source(value: "color.value")
  	color_category: ColorCategory @source(value: "color_category.value")
  	default_activity_ui: String @source(value: "default_activity_ui.value")
  	default_macroponent: ActivityMacroponentType @source(value: "default_activity_ui.value")
  }

  type ColorCategory {
  	custom_property: String @source(value: "custom_property.value")
  }

  type ActivityMacroponentType {
  	value: String @source(value: "macroponent.value")
  }

  type StartRule {
  	value: String @source(value: "sys_id.value")
  	name: String @source(value: "name.value")
  	displayValue: String @source(value: "label.value")
  }

  type SourceDefinition {
  	name: String @source(value: "name.value")
  	access: String @source(value: "access.value")
  	type: String @source(value: "type.value")
  	sys_id: String @source(value: "sys_id.value")
  }

  type TriggerType {
  	value: String @source(value: "sys_id.value")
  	displayValue: String @source(value: "label.value")
  }

  type Mutation {
  	deleteTimerAttributes(sysId: String!): TimerAttributesResult!
  	mutateTimerAttributes(timerAttributes: TimerAttributesInput): TimerAttributesResult!
  	updateActivityPositions(activities: [ActivityPositionUpdate]): ActivityPositionResult
  	deleteActivity(sysId: String!): String
  	updateProcessProperties(processProperties: ProcessPropertiesInput): ProcessPropertiesResult
  }

  input TimerAttributesInput {
  	sys_id: String
  	process_definition: String
  	laneOrActivity: DocumentIdInput
  	duration_type: String!
  	timer_schedule: String
  	timer_relative_duration_operator: String
  	timer_duration: ElementMappingInput
  	percentage_timer_input_datetime: ElementMappingInput
  	timer_percentage: ElementMappingInput
  	timer_relative_duration_datetime: ElementMappingInput
  }

  input DocumentIdInput {
  	source: String!
  	source_type: String!
  }

  input ElementMappingInput {
  	variableValue: String
  	variableMapping: String
  	variableName: String
  	setMapping: Boolean
  	displayValue: String
  }

  type FieldWithDisplayType {
  	value: String
  	displayValue: String @source(value: "display_value")
  }

  type TimerAttributesResult {
  	sys_id: String @source(value: "sys_id.value")
  	duration_type: String @source(value: "duration_type.value")
  	source: String @source(value: "source.value")
  	source_type: String @source(value: "source_type.value")
  	percentage_timer_input_datetime: FieldWithDisplayType @source(value: "percentage_timer_input_datetime")
  	timer_percentage: FieldWithDisplayType @source(value: "timer_percentage")
  	timer_relative_duration_datetime: FieldWithDisplayType @source(value: "timer_relative_duration_datetime")
  	timer_relative_duration_operator: String @source(value: "timer_relative_duration_operator.value")
  	timer_schedule: FieldWithDisplayType @source(value: "timer_schedule")
  	timer_duration: FieldWithDisplayType @source(value: "timer_duration")
  }

  input ActivityPositionUpdate {
  	sys_id: String!,
  	order: String!,
  	lane: String!
  	start_rule: String,
  	inputs: [ElementMappingInput]
  }

  type GlideVarValue {
  	variableValue: String @source(value: "variableValue")
  	variableMapping: String @source(value: "variableMapping")
  	variableName: String @source(value: "variableName")
  	variableDisplayValue: String @source(value: "variableDisplayValue")
  	displayValue: String @source(value: "displayValue")
  }

  union ActivityPositionResult = ActivityPositionUpdateResultArray | Error

  type ActivityPositionUpdateResultArray {
  	data: [ActivityPositionUpdateResult!]!
  }

  type ActivityPositionUpdateResult {
  	sys_id: String!
  	order: String!
  	lane: String
  	start_rule: String
  	inputs: [GlideVarValue]
  }

  enum ErrorType {
  	"""
  	User does not have permission
  	"""
  	UNAUTHORIZED
  	"""
  	Insert failed for some reason
  	"""
  	INSERT_FAILED
  	"""
  	Update failed for some reason
  	"""
  	UPDATE_FAILED
  	"""
  	Deletion failed for some reason
  	"""
  	DELETION_FAILED
  }

  type Error {
  	errorType: ErrorType!
  	message: String!
  }

  input ProcessPropertiesInput {
  	sysId: String
  	label: String
  	description: String
  	sys_scope: String
  	inputs: [ElementMappingInput]
  	triggerInstanceId: String
  	triggerInputs: [ElementMappingInput]
  }

  union ProcessPropertiesResult = ProcessPropertiesUpdateResult | Error

  type ProcessPropertiesUpdateResult {
  	label: String
  	description: String
  	triggerInputs: [GlideVarValue]
  }
