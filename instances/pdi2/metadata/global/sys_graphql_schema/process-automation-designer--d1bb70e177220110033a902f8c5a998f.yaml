  	additionalFunctionality: DisplayableString @source(value: "additional_functionality")
  	canRead: DisplayableBoolean @source(value: "can_read")
  	variableMeta: [ActivityDefinitionMetaData] @source(value: "variable_meta")
  	inputs: GlideElementGlideVars @source(value: "inputs")
  	typeVals: GlideElementGlideVars @source(value: "type_vals")
