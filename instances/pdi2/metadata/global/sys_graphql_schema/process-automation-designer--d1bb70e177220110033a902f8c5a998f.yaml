schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	getProcess(processDefinitionId: String!, config: IncludeConfig): ProcessDataOrError
  	getUnsupportedFeatures(processDefinitionId: String!, targetProcessTypeId: String): UnsupportedFeaturesOrError

  	###### INTERNAL APIS below #####
  	checkPlaybookSkillsAccess:PlaybookSkillsAccessCheck
  	getActivityAppObjects(processDefinitionId: String!): [ActivityAppObjectOrError],
  	getFormViewsForTableData(processDefinitionId: String!, queryConditions: String!): [FormViewObject],
  	getDynamicInfoObject(isSubflow: Boolean, flowOrActionId: String, inputName: String): DynamicInfo,
  	getPanelOverrides(processTypeId: String): [PanelOverride]
  	hasPlaybookGenerationAccess: Boolean
  	hasPlaybookRecommendationsAccess: Boolean
  	getParentTables(table: String!): [String]!
  	isUpgradeInProgress: Boolean
  	getActivity(activityId: String!, config: IncludeConfig): ActivityOrError
  	getDisplayNames(sysIdsInTables: [SysIdsInTable!]!): [DisplayNamesInTable]
  	getActivityDefinitions: [ActivityDefinitionOrError]
  	getActivityInputsOutputs(sysId: String!): ActivityInputOutputResult
  	getParentPlaybooks(processDefinitionId: String!): ParentPlaybooksOrError
  	getSkillsByPlaybookId(playbookId: String!): SkillsOrError
  	getSkillMetaDataBySkillId(skillId: String!): SkillOrError
  }
  type Mutation {
  	# see https://servicenow.sharepoint.com/sites/PlaybookDocs/SitePages/Create-Process-API.aspx
  	createProcess(
  		activities: [ActivityInput]
  		process: ProcessInput
  		lanes: [LaneInput]
  		config: IncludeConfig
  		additionalContextInfo: AdditionalContextInfo
  		triggers: [TriggerInstanceDataInput]
  	): ProcessDataOrError

  	###### INTERNAL APIS below #####
  	# see https://servicenow.sharepoint.com/sites/PlaybookDocs/SitePages/Create-Process-API.aspx#update-process
  	updateProcessData(
  		activities: ActivitiesInput
  		swimlanes: SwimLanesInput
  		activityAppObjects: ActivityAppObjectsInput
  		process: ProcessInput
  		lanes: LanesInput
  		variants: VariantsInput
  		overrides: OverridesInput
  		config: IncludeConfig
  		triggers: TriggersInput
  	): ProcessDataOrError
  	generateProcess(
  		prompt: String
  		process: ProcessInput
  		attachmentId: String
  		kbId: String
  		additionalContextInfo: AdditionalContextInfo
  	): ProcessDataSysIdOrError
  	deleteProcess(
  		sysId: String
  		scope: String
  	): SysIdOrError
  	stopGenerationContext(
  		sysId: String
  	): SysIdOrError
  	createSkill(
          playbookSysId: String!
          name: String!
          description: String!
  		playbookExperience: String!
          assistants: [String!]!
          roles: [String!]
          application: String
  		active: Boolean
      ): CreateSkillResultOrError
  	updateSkill(
          skillId: String!
          name: String
          description: String
  		playbookExperience: String
          assistants: [String!]
          roles: [String!]
          application: String
  		active: Boolean
      ): UpdateSkillResultOrError
  	deleteSkill(
          skillId: String!
      ): DeleteSkillResultOrError
  }

  # Begin input types
  input DisplayableStringInput {
  	value: String
  	displayValue: String
  }

  input TriggersInput {
  	insert: [TriggerInstanceDataInput!]
  	update: [TriggerInstanceDataInput!]
  	remove: [String!]
  }

  input TriggerInstanceDataInput {
  	sysId: String
  	triggerInstanceId: String
  	triggerDefinition: String
  	triggerType: DisplayableStringInput
  	triggerLabel: String
  	inputs: GlideElementGlideVarsInput
  }

  # Keep for backwards compatibility
  input TriggerRecordDataInput {
  	sysId: String
  	triggerInstanceId: String
  	triggerDefinition: String
  	triggerType: DisplayableStringInput
  	triggerLabel: String
  	inputs: GlideElementGlideVarsInput
  }

  input ActivitiesInput {
  	insert: [ActivityInput!]
  	update: [ActivityInput!]
  	remove: [String!]
  }
  input ActivityInput {
  	sysId: String
  	activityDefinition: String
  	processDefinition: String
  	dataDefinition: DataDefinitionInput
  	label: String
  	name: String
  	description: String
  	coordinates: String
  	assetId: String
  	assetConfigurationId: String
  	type: String
  	swimLane: String
  	lane: String
  	hydrationState: String
  	startRule: StartRuleInput
  	startDelay: StartDelayInput
  	inputs: GlideElementGlideVarsInput
  	typeVals: GlideElementGlideVarsInput
  	order: Int
  	conditionToRun: String
  	restartRule: DisplayableStringInput
  	variant: String
  	aiAgentFields: AiAgentFieldsInput
  	activityActionOverrides: [ActivityActionOverrideInput]
  }

  input ActivityActionOverrideInput {
  	actionAssignmentId: String!
  	label: String!
  	displayOrder: Int!
  }

  input AiAgentFieldsInput {
  	aiAgentObjective: DisplayableStringInput
  	aiAgentAutonomousObjective: DisplayableStringInput
  	enableAiAgent: Boolean
  	aiAgentRunAs: DisplayableStringInput
  	aiAgentUser: DisplayableStringInput
  	aiAgentExecutionMode:DisplayableStringInput
  	childAgents: DisplayableStringInput
  	launchAgentOnDemand: Boolean
  }

  input VariantsInput {
  	insert: [VariantInput!]
  	update: [VariantInput!]
  	remove: [String!]
  }

  input VariantInput {
  	sysId: String
  	label: String
  	order: Int
  	condition: String
  	processDefinition: String
  	parentVariant: String
  	favorite: Boolean
  	color: String
  	designerState: String
  }

  input OverridesInput {
  	insert: [OverrideInput!]
  	update: [OverrideInput!]
  	remove: [String!]
  }

  input OverrideInput {
  	sysId: String
  	overrideParent: String
  	order: Int
  	startRule: StartRuleInput
  	variant: String
  }

  input IncludeConfig {
  	includePanelOverrides: Boolean = false
  	includeActivityDefinitions: Boolean = false
  	includeVarMeta: Boolean = true
  }

  input AdditionalContextInfo {
  	generationRequestId: String
  }

  input DataDefinitionInput {
  	sysId: String
  	name: String
  	flowDataVariables: GlideElementGlideVarsInput
  }

  input StartDelayInput {
  	timerAttributes: TimerAttributesInput
  }

  input TimerAttributesInput {
  	sysId: String
  	processDefinition: String
  	source: String
  	sourceType: String
  	durationType: String
  	timerSchedule: String
  	timerRelativeDurationOperator: String
  	timerDuration: GlideVariableInput
  	percentageTimerInputDatetime: GlideVariableInput
  	timerPercentage: GlideVariableInput
  	timerRelativeDurationDatetime: GlideVariableInput,
  	active: Boolean
  }

  input SwimLanesInput {
  	insert: [SwimLaneInput!]
  	update: [SwimLaneInput!]
  	remove: [String!]
  }
  input SwimLaneInput {
  	sysId: String!
  	processDefinition: String
  	label: String
  	order: Int
  	active: Boolean
  	image: String
  }

  input ActivityAppObjectsInput {
  	insert: [ActivityAppObjectInput!]
  	remove: [ActivityAppObjectInput!]
  }
  input ActivityAppObjectInput {
  	sysId: String
  	activityId: String!
  	targetTable: String!
  	targetRecord: String!
  }

  input GlideElementGlideVarsInput {
  	variables: [GlideVariableInput]
  }
  input GlideVariableInput {
  	variableValue: String
  	variableMapping: String
  	variableName: String
  	glideVarElement: String
  	displayValue: String
  	name: String
  	value: String
  	internalType: String
  	label: String
  	mandatory: Boolean
  	maxLength: String
  	choices: [ChoicesInput]
  	reference: String
  	referenceQualifier: String
  	choiceTable: DisplayableStringInput
  	choiceField: DisplayableStringInput
  	hint: String
  	defaultValue: String
  	order: Int
  }

  input ChoicesInput {
  	label: String
  	value: String
  	sequence: String
  	displayValue: String
  }

  input StartRuleInput {
  	definition: String
  	vars: StartRuleVarsInput
  	startRuleName: String
  	startsAfterLanes: [String!]
  	startsAfterActivities: [String!]
  	startsAfterBranches: [BranchInput!]
  }

  input StartRuleVarsInput {
  	activities: [String!]
  	branches: [BranchInput!]
  }

  input BranchInput {
  	activityId: String!
  	branchId: String!
  }

  input ProcessInput {
  	sysId: String
  	description: String
  	viewType: String
  	label: String
  	designerState: String
  	triggerRecordData: TriggerRecordDataInput
  	schemaVersion: Int
  	sysScope: String
  	runStrategy: String
  	restartable: String
  	processType: String
  	allowAsNested: Boolean
  	nowAssistPrompt: String
  	nowAssistAttachmentId: String
  	nowAssistAttachmentName: String
  	nowAssistKb: String
  	inputs: GlideElementGlideVarsInput
  	outputs: GlideElementGlideVarsInput
  	permission: String
  	evaluateVariantChildrenAfter: String
  	publicAccess: Boolean
  	executionType: String
  	launcherTitle: String
  	launcherDescription: String
  	launcherShowRecordForm: Boolean
  	launcherRecordFormView: String
  	launcherTemplateFields: String
  	launcherInputs: GlideElementGlideVarsInput
  }

  input LaneStartRuleInput {
  	definition: String
  	vars: LaneStartRuleVarsInput
  	startRuleName: String
  	startsAfterLanes: [String!]
  	startsAfterActivities: [String!]
  	startsAfterBranches: [BranchInput!]
  }

  input LaneStartRuleVarsInput {
  	lanes: [String!]
  }

  input LanesInput {
  	insert: [LaneInput]
  	update: [LaneInput]
  	remove: [String]
  }

  input LaneInput {
  	sysId: String
  	description: String
  	processDefinition: String
  	color: String
  	startRule: LaneStartRuleInput
  	order: Int
  	label: String
  	name: String
  	conditionToRun: String
  	startDelay: StartDelayInput
  	restartRule: DisplayableStringInput
  	permission: String
  }

  input SysIdsInTable {
  	tableName: String!
  	sysIds: [String!]!
  }

  # Begin output types
  type PlaybookSkillsAccessCheck {
  	hasPlaybookGenerationAccess:Boolean
  	hasPlaybookGenerationWithImageAccess:Boolean
  	hasPlaybookRecommendationsAccess:Boolean
  	hasPlaybookSummarizationAccess: Boolean
  	hasPlaybookGenerationWithKBAccess: Boolean
  }

  type UnsupportedFeatures {
  	unsupportedFeatures: [String]
  	processTypeId: String
  }

  type TriggerInstanceDataOutput {
  	triggerType: DisplayableString
  	triggerLabel: String
  	triggerDefinition: String
  	sysId: String
  	triggerInstanceId: String
  	inputs: GlideElementGlideVars
  }

  # Keep for backwards compatibility
  type TriggerRecordDataOutput {
  	triggerType: DisplayableString
  	triggerLabel: String
  	triggerDefinition: String
  	sysId: String
  	triggerInstanceId: String
  	inputs: GlideElementGlideVars
  }

  type ProcessData {
  	activities: [Activity]
  	swimlanes: [SwimLane]
  	process: Process
  	lanes: [Lane]
  	variants: [Variant]
  	overrides: [Override]
  	panelOverrides: [PanelOverride]
  	triggers: [TriggerInstanceDataOutput]
  }

  type SysId {
  	sysId: String
  }

  type Activity {
  	sysId: DisplayableString @source(value: "sys_id")
  	active: String @source(value: "active.value")
  	label: DisplayableString
  	name: DisplayableString
  	description: DisplayableString
  	activityDefinition: DisplayableString @source(value: "activity_definition")
  	activityDefinitionObj: ActivityDefinitionObj @source(value: "activity_definition_obj")
  	dataDefinition: DataDefinition
  	swimLane: DisplayableString @source(value: "swim_lane")
  	processDefinition: DisplayableString @source(value: "process_definition")
  	created: DisplayableString @source(value: "sys_created_on")
  	updated: DisplayableString @source(value: "sys_updated_on")
  	conditionToRun: DisplayableString @source(value: "condition_to_run")
  	coordinates: String @source(value: "coordinates.value")
  	startRule: StartRule @source(value: "start_rule")
  	lane: DisplayableString
  	hydrationState: DisplayableString @source(value: "hydration_state")
  	inputs: GlideElementGlideVars
  	typeVals: GlideElementGlideVars @source(value: "type_vals")
  	outputs: GlideElementGlideVars
  	order: DisplayableString
  	restartRule: DisplayableString @source(value: "restart_rule")
  	startDelay: StartDelay @source(value: "start_delay")
  	variant: DisplayableString @source(value: "variant")
  	aiAgentFields: AiAgentFields @source(value: "ai_agent_fields")
  	activityActionOverrides: [ActivityActionOverride] @source(value: "activity_action_overrides")
  }

  type ActivityActionOverride {
  	actionAssignmentId: String @source(value: "action_assignment_id")
  	label: String
  	displayOrder: String @source(value: "display_order")
  }

  type ActivityInputOutputResult {
  	activitySysId: String
  	inputs: [GlideVariable]
  	outputs: [ActivityOutput]
  }

  type ActivityOutput {
  	name: String
  	label: String
  	type: String
  	typeLabel: String
  	attributes: [String]
