  	aiAgentObjective: DisplayableString @source(value: "ai_agent_objective")
  	aiAgentAutonomousObjective: DisplayableString @source(value: "ai_agent_obj_additional_detail")
  	enableAiAgent: DisplayableBoolean @source(value: "enable_ai_agent")
  	aiAgentRunAs: DisplayableString @source(value: "ai_agent_run_as")
  	aiAgentUser: DisplayableString @source(value: "ai_agent_user")
  	aiAgentExecutionMode : DisplayableString @source(value: "ai_agent_execution_mode")
  	childAgents: DisplayableString @source(value: "conversational_agents")
  	launchAgentOnDemand: DisplayableBoolean @source(value: "launch_agent_on_demand")
