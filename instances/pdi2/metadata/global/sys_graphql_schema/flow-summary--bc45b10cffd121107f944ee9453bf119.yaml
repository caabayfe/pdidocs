schema: |-
  schema {
      query: Query
  }

  type Query {
      getFlowSummary ( flowSysId: String!) : Data
  }

  union Data = Flow | Error

  type Error {
  	apiErrorTitle: String
  	apiErrorDetails: String
  }

  type Flow {
  	active: String
  	canWriteProtection: String
  	copiedFrom: String
  	description: String
  	domainId: String
  	domainName: String
  	fUserCanRead: String
  	flowCatalogVaraibleModelId: String
  	id: String
  	internalName: String
  	masterSnapshotId: String
  	name: String
  	protection: String
  	remoteTriggerSysId: String
  	runAs: String
  	scope: String
  	scopeDisplayName: String
  	scopeName: String
  	startingIndexOfErrorHandlingInstances: String
  	status: String
  	type: String
  	updated: String
  	updatedBy: String
  	
  	actionInstances: [actionInstance]
  	flowLogicInstances: [flowLogicInstance]
  	inputs: [flowInput]
  	label_cache: [label_cache]
  	runWithRoles: runWithRoles
  	security: security
  	triggerInstances: [triggerInstance]
  	outputs: [flowOutput]
  	flowVariables: [flowVariable]
  	pharmacy: pharmacy
  	subflowInstances: [subflowInstance]
  	stages: [stage]
  }

  type subflowInstance {
  	comment: String
  	displayText: String
  	flowSysId: String
  	id: String
  	order: String
  	parent: String
  	subflowSysId: String
  	uiUniqueIdentifier: String
  	
  	inputs: [subflowInstanceInput]
  	subFlow: subFlow
  	waitForCompletion: waitForCompletion
  }

  type subFlow {
  	access: String
  	active: String
  	description: String
  	domainId: String
  	domainName: String
  	fIsMasterSnapshot: String
  	fUserCanRead: String
  	flowCatalogVariableModelId: String
  	id: String
  	name: String
  	parentFlow: String
  	protection: String
  	runAs: String
  	scope: String
  	scopeDisplayName: String
  	scopeName: String
  	startingIndexOfErrorHandlingInstances: String
  	status: String
  	type: String
  	updated: String
  	updatedBy: String
  	
  	actionInstances: [actionInstance]
  	flowLogicInstances: [flowLogicInstance]
  	inputs: [flowInput]
  	label_cache: [label_cache]
  	runWithRoles: runWithRoles
  	security: security
  	triggerInstances: [triggerInstance]
  	outputs: [flowOutput]
  	flowVariables: [flowVariable]
  	subflowInstances: [subflowInstance]
