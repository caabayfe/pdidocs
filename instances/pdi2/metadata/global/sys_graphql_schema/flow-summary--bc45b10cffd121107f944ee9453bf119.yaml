  type subflowInstanceInput {
  	displayValue: String
  	id: String
  	name: String
  	scriptActive: String
  	subFlowInstanceId: String
  	value: String
  	
  	label: String @source(value: "parameter.label")
  	type: String @source(value: "parameter.type")
  	typeLabel: String @source(value: "parameter.typeLabel")
  	mandatory: String @source(value: "parameter.mandatory")
  	defaultValue: String @source(value: "parameter.defaultValue")
  	readOnly: String @source(value: "parameter.readOnly")
  	maxsize: String @source(value: "parameter.maxsize")
  }

  type waitForCompletion {
