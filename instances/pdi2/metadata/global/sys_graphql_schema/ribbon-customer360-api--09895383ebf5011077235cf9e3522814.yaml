schema: |-
  schema {
  	query: Query
  }

  type Query {
  	getWidgetData(input: WidgetInput) : [Item]
  }

  input WidgetInput {
  	table: String!
  	sysId: String!
  	primaryUser: String
  	secondaryUser: String
  	tertiaryUser :String
  	primaryFields: String
  	secondaryFields: String
  	tertiaryFields: String
  }

  type Item {
  	userType: String
  	userTypeLabel: String
  	avatar: String
  	hasValue: String
  	fields: [Field]
  	accountDetails: AccountDetails
  }

  type Field {
  	displayValue:String
  	value:String
  	label:String
  	type:String
  	name:String
  }

  type AccountDetails {
  	id:String
  	name:String
  	activeEscalation: ActiveEscalation
  }

  type ActiveEscalation {
  	id: String
  	number: String
  	state: EscalationState
  }

  type EscalationState {
  	value: String
  	displayValue: String
  }
