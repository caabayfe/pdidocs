schema: |-
  schema {
      query: Query
      mutation: Mutation
  }

  type Query {
     actions(recordTable: String!, recordSysId : String!, type: String!, fieldType: String): [Action]
  }

  type Mutation {
      invokeAction(recordTable: String!, recordSysId : String!, commandId: String!, query: String!) : ActionResult
  }

  type Action {
  	commandName: String,
  	sysId: String,
  	name: String,
  	description: String,
  	actionType: String,
  }

  type ActionResult {
  	header: String,
  	message: String,
  	templateMessage: TemplateMessage
  	items: [ActionResultItems]
  }

  type TemplateMessage {
  	illustration: String,
  	headingLabel: String,
  	content: String
  }

  union ActionResultItems = InsertContentItems | ReplaceContentItems | CustomEventItems

  type InsertContentItems {
  	id: String!,
  	title: String!,
  	displayContent: String!,
  	insertContent: String!,
  	recommended: String,
  	actionPayload: String
  }

  type ReplaceContentItems {
  	id: String!,
  	title: String!,
  	displayContent: String!,
  	replaceContent: String!,
  	recommended: String,
  	actionPayload: String
  }

  type CustomEventItems {
  	id: String!,
  	title: String!,
  	displayContent: String!,
  	customEvent: String!,
  	recommended: String,
  	actionPayload: String,
  }
