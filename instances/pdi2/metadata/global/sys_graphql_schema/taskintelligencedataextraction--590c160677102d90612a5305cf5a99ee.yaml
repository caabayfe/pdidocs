schema: |-
  schema {
  	query: Query
  }

  input TrainingDataExtractionInput {

  	parameters: String!
  	pagination_data: PaginationDataInput
  }

  input DependentFieldsInput {
  	label_table: String!
  	labels: [String!]!
  	domain_sys_id: String
  }

  input DependentFieldValueMappingsInput {
  	label_table: String!
  	dependent_label: String!
  	domain_sys_id: String
  	pagination_data: PaginationDataInput!
  }

  type Query {

  	# Get training data
  	trainingData(trainingDataExtractionInput: TrainingDataExtractionInput!): TrainingDataExtractionResult

  	# Get the content of the attachments from their ids
  	attachmentData(attachmentSysIdList: [String!]!): [AttachmentData]!

  	# Identify fields with dependent relationship
  	dependentFields(dependentFieldsInput: DependentFieldsInput!): [DependentFieldsResult]

  	# Get detailed value mappings between the two fields with dependency
  	dependentFieldValueMappings(dependentFieldValueMappingsInput: DependentFieldValueMappingsInput!): DependentFieldValueMappingsResult
  }

  # Supported field types
  interface Field {
  	name: String!
  }

  type SingleValuedField implements Field {
  	name: String!
  	value: String!
  }

  type MultiValuedField implements Field {
  	name: String!
  	values: [String]!
  }

  type AttachmentListField implements Field {
  	name: String!
  	attachmentList: [AttachmentMetadata]!
  }

  # Pagination Data
  input PaginationDataInput {
  	batch_count: Int
  	total_number_records_to_process: Int
  	total_extracted_records: Int
  	total_extracted_attachments: Int
  	offset: Int
  	limit: Int
  	table_rotation_info: TableRotationInfoInput
  }

  input TableRotationInfoInput {
  	active: Boolean
  	rotation_schedule: String
  	rotation_offset: Int
  }

  type PaginationDataOutput {
  	batch_count: Int
  	total_number_records_to_process: Int
  	total_extracted_records: Int
  	total_extracted_attachments: Int
  	offset: Int
  	limit: Int
  	table_rotation_info: TableRotationInfoOutput
  }

  type TableRotationInfoOutput {
  	active: Boolean
  	rotation_schedule: String
  	rotation_offset: Int
  }

  # Training Data
  type TrainingDataBatch {
  	tag: String
  	pagination_data: PaginationDataOutput
  	records: [TrainingDataRecord]!
  }

  type TrainingDataRecord {
  	target_sys_id: ID!
  	source_sys_id: ID
  	sys_created_on: String!
  	features: [SingleValuedField]!
  	other_features: [Field]!
  	labels: [SingleValuedField]!
  }

  # Attachment metadata type 
  type AttachmentMetadata {
  	attachmentSysId: ID!
  	attachmentType: String
  	attachmentName: String!
  	attachmentByteSize: Int
  }

  # Attachment content type 
  type AttachmentData {
  	attachmentSysId: ID!
  	content(chunked: Boolean): [String]
  }


  type TrainingDataExtractionError {

  	errorType: String!
  	errorMessages: [String!]!
  }

  union TrainingDataExtractionResult = TrainingDataBatch | TrainingDataExtractionError

  # Dependent data output
  type DependentFieldsResult {
  	label: String!
  	dependent_label: String!
  }

  type DependentFieldValueMappingRecord {
  	value: String
  	dependent_value: String
  }

  type DependentFieldValueMappingsResult {
  	records: [DependentFieldValueMappingRecord]!
  	pagination_data: PaginationDataOutput!
  }
sys_name: TaskIntelligenceDataExtraction
sys_policy: ''
type_names: Field,TrainingDataExtractionResult
