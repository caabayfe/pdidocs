            "name": "Is user subscribed to notifications?",
            "script": "(function execute() {\n    var recipient = new GlideRecord(vaVars.global_notifications_subscription_user_table);\n    recipient.get('sys_id', vaVars.global_notifications_subscription_user);\n\n    // Store the platform-level global user notification preference\n    var prefs = new sn_notification.Preferences(recipient);\n    vaVars._is_user_subscribed_at_platform = prefs.getUserGlobalPreference();\n    \n    var providerApp = JSON.parse(sn_cs.VASystemObject.getProviderAppById(vaContext.providerAppId));\n    var provider = JSON.parse(sn_cs.VASystemObject.getProviderById(providerApp.providerId));\n\n    var cschannel = new GlideRecord('sys_cs_channel');\n    cschannel.get('sys_id', provider.channelId);\n    vaVars._notifications_enabled = (cschannel.getValue('enable_notification') === '1') ? true : false;\n    \n    var channelname = cschannel.getValue('name');\n    if(channelname.toLowerCase().includes('teams'))\n       vaVars._channel_name = 'Microsoft Teams';\n    else\n       vaVars._channel_name = channelname;\n\n    var mapping = new GlideRecord('sys_cs_notification_channel_configuration');\n    mapping.get('provider', providerApp.providerId); \n \n    var channel = new GlideRecord('sys_notification_channel');\n    channel.get('sys_id', mapping.getValue('notification_channel'))\n \n    gs.info('channel: ' + channel.getValue('name')); \n    var result = vaSystem.preProcessNotificationSubscription(vaVars.global_notifications_subscription_provider_user_id, vaVars.global_notifications_subscription_channel_id);\n    var dests = prefs.getDestinationsByChannel(channel);\n    if (dests.length == 0) {\n        gs.error('destination preference does not exist');\n        vaVars._is_user_subscribed_at_destination = false;\n    } else {\n        vaVars._is_user_subscribed_at_destination = dests[0].isActive();\n    }\n    if(result) vaSystem.postProcessNotificationSubscription();\n})()\n",
