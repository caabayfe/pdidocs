cation'') === ''1'') ? true : false;\n    \n    var channelname = cschannel.getValue(''name'');\n    if(channelname.toLowerCase().includes(''teams''))\n       vaVars._channel_name = ''Microsoft Teams'';\n    else\n       vaVars._channel_name = channelname;\n\n    var mapping = new GlideRecord(''sys_cs_notification_channel_configuration'');\n    mapping.get(''provider'', providerApp.providerId); \n \n    var channel = new GlideRecord(''sys_notification_channel'');\n    channel.get(''sys_id'', mapping.getValue(''notification_channel''))\n \n    gs.info(''channel: '' + channel.getValue(''name'')); \n    var result = vaSystem.preProcessNotificationSubscription(vaVars.global_notifications_subscription_provider_user_id, vaVars.global_notifications_subscription_channel_id);\n    var dests = prefs.getDestinationsByChannel(channel);\n    if (dests.length == 0) {\n        gs.error(''destination preference does not exist'');\n        vaVars._is_user_subscribed_at_destination = false;\n    } else {\n        vaVars._is_user_subscribed_at_destination = dests[0].isActive();\n    }\n    if(result) vaSystem.postProcessNotificationSubscription();\n})()\n","id":"a4f03f82b63b4c57b3a2b9b77c791f7d","name":"Is user subscribed to notifications?","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"Decision","type":"Decision","name":"Is user subscribed at destination-level?","branches":[{"type":"Branch","type":"Branch","label":"Notifications Disabled","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    /* Return true or false to indicate the branch condition''s applicability.\n       For example:\n\n       var applies = vaInputs.first_name == ''Bill'' ? true : false;\n       return applies;\n    */\n    return vaVars._notifications_enabled === false;\n})()\n"},"id":"ac67e3be8fbd439f9a799f71ac5c6a70","name":"Notifications Disabled"},{"type":"Branch","type":"Branch","label":"Subscribed","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars._notifications_enabled === true && vaVars._is_user_subscribed_at_destination === true;\n})()\n"},"id":"f4250a6afed54e18b078410bc004ee90","name":"Subscribed"},{"type":"Branch","type":"Branch","label":"Unsubscribed","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars._notifications_enabled === true && vaVars._is_user_subscribed_at_destination === false;\n})()\n"},"id":"cd38cfa54bc44c96bc2672cc8ac55789","name":"Unsubscribed"}],"id":"39608056633f49b090c97c323d3b70c0","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"ChoiceInputPrompt","type":"ChoiceInputPrompt","expression_mode":"simple","metadataScript":"","cardName":"","cardFields":[],"id":"841b21ccca77443880d5cfc29fdf681f","name":"Options to unsubscribe","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return !vaVars.global_keyword_topic_finished;\n})()"},"variable_id":"525781c9386e4ed8851fff11e33054ba","message":{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    return gs.getMessageLang(\n        ''Notifications are enabled in {0}'', \n        vaContext.getRequesterLang(), \n        [vaVars._channel_name]\n    );\n})()\n"},"skippable":{"type":"Applicability","type":"Applicability","mode":"script","value":"false"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true}},{"type":"ChoiceInputPrompt","type":"ChoiceInputPrompt","expression_mode":"simple","metadataScript":"","cardName":"","cardFields":[],"id":"c6b5aa558e2842f489888c64af4ef25a","name":"Options to subscribe","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":