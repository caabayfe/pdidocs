     if (gr.isValidField(''task_effective_number''))\n            subtitle = gr.getValue(''task_effective_number'').toString();\n        else\n            subtitle = gr.number.toString();\n\n        if (gr.isValidField(''short_description'')) {\n            fields.push({\n                \"fieldLabel\": gr.getElement(''short_description'').getLabel(),\n                \"fieldValue\": gr.getDisplayValue(''short_description'').toString()\n            });\n        }\n        if (gr.isValidField(''state'')) {\n            fields.push({\n                \"fieldLabel\": gr.getElement(''state'').getLabel(),\n                \"fieldValue\": gr.getDisplayValue(''state'').toString()\n            });\n        }\n    }\n\n    var card_data = JSON.stringify({\n        \"title\": title,\n        \"subtitle\": subtitle,\n        \"fields\": fields,\n        \"url\": vaVars.recordLink.toString()\n    });\n    return vaSystem.renderCard(\"Card\", card_data);\n})()\n"},"secure":false},{"type":"LinkOutputPrompt","type":"LinkOutputPrompt","header":{"type":"String","type":"String","mode":"string","value":"gs.getMessageLang(\"Your request has been submitted\", vaContext.getRequesterLang())"},"label":{"type":"String","type":"String","mode":"string","value":"gs.getMessageLang(\"Click here to view the created record\", vaContext.getRequesterLang())"},"url":{"type":"String","type":"String","mode":"string","value":"{{vaVars.recordLink}}"},"link_type":"single","multi_link_script":"","id":"f204f270a57448959d342d2532271f9a","name":"Submitted record link","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}}],"edges":[{"type":"Edge","source_node_id":"8ce0521d9a4d4a99bf9adc285f985f14","target_node_id":"de6f6508b2984f1da80761ada0027468","id":"93a307d50ebe44e78ca1205726b5ff73"},{"type":"Edge","source_node_id":"de6f6508b2984f1da80761ada0027468","target_node_id":"6633db3c19804c49b5d1eff3c25b040d","id":"8e5e7d4108d74c03b6182c7693dbe2ab"},{"t