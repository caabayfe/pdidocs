rent language\n    return vaContext.getRequesterLang() == vaVars.global_runtime_detected_language;\n})()\n})()"},"id":"a155e8e2b68149f4afb177158103b592","name":"Language is not different from default","expert_mode":false},{"type":"Branch","label":"Language is different from default","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    // True if language detected is different from the current language\n    return vaContext.getRequesterLang() != vaVars.global_runtime_detected_language;\n})()\n})()"},"id":"784a89ab75664c2bb87b1c3600f9b310","name":"Language is different from default","expert_mode":false}],"id":"999cd4e547b449328555becf075bfe4d","goal_id":"primary","expert_mode":false},{"type":"LibraryCall","library_topic_name":"Language Switch Control","library_topic_id":"60ce473853b230103296ddeeff7b1211","library_topic_is_template":false,"parameter-mappings":[],"return-value-mappings":[{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"answer","main_topic_mapped_variable_name":"answer"}],"header_card_fields":[],"input_parameters_mode":"dynamic","output_parameters_mode":"dynamic","id":"9b8735e6f8af45849fc68260c52dad19","name":"Language Switch Control","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Change thank you text","branches":[{"type":"Branch","label":"No","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return vaInputs.answer != \"Yes\";\n})()\n})()"},"id":"3516ed86d7ff4c268d27bdaa3f112005","name":"No","expert_mode":false},{"type":"Branch","label":"Yes","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return vaInputs.answer == \"Yes\";\n})()\n})()"},"id":"14880856fa2b431e97f71e6abbd02440","name":"Yes","expert_mode":false}],"id":"46b7db460fd54d8f9b211aca8256dcde","g