          "db5d31f86cd148b7a8a796404ef9c389": {
            "id": "db5d31f86cd148b7a8a796404ef9c389",
            "stepType": "TextOutput",
            "name": "Language not supported",
            "secure": false,
            "value": [
              {
                "value": "(function execute() {\n    // Find the name of the language currently being used\n    if (gs.tableExists(\"sys_language\")) {\n        var gr = new GlideRecord(\"sys_language\");\n        var queryString = 'id=' + vaContext.getRequesterLang();\n        gr.addEncodedQuery(queryString);\n        gr.query();\n    \n        gr.next();\n\n        // Notify the user their language is unsupported\n        if (typeof vaVars.language_name !== 'undefined' && typeof gr.name !== 'undefined') {\n            return \"You typed in \" + vaVars.language_name\n            + \". I do not have support for that language at this time \"\n            + \"so I will continue this conversation in \"\n            +  gr.name + \".\";\n        } else if (typeof vaVars.language_name == 'undefined' && typeof gr.name !== 'undefined') {\n            return \"I do not have support for that language at this time \"\n            + \"so I will continue this conversation in \"\n            +  gr.name + \".\";\n        } else {\n            return \"I do not have support for that language at this time.\";\n        }\n    }else{\n        return \"I do not have support for that language at this time.\";\n    }\n})()\n",
                "mode": "script"
              }
            ],
