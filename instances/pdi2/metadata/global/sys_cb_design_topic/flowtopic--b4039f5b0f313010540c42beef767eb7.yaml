          "5c47da72186548c8bd1a4e225ba6738b": {
            "id": "5c47da72186548c8bd1a4e225ba6738b",
            "name": "Set Runtime Detected Language",
            "script": "(function execute() {\n    //If no error set runtime detected language\n    if (String(vaInputs.language_code) !== \"notalanguage\") {\n        vaVars.global_runtime_detected_language = vaInputs.language_code;\n    } else {\n        vaInputs.change_language = false;\n    }\n})()\n\n",
