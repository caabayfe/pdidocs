imary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Should change language?","branches":[{"type":"Branch","label":"Shouldn''t change language","expression":{"type":"Applicability","mode":"query","value":"change_language="},"id":"936f101fec90440cbc3dbd8b42803ee2","name":"Shouldn''t change language","expert_mode":false},{"type":"Branch","label":"Should change language","expression":{"type":"Applicability","mode":"query","value":"change_language=true"},"id":"49742e9d3c1b4f8db63bf237f11d5c72","name":"Should change language","expert_mode":false}],"id":"1a714224c7b04b509997c075c2d9bb6c","goal_id":"primary","expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.language_supported = false;\n\n    // Check if the detected language is supported\n    if (gs.tableExists(\"sys_language\")) {\n        var gr = new GlideRecord(\"sys_language\");\n        var queryString = ''id='' + vaInputs.language_code;\n        gr.addEncodedQuery(queryString);\n        gr.query();\n    \n       if(gr.next()){\n           if (gr.active) {\n              vaVars.language_supported = true;\n           }\n            vaVars.language_name = gr.name;\n        }\n    }\n    \n})()\n","id":"b710268b22b94e46bd158445db9203bf","name":"Check if installed","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Is language supported?","branches":[{"type":"Branch","label":"Not Supported","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return !vaVars.language_supported;\n})()\n})()"},"id":"26a6a25627ff43338346c16dcfe7cf00","name":"Not Supported","expert_mode":false},{"type":"Branch","label":"Supported","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n   return vaVars.language_supported;\n})()\n})()"},"i