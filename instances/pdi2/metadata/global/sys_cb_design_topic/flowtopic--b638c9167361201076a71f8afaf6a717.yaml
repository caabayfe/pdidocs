            "name": "Display FAQ",
            "secure": false,
            "value": [
              {
                "value": "(function execute() {\n   // relevant properties to get record\n    var searchJsonObj = JSON.parse(vaVars.search_result_json_string);\n    var resultNumber = searchJsonObj[vaVars.selected_faq].meta.number;\n    var faqUtil = new global.VAFaqUtil();\n    // build the header text\n    header_text =  faqUtil.buildHeaderText(resultNumber, vaVars.selected_type);\n    \n    header_text += '<br><br>';\n\n    var linkBuilder = new global.cxs_SearchResultLinkBuilder();\n    var link = linkBuilder.build(searchJsonObj[vaVars.selected_faq], vaInputs.portal);\n\n    header_text += '<a href=\"'+link.link+'\" target=\"_blank\" >'+ 'Read full article'+ '</a>';\n    //header_text += '[Read full article]('+link.link+')'\n    return header_text;\n})()\n",
                "mode": "script"
              }
            ],
