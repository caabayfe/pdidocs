          "8be32aea0f2f47e5bb3d3b8cf719cba7": {
            "id": "8be32aea0f2f47e5bb3d3b8cf719cba7",
            "name": "Set slot fill values",
            "script": "(function execute() {\n\tvar definition;\n\tvar collectedByName = {};\n\n\t// collect slots from LLM slotfill call\n\ttry {\n\t\tdefinition = JSON.parse(vaVars.definition);\n\t\tif (!gs.nil(vaInputs.slot_fill_values)) {\n\t\t\tvar response = JSON.parse(vaInputs.slot_fill_values.getValue())[0];\n\t\t\tvar results = JSON.parse(response.response).result;\n\n\t\t\tresults.forEach(function(result) {\n\t\t\t\tif (result.value) {\n\t\t\t\t\tcollectedByName[result.name] = {name: result.name, value: result.value.toString()};\n\t\t\t\t}\n\t\t\t});\n\t\t}\n\t} catch (e) {\n\t\tgs.info(\"Exception after Unified skill slotfill llm call, \" + e.toString() + '\\n' + JSON.stringify(e));\n\t}\n\n\t// merge in slots from AO topic tool info, overriding same-name entries from slot_fill_values\n\ttry {\n\t\tdefinition = definition || JSON.parse(vaVars.definition);\n\t\tvar topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n\t\tvar topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n\t\tif (topicToolInfo.topicSlots && topicToolInfo.topicSlots.length > 0) {\n\t\t\ttopicToolInfo.topicSlots.forEach(function(slot) {\n\t\t\t\tcollectedByName[slot.name] = slot;\n\t\t\t});\n\t\t}\n\t} catch (e) {\n\t\tgs.info(\"Exception filling topic tool slots from context, \" + e.toString() + '\\n' + JSON.stringify(e));\n\t}\n\t\n\tvar mergedSlots = Object.keys(collectedByName).map(function(key) {\n\t\treturn collectedByName[key];\n\t});\n\tif (definition) {\n\t\tvaSystem.setScoredEntities(definition.skill_name, mergedSlots);\n\t}\n})()",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
