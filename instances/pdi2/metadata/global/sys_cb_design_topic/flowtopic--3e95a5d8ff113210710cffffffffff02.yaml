ShowMeEverything\": true});\n})()\n\n// (function execute() {\n//     vaSystem.switchTopic(''_off_glide_home_'', ''RESUME'', true);\n// })()\n\n","id":"3158eb8d91a047f4bab0e66a9e6477f6","name":"_empty_skill_picker_","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    if (gs.nil(vaVars.global_context_off_glide_topic_tool_execution_info)) {\n        return;\n    }\n\n    var topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n    var topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n    var skillId = topicToolInfo.skillId;\n    var skillName = \"\";\n    var skillDescription = \"\";\n    if (!gs.nil(skillId)) {\n        var skillDetails = sn_one_extend.OneExtendUtil.getSkillDetails(skillId);\n        skillName = skillDetails.name;\n        skillDescription = skillDetails.description;\n    }\n\n    var topicInputVars = [];\n    var topicGR = new GlideRecord(\"sys_cs_topic\");\n    topicGR.get(topicToolInfo.topicId);\n    var inputVarsJson = topicGR.getValue(\"input_variables\");\n    if (!gs.nil(inputVarsJson)) {\n        var inputVars = JSON.parse(inputVarsJson);\n        var maxNumberOfEntities = gs.getProperty(''com.glide.cs.genai.discovery.limits.skill.slots'', 20);\n        for (var i = 0; i < inputVars.length && i < maxNumberOfEntities; i++) {\n            var input = {\n                \"name\": inputVars[i].name,\n                \"description\": inputVars[i].description,\n                \"type\": inputVars[i].datatype\n            };\n            topicInputVars.push(input);\n\n            switch (input.type) {\n                case \"String\":\n                    input.type = \"string\";\n                    break;\n                case \"date_time\":\n                case \"Datetime\":\n                    input.type = inputVars[i].dataTypeFormat;\n                    break;\n                case \"choice\":\n                    input.choices = inputVars[i].choices;\n                    break;\n                case \"ID\":\n                    input.type = \"choice\";\n                    input.choices = inputVars[i].choices;\n                    break;\n                case \"boolean\":\n                case \"Boolean\":\n                    input.type = \"boolean\";\n                    break;\n                case \"Picture\":\n                    input.type = \"reference\";\n                    break;\n                case \"reference\":\n                case \"Reference\":\n                    input.type = inputVars[i].list ? \"array.reference\" : \"reference\";\n                    break;\n                default:\n                    input.type = \"string\";\n            }\n        }\n    }\n    vaVars.definition = JSON.stringify({\n        ''inputs'': topicInputVars,\n        ''skill_name'': skillName,\n        ''skill_description'': skillDescription\n    });\n})()","id":"55e722c254b244f48769a92dcbdb6c3e","name":"Get inputs from topic","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"LibraryCall","library_topic_name":"Slot Fill Discovery","library_topic_id":"59212c337f8452107880df6d9c866577","library_topic_is_template":false,"parameter-mappings":[{"parameter-name":"definition","value":{"type":"String","mode":"string","value":"{{vaVars.definition}}"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"iscatalog","value":{"type":"String","mode":"string","value":"false"},"metadata":{"type":"True/False","list":false,"items":[],"use_items":false}},{"parameter-name":"utterance","value":{"type":"String","mode":"script","value":"(function execute() {\n    var topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n    var topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n    return topicToolInfo.utterance;\n})()"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"additional_attributes","value":{"type":"String","mode":"string","value":""},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"context_inclusion_rule","value":{"type":"String","mode":"string","value":"DEFAULT"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}}],"return-value-mappings":[{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"slot_fill_values","main_topic_mapped_variable_name":"slot_fill_values"}],"header_card_fields":[],"input_parameters_mode":"dynamic","output_parameters_mode":"dynamic","output_parameter_variable":"","id":"62079cf4cfdb409a8e5ad543d053d038","name":"Slot Fill Discovery","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"input_parameters_script":""},{"type":"ScriptedAction","script":"(function execute() {\n\tvar definition;\n\tvar collectedByName = {};\n\n\t// collect slots from LLM slotfill call\n\ttry {\n\t\tdefinition = JSON.parse(vaVars.definition);\n\t\tif (!gs.nil(vaInputs.slot_fill_values)) {\n\t\t\tvar response = JSON.parse(vaInputs.slot_fill_values.getValue())[0];\n\t\t\tvar results = JSON.parse(response.response).result;\n\n\t\t\tresults.forEach(function(result) {\n\t\t\t\tif (result.value) {\n\t\t\t\t\tcollectedByName[result.name] = {name: result.name, value: result.value.toString()};\n\t\t\t\t}\n\t\t\t});\n\t\t}\n\t} catch (e) {\n\t\tgs.info(\"Exception after Unified skill slotfill llm call, \" + e.toString() + ''\\n'' + JSON.stringify(e));\n\t}\n\n\t// merge in slots from AO topic tool info, overriding same-name entries from slot_fill_values\n\ttry {\n\t\tdefinition = definition || JSON.parse(vaVars.definition);\n\t\tvar topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n\t\tvar topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n\t\tif (topicToolInfo.topicSlots && topicToolInfo.topicSlots.length > 0) {\n\t\t\ttopicToolInfo.topicSlots.forEach(function(slot) {\n\t\t\t\tcollectedByName[slot.name] = slot;\n\t\t\t});\n\t\t}\n\t} catch (e) {\n\t\tgs.info(\"Exception filling topic tool slots from context, \" + e.toString() + ''\\n'' + JSON.stringify(e));\n\t}\n\t\n\tvar mergedSlots = Object.keys(collectedByName).map(function(key) {\n\t\treturn collectedByName[key];\n\t});\n\tif (definition) {\n\t\tvaSystem.setScoredEntities(definition.skill_name, mergedSlots);\n\t}\n})()","id":"8be32aea0f2f47e5bb3d3b8cf719cba7","name":"Set slot fill values","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"Topic","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    var topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n    if (gs.nil(topicToolInfosArray)) {\n        return false;\n    }\n    var topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n    return !gs.nil(topicToolInfo) && !gs.nil(topicToolInfo.topicId) && gs.nil(topicToolInfo.topicBlockInfoJson);\n})()\n})()"},"id":"b265f975c0394e378b0ea8aa91158dfe","name":"Topic","expert_mode":false},{"type":"Branch","label":"Topic Block","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    if (gs.nil(vaVars.global_context_off_glide_topic_tool_execution_info)) {\n        return;\n    }\n    var topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n    var topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n    return !gs.nil(topicToolInfo) && !gs.nil(topicToolInfo.topicBlockInfoJson);\n})()\n})()"},"id":"1a51017d9d674d2fa4bbd13d90bf480d","name":"Topic Block","expert_mode":false}],"id":"269176f8e4f7447eb7f84f9f35913a27","goal_id":"primary","expert_mode":false},{"type":"LibraryCall","library_topic_name":"","library_topic_id":"","library_topic_is_template":true,"dynamic_topic_block_name":{"type":"String","mode":"script","value":"(function execute() {\n    var topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n    var topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n    var tbInfo = JSON.parse(topicToolInfo.topicBlockInfoJson);\n    return tbInfo.name;\n})()\n"},"parameter-mappings":[],"return-value-mappings":[],"header_card_fields":[],"input_parameters_mode":"script","output_parameters_mode":"script","output_parameter_variable":"tb_outputs","id":"b20275f1d2b840bb9ce8a5bd34f40e55","name":"Execute Topic Block","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"input_parameters_script":"(function execute() {\n    /*  Return the input mappings of the topic block to run. Should be the ''parameter-name'' : ''value'' key/value pair .\n        For example:\n\n        var fordInputs = { ''car_make'' : ''ford'' };\n\n        var toyotaInputs = { ''car_make'': ''toyota'' };\n\n        switch (vaVars.car_make) {\n            case ''Ford'':\n                return fordInputs;\n            case ''Toyota'':\n                return toyotaInputs;\n            default:\n                return {};\n        }\n    */\n\n    var topicToolInfosArray = JSON.parse(vaVars.global_context_off_glide_topic_tool_execution_info);\n    var topicToolInfo = topicToolInfosArray[topicToolInfosArray.length - 1];\n    var tbInfo = JSON.parse(topicToolInfo.topicBlockInfoJson);\n    return tbInfo.inputs;\n})()\n"},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"not nested","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return true;// !varVars.glo