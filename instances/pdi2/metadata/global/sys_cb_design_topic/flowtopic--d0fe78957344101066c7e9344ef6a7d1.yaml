                "value": "(function execute() {\n    var defaultMessage = 'Your account has been locked due to invalid Soft PIN entries. Please try again later.';\n    var customMessage = sn_cs.VASystemObject.getBotMessage('softpin_lockout_message',  vaVars.inboundId, vaVars.providerId);\n\n    var promptMessage = customMessage || defaultMessage;\n\n    return gs.getMessageLang(promptMessage, vaContext.getRequesterLang());\n})()\n",
                "mode": "script"
              }
            ],
