              "mode": "script"
            },
            "condition": {
              "value": "(function execute() {\n    var options = [];    \n        options.push({ 'value': vaVars.challengeUrl, 'label': gs.getMessageLang('Link to ServiceNow', vaContext.getRequesterLang())});//vaSystem.getAdapterMessage(\"link_account_label\", true) });\n        if (!vaVars.disableContinueAsGuest) {\n            options.push({ 'value': 'continue_as_guest', 'label': gs.getMessageLang(\"Continue as Guest\", vaContext.getRequesterLang()) });\n        }\n        if(vaContext.deviceType != 'adapter') {\n            //options.push({ 'value': vaSystem.getAdapterMessage(\"help_required_keyword\", false), 'label': gs.getMessageLang(\"Check out Tips\", vaContext.getRequesterLang()) });\n            options.push({ 'value': 'help', 'label': gs.getMessageLang(\"Check out Tips\", vaContext.getRequesterLang()) });\n        }\n        \n    return options;    \n})()\n",
