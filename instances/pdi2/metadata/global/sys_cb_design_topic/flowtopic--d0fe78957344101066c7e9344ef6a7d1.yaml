            "id": "d3e0972f2f7b421e9368373667d7c879",
            "name": "Get User Lockout Status",
            "script": "(function execute() {\n\n    var providerAppId = vaContext.providerAppId;\n    var maxAttempts = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy('softpin_max_retry_attempts', providerAppId);\n    var invalidRetryInterval = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy('softpin_max_invalid_attempts_interval_hrs', providerAppId);\n\n    vaVars.userLockedOutOnInvalidSoftPinAttempts = CustomAdapterSoftPinHelper.isUserLockedOutOnMaxAttempts(\n                                        providerAppId, vaContext.providerUserId, maxAttempts, invalidRetryInterval,vaVars.identifiedUser);\n})()\n",
