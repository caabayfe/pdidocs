            "prompt": {
              "value": "(function execute() {\n   var linkAccountProp = gs.getProperty('com.glide.cs.link_account_msg');\n   var linkAccountMessage =  gs.getMessageLang(linkAccountProp, vaContext.getRequesterLang());\n   return linkAccountMessage;\n})()\n",
