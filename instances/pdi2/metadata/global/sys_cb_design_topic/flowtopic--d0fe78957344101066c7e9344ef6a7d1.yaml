          "b7f5788b078c42629bf9d2a294ae020d": {
            "id": "b7f5788b078c42629bf9d2a294ae020d",
            "name": "set Auth Type",
            "script": "(function execute() {\n    var providerApp = JSON.parse(sn_cs.VASystemObject.getProviderAppById(vaContext.providerAppId));\n    vaVars.providerId = providerApp.providerId;\n    vaVars.inboundId = providerApp.inboundId;\n    \n    var cafScriptObject = new sn_cs.CustomAdapterScriptObject();\n    var accountLinkType = cafScriptObject.getAccountLinkType(vaContext.providerAppId);\n    vaVars.authType = accountLinkType;\n\n    vaVars.identifiedUser = vaContext.identifiedUser;\n\n    vaVars.redirectToLA = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\n                                    'redirect_to_live_agent_on_softpin_failure', vaContext.providerAppId) == 'true' ? true : false;\n\n    vaVars.softPinLockoutEnabled = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\n                                    'softpin_lockout_enabled', vaContext.providerAppId) == 'true' ? true : false;\n\n    vaVars.disableContinueAsGuest = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\n                                    'disable_continue_as_guest', vaContext.providerAppId) == 'true';\n    // There is a possibility that account linking flow might be aborted by the user\n    // For example, when presented with a question if they want to enter soft PIN, they may say no. \n    // This output variable holds that information, so that the topic/topic block that calls this topic block\n    // can make informed decisions\n    vaVars.linkStatus = 'aborted';\n})()\n",
