design_definition: '{"type":"FlowTopic","triggers":[{"type":"Trigger","name":"d43873c9b25e46c187a9e5121aa44bc4","triggerType":"request","applicability":{"type":"Applicability","mode":"script","value":"true"},"id":"d43873c9b25e46c187a9e5121aa44bc4"}],"goals":[{"name":"primary","trigger_id":"d43873c9b25e46c187a9e5121aa44bc4","nodes":[{"type":"StartGoal","goal_id":"primary","greeting_msg":{"type":"String","mode":"string","value":""},"id":"b90ef5f7024d4e34b5ceaf628345df9c","name":"Start","expert_mode":false},{"type":"TerminateGoal","goal_id":"primary","confirmation_msg":{"type":"String","mode":"string","value":""},"id":"da165a652daf475698c988c6427d008f","name":"End","expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n\tvaVars.global_survey_exited = false;\n\tvar gr = new GlideRecord(''asmt_metric_type'');\n\tgr.get(vaInputs.surveyid);vaVars.active = gr.active;vaVars.endNote = vaSystem.getTranslation(gr, ''end_note'', vaContext.getRequesterLang(), gr.end_note.getValue() || '''');vaVars.introduction = vaSystem.getTranslation(gr, ''introduction'', vaContext.getRequesterLang(), gr.introduction.getValue() || '''');vaVars.surveyName = gr.name.toString();vaVars.surveyVerificationMsg = vaSystem.getSurveyVerificationMessage();\n})()","id":"4761ab4e62324e3cb07ce4efc77ffd1f","name":"Load survey instance","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    var gr = new GlideRecord(''asmt_metric_category'');\n    gr.addQuery(''metric_type'', vaInputs.surveyid);\n    gr.query();\n    gr.next();\n\n    var surveyCategory = gr.getUniqueValue();\n\n    var gr = new GlideRecord(''asmt_metric'')\n    gr.addQuery(''category'', surveyCategory);\n    gr.addQuery(''active'', true);\n    gr.orderBy(''order'');\n    gr.query();\n\n    var questions = [];\n    while (gr.next()) {\n        var question = {\n            sys_id: gr.getUniqueValue(),\n            scale: gr.scale + '''',\n            metric: gr.sys_id + '''',\n            type: gr.datatype + '''',\n            display: vaSystem.getTranslation(gr, ''question'', vaContext.getRequesterLang(), gr.question) + '''',\n            dependsOn: gr.depends_on + '''',\n            displayedWhen: gr.displayed_when + '''',\n            name: gr.name + '''',\n            max: gr.max + '''',\n            min: gr.min + '''',\n            mandatory: gr.mandatory + '''',\n            field_validation: gr.field_validation + '''',\n            reference_table: gr.reference_table + '''',\n            condition: gr.condition + '''',\n            details: gr.details + ''''\n        };\n\n        // boolean and checkbox type questions use different displayed_when fields\n        var dependsOnType = gr.depends_on.datatype + '''';\n        if (dependsOnType === ''boolean'')\n            question[''displayedWhen''] = gr.displayed_when_yesno + '''';\n        else if (dependsOnType === ''checkbox'')\n            question[''displayedWhen''] = gr.displayed_when_checkbox + '''';\n\n        questions.push(question);\n    }\n    vaVars.surveyQuestions = JSON.stringify(questions);\n    vaVars.questionCount = questions.length;\n})()","id":"bbe4918b84a9426abbec7d055f7f555a","name":"Load questions","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.questionIndex++;\n    if (!(vaVars.questionCount && vaVars.questionIndex < vaVars.questionCount))\n        return;\n\n    var i = vaVars.questionIndex;\n    var questions = JSON.parse(vaVars.surveyQuestions);\n\n    // Set question type & display value\n    vaVars.currentQuestionId = questions[i].sys_id;\n    vaVars.currentQuestionType = questions[i].type;\n    vaVars.currentQuestionMetric = questions[i].metric;\n    vaVars.currentQuestionDisplay = questions[i].display;\n    vaVars.currentQuestionMax = questions[i].max;\n    vaVars.currentQuestionMin = questions[i].min;\n    vaVars.currentQuestionMandatory = questions[i].mandatory;\n    vaVars.currentQuestionFieldValidator = questions[i].field_validation;\n    vaVars.currentQuestionReferenceTable = questions[i].reference_table;\n    vaVars.currentQuestionReferenceCondition = questions[i].condition;\n    vaVars.currentQuestionDetails = questions[i].details;\n    vaVars.currentQuestionName = questions[i].name;\n\n\n    // Load choices if relevant\n    if (questions[i].type === ''imagescale'' || vaVars.choiceTypes.split('','').indexOf(questions[i].type) > -1) {\n        questions[i].choices = getChoices(questions[i]);\n        vaVars.surveyQuestions = JSON.stringify(questions);\n    }\n})();\n\nfunction getChoices(q) {\n    var gr = new GlideRecord(''asmt_metric_definition'');\n    gr.addQuery(''metric'', q.metric);\n    gr.orderBy(''order'');\n    gr.query();\n\n    var choices = [];\n    while (gr.next()) {\n        choices.push({\n            sys_id: gr.getUniqueValue(),\n            display: vaSystem.getTranslation(gr, ''display'', vaContext.getRequesterLang(),gr.display),\n            value: gr.getValue(''value''),\n            selected: gr.getDisplayValue(''selected_image''),\n            unselected: gr.getDisplayValue(''unselected_image'')\n        });\n    }\n    return choices;\n}","id":"8ad01595341c4a6186e46eb203320658","name":"Set next question","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Out of questions?","branches":[{"type":"Branch","label":"No","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return vaVars.questionIndex < vaVars.questionCount;\n})()\n})()"},"id":"d8fd0ee61e824ea392c4e7d3686c8928","name":"No","expert_mode":false},{"type":"Branch","label":"Yes","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return vaVars.questionIndex >= vaVars.questionCount;\n})()\n})()"},"id":"9405fdbc2de54e849c796ab1933d1e1a","name":"Yes","expert_mode":false}],"id":"ca66aaa54c614102a4a2fd4bad818b9a","goal_id":"primary","expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    var answers = JSON.parse(vaVars.surveyAnswers);\n    answers[vaVars.currentQuestionId] = getInput();\n    vaVars.surveyAnswers = JSON.stringify(answers);\n})();\n\nfunction getInput() {\n    var values = {''value'': null, ''Qtype'': vaVars.currentQuestionType, ''displayValue'':null};\n    if (vaVars.choiceTypes.split('','').indexOf(vaVars.currentQuestionType) > -1) {\n        values.value = getValueIfSet(vaInputs.show_choice_question);\n        values.displayValue = getDisplayValueIfSet(vaInputs.show_choice_question,values.value);\n    }\n\n    if (vaVars.textTypes.split('','').indexOf(vaVars.currentQuestionType) > -1) {\n        values.value = getValueIfSet(vaInputs.show_text_input_question);\n        values.displayValue = getDisplayValueIfSet(vaInputs.show_text_input_question,values.value);\n    }\n\n    switch (vaVars.currentQuestionType) {\n        case ''imagescale'':\n            values.value = getValueIfSet(vaInputs.show_image_scale_question);\n            values.displayValue = getDisplayValueIfSet(vaInputs.show_image_scale_question,values.value);\n            var questions = JSON.parse(vaVars.surveyQuestions);\n            //stores correct displayValue, vaInputs returns display+value\n            if(vaInputs.show_image_scale_question && vaInputs.show_image_scale_question != null){\n                questions[vaVars.questionIndex].choices.forEach(function(c){\n                    if(c.value === values.value)\n                        values.displayValue = c.display;\n                });\n            }\n            break;\n        case ''boolean'':\n            values.value = getValueIfSet(vaInputs.show_boolean_question);\n            values.displayValue = getDisplayValueIfSet(vaInputs.show_boolean_question,values.value);\n            break;\n        case ''checkbox'':\n            values.value= getValueIfSet(vaInputs.show_boolean_question);\n            values.displayValue = getDisplayValueIfSet(vaInputs.show_boolean_question,values.value);\n            break;\n        case ''attachment'':\n            values.value = getValueIfSet(vaInputs.show_attachment_question);\n            values.displayValue = getDisplayValueIfSet(vaInputs.show_attachment_question,values.value);\n            break;\n        case ''date'':\n            const date = getValueIfSet(vaInputs.show_date_question);\n            values.value = (date != null) ? date.toString() : null;\n            values.displayValue = getDisplayValueIfSet(vaInputs.show_date_question,values.value);\n            break;\n        case ''datetime'':\n            const dateTime = getValueIfSet(vaInputs.show_datetime_question);\n            values.value = (dateTime != null) ? dateTime.toString() : null;\n            vaInputs.show_datetime_question.setTimeZone(vaContext.getDeviceTimeZone());\n            values.displayValue = getDisplayValueIfSet(vaInputs.show_datetime_question,values.value);\n            break;\n        case ''reference'':\n            values.value = getValueIfSet(vaInputs.show_reference_question);\n            values.displayValue = getDisplayValueIfSet(vaInputs.show_reference_question,values.value);\n    }\n    return values;\n}\n\nfunction getValueIfSet(field){\n    return field && field.isValueSet() ? field.getValue() : null;\n}\n\nfunction getDisplayValueIfSet(field, val){\n    if (!field || field == null)\n       return val;\n    var dv = field.getDisplayValue();\n     return dv && dv.length > 0  ? dv : val;\n}","id":"280229f5f0f74d11a6d06328dfb8fa1a","name":"Set answers","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Does question satisfy dependency?","branches":[{"type":"Branch","label":"Yes","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return vaVars.currentIsDependencySatisfied;\n})()\n})()"},"id":"d1d91449b21546908e9ab29ee6b32264","name":"Yes","expert_mode":false},{"type":"Branch","label":"No","expression":{"type":"Applicability","mode":"script","value":"(function() { return (function execute() {\n    return !vaVars.currentIsDependencySatisfied;\n})()\n})()"},"id":"2db4e60fba374a518984c95144793825","name":"No","expert_mode":false}],"id":"9ee3c8b3d800414c89edc50c2746da57","goal_id":"primary","expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    var i = vaVars.questionIndex;\n    var questions = JSON.parse(vaVars.surveyQuestions);\n    var q = questions[i];\n\n    var satisfied = true;\n    var hasDependency = !(!q.dependsOn);\n    vaVars.currentIsDependencySatisfied = !hasDependency || isSat(q);\n})();\n\nfunction isSat(q) {\n    var questions = JSON.parse(vaVars.surveyQuestions);\n    var answers = JSON.parse(vaVars.surveyAnswers);\n\n    var answerValid = false;\n    questions.forEach(function(question) {\n        if (question.metric !== q.dependsOn)\n            return;\n\n        var answerExists = question.sys_id in answers;\n        if (!answerExists)\n            return;\n\n        var selectedChoice = answers[question.sys_id][''value''];\n\n        if (question.type === ''boolean'' || question.type === ''checkbox'') {\n            if ((selectedChoice === true && q.displayedWhen === ''1'') || (selectedChoice === false && q.displayedWhen === ''0''))\n                answerValid = true;\n        } else {\n            var choices = question.choices.filter(function(c) {\n                return c.value === selectedChoice;\n            });\n\n            if (choices.length && choices[0].sys_id)\n                answerValid = q.displayedWhen.indexOf(choices[0].sys_id) !== -1;\n        }\n    });\n\n    return answerValid;\n}","id":"385869dc18c746b88db71bdd7c349c56","name":"Check question dependency","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"LibraryCall","library_topic_name":"Data Collector","library_topic_id":"4c19933e4322211006650464dbb8f22d","library_topic_is_template":false,"parameter-mappings":[{"parameter-name":"definition","value":{"type":"String","mode":"script","value":"(function execute() {\n        var config = {\n            configuration: {\"purpose\":\"{{0}}\",\"inputs\":[{\"name\":\"show_boolean_question\",\"type\":\"boolean\",\"discoverable\":false,\"description\":\"(function(vaVars, vaInputs) {return (function execute() {\\n    return ''This survey question allows users to choose between two distinct options, typically representing \\\"Yes\\\" or \\\"No,\\\" \\\"True\\\" or \\\"False,\\\" or similar binary choices. Currently you are collecting: '' + vaVars.currentQuestionName + ''. The following are additional details for '' + vaVars.currentQuestionName + '':<'' + vaVars.currentQuestionDetails +''>'';\\n})()\\n;})(_taskVaVars[{{4}}], _taskVaInputs[{{5}}])\",\"skipMode\":\"''script''\",\"skipCondition\":\"(function(vaVars, vaInputs) {return (function execute() {\\n   return vaVars.currentQuestionMandatory === ''false'';\\n})()\\n;})(_taskVaVars[{{6}}], _taskVaInputs[{{7}}])\",\"message\":\"(function(vaVars, vaInputs) {return (function execute() {\\n    return vaVars.currentQuestionDisplay;\\n})()\\n;})(_taskVaVars[{{8}}], _taskVaInputs[{{9}}])\",\"helpText\":\"false\",\"applicability\":\"(function(vaVars, vaInputs) {return (function execute() {\\n    if ((vaVars.currentQuestionType === ''boolean'') || (vaVars.currentQuestionType === ''checkbox'')) {\\n        vaInputs.show_boolean_question.setRequired(vaVars.currentQuestionMandatory);\\n        return true;\\n    }\\n        return false;\\n})();})(_taskVaVars[{{10}}], _taskVaInputs[{{11}}])\",\"validation\":\"\"}],\"instructions\":\"{{1}}\",\"advanced_parameters\":\"{{2}}\",\"callingTask\":\"{{3}}\",\"confirm_summary\":false,\"slots\":\"{{12}}\",\"applicability\":\"\",\"classificationOverrides\":[\"NEW_REQUEST\"]}\n        };\n        return JSON.stringify(config);\n    })()"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"inputs","metadata":{"type":"String","list":true,"items":[{"type":"String","mode":"string","value":"Collect user input"},{"type":"String","mode":"string","value":"The user may at any point in the conversation try to change the topic and ignore the survey question. When this happens, we need to help the user immediately by classifying NEW_REQUEST. \n\nThis is a survey and to accurately capture the user''s feedback NEVER classify as DISPLEASURE or DISCUSSION. Instead classify as ANSWER."},{"type":"String","mode":"string","value":""},{"type":"String","mode":"script","value":"(function() { return vaSystem.getConversationTaskId()})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify(vaSystem.getConversationTaskId())})()"},{"type":"String","mode":"script","value":"(function() { return JSON.stringify((function execute() {\n    return [];\n})()\n)})()"}],"use_items":true}}],"return-value-mappings":[{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"outputs","main_topic_mapped_variable_name":"ai_data_collector_8a8d038a0f75488885032aceabd284ce_output"}],"header_card_fields":[],"input_parameters_mode":"dynamic","output_parameters_mode":"dynamic","id":"8a8d038a0f75488885032aceabd284ce","name":"Show boolean question","goal_id":"primary","expert_mode":false,"variableIds":["b5790fea6a77427aaf10a8cb5ee3cef0"]},{"type":"ScriptedAction","script":"(function execute() {\n    if(vaInputs.savequestionstocontext == ''true''){ \n        vaVars.surveyInstanceId = new sn_assessment_core.AssessmentCreation().createAssessments(vaInputs.surveyid, '''', gs.getUserID(), false, '''', false, '''', vaVars._interaction_record_sysid, false, ''interaction'');\n        vaVars.surveyInstanceId = vaVars.surveyInstanceId.substring(0, 32);\n        vaVars.LiveAgent_pre_assessment_instance = vaVars.surveyInstanceId;\n        vaVars.LiveAgent_pre_chat_survey_name = vaVars.surveyName;\n    } else{ \n        var userId = !gs.nil(vaVars._topic_postchat_user_id) ? vaVars._topic_postchat_user_id : gs.getUserID();\n        vaVars.surveyInstanceId = new sn_assessment_core.AssessmentCreation().createAssessments(vaInputs.surveyid, '''', userId, false, '''', false, '''', vaVars._interaction_record_sysid, false, ''interaction'');\n        vaVars.surveyInstanceId = vaVars.surveyInstanceId.substring(0, 32);\n        vaVars.LiveAgent_post_assessment_instance = vaVars.surveyInstanceId;\n        vaVars.LiveAgent_post_chat_survey_name = vaVars.surveyName;    \n    }\n\n    var answers = JSON.parse(vaVars.surveyAnswers);\n    var data = {\n        sysparm_instance_id: vaVars.surveyInstanceId,\n        sysparm_action: ''submit''\n    };\n data.channel = ''va''; \n    var questionData = new global.TopicPreChatUtil().getQuestionData(vaVars.surveyInstanceId);\n\n    Object.keys(answers).forEach(function(q) {\n        if (answers[q] && answers[q] && answers[q].value != null){ \n            if (answers[q][''Qtype''] === ''boolean'') {\n                data[''ASMTQUESTION:'' + questionData[q].instanceID] = (answers[q][''value''] === true) ? ''1'' : ''0'';\n            } else if (answers[q][''Qtype''] === ''checkbox'') {\n                data[''ASMTQUESTION:'' + questionData[q].instanceID] = (answers[q][''value''] === true) ? ''true'' : '''';\n            } else\n                data[''ASMTQUESTION:'' + questionData[q].instanceID] = answers[q][''value''];\n            if (vaInputs.savequestionstocontext == ''true'')\n                saveToContext(questionData[q].name, answers[q], questionData[q].contextVar, questionData[q].type);\n        }\n        \n    });\n    var response = new global.AssessmentSubmitProcessor().processRequest(data);\n})()\n\nfunction saveToContext(name, a, contextVar, type){\n        if(contextVar != \"\") {\n            var contextVarName = contextVar;\n        } else {\n            //remove all special characters and replace spaces with _\n            var questionName = name.toString().replace(/[^a-zA-Z0-9]/g, ''_'').replace(/_$/,'''');     \n            //append survey name to question name\n            var contextVarName = \"liveagent_\" +vaVars.surveyName +\".\"+ questionName;\n        }\n        vaVars[contextVarName] = a.value.toString();\n        //for choice questions, store response and not response index as context var\n        if (type === ''imagescale'' || vaVars.choiceTypes.split('','').indexOf(type) > -1) { \n             vaVars[contextVarName] = a.displayValue.toString();    \n        }\n}","id":"6460cac852834b46a4977c093a2b1a67","name":"Submit survey answers","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"LibraryCall","library_topic_name":"Data Collector","library_topic_id":"4c19933e4322211006650464dbb8f22d","library_topic_is_template":false,"parameter-mappings":[{"par