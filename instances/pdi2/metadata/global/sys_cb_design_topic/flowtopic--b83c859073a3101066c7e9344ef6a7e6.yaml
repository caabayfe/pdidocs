            "inputs": {
              "notification_content": {
                "value": "(function execute() {\n    var notificationId = vaInputs.notifications;\n    var gr = new GlideRecord(\"sys_cs_notification\");\n    gr.get(notificationId);\n    var content = gr.getValue(\"content\");\n    gr.setValue(\"state\", \"sent\");\n    gr.setValue(\"conversation\", vaSystem.getConversationId());\n    gr.update();\n\n    var notifications = JSON.parse(vaVars.notifications);\n    for (var i = 0 ; i < notifications.length ; i++) {\n        if(notifications[i].sysId == notificationId) {\n           content = JSON.stringify(notifications[i].content);\n           break;\n        }\n    }\n    return content;\n})()\n",
                "mode": "script",
                "type": "String"
              }
            },
            "variableIds": [],
            "outputs": [],
            "outdatedNote": false,
            "useTemplateTopic": false
          },
