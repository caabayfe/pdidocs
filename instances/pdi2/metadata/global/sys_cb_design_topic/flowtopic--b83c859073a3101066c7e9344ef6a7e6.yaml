            "id": "0994285d7f1d42bb98af00b3bc91d3dd",
            "name": "check notification enabled",
            "script": "(function execute() {\n    if (vaSystem.isMWebAMBClient(vaContext.deviceType)) {\n        var web_client_channel_id = 'ecc77b49533100102f40ddeeff7b125d';\n        var channelGR = new GlideRecord('sys_notification_channel');\n        channelGR.get(web_client_channel_id);\n        vaVars._notifications_enabled = (channelGR.getValue('active') === '1') ? true : false;\n    } else if(vaSystem.isAMBClient(vaContext.deviceType)) {\n        var cschannel = new GlideRecord('sys_cs_channel');\n        cschannel.get('sys_id', 'b023fcb3537321106167ddeeff7b12a8');\n        vaVars._notifications_enabled = (cschannel.getValue('enable_notification') === '1') ? true : false;\n    }  else {\n        var providerAppDetails = JSON.parse(sn_cs.VASystemObject.getProviderAppById(vaContext.providerAppId));\n        var providerDetails = JSON.parse(sn_cs.VASystemObject.getProviderById(providerAppDetails.providerId));\n        var channelSysId = providerDetails.channelId;\n        \n        var cschannel = new GlideRecord('sys_cs_channel');\n        cschannel.get('sys_id', channelSysId);\n        vaVars._notifications_enabled = (cschannel.getValue('enable_notification') === '1') ? true : false;\n    }\n     vaVars.global_show_notifications_run = true;\n})()",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
