enderType(catalogId, true);\n        if (isCatalogSupported == \"conversation\")\n          vaVars.catalogId = catalogId;\n    } catch (e) {\n        gs.info(\"No Catalog Id found for this search result.\");\n    }\n    \n})()\n","id":"61bdf71c77c640f2a50d49689f2d1473","name":"Setup","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    // send feedback for specific result\n    if (vaInputs.specific_link_feedback != ''skip'') {\n        var positiveValues = AutoResolutionAISearchHelper.getAvailablePositiveFeedbackValues();\n        \n        // have to concat string to convert to correct string\n        global.AutoResolutionAISearchHelper.updateResultLineItemFeedback(vaInputs.specific_link_feedback + '''',\n            global.AutoResolutionAISearchResultLineItem.FEEDBACK_TYPE_POSITIVE, positiveValues[0].value, true);\n\n        if (vaVars.ai_search_result_id) {\n            global.AutoResolutionAISearchHelper.updateAISResultFeedback(vaVars.ai_search_result_id, \n                                global.AutoResolutionAISearchResultLineItem.FEEDBACK_TYPE_POSITIVE);\n        }\n\n    }\n})()\n","id":"91bb029143f44c42a5b8c06ff4005641","name":"Send Feedback","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    vaSystem.acceptUIBMessages(true, \"ask_genius_helpful\");\n})()\n","id":"fa37aead0eff47a4836d639a660ad677","name":"Set Genius Reference Choice","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    vaSystem.acceptUIBMessages(false, \"ask_genius_helpful\");\n})()\n","id":"22f80de33c1b48ee8c67c2a270cfbdb2","name":"Unset Genius Refer