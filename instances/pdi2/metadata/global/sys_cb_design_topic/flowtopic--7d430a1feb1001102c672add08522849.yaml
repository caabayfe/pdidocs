          "61bdf71c77c640f2a50d49689f2d1473": {
            "id": "61bdf71c77c640f2a50d49689f2d1473",
            "name": "Setup",
            "script": "(function execute() {\n    vaVars.loggingContext = JSON.stringify(global.VAAISearchHelperTokyo.getLoggingContext(vaSystem));\n    global.VAAISearchHelperTokyo.getLogger(vaVars.loggingContext).info('Starting \"IAR - AI Search\" topic');\n\n    // get results from api\n    var contextId = JSON.parse(vaVars.global_notification_context).tableSysId;\n    var aiSearchResult = global.AutoResolutionAISearchHelper.getSearchResultByContextId(contextId);\n    \n    if (aiSearchResult) {\n        vaVars.ai_search_result_id = aiSearchResult.getSysId();\n\n        // adding click metrics params\n        vaVars.user_id = aiSearchResult.getUserId();\n        vaVars.session_id = aiSearchResult.getSessionId();\n        vaVars.is_logged_in = gs.getSession().isLoggedIn();\n        vaVars.language = gs.getSession().getLanguage();\n        \n        var processedResults = global.VAAISearchHelperTokyo.processResults(aiSearchResult.getResultPayload(), vaSystem, vaInputs, vaVars);\n        var formattedResults = global.AutoResolutionAISearchHelper.formatResultsForIAR(aiSearchResult, processedResults);\n        \n        vaVars.search_metadata = formattedResults.searchMetadata;\n        vaVars.genius_results = formattedResults.geniusSearchResult;\n        vaVars.search_results = formattedResults.searchResults;\n    }\n\n    try {\n        var jsonData = JSON.parse(vaVars.genius_results);\n        var catalogId = jsonData.propValues.actions[0].actionPayload.sysId.toString();\n        var isCatalogSupported = new sn_sc.CatalogConversationHelper().getConversationalRenderType(catalogId, true);\n        if (isCatalogSupported == \"conversation\")\n          vaVars.catalogId = catalogId;\n    } catch (e) {\n        gs.info(\"No Catalog Id found for this search result.\");\n    }\n    \n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
          "91bb029143f44c42a5b8c06ff4005641": {
            "id": "91bb029143f44c42a5b8c06ff4005641",
            "name": "Send Feedback",
            "script": "(function execute() {\n    // send feedback for specific result\n    if (vaInputs.specific_link_feedback != 'skip') {\n        var positiveValues = AutoResolutionAISearchHelper.getAvailablePositiveFeedbackValues();\n        \n        // have to concat string to convert to correct string\n        global.AutoResolutionAISearchHelper.updateResultLineItemFeedback(vaInputs.specific_link_feedback + '',\n            global.AutoResolutionAISearchResultLineItem.FEEDBACK_TYPE_POSITIVE, positiveValues[0].value, true);\n\n        if (vaVars.ai_search_result_id) {\n            global.AutoResolutionAISearchHelper.updateAISResultFeedback(vaVars.ai_search_result_id, \n                                global.AutoResolutionAISearchResultLineItem.FEEDBACK_TYPE_POSITIVE);\n        }\n\n    }\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
