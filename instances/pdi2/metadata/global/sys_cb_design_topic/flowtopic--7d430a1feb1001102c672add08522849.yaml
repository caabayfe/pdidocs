            "id": "968247e074bc44029b3baec51485aa3f",
            "name": "Check Feedback Submitted",
            "script": "(function execute() {\n    var response = JSON.parse(vaVars.search_results);\n    var resultsLength = global.VAAISearchHelperTokyo.getRegularSearchDisplaySize(response);\n    vaVars.feedback_submitted = 'false';\n\n    for (i = 0; i < resultsLength; i++) {\n        var searchResult = response[i];\n        var lineItem = new global.AutoResolutionAISearchResultLineItem(searchResult.auto_resolution_line_item_sys_id);\n        if (lineItem.isFeedbackSubmitted() == true) {\n            vaVars.feedback_submitted = 'true';\n        }\n    }\n    \n})()\n",
