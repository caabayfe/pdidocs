            "id": "95684608d1034ba09ac1ef606879cc38",
            "name": "Validate Input",
            "script": "(function execute() {\n    var SMS_VERIFICATION_TYPE = '58a2f398eb6001006a668c505206fed3';\n    var GLIDE_CS_PLUGIN_ID = 'com.glide.cs';\n    vaVars.status_code = 20000;\n\n    var userId = vaInputs.userid.getValue();\n    var verificationId =vaInputs.verificationid.getValue();\n    var contextId = vaInputs.contextid.getValue();\n    \n    var pluginManager = new GlidePluginManager();\n    if (pluginManager.isActive(GLIDE_CS_PLUGIN_ID)) {\n        try {\n            var providerJsonString = sn_cs.VASystemObject.getProviderByProviderAppId(vaContext.providerAppId);\n            if (!gs.nil(providerJsonString)) {\n                var providerJson = JSON.parse(providerJsonString);\n                vaVars.channel = providerJson.channelType;\n            }\n        } catch (error) {\n            gs.warn('Plugin : [com.glide.cs] is active, but failed in sn_cs.VASystemObject.getProviderByProviderAppId');\n        }\n    }\n\n    //Check for valid sms verification\n    var passwordResetScopedUtil = new PasswordResetScopedUtil();\n    var verification = passwordResetScopedUtil.getVerificationById(verificationId);\n    if (gs.nil(verificationId) ||\n        !verification.exists() ||\n        verification.getVerificationTypeId() != SMS_VERIFICATION_TYPE) {\n        vaVars.status_code = 40003;\n        return;\n    }\n\n    //Check for valid user\n    var user = GlideUser.getUserByID(vaInputs.userid.getValue());\n    if (gs.nil(userId) ||\n        !user.exists()) {\n        vaVars.status_code = 40004; \n        return;\n    }\n\n    //Check for valid context_id\n    if (gs.nil(contextId)) {\n        vaVars.status_code = 40002;\n    }\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
