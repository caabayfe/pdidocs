))\n        custom_message = sn_cs.VASystemObject.getBotMessage(\"sms_select_provider_msg\", vaVars.inboundId, vaVars.providerId);\n    \n    message = gs.nil(custom_message) ? message : gs.getMessageLang(custom_message, vaContext.getRequesterLang());\n        \n    return message;\n})()\n"},"skippable":{"type":"Applicability","type":"Applicability","mode":"script","value":"false"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true},"expression_mode":"script","script":"(function execute() {\n    return new PasswordResetScopedUtil().getNotificationProviders();\n})()\n","metadataScript":"","cardName":"","cardFields":[],"no_options_found_message":{"type":"String","type":"String","mode":"string","value":"gs.getMessageLang(\"Providers not found\", vaContext.getRequesterLang())"},"condition":{"type":"Condition","mode":"external_script","value":"(function execute() {\n    return new PasswordResetScopedUtil().getNotificationProviders();\n})()\n"}},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    var SYSPARM_SMS_VERIFICATION_MODE = ''sysparm_sms_verification_mode'';\n    var MODE_MOBILE = ''mobile'';\n\n    if (vaVars.sms_code_verification_mode == undefined) {\n        vaVars.status_code = 40001;\n        return;\n    }\n    \n    var providerId = '''';\n    if (MODE_MOBILE == vaVars.sms_code_verification_mode.toString() &&\n        (new global.PasswordResetScopedUtil().isNotifyPluginEnabled() == false)) {\n        providerId = vaInputs.sms_providers.toString();\n    }\n\n    vaVars.device_code_status =\n        new global.PasswordResetScopedUtil().sendSMSCodeToUser(vaInputs.contextid.getValue(), vaInputs.verificationid.getValue(), vaVars.sms_code_verification_mode.toString(), providerId, vaInputs.userid.getValue());\n\n    var userInputs = [];\n    userInputs.push({\n        key: SYSPARM_SMS_VERIFICATION_MODE,\n        value: vaVars.sms_code_verification_mode.toString()\n    });\n\n    vaVars.userInputs = JSON.stringify(userInputs);\n\n    var devices = new global.PwdNotificationHelper().getSubscribedMobileDevices(vaInputs.userid.getValue(), true);\n\n    if (devices.length > 0 && devices != null) {\n        var devicesList = '''';\n        for(var i =0 ; i < devices.length ; i++) {\n            devicesList = devicesList + ''- '' + devices[i].device + ''\\n'';\n        }\n        vaVars.device_list = new global.PwdNotificationHelper().prepareMessageFromResponseCode(parseInt(vaVars.device_code_status), vaInputs.verificationid.getValue(), devicesList, vaVars.inboundId, vaVars.providerId);\n    } else {\n        var message =  gs.getMessageLang(\"Can''t send verification code as you are not enrolled.\", vaContext.getRequesterLang());\n        var custom_message = '''';\n        if (!gs.nil(vaVars.inboundId))\n            custom_message = sn_cs.VASystemObject.getBotMessage(\"sms_user_not_enrolled_msg\", vaVars.inboundId, vaVars.providerId);\n    \n        vaVars.device_list = gs.nil(custom_message) ? message : gs.getMessageLang(custom_message, vaContext.getRequesterLang());\n        vaVars.status_code = 40001;\n    }\n})()\n\n\n    \n        \n","id":"2d3fd1b9047643b4a14ad7aa1df3e764","name":"Send SMS Code","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"TextOutputPrompt","type":"TextOutputPrompt","value":[{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    return vaVars.device_list.toString();\n})()"}],"id":"d6d8f1d54c8f4985b9cae5244b34a4a9","name":"Show Devices List","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.status_code == 20000;\n})()\n"},"secure":false},{"type":"ChoiceInputPrompt","type":"ChoiceInputPrompt","expression_mode":"simple","metadataScript":"","cardName":"","cardFields":[],"id":"9f2a6a002a8f41b5a4f6e7cd9a81ef71","name":"SMS Code Choice","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    /* Return true or false to indicate if the topic or topic node can run\n       and be discoverable (or not).  For example:\n\n       var applicability = vaInputs.first_name == ''Bill'' ? true : false;\n       return applicability;\n    */\n    return vaVars.sms_code_verification_mode != undefined;\n})()"},"variable_id":"63fa0487bf4d4d959d2d2fb014ef6dff","message":{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    var message =  gs.getMessageLang(\"What would you like to do?\", vaContext.getRequesterLang());\n    var custom_message = '''';\n    if (!gs.nil(vaVars.inboundId))\n        custom_message = sn_cs.VASystemObject.getBotMessage(\"sms_select_code_choice_msg\", vaVars.inboundId, vaVars.providerId);\n    \n    message = gs.nil(custom_message) ? message : gs.getMessageLang(custom_message, vaContext.getRequesterLang());\n        \n    return message;\n})()\n\n\n\n"},"skippable":{"type":"Applicability","type":"Applicability","mode":"script","value":"false"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true}},{"type":"Decision","type":"Decision","name":"Check SMS Code Choice","branches":[{"type":"Branch","type":"Branch","label":"Resend SMS Code","expression":{"type":"Applicability","type":"Applicability","mode":"query","value":"sms_code_choice=2"},"id":"7264988dfee24783a5258b5944b4ee7f","name":"Resend SMS Code"},{"type":"Branch","type":"Branch","label":"Enter SMS Code","expression":{"type":"Applicability","type":"Applicability","mode":"query","value":"sms_code_choice=1"},"id":"304bdc2c64db43718bac0466cd2f8a96","name":"Enter SMS Code"}],"id":"e839ad90e55446959f962d061c77ea33","goal_id":"primary"},{"type":"InputPrompt","type":"InputPrompt","variable_id":"2d28081a66b64453a6d3e9664bf2c4f8","message":{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    --vaVars.remaining_attempts;\n    var message =  gs.getMessageLang(\"Enter the code you have received over SMS\", vaContext.getRequesterLang());\n    var custom_message = '''';\n    if (!gs.nil(vaVars.inboundId))\n        custom_message = sn_cs.VASystemObject.getBotMessage(\"sms_enter_code_msg\", vaVars.inboundId, vaVars.providerId);\n    \n    message = gs.nil(custom_message) ? message : gs.getMessageLang(custom_message, vaContext.getRequesterLang());\n        \n    return message;\n})()\n\n\n"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true},"skippable":{"type":"Applicability","type":"Applicability","mode":"script","value":"false"},"id":"46189bef2e1b4c788b856439fb0beb02","name":"Enter Verification Code","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"formatType":"Text","validationScript":""},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    var SYSPARM_ANSWER_SMS_CODE = ''sysparm_answer_sms_code'';\n    var userInputs = JSON.parse(vaVars.userInputs);\n    userInputs.push({ key: SYSPARM_ANSWER_SMS_CODE, value: vaInputs.enter_verification_code.getValue() });\n\n    vaVars.userInputs = JSON.stringify(userInputs);\n\n    var passwordResetScopedUtil = new global.PasswordResetScopedUtil();\n    var verification_status = passwordResetScopedUtil.verify(vaInputs.userid, '''', vaInputs.verificationid, vaInputs.contextid, userInputs);\n    vaVars.status_code = verification_status ? 20000 : 50000;\n})()\n","id":"6a500c6b88684ab289ab9065ef086918","name":"Verify SMS Code and Set Response","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    var SMS_VERIFICATION_TYPE = ''58a2f398eb6001006a668c505206fed3'';\n    var GLIDE_CS_PLUGIN_ID = ''com.glide.cs'';\n    vaVars.status_code = 20000;\n\n    var userId = vaInputs.userid.getValue();\n    var verificationId =vaInputs.verificationid.getValue();\n    var contextId = vaInputs.contextid.getValue();\n    \n    var pluginManager = new GlidePluginManager();\n    if (pluginManager.isActive(GLIDE_CS_PLUGIN_ID)) {\n        try {\n            var providerJsonString = sn_cs.VASystemObject.getProviderByProviderAppId(vaContext.providerAppId);\n            if (!gs.nil(providerJsonString)) {\n                var providerJson = JSON.parse(providerJsonString);\n                vaVars.channel = providerJson.channelType;\n            }\n        } catch (error) {\n            gs.warn(''Plugin : [com.glide.cs] is active, but failed in sn_cs.VASystemObject.getProviderByProviderAppId'');\n        }\n    }\n\n    //Check for valid sms verification\n    var passwordResetScopedUtil = new PasswordResetScopedUtil();\n    var verification = passwordResetScopedUtil.getVerificationById(verificationId);\n    if (gs.nil(verificationId) ||\n        !verification.exists() ||\n        verification.getVerificationTypeId() != SMS_VERIFICATION_TYPE) {\n        vaVars.status_code = 40003;\n        return;\n    }\n\n    //Check for valid user\n    var user = GlideUser.getUserByID(vaInputs.userid.getValue());\n    if (gs.nil(userId) ||\n        !user.exists()) {\n        vaVars.status_code = 40004; \n        return;\n    }\n\n    //Check for valid context_id\n    if (gs.nil(contextId)) {\n        vaVars.status_code = 40002;\n    }\n})()\n","id":"95684608d1034ba09ac1ef606879cc38","name":"Validate Input","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"Decision","type":"Decision","name":"Input Validation Check","branches":[{"type":"Branch","type":"Branch","label":"Valid Input","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.status_code == 20000;\n})()\n"},"id":"277ecb56fc4c4c9f9c90de4ad52b9ef7","name":"Valid Input"},{"type":"Branch","type":"Branch","label":"Invalid Input","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.status_code != 20000;\n})()\n"},"id":"50505b6504b04478bd3aedd99b38906f","name":"Invalid Input"}],"id":"150eaf73430647cc9ac6c70e21fe15c8","goal_id":"primary"},{"type":"Decision","type":"Decision","name":"Request Validation Check","branches":[{"type":"Branch","type":"Branch","label":"Valid","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.status_code == 20000;\n})()\n"},"id":"5f63a68d0f944c4cb2c44e6a27640fc9","name":"Valid"},{"type":"Branch","type":"Branch","label":"Invalid","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.status_code != 20000;\n})()\n"},"id":"8f4e215ed5b846278f222749a7da7a60","name":"Invalid"}],"id":"b54d9ca80e8042609695a15b2b81b0e9","goal_id":"primary"},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    vaVars.status = vaVars.status_code == 20000 ? ''Success'' : ''Error'';\n})()\n","id":"bc47be43b2f54dc3baa1b5d6e0a7445a","name":"Initialise Output","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"ChoiceInputPrompt","type":"ChoiceInputPrompt","expression_mode":"simple","metadataScript":"","cardName":"","cardFields":[],"id":"51bded08eb3c43f480ae97c230165d7e","name":"Reconfirm","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return (vaVars.remaining_attempts >= 0) && (vaVars.channel == vaVars.IVR_CHANNEL_ID);\n})()\n"},"variable_id":"41404e2e0065467c841211d211a79498","message":{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    var message =  gs.getMessageLang(\"You have entered {0}\", vaContext.getRequesterLang(), [vaInputs.enter_verification_code.getValue()]);\n    var custom_message = '''';\n    if (!gs.nil(vaVars.inboundId))\n        custom_message = sn_cs.VASystemObject.getBotMessage(\"sms_reconfirm_code_msg\", vaVars.inboundId, vaVars.providerId);\n    \n    message = gs.nil(custom_message) ? message : gs.getMessageLang(custom_message, vaContext.getRequesterLang(), [vaInputs.enter_verification_code.getValue()]);\n        \n    return message;\n})()\n\n"},"skippable":{"type":"Applicability","type":"Applicability","mode":"script","value":"false"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true}},{"type":"Decision","type":"Decision","name":"Confirmation","branches":[{"type":"Branch","type":"Branch","label":"Confirm","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    /* Return true or false to indicate the branch condition''s applicability.\n       For example:\n\n       var applies = vaInputs.first_name == ''Bill'' ? true : false;\n       return applies;\n    */\n    return gs.nil(vaInputs.reconfirm) || (vaInputs.reconfirm == 1);\n})()\n"},"id":"9e83e5619cac46b6878fd017c0a3813b","name":"Confirm"},{"type":"Branch","type":"Branch","label":"Re-Enter","expression":{"type":"Applicability","type":"Applicability","mode":"query","value":"reconfirm=2"},"id":"c728e8d2feda4ec2af712fc374e34b41","name":"Re-Enter"}],"id":"4a3f7b25e6d0480692b8de0636b06008","goal_id":"primary"},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    var providerAppId = vaContext.providerAppId;\n    if (!gs.nil(providerAppId)) {\n        var providerApp = JSON.parse(sn_cs.VASystemObject.getProviderAppById(vaContext.providerAppId));\n        vaVars.providerId = providerApp.providerId;\n        vaVars.inboundId = providerApp.inboundId;\n    }\n    \n})()\n","id":