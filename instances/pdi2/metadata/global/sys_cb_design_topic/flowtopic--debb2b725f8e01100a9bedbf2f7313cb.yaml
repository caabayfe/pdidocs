            "id": "6a500c6b88684ab289ab9065ef086918",
            "name": "Verify SMS Code and Set Response",
            "script": "(function execute() {\n    var SYSPARM_ANSWER_SMS_CODE = 'sysparm_answer_sms_code';\n    var userInputs = JSON.parse(vaVars.userInputs);\n    userInputs.push({ key: SYSPARM_ANSWER_SMS_CODE, value: vaInputs.enter_verification_code.getValue() });\n\n    vaVars.userInputs = JSON.stringify(userInputs);\n\n    var passwordResetScopedUtil = new global.PasswordResetScopedUtil();\n    var verification_status = passwordResetScopedUtil.verify(vaInputs.userid, '', vaInputs.verificationid, vaInputs.contextid, userInputs);\n    vaVars.status_code = verification_status ? 20000 : 50000;\n})()\n",
