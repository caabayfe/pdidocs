            "script": "(function execute() {\n    var notification_content = JSON.parse(vaInputs.notification_content);\n    var conversationLang = vaContext.getRequesterLang();\n    \n    // Card header variables\n    var cardHeading = !gs.nil(notification_content.cardHeading) ? gs.getMessageLang(notification_content.cardHeading, conversationLang) : null;\n    var cardLinkText = !gs.nil(notification_content.cardLinkText) ? gs.getMessageLang(notification_content.cardLinkText, conversationLang) : null;\n    var cardLinkUrl = !gs.nil(notification_content.cardLinkUrl) ? notification_content.cardLinkUrl : null;\n\n    // Message header variables\n    var message = gs.getMessageLang(notification_content.message, conversationLang);\n    var messageHeading = gs.getMessageLang(notification_content.messageHeading, conversationLang);\n\n    // Card body variables\n    var fields = notification_content.fields;\n    var tableLabel = notification_content.tableLabel;\n    var recordDisplayValue = notification_content.recordDisplayValue;\n    var tableName = notification_content.tableName;\n    var sysId = notification_content.recordSysId;\n    var showRecordLink = notification_content.showRecordLink;\n    var imageUrl = notification_content.imageUrl;\n    var imageAlt = notification_content.imageAlt;\n      \n    var questionAnswerPairs = [];\n    Object.keys(fields).forEach(function(a){\n        questionAnswerPairs.push({\"fieldLabel\": a, \"fieldValue\": fields[a]});\n    }) \n      \n    var cardData = {\n        \"message\": message,\n        \"messageHeading\": messageHeading,\n        \"fields\": questionAnswerPairs,\n        \"tableLabel\": !gs.nil(cardHeading) && cardHeading !== \"null\" ? cardHeading : tableLabel,\n        \"recordDisplayValue\": !gs.nil(cardLinkText) && cardLinkText !== \"null\" ? cardLinkText : recordDisplayValue,\n        \"table_name\": tableName,\n        \"sys_id\": sysId,\n        \"enableLink\": showRecordLink,\n        \"imageUrl\": imageUrl,\n        \"imageAlt\": imageAlt,\n    };\n\n    if (showRecordLink) {\n        var templatedUrl = vaSystem.applyLinkTemplate(sysId, tableName);\n        cardData.url = !gs.nil(cardLinkUrl) && cardLinkUrl !== \"null\" ? cardLinkUrl : templatedUrl;\n    }\n    \n    return vaSystem.renderCard(\"Notification\", JSON.stringify(cardData));\n})()",
