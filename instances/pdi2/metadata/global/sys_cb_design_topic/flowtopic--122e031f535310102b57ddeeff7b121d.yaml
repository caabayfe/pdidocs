m.getConversationId();\n        templateAndSmartLinkMetadataMap = sn_cs.VASystemObject.fillTemplateFromDataDeviceTypeAndConvoId(cardName, data, 'mweb', false, conversationId);\n        template = templateAndSmartLinkMetadataMap.templateKey;\n        smartLinkMetadata = templateAndSmartLinkMetadataMap.smartLinksMetadataKey;\n        iosTemplate = sn_cs.VASystemObject.fillTemplateFromDataAndDeviceType(cardName, data, 'ios', true);\n        androidTemplate = sn_cs.VASystemObject.fillTemplateFromDataAndDeviceType(cardName, data, 'android', true);\n    }\n    \n    return {\n       cardTemplate: template,\n       iosTemplate: iosTemplate,\n       androidTemplate: androidTemplate,\n       cardName: cardName,\n       cardData: data,\n       renderStyle: 'card',\n       suppressPrompt: true,\n       smartLinksMetadataKey: smartLinkMetadata,\n    };\n}"
