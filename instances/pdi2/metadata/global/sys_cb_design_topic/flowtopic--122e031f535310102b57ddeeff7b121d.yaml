 = \"Record Card\";\n        cardData.url = !gs.nil(cardLinkUrl) && cardLinkUrl !== \"null\" ? cardLinkUrl : templatedUrl;\n    };\n    \n    var data = JSON.stringify(cardData);\n    var template = \"\";\n    var iosTemplate;\n    var androidTemplate;\n    var templateAndSmartLinkMetadataMap;\n    var smartLinkMetadata;\n\n    if (vaSystem.isAMBClient(vaContext.deviceType)) {\n        var conversationId = vaSystem.getConversationId();\n        templateAndSmartLinkMetadataMap = sn_cs.VASystemObject.fillTemplateFromDataDeviceTypeAndConvoId(cardName, data, ''mweb'', false, conversationId);\n        template = templateAndSmartLinkMetadataMap.templateKey;\n        smartLinkMetadata = templateAndSmartLinkMetadataMap.smartLinksMetadataKey;\n        iosTemplate = sn_cs.VASystemObject.fillTemplateFromDataAndDeviceType(cardName, data, ''ios'', true);\n        androidTemplate = sn_cs.VASystemObject.fillTemplateFromDataAndDeviceType(cardName, data, ''android'', true);\n    }\n    \n    return {\n       cardTemplate: template,\n       iosTemplate: iosTemplate,\n       androidTemplate: androidTemplate,\n       cardName: cardName,\n       cardData: data,\n       renderStyle: ''card'',\n       suppressPrompt: true,\n       smartLinksMetadataKey: smartLinkMetadata,\n    };\n}","cardName":"","cardFields":[],"no_options_found_message":{"type":"String","mode":"string","value":"gs.getMessageLang(\"No Record Found\", vaContext.getRequesterLang())"},"condition":{"type":"Condition","mode":"glide_scripted_query","value":"(function execute() {\n    var options = [];\n    var notification_content = JSON.parse(vaInputs.notification_content);\n    var actions = notification_content.actions;\n    for (var i = 0; i < actions.length; i++) {\n        options.push({ ''value'': actions[i].actionId, ''label'': gs.getMessageLang(actions[i].label, vaContext.getRequesterLang()), ''render_style'': ''button'' });\n    }\n    return options;\n})()"},"description":""},{"type":"Decision","name":"Decision","b