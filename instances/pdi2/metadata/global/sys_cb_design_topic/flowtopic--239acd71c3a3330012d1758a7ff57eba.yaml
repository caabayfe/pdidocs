              "value": "(function execute() {\n    var quesJson = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex];\n    var response = quesJson.label;\n    var json = new JSON();\n    var infoKeys = json.getKeys(quesJson.field_info_messages);\n    var warnKeys = json.getKeys(quesJson.field_warn_messages);\n    var errKeys =  json.getKeys(quesJson.field_error_messages);\n\n    for (var j = infoKeys.length - 1; j >= 0; j--) {\n      response +=  \"\\n\" + gs.getMessageLang(\"Info\", vaContext.getRequesterLang()) + \": \" + quesJson.field_info_messages[infoKeys[j]];\n    }\n    for (j = warnKeys.length - 1; j >= 0; j--) {\n      response += \"\\n\" + gs.getMessageLang(\"Warning\", vaContext.getRequesterLang()) + \": \" + quesJson.field_warn_messages[warnKeys[j]];\n    }\n    for (j = errKeys.length - 1; j >= 0; j--) {\n      response += \"\\n\" + gs.getMessageLang(\"Error\", vaContext.getRequesterLang()) + \": \" + quesJson.field_error_messages[errKeys[j]];\n    }\n    response += \"\\n\" + gs.getMessageLang(\"Would you like to change your response?\", vaContext.getRequesterLang());\n    return response;\n})()\n",
