x is -1 initially, we reset this before search again step \n    do{\n        qIndex++;\n        var question = itemJson.variables[qIndex];\n    }\n    while(question && (!question.visible || question.readonly || question.sys_readonly));\n\n    if (question) {\n       //There are variables that we can show\n        return false;\n    }\n    //No variables that we can show\n    return true;\n})()\n"},"id":"4e6407fe09bd42a6947d62939ac19408","name":"Item with no variables","expert_mode":false},{"type":"Branch","label":"Item with variables","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var itemJson = JSON.parse(vaVars.itemJSON);\n    var qIndex = parseInt(vaVars.qIndex);\n    //qIndex is -1 initially, we reset this before search again step \n\n    do{\n        qIndex++;\n        var question = itemJson.variables[qIndex];\n    }\n    while(question && (!question.visible || question.readonly || question.sys_readonly));\n\n    if (question) {\n       //There are variables that we can show\n        return true;\n    }\n    //No variables  that we can show\n    return false;\n})()\n"},"id":"a7d389cbf035479da7c98fb3f33d5995","name":"Item with variables","expert_mode":false}],"id":"0b36051dccc04f43bfadae8b91720f27","goal_id":"primary","expert_mode":false},{"type":"TextOutputPrompt","value":[{"type":"String","mode":"string","value":"gs.getMessageLang(\"va:topic:3bffc2a5c363330012d1758a7ff57ebc:node:b29723c02c774bfc92b637faa4f34233:field:0\", vaContext.getRequesterLang())"}],"request_feedback":true,"id":"b29723c02c774bfc92b637faa4f34233","name":"Start Questions","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"secure":false},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"Questions Done","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var itemJson = JSON.parse(vaVars.itemJSON);\n    var qIndex = parseInt(vaVars.qIndex);\n    //qIndex is -1 initially, we reset this before search again step \n    do{\n        qIndex++;\n        var question = itemJson.variables[qIndex];\n    }\n    while(question && (!question.visible || question.readonly || question.sys_readonly));\n\n    if (question) {\n       //There are variables that we can show\n        return false;\n    }\n    //No variables that we can show\n    return true;\n})()"},"id":"e18e0706c9384790a54f03d5c3be2c71","name":"Questions Done","expert_mode":false},{"type":"Branch","label":"Questions Left","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n     var itemJson = JSON.parse(vaVars.itemJSON);\n    var qIndex = parseInt(vaVars.qIndex);\n    //qIndex is -1 initially, we reset this before search again step \n\n    do {\n        qIndex++;\n        var question = itemJson.variables[qIndex];\n    }\n    while(question && (!question.visible || question.readonly || question.sys_readonly));\n\n    if (question) {\n        vaVars.qIndex = qIndex;\n        return true;\n    }\n    return false;\n})()"},"id":"71ae9547692447daab0121617101208a","name":"Questions Left","expert_mode":false}],"id":"b83a3b7e4d694dea99a76acd529af6f9","goal_id":"primary","expert_mode":false},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"Catalog Item","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var itemJson = JSON.parse(vaVars.itemJSON);\n    if (itemJson.sys_class_name !== ''sc_cat_item_producer'')\n        return true;\nreturn false;\n})()\n"},"id":"d3bfd28723394406bc119816800db1d8","name":"Catalog Item","expert_mode":false},{"type":"Branch","label":"Record Producer","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var itemJson = JSON.parse(vaVars.itemJSON);\n    if (itemJson.sys_class_name === ''sc_cat_item_producer'')\n        return true;\nreturn false;\n})()\n"},"id":"b14ef64329fb4e87ad5e9a09cf6b9ab0","name":"Record Producer","expert_mode":false}],"id":"54a0cb0947934f549dfd92844411b3c9","goal_id":"primary","expert_mode":false},{"type":"InputPrompt","variable_id":"1efdcf2f469443bab274d33fd859ba49","message":{"type":"String","mode":"string","value":"gs.getMessageLang(\"va:topic:3bffc2a5c363330012d1758a7ff57ebc:node:03ddb6e3316247e1a29ee3e88693b877:field:Message\", vaContext.getRequesterLang())"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true},"request_feedback":false,"skippable":{"type":"Applicability","mode":"script","value":"false"},"skipreprompt":{"type":"Applicability","mode":"script","value":"false"},"id":"03ddb6e3316247e1a29ee3e88693b877","name":"Submit Producer","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"formatType":"Text","validationScript":"","description":""},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"Don''t Submit","expression":{"type":"Applicability","mode":"query","value":"submit_producer="},"id":"a0521f130911406fbb51177224b2d3bc","name":"Don''t Submit","expert_mode":false},{"type":"Branch","label":"Submit Now","expression":{"type":"Applicability","mode":"query","value":"submit_producer=true"},"id":"c436fc0bcecc4a8eb1665cce1489b41f","name":"Submit Now","expert_mode":false}],"id":"bd81452a9a1b46bba0dc8e99ac7537ac","goal_id":"primary","expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n   var itemJson = JSON.parse(vaVars.itemJSON);\n    var variablesObj = {};\n    var attachmentIds = [];\n    for (i = 0; i < itemJson.variables.length; i++) {\n        variablesObj[itemJson.variables[i].name] = itemJson.variables[i].value;\n        if (itemJson.variables[i].type === 33)\n           attachmentIds.push(itemJson.variables[i].value);\n    }\n   var reqObject = {\n       \"sysparm_id\" : itemJson.sys_id,\n       \"sysparm_action\" : ''execute_producer'',\n        \"variables\" : variablesObj,\n        \"engagement_channel\" : ''va''\n   }\n   var response = new sn_sc.CatItem(itemJson.sys_id).submitProducer(reqObject);\n   if (response) {\n       vaVars.record_id = response.sys_id;\n       vaVars.record_table = response.table;\n       // add attachment to record\n       var mediaLinksFormAttachment = vaVars.media_links_form_attachment.split('','');\n       for (var i in mediaLinksFormAttachment)\n           vaSystem.attachToRecord(mediaLinksFormAttachment[i], response.table, response.sys_id);\n\n       // move attachment variable to record\n       var gr = new GlideRecord(''sys_attachment'');\n       gr.addQuery(''sys_id'', ''IN'' , attachmentIds);\n       gr.query();\n       while (gr.next()) {\n           gr.setValue(''table_name'', ''ZZ_YY'' + response.table);\n           gr.setValue(''table_sys_id'', response.sys_id);\n           gr.update();\n       }\n   }\n})()\n","id":"2412f77223a04a709fc32c8e75850387","name":"Insert the Record","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"InputPrompt","variable_id":"ee4278e027464dbc9047276cfda4b036","message":{"type":"String","mode":"string","value":"gs.getMessageLang(\"va:topic:3bffc2a5c363330012d1758a7ff57ebc:node:56988cc5a07a413c951e653967010fed:field:Message\", vaContext.getRequesterLang())"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true},"request_feedback":false,"skippable":{"type":"Applicability","mode":"script","value":"false"},"skipreprompt":{"type":"Applicability","mode":"script","value":"false"},"id":"56988cc5a07a413c951e653967010fed","name":"Order Item","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"formatType":"Text","validationScript":"","description":""},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"Don''t Order","expression":{"type":"Applicability","mode":"query","value":"order_item="},"id":"b59edb2987f449e282f0516b0ee0f557","name":"Don''t Order","expert_mode":false},{"type":"Branch","label":"Order Now","expression":{"type":"Applicability","mode":"query","value":"order_item=true"},"id":"3802e83d237f400e8c648a68ae6fffc4","name":"Order Now","expert_mode":false}],"id":"019517bc2ee94230a8baada8caa4a155","goal_id":"primary","expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    var itemJson = JSON.parse(vaVars.itemJSON);\n    var cartname = \"vacart_\" + gs.generateGUID();\n    var cartObj = new sn_sc.CartJS(cartname);\n    cartObj.setRequestedFor(vaVars.request_for);\n    cartObj.setEngagementChannel(''va'');\n\n    var variablesObj = {};\n    var attachmentIds = [];\n    for (i = 0; i < itemJson.variables.length; i++) {\n        variablesObj[itemJson.variables[i].name] = itemJson.variables[i].value;\n        if (itemJson.variables[i].type === 33)\n           attachmentIds.push(itemJson.variables[i].value);\n    }\n        \n\n    var reqObj = {\n        \"sysparm_id\" : itemJson.sys_id,\n        \"variables\" : variablesObj\n    };\n    cartObj.addToCart(reqObj);\n    var requestResponse = cartObj.checkoutCart(true);\n    var requestGr = new GlideRecord(''sc_request'');\n    if (requestGr.get(requestResponse.request_id)) {\n        var reqItemGr = new GlideRecord(''sc_req_item'');\n        reqItemGr.addQuery(\"request\", requestResponse.request_id);\n        reqItemGr.query();\n        if (reqItemGr.next()) {\n            vaVars.record_id = reqItemGr.getUniqueValue();\n            vaVars.record_table = ''sc_req_item'';\n            // add attachment to record\n            var mediaLinksFormAttachment = vaVars.media_links_form_attachment.split('','');\n            for (var i in mediaLinksFormAttachment)\n                vaSystem.attachToRecord(mediaLinksFormAttachment[i], vaVars.record_table, vaVars.record_id);\n\n        }\n        // move attachment variable to record\n        var gr = new GlideRecord(''sys_attachment'');\n        gr.addQuery(''sys_id'', ''IN'' , attachmentIds);\n        gr.query();\n        while (gr.next()) {\n            gr.setValue(''table_name'', ''ZZ_YY'' + vaVars.record_table);\n            gr.setValue(''table_sys_id'', vaVars.record_id);\n            gr.update();\n        }\n    }\n})()","id":"dce2fd2f9aea4077bf04b1ba6ac992a8","name":"Checkout Cart","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"Question Requested For","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    if (JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 31)\n        return true;\n})()\n"},"id":"ea08c94d6852444d856963dca88b69f9","name":"Question Requested For","expert_mode":false},{"type":"Branch","label":"Date Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 9;\n})()\n"},"id":"54b4201c33a74f1792ad553a552c64f7","name":"Date Question","expert_mode":false},{"type":"Branch","label":"Text Type Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var type = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type;\n    return type === 2 || type === 6 || type === 16;\n})()"},"id":"8ad6a58f36314752861fc027df762388","name":"Text Type Question","expert_mode":false},{"type":"Branch","label":"Date-Time Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 10;\n})()\n"},"id":"5730ff80ca214c509bc1aeb9cc058bcd","name":"Date-Time Question","expert_mode":false},{"type":"Branch","label":"Question Label","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var question = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex];\n    return question.type === 11 || (question.type === 0 && question._internal_type === \"checkbox_container\");\n})()\n"},"id":"8db288d48ecc41cc8d4c02ebfb8b8363","name":"Question Label","expert_mode":false},{"type":"Branch","label":"Container Or Break Questions","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var type = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type;\n    if (type === 0 || type === 12 || type === 19 || type === 20 || type === 24)\n        return true;\n})()\n"},"id":"6ce94baf2b3d413e8965f87515af9530","name":"Container Or Break Questions","expert_mode":false},{"type":"Branch","label":"Unsupported  Variable  Types","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var unSupportedTypes = vaVars.unsupportedVarTypes.split('','');\n   return unSupportedTypes.indexOf(String(JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type)) !== -1;\n})()\n"},"id":"eac4771cdb0b4e61b892749345f80f89","name":"Unsupported  Variable  Types","expert_mode":false},{"type":"Branch","label":"Email Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 26;\n})()\n"},"id":"9ede820ce84642f3924d25339d58a589","name":"Email Question","expert_mode":false},{"type":"Branch","label":"Ip Address Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 28;\n})()\n"},"id":"b009a2c87ef344529658e47c208cb94f","name":"Ip Address Question","expert_mode":false},{"type":"Branch","label":"URL Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 27;\n})()\n"},"id":"3253b4573d234c88a9517f7ebd7c124c","name":"URL Question","expert_mode":false},{"type":"Branch","label":"Question Attachment","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 33;\n})()\n"},"id":"e9bcec8853614cac9d8eda3b103260fe","name":"Question Attachment","expert_mode":false},{"type":"Branch","label":"Rich Text Label Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 32;\n})()\n"},"id":"32a9b2b9a15044b89f36a814b8750c6b","name":"Rich Text Label Question","expert_mode":false},{"type":"Branch","label":"Choice or Checkbox Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var type = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type;\n    return type === 1 || type === 3 || type === 4 || type === 5 || type === 7 || type === 18 || type === 22;\n})()\n"},"id":"12143745f6114ad7bf3204c97bb13a5f","name":"Choice or Checkbox Question","expert_mode":false},{"type":"Branch","label":"Reference Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n   return JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].type === 8;\n})()"},"id":"a9c4223aa7004d1d87ebeaf21dc1e95c","name":"Reference Question","expert_mode":false}],"id":"13f599b596ac4c52b36e610ec1364786","goal_id":"primary","expert_mode":false},{"type":"InputPrompt","variable_id":"d679323216e54589b81e8c5b3229dcb8","message":{"type":"String","mode":"script","value":"(function execute() {\n   var quesJson = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex];\n   var response = quesJson.label;\n   var json = new JSON();\n   var infoKeys = json.getKeys(quesJson.field_info_messages);\n   var warnKeys = json.getKeys(quesJson.field_warn_messages);\n   var errKeys = json.getKeys(quesJson.field_error_messages);\n   \n   for (var j = infoKeys.length - 1; j >= 0; j--) {\n      response +=  \"\\n\" + gs.getMessageLang(\"Info\", vaContext.getRequesterLang()) + \": \" + quesJson.field_info_messages[infoKeys[j]];\n   }\n   for (j = warnKeys.length - 1; j >= 0; j--) {\n      response += \"\\n\" + gs.getMessageLang(\"Warning\", vaContext.getRequesterLang()) + \": \" + quesJson.field_warn_messages[warnKeys[j]];\n   }\n   for (j = errKeys.length - 1; j >= 0; j--) {\n      response += \"\\n\" + gs.getMessageLang(\"Error\", vaContext.getRequesterLang()) + \": \" + quesJson.field_error_messages[errKeys[j]];\n   }\n   return response;\n})()"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true},"request_feedback":false,"skippable":{"type":"Applicability","mode":"script","value":"(function execute() {\n   return !JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex].mandatory;\n})()\n"},"skipreprompt":{"type":"Applicability","mode":"script","value":"false"},"id":"5d527818c230458e9568ae597f0a9978","name":"Question Date","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"formatType":"Text","validationScript":"","description":""},{"type":"ScriptedAction","script":"(function execute() {\n    var itemJson = JSON.parse(vaVars.itemJSON);\n    vaVars.validation_message = \"\";\n    var quesJson = itemJson.variables[vaVars.qIndex];\n    var type = quesJson.type;\n    var vaFieldValidator = new global.VAFieldValidator();\n    // If user doesn''t want to proceed with the selected value and skips the question, the variable would be set to \"\"\n    var proceedWithDefaultValue = vaInputs.proceed_with_default.getValue();\n    switch (type) {\n        case 2:\n        case 6:\n        case 16:\n            var ans = vaInputs.question_text.getValue() || (proceedWithDefaultValue ? quesJson.display_value : \"\");\n            if (ans.trim().length === 0 && itemJson.variables[vaVars.qIndex].mandatory) {\n                vaVars.validation_message = gs.getMessageLang(''You must answer this question'', vaContext.getRequesterLang());\n                break;\n            }\n            if (type === 2) {\n                itemJson.variables[vaVars.qIndex].value = ans;\n                vaInputs.question_text = \"\";\n                break;\n            }\n            var q = GlideappQuestion.getQuestion(itemJson.variables[vaVars.qIndex].sys_id);\n            var validresponse = q.validateRegex(ans);\n            if (validresponse) {\n                itemJson.variables[vaVars.qIndex].value = ans;\n                vaInputs.question_text = \"\";\n            } else if (!validresponse)\n                vaVars.validation_message = q.getValidationMessage();\n            break;\n        case 7:\n            var ans = (proceedWithDefaultValue ? quesJson.value : \"\");\n            if (vaInputs.question_choice.getValue()) {\n                switch (vaInputs.question_choice.getValue()) {\n                    case \"yes\":\n                        ans = \"true\";\n                        break;\n                    case \"no\":\n                    case \"no_data\":\n                    case \"\":\n                        ans = \"false\";\n                        break;\n                    default:\n                        ans = \"false\";\n                        break;\n                }\n            }\n            if (itemJson.variables[vaVars.qIndex].mandatory && ans == \"false\")\n                vaVars.validation_message = gs.getMessageLang(''It is a mandatory question, you cannot select No as the answer'', vaContext.getRequesterLang());\n            else\n                itemJson.variables[vaVars.qIndex].value = ans;\n            vaInputs.question_choice = \"\";\n            break;\n        case 9:\n            itemJson.variables[vaVars.qIndex].value = vaInputs.question_date.getDisplayValue() || (proceedWithDefaultValue ? quesJson.display_value : \"\");\n            vaInputs.question_date = \"\";\n            break;\n        case 10:\n            itemJson.variables[vaVars.qIndex].value = vaInputs.question_date_time.getDisplayValue() || (proceedWithDefaultValue ? quesJson.display_value : \"\");\n            vaInputs.question_date_time = \"\";\n            break;\n        case 8:\n            var ans = (proceedWithDefaultValue ? quesJson.value : \"\");\n            if (vaInputs.question_reference)\n                ans = vaInputs.question_reference.getValue();\n\n            itemJson.variables[vaVars.qIndex].value = ans;\n            vaInputs.question_reference = \"\";\n            break;\n        case 1:\n        case 3:\n        case 4:\n        case 5:\n        case 18:\n        case 22:\n            var ans = (proceedWithDefaultValue ? quesJson.value : \"\");\n            if (vaInputs.question_choice) {\n                ans = vaInputs.question_choice.getValue();\n                ans = ans == ''no_data'' ? '''' : ans;\n            }\n            itemJson.variables[vaVars.qIndex].value = ans;\n            vaInputs.question_choice = \"\";\n            break;\n        case 26:\n            var ans = vaInputs.question_email.getValue() || (proceedWithDefaultValue ? quesJson.value : \"\");\n            if (vaInputs.question_email.getValue() || ans == \"\" || vaFieldValidator.validateEmailAddress(ans)) {\n                itemJson.variables[vaVars.qIndex].value = ans;\n                vaInputs.question_email = \"\";\n            } else\n                vaVars.validation_message = gs.getMessageLang(\"This isn''t a valid email address\", vaContext.getRequesterLang());\n            break;\n        case 27:\n            var ans = vaInputs.question_url.getValue() || (proceedWithDefaultValue ? quesJson.value : \"\");\n            if (vaInputs.question_url.getValue() || ans == \"\" || vaFieldValidator.validateURL(ans)) {\n                itemJson.variables[vaVars.qIndex].value = ans;\n                vaInputs.question_url = \"\";\n            } else\n                vaVars.validation_message = gs.getMessageLang(\"This isn''t a valid URL\", vaContext.getRequesterLang());\n            break;\n        case 28:\n            var ans = vaInputs.question_ip_address.getValue() || (proceedWithDefaultValue ? quesJson.value : \"\");\n            if (vaInputs.question_ip_address.getValue() || ans == \"\" || vaFieldValidator.validateIPAddress(ans)) {\n                itemJson.variables[vaVars.qIndex].value = ans;\n                vaInputs.question_ip_address = \"\";\n            } else\n                vaVars.validation_message = gs.getMessageLang(\"This isn''t a valid IP Address\", vaContext.getRequesterLang());\n            break;\n        case 31:\n            var ans = quesJson.default_value + '''';\n            if (quesJson.default_value && proceedWithDefaultValue)\n                vaVars.request_for = ans;\n            else if (vaVars.request_for)\n                ans = vaVars.request_for;\n            itemJson.variables[vaVars.qIndex].value = ans;\n    }\n    itemJson.variables[vaVars.qIndex].field_info_messages = {};\n    itemJson.variables[vaVars.qIndex].field_warn_messages = {};\n    itemJson.variables[vaVars.qIndex].field_error_messages = {};\n\n    if (!vaVars.request_for)\n        vaVars.request_for = gs.getUserID() + '''';\n    var executeDataLookup = false;\n    var executeDynamicValue = false;\n    if (quesJson.data_lookup_ids && quesJson.data_lookup_ids.length != 0)\n        executeDataLookup = true;\n    if (itemJson.dynamic_value_variable_config && itemJson.dynamic_value_variable_config[quesJson.sys_id] && itemJson.dynamic_value_variable_config[quesJson.sys_id].length != 0)\n        executeDynamicValue = true;\n    if (executeDataLookup || executeDynamicValue) {\n        var helper = new sn_sc.CatalogConversationHelper();\n        vaVars.itemJSON = JSON.stringify(helper.executeVariableChangeHandlers(itemJson, quesJson.sys_id, executeDataLookup, executeDynamicValue));\n    } else\n        vaVars.itemJSON = JSON.stringify(itemJson);\n\n// resetting the value of proceed with default incase validation fails\n   if (vaVars.validation_message.length !== 0)\n       vaInputs.proceed_with_default = false;\n\n})()\n","id":"16a1a697635b49049011bfb4b7300c06","name":"Post Response","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"Repeat Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.validation_message.length !== 0;\n})()\n"},"id":"f1572be27dc64588857149bf9f553a98","name":"Repeat Question","expert_mode":false},{"type":"Branch","label":"Next Question","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.validation_message.length === 0;\n})()\n"},"id":"f9d9507963664ecfbb671a2dca8dc415","name":"Next Question","expert_mode":false}],"id":"d6cc5e3effbd474bbdef055afb145637","goal_id":"primary","expert_mode":false},{"type":"ScriptOutputPrompt","output_type":"single_part","id":"2cc08096b30f45b0827119c3b5f5fa42","name":"Validation Message","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"value":{"type":"String","mode":"string","value":"(function execute() {\n      var singleOutMsg = new sn_cs.SinglePartOutMsg();\n       singleOutMsg.setTextPart(gs.getMessageLang(''{0}. Answer the question again'', vaContext.getRequesterLang(), [vaVars.validation_message]));\n       return singleOutMsg;\n})()"},"secure":false},{"type":"InputPrompt","variable_id":"49591097b4f9403ebc5d93ad049007f0","message":{"type":"String","mode":"script","value":"(function execute() {\n   var quesJson = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex];\n   var response = quesJson.label;\n   var json = new JSON();\n   var infoKeys = json.getKeys(quesJson.field_info_messages);\n   var warnKeys = json.getKeys(quesJson.field_warn_messages);\n   var errKeys = json.getKeys(ques