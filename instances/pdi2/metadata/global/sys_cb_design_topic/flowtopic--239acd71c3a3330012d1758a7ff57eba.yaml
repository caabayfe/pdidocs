ode":"script","value":"true"},"expert_mode":false,"description":""},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.validation_message = \"\";\n    var itemJson = JSON.parse(vaVars.itemJSON);\n    var quesJson = itemJson.variables[vaVars.qIndex];\n    var vaUtils = new global.VAUtils();\n    var arr = vaInputs.question_attachment.getValue().split(''/'');\n    var mediaId = arr[arr.length - 1];\n    var gr = new GlideRecord(''sys_cs_media'');\n    gr.addQuery(''media_id'', mediaId);\n    gr.query();\n    if (gr.next()) {\n        var attachmentId = gr.getValue(''sys_attachment_id'');\n        var attachRef = new GlideRecord(''sys_attachment'');\n        if (attachRef.get(attachmentId)) {\n            var file = {\n                name: attachRef.getValue(''file_name''),\n                size: attachRef.getValue(''size_bytes'')\n            };\n            var allowedExtensions = new Array();\n            if (quesJson.allow_extension)\n               allowedExtensions = quesJson.allow_extension.split('';'');\n            var field = {\n                allowedExtensions: allowedExtensions,\n                allowedFileSize: quesJson.max_file_size\n            };\n            var result = vaUtils.validateAttachment(file, field);\n            if (result.type == ''success'') {\n                quesJson.value = attachmentId;\n                vaVars.itemJSON = JSON.stringify(itemJson);\n                vaInputs.question_attachment.setValue('''');\n            } else\n                vaVars.validation_message = result.message;\n        } else \n            vaVars.validation_message = gs.getMessageLang(''Failed to upload the attachment'', vaContext.getRequesterLang());\n    } else \n        vaVars.validation_message = gs.getMessageLang(''Failed to upload the attachment'', vaContext.getRequesterLang());\n})()\n","id":"e31ef9e4ec54417eb9590f00c1a3377a","name":"Validate Attachment","goal_id":"primary","applicability":{"type":"Applicability","mode":"query","va