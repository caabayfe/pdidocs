design_definition: '{"type":"FlowTopic","triggers":[{"type":"Trigger","name":"bafb5d79c1c94055baaef2e048e1f966","triggerType":"request","applicability":{"type":"Applicability","mode":"script","value":"true"},"id":"bafb5d79c1c94055baaef2e048e1f966"}],"goals":[{"name":"primary","trigger_id":"bafb5d79c1c94055baaef2e048e1f966","nodes":[{"type":"StartGoal","goal_id":"primary","greeting_msg":{"type":"String","mode":"string","value":""},"id":"d2044dface7044d5ad4ce7c07639e590","name":"Start"},{"type":"TerminateGoal","goal_id":"primary","confirmation_msg":{"type":"String","mode":"string","value":""},"id":"d04c47bf1b7b42219679d037dde1f706","name":"End"},{"type":"ScriptedAction","script":"(function execute() {\n    if (vaVars.softpinRetryCount == 0) {\n        vaVars.softpinRetryCount = 1;\n    } else {\n        CustomAdapterSoftPinHelper.recordInvalidAttempt(vaContext.providerAppId, vaContext.providerUserId);\n        vaVars.softpinRetryCount = vaVars.softpinRetryCount + 1;\n    }\n})()\n","id":"cb26e271f53e4f0eaea239827dad56de","name":"SoftPin Retry : Increment retry count","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.identifiedUser = vaInputs.identifieduser.getValue();\n    vaVars.softpinRetryCount = vaInputs.softpinretrycount.getValue();\n    vaVars.softPinLockoutEnabled = vaInputs.softpinlockoutenabled.getValue();\n    vaVars.inboundId = vaInputs.inboundid.getValue();\n    vaVars.providerId = vaInputs.providerid.getValue();\n    vaVars.redirectToLA = vaInputs.redirecttola.getValue();\n})()\n","id":"1e603b3abf7c437796e94989a70c7c78","name":"set inputs","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"LibraryCall","library_topic_name":"SoftPIN Verification","library_topic_id":"decd38545382011017c3ddeeff7b127f","library_topic_is_template":false,"parameter-mappings":[{"parameter-name":"userid","value":{"type":"String","mode":"string","value":"{{vaInputs.identifieduser}}"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"verificationid","value":{"type":"String","mode":"script","value":"(function execute() {\n    var verificationQuestionId = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\"verification_question_id\", vaContext.providerAppId);\n    return verificationQuestionId;\n})()\n"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"contextid","value":{"type":"String","mode":"script","value":"(function execute() {\n    return vaSystem.getConversationId();\n})()\n"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}}],"return-value-mappings":[{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"status","main_topic_mapped_variable_name":"vq_status"}],"id":"eedf04585a7a481c952c8f1bcc047ff2","name":"_verification_question_topic_block","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"Decision","name":"qna_userVerified","branches":[{"type":"Branch","label":"User not verified","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var MAX_RETRY_COUNT = parseInt(sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\"softpin_max_retry_attempts\", vaContext.providerAppId)) || vaVars.defaultMaxSoftPinInvalidAttempts;\n    var value = vaInputs.vq_status.getValue() == \"Error\"  && vaVars.softpinRetryCount>= MAX_RETRY_COUNT;\n\n    return value;\n})()\n"},"id":"079f3b6755f446e2af067e910dd23a72","name":"User not verified"},{"type":"Branch","label":"Should Retry - staus_Error","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    var MAX_RETRY_COUNT = parseInt(sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\"softpin_max_retry_attempts\", vaContext.providerAppId)) || vaVars.defaultMaxSoftPinInvalidAttempts;\n    var value =  vaInputs.vq_status.getValue() == \"Error\" && vaVars.softpinRetryCount < MAX_RETRY_COUNT;\n    return value;\n})()\n"},"id":"8e3475c488a448adaf8d6e02936898bc","name":"Should Retry - staus_Error"},{"type":"Branch","label":"UserVerified - status_Success","expression":{"type":"Applicability","mode":"query","value":"vq_status=Success"},"id":"f5409ffb1b394fc9accde69d1a6dd013","name":"UserVerified - status_Success"}],"id":"b74b8fddb2674afa8f3a6b021ecf7d74","goal_id":"primary"},{"type":"ScriptedAction","script":"(function execute() {\n    var providerAppId = vaContext.providerAppId;\n    var retryInterval = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(''softpin_max_invalid_attempts_interval_hrs'', providerAppId);\n    \n    if (vaVars.softPinLockoutEnabled)\n        vaVars.softpinRetryCount = CustomAdapterSoftPinHelper.getInvalidAttemptsForUserInInterval(providerAppId, vaContext.providerUserId, retryInterval);\n    \n    vaVars.defaultMaxSoftPinInvalidAttempts = CustomAdapterSoftPinHelper.DEFAULT_MAX_INVALID_ATTEMPTS;\n})()\n","id":"f19fdd12474b4788b8c6dc822dceee16","name":"SoftPin Retry: Initialize","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"Decision","name":"SoftPIN Lockout Enabled","branches":[{"type":"Branch","label":"Yes","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.softPinLockoutEnabled == true;\n})()\n"},"id":"6efe4e79fe9d4e08a46eeb4365ef0af3","name":"Yes"},{"type":"Branch","label":"No","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.softPinLockoutEnabled == false;\n})()\n"},"id":"8901a92c052746d480f199a74a33be23","name":"No"}],"id":"ed061e944fb2494c99e1d18b0396c2fe","goal_id":"primary"},{"type":"ScriptedAction","script":"(function execute() {\n    CustomAdapterSoftPinHelper.recordInvalidAttempt(vaContext.providerAppId, vaContext.providerUserId);\n    \n    // If soft pin lockout is enabled, we will set this flag so that the calling topic knows that they\n    // should connect to LA\n    if (vaVars.softPinLockoutEnabled)\n        vaVars.connectToLA = true;\n})()\n","id":"fe8ee7a6a0cb4dadbb41fd72c90ecb09","name":"Record Invalid SoftPin Attempt","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.linkStatus = ''failure'';\n})()\n","id":"be8a47f5cbde4eb0b025b7a6dbbd9c22","name":"Set Link Status to Failure","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"TextOutputPrompt","value":[{"type":"String","mode":"script","value":"(function execute() {\n    var USER_NOT_ENROLLED_CODE = \"40001\";\n    var INCORRECT_PIN_CODE = \"50000\";\n    var CONFIGURATION_ISSUE = \"40002\";\n    \n    var defaultMsg = \"Something went wrong. We’re going to transfer you to an agent. Please hold.\"; // config issue\n    var custom_message_key = \"link_account_unexpected_error_msg\";\n\n    var custom_message = sn_cs.VASystemObject.getBotMessage(custom_message_key, vaVars.inboundId, vaVars.providerId);\n\n    var prompt = custom_message || defaultMsg;\n    return gs.getMessageLang(prompt, vaContext.getRequesterLang());\n   \n})()\n"}],"id":"80675cf459854d96b0d6cc2c05625407","name":"Auth Failed","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"ScriptedAction","script":"(function execute() {\n    gs.error(\"User : \" + vaVars.identifiedUser + \" Authentication failed : topic block: SoftPIN\" );\n    //For SMS, will not connect to live agent directly, will go through topic picker in order for Setup/Reset PIN topic block to show up\n    if (vaVars.redirectToLA)\n        vaVars.connectToLA = true;\n})()\n","id":"aa6a33ff76764ef69d3474f27c0b8435","name":"Set ConnectToLA variable","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"TextOutputPrompt","value":[{"type":"String","mode":"script","value":"(function execute() {\n    var defaultMsg = \"The response you provided is incorrect. Please try again.\";\n    var custom_message = sn_cs.VASystemObject.getBotMessage(\"invalid_pin_retry_msg\", vaVars.inboundId, vaVars.providerId);\n    var prompt = custom_message || defaultMsg;\n    return gs.getMessageLang(prompt, vaContext.getRequesterLang());\n})()\n"}],"id":"c7024765d1d6426c89cfcfafedf209db","name":"Retry Message","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"ScriptedAction","script":"(function execute() {\n    \n    if (vaVars.softPinLockoutEnabled) {\n        CustomAdapterSoftPinHelper.markInvalidAttemptsInactive(vaContext.providerAppId, \n                                                                vaContext.providerUserId);\n    }\n})()\n","id":"7efce0d5daa2426f8d723bdde6031245","name":"Reset SoftPIN Metadata for User","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.linkStatus = ''success'';\n})()\n","id":"83361ac8b9d14a63b29350c18e81f82b","name":"Set Link Status to Success","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"LibraryCall","library_topic_name":"MFA_link_account","library_topic_id":"e93e3a92eba71110da1861c59c5228dd","library_topic_is_template":false,"parameter-mappings":[{"parameter-name":"authtype","value":{"type":"String","mode":"string","value":"{{vaInputs.authtype}}"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"identifieduser","value":{"type":"String","mode":"string","value":"{{vaVars.identifiedUser}}"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"inboundid","value":{"type":"String","mode":"str