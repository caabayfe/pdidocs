            "id": "cb26e271f53e4f0eaea239827dad56de",
            "name": "SoftPin Retry : Increment retry count",
            "script": "(function execute() {\n    if (vaVars.softpinRetryCount == 0) {\n        vaVars.softpinRetryCount = 1;\n    } else {\n        CustomAdapterSoftPinHelper.recordInvalidAttempt(vaContext.providerAppId, vaContext.providerUserId);\n        vaVars.softpinRetryCount = vaVars.softpinRetryCount + 1;\n    }\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
