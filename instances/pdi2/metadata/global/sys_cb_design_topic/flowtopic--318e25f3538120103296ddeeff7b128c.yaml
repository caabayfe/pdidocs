            "name": "Calculate Request Id",
            "script": "(function execute() {\n    if (vaVars.catalogRecordTable.toString() == \"sc_req_item\") {\n        var gr = new GlideRecord(\"sc_req_item\");\n        gr.addQuery('sys_id', vaVars.catalogRecordId.toString());\n        gr.query();\n        if(gr.next()) {\n            vaVars.reqItemId = gr.getValue(\"sys_id\");\n        }\n    } else {\n        vaVars.reqItemId = vaVars.catalogRecordId.toString();\n    }\n\n    vaVars.requestTable = vaVars.catalogRecordTable.toString();\n})()\n\n",
