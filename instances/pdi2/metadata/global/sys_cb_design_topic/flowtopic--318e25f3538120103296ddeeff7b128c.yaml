          "bf701dc1c59347728037a98fa3df797c": {
            "id": "bf701dc1c59347728037a98fa3df797c",
            "name": "Get Catalog Id",
            "script": "(function execute() {\n    try {\n        var jsonData = JSON.parse(vaVars.geniusResults);\n        var catalogId = jsonData.propValues.actions[0].actionPayload.sysId.toString();\n        \n        vaVars.catalogRenderType = global.VAAISearchHelperXanadu.getConversationalRenderType(catalogId, vaContext.deviceType);\n        \n        if (vaVars.catalogRenderType == \"conversation\" || vaVars.catalogRenderType == \"inline-seismic\") {\n            vaVars.catalogId = catalogId;\n        }\n    } catch (e) {\n        global.VAAISearchHelperTokyo.getLogger(vaVars.loggingContext).warn('No Catalog Id found for this search result.');\n    }\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
