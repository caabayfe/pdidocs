          "81ae0846d9a04fd185f833beabff5b22": {
            "id": "81ae0846d9a04fd185f833beabff5b22",
            "name": "Calculate Request Id",
            "script": "(function execute() {\n    // Special handling for requests in sc_req_item\n    if (!gs.nil(vaVars.requestTable)) {\n        if (vaVars.requestTable.toString() == \"sc_request\") {\n            var grRequest = new GlideRecord(\"sc_request\");\n            grRequest.addQuery(\"number\", vaVars.requestId);\n            grRequest.query();\n            if(grRequest.next()) {\n                var grReqItem = new GlideRecord(\"sc_req_item\");\n                grReqItem.addQuery(\"request\", grRequest.sys_id);\n                grReqItem.query();\n                if(grReqItem.next()) {\n                    vaVars.reqItemId = grReqItem.getValue(\"sys_id\");\n                    vaVars.requestTable = \"sc_req_item\";\n                }\n            }\n        } else {\n            var grTable = new GlideRecord(vaVars.requestTable.toString());\n            grTable.addQuery(\"number\", vaVars.requestId);\n            grTable.query();\n            if (grTable.next()) {\n                vaVars.reqItemId = grTable.getValue(\"sys_id\");\n            }\n        }\n    }\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            },
            "cardMetadata": {
              "mode": "card",
