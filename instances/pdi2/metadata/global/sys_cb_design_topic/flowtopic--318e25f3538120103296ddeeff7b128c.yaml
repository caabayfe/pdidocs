            "name": "Process Results",
            "script": "(function execute() {\n    var now = new GlideDateTime().getNumericValue();\n    var elapsedTime = now - vaVars.startTime;\n    var returnTime = now - vaInputs.end_time;\n    var logger = global.VAAISearchHelper.getLogger(vaVars.loggingContext);\n    logger.debug('AI Search FDIH action time: {0}ms', elapsedTime);\n    logger.debug('AI Search FDIH returned to VA in {0}ms', returnTime);\n\n    var results = JSON.stringify(global.VAAISearchHelper.filterResultsForLoggedInUser(\n        vaInputs.search_result.toString(), vaSystem, vaVars.loggingContext));\n\n    var processedResults = global.VAAISearchHelperUtah.processResults(results, vaSystem, vaInputs, vaVars);\n    vaVars.searchMetadata = processedResults.searchMetadata;\n    vaVars.geniusResults = processedResults.geniusSearchResults;\n    vaVars.searchResults = processedResults.searchResults;\n    if (!gs.nil(vaVars.searchMetadata) && vaVars.searchMetadata != \"{}\")\n        logger.debug('AI Search performed on server in {0}ms',\n            JSON.parse(vaVars.searchMetadata).glide_signals.searchResultMetadata.responseTimeInMs);\n})()",
