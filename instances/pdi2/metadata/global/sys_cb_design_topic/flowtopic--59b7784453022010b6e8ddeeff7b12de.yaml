seObj.status == ''OK'') {\n\t\t\tvaVars.latitude = geolocationResponseObj.latitude;\n\t\t\tvaVars.longitude = geolocationResponseObj.longitude;\n\t\t} else {\n\t\t\tvaVars.errorType = geolocationResponseObj.errorType;\n\t\t\tif (geolocationResponseObj.hasOwnProperty(''errorMessage'')) {\n\t\t\t\tvaVars.errorMessage = geolocationResponseObj.errorMessage;\n\t\t\t}\n\t\t}\n\n\t\tif (geolocationResponseObj.hasOwnProperty(''isGeoPermissionGrantedForNextUse'')) {\n\t\t\tvaVars.global_is_geolocation_permission_granted = geolocationResponseObj.isGeoPermissionGrantedForNextUse;\n\t\t}\n\t}\n\n})()","id":"94c8d0930dfd4e47be7df0e7f4aa5967","name":"Record output","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}}],"edges":[{"type":"Edge","source_node_id":"180b3121614b4a049c13e2effa657c9c","target_node_id":"94c8d0930dfd4e47be7df0e7f4aa5967","branch_id":"6f8e8e7c00354fd1a13d6fc14ed827a1","id":"0bf55b12ae414f2797c8ad608d7398cc","name":"6f8e8e7c00354fd1a13d6fc14ed827a1"},{"type":"Edge","source_node_id":"86b7d83a7a4641bd9f38c5fb6a81ebe6","target_node_id":"57d5fe598cbb40f8b4ef8528a0472c2e","id":"89e32470e6fb41d79ac3b938fe614e47"},{"type":"Edge","source_node_id":"57d5fe598cbb40f8b4ef8528a0472c2e","target_node_id":"26e2bda364894708acbd80938dffd97a","branch_id":"53f7190dea4d45ea855856bfbfa87cda","id":"614adfc0e9be44038012ee841fdced9f","name":"53f7190dea4d45ea855856bfbfa87cda"},{"type":"Edge","source_node_id":"26e2bda364894708acbd80938dffd97a","target_node_id":"180b3121614b4a049c13e2effa657c9c","id":"2308579d79814f40a83c4e744c5867c4"},{"type":"Edge","source_node_id":"180b3121614b4a049c13e2effa657c9c","target_node_id":"78562d92fdcd4f418e50acaf1444c8ce","branch_id":"ae658c885142439aa784eb9f796a35a1","id":"6097d8fd7896411a859416428b1be595","name":"ae658c885142439aa784eb9f796a35a1"},{"type":"Edge","source_node_id":"57d5fe598cbb40f8b4ef8528a0472c2e","target_node_id":"78562d92fdcd4f418e50acaf1444c8ce","branch_id":"d1d1f100a0fa4d6896baff1f5fee98f9","id"