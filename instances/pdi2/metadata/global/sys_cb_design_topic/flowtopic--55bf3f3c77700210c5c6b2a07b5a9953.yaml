design_definition: '{"type":"FlowTopic","triggers":[{"type":"Trigger","name":"96ac401a86da4c4ca8c580384d69e4a9","triggerType":"request","applicability":{"type":"Applicability","mode":"script","value":"true"},"id":"96ac401a86da4c4ca8c580384d69e4a9"}],"goals":[{"name":"primary","trigger_id":"96ac401a86da4c4ca8c580384d69e4a9","nodes":[{"type":"StartGoal","goal_id":"primary","greeting_msg":{"type":"String","mode":"string","value":""},"id":"b28c8757a8c147838ec362764002cc21","name":"Start","expert_mode":false},{"type":"CustomNode","name":"CATALOG_ITEM_VA_CONTROL","mode":"input","generateDataFunction":"function execute() {\n    var variableValues = vaInputs.variablevalues.getValue();\n    if (JSUtil.notNil(variableValues) && gs.getProperty(ServiceCatalogConstantsSNC.PROPERTIES.SC_ENABLE_URL_PREFILL, \"true\") == \"true\" ) {\n        try {\n            variableValues = JSON.parse(variableValues);\n        } catch(e) {\n            variableValues = {};\n        }\n    } else {\n         variableValues = {};\n    }\n    if (gs.nil(vaInputs.requestedfor)) \n        return { ''sysId'': vaInputs.sysid.getValue(), ''forceCloseControl'': vaInputs.forceclosecontrol.getValue(), ''outputValue'': vaInputs.outputvalue.getValue(), ''catalogItemName'': vaVars.catalogItemName, ''bare'': true, ''variableValues'': variableValues };\n    else\n        return { ''sysId'': vaInputs.sysid.getValue(), ''requestedFor'': vaInputs.requestedfor.getValue(), ''forceCloseControl'': vaInputs.forceclosecontrol.getValue(), ''outputValue'': vaInputs.outputvalue.getValue(), ''catalogItemName'': vaVars.catalogItemName, ''bare'': true, ''variableValues'': variableValues  };\n}\n","messageTranscriptFunction":"function execute(controlData) {\n    return gs.getMessage(''The Custom Control Catalog item VA just rendered item: {0}'', controlData.catalogItemName);\n}","inputResponseHandlerFunction":"function execute(controlData, responseValue) {\n    if (responseValue && responseValue.status == \"SUCCESS\" && responseValue.requestTable == \"sc_request\" && responseValue.requestId != \"\") {\n        var gr = new GlideRecord(\"sc_req_item\");\n        gr.addEncodedQuery(\"request=\" + responseValue.requestId);\n        gr.query();\n        if (gr.next()) {\n            responseValue.requestTable = \"sc_req_item\";\n            responseValue.requestId = gr.getUniqueValue();\n        }\n    }\n    vaVars.responseFromComponent = JSON.stringify(responseValue);\n}\n","inputResponseMessageTranscriptFunction":"function execute(controlData, responseValue) {\n    if (responseValue.status == ''SUCCESS'')\n        return gs.getMessage(''Catalog item request completed'');\n    else if (responseValue.status == ''CANCELED'')\n        return gs.getMessage(''Catalog item request cancelled'');\n\n    return gs.getMessage(''Status for catalog item request is: {0}'', [responseValue.status]);\n}","skippable":{"type":"Applicability","mode":"script","value":"false"},"unsupportedDeviceMessage":{"type":"String","mode":"string","value":"Sorry, this channel is not supported."},"id":"2ab5e7535adf41d3999f6d67aa8a19e8","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"TerminateGoal","goal_id":"primary","confirmation_msg":{"type":"String","mode":"string","value":""},"id":"2cf6986802d049e297ef20fc8b390f76","name":"End","expert_mode":false},{"type":"Decision","name":"Decision","branches":[{"type":"Branch","label":"SysID empty","expression":{"type":"Applicability","mode":"query","value":"sysidISEMPTY"},"id":"9a3918ee703646a3beeeb174b95bcaba","name":"SysID empty","expert_mode":false},{"type":"Branch","label":"SysID not empty","expression":{"type":"Applicability","mode":"query","value":"sysidISNOTEMPTY"},"id":"150d088032ea4648b97e88595225321f","name":"SysID not empty","expert_mode":false}],"id":"e60c9bdddc1d4e1fa4b485626b4daa6f","goal_id":"primary","expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.catalogItemName = \"\";\n    var item = GlideappCatalogItem.get(vaInputs.sysid.getValue());\n    if (item)\n        vaVars.catalogItemName = item.getName();\n})()\n","id":"29b73f5e2eaf430ca20fb02f3834c8ac","name":"Compute Item Name","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false}],"edges":[{"type":"Edge","source_node_id":"2ab5e7535adf41d3999f6d67aa8a19e8","target_node_id":"2cf6986802d049e297ef20fc8b390f76","id":"9520f9a1e21b415c86a5091934e5f6ee"},{"type":"Edge","source_node_id":"b28c8757a8c147838ec362764002cc21","target_node_id":"e60c9bdddc1d4e1fa4b485626b4daa6f","id":"a69479ae2c7a4f81897fb08669b8acbd"},{"type":"Edge","source_node_id":"e60c9bdddc1d4e1fa4b485626b4daa6f","target_node_id":"2cf6986802d049e297ef20fc8b390f76","branch_id":"9a3918ee703646a3beeeb174b95bcaba","id":"cbbb931af3df4a479f630da1a8afbb3d","name":"9a3918ee703646a3beeeb174b95bcaba"},{"type":"Edge","source_node_id":"e60c9bdddc1d4e1fa4b485626b4daa6f","target_node_id":"29b73f5e2eaf430ca20fb02f3834c8ac","branch_id":"150d088032ea4648b97e88595225321f","id":"1432a33cf78f4f5f8e917f9c1b9bddd0","name":"150d088032ea4648b97e88595225321f"},{"type":"Edge","source_node_id":"29b73f5e2eaf430ca20fb02f3834c8ac","target_node_id":"2ab5e7535adf41d3999f6d67aa8a19e8","id":"78c739591cfe45c6bc12ca66cee4adcb"}],"id":"primary"}],"script_variables":[{"type":"String","name":"responseFromComponent","value":{"type":"String","mode":"string"},"list":false,"id":"8d969f87e13b4cfe9807f68a133a0bf1","formatType":"text","secure":false,"sensitive":false,"aiInput":false},{"type":"String","name":"catalogItemName","value":{"type":"String","mode":"string"},"list":false,"id":"06d23bd9ea664b3cb381d5cb13eb9319","formatType":"text","secure":false,"sensitive":false,"aiInput":false}],"glide_variables":[{"type":"Reference","table":"sys_user","auto_select":false,"id":"current-user","name":"user","formatType":"text","secure":false,"sensitive":false,"aiInput":false,"list":false},{"type":"String