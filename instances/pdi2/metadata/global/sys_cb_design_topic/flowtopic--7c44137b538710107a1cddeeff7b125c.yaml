            }
          },
          "7ec718a8c47b4fc98aa9e1463325008d": {
            "id": "7ec718a8c47b4fc98aa9e1463325008d",
            "name": "Mark Task Resolved",
            "script": "(function execute() {\n\n    var helper = new global.AutoResolutionContextHelper();\n    helper.executeTemplate(helper.RESOLVED, vaVars.auto_resolution_context_id, vaVars.loggingContext);\n\n    var logger = new global.AutoResolutionLoggingUtils()\n                        .withName('topic')\n                        .withContext(vaVars.loggingContext)\n                        .createLogger();\n    logger.info('User decided to mark the task={0} as resolved', vaVars.task_id);\n    \n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
          "9425a0357c314d708f3972dcdcaed14c": {
            "id": "9425a0357c314d708f3972dcdcaed14c",
            "stepType": "TextOutput",
            "name": "Unable to Proceed",
            "value": [
              {
                "value": "(function execute() {\n\n    var logger = new global.AutoResolutionLoggingUtils()\n                        .withName('topic')\n                        .withContext(vaVars.loggingContext)\n                        .createLogger();\n    var message;\n\n    if (vaVars.is_notification_expired || vaVars.is_notification_accepted)\n        message =  gs.getMessageLang(\"It looks like another agent is already working on your incident. I won’t be able to help you at this time.\");\n    else\n        message =  gs.getMessageLang(\"I’m currently unable to help with your request.\");\n\n    logger.info('Unable to proceed with Auto-resolution topic, reason={0}', message);\n    return message;\n\n})()\n",
                "mode": "script"
              }
            ],
            "applicability": {
              "value": "",
              "mode": "query"
            },
            "secure": false,
            "requestFeedback": true
          },
