          "5f245cbc4b12423f95bf6575fa767ace": {
            "id": "5f245cbc4b12423f95bf6575fa767ace",
            "name": "Unassign Task and keep task open",
            "script": "(function execute() {\n    \n   var helper = new global.AutoResolutionContextHelper();\n   helper.executeTemplate(helper.UNRESOLVED, vaVars.auto_resolution_context_id, vaVars.loggingContext);\n\n   var logger = new global.AutoResolutionLoggingUtils()\n                        .withName('topic')\n                        .withContext(vaVars.loggingContext)\n                        .createLogger();\n    logger.info('User decided to keep the task={0} open', vaVars.task_id);\n\n})()\n",
