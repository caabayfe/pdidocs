ipt","order":0,"required":true,"value":[{"type":"String","mode":"script","value":"(function execute() {\n    return vaVars.startTime;\n})()\n"}],"is_list_data_entry":false},{"supported_input_modes":[],"name":"additional_context","order":0,"required":false,"value":[],"is_list_data_entry":false},{"supported_input_modes":[],"name":"gr_config_filter","order":0,"required":false,"value":[],"is_list_data_entry":false},{"supported_input_modes":[],"name":"search_result_type","order":0,"required":false,"value":[],"is_list_data_entry":false}],"outputs":[{"name":"search_result","order":0,"value":[],"is_list_data_entry":false,"topicVariableName":"search_result"},{"name":"__action_status__","order":0,"value":[],"is_list_data_entry":false,"topicVariableName":"action_status"},{"name":"__dont_treat_as_error__","order":0,"value":[],"is_list_data_entry":false,"topicVariableName":"don_t_treat_as_error"},{"name":"end_time","order":0,"value":[],"is_list_data_entry":false,"topicVariableName":"end_time"}],"metadata":{"runAs":"session_user"},"id":"298ddf999e3d4fb68803b2f7818e0aee","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false,"sys_id":"2eaf23715b621010a76b04d13d81c7b5","scope":"global"},{"type":"ScriptedAction","script":"(function execute() {\n    var now = new GlideDateTime().getNumericValue();\n    var elapsedTime = now - vaVars.startTime;\n    var returnTime = now - vaInputs.end_time;\n    var logger = global.VAAISearchHelperTokyo.getLogger(vaVars.loggingContext);\n    logger.debug(''AI Search FDIH action time: {0}ms'', elapsedTime);\n    logger.debug(''AI Search FDIH returned to VA in {0}ms'', returnTime);\n\n    var results = JSON.stringify(global.VAAISearchHelperTokyo.filterResultsForLoggedInUser(\n        vaInputs.search_result.toString(), vaSystem, vaVars.loggingContext));\n\n    var processedResults = global.VAAISearchHelperUtah.processResults(results, vaSystem, vaInputs, vaVars);\n    vaVars.searchMetadata = processedResults.searchMetadata;\n    vaVars.geniusResults = processedResults.geniusSearchResults;\n    vaVars.searchResults = processedResults.searchResults;\n    vaVars.errors = processedResults.errors;\n    if (!gs.nil(vaVars.searchMetadata) && vaVars.searchMetadata != \"{}\")\n        logger.debug(''AI Search performed on server in {0}ms'',\n            JSON.parse(vaVars.searchMetadata).glide_signals.searchResultMetadata.responseTimeInMs);\n\n})()","id":"c420857cfd1c4ed2bacf8e07bb4ad6f5","name":"Process Results","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.loggingContext = JSON.stringify(global.VAAISearchHelperTokyo.getLoggingContext(vaSystem));\n    global.VAAISearchHelperTokyo.getLogger(vaVars.loggingContext).debug(''Starting \"Run AI Search\" topic block'');\n    vaVars.startTime = new GlideDateTime().getNumericValue();\n    vaVars.isSearchAvailable = global.VAAISearchHelperTokyo.isSearchEnabled(vaVars.loggingContext);\n\n    // This script has to run before any other operations to collect correct info.\n    // If the node runs under the platform thread, the info can be incorrect.\n    vaVars.session_id = gs.getSessionID();\n    vaVars.user_id = vaInputs.user.getValue();\n    vaVars.is_logged_in = gs.getSession().isLoggedIn();\n    vaVars.language = gs.getSession().getLanguage();\n    //AI Search start timestamp\n    vaVars.time = global.VAClickMetrics.getCurrentTime();\n})()\n","id":"b25c83ae549d4d3c98b39ea2a2f6fe9d","name":"Collect Search Info","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false},{"type":"Decision","name":"Search Enabled?","branches":[{"type":"Branch","label":"Yes","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.isSearchAvailable;\n})()\n"},"id":"e0a2854015324cdd800d94c1e85efd36","name":"Yes","expert