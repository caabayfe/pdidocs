              "value": "(function execute() {\n    /* Code your script logic here. For example, you might want to call an external web service\n       to find the best local Italian restaurants.  Call a Restaurants Web Service then use the results\n       to populate an options array.\n\n        var options = [];\n        options.push({ 'value': 'best_italian_1', 'label': gs.getMessageLang(\"Best Italian Restaurant Ever\", vaContext.getRequesterLang()), 'render_style': 'data' });\n        options.push({ 'value': 'best_italian_2', 'label': gs.getMessageLang(\"Even Better Italian Restaurant\", vaContext.getRequesterLang()), 'render_style': 'data' });\n        return options;\n    */\n\n    var options = []; // add options here...\n    options.push({'value': 'form_choice_1', 'label' : gs.getMessageLang(\"I don't want to fill out the form.\", vaContext.getRequesterLang()), 'render_style': 'data'});\n    options.push({'value': 'form_choice_2', 'label' : gs.getMessageLang(\"I'm done.\", vaContext.getRequesterLang()), 'render_style': 'data'});\n    return options;\n})()\n",
              "mode": "external_script"
            },
