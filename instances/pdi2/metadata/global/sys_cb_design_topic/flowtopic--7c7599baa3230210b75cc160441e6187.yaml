          "e00f444f042d48bcb7b3f0325cc4f88f": {
            "id": "e00f444f042d48bcb7b3f0325cc4f88f",
            "name": "set variables",
            "script": "(function execute() {\n  var detectedLang = vaVars.global_runtime_detected_language;\n\n  var languageName = (function() {\n      if (detectedLang) {\n          var languageGR = new GlideRecord('sys_language');\n          if (languageGR.isValid()) {\n              languageGR.addQuery('id', detectedLang);\n              languageGR.setLimit(1);\n              languageGR.query();\n\n              if (languageGR.next()) {\n                  return languageGR.getValue('name') || 'English';\n              }\n          }\n      }\n      return 'English';\n  })();\n\n  vaVars.requesterLanguage = gs.getMessageLang(languageName, vaContext.getRequesterLang());\n  vaVars.translatedLanguage = gs.getMessageLang(languageName, detectedLang);\n    \n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
