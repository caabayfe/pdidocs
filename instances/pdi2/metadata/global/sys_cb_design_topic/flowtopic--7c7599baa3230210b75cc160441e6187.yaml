          "8c7bbdbef860497da0f69c48396820ab": {
            "id": "8c7bbdbef860497da0f69c48396820ab",
            "name": "Skill Discovery",
            "script": "(function execute() {    \n    var args = vaVars.global_skill_discovery_args;\n\n    if (!args) {\n        args = {};\n    }\n    \n    var confirmation = String(vaInputs.language_switch_confirmation || '').toLowerCase();\n    var answer = String(vaInputs.answer || '').toLowerCase();\n    var switchLanguage = (vaInputs.switch_language === true ||\n                        String(vaInputs.switch_language).toLowerCase() === 'true');\n\n    var userResponse = (answer !== 'no' || confirmation !== 'no' || switchLanguage);\n\n    args['user_response'] = userResponse ? 'true' : 'false';\n  \n    vaSystem.executeSkillDiscoveryWithArgs(vaVars.global_utterance, args);\n})()",
            "stepType": "ScriptAction",
            "applicability": {
