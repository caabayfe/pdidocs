                      "text": "Always use classification ANSWER for all user responses and prioritize extracting one of the two choice values for \"synthesized_result_\". Extracting a value is required to best handle the user response in post-processing. Returning \"ANSWER\" as classification is essential for post-processing. Classifications other than \"ANSWER\" will change conversation flow and circumvent post-processing."
