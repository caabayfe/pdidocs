type":"String","mode":"script","value":"(function execute() {\n    var defaultMsg = \"Great, you’ve been verified.\";\n    var custom_message = sn_cs.VASystemObject.getBotMessage(\"user_verification_confirmed_msg\", vaVars.inboundId, vaVars.providerId);\n    var prompt = custom_message || defaultMsg;\n    return gs.getMessageLang(prompt, vaContext.getRequesterLang());\n})()\n"}],"id":"67113656a4644ab3a38087ff0895de83","name":"User Verified","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"ScriptedAction","script":"(function execute() {\n   \n    if (gs.nil(vaContext.providerAppId)) {\n        vaVars.isGoogleAuthentication = false;\n    }\n\n    var two_factor_methods = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\"two_factor_methods\", vaContext.providerAppId);\n    if (gs.nil(two_factor_methods)) {\n        vaVars.isGoogleAuthentication = false;\n        return;\n    }\n   \n    vaVars.isGoogleAuthentication = two_factor_methods.toLowerCase().equals(\"google_authenticator\");\n})()\n","id":"651cf6c21e134717a63aa9cd88918fe5","name":"Determine MFA","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","script":"(function execute() {\n    var userId = vaVars.identifiedUser;\n    var status = vaSystem.elevateSession(userId);\n    gs.debug(\"Elevate Session status : \" +status);\n})()\n","id":"bd1710dd751c4a3c88e2e04168033f90","name":"Link Account","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"Decision","name":"Which MFA to run","branches":[{"type":"Branch","label":"Google Authenticator","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.isGoogleAuthentication;\n})()\n"},"id":"fd252c82454d499ebc15feb248717d24","name":"Google Authenticator"},{"type":"Branch","label":"SMS","expression":{"type":"Applicability","mode":"script","value":"(function execute() {\n    return !vaVars.isGoogleAuthentication;\n})()\n"},"id":"51f07f4c2749442faefcb431bc5f9184","name":"SMS"}],"id":"383669109af9425da77daafec4a385d5","goal_id":"primary"},{"type":"LibraryCall","library_topic_name":"Authenticator App Verification","library_topic_id":"6eea6ed194ce5110f877f65b88f23ea6","library_topic_is_template":false,"parameter-mappings":[{"parameter-name":"userid","value":{"type":"String","mode":"string","value":"{{vaInputs.identifieduser}}"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"verificationid","value":{"type":"String","mode":"script","value":"(function execute() {\n    var verificationId = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\"mfa_question_id\", vaContext.providerAppId);\n    return verificationId;\n})()\n"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"contextid","value":{"type":"String","mode":"script","value":"(function execute() {\n  return vaSystem.getConversationId();\n})()\n"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}}],"return-value-mappings":[{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"status","main_topic_mapped_variable_name":"mfa_status"},{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"status_code","main_topic_mapped_variable_name":"mfa_error_code"}],"id":"d93c37f101554687920330aa4d74d38a","name":"Google Authenticator Verification","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"LibraryCall","library_topic_name":"SMS Verification","library_topic_id":"0ebb2b725f8e01100a9bedbf2f7313c5","library_topic_is_template":false,"parameter-mappings":[{"parameter-name":"userid","value":{"type":"String","mode":"string","value":"{{vaInputs.identifieduser}}"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"verificationid","value":{"type":"String","mode":"script","value":"(function execute() {\n    var verificationQuestionId = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\"mfa_question_id\", vaContext.providerAppId);\n    return verificationQuestionId;\n})()\n"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}},{"parameter-name":"contextid","value":{"type":"String","mode":"script","value":"(function execute() {\n    return vaSystem.getConversationId();\n})()\n"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}}],"return-value-mappings":[{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"status","main_topic_mapped_variable_name":"mfa_status"},{"main_topic_variable_namespace":"vaInputs","library_topic_return_parameter_name":"error_code","main_topic_mapped_variable_name":"mfa_error_code"}],"id":"10e5530b9b40495c85cb83321e9530fc","name":"SMS Verification","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"Decision","name":"mfa_verified","branches":[{"type":"Branch","label":"MFA user not Verified","expression":{"type":"Applicability","mode":"query","value":"mfa_status=Error"},"id":"a30de6e4b6ae4468893a647cea7ae765","name":"MFA user not Verified"},{"type":"Branch","label":"MFA user verified","expression":{"type":"Applicability","mode":"query","value":"mfa_status=Success"},"id":"87310ae8ef3c475e9059a2f9a41129d2","name":"MFA user verified"}],"id":"4bb73058be4a40a6958c70093e249852","goal_id":"primary"},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.linkStatus = ''failure'';\n})()\n","id":"f9380db0734947ff8dc71ea03466c14c","name":"Set Link Status to Failure","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"TextOutputPrompt","value":[{"type":"String","mode":"script","value":"(function execute() {\n    var USER_NOT_ENROLLED_CODE = \"40001\";\n    var INCORRECT_PIN_CODE = \"50000\";\n    var CONFIGURATION_ISSUE = \"40002\";\n    \n    var defaultMsg = \"Something went wrong. We’re going to transfer you to an agent. Please hold.\"; // config issue\n    var custom_message_key = \"link_account_unexpected_error_msg\";\n\n    if(vaInputs.mfa_error_code.getValue() == USER_NOT_ENROLLED_CODE) {\n        defaultMsg = \"You have not configured any device for OTP. Not to worry, we''re routing you to an Agent to help you\";\n        custom_message_key = \"user_sms_device_not_enrolled_msg\";\n\n    } else if(vaInputs.mfa_error_code.getValue() == INCORRECT_PIN_CODE) {\n        defaultMsg = \"The OTP you gave us is incorrect. We’re going to transfer you to an agent. Please hold.\";\n        custom_message_key = \"user_otp_verification_failed_msg\";\n        \n    } else if(vaInputs.mfa_error_code.getValue() == CONFIGURATION_ISSUE){\n        gs.error(\"Configuration error in provider channel record, please check the SysId for verification_question_id or mfa_question_id in provider properties \")\n    }\n\n    var custom_message = sn_cs.VASystemObject.getBotMessage(custom_message_key, vaVars.inboundId, vaVars.providerId);\n\n    var prompt = custom_message || defaultMsg;\n    return gs.getMessageLang(prompt, vaContext.getRequesterLang());\n   \n})()\n"}],"id":"1b61a2db6c8d45d7b4333fe1a74c5288","name":"Auth Failed","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"ScriptedAction","script":"(function execute() {\n    var topicBlock = \"MFA\";\n    var mfaErrorCode = gs.nil(vaInputs.mfa_error_code.getValue()) ? \"\" : \" topic block error code:\" + vaInputs.mfa_error_code.getValue();\n    gs.error(\"User : \" + vaVars.identifiedUser + \" Authentication failed : topic block:\" + topicBlock + mfaErrorCode);\n\n    //For voice channels, Will connect to live agent directly, will go through topic picker in order for Setup/Reset PIN topic block to show up\n    if (vaVars.redirectToLA)\n        vaVars.connectToLA = true;\n})()\n","id":"0973e5bc0a9b4eab9d307c7ce250c10b","name":"Set ConnectToLA variable","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","script":"(function execute() {\n     vaVars.authType = vaInputs.authtype.getValue();\n     vaVars.identifiedUser = vaInputs.identifieduser.getValue();\n     vaVars.inboundId = vaInputs.inboundid.getValue();\n     vaVars.providerId = vaInputs.providerid.getValue();\n     vaVars.redirectToLA = vaInputs.redirecttola.getValue();\n})()\n","id":"61b1c8278f31415fa92a4a429a5b83ec","name":"read inputs","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}},{"type":"ScriptedAction","script":"(function execute() {\n    vaVars.linkStatus = ''success'';\n})()\n","id":"51e5010f6ec64f78add27e8d65b5096b","name":"Set Link status to Success","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"}}],"edges":[{"type":"Edge","source_node_id":"928bf4e2b22143648a37d1b062366acb","target_node_id":"152a2f441a9b43409b9ca8f9d79c9502","branch_id":"d4a86ed0a781436896fdf00c02cd9cb3","id":"7d7115d60ba04ec3bf6af74e35ee1363","name":"d4a86ed0a781436896fdf00c02cd9cb3"},{"type":"Edge","source_node_id":"928bf4e2b22143648a37d1b062366acb","target_node_id":"51e5010f6ec64f78add27e8d65b5096b","branch_id":"c405a5f5dc4c47b39a2b493e6e5693d5","id":"d0bcddec3e0d46a7850b582ee7ed8270","name":"c405a5f5dc4c47b39a2b493e6e5693d5"},{"type":"Edge","source_node_id":"152a2f441a9b43409b9ca8f9d79c9502","target_node_id":"651cf6c21e134717a63aa9cd88918fe5","id":"9ce6c0b9b17143f0815bd138b3c33afa"},{"type":"Edge","source_node_id":"67113656a4644ab3a38087ff0895de83","target_node_id":"bd1710dd751c4a3c88e2e04168033f90","id":"245e09d37efe4e73a200a52b9a6da683"},{"type":"Edge","source_node_id":"bd1710dd751c4a3c88e2e04168033f90","target_node_id":"1adcdc47357f4bb5966ba0151c0d2049","id":"de44f89c95ff4cac97e3d40f008588cb"},{"type":"Edge