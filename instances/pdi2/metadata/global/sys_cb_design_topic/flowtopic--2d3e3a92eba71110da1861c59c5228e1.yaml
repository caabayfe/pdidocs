          "152a2f441a9b43409b9ca8f9d79c9502": {
            "id": "152a2f441a9b43409b9ca8f9d79c9502",
            "stepType": "TextOutput",
            "name": "SoftPIN verified - Continue to MFA",
            "secure": false,
            "value": [
              {
                "value": "(function execute() {\n    var defaultMsg = \"Great. Your SoftPin is correct.\";\n    var custom_message = sn_cs.VASystemObject.getBotMessage(\"user_pin_verified_start_mfa_msg\", vaVars.inboundId, vaVars.providerId);\n    var prompt = custom_message || defaultMsg;\n    return gs.getMessageLang(prompt, vaContext.getRequesterLang());\n})()\n",
                "mode": "script"
              }
            ],
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
          "67113656a4644ab3a38087ff0895de83": {
            "id": "67113656a4644ab3a38087ff0895de83",
            "stepType": "TextOutput",
            "name": "User Verified",
            "secure": false,
            "value": [
              {
                "value": "(function execute() {\n    var defaultMsg = \"Great, you’ve been verified.\";\n    var custom_message = sn_cs.VASystemObject.getBotMessage(\"user_verification_confirmed_msg\", vaVars.inboundId, vaVars.providerId);\n    var prompt = custom_message || defaultMsg;\n    return gs.getMessageLang(prompt, vaContext.getRequesterLang());\n})()\n",
                "mode": "script"
              }
            ],
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
          "651cf6c21e134717a63aa9cd88918fe5": {
            "id": "651cf6c21e134717a63aa9cd88918fe5",
            "name": "Determine MFA",
            "script": "(function execute() {\n   \n    if (gs.nil(vaContext.providerAppId)) {\n        vaVars.isGoogleAuthentication = false;\n    }\n\n    var two_factor_methods = sn_cs.VASystemObject.getCustomAdapterPropertyWithHierarchy(\"two_factor_methods\", vaContext.providerAppId);\n    if (gs.nil(two_factor_methods)) {\n        vaVars.isGoogleAuthentication = false;\n        return;\n    }\n   \n    vaVars.isGoogleAuthentication = two_factor_methods.toLowerCase().equals(\"google_authenticator\");\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
          "bd1710dd751c4a3c88e2e04168033f90": {
