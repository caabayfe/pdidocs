            "name": "Link Account",
            "script": "(function execute() {\n    var userId = vaVars.identifiedUser;\n    var status = vaSystem.elevateSession(userId);\n    gs.debug(\"Elevate Session status : \" +status);\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
