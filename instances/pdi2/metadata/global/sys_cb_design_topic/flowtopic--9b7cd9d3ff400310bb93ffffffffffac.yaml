          "0b7f0fd1890d46e28edacc3a9e741462": {
            "id": "0b7f0fd1890d46e28edacc3a9e741462",
            "name": "Invoke Custom Callback Topic",
            "script": "(function execute() {\n    var CALLBACK_DECISION_SYS_ID = \"05c6cc55eb9a0110ad88ca5d2352281e\";\n    var callbackTopicId;\n    var deviceType = vaContext.deviceType;\n\n    // Default callback flow is diabled \n    vaVars.global_callback_executed = false;\n\n    // The callback Topic Id is being fetched form Custom Adapter Properties using Decision rules. \n    // The callback_topic_id has to be publish topic id from sys_cs_topic.\n    var inputs = new Object();\n    inputs[\"channel_id\"] = vaSystem.getChannelIdByName(deviceType);\n    inputs[\"portal\"] = vaContext.portal;\n    inputs[\"provider_application_id\"] = vaContext.providerAppId;\n\n    var decisionTable = new sn_dt.DecisionTableAPI();\n    try {\n        var answer = decisionTable.getDecision(CALLBACK_DECISION_SYS_ID, inputs);\n        if (answer)\n            callbackTopicId = answer.getValue(\"value\");\n\n    } catch (e) {\n        gs.error(\"Error while running the decison rules for callback topic, \" + callbackTopicId);\n    }\n    // Switch the custom/default callback topic\n    if (callbackTopicId) {\n        vaSystem.switchTopicById(callbackTopicId);\n    }\n\n    // Expcted output from the callback topic would be vaVars._transfer_to_agent flag.\n})();",
