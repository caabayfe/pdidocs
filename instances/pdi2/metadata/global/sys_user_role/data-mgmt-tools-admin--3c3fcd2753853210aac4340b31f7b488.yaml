description: |-
  This role provides limited access to instance data management tools including: one time update and delete, archiving, and auto flushing records.  Note: the following roles are ALSO required for full functional access to the data management tools:

  delegated_developer (required for table, column, and application scope access)
  events_admin (to write trigger data for scheduling jobs)
  context_rollback_executor (to rollback records that have been update or deleted)

  any other roles that provide CRUD access to the data tables the data_mgmt_tools_admin user wants to manage.
