css: |-
  /* Header colors */
              /* Topbar background color*/
              $navpage-header-bg: #182838
              /* Bottom border color on topbar */
              $navpage-header-divider-color: #323f50
              
              /* Left nav and navigation toolbar background color */
              /* Background for navigator (left side only) */
              $navpage-nav-bg: #182838
              /* Background for Favorites list, history list, and Connect list background */
              $navpage-nav-bg-sub: #323f50
              /* Text color in main navigation */
              $navpage-nav-color-sub: #bdc0c4
              /* Divider color in Navigator */
              $nav-hr-color: #323f50
              
              /* Navigator tabs */
              /* Active nav item underneath search */
              $nav-highlight-bar-active: #278efc
              /* Background for currently selected navigation item underneath search */
              $navpage-nav-selected-bg: #182838
              /* Color of icons for non inactive nav items */
              $navpage-nav-unselected-color: #bdc0c4
              
              /* Color of outline for search */
              $navpage-nav-border: #bdc0c4
              
              $color-dark: #5b6774
              
              $color-blue: #0a66c7
              $color-accent: #0a66c7
              
              $color-green: #03870d
              
              $color-red: #d20c0c
              
              /* System theme colors */
              /* Header Colors */
              /* Search text color */
              $search-text-color: #ffffff
              /* Topbar text color */
              $navpage-header-color: #ffffff
              /* Topbar button color */
              $navpage-header-button-color: #ffffff
              
              /* Left nav and navigation toolbar background color */
              /* Navigator hover color */
              $nav-highlight-main: #3d4853
              /* Background for expanded navigation items */
              $subnav-background-color: #303a46
              /* Text color in main navigation */
              $navpage-nav-color-sub: #bec1c6
              /* Text color when hovering over items in main nav */
              $navpage-nav-mod-text-hover: #ffffff
              
              /* Navigator tabs */
              /* Inactive nav items underneath search */
              $nav-highlight-bar-inactive: #81878e
              /* Color of icon for currently active nav item */
              $navpage-nav-selected-color: #ffffff
              
              /* Navigator Application text */
              /* Color for latest connect messages in right bar */
              $connect-latest-message: #e6e8ea
              /* Timestamp header backgrounds in History tab*/
              $nav-timeago-header-color: #303a46
              /* Core content text color */
              $navpage-nav-app-text: #e6e8ea
              /* Core content text color hover */
              $navpage-nav-app-text-hover: #ffffff
              
              /* Default button/icon color */
              $navpage-button-color: #ffffff
              /* Default button/icon hover color */
              $navpage-button-color-hover: #278efc
              
              $input-border: #8b8b8b
              
              $color-darkest: #303a46
              $color-darker: #455464
              $color-light: #bec1c6
              $color-lighter: #e6e8ea
              $color-lightest: #ffffff
              
              $color-info: ${$color-blue}
              $color-negative: #d20c0c
              $color-positive: #03870d
              $color-warning: #fc8a3d
              
              $color-primary-text: #ffffff;
              $color-info-text: #ffffff
              $color-negative-text: #ffffff
              $color-positive-text: #ffffff
              $color-warning-text: #ffffff
              
              $color-accent-light: #bddcfc
              $color-accent-lighter: #e5f1ff
              $color-accent-lightest: #e7f2ff
              
              ###
              # 2018 - New Style variables introduced
              # Note: Boostrap has variables with the name $btn-*-color
              # Those variables are different than the ones defined below $btn-*-bg-color
              # and are used for different purposes. The former is text and latter is background color
              ###
              
              $btn-info-bg-color: ${$color-info}
              $btn-info-bg-color-hover: ${$color-info}
              $btn-info-text: #ffffff
              $btn-info-text-hover: #ffffff
              $btn-negative-bg-color: ${$color-negative}
              $btn-negative-bg-color-hover: ${$color-negative}
              $btn-negative-text: ${$color-negative}
              $btn-negative-text-hover: #ffffff
              $btn-positive-bg-color: ${$color-positive}
              $btn-positive-bg-color-hover: ${$color-positive}
              $btn-positive-text: ${$color-positive}
              $btn-positive-text-hover: #ffffff
              $btn-warning-bg-color: ${$color-warning}
              $btn-warning-bg-color-hover: ${$color-warning}
              $btn-warning-text: #ffffff
              $btn-warning-text-hover: #ffffff
