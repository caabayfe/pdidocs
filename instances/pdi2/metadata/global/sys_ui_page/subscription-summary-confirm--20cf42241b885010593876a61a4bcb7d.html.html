<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide"
	xmlns:j2="null" xmlns:g2="null">
<j2:if test="$[gs.hasRole('admin') || gs.hasRole('usage_admin')]">
	<g:ui_form>
		<input type="hidden" id="cancelled" name="cancelled" value="false" />
			<table border="0" width="100%">
				<tr>
					<td valign="top" width="100%" height="100%">
						<span style="margin-top: 6px;">
								<div style="margin-top: 8px;">
                                   <label>
									   <j2:choose>
										   <j2:when test="$[SNC.UsageAnalyticsScriptUtils.getEntitlementLevel() === 'OFF' ${AMP}${AMP} SNC.UsageAnalyticsScriptUtils.isAutoSystemEntitlementEnabled() === true]">
										      <div>${gs.getMessage('This will scan and redistribute subscription allocations based on user roles. This is an intensive process and will take several minutes to complete.')}</div>
										   </j2:when>
										   <j2:otherwise>
										      <div>${gs.getMessage('This will scan and redistribute subscription allocations based on user groups. This is an intensive process and will take several minutes to complete.')}</div>
										   </j2:otherwise>
									   </j2:choose>
                                   </label>
								</div>
						</span>
					</td>
				</tr>
				<tr>
					<td nowrap="true" height="30px" width="100%" style="vertical-align:bottom;">
						<div align="right">
							<g:macro ok="onSubmit()"
								cancel="onCancel()"
								ok_id="ok_button" cancel_id="cancel_button" ok_type="button"
								cancel_type="button" />
							<g:dialog_button id="${jvar_cancel_id}" type="${jvar_cancel_type}" style_class="btn btn-default"
								onclick="${jvar_cancel}">${gs.getMessage('No')}</g:dialog_button>$[SP]
							<g:dialog_button id="${jvar_ok_id}" type="${jvar_ok_type}" style_class="btn btn-primary"
								onclick="${jvar_ok}">${gs.getMessage('Continue with update')}</g:dialog_button>$[SP]
						</div>
					</td>
				</tr>
			</table>
	</g:ui_form>
</j2:if>
</j:jelly>
