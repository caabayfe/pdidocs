<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="true" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
			html{
				font-size: unset
			}
			body {
				height: 100%;
				margin: 0;
				width: 100%;
				overflow: hidden;
				padding: 0;
			}

			body ::-webkit-scrollbar-track {
   				background: unset
			}

			body ::-webkit-scrollbar-thumb {
   				border: unset
			}

			body ::-webkit-scrollbar {
   				width: 6px;
				height: 6px;
			}

			#graphql-explorer{
				height: 100vh;
				margin: calc(var(--now-global-space--sm) * -1);
			}

			.graphiql-table{
				background-color: unset
			}

			graphiql-key,
			code{
				color: unset
			}

			.CodeMirror-scrollbar-filler, .CodeMirror-gutter-filler {
    			background-color: unset;
			}

			.graphiql-dialog-close,
			svg{
				box-sizing : unset;
			}

            /* These below styles are intended to fix UI issues w.r.t style bleeding when glide.ui.polaris.experience is false[OFF] */ 

			#graphql-explorer .graphiql-container .topBar {
				background: unset;
				background-color: RGB(var(--now-color_surface--neutral-3,232,234,237));
				height: 54px;
			}

			#graphql-explorer .graphiql-container button.graphiql-toolbar-button.error {
    			background: hsla(var(--color-error),var(--alpha-background-heavy));
			}
			
			#graphql-explorer .graphiql-container button.graphiql-execute-button {
    			background-color: hsl(var(--color-primary));
    			border: none;
    			border-radius: var(--border-radius-8);
			}

			#graphql-explorer .graphiql-container .graphiql-un-styled,button.graphiql-un-styled {
			    border-radius: var(--border-radius-4);
    			border: none;
    			background-color: transparent;
			}

			#graphql-explorer .graphiql-container .graphiql-button,button.graphiql-button {
				background-color: hsla(var(--color-neutral),var(--alpha-background-light));
			}

			#graphql-explorer .graphiql-container .graphiql-sidebar button {
    			color: hsla(var(--color-neutral), var(--alpha-secondary));
			}

			#graphql-explorer .graphiql-container .graphiql-tab-button {
    			color: hsla(var(--color-neutral), var(--alpha-secondary));
			}

			#graphql-explorer .graphiql-container .graphiql-tab button.graphiql-un-styled.graphiql-tab-close {
				align-items: center;
    			color: hsla(var(--color-neutral), var(--alpha-secondary));
    			display: flex;
    			padding: var(--px-4) var(--px-8);
			}

			#graphql-explorer .graphiql-container .graphiql-editor-tools-tabs  button.graphiql-un-styled {
				color: hsla(var(--color-neutral), var(--alpha-secondary));
    			padding: var(--px-8) var(--px-12);
			}

			div[data-reach-dialog-content] .graphiql-dialog-section .graphiql-button-group button.graphiql-button {
    			background-color: transparent;
				border: none;
    			border-radius: var(--border-radius-4);
				color: hsla(var(--color-neutral), var(--alpha-secondary));
    			cursor: default;
    			padding: var(--px-8) var(--px-12);
			}

			div[data-reach-dialog-content] .graphiql-dialog-section .graphiql-button-group button.graphiql-button.active {
    			background-color: hsl(var(--color-base));
				cursor: default;
			}

			div[data-reach-dialog-content] .graphiql-dialog-section button.graphiql-button {
    			background-color: hsla(var(--color-neutral),var(--alpha-background-light));
				border: none;
    			border-radius: var(--border-radius-4);
    			color: hsla(var(--color-neutral), 1);
			}

			div[data-reach-dialog-content] .graphiql-dialog-section button.graphiql-button:hover {
				background-color: hsla(var(--color-neutral),var(--alpha-background-medium));
			}

			.graphiql-button-group > button.graphiql-button:hover {
    			background-color: hsla(var(--color-neutral),var(--alpha-background-light));
			}

			div[data-reach-dialog-content] .graphiql-un-styled.graphiql-dialog-close {
    			all: unset;
    			border: none;
				border-radius: var(--border-radius-4);
    			background-color: transparent;
				cursor: pointer;
			}

			div[data-reach-dialog-content] .graphiql-un-styled.graphiql-dialog-close:hover {
    			background-color: hsla(var(--color-neutral),var(--alpha-background-light));
			}

			div[data-reach-dialog-content] .graphiql-dialog-close > svg {
    			color: hsla(var(--color-neutral),var(--alpha-secondary));
    			display: block;
    			height: var(--px-12);
    			padding: var(--px-12);
    			width: var(--px-12);
			}

		</style>
		<g:requires name="styles/graphql-explorer.css"/>
		
		<section id="graphql-explorer">Loading...</section>
		
		<!-- scripts -->
		<g:requires name="scripts/graphql-explorer.min.js" params="sysparm_substitute=false" inline="false"/>
</j:jelly>
