<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <g:evaluate jelly="true">
        var labelCancel = gs.getMessage('Cancel');
        var labelSave = gs.getMessage('Save');
        var labelAvailableList = gs.getMessage('Available List');
        var labelSelectedList = gs.getMessage('Selected List');
    </g:evaluate>
    <div class="slush-container">
        <input type="hidden" id="${display_field}" name="${display_field}" title="${display_field}"/>
                    <div class="form-group" id="search_row">
                            <div class="input-group-transparent">
                                <span class="input-group-addon-transparent icon-search"/>
                                <input id="efg"
                                       class="form-control form-control-search" type="search"
                                       name="abc"
                                       autocomplete="off"
                                       onKeyUp="acRequest(event);"
                                       placeholder="Available List Filter"
                                       aria-label="Available List Filter"/>
                            </div>
                    </div>
        <g:ui_slushbucket left_header="${labelAvailableList}" right_header="${labelSelectedList}" up_down="true" />
    </div>
    <footer class="modal-footer">
        <button class="btn btn-default" id="cancel_button" data-dismiss="modal" onclick="return continueCancel()" aria-label="${labelCancel}">${labelCancel}</button>
        <button class="btn btn-primary" id="ok_button" onclick="return continueOK(event)" aria-label="${labelSave}">${labelSave}</button>
    </footer>
</j:jelly>
