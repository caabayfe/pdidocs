<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

<g:ui_form>
<input type="hidden" id="cancel_or_submit" name="cancel_or_submit" value=""/>
<input type="hidden" id="item" name="item" value="${sysparm_sys_id}"/>
<input type="hidden" id="name" name="name" value="${sysparm_display_name}"/>
<input type="hidden" id="type" name="type" value="${sysparm_type}"/>
<input type="hidden" id="type" name="catalog" value="${sysparm_catalog}"/>

<table width="100%" style="border-spacing:10px; height:100px;">
        <tr>
                <td style="text-align:right;"><label>${gs.getMessage("Model:")}</label></td>
                <td style="padding:10px;" id="display_model_name"><label>${sysparm_display_name}</label></td>
        </tr>
        <tr>
                <td style="text-align:right;"><label for="${jvar_cat_query}" onclick="" dir="">${gs.getMessage("Category:")}</label></td>
		<td id="td_reference_category"><g:ui_reference label='${gs.getMessage("Category:")}' name="sc_category" table="sc_category" columns="sc_category;sc_catalog" completer="AJAXTableCompleter" query="active=true"/></td>
        </tr>
	
	<script>
		var tdReferenceCategory = document.getElementById('td_reference_category');
		var isPolarisEnabled = window.NOW.isPolarisEnabled;
		if (isPolarisEnabled === 'true') {
			tdReferenceCategory.style.padding = '10px';
		} else {
			tdReferenceCategory.setAttribute('style','');
		}
	</script>
	
	<tr id="dialogbuttons">
        <td colspan="3" align="right" style="padding-right:10px;">
            <g:dialog_buttons_ok_cancel ok="return actionOK();" cancel="return cancel();"/>
        </td>
    </tr>
	
</table>
</g:ui_form>
</j:jelly>
