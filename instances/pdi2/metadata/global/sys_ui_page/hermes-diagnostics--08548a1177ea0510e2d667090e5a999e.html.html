<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
		header {
			padding: .75rem;
			padding-bottom: 1rem;
			margin-bottom: .75rem;
			border-bottom: 1px solid #cecece;
		}
		header > h1 {
			margin-top: 0;
		}
		header > #diagInfo.error {
			font-weight: bolder;
			color: red;
		}
		#diagStatus {
			margin-right: .5rem;
		}
		#diagInfo {
			margin-left: .5rem;
		}
		#diagSetupSchema {
			padding: 1rem;
		}
		#diagSetupSchema h4 {
			margin-top: 0;
		}
		#diagSetupSchema div:not(:last-child) {
			margin-bottom: 2.5rem;
		}
		#diagSetupSchema > div div {
			margin-top: 2rem;
		}
		#diagSetupSchema div > div {
			padding-left: 2rem;
			padding-top: 2rem;
		}

		#diagTestSchema {
			padding: 1rem;
		}

		#diagTestSchema h4 {
			margin-top: 0;
		}
		#diagTestSchema div:not(:last-child) {
			margin-bottom: 2.5rem;
		}
		#diagTestSchema > div div {
			margin-top: 2rem;
		}
		#diagTestSchema div > div {
			padding-left: 2rem;
			padding-top: 2rem;
		}
		span.status-badge {
			display: block;
			color: rebeccapurple;
		}
		span.status-badge::before {
			display: inline-block;
			content: ' ';
			width: 10px;
			height: 10px;
			background: mediumpurple;
			border-radius: 50%;
			margin-right: .5rem;
		}

		span.status-badge.gray {
			color: gray;
		}
		span.status-badge.gray::before {
			display: inline-block;
			background: darkgray;
		}

		span.status-badge.green {
			color: darkgreen;
		}
		span.status-badge.green::before {
			background: green;
		}

		span.status-badge.yellow {
			color: darkorange;
		}
		span.status-badge.yellow::before {
			display: inline-block;
			background: orange;
		}

		span.status-badge:not(:last-child) {
			margin-bottom: .5rem;
		}

		span.status-badge.red {
			color: darkred;
		}
		span.status-badge.red::before {
			display: inline-block;
			background: red;
		}
	</style>
	<header>
		<h1>Hermes Diagnostics</h1>
		<div>
			<span><a href="/now/hermes-messaging-service/diagnostics">View the updated Hermes Diagnostics page</a></span>
		</div>
		<span id="diagStatus" class="status-badge" style="display: none"></span>|<span id="diagInfo">Checking...</span>
	</header>
	
	<div id="diagSetupSchema"></div>
	<span id="testInfo" class="status-badge">Sending Test Message...</span>
	<div id="diagTestSchema"></div>
</j:jelly>
