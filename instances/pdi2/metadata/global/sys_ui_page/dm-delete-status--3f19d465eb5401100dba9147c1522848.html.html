<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:ui_form>
		<table cellpadding="0" cellspacing="0" width="500px">
			<g:ui_progress_worker worker_id="${sysparm_pworker_sysid}"/>
			<tr id="completed_links" style="display: none">
				<td>
					<table id="completed_links" style="display: none" width="100%">
						 
						<tr id="request_link">
							<td>
								<a class="breadcrumb" href="sys_dm_delete.do?sys_id=${sysparm_sys_id}">${gs.getMessage('Check execution results')}</a>
							</td>
						</tr> 
						<tr id="request_list_link">
							<td>
								<a class="breadcrumb" href="sys_dm_delete_list.do">${gs.getMessage('Go back to list view')}</a>
							</td>
						</tr> 
					</table>
				</td>
			</tr>
		</table>
		
		<input type="hidden" name="pworker_sysid" id="pworker_sysid" value="${sysparm_pworker_sysid}"/>
		<input type="hidden" name="dm_sysid" id="dm_sysid" value="${sysparm_sys_id}"/>
		
		<j:if test='${pgr.state == "complete" || pgr.state == "cancelled"}'>
			<script>
				var el = gel("completed_links");
				el.style.display = "";
			</script>
		</j:if> 
		
	</g:ui_form>
</j:jelly>
