<?xml version="1.0" encoding="utf-8" ?>

<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
		.permalink-delete-confirmation p {
			font-family: 'Lato';
			line-height: 19.5px;
			font-size: 16px;
		}
		.permalink-delete-confirmation p.last-child {
			margin: 0;
		}
	</style>

	<div class="permalink-delete-confirmation">
		<p>${gs.getMessage("Existing users who have this link will be unable to access the document.")}</p>
		<p>${gs.getMessage("A new link can be generated again to share in future.")}</p>
		<p class="last-child">${gs.getMessage("Do you want to proceed?")}</p>
		<div class="footer-buttons">
			<g:dialog_buttons_ok_cancel cancel_text="${gs.getMessage('Cancel')}" ok_text="${gs.getMessage('Delete')}" ok_type="button" ok_style_class="btn btn-destructive" ok="onClickDelete()"/>
		</div>
	</div>
</j:jelly>
