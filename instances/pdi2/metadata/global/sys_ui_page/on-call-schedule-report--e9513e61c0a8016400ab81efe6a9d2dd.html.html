<g:requires name="scripts/moment.min.js" includes="true"/>
<g:evaluate var="jvar_doc" expression="GlideMobileExtensions.getDeviceType() == 'doctype'"/>
<style>
    .edge-input-fix::-ms-clear {
        display:none;
    }
    </style>
<j:if test="${!jvar_doc}">
    <g:macro_invoke macro="ui_on_call_schedule_report_non_doctype" />
</j:if>
<j:if test="${jvar_doc}">
    <g:macro_invoke macro="ui_on_call_schedule_report_doctype" />
</j:if>
<div id="slush_bucket_invalid_msg" class="fieldmsg notification notification-error" style="display: none;"></div>
