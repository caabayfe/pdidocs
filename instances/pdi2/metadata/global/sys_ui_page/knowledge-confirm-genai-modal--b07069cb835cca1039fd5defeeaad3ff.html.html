<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<link href="08796c922f1e3a14e9ed523bcfa4e32b.cssdbx?v=${gs.getProperty('glide.builddate')}" type="text/css" rel="stylesheet"/>
	<style>
        .modal-header {
            display: none;
        }

        .modal-title {
            color: RGB(var(--now-color_text--primary, var(--now-color_alert--moderate-3, 67, 69, 166)));
        }

        .modal-content {
            border-radius: 8px;
            border: 1px;
        }

        .sparkle-icon::before {
            font-size: 24px !important;
            color: RGB(var(--now-messaging_icon--primary-ai--color, var(--now-color--secondary-1, 67, 69, 166)));
            margin-right: 2px;
        }

		.draft-content {
			margin-block: var(--now-scalable-space--md);
        }

        .modal-footer {
            align: right;
            padding-right: 14px !important;
        }

        .sparkle-icon-on-footer::before {
            font-size: 16px !important;
            margin-right: 2px;
        }

        .footer-button {
            min-width: 5em;
            margin-left: 8px !important;
        }
    </style>
    <div class="modal-body">
        <span class="modal-title h4">${gs.getMessage('Use AI to draft article?')}</span>
        <button data-dismiss="GlideModal" aria-label="${gs.getMessage('Close')}" title="" class="btn btn-icon close icon-cross" id="knowledge_confirm_genAI_modal_closemodal" data-original-title="${gs.getMessage('Close')}"><span class="sr-only">${gs.getMessage('Close')}</span></button>
		
		
        <div class="draft-content"> 
		
		<p>
		${gs.getMessage('AI can use task data, comments, and work notes from the activity stream to generate a draft article. You’ll be able to review and edit it before publishing.')}</p>
        </div>
    </div>
    <footer class="modal-footer">
        <button class="btn btn-default footer-button" onclick="cancel()">${gs.getMessage('No, write it myself')}</button>
        <button class="btn btn-primary footer-button ai-button" onclick="generateFromGenAI()" id="create-button">
            <span class="icon-sn-sparkmoji-logo-outline sparkle-icon-on-button"></span>
            ${gs.getMessage('Draft with AI')}</button>
    </footer>
</j:jelly>
