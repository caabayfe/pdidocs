<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:ui_form>
		<input type="hidden" id="sysparm_sys_id" name="sysparm_sys_id" value="${sysparm_upd_sys_id}"/>
		<input type="hidden" id="sysparm_cancel" name="sysparm_cancel" value="false"/>
		<input type="hidden" id="sysparm_proceed" name="sysparm_proceed" value="false"/>
		<input type="hidden" id="sysparm_number" name="sysparm_number" value="${sysparm_upd_number}"/>
		<div style="text-align:center;">
			<div style="color:tomato; font-weight:bold; text-align:center; font-size: larger;">
				${gs.getMessage('Warning!')}
			</div>
			<div style="margin: 5px 5px 0px;">
				${gs.getMessage('Update all records match the search criteria with the given field(s)/value(s).')} <br/>
				${gs.getMessage('Do you wish to proceed?')}
			</div>
			<div id="footer2_display" class="modal-footer flex" style="padding: 10px 0 0 0;">
				<button id="cancel_button" class="btn btn-default" onclick="cancel()">${gs.getMessage('Cancel')}</button>
				<button id="confirm_proceed_button" class="btn btn-primary" onclick="onProceed();">${gs.getMessage('Proceed')}</button>
			</div>
		</div>
	</g:ui_form>
</j:jelly>
