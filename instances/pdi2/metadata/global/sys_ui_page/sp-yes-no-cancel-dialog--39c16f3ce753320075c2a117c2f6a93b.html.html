<style>
	.sp-yes-no-cancel-dialog-root .body {
		display: flex;
	}
	
	.sp-yes-no-cancel-dialog-root .body .icon {
		font-size: 32px;
		margin-right: 15px;
	}
	
	.sp-yes-no-cancel-dialog-root .body .msg {
		flex-grow: 1;
		font-size: 14px;
	}
	
	.sp-yes-no-cancel-dialog-root .actions {
		margin-top: 15px;
		text-align: center;
		padding-top: 15px;
		border-top: 1px solid #e5e5e5;
	}
	
	.sp-yes-no-cancel-dialog-root .actions button {
		margin: auto 5px;
	}
</style>

<g:ui_form onsubmit="return invokeCallBack('yes');">
	<g2:evaluate>
		var message = "${RP.getWindowProperties().get('message')}";
		message =  new GlideStringUtil().unEscapeHTML(message);
		
		var type = "${RP.getWindowProperties().get('type')}";
		type =  new GlideStringUtil().unEscapeHTML(type);
	</g2:evaluate>
	
	<div class="sp-yes-no-cancel-dialog-root">
		<div class="body">
			<div class="icon">
				<j2:switch on="$[type]">
					<j2:case value="info">
						<span class="glyphicon glyphicon-info-sign"></span>
					</j2:case>
					<j2:case value="warning">
						<span class="glyphicon glyphicon-warning-sign"></span>
					</j2:case>
					<j2:default>
						<span class="glyphicon glyphicon-question-sign"></span>
					</j2:default>
				</j2:switch>
			</div>
			<div class="msg">$[message]</div>
		</div>
		<div class="actions">
			<button class="btn btn-default" onclick="invokeCallBack('cancel');">Cancel</button>
			<button class="btn btn-default" onclick="invokeCallBack('no');">No</button>
			<button class="btn btn-primary" onclick="invokeCallBack('yes');">Yes</button>
		</div>
	</div>
</g:ui_form>
