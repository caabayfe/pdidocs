<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<div class="row">
		<div class="col-md-12 form-group">
			<p>
				${gs.getMessage('Choose the number of offerings to add to each service in this portfolio which do not have any child offerings.')}
			</p>
		</div>
	</div>

	<div class="row">
		<div class="col-md-10 form-group">
			<label 
				   class="checkbox-label sn-tooltip-basic" 
				   for="add_offerings_to_services" 
				   title="${gs.getMessage('If selected, 1-many service offerings will be added to all services within the portfolio that do not currently have at least 1 child offering.')}"
				   data-toggle="tooltip" 
				   data-placement="auto">
				${gs.getMessage('Auto-create service offerings')}
			</label>
		</div>
		<div class="col-md-2 form-group">
			<span class="input-group-checkbox">
				<input 
					   id="add_offerings_to_services" 
					   name="add_offerings_to_services" 
					   type="checkbox"
					   aria-labelledby="add_offerings_to_services_label"
					   class="checkbox automation_check_box"
					   onclick="toggleNumberOfOfferingsDisplay()">
				</input>
				<label id="add_offerings_to_services_label" class="checkbox-label" for="add_offerings_to_services" 
					   aria-label="${gs.getMessage('Auto-create service offerings')}">
				</label>
			</span>
		</div>			
	</div>

	<div class="row">
		<div class="col-md-10 form-group">
			<label 
				   id="offerings_per_service_label"
				   class="checkbox-label sn-tooltip-basic" 
				   for="offerings_per_service" 
				   title="${gs.getMessage('The number of offerings that will be added to each service.')}"
				   data-toggle="tooltip" 
				   data-placement="auto"
				   style="display:none">
				${gs.getMessage('Number of offerings per service')}
			</label>
		</div>
		<div class="col-md-2 form-group">
			<span id="offerings_per_service_span" class="input-group-checkbox" style="display:none">
				<g:evaluate var="jvar_not_important" expression="var cl = GlideScriptChoiceList.getChoiceList('spm_service_portfolio', 'offerings_per_service');" />
				<select 
						id="offerings_per_service" 
						name="offerings_per_service" 
						class="form-control"
						aria-labelledby="offerings_per_service_label">
						<g:options choiceList="${cl}"/>
				</select>
			</span>
		</div>
	</div>

	<div class="row" style="padding: 50px 10px 0px 0px">
		<div class="float-right">
			<button type="button" class="btn btn-default" style="margin-right: 5px" onclick= "cancel()">
				${gs.getMessage('Cancel')}
			</button>
			<button type="button" class="btn btn-primary" onclick="submit()">
				${gs.getMessage('Submit')}
			</button>
		</div>
	</div>
</j:jelly>
