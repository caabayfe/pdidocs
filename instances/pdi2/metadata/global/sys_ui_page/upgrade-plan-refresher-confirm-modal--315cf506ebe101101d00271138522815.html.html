<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	
	<!-- BODY -->
	<div class="body-container">
		<input type="hidden" id="confirmModalAction" value="cancel"/>
		<p class="target-modal-message-bold">${gs.getMessage('Upgrade Plan Header')}</p><br/><br/>
		<j:choose>
            <j:when test="${gs.getProperty('glide.upgrade.plan.include.skips') == 'true'}">
                <p class="target-modal-message">${gs.getMessage('Upgrade plan refresher confirmation message with skips')}</p>
            </j:when>
            <j:otherwise>
                <p class="target-modal-message">${gs.getMessage('Upgrade plan refresher confirmation message without skips')}</p>
            </j:otherwise>
        </j:choose>
		<p class="target-modal-message"><a  href="javascript:void(0)" onclick="window.open('http://docs.servicenow.com/?context=Refresh_Upgrade_Plan', '_blank');">${gs.getMessage('Click here')}</a> $[SP] ${gs.getMessage('for further details. ')}
		</p>
	</div>

	<!-- BUTTONS -->
	<div class="buttons-container">
		<button id="cancelButton" onclick="cancelPage()">${gs.getMessage('Cancel')}</button>
		<button class="btn btn-destructive" id="submitButton" onclick="executeButtonAction()">${gs.getMessage('Refresh Upgrade Plan')}</button>
	</div>
	
	<style type="text/css">
		.body-container {
			margin: 8px 0 10px 20px;
		}
		
		.target-modal-message {
			margin-left: 14px;
			display:inline-flex;
			width:90%
		}

		.target-modal-message-bold {
            margin-left: 14px;
            display: inline-flex;
            width: 90%;
			font-weight: bold;
        }
		
		.buttons-container {
			text-align: right;
		}
	</style>
</j:jelly>
