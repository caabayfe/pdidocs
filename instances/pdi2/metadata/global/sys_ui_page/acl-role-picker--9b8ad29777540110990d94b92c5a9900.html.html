<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<p id="err_message" class="notification notification-error" style="display:none"></p>
	<div id="acl_role_picker" style="display:block; padding: 5px 10px">
		<div class="control-label col-sm-12">
			<label id="role_ref_label"></label>
		</div>
		<div class="col-sm-12">
			<g:ui_reference name="target_acl_role_pick" table="sys_user_role" completer="AJAXTableCompleter" onchange="clearErr()" 
							columns="name,sys_scope,description" order_by="name"/>
		</div>
		<div class="modal-footer">
			<g:dialog_buttons_ok_cancel ok="return onOK();" ok_type="button"/>
		</div>
	</div>
	<script>
		$j(function() {
			var e = gel("sys_display.target_acl_role_pick");
			if (e)
				e.focus();
		});	
		var rolePickerLabel = GlideModal.prototype.get("acl_role_picker").getPreference("sysparm_role_picker_label");
		var rple = $j("#role_ref_label");
		rple.html(rolePickerLabel);
	</script>
</j:jelly>
