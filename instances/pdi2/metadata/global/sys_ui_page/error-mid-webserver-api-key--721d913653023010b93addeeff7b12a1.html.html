<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

	<g:evaluate var="jvar_error" expression="RP.getWindowProperties().get('error')"/>
	
	<body>
		
		<style>
			#apiKeyErr {
				font-size:150%;
				vertical-align:sub;
				color:#f95050;
			}
		</style>
		
		<table width="100%">
			<tr>
				<td align="center">
					
					<div>
						<div>
							<span id="apiKeyErr" class="icon icon-cross-circle"/>
						</div>
						<p>
							<span>${JS,HTML:jvar_error}</span>
						</p>
					</div>

				</td>
			</tr>
		</table>
		
	</body>
	
</j:jelly>
