<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

	<style type="text/css">
		.ga-table {
			width:40%;
			max-width:898px;
			margin-left:25%;
		}
	</style>

	<j:set var="jvar_oauth_requestor" value="${sysparm_oauth_requestor}" />
	<j:set var="jvar_oauth_requestor_context" value="${sysparm_oauth_requestor_context }" />
	<j:set var="jvar_oauth_provider_profile" value="${sysparm_oauth_provider_profile}" />
	<j:set var="jvar_oauth_provider_id" value="${sysparm_oauth_provider_id}" />
	<j:set var="jvar_oauth_personal" value="${sysparm_oauth_personal}" />
	<j:set var="jvar_use_mid" value="${sysparm_use_mid}" />
	<j:set var="jvar_mid_server" value="${sysparm_mid_server}" />
	<j:set var="jvar_token_exchange_profile_id" value="${sysparm_token_exchange_profile_id}" />

	<g:if_polaris>
		<g:then>
			<g:requires name="styles/polarisberg/css_includes_polarisberg.css" includes="true" />
		</g:then>
		<g:else>
			<g:requires name="styles/heisenberg/heisenberg_all.css" includes="true" />
		</g:else>
	</g:if_polaris>
    <g:ui_form>

    	<div class="notification notification-failure" id="divNotification" style="display:none;">
			<button data-dismiss="alert" class="btn-icon close icon-cross">
				<span class="sr-only">Close</span>
		    </button>
		</div>
	   	<table class="ga-table">
	   		<tr valign="center">
	   	  		<td align="center">
					<div class="form-group">
  		      			<label for="username" class="control-label col-sm-3">Username</label>
   		      			<span class="col-sm-9 form-field">
							<input id="username" class="col-sm-9 form-control" type="text" name="username" onKeyPress="return ignoreEnter(event);" />
   		      			</span>
		    		</div>
					<br/>
		    		<div class="form-group">
  		      			<label for="password" class="control-label col-sm-3">Password</label>
   		      			<span class="col-sm-9 form-field">
       	 	    			<input id="password" class="col-sm-9 form-control" type="password" name="password" onKeyPress="return ignoreEnter(event);" />
   		      			</span>
		    		</div>
				</td>
	   		</tr>
	   		<tr>
	   			<td>
	   				<br/>
	   			</td>
	   		</tr>
	   		<tr>
	   			<td align="center">
	   				<footer class="modal-footer">
						<button class="btn btn-default" id="btnCancel" onclick="closeSelf(); return false;">${gs.getMessage('Cancel')}</button>
						<button class="btn btn-primary" id="btnGetToken" onclick="initiateOAuthFlow(); return false;">${gs.getMessage('Get OAuth Token')}</button>
					</footer>
				</td>
	   		</tr>
	   	</table>

		<input type="hidden" name="requestor" id="requestor" value="${jvar_oauth_requestor}"/>
		<input type="hidden" name="personal" id="personal" value="${jvar_oauth_personal}"/>
		<input type="hidden" name="requestor_context" id="requestor_context" value="${jvar_oauth_requestor_context}"/>
		<input type="hidden" name="oauth_provider_profile" id="oauth_provider_profile" value="${jvar_oauth_provider_profile}"/>
		<input type="hidden" name="oauth_provider_id" id="oauth_provider_id" value="${jvar_oauth_provider_id}"/>
		<input type="hidden" name="token_exchange_profile_id" id="token_exchange_profile_id" value="${jvar_token_exchange_profile_id}"/>
		<input type="hidden" name="use_mid" id="use_mid" value="${jvar_use_mid}"/>
		<input type="hidden" name="mid_server" id="mid_server" value="${jvar_mid_server}"/>
    </g:ui_form>
</j:jelly>
