<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<style>
div.cqContainer {
  margin: 0 auto;
  width: 100%;
}

div.cqContainer h1 {
  width: 100%;
  background-color: black;
  font-size: 12pt;
  color: white;
  padding: 2px 5px 2px 5px;
}

div.cqConnectionFields {
  width: 470px;
  margin: 0 0 0 10px;
}

div.cqField {
  float: left;
}

div.cqLabel {
  font-weight: bold;
}

div.cqClear {
  clear: both;
}

div.queryButton {
  margin: 0 0 0 210px;
}

input#cqPort {
  width: 40px;
}

input#cqNamespace {
  width: 180px;
}

p#cqResultStatus {
  margin: 2px 0px 2px 5px;
  font-size: 8pt;
}

div.cqAreaField {
  width: 460px;
  margin-top: 10px;
  padding-left: 10px;
  padding-right: 10px;
}

div.cqAreaField textarea {
  width: 460px;
  height: 50px;
  margin: 0;
  padding: 0;
}

div#cqResponse {
  width: 798px;
  min-height: 598px;
  font-family: Arial, Helvetica;
  font-size: 8pt;
}

div.cqResponseInstance {
  background-color: block;
  width: 200px;
}

div.cqResponseInstanceMaximized {
  background-color: block;
  width: 400px;
}

div.cqResponseInstanceClass {
  width: 200px;
  background-color: black;
  color: white;
  text-align: center;
  margin: 5px 5px 5px 5px;
}

div.cqResponseInstanceClassMaximized {
  background-color: black;
  color: white;
  text-align: center;
  width: 400px;
  font-weight: bold;
}

table.cqResponseInstanceProperties {
  width: 400px;
  border: 1px solid black;
  display: none;
}

table.cqResponseInstancePropertiesMaximized {
  width: 400px;
  border: 1px solid black;
  display: block;
}

table.cqResponseInstanceProperties th {
  text-align: left;
  vertical-align: top;
}

</style>

<div class="cqContainer">
<h1>CIM Query Tool</h1>
<form>

<div class="cqConnectionFields">
<div class="cqField">
<div class="cqLabel">Schema</div>
<div class="cqValue"><select id="cqSchema"><option value="https">https</option><option value="http">http</option></select><strong>://</strong> </div>
</div><!-- cqField -->

<div class="cqField">
<div class="cqLabel">IP</div>
<div class="cqValue"><input type="text" id="cqIp"/><strong>:</strong> </div>
</div><!-- cqField -->

<div class="cqField">
<div class="cqLabel">Port</div>
<div class="cqValue"><input type="text" id="cqPort"/> <strong>/</strong> </div>
</div><!-- cqField -->

<div class="cqField">
<div class="cqLabel">Namespace</div>
<div class="cqValue"><input type="text" id="cqNamespace"/></div>
</div><!-- cqField -->

<div class="cqClear"></div>

<div class="cqLabel">Version</div>
<div class="cqValue">
    <select id="cqVersion">
        <option value="modern">Modern</option>
        <option value="legacy">Legacy</option>
    </select>
</div>

<div class="cqClear"></div>

</div><!-- cqConnectionFields -->

<div class="cqAreaField">
<div class="cqLabel">Query</div>
<div class="cqArea"><textarea id="cqQuery"></textarea></div>
</div><!-- cqArea -->

<div class="queryButton"><button id="cqQueryButton">Query</button></div>

<div class="cqAreaField">
<div class="cqLabel">Response</div>
<p id="cqResponseStatus"></p>
<div class="cqArea"><div id="cqResponse"></div></div>
</div><!-- cqArea -->

</form>
</div><!-- cqContainer -->

</j:jelly>
