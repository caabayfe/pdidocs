<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<j:set var="jvar_property_basic_mandatory" value="${gs.getProperty('glide.cmdb.csdm.app_service.basic.mandatory_values')}" />
	<j:set var="jvar_property_relationship_mandatory" value="${gs.getProperty('glide.cmdb.csdm.app_service.relationship.mandatory_values')}" />
	<style>
		table {
			width: 100%;
		}
		table tr td {
			vertical-align: top;
		}
		table label {
			font-weight: bold;
		}
		.table-col-1 {
			width: 160px;
		}
		.csdm-slushbucket {
			max-width: 967px;
		}
		.btn-csdm-save {
			margin-left: 5px;
		}
		.slushbucket-top select option {
			text-transform: capitalize;
		}
		hr {
			margin: 18px 0; 
		}
		#slush_basic_csdm {
			margin-bottom: 12px;
		}
	</style>
	<nav class="navbar navbar-default" role="navigation">
		<div class="container-fluid">
			<div class="navbar-header">
				<button id="back_button" class="btn btn-default icon-chevron-left navbar-btn" onclick="history.go(-1)" type="button"></button>
				<h1 class="navbar-title" style="display:inline-block;">${gs.getMessage("Service Instance Settings")}</h1>
			</div>
		</div>
	</nav>
	<div class="container">
		<div class="row">
			<div class="col-xs-12">
				<h2>
					${gs.getMessage("Service Instance Settings")}
				</h2>
				<p>
					${gs.getMessage("Define required attributes and relationships for service instances.")}
				</p>
				<hr/>
			</div>
		</div>
	</div>
	<div class="container csdm-slushbucket">
		<g:ui_form>
			<input id="sysPropertyBasicMandatory" type="hidden" name="sysPropertyBasicMandatory" value="${jvar_property_basic_mandatory}"/>
			<input id="sysPropertyRelationshipMandatory" type="hidden" name="sysPropertyRelationshipMandatory" value="${jvar_property_relationship_mandatory}"/>
			<table>
				<tr>
					<td class="table-col-1">
						<label>
							${gs.getMessage("Required attributes")}
						</label>
					</td>
					<td>
						<g:ui_slushbucket name="slush_basic_csdm"/>
					</td>
				</tr>
			</table>
			<table>
				<tr>
					<td class="table-col-1">
						<label>
							${gs.getMessage("Required relationships")}
						</label>
					</td>
					<td>
						<g:ui_slushbucket name="slush_relationship_csdm"/>
					</td>
				</tr>
			</table>

			<div class="row">
				<div class="col-xs-5 col-xs-offset-7">
					<button class="btn btn-default btn-csdm-cancel" onclick="return onCancel();" name="cancel" id="cancel" aria-label="${gs.getMessage('Cancel')}">${gs.getMessage('Cancel')}</button>
					<button class="btn btn-primary btn-csdm-save" name="submit"  onclick="onSave();" id="save" aria-label="${gs.getMessage('Save')}">${gs.getMessage('Save')}</button>
				</div>
			</div>
		</g:ui_form>
	</div>
</j:jelly>
