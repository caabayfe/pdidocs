description: |-
  Allows the user to select the Approval Engine to use for each task table.  The available engines are:

     Approval Rules - approvals are managed by using Approval Rules
     Process Guides - approvals are managed by using Process Guides
     Turn engines off - don't use approval engines. Use this setting if Workflows are managing approvals

  The selected approval engine is stored in a property with the name:
     glide.approval_engine.<table_name>

  and may contain:
     approval_engine (for approval rules)
     process_guide (for process guides)
     off (don't use approval engines, use this setting if there are workflows managing the approvals for this table)
direct: 'false'
