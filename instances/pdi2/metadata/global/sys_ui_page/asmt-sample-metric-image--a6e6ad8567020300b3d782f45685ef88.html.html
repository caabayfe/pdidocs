<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="true" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:requires name="scripts/asmt/thirdparty/html2canvas.min.js" includes="true" />
	<g:requires name="styles/assessment.css" includes="true" />
	<g:evaluate var="jvar_typeId" jelly="true">
		jelly.sysparm_type;
	</g:evaluate>
	<g:evaluate var="jvar_metricId" jelly="true">
		jelly.sysparm_sample_metric;
	</g:evaluate>
	<div id="sample_assessment">
		<div class="assessment">
			<table class="wrap">
				<tbody>
					<g:com.snc.sample_assessment type="${jvar_typeId}" metric="${jvar_metricId}" />
				</tbody>
			</table>
		</div>
	</div>
	<form id="sample_assessment_attachment_form"
		  name="sample_assessment_attachment_form"
		  action="sys_attachment.do"
		  enctype="multipart/form-data"
		  method="post"
		  target="upload_target"
		  style="display:none">
		<input name="sysparm_sys_id" type="hidden" value="${jvar_typeId}" />
		<input name="sysparm_table" type="hidden" value="ZZ_YYasmt_metric_type" />
		<input name="max_size" type="hidden" value="1024" />
		<input id="sample_assessment_metric_id" name="metric_id" type="hidden" value="${jvar_metricId}" />
	</form>
	<div id="sample_assessment_ok_button" style="float:right;display:none">
		<g:dialog_button_ok ok="GlideDialogWindow.get().destroy();" ok_text="${gs.getMessage('Ok')}"/>
	</div>
</j:jelly>
