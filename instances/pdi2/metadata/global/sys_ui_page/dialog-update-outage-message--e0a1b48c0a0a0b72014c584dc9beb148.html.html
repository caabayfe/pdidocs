<g:ui_form>
<div style="padding:10px;">
  <input id="new_message_input" name="new_message_input" onfocus="this.select()" size="50" maxlength="40" value="${sysparm_message}" title="${gs.getMessage('Update Outage Message')}"/>
  <input type="hidden" id="outage_id" name="outage_id" value="${sysparm_outage_id}"/>

  <div style="text-align:right;">
    <g:dialog_buttons_ok_cancel ok="return actionOK()" ok_id="ok_button" cancel_type="button" />
  </div>

  <script>
    gel("new_message_input").focus();
  </script>

</div>
</g:ui_form>
