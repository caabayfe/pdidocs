<g:evaluate var="jvar_doc" expression="GlideMobileExtensions.getDeviceType() == 'doctype'"/>
<style>
    .edge-input-fix::-ms-clear {
        display:none;
    }
</style>
<j:if test="${!jvar_doc}">
	<g:macro_invoke macro="ui_on_call_escalation_report_non_doctype" />
</j:if>
<j:if test="${jvar_doc}">
	<g:macro_invoke macro="ui_on_call_escalation_report_doctype" />
</j:if>
