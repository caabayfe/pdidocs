<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:evaluate var="jvar_list" jelly="true">
		jelly.sysparm_list_view;
	</g:evaluate>
   <div style="text-align:left;">
      <br/>
	   <j:if test="${jvar_list== 'list'}">
      <div>${gs.getMessage('Delete the selected record(s)?')} </div>
		   <br/>
			<div align="right" class="modal-footer flex">
         <g:dialog_buttons_ok_cancel ok="return ok()" cancel="return cancel()" ok_type="button" ok_style_class="btn btn-destructive" ok_text="${gs.getMessage('Delete')}" cancel_text="${gs.getMessage('Cancel')}" cancel_type="button"/>
      </div>
		   </j:if>
	    <j:if test="${jvar_list== 'form'}">
			<div>${gs.getMessage('Are you sure you want to delete this document list entry?')} </div>
			<br/>
			<div align="right" class="modal-footer flex">
         <g:dialog_buttons_ok_cancel ok="return ok_form()" cancel="return cancel()" ok_type="button" ok_style_class="btn btn-destructive" ok_text="${gs.getMessage('Delete')}" cancel_text="${gs.getMessage('Cancel')}" cancel_type="button"/>
      </div>
			</j:if>
      <br/>
   </div>
</j:jelly>
