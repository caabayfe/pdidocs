<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

<g:ui_form>
    <input type="hidden" name="selection_result" id="selection_result" value=""/>
    <input type="hidden" name="my_sys_id" id="my_sys_id" value="${RP.getWindowProperties().get('sys_id')}"/>
	<j2:if test="$[!empty(sysparm_domain)]">
		<input type="hidden" id="sysparm_domain" name="sysparm_domain" value="${sysparm_domain}"/>
	</j2:if>
	<j2:if test="$[!empty(sysparm_domain_scope)]">
		<input type="hidden" id="sysparm_domain_scope" name="sysparm_domain_scope" value="${sysparm_domain_scope}" />
	</j2:if>
    <div style="text-align:left;">           
      <div> ${gs.getMessage('Cancel this contract?')} </div><br/>
      <br/>
      
      <div align="right">
        <g:dialog_buttons_ok_cancel ok_text="Yes" ok_title="Cancel current contract" ok="return actionOK();" cancel_text="No" cancel_title="Go back to contract" cancel="return cancel();"/>
      </div>
    </div>
</g:ui_form>
</j:jelly>
