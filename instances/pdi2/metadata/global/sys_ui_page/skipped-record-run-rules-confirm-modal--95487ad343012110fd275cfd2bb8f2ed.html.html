<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

	 <!-- MODAL PARAMS -->
  	<j:set var="jvar_message" value="${sysparm_message}"/>
	<j:set var="jvar_showlink" value="${sysparm_showlink}"/>
	
	<!-- BODY -->
	<div class="body-container">
		<input type="hidden" id="confirmModalAction" value="cancel"/>
		<p class="target-modal-message">${jvar_message}</p>
		<j:if test="${jvar_showlink}">
			<p class="target-modal-message"><a href="javascript:void(0)" onclick="redirectToUpgradeHistoryRecord()">${gs.getMessage('Latest Upgrade history record')}</a>$[SP]${gs.getMessage('for further details.')}</p>
		</j:if>
	</div>

	<!-- BUTTONS -->
	<div class="buttons-container">
		<button id="cancelButton" onclick="cancelPage()">${gs.getMessage('Cancel')}</button>
		<button class="btn btn-destructive" id="submitButton" onclick="executeButtonAction()">${gs.getMessage('Run Now')}</button>
	</div>
	
	<style type="text/css">
		.body-container {
			margin: 8px 0 10px 20px;
		}
		
		.target-modal-message {
			margin-left: 14px;
			display:inline-flex;
			width:90%
		}

		.btn-destructive {
			margin-left: 10px;
		}
		
		.buttons-container {
			text-align: right;
		}
	</style>
</j:jelly>
