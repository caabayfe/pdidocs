<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">	
	<g:evaluate var="jvar_url" jelly="true">
		var url = '';
		var previewAttachmentId = jelly.sysparm_attachmentId;
	
		if (!gs.nil(previewAttachmentId))
		    url = 'sys_attachment.do?sys_id=' + previewAttachmentId + '&amp;view=true';
		url;
	</g:evaluate>
<iframe id="rtbi_template_pdf" src="${jvar_url}" type="application/pdf" style="width:100%;height:700px" class="animate hidden-xs" title="${gs.getMessage('Preview Report')}"></iframe>
</j:jelly>
