description: "Zing text search usage dashboard: shows tables with text indexing currently enabled (live query, no cache table) and their 1/7 day search plus recent index-churn stats (churn window clamped to the instance's sysevent retention), with Disable/Enable actions; and a second section of previously-indexed-but-now-disabled tables. Replaces the plain list-view UI and the nightly-cron staging-table architecture per design review feedback - the cron on sysevent was flagged as slow-query risk, so all stats are computed on demand when an admin opens this page instead."
