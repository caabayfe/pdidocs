<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<div>
		<div class="headerMessage">
			${gs.getMessage('ATF:Performance Test Notice')}
		</div>
		<br/>
		<div class="input-group-checkbox testRunnerCell" title="${gs.getMessage('ATF:perf_pause_acknowledge_hint')}">
			<input id="perfPauseAcknowledged" type="checkbox" class="checkbox"></input>
			<label for="perfPauseAcknowledged" class="checkbox-label">
				<b>${gs.getMessage('ATF:perf_pause_acknowledge_message')}</b>
			</label>
		</div>
		<br/>
		<footer align="right" class="modal-footer" style="padding-top: 15px;">
			<button class="btn btn-default" onClick="GlideModal.get().destroy()"> ${gs.getMessage('Cancel')}</button>
			<button class="btn btn-primary" onClick="submitPerformanceSchedule()" id="submit_button">
				Schedule Performance Run
			</button>
		</footer>
	</div>
</j:jelly>
