<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
		input {
			width: 250px;
			margin-left: 5px;
		}
		#form {
			padding: 15px 5px;
		}
		td {
			padding-bottom: 1em;
		}
		textarea {
			resize: none;
			width: 250px;
			margin-left: 5px;
		}
		.required-label:before {
			content: '*';
			color: red;
		}
		#error-msg {
			visibility: hidden;
			color: red;
		}
	</style>
	
	<div id="form">
		<div class="instructions">
			<p>${gs.getMessage("Only embedded videos from Youtube, Vimeo and Brightcove are supported. Copy the entire embedded video snippet into the text area below.")}</p>
		</div>
		<table>
			<tbody>
				<tr>
					<td class="required-label">${gs.getMessage("Embedded Snippet")}:</td>
					<td>
						<textarea id="embedded-link"> </textarea>
					</td>
				</tr>
				<tr>
					<td class="required-label">${gs.getMessage("Label")}:</td>
					<td class='required'><input id="label" type="text"></input></td>
				</tr>
			</tbody>
		</table>
		<p id="error-msg">${gs.getMessage("You are missing fields or entered an invalid value")}</p>
	</div>
	<div style="border-top: 1px solid #dfdfdf; padding:6px;align:right;">
	   <span style="float:right;padding-bottom:4px;">
		  <g:dialog_button_ok ok="return onSubmit()" ok_id="ok_button" />
	   </span>
	</div>
</j:jelly>
