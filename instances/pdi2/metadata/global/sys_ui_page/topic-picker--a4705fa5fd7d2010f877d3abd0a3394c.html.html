<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:inline template="ie_checker.xml" />
	<g:requires name="scripts/lib/jquery_includes.js"/>
	<g:include_script src="jquery_columnview.jsdbx"/>

	<g:evaluate>
		var topicPickerCallback = RP.getWindowProperties().get('topicPickerCallback');
	</g:evaluate>
	<p id="err_message" class="notification notification-error" style="display:none"></p>
	<div id="topic_picker" style="display:block; padding: 5px 10px">
		<div id="taxonomy_selector" style="padding-bottom:25px">
			<div style="padding-bottom:4px;width:100%">
				<label for="taxonomy" class="control-label">${gs.getMessage('Taxonomy')}</label>
			</div>
			<div class="col-lg-3 col-md-5 col-sm-6 col-xs-7 input-group">
				<select id="taxonomy" class="form-control" style="width:260px" aria-label="${gs.getMessage('Select taxonomy')}">
				</select>
			</div>
		</div>
		<span id="body_kb_categories_dialog" class="widget_body" style="width:750px">
			<div id="taxonomyTopicJSON" style="display:none"/>
			<input type="hidden" id="topicId" value="" />
			<div id="dialog_buttons" align="left">
				<g:dialog_buttons_ok_cancel ok="createContentMappingWithTopic()" ok_style_class="btn btn-primary category-ok-btn" ok_type="button" cancel_type="button"/>
			</div>
		</span>
	</div>

	<!-- placeholders to read the icon char code from by name. -->
	<span class="icon-edit" style="visibility:hidden; position:absolute;"/>
	<span class="icon-chevron-right" style="visibility:hidden; position:absolute;"/>
	<span class="icon-chevron-left" style="visibility:hidden; position:absolute;"/>

</j:jelly>
