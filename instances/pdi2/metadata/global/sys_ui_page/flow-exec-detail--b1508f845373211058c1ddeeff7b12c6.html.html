<?xml version="1.0" encoding="utf-8" ?>
 <j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
 	<g:requires name="jsonTreeViewer/jsonTree/jsonTree.js" includes="true"/>
 	<g:requires name="scripts/jsonTreeViewer/jsonTree/jsonTree.css"/>
 	<g:requires name="scripts/lib/jquery_includes.js" includes="true"/>

 	<head>
 		<style>
 			#buttons {
 				  top: 5px;
 				  margin-left: 10%;
 				  width: 100%;
 				  padding: 10px;
 			}

 			.tree-div {
 				display: none;
 			}

 			.tree-button {
 				disabled: false;
				margin-left: 10px;
 			}

 			#color-legend {
 				width: 25% !important;
 				text-align: center;
 				margin-left: 10%;
 				padding: 10px;
 			}

 			#error-list {
 				margin-left: 5%;
 			    margin-right: 5%;
 				padding: 10px;
 				border-style: solid;
 			    border-color: red;
 			    border-width: 2px;
 			    display: none;
 			}

 			.completed {
 				background-color: #D5FED0;
 			}
 			.quiesced {
 				background-color: #fce0b3;
 			}
 			.notready {
 				background-color: #D8D8D7;
 			}
 			.error {
 				background-color: #FED0D0;
 			}
 			.cursor_name {
 				margin-left: 10px;
 				background-color: grey;
 				color: white;
 				padding: 4px;
				border-radius: 5px;
 			}
 			.cursor {
 				text-decoration: underline;
 			}
			.load_rt_link {
				background: #8b3dff;
				color: white;
				padding: 4px;
				margin-left: 10px;
				border-radius: 5px;
			}
			a.load_rt_link:hover {
				color: white
			}
			a.load_rt_link:visited {
				color: white
			}
 		</style>
 	</head>


 	<body onload="start()">
 		<div id="buttons">
 			<button type="button" class="tree-button" target="detailed_view" id="button-detailed_view">Instructions Group by Component</button>
 			<button type="button" class="tree-button" target="compiled_flow" id="button-compiled_flow">Compiled Flow</button>
 			<button type="button" class="tree-button" target="runtime_state" id="button-runtime_state">Runtime State</button>
			<button type="button" class="tree-button" target="runtime_values" id="button-runtime_values">Runtime Values</button>
 			<button type="button" id="expand-all" onclick="expandAll()" style="float: right;margin-right: 25%;margin-left: 10px">Expand All</button>
 			<button type="button" id="collapse-all" onclick="collapseAll()" style="float: right;margin-left: 10px">Collapse All</button>
 		</div>
 		<div class="tree-div" id="div-detailed_view">
 			<div>
 				<ul id="color-legend">
 					<li>Color Legend</li>
 					<li style="background-color: #D5FED0;">COMPLETE</li>
 					<li style="background-color: #fce0b3;">QUEUED, READY</li>
 					<li style="background-color: #D8D8D7;">NOT_READY</li>
 					<li style="background-color: #FED0D0;">ERROR</li>
 				</ul>
 			</div>
 			<div id="error-div">
 				<ul id="error-list">
 					<li><h5>Error(s)</h5></li>
 					<li></li>
 				</ul>
 			</div>
 			<div id="detailed_view">
 			</div>
 		</div>
 		<div class="tree-div" id="div-compiled_flow">
 			<div id="compiled_flow">
 			</div>
 		</div>
 		<div class="tree-div" id="div-runtime_state">
 			<div id="runtime_state">
 			</div>
 		</div>
 		<div class="tree-div" id="div-runtime_values">
 			<div id="runtime_values">
 			</div>
 		</div>
  </body>
 </j:jelly>
