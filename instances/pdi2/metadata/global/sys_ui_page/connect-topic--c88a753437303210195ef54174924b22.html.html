<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<style>
        #container-td {
            padding-top: 5px;
        }

        .top-buffer {
            padding-top: 3px;
        }

        .bottom-buffer {
            padding-bottom: 5px;
        }
        #ok-cancel-btns {
            padding-left: 15px;
            padding-right: 15px;
        }
    </style>

    <table width="100%">
        <tr>
            <td align="center" valign="middle" id="container-td">
                <div class="container-fluid form-horizontal">
                    <div class="row top-buffer bottom-buffer">
                        <div class="col-sm-4 control-label">${sysparm_underlying_topic_label}</div>
                        <div class="col-sm-8">
                            <g:evaluate object="true">
                                var tbl = RP.getWindowProperties().get('sysparm_underlying_topic_table');
								var refHelper = new StreamConnectUtils();
                                var refQuery = refHelper.getUnlinkedUnderlyingTopicRefQuery(tbl);
								jvar_refQuery = refQuery || '';
                            </g:evaluate>
                            <g:ui_reference name="sysparm_underlying_topic_sys_id" class="form-control" table="${sysparm_underlying_topic_table}" query="${refQuery}" value="" displayValue=""/>
                            <input type="hidden" id="sysparm_topic_alias_sys_id" name="sysparm_topic_alias_sys_id" value="${sysparm_topic_alias_sys_id}"/>
                            <input type="hidden" id="sysparm_underlying_topic_table" name="sysparm_underlying_topic_table" value="${sysparm_underlying_topic_table}"/>

                        </div>
                    </div>
                    <div class="row top-buffer">
                        <div id="ok-cancel-btns" class="col-sm-offset-4 pull-left">
                            <g:dialog_buttons_ok_cancel class="form-control"/>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>


</j:jelly>
