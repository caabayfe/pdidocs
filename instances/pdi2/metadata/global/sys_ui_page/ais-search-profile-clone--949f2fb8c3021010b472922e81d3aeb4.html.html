<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

<g:ui_form>
  <div class="form-group is-required" id="ais_search_profile_clone_form_group">
    <label for="clone_message" id="clone_message" class="control-label col-sm-4 text-right">
      ${gs.getMessage("Cloned search profile label:")}
    </label>
    <span class="col-sm-8">
      <input id="sysparm_clone_label" placeholder="" name="sysparm_clone_label" value="" autocomplete="off" class="form-control" type="label" maxlength="100" aria-describedby="error_msg_clone_label"/>
    </span>
  </div>
  <br/>
  <div id="dialogbuttons" style="float:right">
    <g:dialog_buttons_ok_cancel ok="return actionOK();"/>
  </div>
</g:ui_form>
</j:jelly>
