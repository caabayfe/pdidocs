<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <g:ui_form>
        <style>
            .modal-container {
                padding: 20px;
            }

            .modal-message {
                margin-bottom: 30px;
                line-height: 1.5;
            }

            .modal-buttons {
                text-align: end;
            }
        </style>

        <div class="modal-container">
            <div id="confirm-message" class="modal-message"></div>

            <div class="modal-buttons">
                <button class="btn btn-default" onclick="cancelChange()" style="margin-right: 10px;">
                    ${gs.getMessage("Cancel")}
                </button>
                <button class="btn btn-danger" onclick="confirmChange()">
                    ${gs.getMessage("Yes, proceed")}
                </button>
            </div>
        </div>
    </g:ui_form>
</j:jelly>
