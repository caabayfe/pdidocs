<g:ui_form>
<input type="hidden" id="cancelled" name="cancelled" value="false"/>
<input type="hidden" id="consumable" name="consumable" value="${sysparm_sys_id}"/>
<input type="hidden" id="total_qty" name="total_qty" value="${sysparm_total_qty}"/>
<input type="hidden" id="status" name="status" value="${sysparm_status}"/>
<j2:if test="$[!empty(sysparm_domain)]">
	<input type="hidden" id="sysparm_domain" name="sysparm_domain" value="${sysparm_domain}"/>
</j2:if>
<j2:if test="$[!empty(sysparm_domain_scope)]">
	<input type="hidden" id="sysparm_domain_scope" name="sysparm_domain_scope" value="${sysparm_domain_scope}" />
</j2:if>
<table width="100%" style="border-spacing:10px; height:100px;">
	<tr>
		<td rowspan="5" nowrap="true" width="110px" style="vertical-align:top;">
 			<img src="images/plugin_activate.gifx" alt="${gs.getMessage('Retire consumable')}" style="vertical-align:top;" />
		</td>
	</tr>
	<tr>
		<td style="text-align:right;">
			<label style="color:red">*</label><label>${gs.getMessage('Stockroom:')}$[SP]</label>
		</td>
		<g:if_polaris>
			<g:then>
				<td style="padding:10px;">
					<g:ui_reference name="alm_stockroom" table="alm_stockroom"/>
				</td>
			</g:then>
			<g:else>
				<td>
					<g:ui_reference name="alm_stockroom" table="alm_stockroom"/>
				</td>
			</g:else>
		</g:if_polaris>
	</tr>
	<tr>
		<td style="text-align:right;">
			<label style="color:red">*</label><label>${gs.getMessage('Quantity:')}$[SP]</label>
		</td>
		<td style="padding:10px;">
			<input class="form-control" id="qty" name="qty" value="${sysparm_total_qty}" type="number"/>
		</td>
	</tr>
    <tr>
        <td style="width:150px; text-align:right;">
			<label>${gs.getMessage('Status:')}$[SP]</label>
		</td>
		<td style="padding:10px;">
			<label>${sysparm_status_label}</label>
		</td>
    </tr>
    <tr>
		<td style="width:150px; text-align:right;">
			<label id="select_substate">${gs.getMessage('Substate:')}$[SP]</label>
		</td>
		<td colspan="2" style="padding:10px;">
			<select aria-labelledby="select_substate" class="form-control" id="substatus" name="substatus" for="substatus" label="${gs.getMessage('Substate:')}">
				<g:evaluate var="jvar_choices" object="true">
					var choices = [];
					var gr = new GlideRecord('sys_choice');
					var current_language = gs.getSession().getLanguage();
					gr.addQuery('name', 'alm_asset');
					gr.addQuery('element', 'substatus');
					gr.addQuery('dependent_value', ${sysparm_status});
					gr.addQuery('value', 'NOT IN', ['pending_transfer', 'pre_allocated', 'pending_install']);
					gr.addQuery('language', current_language);
					gr.addQuery('inactive', false);
					gr.orderBy('sequence');
					gr.orderBy('value');
					gr.query();
					while (gr.next()) {
						choices.push({
						'value' : gr.value.toString(),
						'label' : gr.label.toString()
						});
					}
					choices;
				</g:evaluate>
				<j:forEach items="${jvar_choices}" var="jvar_choice">
					<option value="${jvar_choice.value}">${jvar_choice.label}</option>
				</j:forEach>
			</select>
		</td>
    </tr>

    <tr id="dialogbuttons">
        <td colspan="3" align="right" style="padding:10px">
            <g:dialog_buttons_ok_cancel ok="return okHandler();" cancel="cancel();"/>
        </td>
    </tr>
</table>
</g:ui_form>
