<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<g:ui_form>
  <!-- Get values from dialog preferences passed in -->

  <g:evaluate var="jvar_errors_list" object="true">
	var errors = [];
	var errorList = RP.getWindowProperties().get('errorList');
	errors = errorList.split(";");
	errors;
  </g:evaluate>
	
   <!-- Set up form fields and labels -->
   <table width="100%">
	   
	   <j:forEach items="${jvar_errors_list}" var="jvar_errorMsg" indexVar="jvar_index">
		   <tr>
			   <td><li>${jvar_errorMsg}</li></td>
		   </tr>
	   </j:forEach>
	   <tr>
		   <td>
			   <br/>
		   </td>
	   </tr>
	   <tr>
		   <td colspan="2" align="right">
			  <g:dialog_button
				id="hold_for_review"
				type="${jvar_ok_type}"
				style_class="btn btn-primary"
				onclick="return cancel();"
				style="min-width: 5em;">${gs.getMessage('Ok')}</g:dialog_button>
		   </td>
	   </tr>
  </table>
</g:ui_form>
</j:jelly>
