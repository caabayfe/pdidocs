<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
        #suggestText.text {
            width: 100%;
            height: 133px;
            resize: none;
        }
        .button-box {
		    margin-top:8px;
            text-align: right;
        }
        .rtl .button-box {
            text-align: left;
        }
        .button {
            margin: 5px;
        }
        .button-box #errorMsg {
			float: left;
			color: #c83c36;
			margin: 0 5px;
		}
		.-polaris .button-box #errorMsg {
			float: left;
			color: RGB(var(--now-color_alert--critical-3, 160, 48, 43));
			margin: 0 5px;
		}
		.required-marker::before{
			color:RGB(var(--now-color_alert--critical-3, 200, 60, 54)) !important;
        }
        .rtl .button-box #errorMsg {
            float: right;
        }
		#suggestChangeCancel{
		   margin-right:10px;
		}
    </style>
    <j2:set var="jvar_hide_response_time" value="true" />
	
    <div class="text-box is-required">
		<span title="${gs.getMessage('Reason required for flagging the article.')}" aria-label="${gs.getMessage('Reason required for flagging the article.')}" mandatory="true" class="required-marker" role="note"></span>
        <label for="suggestText"><strong>${gs.getMessage('Reason')}</strong></label>
		<textarea id="suggestText" class="text form-control" aria-required="true"></textarea>
    </div>

    <div class="button-box">
        <button id="suggestChangeCancel" class="btn btn-default">${gs.getMessage("Cancel")}</button>
        <button id="suggestChange" class="btn btn-primary">${gs.getMessage("Submit")}</button>
        <span aria-live="polite" id="errorMsg"></span>
    </div>
    <script type="text/javascript">
      addLoadEvent(function() {
        setTimeout(function() {
          var e = $("suggestText");
          if (e)
            e.focus();
        }, 100);
      });
    </script>
</j:jelly>
