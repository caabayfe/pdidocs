<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

<g:ui_form>
	<g:evaluate>
		var currentTable = RP.getWindowProperties().get('current_table') || '';
		var sysIdList = RP.getWindowProperties().get('sys_id_list') || '';
		var numSel = (sysIdList.split(',')).length;

	</g:evaluate>

	<input type="hidden" name="current_table" value="$[currentTable]" />
	<input type="hidden" name="sys_id_list" value="$[sysIdList]" />

	<style type="text/css">
		#add_metadata_link_dialog_container input {
			width: 375px !important;
		}
	</style>

	<div id="add_metadata_link_dialog_container">
      <!-- span class="label_description" title="" mandatory="true" oclass="">$[SP]</span -->

      <j2:if test="$[sysIdList != '']">
        <div class="form-group row">
           <label for="number_of_records" class="control-label col-sm-3">${gs.getMessage('Number of Flow context records to nudge')}:</label>
           <span class="form-field">
               <input id="number_of_records" name="number_of_records" value="$[numSel]" class="form-control" type="text" disabled="disabled" />
           </span>
        </div>
	  </j2:if>

	  <div class="row">
		<div id="dialog_buttons" name="buttons" nowrap="true" style="clear:both; margin: 10px; vertical-align:bottom;" colspan="2">
			<div align="right">
				<g:dialog_buttons_ok_cancel ok="return true"/>
			</div>
		</div>
	  </div>
	</div>
</g:ui_form>

</j:jelly>
