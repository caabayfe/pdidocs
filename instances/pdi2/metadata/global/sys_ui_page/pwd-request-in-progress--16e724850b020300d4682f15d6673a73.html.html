<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:evaluate var="jvar_has_message" jelly="true">
		var hasMessage = false;
		if (RP.getWindowProperties().get('message')) {
			hasMessage = true;
		}
		hasMessage;
	</g:evaluate>
	<g:evaluate var="jvar_message"
    expression="RP.getWindowProperties().get('message')" />
	<center class="pwd-request-in-progress">
		<div>
			<span class="icon-loading"/>
		</div>
		<div class="pwd_reset_in_progress_message">
			<h4>${gs.getMessage('This might take a few minutes.')}</h4>
			<j:if test="${jvar_has_message}">
				<h4>${HTML:jvar_message}</h4>
			</j:if>
		</div>
	</center>		
</j:jelly>
