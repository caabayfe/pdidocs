<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
  <g:ui_form>
    <div class="form-group is-required" id="ais_dictionary_clone_form_group">
      <label for="label_message" id="label_message" class="control-label col-sm-4 text-right">
        ${gs.getMessage("Cloned dictionary label:")}
      </label>
        <span class="col-sm-8">
          <input id="sysparm_clone_label" placeholder="" name="sysparm_clone_label" value="" autocomplete="off" class="form-control" type="label" maxlength="100" aria-describedby="error_msg_ais_dictionary_clone"/>
        </span>
    </div>
    <br/>
    <div id="dialogbuttons" style="float:right">
      <g:dialog_buttons_ok_cancel ok="return actionOK();"/>
    </div>
  </g:ui_form>
</j:jelly>
