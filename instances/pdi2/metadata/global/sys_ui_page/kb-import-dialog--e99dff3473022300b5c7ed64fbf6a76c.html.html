<?xml version="1.0" encoding="UTF-8"?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:evaluate var="knowledge_sys_id" jelly="true">
		var knowledge_sys_id = RP.getWindowProperties().get('knowledge_sys_id');
		knowledge_sys_id;
	</g:evaluate>
	<iframe id="importArticleIframe"
		aria-label="${gs.getMessage('Upload new version')}"
		width="558px"
		height="250px"
		scrolling="no"
		frameborder="0"
		align="top"
		src="/kb_import.do?sysparm_stack=no${AND}knowledge_sys_id=$[knowledge_sys_id]">
	</iframe>	
</j:jelly>
