<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

	<g:evaluate var="jvar_apiKey" expression="RP.getWindowProperties().get('apiKey')"/>
	
	<body>
		
		<style>
			#api-key {
				float: left;
				background: #EAEAEA;
				border-radius: 5px;
				border: 1px solid #E0E0E0;
				padding: 7px;
			}
			#copy-btn {
				margin-left: 3px;
			}
		</style>
		
		<input type="hidden" id="apiKey" value="${JS,HTML:jvar_apiKey}"/>
		
		<table width="100%">
			<tr>
				<td align="center">

					<div class="input-group">
						<p id="api-key">
							<span>${JS,HTML:jvar_apiKey}</span>
						</p>
						<button id="copy-btn" onClick="copyApiKeyToClipboard()">
							<i class="icon icon-copy" title="Copy API Key"></i>
						</button>
					</div>

				</td>
			</tr>
		</table>
		
	</body>
	
</j:jelly>
