<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <g:evaluate var="authCode">
        var authCode = RP.getParameterValue('code');
        authCode;
    </g:evaluate>

    <style>
        body {
            margin: 0;
            font-family: var(--now-font-family);
            background-color: var(--background--primary);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container h2 {
            line-height: 27.24px;
            font-weight: 600;
        }

        .inner-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: var(--now-global-space--md);
            background-color: RGB(var(--now-color_background--secondary));
            border-radius: 12px;
        }

        .code-box {
            display: inline-block;
            padding: 20px 20px;
            border-radius: 8px;
            font-size: var(--now-global-font-size--lg)
        }

        .copy-button {
            min-height: var(--now-global-space--xxl);
            background-color: #4C6CEB;
            color: white;
            border: none;
            padding: 20px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }

        .copy-button .tooltiptext {
            visibility: hidden;
            width: 100px;
            background-color: black;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            margin-bottom: 70px;
            position: absolute;
            z-index: 1;
        }

        .disclaimer {
            color: rgb(var(--now-color_text--secondary));
            font-size: var(--now-global-font-size--md);
            margin-top: 20px;
            line-height: 21.79px;
        }
    </style>

    <div class="container">
        <h2>${gs.getMessage('sdk oauth auth code title')}</h2>
        <div class="inner-container">
            <div id="codeBox" class="code-box">
                ${authCode}
            </div>
            <button class="btn copy-button" onclick="copyText()"><i class="icon-copy"></i><span style="padding-left: 5px">${gs.getMessage('sdk oauth auth code button')}</span>
                <div class="tooltiptext">
                    <span>${gs.getMessage('sdk oauth auth code button tooltip')}!</span>
                </div>
            </button>

        </div>

        <div class="disclaimer">${gs.getMessage('sdk oauth auth code disclaimer')}</div>
    </div>

    <script type="text/javascript">
        function copyText() {
            var text = document.getElementById('codeBox').textContent.trim();
            navigator.clipboard.writeText(text).then(() => {
                // Show the Tooltip after copying
                var tooltip = document.querySelector('.tooltiptext');
                tooltip.style.visibility = 'visible';
                setTimeout(() => {
                    tooltip.style.visibility = 'hidden';
                }, 2000); // Tooltip visible for 2 seconds
            });
        }
    </script>
</j:jelly>
