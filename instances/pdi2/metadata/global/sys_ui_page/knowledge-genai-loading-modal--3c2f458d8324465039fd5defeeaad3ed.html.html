<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<style>
	.modal-header{;
		display:none;
	}
	.modal-title{
		color:RGB(var(--now-color_text--primary,var(--now-color_alert--moderate-3,67,69,166)));
	}
	.modal-content{
		margin-top:250px;
		border-radius: 8px;
		height: 208px ;
	}
	.sparkle-icon::before{
		font-size:24px !important;
		color:RGB(var(--now-color--primary-1,var(--now-color_alert--moderate-3,67,69,166)));
		margin-right:2px;
	}
	.icon-loading.icon-lg {
		margin-left: 50%;
		color:RGB(var(--now-color--primary-1,var(--now-color_alert--moderate-3,67,69,166)));
	}
</style>

<html lang="${gs.getSession().getLanguage()}" dir="${new global.GlobalKnowledgeUtil().getDirection()}">
    <script type="text/javascript">
      var {pushState, replaceState} = history;
    </script>
		<style>
			now-animation {
				width: fit-content;
				display: block;
				margin: auto
			}
		</style>
	</html>

<div class="modal-body" >
	<span class="icon-sn-sparkmoji-logo-outline sparkle-icon"></span>
	<span class="modal-title h4">${gs.getMessage('Drafting article...')}</span>
	<button  data-dismiss="GlideModal" onclick="closeLoadingModal()" aria-label="${gs.getMessage('Close')}" title="" class="btn btn-icon close icon-cross" id="knowledge_genAI_loading_modal_closemodal" data-original-title="${gs.getMessage('Close')}"><span class="sr-only">${gs.getMessage('Close')}</span></button><br/><br/>
	<div class="loading-indicator icon-loading icon-lg"></div>
	<br/>
</div>
</j:jelly>
