<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
  <j:set var="jvar_action_type" value="${JS:sysparm_action_type}"/>
	<style>
    
.addDocButton[disabled] {
	opacity: 50%;
}

.selectedDocTitle {
	display: inline;
	white-space: nowrap;
	width: 90%;
	float: left;
	overflow: scroll;
}

.submitDocs {
	display: block;
	margin: auto;
}

.-polaris .submitDocs{
	border: 1px solid;
		border-color: RGB(var(--now-button--secondary--border-color,var(--now-color--neutral-7,135,147,148)));
		background-color: RGBA(var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255)));
		color: RGB(var(--now-button--secondary--color,var(--now-color--neutral-18,22,27,28)));
		
}		

.selectedDocumentEntry {
	height: 25px;
}

.selectADoc {
	width: 100%;
	height: 80%;
}

.removeDocButtonContainer {
	display: inline;
	float: right;
}

.removeDocButton {
	width: 15px;
	height: 15px;
	border-radius: 3px;
	padding: 1px 1px 1px 2px;
	line-height: 0;
	text-align: center;
	border: 1px solid black;
	border-margin: 1px;
	margin: 0px 0px 7px 5px;
}

.-polaris .removeDocButton {
	border: 1px solid RGB(var(--now-color_border--primary, var(--now-color--neutral-7, 135, 147, 148)));

}

#selectedDocsHeader {
	text-align: center;
	margin: 5px;
}

#selectedDocContainer {
	overflow: scroll;
	height: 90%;
	max-height: 600px;
	border: 1px solid #E6E8EA;
	margin-bottom: 5px;
}

#-polaris #selectedDocContainer {
	border: 1px solid RGB(var(--now-color_border--secondary, var(--now-color--neutral-5, 172, 180, 181)));

}

#resultList {
	overflow: scroll;
	height: 90%;
	max-height: 600px;
	margin-top: 0px;
	margin-bottom: 5px;
	border-top: 1px solid #E6E8EA;
	border-bottom: 1px solid #E6E8EA;
	padding-left: 30px;
}

#-polaris #resultList {
	border-top: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 209, 214, 214)));
	border-bottom: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 209, 214, 214)));

}

#selectedDocs {
	float: left;
	border: 1px solid black;
	margin-left: 1%;
	width: 30%;
	height: 100%;
}

#-polaris #selectedDocs {
	border: 1px solid RGB(var(--now-color_border--primary-actionable, var(--now-color--neutral-18, 22, 27, 28)));
}


#resultDiv {
	height: 600px;
	width: 850px;
}

#results {
	height: 100%;
	float: left;
	width: 68%
}

.selectedDocList {
	padding: 1px 5px 1px 5px;
}

.addDocButton {
	margin: 5px 7px 5px 5px;
	float: right;
}
		.-polaris .addDocButton{
	border: 1px solid;
		border-color: RGB(var(--now-button--secondary--border-color,var(--now-color--neutral-7,135,147,148)));
		background-color: RGBA(var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255)));
		color: RGB(var(--now-button--secondary--color,var(--now-color--neutral-18,22,27,28)));
		
}

.docTitle {
	display: block;
	color: #1E856D;
}

.-polaris .docTitle {

	color: RGB(var(--now-color_grouped--green-3, 125, 145, 106));
}

highlight {
	background-color: lightyellow;
	font-weight: bold;
}

.-polaris highlight {
	background-color: RGB(var(--now-color_alert--warning-1, 227, 218, 96));
}

.content {
	padding: 14px;
	border: 1px solid #E6E8EA;
	background-color: #FFFFFF;
	height: 100%;
	float: right;

	width: 100%;
}

.-polaris .content {

	border: 1px solid RGB(var(--now-color_grouped--blue-2, 120, 176, 204));
	background-color: RGB(var(--now-color_background--primary, var(--now-color--neutral-0, 255, 255, 255)));

}

strong {
	font-size: 15px;
	background-color: lightyellow;
}

.-polaris strong {
	background-color: RGB(var(--now-color_alert--warning-1, 227, 218, 96));
}

.btn {
	margin-top: 20px;
	margin-left: 10px;
	width: 100px;
}

.query {
	margin-top: 20px;
	margin-left: 40px;
	width: 500px;
	font-size: 19px;
}

#searchBox {
	width: 80%;
	margin: auto;
	margin-bottom: 30px;
}

#spellCheck {
	display: none;
	padding-left: 40px;
}

.paginator {
	display: inline-block;
}

.paginator a {
	color: black;
	float: left;
	padding: 8px 16px;
	text-decoration: none;
	transition: background-color .3s;
	border: 1px solid #ddd;
	margin: 0 4px;
}

.-polaris .paginator a {

		border: 1px solid;
		border-color: RGB(var(--now-button--secondary--border-color,var(--now-color--neutral-7,135,147,148)));
		background-color: RGBA(var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255)));
		color: RGB(var(--now-button--secondary--color,var(--now-color--neutral-18,22,27,28)));
}
	</style>
	<div class="selectADoc">
		<div id="searchBox">
      <input type="text" name="query" id="query" class="query" autocomplete="off" onkeypress="keyPressSearch(event)"/>
			<input type="button" class="btn btn-default" value="Search" onclick="searchBtn()" /><br/>
		</div>
		
		<div id="resultDiv">
			<div id="results">
		      <div class="content" id="content">
						  <p id="resultHeader"></p>
		          <ol id="resultList" name="resultList"></ol>
		      </div>
			</div>
		 <div id="selectedDocs">
				 <p id="selectedDocsHeader"></p>
				 <div id="selectedDocContainer">
				<div id="selectedDocList" class="selectedDocList"></div>
				 </div>
				 <input id="addDocsBtn" class="submitDocs" type="button" value="Add Documents and Close" 
       onclick='addAndClosePage("${JS:jvar_action_type}")'/>
		 </div>
		</div>
	</div>

</j:jelly>
