<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<script type="text/javascript" src="scripts/doctype/CustomEventManager.js"/>
	<script type="text/javascript" src="scripts/lib/jquery/jquery_no_conflict.js"/>
	<script type="text/javascript" src="scripts/lib/jquery2_includes.js"/>
	<g:evaluate var="jvar_plugin_id" expression="RP.getParameterValue('app_id')"/>
	<g:evaluate var="jvar_title" expression="RP.getParameterValue('titleForPopUp')"/>
	<g:evaluate var="jvar_from" expression="RP.getParameterValue('from')"/>
	<g:evaluate var="jvar_sys_code" expression="RP.getParameterValue('sys_code')"/>
	<input type="hidden" id="app_id" value="${jvar_plugin_id}"/>
	<input type="hidden" id="title" value="Uninstall"/>
	<input type="hidden" id="from" value="${jvar_from}"/>
	<input type="hidden" id="sys_code" value="${jvar_sys_code}"/>
	<div style="margin-top:100px; font-size:15px" class="text-center" ng-if="isLoading">Loading
		<i style="margin-left:5px" class="icon-loading"></i>
	</div>
	<style>
		#sn_appclient_uninstall_app_dialog .modal-dialog {
			margin: 0px 0px 0px 0px !important;
		}
		
		#hierarchical_progress_viewer .modal-dialog {
			margin: 0px 0px 0px 0px !important;
		}

		#hierarchical_progress_viewer {
			overflow-y:hidden !important;
		}
	</style>
</j:jelly>
