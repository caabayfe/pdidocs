<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<j:set var="jvar_source_run" value="${sysparm_source_run}"/>
	<j:set var="jvar_select_message" value="${gs.getMessage('ATF:select_performance_run_to_compare')}"/>
	<j:set var="jvar_filter_query" value="${'statusIN' + sn_atf.PerformanceAPI.getComparablePerformanceRunStatuses() + '^sys_id!='}${sysparm_source_run}"/>
	<p id="err_message" class="notification notification-error" style="display:none"></p>
	<div>
		<p>${jvar_select_message}</p>
		<div>
			<g:ui_reference name="reference-picker" id="reference-picker" table="sys_atf_performance_run"  mandatory="true" query="${jvar_filter_query}" completer="AJAXTableCompleter" onchange="clearErr()" />
			<div class="modal-footer">
				<g:dialog_buttons_ok_cancel ok="return onOK();" ok_type="button"/>
			</div>
		</div>
	</div>
</j:jelly>
