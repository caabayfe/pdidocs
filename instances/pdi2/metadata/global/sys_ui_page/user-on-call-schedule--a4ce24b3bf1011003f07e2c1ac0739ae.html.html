<g:evaluate var="jvar_doc" expression="GlideMobileExtensions.getDeviceType() == 'doctype'"/>
        <j:if test="${!jvar_doc}">
            <g:macro_invoke macro="ui_user_on_call_schedule_non_doctype" />
        </j:if>
        <j:if test="${jvar_doc}">
            <g:macro_invoke macro="ui_user_on_call_schedule_doctype" />
        </j:if>
