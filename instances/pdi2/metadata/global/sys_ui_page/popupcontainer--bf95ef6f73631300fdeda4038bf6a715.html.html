<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:evaluate var="jvar_plugin_id" expression="RP.getParameterValue('plugin_id')"/>
	<g:evaluate var="jvar_scope" expression="RP.getParameterValue('scope')"/>
	<g:evaluate var="jvar_customized_version" expression="RP.getParameterValue('selectedCustomizedVersion')"/>
	<g:evaluate var="jvar_is_search_applied" expression="RP.getParameterValue('is_search_applied')"/>
	<g:evaluate var="jvar_is_filter_applied" expression="RP.getParameterValue('is_filter_applied')"/>
	<input type="hidden" id="pluginId" value="${jvar_plugin_id}"/>
	<input type="hidden" id="scope" value="${jvar_scope}"/>
	<input type="hidden" id="popup_customized_version" value="${jvar_customized_version}"/>
	<input type="hidden" id="isSearchApplied" value="${jvar_is_search_applied}"/>
	<input type="hidden" id="isFilterApplied" value="${jvar_is_filter_applied}"/>
	<style>
		#activate_plugin_confirm .modal-dialog {
			margin: 0px 0px 0px 0px !important;
		}

		#simple_progress_viewer .modal-dialog {
			margin: 0px 0px 0px 0px !important
		}
		#page_timing_div {
			display: none !important;
		}
	</style>
</j:jelly>
