<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
   <j:if test="${!sn_ui.PolarisUI.canUsePolarisTemplates()}">
		<g:requires name="styles/heisenberg/heisenberg_all.css" includes="true" />
	</j:if>
	<link href="84f0346b87120300cfab6dd207cb0b72.cssdbx?" rel="stylesheet" type="text/css"/>
	
	<div class="notification notification-success" id="divNotificationInternal" style="display:none;">
	</div>
   <j:if test="${gs.getProperty('glide.webauthn.enabled', 'false') == 'true'}">
      <g:include_script src="WebAuthnUtil.jsdbx" />
	   <main>
      <div>
      <div class="row" style="font-size: medium; margin-bottom: 3%;">
         <div id="biometric-info" class="flex col-sm-12">
			<p style="font-size: medium;">${gs.getMessage("To set up biometric authentication as an alternative factor, provide a nickname and click on Register. Then follow your web browser's instructions to complete the registration.")} ${gs.getMessage('For more details,')} <a id="docLink" href="/api/now/v1/context_doc_url/CSHelp-mfa-bio-auth" style="padding-left:3px" target="_blank"> ${gs.getMessage('view our documentation.')}</a></p>
         </div>
      </div>
         <div class="row" style="margin-bottom: 3%;">
            <div class="flex col-sm-2"/>
               <div class="flex col-sm-4">  <img src="internal_authenticator_activated.svg" alt="Built-in authenticator"/>  </div>
               <div class="flex col-sm-6">
                     <div class="form-group">
                        <label class="ga-label control-label" for="nickName">
                        <span class="required-marker">${gs.getMessage('Built-in authenticator nickname')}</span>
                        <span >${gs.getMessage('Built-in authenticator nickname')}</span>
                        </label>
                        <input id="nickName" class="form-control" type="text" required="true" maxlength="30" autofocus="autofocus" placeholder="${gs.getMessage('Nickname')}" name="nickName" aria-label="${gs.getMessage('Provide a friendly nickname for the device's built-in authenticator')}" autocomplete="off"/>
                        <div class="flex">
                           <button style="width: 100% ; margin-top: 10px;" class="btn btn-primary"  data-toggle="modal" id="btnValidate" onclick="return initiateRegistration();">${gs.getMessage('Register')}</button>
							<button class="btn btn-primary pull-right" id="btnOK" style="display:none; margin-top:10px;" onclick="closeDialog()" >${gs.getMessage('OK')}</button>
                        </div>
                     </div>
               </div>
            </div>
      </div>
	   </main>
   </j:if>
</j:jelly>
