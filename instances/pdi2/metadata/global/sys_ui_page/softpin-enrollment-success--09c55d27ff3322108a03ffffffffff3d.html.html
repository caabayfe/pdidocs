<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="true" xmlns:j="jelly:core" xmlns:g="glide" xmlns:g2="null" xmlns:j2="null">
    <j:if test="${gs.getProperty('glide.auth_factors.softpin.enrollment.enabled', 'false') != 'true'}">
        <div class="alert alert-warning">
            ${gs.getMessage('Soft PIN enrollment is not available at this time. Please contact administrator for more details')}
        </div>
    </j:if>
    <j:if test="${gs.getProperty('glide.auth_factors.softpin.enrollment.enabled', 'false') == 'true'}">
    <style>
        .success-notification-box {
            overflow: auto;
            width: 100%;
            max-width: 600px;
            -webkit-overflow-scrolling: touch;
            display: inline-block;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 50px;
            padding-top: 50px;
            margin-top: 5%;
            text-align: center;
            border: 1px solid #E0E0E0;
        }

        .success-title {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-top: 5px;
            margin-bottom: 12px;
        }

        .success-subtitle {
            font-size: 13px;
            display: block;
            margin-bottom: 15px;
        }

        .success-icon {
            font-size: 42px;
            margin-bottom: 20px;
            display: inline-block;
            color: #1f8476;
        }
    </style>
    <!-- ACTUAL PAGE STARTS HERE -->
    <g:if_polaris>
        <g:then>
            <g:inline template="polarisberg_output.xml" />
        </g:then>
        <g:else>
            <g:requires name="styles/heisenberg/heisenberg_all.css" includes="true" />
        </g:else>
    </g:if_polaris>
    <g:requires name="scripts/lib/jquery_includes.js" includes="true" />

    <center>
        <div class="success-notification-box" style="text-align:center">
            <i class="icon-success success-icon" />
            <h1 id="form_header" class="success-title">${gs.getMessage("Soft Pin Enrollment Success")}</h1>
            <h2 class="success-subtitle">${gs.getMessage('You are now enrolled')}</h2>
        </div>
    </center>

    </j:if>
</j:jelly>
