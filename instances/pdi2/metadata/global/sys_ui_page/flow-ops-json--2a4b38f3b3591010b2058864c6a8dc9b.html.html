<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:requires name="jsonTreeViewer/jsonTree/jsonTree.js" includes="true"/>
	<g:requires name="scripts/jsonTreeViewer/jsonTree/jsonTree.css"/> 
	<g:requires name="scripts/lib/jquery_includes.js" includes="true"/>
	
	<head>
		<style>
			#buttons {
				  top: 5px;
				  margin-left: 10%;
				  width: 100%;
				  padding: 10px;
			}
			
			.tree-div {
				display: none;
			}
			
			.tree-button {
				disabled: false;
			}
			
			#color-legend {
				width: 25% !important; 
				text-align: center;
				margin-left: 10%;
				padding: 10px;
			}
			
			#error-list {
				margin-left: 5%;
			    margin-right: 5%;
				padding: 10px;
				border-style: solid;
			    border-color: red;
			    border-width: 2px;
			    display: none;
			}
			
		</style>
	</head>


	<body onload="start()">
		<div id="buttons">
			<button type="button" class="tree-button" target="1" id="button1">Process Plan</button>
			<button type="button" class="tree-button" target="2" id="button2">Ops By Flow Component (Flat View)</button>
			<button type="button" id="expand-all" onclick="expandAll()">Expand All</button>
			<button type="button" id="collapse-all" onclick="collapseAll()">Collapse All</button>
		</div>
		<div class="tree-div" id="div1">
			<div id="tree1">
			</div>
		</div> 
		<div class="tree-div" id="div2">
			<div>
				<ul id="color-legend">
					<li>Color Legend</li>
					<li style="background-color: #D5FED0;">COMPLETE</li>
					<li style="background-color: #fce0b3;">QUEUED, READY</li>
					<li style="background-color: #D8D8D7;">NOT_READY</li>
					<li style="background-color: #FED0D0;">ERROR</li>
				</ul>
			</div>
			<div id="error-div">
				<ul id="error-list">
					<li><h5>Error(s)</h5></li>
					<li></li>
				</ul>
			</div>
			<div id="tree2">
			</div>
		</div> 
 </body>
</j:jelly>
