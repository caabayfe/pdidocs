<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<script>
    gel("try_project_builder").focus();
</script>
    <div class="modal-body">
        <p class="target-modal-message">${gs.getMessage("Leverage additional features and get guidance to create your project effectively.")}</p>
        <p class="target-modal-message">
            <a href="javascript:void(0)" onclick="window.open('https://docs.servicenow.com/bundle/washingtondc-now-intelligence/page/administer/process-mining/task/define-workflow-model.html', '_blank')">
                ${gs.getMessage('Learn more about Project Builder')}
                <span class="open-fb-link icon-open-document-new-tab"></span>
            </a>
        </p>
    </div>
    <div class="modal-footer flex">
        <div class="input-group-checkbox col-sm-7 pull-left">
            <input class="checkbox" type="checkbox" role="checkbox" id="dont_show_me_checkbox"/>
            <label class="checkbox-label" for="dont_show_me_checkbox">
                ${gs.getMessage("Save my choice and don't show this again")}
            </label>

        </div>
        <div class="col-sm-5 pull-right">
            <button type="button" data-dismiss="modal" class="btn btn-default" onClick="redirectToNewProjectDef()"> ${gs.getMessage('Not now')} </button>
            <button type="button" data-dismiss="modal" class="btn btn-primary" id="try_project_builder" onClick="redirectToProjectBuilder()"> ${gs.getMessage('Try Project Builder')}</button>
        </div>
    </div>
    <style>
        .modal-content {
            .open-fb-link {
                padding-left: 4px;
            }
        }
        .modal-footer {
            .input-group-checkbox {
                display: inline-flex;
                align-items: center;
            }
        }
    </style>

</j:jelly>
