<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <script>
        gel("use_process_config_builder").focus();
    </script>
    <div class="modal-body">
        <p class="target-modal-message">${gs.getMessage("Leverage additional features and get guidance to create your process configuration effectively.")}</p>
        <p class="target-modal-message">
            <a href="javascript:void(0)" onclick="window.open('https://docs.servicenow.com/bundle/yokohama-now-intelligence/page/administer/process-mining/task/process-config-builder.html', '_blank')">
                ${gs.getMessage('Learn more about Process Configuration Builder')}
                <span class="open-fb-link icon-open-document-new-tab"></span>
            </a>
        </p>
    </div>
    <div class="modal-footer flex">
        <div class="input-group-checkbox col-sm-6 pull-left">
            <input class="checkbox" type="checkbox" role="checkbox" id="dont_show_me_checkbox" />
            <label class="checkbox-label" for="dont_show_me_checkbox">
                ${gs.getMessage("Save my choice and don't show this again")}
            </label>

        </div>
        <div class="flex col-sm-6 pull-right">
            <button type="button" data-dismiss="modal" class="btn btn-default" onClick="redirectToNewProcessDef()"> ${gs.getMessage('Not now')} </button>
            <button type="button" data-dismiss="modal" class="btn btn-primary" id="use_process_config_builder" onClick="redirectToProcessConfigBuilder()"> ${gs.getMessage('Use Configuration Builder')}</button>
        </div>
    </div>
    <style>
        .modal-content {
            .open-fb-link {
                padding-left: 5px;
            }
        }

        .modal-footer {
            .input-group-checkbox {
                display: inline-flex;
                align-items: center;
            }
        }

        .modal-dialog {
            width: 50%;
        }

        @media (max-width: 1300px) {
            .modal-dialog {
                width: 60%;
            }
        }

        @media (max-width: 1200px) {
            .modal-dialog {
                width: 75%;
            }
        }

        @media (max-width: 900px) {
            .modal-dialog {
                width: 80%;
            }
        }

        @media (max-width: 600px) {
            .modal-dialog {
                width: 90%;
            }
        }
    </style>
</j:jelly>
