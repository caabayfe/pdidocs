<?xml version="1.0" encoding="utf-8" ?>

    <div style="text-align:start;">
        <br />
        <div style="margin-top: 0px; font-weight:bold; text-align:center; font-size: larger;">${gs.getMessage('Delete this topic?')}</div><br />

        document.getElementById("ok_button").focus();
    </script>
