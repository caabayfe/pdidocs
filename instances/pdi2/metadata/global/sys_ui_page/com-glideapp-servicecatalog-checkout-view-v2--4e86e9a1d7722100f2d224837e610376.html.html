<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <g:inline template="sc_sanitize.xml"/>
	<g:inline template="glide_weba_header.xml" />
    <g:com.glideapp.servicecatalog_cart target="order_status" prices="true" />
    <g:evaluate var="jvar_order_status" jelly="true">
    	gs.getMessage('Order Status: {0}', jelly.jvar_sc_request.getRequestNumber());
    </g:evaluate>
	<j:if test="${new GlideappScriptHelper().isUI16Enabled()}">
		<script>
			catalogHistory.setHistory('${HTML: jvar_order_status}', catalogHistory.getPageUrl());
		</script>
	</j:if>
	<div id="page_title" data-form-title = "${HTML: jvar_order_status}" style = "display:none" />
	<g:inline template="catalog_web_analytics.xml" />
</j:jelly>
