    <g:if_polaris>
        <g:then>
            <g:requires name="styles/polaris/diagrammer.css"/>
            <g:requires name="styles/polaris/erd.css"/>
        </g:then>
        <g:else>
            <g:requires name="styles/diagrammer.css"/>
            <g:requires name="styles/erd.css"/>
        </g:else>
    </g:if_polaris>
    <g:requires name="scripts/GwtGraphicsIncludes.js" includes="true"/>
    <g:requires name="scripts/GwtDiagramIncludes.js" includes="true"/>
    <g:include_script src="classes/GwtDiagramLayout.jsx"/>
    <g:include_script src="classes/GwtSugiyamaLayout.jsx"/>
    <g:include_script src="classes/GenericHierarchy.jsx"/>
    <g:requires name="scripts/ERDIncludes.js" includes="true"/>


    <j2:set var="jvar_table_style" value=""/>
    <j2:if test="$[GlideMobileExtensions.runningTablet()]">
       <j2:set var="jvar_table_style" value="position: fixed; height: 100%;"/>
    </j2:if>

    <table id="main_area" cellspacing="0" class="toolbar" style="$[jvar_table_style]">
        <tr id="controls_row">
            <td>
                <table  class="toolbar" style="width: 100%;">
                    <tr>
                        <td style="white-space: nowrap; text-align: left; width: 343px;">
                                        <j:set var="jvar_onchange" value="changeItem(value, '${gs.getUser().getLanguage()}')"/>
                                    <g:ui_reference id="item_picker" name="item_picker"
                                                    query="element=null^language=${gs.getUser().getLanguage()}"
                                            table="sys_documentation"
                                                    value=""
                                                    displayValue=""
                                                    columns="name"
                                                    columns_search="true"
                                                    order_by="name"
                                                    show_popup="false"
                                                    completer="AJAXTableCompleter"/>

                        </td>
                        <td id="breadcrumb_area" style="text-align: left;"></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr id="filter_row">
            <td id="filter_area">
                 <table class="toolbar" style="width: 100%;">
                     <tr>
                         <td>
                             <div class="color-box -red"></div>
                         </td>
                         <td><input type="checkbox" id="show_referenced"/></td>
                         <td nowrap="nowrap" style="white-space: nowrap">${gs.getMessage("Show referenced tables")}</td>
                         <td>
                             <div class="color-box -orange"></div>
                         </td>
                         <td><input type="checkbox" id="show_referenced_by"/></td>
                         <td nowrap="nowrap" style="white-space: nowrap">${gs.getMessage("Show referencing tables")}</td>
                         <td>
                             <div class="color-box -green"></div>
                         </td>
                         <td><input type="checkbox" id="show_extended"/></td>
                         <td nowrap="nowrap" style="white-space: nowrap">${gs.getMessage("Show extended tables")}</td>
                         <td>
                             <div class="color-box -blue"></div>
                         </td>
                         <td><input type="checkbox" id="show_extended_by"/></td>
                         <td nowrap="nowrap" style="white-space: nowrap">${gs.getMessage("Show extending tables")}</td>

                         <td id="expanded_key_color" style="display: none;">
                             <div class="color-box -purple"></div>
                         </td>
                         <td id="expanded_key_text" nowrap="nowrap" style="white-space: nowrap; display: none;">${gs.getMessage("Part of expanded hierarchy")}</td>
                         <td style="width: 100%;"></td>
                     </tr>
                 </table>
            </td>
        </tr>
        <tr id="diagram_area_row" style="height: 100%;">
            <td>
                <div id="diagram_area_parent">
                    <div id="diagram_area"/>
                </div>
            </td>
        </tr>
    </table>
<script>

var generic_hierarchy_erd_attributes = '$[JS:sysparm_attributes]';
var user_language = '${gs.getUser().getLanguage()}';

</script>
