<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	
	<!-- get list URL from URL parameters -->
	
	<g:evaluate var="jvar_identifier" jelly="true" expression="RP.getParameterValue('identifier')"/>
	<g:evaluate var="jvar_caseTable" jelly="true" expression="RP.getParameterValue('caseTable')"/>
	<g:evaluate var="jvar_caseIdField" jelly="true" expression="RP.getParameterValue('caseIdField')"/>
	
	<style type="text/css">
	#page_timing_div {
		display : none;
	}
	</style>
	
	<iframe id="records-list-iframe" src="/${jvar_caseTable}_list.do?sysparm_fixed_query=JOIN${jvar_caseTable}.${jvar_caseIdField}=promin_case_record.case_id!identifierIN${jvar_identifier}" width="100%" height="100%" frameBorder="0">Browser not compatible.</iframe>
</j:jelly>
