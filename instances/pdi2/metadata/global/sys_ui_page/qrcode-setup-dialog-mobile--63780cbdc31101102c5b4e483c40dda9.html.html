<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<j:if test="${!sn_ui.PolarisUI.canUsePolarisTemplates()}">
		<g:requires name="styles/heisenberg/heisenberg_all.css" includes="true" />
	</j:if>
    <link href="84f0346b87120300cfab6dd207cb0b72.cssdbx?" rel="stylesheet" type="text/css"/>
<j:if test="${gs.getProperty('glide.authenticate.auth.policy.enabled', 'false') == 'true'}">
   <j:if test="${gs.getProperty('glide.authenticate.preauth.allow.trusted.device', 'false') == 'true'}">
	   <j:if test="${GlideImpersonate().isImpersonating() == false}">
	<div class="notification notification-success" id="divNotification" style="display:none;">
		<button data-dismiss="alert" class="btn-icon close icon-cross">
			<span class="sr-only">${gs.getMessage('Close')}</span>
		</button>
	</div>
	<div class="notification notification-info" id="divDeviceDocNotification" style="display:none;">
		${gs.getMessage("If you are unable to register your device, please refer to this")} $[SP]<a title="document" href='/api/now/v1/context_doc_url/CSHelp-troubleshooting-trusted-device' target="_blank"> document </a> $[SP]${gs.getMessage("for fixing common issues.")}
	</div>
	<input type="hidden" id="appID" value=""/>
	<input type="hidden" id="registrationTime" value=""/>
	<div style="width: 100%">
		<div class="ga-flex-container" id="device_setup_instruction" style="display:none">

			<div class="ga-flex-content ga-flex-content-center" id="device_setup_step2">
					<label class="ga-label" style=" text-align: center;" tabindex="0">${gs.getMessage('trusted_device_setup_step1')}</label>
				<img id="imgCode" tabindex="0" alt="${gs.getMessage('Scan this QR code to pair your mobile device')}" />
				<label class="ga-label" tabindex="0" style=" text-align: center;">Or type in</label>
				<div style="text-align: center;">
					<div style="width: 100%;" tabindex="0" title="">
						<div id="lblTrustKey" style="font-size: small;display: inline;padding-right: 5px;">${gs.getMessage('Trust Key:')}</div>
						<div id="lblCode" style="font-size: small;display: inline;padding-right: 5px;"></div>
					</div>
					<div style="width: 100%;" tabindex="0" title="">
						<div id="lblAppID" style="font-size: small;display: inline;padding-right: 5px;">${gs.getMessage('App ID:')}</div>
						<div id="lblID" style="font-size: small;display: inline;padding-right: 5px;"></div>
					</div>
					<br/>
					<!-- 
					QR Code expiration time fetched from bounded system property:
					Sys Property: glide.countdown.timer.device.registration
					Default: 5 minutes | Min: 1 minute | Max: 15 minutes
					To modify: Create/update this property in System Properties [sys_properties.list] with your desired value within the mentioned limits
					-->
					<input type="hidden" id="countDownTimeInMins" value="${SNC.DeviceRegistrationUtils.getQRCodeExpirationMinutes();}" />
					<div id="countdown" style="font-size: small;display: inline;padding-right: 5px;">
					</div>
				</div>
			</div>
		</div>
		<div id="footer" class="row" style="display:none" >
					<footer class="modal-footer flex float-right">
						<button class="btn btn-default"   id="btnClose" style="margin-right:16px;" onclick="closeDialog()">${gs.getMessage('Close')}</button>
					</footer>
			</div>
	</div>
		   </j:if>
	</j:if>
</j:if>
</j:jelly>
