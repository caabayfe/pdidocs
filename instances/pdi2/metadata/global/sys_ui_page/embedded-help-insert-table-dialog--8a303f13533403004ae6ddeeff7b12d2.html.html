<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
		input {
			width: 50px;
			margin-left: 5px;
		}
		#form {
			padding: 15px 5px;
		}
		td {
			padding-bottom: 1em;
		}
		.required-label:before {
			content: '*';
			color: red;
		}
		#error-msg {
			visibility: hidden;
			color: red;
		}
	</style>
	<div class="instructions">
		<p>${gs.getMessage("Each row contains two entries")}:</p>
	</div>
		<table>
			<tbody>
				<tr>
					<td>${gs.getMessage("Number of rows")}:</td>
					<td>
						<input id="number"> </input>
					</td>
				</tr>
			</tbody>
		</table>
		<p id="error-msg">${gs.getMessage("You are missing fields or entered an invalid value")}</p>
	<div style="border-top: 1px solid #dfdfdf; padding:6px;align:right;">
	   <span style="float:right;padding-bottom:4px;">
		  <g:dialog_button_ok ok="return onSubmit()" ok_id="ok_button" />
	   </span>
	</div>
</j:jelly>
