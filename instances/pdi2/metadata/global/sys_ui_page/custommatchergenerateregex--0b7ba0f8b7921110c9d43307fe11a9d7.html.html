<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
		.formtable th, td{
			padding-bottom: 15px;
			padding-left: 15px;
			padding-right: 15px;
		}
	</style>
	<!-- <h3> Please choose the option that closely matches the pattern you expect to see </h3> -->
	<form id = "patternSelection">
		<table class="formtable">
			<tr>
				<td>
					<input type="radio" name="pattern" value="prefix" onClick="updateBoxes()"/> 
				</td>
				<td>
					${gs.getMessage("Values with a prefix followed by a number(e.g. INT123 or COOL123)")}
				</td>
			</tr>
			<tr class="hidden_field" name="hidden_prefix" hidden="true">
				<td></td>
				<td>
					<div> ${gs.getMessage("Enter the prefix")} </div>
				</td>
				<td>
					<input type="text" id="prefix_text" maxlength="5"/>
				</td>
			</tr>
			<tr>
				<td>
					<input type="radio" name="pattern" value="number_pattern" onClick="updateBoxes()"/> 
				</td>
				<td>
					${gs.getMessage("Numeric values with a delimiter (e.g. 123-123-123 or 123/123)")}
				</td>
			</tr>
			<tr class="hidden_field" name="hidden_number_pattern" hidden="true">
				<td></td>
				<td>
					<div> ${gs.getMessage("Select the delimiter")} </div>
				</td>
				<td>
					<table>
						<tr>
							<td>
								<input type="radio" name="delimiter" value="/"/>
							</td>
							<td>
								/
							</td>
						</tr>
						<tr>
							<td>
								<input type="radio" name="delimiter" value=":"/>
							</td>
							<td>
								:
							</td>
						</tr>
						<tr>
							<td>
								<input type="radio" name="delimiter" value="-"/>
							</td>
							<td>
								-
							</td>
						</tr>
						<tr>
							<td>
								<input type="radio" name="delimiter" value="."/>
							</td>
							<td>
								.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</form>
	<button onClick="okForm()">${gs.getMessage("Submit")}</button>
	<button onClick="cancelForm()">${gs.getMessage("Cancel")}</button>
</j:jelly>
