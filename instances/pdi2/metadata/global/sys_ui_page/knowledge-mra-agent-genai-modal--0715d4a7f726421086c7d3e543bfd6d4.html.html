<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <link href="08796c922f1e3a14e9ed523bcfa4e32b.cssdbx?v=${gs.getProperty('glide.builddate')}" type="text/css" rel="stylesheet"/>
	<style>
        .modal-footer {
            align: right;
            padding-right: 14px !important;
        }

		.sparkle-icon::before {
            font-size: 24px !important;
            color: RGB(var(--now-messaging_icon--primary-ai--color, var(--now-color--secondary-1, 67, 69, 166)));
            margin-right: 2px;
        }

        .footer-button {
            min-width: 5em;
            margin-left: 8px !important;
        }

		.modal-title{
			color: RGB(var(--now-color_text--primary, var(--now-color_alert--moderate-3, 67, 69, 166)));
		}

		.modal-header {
            display: none;
        }
    </style>

    <g:requires name="scripts/classes/GlideListWidget.js" />
    <g:evaluate var="jvar_table" jelly="true">
        var table="v_st_km_genai_mra_similar_task";
        table;
    </g:evaluate>
    <g:evaluate var="jvar_query" jelly="true">
        jelly.sysparm_query
    </g:evaluate>
    <g:evaluate jelly="true">
        var similarTasklistId = "similar_tasks_list";
    </g:evaluate>
	<div>
		<span class="modal-title h4">${gs.getMessage("We have found additional relevant tasks - Select up to 5 to help in the creation of article.")}</span>

		<span><button data-dismiss="GlideModal" aria-label="${gs.getMessage('Close')}" title="" class="btn btn-icon close icon-cross" id="knowledge_mra_author_genAI_modal_closemodal" onclick="cancel()" data-original-title="${gs.getMessage('Close')}"><span class="sr-only">${gs.getMessage('Close')}</span></button><br /><br/></span>
	</div>
    <div class="modal-body">
        <span id="list_span">
            <g:inline template="knowledge_mra_list_genAI" />
        </span>
    </div>

    <footer class="modal-footer">
        <button class="btn btn-default footer-button" onclick="cancel()" id="cancel-generate-article-btn">${gs.getMessage('Cancel')}</button>
		<button class="btn btn-primary footer-button ai-button" onclick="generateFromGenAIButtonHandler()" id="create-button">
			<span class="icon-sn-sparkmoji-logo-outline sparkle-icon-on-button"></span>
             ${gs.getMessage("Continue without more tasks ")}</button>
        <button class="btn btn-primary footer-button ai-button" style="display:none;" onclick="generateFromGenAIButtonHandler()" id="create-button-tasks">
			<span class="icon-sn-sparkmoji-logo-outline sparkle-icon-on-button"></span>
            ${gs.getMessage('Continue with selected tasks')}</button>
    </footer>

    <script type="text/javascript">

    </script>

</j:jelly>
