<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

 <g:ui_form class="form-horizontal">
	 <input type="hidden" id="uuid" value="${RP.getParameterValue('uuid')}" />
	 <input type="hidden" id="date" value="${RP.getParameterValue('date')}" />
	 <input type="hidden" id="source" value="${RP.getParameterValue('source')}" />
</g:ui_form>
	
<div id ="error_message" class="notification notification-error hide"/>
<div id="error_details" class="hide"></div>
<style>
#page_timing_div {
	display: none;
}

span[class^=icon-]::before {
	font-size: 32px;
}

.modal-lg {
	width: 800px;
}

.modal-body {
	padding-botom: 24px !important;
}

rendered_body {
	display: flex;
	flex-direction: column-reverse;
}

.card-list {
	display: flex;
	width: 100%;
	display: flex;
	justify-content: space-around;
	flex-wrap: wrap;
	flex-direction: column;
	gap: 24px;

}

.card {
	display: flex;
	margin: auto;
	width: 480px;
	height: 88px;
	padding: 16px;
	align-content: center;
	justify-content: flex-start;
	align-items: center;
	border: 1px solid #D3D3D3;
	border-radius: 4px;
	margin: 0;
	cursor: pointer;
}

#container {
	display: none;
}

.card_content {
	display: flex;
	flex-direction: column;
	padding-left: 10px;
}

.card_title {
	text-align: start;
	font-weight: bold;
	font-family: Lato;
	font-size: 20px;
	font-weight: 600;
	line-height: 24px;
	text-align: left;
	margin-bottom: 4px;
}

.card_description {
	font-family: Lato;
	font-size: 12px;
	font-weight: 400;
	line-height: 14.4px;
	text-align: left;
}

.carousel-container {
	width: 604px;
	height: 340px;
	overflow: hidden;
	position: relative;
	margin: auto;
}

.carousel-item {
	width: 604px;
	height: 340px;
	display: none;
	align-items: center;
	flex-direction: column;
}

.dots_container {
	display: flex;
	margin: auto;
	width: fit-content;
	padding: 12px 0 12px 0;
}

.dots {
	height: 12px;
	width: 12px;
	border-radius: 50%;
	border: solid RGB(var(--now-button--primary--background-color, var(--now-color--primary-1, 30, 133, 109)));
	margin: 4px;
}

.dots:hover {
	cursor: pointer;
	background: RGB(var(--now-button--primary--background-color, var(--now-color--primary-1, 30, 133, 109))) !important;
}


.slide_button {
	position: absolute;
	top: 50%;
	border: none;
	background: rgba(32, 26, 26, 0.527);
	color: rgb(243, 243, 243);
	z-index: 1000;
	font-weight: 900;
	transition: 0.5s ease-in-out;
	transform: translate(0, -50%);
}

#prevSlide {
	left: 20px;
	background-color: RGB(var(--now-button--primary--background-color, var(--now-color--primary-1, 30, 133, 109)));
	border-radius: 50%;
	border: none;
}

#nextSlide {
	right: 20px;
	background-color: RGB(var(--now-button--primary--background-color, var(--now-color--primary-1, 30, 133, 109)));
	border-radius: 50%;
	border: none;
}

.arrow-next {
	border: solid white;
	border-width: 0 1px 1px 0;
	display: inline-block;
	padding: 5px;
	transform: rotate(-45deg);
	-webkit-transform: rotate(-45deg);
	margin-right: 4px
}

.arrow-prev {
	border: solid white;
	border-width: 0 1px 1px 0;
	display: inline-block;
	padding: 5px;
	transform: rotate(135deg);
	-webkit-transform: rotate(135deg);
	margin-left: 4px
}

#closeBtn {
	margin-left: 10px;
}

.card .card_image {
	display: flex;
	align-items: center;

}

.link_image {
	width: inherit;
	height: 80%;
	margin: 0;
	padding: 0;
	cursor: pointer;
	border: none;
}

.card .card_image img {
	width: inherit;
	height: inherit;
	object-fit: contain;
}

.card_title_container {
	display: flex;
	justify-content: flex-start;
	align-content: center;
	align-items: center;
	gap: 4px;
}

td {
	display: flex;
	justify-content: space-between;
}

#sysparm_button_notify,
#image-button,
#sysparm_button_workbench,#workbench {
	background-color: RGB(var(--now-button--primary--background-color, var(--now-color--primary-1, 30, 133, 109)));
	color: white;
	border-radius: var(--now-button--border-radius, var(--now-actionable--border-radius, 0));
	min-width: 5em;
	font-weight: var(--now-button--font-weight, var(--now-actionable--font-weight, normal));
}

#sysparm_button_workbench,#workbench{
    margin-left: 10px;
}

#sysparm_button_cancel,
#closeBtn {
    background-color: RGB(var(--now-color_text--primary, var(--now-color--neutral-18, 22, 27, 28)));
	color: RGB(var(--now-button--primary--background-color, var(--now-color--primary-1, 30, 133, 109)));
	border: 1px solid RGB(var(--now-button--primary--background-color, var(--now-color--primary-1, 30, 133, 109)));
	border-radius: var(--now-button--border-radius, var(--now-actionable--border-radius, 0));
	min-width: 5em;
	font-weight: var(--now-button--font-weight, var(--now-actionable--font-weight, normal));
}

.image-content-container {
	width: 266px;
	height: 190px;
	position: absolute;
	transform: translate(-50%, -50%);
	position: absolute;
	top: 60%;
	left: 35%;
	transform: translate(-50%, -50%);
	display: flex;
	flex-direction: column;
	align-items: flex-start;
	justify-content: space-between;
}

#image-heading {
	font-family: Lato;
	font-size: 24px;
	font-weight: 500;
	text-align: left;
}

#image-content {
	font-family: Lato;
	font-size: 16px;
	font-weight: 400;
	line-height: 19.2px;
	text-align: left;
}

</style>

</j:jelly>
