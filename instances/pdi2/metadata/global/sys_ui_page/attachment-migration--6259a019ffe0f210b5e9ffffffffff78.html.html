<!-- <?xml version="1.0" encoding="utf-8" ?> -->
<!-- <j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide"> -->
<j:jelly xmlns:j="jelly:core" xmlns:g="glide">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 30px;
        }

        table {
            margin: 0 auto;
            border-spacing: 10px;
            text-align: left;
        }

        td {
            padding: 8px 12px;
        }

        .label-name {
            margin: 0 auto;
            border-spacing: 10px;
            text-align: right;
        }

        .status-success {
            font-weight: bold;
            margin-top: 20px;
            color: green;
        }

        .status-error {
            font-weight: bold;
            margin-top: 20px;
            color: red;
        }
    </style>

    <h2>${gs.getMessage('Migrate Attachments to Documents')}</h2>
    <hr />

    <table>
        <tr>
            <td class='label-name'><label for="table_name"><b>${gs.getMessage('Table')} * </b></label></td>
            <td>
                <g:ui_reference name="table" table="sys_db_object" id="table"/>
            </td>
        </tr>
        <tr>
            <td class='label-name'><label for="owner" title="Owner of the migrated documents"><b>${gs.getMessage('Document Owner')} * </b></label></td>
            <td>
                <g:ui_reference name="owner" table="sys_user" id="owner" />
            </td>
        </tr>
    </table>

    <br />
    <div id="ok-cancel-btns" class="pull-center">
        <g:dialog_button class="form-control" style_class="btn btn-primary" onClick="return startMigration()">Start</g:dialog_button>
    </div>
    <div id="status"></div>

</j:jelly>
