<?xml version="1.0" encoding="UTF-8"?>
<j:jelly xmlns:j="jelly:core" xmlns:g="glide" xmlns:g2="null" xmlns:j2="null" trim="false">	
	
	<!-- MODAL PARAMS -->
	<j:set var="jvar_message" value="${sysparm_message}"/>
	<j:set var="jvar_sysparm_button_text" value="${sysparm_button_text}"/>
	
	<p class="targets-modal-message">${jvar_message}</p>
	
	<!-- MULTI-SELECT COMPONENTS -->
	<div class="multi-select-components-container">
		<g:ui_reference_multi label="Full Instance" name="full-instance" id="full_instance_multi_select" hide="true" display_value="name" onradiochange="onRadioChange(event)"/>
		<g:ui_reference_multi label="Scoped App" name="app" id="app_multi_select" table="sys_scope" display_value="name" onChange="onScanTargetsChange(e)" onradiochange="onRadioChange(event)"/>
		<g:ui_reference_multi label="Update Set" name="update-set" id="update_set_multi_select" table="sys_update_set" display_value="name" onChange="onScanTargetsChange(e)" onradiochange="onRadioChange(event)"/>  
	</div>

	<!-- BUTTONS -->
	<div class="buttons-container">
		<button id="cancelButton" onclick="cancelPage()">Cancel</button>
		<button class="btn btn-primary" id="submitButton" onclick="executeButtonAction()">${jvar_sysparm_button_text}</button>
	</div>
	
	<style type="text/css">
		.multi-select-components-container {
			max-width: 400px;
			margin: auto;
		}

		.targets-modal-message {
			margin: 0 0 30px 0;
			font-size: 16px;
		}
		
		.buttons-container {
			text-align: right;
			margin-top: 80px;
		}	
	</style>
</j:jelly>
