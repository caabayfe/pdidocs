<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">	
<j2:set var="jvar_hide_response_time" value="true" />
	<g:evaluate>
		var buttonLabelOk = gs.getMessage("Publish");
		var buttonLabelCancel = gs.getMessage("Cancel");
		var body = gs.getMessage("This article may be visible to unauthenticated users after it is published. Do you still want to proceed?");
	</g:evaluate>
	<p id="modal_body">${HTML:body}</p>
	<div id="modal_footer" class="modal-footer">
		<g:dialog_buttons_ok_cancel ok_text="${JS:buttonLabelOk}" ok_title="${JS:buttonLabelOk}" ok="return publish_article();" ok_style_class="btn btn-destructive" 
			cancel_text="${JS:buttonLabelCancel}" cancel_title="${JS:buttonLabelCancel}" cancel="return cancel();" cancel_data_dismiss="modal"
		/>
	</div>
</j:jelly>
