<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<h4 style="padding: 10px 15px 0px; font-weight: bold;">${gs.getMessage("Select users who should be assigned 'Code Signing' admin role")}</h4><br></br>
	<div style="
				display: inline-block;
				min-width: 500px;">
		<g:ui_slushbucket name="user_sb" left_header="${gs.getMessage('Available Users:')}" right_header="${gs.getMessage('Selected User(s):')}" up_down="true">
		</g:ui_slushbucket>
		<div style="
					margin-left: auto;
					display: flex;
					justify-content: center;
					position: relative;
					left: -30px;
					padding: 7px;">
			<button type="button" id="cancel_button" onclick="return refreshPage()" title="Refresh page" style="min-width: 5em;" class="btn btn-default" data-original-title="">${gs.getMessage("Reset")}</button>
			<span style="width: 4px;"> </span>
			<button type="button" id="ok_button" onclick="return assignCSAdminRole()" title="Save changes" style="min-width: 5em; padding: 2px;" class="btn btn-primary" data-original-title="">${gs.getMessage("Save")}</button>
		</div>
	</div>
</j:jelly>
