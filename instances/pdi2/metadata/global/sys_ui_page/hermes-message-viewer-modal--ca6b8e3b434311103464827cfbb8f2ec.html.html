<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<style>	
	.modal_title{
		padding: 0 0 14px 14px;
		font-size: 120%;
	}
	.modal_text{
		padding: 0 0 14px 14px;
		height: 40px;
		width: 100%;
		overflow-y: scroll;
		font-size: 80%;
	}
	.payload-table{
		table-layout: fixed;
		width: 100%;
		word-wrap: break-word;
	}
</style>
<table class="payload-table">
	<tr>
		<g:evaluate>
			var title = "${RP.getWindowProperties().get('title')}";
			var text = "${RP.getWindowProperties().get('text')}";
		</g:evaluate>
		<td class="modal_title">${title}</td>
		<td class="modal_text">${text}</td>
	</tr>
	<tr>
		<td colspan="2" align="center" >
			<button style="width:100%;" class="btn btn-primary" id="ok_button" onclick="invokePromptCallBack();" type="button">OK</button>
		</td>
	</tr>
</table>
</j:jelly>
