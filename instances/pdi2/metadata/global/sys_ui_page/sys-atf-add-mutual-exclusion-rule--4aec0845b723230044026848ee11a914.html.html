<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:evaluate>
		var testIDs = RP.getWindowProperties().get('test_ids');
		var isFromTestForm = RP.getWindowProperties().get('is_from_test_form');
	</g:evaluate>
    <div id="add_mutual_exclusion_rule_container" >
		<div class="form-group">
			<div nowrap="true" type="string" choice="0" data-type="label">
				<label class="col-sm-12 col-md-2 control-label">
					<span class="label-text">${gs.getMessage('Test')}:</span>
				</label>
			</div>
			<div class="col-sm-12 col-md-6 form-field input_controls">
				<g2:ui_reference id="test_picker"
                                name="test_picker"
                                table="sys_atf_test"
                                columns="name"
                                columns_search="false"
                                order_by="name"
                                show_popup="false"
                                completer="AJAXTableCompleter"/>
			</div>
		</div>
	<footer align="right" class="modal-footer flex" >
		<button class="btn btn-default" onClick="GlideModal.get().destroy()"> ${gs.getMessage('Cancel')}</button>
		<button class="btn btn-primary" id="add_button" onClick="addMutualExclusionRule('$[testIDs]', $[isFromTestForm])">
			${gs.getMessage('Add')}
		</button>
	</footer>
    </div>
</j:jelly>
