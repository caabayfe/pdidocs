description: |-
  This UI Page is used to display a field selector tree in a dialog that may be used to select a field from the tree.

  Inputs:
  ----------
     sysparm_table - the table that we will display the element tree for

     sysparm_types - if specified, contains a semi-colon (;) seperated list of field types that will be displayed and selectable in the tree. 
          All of the reference fields will be displayed (non-selectable) so that dot-walking is still supported

     sysparm_ref_tables - if specified, contains a semi-colon (;) separated list of tables.  The tree will then only display reference fields 
           and only fields from the sysparm_ref_tables list will be selectable from the list (ie, if you specify "sys_user;sys_user_group" then
           the tree would only allow reference fields to sys_user and sys_user_group to be selected but still display all of the table's reference
           fields so that the tree can be properly dot-walked)

  sysparm_match_types_and_tables - by default, if ref_tables and types are specified, a field only has to match one or 
          the other to be included. By setting sysparm_match_types_and_tables to true, the field has to match BOTH. 
          For example, setting types to "reference" and tables to "sys_user" will only include reference fields that 
          reference the sys_user table and not fields such as "glide_list" that may also reference the sys_user table.

     sysparm_elementID - id of the element to save the selection in.  If the element is an INPUT, the selection is stored in the element's value.
           If the element is a SELECT, a check is made to ensure that the selection is not a duplicate.  If not, the selection is appended to the SELECT
           options.  For any other type of element, the selection is stored in the element's innerHTML.

     sysparm_prefix/sysparm_suffix - if specified, the selection is wrapped with the prefix and suffix before storing in sysparm_element.  (For example,
           if you specify "${" as the prefix and "}" as the suffix, the selected element is stored as "${element_name}" instead of just "element_name")
           Note: since you cannot specify ${ due to jelly parsing issues, you may use '__dollar__' instead, such as '__dollar__{' as the prefix value.
direct: 'false'
