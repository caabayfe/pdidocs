<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
    <g:evaluate jelly="true">
        var message = gs.getMessage("This will remove any changes you've made to the synthetic values and restore it to its default values.");
		var labelContinue = gs.getMessage("Continue");
		var labelCancel = gs.getMessage("Cancel");
    </g:evaluate>
    <div class="form-group">
        <p>${message}</p>
    </div>
    <footer class="modal-footer">
        <button class="btn btn-default" id="reset_synthetic_value_modal_cancel_btn" data-dismiss="modal" aria-label="${labelCancel}">${labelCancel}</button>
        <button class="btn btn-success" id="reset_synthetic_value_modal_continue_btn" onclick="resetSyntheticValues()" aria-label="${labelContinue}">${labelContinue}</button>
    </footer>
</j:jelly>
