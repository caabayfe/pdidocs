<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<g:evaluate var="jvar_execution_id" expression="RP.getParameterValue('execution_tracker_id')"/>
	<input type="hidden" id="execution_id" value="${jvar_execution_id}"/>
	<script type="text/javascript" src="scripts/doctype/CustomEventManager.js"/>
	<style>
		
		#page_timing_div, #hierarchical_progress_viewer_header, #grayBackground{
			display: none !important;
		}
		#hierarchical_progress_viewer{
			position:relative !important;
			left : 0px !important;
			top : 0px !important;
			z-index : initial !important;
		}
		
		#hierarchical_progress_viewer .drag_section_picker{
			width: 100% !important;
			border: none;
		}
		
		#hierarchical_progress_viewer .drag_section_header{
			display:none;
		}
	</style>
</j:jelly>
