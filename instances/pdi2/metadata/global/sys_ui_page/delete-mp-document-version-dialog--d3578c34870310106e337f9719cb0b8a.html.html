<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
   <div id='delete-dialog' style="text-align:left;">
      <br/>
      <div>${gs.getMessage('Are you sure you want to delete this version of document?')} </div>
      <br/>
      <div align="right" class="modal-footer flex">
         <g:dialog_buttons_ok_cancel ok="return ok()" cancel="return cancel()" ok_type="button" ok_style_class="btn btn-destructive" ok_text="${gs.getMessage('Continue')}" cancel_text="${gs.getMessage('Cancel')}" cancel_type="button"/>
      </div>
   </div>
	<div id='delete-alert' style="text-align:left;display:none">
			<br/>
			<div id='delete-alert-message'></div>
			<br/>
			<div align="right" class="modal-footer flex">
				<g:dialog_button_ok ok="return cancel()" ok_type="button" ok_style_class="btn btn-destructive" ok_text="${gs.getMessage('Yes')}"/>
			</div>
		</div>
</j:jelly>
