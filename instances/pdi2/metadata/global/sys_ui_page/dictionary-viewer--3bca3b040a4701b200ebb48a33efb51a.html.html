<style>
	HTML[data-doctype=true] TD.label.label_spacing {
		padding: 5px 12px 6px 6px;
	}
</style>

<input type="HIDDEN" id="table_name" value="${RP.getWindowProperties().get('table_name')}"/>

<span id="dict_info" name="dict_info">

			<td class="label label_spacing">Table</td>

			<td><div id='dictionary_viewer.element'></div></td>
