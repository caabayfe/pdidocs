<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<div style="font-weight: bold;font-size: x-large;padding-left: 100px;">Rollback Instance Clone</div>
<div style="margin-left: 5px; margin-right: 5px; margin-top: 30px; margin-bottom: 10px; padding-left:10px; padding-right: 10px">
	<div style="text-align:left;padding-left:20px">
		<div id = "optionsDiv" style="color:black;font-weight:bold; text-align:left; font-size: larger;">
			<div style="display:inline-block;width:120px">Specify Reason</div>
			<select id="rollbackSelect"></select>
			<br/><br/>
		</div>
		<br/><br/>
		<tr>
			<td nowrap="nowrap" align="right"><img src="images/confirm.gifx" width='45' height='45'/></td>
			<td nowrap="true">Are you sure you want to rollback?</td>
		</tr>
		<p style="font-weight: bold;color: rgb(204, 0, 0);font-size: larger;">This is an irreversible process and all the data in target instance will be replaced with the backup data!</p>
		<br/>
	</div>
	<table border="0" width="440">
		<tr>
			<td style="text-align:center">
				<g:dialog_buttons_ok_cancel ok="return rollback();" cancel="return onCancel();" ok_type="button" cancel_type="button"/>
			</td>
		</tr>
	</table>
	</div>
</j:jelly>
