<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">

<g:ui_form>
    <input type="hidden" name="selection_result" id="selection_result" value=""/>
    <input type="hidden" name="my_sys_id"    id="my_sys_id"    value="${RP.getWindowProperties().get('my_sys_id')}"/>
    <input type="hidden" name="my_condition" id="my_condition" value="${RP.getWindowProperties().get('my_condition')}"/>
    <input type="hidden" name="my_name"      id="my_name     " value="${RP.getWindowProperties().get('my_name')}"/>
    <div style="text-align:left;">           
      ${gs.getMessage('Do you want to create a process handler to prevent running processes that match this classifier from being classified?')}<br/><br/>
    </div>
    <div style="text-align:right;">
      <input type="submit" id="del_no" onclick="return delNo();" title="${gs.getMessage('No')}" value ="${gs.getMessage('No')}" style="background-color: #777777; color: white; font-size:larger;" />
      $[SP]$[SP]
      <input type="submit" id="del_yes" onclick="return delYes();" title="${gs.getMessage('Yes')}" value ="${gs.getMessage('Yes')}" style="background-color: #777777; color: white; font-size:larger;" />
    </div>
</g:ui_form>
</j:jelly>
