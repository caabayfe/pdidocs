description: |-
  Select an item from a list

  The list options are generated from the script provided.  

  The list shows small height for <= 6 items or large height for > 6.

  Parameters:
          choice_label : this is the label for the left of the list.
        choice_script : this is the script include class to get the options from.
     choice_function : this is the function to call in the choice_script that returns the options.
