<g:ui_form>
	<input type="hidden" id="cancelled" name="cancelled" value="false"/>
	<input type="hidden" name="assetId" id="assetID" value="${sysparm_sys_id}"/>
	<j2:if test="$[!empty(sysparm_domain)]">
		<input type="hidden" id="sysparm_domain" name="sysparm_domain" value="${sysparm_domain}"/>
	</j2:if>
	<j2:if test="$[!empty(sysparm_domain_scope)]">
		<input type="hidden" id="sysparm_domain_scope" name="sysparm_domain_scope" value="${sysparm_domain_scope}" />
	</j2:if>

	<table width="100%" style="border-spacing:10px; height:100px;">
		<tr>
			<td rowspan="4" nowrap="true" width="110px" style="vertical-align:top;">
				<img src="images/plugin_activate.gifx" alt="${gs.getMessage('Activate/Upgrade')}" style="vertical-align:top;" />
			</td>
		</tr>
		<tr >
			<td style="text-align:right;"><label>${gs.getMessage('Asset tag:')}</label></td>
			<td style="padding:10px;"><input class="form-control" id="asset_tag" name="asset_tag" value="${sysparm_asset_tag}" label="" type="text"/></td>
		</tr>
		<tr >
			<td style="text-align:right;"><label style="color:red">*</label><label>${gs.getMessage('Serial number:')}</label></td>
			<td style="padding:10px;"><input class="form-control" id="serial_number" name="serial_number" value="${sysparm_serial_number}" label="" type="text" required="true"/></td>
		</tr>
		<tr>
			<td style="text-align:right;"><label>${gs.getMessage('Reserved for:')}</label></td>
			<td id="td_reference_user"><g:ui_reference id="sys_user" name="sys_user" value="${sysparm_user}" displayValue="$[sysparm_user_name]" table="sys_user"/></td>
		</tr>

		<script>
			var tdReferenceUser = document.getElementById('td_reference_user');
			var isPolarisEnabled = window.NOW.isPolarisEnabled;
			if (isPolarisEnabled === 'true') {
				tdReferenceUser.style.padding = '10px';
			} else {
				tdReferenceUser.setAttribute('style','');
			}
		</script>
		
		<tr id="dialogbuttons">
			<td colspan="3" align="right" style="padding-right:10px;">
				<g:dialog_buttons_ok_cancel ok="return actionOK();" cancel="cancel();"/>
			</td>
		</tr>
	</table>
</g:ui_form>
