<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<div id="duplicate_existing_secattr_warning_popup" style="display:block; padding: 5px 10px">
		<div class="control-label col-sm-12">
			<label id="dup_sa_label"></label>
		</div>
		<div class="modal-footer">
			<g:dialog_buttons_ok_cancel ok="return onClickOK();" cancel="return onClickCancel();" ok_type="button" cancel_type="button" ok_text="${gs.getMessage('Continue with Existing')}" cancel_text="${gs.getMessage('Continue')}"/>
		</div>
	</div>
	<script>
		var gdw = GlideDialogWindow.get();
		var otherRecord = gdw.getPreference("otherRecord");
		var otherRecordName = gdw.getPreference("otherRecordName");
		$j("#dup_sa_label").html(getMessage("This ACL's local Security Attribute matches the existing security attribute <a href='/now/nav/ui/classic/params/target/sys_security_attribute.do%3Fsys_id%3D{0}' target='_blank' rel='noopener noreferrer'>{1}</a>. Please use the existing Security Attribute to maintain consistency and avoid duplication.").withValues([otherRecord, otherRecordName]));
	</script>
</j:jelly>
