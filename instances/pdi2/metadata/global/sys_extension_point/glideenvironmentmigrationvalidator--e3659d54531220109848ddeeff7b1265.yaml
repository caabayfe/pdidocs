api_name: global.GlideEnvironmentMigrationValidator
description: This extension point works with the sn_environment.GlideEnvironmentMigrationPreflight API as a way to implement different kinds of checks when an instance is being migrated to a different environment. The single method validate() is provided an sn_environment.GlideEnvironmentFlags object and is expected to return an array of log messages which will be returned to the caller.
