api_name: global.AisDynamicFilter
description: AIS will invoke the extension point to check if this specific filter implementation is applicable for the given Search Context, Profile, Table, and Additional Context. The pre-process flag tells if this filter invocation is prior to search (so that the filter conditions can be applied to the search query) or post-search in which case the filter implementation can tell if the given document should be filtered or not. This is the script version of IAisDynamicFilter.
