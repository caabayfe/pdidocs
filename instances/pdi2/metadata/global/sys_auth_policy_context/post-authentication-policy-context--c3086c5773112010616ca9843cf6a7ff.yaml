description: |-
  Authentication policy context defines the policy that is enforced during the login process. When a policy is chosen in pre or post-authentication policy context, the policy is executed before or after the user is shown a login screen, and the outcome of the policy is driven by the selection of the default policy config setting is as follows:

  1. Selecting Deny access policy as the default policy allows the access to all users by default and only denies access when the policy conditions defined in the deny access policy evaluate to true.
  2. Selecting Allow access policy as the default policy denies the access to all users by default and only allows access when the policy conditions defined in the allow access policy evaluates to true.
internal_name: global_Post_Authentication_Policy_Context
name: Post Authentication Policy Context
