description: |-
  <p>Manual process activity, that optionally waits for user to complete flow data record.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Title</b> - Title that will be displayed in Playbook experience</li>
  <li><b>Description</b> - Description message that will be displayed in Playbook experience.</li>
  <li><b>Tag Line</b> - Header tag-line message for Playbook experience component.</li>
  <li><b>Footer</b> - Footer message for Playbook experience component.</li>
  <li><b>Assignment Group</b> - (Optional) Group required to provide flow data inputs.</li>
  <li><b>Assigned To</b> - (Optional) User required to provide flow data inputs.</li>
  <li><b>Wait for user input</b> - When checked, does not wait for flow data to be in a completed state.</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Record</b> - Flow Data Record.</li>
  <li><b>Automated</b> - True/False based on whether the flow waited for user input or not.</li>
  </ul>
