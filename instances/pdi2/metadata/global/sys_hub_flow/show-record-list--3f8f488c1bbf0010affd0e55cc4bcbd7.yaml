description: |-
  <p>Show list of records, for use with Agent Workspace Playbook experience. Process activity optionally waits before proceeding with process execution.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Table</b> - Table to query</li>
  <li><b>Conditions</b> - Conditions to query for</li>
  <li><b>Fields to show</b> - Columns to show in list results</li>
  <li><b>Assignment Group</b> - (Optional) Group required to provide flow data inputs.</li>
  <li><b>Assigned To</b> - (Optional) User required to provide flow data inputs.</li>
  <li><b>Wait for user input</b> - When checked, does not wait for flow data to be in a completed state.</li>
  <li><b>List Title</b> - Title to show above the list of records</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Record</b> - Flow Data Record.</li>
  <li><b>Fields</b> - Comma delimited list of columns specified in <b>Fields to show</b> input.</li>
  <li><b>Automated</b> - True/False based on whether the flow waited for user input or not.</li>
  </ul>
