description: |-
  <p>Send Email process activity flow, to collect email inputs from user and send a standard ServiceNow outbound email.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>To</b> - To recipient list</li>
  <li><b>Cc</b> - Cc recipient list</li>
  <li><b>Bcc</b> - Bcc blind copy recipient list</li>
  <li><b>Subject</b> - Subject of email</li>
  <li><b>Body</b> - Body of message</li>
  <li><b>Target Record</b> - Record the email will be attached to</li>
  <li><b>Assignment Group</b> - (Optional) Group required to provide flow data inputs.</li>
  <li><b>Assigned To</b> - (Optional) User required to populate details.</li>
  <li><b>Wait for user input</b> - When checked, does not wait for flow data to be in a completed state.</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul><li><b>Record</b> - Flow Data Record</li>
  <li><b>Automated</b> - True/False based on whether the flow waited for user input or not.</li>
  </ul>
