description: This process runs every 15 minutes. It looks for user permission records that are waiting to be synced with external systems. Specifically, it searches for records where the external permission status is "Pending" and the sync strategy is either "Scheduled" or "System Scheduled." It then sorts these records by creation date and processes them in batches. The batch size is determined by a system setting (com.snc.documents.external.permission.batch_size). For each record in the batch, the process assigns the user permission using a custom action called "Update User Permission on Document.
