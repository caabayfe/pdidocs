description: |-
  <p> This subflow reads user permission records associated with the given document sys id filtered by the given permission sync strategy and external permission status. It calls a custom action with each user permission record to assign the external permission on the document to the corresponding user.
  </p>
  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Document Sys Id</b> -  Document Sys ID from Documents table (ds_document)</li>  
    <li><b>Permission Sync Strategy</b> -  Permission sync strategy value to filter the associated user permission records. </li>
    <li><b>External Permission Status</b> -  External permission status value to filter the associated user permission records. </li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Status</b> - Will be set to Success if the flow is successful or Error on failure.</li>
    <li><b>Status Code</b> - Multiprovider status code.</li>
    <li><b>Error Message</b> - Populated when the status is "Error".</li>
  </ul>
  <p>To use this subflow, the corresponding cloud storage connection and credential (Google Drive or OneDrive) must be created and associated with the appropriate Connection & Credential alias. <a href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a>.</p> <p><b>Note</b>: Requires a subscription for production use. <a href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
