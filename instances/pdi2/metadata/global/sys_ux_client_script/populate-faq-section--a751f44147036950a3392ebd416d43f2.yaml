name: Populate FAQ section
preset: ''
required_translations: |-
  [
      {
          "message": "What can I do with these results?"
      },
      {
          "message": "Resolution potential reflects the number of issues that IAR has successfully predicted an active intent for and that has an active topic mapped.{0}{0}To improve your resolution potential:{0}  1. Activate intents that IAR has{0}      successfully predicted but are{0}      inactive.{0}  2. Activate inactive topics that are{0}      mapped to predicted intents.{0}  3. Map additional intents that IAR has{0}      successfully predicted but have not{0}      yet been added to the intent to topic{0}      map table so far.{0}  4. Notice issues that are mapped to{0}      incorrect intents? For better accuracy{0}      and improved results, go to NLU{0}      Workbench to tune your model{0}      regularly.{0}{0}When done, run another simulation to compare results."
      },
      {
          "message": "What do \\\"Mapped intents - Active\\\" and \\\"Mapped intents - Inactive\\\" mean?"
      },
      {
          "message": "\\\"Mapped intents - Active\\\" means that IAR has successfully predicted an intent from the case description and that intent is active in your intent to topic map table. \\\"Mapped intents - Inactive\\\" means that the predicted intents are available but not active in your intent to topic map table."
      },
      {
          "message": "What does \\\"Inactive topics\\\" mean?"
      },
      {
          "message": "\\\"Inactive topics\\\" mean that Virtual Agent topics currently mapped to intents are not active and not visible to end users. Select an active topic using the intent to topic map table in the IAR configuration, or go to Virtual Agent Designer to activate the topic."
      },
      {
          "message": "What does \\\"Unmapped intents\\\" mean?"
      },
      {
          "message": "\\\"Unmapped intents\\\" means that IAR has successfully predicted an intent from the case description, but the intent itself has not been added to the intent to topic map table in your configuration. To increase IAR coverage for those incidents, add those additional intents to the table."
      }
  ]
