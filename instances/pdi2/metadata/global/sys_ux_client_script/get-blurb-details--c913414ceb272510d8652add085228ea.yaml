required_translations: |-
  [
      {
          "message": "Here's what to expect"
      },
      {
          "message": "Install apps"
      },
      {
          "message": "Get started quickly by installing our collection of IAR-related apps. These apps come pre-configured for various issue types, and the installation should only take about 5 minutes."
      },
      {
          "message": "Set up & review"
      },
      {
          "message": "When you're finished installing the apps, start the setup process to review and customize any configurations to fit your needs."
      },
      {
          "message": "Activate IAR"
      },
      {
          "message": "Turn on IAR globally and enable it for each issue type you'd like to automatically resolve. You'll then be able to monitor its performance in real time."
      },
      {
          "message": "Here's what's next"
      },
      {
          "message": "Review configurations"
      },
      {
          "message": "Configurations for various issue types are pre-installed with the apps. Review the configurations and update them as per your business needs."
      },
      {
          "message": "Test & improve"
      },
      {
          "message": "Run a simulation with historical data to test IAR for ITSM Virtual Agent Conversation. Manage topics and intents and tune in NLU Workbench  to increase accuracy and automatically resolve or deflect more issues."
      },
      {
          "message": "Activate IAR"
      },
      {
          "message": "Turn on IAR globally and enable IAR for individual issue types to go live. You'll be able to track the performance of IAR immediately after you enable them."
      }
  ]
