description: |-
  Users must have the personalize_choices role to perform the personalize_choices operation.  Do not delete this rule as it protects all fields in all tables.

  To grant personalize_choices to specific fields in specific tables you should create new Access Control rules.

  Grant access to a specific field:  kb_knowledge.topic would grant access to personalize_choices on the Topic field of the Knowledge Base table.
  Grant access to all fields in a table:  kb_knowledge.* would grant access to personalize_choices on all fields in the Knowledge Base table.
