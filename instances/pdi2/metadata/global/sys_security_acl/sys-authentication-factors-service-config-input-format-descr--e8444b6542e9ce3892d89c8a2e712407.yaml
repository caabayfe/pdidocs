description: Deny list-cell editing of input_format_description when input_type=voice and the authentication factor is numeric (Soft PIN, SMS OTP, TOTP, Email OTP). These records use fixed defaults populated by the "Voice defaults for numeric factors" BR and must not be editable via list-cell edits. Form view behavior is covered by UI Policy 142c6a70b41f4ed78cadab888879514b under the same condition. After plugin reload, flush the ACL cache (system definition > cache.do) for the ACL evaluation to pick up the change.
