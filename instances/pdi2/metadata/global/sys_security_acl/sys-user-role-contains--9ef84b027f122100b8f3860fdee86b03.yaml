description: |2-
  
      	On the sys_user_role_contains table, we want to give the usage_admin the security
   		right to perform CRUD on records. The existing create and delete ACL is created dynamically and hen
  		ce we cannot add the license admin role to it. Hence we are creating new create and delete ACLs with
  		the usage_admin role. The read and write ACLs are not created dynamically and hence adding the li
  		cense admin role to these work.
