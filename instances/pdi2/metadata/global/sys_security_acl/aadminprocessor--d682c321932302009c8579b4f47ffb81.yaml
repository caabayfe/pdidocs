description: |-
  Admin processors are accessible by public if it's coming through Internal IPs. Access checks are done within the processor itself.

  There is additional IP  check (to only allow internal ServiceNow IPs) after this ACL is evaluated, therefore, it does not pose any security risk.

  XMLStatsProcessor an extension of AAdminProcessor is used by ServiceNow to monitor the instance health and generate alerts based on the node health as well as for ServiceNow Instance Automations (like moves and failovers). Therefore, it is necessary to have public role in this ACL to allow ServiceNow access.
