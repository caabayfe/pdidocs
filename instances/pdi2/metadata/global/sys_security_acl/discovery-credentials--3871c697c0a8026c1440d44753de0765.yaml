description: This allows users with MID server role to access this table. It's worth noting that the reason it's set to a * (meaning accessible based on field level) is we have old customers who still have ACL of field level read-only that limits users with ecmdb_admin role only. That ACL was auto-generated by legacy code in the older version of the discovery_credentials dictionary file. In short, this ACL is imperative for older instances that already have a field level read only ACL on this table.
