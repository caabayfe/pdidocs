description: |-
  Allows rota_admin to delete roster template spans.

  Allow delete for records in cmn_schedule_span, if the ACL condition schedule.document is not linked to cmn_rota and is schedule.type is not of type roster evaluates to true. A cmn_schedule_span whose schedule is schedule.document=cmn_rota and schedule.type=roster is defines the time of the Shift. Deleting this will simply damage the data integrity of the On-Call Shift application data model.
