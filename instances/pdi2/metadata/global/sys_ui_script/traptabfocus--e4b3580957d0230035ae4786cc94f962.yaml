description: "Generic angular module to trap the focus within a given element.\n\nBy default, all visible buttons and all visible elements with tabindex that is not -1 will be tabbable (except disabled ones)\n\nInstructions:\n- Include the jsbx file, for example: <g:include_script src=\"sn.itsm.common.accessibility.jsdbx\" />\n- Inject the dependency in the application module\n- Add the attribute 'trap-tab-focus' (it is an angular attribute directive) to the root element, for example: <div id=\"cnat\" class=\"cnat-modal\" trap-tab-focus=\"true\">\n- It is possible to have a different CSS selectors for the tabbable elements to include and elements to exclude. It has to be passed via the parent scope in the object \"tabbable\", for example:\n\t\t\t$scope.tabbable = {\n\t\t\t\t\"include\": \"button:visible, [tabindex]:visible, select:visible, input:visible\",\n\t\t\t\t\"exclude\": \"[tabindex='-1'], [disabled='disabled']\"\n\t\t\t};\n\t\t"
