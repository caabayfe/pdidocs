content: |-
  ## Widgets
  Widgets are a superset of [Angular Directives](https://docs.angularjs.org/guide/directive) that facilitate creating reusable components with client Angular.js and server Rhino JavaScript. Access to the [GlideRecord](http://wiki.servicenow.com/?title=GlideRecord), [Sass](http://sass-lang.com/) and usage of JavaScript libraries are some of the most powerful features.

  ### HTML Template
  Templates are written with HTML and can contain Angular elements and attributes. Angular combines the template with information from the model and controller `c` to render a dynamic view that a user sees in the browser.
  ```html
  <div class="count-widget">
    <h1 class="title">{{c.title}}</h1>
    <div>Total Records: {{c.data.count}}</div>
    <input type="text" ng-model="c.data.table"/>
    <input type="button" class="btn btn-default" ng-click="c.send()">
  </div>
  ```
  Templates must contain a single root HTML element that wraps the template.

  Use `c` to access the widget controller for generic bindings and calling functions. 

  ### CSS - Sass
  Here, you can write custom CSS that will only affect the widget it belongs to. In addition to all standard CSS, you also have access to [Sass](http://sass-lang.com/) constructs, which give you the ability to leverage things like variables, mixins, functions and nested structures.

  ```scss
  $custom-panel-color: #ff0000;

  .panel {
    background-color: $custom-panel-color;
    
    h4 {
      color: darken($custom-panel-color, 50%);
    }
  }
  ```

  ### Server Script
  This is where the server-side component of your widget will live. This script will execute before your widget renders and every time that the `input` value changes by a POST request from the client.

  ```javascript
  if (input) {
   var gr = new GlideRecordCounter(data.table);
   data.count = gr.getCount();
  }
  ```

  The `input` variable contains an Array with a POST request from client-side.test

  The `data` property is reserved for server-side / client-side data binding.

  In the server script, you have access to everything in the [ServiceNow Server Javascript API](https://developer.servicenow.com/app.do#!/api_doc?v=fuji&type=server&scoped=true) (including GlideRecord, GlideSession, etc.).

  ### Client Script
  This block contains the `controller` function of your widget directive. This is where your client-side logic will be contained. Syntactically, it is the same as any other Angular controller.

  ```javascript
  function(/* Your Angular Dependencies Here */) {
      var c = this;
      c.title = 'My Widget';
      c.send = function() {
          c.server.update().then(function(){
              c.title = 'Widget Count Updated';
          });
      }
  }
  ```

  The `c.server.update()` method keeps in sync the `data` object between the two by calling into your `server script`.

  Tip: Avoid using `$scope` when possible as we prefer the `controllerAs` syntax.


  ### Link Function (Advanced)
  Here, you can declare your own link function for the directive component of your widget. This is where you would do direct DOM manipulation. Syntactically, it is the same as any other Angular link function.

  ```javascript
  function(scope, element) { 
   var el = $(element[0]).find('input'); 
   scope.$evalAsync(function() {
    el.focus(); 
   });
  }

  ```
