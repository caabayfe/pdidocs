api_name: global.EF Insights Summary Transform
batch_exclude: 'false'
description: Returns a computed summary object for the Error Framework Insights summary card component. No LLM call — algorithmically derived from error code stats. Provides total errors, error code counts by severity, and a pre-formatted HTML summary message.
mutates_server_data: 'false'
name: EF Insights Summary Transform
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "errorPrefix",
      "label": "Error Prefix",
      "description": "Error prefix identifying the source application (e.g. 'SN-DISC', 'SN-CMDB')",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": "",
      "placeholder": "e.g., SN-DISC",
      "valueType": "string"
    },
    {
      "name": "domainPath",
      "label": "Domain Path",
      "description": "Domain path for STARTSWITH filtering (e.g. '/'). If not provided, no domain filtering is applied",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "",
      "placeholder": "e.g., /",
      "valueType": "string"
    },
    {
      "name": "timeRangeDays",
      "label": "Time Range (Days)",
      "description": "Lookback window in days for recent error activity (default: 14)",
      "readOnly": false,
      "fieldType": "integer",
      "mandatory": false,
      "defaultValue": "14",
      "placeholder": "e.g., 7, 14, 30",
      "valueType": "integer"
    }
  ]
