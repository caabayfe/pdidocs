api_name: global.EF Insights Top Error Cards Transform
batch_exclude: 'false'
description: Returns top N error code cards ranked by impact score for the Error Framework Insights card list component. No LLM call — algorithmically derived from error code stats. Also returns a summary object so the card panel header can be driven by a single data broker call.
mutates_server_data: 'false'
name: EF Insights Top Error Cards Transform
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "errorPrefix",
      "label": "Error Prefix",
      "description": "Error prefix identifying the source application (e.g. 'SN-DISC', 'SN-CMDB')",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": "",
      "placeholder": "e.g., SN-DISC",
      "valueType": "string"
    },
    {
      "name": "domainPath",
      "label": "Domain Path",
      "description": "Domain path for STARTSWITH filtering (e.g. '/'). If not provided, no domain filtering is applied",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "",
      "placeholder": "e.g., /",
      "valueType": "string"
    },
    {
      "name": "topN",
      "label": "Number of Cards",
      "description": "Number of top error code cards to return, ranked by impact score (default: 5)",
      "readOnly": false,
      "fieldType": "integer",
      "mandatory": false,
      "defaultValue": "5",
      "placeholder": "e.g., 3, 5, 10",
      "valueType": "integer"
    },
    {
      "name": "timeRangeDays",
      "label": "Time Range (Days)",
      "description": "Lookback window in days for recent error activity (default: 14)",
      "readOnly": false,
      "fieldType": "integer",
      "mandatory": false,
      "defaultValue": "14",
      "placeholder": "e.g., 7, 14, 30",
      "valueType": "integer"
    }
  ]
