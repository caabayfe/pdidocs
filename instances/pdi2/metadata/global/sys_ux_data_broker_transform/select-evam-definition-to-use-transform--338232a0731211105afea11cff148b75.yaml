api_name: global.Select EVAM definition to use transform
batch_exclude: 'false'
description: This transform is meant to serve as a utility for the Search Composite Data Broker, "Search EVAM Data Resource". It's job is to pick between an optionally provided EVAM Definition ID passed in to the Data Broker call, and an EVAM Definition ID configured on the Search Application ID passed in to the Data Broker. If one is specified on the Data Broker call via the "searchEvamConfigId" input prop, that will be used. Else, if there is an EVAM Definition specified on the Search Application record passed, that value is selected and returned.
mutates_server_data: 'false'
name: Select EVAM definition to use transform
output_schema: ''
private: 'true'
props: |-
  [
  {
        "name":"searchEvamConfigId",
        "label":"Provided Evam Definition ID",
        "description":"EVAM Definition to use, as specified by the application calling the Search databroker",
        "readOnly":false,
        "fieldType":"reference",
        "mandatory":false,
        "defaultValue":" ",
        "typeMetadata": {
               "reference": "sys_ux_composite_data"
         }
     },
