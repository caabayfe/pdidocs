api_name: global.Get Error Category Trends Time Series
batch_exclude: 'false'
description: Generates flexible time series data for error category trends from sys_error_cat_stats table. Returns configurable top N categories, total ignored errors, and combined others category for UI Builder time series charts. Supports daily aggregation with customizable date ranges and category selections.
mutates_server_data: 'false'
name: Get Error Category Trends Time Series
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "source_application",
      "label": "Source Application",
      "description": "sys_id of the source application to filter error categories by",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": "",
      "placeholder": "e.g., ac71f9700c803210f8777c5fbcc6bb81",
      "valueType": "string"
    },
    {
      "name": "sys_domain_path",
      "label": "Domain Path",
      "description": "Domain path to filter error categories by (e.g., '/' for global or a specific domain path)",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "",
      "placeholder": "e.g., / or /mydomain",
      "valueType": "string"
    },
    {
      "name": "domain_filter_operator",
      "label": "Domain Filter Operator",
      "description": "Operator to use for domain filtering: '=' for exact match or 'STARTSWITH' to include child domains",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "=",
      "valueType": "string"
    },
    {
      "name": "num_categories",
      "label": "Number of Top Categories",
      "description": "Number of top categories to include as individual lines (1-10)",
      "readOnly": false,
      "fieldType": "integer",
      "mandatory": false,
      "defaultValue": "10",
      "placeholder": "e.g., 4, 6, 8",
      "valueType": "integer"
    },
    {
      "name": "include_ignored",
      "label": "Include Ignored Errors",
      "description": "Whether to include total ignored errors as a separate line",
      "readOnly": false,
      "fieldType": "boolean",
      "mandatory": false,
      "defaultValue": "true",
      "valueType": "boolean"
    },
    {
      "name": "include_others",
      "label": "Include Others Category",
      "description": "Whether to include remaining categories combined as 'Others' line",
      "readOnly": false,
      "fieldType": "boolean",
      "mandatory": false,
      "defaultValue": "true",
      "valueType": "boolean"
    },
    {
      "name": "days_back",
      "label": "Days Back",
      "description": "Number of days of historical data to return",
      "readOnly": false,
      "fieldType": "integer",
      "mandatory": false,
      "defaultValue": "7",
      "placeholder": "e.g., 7, 14, 30",
      "valueType": "integer"
    }
  ]
