api_name: global.Get Error Severity Statics
batch_exclude: 'false'
description: Aggregates sys_error_code_stats by error_code.severity_label, summing error_count (mandatory) and optionally error_ignored_count and error_task_count for a given source application.
mutates_server_data: 'false'
name: Get Error Severity Statics
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "source_application",
      "label": "Source Application",
      "description": "sys_id of the source application to filter by",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": "",
      "placeholder": "e.g., ac71f9700c803210f8777c5fbcc6bb81",
      "valueType": "string"
    },
    {
      "name": "sys_domain_path",
      "label": "Domain Path",
      "description": "Domain path to filter error statistics by (e.g., '/' for global or a specific domain path)",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "",
      "placeholder": "e.g., / or /mydomain",
      "valueType": "string"
    },
    {
      "name": "domain_filter_operator",
      "label": "Domain Filter Operator",
      "description": "Operator to use for domain filtering: '=' for exact match or 'STARTSWITH' to include child domains",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "=",
      "valueType": "string"
    },
    {
