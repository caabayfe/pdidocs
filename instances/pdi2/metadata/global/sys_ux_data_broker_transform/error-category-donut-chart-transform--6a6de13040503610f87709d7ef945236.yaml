api_name: global.Error Category Donut Chart Transform
batch_exclude: 'false'
description: Transform function that queries error category statistics from sys_error_cat_stats table and returns data in ServiceNow UI Builder donut chart format. Provides interactive slices for top N categories, other categories summary, and ignored errors count with clickable drill-down functionality.
mutates_server_data: 'false'
name: Error Category Donut Chart Transform
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "source_application",
      "label": "Source Application",
      "description": "sys_id of the source application to filter error categories by",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": "",
      "placeholder": "e.g., 66eabe54409c7210f87709d7ef9452d1",
      "valueType": "string"
    },
    {
      "name": "sys_domain_path",
      "label": "Domain Path",
      "description": "Domain path to filter error categories by (e.g., '/' for global or a specific domain path)",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "",
      "placeholder": "e.g., / or /mydomain",
      "valueType": "string"
    },
    {
      "name": "domain_filter_operator",
      "label": "Domain Filter Operator",
      "description": "Operator to use for domain filtering: '=' for exact match or 'STARTSWITH' to include child domains",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "=",
      "valueType": "string"
    },
    {
      "name": "num_categories",
      "label": "Number of Top Categories",
      "description": "Number of top categories to include as individual slices (1-20)",
      "readOnly": false,
      "fieldType": "integer",
      "mandatory": false,
      "defaultValue": "10",
      "placeholder": "e.g., 3, 5, 8",
      "valueType": "integer"
    },
    {
      "name": "include_ignored",
      "label": "Include Ignored Errors",
      "description": "Whether to include total ignored errors as a separate slice",
      "readOnly": false,
      "fieldType": "boolean",
      "mandatory": false,
      "defaultValue": "true",
      "valueType": "boolean"
    },
    {
      "name": "include_others",
      "label": "Include Others Category",
      "description": "Whether to include remaining categories combined as 'Others' slice",
      "readOnly": false,
      "fieldType": "boolean",
      "mandatory": false,
      "defaultValue": "true",
      "valueType": "boolean"
    }
