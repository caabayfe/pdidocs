description: |-
  KM UI extension point for updating notification email content

  Create an extension point instance to update the email content using the event JSON object. Article record data can be accessed using ${jvar_articleobj.getValue("FIELD_NAME")} and instance URL can be accessed by {jvar_url} which are sent as variables from sys_email_script "Notification: Article commented". 
