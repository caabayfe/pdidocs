description: |-
  Creates a date field with a calendar selector

              Attributes:
              name= name of the input field
              value= initial value of the field (defaults to now)

              Note for aria-labelledby:
              To ensure the label is associated with the input for accessibility purposes, give the label for this input an id in the format of id="<name attribute>_label".
              e.g., in a UI Page where the 'name' attribute is "ship_date":
              <div class="row">
              <div class="col-md-6">
              <label id="ship_date_label">${gs.getMessage('Ship date')}</label>
              </div>
              <div class="col-md-6">
              <g:ui_date name="ship_date" id="ship_date" value=""/>
              </div>
              </div>
