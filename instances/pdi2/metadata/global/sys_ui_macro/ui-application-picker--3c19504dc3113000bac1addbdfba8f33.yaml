description: |-
  creates an application picker dropdown menu. The macro allows users to select different applications, view the selected application details, and refresh the application list. It includes:

  - A dropdown menu to select applications
  - A link to view the list of all applications
  - An icon to view the currently selected application
  - A refresh button to reload the application list
