description: |-
  Creates a breadcrumb navigation link with optional filter removal

  Attributes:
  jvar_clipped = URL for removing filter or 'none' to hide the breadcrumb separator
  jvar_guid = Unique identifier for the breadcrumb element
  jvar_classname = CSS class for the link
  jvar_href = URL for the main link
  jvar_text = Display text for the link
