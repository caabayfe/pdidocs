description: |-
  OK and Cancel buttons for a FORM dialog
  Default actions are actionOK() and close (destroy) the dialog
   
  actionOK() - you need to supply in the page's client script section
  ok_id - ID for the OK button.  Defaults to "ok_button" if not specified.
  cancel_id - ID for the Cancel button.  Defaults to "cancel_button" if not specified.
