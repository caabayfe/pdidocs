category: general
description: |-
  Creates add/remove buttons for a select list control

  Attributes:
  name = name of the element (REQUIRED)
  selecttable = JavaScript object that handles the item movement (REQUIRED)
  leftzone = ID or reference to the left zone element (REQUIRED)
  rightzone = ID or reference to the right zone element (REQUIRED)
  move_right_button_label = label for the add button, defaults to "Add"
  move_left_button_label = label for the remove button, defaults to "Remove"
