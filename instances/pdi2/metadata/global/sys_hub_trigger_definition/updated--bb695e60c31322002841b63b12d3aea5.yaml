description: '<p>Trigger initiates from a ServiceNow record update that meets the condition filter. Configure the trigger to initiate the flow (Once) triggers the flow once for the life of the record, (Only if not currently running) triggers the flow for every unique change if the flow is not currently running, (For each unique change) triggers the flow for every unique change, even if the flow is currently running, or (For every update) triggers the flow for every update to the record, including if the same update previously occurred.</p> <p>Note: Flows that have a record trigger that runs (For each unique change) can produce recursions when run in a non-interactive session. When such flows make a change to the trigger record, the change meets the flow trigger conditions and causes a recursion.</p><p>Note: For a flow that uses Approvals, it is recommended that you configure flows to run (Once).</p>'
