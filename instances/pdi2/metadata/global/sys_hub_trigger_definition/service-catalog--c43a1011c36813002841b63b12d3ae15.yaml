description: '<p>Trigger initiates from a ServiceNow Service Catalog Item Request. By using the Service Catalog trigger, the flow can be configured on a Service Catalog item form and started by a Service Catalog item request.</p><p>Note: Stages are available for all parent Flows. When a Flow is associated with a Service Catalog Item with the Workflow field, the flow stages display when the item is requested. Only stages from the parent flow display. As the Flow progresses, stages on paths that the flow did not take are skipped or removed from the display.</p>'
