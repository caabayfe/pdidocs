description: |-
  Number of reassigned open changes is measured daily as unit #.
  The goal for this indicator is not set
  It is the count on data source Changes.Open, which is using the table:
  change_request
  with the following conditions:
  Opened on Today .or. Opened < 2015-11-26 00:00:00 .and. Closed is empty .or. Closed > 2015-11-26 23:59:59
  Additional conditions:
  Reassignment count > 0
