description: |-
  Sum Business Services Impact Time is measured daily as unit Minutes.
  The goal for this indicator is to minimize
  It is the sum on data source Impact.BS.Time, which is using the table:
  em_impact_status
  with the following conditions:
  Severity in (Critical, Major, Minor, Warning) .and. Business Service Sys ID is same  as Element Identifier Sys ID .and. Valid Time Start on Today .and. or Severity in (Critical, Major, Minor, Warning) .and. Business Service Sys ID is same  as Element Identifier Sys ID .and. Valid Time End on Today .and. or Severity in (Critical, Major, Minor, Warning) .and. Business Service Sys ID is same  as Element Identifier Sys ID .and. Valid Time Start <= 2016-02-01 23:59:59 .and. Valid Time End >= 2016-02-01 00:00:00 .and. Business Service Class != Alert Group
