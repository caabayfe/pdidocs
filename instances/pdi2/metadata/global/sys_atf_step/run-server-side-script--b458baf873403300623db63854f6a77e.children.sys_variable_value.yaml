  value: |-
    // Retrieve all the active solutions and pass on to the next test step
    (function(outputs, steps, stepResult, assertEqual) {
    	var count = 0;
    	var sysids = "";
    	var solutions = new GlideRecord("ml_solution");
    	var sol_def_id; 
    	var solution_definition;
    	solutions.addQuery("active","true");
    	solutions.addEncodedQuery("capability=similarity_trainer^");
    	solutions.query();
    	gs.info(solutions.getRowCount() + " active solutions found.");
    	while (solutions.next() ) {
    		sol_def_id = solutions.ml_capability_definition;
    		solution_definition = new GlideRecord("ml_capability_definition_base");
    		solution_definition.get(sol_def_id);
    		if (solution_definition.active) {
    			count++;
    			sysids += solutions.getUniqueValue() + ",";
    			gs.info(solutions.solution_name + '    Ver -  ' + solutions.version);
    		}
    	}
    	outputs.record_id = sysids.slice(0,-1);
    	stepResult.setOutputMessage(count + " active similarity solution definition found.");
    })(outputs, steps, stepResult, assertEqual);
