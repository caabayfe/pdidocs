  value: |-
    (function(outputs, steps, stepResult, assertEqual) {

    var groupSysId;
    var scheduleSysId;
    	
    var ugroup = new GlideRecord("sys_user_group");
    ugroup.addQuery("name","ATF Test Group 13");
    ugroup.query();
    if(ugroup.next())
    	groupSysId = ugroup.getValue("sys_id");
    	
    var shift_gr = new GlideRecord("cmn_rota");
    shift_gr.addQuery("name","APAC");
    shift_gr.addQuery("group",groupSysId);
    shift_gr.query();
    	if(shift_gr.next())
    	scheduleSysId = shift_gr.getValue("schedule");
    	
    outputs.record_id = scheduleSysId;
    	
    })(outputs, steps, stepResult, assertEqual);
