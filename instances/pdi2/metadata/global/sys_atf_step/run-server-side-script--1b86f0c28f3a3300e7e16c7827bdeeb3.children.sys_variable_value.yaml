    	var typeId = steps(prevID).record_id;
    	var catSysId;
    	
    	describe("Update the filter condition under the Mteric category", function() {
    	
            it("Update category filter condtion", function() {
    			var metricType = new GlideRecord('asmt_metric_category');
    			metricType.addQuery('metric_type',typeId);
    			metricType.query();
    			gs.info("The row count will be  :: " + metricType.getRowCount());
    			metricType.next();
    			catSysId = metricType.getUniqueValue();
    			metricType.setValue("filter","short_descriptionLIKEATF^EQ");
    			metricType.update();
    			gs.info("The category sys id is " + catSysId);
    			outputs.record_id =catSysId;
    			return true;
            });

        });
    	
