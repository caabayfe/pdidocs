  value: |-
    
    (function(outputs, steps, stepResult, assertEqual) {
    var group_sysId;
    var user_SysId;

    var user = new GlideRecord("sys_user");
    user.setValue("user_name", "ATFTest4.user");
    user.setValue("first_name", "ATFTest4");
    user.setValue("last_name", "user");
    user_SysId = user.insert();

    var ugroup = new GlideRecord("sys_user_group");
    ugroup.initialize();
    ugroup.setValue("name","ATF Test Group 4");
    group_sysId = ugroup.insert();

    var user_group = new GlideRecord("sys_user_grmember");
    user_group.initialize();
    user_group.setValue("user",user_SysId);
    user_group.setValue("group",group_sysId);
    user_group.insert();

    var todayDate = new GlideDateTime();
    todayDate.add(-24*60*60*1000);

    var shiftData = {"name":"ATF Test Shift 4","schedule_type":"simple","start_date":todayDate.getDisplayValueInternal(),"specify_holiday":false,"send_reminders":true,"reminder_lead_time":2,"coverage_lead_type":"weekly","coverage_interval":12,"index":0, "all_day": true, "time_zone": "GMT", "days": "1234567"};

    var wizardUtils = new OnCallCreationWizardUtils();
    var rotaObj = wizardUtils.createShiftFromTemplates(shiftData, group_sysId);

    var rosterData = {
    	"rota": rotaObj.sys_id + "",
    	"shift_index":0,
    	"roster_index":0,
    	"rotation_start_date":todayDate.getDisplayValueInternal(),
    	"rotation_interval_type":"weekly",
    	"rotation_interval_count":1,
    	"dow_for_rotate":"",
    	"name":"Primary",
    	"order":100,
    	"send_reminders":true,
    	"reminder_lead_time":2,
    	"members":[{"member":  user_SysId + "","order":0}]
    };

    wizardUtils.createRosterAndMembers(rosterData);
    	
    var rotaGr = new GlideRecord('cmn_rota');
    rotaGr.get(rotaObj.sys_id + "");
    rotaGr.setValue("state","");
    rotaGr.setValue("active", true);
    rotaGr.update();

    })(outputs, steps, stepResult, assertEqual);
