  value: |-
    (function(step, stepResult, steps, jasmine, describe) {
    	
    	var USER_QUERY_STEP_1 = "89b6a407679313008b52f3b457415a27";
    	
    	var validUserSysId = steps(USER_QUERY_STEP_1).first_record + "";
    	
    	var userNameIdenProcessor = new PwdIdentifyViaUsername();
    	var emailIdenProcessor = new PwdIdentifyViaEmail();
    	
    	var validUserName = 'abel.tuter';
    	var invalidUserName = 'invalid.user';
    	var validUserEmail = 'abel.tuter@example.com';
    	var invalidUserEmail = 'invalid.user@example.com';

    	
    	describe("Username Identification processor test", function() {
    		
    		it("is a valid user", function(){
    			var res = userNameIdenProcessor.processForm({userInput: validUserName});
    			expect(res == validUserSysId).toBe(true);
    		});
    		
    		it("is NOT a valid user", function(){
    			var res = userNameIdenProcessor.processForm({userInput: invalidUserName});
    			expect(res == null).toBe(true);
    		});

    	});
    	
    	describe("Email Identification processor test", function() {
    		
    		it("is a valid user", function(){
    			var res = emailIdenProcessor.processForm({userInput: validUserEmail});
    			expect(res == validUserSysId).toBe(true);
    		});
    		
    		it("is NOT a valid user", function(){
    			var res = emailIdenProcessor.processForm({userInput: invalidUserEmail});
    			expect(res == null).toBe(true);
    		});

    	});

    })(step, stepResult, steps, jasmine, describe);

    jasmine.getEnv().execute();
