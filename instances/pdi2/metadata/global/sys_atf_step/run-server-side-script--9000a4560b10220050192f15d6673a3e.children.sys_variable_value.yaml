  value: |-
    (function(step, stepResult, jasmine, describe) {
    	
    	describe("A jasmine test with success result", function() {
    		beforeEach(function() {
    			//create the test sys_repo_config record
    			var gr = new GlideRecord('sys_repo_config');
    			gr.setValue('url', 'https://thisisafaketesturl.com/fakegitrepo');
    			gr.setValue('username', 'fakeuser');
    			gr.setValue('password', 'fakepassword');
    			gr.insert();
    		});

    		it("Expect sys_repo_config exists", function() {
    			var gr = new GlideRecord('sys_repo_config');
    			gr.addQuery('username', 'fakeuser');
    			gr.query();
    			expect(gr.getRowCount()).toEqual(1);
    		});

    		afterEach(function() {
    			// remove the test record
    			var gr = new GlideRecord('sys_repo_config');
    			gr.addQuery('username', 'fakeuser');
    			gr.deleteMultiple();
    		});
    	});
    	
    })(step, stepResult, jasmine, describe);

    jasmine.getEnv().execute();
