    	var options = {};
    // Default topN is 1
    options.topN = 3;


    // Get unique, AgentZero specific solution from Store
    var agentZeroSolutionName = "ml_x_snc_global_global_agent_zero";
    var agentZeroPISolution = sn_ml.AgentZeroSolutionStore.get(agentZeroSolutionName);
    // Get active version
    var agentZeroVersion = agentZeroPISolution.getActiveVersion();
    var glideRecord =new GlideRecord("incident");
    glideRecord.get("ed92e8d173d023002728660c4cf6a7bc");
    // Make predictions using glideRecord and options as input
    // TopN Intents will be returned as a JSON
    var predictions = agentZeroVersion.predict(glideRecord, options);

    	if(predictions == ""){
    		stepResult.setOutputMessage("No prediction found.");
    		return false;
    	}
    	else if(predictions.contains("\"predictedValue\":\"EmailIssues\"")){
    		
    		stepResult.setOutputMessage("prediction found:"+predictions);
