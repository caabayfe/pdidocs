    (function(outputs, steps, stepResult, assertEqual) {
        // add test script here
    	var orgSurveyId = "6ec34827531033005e0addeeff7b1209";
        var cloneSysID;
        describe("A test for Survey Category And Questions", function() {
            it("A Validate Survey category created", function() {
                var copySurvey = new GlideRecord('asmt_metric_type');
                copySurvey.addQuery('name', 'Copy of EBC Customer Survey');
                copySurvey.query();
                expect(copySurvey.getRowCount() > 0).toBe(true);
                copySurvey.next();
                cloneSysID = copySurvey.getUniqueValue();
    			outputs.record_id=cloneSysID;

            });
            it(" Verify the number of categories and metric should created", function() {
                var sysId = new GlideRecord("asmt_metric");
                sysId.addQuery('metric_type', orgSurveyId);
                sysId.query();
                var catNum1 = sysId.getRowCount();
    			var sysId1 = new GlideRecord("asmt_metric");
                sysId1.addQuery('metric_type', cloneSysID);
                sysId1.query();
                var catNum2 = sysId1.getRowCount();
    			if(catNum1 == catNum2){
    				stepResult.setOutputMessage("Category record matched");
    				return true;
    			}
    			else {
    				stepResult.setOutputMessage("Category records mis matched to each other ");
    				return false;
    			}
    			

            });

        });

    })(outputs, steps, stepResult, assertEqual);
    // uncomment the next line to execute this script as a jasmine test
    jasmine.getEnv().execute();

