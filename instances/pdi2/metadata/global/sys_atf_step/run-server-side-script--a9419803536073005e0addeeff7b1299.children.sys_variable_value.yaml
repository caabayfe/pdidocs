    (function(outputs, steps, stepResult, assertEqual) {
        // add test script here
    	var surveyCategory='Creator Test Survey';
    	var catId;
    	describe("Count the Category under the Survey", function() {
    	
            it("Survey should not have any category", function() {
    			var metricCategory = new GlideRecord('asmt_metric_category');
    			metricCategory.addQuery('name',surveyCategory);
    			metricCategory.query();
    			expect(metricCategory.getRowCount() != 0).toBe(true);
    			metricCategory.next();
    			catId = metricCategory.getUniqueValue();
    			expect(catId).not.toBe(null);
    			outputs.record_id =catId;
            });

        });

    })(outputs, steps, stepResult, assertEqual);
    // uncomment the next line to execute this script as a jasmine test
    jasmine.getEnv().execute();
