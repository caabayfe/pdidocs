  value: |-
    (function(step, stepRunner, jasmine, describe) {
    	describe("A jasmine test with failure result", function() {
    		beforeEach(function() {
    			//create the test sys_repo_config record
    			var gr = new GlideRecord('sys_repo_config');
    			gr.setValue('url', 'https://thisisafaketesturl.com/fakegitrepo');
    			gr.insert();
    		});

    		it("Expect sys_repo_config exists", function() {
    			var gr = new GlideRecord('sys_repo_config');
    			gr.addQuery('url', GlideGuid.generateRand()); // expect to retrieve nothing
    			gr.query();
    			expect(gr.getRowCount()).toEqual(1);
    		});

    		afterEach(function() {
    			// remove the test record
    			var gr = new GlideRecord('sys_repo_config');
    			gr.addQuery('url', 'https://thisisafaketesturl.com/fakegitrepo');
    			gr.deleteMultiple();
    		});
    	});	
    	

    })(step, stepResult, jasmine, describe);

    jasmine.getEnv().execute();
