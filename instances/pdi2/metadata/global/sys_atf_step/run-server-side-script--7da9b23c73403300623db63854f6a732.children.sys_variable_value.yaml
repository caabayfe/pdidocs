  value: |-
    //Getting all the used active solution
    (function(outputs, steps, stepResult, assertEqual) {
    	// If no output received from earlier step then exit
    	if(steps("7199b23c73403300623db63854f6a775").record_id == ""){
    		stepResult.setOutputMessage("No active classification solutions with old predictions found.");
    		return true;
    	}
    	var actvSolId = steps("7199b23c73403300623db63854f6a775").record_id.split(",");
    	var actvSolWithPred = "";
    	var count = 0;
    	for(var i = 0; i < actvSolId.length; i++){
    		var oldPred = GlideRecord("ml_predictor_results");
    		oldPred.addQuery("solution",actvSolId[i]);
    		oldPred.query();
    		if(oldPred.next()){
    			count++;
    			actvSolWithPred += actvSolId[i] + ",";
    			gs.info(oldPred.solution.solution_name);
    		}
    	}
    	stepResult.setOutputMessage(count + " active classification solutions with old predictions found.");
    	outputs.record_id = actvSolWithPred.slice(0,-1);
    })(outputs, steps, stepResult, assertEqual);
