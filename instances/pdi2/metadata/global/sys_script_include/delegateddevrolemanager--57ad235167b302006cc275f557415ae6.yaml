description: |-
  Role manager for delegated development.  Controls creating/managing roles and allocating permissions to indivdual users within particular scopes.

  Usage:

  var mgr = DelegatedDevRoleManager.forScopeAndPermissionSet(myScopeId, myPermissionSetId);
  mgr.allocatePermissionToUser(userId);
  mgr.removePermissionFromUser(userId);
