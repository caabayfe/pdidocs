description: |-
  Script include for use in refactoring of Computer Telephony integrations in accordance with KB0620953 (revised)

  Example of usage from a global function invoked by cti.do:
  		
  		var args = {};  // JavaScript object to pass name/value pairs with
  		args._name = sysparm_caller_name;
  		args._phone = sysparm_caller_phone;
  		args._taskID = sysparm_task_id;
  		args._userID = userID;

  		. . . .  (additional statements to accomodate whatever other incoming values from function cti() )

  		return new CTIEvaluator("... expression to be evaluated using _name, _phone, etc .....", args).evaluate();
