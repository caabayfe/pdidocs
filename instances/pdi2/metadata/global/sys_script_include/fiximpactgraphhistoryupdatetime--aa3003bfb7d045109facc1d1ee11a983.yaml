api_name: global.FixImpactGraphHistoryUpdateTime
caller_access: ''
client_callable: 'false'
description: |-
  This script is meant to check that in em_impact_graph_history table we have records that were created in the last 3 months and therefore will not be cleaned in the table cleaner job.
  In case there are is only one record left per BS,  change their sys_updated_on to current time.
  This way we make sure there will always be an entry in em_impact_graph_history table to show the Services's Impact tree. 
  Logic:
  If sys_updated_on is larger then 3 months - record will be deleted.
  So, in the table we have only records that are less then 3 months.
  If we want to catch the problematic BS before their last record is deleted, we search for a range that is lesser then 3 months (X days - default is 60),
  and 'touch' the most updated record of that BS in case it doesnt have more update records in the range we are checking 
mobile_callable: 'false'
