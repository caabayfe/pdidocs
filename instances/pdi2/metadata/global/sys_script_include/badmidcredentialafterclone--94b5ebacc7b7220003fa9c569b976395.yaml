api_name: global.BadMIDCredentialAfterClone
caller_access: ''
client_callable: 'false'
description: |-
  Schedules execution of two jobs designed to log to the ecc_agent_issue table the set of MID Servers that are "Down" after an instance clone.
  The identified set of MID Servers may not be ready for normal processing due to invalid credentials. 
  NOTE: The MID Server [ecc_agent] table is not copied from the source instance while the User [sys_user] table is.   
  Therefore the source MID server User credentials copied into the target instance may not match those used by the existing set of target MID Servers.
mobile_callable: 'false'
