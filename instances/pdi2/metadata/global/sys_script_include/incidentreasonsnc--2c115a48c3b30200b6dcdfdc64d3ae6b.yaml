description: |-
  Incident hold_reason constants, use these constants when determining which incident on hold reason to use.

  Example - When the incident is on hold and is "Awaiting Caller":
  var incidentGr = new GlideRecord("incident");
  if (incidentGr.get("[sys_id]") && incidentGr.state == IncidentState.ON_HOLD && incidentGr.hold_reason == IncidentReason.AWAITING_CALLER)
      // do something when the incident is on hold
