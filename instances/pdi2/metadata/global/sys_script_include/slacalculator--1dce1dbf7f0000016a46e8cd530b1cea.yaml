description: |-
  The SLA Calculator is used with the SLA and SLA contract plugins, and its older "2010" SLA Engine, to help calculate updates to task_sla records.

  The internal implementations are identical and compatible to SLACalculatorNG so this class and its methods now remain in order to support existing callers.
  (Any customised version of this class also continues to be called by the older "2010" SLA Engine implementation.)

  The bulk of the current implementation now lives in SLACalculatorNG.

  New callers should probably invoke the class methods of SLACalculatorNG instead (see its Description).
