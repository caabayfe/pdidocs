description: |-
  Captures daily delta IH (ua_ih_usage) transaction counts into ua_ih_usage_daily.

  Reads the current cumulative use_count from ua_ih_usage (monthly accrual table) for all IntegrationHubPool records in the current accrual month, then computes the daily delta  and inserts a new record into ua_ih_usage_daily.
