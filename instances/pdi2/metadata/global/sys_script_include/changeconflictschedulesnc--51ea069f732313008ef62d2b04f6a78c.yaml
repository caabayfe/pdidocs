api_name: global.ChangeConflictScheduleSNC
caller_access: ''
client_callable: 'false'
description: |-
  Utility for finding the next available time for scheduling a Change Request.

  Entry point is findScheduleWindows, which returns availability in the form of windows and spans. Windows are times where the Change can be scheduled as defined by the combination of maintenance and blackout schedules as well as already scheduled Change Requests. Spans are times that have been calculated according to the duration defined by the Planned start and end date for the Change.

  If availability.windows contains values and availability.spans is empty, then we were unable to fit the duration for implementing the Change into the available windows.

  Use the ChangeConflictSchedule script-include if you would like to make changes to this script by overriding the function in ChangeConflictSchedule. 
