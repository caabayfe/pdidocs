api_name: global.CartLayoutMigration
caller_access: ''
client_callable: 'false'
description: |-
  After Fuji, service catalog page layouts are driven by Cart Layouts (sc_layout records)

  To migrate an instance to using these, this script ensures the instance hasn't modified either of the pre-fuji macros.
  If no modifications then set the 'glide.sc.use_cart_layouts' property to true and instance will start using the new 

  The script will also find any sc_cat_item records that do not have a value in use_sc_layout field and set the value to true

  Also if there are any sc_cat_itmes that have their custom cart settings, then set the sc_cart_layout = false e.g. true values in the fields:
   - no_cart
   - no_order
   - no_proceed_checkout
   - no_quantity
   - no_order_now
   - omit_price=true
   - custom_cart is not empty

  You should use this script
   - if you want to turn on the property 'glide.sc.use_cart_layouts'
   - if you have imported any new sc_cat_items from another instance

  To use this script:
  var cm = new CartLayoutMigration();
  cm.migrate();
mobile_callable: 'false'
name: CartLayoutMigration
sandbox_callable: 'false'
