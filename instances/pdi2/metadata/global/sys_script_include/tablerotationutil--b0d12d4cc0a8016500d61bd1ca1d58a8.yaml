description: |-
  Handles the creation of table rotations.  These are tables that grow (new tables) at one end and shrink (archive) from the other.  

  Table rotations are defined in the sys_table_rotation.  An example would be sys_audit.  The sys_audit table is the model which creates rotations as needed.  
