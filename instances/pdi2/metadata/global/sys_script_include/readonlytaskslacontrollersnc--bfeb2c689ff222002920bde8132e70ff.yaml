api_name: global.ReadOnlyTaskSLAControllerSNC
caller_access: ''
client_callable: 'false'
description: |-
  This extension of TaskSLAController operates in read-only mode and can be used for diagnostics.

  Usage:
  ======

  - Initialize ReadOnlyTaskSLAControllerSNC
  - Prepare a list of Task Glide Records ordered on update from Task audit, which represent the values they had at that particular time
  - Call initNewTaskSLA for the Glide Records till a point taskSla is obtained.
  - Call updateTaskSLA subsequently till we reach terminal stages of cancelled or completed. Discard the taskSLA object in this case and continue the process until all the records for Task are exhausted.

  The returned taskSLA for updateTaskSLA contains the taskSLA snapshot at that point in time.

  e.g Usage - SLATimeLineV2
