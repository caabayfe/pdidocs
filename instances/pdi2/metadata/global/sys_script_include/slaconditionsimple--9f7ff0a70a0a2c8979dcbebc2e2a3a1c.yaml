description: |-
  Override the SLAConditionBase methods, with a 'simple' variation that interprets conditions purely for the transition.
  (affecting attach, reattach, and cancel.)

  An SLA instance can still be cancelled if the start_condition and the pause_condition are both false.

  (set com.snc.sla.default_conditionclass property to 'SLAConditionSimple', to use by default for SLA condition tests when not overridden by the SLA definition);
