api_name: global.DiscoveryPatternOrchestratorFlowManager
caller_access: ''
client_callable: 'false'
description: |-
  This file implements the discovery pattern orchestrator flow
  Pattern orchestrator is an async & a stateless component designed to manage pattern discoveries flows such as cloud and server-less discoveries [and maybe other types of discoveries in the future] 
  Its main goal is making execution decisions based on flow's current state and events 

  The flow manager heavily relies on JS objects containing execution information for current executing patterns or child patterns to be executed
  These objects refer to executionInfo and parentExecutionInfo [depends on the context] and may contain the following information on an execution based on the stage in the Orchestrator processing:
  {
  	name: Name of the execution. See '_generateExecutionName()',
  	status: Status sys_id,
  	schedule: Schedule sys_id,
  	discoveryType: The type of the discovery - 'Serverless', 'Cloud Resources', etc...,
  	patternId: Pattern sys_id,
  	patternName: Pattern name,
          scheduleLauncherId: Main flow's sysid [discovery_pattern_launcher],
  	mainCiType: Pattern main CI type,
  	parentMainCiType: Main CI type of the parent pattern,
  	parentExecution: The sys_id of the parent execution in 'sn_discovery_orchestrator_pattern_execution',
  	context: JS object containing the context [= pre-execution] data for the pattern with some metadata on the context,
  	ciToAttributedToBeUsedMap: Map of Ci class to a list of attributes. Used to prepare the used_context from 'context' attribute,
          globalData: {
               sysId: The sysid of the global record created in sn_discovery_orchestrator_pattern_execution_global_data
               runDependentPatterns: true\false whether child patterns should run after this one,
               scheduleLauncherId: The launcher [discovery_ptrn_hostless_lchr] responsible for that flow
          }
  }

  For example, if the pattern just finished running or a single Orchestrator page is about to be processed, DiscoveryPatternOrchestratorEventHandler gets an executionIfo object from the horizontal sensor with really basic information, since the sensor has nothing to do with the actual orchestration process
  Then the orchestrator will enhance this object with data as needed
