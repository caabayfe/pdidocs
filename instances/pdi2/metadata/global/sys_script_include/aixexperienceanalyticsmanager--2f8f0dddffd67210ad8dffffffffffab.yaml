description: |-
  Automatically creates an Analytics Application (sys_analytics_app) record when a new AIX Experience is created.
              This asynchronous Business Rule ensures each AIX Experience is registered for analytics tracking by generating a corresponding analytics app entry with predefined defaults, while dynamically mapping the experience sys_id and name. Duplicate records are prevented through an existence check.
