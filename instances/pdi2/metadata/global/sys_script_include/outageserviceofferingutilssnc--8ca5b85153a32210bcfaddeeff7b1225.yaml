description: |-
  Purpose:
  - Manages service offerings related to Configuration Items (CIs) on outage records
  - Handles both manual refresh via UI Action and automatic refresh via Business Rule

   Usage:
   1. Manual refresh via UI Action:
    var utils = new OutageServiceOfferingUtils();
    var result = utils.refreshAffectedServiceOfferings(current);
   2. Automatic refresh via Business Rule:
    Controlled by system property: com.snc.outage.auto_refresh_service_offerings
