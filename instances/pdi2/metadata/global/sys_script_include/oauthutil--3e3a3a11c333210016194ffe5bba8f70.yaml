description: "//* Dont edit this script include. Best practise: Extend this script include and override the functions like shown in sample code. \n// Use the Script include to add or update headers, query parameters, endpoint URLs in oauth flow.\n//* sample script below\n//*\n\tvar OAuthCustomUtil = Class.create();\n\tOAuthCustomUtil.prototype = Object.extendsObject(OAuthUtil, {\n\n\tpreprocessAuthCode: function(requestParamMap) {\n\t\tthis.oauthContext.setAuthorizationEndpoint(\"https://accounts.google.com/o/oauth2/v2/auth\");\n\t\tthis.oauthContext.addHeader(\"Content-Type\",\"application/json\");\n\t\tvar profGr = this.oauthContext.getOAuthProfile();\n\t\tgs.info(profGr.getValue('name'));\n\t},\n\t\n\tpreprocessAccessToken: function(requestParamMap) {\n\t\tthis.oauthContext.addHeader(\"Content-Type\",\"application/json\");\n\t\tthis.oauthContext.addQueryParameter(\"name\",\"jackson\");\n\t\tgs.info(this.oauthContext.getQueryParameter(\"name\"));\n\t\tgs.info(this.oauthContext.getHeader(\"Content-Type\"));\n\t\tthis.oauthContext.setTokenEndpoint(\"https://oauth2.googleapis.com/token\");\n\t\tvar profGr = this.oauthContext.getOAuthProfile();\n\t\tgs.info(profGr.getValue('grant_type'));\n\t},\n\t\n\ttype: 'OAuthCustomUtil'\n}); \n "
