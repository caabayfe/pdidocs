api_name: global.XMLHelper
caller_access: ''
client_callable: 'false'
description: |-
  Helper methods for with XML.  Has the following methods:
      toObject:  converts an XML string (given in the constructor or as an argument) into a JavaScript object.
      toXML:     converts a JavaScript object (given as the argument) to an XML string.  This is the inverse of toObject(), above.

  The JavaScript object produced or interpreted by the methods above is hierarchical, matching the hierarchy of the equivalent XML document.
  Property names have three flavors:
  -- alphanumeric (like "dog", "bogus3", etc.) correspond to an XML tag.  The value of these properities is either an object or an array of objects,
     each of which contains other tags, attributes, or text.
  -- alphanumeric with leading "@" (like "@name", "@id", etc.) correspond to attribute names (without the "@").  The value of these properties is
     the value of the attribute.
  -- "#text" corresponds to single text field enclosed within a tag.  The value of these properties is the value of the enclosed text.



  Example:

  var xmlhelp = new XMLHelper("<xml><tag>body</tag></xml>");
  var x = xmlhelp.toObject();
  gs.log("tag is: " + x.tag);
mobile_callable: 'false'
name: XMLHelper
