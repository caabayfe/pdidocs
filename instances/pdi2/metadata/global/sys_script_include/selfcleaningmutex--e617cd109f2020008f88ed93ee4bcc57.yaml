api_name: global.SelfCleaningMutex
caller_access: ''
client_callable: 'false'
description: |-
  API to Acquire a database-based, system-wide, self-cleaning, named mutex
          & Release the mutex after use

  This is appropriate for a Mutex that protects an arbitrary resource with an 'unpredictable' name (e.g. containing a sys_id).
  (Cf. Mutex, which is more appropriate for a Mutex that is being used over and over again.)

  This is compatible with Mutex, but cleans up after itself in the database.

  Caveats: The self-cleaning mutex is stored system-wide, in the database, so there is a performance 'cost' to using it.
                 therefore do not acquire and release inside a tight loop!
                 The Mutex Name is the "scope" of the mutex, and can be anything appropriate, though there are 
                 conventions in use in some parts of the system, e.g. [table name + record sys_id].

  Status of Interface: Evolving, subject to change.

  // Example usage:
  var MY_MUTEX = '<<<--My Self-cleaning Mutex Name ' + current.sys_id + ' -->>>';
  ...

  // Easiest, if you have a single function or method that needs to be restricted to one execution at a time:
  // call myFunction(), in "this" scope, with arguments: (myFunctionArgument1, myFunctionArgument2, ...)
  // myFunction can also be an anonymous function defined inline.
  var returnValue = SelfCleaningMutex.enterCriticalSection( MY_MUTEX, this, myFunction, myFunctionArgument1, myFunctionArgument2, ... );

  // Alternate: more complex way, manually create the self-cleaning mutex object:
  var mySCMutex = new SelfCleaningMutex(MY_MUTEX);

  // optional
  mySCMutex.setSpinWait(200);     // time to wait between attempts, in ms
  mySCMutex.setMaxSpins(125); // maximum number of times to try

  // get the mutex, and then enter the critical section
  // use 'finally', to make sure that the mutex is always released.
  if (mySCMutex.get())
     try {
        // enter critical section
        ...
     }
     finally {
        mySCMutex.release();
     }
