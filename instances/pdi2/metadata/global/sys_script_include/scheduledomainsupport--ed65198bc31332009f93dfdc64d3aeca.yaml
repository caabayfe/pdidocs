description: |-
  Utility for Schedule Domain support.

  Checks for domain conflicts between child and parent records. For example, cmn_schedule_span is a child of cmn_schedule, or, cmn_schedule is a child of a cmn_other_schedule record.

  Introduces new domain behaviour for Schedule tables. For example, the cmn_schedule_span table is updated to include the "domain_master" attribute, this will refer to the parent cmn_schedule when deriving the domain of the cmn_schedule_span record.
