api_name: global.HttpResponseEccPayloadConverter
caller_access: ''
client_callable: 'false'
description: |-
  Converts HTTP response to XML payload 

  Response payload in XML :-

  <?xml version="1.0" encoding="UTF-8" ?>
  <results error=${httpresponse.error_message}>
      <result>
          <output>${httpresponse.body}</output>
  <!-- OR -->
          <attachment_output>${httpresponse.body}</attachment_output>
      </result>
      <httpHeaders>
          <httpHeader name=${name} value=${value}  />
      </httpHeaders>
      <httpCookies>
          <httpCookie value=${value}  />
      </httpCookies>
      <parameters>
          <parameter name="http_status_code" value=${value} />
      </parameters>
  </results>
mobile_callable: 'false'
name: HttpResponseEccPayloadConverter
