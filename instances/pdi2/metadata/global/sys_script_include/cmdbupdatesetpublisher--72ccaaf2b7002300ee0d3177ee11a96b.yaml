description: |-
  This Script UpdateSetPublisher is developed as part of "Query Export" functionality
  We are exporting only changed data
  Example: 
  1.  var publisher =  new CMDBUpdateSetPublisher('My Test UpdateSet name'); 
  2.  var publisher = new CMDBUpdateSetPublisher();  // Use the current UpdateSet

  //Pass single table with one or multiple records
  var gr = GlideRecord('qb_saved_query');
  gr.query();
  publisher.publishSingle(gr);
