api_name: global.WorkflowModelManager
caller_access: ''
client_callable: 'false'
description: |-
  The purpose of this Object is to provide a way to query the workflow model, to step backwards and forwards between specified wf_history items and to query the history for activity and transition specific information.

  This first pass provides an interface to support new UI tools being developed to assist in debugging a workflow. 

  To acquire the executed history of the workflow activities:

   var model = new WorkflowModelManager('myContextId');
   var activities = model.getExecutedHistory();

  To output the playback of the workflow use the following:

   var model = new WorkflowModelManager('myContextId');
   model.getExecutedHistory();
   model.playBack();

  At this time, the playBack is required to load the executed transitions. This will also play a role in walking backwards on a model to rollback to a specific activity. This is just iteration one in our sprint

  To see the details of the cached model:

  var model = new WorkflowModelManager('myContextId');
  model.getExecutedHistory();
  model.dump();
