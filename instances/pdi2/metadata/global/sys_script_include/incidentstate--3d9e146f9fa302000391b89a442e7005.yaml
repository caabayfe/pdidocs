api_name: global.IncidentState
caller_access: ''
client_callable: 'true'
description: |-
  Incident state constants, use these constants when determining which incident state to use.

  Example - is the incident in the "Resolved" state:
  var incidentGr = new GlideRecord("incident");
  if (incidentGr.get("[sys_id]") && incidentGr.state == IncidentState.RESOLVED)
      // do something when the incident is resolved

  Example 2 - how to use on the incident form (Load IncidentState into scratchpad)
  var incidentState = JSON.parse(g_scratchpad.incidentState);
  g_form.setValue("state", incidentState.NEW);

  Example 3 - how to use this on the client
  var ga = new GlideAjax("IncidentState");
  ga.addParam("sysparm_name", "getIncidentState");
  ga.getXMLAnswer(function(answer) {
      var incidentState = JSON.parse(answer);
      g_form.setValue("state", incidentState.NEW);
  });
