description: |-
  Base class with functions to generate SEO related information. 
  Contract while extending this class - 
  The return object of generateSEOTags should have same variable names as below.
   All `customSEOTags`should have `custom-tag` attribute to it for clean up during page navigation.
  /********************************************************************************************************
  {
  canonicalURL : 'http://instance.com/sp',
  hrefLangs : [{locale:'fr-ca', href: 'https://instance.com/csp/fr?id=index'}],
  customSEOTags : ['<meta custom-tag=""  property="og:title" content="Service Portal">']
  }
  *********************************************************************************************************/
