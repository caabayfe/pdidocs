api_name: global.Mutex
caller_access: ''
client_callable: 'false'
description: |-
  API to Acquire a database-based, system-wide, named mutex
          & Release the mutex after use

  This is appropriate for a Mutex that protects a resource with a predictable, regular name.
  (cf. SelfCleaningMutex, which is more appropriate for a Mutex that locks an arbitrary resource with an
  'unpredictable' name.)

  Caveats: The mutex is stored system-wide, in the database, so there is a performance 'cost' to using it.
                 therefore do not acquire and release inside a tight loop!
                 The Mutex Name is the "scope" of the mutex, and can be anything appropriate, though there are 
                 conventions in use in some parts of the system, e.g.  the [table name].

  Status of Interface: Evolving, subject to change.

  // Example usage:
  var MY_MUTEX = '<<<--My Mutex Name-->>>';
  ...

  // Easiest, if you have a single function or method that needs to be restricted to one execution at a time:
  // call myFunction(), in "this" scope, with arguments: (myFunctionArgument1, myFunctionArgument2, ...)
  // myFunction can also be an anonymous function defined inline.
  var returnValue = Mutex.enterCriticalSection( MY_MUTEX, this, myFunction, myFunctionArgument1, myFunctionArgument2, ... );

  // Alternate: more complex way, manually create the mutex object:
  var myMutex = new Mutex(MY_MUTEX);

  // optional
  myMutex.setSpinWait(200);     // time to wait between attempts, in ms
  myMutex.setMaxSpins(125); // maximum number of times to try

  // get the mutex, and then enter the critical section
  // use 'finally', to make sure that the mutex is always released.
  if (myMutex.get())
     try {
        // enter critical section
        ...
     }
     finally {
        myMutex.release();
     }
