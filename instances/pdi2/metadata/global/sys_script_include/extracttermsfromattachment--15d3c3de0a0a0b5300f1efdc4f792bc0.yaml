api_name: global.ExtractTermsFromAttachment
caller_access: ''
client_callable: 'false'
description: |-
  Extract terms from an attachment.   Class is called with the ScriptedExtractor object,  SysAttachmentInputStream, the sys_id for the attachment, and the extension for the attachment.

  getTerms method is called to extract the terms from the attachment that should be indexed.  getTerms should just return a string that contains the terms.

  If you would rather deal with a File rather than an inputStream then you can called extractor.getFile() to get the File object containing the attachment.
