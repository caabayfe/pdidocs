api_name: global.CSMTableMapUtilSNC
caller_access: ''
client_callable: 'false'
description: |-
  Customers should not change this class directly
  This class is never called directly.


  API Usage:
   
  -  To find if mapping exists. Can be used to show or hide action button.
   
  //Initialise the map object with Source gliderecord object.
  var map = new CSMTableMapUtil (<source gliderecord object>);

  //Find all mappings (use 'limit' to limit the number of return results)
  //returns boolean
  if(map.findMap([limit])){
  // show or hide button
  }
   
  //Find by CSM Table map sys_id
  //returns boolean
  if(map.findMapByID(<CSM Table map sys_id>)){
  // show or hide button
  }

  //Find by CSM Table map api_name
  //returns boolean
  if(map.findMapByName(<CSM Table map api_name>)){
  // show or hide button
  }
   
  //Find by target table name (In case of multiple maps, highest order is given preference. Also conditions will be evaluated to find the relevant map)
  //use 'limit' to limit the number of return results
  //returns boolean
  if(map.findMapByTarget(<Taget table name>[, limit ])){
  // show or hide button
  }
   
  -  To retrieve target record URL directly. Can be used in Platform UI Action to redirect to the target form with prefilled values as per mapping.
   
  //returns target url array for all matched mappings with  target fieldName and values.
  var map = new CSMTableMapUtil (<source gliderecord object>);
  map.findMapByID(<CSM Table map sys_id>); //or map.findMapByTarget(<Taget table name>);
  var targetURL = map.getTargetURL();
  if(targetURL)
  action.setRedirectURL(targetURL[0]);
   
   
  -  To retrieve the mappings as encoded query. Can be used in Service portal widget to initialise the Form widget.
   
  //returns encoded query array for all matched mappings with  target fieldName and values.
  var map = new CSMTableMapUtil (<source gliderecord object>);
  map.findMapByID(<CSM Table map sys_id>); //or map.findMapByTarget(<Taget table name>);
  var queryStr = map.getTargetQuery();
  if(queryStr){
      data.template = $sp.getWidget('widget-form', { table: 'kb_knowledge', sys_id: '-1', query: queryStr[0]});
  }
   
  -   To retrieve the mappings as JSON object. Can be used in the code to generate custom actions.
   
  //returns JSON array for all matched mappings with  target fieldName and values.
  var map = new CSMTableMapUtil (<source gliderecord object>);
  map.findMapByID(<CSM Table map sys_id>); //or map.findMapByTarget(<Taget table name>);
  var obj = map.getTargetJSON();
  if(obj){
      var data = {};
      data = obj;
      //custom code
  }

  - To add meta data like mapping name, order,  target table in output JSON use
  //returns JSON array for all matched mappings with  target fieldName and values.
  var map = new CSMTableMapUtil (<source gliderecord object>);
  map.findMapByID(<CSM Table map sys_id>); //or map.findMapByTarget(<Taget table name>);
  map.addMetaData();
  var obj = map.getTargetJSON();
  if(obj){
      var data = {};
      data = obj;
      //custom code
  }
   
  -   To retrieve the mappings as GlideRecord object. Can be used in the code to generate custom actions.
   
  //returns single GlideRecord object if there is single mapping, and returns GlideRecord array for multiple mappings with target fieldName and values.
  var map = new CSMTableMapUtil (<source gliderecord object>);
  map.findMapByID(<CSM Table map sys_id>); //or map.findMapByTarget(<Taget table name>);
  var obj = map.getTargetGlideRecord();
  if(obj){
      var sys_id = obj.insert();
      //custom code
  }
   
