api_name: global.SLARepairAJAXProcessor
caller_access: ''
client_callable: 'true'
description: |-
  AJAX Processor endpoint for SLARepairClient

  Structure of request payload
  {
     "repair_action": "recreate",
     "when": "scheduled",
     "table": "task",
     "filter": "sys_idEQf6ed0972bae66af2298daa7515def0",
     "sys_id": ["f6ed0972bae66af2298daa7515def0"],
     "email": ["email.address@domain.com"]
  }

   * repair_action: The repair type you want to perform.  Only 'recreate' available (default: recreate)
   * when: When you want the repair to happen. Either 'now' or 'scheduled' (default: now)
   * table: The table name to use as a repair source
   * filter: A filter to apply for all records to recreate
   * sys_id: A single or array of sys_id to use as the rebuld source
   * email: A single email address or array to notify of completion for scheduled jobs (not used for affectedRecords)

  Structure of response payload
  {
     "request" : { *request which generated this response* },
     "result": {
  	   "count": 300
     },
     "status": {
  	  "code": 200,
  	  info_msg: ["An info message"],
  	  err_msg: ["An error message"],
  	  warn_msg: ["warning message"],
  	  debug_msg: ["debug message"]
     }
  }

    * request: the request made for this response
    * result: the result object for the request.
    * count: the approximate number of records affected
    * status: Status object containing return codes, messages etc.
mobile_callable: 'false'
