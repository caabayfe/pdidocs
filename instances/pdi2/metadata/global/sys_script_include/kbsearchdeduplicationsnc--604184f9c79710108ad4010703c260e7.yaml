api_name: global.KBSearchDeduplicationSNC
caller_access: ''
client_callable: 'false'
description: |-
  [WARNING: Customers should NOT modify this script]

  The purpose of this script include is to provide default behaviours for the KBSearchDeduplication script include.
  To change the behaviour of these methods (or add new methods), Customers should override/add new methods to the KBSearchDeduplication script include.

  If a search happened within 10 seconds of the previous search in that session and if either of the search term starts with other search term than the previous is marked "Not Final".

  Sample usage:

  To process all the search that happened yesterday,
  new global.KnowledgeSearchDeduplication().process();

  For specific day,
  var gd = new GlideDate():
  gd.setValue('2020-03-27'):
  var searchDedupe = new global.KBSearchDeduplication():
  searchDedupe.process(gd):

  Few sessions of a specific day.

  var gd = new GlideDate();
  gd.setValue('2020-03-27');
  var searchDedupe = new global.KnowledgeSearchDeduplication();
  searchDedupe.process(gd, 'session_id=123456ABCDE123456');
