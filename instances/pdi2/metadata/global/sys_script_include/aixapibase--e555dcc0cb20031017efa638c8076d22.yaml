description: Shared base class for AIX read-only server APIs. Subclasses call initialize(tableName, fieldMap) and inherit get / list / exists plus M2M read helpers. DTO keys use verbatim dictionary column names. Never throws — not-found and malformed sys_id yield null (get) or empty/filtered results (list / m2m). Per-row canRead() filtering is intentionally not applied; callers must gate access at a higher layer (REST endpoint ACL + domain-level role check).
