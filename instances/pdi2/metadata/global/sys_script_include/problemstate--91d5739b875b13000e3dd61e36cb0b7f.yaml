api_name: global.ProblemState
caller_access: ''
client_callable: 'true'
description: |-
  Problem State constants, use these constants when determining which Problem State to use.

  Example - is the Problem in the "Resolved" state:
  var problemGr = new GlideRecord("sn_problem_v2_problem");
  if (problemGr.get("[sys_id]") && problemGr.state == ProblemState.RESOLVED)
      // do something when the incident is resolved


  Example 3 - how to use this on the client
  var ga = new GlideAjax("ProblemState");
  ga.addParam("sysparm_name", "getProblemState");
  ga.getXMLAnswer(function(answer) {
      var problemState = JSON.parse(answer);
      g_form.setValue("state", problemState.NEW);
  });
