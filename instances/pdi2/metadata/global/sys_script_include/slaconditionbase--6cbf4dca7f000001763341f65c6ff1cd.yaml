description: |-
  Base class of methods to test a contract_sla's conditions, at key points in the TaskSLA state machine (called from TaskSLAController)

  Extend this class to override specific methods and set the com.snc.sla.default_conditionclass property to use it as the default. 

  this.sla contains the contract_sla GlideRecord and this.task contains the task GlideRecord.
  Use this._conditionMatches(conditionExpression) to evaluate the condition against the task record.

     var localSLACondition = Class.create();
     localSLACondition.prototype = Object.extendsObject(SLAConditionBase, {
     ...
     }

  localSLACondition.attach()
  - if an instance of this SLA should be attached and started
  localSLACondition.pause()
  - if an instance of this SLA should be paused
  localSLACondition.complete()
  - if an instance of this SLA should be marked complete
  localSLACondition.reattach()
  - if an instance of this SLA should be reattached (marked completed, and then a new copy reapplied.)
  localSLACondition.cancel()
  - if an instance of this SLA should be cancelled
