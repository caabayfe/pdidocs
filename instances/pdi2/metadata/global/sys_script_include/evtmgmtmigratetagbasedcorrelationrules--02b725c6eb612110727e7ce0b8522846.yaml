api_name: global.EvtMgmtMigrateTagBasedCorrelationRules
caller_access: ''
client_callable: 'false'
description: |-
  This script changes the value of the "generate_virtual_alerts" column in the  em_alert_correlation_rule table to "true" if the virtual alerts for tag-based groups feature is enabled.
  The logic is one-way, it will not migrate any alert correlation rule with "generate_virtual_alerts"=true to "false" when the virtual alerts for tag-based groups feature becomes disabled.
