api_name: global.IncidentReason
caller_access: ''
client_callable: 'true'
description: |-
  Incident hold_reason constants, use these constants when determining which incident on hold reason to use.

  Example - When the incident is on hold and is "Awaiting Caller"
  var incidentGr = new GlideRecord("incident");
  if (incidentGr.get("[sys_id]") && incidentGr.state == IncidentState.ON_HOLD && incidentGr.hold_reason == IncidentReason.AWAITING_CALLER)
      // do something when the incident is on hold

  Example 2 - how to use on the incident form (Load IncidentReason into scratchpad)
  var incidentReason = JSON.parse(g_scratchpad.incidentReason);
  g_form.setValue("hold_reason", IncidentReason.AWAITING_CALLER);

  Example 3 - how to use this on the client
  var ga = new GlideAjax("IncidentReason");
  ga.addParam("sysparm_name", "IncidentReason");
  ga.getXMLAnswer(function(answer) {
      var IncidentReason = JSON.parse(answer);
      g_form.setValue("hold_reason", IncidentReason.AWAITING_CALLER);
  });
