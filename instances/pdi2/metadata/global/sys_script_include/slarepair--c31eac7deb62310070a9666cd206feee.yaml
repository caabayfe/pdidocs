api_name: global.SLARepair
caller_access: ''
client_callable: 'false'
description: |-
  Provides functions to repair Task SLAs based on a GlideRecord, filter or sys id of records from the contract_sla, task_sla or task tables.

  Each Task SLA identified for repair is removed and then recreated based on the audit history information on the parent Task and the current set of conditions in each SLA definition.
  As a result the repair process can potentially remove Task SLAs that no longer match the attach conditions or create Task SLAs that did not previously exist.

  System properties control how workflow is handled during the recreation of the Task SLAs.
