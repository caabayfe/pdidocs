api_name: global.WorkflowDuration
caller_access: ''
client_callable: 'false'
description: |-
  This class handles calculating the duration (number of seconds) based on the variables of a workflow activity.
  It is an interface between Workflow Timer() and DurationCalculator() 

  Usage:

     var wd = new WorkflowDuration();

     // Set up
     // (optional: specify the starting time)
     wd.setStartDateTime(/* GlideDateTime or Time String */ startDateTime);
     // (optional: specify the workflow's schedule and timezone. 
     //  Only used when schedule_type == 'workflow_schedule' or timezone_type == 'workflow_timezone', respectively) 
     wd.setWorkflow(/* cmn_schedule.sys_id */ schedule, /* String */ timezone);
     // (optional: specify number of seconds to be 'consumed', for a "retroactive" or "future" start.
     //  -ve values indicate future start.)
     wd.setUsedSecs(n);

     // Calculate number of seconds, and the due date
     // based upon the duration specified in the record
     wd.calculate(/* Workflow activity variable GlideRecord */ record);

     // Calculate the time remaining, until the due date
     wd.setEndDateTime(/* GlideDateTime or Time String */ endDateTime);
     wd.setWorkflow(context.schedule, context.timezone);
     wd.calculateTimeLeft(/* Workflow activity variable GlideRecord */ record);

     // add a number of seconds, using the required schedule, to the specified start date
     wd.setStartDateTime(startDateTime);
     wd.setWorkflow(context.schedule, context.timezone);
     wd.addSeconds(/* Workflow activity variable GlideRecord */ record, seconds);

     // Retrieve results
     wd.getSeconds();
     wd.getTotalSeconds();
     wd.getEndDateTime();

     // specify the Workflow activity handler object (used to execute script duration calculations with WFActivityHandler.runScript)
     wd.setActivity(WFActivityHandler);
