api_name: global.ChangeRequestStateModel_emergency
caller_access: ''
client_callable: 'false'
description: |-
  This script include represents the state model for emergency changes. The script include ChangeRequestStateHandler controls the transitioning between states using this model to determine what transitions are allowed.

  The script include 'ChangeRequestStateModelSNC_emergency', which this one extends, contains the implementation for all the 'moving' and 'canMove' functions.

  Model structure using the first property "draft":
      draft - current state the change request is in
      nextState - the state the change request can move to without specifying a state
      authorize - a state the change request can move to when in draft if this.toAuthorize_canMove() returns true
                          - when the change request moves to authorize, this.toAuthorize_moving() is called
      scheduled - works in the exact same way that authorize does
      canceled - works in the exact same way that authorize does

  ChangeRequestStateHandler keeps a mapping of these friendly state names with their respective numeric value:
  STATE_NAMES: {
          "-5": "draft",
          "-4": "assess",
          "-3": "authorize",
          "-2": "scheduled",
          "-1": "implement",
          "0": "review",
          "3": "closed",
          "4": "canceled"
  }
mobile_callable: 'false'
