api_name: global.GetExcelSheetNamesScript
caller_access: ''
client_callable: 'true'
description: |-
  This script is called in the onLoad Client Script "Load sheet names from attachment ". It gets as parameter the sys_id of the data source record, it then uses the GlideSysAttachment API to get the attachments of the data source. Using server scoped GlideExcelPArser API , it is able to get the sheet names
  Finally the script is returning the list of sheetnames and the value of sheet number in the gliderecord.
