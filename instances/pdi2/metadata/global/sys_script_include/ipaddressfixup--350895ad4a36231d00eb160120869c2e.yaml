api_name: global.IPAddressFixup
caller_access: ''
client_callable: 'false'
description: |-
  Grooms the CMDB, ensuring that IP addresses are valid and unique to their containing device CI.

  After a device has been successfully discovered, ensures two things. 
  1. If the CI table is not extended from any tables in "glide.discovery.exclude_ip_sync_classes" property then make sure the IP address field on the base CI is one of the IP addresses on the NICs .
  2. Make sure no other device has the IP address that is on this CI being discovered. If there is, then clear the IP address on the other devices. This functionality is off by default.
mobile_callable: 'false'
