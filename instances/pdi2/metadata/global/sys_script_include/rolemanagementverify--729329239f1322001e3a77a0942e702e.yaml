api_name: global.RoleManagementVerify
caller_access: ''
client_callable: 'false'
description: |-
  A script to verify inherited roles for all users.
  It is recommended to run this script before activating the  com.glide.role_management.inh_count plugin, in order to detect all discrepancies for inherited roles.
  For example, some current inherited roles after re-calculation might be removed, so the customer might need to add them explicitely to the user.

  Usage example from background scripts:
      new RoleManagementVerify().verifyInheritedRoles();

  Also, if needed, inherited roles can be verified for a specific user:
     new RoleManagementVerify().verifyInheritedRolesForUser('47de9c73c61122930033f6521d1bb785',  'itam');
mobile_callable: 'false'
name: RoleManagementVerify
