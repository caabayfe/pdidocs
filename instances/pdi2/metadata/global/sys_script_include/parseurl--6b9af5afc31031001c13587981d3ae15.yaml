description: |-
  This script translates base64 rowId (used in db views) to regular sys_id.
  Will always use the first sys_id encoded in the given rowId.
  added new functionality adding table name, if none given  using svc_ci_assoc for backward compatibility.
  usage:
  //your 64 base sysId need to start with exactly(!!!!!) __ENC__ 
  var ga = new GlideAjax('ParseURL');
  ga.addParam('sysparm_name','parseURL');
  ga.addParam('rowId',rowSysId);
  ga.addParam('table','em_event_group_assoc');
