description: |-
  This utility class walks activities in a workflow and generates either 'full' or 'expected' sequences. 

  Sequences are segements of comma-separated lists of activity IDs.  The segments are separated by a pipe character: |

  If a sequence list ends in a | then it indicates that that sequence list was not completely generated, which happens for overly complicated workfllows.
