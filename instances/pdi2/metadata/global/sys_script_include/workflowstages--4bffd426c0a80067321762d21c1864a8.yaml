description: "Return the list of workflow stages for a Request Item as a choice list.\n\n            NOTE: In Dublin, we delegate to a Java based getChoices()\n\n            To use:\n            var wfs = new WorkflowStages();\n            wfs.setWorkflowVersion(id_of_workflow_version_for_current, id_of_active_context_for_current_or_blank);\n            wfs.getChoices(currentStageValue, answer); // where answer is a ChoiceList\n\n            The creation of the stages list will take into account the 'approval' field if there is one. To ignore the approval field use:\n\n            wfs.ignoreApproval();\n        "
