api_name: global.SLACalculatorNG
caller_access: ''
client_callable: 'false'
description: |-
  The "NG" SLA Calculator is used, by the 2011 SLA Engine, with the SLA and SLA contract plugins to help calculate updates to task_sla records.
  It is also now extended by the older SLACalculator class, as they shared the same overall implementation.

  Use the static methods as convenient entry points:

    // example usage
    var start = gs.daysAgo(-1);
    var end = gs.daysAgo(-30);
    SLACalculatorNG.calculateSLArange(start, end);

    var task_sla = new GlideRecord('task_sla');
    // ... query ...
    SLACalculatorNG.calculateSLA(task_sla);
    // ... update with a specific time value
    SLACalculatorNG.calculateSLA(task_sla, false, task.start_time);

    SLACalculatorNG.calculateAll();
