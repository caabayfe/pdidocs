api_name: global.LifeCycleFieldsAlignmentJobUtil
caller_access: ''
client_callable: 'false'
description: |-
  Run method of this class gets invoked from the JOB to perform one time alignment for lifecycle fields for CI and Asset as part of the process to turn on the live sync between CI and Asset. It perform following three actions.

  Step1: Populate lifecycle values for all assets
  Step2: Copy lifecycle values from asset records to corresponding CI if mismatch
  Step3: Populate lifecycle values for CI without assets
