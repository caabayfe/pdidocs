description: |-
  This script locates Client Scripts, UI Actions, Declarative Actions and UI Policies that update fields where read_only_option=strict_read_only and sets the read_only_option on their dictionary file to 'client_script_modifiable' to ensure the field can continue to be updated by the script.

  var dryRun = true; // Print out affected files without updating

  var strictReadOnlyOption = new StrictReadOnlyOption(dryRun);
  strictReadOnlyOption.setClientScriptModifiableWhereAffected();
