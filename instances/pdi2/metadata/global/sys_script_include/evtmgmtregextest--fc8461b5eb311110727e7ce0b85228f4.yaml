api_name: global.EvtMgmtRegexTest
caller_access: ''
client_callable: 'false'
description: |-
  Utility for testing regex behaviour in Event Management (event processing).

  Pre-processing:  
  If the input text is a JSON object (`{…}`) it is parsed and converted to a
  Java Map string (e.g. {"key":"Sev3"} -> {key=Sev3}).  
  Arrays or plain strings are left unchanged.

  Functions & examples (run in Background Scripts)
  --------------------------------------------------------------------
  var svc = new global.EvtMgmtRegexTest();

  /* 1. Preview backend interpretation */
  var txt = '{"tags":[{"key":"Sev3"}]}';
  gs.info('Processed: ' + svc.getPreprocessedText(txt));
  // {tags=[{key=Sev3}]}

  /* 2. Prerocess the text and validate regex and get capture groups */
  var regex = '.*Sev(\\d).*';
  var groups = svc.processTextAndTestRegex(regex, txt);
  gs.info(JSON.stringify(groups));
  // -> ["3"]

  /* 3. Verbose check (no preprocessing) */
  svc.test(regex, text);
