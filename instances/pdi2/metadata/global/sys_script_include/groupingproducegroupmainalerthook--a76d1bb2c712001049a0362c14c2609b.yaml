description: |-
  In this hook the user can define the custom logic to select the main alert of the group.
  The "groupAlertIDs" parameter is a comma separated string of the alerts in the group.
  The "getMainAlert" method should return the GlideRecord of the alert that should be set as the main alert for the group.
