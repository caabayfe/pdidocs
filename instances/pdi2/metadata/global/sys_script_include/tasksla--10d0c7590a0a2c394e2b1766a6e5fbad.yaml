description: |-
  Model for a task_sla record.
  - Methods to transition the task_sla through its various states.

  // initialises (inserts) a new task_sla GlideRecord, for the given contract_sla and task GlideRecords
  var taskSLA = new TaskSLA(contract_sla, task);

  // alternatively, defer insert of a new task_sla GlideRecord, for the given contract_sla and task GlideRecords
  var taskSLA = new TaskSLA(contract_sla, task, true);
  // and then insert on first setting of state to In Progress
  taskSLA.updateState(TaskSLA.STATE_IN_PROGRESS);

  // creates a TaskSLA object, based upon the given task_sla GlideRecord
  var taskSLA = new TaskSLA(task_sla);

  // creates a TaskSLA object, based upon the given task_sla sys_id
  var taskSLA = new TaskSLA(task_sla_sys_id);



  // change state of TaskSLA object
  taskSLA.updateState(TaskSLA.STATE_IN_PROGRESS);
  taskSLA.updateState(TaskSLA.STATE_PAUSED);
  taskSLA.updateState(TaskSLA.STATE_COMPLETED);
  taskSLA.updateState(TaskSLA.STATE_CANCELLED);


  // return the glide record of the TaskSLA object
  var gr = taskSLA.getGlideRecord();
  // return the state of the TaskSLA object, matching the input states ('In Progress', 'Paused', 'Completed', 'Cancelled': the TaskSLA.STATE_* constants.)
  var state = getCurrentState();

  (makes use of TaskSLAworkflow, SLASchedule, SLATimezone, SLACalculatorNG, DurationCalculator, TableUtils, GSLog, com.glide.util.StopWatch).
