description: "Helper class used to build the UI Policy object that is used to manage client-side UI Policy actions\n\t\t\t\n\t\t\tusage:\n\t\t\tvar builder = new UIPolicyBuilder();\n\t\t\tvar gr = new GlideRecord('sys_ui_policy');\n\t\t\tgr.addQuery(......);\n\t\t\tgr.query();\n\t\t\tbuilder.process(gr);\n\t\t\tbuilder.preEvaluate(current, fieldsOnForm);\n\t\t\tbuilder.updateValues();\n\t\t\tvar uiPolicy = builder.toString();\n\t\t\t\n\t\t\tvar scripts = builder.getScripts();\n\t\t\tfor (var scriptName in scripts) {\n\t\t\tvar scriptText = scripts[scriptName];\n\t\t\t}\n\t\t"
