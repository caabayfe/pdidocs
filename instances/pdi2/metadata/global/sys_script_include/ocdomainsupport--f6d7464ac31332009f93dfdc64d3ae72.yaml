api_name: global.OCDomainSupport
caller_access: ''
client_callable: 'false'
description: |-
  Utility for On Call Schedule Domain support.

  Checks for domain conflicts between child and parent records. For example, cmn_rota_roster is a child of cmn_rota, or, cmn_rota_member is a child of a cmn_rota_roster.

  Introduces new domain behaviour for On Call tables. For example, the cmn_rota_roster table is updated to include the "domain_master" attribute, this will refer to the parent cmn_rota when deriving the domain of the cmn_rota_roster record.
