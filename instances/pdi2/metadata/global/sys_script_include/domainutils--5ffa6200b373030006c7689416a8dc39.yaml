api_name: global.DomainUtils
caller_access: ''
client_callable: 'false'
description: |-
  Utility for the domains functionality.
  Creating a new domain example:
    var du = new global.DomainUtils();
    var sysIdA = du.createDomain('DomA', 'TOP', 'DomA description');
    var sysIdB = du.createDomain('DomB', sysIdA, 'DomB description');

  Notes: 
    - the domain table is expected to have a unique index on the name
   - if a domain with the same name already exists, the Unique Key violation error is reported, and the method return null.
mobile_callable: 'false'
