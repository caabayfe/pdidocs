description: "This collection of static functions is used by Discovery, Runbook, and core automation to decide if\n\t\t\tan ecc_queue business rule should be run (the functions are intended to be called from the 'condition' field\n\t\t\tof the business rule in question). In particular, see usage in the \"Discover - Sensors\" , \"Automation -\n\t\t\tSensors\" and \"IntegrationHub - Sensors\" business rules on the ecc_queue.\n \n This provides a mechanism to ensure that only one\n\t\t\tsensor processor is called by flagging the ecc_queue record in-memory with the 'isProcessing' boolean flag.\n\t\t\tIf you want to extend this framework for a new sensor processor, please set the isProcessed flag and be\n\t\t\taware that whatever sensor processor picks up a job first will be the *only* one to process it.\n\t\t"
