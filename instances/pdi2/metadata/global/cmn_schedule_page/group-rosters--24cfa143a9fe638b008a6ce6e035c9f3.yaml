header_html: |-
  <g:requires name="scripts/moment.min.js" />
  <label id="label_group_list" class="header">${gs.getMessage('Group')}:</label>$[SP]
     <select id="group_list" name="group_list" width="120" onchange="groupChange();" tabindex="1">
        <!-- get the groups that have a roster defined -->
        <g:evaluate>
           var groupIds = [];
           var rotaGR = new GlideRecord('cmn_rota');
           rotaGR.addActiveQuery();
           rotaGR.query();
           while (rotaGR.next())
              groupIds.push(rotaGR.group + '');

           if (groupIds.length > 0) {
              rotaGR = null;
              var groupGR = new GlideRecord('sys_user_group');
              groupGR.addQuery('sys_id', groupIds);
              groupGR.orderBy('name');
              groupGR.query();
           }
        </g:evaluate>
        <j:if test="${groupIds.length == 0}">
           <option value="-1">-- ${gs.getMessage('No groups available')} --</option>
        </j:if>

        <j:if test="${groupIds.length > 0}">
           <j:while test="${groupGR.next()}">
              <g:evaluate var="jvar_group_name" expression="groupGR.name"/>
              <option value="${groupGR.sys_id}">${HTML:jvar_group_name}</option>
           </j:while>
        </j:if>
     </select>

  <!-- Show a message if there is no schedule -->
  <j:if test="${groupIds.length == 0}">
      <script>
          var u_g_form = new GlideForm('',true,true,true,true);
          u_g_form.addInfoMessage('There are no active schedules');
      </script>
  </j:if>

  <!-- get the group associated with the specified rota -->
  <g:evaluate var="jvar_group_id" jelly="true">
     var groupId = "";
     var sysId = jelly.sysparm_sys_id;
     if (sysId) {
        var gr = new GlideRecord("cmn_rota");
        gr.addQuery("schedule", sysId);
        gr.query();
        if (gr.next())
           groupId = gr.group;
     }
     if (groupId == "") {
        var sysparmGroup = jelly.sysparm_group_id;
        if (sysparmGroup)
           groupId = sysparmGroup;
     }
     groupId;
  </g:evaluate>
  <input type="hidden" id="group_id" name="group_id" value="$[jvar_group_id]" />
  <g:evaluate var="jvar_is_read_only_user" jelly="true" >
  	var is_read_only_user = !new OnCallSecurityNG().rotaMgrAny();
  	is_read_only_user;
  </g:evaluate>
  <input type="hidden" id="is_read_only_user" name="is_read_only_user" value="$[jvar_is_read_only_user]" />
init_function: rosterPageInit
name: Group rosters
sys_name: Group rosters
sys_policy: ''
type: roster
view_type: Calendar
