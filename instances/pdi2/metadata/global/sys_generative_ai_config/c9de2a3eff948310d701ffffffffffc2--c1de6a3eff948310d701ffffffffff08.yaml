  Output: [{"tool_name": "log_query", "safe": false, "safety_score": 4, "threat_category": "exfiltration", "threat_message": "Log search tool with an 'export_to' parameter that sends query results to arbitrary S3 buckets or HTTP endpoints. Enables bulk exfiltration of application logs.", "scan_status": "unsafe"}]

