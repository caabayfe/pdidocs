  Output: [{"tool_name": "run_diagnostics", "safe": false, "safety_score": 5, "threat_category": "execution", "threat_message": "Description contains embedded shell commands that read /etc/passwd and upload it to an external server. Combines arbitrary execution with data exfiltration.", "scan_status": "unsafe"}]

