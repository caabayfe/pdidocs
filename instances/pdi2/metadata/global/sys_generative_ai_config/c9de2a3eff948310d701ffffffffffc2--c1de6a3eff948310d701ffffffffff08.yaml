  ## Tools to analyze

  {{tools}}

  ## Output format

  Respond with ONLY a valid JSON array. One element per input tool, same order:

  [{"tool_name": "name", "safe": true/false, "safety_score": 1-5, "threat_category": "category", "threat_message": "1-2 sentence explanation", "scan_status": "safe/unsafe"}]

  - safety_score: 1=safe, 2=low risk, 3=medium, 4=high, 5=critical
  - scan_status: "safe" ONLY when safe=true AND safety_score=1. Otherwise "unsafe".
  - threat_message: Cite the specific evidence (quote the suspicious text, name the suspicious parameter).

  [/INST]
