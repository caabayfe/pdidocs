    padding: 10px;
    text-align: left;
  }

  #captcha_button {
    border: none;
  }
  	    
  .captcha-image {
    border: 1px solid ${$color-gray};
    margin-right: 20px;
  }

  .pwd-title {
  	font-size: 16px;
  	font-weight: bold;
  	display: block;
  	margin-top: 5px;
  	margin-bottom: 12px;
  }

  .pwd-title-new {
  	font-weight: bold;
  	margin-top: 15px;
  	margin-bottom:8px;
  	font-size: 16px;
  	line-height: 22px;
  }

  .lock-message {
  	font-family: SourceSansPro, "Regular";
  	font-size: 14px;
  	line-height: 18px;
  	margin-bottom:15px;
  }

  .pwd-subtitle {
  	font-size: 13px;
  	display: block;
  	margin-bottom: 15px;
  }

  .pwd-section-title {
  	font-size: 16px;
  	font-weight: bold;
  	display: block;
  	margin-top: 5px;
  	margin-bottom: 10px;
  	padding-left: 3px;
  	padding-right: 5px;
  }

  .pwd-section-subtitle {
  	font-size: 13px;
  	display: block;
  	margin-bottom: 20px;
  }

  .pwd-content {
  	border: 1px inset ${$color-gray};
  	line-height: 16px;
  	text-align: left;
  	margin: 5px;
  	padding: 5px;
  	padding-left: 20px ;
