   	border: 0 solid ${$color-gray};
   	display: inline-block;
   	text-align: left;
  }

  .pwd-enroll-section {
   	display: inline-block;
   	padding-bottom: 20px;
   	width: 100%;
  }

  .pwd-bottom-btn-bar {
