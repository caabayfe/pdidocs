  	padding-right:8px;
  }

  .pwd-error-icon {
  	color: ${$color-negative};
  	padding-right: 8px;
  }

  .-polaris .pwd-error-icon {
  	color: RGB(var(--now-color_alert--critical-3, 160, 48, 43));
  }

  .-polaris  .pwd-success-icon {
  	color: RGB(var(--now-color_alert--positive-3, 30, 105, 34));
  }

  .invalid-password:focus {
  	border-color: ${$color-negative};
  	box-shadow: 0 1px 1px rgba(0, 0, 0, 0.075) inset, 0 0 8px ${$color-lightest};
  }

  .valid-password:focus {
  	border-color: ${$color-accent};
  	box-shadow: 0 1px 1px rgba(0, 0, 0, 0.075) inset, 0 0 8px ${$color-accent};
  }

  .strength-bar {
  	margin-top:3px;
  	margin-bottom:0px;
  	border-color:#bdc0c4;
  	width:308px;
          margin-right:5px;
          float:left;
  }

  .pwd-reset-box .outputmsg_error {
  	display: block;
  }

  .pwd-reset-box-new .outputmsg_error {
  	display: block;
  	padding-bottom:15px;
  }

  .pwd-rule {
  	padding-top:8px;
  }

  .pwd-match {
  	display:none;
  	padding-bottom:8px;
  }

  .password-retype {
  	width:100%;
  	padding-top:8px;
  }

  .error-block {
  	margin-top:5px;
