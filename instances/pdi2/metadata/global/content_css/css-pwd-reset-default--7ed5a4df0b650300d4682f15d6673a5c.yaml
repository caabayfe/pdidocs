  counter-increment: none !important;
  counter-reset: none !important;
  align-self: center;
  position: relative;
      top: -1rem;
  &::before {
          display: none !important;
      content: none !important;
      }
  }

  div.login-form h1 {
      text-align: left;
      font-size: var(--now-global-font-size--lg, 24px);
      font-weight: 700;
      margin: revert
  }

  div.login-card {
