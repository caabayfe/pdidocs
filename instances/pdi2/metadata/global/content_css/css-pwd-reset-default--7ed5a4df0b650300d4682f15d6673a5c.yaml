  	width:100%;
  	margin-left:32px;
  	margin-right:32px;
  	margin-bottom:32px;
  }

  .pwd-reset-sub-body-new {
  	width:100%;
  	float:right;
  }

  .pwd-reset-footer-new {
  	max-width: 486px;
  	width: 100%;
  	float:right;
  	margin-bottom:32px;
  	margin-right: 32px;
  }

  .pwd-cross-icon {
  	padding-right:8px;
  }

  .pwd-success-icon {
