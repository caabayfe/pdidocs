  }

  .pwd-additional-info {
  	margin-top: 10px;
  	/*display: inline-block;*/
  }

  .pwd-request-reference {
  	font-size: 130%;
  	font-weight: bold;
  	padding-left: 5px;
  }

  #new_password {
  	background-color:${$color-lighter};
  	border-style:groove;
  	font-size: 24px;
  	width:200px;
  	margin-left: auto;
  	margin-right: auto;
  }

  .-polaris #new_password {
  	background-color: RGB(var(--now-color_background--tertiary, var(--now-color--neutral-2, 228, 230, 231)));
  }

  .pwd-enroll-box {
