name: css_pwd_reset_default
style: |-
  .pwd-reset-box  {
    margin-top: 5%;
    overflow: auto;
    width: 100%;
    max-width: 600px;
    -webkit-overflow-scrolling: touch;
    border: 1px solid ${$color-gray};
    display: inline-block;
    padding: 15px;
    text-align: start;
  }
      
  .pwd-form-control {
  	border: 1px solid #757575;
  }

  .pwd-reset-mask-button {
  	min-width: 30px;
  	margin-top: auto;
          border-color: #757575;
  }

  .pwd-reset-box-new {
  	margin-top: 5%;
  	overflow: auto;
  	width: 100%;
  	max-width: 550px;
  	-webkit-overflow-scrolling: touch;
  	border: 1px solid #DAD9DA;
  	display: inline-block;
  	text-align: left;
  }

  .pwd-reset-header-new {
