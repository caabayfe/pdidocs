name: Knowledge My Knowledge Styles
style: |-
  table.my-knowledge {
  	width: 100%;
  }

  .my-knowledge td {
  	vertical-align: top;
  }

  .my-knowledge .contents {
  	width: 100%;
  }

  .showmore {
  	text-align: center !important;
  	margin-top: 10px;
  	margin-bottom: 5px;
  }

  .showmore .loading {
  	padding-bottom: 10px;
  }

  .my-knowledge-link {
  	color: #5d92f9 !important;
  	cursor: pointer;
  }

  .my-knowledge-link:hover {
  	color: #5d92f9 !important;
  	text-decoration: none;
  }

  .heading_colour {
  	color: #485563;
  	font-size: 17px;
  }

  .sub_heading_colour {
  	color: #485563;
  }

  .header {
  	border-bottom: 1px solid #E6E8EA;
  	background-color: #E6E8EA;
  	height: 36px;
  }

  .my-knowledge-cell {
  	padding: 4px 6px 4px 6px;
  	vertical-align: top;
  }

  .nowrap {
  	white-space: nowrap;
  }

  .expand {
  	width: 100%;
  }

  .shrink {
  	width: 10px;
  }

  /* For doctype header */
  .navbar {
  	margin: 0px 0px 5px 0px !important;
  }

  /* For non-doctype header */
  .kb-header-container .kb-header {
  	background-color: #e6e8ea;
  	width: 100%;
  	height: 50px;
  }

  .kb-header-container .btn {
  	padding: 0px 5px 0px 5px;
  }

  .kb-header-container .form_header {
  	font-size: 115%;
  	color: #000000;
  }

  .kb-header-container .kb-add-content {
  	text-align: right;
  	padding-top: 5px;
  }

  .no-content {
  	width: 300px;
  	height: 100px;
  	text-align: left;
  	font-weight: bold;
  }
sys_name: Knowledge My Knowledge Styles
