name: kb_categorize_styles
style: |-
  html, body {
  	margin: 0 !important;
  	padding: 0 !important;
  	height: 100%;
  }

  html, body, .fill {
  	min-height: 100% !important;
  }

  .fill, .fill2 {
  	height: 100%;
  	padding: 0;
  }

  .kb-picker {
  	height: -moz-calc(100% - 122px);
  	height: -webkit-calc(100% - 122px);
  	height: -o-calc(100% - 122px);
  	height: calc(100% - 122px);
  	padding: 50px 0px 20px 0px;
  }

  .kb-col-wrapper {
  	height: 100%;
  	padding-left: 0;
  	padding-right: 0;
  }

  .kb-col {
  	overflow-y: auto;
  	padding: 0;
  	border: 1px solid transparent;
  	border-color: #e7e7e7;
  }

  @media ( max-width : 549px) {
  .fill {
  		height: auto;
  	}
  .kb-col {
  		height: auto;
  		min-height: 100px;
  		overflow-y: visible;
  	}
  .kb-col-wrapper,.kb-col-wrapper.first,.kb-col-wrapper.last {
  		padding-left: 0;
  		padding-right: 0;
  	}
  .kb-col-wrapper.last {
  		margin-top: 20px;
  	}
  }

  @media ( min-width : 550px) {
  #next-wrapper {
  		float: right;
  	}
  .kb-col-wrapper.first {
  		padding-left: 0;
  		padding-right: 20px;
  	}
  .kb-col-wrapper.last {
  		padding-right: 0;
  		padding-left: 20px;
  	}
  }

  .kb-col .kb-elem {
  	padding: 6px 20px;
  	overflow: auto;
  	cursor: pointer;
  	-webkit-overflow-scrolling: touch;
  }

  .kb-col .kb-elem>* {
  	overflow: hidden;
  }

  .kb-col .kb-elem.selected {
  	background-color: #F0F0F0;
  }

  .kb-col .kb-elem:hover {
  	background-color: #C7C7C7;
  	color: #5E5E5E;
  }

  .kb-col .kb-elem.hover {
  	background-color: #C7C7C7;
  	color: #5E5E5E;
  }

  .kb-col .kb-elem .kb-icon {
  	float: left;
  	width: 50px;
  	height: 50px;
  	border-radius: 50%;
  	-webkit-border-radius: 50%;
  	-moz-border-radius: 50%;
  	background-repeat: no-repeat;
  	background-size: 40px;
  	background-position: center;
  }

  .kb-col .kb-elem .kb-name {
  	margin-top: 15px;
  	white-space: nowrap;
  }

  .kb-col .kb-elem .kb-descriptor {
  	margin-top: 10px;
  }

  .kb-action-bar {
  	background-color: #f8f8f8;
  	border: 1px solid transparent;
  	margin: 0;
  	padding: 6px 10px;
  	height: auto !important;
  	height: 45px;
  	min-height: 45px;
  }

  .kb-action-bar .kb-left {
  	float: left;
  	margin-left: 5px;
  }

  .kb-action-bar .right,.kb-action-bar .right>* {
  	float: right;
  	margin-right: 5px;
  }

  .kb-action-bar>#back {
  	margin-top: 0;
  	margin-bottom: 0;
  }


  .kb-action-bar#kb-action-bar-bottom .left {
  	width: 80%;
  }
  .msie7.kb-action-bar#kb-action-bar-bottom .left ,
  .msie8.kb-action-bar#kb-action-bar-bottom .left {
  	filter: none !important;
  	-ms-filter: none !important;
  }

  .kb-action-bar#kb-action-bar-bottom {
  	margin-top: 26px;
  }

  /*  Following styles apply to IE7/8 only as Jelly does a IE check  */
  .kb-categorize-form-header {
  	overflow: hidden;
  	position: absolute;
  	top: 0px;
  	left: 0px;
  	height: 50px !important;
  	width: 100% !important;
  	padding-top: 8px;
  	padding-left: 20px;
  	background: #e6e6e6;
  	border-bottom: 1px solid #bdc0c4;
  }
  .kb-categorize-form-header * {
  	display: inline;
  }
  .kb-categorize-form-header h4 {
  	margin-left: 20px;
  }
  .kb-categorize-form-header .btn-default {
  	background-color: rgb(230, 232, 234);
  }
  .kb-categorize-form-header .kb-right-no-texture {
  	position: absolute;
  	top: 6px;
  	right: 20px;
  }
