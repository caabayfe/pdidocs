name: nextAvailableTimeModal
style: |-
  @media all and (max-width: 898px) { /* When visible area is narrower than the modal, force h-scrollbar */
  	.modal-open .modal.in {
  		overflow-x: scroll;
  	}
  }
  @media not all and (min-resolution:.001dpcm) { @supports (-webkit-appearance:none) { /* Safari only */
  	#cnat *:focus { /* focus on all elements in the modal */
  		outline: 3px solid ${$color-accent} !important;
  		box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075), 0 0 8px ${$color-accent};
  	}
  	.-polaris #cnat *:focus { /* focus on all elements in the modal */
  		outline: 0 !important;
  		box-shadow: inset 0 0 0 2px RGB(var(--now-color_focus-ring,var(--now-color--secondary-1,1,119,142))),inset 0 0 0 3px RGB(var(--now-color_focus-ring_shadow,var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255))));
  	}
  }}
  .modal-dialog.modal-lg {
  	min-width: 898px;
  	max-width: 898px;
  }
  /** MINICALENDAR **/
  .bootstrap-datetimepicker-widget td.today:before {
  	border-bottom-color: ${$color-accent} !important;
  }
  .-polaris .bootstrap-datetimepicker-widget td.today:before {
  	border-bottom-color: RGB(var(--now-color_border--primary, var(--now-color--neutral-7, 135, 147, 148))) !important;
  }
  .bootstrap-datetimepicker-widget td.active,
  .bootstrap-datetimepicker-widget td.active:hover,
  .bootstrap-datetimepicker-widget td span.active {
  	background-color: ${$color-accent} !important;
  }

  .-polaris .cnat-today::after,
  .-polaris .bootstrap-datetimepicker-widget td.active,
  .-polaris .bootstrap-datetimepicker-widget td.active:hover,
  .-polaris .bootstrap-datetimepicker-widget td span.active {
  	background-color: RGB(var(--now-color_background--tertiary-actionable, var(--now-color--neutral-12, 66, 80, 81))) !important;
  }
  .bootstrap-datetimepicker-widget *:focus {
  	outline: thin dotted;
  	outline: 3px solid ${$color-accent}; /* IE */
  	outline: 5px auto ${$color-accent}; /* Webkit */
  	outline-offset: -2px;
  }
  .-polaris .bootstrap-datetimepicker-widget *:focus {
  	box-shadow: inset 0 0 0 2px RGB(var(--now-color_focus-ring,var(--now-color--secondary-1,1,119,142))),inset 0 0 0 3px RGB(var(--now-color_focus-ring_shadow,var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255))));
  	outline: 0;
  }
  @-moz-document url-prefix() { /* FF */
  	.bootstrap-datetimepicker-widget *:focus {
  		outline: 2px solid ${$color-accent} !important;
  		box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.075), 0 0 8px ${$color-accent};
  	}
  	.-polaris .bootstrap-datetimepicker-widget *:focus {
  		box-shadow: inset 0 0 0 2px RGB(var(--now-color_focus-ring,var(--now-color--secondary-1,1,119,142))),inset 0 0 0 3px RGB(var(--now-color_focus-ring_shadow,var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255))));
  		outline: 0 !important;;
  	}
  }
  @media not all and (min-resolution:.001dpcm) { @supports (-webkit-appearance:none) { /* Safari only */
  	.bootstrap-datetimepicker-widget *:focus {
  		outline: 2px solid ${$color-accent} !important;
  		box-shadow: inset 0 2px 2px rgba(0, 0, 0, 0.075), 0 0 8px ${$color-accent};
  	}
  	.-polaris .bootstrap-datetimepicker-widget *:focus {
  		box-shadow: inset 0 0 0 2px RGB(var(--now-color_focus-ring,var(--now-color--secondary-1,1,119,142))),inset 0 0 0 3px RGB(var(--now-color_focus-ring_shadow,var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255))));
  		outline: 0 !important;
  	}

  }}

  /** CONTAINER **/
  #cnat-empty.cnat-modal {
  	display: flex;
  	flex-direction: column;
  	height: 100%;
  }

  #cnat {
  	height: 100%;
  }

  #cnat-searching {
  	display: flex;
  	flex-direction: column;
  	height: 100%;
  }

  /** HEADER **/
  header.modal-header.cnat-loading-modal-header h4,
  header.modal-header.cnat-empty-modal-header h4 {
  	font-size: 18px;
  	letter-spacing: -0.28px;
  	line-height: 23px;
  	color: ${$color-darkest};
  	margin-top: 0;
  }
  .-polaris header.modal-header.cnat-loading-modal-header h4,
  .-polaris header.modal-header.cnat-empty-modal-header h4 {
  	color: RGB(var(--now-color_text--primary, var(--now-color--neutral-18, 22, 27, 28)));
  }
  header.modal-header.cnat-loading-modal-header,
  header.modal-header.cnat-empty-modal-header {
  	padding-bottom: 0;
  	border-bottom: none;
  }
  header.cnat-modal-header {
  	display: flex;
  	align-items: center;
  	justify-content: space-between;
  	padding: 14px 11px 14px 11px;
  }
  header .cnat-header-left {
  	display: flex;
  }
  header .cnat-header-center,

  header .cnat-header-right {
  	justify-content: flex-end;
  }
  header .icon-loading.icon-lg,
  header .loading-indicator {
  	align-self: center;
  	font-size: 23px;
  	width: unset;
  	height: unset;
  }
  header .btn-icon.close.cnat-modal-close {
  	margin-top: unset;
  	font-size: 21px;
  }
  header .cnat-vcr {
  	margin: 0 10px 0 10px;
  }
  header .cnat-vcr .btn.btn-default {
  	margin-left: 0px;
  	border-radius: 0;
  }
  .btn.button_nav_calendar {
  	padding-left: 18px;
  	padding-right: 18px;
  }
  header .cnat-vcr #cnat_prev_icon {
  	border-radius: 3px 0 0 3px;
  	border-right: 0px;
  }
  header .cnat-vcr #cnat_next_icon {
  	border-radius: 0 3px 3px 0;
  	margin-left: -1px;
  }
  header .bootstrap-datetimepicker-widget th.next,
  header .bootstrap-datetimepicker-widget th.prev {
  	font-size: 12px;
  }
  /** END HEADER **/

  /** BODY **/
  HTML[data-doctype=true] .icon-loading.icon-lg {
  	font-size: 2rem;
  	width: 2rem;
  	height: 2rem;
  	color: ${$color-darkest}
  }
  HTML[data-doctype=true] .-polaris .icon-loading.icon-lg {
  	color: RGB(var(--now-loader_icon--color,var(--now-color--primary-1,30,133,109)));
  }
  div.modal-body.cnat-loading-modal-body,
  .cnat-empty-modal-body {
  	flex:  1;
  	display: flex;
  	justify-content: center;
  	height: 140px;
  	padding: 11px 11px 11px 11px;
  }
  .cnat-message-body {
  	display: block;
  	overflow-y: auto;
  }
  .cnat-empty-modal-body {
  	min-height: 140px;
  }
  .cnat-empty-modal-body p {
  	font-size: 16px;
  	line-height: 20px;
  	letter-spacing: -0.25px;
  }
  .modal-body.cnat-modal-body {
  	padding: 0px;
  	height: 414px;
  	max-height: 414px;
  	overflow-y: hidden;
  }
  .cnat-loading-modal-body .loading-indicator {
  	align-self: center;
  }
  .cnat-crossover-wrapper {
  	border-bottom: 1px solid ${$color-lighter};
  	z-index: 1;
  	padding-bottom: 5px;
  }
  .-polaris .cnat-crossover-wrapper {
  	border-bottom: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 209, 214, 214)));
  }
  .cnat-content-wrapper {
  	display: flex;
  	flex-flow: column;
  	height: 100%;
  	z-index: 1;
  	position: relative;
  }
  .cnat-slots-wrapper {
  	overflow-y: overlay;
  	background-color: transparent;
  	overflow-x: hidden;
  	padding-top: 5px;
  	min-width: 595px;
  }
  .cnat-empty-column,
  .cnat-date:not(.cnat-date-filler) {
  	background-color: ${$color-lightest};
  	border: 1px solid ${$color-light};
  	margin: 5px 10px 5px 10px;
  	padding: 4px;
  	border-radius: 3px;
  	text-align: center;
  	display: flex;
  	flex-direction: column;
  	justify-content: center;
  	align-items: center;
  }
  .-polaris .cnat-date:not(.cnat-date-filler) {
  	background-color: RGB(var(--now-color_background--primary, var(--now-color--neutral-0, 255, 255, 255)));
  	border: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 209, 214, 214)));
  }
  .cnat-date:not(.cnat-date-filler) {
  	cursor: pointer;
  }
  .cnat-date:not(.cnat-date-filler).cnat-start-of-week {
  	border-left: 0px;
  	margin-left: 0px;
  	padding: 4px 4px 4px 0px;
  	border-top-left-radius: 0px;
  	border-bottom-left-radius: 0px;
  }
  .cnat-start-of-week-arrow,
  .cnat-end-of-week-arrow {
  	position: absolute;
  	margin: 3px 10px 3px 10px;
  	font-size: 9px;
  	color: ${$color-light};
  }
  .cnat-date:not(.cnat-date-filler).cnat-end-of-week {
  	border-right: 0px;
  	margin-right: 0px;
  	padding: 4px 0px 4px 4px;
  	border-top-right-radius: 0px;
  	border-bottom-right-radius: 0px;
  }
  .cnat-date.cnat-date-filler {
  	background-color: unset;
  }
  .cnat-filler {
  	position: absolute;
  	top: 0px;
  	height: 100%;
  	width: 100%;
  	z-index: 0;
  }
  .cnat-day-dow {
  	padding: 5px 3px 0 3px;
  	font-weight: normal;
  	text-align: center;
  	word-spacing: 10px;
  	flex: 1;
  }
  .cnat-day {
  	align-self: end;
  	font-weight: bold;
  	-ms-grid-row-align: end;
  }
  .cnat-today {
  	position: relative;
  }
  .cnat-today::after {
  	content: "";
  	width: 100%;
  	height: 100%;
  	position: absolute;
  	left: 0;
  	top: 0;
  	z-index: 0;
  	background-color: ${$color-accent};
  	opacity: 0.1;
  }

  .col-divider {
  	border-right: 1px solid ${$color-lighter};
  }
  .-polaris .col-divider {
  	border-right: 1px solid RGB(var(--now-color_background--tertiary, var(--now-color--neutral-2, 228, 230, 231)));
  }
  .cnat-column-header {
  	font-size: 15px;
  }
  .cnat-column-background {
  	font-size: 13px;
  }
  .cnat-filler,
  .cnat-content,
  .cnat-row {
  	display: grid;
  	display: -ms-grid;
  	grid-template-columns: repeat(7, 1fr);
  	-ms-grid-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
  	-ms-grid-rows: 100%;
  }
  .cnat-column {
  	display: flex;
  	align-items: center;
  	z-index: 1000;
  }
  .cnat-empty-column {
  	color: ${$color-light};
  	border: none;
  	margin: 6px 10px 5px 10px;
  	background-color: transparent;
  }
  .-polaris .cnat-empty-column {
  	color: RGB(var(--now-color_text--tertiary, var(--now-color--neutral-12, 66, 80, 81)));
  }
  .cnat-column-background {
  	padding-left: 10px;
  	display: grid;
  	grid-template-rows: 26px auto;
  	display: -ms-grid;
  	-ms-grid-rows: 26px auto;
  }
  .cnat-slot {
  	z-index: 1000;
  }
  .cnat-date:focus,
  .cnat-date.cnat-selected {
  	color: ${$color-darkest};
  	background-color: ${$color-lightest};
  	border-color: ${$color-accent};
  	border-radius: 4px;
  	box-shadow: inset 0 1px 3px 0 rgba(0,0,0,0.75), 0 0 8px 0 ${$color-accent};
  }
  .-polaris .cnat-date:focus,
  .-polaris .cnat-date.cnat-selected {
  	color: RGB(var(--now-color_text--primary, var(--now-color--neutral-18, 22, 27, 28)));
  	background-color: RGB(var(--now-color_background--primary, var(--now-color--neutral-0, 255, 255, 255)));
  	box-shadow: inset 0 0 0 2px RGB(var(--now-color_focus-ring,var(--now-color--secondary-1,1,119,142))),inset 0 0 0 3px RGB(var(--now-color_focus-ring_shadow,var(--now-color_background--primary,var(--now-color--neutral-0,255,255,255))));
   	outline: 0;

  }
  .cnat-column,
  .cnat-column-background,
  .cnat-no-slots  {
  	min-width: 85px;
  }
  /** END BODY **/

  /** SCROLLBAR **/
  .modal-content ::-webkit-scrollbar {
  	width: 9px;
  }
  /* Track */
  .modal-content ::-webkit-scrollbar-track {
  	background: white;
  	border: 4px solid transparent;
  	background-clip: content-box;
  }
  /* Handle */
  .modal-content ::-webkit-scrollbar-thumb {
  	background: #DDDDDD;
  	border: 1px solid white;
  	border-radius: 10px;
  }
  /** END SCROLLBAR **/

  /** MINICAL **/
  .modal-header .cnat-header-left .btn {
  	margin-left: unset;
  }
  .cnat-minical-wrapper {
  	z-index: 1001;
  }
  /** END MINICAL **/

  /** FOOTER **/
  #cnat .cnat-modal-footer {
  	display: flex;
  	align-items: center;
  	padding: 16px 11px 16px 11px;
  	border-top: 1px solid ${$color-lighter};
  }
  .-polaris #cnat .cnat-modal-footer {
  	border-top: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 209, 214, 214)));
  }
  #cnat .cnat-modal-footer .cnat-buttons-footer {
  	margin-left: auto;
  }
  #cnat .cnat-modal-footer .cnat-timezone {
  	font-size: 17px;
  }
  #cnat .cnat-modal-footer .cnat-buttons-footer .btn-default {
  	margin-left: 5px;
  	margin-right: 5px;
  }
  #cnat .modal-footer.cnat-loading-modal-footer,
  #cnat .modal-footer.cnat-empty-modal-footer {
  	display: flex;
  	justify-content: center;
  	padding: 0 8px 11px 8px;
  }
  #cnat .cnat-loading-modal-footer .btn-cnat-cancel,
  #cnat .cnat-empty-modal-footer .btn-cnat-cancel,
  #cnat .cnat-empty-modal-footer .btn-cnat-search {
  	flex: 1 100%;
  	margin: 0 3px 10px 3px ;
  }
  /** END FOOTER **/

  /** IE11 **/
  .cnat-col-1 {
  	-ms-grid-column: 1;
  }
  .cnat-col-2 {
  	-ms-grid-column: 2;
  }
  .cnat-col-3 {
  	-ms-grid-column: 3;
  }
  .cnat-col-4 {
  	-ms-grid-column: 4;
  }
  .cnat-col-5 {
  	-ms-grid-column: 5;
  }
  .cnat-col-6 {
  	-ms-grid-column: 6;
  }
  .cnat-col-7 {
  	-ms-grid-column: 7;
  }

  /** EXCEPT FOR CHROME, ALL BROWSERS NEED TO ADJUST WHEN THERE'S A SCROLLBAR **/
  /** Safari 10.1+ only **/
  @media not all and (min-resolution:.001dpcm) { @supports (-webkit-appearance:none) {
  	.cnat-scrollbar .cnat-row { margin-right: -9px; } // Safari has narrower scrollbars
  }}
  /** Firefox only **/
  @-moz-document url-prefix() {
  	.cnat-scrollbar .cnat-row { margin-right: -14px; }
  }
  /** IE only **/
  @media screen and (-ms-high-contrast: active), (-ms-high-contrast: none) {
  	.cnat-scrollbar .cnat-row { margin-right: -14px; }
  }

  /** Workaround when both sections of the modal are shown at the same time**/
  .ng-hide.ng-hide-animate,
  .ng-hide-add.ng-hide-animate {
  	display: none !important;
  }
sys_name: nextAvailableTimeModal
