name: Service Creation
style: |-
  * {
       box-sizing: border-box;
  }
   body {
       font-family: SourceSansPro, "Helvetica Neue", Arial;
       font-size: 13px;
       line-height: 1.2;
  }
   h1, .h1 {
       display:inline-block;
  }
   h2, .h2 {
       font-size: 15px;
  }
   h3, .h3 {
       font: 15px "SourceSansProSemibold", "Helvetica Neue", "Helvetica", Arial, sans-serif;
  }
   p {
       font-size: 12px;
       word-wrap: break-word;
  }
  /* Float four columns side by side */
   .column {
       float: left;
       width: 25%;
       padding: 0 10px;
  }
  /* Remove extra left and right margins, due to padding in columns */
   .row {
       margin: 0 -5px;
  }
  /* Clear floats after the columns */
   .row:after {
       content: "";
       display: table;
       clear: both;
  }
  /* Responsive columns - one column layout (vertical) on small screens */
   @media screen and (max-width: 600px) {
       .column {
           width: 100%;
           display: block;
           margin-bottom: 20px;
      }
  }
   .service-creation-list-content {
       -webkit-tap-highlight-color: transparent;
       font-family: SourceSansPro, "Helvetica Neue", Arial;
       font-size: 13px;
       line-height: 1.2;
       box-sizing: border-box;
       display: block;
       position: relative;
       min-height: 1px;
       float: left;
       width: 100%;
       flex: 1 1 auto;
       padding: 18px;
       overflow-y: auto;
  }
   h3, .h3 {
       font: 15px "SourceSansProSemibold", "Helvetica Neue", "Helvetica", Arial, sans-serif;
  }
   p {
       font-size: 12px;
       word-wrap: break-word;
  }
   .card:hover {
       background-color: #f7f7f7;
       cursor: pointer;
  }
   .card {
       border: 1px solid #cbcbcb;
       border-radius: 3px;
       padding: 0px 16px 16px;
  }
   .card-title {
       font: 15px "SourceSansProSemibold", "Helvetica Neue", "Helvetica", Arial, sans-serif;
       line-height: 1.1;
       color: #2e2e2e;
       box-sizing: border-box;
  }
   .-polaris .card-title {
       color:RGB(var(--now-color_text--primary, var(--now-color--neutral-18, 22, 27, 28)));
  }
   .-polaris .card:hover {
       background-color:RGB(var(--now-color_background--secondary, var(--now-color--neutral-1, 246, 247, 247)));
  }
   .-polaris .card {
       border-color:RGB(var(--now-color_border--primary, var(--now-color--neutral-7, 135, 147, 148)));
  }
