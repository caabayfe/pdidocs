name: oc_shifts_timeline
style: |-
  .oc-escalation-wrapper {
     margin-top: 10px;
  }
  #rosters-modal { 
      overflow: hidden; 
  }
  #oc-esc-timeline .oc-esc-path-loading, .oc-user-preference-loading {
      width: 100%;
      height: 200px;
      text-align: center;
      padding-top: 100px;
  }
  #oc-esc-timeline .oc-esc-path-loading .icon-loading, .oc-user-preference-loading .icon-loading{
      font-size: 3rem;
      width: 3rem;
      height: 3rem;
  }
  .oc-esc-no-escalatee {
       display: block;
       margin-top: 50%;
       text-align: center;
  }
  .oc-per-level-details {
      position: relative;
      padding: 10px 10px;
  }
  .oc-esc-tl-level {
      padding-top: 8px;
      text-align: center;
      font-weight: bold;
  }
  .oc-esc-tl-data {
      position: relative;
      z-index: 5;
  }
  .oc-esc-tl-data:focus {
      outline: none;
  }
  .oc-esc-tl-icon {
      width: 32px;
      height: 32px;
      background-color:  ${$color-lighter};
      border-radius: 50%;
      display: inline-block;
      vertical-align: top;
  }
  .oc-esc-tl-roster {
      padding-left: 10px;
      display: inline-block;
  }
  .oc-esc-tl-user-name-truncate {
      width: 230px;
      display: inline-block;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
  }
  .oc-tl-vert-bar {
      position: absolute;
      width: 1px;
      background-color: ${$color-dark};
      height: 100%;
      left: 106px;
      z-index: 2;
  }
  .oc-esc-notif-wrapper {
      margin-top: 25px;
  }
  .oc-esc-notif-row {
      padding-bottom: 7px;
      display: flex;
      justify-content: space-between;
  }
  .oc-tab-content-hide {
      display: none;
  }
  .sn-oc-shift-members-avatar {
      margin-right: 10px;
      padding: 5px 0;
  }
  .sn-oc-shift-members-avatar.active {
      border-bottom: 3px solid ${$color-accent};
  }
  .sn-oc-member-avatar {
      width: 32px;
      height: 32px;
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      text-align: center;
      background-size: cover;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.15) center;
  }
  .sn-avatar-container {
      width: 100%;
      height: 100%;
      border-radius: 0;
      line-height: 3.2rem;
      font-size: 2rem;
  }
  .sn-oc-member-avatar .sn-avatar-image {
      top: 0;
      left: 0;
      position: absolute;
      height: 100%;
      width: 100%;
      background-position: 50%;
      background-size: cover;
      border-radius: 100%;
      overflow: hidden;
      display: block;
  }
  .oc-headings.oc-avatars-container {
      border-top: none;
  }
  .oc-esc-tl-user {
      z-index: 2;
      position: relative;
  }
  .oc-level-delay:hover {
      cursor: pointer;
  }
  .oc-esc-tl-user span:focus, .oc-level-delay {
      color: ${$color-accent};
  }
  .oc-view-esc-path {
      margin-top: 25px;
      margin-left: 15px;
      font-size: 13px;
      color: ${$color-accent};
      cursor: pointer;
  }
  .oc-esc-path {
      border-bottom: 1px solid ${$color-light};
  }
  .oc-wb-view-esc-path {
      float: right;
      cursor: pointer;
      color: ${$color-accent};
  }
  .oc-esc-path-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
  }
  .oc-esc-path-left {
      display: flex;
      align-items: flex-start;
  }
  #page_timing_div {
     display: none;
  }
  .oc-modal-header-row {
      display: flex;
  }
  .oc-modal-header-row .sn-navhub {
      width: 100%;
      height: 48px;
      border-top: 1px solid ${$color-light};
      border-bottom: 1px solid ${$color-light};
  }
  .oc-esc-path-row:focus {
      outline: none;
      background-color: ${$color-blue-lighter};
  }
  .oc-modal-msg-rota {
      cursor: pointer;
      margin-left: 5px;
  }
  .oc-profile-avatar-container {
      cursor: pointer;
  }
  .oc-level-members-wrapper {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 46px;
  }
  .oc-shift-esc-wrapper  {
      border-right: 1px solid ${$color-light};
  }
  .profile-avatar-icon {
      width: 140px;
      height: 140px;
      text-align: center;
      font-size: 64px;
      padding-top: 40px;
  }
  li.oc-profile-esc-msg {
      margin-top: 25px;
      border: 1px solid transparent;
  }
  .oc-device-details {
      font-size: 15px;
  }
  img.pref-teams-icon {
      margin-top: -7px;
      margin-left: -10px;
  }
  span.oc-preference-type.pref-type{
      padding-left: 0;
  }
  .oc-profile-description {
      text-align: center;
      padding: 20px 40px;
  }
  .oc-mgr-avatar-detail {
      display: flex;
  }
  .oc-profile-manager {
      margin-left: 10px;
  }
  .oc-manager-name {
      font-weight: bold;
      font-size: 15px;
  }
  .oc-device-name {
      font-size: 25px;
      text-align: center;
      margin-bottom: 40px;
  }
  .modal-header-right {
      float: right;
  }
  .modal-header .oc-esc-path-prev, .modal-header .oc-esc-path-next {
      margin-left: 0;
  }
  .oc-esc-path-next-prev {
      display: inline-block;
      margin-top: -4px;
  }
  .next-prev-btn-border {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
  }
  .oc-user-profile-container {
      padding-top: 10px;
      overflow-x: hidden;
  }
  .oc-modal-rota-span {
      margin-top: -5px;
      margin-left: 5px;
  }
  .oc-modal-rota-name, .oc-modal-rota-time, .oc-modal-dot-separator, .oc-modal-rota-span {
      display: inline-block;
      vertical-align: middle;
  }
  .oc-modal-dot-separator {
      font-size: 7px;
      padding: 0 5px;
  }
  .oc-modal-title-truncate {
      display: inline-block;
      width: 650px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
  }
  .oc-modal-icon-history {
      position: absolute;
      left: 10px;
      background-color: ${$color-lightest};
  }
  .oc-reminder-icon-spacing {
      padding-right: 5px;
  }
  .oc-level-time-delayed {
      display: inline-block;
      vertical-align: top;
      margin-top: 10px;
      margin-right: 10px;
      width: 65px;
      text-align: right;
      color: ${$color-dark};
  }
  .oc-esc-data-container {
      display: inline-block;
      min-height: 80px;
  }
  .oc-vertical-middle {
      display: inline-block;
      vertical-align: middle;
  }
  HTML[data-doctype=true] body[data-formName="ui_page_render"] {
      padding: 0;
  }
  .modal-title {
      padding-left: 5px;
  }
  .oc-no-esc-steps {
      height: 100px;
      line-height: 100px;
      text-align: center;
  }
  .icon-history, .oc-esc-tl-roster-name, .oc-esc-notif-info {
      color: ${$color-dark}
  }
  .oc-timeline-end {
      margin-top: 10px;
      font-weight: bold;
      padding-right: 10px;
  }
  .oc-profile-header {
      color: ${$color-darkest};
  }
  .oc-user-roster-container {
      position: relative;
  }
  .oc-level-user-background {
      position: absolute;
      width: 295px;
      height: 50px;
      left: -3px;
      top: -9px;
      opacity: 0.3;
      z-index: 1;
      background-color: ${$color-accent-lighter};
  }
  .oc-esc-tl-user-name {
      cursor: pointer;
      font-weight: bold;
  }
  .sn-oc-member-avatar:focus {
      outline: ${$color-accent} auto 3px;
  }

  .modal-header {
      border-bottom: none;
  }
  .clear {
      clear: both
  }
  .escalation-set-wrapper .escalation-set-selector label {
      margin-top: 3.5px;
      font-size: 13px;
      margin-left: -8px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
  }
  .escalation-set-wrapper .escalation-set-selector .select2-container {
      width: 250px;
      margin-left: -25px;
  }
  .escalation-set-selector .select2-chosen {
      margin-top: 3.5px;
  }
  .escalation-set-selector .select2-arrow {
      margin-top: 7px;
  }
  .escalation-set-wrapper {
      margin-top: 10px;
  }
  .oc-profile-header h2 {
      margin: 0;
  }
  .oc-preference-value {
    display: inline-block;
    text-align: right;
  }
  .oc-attempt-details {
    margin-left: 40px;
    padding-top: 10px;
  }
  .oc-attempt-level {
    position: absolute;
    left: 0;
    top: 0;
    width: 32px;
    height: 32px;
    background-color: ${$color-lighter};
    border-radius: 50%;
     padding-top: 8px;
     padding-left: 12px;
  }
  .oc-attempt-wrapper {
     position: relative;
     padding-bottom: 20px;
  }
  .vertical-line {
     width: 1px;
     height: 100%;
     background-color: ${$color-dark};
     position: absolute;
     left: 15px;
     top: 0;
     bottom: 0;
  }
  .type-icon, .oc-preference-type {
      padding-left: 10px;
      color: ${$color-dark};
  }
  .oc-preference-type {
      width: 100px;
      display: inline-block;
  }
  .user-pref-attempts {
      margin: 20px;
  }
  .type-icon {
      font-size: 15px;
  }

  .type-icon, .oc-preference-value, .oc-preference-type {
      vertical-align: middle;
  }

  .shift-escalation-wrapper {
      height: 510px;
      overflow-y: auto;
  }
  .profile-preference-wrapper {
      height: 500px;
      overflow-y: auto;
  }
  .oc-audience-profile-wrapper .remove-border-top {
      border-top: none;
  }
  .contact-prefs-message {
      margin-bottom: 10px;
  }
  .contact-pref-roster-name {
      margin-bottom: 15px;
      padding-top: 10px;
  }
  .contact-pref-user-name {
      font-size: 18px;
  }
  .esc-path-start-msg {
      margin: 20px;
  }
  .preference-end {
      padding-left: 10px;
      font-weight: bold;
  }
  .preference-source {
      padding-left: 10px;
  }
  .preference-start-call {
      padding-left: 10px;
  }
  .right-section-height {
      height: 470px;
  }
  .next-prev-left-border {
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
  }
  .remove-border-left {
      border-left: none;
  }
  .remove-border-right {
      border-right: none;
  }
  .ms-teams-bg-image {
      content: " ";
      background: url("/images/Microsoft_Teams_48x48_black.png") no-repeat;
      width: 25px;
      height: 19px;
      display: inline-block;
      background-size: 28px 28px;
      background-position: 3px -6px;
  }
  #on_call_who_and_escalation iframe body, #on_call_who_and_escalation iframe {
       overflow: hidden;
  }

  span.oc-truncate {
    width: 175px;
  }
