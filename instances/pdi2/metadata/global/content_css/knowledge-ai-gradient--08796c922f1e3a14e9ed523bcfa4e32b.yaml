name: Knowledge AI Gradient
style: "\n        /* AI button with gradient styling */\n        .ai-button {\n        --now-button--ai--gradient-start: RGB(var(--now-actionable--primary-ai--background-color-gradient--start, var(--now-color--secondary-brand-10)));\n        --now-button--ai--gradient-end: RGB(var(--now-actionable--primary-ai--background-color-gradient--end, var(--now-color--supplementary1-brand-10)));\n        background: linear-gradient(135deg, var(--now-button--ai--gradient-start) 5%, var(--now-button--ai--gradient-end) 95%);\n        border-color: RGB(var(--now-actionable--primary-ai--border-color, var(--now-color--secondary-brand-10)));\n        border-radius: var(--now-actionable--primary-ai--border-radius, var(--now-actionable--contained_brand--border-radius, var(--now-actionable--border-radius, 0)));\n        border-width: var(--now-actionable--primary-ai--border-width, var(--now-actionable--contained_brand--border-width, 0));\n        color: RGB(var(--now-actionable_label--primary-ai--color, var(--now-color--primary-brand-16)));\n        transition-property: --now-button--ai--gradient-start, --now-button--ai--gradient-end, border-color, background-color, box-shadow, color;\n        transition-duration: var(--now-motion--duration--faster, 0.1s);\n        transition-timing-function: var(--now-motion--ease--linear, linear);\n        }\n\n        /* Hover state */\n        .ai-button:not(:disabled):hover {\n        --now-button--ai--gradient-start: RGB(var(--now-actionable--primary-ai--background-color--hover, var(--now-color--secondary-brand-10)));\n        --now-button--ai--gradient-end: RGB(var(--now-actionable--primary-ai--background-color--hover, var(--now-color--secondary-brand-10)));\n        border-color: RGB(var(--now-actionable--primary-ai--border-color--hover, var(--now-color--secondary-brand-10)));\n        color: RGB(var(--now-actionable_label--primary-ai--color--hover, var(--now-color--primary-brand-16)));\n        background: linear-gradient(135deg, var(--now-button--ai--gradient-start) 5%, var(--now-button--ai--gradient-end) 95%);\n        box-shadow: var(--now-button--shadow--hover, 0 2px 6px 0 rgba(0, 0, 0, 0.18));\n        transition-duration: var(--now-motion--duration--faster, 0.1s), var(--now-motion--duration--normal, 0.2s);\n        }\n\n        /* Disabled state */\n        .ai-button:disabled, .ai-button[disabled] {\n        --now-button--ai--gradient-start: RGB(var(--now-actionable--primary-ai--background-color-gradient--start, var(--now-color--secondary-brand-10)));\n        --now-button--ai--gradient-end: RGB(var(--now-actionable--primary-ai--background-color-gradient--end, var(--now-color--supplementary1-brand-10)));\n        background: linear-gradient(135deg, var(--now-button--ai--gradient-start) 5%, var(--now-button--ai--gradient-end) 95%);\n        opacity: var(--now-actionable--primary-ai--opacity--disabled, var(--now-actionable--contained--opacity--disabled, var(--now-actionable--opacity--disabled, var(--now-opacity--less, .25))));\n        color: RGB(var(--now-actionable_label--primary-ai--color--hover, var(--now-color--primary-brand-16)));\n        }\n\n        .ai-button:focus-visible {\n        color: RGB(var(--now-actionable_label--primary-ai--color, var(--now-color--primary-brand-16)));\n        }\n\n        .sparkle-icon-on-button::before {\n        font-size: 13px !important;\n        margin-right: 2px;\n        }\n\n    "
