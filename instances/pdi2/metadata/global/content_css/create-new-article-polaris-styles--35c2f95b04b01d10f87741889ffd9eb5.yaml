name: Create new article - Polaris Styles
style: |-
  h1.caption {
    font-size: 13px;
    font-weight: bold;
    margin-top: 10px;
  }

  .navbar-header {
    padding-left: 20px;
    float: left;
  }

  html[dir="rtl"] .navbar-header {
    padding-right: 20px;
    float: right;
  }

  .navbar-buttons {
    float: right;
  }

  html[dir="rtl"] .navbar-buttons {
    float: left;
    padding-left: 20px;
  }

  .next-btn {
    margin-right: 20px;
    width: 80px;
    height: 33px;
    font-size: 15px;
  }

  .main-content h2 {
    font-size: 17px;
    margin-top: 16px;
  }

  .content-sections {
    margin:5px -5px -5px -5px;
    overflow: auto;
    height: calc(100vh - 50px);
  }

  .column {
    border-right: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
    height: 100%;
    padding: 0 0 0 0;
  }

  .nav-segmented {
    height: 70px;
    display:inline-flex;
    align-items:center;
    border-bottom: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
    border-top: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
    width: 100%;
    padding-left: 20px;
    padding-right: 20px;
  }

  .scroll-section {
    padding-left: 0px;
    padding-right: 0px;
  }

  .search-result {
    font-size: 15px;
    padding: 10px 20px;
    list-style: none;
    cursor: pointer;
    border-bottom: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
  }

  .search-result .icon-loading {
    float: right;
  }

  .result-text {
    color: inherit;
  }

  .result-text:hover {
    color: inherit;
  }

  .search-result:not(.selected) .result-text:focus {
    outline: none;
  }

  li.selected {
    background-color: RGB(var(--now-color_selection--secondary-2,132,134,255));
    color: RGB(var(--now-button--primary--color, var(--now-color--neutral-0, 255, 255, 255)))
  }

  .search-result:not(.selected):hover {
    background-color: RGB(var(--now-color_selection--secondary-0, 42,43,82));
    color: RGB(var(--now-color_text--primary, var(--now-color--neutral-18, 21, 25, 32)));
  }

  .search-result:not(.selected):focus {
    background-color: RGB(var(--now-color_selection--secondary-0, 42,43,82));
    color: RGB(var(--now-color_text--primary, var(--now-color--neutral-18, 21, 25, 32)));
  }


  .search-result:focus {
    outline: none;
  }

  .search-result a:hover {
    text-decoration: none;
  }

  .search-box {
    width: 100%;
    height: 50px;
    display: inline-flex;
    font-size: 15px;
    border-bottom: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
    padding: 7px 20px 6px 20px;
  }

  .search-input{
    width: 100%;
    outline: none;
    border: 1px solid  RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
    border-left: 0px;
  }
  .search-input::-ms-clear {
      display: none;
  }

  .search-box .icon-filter {
    border: 1px solid  RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
    padding: 7px 10px 0px 10px;
    border-radius: 999px 0 0 999px;
    border-right: 0px;
  }

  html[dir="rtl"] .icon-filter {
    border-radius: 0 999px 999px 0;
    border-left: 0px;
  }

  html[dir="rtl"] .empty-search {
    border-radius: 999px 0 0 999px;
  }

  html[dir="rtl"] .search-input {
    border-right: 0px;
  }

  .empty-search {
    border-radius: 0 999px 999px 0;
  }

  .search-filled {
    border-right: 0;
  }

  .clear-search {
    border: 1px solid RGB(var(--now-color_border--tertiary, var(--now-color--neutral-3, 211, 214, 220)));
    border-radius: 0 999px 999px 0;
    border-left: 0px;
    padding-right: 8px;
    padding-top: 2px;
    color: inherit;
    font-size: 20px;
  }

  html[dir="rtl"] .clear-search {
    border-radius: 999px 0 0 999px;
    border-right: 0px;
    padding-left: 8px;
  }

  .clear-search:focus {
    outline: none;
  }

  .search-results-scroll {
    height: calc(100% - 139px);
    overflow: auto;
  }

  .type-def {
    font-size: medium;
    opacity: 0.7;
  }

  .kb-preview-content {
    overflow: auto;
    height: calc(100% - 89px);
  }

  .kb-preview-content article {
   margin-top: 10px;
   padding-left: 20px;
   padding-right: 20px;
  }

  .skeleton {
    height: 15px;
    margin-bottom: 7px;
    border-radius: 999px;
  }

  .skeleton-html {
    background-color: RGB(var(--now-color_background--tertiary, var(--now-color--neutral-2, 228, 230, 234)));
  }

  #page_timing_div {
    display: none;
  }

  .kb-preview-message {
      padding-left: 10%;
      padding-top: 150px;
      font-size: 15px;
      padding-right: 10%;
      text-align: center;
  }

  .collapsible-title {
    border-bottom: 1px solid RGB(var(--now-color_border--primary, var(--now-color--neutral-7, 143, 149, 161)));
    margin-bottom: 15px;
    vertical-align: middle;
    cursor: pointer;
    display: block;
    color: inherit;
  }

  .collapsible-title i{
    float: right;
    margin-top: -26px;
  }

  header h3 {
    outline: none;
    margin: 0px;
    padding-top: 18px;
    padding-bottom: 9px;
  }

  header i {
    outline: none;
  }

  i.icon-chevron-up.rotate {
    color:  RGB(var(--now-color_text--primary, var(--now-color--neutral-18, 21, 25, 32)));
  }

  .rotate {
      -ms-transition: all 0.25s linear;
      -moz-transition: all 0.25s linear;
      -webkit-transition: all 0.25s linear;
      transition: all 0.25s linear;
  }

  .rotate.down {
      -ms-transform: rotate(180deg);
      -moz-transform: rotate(180deg);
      -webkit-transform: rotate(180deg);
      transform: rotate(180deg);
  }

  .navbar-default{
      margin: -6px !important;
  }

  .hide-section {
    display: none;
  }
sys_name: Create new article - Polaris Styles
