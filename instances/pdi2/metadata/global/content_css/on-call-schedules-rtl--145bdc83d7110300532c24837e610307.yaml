name: On-Call Schedules - RTL
style: |-
  .rtl .oc-splash-msg {
  	text-align: right;
  }

  .rtl .input-group-transparent .input-group-addon-transparent.icon-filter {
  	left: auto;
  	right: 10px;
  }

  .rtl .input-group-transparent .input-group-addon-transparent ~ input {
  	padding-left: 2px;
  	padding-right: 33px;
  }

  .rtl .sn-navhub-content .sn-navhub-content {
  	margin-right: 8px;
  }

  .rtl .presence {
  	margin-right: -13px;
  }

  .rtl .oc-pin-action-count {
  	left: 8px;
          right: auto;
  }

  .rtl .oc-pinned {
  	left: 10px;
  	right: auto;
  	-webkit-transform: rotate(90deg);
  	-moz-transform: rotate(90deg);
  	-o-transform: rotate(90deg);
  	-ms-transform: rotate(90deg);
  	transform: rotate(90deg);
  }

  .rtl .oc-notification-msg {
  	padding-left: 0px;
  	padding-right: 10px;
  }

  HTML[data-doctype=true].rtl BUTTON:not(.btn) {
  	position: absolute;
  	top: 0px;
  	left: 0px;
  	right: auto;
  	border: 0px;
  	color: inherit;
  }

  .rotatimes {
  	padding-left: 0px;
  	padding-right: 2px;
  }

  .rtl .user-avatar .user-presence,
  .rtl .user-avatar .user-info {
  	float: right;
  }

  .rtl .oc-user-profile .avatar-info-item {
  	margin-right: 10px;
  	margin-left: auto;
  	padding-right: 5px;
  	padding-left: 0px;
  }

  .rtl .oc-card-icon-nobody {
  	width: 18%;
  	float: right;
  	padding-left: 45px;
  	padding-right: 0px;
  }

  @media (max-width: 799px) {
  	.modal-dialog {
  		width: 90%;
  	}
  	.rtl .oc-heading-left,
  	.rtl .oc-heading-right {
  		border-left: none;
  		border-right: none;
  	}
  }

  @media ( min-width : 800px) {
  	.rtl .oc-heading-right {
  		border-left: none;
  		border-right: 1px solid #bdc0c4;
  	}
  }

  .rtl .left-section.col-md-6 {
  	padding-left: 0px;
  	padding-right: 15px;
  }

  .rtl .right-section.col-md-6 {
  	padding-left: 15px;
  	padding-right: 0px;
  }

  .rtl .modal-header .close.icon-cross {
  	float: left;
  }

  .rtl .modal-header .btn {
  	margin-left: auto;
  	margin-right: 10px;
  }

  .rtl #oc-user-profile ul.avatar-info li {
  	text-align: right;
  }

  .rtl .oc-heading-left,
  .rtl .oc-heading-right {
  	padding-left: 0px;
  	padding-right: 0px;
  }
