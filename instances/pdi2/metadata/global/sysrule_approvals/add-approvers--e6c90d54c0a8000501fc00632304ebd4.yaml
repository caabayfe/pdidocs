name: Add Approvers
optional_group: ''
order: '100'
run_rule_before: 'true'
script: |-
  (function () {
      var gr = new GlideRecord('sc_req_item');
      var additional = new Array();
      var count = 0;
      gr.addQuery('request', current.sys_id);
      gr.query();
      while (gr.next()) {
          var test = gr.variable_pool.additional_approver;
          if (test != "undefined") {
              additional[count] = test;
              count = count+1;
          }
      }
      return additional;
  })();
set_state: approved
