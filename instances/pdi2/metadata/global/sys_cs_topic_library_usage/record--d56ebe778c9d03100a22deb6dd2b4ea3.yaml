library_usage: '{"type":"LibraryCall","library_topic_name":"_notification_controller_topic_block_","library_topic_id":"bb9714a9530210106e61ddeeff7b1201","library_topic_is_template":false,"parameter-mappings":[{"parameter-name":"notification_content","value":{"type":"String","mode":"script","value":"(function execute() {\n    var notificationId = vaInputs.notifications;\n    var gr = new GlideRecord(\"sys_cs_notification\");\n    gr.get(notificationId);\n    var content = gr.getValue(\"content\");\n    gr.setValue(\"state\", \"sent\");\n    gr.setValue(\"conversation\", vaSystem.getConversationId());\n    gr.update();\n\n    var notifications = JSON.parse(vaVars.notifications);\n    for (var i = 0 ; i < notifications.length ; i++) {\n        if(notifications[i].sysId == notificationId) {\n           content = JSON.stringify(notifications[i].content);\n           break;\n        }\n    }\n    return content;\n})()\n"},"metadata":{"type":"String","list":false,"items":[],"use_items":false}}],"return-value-mappings":[],"header_card_fields":[],"id":"50ee5663da4e4027a71f4de559b7bc7c","name":"_notification_controller_topic_block_","goal_id":"primary","applicability":{"type":"Applicability","mode":"script","value":"true"},"expert_mode":false}'
