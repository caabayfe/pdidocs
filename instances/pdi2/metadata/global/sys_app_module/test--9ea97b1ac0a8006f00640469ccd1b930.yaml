query: |-
  var urlBase = gs.getProperty("glide.servlet.uri");

  insertLocation("Test Location", "1234 abc blvd", "San Diego");
  insertUser("Test", "User", "test@company.com");
  insertComputer("Test Computer", "abc123");
  insertNotification("this is a test", "abc123");

  function insertNotification(message, uuid) {
    // create the soap document
    var soapdoc = new SOAPEnvelope();
    soapdoc.setFunctionName("insert");
    soapdoc.addFunctionParameter("message", message);
    soapdoc.addFunctionParameter("uuid", uuid);
    soapdoc.addFunctionParameter("source", "Test Computer");
   
    // post the request
    var soapRequest = new SOAPRequest(urlBase + "/imp_notification.do?SOAP", "admin", "admin");
    var xml = new XMLDocument(soapRequest.post(soapdoc));

    gs.print("incident number: " + xml.getNodeText("//number"));
    gs.print("action: " + xml.getNodeText("//status"));
    gs.print("message: " + xml.getNodeText("//status_message"));
  }

  function insertComputer(name, serial_number) {
    // create the soap document
    var soapdoc = new SOAPEnvelope();
    soapdoc.setFunctionName("insert");
    soapdoc.addFunctionParameter("name", name);
    soapdoc.addFunctionParameter("operating_system", "Linux");
    soapdoc.addFunctionParameter("serial_number", serial_number);
   
    // post the request
    var soapRequest = new SOAPRequest(urlBase + "/imp_computer.do?SOAP", "admin", "admin");
    var xml = new XMLDocument(soapRequest.post(soapdoc));

    gs.print("computer name: " + xml.getNodeText("//name"));
    gs.print("action: " + xml.getNodeText("//status"));
    gs.print("message: " + xml.getNodeText("//status_message"));
  }

  function insertUser(first_name, last_name, email) {
    // create the soap document
    var soapdoc = new SOAPEnvelope();
    soapdoc.setFunctionName("insert");
    soapdoc.addFunctionParameter("first_name", first_name);
    soapdoc.addFunctionParameter("last_name", last_name);
    soapdoc.addFunctionParameter("email", email);
    soapdoc.addFunctionParameter("location", "Test Location");
   
    // post the request
    var soapRequest = new SOAPRequest(urlBase + "/imp_user.do?SOAP", "admin", "admin");
    var xml = new XMLDocument(soapRequest.post(soapdoc));

    gs.print("user name: " + xml.getNodeText("//name"));
    gs.print("action: " + xml.getNodeText("//status"));
    gs.print("message: " + xml.getNodeText("//status_message"));
  }

  function insertLocation(name, street, city) {
    // create the soap document
    var soapdoc = new SOAPEnvelope();
    soapdoc.setFunctionName("insert");
    soapdoc.addFunctionParameter("name", name);
    soapdoc.addFunctionParameter("street", street);
    soapdoc.addFunctionParameter("city", city);
   
    // post the request
    var soapRequest = new SOAPRequest(urlBase + "/imp_location.do?SOAP", "admin", "admin");
    var xml = new XMLDocument(soapRequest.post(soapdoc));

    gs.print("user name: " + xml.getNodeText("//name"));
    gs.print("action: " + xml.getNodeText("//status"));
    gs.print("message: " + xml.getNodeText("//status_message"));
  }
