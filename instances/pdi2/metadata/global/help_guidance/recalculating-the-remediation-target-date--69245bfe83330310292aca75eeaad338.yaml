description: A remediation target (RT) date is the deadline for fixing a finding based on its risk rating. Keep RT dates accurate and aligned with the latest risk rating. When a finding’s risk rating changes, the system recalculates the RT date using the selected method. This recalculation helps you maintain valid SLAs and avoid outdated or incorrect deadlines.
