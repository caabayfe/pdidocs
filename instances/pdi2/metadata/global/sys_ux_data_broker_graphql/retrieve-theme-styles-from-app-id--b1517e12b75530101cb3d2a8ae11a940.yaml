api_name: global.Retrieve Theme Styles From App ID
batch_exclude: 'false'
description: Takes in the sys ID of a sys_ux_app record and returns name and type of styles associated with the app record's theme
mutates_server_data: 'false'
name: Retrieve Theme Styles From App ID
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "app_id",
      "label": "App Id",
      "description": "app record id",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    }
  ]
query: |-
  query ($app_id: String) {
    GlideRecord_Query {
      sys_ux_app(sys_id: $app_id) {
        _results {
          theme {
            value
          }
          _query {
            GlideRecord_Query {
              m2m_theme_style(queryConditions: "theme=$$parent.theme$$") {
                _results {
                  style {
                    value
                  }
                  _query {
                    GlideRecord_Query {
                      sys_ux_style(queryConditions: "sys_id=$$parent.style$$") {
                        _results {
                          sys_id {
                            value
                          }
                          name {
                            value
                          }
                          type {
                            value
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "App Id",
    "comment" : ""
  }, {
    "message" : "app record id",
    "comment" : ""
  } ]
schema_version: 1.0.0
sys_name: Retrieve Theme Styles From App ID
sys_policy: ''
type: query
use_record_domain: 'false'
