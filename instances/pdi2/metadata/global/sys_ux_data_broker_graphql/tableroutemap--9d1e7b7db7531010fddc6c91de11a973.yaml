api_name: global.tableRouteMap
batch_exclude: 'false'
description: |-
  Allows for a route configuration with key based mapped routes to be applied for a Page Definition.  

  Examples, Agent Assist, Notifications and Search Results all have cards with different data in them, including knowledge articles, SC items, incidents; and we want to open up a workspace tab for this content; may be in session tabs, or sub-tabs. One configuration per page, with potentially multiple mappings are created here so that a user click event can find the information it needs to route to the correct location.
mutates_server_data: 'false'
name: Table route map
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "routeConfigId",
      "label": "Route config Id",
      "description": "Route config Id",
      "readOnly": false,
      "fieldType": "string",
      "mandatory": true,
      "defaultValue": ""
    }
  ]
query: |-
  query ($routeConfigId: String) {
    GlideUxDynamicRoute_Query {
      dynamicRouteConfig(routeConfigId: $routeConfigId) {
        name,
        sys_id,
        mappingGroups {
          table,
          mappings {
            source_key,
            payload
          }
        }
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: tableRouteMap
sys_policy: ''
type: query
use_record_domain: 'false'
