  {
    "name": "pageCursor",
    "label": "Page Cursor",
    "description": "Page cursor for EVAM pagination",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  },
  {
    "name": "pageSize",
    "label": "Page Size",
    "description": "Page size for EVAM pagination",
    "readOnly": false,
    "fieldType": "Int",
    "mandatory": false,
    "defaultValue": 20
  },
  {
    "name": "pageNumber",
    "label": "Page Number",
    "description": "Page number for EVAM pagination",
    "readOnly": false,
    "fieldType": "Int",
    "mandatory": false,
    "defaultValue": 0
  },
  {
    "name": "filterPreference",
    "label": "EVAM Filter Preference",
    "description": "Shows sys_ids for EVAM data filter",
    "readOnly": false,
    "fieldType": "string",
    "mandatory": false,
    "defaultValue": ""
  }
  ]
query: |-
  query ($evamMetadata: GlideCompositeData_CompositeDataRequest,
  $pageCursor: String,
  $pageSize: Int,
  $pageNumber: Int,
  $filterPreference: String
  ) {
    GlideCompositeData_Query {
      getCompositeData(
  compositeDataRequest: $evamMetadata,
  pageCursor: $pageCursor,
  pageSize: $pageSize,
  pageNumber: $pageNumber,
  selectedFilter:$filterPreference) {
        page_cursor
        page_size
        page_number
        is_last_page
        all_actions {
            assignmentId
            name
            label
            actionType
            actionDispatch
            actionPayload
          }
        selected_filter
        items {
            template
            props {
              name
              value
            }
        actions {
            assignmentId
            name
            label
            actionType
            icon
            buttonType
            actionDispatch
            serverScript
            confirmationRequired
            confirmationMessage
            actionPayload
            actionPayloadMap {
              name
              value
            }
          }
        }
       filters {
            sys_id
            label
          }
      }      
    }
  }
