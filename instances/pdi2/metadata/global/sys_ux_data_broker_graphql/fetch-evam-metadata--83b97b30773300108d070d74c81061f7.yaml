name: Fetch EVAM Metadata
output_schema: ''
private: 'false'
props: |-
  [{
    "name": "evamDefinitionId",
    "label": "EVAM Definition",
    "description": "Select an EVAM Definition record",
  "readOnly": false,
  "fieldType": "reference",
    "mandatory": true,
    "typeMetadata": {
        "reference": "sys_ux_composite_data"
      }
  }]
query: |-
  query ($evamDefinitionId:String) {
    GlideCompositeDataMetadata_Query {
      getMetadata(id: $evamDefinitionId) {
        sort_order
        template_predicates {
          sys_id
          predicate
          template_id
          table
          fields
          action_ids
        }
        datasources {
          sys_id
          table
          query
          sort_field
        }
       filters {
          sys_id
          label
        }
      }
    }
  }
required_translations: |-
  [ {
    "message" : "EVAM Definition",
    "comment" : ""
  }, {
    "message" : "Select an EVAM Definition record",
    "comment" : ""
  } ]
