api_name: global.Create Change Landing - Save user preference
batch_exclude: 'false'
description: Update user preference with current filter / pinned card
mutates_server_data: 'true'
name: Create Change Landing - Save user preference
output_schema: ''
private: 'false'
props: |-
  [
  {
      "name": "name",
      "label": "Name",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "User preference name"
    },
  {
      "name": "value",
      "label": "Value",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "User preference value"
    }
  ]
query: |-
  mutation ($name: String!, $value: String!) {
    GlideDomain_Mutation {
      user {
        setPreference(name: $name, value: $value) {
          name
          value
        }
      }
    }
  }
