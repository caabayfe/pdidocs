query: |-
  query ($searchContextConfigId:String!, $searchTerm:String!, $facetFilters:String, $searchFilters:String, $sortOptions:String, $requestedFields:String, $disableSpellCheck: Boolean, $paginationToken: String, $locale:String,$additionalContext:String, $setSemanticSearch:Boolean, $forceSkipSignalsLogging: Boolean, $isDebug:Boolean, $searchEvamConfigId:String, $userContextOverrides:String, $searchPurview:String, $asyncParams:String, $semanticConfigurations:String, $additionalFilters:String, $vaEvamDefinitionId:String, $uiContext:String) {
    GlideSearch_Query {
      sortOptions(searchFilters: $searchFilters, searchContextConfigId: $searchContextConfigId) {
        label
        sysId
      }
      search(searchContextConfigId: $searchContextConfigId, searchTerm: $searchTerm, facetFilters:$facetFilters, searchFilters:$searchFilters, sortOptions:$sortOptions, paginationToken: $paginationToken, requestedFields: $requestedFields, disableSpellCheck: $disableSpellCheck, locale: $locale,additionalContext:$additionalContext, setSemanticSearch: $setSemanticSearch, forceSkipSignalsLogging: $forceSkipSignalsLogging, isDebug: $isDebug, searchEvamConfigId:$searchEvamConfigId, userContextOverrides: $userContextOverrides, searchPurview: $searchPurview, asyncParams: $asyncParams, semanticConfigurations: $semanticConfigurations, additionalFilters: $additionalFilters,vaEvamDefinitionId:$vaEvamDefinitionId, uiContext:$uiContext) {
        term
        rewrittenTerm
        originalSearchPhrase
        spellCorrectedTerm
        previousPaginationToken
        nextPaginationToken
        currentPage
        filters {
          sysId
          label
          count
        }
        totalHits
        showResultCount
        selectedFilterIds
        selectedSortOptionIds
        appliedFacetFilters
        appliedFacetFiltersMetadata {
            facetFilter
            applied
            type
        }
        count
        responseTimeInMs
        matchedQueryIntents
        matchedGeniusResultIntents
        matchedRules
        queryLanguage
        intentSwitch
        additionalContext
        geniusResultsExecuted
        asyncGeniusResultChannelName
        primarySearchRequestId
        awaitingResults
        filterGeniusResultsBySearchSource
        showDisabledFacets
        hybridSearch
        searchProfileDetails
        pendingResultDetails {
          queryRewrite
          regularSearch
          geniusResults
        }
        callbackId
        queryDisambiguation {
          ambiguousQuery
          clarifyingQuestion
        }
        sensitivityFilter {
          hasMatch
          filterId
          filterValue
        }
        queryFeedback {
          messageName
          message
          level
          category
        }
        queryAnalytics {
          totalTimeInMS
          preProcessingTimeInMS
          lateBindingTimeInMS
          totalGeniusResultTimeInMS
          totalEngineTimeInMS
        }
        searchAnalyticsPayload {
          logSignals
