api_name: global.Get Reason Codes For Interaction
batch_exclude: 'false'
description: Retrieves the applicable reason codes for a given interaction
mutates_server_data: 'false'
name: Get Reason Codes For Interaction
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "interaction_id",
      "label": "Interaction ID",
      "description": "Interaction sys id of the current record",
      "fieldType": "string",
      "mandatory": true
    }
  ]
query: |-
  query($interaction_id: String!) {
    now {
      helpRequest {
        reasonCodesForInteraction(interaction_id: $interaction_id) {
          id
          code
          description
        }
      }
    }
  }
required_translations: ''
