api_name: global.Delete Multiple Records
batch_exclude: 'false'
description: Deletes multiple records on a given table.
mutates_server_data: 'true'
name: Delete Multiple Records
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table",
      "description": "Target table to edit",
      "readOnly": false,
      "fieldType": "table_name",
      "mandatory": true,
      "defaultValue": ""
    },
    {
      "name": "query",
      "label": "Conditions",
      "description": "Encoded GlideRecord query condition",
      "readOnly": false,
      "fieldType": "condition_string",
      "typeMetadata": {
        "table": "@table"
      },
      "mandatory": true
    }
  ]
query: |-
  mutation($table: String!, $query: String) {
    GlideUXFMutation_Mutation {
      delete(table: $table,
        query: $query) {
  			error
      }
    }
  }
