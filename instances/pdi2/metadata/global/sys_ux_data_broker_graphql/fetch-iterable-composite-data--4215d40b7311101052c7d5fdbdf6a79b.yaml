api_name: global.Fetch Iterable Composite Data
batch_exclude: 'false'
description: ''
mutates_server_data: 'false'
name: Fetch Iterable Composite Data
output_schema: ''
private: 'true'
props: |-
  [
      {
          "name": "compositeIterableDataRequest",
          "label": "Composite Iterable Data Request",
          "description": "",
          "readOnly": false,
          "fieldType": "object",
          "mandatory": true,
          "defaultValue": ""
      }
  ]
query: |-
  query ($compositeIterableDataRequest: GlideCompositeIterableData_CompositeIterableDataRequest) {
  	GlideCompositeIterableData_Query {
  		getCompositeData(compositeIterableDataRequest: $compositeIterableDataRequest) {
                          all_actions {
                                  assignmentId
                                  name
                                  label
  	    
                                  actionType
                                  actionDispatch
                                  actionPayload
                          }
  			items {
  				template
  				props {
  					name
  					value
  				}
  				actions {
  						assignmentId
  						name
  						label
  						actionType
  						icon
  						buttonType
  						actionDispatch
  						actionPayload
  						serverScript
  						actionPayloadMap {
  							  name
  							  value
  						}
  				}
  			}
  		}
  	}
  }
required_translations: |-
  [ {
    "message" : "Composite Iterable Data Request",
    "comment" : ""
  } ]
schema_version: 1.0.0
script: ''
sys_name: Fetch Iterable Composite Data
sys_policy: read
