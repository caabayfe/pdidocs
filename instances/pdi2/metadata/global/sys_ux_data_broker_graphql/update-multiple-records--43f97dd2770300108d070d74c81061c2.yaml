      "readOnly": false,
      "fieldType": "condition_string",
      "mandatory": true,
      "defaultValue": "",
      "typeMetadata": {
          "table": "@table"
      }
    }
  ]
query: |-
  mutation($table: String!, $query: String!, $templateFields: String) {
    GlideUXFMutation_Mutation {
      update(table: $table,
        query: $query,
        template: $templateFields) {
  			error
      }
    }
  }
