name: Update Multiple Records
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table name",
      "description": "Target table to edit",
      "readOnly": false,
      "fieldType": "table_name",
      "mandatory": true,
      "defaultValue": ""
    },
    {
      "name": "query",
      "label": "Query condition",
      "description": "Encoded GlideRecord query condition",
      "readOnly": false,
      "fieldType": "condition_string",
      "typeMetadata": {
        "table": "@table"
      },
      "mandatory": true,
      "defaultValue": ""
    },
    {
      "name": "templateFields",
      "label": "Field/values",
