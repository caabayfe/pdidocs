api_name: ''
batch_exclude: 'false'
description: Get all Incidents filtered by the query condition string supplied via Inputs
mutates_server_data: 'false'
name: Filtered Incidents
output_schema: ''
private: 'false'
props: |-
  [{
    "name": "filter",
    "label": "Incident filter",
    "description": "Query conditions in the 'encoded query' format, for filtering the Incident data",
    "readOnly": false,
    "fieldType": "condition_string",
    "mandatory": false,
    "defaultValue": "",
    "typeMetadata": {"table": "incident"}
  }]
query: |-
  query($filter: String) {
    GlideRecord_Query {
      incident(queryConditions: $filter) {
        _results {
          sys_id {
            value
          }
          number {
            __typename
            value
            displayValue
            htmlValue
          }
          caller_id {
            __typename
            value
            displayValue
            htmlValue
          }
          short_description {
            __typename
            value
            displayValue
            htmlValue
          }
        }
      }
    }
  }
required_translations: ''
schema_version: ''
script: ''
sys_name: Filtered Incidents
