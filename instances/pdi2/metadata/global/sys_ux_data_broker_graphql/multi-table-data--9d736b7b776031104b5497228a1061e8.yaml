query: |-
  query ($dataSources: [GlideMultiDatasource_Datasource],
  $sort_order: String,
  $pageCursor: String,
  $pageSize: Int,
  $pageNumber: Int
  ) {
          GlideMultiDatasource_Query {
          getMultiDatasourceData(
          MultiDatasourceRequest: $dataSources,
  sort_order: $sort_order,
  pageCursor: $pageCursor,
  pageSize: $pageSize,
  pageNumber: $pageNumber) {
        items {
            table
            fields {
              name
              label
              value
              displayValue
              type
            }
            sys_id
        }
        page_cursor
        page_size
        page_number
        is_last_page
      }      
    }
  }
