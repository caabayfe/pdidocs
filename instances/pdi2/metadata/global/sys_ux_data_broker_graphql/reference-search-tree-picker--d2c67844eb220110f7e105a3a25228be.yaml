api_name: global.Reference Search Tree Picker
batch_exclude: 'false'
description: Get tree picker config  for a reference field
mutates_server_data: 'false'
name: Reference Search Tree Picker
output_schema: ''
private: 'true'
props: |-
  [{
  		"name": "table",
  		"label": "Table",
  		"description": "Name of table for this record",
  		"readOnly": false,
  		"fieldType": "table_name",
  		"mandatory": true
  	},
  	{
  		"name": "field",
  		"label": "field",
  		"description": "Field name of the record",
  		"readOnly": false,
  		"fieldType": "string",
  		"mandatory": true
  	},
  	{
  		"name": "sys_id",
  		"label": "Sys Id",
  		"description": "Sys id of the record",
  		"readOnly": "false",
  		"fieldType": "string",
  		"mandatory": true
  	},
  	{
  		"name": "serialized_changes",
  		"label": "Serialized Changes",
  		"description": "String of Serialized Changes",
  		"readOnly": "false",
  		"fieldType": "string",
  		"mandatory": false,
  		"defaultValue": ""
  	},
  	{
  		"name": "encoded_record",
  		"label": "Encoded Record",
  		"description": "String of Encoded Record",
  		"readOnly": "false",
  		"fieldType": "string",
  		"mandatory": false,
  		"defaultValue": ""
  	}
  ]
query: |-
  query ($table: String!, $field: String!, $sys_id: String, $serialized_changes: String, $encoded_record: String) {
    	GlideLayout_Query {
  		treePickerConfigQuery(tableName: $table, fieldName: $field, sysId: $sys_id, serializedChanges: $serialized_changes, encodedRecord: $encoded_record) {
  			treePicker {
  				isSupported
  				processor
  				table
  				targetField
  				targetValue
  				targetPath
  				queryString
  			}
  		}
  		formLayout(table: $table, sysId: $sys_id) {                          
  			domainSeparation {
  				domainId             
  			}
  		}
    	}
  }
required_translations: |-
  [ {
