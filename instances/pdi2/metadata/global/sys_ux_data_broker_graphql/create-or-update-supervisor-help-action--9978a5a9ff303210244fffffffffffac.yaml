api_name: global.Create or Update Supervisor Help Action
batch_exclude: 'false'
description: Create or update supervisor help action
mutates_server_data: 'true'
name: Create or Update Supervisor Help Action
output_schema: ''
private: 'false'
props: |-
  [
    {
       "name":"interaction",
       "label":"interaction",
       "description":"interaction sysId",
       "fieldType":"string",
       "mandatory": true
   },
  {
       "name":"action_sys_id",
       "label":"action_sys_id",
       "description":"Supervisor help action record's sysId",
       "fieldType":"string",
       "mandatory":false
   },
   {
       "name":"action",
       "label":"action",
       "description":"Supervisor's engagement type",
       "fieldType":"string",
       "mandatory":false
   },
   {
       "name":"help_request",
       "label":"help_request",
       "description":"help request sysId",
       "fieldType":"string",
       "mandatory":false
   },
   {
       "name":"additional_metadata",
       "label":"additional_metadata",
       "description":"additional_metadata",
       "fieldType":"string",
       "mandatory":false
  }
  ]
query: |-
  mutation($interaction: String!, $action_sys_id: String, $action: String, $help_request: String, $additional_metadata: String)
  {
     now
     {
        helpRequest 
         {
             createOrUpdateSupervisorHelpAction( 
                     interaction:$interaction, 
                     action_sys_id: $action_sys_id,
                     action:$action,
                     help_request: $help_request, 
                     additional_metadata:$additional_metadata
             )
             {
                     action_sys_id
                     success
                     message    
             }
         }
      }
  }
required_translations: ''
schema_version: 1.0.0
