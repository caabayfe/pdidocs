api_name: global.Get Help Request Eligibility
batch_exclude: 'false'
description: Retrieves whether an agent can request help or cancel help for a given interaction and returns the sys_id of the help request entry.
mutates_server_data: 'false'
name: Get Help Request Eligibility
output_schema: ''
private: 'false'
props: |-
  [
  	  {
  		"name": "interaction_id",
  		"label": "Interaction ID",
  		"description": "Interaction sys id of the current record",
  		"fieldType": "string",
  		"mandatory": true
  	  }
  	]
query: |-
  query ($interaction_id: String!) {
  		now {
  		  helpRequest {
  		  	helpRequestEligibility(interaction_id: $interaction_id) {
  		  	canRequestHelp
  		  	canCancelHelp
  		  	helpRequestedId
  			additionalData {
  				helpRequestedOnInteraction
  				assignedTo
  					}
  				}
  			}
  		}
  	}
required_translations: ''
schema_version: 1.0.0
sys_name: Get Help Request Eligibility
sys_policy: ''
type: query
use_record_domain: 'false'
