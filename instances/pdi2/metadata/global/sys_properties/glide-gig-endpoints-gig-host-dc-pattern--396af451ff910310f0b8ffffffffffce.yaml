description: Regular expression used to extract a datacenter region code from a hostname during GIG endpoint proximity filtering. Default \.([a-z]+)\d*\.service-now\.com$ captures the letter prefix of the last hostname segment before .service-now.com (e.g. app133192.ycg401.service-now.com → ycg). The same pattern is applied to both the app node's own hostname and each candidate endpoint so a node prefers gateways in its own datacenter. Hostnames are lowercased before matching, so the pattern must match lowercase input. Only used when glide.gig.endpoints.local_gigs_only is true.
