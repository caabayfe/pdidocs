description: When set to true, the Virtual Agent Hybrid Queue will not add messages to the sysevent table unless the queue is full.  This is meant to reduce the amount of records added to sysevent.  When the queue is full, VA will continue to add state=READY messages to sysevent which makes them available for another node to process.
