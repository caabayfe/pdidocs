choices: ''
description: |-
  default: Instance will take care of the referrer headers.
        no-referrer: No referrer information is sent with requests, effectively removing the "Referrer" header.
        no-referrer-when-downgrade: Sends the full referrer URL when navigating to the same or a more secure origin (HTTPS → HTTPS), but no referrer when downgrading (HTTPS → HTTP).
        same-origin: Sends the full referrer URL when the request is within the same origin but no referrer is sent to different origins.
        origin: Sends only the origin as the referrer, both for same-origin and cross-origin requests.
        origin-when-cross-origin: Sends the full referrer URL for same-origin requests and only the origin for cross-origin requests.
        strict-origin: Sends only the origin as the referrer, but omits it entirely when navigating to a less secure context (e.g., HTTPS → HTTP).
        strict-origin-when-cross-origin: Sends the full referrer URL for same-origin requests, only the origin for cross-origin requests, and no referrer when downgrading from HTTPS to HTTP.
ignore_cache: 'false'
