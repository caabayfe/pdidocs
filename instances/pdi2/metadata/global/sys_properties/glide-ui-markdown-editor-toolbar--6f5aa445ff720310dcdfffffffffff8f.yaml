description: |-
  Controls which formatting buttons appear in the Markdown editor's toolbar for fields of type "markdown". Does not restrict what Markdown syntax is supported — everything below still renders correctly when typed or pasted, even if its button isn't shown.

  Format: item ids separated by spaces, commas, or semicolons; | inserts a divider between groups.
  Example: heading | bold italic | ul ol | link quote code | download

  Available ids: heading, bold, italic, strike, highlight, subscript, superscript, code, ul, ol, tasklist, link, table, codeblock, quote, hr, download, fullscreen.

  Leave blank to use the built-in default toolbar. Can be overridden per field via the markdown_toolbar dictionary attribute.
