choices: default block linebreak invert
description: |-
  The system property enables you to adjust what happens when enter or return is pressed on the journal HTML editor.
   
  default: Inserts a block (defined by forced_root_block) on Enter, and a br tag on shift+ Enter.
  block: Forces the above enter behavior in all cases.
  linebreak: Forces the above shift+Enter behavior in all cases.
  invert: swaps Enter and shift+ enter behavior.
ignore_cache: 'true'
