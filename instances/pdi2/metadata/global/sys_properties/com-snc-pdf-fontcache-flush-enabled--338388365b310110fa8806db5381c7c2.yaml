description: This setting is about enabling/disabling the flushing of font cache. If enabled, the font cache will be flushed as soon as possible each PDF export or HTML to PDF conversion or PDF form filling. Otherwise if disabled, font cache will not be flushed and it will remain in heap memory till the node is restarted.
