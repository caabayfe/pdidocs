description: |-
  Color-code threshold:  Subscription count values are color coded on the list and form views and are based on the percentage you specify here. 
  Red indicates that usage is greater than 100% of the purchased subscription. Green indicates that usage is below the threshold that you set here. 
  Yellow indicates that usage is between the threshold and 100%. The default threshold is 90%. 
