description: |-
  Property represents the threshold value within which the last_client_activity_time column in session binding table (sys_cs_session_binding) is not updated. When the first message in a session scope is received, the last_client_activity_time column is set with the current date time value. For all subsequent messages received within the threshold time, the column is not updated. 

  Property value is in seconds and the default value is 30.
ignore_cache: 'true'
is_private: 'false'
name: glide.cs.last_client_activity_time.threshold.secs
read_roles: ''
