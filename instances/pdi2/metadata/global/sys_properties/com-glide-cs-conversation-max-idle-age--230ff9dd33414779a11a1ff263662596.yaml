description: "Grace period in seconds added on top of the conversation's timeout before force-faulting without transcript generation. The effective threshold is: conversation timeout + max idle age. For example, a 7-day off-glide conversation with a 48-hour grace period will be force-faulted after 9 days of inactivity. This prevents resource buildup from corrupted or stuck conversations while respecting channel-specific timeouts. Default is 172800 seconds (48 hours)."
ignore_cache: 'true'
