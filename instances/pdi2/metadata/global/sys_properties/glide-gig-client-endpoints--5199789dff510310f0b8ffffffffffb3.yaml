description: The list of GIG gateway endpoints this instance connects to. Comma-separated, with each entry in host:port form (e.g. pod-0.gig.ycg0.service-now.com:443); a legacy id:host:port form is also accepted but the id is ignored. Empty by default, in which case the GIG client starts no connections. The parsed list is further narrowed by datacenter-proximity filtering (see glide.gig.endpoints.local_gigs_only) before connections are opened.
