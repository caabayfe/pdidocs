description: |-
  NOTICE: 1. CHANGES WILL APPLY TO ALL PRESENT AND FUTURE EVENT RULES. 2. ADDING REMOVED FIELDS FROM THE LIST WILL NOT RESTORE THEIR PREVIOUS FORMATTING. 
  A comma separated string that contains the column names of the fields that should be displayed as multiline (textarea, long string) fields instead of a simple string. 
  E.g. For fields such as Description, My Field, etc.. the value of the property should be "description, u_my_field,...".
