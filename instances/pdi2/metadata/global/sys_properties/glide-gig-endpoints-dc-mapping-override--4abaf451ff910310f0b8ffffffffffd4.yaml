description: Manual datacenter aliasing for GIG proximity filtering, for cases where a gateway's region code and the app node's region code differ but should be treated as the same datacenter. Format is comma-separated gigDc:appDc pairs (e.g. ycg:aus,ytz:ord), which remap a gateway's extracted region to the node's region before they are compared. Empty by default (no overrides). Matching is case-insensitive. Only used when glide.gig.endpoints.local_gigs_only is true.
