description: 'This property sets a limit for how many files are shown in the list of changed files during a Studio Source Control commit. After the limit is reached, the changed files list will be hidden and the user will see a dialog that allows them to make a commit that will include all changes files as well as changes not tracked by the Customer Update [sys_update_xml] table from all developers for the application. '
