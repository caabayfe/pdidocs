description: 'When set to true, Mosaic async capability executions are offloaded to the VA Hybrid Queue instead of the Flow Designer subflow. Preprocessing (ACL checks, payload validation, role masking, JWT generation) runs on the calling thread; the Mosaic call and postprocessing are dispatched to a VA worker thread. The worker acquires a conversation lock, executes the Mosaic call, shapes the response, and routes it through the standard callback chain. '
