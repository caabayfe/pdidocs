description: |-
  Configuration to control max user(s) to be fetched from the group escalation plan.

  <!--
  This property value is used to fetch the number of the user(s) from the group escalation plan. 
  For example, if the value is -1, it fetches all the user(s) from the plan. If the value is 1, it fetches only the first level of the user(s). This is the default property that is used until the specific property for the task type is configured. To use different levels for different task types (such as Incident, Problem and so on), create a new property by replacing <default> in key with task type.

  Note: This property is used only when the sys property com.snc.notify.default.conference_call_follow_on_call_escalation is set to false. The property is enabled only when you activate the Notify plugin (com.snc.notify).
  -->
ignore_cache: 'false'
is_private: 'false'
name: com.snc.notify.default.on_call_escalation_level
read_roles: sn_on_call_admin
suffix: global
sys_name: com.snc.notify.default.on_call_escalation_level
sys_policy: ''
type: integer
value: '-1'
write_roles: sn_on_call_admin
