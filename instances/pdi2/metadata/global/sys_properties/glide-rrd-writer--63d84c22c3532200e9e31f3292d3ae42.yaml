choices: RoundRobin=rrd,JRobin=jrobin,Dual=dual,Dual JRobin=dual_jrobin,Clotho=clotho
description: |-
  The backend storage to store time series data. This only applies to applications that currently writing to round_robin_database.
  If the value is set to rrd, the data would be written into round_robin_database table. If the value is set to JRobin, the data would be written into jrobin_database table. If the value is set to Dual, the data would be written into both rrd and clotho. If the value is set to Dual JRobin, the data would be written into both jrobin and clotho. If the value is set to clotho, the data would be written into Clotho Server only. WARNING: setting this to clotho can cause the ServiceNow Performance Dashboard to display an error message, therefore if that dashboard will continue to be used a setting of dual_jrobin is preferred.
