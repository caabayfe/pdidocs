description: |-
  Applicable only for parallel processing mode. In parallel mode, multiple jobs can be run in parallel to speed up the sync process. This property specifies how many such jobs can run in parallel.
        
        Minimum jobs  that can run in parallel = 1
        Maximum jobs that can run in parallel = 5
        The suggested value should be provided in this range , as the system by functionality uses this range irrespective of number provisioned.
