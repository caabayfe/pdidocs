description: |-
  This property contains a comma separated list of baseline service portal record sys_ids (introduced as part of the active / inactive plugins). For any portal record specified in this property, the service portal admin user (with role sp_admin) will be able (/allowed) to view the "AI Search" configurations section to further configure.

  The Newly created / Customer created portal record sys_ids do not need to be included in this list. For these portals, the service portal admin users are allowed by default to view the AI Search experience configurations.
