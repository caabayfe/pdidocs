description: |-
  Enable the On-Call escalation hierarchy when a user group is added to a conference call. 

  <!--
  If the value is true, the On-Call escalation hierarchy is followed when a user group is added to a conference call.  Users can create properties for required task types such as incident. For example, com.snc.notify.incident.conference_call_follow_on_call_escalation.

  Note: The property is enabled only when you activate the Notify plugin (com.snc.notify). 
  -->
