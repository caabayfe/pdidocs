description: Seconds a sys_og_conversational_cache_http_log row may remain at status=processing before it is treated as stranded and allowed to re-execute. Guards against a pod dying mid-write blocking that request_id + cache_name until the 30-day cleaner runs. Keep this comfortably above the CCS outbound Glide timeout (outboundhttp.response-timeout-ms, currently 30s) so a slow but live call is not reclaimed underneath itself.
