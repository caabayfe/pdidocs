description: This property determines which version of the activity stream to use in workspace. A value of 1 indicates the latest version of activity stream, which is faster and more performant. If you need to revert to the previous version of activity stream, you can change the value to 0, however, you will no longer be able to take advantage of any features that were enabled as part of the latest version of activity stream.  Any changes to this property will not affect the platform activity stream, only workspace.
