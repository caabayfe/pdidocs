description: |-
  Enable this property if you want to add all the members of a particular group when no rota is defined.

  <!--
  If the value is true, all the members of the selected group are added if on-call rota is not defined.  Users can create properties for required task types such as incident. For example, com.snc.notify.incident.add_all_members_on_no_rota_defined

  Note: The property is enabled only when you activate the Notify plugin (com.snc.notify). 
  -->
