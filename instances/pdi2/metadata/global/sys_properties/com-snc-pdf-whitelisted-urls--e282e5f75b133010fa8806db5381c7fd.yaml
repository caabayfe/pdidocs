description: |-
  Provide the comma separated list of all the whitelisted URLs which are accessible from ServiceNow instances.This property is used during HTML to PDF conversion APIs and SVG to PDF conversion APIs where the svg inputs provided can only contain image hyperlinks to these whitelisted URLs otherwise the APIs will error out.

  Exact URLs are matched as-is. To allow all URLs under a domain, add the entry with a trailing / (e.g., https://xyz.example.com/ allows any URL starting with that prefix).
