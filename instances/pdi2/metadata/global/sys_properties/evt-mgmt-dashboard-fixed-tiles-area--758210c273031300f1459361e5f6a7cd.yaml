description: |-
  Determines whether all the services in the dashboard will have the same area (in size).
  When this property's value is set to "true" then all the tiles will have identical area.
  The default value is "false", hence the area of the tiles will differ based on severity/cost/business criticality.
  Notice that same area does not inflict on the tiles shape.
