description: Break-glass kill switch for the client-side ListAPI CSPT allowlist (validateTable and validateApiVersion). When true, those checks are skipped on server-rendered surfaces (classic Next Experience lists and mobile). Leave false unless a legitimate table/apiVersion is being wrongly rejected; the regex allowlist is the intended fix (DEF0813220). Has no effect on surfaces that do not deliver window.NOW (e.g. some workspace/embedded contexts), where validation stays on (fails secure).
