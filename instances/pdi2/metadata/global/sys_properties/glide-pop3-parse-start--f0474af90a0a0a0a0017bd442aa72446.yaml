description: |-
  Text indicating the beginning of the email body section where name:value pairs should be parsed. In the example below, the text PARSE_START signals that the name:value pairs that follow should automatically be applied to the current record.
  <pre>
     PARSE_START
         severity:1
         category:hardware
     PARSE_END
  </pre>
