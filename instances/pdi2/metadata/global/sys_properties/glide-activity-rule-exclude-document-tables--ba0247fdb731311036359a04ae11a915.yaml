description: "\n      Comma-separated list of tables whose documents will be excluded from activity tracking. This means that all documents in the specified tables will not have an activity stream in Configurable Workspaces. Supports table hierarchies, so if a root table is specified in the list, all descendant tables will be excluded.\n\n      To include a child table of an excluded parent table, prefix the child table with a + character in the list. For example, \"+cmdb_ci_hardware\" will enable cmdb_ci_hardware and its descendants to have an activity stream. The + takes precedence over the exclusions.\n\n      By contrast, use the - character to exclude a table that is a descendant of an included parent table. For example, \"-cmdb_ci_computer\" will exclude cmdb_ci_computer and its descendants from having an activity stream.\n\n      If this property is:\n      cmdb_ci, +cmdb_ci_hardware, -cmdb_ci_computer\n\n      Given the following table hierarchy:\n      - cmdb_ci [-]\n        |\n        |- cmdb_ci_hardware [+]\n        |  |- cmdb_ci_computer [-]\n        |  |- cmdb_ci_printer [+]\n        |  └- cmdb_ci_network [+]\n        |\n        |- cmdb_ci_software [-]\n\n      Then cmdb_ci, cmdb_ci_computer, and cmdb_ci_software will not have an activity stream, but cmdb_ci_hardware, cmdb_ci_printer, and cmdb_ci_network will have an activity stream.\n     "
