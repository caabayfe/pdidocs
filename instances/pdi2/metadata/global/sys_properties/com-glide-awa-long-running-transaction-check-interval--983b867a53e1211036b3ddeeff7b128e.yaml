description: |-
  This is the time interval (in seconds) after clicking on Accept or Reject buttons in the AWA Inbox work item card in the Agent workspace, when a check will be made to see if there are any long running transactions in the user's session. This check will be made only if the original graphQL has not returned in the meantime.
  A value of -1 will disable this check.
