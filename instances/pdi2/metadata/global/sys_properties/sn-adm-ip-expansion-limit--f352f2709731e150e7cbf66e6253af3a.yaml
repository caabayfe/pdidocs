description: "Limit for expanding global addresses ('0.0.0.0' or '*') into individual IP addresses\n            If set to 0, global addresses are not expanded to individual IPs\n            If a negative value is set, global addresses are expanded to all available IPs\n            If a positive value is set, global addresses are expanded only till the given limit\n            Default value is 1000\n        "
