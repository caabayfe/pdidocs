description: "UTC date/time when basic-auth restriction enforcement begins. Format: YYYY-MM-DD HH:mm:ss, interpreted in UTC regardless of the instance's display time zone - e.g. 2026-06-01 00:00:00 activates at 5pm PT on May 31, not at midnight local. Until this time, users authenticating via basic auth are auto-granted the snc_basic_auth_api_access role so they keep working; after it, requests from users without the role are blocked."
