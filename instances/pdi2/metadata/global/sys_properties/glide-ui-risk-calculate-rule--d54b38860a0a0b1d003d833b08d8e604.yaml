description: Recommended best practice is to use a UI Action to calculate risk on demand which is the default OOB behavior. While this property allows for using a business rule to trigger the calculate risk action on insert/update, we do not recommend this method, because it requires precision alignment across the various risk methods. For example, a matching Risk Assessment requires human interaction which means that risk can no longer be evaluated automatically
