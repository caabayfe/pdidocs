description: |-
  Set the sys_id of default workflow that needs to be attached when escalating the conference call. 

  <!--
  Note: This is the default property that is used until the specific property for the task type is configured. To use different workflows for different task types (such as Incident, Problem and so on), create a new property by replacing <default> in key with task type.

  Example: For Incident, property key should be com.snc.notify.incident.conference_call_escalation_workflow. The property is enabled only when you activate the Notify plugin (com.snc.notify).
  -->
ignore_cache: 'false'
is_private: 'false'
