description: "<span style = 'font-family: Arial; font-size: 13px; color: #4a4a4a;'>Attributes in which max_length exceeds this property value (4000 by default) are excluded from the Select Main CI, Merge Attribute Values, and Determine Duplicate CI Actions tabs in the Duplicate CI Remediator wizard. However, if the max_length for an attribute is equal to the property value, and the size of the data exceeds the property value, then the data is truncated to the property value and the attribute appears in attribute lists. This property impacts the performance of de-duplication tasks, therefore be cautious about setting this value.<ul style='margin: 0px; padding-left:15px;'><li>Type: Integer</li><li>Default: 4000</li></ul></span>"
