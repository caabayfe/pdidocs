description: |-
  This property overrides the default behavior of disabling the Licensing Engine job when the system is detected as a ServiceNow instance.

  Values:
  false - The Licensing Engine follows standard behavior
  true - The Licensing Engine executes even though it was detected as a ServiceNow instance.
