description: |-
  This property controls if a mobile deep link will route to a public store if the app is not installed. 
  - true - it will send users to the public app stores if the native mobile app is not installed when the link is tapped.
  - false - falls back to use redirect object deep links.
ignore_cache: 'false'
is_private: 'false'
name: glide.sg.deeplink.route_to_public_store_if_not_installed
read_roles: mobile_admin
suffix: ''
sys_name: glide.sg.deeplink.route_to_public_store_if_not_installed
sys_policy: ''
type: boolean
value: 'true'
