description: |-
  This system property allows user to save the sort order prefereces on portal search.
  If this property value is true means when user changes the sort order option then it will save the sort order to user preference for that user and it will override the system preference in further portal search. 
  If the property value is false means we are not saving the user preference and it will always use system preference.
