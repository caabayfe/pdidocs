description: |-
  Some Notification content table which extends sys_notification_content, might need to be opt out from the Parent UI Policies to avoid conflict on writing UI Policy Actions on field which exists on both Child and Parent table. 

  In order to avoid conflict this property will provide comma sperated string value of tables names( child table names), which need to be opted out from the UI Policy written on sys_notification_content table.

  This Property is used in the UI Policy "Notifications should not be be madatory for default content"
