description: |-
  This property governs if an "all day" schedule rotation should change-over at midnight or at rotation start time. 
        
        If true, mandates daily rotation to occur at midnight. 
        If false, then use the time that is specified for the roster start time for the next day. 
        
        NOTE : This property will not affect Shifts updated in past. It will only effect Shifts which are updated after modifying the value.
