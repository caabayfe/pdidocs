choices: |-
  We are turning it off temporarily. We will enable it soon=temporarily_switching_off,
  We do not need MFA in non-production instances=non_prod_mfa_not_needed,
  Many users are complaining about MFA. They do not want to use it=user_complaint,
  Users are prompted for MFA too frequently=too_frequent_mfa,
  The instance does not have any sensitive data. MFA is not needed=non_sensitive_data,
  The supported MFA factors are not compliant with our organization's security policy=non_compliant_mfa_factors,
  We want to use a different MFA factor that is not currently supported by the platform=need_different_mfa_factor,
  MFA is an administrative overhead. Handling frequent MFA resets due to lost devices takes a lot of time=admin_overhead,
  Users are unable to use the MFA factors supported by the platform=factor_unusable,
  Our users are not tech-savvy they are unable to use MFA=non_tech_savvy_user_mfa_friction,
  We already have IP restrictions enabled on our instance. We do not need MFA protection=ip_restrictions_enabled,
  MFA significantly increases the login time=increase_in_login_time,
  A specific platform feature has stopped working due to MFA=broken_feature,
  The user experience of MFA is not optimal=sub_optimal_ux,
  The MFA feature has a defect. Because of this we are turning off the feature=mfa_feature_defect,
  A specific third-party integration is being broken due to MFA=broken_intergation,
  Other reasons that are not listed above=other
