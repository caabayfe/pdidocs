choices: RETRY_FIELD, TOPIC_DISCOVERY_TOPIC
description: A Virtual Agent mid-topic discovery fallback policy. It instructs the VA engine on how to behave when a midtopic search returns 0 usable results.  The default behavior is RETRY_FIELD, which means the chat user will be re-prompted to answer the same question.  When TOPIC_DISCOVERY_TOPIC is the value, the VA engine redirects to the _topic_discovery_ topic. This topic may in fact lead to other pathways, including an AI Search.
