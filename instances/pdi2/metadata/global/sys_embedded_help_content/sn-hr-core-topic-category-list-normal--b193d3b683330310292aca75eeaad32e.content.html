   <h1 class="title topictitle1" id="ariaid-title1">HR service topic categories</h1>      <div class="body conbody">      <p class="p">With <span class="ph uicontrol">Topic Categories</span>, you can create or modify HR topic categories to      define the first-level of categorization for HR services. Each topic category is associated      with a single HR Center of Excellence (COE).</p>   </div>
