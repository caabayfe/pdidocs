

 <h1 class="title topictitle1" id="ariaid-title1">Localize widget titles</h1>

  
 
 <div class="body conbody"><p class="shortdesc">Localize widget titles to verify that you see widget names in their preferred language. Default widgets include localization. You must only localize titles when you rename a default widget or create a custom widget.</p>

  <div class="section" id="sem-loc-widget-titles__section_v2t_4tl_3hc">
   
   <p class="p">For more information, see <a class="xref" href="https://www.servicenow.com/docs/access?context&#61;sem-localize-widget-titles&amp;version&#61;australia&amp;pubname&#61;australia-security-management&amp;ft:locale&#61;en-US" target="_blank" rel="noopener noreferrer">Localize widget titles</a>.</p>

  </div>
