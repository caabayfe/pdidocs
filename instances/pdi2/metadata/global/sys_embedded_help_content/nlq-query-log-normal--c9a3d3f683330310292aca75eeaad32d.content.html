   <h1 class="title topictitle1" id="ariaid-title1">NLQ log records</h1>         <div class="body conbody">      <p class="p">In NLQ log records, the Utterance field shows the plain-language request entered by the user.      Consider adding new synonyms or semantic shortcuts, based on the utterance, if the system was      not able to understand the user&#39;s request.</p>         </div>   <div class="related-links"><div class="linklist relinfo"><strong>Related topics</strong><br /><ul class="linklist"><li class="linklist"><a class="link">Using Natural Language Query</a></li></ul></div></div>
