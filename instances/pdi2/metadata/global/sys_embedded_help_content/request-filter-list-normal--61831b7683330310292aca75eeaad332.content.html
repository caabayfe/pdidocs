   <h1 class="title topictitle1" id="ariaid-title1">My Request Filter</h1>      <div class="body conbody">      <p class="p">Service catalog allows you to define the <span class="ph uicontrol">My Request Filter</span>. Use this to   define the filter that is relevant to your organization. Once the filter is created, the    <span class="ph uicontrol">My Requests</span> module under the Self-Service application is automatically   updated to use the filter defined by you.</p>   </div>
