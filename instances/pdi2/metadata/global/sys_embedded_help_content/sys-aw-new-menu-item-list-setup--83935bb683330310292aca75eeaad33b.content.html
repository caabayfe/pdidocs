   <h1 class="title topictitle1" id="ariaid-title1">New Record menu</h1>      <div class="body conbody">      <div class="section" id="sys_aw_new_menu_item_list-setup__section_utm_xcw_zcb">         <p class="p">Add a menu item for each table you want your agents to be able to create a record for in the    workspace.</p>         <p class="p">In the New Menu Item form, select a table from the list.</p>         <p class="p">In the order field, type a number for the order you want the item to appear in the list. Lower    numbers appear first.</p>      </div>   </div>
