   <h1 class="title topictitle1" id="ariaid-title1">HR benefit types list</h1>         <div class="body conbody"><p class="shortdesc">HR benefit types list allows you to create and maintain benefit types like health,    retirement, or insurance.</p>      <p class="p"><span class="ph">Benefit types are benefits offered by your company and the associated table.</span></p>      <p class="p">You can add or modify a benefit type using the Managed Lists module.</p>   </div>
