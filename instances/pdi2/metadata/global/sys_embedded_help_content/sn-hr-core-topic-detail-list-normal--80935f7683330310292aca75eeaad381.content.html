   <h1 class="title topictitle1" id="ariaid-title1">HR service topic detail</h1>      <div class="body conbody">      <p class="p">With <span class="ph uicontrol">Topic Details</span>, you can create or modify HR topic details to      define the second-level of categorization for HR services. Each topic detail is associated      with a single topic category and HR Center of Excellence (COE).</p>   </div>
