   <h1 class="title topictitle1" id="ariaid-title1">Financial models</h1>      <div class="body conbody">      <p class="p">Cost models are financial models that are associated with allocations and reports.</p>      <p class="p">Review the default cost models and configure them to align with your business requirements.</p>      <p class="p">To modify a cost model, click the name of the model.</p>      <p class="p">To create a cost model, click <span class="ph uicontrol">New</span>.</p>   </div>
