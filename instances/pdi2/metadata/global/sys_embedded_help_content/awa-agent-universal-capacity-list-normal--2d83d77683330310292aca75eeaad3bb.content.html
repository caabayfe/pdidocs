   <h1 class="title topictitle1" id="ariaid-title1">Agent&#39;s maximum universal capacity</h1>      <div class="body conbody">      <p class="p">Prevent an agent from being assigned too many work items by configuring the agent&#39;s maximum      universal capacity. If the agent&#39;s maximum universal capacity has been reached, additional      work items will not be assigned to the agent.</p>   </div>   <div class="related-links"></div>
