

   <h1 class="title topictitle1" id="ariaid-title1">Consumable assets</h1>

   
   
   <div class="body conbody"><p class="shortdesc">Consumables are used to track an asset as a group of the same model. View the list of consumable asset records. Search and select the record to view the details. You can also export the list or create a consumable
      asset.</p>

      <p class="p">You can select <span class="ph uicontrol">New</span> to create a consumable asset.</p>

   </div>
