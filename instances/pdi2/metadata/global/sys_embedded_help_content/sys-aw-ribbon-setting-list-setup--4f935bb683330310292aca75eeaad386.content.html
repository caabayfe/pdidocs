   <h1 class="title topictitle1" id="ariaid-title1">Ribbon settings</h1>      <div class="body conbody">      <div class="section" id="sys_aw_ribbon_setting_list-setup__section_xp1_mkf_hmb">         <p class="p">The form ribbon is a collapsible bar that runs across the top of the form and contains    at-a-glance information about the record. To configure the information that appears in the    ribbon, click <span class="ph uicontrol">New</span>.</p>      </div>   </div>
