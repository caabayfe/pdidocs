   <h1 class="title topictitle1" id="ariaid-title1">Associate a Service Catalog with Agent Workspace</h1>      <div class="body conbody">      <p class="p">To order catalog items in <span class="ph">Agent Workspace</span> you need to            associate a Service Catalog.</p>      <p class="p">Associate a catalog with <span class="ph">Agent Workspace</span> by selecting the            name of the catalog from the related list.</p>   </div>
