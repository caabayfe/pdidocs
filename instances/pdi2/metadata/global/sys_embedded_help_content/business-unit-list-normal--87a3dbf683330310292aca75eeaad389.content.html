   <h1 class="title topictitle1" id="ariaid-title1">Business units</h1>      <div class="body conbody">      <p class="p">Business units are a part of an organization that do a specific business function.</p>      <p class="p">Review the list of default business units and configure them to align with your business   needs.</p>      <p class="p">To modify a business unit, click the business unit name.</p>      <p class="p">To add a new business unit, click <span class="ph uicontrol">New</span>.</p>   </div>
