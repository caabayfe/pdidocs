   <h1 class="title topictitle1" id="ariaid-title1">Cost allocation metrics</h1>      <div class="body conbody">      <p class="p">Cost allocation metrics allocate expenses based on weighted metrics, scripted weighted metrics,   or scripted method.</p>      <p class="p">To modify or delete a cost allocation metric, click the record in the    <span class="ph uicontrol">Name</span> column.</p>      <p class="p">To add a cost allocation metric, click <span class="ph uicontrol">New</span>.</p>   </div>
