   <h1 class="title topictitle1" id="ariaid-title1">Investment entities</h1>      <div class="body conbody">      <p class="p">Investment entities are the transaction tables that are enabled for funding. You can receive or   allocate funds through them.</p>      <p class="p">Open an entity from the list to edit or click <span class="ph uicontrol">New</span> to create a investment   entity.</p>   </div>   <div class="related-links"><div class="linklist relinfo"><strong>Related topics</strong><br /><ul class="linklist"><li class="linklist"><a class="link" href="https://servicenow.com/docs/csh?context&#61;CSHelp:CreateFundingEntity&amp;version&#61;australia" target="_blank" rel="noopener noreferrer">Create an investment entity</a></li></ul></div></div>
