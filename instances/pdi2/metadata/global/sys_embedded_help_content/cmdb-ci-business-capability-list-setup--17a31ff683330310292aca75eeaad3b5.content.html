   <h1 class="title topictitle1" id="ariaid-title1">Capabilities</h1>      <div class="body conbody">      <p class="p">Capabilities are the abilities of an organization to do an activity that help to accomplish its   goals.</p>      <p class="p">Review the list of capabilities and configure them to align with your business goals.</p>      <p class="p">To modify a capability, click the capability name.</p>      <p class="p">To add a new capability, click <span class="ph uicontrol">New</span>.</p>   </div>
