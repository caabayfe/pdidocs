   <h1 class="title topictitle1" id="ariaid-title1">HR templates</h1>      <div class="body conbody">      <p class="p">With <span class="ph uicontrol">HR Templates</span> you can create and modify templates to automatically      populate HR cases with service-related data, streamlining the case submission process. HR case      templates are based on system templates, but have a custom UI to reduce complexity.</p>   </div>
