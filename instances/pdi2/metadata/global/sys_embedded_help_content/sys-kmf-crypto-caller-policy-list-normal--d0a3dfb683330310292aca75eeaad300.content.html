   <h1 class="title topictitle1" id="ariaid-title1">Module access policy</h1>         <div class="body conbody">      <p class="p">Module access policies are the access control mechanisms that can be applied to cryptographic      modules to define instance-level controls. Module access policies are introduced with the Key      Management Framework (KMF) in the base system.</p>   </div>   <div class="related-links"><div class="linklist relinfo"><strong>Related topics</strong><br /><ul class="linklist"><li class="linklist"><a class="link" href="https://servicenow.com/docs/csh?context&#61;module-access-policy&amp;version&#61;australia" target="_blank" rel="noopener noreferrer">Module access policies</a></li></ul></div></div>
