   <h1 class="title topictitle1" id="ariaid-title1">Work items</h1>      <div class="body conbody">      <p class="p">Work items are a single piece of work handled by an agent from start to finish. For example,      one chat or one case is an object that is routed and assigned to agents. Only users with      awa_manager privileges can access the Management menu options.</p>   </div>   <div class="related-links"><div class="linklist relinfo"><strong>Related topics</strong><br /><ul class="linklist"><li class="linklist"><a class="link" href="https://servicenow.com/docs/csh?context&#61;work-items-awa&amp;version&#61;australia" target="_blank" rel="noopener noreferrer">Work items</a></li></ul></div></div>
