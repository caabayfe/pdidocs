   <h1 class="title topictitle1" id="ariaid-title1">Preprocessor</h1>      <div class="body conbody">      <p class="p">The log preprocessor lets you manipulate raw log data before the system maps and structures      it. It enables you to edit logs, drop log portions, and break up logs that contain multiple      events. You can also edit or remove sensitive data to prevent it from reaching the system.</p>   </div>   <div class="related-links"></div>
