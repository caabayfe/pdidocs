   <h1 class="title topictitle1" id="ariaid-title1">Muted alert metrics</h1>      <div class="body conbody">      <p class="p">The Muted metrics list shows all the muted metrics. When you mute an alert metric through the alert, the system stops generating alerts from it. Delete a muted metric from the table to make the system re-enable the muted alert         metric and start generating alerts from it again.</p>   </div>   <div class="related-links"></div>
