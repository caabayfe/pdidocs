  <h1 class="title topictitle1" id="ariaid-title1">Push Notification actions</h1>      <div class="body conbody">        <p class="p">A push action is a server-side script that runs when the instance receives a response to an actionable push message. Use push notifications to send messages to users when certain conditions are triggered on your instance, such as the      assignment of an incident to the user.</p>  </div>  <div class="related-links"></div>
