   <h1 class="title topictitle1" id="ariaid-title1">MID Server capability value test</h1>      <div class="body conbody">      <p class="p">You can use value tests to create capabilities that find devices        using values without requiring exact string matching. Action on these values is controlled        by a user-defined script.</p>   </div>   <div class="related-links"><div class="linklist relinfo"><strong>Related topics</strong><br /><ul class="linklist"><li class="linklist"><a class="link" href="https://servicenow.com/docs/csh?context&#61;CSHelp:MID_Server_Capability&amp;version&#61;australia" target="_blank" rel="noopener noreferrer">MID Server capabilities</a></li></ul></div></div>
