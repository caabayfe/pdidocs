   <h1 class="title topictitle1" id="ariaid-title1">HR client role rules</h1>      <div class="body conbody">      <p class="p"><span class="ph">You can control what HR functionality that an employee can      access using Client Roles. You can license all employees or provide HR services to users in a      specific location or group.</span></p>      <p class="p">Client roles define access within the application. For more information, see <span class="xref"></span>.</p>   </div>
