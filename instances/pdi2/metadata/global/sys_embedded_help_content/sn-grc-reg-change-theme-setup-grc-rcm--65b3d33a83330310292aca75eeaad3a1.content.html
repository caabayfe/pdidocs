   <h1 class="title topictitle1" id="ariaid-title1">Create new record for themes</h1>      <div class="body taskbody">      <ol class="ol steps" id="sn_grc_reg_change_theme-setup-grc_rcm__steps_o5d_xm2_dnb"><li class="li step">            <span class="ph cmd">In the <span class="ph uicontrol">Name</span> field, enter the name for the theme, for example, Operational Resilience, Privacy.</span>         </li><li class="li step">            <span class="ph cmd">In the <span class="ph uicontrol">Parent</span> field, select the parent for the theme                    from the lookup list.</span>         </li><li class="li step">            <span class="ph cmd">In the <span class="ph uicontrol">Description</span> field, enter the description for the                    theme.</span>         </li><li class="li step">            <span class="ph cmd">Click <span class="ph uicontrol">Submit</span>.</span>         </li></ol>   </div>
