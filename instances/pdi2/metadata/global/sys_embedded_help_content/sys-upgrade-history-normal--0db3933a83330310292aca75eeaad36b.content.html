   <h1 class="title topictitle1" id="ariaid-title1">Upgrade center history module form</h1>         <div class="body conbody">      <p class="p">The System Upgrades form is a read-only form generated when an instance is upgraded. The form      has all the history regarding the upgrade. You can also review the skipped records by      accessing the related lists in the form.</p>   </div>   <div class="related-links"><div class="linklist relinfo"><strong>Related topics</strong><br /><ul class="linklist"><li class="linklist"><a class="link" href="https://servicenow.com/docs/csh?context&#61;uc_upgrade_history&amp;version&#61;australia" target="_blank" rel="noopener noreferrer">Upgrade History module</a></li></ul></div></div>
