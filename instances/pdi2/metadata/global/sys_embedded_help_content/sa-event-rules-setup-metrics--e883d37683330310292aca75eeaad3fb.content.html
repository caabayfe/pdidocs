   <h1 class="title topictitle1" id="ariaid-title1">Create an event rule to map metrics to specific CI</h1>      <div class="body conbody">      <div class="section">         <p class="p">For example, in the Event Rule designer you can update the        event rule <span class="ph uicontrol">SCOM IIS Web Server</span> as follows:</p>         <ul class="ul" id="zz_sa_event_rules-setup-metrics__ul_zvk_s3j_yy"><li class="li">On the <span class="ph uicontrol">Event Filter</span> tab, define filter to match only IIS Web     Servers.</li><li class="li">On the <span class="ph uicontrol">Binding</span> tab, set <span class="ph uicontrol">Class</span> to      <kbd class="ph userinput">Microsoft IIS Web Server</kbd>.</li></ul>      </div>   </div>
