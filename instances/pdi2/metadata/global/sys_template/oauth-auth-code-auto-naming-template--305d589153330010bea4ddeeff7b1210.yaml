short_description: Template to pre-populate configuration for http connection with authorization code grant
show_on_template_bar: 'true'
stand_alone: 'false'
sys_name: OAuth_Auth_Code_Auto_Naming_Template
sys_policy: ''
table: sys_alias_templates
template: |-
  default_data_template={
    "credential": {
      "oauth_entity": {
        "oauth_entity_profile": [
          {
            "grant_type": "authorization_code",
            "name": "",
            "default": true,
            "oauth_entity_profile_scope": [
              "users:read.email"
            ]
          }
        ],
        "code_challenge_method": "S256",
        "type": "consumer",
        "oauth_entity_scope": [
          {
            "oauth_entity_scope": "users:read.email",
            "name": "email"
          }
        ],
        "client_id": "",
        "use_mutual_auth": false,
        "revoke_token_url": "https://<provider-domain-name>.com/oauth2/revoke",
        "default_grant_type": "authorization_code",
        "public_client": false,
        "oauth_api_script": "3e3a3a11c333210016194ffe5bba8f70",
        "name": "<provider-name> Spoke OAuth",
        "client_secret": "",
        "auth_url": "https://<provider-domain-name>.com/oauth2/auth",
        "token_url": "https://<provider-domain-name>.com/oauth2/token",
        "redirect_url": ""
      },
      "name": "",
      "table": "oauth_2_0_credentials"
    },
    "connection": {
      "use_mid": false,
      "connection_url": "",
      "name": "",
      "table": "http_connection"
    }
  }^dynamic_data_schema={
    "connection_fields": [{
  	"name": "connection.name",
  	"label": "Connection Name",
  	"type": "text",
  	"defaultValue": "<provider-name> Spoke Connection",
  	"hint": "Display name for the Connection",
          "mandatory":true
      },
      {
        "name": "connection.connection_url",
        "label": "Connection URL",
        "type": "text",
        "defaultValue": "https://<provider-domain-name>.com",
        "hint": "Connection URL for provider",
          "mandatory":true
      }
    ],
    "credential_fields": [
      {
        "name": "credential.oauth_entity.client_id",
        "label": "OAuth Client ID",
        "type": "text",
        "hint": "Client ID for provider",
          "mandatory":true
      },
      {
        "name": "credential.oauth_entity.client_secret",
        "label": "OAuth Client Secret",
        "type": "password",
        "hint": "Client Secret for provider",
          "mandatory":true
      },
      {
        "name": "credential.oauth_entity.redirect_url",
        "label": "OAuth Redirect URL",
        "type": "text",
        "defaultValue": "https://<instance-name>.service-now.com/oauth_redirect.do",
        "hint": "Callback URL for provider",
          "mandatory":true
      }
    ]
  }^on_edit_script=(function execute(aliasId, connectionSysId, jsonDefaultData, jsonDynamicData) {
     // aliasId: sys_id of the alias record
     // connectionSysId: sys_id of the connection record created by using the default and dynamic data
     // jsonDefaultData (String): The default JSON template data from template table
     // e.g. var jsonDefaultParsed = JSON.parse(jsonDefaultData);
     //      gs.info("default connection url =  jsonDefaultParsed["connection"]["connection_url"]);
     // jsonDynamicData (String): User input based on the key/values defined in "Dynamic Data"
     // e.g. var jsonDynamicParsed = JSON.parse(jsonDynamicData);
     //      gs.info("dynamic connection url =  jsonDynamicParsed["connection.connection_url"]);
  })(aliasId, connectionSysId, jsonDefaultData, jsonDynamicData);
  ^post_process_script=(function execute(aliasId, connectionSysId, jsonDefaultData, jsonDynamicData) {
     // aliasId: sys_id of the alias record
     // connectionSysId: sys_id of the connection record created by using the default and dynamic data
     // jsonDefaultData (String): The default JSON template data from template table
     // e.g. var jsonDefaultParsed = JSON.parse(jsonDefaultData);
     //      gs.info("default connection url =  jsonDefaultParsed["connection"]["connection_url"]);
     // jsonDynamicData (String): User input based on the key/values defined in "Dynamic Data"
     // e.g. var jsonDynamicParsed = JSON.parse(jsonDynamicData);
     //      gs.info("dynamic connection url =  jsonDynamicParsed["connection.connection_url"]);
  })(aliasId, connectionSysId, jsonDefaultData, jsonDynamicData);
  ^EQ
