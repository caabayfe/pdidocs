short_description: Template to pre-populate configuration for http connection with basic auth credentials
show_on_template_bar: 'true'
stand_alone: 'false'
sys_name: Basic_Auth_Template
sys_policy: ''
table: sys_alias_templates
template: |-
  default_data_template={
  	"credential": {
  		"user_name": "<user-name>",
          "password": "<password>",
  		"name": "<provider-name> Spoke Credential",
  		"table": "basic_auth_credentials"
  	},
  	"connection": {
  		"connection_url": "",
  		"name": "",
  		"table": "http_connection"
  	}
  }^dynamic_data_schema={
    "connection_fields": [{
  	"name": "connection.name",
  	"label": "Connection Name",
  	"type": "text",
  	"defaultValue": "<provider-name> Spoke Connection",
  	"hint": "Display name for the Connection", 
          "mandatory":true
      }, 
      {
        "name": "connection.connection_url",
        "label": "Connection URL",
        "type": "text",
        "defaultValue": "https://<provider-domain-name>.com",
        "hint": "Connection URL for provider", 
          "mandatory":true
      }
    ], "credential_fields": [
      {
        "name": "credential.user_name",
        "label": "User Name",
        "type": "text",
        "defaultValue": "",
        "hint": "Username for outbound authentication", 
          "mandatory":true
      }, 
      {
        "name": "credential.password",
        "label": "Password",
        "type": "password",
        "defaultValue": "",
        "hint": "Password for outbound authentication", 
          "mandatory":true
      }
    ]
  }^EQ
