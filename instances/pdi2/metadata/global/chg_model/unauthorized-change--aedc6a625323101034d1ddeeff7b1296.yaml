description: ITIL unauthorized change is a modification to an organization's Configuration Items and Services, that bypasses the formal change management process and lacks proper approval, as well as violating defined and agreed Change policies. While often done by accident these can also be made with malicious intent and are all a serious policy breach that can lead to service disruption, data loss, and security vulnerabilities. The process here is to ensure that a change request is created to track the unauthorized alteration and bring it into control and visibility of service owners and change manageer. It includes processes to identify the reason for the unauthorised change, to prevent future events and to track incidents associated to the alteration. It will answer the the questions who (who made the change), when (when did the change occur), what (what CI/service was altered) and why (accident or malicious intent).
