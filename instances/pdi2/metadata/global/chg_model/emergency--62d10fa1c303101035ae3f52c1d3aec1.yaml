description: ITIL Emergency Changes are initiated in response to urgent incidents or vulnerabilities that require immediate attention and alteration to an organization's Configuration Items and Services. These changes are implemented as quickly as possible to restore service and mitigate the risk. Often their implementation has an expedited approval process, due to their time sensitive nature. These changes are still intended to be small to moderate in scope, with clearly defined steps to implement, and adhering to many of the process steps defined in a Normal Change process, but streamlined in order to respond to the urgency of the situation. When an Emergency change conflicts (overlaps in time) with a Normal change i.e. CI and/or Service and/or assigned to the same engineer, the Emergency change should take precedence, canceling or altering the Normal change scheduled implementation time.
