description: ITIL Normal Change process for less frequent modification to an organization's Configuration Items and Services, with complex pre-defined steps to implement. The scope of these changes is substantial and therefore require risk evaluation to identify known issues that may adversely affect the outcome of the change. They require a formal review and approval processes and may even require approval to be done through a formal Change Advisory Board (CAB) meeting. These changes need planning and scheduling inside maintenance schedules and outside blackout windows associated to the Configuration Items and/or Services they will be altering. They need identification of impacted services and conflict checking among different groups/assigned to users along with associated Configuration Items.
