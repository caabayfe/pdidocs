description: 'System process: In Windows operating system, "System Idle Process" is not actually a process, but rather a system idle task that runs when the CPU has nothing else to do. It represents the percentage of time the CPU is idle and available to handle other processes. So, it is an important system component that shows the current CPU usage when no other processes are running.'
