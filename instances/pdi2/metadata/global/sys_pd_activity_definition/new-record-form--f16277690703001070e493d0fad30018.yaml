description: |-
  <p>Pause the process until an agent creates a record. Specify the table name where the record will be created, and specify the form view to display. This activity can pause a process indefinitely if the record is not created. If you never want to pause the process for user input, use the <b>Create New Record</b> activity instead.</p>
        <p>The Now Platform validates the record prior to creation against your server-side rules such as business rules, data policies, and mandatory fields. The form runs any UI policies that apply. The system displays any validation error messages in the Workspace playbook.</p>
        <p><b>Required Inputs:</b></p>
        <ul>
        <li><b>Table Name</b> - Table for new record</li>
        </ul> <p><b>Optional Inputs:</b></p> <ul>
        <li><b>Create Record View</b> - Name of the form view to display</li>;
        </ul>  <p><b>Outputs:</b></p><ul>
        <li><b>Table</b> - Table for the new record</li>
        <li><b>Create Record View</b> - Name of the form view displayed</li>
        <li><b>Record Created</b> - Sys ID of the record created</li>
        </ul>
