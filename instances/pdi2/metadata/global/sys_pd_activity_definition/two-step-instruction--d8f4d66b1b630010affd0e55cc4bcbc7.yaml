description: |-
  <p>Multi-step manual Instruction for use with Agent Workspace Playbook Experience, allowing for the process author to define an initial message, skipped message, and completed message to display to the agent.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Initial Message</b> - Message to show when process activity is "In Progress"</li>
  <li><b>Skipped Message</b> - Message to show when process activity is "Skipped"</li>
  <li><b>Completed Message</b> - Message to show when process activity is "Complete"</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul><li><b>Record</b> - Flow Data Record.</li></ul>
  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Assignment Group</b> - (Optional) group to complete process data input</li>
  <li><b>Assigned To</b> - (Optional) user to complete process data input</li>
  </ul>
