description: |-
  <p>Creates a checklist on a new or existing Task record and waits for all items in the checklist to be complete.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Checklist Items</b> - A list of items to include in the checklist separated by line breaks. Required.</li>
  <li><b>Checklist Name</b> - A name to use for the checklist that is created.</li>
  <li><b>Task</b> - Task record that the checklist is being attached to. If none is provided, one is created.</li>
  <li><b>Can Skip</b> - Whether or not a user can skip this activity.</li>
  <li><b>Show SLA</b> - Whether or not to display an SLA countdown for this Task.</li>
  <li><b>Checklist Owner</b> - User that is set as the owner of this checklist.</li>
  </ul>

  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Skip Assignment Group</b> - Group that is allowed to skip this activity if "Can Skip" is true.</li>
  <li><b>Skip Assigned To</b> - User that is allowed to skip this activity if "Can Skip" is true.</li>
  </ul>
