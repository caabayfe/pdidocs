description: |-
  <p>Create a user task.</p><p>When this activity runs, it will optionally prompt the user to confirm the assignment and task description.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Assigned To</b> - User Form</li>
  <li><b>Short Description</b> - Task short description</li>
  <li><b>Wait</b> - Wait for task record to be in an inactive state</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for the new record.</li>
  <li><b>Record</b> - Reference to record created.</li>
  </ul>

  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Assigned To User for this Process Step</b> - User allowed to perform this process activity</li>
  <li><b>Assignment Group for this Process Step</b> - Assignment group allowed to perform this process activity.</li>
  <li><b>Wait for task completion</b> - Wait until the associated task is no longer active, then continue the process execution.</li>
  <li><b>Table</b> - Table for the new record.</li>
  <li><b>Additional Fields</b> - Additional record fields.</li>
  <li><b>Fields to show after record creation</b> - Task fields to display once in the Agent Workspace.</li>
  </ul>
