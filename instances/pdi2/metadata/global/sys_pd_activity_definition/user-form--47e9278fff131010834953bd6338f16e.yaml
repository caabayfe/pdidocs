description: |-
  <p>Displays a form for a given record along. Users can update the record and manually mark the activity as complete or skipped.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for the user form</li>
  <li><b>Record</b> - Record displayed in the user form</li>
  <li><b>Form View</b> - UI view to use in the user form</li>
  <li><b>Form Fields</b> - Fields to display in the user form</li>
  <li><b>Display Fields</b> - Label and value fields to display above the user form.</li>
  <li><b>Footer</b> - Displayed below the form.</li>
  <li><b>Show Attachments</b> - When selected, includes attachments in the user form.</li>
  <li><b>Show SLA</b> - When selected, shows an SLA timer for the record.</li>
  <li><b>Show Checklist</b> - When selected, shows a checklist for the record.</li>
  <li><b>Assignment Group</b> - (Optional) Group required to complete, skip or restart the activity.</li>
  <li><b>Assigned To</b> - (Optional) User required to complete, skip or restart the activity.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for the user form</li>
  <li><b>Record</b> - Record updated in the user form</li>
  </ul>
