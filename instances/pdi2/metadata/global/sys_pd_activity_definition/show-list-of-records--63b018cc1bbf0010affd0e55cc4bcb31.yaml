description: |-
  <p>Show a list view of records, for use with Agent Workspace Playbook experience. Process activity optionally waits before proceeding with process execution.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Table</b> - Table to query</li>
  <li><b>Conditions</b> - Conditions to query for</li>
  <li><b>Fields to show</b> - Columns to show in list results</li>
  <li><b>Wait for user input</b> - Pauses process execution until user manually completes the process activity</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Record</b> - Flow Data Record.</li>
  <li><b>Fields</b> - Comma delimited list of columns specified in <b>Fields to show</b> input.</li>
  </ul>
  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Assignment Group</b> - (Optional) group to complete process data input</li>
  <li><b>Assigned To</b> - (Optional) user to complete process data input</li>
  </ul>
