description: |-
  <p>Use an AI agent to carry out specific tasks or operations based on instructions you give it.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Assignment Group</b> - (Optional) Group who can prematurely complete, skip or restart the activity even while agents are running.</li>
  <li><b>Assigned To</b> - (Optional) User who can prematurely complete, skip or restart the activity even while agents are running.</li>
  <li><b>AI Agent</b> - Agent who will be executing when this activity starts.</li>
  <li><b>Objective</b> - Instructions to AI Agent explaining what their responsibilities are.</li>
  <li><b>Conversation Label</b> - The label of agentic conversation.</li>
  <li><b>Additional Inputs</b> - Additional information for running agentic activity.</li>
  <li><b>Expected Outputs</b> - Outputs expected when agents are completed.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Agent Outputs</b> - The output returned by agent after execution.</li>
  <li><b>Status</b> - To store information about agent execution (success/error).</li>
  </ul>
