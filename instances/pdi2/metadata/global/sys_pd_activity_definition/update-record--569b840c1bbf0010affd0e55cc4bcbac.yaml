description: |-
  <p>Update an existing record on a ServiceNow table. When this activity runs, it will immediately finish and continue the process execution. You can dynamically add and configure fields for the record. Server-side validation rules are enforced (data policy, business rules, dictionary-defined mandatory fields), but UI policy does not apply.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Record</b> - Record to receive updates</li>
  <li><b>Table</b> - Table for record update</li>
  <li><b>Fields</b> - Field values to update</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for the updated record.</li>
  <li><b>Record</b> - Reference to record updated.</li>
  </ul>
