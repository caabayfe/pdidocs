description: |-
  <p>Update an existing record on a ServiceNow table. When this activity runs, it will optionally wait for user confirmation before updating the record, then continue the process execution.. You can dynamically add and configure fields for the record. Server-side validation rules are enforced (data policy, business rules, dictionary-defined mandatory fields), but UI policy does not apply.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for record update</li>
  <li><b>Record</b> - Record to receive updates</li>
  <li><b>Fields</b> - Field values to update</li>
  <li><b>Wait for user input</b> - Pauses process execution until user manually completes the process activity</li>
  <li><b>Fields to show after creation</b> - Record fields to show in agent Playbook agent experience once the update is complete</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for the new record.</li>
  <li><b>Record</b> - Reference to record created.</li>
  </ul>
  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Assignment Group</b> - (Optional) group to complete process data input</li>
  <li><b>Assigned To</b> - (Optional) user to complete process data input</li>
  </ul>
