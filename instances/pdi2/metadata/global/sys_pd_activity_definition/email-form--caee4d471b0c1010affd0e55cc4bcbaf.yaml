description: |-
  <p>Send Email process activity, with optional confirmation of email subject and body. Email recipients are defined by the process author. Sends a standard ServiceNow outbound email.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>To</b> - Recipient user list for the email</li>
  <li><b>To Email Address</b> - Recipient email address.  Emails separated by comma.</li>
  <li><b>Cc</b> - Cc recipient user list for the email</li>
  <li><b>Cc Email Address</b> - Cc recipient email address.  Emails separated by comma.</li>
  <li><b>Bcc</b> - Bcc blind copy recipient user list for the email</li>
  <li><b>Bcc Email Address</b> - Bcc blind copy recipient email address.  Emails separated by comma.</li>
  <li><b>Subject</b> - Subject of the email</li>
  <li><b>Body</b> - Body of the email</li>
  <li><b>Wait for user input</b> - Option to pause the process until the end user manually completes or skips the activity</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Record</b> - Flow Data Record</li>
  <li><b>Email</b> - Email Record</li>
  </ul>
  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Assignment Group</b> - Group responsible for completing the task associated with the activity</li>
  <li><b>Assigned To</b> - User responsible for completing the task associated with the activity</li>
  <li><b>Table</b> - Table for the target record</li>
  <li><b>Target Record</b> - Record that the system attaches the email to</li>
  </ul>
