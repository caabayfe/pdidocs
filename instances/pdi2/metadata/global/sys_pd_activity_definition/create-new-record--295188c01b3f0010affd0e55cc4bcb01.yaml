description: |-
  <p>Create a record on any ServiceNow table. When this activity runs, it will immediately finish and continue the process execution. You can dynamically add and configure fields for the record. Server-side validation rules are enforced (data policy, business rules, dictionary-defined mandatory fields), but UI policy does not apply.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Table Name</b> - Table for new record</li>
  <li><b>Fields</b> - Field values for new record</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for the new record.</li>
  <li><b>Record</b> - Reference to record created.</li>
  </ul>
