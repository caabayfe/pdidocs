description: |-
  <p>Look up multiple records on any ServiceNow table. You can configure the conditions for the records found. The output includes a list of records and the number of records found. Note: The maximum number of records that can be returned is configured by a property and by default is 10K records. If more than 10K records are found, only the first 10K are returned.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Table</b> - Table for record update</li>
  <li><b>Conditions</b> - Condition filter against target table</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Record</b> - List of records</li>
  <li><b>Count</b> - Count of records returned</li>
  </ul>
