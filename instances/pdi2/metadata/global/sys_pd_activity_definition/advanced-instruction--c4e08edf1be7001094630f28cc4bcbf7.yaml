description: |-
  <p>Advanced Instruction for use with Agent Workspace Playbook Experience, allowing for the process author to define all labels and messages show in the instruction card.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Title</b> - Title that will be displayed in Playbook experience</li>
  <li><b>Description</b> - Description message that will be displayed in Playbook experience.</li>
  <li><b>Tag Line</b> - Header tag-line message for Playbook experience component.</li>
  <li><b>Footer</b> - Footer message for Playbook experience component.</li>
  <li><b>Wait for user input</b> - Pauses process execution until user manually completes the process activity</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul><li><b>Record</b> - Flow Data Record</li></ul>
  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Assignment Group</b> - (Optional) group to complete process data input</li>
  <li><b>Assigned To</b> - (Optional) user to complete process data input</li>
  </ul>
