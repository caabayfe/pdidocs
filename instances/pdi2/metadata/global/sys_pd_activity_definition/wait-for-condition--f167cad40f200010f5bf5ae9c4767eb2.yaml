description: |-
  <p>Wait for condition action causes the process to wait until the record matches the specified condition. Use this activity to block the process indefinitely, until a particular condition is met. You must populate the condition field.</p> 
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Record</b> - Record to wait for the specified update</li>
  <li><b>Table</b></li>
  <li><b>Conditions</b> - Conditions that must be met before completing this process activity</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul><li><b>None</b></li></ul>
  <p><b>Advanced Properties:</b></p>
  <ul>
  <li><b>Enable timeout</b> - (optional) timeout and automatically proceed after specified duration</li>
  <li><b>Duration</b> - (optional) only valid if <b>Enable timeout</b> is checked</li>
  <li><b>Schedule</b> - (optional) only valid if <b>Enable timeout</b> is checked, and used to account for scheduled work days or durations</li>
  </ul>
