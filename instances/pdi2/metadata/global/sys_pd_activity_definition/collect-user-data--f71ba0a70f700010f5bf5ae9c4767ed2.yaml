  <ul>
  <li><b>User form for data collection</b> - The definition of inputs to collect from the user</li>
  <li><b>Wait for user input</b> - Pauses process execution until user manually completes the process activity</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  <li><b>Record</b> - Reference to record containing collected data.</li>
  </ul>
  <p><b>Advanced Properties:</b></p>
