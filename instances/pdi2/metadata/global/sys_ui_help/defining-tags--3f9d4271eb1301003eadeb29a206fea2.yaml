  <div class="m_help_page" >
  == Defining Tags ==
  <p>To help group and organize records, users can create tags and add them to specific records. You could create a tag called <strong>High Priority ABC</strong> and assign that label to critical incidents submitted by an important customer. Tags can be defined with an icon and color for easy identification. With a single tap, a user could then locate all critical incidents logged by ABC Corporation. Users can add as many tags as needed to any record.</p> <p><strong>Creating a New Tag</strong></p> <ol> <li>On the Home screen, tap the Tags section heading. You can also tap <strong>My Tags</strong> on the application navigator. <br />Previously-defined tags (if any) are displayed. Notice the number 1 in the <strong>High Priority</strong> tag. This indicates that one record has been assigned this tag.<br />[[image:6D353697-817E-42AD-A6AA-9C064B6B9FC2.png]]</li><li>Tap in the <strong>Create or search labels</strong> field and type the name of the tag you want to create. As you type, the new tag appears below the field.<br /> [[image:7C310877-20FB-421D-9909-997EF0BBCB04.png]]</li><li>When you are finished, tap <strong>Done</strong>.<br />[[image:E50ABD44-319A-499E-B47A-55DB1AB29B38.png]]</li><li>Select a color and icon for the new tag, and tap <strong>Save</strong>.<br />[[image:AD24ED42-7615-4A11-87E4-2A6DDB817C36.png]]</li></ol>
  </div>
