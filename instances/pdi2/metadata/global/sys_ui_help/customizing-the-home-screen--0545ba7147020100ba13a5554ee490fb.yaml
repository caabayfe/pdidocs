  <div class="m_help_page" >
  == Customizing the Home Screen ==
  <p>The information on the Home screen can be filtered so that any combination of the following types of information are displayed:</p> <ul> <li>Favorites</li> <li>Recent Lists</li> <li>Labels</li> <li>Recent Documents</li> </ul> <p>By default, all four types of information are displayed.</p> <p>To change the types of information you want displayed on the Home screen, tap the gear icon.</p> [[image:Customizing-the-Home-Screen.png]] <p>The Tools screen opens.</p> [[image:F436D2AD-6065-40B1-B317-2E734ACD22AC.png]] <p>For each of the sections, you can tap the <strong>Show section</strong> to toggle that section on and off. Each of the sections also contain options for limiting the number of items shown and enabling or disabling horizontal scrolling, where applicable.</p> 
  </div>
