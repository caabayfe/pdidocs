  == Managing Favorites ==
  <p>You can add any list, record, module, or [stream] to the Favorites section of the home screen. The items you have added to the Favorites section display as [labels]. Use the favorites for quick access to the items that you use most often.</p> <p><strong>To add an item to the favorites section:</strong></p> <ol> <li>Navigate to the screen that you want to add as a favorite to the home screen.</li> <li>Tap and hold the <strong>Home Icon</strong>.<br />[[image:Managing-Favorites.png]]<br />The <strong>Save Favorite to Home Page</strong> dialog box opens.</li><li>Give the favorite a name, assign its label a color and icon, and tap <strong>Save</strong>.<br />[[image:DB3FA08C-7405-4D9F-B06F-C4426EAA8653.png]]</li> </ol> <p><strong>To change or remove a favorite:</strong></p><ol><li>On the Home screen, tap the Favorites section heading.<br />The labels for your favorites are displayed.</li> <li>Locate the favorite you want to change, and tap and hold the label until the Save Favorite to Home Page dialog box opens.</li><li>Change the name, color, or icon as needed and tap Save.</li><li>To remove the favorite from the Home screen, tap the trash can button.<br />[[image:0214ADAF-1C76-4E34-966F-0EBD09534402.png]]</li></ol>
  </div>
