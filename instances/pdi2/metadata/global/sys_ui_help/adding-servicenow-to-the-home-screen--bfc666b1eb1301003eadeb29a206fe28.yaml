  == Adding ServiceNow to the Home Screen ==
  <ol> <li>Navigate to a page that you want to access as a shortcut, such as a list of open incidents.</li> <li>Tap the sharing icon at the bottom of the Safari browser.<br />[[image:Adding-ServiceNow-to-the-Home-Screen.png]]</li><li>Tap the ServiceNow Add to Home Screen icon.<br />[[image:7C1A05E0-F8B4-435B-9C0B-C8C11AAA0B5B.png]]</li><li>Type a descriptive name for the page and tap Add. The shortcut is saved to your device.<br /> [[image:BA4ACF5F-883B-4C46-BF9F-D0C175537FA8.png]]<br />[[image:5837646D-4201-4F3A-A2E5-1EA5B8A017C9.png]]</li></ol>
  </div>
