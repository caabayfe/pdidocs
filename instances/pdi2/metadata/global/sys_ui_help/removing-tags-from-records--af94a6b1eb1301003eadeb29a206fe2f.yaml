  <div class="m_help_page" >
  == Removing Tags from Records ==
  <ol><li>Navigate to the record from which you want to remove a tag.</li> <li>Tap inside the record.</li> <li>Tap the <strong>More</strong> icon and select <strong>Tags</strong>.</li> <li>Tap the tag you want to remove from the record. The checkmark disappers to indicate that the tag has been removed.</li> </ol><p><strong>Viewing Recently Accessed Documents</strong></p> <p>The Recent Documents section of the Home screen provides an at-a-glance summary of recently accessed records. This feature allows you to avoid tapping through the application navigator to access a record that you need frequently or a record you have just viewed. To view details of one of the recently viewed documents, simply tap the record.</p> 
  </div>
