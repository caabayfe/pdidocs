  <div class="m_help_page">
  == Accessing an Instance ==
  <p>On a mobile device that meets the mobile device support requirements, access the standard URL of an instance. The ServiceNow instance automatically detects the device and redirects to the mobile device interface by appending $m.do to the end of the URL. Accessing one interface (mobile, tablet, or desktop) does not prevent the user from accessing any of the other interfaces.</p> [[image:Accessing-an-Instance.png]]
  </div>
