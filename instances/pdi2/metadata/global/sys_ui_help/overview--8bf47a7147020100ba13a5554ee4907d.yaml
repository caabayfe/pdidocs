  == Overview ==
  <p>The mobile interface supports many of the features found in the ServiceNow browser interface, including:</p> <ul> <li>Lists</li> <li>Forms</li> <li>Navigation pane</li> <li>Filtering</li> </ul> <p>Additionally, several UI changes that affect how users perform important actions have been implemented. These include:</p> <ul> <li>Tags and Favorites on the home page.</li> <li>Memory of recent selections, lists, and documents.</li> <li>Journal streams.</li> </ul> 
  </div>
