  <div class="m_help_page">
  == Viewing Journal Streams ==
  <p>A journal stream is a real-time, sequential display of journal field entries, such as comments and work notes, from a group of records. You can, for example, view a stream of incident work notes. The stream automatically aggregates all of the journal field entries from incidents and displays them, starting with the most recently created record.</p> <ol> <li>Navigate to a list screen that contains journal fields.</li> <li>Tap the Stream icon. If no journal entries have been created for the type of records you are viewing, the <strong>Stream</strong> icon will not be displayed.<br />[[image:Viewing-Journal-Streams.png]] <br />Comments and work notes for the incidents display, starting with the most recent.<br />[[image:38846343-42D9-4F4E-8777-19787DBA7A1E.png]]</li></ol>
  </div>
