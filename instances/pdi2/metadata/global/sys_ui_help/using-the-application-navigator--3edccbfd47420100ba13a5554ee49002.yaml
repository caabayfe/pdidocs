  <div class="m_help_page" >
  == Using the Application Navigator ==
  <p>To open the application navigator, tap the application navigator icon on the top-left side of the interface.</p> [[image:Using-the-Application-Navigator.png]] <p>Scroll the navigator up or down using one or two fingers. To expand an application, tap the application name. To hide the navigator, click the application navigator icon again.</p> [[image:ECAB8F2C-FB09-44F0-8319-7E12FA884FB0.png]] 
  </div>
