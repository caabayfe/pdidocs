  == Recently Accessed Lists ==
  <p>The Recent Lists section of the Home screen shows the most recent lists you have viewed and record selections you have made. This makes it easy, for example, to return to a list of Priority 1 incidents with a single tap. Or you can return to a particular user's record that you performed some action on recently.</p> <p>Whenever you view a particular list or make a selection, the system remembers it and displays it in the Recent Lists section of the Home screen and records how long ago you viewed it. To view the details of the list or selection, simply tap the row you are interested in.</p><p><strong>Modifying a Recently Accessed List</strong></p><ol><li>Tap on the recently-viewed list you want to modify.<br />[[image:08C4AAB8-434F-47A2-9650-41B8AD706580.png]]<br />The list opens in the module form which you viewed it. In the example, the list opens in Incident.</li><li>Tap the filter.<br />[[image:C7D63AC7-8369-4E38-AE4A-B6E6A9C220EE.png]]<br />The filter editor opens.<br />[[image:A9685335-4A47-4A8E-BEEC-9DE558F0C4DB.png]]<br />The Filter Editor shows the current filter and lists the other available conditions that can be added to the filter.</li><li>To delete one of the conditions, tap the X adjacent to that condition.</li><li>To add a condition, tap it.<br />The resulting screen depends on the type of condition. If you tap a text field, such as <strong>Short Description</strong>, you are presented with a text field. If you tap a conditional field, such as <strong>Category</strong>, you are presented with a list of available operators. So you can select, for example: <strong>Category - is not - Software</strong>.</li><li>When you are finished defining the filter, tap <strong>Run</strong>.</li></ol>
  </div>
