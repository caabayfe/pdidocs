  <div class="m_help_page" >
  == Assigning a Tag to a Record ==
  <ol> <li>Navigate to a record that you want to assign a tag to, such as an incident record.</li><li>Tap the <strong>More</strong> icon in the lower right-hand corner of the screen and select <strong>tags</strong>.<br />[[image:Assigning-a-Label-to-a-Record.png]]</li><li>In the Tags screen, tap the tag to want to assign to this record.<br />Notice that a checkmark appears on the tag.<br />[[image:655C1C19-37A5-48E0-AC98-F5688FA2BAED.png]]</li><li>If needed, you can tap the tag again to deselect it. You can also select multiple tags for the record.</li> <li>When you are finished, simply navigate away from the screen. Your tag selections are automatically saved.</li></ol>
  </div>
