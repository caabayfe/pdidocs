  <div class="m_help_page" >
  == Accessing Records That Have Labels ==
  <p>The <strong>Labels</strong> section on the Home screen shows the labels you have defined and each label shows the number of records assigned to them.</p><ol><li>Tap the label to display records that have been assigned that label.<br />The screen shows the records with that label. Note that they are not necessarily the same kind of records. In the example below, the first record is an approval and the second is an incident.</li> <li>The records can be sorted by either the date of creation or update by tapping the buttons at the top of the screen.<br />[[image:Accessing-Records-That-Have-Labels.png]] </li></ol> 
  </div>
