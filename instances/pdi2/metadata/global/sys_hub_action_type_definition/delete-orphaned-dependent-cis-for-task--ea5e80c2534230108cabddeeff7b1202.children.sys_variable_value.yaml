  value: |-
    (function execute(inputs, outputs) {
      
        outputs.error = false;
        outputs.error_message = '';
        outputs.notes = '';
      
        var ciCount = 0;
        var deletedCiCount = 0;
        var skippedCiCount = 0;
        var nonOrphanedCis = 0;
      
        try {
            
            var helper = new global.CMDBDataManagerHelper();
        	var task_gr = inputs.task;
       		
        	var taskSysId = task_gr.getUniqueValue();
            
        	ciCount = helper.getCiCount(taskSysId);
          
            var batchSize = helper.getBatchSize();
           
        	var lastSysId = '';
        	var hasMore = true;
          	
          	var archiveBatchSize = helper.getArchiveBatchSize();
            var archiveDurationInDays = helper.getArchiveDurationInDays();
          
          	var chunkCIArray = [];
            var chunkIdx = 0;
            var chunkLen = 0;
            
        	while (hasMore) {
              
            	var ciResult = helper.getCiSysIds(lastSysId, batchSize, taskSysId);
                var ciData = ciResult.ciMap;
                lastSysId = ciResult.lastSysId;
                hasMore = ciResult.hasMore;
                var ciSysIds = [];
              
                // Get nonOrphanedCIs from this
    		    Object.keys(ciData).forEach(function(table) {
                  var ciList = ciData[table];
                  for (var index = 0; index < ciList.length; index++) {
                    var ci = ciList[index];
        		    if (SNC.CMDBDataManagerScriptableApis.isOrphanedDependent(ci)) {
                        ciSysIds.push(ci);
                    } else {
                        nonOrphanedCis++; 
                    }
                }}); 
          		
          		var filteredResults = helper.getFilteredCis(ciSysIds);
                
                if (filteredResults.validCis.length > 0) {
                    helper.deleteCis(filteredResults.validCis);
                    deletedCiCount =  deletedCiCount + filteredResults.validCis.length;

                    // Attach delete task related CI's SysIds to  the task record.
                    var taskToCiTable = task_gr.policy_id.cmdb_policy_type.task_to_ci_table.name + '';
                    helper.attachTaskAssociatedCISysIds(task_gr, task_gr.policy_id.cmdb_policy_type, taskToCiTable, filteredResults.validCis);

                }
                
              	//archive filtered cis
              	if(filteredResults.excludedCis.length > 0) {
                  	
                  	//make sure filteredResults.excludedCis.length <= archive max length (glide.db.archive.rule.api_max_records)
                    //chunk the excludedCis & invoke the archiveCis() by passing the chunked list
                    chunkCIArray = helper.chunkArray(filteredResults.excludedCis, archiveBatchSize);
                    if (chunkCIArray && chunkCIArray.length > 0){
                        chunkLen = chunkCIArray.length;
                    	for(chunkIdx = 0; chunkIdx < chunkLen; chunkIdx ++){
                			helper.archiveCis(chunkCIArray[chunkIdx], archiveDurationInDays);
                        }
                    }
                  
                   	// Update Skipped CI count
                   	skippedCiCount = skippedCiCount + filteredResults.excludedCis.length;
                }
        	} 
        } catch(e) {
        	outputs.error = true;
            outputs.error_message = e.getMessage();
        } finally {
        	outputs.notes = "Summary - Total CI Count:" + ciCount + " Deleted CI Count:" + deletedCiCount + " Archived CI Count:" + skippedCiCount + " Non-Orphaned CI Count:" + nonOrphanedCis;
        }
      
    })(inputs, outputs);
