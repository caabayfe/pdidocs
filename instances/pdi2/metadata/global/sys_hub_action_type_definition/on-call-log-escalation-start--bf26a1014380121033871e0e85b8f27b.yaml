description: |-
  Creates On-Call escalation log record<br/>
  <p style='margin-top: 10px'>
  <b>Inputs:</b><br/>
  <em><b>Table</b> - Table name of source record</em><br/>
  <em><b>Sys Id</b> - Sys Id of source record</em><br/>
  <em><b>Group Sys ID</b> - Sys Id of Group (sys_user_group) on which escalation is happening</em><br/>
  <em><b>Subflow Context Sys ID</b> - Sys Id of the context (sys_flow_context) of trigger subflow (scripted input: "FlowScriptAPI.getContextID()" from ongoing subflow)</em><br/>
  <em><b>Parent Escalation Level Sys ID</b> - Sys Id of parent escalation level record</em><br/>
  <em><b>Category</b> - Category of ongoing escalation (check choices available for category field on on_call_escalation table)</em><br/>
  <em><b>Channels</b> - List of supported channels (i.e. teams, slack, voice, sms, email, mobile_notification, conference_escalation etc)</em><br/>
  <em><b>Ignore Definition Reminders</b> - Boolean to decide if we can ignore definition reminders</em><br/><br/>
  <b>Outputs:</b><br/>
  <em><b>Escalation Record</b> - GlideRecord Object of the escalation (on_call_escalation) record created</em><br/>
  <em><b>State</b> - success or error</em><br/>
  <em><b>Error Message</b> - Error message in case of error state</em><br/>
