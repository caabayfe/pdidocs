  sys_tags: ''
  sys_updated_by: admin
  sys_updated_on: 2026-03-30 18:43:00
  value: |-
    (function execute(inputs, outputs) {
      
    	outputs.error = false;
      	outputs.error_message = '';
        outputs.notes = '';
        var ciCount = 0;
        var nonRetiredCis = 0;
        var ARCHIVE_JOB_SYS_ID = 'bd976a209f231000dada207c7f4bcc59';
      
        try {
    		var helper = new global.CMDBDataManagerHelper();
          
          var grArchiveJob = new GlideRecord('sys_trigger');
          if(!grArchiveJob.get(ARCHIVE_JOB_SYS_ID)) {
          	throw new Error('Archival of CIs will fail since Archive job  is not found or is not configured correctly. Please contact your administrator about it.');
          }

        	var task_gr = inputs.task;
          
        	var taskSysId = task_gr.getUniqueValue();
       
        	ciCount = helper.getCiCount(taskSysId);
          
            var batchSize = helper.getArchiveBatchSize();
           
        	var lastSysId = '';
        	var hasMore = true;
        	
      		while (hasMore) {
                var ciResult = helper.getCiSysIds(lastSysId, batchSize, taskSysId);
                var ciData = ciResult.ciMap;
                lastSysId = ciResult.lastSysId;
                hasMore = ciResult.hasMore;            
    			var totalCiCount = helper.fetchCiCount(ciData); 
                var ciSysIds = helper.getRetiredCis(ciData);
                nonRetiredCis += (totalCiCount - ciSysIds.length);
                
                var chunkIds = helper.archiveCis(ciSysIds, task_gr.policy_id.archive_for_days);
              	if(chunkIds == undefined || chunkIds.toArray().length == 0)
                  throw new Error("Failed to create archive chunk. No CIs will be archived under this task");
                var arrChunkIds = chunkIds.toArray();
              	for(var i = 0; i < arrChunkIds.length; i++) {
              		helper.createTaskToArchiveChunk(taskSysId, arrChunkIds[i]);
                }
        	}  
        } catch(e) {
        	outputs.error = true;
            outputs.error_message = e;
        } finally {
        	outputs.notes = "Summary - Total CI Count:" + ciCount + " Non-Retired CI Count:" + nonRetiredCis;
        }
      		
      
    })(inputs, outputs);
