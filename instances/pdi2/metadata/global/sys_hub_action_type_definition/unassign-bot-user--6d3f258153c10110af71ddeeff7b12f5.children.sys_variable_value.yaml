  value: |-
    (function execute(inputs, outputs) {
      var taskGr = new GlideRecord('task');
      taskGr.get(inputs.taskId);
      var contextGr = new AutoResolutionContextHelper().getContextFromTask(taskGr);
      var validContext = !gs.nil(contextGr);
      var unassignMsg = '';
      
      // Inactivate the context
      if (validContext) {
        contextGr.setValue('active', false);

        // Mark notitification state if we are unassigning for timeout
        if (inputs.timeout) {
          contextGr.setValue('notification_state', 'timeout');
          var contextHelper = new AutoResolutionContextHelper();
          unassignMsg = contextHelper.TIMEOUT_MSG;
        }
        contextGr.update();
      }
      
      var taskHelper = new AutoResolutionTaskHelper();
      if (taskHelper.isTaskAssignedToBotUser(taskGr)) {
          var taskTable = taskGr.getValue('sys_class_name');
          taskHelper.unassignTask(taskGr, unassignMsg);
      }
      
      
    })(inputs, outputs);
