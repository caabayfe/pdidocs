  value: |-
    (function execute(inputs, outputs) {
        var conferenceDataParsed;
        try {
            conferenceDataParsed = JSON.parse(inputs.conferenceData);
        }
        catch(e){
            return;
        }
        var confUtils = new NotifyConferenceUtils();
        var taskClient = new global.NotifyOnTaskAjaxProcessor_V2(undefined, undefined, undefined, conferenceDataParsed);
        var result;
        if (inputs.action == confUtils.ACTION.MULTI_JOIN) {
            result = taskClient.addToConferenceCall();
        }
        else {
            //Currently this Async action is not supported
            return;
        }
        outputs.result = result;
    })(inputs, outputs);
