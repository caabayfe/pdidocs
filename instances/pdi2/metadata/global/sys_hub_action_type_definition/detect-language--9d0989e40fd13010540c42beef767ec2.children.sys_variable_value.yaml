  value: |-
    (function execute(inputs, outputs) {
      var detected_language = null;
      var additionalParameters;
      var translator;

      if (inputs.translator) {
            translator = inputs.translator;
      }
      if (inputs.additionalParameters) {
          additionalParameters = inputs.additionalParameters;
      }
      var event = {
          "source": "DT Spoke"
      };
      if (inputs.source) {
          event.eventName = inputs.source;
      }
      // Detect the language of the input utterance
      try {
      	detected_language = sn_dt_api.DynamicTranslation.getDetectedLanguage(inputs.utterance, {
                "additionalParameters": additionalParameters,
                "translator": translator,
                "event": event
        });
        if (detected_language) {
          outputs.language_code = detected_language.detectedLanguage.code;
          outputs.confidence = detected_language.detectedLanguage.confidence;
          outputs.provider = detected_language.translator;
        } else {
          outputs.language_code = 'notalanguage';
          outputs.confidence = '0';
          outputs.provider = 'unknown';
        }
      } catch(ex) {
        gs.error(ex);
        outputs.language_code = 'notalanguage';
        outputs.confidence = '0';
        outputs.provider = 'unknown';
      }
    })(inputs, outputs);
