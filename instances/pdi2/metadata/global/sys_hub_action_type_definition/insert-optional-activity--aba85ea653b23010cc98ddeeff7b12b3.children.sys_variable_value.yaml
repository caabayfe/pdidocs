  value: |-
    (function execute(inputs, outputs) {
      var type = inputs.relative_to_type;
      var relativeToId = inputs.relative_to.getUniqueValue();
      var response = {};
      
      if (type === 'sys_pd_activity')
        response = sn_pad.PDAutomationProvider.addOptionalActivityRelativeToActivity(inputs.context_id, 
                                                                                     inputs.activity_id, 
                                                                                     inputs.where, 
                                                                                     relativeToId);
      
      if (type === 'sys_pd_activity_context')
        response = sn_pad.PDAutomationProvider.addOptionalActivityRelativeToActivityContext(inputs.context_id, 
                                                                                            inputs.activity_id,
                                                                                            inputs.where, 
                                                                                            relativeToId);
      
      if (type === 'sys_pd_lane')
        response = sn_pad.PDAutomationProvider.addOptionalActivityRelativeToLane(inputs.context_id, 
                                                                                 inputs.activity_id, 
                                                                                 inputs.where, 
                                                                                 relativeToId);
      
      if (type === 'sys_pd_lane_context')
        response = sn_pad.PDAutomationProvider.addOptionalActivityRelativeToLaneContext(inputs.context_id, 
                                                                                        inputs.activity_id, 
                                                                                        inputs.where, 
                                                                                        relativeToId);
      
      if (response.errors && response.errors.length > 0)
        throw response.errors.join(', ');
    })(inputs, outputs);
