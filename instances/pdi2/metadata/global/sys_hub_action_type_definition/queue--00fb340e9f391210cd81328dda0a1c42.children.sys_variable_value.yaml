  value: |-
    (function execute(inputs, outputs) {
        // ... code ...
        var notifyCallGR = inputs.notify_call;

        var queueAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.QUEUE);
        queueAction.setNotifyCall(notifyCallGR);
        queueAction.execute();

        // fetch newly created notify workflow activity
        var notifyActivityGR = queueAction.getNotifyActivityGR();
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
