  value: |-
    (function execute(inputs, outputs) {
    	var flow_data = new GlideRecord('sys_flow_data');
      	flow_data.get(inputs.flow_data_sys_id);
      
        //get the variable table name
      	var varTableName = flow_data.getElement('vars').getVariablesRecord().getTableName();
      
    	flow_data.vars[varTableName].table = inputs.table;
    	flow_data.update();
    })(inputs, outputs);
