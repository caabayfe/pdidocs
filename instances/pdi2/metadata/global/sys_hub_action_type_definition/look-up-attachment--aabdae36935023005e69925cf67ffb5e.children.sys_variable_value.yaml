  sys_updated_on: 2019-06-13 05:45:56
  value: |-
    (function execute(inputs, outputs) {

    	outputs.attachmentList = [];
    	outputs.sysId = "No attachment found";

    	var gr = new GlideRecord("sys_attachment");
    	gr.addQuery("table_sys_id", inputs.sourceId.sys_id);
    	if (inputs.file && inputs.file.trim() !== "")
    		gr.addQuery("file_name", inputs.file.trim());
    	gr.query();
    	var rowsCount = gr.getRowCount();
    	if (rowsCount == 1) {
    		gr.next();
    		outputs.sysId = gr.getValue("sys_id");
    	} else if (rowsCount > 1) {
    		var row = 0;
    		while (gr.next()) {
    			outputs.attachmentList[row++] = {
    				"sys_id": gr.getValue("sys_id"),
    				"file_name": gr.getValue("file_name"),
    				"file_size_in_bytes": gr.getValue("size_bytes")
    			};
    		}
    		outputs.sysId = outputs.attachmentList[0].sys_id;
    		outputs.attachmentList = JSON.stringify(outputs.attachmentList);
    	}
    })(inputs, outputs);
