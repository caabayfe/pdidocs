    (function execute(inputs, outputs) {
        var gr = new GlideRecord('sys_user_has_role');
        gr.addQuery('role', inputs.role);
        gr.addQuery('user', inputs.user);
        gr.addQuery('inherited', false);
        gr.addQuery('granted_by', inputs.granted_by);
        gr.query();
        if(gr.next())
            gr.deleteRecord();
    })(inputs, outputs);
