  value: |-
    (function execute(inputs, outputs) {

        if (!inputs.user_id)
            throw new Error("Invalid user_id provided")

        if (!inputs.record_id)
            throw new Error("Invalid record_id provided")

        if (!inputs.table_name)
            throw new Error("Invalid table_name provided")

        var sessionUser = gs.getUserID();
        gs.getSession().impersonate(inputs.user_id)
        
        try {
            var recordGR = new GlideRecord(inputs.table_name);
            recordGR.get(inputs.record_id);

            if (inputs.operation === 'read')
                outputs.output = recordGR.canRead();
            else if (inputs.operation === 'write')
                outputs.output = recordGR.canWrite();
            else if (inputs.operation === 'create')
                outputs.output = recordGR.canCreate();
            else if (inputs.operation === 'delete')
                outputs.output = recordGR.canDelete();
            else {
                throw new Error("Invalid operation provided");
            }
        } catch(err) {
            gs.getSession().impersonate(sessionUser);
            throw err;
        }
        gs.getSession().impersonate(sessionUser);

    })(inputs, outputs);
