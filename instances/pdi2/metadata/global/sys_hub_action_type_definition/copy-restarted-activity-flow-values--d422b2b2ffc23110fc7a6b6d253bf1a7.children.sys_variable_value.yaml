  value: |-
    function insertFlowDataVarsValues(dataDefinitionId, flowDataRecordId) {
        var sysFlowDataVarGR = new GlideRecord("sys_flow_data_var");
        var tableValue = "var__m_sys_flow_data_var_" + dataDefinitionId;
        sysFlowDataVarGR.addQuery("name", tableValue);
        sysFlowDataVarGR.query();
        while (sysFlowDataVarGR.next()) {
            var variableSysId = sysFlowDataVarGR.getUniqueValue();
            var gr = new GlideRecord('sys_variable_value');
            gr.initialize();
            gr.order = 0;
            gr.variable = variableSysId;
            gr.document = 'sys_flow_data';
            gr.document_key = flowDataRecordId;
            var newSysId = gr.insert();
            if (!newSysId) {
                gs.error('insertFlowDataVarsValues: failed to insert placeholder for variable ' + variableSysId);
            }
        }
    }

    (function execute(inputs, outputs) {
        const grFlowData = inputs.flowData;
        const oldTypeVals = inputs.oldActivityContext ? inputs.oldActivityContext.getElement('type_vals') : null;
        const associatedTable = oldTypeVals != null ? inputs.oldActivityContext.associated_table : null;
        const experienceStatusTable = oldTypeVals != null ? oldTypeVals.getVariableValue('experience_status_table') : null;
        const oldFlowDataId = (associatedTable == 'sys_flow_data' && inputs.oldActivityContext.associated_record)
                              ? inputs.oldActivityContext.associated_record : experienceStatusTable == 'sys_flow_data'
                              ? oldTypeVals.getVariableValue('experience_status_record') : null;
        // exit early, if there's no new flow data record provided
        if (!(grFlowData && grFlowData.isValidRecord())) {
            return; // No valid new flow data record
        }
        // exit early, if there's no previous Flow Data record but create empty placeholder values for current flow data record
        if (!oldFlowDataId) {
            insertFlowDataVarsValues(inputs.dataDefinitionId, grFlowData.getUniqueValue());
            return;
        }

        const grOldFlowData = new GlideRecord('sys_flow_data');
        // exit early, if previous Flow Data record isn't there
        if (!grOldFlowData.get(oldFlowDataId)) return;

        const geOldVars = grOldFlowData.getElement('vars');
        const varNames = geOldVars.hasVariables() ? geOldVars.getVariableNames() : [];
        // exit early, if there are no values to copy
        if (!varNames.length) return;
        // go over vars by name to update the values
        for (var i = 0; i < varNames.length; i++) {
            grFlowData.getElement('vars.' + varNames[i]).setValue(geOldVars.getVariableValue(varNames[i]));
        }

        grFlowData.update();

    })(inputs, outputs);
