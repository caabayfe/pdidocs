  value: |-
    (function execute(inputs, outputs) {
        try {
            var table = inputs.table + "";
            var sysId = inputs.sysId + "";
            var response = inputs.response + "";
            var subflowContextSysId = inputs.subflowContextSysId + "";
            var escalateeSysId = inputs.escalateeSysId + "";
            var actionType = inputs.actionType + "";

            var onCallWorkflowUtils = new OnCallWorkflowUtils();
            if (onCallWorkflowUtils.isDebugLogEnabled()) {
                gs.log("[On-Call: Manage Escalation Response] escalateeSysId: " + escalateeSysId + " table: " + table + " sysId: " + sysId + " actionType: " + actionType + " response: " + response
                    , subflowContextSysId);
            }

            var isAddOrUpdate = actionType == 'add' || actionType == 'update';
            var isUpdate = actionType == 'update';
            var isClean = actionType == 'clean';

            if (isAddOrUpdate && gs.nil(table)) outputs.error_message = "Invalid table";
            else if (isAddOrUpdate && gs.nil(sysId)) outputs.error_message = "Invalid sys id";
            else if (isAddOrUpdate && gs.nil(escalateeSysId)) outputs.error_message = "Invalid escalatee sys id";
            else if (isClean && gs.nil(subflowContextSysId)) outputs.error_message = "Invalid subflow context sys id";
            else if (isUpdate && gs.nil(response)) outputs.error_message = "Invalid response";
            else {
                switch (actionType) {
                    case 'add':
                        onCallWorkflowUtils.createEscalationResponse(null, sysId, table, escalateeSysId, subflowContextSysId);
                        break;
                    case 'clean':
                        onCallWorkflowUtils.cleanEscalationResponse(null, subflowContextSysId);
                        break;
                    case 'update':
                        onCallWorkflowUtils.updateEscalationResponse(escalateeSysId, table, sysId, response);
                }
            }
        } catch (e) {
            outputs.error_message = e.message;
        }
        if (outputs.error_message) {
            outputs.state = "error";
        } else outputs.state = "success";
    })(inputs, outputs);
