description: |-
  Directs a phone call to a browser session for a user.

  A token needs to be generated in a UI page using the getTokens function. A client callable script include called 'AjaxGetNotify'Token provides the ability to fetch a token with an ajax call from a UI page or macro:

  var currentUser = new GlideRecord("sys_user");
  currentUser.get(gs.getUserID());
  tokens = new SNC.Notify().getTokens(currentUser);
