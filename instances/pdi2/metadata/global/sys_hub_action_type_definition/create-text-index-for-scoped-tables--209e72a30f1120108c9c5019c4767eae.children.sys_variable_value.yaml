  value: |-
    (function execute(inputs, outputs) {

      var scopedTables = new GlideRecord('sys_dictionary');
      scopedTables.addQuery('sys_scope', inputs.app_sys_id);
      scopedTables.addQuery('internal_type', 'collection');
      scopedTables.addQuery('text_index', true);
      scopedTables.query();
      
      while(scopedTables.next()) {
        var tableName = scopedTables.getValue('name');
        try {
          gs.info('Creating text index for table: ' + tableName);
          GlideTextIndexEvent().createIndex(tableName);
        } catch (err) {
          gs.error(err);
          throw err;
        }    
      }
      
    })(inputs, outputs);
