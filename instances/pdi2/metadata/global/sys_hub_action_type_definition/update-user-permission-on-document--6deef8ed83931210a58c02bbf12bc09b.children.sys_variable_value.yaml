  value: "(function execute(inputs, outputs) {\n      try {\n      var documentExternalPermissionsManager = new global.DocumentExternalPermissionsManager();\n      var response = documentExternalPermissionsManager.updateUserPermission(inputs.user_permission_sys_id);\n      if (!response) {\n      outputs.status = 'Error';\n      outputs.message = 'Error while trying to update user permission. DocumentExternalPermissionsManager script include has not returned any response.';\n      } else {\n      outputs.status = response.status;\n      outputs.message = response.message;\n      if (response.status.toLowerCase() == 'error') {\n      gs.error('Error while trying to update user permission. Caused by: script include response: ' + JSON.stringify(response));\n      }\n      }\n      } catch (err) {\n      outputs.status = 'Error';\n      outputs.message = 'Error while trying to update user permission.';\n      gs.error('Error while trying to update user permission. Caused by: ' + err.message || err);\n      }\n      })(inputs, outputs);\n    "
