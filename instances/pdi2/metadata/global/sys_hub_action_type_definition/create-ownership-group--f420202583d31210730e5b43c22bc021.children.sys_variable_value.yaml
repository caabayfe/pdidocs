  value: |-
    (function execute(inputs, outputs) {
        if(inputs.name){
            var grp = new GlideRecord('sys_user_group');
            grp.initialize();
            grp.name = inputs.name;
            grp.manager = inputs.manager;
            grp.description = inputs.description;
            grp.email = inputs.group_email;
            grp.type = "458de4f067671300dbfdbb2d07415ad6";//knowledge group type
            var groupId = grp.insert();
    	    if(groupId){
                var grRole = new GlideRecord("sys_group_has_role");
                grRole.initialize();
                grRole.group = groupId;
                grRole.setValue("role","cfa4c4c253302300cc376512a2dc3438"); //knowledge group member role
                grRole.setValue("inherits",true);
                grRole.insert();
    		
    		//adding knowledge group manager role to ownership group manager
    		if(inputs.manager!=""){
    			var role = new GlideRecord('sys_user_has_role'); 
    			role.initialize();
    			role.role = "616c46d453302300cc376512a2dc34a0"; //knowledge group manager role
    			role.user = inputs.manager;
    			role.granted_by = groupId; 
    			role.insert();
    			var msgArray = [];
    			msgArray.push(role.role.name + "");
    			msgArray.push(role.user.user_name + "");
    			gs.log(gs.getMessage('Adding role {0} to {1}', msgArray));
    		    }
    	    }
            if(groupId && inputs.group_members){
                var grmem = new GlideRecord('sys_user_grmember');
                var usr = new GlideRecord('sys_user');
                usr.addQuery("sys_id","IN",inputs.group_members);
                usr.query();
                while(usr.next()){
                    grmem.initialize();
                    grmem.group = groupId;
                    grmem.user = usr.sys_id;
                    grmem.insert();
                }
            }
        }
     
    })(inputs, outputs);
