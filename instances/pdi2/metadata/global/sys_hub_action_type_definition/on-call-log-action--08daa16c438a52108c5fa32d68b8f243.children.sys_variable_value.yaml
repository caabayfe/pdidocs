  value: |-
    (function execute(inputs, outputs) {
        var log = new GSLog('com.snc.on_call_rotation.log.level', inputs.source);
        if(log.atLevel(GSLog.DEBUG))
        {
            if(JSUtil.nil(inputs.messageContent) && (JSUtil.nil(inputs.messageArray) || inputs.messageArray.every(JSUtil.nil)))
            {
                gs.log("No messages found to log. Please add a valid message.", inputs.source);
            }
            else
            {
                if(!JSUtil.nil(inputs.messageContent) && inputs.messageContent.trim != "")
                {
                    log.logDebug(inputs.messageContent);
                }
                if(!JSUtil.nil(inputs.messageArray))
                {
                    if(Array.isArray(inputs.messageArray))
                    {
                        inputs.messageArray.forEach(function(parsedMessage) {
                            if(typeof parsedMessage === 'string' && parsedMessage.trim() != "")
                            {
                                log.logDebug(parsedMessage);
                            }
                        });
                    }
                }
            }
        }
    })(inputs, outputs);
