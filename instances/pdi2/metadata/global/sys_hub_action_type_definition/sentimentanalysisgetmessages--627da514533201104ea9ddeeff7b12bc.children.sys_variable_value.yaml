  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      var Logger = new global.SentimentAnalysisLogger("SentimentAnalysisGetMessages");
      Logger.info('SentimentAnalysisGetMessages inputs - {0}',inputs['input']);
      var input = inputs['input'];
      var conversationId = input.conversationId;
      var messageText = input.messageText;
      var messageId = input.messageId;
     
      var messages = [];
      var messageIds = [];
      if(messageText) {
        messages.push(messageText);
        messageIds.push(messageId);
      }
      else if(conversationId) {    
        var sentimentAnalysisMessage = sn_cs.VASystemObject.getInboundMsgForSentimentAnalysis(conversationId);
       
        for(var i=0;i<sentimentAnalysisMessage.length;i++) {
        	var msg = JSON.parse(sentimentAnalysisMessage[i]);
          	messages.push(msg.message);
          	messageIds.push(msg.messageId);
        }
        outputs['conversationid'] = conversationId
      } 
        
      var joinedMessage  = messages.join('. ');
      outputs['joinedmessage'] = joinedMessage;
      outputs['messages'] = messages;
      outputs['messageids'] = messageIds;

      Logger.debug('SentimentAnalysisGetMessages outputs - {0}',JSON.stringify(outputs));
      
    })(inputs, outputs);
