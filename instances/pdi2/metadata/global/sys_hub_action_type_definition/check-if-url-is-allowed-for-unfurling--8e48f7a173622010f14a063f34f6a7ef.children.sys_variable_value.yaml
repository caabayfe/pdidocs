  value: |-
    (function execute(inputs, outputs) {
      
      var helper = new global.AllowedHostnameHelper();  
      var allowed = false;
      var url = inputs.url_for_unfurling;
      allowed = helper.isURLAllowedForUnfurling(url);
      
      if (!allowed) {
        var logUtil = new LinkUnfurlingLoggingUtils();
        logUtil.atInfo(url, inputs.conversation_id).log("Given URL {0} is not part of the Hostname allow list for unfurling", url);
      }
      
      outputs.is_url_allowed = allowed;

    })(inputs, outputs);
