  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
    var DEFAULT_PUBLISH_FLOW = "2222030614f75210f8779da9137d35b3";
    var DEFAULT_RETIRE_FLOW = "ea32fac859c02210f877a8ba01addda2";
    gs.log("requested_for: " + inputs.kb_request_record.requested_for);

    var requestedKbName = inputs.kb_request_record.requested_title;
    gs.log("requested knowledge base name: " + requestedKbName);

    //retrieve available knowledge base name if requested name is already taken
    var availableKbName = new SNC.KnowledgeHelper().getAvailableKBName(requestedKbName);
    gs.log("available knowledge base name: " + availableKbName);

    //create info about new knowledge base name if requested name is already taken
    if (requestedKbName != availableKbName) 
    	outputs.kb_name_message = "Knowledge base is named '"+availableKbName+ "' because requested name was already in use.";
    else outputs.kb_name_message = "";

    //get knowledge manager role
    var knowledgeManagerRole = new GlideRecord("sys_user_role");
    knowledgeManagerRole.addQuery("name", "knowledge_manager");
    knowledgeManagerRole.query();
    knowledgeManagerRole.next();

    //check if requestor has knowledge_manager role
    var userHasRole = new GlideRecord("sys_user_has_role");
    userHasRole.addQuery("user", inputs.kb_request_record.requested_for);
    userHasRole.addQuery("role", knowledgeManagerRole.getUniqueValue());
    userHasRole.query();

    //if requestor does not have knowledge_manager role add it
    if (!userHasRole.next()){
    	userHasRole = new GlideRecord("sys_user_has_role");
    	userHasRole.setValue("user", inputs.kb_request_record.requested_for);
    	userHasRole.setValue("role", knowledgeManagerRole.getUniqueValue());
    	userHasRole.insert();
    }

    //add info message about added knowledge_role
    var requestor = GlideUser.getUserByID(inputs.kb_request_record.requested_for);
    var msgArray = new Array(); 
    msgArray.push("knowledge_manager");
    msgArray.push(requestor.getFullName());
    gs.log(gs.getMessage('Adding Role {0} to {1}', msgArray));

    //create knowledge base with requestor as owner
    var kb = new GlideRecord("kb_knowledge_base");
    kb.initialize();
    kb.setValue("title", availableKbName);
    kb.setValue("active", false);
    kb.setValue("owner", inputs.kb_request_record.requested_for);
    kb.setValue("kb_publish_flow", DEFAULT_PUBLISH_FLOW);
    kb.setValue("kb_retire_flow", DEFAULT_RETIRE_FLOW);
    var kbSysId = kb.insert();

    //create a link to newly created knowledge base
    outputs.kb_link = "<a href='" + gs.getProperty('glide.servlet.uri') + gs.generateURL('kb_knowledge_base', kbSysId)+"' target='_blank'>here</a>";
    })(inputs, outputs);
