  value: |-
    (function execute(inputs, outputs) {
        try {
            var ocEscalationUtil = new OnCallEscalationUtil();
            
            var escalationSysId = inputs.escalationSysId + "";
            var rotaSysId = inputs.rotaSysId + "";
            var level = inputs.level + "";
            var contactAttempt = inputs.contactAttempt + "";

            var result = ocEscalationUtil.logEscalationAttempt(escalationSysId, rotaSysId, level, contactAttempt);

            if (result && result.escalationLogEnabled) {
                if (result.success) {
                    outputs.escalation_attempt_record = result.logGr;
                } else {
                    outputs.error_message = result.error ? result.error.msg : "";
                }
            }
        } catch (e) {
            outputs.error_message = e.message;
        }
        if (outputs.error_message) outputs.state = "error";
        else outputs.state = "success";
    })(inputs, outputs);
