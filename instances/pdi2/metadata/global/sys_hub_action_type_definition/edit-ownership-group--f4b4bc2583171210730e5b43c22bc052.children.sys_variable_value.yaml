  sys_tags: ''
  sys_updated_by: admin
  sys_updated_on: 2025-03-08 03:54:19
  value: |-
    (function execute(inputs, outputs) {
        if(inputs.ownership_group){
            var grp = new GlideRecord('sys_user_group');
            grp.addQuery("type","458de4f067671300dbfdbb2d07415ad6"); //knowledge type
            grp.addQuery("sys_id",inputs.ownership_group);
            grp.query();
            var oldManager = "";
            if(grp.next()){
                oldManager=grp.getValue("manager");
                grp.name = inputs.name;
                grp.manager = inputs.manager;
                grp.description = inputs.description;
                grp.email = inputs.group_email;
                grp.update();
            }
            var groupId = inputs.ownership_group;
            if(oldManager!=inputs.manager){
                //deleting knowledge group manager role from old ownership group manager
                
                var userHasRole = new GlideRecord("sys_user_has_role");
                userHasRole.addQuery("user",oldManager);
                userHasRole.addQuery("role","616c46d453302300cc376512a2dc34a0"); //knowledge group manager role
                userHasRole.addQuery("granted_by",groupId);
                userHasRole.deleteMultiple();
                var msgArray = [];
                msgArray.push(userHasRole.role.name + "");
                msgArray.push(userHasRole.user.user_name + "");
                gs.log(gs.getMessage('Removing role {0} from {1}', msgArray));
                
                //adding knowledge manager role to new ownership group manager
                if(inputs.manager != ""){
                    var role = new GlideRecord('sys_user_has_role'); 
                    role.initialize();
                    role.role = "616c46d453302300cc376512a2dc34a0"; //knowledge group manager role
                    role.user = inputs.manager;
                    role.granted_by = groupId; 
                    role.insert();
                    var msgArray2 = [];
                    msgArray2.push(role.role.name + "");
                    msgArray2.push(role.user.user_name + "");
                    gs.log(gs.getMessage('Adding role {0} to {1}', msgArray2));
                }
            }
            var groupMemerStr = inputs.group_members+"";
            var newGrpMemebersList = groupMemerStr.split(",");
            var grpMembers = new GlideRecord('sys_user_grmember');
            grpMembers.addQuery('group',groupId);
            grpMembers.query();
            while(grpMembers.next()){
                var usr =grpMembers.getValue('user');
                var index = newGrpMemebersList.indexOf(usr);
                if(index >= 0){
                    newGrpMemebersList.splice(index,1);
                }else{
                    grpMembers.deleteRecord(); //delete unmatched member
                }
            }

            //code for add the new group members which are not part in old group
            if(newGrpMemebersList.length>0){
                var grmem = new GlideRecord('sys_user_grmember');
                var usr = new GlideRecord('sys_user');
                usr.addQuery("sys_id","IN",newGrpMemebersList.join()+"");
                usr.query();
                while(usr.next()){
                    grmem.initialize();
                    grmem.group = groupId;
                    grmem.user = usr.sys_id;
                    grmem.insert();
                }
            }
        }

    })(inputs, outputs);
