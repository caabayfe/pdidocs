  value: |-
    (function execute(inputs, outputs) {
    	gs.info("Executing CAF Default Contextual Action");
      	var request_context = inputs.request_context;
      	var conversation_id = inputs.conversation_id;
        var result = {};
       
      	result['Hi'] = '4dd03069532210105498ddeeff7b126e';
      	result['Agent'] = 'e8848fb1532210105498ddeeff7b122e';
      	result['Logout'] = '1d44fd14533210105498ddeeff7b1221';
      	result['Help'] = 'b20fd17b532210105498ddeeff7b12b7';
      	result['Bye'] = '4dd3d371533210105498ddeeff7b124d';
        result['Notifications'] = 'c9c2a1a5c38b1010d81b6e221f40ddec';
      	result['Restart'] = 'handle_keyword_without_switch';
      	result['_end_conversation_internal'] = 'handle_keyword_without_switch';
      	result['_resume_conversation_internal'] = 'handle_keyword_without_switch';
      	result['_skip_internal'] = 'handle_keyword_without_switch';
    	var welcomeTopic = '';
    	if(request_context["provider_app_id"]) {
    		var topicId = sn_cs.VASystemObject.getCustomAdapterProperty("default_welcome_topic", "provider_application", request_context["provider_app_id"]);
    		welcomeTopic = topicId ? topicId : '1bb39f0953912210ee61833230e5e6ed';
    	} else {
    		welcomeTopic = '1bb39f0953912210ee61833230e5e6ed'
    	}
    	result['_first_installation'] = welcomeTopic;
      	
      	if (request_context['default_contextual_action'] == 'Restart') {
          sn_cs.VASystemObject.endConversation(conversation_id);
          sn_cs.VASystemObject.startConversation(conversation_id);
        }
      
      	if (request_context['default_contextual_action'] == '_end_conversation_internal')
          sn_cs.VASystemObject.endConversation(conversation_id);
      
      	if(request_context['default_contextual_action'] === "_skip_internal")
          sn_cs.VASystemObject.skipOptionalQuestion(conversation_id);
      	
      
      	outputs.result = result;
    })(inputs, outputs);
