  value: |-
    (function execute(inputs, outputs) {
        try {
            if (gs.nil(inputs.catalog_item))
                throw 'Catalog item is required';

            var catalogItem = new sn_sc.CatItem(inputs.catalog_item);
            var catItemGr = new GlideRecord(catalogItem.getRecordClass());
            catItemGr.get(inputs.catalog_item);
            var isItemProducer = catItemGr.instanceOf('sc_cat_item_producer');
            var inputVariables = inputs.variables || inputs.variables_as_json;
            var variables = buildVariableObj(inputVariables);
            var result = {};

            var valuesMap = {
                sysparm_id: inputs.catalog_item.getUniqueValue(),
                variables: variables,
                engagement_channel: 'flow'
            }

            if (isItemProducer) {
                result = catalogItem.submitProducer(valuesMap)

                if (gs.nil(result) || gs.nil(result.sys_id))
                    throw 'Failed to submit producer';

                outputs.table = result.table;
                outputs.record_id = result.sys_id;
            } else {
                var uniqueCartName = 'sn_custom_cart_' + gs.generateGUID();
                var cart = new sn_sc.CartJS(uniqueCartName);

                valuesMap.sysparm_cart_name = uniqueCartName;
                valuesMap.sysparm_special_instructions = variables.sysparm_special_instructions || '';
                valuesMap.sysparm_delivery_address = variables.sysparm_delivery_address;
                valuesMap.sysparm_requested_for = variables.sysparm_requested_for || '';
                valuesMap.sysparm_quantity = variables.sysparm_quantity.toString();

                result = cart.orderNow(valuesMap);

                if (gs.nil(result) || gs.nil(result.sys_id))
                    throw 'Failed to submit catalog item';

                outputs.table = 'sc_request';
                outputs.record_id = result.request_id;
            }
        } catch (e) {
            throw e;
        }
        
        function buildVariableObj(variableObj) {
            var newObj = {}
            variableObj = typeof variableObj === 'string' ? JSON.parse(variableObj) : variableObj;
            for (var variable in variableObj) {
                newObj[variable] = variableObj[variable];

                if (newObj[variable] == '')
                    continue;

                if (isNotJson(newObj[variable]))
                    newObj[variable] = JSON.parse(newObj[variable]);

                newObj[variable] = newObj[variable].hasOwnProperty('value') ? newObj[variable].value : newObj[variable];
            }
            return newObj;
        }

        function isNotJson(str) {
            try {
                JSON.parse(str);
            } catch (e) {
                return false;
            }
            return true;
        }

    })(inputs, outputs);
