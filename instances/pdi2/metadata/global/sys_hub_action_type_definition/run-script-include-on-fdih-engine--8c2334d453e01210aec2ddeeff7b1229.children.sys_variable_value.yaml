  value: |-
    (function execute(inputs, outputs) {

    var input = inputs['input'];

    if (!input._meta || !input._meta.definition) {
        gs.error('Missing _meta property in the request.');
        outputs['status'] = 'error';
        outputs['message'] = 'Error executing Missing _meta property in the request.';
        return outputs;
    }

    var capabilityDefinitionGr = new GlideRecord('sys_one_extend_capability_definition');
    if (!capabilityDefinitionGr.get(input._meta.definition)) {
        gs.error("No record found for definition: " + input._meta.definition);
        return;
    }

    var scriptSysId = capabilityDefinitionGr.getValue('api');

    var scriptIncludeGr = new GlideRecord('sys_script_include');
    if (!scriptIncludeGr.get(scriptSysId)) {
        gs.error("Script include not found: " + scriptSysId);
        return;
    }

    try {
        var impl = new GlideScopedEvaluator().evaluateScript(scriptIncludeGr, 'script', {});

        if (!impl || typeof impl.execute !== 'function') {
            gs.error("Script include does not expose execute(): " + scriptIncludeGr.api_name);
            outputs['status'] = 'error';
            outputs['message'] = 'Script include does not expose execute()';
            outputs['details'] = '' + scriptIncludeGr.api_name;
            return outputs;
        }

        if (typeof impl.initialize === 'function')
            impl.initialize();

        outputs = impl.execute(input);

        if (!outputs || typeof outputs !== 'object' || !('output' in outputs)) {
            outputs = { output: outputs };
        }

        outputs['status'] = 'success';

    } catch (e) {
        gs.error("Error while evaluating script: " + e.message);
        outputs['status'] = 'error';
        outputs['message'] = 'Error executing script';
        outputs['details'] = e.message;
    }

    return outputs;

    })(inputs, outputs);
