  value: |-
    (function execute(inputs, outputs) {
        var gr = new GlideRecord(inputs.sourceTable + "");
        outputs.status_code = 0;
        outputs.error_msg = "";
        if (gr.get(inputs.sourceSysId + "")) {
            outputs.record_present = true;
            var impersonator = new GlideImpersonate();
            var originalUser = impersonator.impersonate(inputs.onCallUserSysId);
            var hasWriteAccess = gr.canWrite();
            impersonator.impersonate(originalUser);
            outputs.has_write_access = hasWriteAccess;
            if (hasWriteAccess) {
                gr.setValue(inputs.triggerUserField + "", inputs.onCallUserSysId + "");
                gr[inputs.journalField + ""] = gs.getMessage("Task assigned based on current on-call resource");
                gr.update();
            } else {
                outputs.status_code = 1;
                outputs.error_msg = gr.getDisplayValue() + " was not assigned to on-call user with sysId " + inputs.onCallUserSysId + " as he doesn't have write access";
            }
        } else {
            outputs.status_code = 1;
            outputs.error_msg = "The source record of type " + inputs.sourceTable + " with sysId " + inputs.sourceSysId + "was not found";
        }
    })(inputs, outputs);
