  value: |-
    (function execute(inputs, outputs) {
        // ... code ...
        var notifyNumberGr = inputs.send_from;
        var sendTo = inputs.send_to;
        var sendToGroup = inputs.send_to_group;
        var message = inputs.message;
        var numbers = inputs.numbers;
        var source = inputs.record_id;
        var sendToIds = [];
        var sendToGroupIds = [];
        var users = [];
        var groups = [];
        

        var notifyUtils = new NotifyUtil();
        var notify = new SNC.Notify();

        if (sendTo && sendTo instanceof GlideRecord) {
            while (sendTo.next()) {
                sendToIds.push(sendTo.getUniqueValue());
            }
        }

        if (sendToGroup && sendToGroup instanceof GlideRecord) {
            while (sendToGroup.next()) {
                sendToGroupIds.push(sendToGroup.getUniqueValue());
            }
        }

        users = notifyUtils.appendUniquely(users, sendToIds + '');
        groups = notifyUtils.appendUniquely(groups, sendToGroupIds + '');
        numbers = notifyUtils.getUniquePhoneNumbersForUsersAndGroups(numbers, users, groups, notifyUtils.numberType.sms);

        if (!notifyNumberGr || !notifyNumberGr.isValid()) {
            throw new Error(gs.getMessage('No such Notify Phone Number'));
        }

        if (!notifyUtils.isOutgoingSMSCapableNumber(notifyNumberGr.getValue('number'))) {
            throw new Error(gs.getMessage("The Notify Number does not support outbound SMS messages"));
        }

        if (source && source instanceof GlideRecord) {
            notify.sendBulkSMS(notifyNumberGr.getValue('number'), numbers, message, source);
        } else {
            notify.sendBulkSMS(notifyNumberGr.getValue('number'), numbers, message);
        }


        var errors = this.notifyUtils.getErrors();
        // get API errors (if any)
        if (this.notify.hasErrors()) {
            var iter = this.notify.getErrors().iterator();
            while (iter.hasNext()) {
                errors.push(j2js(iter.next()));
            }
        }

        if (errors.length > 0) {
            throw new Error(errors.join(', '));
        }

    })(inputs, outputs);
