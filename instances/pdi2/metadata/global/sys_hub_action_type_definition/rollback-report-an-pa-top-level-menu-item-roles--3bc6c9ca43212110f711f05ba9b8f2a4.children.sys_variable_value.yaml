  value: |-
    (function execute(inputs, outputs) {
      gs.log(inputs);
    const recordCount = inputs.oldRecordCount;
    var i =0;
    // we have last 2 newvalues and 2. one is the previous value we want to rollback
    while(inputs.oldRecords.next()) {
      outputs.previousroles = inputs.oldRecords.getValue('newvalue');
    }
    const defaultRoles = "itil, asset, report_user";
      
    // if we have less then 2 historical values it means user not changed value we should use default values.
    if (recordCount<2) 
        outputs.previousroles = defaultRoles;

    })(inputs, outputs);
