  value: |-
    (function execute(inputs, outputs) {
        try {
            var ocEscalationUtil = new OnCallEscalationUtil();
             
            var table = inputs.table + "";
            var sysId = inputs.sysId + "";
            var groupSysId = inputs.groupSysId + "";
            var subflowContextSysId = inputs.subflowContextSysId + "";
            var parentEscalationLevelSysId = inputs.parentEscalationLevelSysId + "";
            var category = inputs.category + "";
            var channels = inputs.channels + "";
            var ignoreDefReminders = inputs.ignoreDefReminders;

            var result = ocEscalationUtil.logEscalationStart(groupSysId, table, sysId, null, null, parentEscalationLevelSysId, category, channels, ignoreDefReminders, subflowContextSysId);

            if (result && result.escalationLogEnabled) {
                if (result.success) {
                    outputs.escalation_record = result.logGr;
                } else {
                    outputs.error_message = result.error ? result.error.msg : "";
                }
            }
        } catch (e) {
            outputs.error_message = e.message;
        }
        if (outputs.error_message) outputs.state = "error";
        else outputs.state = "success";
    })(inputs, outputs);
