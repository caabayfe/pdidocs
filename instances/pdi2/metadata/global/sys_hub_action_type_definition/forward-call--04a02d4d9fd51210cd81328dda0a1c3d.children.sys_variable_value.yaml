  value: |-
    (function execute(inputs, outputs) {
        var notifyCallGR = inputs.notify_call;
        var timeout = parseInt(inputs.timeout);
        var record = inputs.record;
        var group = notifyCallGR.notify_number.notify_group.toString();
        var phoneNumber = inputs.phone_number;

        var forwardAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.FORWARD_CALL);
        forwardAction.performValidations(notifyCallGR, phoneNumber, group);
        forwardAction.setNotifyCall(notifyCallGR);
        forwardAction.setTimeout(timeout);
        forwardAction.setRecord(record);
        forwardAction.setPhoneNumber(phoneNumber);
        forwardAction.execute();
        
        var notifyActivityGR = forwardAction.getNotifyActivityGR();
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
