  value: |-
    (function execute(inputs, outputs) {
        var input = {};
        input.params = {};
        input.init_params = {};

        var capabilityId = inputs.inputs._meta.capability || "";
        input.capabilityId = capabilityId;
        var definitionMeta = inputs.inputs._meta.__global_tool_executor_definition_metadata__ || "{}";
        
        if (global.JSUtil.notNil(definitionMeta)) {
            input.provider_api = JSON.parse(definitionMeta).scriptFunctionName || "";
            input.scriptId = JSON.parse(definitionMeta).scriptId || "";
        }

        var capabilityAttributes = sn_one_extend.OneExtendUtil.getCapabilityAttributes(capabilityId) || [];

        function extractAndGroupAttributes(obj) {
            var groupedAttributes = {
                INPUT_NAMES: [],
                INPUT_IDS: [],
                OUTPUT_NAMES: [],
                OUTPUT_IDS: [],
                INIT_INPUT_NAMES: [],
                INIT_INPUT_IDS: []
            };

            function processAttributes(attributes, type) {
                attributes.forEach(function(attribute) {
                    if (attribute.attributeName && attribute.attributeId) {
                        var attributeName = attribute.attributeName;
                        var attributeId = attribute.attributeId;
                        if (type === 'INPUT') {
                            if (attributeName.startsWith('__init__')) {
                                groupedAttributes.INIT_INPUT_NAMES.push(attributeName.replace('__init__', ''));
                                groupedAttributes.INIT_INPUT_IDS.push(attributeId);
                            } else {
                                groupedAttributes.INPUT_NAMES.push(attributeName);
                                groupedAttributes.INPUT_IDS.push(attributeId);
                            }
                        } else if (type === 'OUTPUT') {
                            groupedAttributes.OUTPUT_NAMES.push(attributeName);
                            groupedAttributes.OUTPUT_IDS.push(attributeId);
                        }
                    }
                });
            }

            if (obj.inputs) {
                processAttributes(obj.inputs, 'INPUT');
            }
            if (obj.outputs) {
                processAttributes(obj.outputs, 'OUTPUT');
            }

            return groupedAttributes;
        }

        var result = extractAndGroupAttributes(capabilityAttributes) || {};
        input.params.names = result.INPUT_NAMES || [];
        input.params.ids = result.INPUT_IDS || [];
        input.init_params.names = result.INIT_INPUT_NAMES || [];
        input.init_params.ids = result.INIT_INPUT_IDS || [];
        var methodName = input.provider_api || "";

        var scriptGr = new GlideRecord('sys_script_include');
        scriptGr.addQuery('sys_id', input.scriptId);
        scriptGr.query();

        if (scriptGr.next()) {
            var attributeValue = scriptGr.getValue('api_name');
            input.script_include_name = attributeValue;
        }

        input.params.values = [];
        input.init_params.values = [];

        for (var i = 0; i < input.params.ids.length; i++) {
            var sysId = input.params.ids[i];

            var gr = new GlideRecord('sys_one_extend_resource_attribute_mapping');
            gr.addQuery('resource_attribute_name', sysId);
            gr.query();

            if (gr.next()) {
                var attributeName = gr.resource_attribute_name.name;
                input.params.values.push(inputs.inputs[attributeName]);
            } else {
                input.params.values.push(null);
            }
        }

        for (var i = 0; i < input.init_params.ids.length; i++) {
            var sysId = input.init_params.ids[i];

            var gr = new GlideRecord('sys_one_extend_resource_attribute_mapping');
            gr.addQuery('resource_attribute_name', sysId);
            gr.query();

            if (gr.next()) {
                var attributeName = gr.resource_attribute_name.name;
                input.init_params.values.push(inputs.inputs[attributeName]);
            } else {
                input.init_params.values.push(null);
            }
        }


        function reorderBasedOnOriginalParams(params, originalParams) {
            var nameIndexMap = {};

            params.names.forEach(function(name, index) {
                nameIndexMap[name] = index;
            });

            var reorderedNames = [];
            var reorderedIds = [];
            var reorderedValues = [];

            originalParams.forEach(function(name) {
                var index = nameIndexMap[name];
                reorderedNames.push(params.names[index]);
                reorderedIds.push(params.ids[index]);
                reorderedValues.push(params.values[index]);
            });

            params.names = reorderedNames;
            params.ids = reorderedIds;
            params.values = reorderedValues;
        }


        var funcParamsWithInit = new global.ScriptDetails().getFuncParamsWithInitParams(input.scriptId, input.provider_api) || [];
        var originalParams = funcParamsWithInit.funcParams || [];
        var originalInitParams = funcParamsWithInit.initializeFuncParams || [];
        
        originalParams = originalParams.map((originalParam) => originalParam.toLowerCase());
        reorderBasedOnOriginalParams(input.params, originalParams);

        originalInitParams = originalInitParams.map((originalInitParam) => originalInitParam.toLowerCase());
        reorderBasedOnOriginalParams(input.init_params, originalInitParams);

        var params = input.params.values;
        var initializationParams = input.init_params.values;

        var scriptIncludeName = input.script_include_name;
        
        outputs.output = sn_one_extend.OneExtendUtil.globalToolsExecutor(scriptIncludeName || "", input.provider_api || "", initializationParams.map(function(param) { return JSON.stringify(param === undefined ? null : param); }).join(','), params.map(function(param) { return JSON.stringify(param === undefined ? null : param); }).join(','));
        return outputs;

    })(inputs, outputs);
