  value: |-
    (function execute(inputs, outputs) {
        var number = new GlideRecord('notify_number');
        number.addActiveQuery();
        var query;
        if(inputs.capability) {
            if(inputs.capability == "sms" || inputs.capability == "both") {
                query = number.addQuery('has_sms_out', 'yes');
                query.addOrCondition('has_sms_out', 'unknown');
                query.addOrCondition('short_code', '!=', '');
            }
            if (inputs.capability == "voice" || inputs.capability == "both") {
                query = number.addQuery('has_voice_out', 'yes');
                query.addOrCondition('has_voice_out', 'unknown');
            } 
        }
        number.query();
        if (number.next())
            outputs.notify_number = number;
    })(inputs, outputs);
