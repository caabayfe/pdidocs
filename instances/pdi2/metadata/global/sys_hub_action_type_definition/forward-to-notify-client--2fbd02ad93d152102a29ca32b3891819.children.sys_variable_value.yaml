  value: |-
    (function execute(inputs, outputs) {
        // Getting inputs
        var userGR = inputs.user;
        var timeout = Number(inputs.timeout);
        var record = inputs.record;
        var notifyCallGR = inputs.notify_call;

        // Executing Forward to Notify Client action
        var dialAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.FORWARD_TO_NOTIFY_CLIENT);
        dialAction.setNotifyClient(userGR);
        dialAction.setTimeout(timeout);
        dialAction.setRecord(record);
        dialAction.setNotifyCall(notifyCallGR);
        dialAction.execute();
        var notifyActivityGR = dialAction.getNotifyActivityGR();

        // Setting outputs
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
