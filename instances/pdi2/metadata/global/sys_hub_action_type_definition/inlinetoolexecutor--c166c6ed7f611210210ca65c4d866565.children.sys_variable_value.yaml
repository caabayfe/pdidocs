  value: |-
    (function execute(inputs, outputs) {
        var input = {};
        input.params = {};
        input.init_params = {};
        
        var meta = inputs.inputs._meta || {};
        const transactionId = meta.transactionId || "";
        var script = inputs.inputs.inputscript || "";

        const variableContext = new sn_oneapi.VariableStoreService().getVariableStoreContext(transactionId, meta);
        var map = new Packages.java.util.HashMap();
        map.put("context", variableContext);
        map.put("currentInputs", null);
        
        outputs.output = new GlideEvaluator().evaluateStringWithGlobals(script, map);
        return outputs;
    })(inputs, outputs);
