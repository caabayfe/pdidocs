  value: |-
    (function execute(inputs, outputs) {
      try {
        var result = {"value":"", "search_text": ""};
        
        var request_context = inputs.request_context;    
        var userResponse = request_context['typed_value'];
         
        var doesUserAffirms = isAffirmativeResponse(userResponse);
        if (doesUserAffirms == 'null' )
          result["search_text"] = userResponse;
        else
          result["value"] = doesUserAffirms;
        outputs.result = result;   
      } catch(e) {
         gs.error("Error in default boolean inbound transformation : " + e.message);
      }
      
      function isAffirmativeResponse(response){
        var yes_label = gs.getMessage('Yes');
        var no_label = gs.getMessage('No');
        
        if (response.toLowerCase() == yes_label.toLowerCase())
          return 'true';
        if (response.toLowerCase() == no_label.toLowerCase())
          return 'false';
        else 
          return 'null';
      }
    })(inputs, outputs);
