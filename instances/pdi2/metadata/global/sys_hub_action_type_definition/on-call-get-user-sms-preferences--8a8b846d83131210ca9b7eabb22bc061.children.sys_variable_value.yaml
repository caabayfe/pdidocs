  value: |-
    (function execute(inputs, outputs) {
        var onContactPrefUtil = new OnCallContactPreferenceUtil();
        var onCallNotifyUtil = new global.OnCallNotifyUtil();
        var userSysId = inputs.userSysId;
        var contactAttempt = 1;
        smsPreferences = [];

        var userPrefs = onContactPrefUtil.getUserPreferences(userSysId, contactAttempt, null, 'sms');
        if (userPrefs && userPrefs.length > 0) {
            for (var i = 0; i < userPrefs.length; i++) {
                var pref = userPrefs[i];
                smsPreferences.push(pref.number || "");
            }
        }
        if (smsPreferences.length == 0)
            //user doesn't have any preferences
            smsPreferences.push(onCallNotifyUtil.getPhoneNumber(userSysId) || "");
        outputs.sms_preferences = smsPreferences;
    })(inputs, outputs);
