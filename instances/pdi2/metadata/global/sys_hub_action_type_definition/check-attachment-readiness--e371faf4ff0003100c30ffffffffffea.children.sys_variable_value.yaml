  value: |-
    (function execute(inputs, outputs) {

        var sysId = (inputs.attachment_sys_id || '') + '';

        if (!sysId) {
            outputs.availability = 'Error';
            outputs.message = 'No attachment sys_id provided';
            return;
        }

        var exclude = inputs.ignore_table_exclusion === true;
        try {
            var result = sn_snap.AntiVirusOnDemandAdvisor.getAvailabilityAfterUpload(sysId, exclude);
            outputs.availability = (result && result.availability) ? (result.availability + '') : 'unknown';
            outputs.message = (result && result.message) ? (result.message + '') : '';
        } catch (e) {
            outputs.availability = 'Error';
            outputs.message = 'SNAP API call failed: ' + e.message;
        }
    })(inputs, outputs);
