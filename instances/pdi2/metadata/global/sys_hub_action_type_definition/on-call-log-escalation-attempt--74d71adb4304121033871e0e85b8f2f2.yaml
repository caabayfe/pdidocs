description: |-
  Creates On-Call escalation attempt record<br/>
  <p style='margin-top: 10px'>
  <b>Inputs:</b><br/>
  <em><b>Escalation Sys ID</b> - Sys Id of the parent escalation (on_call_escalation) record</em><br/>
  <em><b>Rota Sys ID</b> - Sys Id of shift (cmn_rota) record</em><br/>
  <em><b>Level</b> - Number of current escalation level</em><br/>
  <em><b>Contact Attempt</b> - Number of current contact attempt</em><br/><br/>
  <b>Outputs:</b><br/>
  <em><b>Escalation Attempt Record</b> - GlideRecord Object of the escalation attempt (on_call_escalation_con_attempt) record created</em><br/>
  <em><b>State</b> - success or error</em><br/>
  <em><b>Error Message</b> - Error message in case of error state</em><br/>
