  value: |-
    (function execute(inputs, outputs) {
        try {
            var ocEscalationUtil = new OnCallEscalationUtil();

            var table = inputs.table + "";
            var sysId = inputs.sysId + "";
            var communicationType = inputs.communicationType + "";
            var communicationValue = inputs.communicationValue + "";
            var response = inputs.response + "";
            var escalationSysId = inputs.escalationSysId + "";

            var workflowUtil = new OnCallWorkflowUtils();
            if (workflowUtil.isDebugLogEnabled()) {
                gs.log('[On-Call: Set Escalatee Response] flow action params: ' + JSON.stringify({
                    table: table,
                    sysId: sysId,
                    communicationType: communicationType,
                    response: response,
                    escalationSysId: escalationSysId,
                    escalationActiveStatus: workflowUtil.logEscalationActiveStatus(escalationSysId)
                }));
            }

            var result = ocEscalationUtil.setCommunicationResponse(table, sysId, communicationType, communicationValue, response, escalationSysId);

            if (result && result.escalationLogEnabled & !result.success) {
                outputs.error_message = result.error.msg || "";
            }
        } catch (e) {
            outputs.error_message = e.message;
        }
        if (outputs.error_message) outputs.state = "error";
        else outputs.state = "success";
    })(inputs, outputs);
