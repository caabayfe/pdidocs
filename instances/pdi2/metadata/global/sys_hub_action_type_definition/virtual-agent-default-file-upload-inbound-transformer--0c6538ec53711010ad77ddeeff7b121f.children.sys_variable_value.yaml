  value: |-
    
    (function execute(inputs, outputs) {
        try {
            var request_context = inputs.request_context;
            var rich_control = inputs.rich_control;
            var result = {};

            var attachment_value = request_context["attachment_value"];
          
          	if(attachment_value){
              result.url = attachment_value.url;
              result.content_type = attachment_value.content_type;
              result.name = attachment_value.name;
              result.headers = attachment_value.headers;
            }else{
              result.url = request_context["typed_value"];
              result.content_type = "image/jpeg";
    		}
            
            result["search_text"] = "";
            outputs.result = result;
        } catch (e) {
            gs.error( "Error in default file upload inbound transformer: " + e.message);
            outputs.result = e.message;
        }

    })(inputs, outputs);
