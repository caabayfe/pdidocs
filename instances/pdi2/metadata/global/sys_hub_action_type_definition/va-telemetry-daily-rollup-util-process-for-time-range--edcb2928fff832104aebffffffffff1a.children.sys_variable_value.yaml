  value: |-
    (function execute(inputs, outputs) {
        var keyToDurationMap = {};
        var timeIntervalObject = inputs.time_interval_object;
        try {
            var isValid = false;
            if (!gs.nil(timeIntervalObject)) {
                isValid = !gs.nil(timeIntervalObject.startTime);
                isValid = !gs.nil(timeIntervalObject.endTime)
            }

            if (isValid && !inputs.should_flush) {
                var startTime = timeIntervalObject.startTime;
                var endTime = timeIntervalObject.endTime;
                var initialKeyDurationMap = JSON.parse(inputs.key_duration_object_map_string);

                var rollupUtil = new VATelemetryTraceDailyRollupUtil();
                rollupUtil.setInitialKeyToDurationMap(initialKeyDurationMap);
                
                var keyToDurationMap = rollupUtil.processRecordsInIntervalInclusive(startTime, endTime);
            }
            } catch(error) {
                gs.error('Error rolling up for date time range: ' + timeIntervalObject.startTime + ' and ' + timeIntervalObject.endTime + '. Erorr: ' + error);
            }

        outputs.key_duration_object_map = JSON.stringify(keyToDurationMap);
    })(inputs, outputs);
