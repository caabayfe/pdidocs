  value: |-
    (function execute(inputs, outputs) {
        var notifyFlowErrorHandler = new NotifyFlowErrorHandler();

        var notifyActivityGR = inputs.notify_workflow_activity;
        var notifyActivityStatus = notifyActivityGR.getValue(NotifyFlowConstants.COLUMNS.STATE);
        // Check if the state of the notify workflow activity is 'failed'.
        // If the state is 'failed', throw an error with a message indicating the failure of the 'Join Conference Call' activity.
        if (notifyFlowErrorHandler.isActionExecutionFailed(
            notifyActivityStatus
        )) notifyFlowErrorHandler.throwActionExecutionFailed(NotifyFlowConstants.ACTIONS.JOIN_CONFERENCE_CALL);

        if (notifyActivityStatus === NotifyFlowConstants.COLUMN_VALUES.COMPLETE) {
            var responseArgs = notifyActivityGR.getValue(NotifyFlowConstants.COLUMNS.RESPONSE_ARGS);
            var responseArgsJSON = JSON.parse(responseArgs);
            outputs.conference_digit = responseArgsJSON.confDigits ? responseArgsJSON.confDigits : "";
            outputs.response = responseArgsJSON;
        }

        // If no errors are thrown, the 'Join Conference Call' activity has been processed successfully. 
    })(inputs, outputs);
