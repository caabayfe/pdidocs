  value: |-
    (function execute(inputs, outputs) {
        // ... code ...
        var notifyFlowErrorHandler = new NotifyFlowErrorHandler();
        var record = inputs.record;
        var muted = inputs.muted;
        var startOnEnter = inputs.start_on_enter;
        var endOnExit = inputs.end_on_exit;
        var hangupOnStar = inputs.hangup_on_star;
        var beepOnEnter = inputs.beep_on_enter;
        var beepOnExit = inputs.beep_on_exit;
        var enableImmediateInput = inputs.enable_immediate_input;
        var notifyConferenceCallGR = inputs.notify_conference_call;
        var notifyCallGR = inputs.notify_call;
        var additionalConfig = {};

        try {
            if (inputs.additional_config)
                additionalConfig = JSON.parse(inputs.additional_config);
        } catch (error) {
            notifyFlowErrorHandler.throwNotifyFlowActionError("Join Conference Call", error);
        }

        // get the conference friendly name from the conference_call record
        var name = notifyConferenceCallGR.getValue(NotifyFlowConstants.COLUMNS.NUMBER);

        var joinConferenceCallAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.JOIN_CONFERENCE_CALL);
        joinConferenceCallAction.setNotifyCall(notifyCallGR);
        joinConferenceCallAction.setName(name);
        joinConferenceCallAction.setStartOnEnter(startOnEnter);
        joinConferenceCallAction.setEndOnExit(endOnExit);
        joinConferenceCallAction.setMuted(muted);
        joinConferenceCallAction.setHangupOnStar(hangupOnStar);
        joinConferenceCallAction.setRecord(record);
        joinConferenceCallAction.setBeepOnEnter(beepOnEnter);
        joinConferenceCallAction.setBeepOnExit(beepOnExit);
        joinConferenceCallAction.setEnableImmediateInput(enableImmediateInput);
        joinConferenceCallAction.execute(additionalConfig);

        var notifyActivityGR = joinConferenceCallAction.getNotifyActivityGR();
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();

    })(inputs, outputs);
