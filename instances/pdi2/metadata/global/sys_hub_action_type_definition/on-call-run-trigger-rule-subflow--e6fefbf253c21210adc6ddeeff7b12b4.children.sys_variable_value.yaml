    (function execute(inputs, outputs) {
    	var recordGr = new GlideRecord(inputs.record_table + "");
    	if (recordGr.get(inputs.record_sys_id + "")) {
    		new TriggerRule()
    			.setEventName(inputs.event_name + "")
    			.setRule(inputs.trigger_rule_sys_id + "")
    			.setRecord(recordGr)
    			.process();
    	}
    })(inputs, outputs);
