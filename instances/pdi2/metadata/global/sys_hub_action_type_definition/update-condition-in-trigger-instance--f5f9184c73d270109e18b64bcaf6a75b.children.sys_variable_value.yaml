    (function execute(inputs, outputs) {
      var gr = new GlideRecord('sys_pd_trigger_instance');
      gr.get(inputs.sysID)
      gr.trigger_inputs.table = inputs.table;
      gr.trigger_inputs.condition = inputs.condition;
      gr.trigger_inputs.run_trigger = inputs.runTrigger;
      gr.trigger_inputs.run_on_extended = inputs.runOnExtended;
      gr.update();
    })(inputs, outputs);
