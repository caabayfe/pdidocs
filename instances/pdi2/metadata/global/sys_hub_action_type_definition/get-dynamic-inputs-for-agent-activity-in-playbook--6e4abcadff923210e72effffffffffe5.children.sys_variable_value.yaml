  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
    var agent_id= inputs.agent_id;
    var gr=new GlideRecord("sn_aia_agent_config");
    gr.addQuery('agent',agent_id);
    gr.query();
    var isWorkerAgent=false;
    var dynamicInputs=[];
    if(gr.next())
    {
        var run_as_user=gr.getValue('run_as_user');  
        
        if(!gs.nil(run_as_user))
        isWorkerAgent=true;
        if(isWorkerAgent){
              dynamicInputs.push({
              label: gs.getMessage('Supported by'),
              name: 'supported_by',
              type:'string',
              mandatory :true
            });
        }
       
        else{
            dynamicInputs.push({
          label: gs.getMessage('Run as'),
          name: 'run_as',
          defaultValue: '',
          type: 'choice',
          choices: [
              { label: gs.getMessage('Active User'), value: 'active_user' },
              { label: gs.getMessage('User who triggered the playbook'), value: 'user_triggering_playbook' },
              { label: gs.getMessage('User who completed a prior activity'), value: 'prior_activity_user'}
          ]
        });

        }    
    }
    outputs.output = {
            "data": dynamicInputs
        }

    })(inputs, outputs);
