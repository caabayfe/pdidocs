  value: |-
    (function execute(inputs, outputs) {
        // Getting inputs
        var notifyCallGR = inputs.notify_call;

        // Executing Hang up action
        var hangUpAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.HANG_UP);
        hangUpAction.setNotifyCall(notifyCallGR);
        hangUpAction.execute();
        var notifyActivityGR = hangUpAction.getNotifyActivityGR();

        // Setting outputs
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
