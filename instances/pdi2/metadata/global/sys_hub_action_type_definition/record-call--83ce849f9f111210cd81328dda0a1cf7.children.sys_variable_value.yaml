  value: |-
    (function execute(inputs, outputs) {
        var notifyCallGR = inputs.notify_call;
        var timeout = parseInt(inputs.timeout);
        var maxDuration = parseInt(inputs.max_duration);
        var finishKey = inputs.finish_key;

        var recordAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.RECORD_CALL);
        recordAction.setNotifyCall(notifyCallGR);
        recordAction.setMaxDuration(maxDuration);
        recordAction.setTimeout(timeout);
        recordAction.setFinishKey(finishKey);
        recordAction.execute();

        var notifyActivityGR = recordAction.getNotifyActivityGR();
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
