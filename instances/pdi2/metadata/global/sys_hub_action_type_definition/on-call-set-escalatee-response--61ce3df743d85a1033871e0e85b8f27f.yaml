description: |-
  Sets Escalatee Response in On-Call escalation communication record<br/>
  <p style='margin-top: 10px'>
  <b>Inputs:</b><br/>
  <em><b>Table</b> - Table name of source record</em><br/>
  <em><b>Sys ID</b> - Sys Id of source record</em><br/>
  <em><b>Communication Type</b> - Type of communication (email, sms, voice, slack, teams, conference_escalation, mobile_notification)</em><br/>
  <em><b>Communication Value</b> - Value of communication as per type (email address or phone number)</em><br/>
  <em><b>Response</b> - Escalatee response i.e. accepted, rejected or invalid_response etc</em><br/>
  <em><b>Escalation Sys ID</b> - Sys Id of the escalation (on_call_escalation) record (/*optional*/)</em><br/><br/>
  <b>Outputs:</b><br/>
  <em><b>State</b> - success or error</em><br/>
  <em><b>Error Message</b> - Error message in case of error state</em><br/>
