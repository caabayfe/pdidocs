  value: |-
    (function execute(inputs, outputs) {
     
      var taskGr = AutoResolutionTaskDataBroker.getTaskRecord('task', inputs.taskId);
      if (!taskGr.isValidRecord())
        return;
      
      var reminderGr = new GlideRecord(AutoResolutionConstants.REMINDER_TABLE_NAME);
      if (!reminderGr.get(inputs.reminderId))
        return;
      
      var contextGr = new AutoResolutionContextHelper().getContextFromTask(taskGr);
      var logger = new AutoResolutionLoggingUtils()
      					.withName('sla_flow')
      					.withTaskGr(taskGr)
      					.withContextId(contextGr.getUniqueValue())
      					.createLogger();
      
      var userGr = contextGr.notification_user.getRefRecord();
      var userId = userGr.getUniqueValue();
      var userTable = userGr.getValue('sys_class_name');
      var configurationId = contextGr.getValue('configuration');

      var notificationHelper = new AutoResolutionNotificationHelper(userId, userTable, configurationId, logger);
      notificationHelper.sendSMS(taskGr.getTableName(), taskGr.getUniqueValue(), reminderGr.sms.getRefRecord());
      
    })(inputs, outputs);
