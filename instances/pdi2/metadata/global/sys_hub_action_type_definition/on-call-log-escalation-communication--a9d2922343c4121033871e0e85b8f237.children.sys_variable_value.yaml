  value: |-
    (function execute(inputs, outputs) {
        try {
            var ocEscalationUtil = new OnCallEscalationUtil();

            var escalationSysId = inputs.escalationSysId + "";
            var rotaSysId = inputs.rotaSysId + "";
            var level = inputs.level + "";
            var contactAttempt = inputs.contactAttempt + "";
            var escalateeType = inputs.escalateeType + "";
            var escalateeId = inputs.escalateeId + "";
            var communicationType = inputs.communicationType + "";
            var communicationValue = inputs.communicationValue + "";
            var status = inputs.status + "";
            var escalatee = inputs.escalatee;
            var catchAll = inputs.catchAll;

            var result = ocEscalationUtil.logEscalationCommunication(escalationSysId, rotaSysId, level, contactAttempt, escalateeType, escalateeId, communicationType, communicationValue, status, escalatee, catchAll);

            if (result && result.escalationLogEnabled) {
                if (result.success) {
                    outputs.escalation_communication_record = result.logGr;
                } else {
                    outputs.error_message = result.error ? result.error.msg : "";
                }
            }
        } catch (e) {
            outputs.error_message = e.message;
        }
        if (outputs.error_message) outputs.state = "error";
        else outputs.state = "success";
    })(inputs, outputs);
