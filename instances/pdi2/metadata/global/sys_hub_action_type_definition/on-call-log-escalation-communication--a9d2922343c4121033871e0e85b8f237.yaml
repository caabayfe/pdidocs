description: |-
  Creates On-Call escalation communication record<br/>
  <p style='margin-top: 10px'>
  <b>Inputs:</b><br/>
  <em><b>Escalation Sys ID</b> - Sys Id of the parent escalation (on_call_escalation) record</em><br/>
  <em><b>Rota Sys ID</b> - Sys Id of shift (cmn_rota) record</em><br/>
  <em><b>Level</b> - Number of current escalation level</em><br/>
  <em><b>Contact Attempt</b> - Number of current contact attempt</em><br/><br/>
  <em><b>Escalatee Type</b> - Type of Escalatee (user or device)</em><br/>
  <em><b>Escalatee Id</b> - Sys Id of escalatee (sys id of sys_user or cmn_notif_device record)</em><br/>
  <em><b>Communication Type</b> - Type of communication (email, sms, voice, slack, teams, conference_escalation, mobile_notification)</em><br/>
  <em><b>Communication Value</b> - Value for communication as per type (email address or phone number)</em><br/>
  <em><b>Status</b> - Status of communication (sent or failed)</em><br/>
  <em><b>Escalatee</b> - JSON object for escalatee details</em><br/>
  <em><b>Catch All</b> - To check if current escalation level is catch all or not</em><br/><br/>
  <b>Outputs:</b><br/>
  <em><b>Escalation Communication Record</b> - GlideRecord Object of the escalation communication (on_call_escalation_comm) record created</em><br/>
  <em><b>State</b> - success or error</em><br/>
  <em><b>Error Message</b> - Error message in case of error state</em><br/>
