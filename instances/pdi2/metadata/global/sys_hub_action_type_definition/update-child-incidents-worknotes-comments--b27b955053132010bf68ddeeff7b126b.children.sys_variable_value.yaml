  value: |-
    (function execute(inputs, outputs) {
      if(!inputs.parentIncidentGr.isValidRecord()) {
        gs.error('Invalid record reference passed!');
        return;
      }
      var parentSysId = inputs.parentIncidentGr.getUniqueValue();
      var field = inputs.field;
      var value = inputs.value;
      var FLOW_ACTION_NAME = 'update_child_incident flow action: '
      var copyCommentToChild = gs.getProperty("com.snc.incident.copy_comments_to_non_resolved_childInc", false);
      
      var rec = new GlideRecord("incident");
      rec.addQuery("parent_incident", parentSysId);
      if (copyCommentToChild == "true") {
        var stateChange = inputs.state_changes ? inputs.state_changes : false;
        if (!stateChange) {
          rec.addQuery("state", "!=", IncidentState.RESOLVED);
        }
      } else {
        rec.addQuery("state", "!=", IncidentState.RESOLVED);
      }
      rec.addActiveQuery();
      rec.query();
      
      while (rec.next()) {
        var gr = new GlideRecord('incident');
        if (gr.get(rec.getUniqueValue()) && gr.isValidField(field)) {
            gr[field] = value;
            gr.update();
        } else
            gs.error(FLOW_ACTION_NAME + field + ' is not a valid field on ' + rec.getUniqueValue());
      }
    })(inputs, outputs);
