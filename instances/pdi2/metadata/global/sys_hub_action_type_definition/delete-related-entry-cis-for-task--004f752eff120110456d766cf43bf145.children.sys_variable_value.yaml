  value: |-
    (function execute(inputs, outputs) {
    	outputs.error = false;
        outputs.error_message = '';
        outputs.notes = '';

    	var totalCount = 0;
    	var deletedCount = 0;
        
      	try {
        	var helper = new global.CMDBDataManagerHelper();
      
        	var taskGlideRecord = inputs.task; 		
        	var taskSysId = taskGlideRecord.getUniqueValue();

    		totalCount = helper.getCiCount(taskSysId);

            var batchSize = helper.getBatchSize();
    		var batchCount = helper.getBatchCount(totalCount, batchSize);
        	var startIndex = 0;
        	var endIndex = batchSize
    		var sysIds = [];

    		//get the related table name
    	    var taskToDocumentTable = helper.getTaskToCiTableByTaskId(taskSysId);
    		if (JSUtil.nil(taskToDocumentTable))
              throw "No taskToDocumentTable found for the policy id: "+taskGlideRecord.policy_id;

    		var relatedTable = helper.getRelatedTabelName(taskSysId, taskToDocumentTable);
    		if (JSUtil.nil(relatedTable))
              throw "No related table found for the policy id: "+taskGlideRecord.policy_id;

            while (batchCount > 0) {
                sysIds = helper.getTaskToDocumentSysIds(startIndex, endIndex, taskSysId, taskToDocumentTable);
                helper.deleteRelatedTableCIs(relatedTable, sysIds);
                deletedCount += sysIds.length;
          		startIndex = endIndex;
          		endIndex = endIndex + batchSize;
          		batchCount--;
        	}
        } catch(e) {
        	outputs.error = true;
            outputs.error_message = e.getMessage();
        } finally {
    		outputs.notes = "Summary - Total Related Table Items Count:" + totalCount + " Deleted Count:" + deletedCount + " Failed Count:" + (totalCount - deletedCount);
        }

    })(inputs, outputs);
