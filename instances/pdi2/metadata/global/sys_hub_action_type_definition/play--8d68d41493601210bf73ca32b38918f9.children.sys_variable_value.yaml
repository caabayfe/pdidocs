  value: |-
    (function execute(inputs, outputs) {
        // Getting inputs
        var url = inputs.url;
        var loop = Number(inputs.loop);
        var notifyCallGR = inputs.notify_call;

        // Execute Play action
        var playAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.PLAY);
        playAction.setURL(url);
        playAction.setLoop(loop);
        playAction.setNotifyCall(notifyCallGR);
        playAction.execute();
        var notifyActivityGR = playAction.getNotifyActivityGR();

        // Setting outputs
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
