  value: |-
    (function execute(inputs, outputs) {
      var grDef = new GlideRecord('sys_pd_trigger_definition');
      var grIns = new GlideRecord('sys_pd_trigger_instance');
      grDef.get(inputs.defSysID);
      grIns.get(inputs.insSysID);
      grIns.trigger_inputs.table = grDef.trigger_inputs.table;
      grIns.trigger_inputs.condition = grDef.trigger_inputs.condition;
      grIns.trigger_inputs.run_trigger = grDef.trigger_inputs.run_trigger;
      grIns.trigger_inputs.run_on_extended = grDef.trigger_inputs.run_on_extended;
      grIns.update();
    })(inputs, outputs);
