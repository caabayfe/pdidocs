  value: |-
    (function execute(inputs, outputs) {
        var changeRequestGR = new GlideRecord('change_request');
        changeRequestGR.addQuery('sys_id', inputs.sysId);
        changeRequestGR.setWorkflow(false);
        changeRequestGR.query();
        while(changeRequestGR.next()) {
            changeRequestGR.setValue('state', '3');
            changeRequestGR.setValue('active', 'false');
            changeRequestGR.setValue('comments', inputs.comments);
            changeRequestGR.setValue('close_code', inputs.close_code);
            changeRequestGR.setValue('close_notes', inputs.close_notes);
            changeRequestGR.update();
            outputs.status = true;
            return;
        }
        outputs.status = false;
    })(inputs, outputs);
