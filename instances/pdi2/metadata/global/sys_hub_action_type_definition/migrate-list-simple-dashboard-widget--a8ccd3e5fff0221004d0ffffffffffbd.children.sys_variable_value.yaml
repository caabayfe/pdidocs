  value: |-
    (function execute(inputs, outputs) {
        const SIMPLE_LIST_MACROPONENT_ID = "2b1c080881e05dc63b917044290b233f";
        const ANALYTICS_LIST_MACROPONENT_ID = "7ff373544303121093711347efb8f23c";
        const LOG_PREFIX = "[Flow action: Migrate List - Simple Dashboard Widget] ";
        const migrationUtils = new global.AnalyticsListMigrationUtils();
        var widgetGr = inputs.widget;
        try {
            var widgetSysId = widgetGr.getUniqueValue();
            if (widgetGr.getValue('component') !== SIMPLE_LIST_MACROPONENT_ID) {
                gs.error(`${LOG_PREFIX} The given dashboard widget - ${widgetSysId} is not a List - Simple widget and hence is not eligible for migration.`);
                outputs.ismigrated = false;
                return;
            }
            // Don't migrate if protection policy for the record is read/protected.
            if(widgetGr.getValue('sys_policy') === "read" || widgetGr.getValue('sys_policy') === "protected") {
                gs.info(`${LOG_PREFIX} The protection policy for the given dashboard widget - ${widgetSysId} is either read-only or protected and hence is not eligible for migration.`);
                outputs.ismigrated = false;
                return;
            }
            
            var simpleListProps = JSON.parse(widgetGr.getValue('component_props'));
            var analyticsListProps = migrationUtils._getAnalyticsListProps(simpleListProps);
            widgetGr.setValue('component_props', analyticsListProps);
            widgetGr.setValue('component', ANALYTICS_LIST_MACROPONENT_ID);
            // Note that we are using updateNoDomain because widgets are domain separated and we do on the fly migration as system user.
            if (!widgetGr.updateNoDomain()) {
                gs.error(`${LOG_PREFIX} Analytics list component migration failed for dashboard widget - ${widgetSysId}`);
                outputs.ismigrated = false;
                return;
            }
            outputs.ismigrated = true;
            gs.info(`${LOG_PREFIX} Successfully migrated List - Simple dashboard widget - ${widgetSysId} to Analytics list component.`);
            
        } catch (e) {
            outputs.ismigrated = false;
            gs.error(`${LOG_PREFIX} Analytics list component migration failed for dashboard widget - ${widgetSysId} - ${e}`);
        }
    })(inputs, outputs);
