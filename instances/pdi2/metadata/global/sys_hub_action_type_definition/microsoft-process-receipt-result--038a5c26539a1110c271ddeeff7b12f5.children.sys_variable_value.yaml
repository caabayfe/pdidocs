  value: |-
    (function execute(inputs, outputs) {

      var output = {};
      
      // Parse result string.
      var result = JSON.parse(inputs['input']);
      
      // Check if result has data.
      if (result.hasOwnProperty("analyzeResult") && result["analyzeResult"].hasOwnProperty("documentResults")) {
      	result = result["analyzeResult"]["documentResults"][0];
        
        // Extract fields .
        var fields = result["fields"];

        if (fields.hasOwnProperty("TransactionDate")) {
          output["transaction_date"] = fields["TransactionDate"]["valueDate"];
        }

        if (fields.hasOwnProperty("MerchantName")) {
          output["merchant_name"] = fields["MerchantName"]["valueString"];
        }

        if (fields.hasOwnProperty("MerchantAddress")) {
          output["merchant_address"] = fields["MerchantAddress"]["valueString"];
        }

        if (fields.hasOwnProperty("Tax")) {
          output["tax"] = fields["Tax"]["valueNumber"];
        }

        if (fields.hasOwnProperty("Subtotal")) {
          output["sub_total"] = fields["Subtotal"]["valueNumber"];
        }

        if (fields.hasOwnProperty("Total")) {
          output["total"] = fields["Total"]["valueNumber"];
        }

        // Extract items
        if (fields.hasOwnProperty("Items")) {

          var items = [];
          var itemArray = fields["Items"]["valueArray"];

          for (var idx in itemArray) {
            var valueObject = itemArray[idx]["valueObject"];
            var item = {};

            if (valueObject.hasOwnProperty("Name")) {
              item["name"] = valueObject["Name"]["valueString"];
            }

            if (valueObject.hasOwnProperty("TotalPrice")) {
              item["price"] = valueObject["TotalPrice"]["valueNumber"];
            } else if (valueObject.hasOwnProperty("Price")) {
              item["price"] = valueObject["Price"]["valueNumber"];
            }

            if (valueObject.hasOwnProperty("Quantity")) {
              item["quantity"] = valueObject["Quantity"]["valueNumber"];
            }
            
            items.push(item);
          }

          output["items"] = items;
        }
        
      } else {
        output["message"] = "No Data found in receipt."; 
      }
      
      
     
      outputs.output = output;
      
    })(inputs, outputs);
