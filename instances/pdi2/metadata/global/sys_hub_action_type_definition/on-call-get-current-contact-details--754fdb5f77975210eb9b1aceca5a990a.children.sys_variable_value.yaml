  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
        var onCallContactPrefUtil = new OnCallContactPreferenceUtil();
    	var currentContactNumber = inputs.currentContactNumber;
        var sentUserIds = inputs.sentUserIDs;
        var rejectedUserSysIDs = inputs.rejectedUserSysIDs;
        var contacts = JSON.parse(inputs.contacts);
        if (!sentUserIds) {
            sentUserIds = [];
        }
        if (!rejectedUserSysIDs) {
            rejectedUserSysIDs = [];
        }

        var currentContact;
        var wentIn = false;
        while (contacts.length > currentContactNumber) {
            currentContact = contacts[currentContactNumber];
    		var currentUserId = (currentContact.type === 'device' && currentContact.device_has_user) ? currentContact.user_id : currentContact.sys_id;
            if (rejectedUserSysIDs.indexOf(currentUserId) >= 0) {
                var journalField = inputs.journalField;
                if (inputs.current.isValidField(journalField)) {
                    var reminders = inputs.reminderSentNum;
                    var levels = ['', 'st', 'nd', 'rd'];
                    var levelName = reminders + ((reminders > 3) ? 'th' : levels[reminders]);
                    var message = gs.getMessage("Skipping communication to user {0} - {1} reminder", [currentContact.name, levelName]);
                    if (currentContact.type === 'device' && currentContact.device_has_user)
                        message = gs.getMessage("Skipping communication to device {0} - {1} reminder", [currentContact.name, levelName]);
                    inputs.current[journalField] = message;
                    inputs.current.update();
                }
                currentContactNumber++;
                continue;
            }
            outputs.current_preference_number = 0;
            var preferences = onCallContactPrefUtil.getPreferencesByContact(currentContact, true);
            outputs.current_contact_preferences = JSON.stringify(preferences);
            addCommunicationComment(currentContact, preferences);
            if (sentUserIds.indexOf(currentUserId) == -1)
                sentUserIds.push(currentUserId);
            currentContactNumber++;
            outputs.current_contact_number = currentContactNumber;
            outputs.sent_user_ids = sentUserIds;
            outputs.current_contact = currentContact;
            outputs.more_contacts_available = true;
            wentIn = true;
            break;
        }
        if(!wentIn) {
            outputs.more_contacts_available = false;
        }


    function addCommunicationComment(contact, preferences) {
        var onCallConstants = new OnCallConstants();
        var name = contact.name;
        var communicationTypes = [];
        var preferenceTypes = [];
        
        for (var j = 0; j < preferences.length; j++) {
            var pref = preferences[j];

            var eps = new GlideScriptedExtensionPoint().getExtensions(onCallConstants.EXTENSION_POINT.ON_CALL_COMMUNICATION);
    		for (var i = 0; i < eps.length; i++) {
    			if (eps[i].handle(pref.type)) {
                    var channelLabel = eps[i].getCommunicationTypeLabel();
    				preferenceTypes.push(channelLabel);
                    if (eps[i].isValidPreference(pref) && eps[i].isChannelPluginInstalled()) 
                        communicationTypes.push(channelLabel);
    			}
    		}
        }

        communicationTypes = communicationTypes.join(', ');
        preferenceTypes = preferenceTypes.join(', ');
    	var journalField = inputs.journalField;
    	if (!inputs.current.isValidField(journalField))
    		return;

        var reminders = inputs.reminderSentNum;
        var message = "";
        if (reminders > 0) {
            var levels = ['', 'st', 'nd', 'rd'];
            var levelName = reminders + ((reminders > 3) ? 'th' : levels[reminders]);
            if (communicationTypes)
                message = gs.getMessage("Sent communication to {0} (by {1}) - {2} reminder", [name, communicationTypes, levelName]);
            else
                message = gs.getMessage("Unable to send communication to {0} (by {1}) - {2} reminder", [name, preferenceTypes, levelName]);
        } else {
            if (communicationTypes)
                message = gs.getMessage("Sent communication to {0} (by {1})", [name, communicationTypes]);
            else
                message = gs.getMessage("Unable to send communication to {0} (by {1})", [name, preferenceTypes]);
        }
        inputs.current[journalField] = message;
        inputs.current.update();
    }

    function getUserGr(userId) {
        var userGr = new GlideRecord('sys_user');
        if (userId)
            if (userGr.get(userId))
                return userGr;
    }

    function getDeviceGr(deviceId) {
        var deviceGr = new GlideRecord('cmn_notif_device');
        if (deviceId)
            if (deviceGr.get(deviceId))
                return deviceGr;
    }
    })(inputs, outputs);
