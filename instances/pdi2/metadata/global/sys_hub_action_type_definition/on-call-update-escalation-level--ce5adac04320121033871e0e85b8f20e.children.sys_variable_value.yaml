  value: |-
    (function execute(inputs, outputs) {
        try {
            var ocEscalationUtil = new OnCallEscalationUtil();

            var escalationSysId = inputs.escalationSysId + "";
            var rotaSysId = inputs.rotaSysId + "";
            var level = inputs.level + "";
            var catchAll = inputs.catchAll;

            ocEscalationUtil.logDebugMessage("[On-Call: Update Escalation Level] flow action params: " + JSON.stringify({
                escalationSysId: escalationSysId, 
                rotaSysId: rotaSysId, 
                level: level, 
                catchAll: catchAll 
            }));

            if (gs.nil(escalationSysId)) outputs.error_message = "Invalid escalation sys id";
            else if (gs.nil(rotaSysId)) outputs.error_message = "Invalid rota sys id";
            else if (gs.nil(level)) outputs.error_message = "Invalid level";
            else {
                var ocEscalationGr = new GlideRecord("on_call_escalation_level");
                ocEscalationGr.addQuery("escalation", escalationSysId);
                ocEscalationGr.addQuery("rota", rotaSysId);
                ocEscalationGr.addQuery("level", level);
                if (catchAll + "" == "true")
                    ocEscalationGr.addQuery("catch_all", true);
                ocEscalationGr.query();
                if (ocEscalationGr.next()) {
                    ocEscalationGr.level_end_time = new GlideDateTime().getDisplayValue();
                    ocEscalationGr.update();
                } else outputs.error_message = "Unable to find escalation level record";
            }
        } catch (e) {
            outputs.error_message = e.message;
        }
        if (outputs.error_message) outputs.state = "error";
        else outputs.state = "success";
    })(inputs, outputs);
