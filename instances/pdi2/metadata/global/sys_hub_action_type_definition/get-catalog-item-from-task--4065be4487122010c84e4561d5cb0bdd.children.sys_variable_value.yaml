  sys_updated_on: 2021-02-10 13:41:28
  value: |-
    (function execute(inputs, outputs) {
     
      var grProduced = new GlideRecord('sc_item_produced_record');
      grProduced.addQuery('task', inputs.task.getUniqueValue());
      grProduced.query();
      if (grProduced.next())
        outputs.item_id = grProduced.getValue('producer');
      else if (inputs.task.getRecordClassName() == 'sc_req_item') {
        if (inputs.task.getElement('cat_item')) {
             outputs.item_id = inputs.task.getValue('cat_item');
        } else {
            var ritmGR = new GlideRecord('sc_req_item');
            if (ritmGR.get(inputs.task.getUniqueValue()))
              outputs.item_id = ritmGR.getValue('cat_item');
        }
      }
      
    })(inputs, outputs);
