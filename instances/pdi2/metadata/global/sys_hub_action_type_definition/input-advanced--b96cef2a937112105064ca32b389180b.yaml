description: |-
  Read a menu to a user and wait for the input response.

  A response is returned when:
       1. The user enters the expected number of digits.
       2. The user presses the finish key.
       3. The user does not respond within the specified timeout duration.
  An empty string is returned if the user does not press anything.

  User's response is returned as an ouput and can be accessed  as Input > Input response in Flow designer.
