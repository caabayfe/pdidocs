  value: |-
    (function execute(inputs, outputs) {

      var Logger = new global.SentimentAnalysisLogger("GoogleSentimentAnalysis-GetSentimentScore");
      var result = {};
      if(inputs['StatusCode'] != '200') { 
      	result = {
          			"Status Code" : inputs['StatusCode'],
          			"Error Message" : inputs['ErrorMessage']
                 };
      }
      else {
        Logger.debug('GetSentimentScore ResponseBody - {0}',inputs['ResponseBody']);
        var sentimentScore = {};
        var messageList = inputs['MessageList'];
    	var messageIds = inputs['MessageIds'];
        var conversationId = inputs['conversationId'];
        var endConversation = inputs['endConversation'];
        var responseBody = JSON.parse(inputs['ResponseBody']);
        var sentences = responseBody.sentences;
        var documentSentiment = responseBody.documentSentiment;
        var scoreList = [];
        var score = 0;
        var count = 0;
        var index = 0;
        
        result['factor'] = 1;  
     
        if((messageList.length != messageIds.length) || (messageList[0] && !messageIds[0])) {
        	var columnName = messageList[0];
          	sentimentScore[columnName] = documentSentiment.score; 
          	result['messageSentimentScore'] = sentimentScore;
        }
        else if (messageList.length == 1 && messageIds.length == 1) {
            sentimentScore[messageIds[0]] = documentSentiment.score; 
            result['conversationId'] = conversationId;
          	result['sentimentScore'] = sentimentScore;
            result['messageId'] = messageIds[0];
        }
        else if (messageList[0] && messageIds[0]){
        	for(var idx = 0; idx<sentences.length; idx++) {
        		if(messageList[index].length + 2 <= sentences[idx].text.beginOffset) {
            		scoreList[index] = score/count;
            		index++;
            		score = 0;
            		count = 0;        
            	}
        		score += sentences[idx].sentiment.score;
        		count++;
            }
          
        	scoreList[index] = score/count;
          
        	for(var msgIndex = 0; msgIndex < messageList.length; msgIndex++) {
        		var columnName = messageIds[msgIndex];
          		sentimentScore[columnName] = scoreList[msgIndex];
        	}
          
      		result['conversationId'] = conversationId;
          	result['sentimentScore'] = sentimentScore;
            result['documentSentimentScore'] = documentSentiment.score;
        
        }    
        else {
      		Logger.info('No Message for sentiment Analysis');
      	}
      }
      
      
      Logger.debug('GetSentimentScore result - {0}',JSON.stringify(result));   
      outputs['endConversation'] = endConversation;
      outputs['result'] = result;
    })(inputs, outputs);
