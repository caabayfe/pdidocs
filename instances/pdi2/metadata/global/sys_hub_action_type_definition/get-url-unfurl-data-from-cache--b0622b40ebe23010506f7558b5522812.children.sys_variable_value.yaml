  value: |-
    (function execute(inputs, outputs) {
      outputs.is_unfurl_data_present = false;
      outputs.url_unfurl_data = "";

      var cacheEnabled = gs.getProperty("com.glide.cs.enable_link_unfurling_cache", "true");
      if (cacheEnabled == "true") {
        var logContext = new sn_log.GlideLogContext({'conversation': inputs.conversation_id});
        var result = new UrlUnfurlingCacheUtils().getDataFromCache(inputs.url, inputs.device_type);
        logContext.clear();

        outputs.is_unfurl_data_present = result.is_unfurl_data_present;
        outputs.url_unfurl_data = result.url_unfurl_data;
      } else {
        var logUtil = new LinkUnfurlingLoggingUtils();
        logUtil.atInfo(inputs.url, inputs.conversation_id).log("Skipping cache lookup as the cache for link unfurling has been disabled.");
      }

    })(inputs, outputs);
