    	outputs.status = 'success';
      try {
        	var blockRunner = new AutoResolutionSimulationRunBlock(inputs.simulation_run_block_sys_id);
    	    blockRunner.continueOnBatchError(inputs.continue_on_batch_error);
    	    blockRunner.setBatchSize(parseInt(inputs.batch_size));
