description: |-
  <p>Creates a new flow data record. This may be used to capture inputs from the user during flow execution.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><strong>Definition</strong> - Flow Data Definition that defines the inputs to gather.</li>
  <li><b>Assigned To</b> - (Optional) User required to provide flow data inputs.</li><li><b>Automated</b> - When checked, does not wait for flow data to be in a completed state.</li></ul>

  <p><b>Outputs:</b></p>
  <ul><li><b>Record</b> - Flow Data Record created.</li><li><b>Data</b> - Data Definition inputs collected by Flow Data record</li></ul>
