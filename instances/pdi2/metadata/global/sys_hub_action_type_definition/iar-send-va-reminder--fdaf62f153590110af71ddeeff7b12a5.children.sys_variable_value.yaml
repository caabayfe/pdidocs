  value: |-
    (function execute(inputs, outputs) {
      var botUserId = AutoResolutionUtil.getBotUserId(inputs.taskTableName);
      var systemUserId = gs.getUserID();
      var impersonateApi = new GlideImpersonate();
      impersonateApi.impersonate(botUserId);

      var taskGr = AutoResolutionTaskDataBroker.getTaskRecord('task', inputs.taskId);
      
      var contextGr = new AutoResolutionContextHelper().getContextFromTask(taskGr);
      var duration = new GlideDuration();
      duration.setValue(inputs.duration);
      
      gs.eventQueue("sn_cs.iar.reminder.va", contextGr, inputs.percentage, duration.getDisplayValue());
      impersonateApi.impersonate(systemUserId);
      
    })(inputs, outputs);
