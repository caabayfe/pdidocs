  value: |-
    (function execute(inputs, outputs) {
      var flow_data = new GlideRecord('sys_flow_data');
      flow_data.get(inputs.flow_data_sys_id);
      
      var table, record, fields;
      
      if((flow_data.vars.table + "")!='')
        table = flow_data.vars.table + "";
      if((flow_data.vars.record + "")!='')
        record = flow_data.vars.record + "";
      if((flow_data.vars.fields + "")!='')
        fields = flow_data.vars.fields + "";
      
      if(table && fields && record){
        var gr = new GlideRecord(table);
        gr.get(record);
        gr.applyEncodedQuery(fields);
        if(gr.update()){
    	    outputs.table = table;
        	outputs.record = gr.sys_id;
          	outputs.status = 'success';
        } else {
          outputs.status = "error";
        }
      } else {
        outputs.status="missing_data";
      }
      
    })(inputs, outputs);
