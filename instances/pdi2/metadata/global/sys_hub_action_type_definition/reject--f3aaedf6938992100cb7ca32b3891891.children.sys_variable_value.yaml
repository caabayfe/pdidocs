  sys_tags: ''
  sys_updated_by: admin
  sys_updated_on: 2024-12-03 14:04:37
  value: |-
    (function execute(inputs, outputs) {
        // Getting inputs
        var reason = inputs.reason;
        var notifyCallGR = inputs.notify_call;

        // Executing Reject action
        var rejectAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.REJECT);
        rejectAction.setReason(reason);
        rejectAction.setNotifyCall(notifyCallGR);
        rejectAction.execute();
        var notifyActivityGR = rejectAction.getNotifyActivityGR();

        // Setting outputs
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
