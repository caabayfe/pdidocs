  sys_tags: ''
  sys_updated_by: admin
  sys_updated_on: 2025-03-20 05:40:31
  value: |-
    (function execute(inputs, outputs) {
      
      outputs.should_send_notification = false;
      outputs.send_email = false;
      outputs.send_va = false;
      outputs.send_sms = false;
      
    var botUserId = AutoResolutionUtil.getBotUserId(inputs.taskTableName);
      var systemUserId = gs.getUserID();
      var impersonateApi = new GlideImpersonate();
      impersonateApi.impersonate(botUserId);

      var taskHelper = new AutoResolutionTaskHelper();
      var taskGr = AutoResolutionTaskDataBroker.getTaskRecord('task', inputs.taskId);
      if (gs.nil(taskGr))
        return;

      // var configValues = AutoResolutionUtil.getConfigurationFieldValuesForTaskTable(taskGr.getValue('sys_class_name'), ['active', 'sys_id']);
      var configValues = AutoResolutionUtil.getConfigurationFieldValuesForTaskTable(inputs.taskTableName, ['active', 'sys_id']);
      var contextGr = new AutoResolutionContextHelper().getContextFromTask(taskGr);

      outputs.catalog_submitted = contextGr.getValue('catalog_submitted') === '1';
      if (outputs.catalog_submitted)
        return;
      
      var validContext = !gs.nil(contextGr) && contextGr.getValue('active') === '1';
      var logger = new AutoResolutionLoggingUtils()
      		.withName('reminder_sla_flow')
            .withContextId(contextGr.getUniqueValue())
      		.withTaskGr(taskGr)
      		.withConfiguration(configValues.sys_id)
      		.createLogger();
      
      if (taskHelper.isTaskAssignedToBotUser(taskGr) && configValues.active === '1' && validContext) {
        outputs.should_send_notification = true;
      } else {
        logger.warn('Skipping reminder notification because task, IAR context, or IAR configuration is no longer valid');
        return;
      }
      
      var userGr = contextGr.notification_user.getRefRecord();
      var notificationHelper = new AutoResolutionNotificationHelper(userGr.getUniqueValue(), userGr.getTableName(), configValues.sys_id);
      var channels = notificationHelper.getResponseChannelObjectList();
      var channelNames = [];
      var channel;

      for (var i in channels) {
        channel = channels[i];
        switch (channel.name) {
          case AutoResolutionNotificationHelper.RESPONSE_CHANNEL.EMAIL:
            outputs.send_email = channel.shouldSend;
            break;
          case AutoResolutionNotificationHelper.RESPONSE_CHANNEL.VA:
            outputs.send_va = channel.shouldSend;
            break;
          case AutoResolutionNotificationHelper.RESPONSE_CHANNEL.SMS:
            outputs.send_sms = channel.shouldSend;
            break;
          default:
            logger.warn('Unknown response channel detected: {0}', channel.name);
        }
        
        if (!channel.shouldSend)
          logger.warn('Skipping {0} reminder notification because {1}', channel.name, channel.reason);
        else
          channelNames.push(channel.name);
      }
      

      if (channelNames.length > 0) {
        var duration = new GlideDuration();
    	  duration.setValue(inputs.duration);
        taskGr.work_notes = gs.getMessage("The user reached {0}% of {1} SLA.  I'll send a reminder notification to the following channels: {2}",
                                         [inputs.percentage, duration.getDisplayValue(), channelNames.join(', ')]);
        AutoResolutionTaskDataBroker.updateTaskRecord(taskGr);
      }

      impersonateApi.impersonate(systemUserId);
        
    })(inputs, outputs);
