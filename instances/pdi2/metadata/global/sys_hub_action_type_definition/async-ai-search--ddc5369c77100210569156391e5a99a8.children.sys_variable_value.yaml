  value: |-
    (function execute(inputs, outputs) {

        var context = JSON.parse(inputs.logging_context);
        var actionStartTime = new GlideDateTime().getNumericValue() - parseInt(inputs.start_time);
        VAAISearchHelper.getLogger(context).debug('Async AI Search FDIH action started: {0}ms', actionStartTime);

        var additionalContext = inputs.additional_context ? inputs.additional_context : "{}";
        var grConfigFilter = inputs.gr_config_filter ? inputs.gr_config_filter.toString().split(","): [];

        try {
            var api = new AISearchRetrieveSearchResultsWrapper();
            if (inputs.callback_mode === "multiple") {
                var searchResults = api.retrieveSearchResultsMultipleCallbacks(inputs.callback_id, inputs.search_term, inputs.context_profile_id, inputs.search_context_id,
                    inputs.logging_context, inputs.locale, additionalContext, inputs.conversation_id, grConfigFilter, inputs.search_result_type);
            } else {
                var searchResults = api.retrieveSearchResultsAsync(inputs.callback_id, inputs.search_term, inputs.context_profile_id, inputs.search_context_id,
                    inputs.logging_context, inputs.locale, additionalContext, grConfigFilter, inputs.search_result_type, inputs.conversation_id);
            }
            
            var resultObj = JSON.parse(searchResults);
            outputs.search_results = resultObj;
            if (VAAISearchHelper.isResponseSync(resultObj)) {
                outputs.end_time = new GlideDateTime().getNumericValue().toString();
            } else {
                outputs.callback_id = inputs.callback_id;
                outputs.callback_mode = inputs.callback_mode;
            }
        } catch (ex) {
          VAAISearchHelper.getLogger(context).error("Error retrieving Async search results: {0}", ex.toString());
          var defaultResponse = "{\n" +
          "  \"result\": [\n" +
          "    {\n" +
          "      \"executionResult\": {\n" +
          "          \"searchMetadata\": {\n" +
    	    "              \"searchResultMetadata\": {\n" +
    	    "                  \"searchTerm\": \"" + inputs.search_term + "\"\n" +
    	    "              }\n" +
    	    "          },\n" +
          "          \"searchResultsTemplates\": {\n" +
          "              \"items\": [\n" +
          "              ]\n" +
          "          },\n" +
          "          \"geniusResultsTemplates\": {\n" +
          "              \"items\": [\n" +
          "              ]\n" +
          "           }\n" +
          "      },\n" +
          "      \"errors\": [],\n" +
          "      \"status\": 204\n" +
          "    }\n" +
          "  ]\n" +
          "}";
          outputs.search_results = JSON.parse(defaultResponse);
          outputs.end_time = new GlideDateTime().getNumericValue().toString();
        }

    })(inputs, outputs);
