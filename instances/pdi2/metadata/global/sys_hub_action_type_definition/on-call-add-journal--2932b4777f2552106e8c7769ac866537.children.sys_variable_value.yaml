    (function execute(inputs, outputs) {
        var table = inputs.table + "";
        var sysId = inputs.sysid + "";
        var journal_field = inputs.jornal_field + "";
        var journal_value = inputs.journal_value + "";
        var sourceGr = new GlideRecord(table);
        if (sourceGr.get(sysId)) {
    	    if (sourceGr.isValidField(journal_field)){
    		    sourceGr[journal_field] = journal_value;
            }
            else{
                throw new Error("Not valid field.");
            }
            sourceGr.update();
        }
        else {
            throw new Error("Record Not found.")
        }
    })(inputs, outputs);
