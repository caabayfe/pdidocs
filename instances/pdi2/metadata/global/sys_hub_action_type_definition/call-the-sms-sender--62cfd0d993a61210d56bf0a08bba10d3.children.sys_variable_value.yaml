  value: |-
    (function execute(inputs, outputs) {
        // ... code ...
        var notifyNumber = inputs.notify_number;
        var phoneNumber = inputs.phone_number;
        var notifyConferenceCall = inputs.notify_conference_call;

        if (!notifyNumber || typeof notifyNumber !== "string")
            throw new Error("notify_number is required and must be a string.");

        if (!phoneNumber || typeof phoneNumber !== "string")
            throw new Error("phone_number is required and must be a string.");

        if (!notifyConferenceCall || !(notifyConferenceCall.isValidRecord()))
            throw new Error("notify_conference_call is required and must be a valid GlideRecord.");

        new SNC.Notify().call(notifyNumber, phoneNumber, notifyConferenceCall);

    })(inputs, outputs);
