  value: |-
    (function execute(inputs, outputs) {
        var notifyFlowErrorHandler = new NotifyFlowErrorHandler();

        // Check if the state of the notify workflow activity is 'failed'.
        // If the state is 'failed', throw an error with a message indicating the failure of the 'Input' activity.
        var notifyActivityGR = inputs.notify_workflow_activity;
        if (notifyFlowErrorHandler.isActionExecutionFailed(
            notifyActivityGR.getValue(NotifyFlowConstants.COLUMNS.STATE)
        )) notifyFlowErrorHandler.throwActionExecutionFailed(NotifyFlowConstants.ACTIONS.INPUT);

        // If no errors are thrown, the 'Input' activity has been processed successfully.

        // Setting output
        outputs.input_response = JSON.parse(notifyActivityGR.response_args).digits;
    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
