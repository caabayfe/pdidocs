  value: |-
    (function execute(inputs, outputs) {
        // Getting inputs
        var numberOfDigits = Number(inputs.number_of_digits);
        var finishKey = inputs.finish_key;
        var timeout = Number(inputs.timeout);
        var text = inputs.text;
        var notifyCallGR = inputs.notify_call;

        // Executing Input action
        var inputAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.INPUT);
        inputAction.setTimeout(timeout);
        inputAction.setFinishKey(finishKey);
        inputAction.setNumberOfDigits(numberOfDigits);
        inputAction.setNotifyCall(notifyCallGR);
        inputAction.execute(text);
        var notifyActivityGR = inputAction.getNotifyActivityGR();

        // Setting outputs
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
