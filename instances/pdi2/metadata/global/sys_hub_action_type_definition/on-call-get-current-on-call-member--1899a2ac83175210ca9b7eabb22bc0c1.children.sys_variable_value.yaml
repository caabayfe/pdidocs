  value: |-
    (function execute(inputs, outputs) {
        var rota = new OnCallRotation();
        rota.who(inputs.triggerGroupSysId);
        var primaryUsers = rota.getPrimaryUsers();
        var currentOnCall = '';
        var currentRoster = '';
        Object.keys(primaryUsers).forEach(function(primaryUserKey) {
            if (!currentOnCall && primaryUsers[primaryUserKey].userSysId) {
                currentOnCall = primaryUsers[primaryUserKey].userSysId;
                currentRoster = primaryUsers[primaryUserKey].rosterId;
            }
        });
        outputs.on_call_user_sys_id = currentOnCall;
        outputs.on_call_roster_sys_id = currentRoster;
    })(inputs, outputs);
