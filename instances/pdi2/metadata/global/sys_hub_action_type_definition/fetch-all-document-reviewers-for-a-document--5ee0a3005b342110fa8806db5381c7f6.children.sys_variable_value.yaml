  value: |-
    (function execute(inputs, outputs) {
        var doc = inputs.document;
        var reviewers = [];
        var reviewerGR = new GlideRecord('ds_document_reviewer');
      
        reviewerGR.addQuery('document', doc.getUniqueValue());
        reviewerGR.query();
        reviewerGR.next();
        if (reviewerGR != null) {
            var userR = reviewerGR.getValue('reviewer');
        	reviewers.push(userR);
        }
        var prev = reviewerGR;
    	
        while (reviewerGR.next()) {
            var nxt = reviewerGR;
            var userR = reviewerGR.getValue('reviewer');
        	reviewers.push(userR);
            prev = reviewerGR;
        }
      	var documentDB = new PlatformDocMgmtDB();
      	var reviewerCount = documentDB.getNumberOfReviewers(doc.getUniqueValue());
      	var reviewerSysIDs = "";
        for (var i = 0;i < reviewers.length;i++) { 
           var r = reviewers[i];
           if (i == reviewers.length - 1) 
           		reviewerSysIDs += r;
           else
           		reviewerSysIDs += r + ",";
        }
        outputs.document_reviewers = reviewerSysIDs;
      	outputs.reviewers_count = reviewerCount;
    })(inputs, outputs);
