  value: |-
    (function execute(inputs, outputs) {
        // Getting inputs
        var notifyNumberGR = inputs.notify_number;
        var phoneNumber = inputs.phone_number;
        var sourceTable = inputs.source_table;
        var sourceSysID = inputs.source_sys_id;
        var conferenceCallGr = inputs.conference_call_record;
        var userSysId = inputs.user_sys_id;
        var groupSysId = inputs.group_sys_id;
        var extraParams = inputs.extra_params;

        // Executing Call action
        var callAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.CALL);
        callAction.setNotifyNumber(notifyNumberGR);
        callAction.setPhoneNumber(phoneNumber);
        // Optional attributes
        if(sourceTable)
            callAction.setSourceTable(sourceTable);
        if(sourceSysID)
            callAction.setSourceSysID(sourceSysID);
        if(conferenceCallGr)
            callAction.setConferenceCallRecord(conferenceCallGr);
        if(userSysId)
            callAction.setUserSysId(userSysId);
        if(groupSysId)
            callAction.setGroupSysId(groupSysId);
        if(extraParams) 
            callAction.setExtraParams(extraParams);
        callAction.execute();

    })(inputs, outputs);
