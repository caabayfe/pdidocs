    (function execute(inputs, outputs) {
      try{
        var result = {};
        var request_context = inputs.request_context;
        var dateRegEx = /^\d{4}-\d{2}-\d{2}$/;
      	if(request_context['typed_value'].match(dateRegEx)){
        	result["value"] = request_context['typed_value'];
        	result["search_text"] = "";
        } else {
          	result["value"] = "";
        	result["search_text"] = request_context['typed_value'];
        }
        outputs.result = result;
        
      }catch(e){
         gs.error("Error in default Input Date inbound transformer : " + e.message);
      }
    })(inputs, outputs);
