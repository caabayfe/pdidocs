  value: |-
    (function execute(inputs, outputs) {
        // Getting inputs
        var text = inputs.text;
        var languageGR = inputs.language;
        var notifyCallGR = inputs.notify_call;

        // Executing Say action
        var sayAction = NotifyFlowActionFactory.createAction(NotifyFlowConstants.ACTIONS.SAY);
        sayAction.setText(text);
        sayAction.setLanguage(languageGR.getValue(NotifyFlowConstants.COLUMNS.LANGUAGE_CODE));
        sayAction.setNotifyCall(notifyCallGR);
        sayAction.execute();
        var notifyActivityGR = sayAction.getNotifyActivityGR();

        // Setting outputs
        outputs.notify_workflow_activity = notifyActivityGR;
        outputs.callback_wait_timeout = new NotifyFlowUtil().getActionCallbackWaitTime();
    })(inputs, outputs);
