  value: |-
    (function execute(inputs, outputs) {
          
          var context = JSON.parse(inputs.logging_context);
          var actionStartTime = new GlideDateTime().getNumericValue() - parseInt(inputs.start_time);
          VAAISearchHelper.getLogger(context).debug('AI Search FDIH action started: {0}ms', actionStartTime);

          var additionalContext = inputs.additional_context ? inputs.additional_context : "{}";
          var grConfigFilter = inputs.gr_config_filter ? inputs.gr_config_filter.toString().split(","): [];

          try {
          var api = new AISearchRetrieveSearchResultsWrapper();

          //calling the method for sync operation
          var searchResult = api.retrieveSearchResults(inputs.search_term, inputs.context_profile_id, inputs.search_context_id,
          inputs.logging_context, inputs.locale, additionalContext, grConfigFilter, inputs.search_result_type);

          outputs.search_results = JSON.parse(searchResult);
          } catch (ex) {
          VAAISearchHelper.getLogger(context).error("Error retrieving search results: {0}", ex.toString());
          var defaultResponse = "{\n" +
          "  \"result\": [\n" +
          "    {\n" +
          "      \"executionResult\": {\n" +
          "          \"searchMetadata\": {\n" +
    	"              \"searchResultMetadata\": {\n" +
    	"                  \"searchTerm\": \"" + inputs.search_term + "\"\n" +
    	"              }\n" +
    	"          },\n" +
          "          \"searchResultsTemplates\": {\n" +
          "              \"items\": [\n" +
          "              ]\n" +
          "          },\n" +
          "          \"geniusResultsTemplates\": {\n" +
          "              \"items\": [\n" +
          "              ]\n" +
          "           }\n" +
          "      },\n" +
          "      \"errors\": [],\n" +
          "      \"status\": 204\n" +
          "    }\n" +
          "  ]\n" +
          "}";
          outputs.search_results = JSON.parse(defaultResponse);
          }

          outputs.end_time = new GlideDateTime().getNumericValue().toString();

          })(inputs, outputs);
