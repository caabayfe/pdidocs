  value: |-
    (function execute(inputs, outputs) {

    	outputs.error = false;
      	outputs.error_message = '';
        outputs.notes = '';
        var ciCount = 0;
        var nonRetiredCis = 0;
        var skippedForMissingArchiveConfig = 0;
        var ARCHIVE_JOB_SYS_ID = 'bd976a209f231000dada207c7f4bcc59';

        function getArchiveDurationDaysForClass(ciClass) {
            var config = sn_cmdb.CMDBCiClassConfigApi.getArchiveDuration(ciClass);
            var classEntry = config[ciClass];
            if (!classEntry || !classEntry.hasOwnProperty('archiveDuration'))
                return null;

            var value = classEntry['archiveDuration']['value'];
            return (value === null || value === undefined) ? null : Number(value);
        }

        try {
    		var helper = new global.CMDBDataManagerHelper();

          var grArchiveJob = new GlideRecord('sys_trigger');
          if(!grArchiveJob.get(ARCHIVE_JOB_SYS_ID)) {
          	throw new Error('Archival of CIs will fail since Archive job  is not found or is not configured correctly. Please contact your administrator about it.');
          }

        	var task_gr = inputs.task;

        	var taskSysId = task_gr.getUniqueValue();

        	ciCount = helper.getCiCount(taskSysId);

            var batchSize = helper.getArchiveBatchSize();

        	var lastSysId = '';
        	var hasMore = true;

      		while (hasMore) {
                var ciResult = helper.getCiSysIds(lastSysId, batchSize, taskSysId);
                var ciData = ciResult.ciMap;
                lastSysId = ciResult.lastSysId;
                hasMore = ciResult.hasMore;

                // This action archives CIs across CI classes off the ledger table, so the archive
                // duration must be resolved per CI class (CMDBCiClassConfigApi) rather than from the
                // single policy-level archive_for_days used by the non-ledger, single-class flow.
                var ciClasses = Object.keys(ciData);
                for (var c = 0; c < ciClasses.length; c++) {
                    var ciClass = ciClasses[c];
                    var classCiMap = {};
                    classCiMap[ciClass] = ciData[ciClass];

                    var ciSysIds = helper.getRetiredCis(classCiMap);
                    nonRetiredCis += (ciData[ciClass].length - ciSysIds.length);

                    if (ciSysIds.length == 0)
                        continue;

                    var archiveDurationDays = getArchiveDurationDaysForClass(ciClass);
                    if (archiveDurationDays === null) {
                        skippedForMissingArchiveConfig += ciSysIds.length;
                        continue;
                    }

                    var chunkIds = helper.archiveCis(ciSysIds, archiveDurationDays);
                    if(chunkIds == undefined || chunkIds.toArray().length == 0)
                        throw new Error("Failed to create archive chunk. No CIs will be archived under this task");
                    var arrChunkIds = chunkIds.toArray();
                    for(var i = 0; i < arrChunkIds.length; i++) {
                        helper.createTaskToArchiveChunk(taskSysId, arrChunkIds[i]);
                    }
                }
        	}
        } catch(e) {
        	outputs.error = true;
            outputs.error_message = e;
        } finally {
        	outputs.notes = "Summary - Total CI Count:" + ciCount + " Non-Retired CI Count:" + nonRetiredCis +
                (skippedForMissingArchiveConfig > 0 ? " Skipped - no archive duration configured for class:" + skippedForMissingArchiveConfig : "");
        }


    })(inputs, outputs);
