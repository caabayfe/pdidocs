  value: "(function execute(inputs, outputs) {\n  // ... code ...\n    \n    if (!inputs.condition) {\n        outputs.result = true;\n      return;\n    }\n    \n    if (!inputs.taskId || !inputs.tasktable) {\n        outputs.result = false;\n      return;\n    }\n    \n    \n    var taskGr = new GlideRecord(inputs.tasktable);\n    taskGr.get(inputs.taskId);\n    \n    if (!taskGr.isValidRecord()) {\n         outputs.result = false;\n      return;\n    }\n    \n    outputs.result = GlideappScriptHelper.matchCatalogCondition(taskGr, inputs.condition);\n    \n  })(inputs, outputs);\n  "
