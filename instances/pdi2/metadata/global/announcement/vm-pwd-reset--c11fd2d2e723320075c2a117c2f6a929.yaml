summary: |-
  Voicemail users will need to reset their password in the new system. Your temporary password will be the last six digits of your Employee ID number.

  To reset your password, dial extension 6245 (MAIL) from your phone or 222-333-4444 from a non-campus phone and enter your temporary password when prompted. You will then be directed through the process of changing your password.
