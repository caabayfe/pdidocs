template_definition: |-
  <html>
  <head>
  <meta charset="UTF-8">
  <style type="text/css">
  :root {
      {{now-mobile-themes}}
      
      /*  M O B I L E   C O L O R   M A P  */
      --brand-color:                           var(--now-color_brand--secondary, #293E40);
      --primary-color:                         var(--now-color--primary-1, #1F8476);
      --secondary-color:                       var(--now-color--secondary-3, #165C53);
      --destructive-color:                     var(--now-color_alert--critical-3, #C83C36);
      --text-primary-color:                    var(--now-color_text--primary, #151920);
      --text-secondary-color:                  var(--now-color_text--secondary, #2C323F);
      --text-actionable-color:                 var(--now-color_text--primary-actionable, #FFFFFF);
      --brand-background-color:                var(--now-color--primary-0, #B5DDE5);
      --background-tertiary-color:             var(--now-color_background--tertiary, #E4E6EA);
      --border-tertiary-color:                 var(--now-color_border--tertiary, #D3D6DC);
      --separator-tertiary-color:              var(--now-color_divider--tertiary, #D3D6DC);
      --screen-header-text-color:              var(--now-color--neutral-0, #FFFFFF);
      --background-primary-actionable-color:   var(--now-color_background--primary-actionable, #151920);
      --alert-critical-0-color:                var(--now-color_alert--critical-0, #F4D8D7);
      --alert-critical-3-color:                var(--now-color_alert--critical-3, #C83C36);
      --shadow-color:                          var(--now-color--neutral-18, #151920);
      --link-primary-color:                    var(--now-color--link-2, #1F8476);
      --notification-color:                    var(--now-color_alert--critical-2, #E65651);
      --background-secondary-actionable-color: var(--now-color_background--secondary-actionable, #2C323F);
      --background-primary-color:              var(--now-color_background--primary, #FFFFFF);
      --background-secondary-color:            var(--now-color_background--secondary, #F6F6F8);
      --text-tertiary-color:                   var(--now-color_text--tertiary, #454D5B);
      --link-secondary-color:                  var(--now-color--link-3, #1F8476);

      direction: {{now-content-direction}};
  }

  body {
      font-family: "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Roboto", "Droid Sans", "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-primary-color);
      text-align: left;
  }
  h1 {
      font-weight: normal;
      font-size: 13px;
      line-height: 1.1em;
  }
  h3 {
      font-weight: normal;
      font-size: 1.0em;
      line-height: 1.1em;
  }
  p {
      font-weight: normal;
      padding: 2px 0px;
      margin: 2px 0px;
      line-height: 1.1em;
      font-size: 14px;
  }
  dl {
      width: 100%;
      margin: 0px;
      padding: 0px;
  }
  dt, dd {
      margin: 0 0 12px 0;
      padding: 0px;
      height: 20px;
      line-height: 20px;
      max-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      box-orient: vertical;
      -webkit-box-orient: vertical;
      line-clamp: 1;
      -webkit-line-clamp: 1;
      text-align: left;
      font-size: 14px;
      float: left;
  }
  dt {
      width: 20%;
      padding-right: 2%;
  }
  dd {
      width: 78%;
  }
  dt span, dd span {
      line-height: 20px;
      max-height: 20px;
      overflow: hidden;
  }
  a, a:visited, a:link, a:active, a:hover, a p, a h1 {
      color: color: var(--link-primary-color);
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
  }
  .page-container {
      padding: 4px;
  }
  .card-container {
      margin: 0px auto;
      height: auto;
      box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 6px 0px;
      padding-top: 16px;
      background-color: var(--background-primary-color);
  }
  .source-text {
      font-size: 13px;
      margin-left: 0px;
      padding-left: 0px;
      max-height: 50px;
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      box-orient: vertical;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
  }
  .description-container {
      margin-left: 24px;
      width: 80%;
  }
  .person-details {
      margin: 4px 0px;
      margin-bottom: 0px;
      padding-bottom: 0px;
      margin-left: 24px;
      padding: 4px 0px;
      margin-left: 24px;
      width: 80%;
      height: auto;
  }
  .person-avatar-container {
      float: left;
      max-height: 50px;
      max-width: 50px;
      min-width: 30px;
      min-height: 30px;
      padding: 4px 0px;
      margin-bottom: 0px;
      padding-bottom: 0px;
  }
  .person-avatar-image, .person-avatar-initials, .person-avatar-container span {
      display: block;
      width: 50px;
      height: 50px;
      margin: 1%;
      padding: 1%;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--background-secondary-color);
  }
  .person-avatar-initials {
      background-color: transparent;
  }
  .person-avatar-container span {
      width: 55px;
      height: 40px;
      text-align: center;
      padding-top: 15px;
  }
  .person-details-container {
      float: left;
      width: 60%;
      margin: 4px 0;
      padding: 4px 0;
      padding-left: 24px;
      padding-bottom: 0px;
  }
  .person-details-container a {
      font-size: 24px;
      font-weight: normal;
      color: var(--link-primary-color);
  }
  .person-details-container h1 {
      margin: 0px;
      padding: 0px;
      padding-bottom: 6px;
  }
  .contact-details {
      width: 100%;
      margin: 6px 0px 8px 0px;
      margin-top: 0px;
      padding: 0px;
      overflow: hidden;
  }
  .contact-details p {
      display: block;
      padding: 0px;
      margin: 8px 0px;
      text-indent: 32px;
      min-height: 24px;
      line-height: 1.6em;
      text-overflow: elipsis;
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      box-orient: vertical;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
  }
  .fields-container {
      padding: 0px;
      margin: 0px;
      margin-left: 24px;
      max-height: 150px;
      overflow: hidden;
  }
  .clear {
      clear: both;
  }
  </style>
  </head>
  <body>
      <div class="card-container">
          <div class="description-container">
              <p class="source-text">{{identifier}}</p>
          </div>
          <div class="person-details">
              <div class="person-avatar-container">
                  <img class="person-avatar-image" src={{avatar}} alt="{{header}}"/>
                  <p class="person-avatar-initials person-avatar-initials-{{showDefaultIcon}}">
                  <span>{{initials}}</span>
                  </p>
              </div>
              <div class="person-details-container">
                  <a target="_blank" href={{linkHref}}>
                      {{header}}
                  </a>
                  <p>
                      {{primaryDescription}}
                  </p>
                  <p>
                      {{secondaryDescription}}
                  </p>
              </div>
              <div class="clear"></div>
          </div>
          <div class="contact-details">
              <div class="fields-container">
                  <dl class="vac-fields">
                      {{fields}}
                  </dl>
              </div>
          </div>
      </div>
  </body>
  </html>
template_name: ''
