template_definition: |-
  <html>
  <head>
  <meta charset="UTF-8">
  <style type="text/css">
  :root {
      {{now-mobile-themes}}
      
      /*  M O B I L E   C O L O R   M A P  */
      --brand-color:                           var(--now-color_brand--secondary, #293E40);
      --primary-color:                         var(--now-color--primary-1, #1F8476);
      --secondary-color:                       var(--now-color--secondary-3, #165C53);
      --destructive-color:                     var(--now-color_alert--critical-3, #C83C36);
      --text-primary-color:                    var(--now-color_text--primary, #151920);
      --text-secondary-color:                  var(--now-color_text--secondary, #2C323F);
      --text-actionable-color:                 var(--now-color_text--primary-actionable, #FFFFFF);
      --brand-background-color:                var(--now-color--primary-0, #B5DDE5);
      --background-tertiary-color:             var(--now-color_background--tertiary, #E4E6EA);
      --border-tertiary-color:                 var(--now-color_border--tertiary, #D3D6DC);
      --separator-tertiary-color:              var(--now-color_divider--tertiary, #D3D6DC);
      --screen-header-text-color:              var(--now-color--neutral-0, #FFFFFF);
      --background-primary-actionable-color:   var(--now-color_background--primary-actionable, #151920);
      --alert-critical-0-color:                var(--now-color_alert--critical-0, #F4D8D7);
      --alert-critical-3-color:                var(--now-color_alert--critical-3, #C83C36);
      --shadow-color:                          var(--now-color--neutral-18, #151920);
      --link-primary-color:                    var(--now-color--link-2, #1F8476);
      --notification-color:                    var(--now-color_alert--critical-2, #E65651);
      --background-secondary-actionable-color: var(--now-color_background--secondary-actionable, #2C323F);
      --background-primary-color:              var(--now-color_background--primary, #FFFFFF);
      --background-secondary-color:            var(--now-color_background--secondary, #F6F6F8);
      --text-tertiary-color:                   var(--now-color_text--tertiary, #454D5B);
      --link-secondary-color:                  var(--now-color--link-3, #1F8476);

      direction: {{now-content-direction}};
  }

  body {
      font-family: "ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", "Roboto", "Droid Sans", "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-primary-color);
      text-align: left;
      padding: 4px;
  }
  a, a:visited, a:link, a:active, a:hover, a p, a h1 {
      color: color: var(--link-primary-color);
      font-weight: 600;
      text-decoration: none;
  }
  .card-container {
      width: 100%;
      max-height: 400px;
      box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--background-primary-color);
  }
  .url-container {
      box-sizing: border-box;
      min-width: 265px;
      text-align: left;
      margin: 0px auto;
      padding: 16px;
      height: auto;
      border-radius: 8px;
  }
  .details-container {
      margin: 0px;
      padding: 0px;
  }
  .url-site-name-container {
      font-weight: bold;
      font-size: 15px;
      line-height: 18px;
      display: flex;
      flex: 1 1 auto;
      margin-bottom: 12px;
  }
  .fav-icon {
      height: 18px;
      margin-right: 5px;
      margin-bottom: -2px;
      display: inline-block;
  }
  .fav-icon-container {
     display: inline-block;
     font-size: 8px;
     font-weight: normal;
  }
  .image-site-name {
     display: inline-block;
     font-weight: normal;
     font-size: 12px;
  }
  .url-title {
      vertical-align: top;
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 500;
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      box-orient: vertical;
      line-clamp: 2;
      line-height: 24px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
  }
  .url-title a {
      color: var(--link-primary-color);
  }
  .url-description {
      display: -webkit-box;
      overflow: hidden;
      font-weight: normal;
      font-size: 14px;
      line-height: 18px;
      overflow: hidden;
      font-weight: normal;
      max-height: 36px;
      text-overflow: ellipsis;
      box-orient: vertical;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
  }
  .media-content-container {
      overflow: hidden;
      width: 100%;
      height: auto;
      max-height: 400px;
  }
  .video-embed-container {
      position: relative;
      width: 100%;
      height: 0px;
      margin: 0px;
      padding: 0px;
      padding-bottom: 60%;
  }
  .video-embed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0px;
      padding: 0px;
      border-bottom-right-radius: 8px;
      border-bottom-left-radius: 8px;
  }
  </style>
  </head>
  <body>
      <div class="card-container">
          <div class="url-container">
              <div class="details-container">
                  <div class="url-site-name-container">
                      <div class="fav-icon-container"><img class="fav-icon" src="{{fav_icon}}" alt="Image"/></div>
                      <div class="image-site-name">{{site_name}}</div>
                  </div>
                  <div class="url-title">
                      <a href="{{url}}" target="_blank">{{title}}</a>
                  </div>
                  <div class="url-description">
                      {{short_description}}
                  </div>
              </div>
          </div>
          <div class="media-content-container">
              <div class="video-embed-container">
                  <iframe class="video-embed" src="{{video_link}}" title="{{title}}" allowfullscreen></iframe>
              </div>
          </div>
      </div>
  </body>
  </html>
template_name: ''
