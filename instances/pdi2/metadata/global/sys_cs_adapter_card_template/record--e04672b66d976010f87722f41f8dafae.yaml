template_definition: |-
  <html>
  <head>
  <meta charset="UTF-8">
  <style type="text/css">
  :root {
      {{now-mobile-themes}}
      
      /*  M O B I L E   C O L O R   M A P  */
      --brand-color:                           var(--now-color_brand--secondary, #293E40);
      --primary-color:                         var(--now-color--primary-1, #1F8476);
      --secondary-color:                       var(--now-color--secondary-3, #165C53);
      --destructive-color:                     var(--now-color_alert--critical-3, #C83C36);
      --text-primary-color:                    var(--now-color_text--primary, #151920);
      --text-secondary-color:                  var(--now-color_text--secondary, #2C323F);
      --text-actionable-color:                 var(--now-color_text--primary-actionable, #FFFFFF);
      --brand-background-color:                var(--now-color--primary-0, #B5DDE5);
      --background-tertiary-color:             var(--now-color_background--tertiary, #E4E6EA);
      --border-tertiary-color:                 var(--now-color_border--tertiary, #D3D6DC);
      --separator-tertiary-color:              var(--now-color_divider--tertiary, #D3D6DC);
      --screen-header-text-color:              var(--now-color--neutral-0, #FFFFFF);
      --background-primary-actionable-color:   var(--now-color_background--primary-actionable, #151920);
      --alert-critical-0-color:                var(--now-color_alert--critical-0, #F4D8D7);
      --alert-critical-3-color:                var(--now-color_alert--critical-3, #C83C36);
      --shadow-color:                          var(--now-color--neutral-18, #151920);
      --link-primary-color:                    var(--now-color--link-2, #1F8476);
      --notification-color:                    var(--now-color_alert--critical-2, #E65651);
      --background-secondary-actionable-color: var(--now-color_background--secondary-actionable, #2C323F);
      --background-primary-color:              var(--now-color_background--primary, #FFFFFF);
      --background-secondary-color:            var(--now-color_background--secondary, #F6F6F8);
      --text-tertiary-color:                   var(--now-color_text--tertiary, #454D5B);
      --link-secondary-color:                  var(--now-color--link-3, #1F8476);

      direction: {{now-content-direction}};
  }

  body {
      font-family: ui-sans-serif, system-ui, -apple-system, "BlinkMacSystemFont", "Droid Sans", "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-primary-color);
      text-align: left;
  }
  .card-container {
     width: 100%;
     max-height: 400px;
     box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.1);
     border-radius: 8px;
     min-width: 265px;
     text-align: left;
     background-color: var(--background-primary-color);
     padding: 24px 0px 18.5px 0px;
     font-family:  -apple-system, "BlinkMacSystemFont", "Roboto", "Droid Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  ul, ul li {
     padding-top: 0;
     margin-top: 0;
  }
  dl {
      width: 100%;
      margin: 0px;
      padding: 0px;
  }
  dt, dd {
      margin: 0 0 12px 0;
      padding: 0px;
      height: 20px;
      line-height: 20px;
      max-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      box-orient: vertical;
      -webkit-box-orient: vertical;
      line-clamp: 1;
      -webkit-line-clamp: 1;
      text-align: left;
      font-size: 14px;
      float: left;
  }
  dt {
      width: 20%;
      padding-right: 2%;
  }
  dd {
      width: 78%;
  }
  dt span, dd span {
      line-height: 20px;
      max-height: 20px;
      overflow: hidden;
  }
  dt span, dd span {
      line-height: 20px;
      max-height: 20px;
      overflow: hidden;
  }
  .card-body {
      display: flex;
  }

  .card-body-column {
      display: flex;
      flex-direction: column
  }

  .card-body-column:last-of-type {
      flex-grow: 1;
  }

  .card-identifier {
      text-align: left;
  }

  .card-identifier-text {
      font-size: 13px;
      padding: 0px 24px;
      text-align: left;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
  }

  .card-heading-text {
      font-size: 20px;
      font-weight: normal;
      text-align: left;
      padding: 12px 24px 8px 24px;
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 40px;
      line-height: 20px;
      box-orient: vertical;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
  }

  .card-description {
      font-size: 14px;
      font-weight: normal;
      text-align: left;
      position: relative;
      margin: 0px 24px 16.5px 24px;
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 90px;
      line-height: 18px;
      box-orient: vertical;
      line-clamp: 5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5;
  }

  .card-description table {
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      flex-grow: 1;
      flex-shrink: 1;
  }

  .card-description tr {
      width: 100%;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
  }

  .card-description td {
      display: flex;
      flex-flow: row wrap;
      flex-grow: 1;
      flex-basis: 0;
  }

  .card-description ol {
      margin: 0;
  }

  .card-description p {
      margin: 0;
  }

  .card-description pre {
      white-space: pre-wrap;
  }
  .vac-content {
      margin-left: 28px;
  }

  hr.solid {
      display: block;
      margin-before: 0.5em;
      margin-after: 0.5em;
      margin-start: auto;
      margin-end: auto;
      overflow: hidden;
      border-style: inset;
      border-width: .1px;
  }

  .button-container {
      margin: 18.5px 24px 0px 24px;
      border-radius: 10px;
      border: 1px solid var(--border-tertiary-color);
      text-align: center;
      background-color: var(--brand-color);
  }

  .action-button {
     width: 90%;
     margin: 10px 5%;
  }

  .action-button a,
  .action-button a:visited,
  .action-button a:link,
  .action-button a:active {
     color: var(--text-actionable-color);
  }

  a, a:visited, a:link, a:active {
     color: var(--link-primary-color);
     text-decoration: none;
  }
  </style>
  </head>
  <body>
      <div class="card-container">
          <div class="card-body">
              <div class="card-body-column">
                  <div class="card-text card-identifier">
                      <span class="card-identifier-text"> {{identifier}} </span>
                  </div>
                  <div class="card-text">
                      <span class="card-heading-text"> {{header}} </span>
                  </div>
              </div>
          </div>
          <div id="card-description" class="card-text card-description">
                      {{description}}
          </div>
          <div class="vac-content" style="box-sizing: border-box;">
              <dl class="vac-fields" style="box-sizing: border-box;display:flex;flex-flow: row wrap;margin: 0px;padding:5px 0px 2px;">
                   {{fields}}
               </dl>
          </div>
          <hr class="solid"/>
          <div class="button-container">
              <div class="action-button">
                  <a target="_blank" class="link-button confirm" href="{{linkHref}}"> {{linkLabel}} </a>
              </div>
          </div>
      </div>
  </body>
  </html>
template_name: ''
