template_definition: |-
  {
    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
    "type": "AdaptiveCard",
    "version": "1.0",
    "body": [
      {
          "type": "ColumnSet",
          "columns": [
              {
                  "type": "Column",
                  "items": [
                      {
                          "type": "TextBlock",
                          "text": "{{data.title}}",
                          "weight": "bolder",
                          "size": "medium",
                          "horizontalAlignment": "left"
                      }
                  ]
              },
              {
                  "type": "Column",
                  "items": [
                      {
                          "type": "TextBlock",
                          "text":"{{data.subtitle}}",
                          "weight": "bolder",
                          "size": "medium",
                          "horizontalAlignment": "right"
                      }
                  ]
              }
          ]
      },
      {
        "type": "Container",
        "separator": true,
        "items": [
          {
            "type": "FactSet",
            "facts": [
                { "_value": "{{data.fields}}", "_template":"TeamsCardField"}
            ]
          }
        ]
      }
    ],
    "actions": [
      {
        "type": "Action.OpenUrl",
        "title": "{{'Go to ' + data.title}}",
        "url": "{{data.url}}"
      }
    ]
  }
template_name: teamsCard
