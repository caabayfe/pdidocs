template_definition: |-
  <html>
  <head>
      <meta charset="UTF-8">
  </head>
  <style type="text/css">
  .video-container {
      background: rgb(var(--chat-window-background-color, 255, 255, 255));
      border: 1px solid rgb(var(--seperator-color, 230, 232, 234));
      border-radius: 5px;
      box-sizing: border-box;
      padding: .5rem 0 0 0;
      width: 100%;
      max-width: 600px;
      min-width: 265px;
     text-align: left;
  }
  .video-title {
      color: rgb(var(--non_clickable_title_color, 52, 61, 71));
      vertical-align: top;
      font-weight: bold;
      font-size: calc(15px * var(--chat-body--font_size--multiplier, 1)); 
      padding: .2rem .5rem 0 .5rem;
      margin-bottom: .5rem;
  }
  .sn-chat-window a[href=""]{
      color: rgb(var(--non_clickable_title_color, 0,0, 0)) !important;
      text-decoration: inherit;
      pointer-events: none;
      cursor: default;
  }
  .video-description {
      display: -webkit-box;
      line-height: 18px;
      overflow: hidden;
      color: rgb(var(--non_clickable_title_color, 0,0, 0));
      font-weight: normal;
      font-size: calc(15px * var(--chat-body--font_size--multiplier, 1));
      padding: 0 .5rem 0 .5rem;
      margin-bottom: .5rem;
      max-height: 36px;
      text-overflow: ellipsis;
      box-orient: vertical;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
  }
  .video-preview {
      border-bottom-right-radius: 5px;
      border-bottom-left-radius: 5px;
      margin-bottom: -5px;
      max-width: 600px;
      max-height: 338px;
      width: calc(100vw - 2rem); 
      height: calc((9/16)*(100vw - 2rem));
      border: 0px;
  }
  .video-description .description-tooltip {
      visibility: hidden;
      line-height: 18px;
      font-weight: normal;
      font-size: calc(15px * var(--chat-body--font_size--multiplier, 1));
      background-color: rgb(var(--tooltip_bg_color, $now-color_background--primary-actionable));
      color: rgb(var(--tooltip_text_color, $now-color_text--primary-actionable));;
      text-align: center;
      border-radius: 6px;
      padding: 0 .5rem 0 .5rem;
      position: absolute;
      z-index: 1;
      top: 4rem;
      left: 0;
      margin: .5rem;
  }
  .video-description .description-tooltip::after {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent rgb(var(--tooltip_bg_color, $now-color_background--primary-actionable)) transparent;
  }
  .video-description:hover .description-tooltip {
      visibility: visible;
  }
  </style>
  <body>
      <div class="video-container">
        <div class="video-title">
             <a href="{{link}}" target="{{target}}" dataNowSmartLink="{{dataNowSmartLink}}">{{title}}</a>
        </div>
        <div class="video-description">{{description}}</br><div class="description-tooltip"><span >{{description}}</span></div></div>
        <iframe class="video-preview" src="https://www.youtube.com/embed/{{id}}" title="{{title}}">
        </iframe>
     </div>
  </body>
  </html>
