template_definition: |-
  <html>
  <head>
      <meta charset="UTF-8">
  </head>
  <style type="text/css">
  .image-container {
      background: rgb(var(--chat-window-background-color, 255, 255, 255));
      border-radius: 5px;
      border: 1px solid rgb(var(--seperator-color, 230, 232, 234));
      box-sizing: border-box;
      padding: .5rem 0 0 0;
      width: 100%;
      max-width: 600px;
      min-width: 265px;
      text-align: left;
  }
  .image-site-name-container {
      color: rgb(var(--non_clickable_title_color, 52, 61, 71));
      font-style: normal;
      font-weight: bold;
      font-size: 15px;
      line-height: 18px;
      padding: 0rem .5rem 0 .5rem;
      display: flex;
      flex: 1 1 auto;
  }
  .fav-icon {
      height:18px;
      margin-right: 5px;
      margin-bottom: -2px;
      display: inline-block;
  }
  .fav-icon-container {
     display: inline-block;
     font-size: 8px;
     font-weight: normal;
  }
  .image-site-name {
     display: inline-block;
  }
  .image-title {
      color: rgb(var(--non_clickable_title_color, 78, 125, 136));
      vertical-align: top;
      font-family: Source Sans Pro;
      font-weight: 600;
      font-size: 15px;
      line-height: 18px;
      padding: .2rem .5rem 0 .5rem;
      margin-bottom: .5rem;
      text-decoration-line: underline;
  }
  .image-description {
      display: -webkit-box;
      line-height: 18px;
      overflow: hidden;
      color: rgb(var(--non_clickable_title_color, 0, 0, 0));
      font-weight: normal;
      font-size: 15px;
      padding: 0rem .5rem 0 .5rem;
      margin-bottom: .5rem;
      max-height: 36px;
      text-overflow: ellipsis;
      box-orient: vertical;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
  }
  .image-preview {
      border-bottom-right-radius: 5px;
      border-bottom-left-radius: 5px;
      margin-bottom: -5px;
      max-width: 600px;
      width: 100%;
      text-align: center;
  }
  </style>
  <body>
      <div class="image-container">
        <div class="image-site-name-container">
            <div class="fav-icon-container"><img class="fav-icon" src="{{fav_icon}}" alt="Image"/></div>
            <div class="image-site-name">{{site_name}}</div>
        </div> 
        <div class="image-title">
             <a href="{{url}}" target="{{target}}" dataNowSmartLink="{{dataNowSmartLink}}">{{title}}</a>
        </div>
        <div class="image-description">{{short_description}}</div>
        <img src="{{image_link}}"  class="image-preview" alt="Image: {{title}}"/>
     </div>
  </body>
  </html>
template_name: ''
