template_definition: |-
  <html>
              <style type="text/css">
              .image-card-container-medium {
              border-radius: 5px;
              border: 1px solid rgb(var(--bot-message-bubble-color, 233, 237, 241));
              box-sizing: border-box;
              background-color: rgb(var(--chat-window-background-color, 255, 255, 255));
              padding: .4rem;
              max-width: 600px;
              min-width: 265px;
              overflow:auto;
              }
              .image-card-image-medium{
              max-width: 50%;
              float: left;
              height: auto;
              margin-right: .5rem;
              }
              .image-card-title-medium{
              padding: .2rem .5rem 0 .5rem;
              margin-bottom: .5rem;
              }
              </style>
              <div class="image-card-container-medium">
              <div class="image-card-body-medium">
              <img src="{{image}}"  class="image-card-image-medium" alt="Image: {{imageAlt}}"/>
              <div class="image-card-title-medium">
              <strong>{{title}}</strong>
              </div>
              <div class="image-card-description-small _va_markdown">
              {{description}}
              </div>
              </div>
              </div>
              </html>
