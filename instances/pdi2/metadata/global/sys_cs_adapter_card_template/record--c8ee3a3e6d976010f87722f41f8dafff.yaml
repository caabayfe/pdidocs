template_definition: |-
  <html>
  <head>
  <meta charset="UTF-8">
  <style type="text/css">
  :root {
      {{now-mobile-themes}}
      
      /*  M O B I L E   C O L O R   M A P  */
      --brand-color:                           var(--now-color_brand--secondary, #293E40);
      --primary-color:                         var(--now-color--primary-1, #1F8476);
      --secondary-color:                       var(--now-color--secondary-3, #165C53);
      --destructive-color:                     var(--now-color_alert--critical-3, #C83C36);
      --text-primary-color:                    var(--now-color_text--primary, #151920);
      --text-secondary-color:                  var(--now-color_text--secondary, #2C323F);
      --text-actionable-color:                 var(--now-color_text--primary-actionable, #FFFFFF);
      --brand-background-color:                var(--now-color--primary-0, #B5DDE5);
      --background-tertiary-color:             var(--now-color_background--tertiary, #E4E6EA);
      --border-tertiary-color:                 var(--now-color_border--tertiary, #D3D6DC);
      --separator-tertiary-color:              var(--now-color_divider--tertiary, #D3D6DC);
      --screen-header-text-color:              var(--now-color--neutral-0, #FFFFFF);
      --background-primary-actionable-color:   var(--now-color_background--primary-actionable, #151920);
      --alert-critical-0-color:                var(--now-color_alert--critical-0, #F4D8D7);
      --alert-critical-3-color:                var(--now-color_alert--critical-3, #C83C36);
      --shadow-color:                          var(--now-color--neutral-18, #151920);
      --link-primary-color:                    var(--now-color--link-2, #1F8476);
      --notification-color:                    var(--now-color_alert--critical-2, #E65651);
      --background-secondary-actionable-color: var(--now-color_background--secondary-actionable, #2C323F);
      --background-primary-color:              var(--now-color_background--primary, #FFFFFF);
      --background-secondary-color:            var(--now-color_background--secondary, #F6F6F8);
      --text-tertiary-color:                   var(--now-color_text--tertiary, #454D5B);
      --link-secondary-color:                  var(--now-color--link-3, #1F8476);

      direction: {{now-content-direction}};
  }

  body {
      font-family: -apple-system, "BlinkMacSystemFont", "Droid Sans", "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-primary-color);
  }
  .card-container {
      width: 100%;
      max-height: 400px;
      box-shadow: 0px 0px 10px 0px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      padding: 24px 0px 18.5px 0px;
      overflow: hidden;
      background-color: var(--background-primary-color);
  }
  ul, ul li {
      padding-top: 0;
      margin-top: 0;
  }
  .card-body {
      display: flex;
      padding: 0px 24px 12px 24px;
  }
  .card-body-column {
      display: flex;
      flex-direction: column;
  }
  .card-body-column:last-of-type {
      flex-grow: 1;
  }
  .now-avatar-cart-img {
      width: 4.4rem;
      object-fit: cover;
      margin-right: 1rem;
  }
  .card-identifier {
      padding: 0px 24px 12px 24px;
      font-size: 13px;
  }
  .card-identifier-text {
      font-size: .8rem;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
  }
  .card-heading-text {
      font-size: 20px;
      font-weight: normal;
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 40px;
      line-height: 20px;
      box-orient: vertical;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
  }
  .card-description {
      font-size: 14px;
      font-weight: normal;
      margin: 8px 0 0 0;
      display: -webkit-box;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 100px;
      line-height: 18px;
      box-orient: vertical;
      line-clamp: 5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5;
  }
  .now-icon-cart {
      width: 3rem;
      height: 2rem;
      margin-top: 1rem;
      margin-right: .5rem;
      object-fit: cover;
  }
  hr.solid {
      border-color: var(--border-tertiary-color);
      display: block;
      overflow: hidden;
      border-style: inset;
      border-width: .1px;
  }
  dl {
      width: 100%;
      padding: 0px;
  }
  dt, dd {
      margin: 0 0 12px 0;
      margin-left: 24px;
      padding: 0px;
      height: 20px;
      line-height: 20px;
      max-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      box-orient: vertical;
      -webkit-box-orient: vertical;
      line-clamp: 1;
      -webkit-line-clamp: 1;
      text-align: left;
      font-size: 14px;
      float: left;
  }
  dt {
      width: 17%;
  }
  dd {
      width: 60%;
  }
  dt span, dd span {
      line-height: 20px;
      max-height: 20px;
      overflow: hidden;
  }
  a, a:visited, a:link, a:active {
      color: var(--link-primary-color);
      text-decoration: none;
  }
  .vac-content {
      max-height: 160px;
      overflow: hidden;
      padding: 0px;
      margin: 0px;
  }
  .vac-fields {
      background-color: transparent;
  }
  a.link-button {
      display: block;
      background: var(--primary-color);
      width: 90%;
      height: 38px;
      margin: 10px auto 2px auto;
      border-radius: 10px;
      border: 1px solid var(--border-tertiary-color);
      text-align: center;
      vertical-align: middle;
      line-height: 38px;
      color: var(--text-actionable-color);
      font-weight: bold;
  }
  </style>
  </head>
  <body>
      <div class="card-container">
          <div class="card-text card-identifier">
              <span class="card-identifier-text">
                  {{identifier}}
              </span>
          </div>
          <div class="card-body">
              <div class="card-body-column">
                  <img class="now-avatar-cart-img" aria-hidden="true" src={{image}} alt="avatar" />
                  <svg class="now-icon-cart now-icon-cart-{{showDefaultIcon}}" aria-hidden="true" viewBox="0 0 24 24">
                     <g stroke="none" fill="none"><path d="M9.5 19a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-7 1a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1zm7 0a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1zM4.822 2l.607 3h15.904a.75.75 0 0 1 .71.99L19.01 15H7.457l.406 2H19v1H7.045l-.608-3h-.003L4.41 5l-.405-2H2V2h2.822zm16.163 4H5.632l1.623 8h11.036l2.694-8z" fill="currentColor"></path></g>
                  </svg>
              </div>
              <div class="card-body-column">
                  <div class="card-text">
                      <span class="card-heading-text">{{header}}</span>
                  </div>
                  <span class="card-text card-description">
                      <span class="card-description-text">{{description}}</span>
                  </span>
              </div>
          </div>
          <div class="vac-content" style="box-sizing: border-box;">
              <dl class="vac-fields" style="box-sizing: border-box;display:flex;flex-flow: row wrap;margin: 0px;padding:5px 0px 2px;">
                  {{fields}}
              </dl>
          </div>
          <a target="_blank" class="link-button confirm" href="{{linkHref}}">{{linkLabel}}</a>
      </div>
  </body>
  </html>
template_name: ''
