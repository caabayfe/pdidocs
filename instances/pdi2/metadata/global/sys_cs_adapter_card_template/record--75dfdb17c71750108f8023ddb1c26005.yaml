template_definition: |-
  <html>
  <head>
      <meta charset="UTF-8">
  </head>
  <style type="text/css">
  .image-card-container-large {
      border-radius: 5px;
      border: 1px solid rgb(var(--bot-message-bubble-color, 233, 237, 241));
      box-sizing: border-box;
      background-color: rgb(var(--chat-window-background-color, 255, 255, 255));
      padding: .5rem 0 0 0;
      width: 100%;
      max-width: 600px;
      min-width: 265px;
     text-align: left;
  }
  .image-card-title-large{
      padding: .2rem .5rem 0 .5rem;
      margin-bottom: .5rem;
      font-weight: bold;
  }
  .image-card-description-large{
      padding: 0 .5rem 0 .5rem;
      margin-bottom: .5rem;
  }
  .card-image-large{
     border-bottom-right-radius: 5px;
     border-bottom-left-radius: 5px;
     margin-bottom: -5px;
     max-width: 100%;
  }
  </style>
  <body>
      <div class="image-card-container-large">
          <div class="image-card-title-large">
              {{title}}
         </div>
         <div class="image-card-description-large _va_markdown">
              {{description}}
          </div>
          <img src="{{image}}"  class="card-image-large" alt="Image: {{imageAlt}}"/>
      </div>
  </body>
  </html>
template_name: imageCardLarge
