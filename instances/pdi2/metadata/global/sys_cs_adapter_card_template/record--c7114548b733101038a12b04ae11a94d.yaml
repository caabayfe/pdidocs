template_definition: |-
  <html>

  <head>
      <meta charset="UTF-8">
  </head>
  <style type="text/css">
  .card-container {
      border-radius: 5px;
      border: 1px solid rgb(var(--seperator-color, 230, 232, 234));
      box-sizing: border-box;
      background-color: rgb(var(--chat-window-background-color,  255, 255, 255));
      padding: .5rem .5rem .5rem .5rem;
      max-width: 506px;
      width: 100%;
      min-width: 265px;
  }

  .card-body {
      display: flex;
  }

  .card-body-column {
      display: flex;
      flex-direction: column
  }

  .card-body-column:last-of-type {
      flex-grow: 1;
      width: 100%; /** IE11 fix */
  }

  .card-identifier {
      color: rgb(var(--secondary_text_color, 99, 114, 116));
  }

  .card-identifier-text {
      font-size: calc(12.8px * var(--chat-body--font_size--multiplier, 1));
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
  }

  .card-heading-text {
      color: rgb(var(--non_clickable_title_color, 22, 27, 28));
      font-size: calc(16px * var(--chat-body--font_size--multiplier, 1));
      font-weight: 600;
  }

  .card-description {
      color: rgb(var(--secondary_text_color, 22, 27, 28));
      margin-bottom: 0.4rem;
      font-weight: 400;

      position: relative;

  }

  .card-description table {
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      flex-grow: 1;
      flex-shrink: 1;
  }

  .card-description tr {
      width: 100%;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
  }

  .card-description td {
      display: flex;
      flex-flow: row wrap;
      flex-grow: 1;
      flex-basis: 0;
  }

  .card-description ol {
      margin: 0;
  }

  .card-description p {
      margin: 0;
  }

  .card-description pre {
      white-space: pre-wrap;
  }

  .dynamic-fields {
          color: rgb(var(--secondary_text_color, 115,115,115));
          list-style: none;
          margin: 0;
          padding: 0;
          font-size: calc(13px * var(--chat-body--font_size--multiplier, 1));;
          font-family: Helvetica;
          line-height: 18px;
      }

      dl.dynamic-fields > dt {
          box-sizing: border-box;
          float: left;
          text-align: right;
          font-weight: 500;
          margin-right: 5px;
      }

      dl.dynamic-fields > dd {
          box-sizing: border-box;
          font-weight: 400;
          margin-left: 0px;
      }

      .fLabel {
          margin-right: -4px;
      }
  </style>

  <body>
      <div class="card-container">
          <div class="card-body">
              <div class="card-body-column">
                  <div class="card-text card-identifier">
                      <span class="card-identifier-text"> {{identifier}} </span>
                  </div>
                  <div class="card-text">
                      <span class="card-heading-text">
                          {{header}} 
                      </span>
                  </div>
                  <div id="card-description" class="card-text card-description">
                      {{description}}
                  </div>
                  <div class="card-footer">
                      <div class="card-footer-link">
                          <a target="{{target}}" dataNowSmartLink="{{dataNowSmartLink}}" class="link-button confirm" href="{{linkHref}}"> {{linkLabel}} </a>
                      </div>
                  </div>
                  <div class="vac-content" style="box-sizing: border-box; background-color: rgb(var(--chat-window-background-color,  255, 255, 255)); ">
                  <dl class="dynamic-fields" style="box-sizing: border-box; flex-flow: row wrap;">
                      {{fields}}
                      </dl>
                  </div>
              </div>
          </div>
      </div>
  </body>

  </html>
