template_definition: |-
  <html>
  <head>
  <meta charset="UTF-8" />
  <style type="text/css">
  :root {
      {{now-mobile-themes}}
      
      /*  M O B I L E   C O L O R   M A P  */
      --brand-color:                           var(--now-color_brand--secondary, #293E40);
      --primary-color:                         var(--now-color--primary-1, #1F8476);
      --secondary-color:                       var(--now-color--secondary-3, #165C53);
      --destructive-color:                     var(--now-color_alert--critical-3, #C83C36);
      --text-primary-color:                    var(--now-color_text--primary, #151920);
      --text-secondary-color:                  var(--now-color_text--secondary, #2C323F);
      --text-actionable-color:                 var(--now-color_text--primary-actionable, #FFFFFF);
      --brand-background-color:                var(--now-color--primary-0, #B5DDE5);
      --background-tertiary-color:             var(--now-color_background--tertiary, #E4E6EA);
      --border-tertiary-color:                 var(--now-color_border--tertiary, #D3D6DC);
      --separator-tertiary-color:              var(--now-color_divider--tertiary, #D3D6DC);
      --screen-header-text-color:              var(--now-color--neutral-0, #FFFFFF);
      --background-primary-actionable-color:   var(--now-color_background--primary-actionable, #151920);
      --alert-critical-0-color:                var(--now-color_alert--critical-0, #F4D8D7);
      --alert-critical-3-color:                var(--now-color_alert--critical-3, #C83C36);
      --shadow-color:                          var(--now-color--neutral-18, #151920);
      --link-primary-color:                    var(--now-color--link-2, #1F8476);
      --notification-color:                    var(--now-color_alert--critical-2, #E65651);
      --background-secondary-actionable-color: var(--now-color_background--secondary-actionable, #2C323F);
      --background-primary-color:              var(--now-color_background--primary, #FFFFFF);
      --background-secondary-color:            var(--now-color_background--secondary, #F6F6F8);
      --text-tertiary-color:                   var(--now-color_text--tertiary, #454D5B);
      --link-secondary-color:                  var(--now-color--link-3, #1F8476);

      direction: {{now-content-direction}};
  }
  body {
      font-family: ui-sans-serif, system-ui, -apple-system, "BlinkMacSystemFont", "Droid Sans", "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
      background-color: transparent;
      color: var(--text-primary-color);
      text-align: left;
  }
  h1 {
      font-weight: normal;
      font-size: 13px;
  }
  h3 {
      font-weight: normal;
  }
  p {
      font-weight: normal;
      color: rgb(128, 128, 128);
      font-size: 14px;
      margin: 4px;
  }
  dl {
      margin: 0px;
      padding: 0px;
      padding-top: 4px;
  }
  dt, dd, dt span, dd span {
      margin: 0 0 6px 0;
      padding: 0px;
      height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      float: left;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      text-align: left;
      font-size: 1.0rem;
  }
  dt, dt span {
      clear: both;
      display: block;
      margin-right: 4px;
  }
  dd, dd span {
      margin-left: 0px;
      font-weight: bold;
      display: block;
  }
  .light {
      color: rgb(128, 128, 128);
  }
  .clear {
      clear: both;
  }
  .source-text {
      font-size: 0.9em;
      padding: 6px 0px 0px 0px;
      margin: 0px;
  }
  .vac-card {
      box-shadow: 0px 0px 10px 0px rgba(0.1, 0.1, 0.1, 0.15);
      border-radius: 8px;
      padding: 12px;
      background-color: var(--background-primary-color);
  }
  .vac-title-displayed-value h1 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      font-size: 20px;
      font-weight: bold;
  }
  .vac-subtitle-displayed-value p {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      color: var(--text-secondary-color);
  }
  .vac-content {
      padding: 0px;
      margin: 0px;
  }
  .vac-fields {
      max-height: 75px;
      overflow: hidden;
  }
  a, a:visited, a:link, a:active, a:hover, a p {
      color: var(--link-primary-color);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: var(--link-primary-color);
  }
  a.link-button {
      display: block;
      background: var(--primary-color);
      height: 38px;
      margin: 16px 0px 2px 0px;
      border-radius: 8px;
      border: 1px solid var(--border-tertiary-color);
      text-align: center;
      line-height: 38px;
      color: var(--text-actionable-color);
      font-weight: bold;
  }
  </style>
  </head>
  <body>
      <div class="vac-card">
          <div class="vac-body">
              <div class="vac-header">
                  <div class="vac-subtitle-displayed-value">
                      <p>{{subtitle}}</p>
                  </div>
                  <div class="vac-title-displayed-value">
                      <h1>{{title}}</h1>
                  </div>
              </div>
              <div class="vac-content">
                  <dl class="vac-fields">
                      {{fields}}
                  </dl>
                  <div class="clear"></div>
                  <a target="_blank" class="link-button confirm" href="{{url}}">
                      View record
                  </a>
              </div>
          </div>
      </div>
  </body>
  </html>
template_name: ''
