template_definition: |-
  <html>
              <head>
              <meta charset="UTF-8">
              </head>
              <style type="text/css">
                  dl.vac-fields > dt {
                      width: calc(30% - 15px);
                      color: #767676;
                      margin-left: 15px;
                      box-sizing: border-box;
                      float: left;
                      text-align: right;
                      margin-top: 0.3rem;
                      margin-bottom: 0.2rem;
                      font-size: calc(13px * var(--chat-body--font_size--multiplier, 1));
                  }

                  dl.vac-fields > dd {
                      width: 60%;
                      margin-left: 10px;
                      box-sizing: border-box;
                      margin-top: 0.3rem;
                      margin-bottom: 0.2rem;
                      font-size: calc(13px * var(--chat-body--font_size--multiplier, 1));
                  }
              </style>
              <body>
              <div class="vac-card" style="margin: -10px; border-radius: 5px; box-sizing: border-box;">
              <div class="vac-body" style="padding: 0.2rem;box-sizing: border-box;max-width: 506px;width: calc(100vw - 6.2rem);min-width: 265px;">
              <div class="vac-header" style="display: flex; font-weight: bold;box-sizing: border-box;justify-content: space-between;margin-right: 1.5rem;margin-bottom: .5rem;padding-left: 1.5rem;padding-top: .5rem;">
              <div class="vac-title-displayed-value">
              {{title}}
              </div>
              </div>
              <div class="vac-content" style="box-sizing: border-box; background-color: white; ">	
              <dl class="vac-fields" style="box-sizing: border-box;display:flex;flex-flow: row wrap;margin: 0px;padding:5px 0px 2px;">
              {{fields}}
              </dl>
              </div>
              </div>
              </div>
              </body>
              </html>
template_name: htmlPreChat
