template_definition: |-
  {
      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
      "type": "AdaptiveCard",
      "version": "1.0",
      "body": [
           {
              "type": "TextBlock",
              "text": "{{data.messageHeading}}",
            "weight":"bolder",
            "wrap": true
          },
          {
              "type": "TextBlock",
              "text": "{{data.message}}",
              "wrap": true
          },
          {
              "type": "Container",
              "separator": true,
              "items": [
                  {
                      "type": "FactSet",
                      "facts": [
                          {
                              "_value": "{{data.fields}}",
                              "_template": "TeamsCardField"
                          }
                      ]
                  }
              ]
          }
      ],
       "actions": [
      {
        "type": "Action.OpenUrl",
        "title": "{{'Go to ' + data.tableLabel}}",
        "url": "{{data.url}}"
      }
    ]
  }
template_name: teamsNotificationWithLink
