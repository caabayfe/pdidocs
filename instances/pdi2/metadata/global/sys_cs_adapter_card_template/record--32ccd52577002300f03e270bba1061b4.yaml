template_definition: |-
  <html>
  <head>
      <meta charset="UTF-8">
  </head>
  <style type="text/css">
      dl.vac-fields > dt {
          width: calc(30% - 15px);
          color: rgb(var(--secondary_text_color, 118,118,118));
          margin-left: 1rem;
          box-sizing: border-box;
          float: left;
          text-align: left;
          margin-top: 0.3rem;
          margin-bottom: 0.2rem;
          font-size: calc(13px * var(--chat-body--font_size--multiplier, 1));
      }

      dl.vac-fields > dd {
          width: 60%;
          margin-left: 10px;
          box-sizing: border-box;
          margin-top: 0.3rem;
          margin-bottom: 0.2rem;
          font-size: calc(13px * var(--chat-body--font_size--multiplier, 1));
      }

      div.vac-sub-url {
          word-break: keep-all;
      }
      @media (forced-colors: active) {
          dl.vac-fields > dt, dl.vac-fields > dd, .vac-title-displayed-value {
           color: canvastext;
       }
    }
  </style>
  <body>
  <div class="vac-card" style="max-width: 600px; width: 100%;  border-radius: 5px; box-sizing: border-box; border: 1px solid rgb(var(--bot-message-bubble-color, 233, 237, 241))">
      <div class="vac-body" style="box-sizing: border-box; min-width: 265px; background-color: var(--chat-window-background-color); border-radius: 5px;">
          <div class="vac-header"
               style="display: flex; font-weight: 600;box-sizing: border-box;justify-content: space-between; padding: 1rem 1.5rem 0.5rem 1rem; font-size: calc(16px * var(--chat-body--font_size--multiplier, 1)); color: var(--bot-message-bubble-font-color); word-break:keep-all;">
              <div class="vac-title-displayed-value" style="margin-right:5px;">
                  {{title}}
              </div>
              <div class="vac-sub-url vac-sub-displayed-value" style="text-align:right;">
                  <a href="{{url}}"  target="{{target}}" dataNowSmartLink="{{dataNowSmartLink}}">{{subtitle}}</a>
              </div>
          </div>
          <div class="vac-content" style="box-sizing: border-box; background-color: rgb(var(--chat-window-background-color, 255, 255, 255)); border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;">
              <dl class="vac-fields"
                  style="box-sizing: border-box;display:flex;flex-flow: row wrap;margin: 0px;padding:5px 0px 5px;">
                  {{fields}}
              </dl>
          </div>
      </div>
  </div>
  </body>
  </html>
