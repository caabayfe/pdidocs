template_definition: |-
  <html>
              <head>
              <meta charset="UTF-8">
              </head>
              <style type="text/css">
              .card-container {
              border-radius: 5px;
              border: 1px solid rgb(var(--seperator-color, 230, 232, 234));
              box-sizing: border-box;
              background-color: rgb(var(--chat-window-background-color,  255, 255, 255));
              padding: .5rem .5rem .5rem .5rem;
              max-width: 506px;
              width: 100%;
              min-width: 265px;
              }
              
              .card-body {
              display: flex;
              }
              
              .card-body-column {
              display: flex;
              flex-direction: column
              }
              
              .card-body-column:last-of-type {
              flex-grow: 1;
              with: 100%; /** IE11 fix */
              }
              
              .now-avatar-cart-img {
              width: 4.4rem;
              object-fit: cover;
              margin-right: .5rem;
              }
              
              .card-identifier {
              font-size: calc(14px * var(--chat-body--font_size--multiplier, 1));
              color: rgb(var(--secondary_text_color, 99, 114, 116));
              }
              
              .card-identifier-text {
              font-size: calc(12.8px * var(--chat-body--font_size--multiplier, 1));
              display: -webkit-box;
              overflow: hidden;
              -webkit-line-clamp: 1;
              -webkit-box-orient: vertical;
              }
              
              .card-heading-text {
              color: rgb(var(--non_clickable_title_color, 22, 27, 28));
              font-size: calc(15px * var(--chat-body--font_size--multiplier, 1));
              font-family: Source Sans Pro;
              font-weight: 600;
              }
              
              .card-description {
              color: rgb(var(--non_clickable_title_color, 22, 27, 28));
              margin-bottom: 0.2rem;
              display: -webkit-box;
              line-height: 18px;
              overflow: hidden;
              max-height: 90px;
              text-overflow: ellipsis;
              box-orient: vertical;
              line-clamp: 5;
              -webkit-box-orient: vertical;
              -webkit-line-clamp: 5;
              }
              
              .card-price {
              color: rgb(var(--secondary_text_color, 99,114,116));
              font-family: Helvetica;
              font-size: calc(14px * var(--chat-body--font_size--multiplier, 1));
              line-height: 22px;
              }
              
              .card-footer {
              margin-bottom: 0.2rem;
              }
              
              .now-icon-cart {
              width: 3rem;
              height: 2rem;
              margin-top: 1rem;
              margin-right: .5rem;
              object-fit: cover;
              }
              
              .dynamic-fields {
              color: rgb(var(--secondary_text_color, 115,115,115));
              list-style: none;
              margin: 0;
              padding: 0;
              font-size: calc(13px * var(--chat-body--font_size--multiplier, 1));
              font-family: Helvetica;
              line-height: 18px;
              }
              
              dl.dynamic-fields > dt {
              box-sizing: border-box;
              float: left;
              text-align: right;
              font-weight: 500;
              margin-right: 5px;
              }
              
              dl.dynamic-fields > dd {
              box-sizing: border-box;
              font-weight: 400;
              margin-left: 0px;
              }
              
              .fLabel {
              margin-right: -4px;
              }
              
              </style>
              
              <body>
                  <div class="card-container">
                  <div class="card-text card-identifier">
                  <span class="card-identifier-text"> 
                  {{identifier}} 
                  </span>
                  </div>
                  <div class="card-body">
                  <div class="card-body-column">
                  <!--
                      <img class="now-avatar-cart-img" src={{image}} alt="{{alt}}"/>
                  -->
                  </div>
                  <div class="card-body-column">
                  <div class="card-text">
                  <span class="card-heading-text">
                  {{header}} 
                  </span>
                  </div>
                  
                  <span class="card-text card-description"> 
                  <span class="card-description-text"> {{description}} </span>
                  </span>
                  
                  <div class="card-footer">
                  <div class="card-footer-link">
                  <a target="{{target}}" dataNowSmartLink="{{dataNowSmartLink}}" class="link-button confirm" href="{{linkHref}}"> {{linkLabel}} </a>
                  </div>
                  </div>
                  <div class="vac-content" style="box-sizing: border-box; background-color: rgb(var(--chat-window-background-color,  255, 255, 255)); ">
                      <dl class="dynamic-fields" style="box-sizing: border-box; flex-flow: row wrap;">
                      {{fields}}
                  </dl>

                  </div>
                  </div>
                  </div>
                  </div>
              </body>
              
              </html>
template_name: SkillCard
