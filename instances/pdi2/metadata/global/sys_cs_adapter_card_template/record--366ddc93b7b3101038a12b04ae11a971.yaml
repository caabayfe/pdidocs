template_definition: |-
  <html>

  <head>
      <meta charset="UTF-8">
  </head>
  <style type="text/css">
      .card-container {
          border-radius: 5px;
          border: 1px solid RGB(var(--seperator-color,  230, 232, 234));
          box-sizing: border-box;
          background-color: RGB(var(--chat-window-background-color, 255, 255, 255));
          padding: .5rem .5rem .5rem .5rem;
          max-width: 506px;
          width: 100%;
          min-width: 265px;
      }

      .card-body {
          display: flex;
      }

      .card-body-column {
          display: flex;
          flex-direction: column;
      }

      .card-body-column:last-of-type {
          flex-grow: 1;
          width: 100%; /** IE11 fix */
      }

      .now-avatar-img {
          width: 3.5rem;
          height: 3.5rem;
          border-radius: 50%;
          object-fit: cover;
          margin-right: .5rem;
      }

      .card-identifier {
          color:  RGB(var(--secondary_text_color, 93, 93, 93));
      }

      .card-identifier-text {
          font-size: calc(12px * var(--chat-body--font_size--multiplier, 1));
          display: -webkit-box;
          overflow: hidden;
          -webkit-line-clamp: 1;
          -webkit-box-orient: vertical;
          line-height: 18px;
      }

      .card-heading-text {
          font-size: calc(15px * var(--chat-body--font_size--multiplier, 1));
          font-family: Source Sans Pro;
          font-weight: 600;
      }

      .card-description {
          color: RGB(var(--bot-message-bubble-font-color));
          margin-bottom: 0.4rem;
          font-size: calc(14px * var(--chat-body--font_size--multiplier, 1));
          margin-bottom: 4px;
      }

      .card-description-stacked {
          list-style: none;
          padding: 0;
          margin: 0;
      }

      .dynamic-fields {
          color: RGB(var(--secondary_text_color, 115,115,115));
          list-style: none;
          margin: 0;
          padding: 0;
          font-size: calc(13px * var(--chat-body--font_size--multiplier, 1));
          font-family: Helvetica;
          line-height: 18px;
      }

      dl.dynamic-fields > dt {
          box-sizing: border-box;
          float: left;
          text-align: right;
          font-weight: 500;
          margin-right: 5px;
      }

      dl.dynamic-fields > dd {
          box-sizing: border-box;
          font-weight: 400;
          margin-left: 0px;
      }

      .fLabel {
          margin-right: -4px;
      }

      .now-avatar-initials {
          line-height: 2.2;
          height: 3.5rem;
          width: 3.5rem;
          border-radius: 100%;
          display: flex;
          justify-content: center;
          background-color: rgb(var(--secondary_text_color, 230, 233, 235));
          margin-right: .5rem;
          font-size: calc(23px * var(--chat-body--font_size--multiplier, 1));
      }
  </style>

  <body>
  <div class="card-container">
      <div class="card-body">
          <div class="card-body-column">
              <img class="now-avatar-img" src={{avatar}} alt="{{alt}}"/>

              <span class="now-avatar-label">
                      <span class="now-avatar-initials"> {{initials}} </span>
             </span>
          </div>
          <div class="card-body-column">
              <div class="card-text card-identifier">
                      <span class="card-identifier-text">
                      	{{identifier}}
                      </span>
              </div>
              <div class="card-text">
                      <span class="card-heading-text card-heading-text-{{showAsLink}}">
                      	<a target="{{target}}" dataNowSmartLink="{{dataNowSmartLink}}" href={{linkHref}}> {{header}} </a>
                      </span>
              </div>
              <div class="card-text card-description">
                  <ul class="card-description-stacked">
                      <li>
                          <span class="card-description-text"> {{primaryDescription}} </span>
                      </li>
                      <li>
                          <span class="card-description-text"> {{secondaryDescription}} </span>
                      </li>
                  </ul>
              </div>
              <div class="vac-content" style="box-sizing: border-box; background-color: rgb(var(--chat-window-background-color, 255, 255, 255)); ">
                  <dl class="dynamic-fields" style="box-sizing: border-box; flex-flow: row wrap;">
                      {{fields}}
                  </dl>
              </div>
          </div>
      </div>
  </div>
  </body>

  </html>
