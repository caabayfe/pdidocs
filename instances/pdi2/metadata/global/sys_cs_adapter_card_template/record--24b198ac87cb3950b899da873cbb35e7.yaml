template_definition: |-
  <html>
  <head>
  <meta charset="UTF-8" />
  <style type="text/css">
      :root {
          {{now-mobile-themes}}
              
          /*  M O B I L E   C O L O R   M A P  */
          --brand-color:                           var(--now-color_brand--secondary, #293E40);
          --primary-color:                         var(--now-color--primary-1, #1F8476);
          --secondary-color:                       var(--now-color--secondary-3, #165C53);
          --destructive-color:                     var(--now-color_alert--critical-3, #C83C36);
          --text-primary-color:                    var(--now-color_text--primary, #151920);
          --text-secondary-color:                  var(--now-color_text--secondary, #2C323F);
          --text-actionable-color:                 var(--now-color_text--primary-actionable, #FFFFFF);
          --brand-background-color:                var(--now-color--primary-0, #B5DDE5);
          --background-tertiary-color:             var(--now-color_background--tertiary, #E4E6EA);
          --border-tertiary-color:                 var(--now-color_border--tertiary, #D3D6DC);
          --separator-tertiary-color:              var(--now-color_divider--tertiary, #D3D6DC);
          --screen-header-text-color:              var(--now-color--neutral-0, #FFFFFF);
          --background-primary-actionable-color:   var(--now-color_background--primary-actionable, #151920);
          --alert-critical-0-color:                var(--now-color_alert--critical-0, #F4D8D7);
          --alert-critical-3-color:                var(--now-color_alert--critical-3, #C83C36);
          --shadow-color:                          var(--now-color--neutral-18, #151920);
          --link-primary-color:                    var(--now-color--link-2, #1F8476);
          --notification-color:                    var(--now-color_alert--critical-2, #E65651);
          --background-secondary-actionable-color: var(--now-color_background--secondary-actionable, #2C323F);
          --background-primary-color:              var(--now-color_background--primary, #FFFFFF);
          --background-secondary-color:            var(--now-color_background--secondary, #F6F6F8);
          --text-tertiary-color:                   var(--now-color_text--tertiary, #454D5B);
          --link-secondary-color:                  var(--now-color--link-3, #1F8476);

          direction: {{now-content-direction}};
      }
      body {
          font-family: ui-sans-serif, system-ui, -apple-system, "BlinkMacSystemFont", "Droid Sans", "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
          background-color: transparent;
          margin: 24px;
      }
      a, a:visited {
          text-decoration: none;
          color: var(--link-primary-color);
      }
      .card-container {
          box-sizing: border-box;
          background-color: var(--background-primary-color);
          max-width: 506px;
          width: 100%;
          min-width: 265px;
          margin: 0px auto;
          box-shadow: 0px 0px 10px 0px rgba(0.1, 0.1, 0.1, 0.15);
          border-radius: 8px;
          padding: 12px;
      }
      .card-body {
          display: flex;
      }
      .card-body-column {
          display: flex;
          flex-direction: column;
      }
      .card-body-column:last-of-type {
          flex-grow: 1;
          width: 100%; /** IE11 fix */
      }
      .card-identifier {
          color: var(--text-secondary-color);
      }
      .card-identifier-text {
          font-size: 12px;
          font-style: normal;
          font-weight: 400;
          line-height: normal;
      }
      .card-heading-text {
          color: var(--text-primary-color);
          font-size: 1rem;    font-weight: 600;
      }
      .card-description {
          color: var(--text-secondary-color);
          margin-bottom: 0.4rem;
          font-weight: 400;
          padding-bottom: 8px;
          position: relative;
      }
      .card-footer-link {
          font-size: 12px;
      }
      .card-footer-link ul {
          list-style-type: none;
          padding: 0px;
      }
      .card-footer-link ul li {
          height: 14px;
          padding-bottom: 4px;
      }
      .card-footer-link ul li img {
          width: 14px;
          height: 14px;
          border-radius: 4px;
          position: relative;
          top: 3px;
          left: 0px;
      }
      .card-footer-link ul li a {
          font-size: 12px;
      }
      .card-description table {
          display: flex;
          flex-direction: column;
          flex-wrap: nowrap;
          flex-grow: 1;
          flex-shrink: 1;
      }
      .card-description tr {
          width: 100%;
          display: flex;
          flex-direction: row;
          flex-wrap: nowrap;
      }
      .card-description td {
          display: flex;
          flex-flow: row wrap;
          flex-grow: 1;
          flex-basis: 0;
      }
      .card-description ol { margin: 0; }
      .card-description p { margin: 0; }
      .card-description pre { white-space: pre-wrap; }
      .dynamic-fields {
          color: var(--text-secondary-color);
          list-style: none;
          margin: 0;
          padding: 0;
          font-size: 13px;
          font-family: Helvetica;
          line-height: 18px;
      }
      dl.dynamic-fields > dt {
          box-sizing: border-box;
          float: left;
          text-align: right;
          font-weight: 500;
          margin-right: 5px;
      }
      dl.dynamic-fields > dd {
          box-sizing: border-box;
          font-weight: 400;
          margin-left: 0px;
      }
      .fLabel { margin-right: -4px; }
      .sparkle-legal {
          font-weight: normal;
          color: rgb(128, 128, 128);
          margin: 2px;
          color: var(--text-secondary-color);
      }
  </style>
  </head>
  <body>
      <div class="card-container">
          <div class="card-body">
              <div class="card-body-column">
                  <div class="card-text card-identifier" style="padding-bottom: 8px;">
                      <div class="card-text card-identifier" style="padding-bottom: 8px;">
                          <div class="card-identifier-text">
                              <img src="ai-sparkle.svg" width="12" height="12" />
                              <span>{{sparkleText}}</span>
                              <p class="sparkle-legal">{{sparkleLegalText}}</p>
                          </div>
                      </div>
                  </div>
                  <div id="card-description" class="card-text card-description">
                      {{description}}
                  </div>
                  <div class="card-footer">
                      <div class="card-footer-link">
                          {{footerPrefix}}
                          <ul>
                              {{citations}}
                          </ul>
                      </div>
                  </div>
                  <div class="vac-content" style="box-sizing: border-box; background-color: rgb(var(--chat-window-background-color,  255, 255, 255)); ">
                      <dl class="dynamic-fields" style="box-sizing: border-box; flex-flow: row wrap;">
                          {{fields}}
                      </dl>
                  </div>
              </div>
          </div>
      </div>
  </body>
  </html>
