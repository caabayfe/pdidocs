template_definition: |-
  <html>

  <head>
      <meta charset="UTF-8">
  </head>
  <style type="text/css">
  .card-container {
      border-radius: 5px;
      border: 1px solid rgb(var(--seperator-color, 230, 232, 234));
      box-sizing: border-box;
      background-color: rgb(var(--chat-window-background-color,  255, 255, 255));
      padding: .5rem .5rem .5rem .5rem;
      max-width: 506px;
      width: 100%;
      min-width: 265px;
  }

  .card-body {
      display: flex;
  }

  .card-body-column {
      display: flex;
      flex-direction: column
  }

  .card-body-column:last-of-type {
      flex-grow: 1;
      width: 100%; /** IE11 fix */
  }

  .card-identifier {
      color: rgb(var(--secondary_text_color, 99, 114, 116));
  }

  .card-identifier-text {
      overflow: hidden;
      border-color: RGB(var(--now-highlighted-value--tertiary_moderate--border-color,var(--now-color_alert--moderate-1,148,149,225)));
      color: var(--primary-primary-1, #4F52BD);
      width: fit-content;
      font-family: Lato;
      font-size: 12px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
  }

  .card-heading-text {
      color: rgb(var(--non_clickable_title_color, 22, 27, 28));
      font-size: 1rem;
      font-weight: 600;
  }

  .card-description {
      color: rgb(var(--secondary_text_color, 22, 27, 28));
      margin-bottom: 0.4rem;
      font-weight: 400;
      padding-bottom: 8px;
      position: relative;
  }

  .card-footer-link {
    font-size: 12px;
  }

  .card-description table {
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      flex-grow: 1;
      flex-shrink: 1;
  }

  .card-description tr {
      width: 100%;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
  }

  .card-description td {
      display: flex;
      flex-flow: row wrap;
      flex-grow: 1;
      flex-basis: 0;
  }

  .card-description ol {
      margin: 0;
  }

  .card-description p {
      margin: 0;
  }

  .card-description pre {
      white-space: pre-wrap;
  }

  .dynamic-fields {
          color: rgb(var(--secondary_text_color, 115,115,115));
          list-style: none;
          margin: 0;
          padding: 0;
          font-size: 13px;
          font-family: Helvetica;
          line-height: 18px;
      }

      dl.dynamic-fields > dt {
          box-sizing: border-box;
          float: left;
          text-align: right;
          font-weight: 500;
          margin-right: 5px;
      }

      dl.dynamic-fields > dd {
          box-sizing: border-box;
          font-weight: 400;
          margin-left: 0px;
      }

      .fLabel {
          margin-right: -4px;
      }

      .card-citations {
          color: rgb(var(--secondary_text_color, 115,115,115));
          font-size: 12px;
          line-height: 18px;
          list-style: none;
          margin: 0;
          padding: 0;
      }

      .card-citations > li {
          display: flex;
          align-items: center;
      }

      .card-citations > li > a {
          padding-left: 4px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }
  </style>

  <body>
      <div class="card-container">
          <div class="card-body">
              <div class="card-body-column">
                  <div class="card-text card-identifier" style="padding-bottom: 8px;">
                      <span class="card-identifier-text"><img src="ai-sparkle.svg" width="12" height="12"/> {{sparkleText}}                 
                        <span title= {{tooltip}}>
                         <img src="i-icon.svg" width="12" height="12"/>
                        </span>
                  </div>
                  <div id="card-description" class="card-text card-description">
                      {{description}}
                  </div>
                  <div class="card-footer">
                      <div class="card-footer-link">
                          {{footerPrefix}}<a target="{{target}}" dataNowSmartLink="{{dataNowSmartLink}}" class="link-button confirm" href="{{linkHref}}">{{linkLabel}} </a>
                      </div>
                  </div>
                  <div class="vac-content" style="box-sizing: border-box; background-color: rgb(var(--chat-window-background-color,  255, 255, 255)); ">
                  <dl class="dynamic-fields" style="box-sizing: border-box; flex-flow: row wrap;">
                      {{fields}}
                      </dl>
                  </div>
                  <ul class="card-citations">
                       {{citations}}
                  </ul>
              </div>
          </div>
      </div>
  </body>

  </html>
