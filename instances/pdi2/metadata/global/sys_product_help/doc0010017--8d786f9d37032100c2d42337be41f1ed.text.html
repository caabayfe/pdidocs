<p>To schedule a report for the future:</p>
<ol><li>Navigate to <strong>Reports &gt; Scheduled Reports</strong>.</li><li>Click <strong>New</strong>.</li></ol>
<p> </p>
<p> <img style="align: baseline;" title="" src="/sys_attachment.do?sys_id&#61;899956274ff1120031577d2ca310c72a" alt="" height="" align="baseline" border="" hspace="" vspace="" /></p>
<p>Enter the report parameters to run and the appropriate scheduling information, including the frequency in the <strong>Run</strong> choice list and the<strong> Time</strong>. To schedule, click <strong>Submit</strong>.</p>
