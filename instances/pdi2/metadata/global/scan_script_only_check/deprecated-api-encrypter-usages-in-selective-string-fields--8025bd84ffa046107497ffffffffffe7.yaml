description: |-
  The Encrypter API will be deprecated for the ServiceNow platform. The API will no longer be supported and will soon be removed in future releases of the platform.
  			
  Due to evolving security standards and for the safety of our customers, the decision has been made to deprecate this API.
documentation_url: https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB1633559
finding_type: scan_finding
name: 'Deprecated API: Encrypter usages in selective String fields'
priority: '2'
resolution_details: |-
  Customers should migrate their Encrypter usages to alternative encryption methods. The ServiceNow platform offers a variety of encryption options. For more information, see KB https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB1633559
  			
  Continued use of the Encrypter API poses a security risk to your data and will result in compatibility issues with future releases of the ServiceNow platform.
