category: security
description: Knowledge Bases and Knowledge Base Articles can be configured to allow unauthenticated users to access Knowledge Base Articles. This check identifies public Knowledge Bases Articles to be reviewed for confirmation that the current configuration aligns with your business needs.
documentation_url: ''
finding_type: scan_finding
name: Review Public Knowledge Base Articles
priority: '3'
resolution_details: |-
  Review the identified Knowledge Base Article to confirm whether unauthenticated access aligns with your business needs. If this Knowledge Base Article is intentionally public, this finding can be "muted."

  If the entire Knowledge Base that this KB Article belongs to should not be public, "Guest User" can be added to the "Cannot Read" user criteria for the corresponding Knowledge Base.

  If this Knowledge Base Article is part of a public knowledge base, but the article itself should not be public, "Guest User" can be added to the "Cannot Read" user criteria for this Knowledge Base Article.
run_condition: ''
