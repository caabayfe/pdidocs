<h2><span style="font-family: Lato, Arial, sans-serif; font-size: 12pt;">Entry conditions</span></h2>
<p><span style="font-family: Lato, Arial, sans-serif; font-size: 10.5pt;">Determines which records are processed for IAR. Only issues matching the Entry Condition will be processed by IAR.</span></p>
<h2><span style="font-family: Lato, Arial, sans-serif; font-size: 12pt;">Exit conditions</span></h2>
<p><span style="font-family: Lato, Arial, sans-serif; font-size: 10.5pt;">Determines when IAR will stop processing when Machine Learning process is complete.</span></p>
