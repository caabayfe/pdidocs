  Validation of changed passwords. 
  Override or implement this to enforce strong passwords and write custom error messages.  
  New password can be accessed via request.getParameter("user_password")
  Error messages can be written with gs.addErrorMessage(gs.getMessage("Your message here"))
  process() must return true/false. 
