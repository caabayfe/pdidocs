message: |-
  <mail_script>
              var json = new JSON();
              var summary = json.decode(event.parm1);
              var escape = GlideStringUtil.escapeHTML;

              var domainName = summary.domain_name;
              var targetValue = summary.target || '';
              var uuid = summary.uuid || '';
              var aggregate = summary.aggregate || '';
              var indicatorName = summary.indicator || '';
              var breakdown = summary.breakdown || '';
              var breakdown_element = summary.breakdown_element || '';
              var breakdown2 = summary.breakdown_level2 || '';
              var element2 = summary.element_level2 || '';
              var numberOfDays = summary.numberOfDays || '0';
              var score = summary.score || '';
              var gap = summary.gap || '';

              var linkText = [aggregate, indicatorName].join(' ');
              var linkTextBreakdown = breakdown ? gs.getMessage('for {0} {1} {2} {3}', [breakdown, breakdown_element, breakdown2, element2]) : '';

              if (linkTextBreakdown)
                    linkText = linkText + ' ' + linkTextBreakdown;

              var domainText = '';
              if (domainName && domainName != null)
                    domainText = gs.getMessage('from {0} domain', domainName);

              var url = 'https://' + gs.getProperty('instance_name') + '.service-now.com/$pa_detailed.do?jvar_uuid=' + escape(uuid);
              var link = '<a href="' + url + '">' + escape(linkText) + '</a>';

              var gapMsg = gs.getMessage(' And the gap is {0}.', gap);

              var msg = gs.getMessage('The prediction is that the target of {0} {1} for the [link_placeholder], will be met approximately in {2} days. The latest score is {3}.', [targetValue, domainText, numberOfDays, score]);
              msg = msg.replace('[link_placeholder]', link);

              template.print('<div>');
              template.print(msg);
              if (gap)
                template.print(gapMsg);

              template.print('</div>');
              template.print('<br>');
  </mail_script>
