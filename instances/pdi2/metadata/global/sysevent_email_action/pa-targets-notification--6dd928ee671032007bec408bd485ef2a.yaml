message: |-
  <mail_script>
  var json = new JSON();
  var summary = json.decode(event.parm1);
  var reached = summary.reached;
  var notReached = summary.not_reached;
  var escape = GlideStringUtil.escapeHTML;

  if (notReached.length > 0)
  	template.print('<h3>The following targets have not been met:</h3>')

  for (var i=0; i<notReached.length; i++){
  	if(notReached[i].uuid != null) {
  	   // This gets executed for the unreached targets created on pa_targets table.
  		var name = notReached[i].uuid_display_value;
  		var uuid = notReached[i].uuid;
  		var targetValue = notReached[i].target_value;
  		var gap = notReached[i].gap;
  		var isGlobal = notReached[i].global;
  		var score = notReached[i].score;
  		var notificationMessage = 'The target of ' + escape(targetValue) + ' for the <a href="' + gs.getProperty('glide.servlet.uri') + '$pa_detailed.do?jvar_uuid=' + escape(uuid) +'">' + escape(name) + '</a>' + ' has not been met. The latest score is ' + escape(score) + ', and the gap is ' + gap + '.';

  		template.print('<div>' + notificationMessage + '</div>');
  		template.print('<br>');
  	} else {
  	   // This gets executed for the unreached targets created on target_definition table.
  		var name = notReached[i].indicator_display_value;
  		var targetValue = notReached[i].target_value;
  		var gap = notReached[i].gap;
  		var score = notReached[i].score;
  		var sourceId = notReached[i].source_id;
  		var processedFilterJson = notReached[i].processed_filter_json;
                  var calendarInfoJson = notReached[i].calendar_info_json;
  		var notificationMessage = 'The target of ' + escape(targetValue) + ' for the <a href="' + gs.getProperty('glide.servlet.uri') + 'now/platform-analytics-workspace/ac_kpi_details/' + escape(sourceId) +'/params/calendarInfo/'+ escape(calendarInfoJson) + '/breakdowns/'+ escape(processedFilterJson) +'/list-view/panel/target">' + escape(name) + '</a>' + ' has not been met. The latest score is ' + escape(score) + ', and the gap is ' + gap + '.';

  		template.print('<div>' + notificationMessage + '</div>');
  		template.print('<br>');
  	}
  }

  if (reached.length > 0)
  	template.print('<h3>The following targets have been reached:</h3>')

  for (var i=0; i<reached.length; i++){
  	if(reached[i].uuid != null) {
  	   // This gets executed for the reached targets created on pa_targets table.
  		var name = reached[i].uuid_display_value;
  		var uuid = reached[i].uuid;
  		var targetValue = reached[i].target_value;
  		var gap = reached[i].gap;
  		var isGlobal = reached[i].global;
  		var score = reached[i].score;
  		var date = reached[i].target_reached_date;

  		var notificationMessage = 'The target of ' + escape(targetValue) + ' for the <a href="' + gs.getProperty('glide.servlet.uri') + '$pa_detailed.do?jvar_uuid=' + escape(uuid) +'">' + escape(name) + '</a>' + ' has been met. The latest score is ' + escape(score) + ', and the gap is ' + gap + '.';

  		template.print('<div>' + notificationMessage + '</div>');
  		template.print('<br>');
  	} else {
  	   // This gets executed for the reached targets created on target_definition table.
  		var name = reached[i].indicator_display_value;
  		var targetValue = reached[i].target_value;
  		var gap = reached[i].gap;
  		var score = reached[i].score;
  		var sourceId = reached[i].source_id;
  		var processedFilterJson = reached[i].processed_filter_json;
                  var calendarInfoJson = reached[i].calendar_info_json;

  		var notificationMessage = 'The target of ' + escape(targetValue) + ' for the <a href="' + gs.getProperty('glide.servlet.uri') + 'now/platform-analytics-workspace/ac_kpi_details/' + escape(sourceId) +'/params/calendarInfo/'+ escape(calendarInfoJson) + '/breakdowns/'+ escape(processedFilterJson) + '/list-view/panel/target">' + escape(name) + '</a>' + ' has been met. The latest score is ' + escape(score) + ', and the gap is ' + gap + '.';

  		template.print('<div>' + notificationMessage + '</div>');
  		template.print('<br>');
  	}

  }
  </mail_script>
