message: |-
  <mail_script>
          var json = new JSON();
          var summary = json.decode(event.parm1);
          var scoreDate = summary.scoreDate;
          var reachedThresholdCheck = summary.thresholdCheck;
          var escape = GlideStringUtil.escapeHTML;
          var uuidString = reachedThresholdCheck.uuidString;
          var aggregate = reachedThresholdCheck.aggregateName;
          var indicatorName = reachedThresholdCheck.indicatorName;
          var breakdownName = reachedThresholdCheck.breakdownName;
          var elementName = reachedThresholdCheck.elementName;
          var breakdownL2Name = reachedThresholdCheck.breakdownL2Name;
          var elementL2Name = reachedThresholdCheck.elementL2Name;
          var domainName = reachedThresholdCheck.domain_name;
          var relativePosition = reachedThresholdCheck.position;
          var condition = reachedThresholdCheck.condition;
          var thresholdLevel = reachedThresholdCheck.thresholdLevel;
          var notificationMessageStart = 'The score for the ';
          var link = '<a href="https://' + gs.getProperty('instance_name') + '.service-now.com/$pa_detailed.do?jvar_uuid=' + escape(reachedThresholdCheck.uuid) +'">';
          if (typeof aggregate == 'undefined')
               aggregate = '';
          else
              aggregate += ' ';
          var notificationLinkText = aggregate + indicatorName;
          if (typeof breakdownName != 'undefined'){
                notificationLinkText += ' for ' + breakdownName + ' ' + elementName;
          }
          if (typeof breakdownL2Name != 'undefined'){
               notificationLinkText +=  ', ' + breakdownL2Name + ' ' + elementL2Name;
          }
          if (typeof domainName != 'undefined'){
          	notificationLinkText +=  ' - ['  + domainName + ']';
          }
          var notificationMessageEnd = '</a>';
          var notificationMessage;
  		if (typeof thresholdLevel == 'undefined') {
      		notificationMessage = ' had an ' + condition + ' of ' + escape(reachedThresholdCheck.matchingScore) + ' on ' + scoreDate + '.';
  		} else {
      		var relativePosition = escape(reachedThresholdCheck.position);
      		notificationMessage = ' was ' + escape(reachedThresholdCheck.matchingScore) + ' on ' + scoreDate + ', which is ' + relativePosition + ' the threshold of ' + thresholdLevel + '.';
              }
          template.print('<div>' + escape(notificationMessageStart) + link + escape(notificationLinkText) + notificationMessageEnd + escape(notificationMessage) + '</div>');
          template.print('<br>');
              </mail_script>
