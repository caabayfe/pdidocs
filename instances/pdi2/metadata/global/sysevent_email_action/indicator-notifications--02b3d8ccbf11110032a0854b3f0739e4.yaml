message: |-
  <table style="padding: 0.5em 0.1em; border-bottom: 1px solid rgb(238, 238, 238); font-family: 'Helvetica Neue',HelveticaNeue,'Nimbus Sans L',arial,sans-serif; font-size:12px;width:560px" cellpadding="0" cellspacing="0"> <tr> <td> <div style="font-family: helvetica,arial,sans-serif; font-size: 24px; color: rgb(207, 108, 21);">${name} ${run_type} Overview <br/> <mail_script> template.print(gs.now()); </mail_script> </div> <div style="margin: 8px 0pt; border-top: 2px solid rgb(228, 121, 17);">&nbsp;</div> </td> </tr> <tr><td style="font-size:22px">Indicators</td> </tr> <tr> <td> <table style="border:1px solid rgb(187, 187, 187); width: 100%; font-family: 'Helvetica Neue',HelveticaNeue,'Nimbus Sans L',arial,sans-serif;font-size:12px;width:560px" cellpadding="6" cellspacing="0"> <mail_script> 
  var json = new JSON();
  var scorecards = json.decode(event.parm1);
  var base_url = undefined;
  var instance_uri = gs.getProperty('glide.servlet.uri');
  if (instance_uri && instance_uri.length > 0) {
      if (instance_uri[instance_uri.length - 1] !== '/')
          instance_uri = instance_uri + '/';
  	base_url = instance_uri + 'nav_to.do?uri=' + encodeURIComponent('$pa_detailed.do?jvar_uuid=');
  }
  var escape = GlideStringUtil.escapeHTML;
  for (var idx = 0; idx < scorecards.length; idx++) {
      var scorecard = scorecards[idx];
      template.print('<tr style="height:15px;background-color:' + scorecard.line_color + '">');
      template.print('<td style="text-align:left;font-size:13px;white-space:nowrap;border-bottom:1px dotted ' +  scorecard.border_color + '">');
      if (base_url === undefined) {
      	template.print('<b>' + escape(scorecard.name) + '</b>');
      } else {
      	template.print('<b><a href="' + base_url + encodeURIComponent(scorecard.uuid) + '">' + escape(scorecard.name) + '</a></b>');
      }
      template.print('<br/><span style="font-size:15px">');
      if (!scorecard.value_formatted || scorecard.value_formatted == '') {
          template.print("There are no scores present for this indicator");
          template.print('</span></td></tr>');
          continue;
      }
      template.print('Latest score is ' + escape(scorecard.value_formatted) + " on " + escape(scorecard.period));
      if (scorecard.target && scorecard.target != '') {
          template.print(' | ');
          template.print("Target: " + escape(scorecard.target));
          template.print(" | ");
          template.print("Gap: ");
          template.print('<span style="background-color:' + scorecard.gap_color + ';font-size:15px;width:40px">');
          template.print(escape(scorecard.gap));
          template.print('</span>');
      }
      if (scorecard.change && scorecard.change != '') {
          template.print(" | ");
          template.print("Change: ");
          template.print('<span style="color:' + scorecard.change_color + ';font-size:15px">');
          template.print(escape(scorecard.change));
          template.print('</span>');
      }
      template.print('</span></td></tr>');
  }
  </mail_script> </table>
