message: |-
  <mail_script>
  var ia = new GlideRecord('incident_alert');
  ia.query('sys_id', current.sys_id);
  if ( ia.hasNext() && ia.next() )
  	template.print('Last action taken: ' + ia.comments.getJournalEntry(1));
  </mail_script>

  Raised: ${sys_created_on}
  Description: ${short_description}
  Created by: ${sys_created_by}

  Source incident: ${source_incident.number}
  Impacted systems:
  <mail_script>
  //look for impacted configuration items based on the source configuration item
  var gr = new GlideRecord('impacted_ci');
  gr.addQuery('incident_alert', current.sys_id);
  gr.addQuery('source_configuration_item', current.source_ci);
  gr.query();
  while ( gr.next() ) {
       template.print(gr.impacted_configuration_item.name);
       if(gr.hasNext())
       	template.print(", ");
  }
  </mail_script>
  Alert type: ${event_type}

  Click here to view Incident Alert: ${URI_REF}
