  <mail_script>
  	var json = new JSON();
  	var summary = json.decode(event.parm1);
  	var date = summary.date;
  	var UUIDs = summary.UUIDs;
  	var ds_thresholds = summary.dataSnapshot_threshold_reached;
  	var escape = GlideStringUtil.escapeHTML;
      if (typeof UUIDs != 'undefined') {
      for (var i=0;i<UUIDs.length;i++){
          var uuidString = UUIDs[i].uuidString;
          var reachedThresholdChecks = UUIDs[i].reachedThresholdChecks;
          var indicatorName = UUIDs[i].indicatorName;
          var breakdownName = UUIDs[i].breakdownName;
          var elementName = UUIDs[i].elementName;
          var breakdownL2Name = UUIDs[i].breakdownL2Name;
          var elementL2Name = UUIDs[i].elementL2Name;
          var uuid = UUIDs[i].uuid;
          var aggregate = (typeof UUIDs[i].aggregateName != 'undefined') ? (UUIDs[i].aggregateName + ' '): '';

          for (var j = 0; j < reachedThresholdChecks.length; j++) {
              var reachedThresholdCheck = reachedThresholdChecks[j];
              var domainName = reachedThresholdCheck.domain_name;
          	var scoreDate = reachedThresholdCheck.date;
          	var condition = reachedThresholdCheck.condition;
          	var thresholdLevel = reachedThresholdCheck.thresholdLevel;
          	var notificationMessageStart = 'The score for the ';
          	var link = '<a href="https://' + gs.getProperty('instance_name') + '.service-now.com/$pa_detailed.do?jvar_uuid=' + escape(uuid) +'">';
          	var notificationLinkText = aggregate + indicatorName;
  	        if (typeof breakdownName != 'undefined'){
  	        	notificationLinkText += ' for ' + breakdownName + ' ' + elementName;
  	        }
  	        if (typeof breakdownL2Name != 'undefined'){
  	        	notificationLinkText +=  ', ' + breakdownL2Name + ' ' + elementL2Name;
  	        }
  	        if (typeof domainName != 'undefined'){
  	        	notificationLinkText +=  ' - ['  + domainName + ']';
  	        }
  	        var notificationMessageEnd = '</a>';
  	        var notificationMessage;
  	        if (typeof thresholdLevel == 'undefined') {
  	        	notificationMessage = ' had an ' + condition + ' of ' + escape(reachedThresholdCheck.matchingScore) + ' on ' + scoreDate + '.';
  	        } else {
  		        var relativePosition = escape(reachedThresholdCheck.position);
  		        notificationMessage = ' was ' + escape(reachedThresholdCheck.matchingScore) + ' on ' + scoreDate + ', which is ' + relativePosition + ' the threshold of ' + thresholdLevel + '.';
  	        }
  	        template.print('<div>' + escape(notificationMessageStart) + link + escape(notificationLinkText) + notificationMessageEnd + escape(notificationMessage) + '</div>');
          }
          template.print('<br>');
      }
          }
  if (typeof ds_thresholds != 'undefined') {
      for (var i = 0; i < ds_thresholds.length; i++) {
          var reachedThresholdCheck = ds_thresholds[i];
          var scoreDate = reachedThresholdCheck.score_date;
          var indicatorDisplayValue = reachedThresholdCheck.indicator_display_value;
          var indicatorName = reachedThresholdCheck.indicator_name;
          var relativePosition = reachedThresholdCheck.position;
          var processedFilterJson = reachedThresholdCheck.processed_filter;
          var thresholdLevel = reachedThresholdCheck.thresholdLevel;
          var sourceId = reachedThresholdCheck.source_id;
          var condition = reachedThresholdCheck.condition;
          var notificationMessageStart = 'The score for the ';
          var calendarInfoJson = reachedThresholdCheck.calendar_info_json;
          var link = '<a href="' + gs.getProperty('glide.servlet.uri') + 'now/platform-analytics-workspace/ac_kpi_details/' + escape(sourceId) + '/params/calendarInfo/'+ escape(calendarInfoJson) + '/breakdowns/'+ escape(processedFilterJson) + '/list-view/panel/threshold">';
          var notificationLinkText = indicatorDisplayValue;
          var notificationMessageEnd = '</a>';
          var notificationMessage;
          if (typeof thresholdLevel == 'undefined') {
              notificationMessage = ' had an ' + condition + ' of ' + reachedThresholdCheck.score + ' on ' + scoreDate + '.';
          } else {
              notificationMessage = ' was ' + reachedThresholdCheck.score + ' on ' + scoreDate + ', which is ' + relativePosition + ' the threshold of ' + thresholdLevel + '.';
          }
          template.print('<div>' + notificationMessageStart + link + notificationLinkText + notificationMessageEnd + notificationMessage + '</div>');
          template.print('<br>');
      }
  }
  </mail_script>
