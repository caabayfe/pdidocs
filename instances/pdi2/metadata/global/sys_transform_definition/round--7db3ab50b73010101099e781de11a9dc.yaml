description: |-
  <p>A mathematical function that approximates a numeric value based on rounding rules and a digit position. The function rounds up by adding one to the digit to be rounded and then replacing all digits to its right with zeroes. </p>
  <p><b>Input:
  </b></p>
  <p>
    <ul>
      <li><strong>Number</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Number of Digits</strong> - A positive integer specifying the position of the digit to be rounded starting on the left.</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Number</strong> - as the rounded value of the input Number.</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>194</pre>
    Parameter: 
    <pre>2</pre>
    Result:
    <pre>190</pre>
  </p>
  <p>Note: The function uses the digit to the right of the parameter digit to round up or down. If the digit to the right has a value of 0 to 4, the function rounds down. If the digit to the right has a value of 5 to 9, then the function rounds up. If there is no digit to the right, then the function rounds down.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
