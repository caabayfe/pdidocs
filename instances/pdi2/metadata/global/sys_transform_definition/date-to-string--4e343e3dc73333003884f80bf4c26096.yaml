description: |-
  <p>Converts the input Date/Time, Date, or Due Date to a String.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>Date/Time, Date, or Due Date</strong></li>
    </ul>
  </p>
  <p>If the input is a Date or Due Date, the transform creates a full date/time value using time values of hour 0, minute 0, and second 0.</p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Output Date Format</strong> - Date/time or date format of the output String.</li>
      <li><strong>Custom Format</strong> - Valid date/time or date format represented as a String. Required only if Custom Format is selected as the Date Format.</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>String formatted as specified in Output Date Format</strong></li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>1996-01-16 19:56:10</pre>
    Output Date Format:
    <pre>MM/dd/yy</pre>
    Result:
    <pre>"01/16/96"</pre>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>1969-12-31 14:23:57</pre>
    Output Date Format:
    <pre>Custom (enter below)</pre>
    Custom Format:
    <pre>'On' MMM dd, yyyy 'at' hh:mm a</pre>
    Result:
    <pre>"On Dec 31, 1969 at 2:23 PM"</pre>
  </p>
  <p>Note: Runtime Date/Time values are not localized and appear in the UTC (Coordinated Universal Time) time zone.</p>
  <p>Note: If input data type is not Date/Time, Date, or Due Date, the data is not transformed at runtime.</p>
