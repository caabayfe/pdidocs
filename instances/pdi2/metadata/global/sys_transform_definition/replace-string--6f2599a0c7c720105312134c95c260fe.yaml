description: |-
  <p>Returns a Replaced String from the input String based on the provided Regex and Replacement String.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Regex</strong> - Regular expression to be matched for replace</li>
      <li><strong>Replace String</strong> - Replacement String</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>String</strong> - Resulting String after replacement with given inputs</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"Example input string."</pre>
   Regex:
    <pre>\"</pre>
    Replacement string:
    <pre>\\\"</pre>
    Result:
    <pre>\"Example input string.\"</pre>
  </p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
