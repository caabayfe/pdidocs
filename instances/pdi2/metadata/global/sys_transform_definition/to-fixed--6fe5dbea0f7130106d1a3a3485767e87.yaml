description: |-
  <p>Returns a string representation of a floating point number fixed to the number of digits specified</p>
  <p><strong>Input: </strong></p>
  <ul>
  <li><strong>Number</strong></li>
  </ul>
  <p><strong>Parameters:</strong></p>
  <ul>
  <li><strong>Number of Digits</strong> - A positive integer specifying the position of the digit to be precisioned starting on the left.</li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Number</strong> - as the fixed value of the input Number.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>1.93456</pre>
  <p>Parameter:</p>
  <pre>2</pre>
  <p>Result:</p>
  <pre>1.93</pre>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
