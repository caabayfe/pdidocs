description: |-
  <p>A mathematical function that computes a positive number that when multiplied by itself produces the input value. The input value must be a positive real number.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>Number</strong></li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Number</strong> - as the square root of the input number.</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>16</pre>
    Result:
    <pre>4</pre>
  </p>
  <p>Note: If the transform function receives a non-numeric or negative input value, it returns the original input value unchanged.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
