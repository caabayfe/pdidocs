description: |-
  <p>A mathematical function that returns the average value of the elements in the input Array. </p>
  <p><strong>Input:</strong></p>
  <ul>
  <li><strong>Array.Number</strong></li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Number - </strong>As average value in input Array.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>[10, 30, 20]</pre>
  <p>Result:</p>
  <pre>20</pre>
  <p>Note: If the input data type is not Array.Number, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank" rel="noopener">Read More.</a></p>
