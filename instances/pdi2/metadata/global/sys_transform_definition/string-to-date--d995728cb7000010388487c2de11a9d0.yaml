description: |-
  <p>Converts the input String to a Date/Time.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String formatted as specified in Input Date Format</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Input Date Format</strong> -  Date/time or date format of the input String.</li>
      <li><strong>Custom Format</strong> - Valid date/time or date format represented as a String. Required only if Custom Format is selected as the Date Format.</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Date/Time</strong></li>
    </ul>
  </p>
  <p>If the date/time value for the <b>Custom Format</b> is incomplete, the transform creates a full date/time value using default dates and times. The transform defaults to the current year, the current month, day 1 of a month, hour 0, minute 0, and second 0.</p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"1995-11-20"</pre>
    Input Date Format:
    <pre>ISO Date (2004-06-28)</pre>
    Result:
    <pre>1995-11-20 00:00:00</pre>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"On Dec 2019 at 11:59 PM"</pre>
    Input Date Format:
    <pre>"Custom (enter below)"</pre>
    Custom Format:
    <pre>"'On' MMM yyyy 'at' hh:mm a"</pre>
    Result:
    <pre>"2019-10-01 23:59:00"</pre>
  </p>
  <p>Note: Runtime Date/Time values are not localized and appear in the UTC (Coordinated Universal Time) time zone.</p>
  <p>Note: If input data type is not String, the data is not transformed at runtime.</p>
