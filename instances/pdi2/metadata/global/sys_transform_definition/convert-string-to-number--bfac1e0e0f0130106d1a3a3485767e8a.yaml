description: |-
  <p>Converts a string to number.</p>
  <p><strong>Input: </strong></p>
  <ul>
  <li><strong>String</strong></li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Number</strong> - returns a number converted from string.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>"500"</pre>
  <p>Result:</p>
  <pre>500</pre>
  <p>Note: If input data type is not string, the data is not transformed at runtime.</p>
