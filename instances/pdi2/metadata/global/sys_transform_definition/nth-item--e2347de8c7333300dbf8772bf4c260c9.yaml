description: |-
  <p>Returns a Complex Object from the input Array. </p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>Array</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Nth Item</strong> - Index of the target object in the input Array. Array index starts at 0.</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Complex Object</strong> - Nth Item found in the input Array</li>
    </ul>
  </p>
  <p>Note: If input data type is not an array, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Utilities-Transform-Functions" target="_blank">Read More.</a></p>
