description: |-
  <p>A mathematical function that returns the value of the input value raised to the power of a given value.</p>
  <p><b>Input:</b></p>
  <p>
  <ul>
  <li><strong>Number</strong></li>
  </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
  <ul>
  <li><strong>Number</strong> - Exponent of the power.</li>
  </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
  <ul>
  <li><strong>Number</strong> - As the power of input value to the parameter.</li>
  </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
  Input:
  <pre>2</pre>
  Parameter:
  <pre>3</pre>
  Result:
  <pre>8</pre>
  </p>
  <p><b>Note:</b> If the input and parameter data types are not Number, the data is not transformed at runtime. </p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
