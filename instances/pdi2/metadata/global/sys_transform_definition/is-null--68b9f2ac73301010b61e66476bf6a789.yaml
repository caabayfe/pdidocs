description: |-
  <p>A utility function that checks whether the input value is null.</p>
  <p><b>Input:
  </b></p>
  <p>
    <ul>
      <li><strong>Value</strong></li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>True/False</strong></li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>13</pre>
    Result:
    <pre>false</pre>
   Input:
    <pre>null</pre>
    Result:
    <pre>true</pre>
  </p>
  <p>Note: If the input value or complex object is null, the transform returns true. </p>
