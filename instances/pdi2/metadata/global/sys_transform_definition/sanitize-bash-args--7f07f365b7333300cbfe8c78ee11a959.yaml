description: |-
  <p>Returns a String free of any unsafe command injections in your Bash shell script. Wraps the input String with single quotes and escapes any existing single quotes so that you can pass the String directly to a shell function as a safe argument.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Escaped String</strong> - Shell arguments are properly escaped</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"$(echo 127.0.0.1 | sleep 5)"</pre>
    Result:
    <pre>"'$(echo 127.0.0.1 | sleep 5)'"</pre>
  </p>
  <p>Note: If input data type is not String, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Sanitize-Shell-Arguments-Transform-Functions" target="_blank">Read More.</a></p>
