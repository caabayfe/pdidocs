description: |-
  <p>Returns the seconds component of a specific date and time.</p>
  <p><strong>Input:</strong></p>
  <ul>
  <li><strong>Date/Time&nbsp;</strong></li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Integer </strong>- returns seconds component of the specified input.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>"2021-11-20 13:06:12"<br /></pre>
  Result:
  <pre>"12"</pre>
  <p>Note: Runtime Date/Time values are not localized and appear in the UTC (Coordinated Universal Time) time zone.</p>
  <p>Note: If input data type is not Date/Time, the data is not transformed at runtime.&nbsp;</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
