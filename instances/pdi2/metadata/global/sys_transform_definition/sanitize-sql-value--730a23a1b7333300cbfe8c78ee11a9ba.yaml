description: |-
  <p>Returns a String with escaped special characters/injected values for SQL values. Wraps the input String in database-specific quotes.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Database</strong> - The database-specific context in which characters are escaped</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Escaped String</strong> - SQL values properly escaped based on selected Database</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"'Georgi' OR '1'='1'"</pre>
    Result (using MS SQL Database):
    <pre>""'Georgi'' OR ''1''=''1'""</pre>
  </p>
  <p>Note: Don't enclose the input data pill in quotes. The system automatically wraps the input value with the type of quotes or backticks that apply to your database type. If input data type is not String, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Sanitize-SQL-Transform-Functions" target="_blank">Read More.</a></p>
label: Sanitize SQL Value
