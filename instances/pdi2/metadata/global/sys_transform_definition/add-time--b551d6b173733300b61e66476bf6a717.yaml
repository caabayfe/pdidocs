description: |-
  <p>Adds days, hours, minutes, and/or seconds to the input Date/Time, Date, or Due Date.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>Date/Time, Date, or Due Date</strong></li>
    </ul>
  </p>
  <p>If the input is a Date or Due Date, the transform creates a full date/time value using time values of hour 0, minute 0, and second 0.</p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Duration</strong> - Amount of time to add in days, hours, minutes, and seconds</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Date/Time</strong> - Transformed Date/Time after adding the specified Duration</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>2019-09-12 11:00:00</pre>
    Duration (2 Days, 1 Hour, 5 Minutes, 10 seconds):
    <pre>1970-01-03 01:05:10</pre>
    Result:
    <pre>2019-09-14 12:05:10</pre>
  </p>
  <p>Note: If input data type is not Date/Time, Date, or Due Date, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Date-Time-Transform-Functions" target="_blank">Read More.</a></p>
label: Add Time
