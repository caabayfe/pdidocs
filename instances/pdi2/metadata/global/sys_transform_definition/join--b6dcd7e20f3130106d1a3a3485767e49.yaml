description: |-
  <p>Concatenates the given input with the delimiter and returns the concatenated string.</p>
  <p><strong>Input: </strong></p>
  <ul>
  <li><strong>Array</strong></li>
  </ul>
  <p><strong>Parameters:</strong></p>
  <ul>
  <li><strong>Delimiter </strong>- Delimiter to be attached with each given input element.</li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>String</strong> - String joined with delimiter.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>[1, 2, 3]</pre>
  <p>Parameter:</p>
  <pre>&lt;</pre>
  <p>Result:</p>
  <p>1&lt;2&lt;3</p>
  <p>Note: If input data type is not an array.string, array.integer, array.boolean and array.datetime, the data is not transformed at runtime.</p>
  <p>Note: array.object type input is not supported.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
label: Join
