description: |-
  <p>Returns a String with escaped special characters or injected values for SQL identifiers (such as table, view, and column names). Wraps the input String in database-specific quotes.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Database</strong> - The database-specific context in which characters are escaped</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Escaped String</strong> - SQL identifiers properly escaped based on selected Database</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"simple_column"</pre>
    Result (using MySQL Database):
    <pre>"`simple_column`"</pre>
  </p>
  <p>Note: Don't enclose the input data pill in quotes. The system automatically wraps the input value with the type of quotes or backticks that apply to your database type. If your input String contains a period character, Sanitize SQL Identifier returns an error. To join SQL identifiers using a period, use two data pills concatenated with a period and apply Sanitize SQL Identifier to both pills. If input data type is not String, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Sanitize-SQL-Transform-Functions" target="_blank">Read More.</a></p>
label: Sanitize SQL Identifier
