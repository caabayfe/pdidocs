description: |-
  <p>Returns a value associated with a key from a map of Name/Values.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Default</strong> - The default value returned if the provided Key is not found in the map of Name/Values</li>
      <li><strong>Name/Values</strong> - Map of key-value pairs in which to locate the Key input</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>String</strong> - Value associated with matching key</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"3"</pre>
    Default:
    <pre>"Medium"</pre>
    Name/Values:
    <pre>Key: "1" Value: "High"</pre>
  <pre>Key: "2" Value: "Medium"</pre>
  <pre>Key: "3" Value: "Low"</pre>
    Result:
    <pre>"Low"</pre>
  </p>
  <p>Note: If input data type is not String, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Utilities-Transform-Functions" target="_blank">Read More.</a></p>
label: Key Value Map
