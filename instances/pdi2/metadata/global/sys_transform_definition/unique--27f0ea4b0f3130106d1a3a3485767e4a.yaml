description: |-
  <p>Removes duplicate elements from given input array</p>
  <p><strong>Input: </strong></p>
  <ul>
  <li><strong>Array</strong></li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Array</strong> - Unique array.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>[7, 2, 3, 2, 7, 9]</pre>

  <p>Result:</p>
  <pre>[7, 2, 3, 9]</pre>
  <p>Note: If input data type is not an array.string, array.integer, array.boolean or array.datetime, the data is not transformed at runtime.</p>
  <p>Note: array.object type input is not supported.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
