description: |-
  <p>A mathematical function that adds the given value to the input.</p>
  <p><b>Input:</b></p>
  <p>
  <ul>
  <li><strong>Number</strong></li>
  </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
  <ul>
  <li><strong>Number</strong> - Number to be added.</li>
  </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
  <ul>
  <li><strong>Number</strong> - As the addition of the input value by the parameter.</li>
  </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
  Input:
  <pre>12</pre>
  Parameter:
  <pre>4</pre>
  Result:
  <pre>16</pre>
  </p>
  <p>Note: If the input and parameter data types are not Number, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
