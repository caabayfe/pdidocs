description: |-
  <p>Returns a value associated with a key from a map of Name/Values.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>Name/Values</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Default</strong> - The default value returned if the provided Key is not found in the map of Name/Values</li>
      <li><strong>Key</strong> - Name of the key used to look up its corresponding value</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>String</strong> - Value associated with matching key</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>Key: "name"</pre>
    <pre>Value: "Abe"</pre>
    Default:
    <pre>"Fred"</pre>
    Key:
    <pre>"name"</pre>
    Result:
    <pre>"Abe"</pre>
  </p>
  <p>Note: If input data type is not Name/Values or Name-Value Pairs, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Utilities-Transform-Functions" target="_blank">Read More.</a></p>
label: Get item from Name/Values
name: value_map
suggested_types: name_values,simple_name_values
sys_name: value_map
