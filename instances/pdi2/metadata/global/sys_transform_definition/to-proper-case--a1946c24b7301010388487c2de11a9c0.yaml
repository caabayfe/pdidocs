description: |-
  <p> Changes the case of words in the input string. Capitalizes the first letter of each word, and makes every other letter in the word lower case. A word is considered any string separated by a space, hyphen, backslash, or forward slash character. The transform function always evaluates words from left-to-right to determine the first letter.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>String in proper case</strong></li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"exAMPle-input string/TEXT"</pre>
    Result:
    <pre>"Example-Input String/Text"</pre>
  </p>
  <p>Note: If input data type is not String, the transformation is ignored.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
