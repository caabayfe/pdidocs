description: |-
  <p>Returns the week of the year that a specific date falls on.</p>
  <p><strong>Input:</strong></p>
  <ul>
  <li><strong>Date/Time</strong></li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Integer </strong>- returns week component of the specified input.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>"2021-04-07 12:01:12"</pre>
  <p>Result:</p>
  <pre>"15"</pre>
  <p>Note: Runtime Date/Time values are not localized and appear in the UTC (Coordinated Universal Time) time zone.</p>
  <p>Note: If input data type is not Date/Time, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
