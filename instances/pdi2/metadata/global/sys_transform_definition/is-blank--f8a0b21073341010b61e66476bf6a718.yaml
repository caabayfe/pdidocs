description: |-
  <p>A utility function that checks whether the input value is blank. The function supports Integers, Double, Boolean, Complex Objects and String.</p>
  <p><b>Input:
  </b></p>
  <p>
    <ul>
      <li><strong>Pills or values of above mentioned Types</strong></li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>True/False</strong></li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>13</pre>
    Result:
    <pre>false</pre>
   Input:
    <pre>false</pre>
    Result:
    <pre>true</pre>
   Input:
    <pre>"abc"</pre>
    Result:
    <pre>false</pre>
   Input:
    <pre>"0"</pre>
    Result:
    <pre>true</pre>

  </p>
  <p>Note: For Integer and Double values which are not 0, the transform returns false. <br>
  For strings that are empty or "0”, the transform returns true. <br>
  For Complex objects and arrays that do not have a value, the transform returns true. <br>
  For false boolean values, the transform returns true.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
