description: |-
  <p>Returns a substring from the input String based on the provided Start Index and End Index.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Start Index</strong> - Index of the first character to include in the returned substring</li>
      <li><strong>End Index</strong> - Index of the last character to include in the returned substring</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>String</strong> - Transformed String as substring of input String</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"Example input string."</pre>
    Start Index:
    <pre>3</pre>
    End Index:
    <pre>6</pre>
    Result:
    <pre>"mpl"</pre>
  </p>
  <p>Note: Input String index starts at 0. If End Index is not provided, Start Index character and remainder of input String is returned. If input data type is not String, the data is not transformed at runtime. If the Start Index value is longer than the string's length, then the transform function returns the input string. This behavior is different from the JavaScript substring() method, which instead returns an empty string.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
