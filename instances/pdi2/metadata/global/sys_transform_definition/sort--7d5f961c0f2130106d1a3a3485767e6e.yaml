description: |-
  <p>Returns sorted array, sorted in ascending or descending order.</p>
  <p><strong>Input: </strong></p>
  <ul>
  <li><strong>Array</strong></li>
  </ul>
  <p><strong>Parameter:</strong></p>
  <ul>
  <li><strong>Sort Order - </strong>Ascending or Descending order to sort the array.</li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Array</strong> - Sorted array.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>[7, 2, 3, 1, 7, 9]</pre>
  <p>Result:</p>
  <pre>[1, 2, 3, 7, 7, 9]</pre>
  <p>Note: If input data type is not an array.string, array.integer, array.boolean or array.datetime, the data is not transformed at runtime.</p>
  <p>Note: array.object type input is not supported. Sort is case sensitive for array.strings</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
