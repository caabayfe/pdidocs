description: |-
  <p>Return a duration of time between the input date and the parameter date time.</p>
  <p><strong>Input:</strong></p>
  <ul>
  <li><strong>DateTime/DueDate/Date</strong></li>
  </ul>
  <p><strong>Parameter:</strong></p>
  <ul>
  <li><strong>Date Time: </strong>Date/Time, Due Date or Date to calculate difference between the given input.</li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Duration</strong>- Returns the duration of time added to epoch time (1970-01-01) in Date/Time format, representing the difference between two input dates.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>"2021-05-02 09:10:12"</pre>
  <p>Parameter:</p>
  <pre>"2021-04-07 06:02:23"</pre>
  <p>Result:</p>
  <pre>1970-01-26 03:07:49</pre>
  <p>Note: If input data type is not Date, Date/Time and Due Date, the data is not transformed at runtime.;</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
