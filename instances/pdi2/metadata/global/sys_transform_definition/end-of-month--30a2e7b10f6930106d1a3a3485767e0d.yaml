description: |-
  <p>Returns a date representing the last day of a month which falls a specified number of months before or after specified date.</p>
  <p><strong>Input:</strong></p>
  <ul>
  <li><strong>Date</strong></li>
  </ul>
  <p><strong>Parameter:</strong></p>
  <ul>
  <li><strong>Number of Months: </strong>Number of months to be added to specified date.</li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Integer </strong>- Returns a date representing the last day of a month which falls a specified number of months before or after specified date.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>"2021-11-20"</pre>
  <p>Parameter:</p>
  <pre>"3"</pre>
  <p>Result:</p>
  <pre>"2022-02-28"</pre>
  <p>Note: Runtime Date/Time values are not localized and appear in the UTC (Coordinated Universal Time) time zone.</p>
  <p>Note: If input data type is not Date, the data is not transformed at runtime.&nbsp;</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
