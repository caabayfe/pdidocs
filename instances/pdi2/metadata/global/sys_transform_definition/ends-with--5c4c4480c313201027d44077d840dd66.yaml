description: |-
  <p>A utility function that checks whether the input value ends with a sequence of characters. </p>
  <p><strong>Input:</strong></p>
  <ul>
  <li><strong>String</strong></li>
  </ul>
  <p><strong>Parameters:</strong></p>
  <ul>
  <li><strong>String</strong> - The characters to be searched for.</li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Boolean</strong> - A boolean, indicating whether a sequence of characters exist in the specified string.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>"Cheese Pizza"</pre>
  <p>String:</p>
  <pre>"Pizza"</pre>
  <p>Result:</p>
  <pre>true</pre>
  <p><span style="font-family: Verdana, Arial, Helvetica, sans-serif;">Note: If the input data type is not String, the data is not transformed at runtime.</span></p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
