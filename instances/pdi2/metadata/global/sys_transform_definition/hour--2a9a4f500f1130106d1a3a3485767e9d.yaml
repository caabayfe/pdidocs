description: |-
  <p><!-- x-tinymce/html-mce_95592433521626244799854 -->Returns the hour component of a specific date and time.</p>
  <p><strong>Input:</strong></p>
  <ul>
  <li><strong>Date/Time&nbsp;</strong></li>
  </ul>
  <p><strong>Output:</strong></p>
  <ul>
  <li><strong>Integer </strong>- returns hour component of the specified input.</li>
  </ul>
  <p><strong>Example:</strong></p>
  <p>Input:</p>
  <pre>"2021-11-20 13:06:12"<br /></pre>
  Result:
  <pre>"13"</pre>
  <p>Note: Runtime values are not localized and appear in the UTC (Coordinated Universal Time) time zone.&nbsp;</p>
  <p>Note: If input data type is not Date/Time, the data is not transformed at runtime.&nbsp;</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
