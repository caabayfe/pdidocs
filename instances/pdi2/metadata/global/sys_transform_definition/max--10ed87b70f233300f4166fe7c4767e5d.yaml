description: |-
  <p>Returns the highest value found in the input Array.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>Array.Number</strong></li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Number as highest value in input Array</strong></li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>[1, -5, 20, 6]</pre>
    Result:
    <pre>20</pre>
  </p>
  <p>Note: If input data type is not Array.Number, the data is not transformed at runtime.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
