description: |-
  <p>A mathematical function that returns the distance from zero for any real number. An absolute value is always a positive or zero value.</p>
  <p><b>Input:
  </b></p>
  <p>
    <ul>
      <li><strong>Number</strong></li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Number</strong> - as the absolute value of the result of the input number.</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>-3</pre>
    Result:
    <pre>3</pre>
  </p>
  <p>Note: If the transform function receives a non-numeric input value, it returns the original input value unchanged.</p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:Math-Transform-Functions" target="_blank">Read More.</a></p>
