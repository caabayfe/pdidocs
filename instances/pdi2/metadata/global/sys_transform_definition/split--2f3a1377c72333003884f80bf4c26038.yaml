description: |-
  <p>Returns an Array.String based on a provided Separator that splits the input String.</p>
  <p><b>Input:</b></p>
  <p>
    <ul>
      <li><strong>String</strong></li>
    </ul>
  </p>
  <p><b>Parameters:</b></p>
  <p>
    <ul>
      <li><strong>Separator</strong> - A delimiter that specifies where the input String should be split. If left blank, the input String is not transformed at runtime.</li>
    </ul>
  </p>
  <p><b>Output:</b></p>
  <p>
    <ul>
      <li><strong>Array.String</strong> - An array of substrings from the input String</li>
    </ul>
  </p>
  <p><b>Example:</b></p>
  <p>
    Input:
    <pre>"Example,input,string."</pre>
    Separator:
    <pre>","</pre>
    Result:
    <pre>[ "Example", "input", "string." ]</pre>
  </p>
  <p>Note: If input data type is not String, the data is not transformed at runtime. </p>
  <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
label: Split
