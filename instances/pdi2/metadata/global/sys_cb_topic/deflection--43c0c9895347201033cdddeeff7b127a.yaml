            "name": "Deflection tracking script",
            "script": "(function execute() {\n    // Check if VA Deflection tracking is enabled\n    var enableVaDfTracking = gs.getProperty(\"com.glide.cs.va.deflection_tracking.enable\",\"false\");\n    if (enableVaDfTracking !== \"true\") \n        return;\n\n    try {\n        var metricInfo = {\n            config_id: new String(vaInputs.deflection_configuration),\n            pattern_id: new String(vaInputs.deflection_pattern),\n            conversation_task_id: vaVars._topic_calling_task\n        };\n\n        var activitiesInfo = {\n            activity_table: new String(vaInputs.activity_table),\n            activity_ids: new String(vaInputs.activity_ids), // comma separated sys_ids\n        };\n\n        // \"va.deflection_metric.insert\" event script action handles metric inserts\n        gs.eventQueue(\n            \"va.deflection_metric.insert\",\n            null,\n            JSON.stringify(metricInfo),\n            JSON.stringify(activitiesInfo)\n        );\n    } catch (e) {\n        gs.warn(\"VA Deflection: Metric-event insert failed \" + e);\n    }\n})();\n",
