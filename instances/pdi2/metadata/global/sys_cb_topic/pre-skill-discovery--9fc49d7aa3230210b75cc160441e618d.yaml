          "f644255fd68a4fafa1bfcc5033e33055": {
            "id": "f644255fd68a4fafa1bfcc5033e33055",
            "name": "set experience",
            "script": "(function execute() {\n    \n  vaVars.experience = '';\n\n  var portal = vaContext.portal;\n  if (portal) {\n      var portalGr = new GlideRecord('sp_portal');\n      portalGr.addQuery('url_suffix', portal);\n      portalGr.setLimit(1);\n      portalGr.query();\n  \n      if (portalGr.next()) {\n          var documentId = portalGr.getUniqueValue();\n\n          var channelGr = new GlideRecord('sys_now_assist_deployment_channel');\n          channelGr.addQuery('document_table', 'sp_portal');\n          channelGr.addQuery('document_id', documentId);\n          channelGr.addActiveQuery();\n          channelGr.setLimit(1);\n          channelGr.query();\n  \n          if (channelGr.next()) {\n              vaVars.experience = channelGr.getValue('experience') || '';\n          }\n      }\n  }\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
