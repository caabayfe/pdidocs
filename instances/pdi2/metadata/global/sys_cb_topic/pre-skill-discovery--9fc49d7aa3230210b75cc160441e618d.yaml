                "promptMessage": {
                  "value": "(function execute() {\n    var language = 'English';\n    var languageGR = new GlideRecord('sys_language');\n    if (languageGR.isValid()) {\n      languageGR.addQuery('id', vaVars.global_runtime_detected_language);\n      languageGR.query();\n    \n      if(languageGR.next()) {\n          language = languageGR.getValue('name');\n      }\n    }\n\n    var detectedLanguageCode = vaVars.global_runtime_detected_language;\n    var requesterLanguage = gs.getMessageLang(language, vaContext.getRequesterLang());\n    var translatedLanguage = gs.getMessageLang(language, detectedLanguageCode);\n\n    return 'LangSwitchConfirmationMessage:' + gs.getMessageLang('I have detected you are typing in {0}. Would you like to continue the conversation in {0}?', vaContext.getRequesterLang(), requesterLanguage) + '\\n\\n' +\n        gs.getMessageLang('I have detected you are typing in {0}. Would you like to continue the conversation in {0}?', detectedLanguageCode, translatedLanguage);\n})()\n",
