            "script": "(function execute() {\n    var maximumDurationToPause = vaInputs.seconds.getValue();\n    var timeout = gs.getProperty('com.glide.cs.fdih.interactive.timeout') || 60;\n    \n    // need parseInt because input seconds is of type String\n    if (isNaN(maximumDurationToPause) || parseInt(maximumDurationToPause) > timeout) {\n        maximumDurationToPause = timeout;\n    }\n    vaVars.maximum_duration_to_pause = maximumDurationToPause;\n})()\n",
