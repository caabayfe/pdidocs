            "skippable": {
              "mode": "script",
              "value": "(function execute() {\n    var question = JSON.parse(vaVars.itemJSON).variables[vaVars.qIndex];\n    if (question.mandatory)\n        return false;\n    if (question.type === 4 && question.value === '')\n        return true;\n    if (question.type === 3 && question.value === '' && question.options[0].value !== '')\n        return true;\n    return false;\n})();\n"
