          "717d9e4d03b048c3963ad44c30ecee0b": {
            "id": "717d9e4d03b048c3963ad44c30ecee0b",
            "name": "Invoke Resolution Topic",
            "script": "(function execute() {\n    var context = contextHelper.getContextDetails(vaVars.auto_resolution_context_id);\n    var logUtils = new global.AutoResolutionLoggingUtils()    \n                       .withName('topic')\n                       .withContextId(vaVars.auto_resolution_context_id)\n                       .withTaskValues(vaVars.task_id, vaVars.task_table)\n                       .withLanguage(context.language)\n                       .withConfiguration(context.configId)\n                       .withTopic(vaVars.topic_id);\n    vaVars.loggingContext = JSON.stringify(logUtils.CONTEXT);\n    var logger = logUtils.createLogger();\n    var contextHelper = new global.AutoResolutionContextHelper();\n    contextHelper.updateNotificationResponded(vaVars.auto_resolution_context_id, 'accepted');\n    logger.debug('Marking context={0} as accepted', vaVars.auto_resolution_context_id);\n\n    logger.info('User accepted the Auto-Resolution topic. Swtiching to topic={0}', vaVars.topic_id);\n    vaSystem.switchTopicById(vaVars.topic_id);\n    vaSystem.switchTopicById(vaVars.topic_id);\n})()\n",
