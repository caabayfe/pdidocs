            "name": "Mark Task Resolved",
            "script": "(function execute() {\n\n    var helper = new global.AutoResolutionContextHelper();\n    helper.executeTemplate(helper.RESOLVED, vaVars.auto_resolution_context_id, vaVars.loggingContext);\n\n    var logger = new global.AutoResolutionLoggingUtils()\n                        .withName('topic')\n                        .withContext(vaVars.loggingContext)\n                        .createLogger();\n    logger.info('User decided to mark the task={0} as resolved', vaVars.task_id);\n    \n})()\n",
