          "441b4d33a3604280a4133889dbc973eb": {
            "id": "441b4d33a3604280a4133889dbc973eb",
            "name": "Validation",
            "script": "(function execute() {\n    \n    var notificationContext = JSON.parse(vaVars.global_notification_context);\n    vaVars.auto_resolution_context_id = notificationContext.tableSysId;\n    vaVars.action_sys_id = notificationContext.actionId;\n    interactionId = vaSystem.getInteractionSysId();\n\n    var contextHelper = new global.AutoResolutionContextHelper();\n    var context = contextHelper.getContextDetails(vaVars.auto_resolution_context_id);\n    contextHelper.setInteraction(vaVars.auto_resolution_context_id, interactionId);\n    new global.AutoResolutionTaskHelper().associateTaskToInteraction(context.taskTable, context.taskId, interactionId);\n    \n    vaVars.topic_id = context.topicId;\n    vaVars.task_id = context.taskId;\n    vaVars.task_table = context.taskTable;\n    vaVars.is_valid = context.isValid;\n    vaVars.validation_reason = context.validationReason;\n    vaVars.is_notification_expired = context.validationReason == 'Notification expired';\n    vaVars.is_notification_accepted = context.validationReason == 'Notification accepted';\n\n    var logUtils = new global.AutoResolutionLoggingUtils()\n                        .withName('topic')\n                        .withContextId(vaVars.auto_resolution_context_id)\n                        .withTaskValues(vaVars.task_id, vaVars.task_table)\n                        .withLanguage(context.language)\n                        .withConfiguration(context.configId)\n                        .withTopic(vaVars.topic_id);\n    vaVars.loggingContext = JSON.stringify(logUtils.CONTEXT);\n    var logger = logUtils.createLogger();\n    logger.info('Starting Auto-Resoluton Topic');\n    \n     //!!!!!IMPORTANT: DO NOT CHANGE THIS VALUE!!!!!\n    vaVars.is_iar_wrapper_topic = true;\n})()\n",
            "stepType": "ScriptAction",
            "applicability": {
              "value": "",
              "mode": "query"
            }
          },
