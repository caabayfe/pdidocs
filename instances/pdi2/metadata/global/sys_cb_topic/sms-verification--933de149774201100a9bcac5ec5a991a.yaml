            "script": "(function execute() {\n    var providerAppId = vaContext.providerAppId;\n    if (!gs.nil(providerAppId)) {\n        var providerApp = JSON.parse(sn_cs.VASystemObject.getProviderAppById(vaContext.providerAppId));\n        vaVars.providerId = providerApp.providerId;\n        vaVars.inboundId = providerApp.inboundId;\n    }\n    \n})()\n",
