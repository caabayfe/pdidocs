            "id": "46189bef2e1b4c788b856439fb0beb02",
            "stepType": "Prompt",
            "name": "Enter Verification Code",
            "prompt": {
              "value": "(function execute() {\n    --vaVars.remaining_attempts;\n    var message =  gs.getMessageLang(\"Enter the code you have received over SMS\", vaContext.getRequesterLang());\n    var custom_message = '';\n    if (!gs.nil(vaVars.inboundId))\n        custom_message = sn_cs.VASystemObject.getBotMessage(\"sms_enter_code_msg\", vaVars.inboundId, vaVars.providerId);\n    \n    message = gs.nil(custom_message) ? message : gs.getMessageLang(custom_message, vaContext.getRequesterLang());\n        \n    return message;\n})()\n\n\n",
              "mode": "script"
            },
