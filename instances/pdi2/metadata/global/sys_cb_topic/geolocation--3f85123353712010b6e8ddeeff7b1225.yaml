          "94c8d0930dfd4e47be7df0e7f4aa5967": {
            "id": "94c8d0930dfd4e47be7df0e7f4aa5967",
            "name": "Record output",
            "script": "/*\nThe Geolocation API\nstatus: ‘OK’ if location coordinates were fetched successfully, ‘ERROR` otherwise.\nlatitude, longitude: the geolocation coordinates\nisGeoPermissionGrantedForNextUse: determines if the user has granted geolocation permission to fetch location coordinates if requested again during the conversation.\n  true: do not display permission prompt since the user has granted permission on their device\n  false: display permission prompt since the user either “denied permission” or used “allow once”\nerrorMessage: message associated with the error (optional)\nerrortype:\n    PERMISSION_DENIED\n    POSITION_UNAVAILABLE\n    TIMED_OUT\n    UNKOWN_ERROR\n*/\n(function execute() {\n\tif (vaInputs.share_location_ == 'false') {\n\t\t//set the appropriate error response if the user denied permission to access location\n\t\tvaVars.status = \"ERROR\";\n\t\tvaVars.errorType = \"PERMISSION_DENIED\";\n\t\tvaVars.global_is_geolocation_permission_granted = false;\n\t\treturn;\n\t}\n\n\tif (vaInputs.georesponse) {\n\t\tconst geolocationResponseObj = JSON.parse(vaInputs.georesponse);\n\t\tvaVars.status = geolocationResponseObj.status;\n\t\tif (geolocationResponseObj.status == 'OK') {\n\t\t\tvaVars.latitude = geolocationResponseObj.latitude;\n\t\t\tvaVars.longitude = geolocationResponseObj.longitude;\n\t\t} else {\n\t\t\tvaVars.errorType = geolocationResponseObj.errorType;\n\t\t\tif (geolocationResponseObj.hasOwnProperty('errorMessage')) {\n\t\t\t\tvaVars.errorMessage = geolocationResponseObj.errorMessage;\n\t\t\t}\n\t\t}\n\n\t\tif (geolocationResponseObj.hasOwnProperty('isGeoPermissionGrantedForNextUse')) {\n\t\t\tvaVars.global_is_geolocation_permission_granted = geolocationResponseObj.isGeoPermissionGrantedForNextUse;\n\t\t}\n\t}\n\n})()",
            "stepType": "ScriptAction",
            "applicability": {
              "mode": "query",
              "value": ""
            }
          }
