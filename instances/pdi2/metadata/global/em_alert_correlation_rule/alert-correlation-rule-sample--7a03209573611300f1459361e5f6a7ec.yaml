description: |-
  Demonstrates correlation of alerts that:
  1. Answers the defined filter: The value in source field contains the string "sample" for incoming alerts.
  2. The "metric_name" field of each alert has the exact same value ("metric_name" - configured as desired).
  3. There is a time difference of 60 minutes or less from the first alert and all other alerts (60 minutes is set by default).

  NOTICE: THIS ADVANCED RULE IS NON-ACTIVE BY DEFAULT. YOU MUST ACTIVATE THE RULE IN ORDER TO WATCH IT WORK.
