description: Dates and times tied to EVENTS or PROCEEDINGS — case dates, investigation dates, transaction dates, operational timestamps, hearing dates, filing dates, report dates, deadlines, durations, and quantitative findings tied to proceedings or investigations. Use for EVENT dates and times. Personal dates such as DOB and hire date always use b(6) not b(7)(A).
