code: FOIA b(6)
description: Everything tied to a SPECIFIC PERSON — names, addresses, email, phone, IP addresses, SSN, passport, visa codes, date of birth, personal dates, any ID number assigned to an individual (employee ID, patient ID, student ID, badge number, license number, membership number), medical info, diagnosis codes, prescription IDs, insurance policy numbers, biometric values, genetic data, HR details, device IDs tied to an individual. Use b(6) whenever a value identifies or describes a specific human being.
