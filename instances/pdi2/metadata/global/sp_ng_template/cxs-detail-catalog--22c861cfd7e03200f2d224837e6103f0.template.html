<!-- Catalog Item record -->
<div class="cxs-detail-container" ng-init="getRecord()">
  <div class="row col-md-12">
    <div ng-if="cxs.display.result.image.link" class="col-md-3">
      <img title="{{cxs.display.result_detail.name}}" src="{{cxs.display.result.image.link}}" class="cxs-record-image" />
    </div>
    <div ng-class="['cxs-record-content',{'col-md-9': cxs.display.result.image.link, 'col-md-12': !cxs.display.result.image.link}]">
      <div class="cxs-record-short-description row">
        <h2>{{cxs.display.result_detail.name}}</h2>
      </div>
      <div class="cxs-record-content row">
        {{cxs.display.result_detail.short_description}}
      </div>
      <div class="cxs-record-content row">
        <span class="article-content" ng-bind-html="cxsTrust(cxs.display.result_detail.description)"></span>
      </div>
      <div ng-if="cxs.display.result.link_target" class="cxs-record-content row">
        <a ng-href="{{cxs.display.result.link}}" target="_blank">{{c.data.i18nMsgs.clickHere}} </a>
      </div>
    </div>
  </div>
</div>
