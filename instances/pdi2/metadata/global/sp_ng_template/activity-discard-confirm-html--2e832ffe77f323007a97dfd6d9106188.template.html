<div class="module-change-confirm"
       role="alertdialog"
       aria-modal="true"
       aria-labelledby="modal-title"
       aria-describedby="modal-body">
  <div class="modal-header ng-scope">
    <button type="button" class="close" data-ng-click="cancel()" aria-label="${Close}" autofocus>
      <i class="fa fa-close"></i>
    </button>
    <h4 class="modal-title ng-binding" id="modal-title">${Confirm Action}</h4>
  </div>
  <div class="modal-body ng-scope" id="modal-body">
    <p class="cm-confirm-text font-normal ng-binding">${You have not saved your changed preferences. Are you sure you want to discard the changes?}</p>
    <div class="btn-container clear">
      <div class="action-btn pull-right">
        <button class="btn btn-default" type="button" data-ng-click="cancel()">${No}</button>
        <button class="btn btn-primary" type="button" data-ng-click="confirm()">${Yes}</button>
      </div>
    </div>
  </div>
</div>
<style>
  .module-change-confirm .modal-body, .modal-header {
    padding: 2rem;
  }
  .module-change-confirm .modal-header .modal-title {
    line-height: 2.1rem;
    font-weight: normal;
    width: calc(100% - 5rem);
    display: inline-flex;
    margin-top: 0.4rem;
  }
  .module-change-confirm .modal-body .btn-container{
    overflow: hidden;
    padding-top: 1.5rem;
  }
  .module-change-confirm .modal-body .btn-container button {
    line-height: 1.5rem;
    padding: 1rem 1.8rem;
  }
  .module-change-confirm .modal-body .btn-container button:not(:last-of-type){
    margin-right: 1rem;
  }
</style>
