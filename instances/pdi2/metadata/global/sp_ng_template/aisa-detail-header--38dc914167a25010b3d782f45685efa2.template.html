<div class="aisa-detail-header row col-md-12">
  <div class="col-xs-4 text-left aisa-button-bar">
    <button type="button" id="aisa_back_to_results" class="btn btn-icon" ng-click="backToResults()" title="${Back}" aria-label="${Navigates back to search results}">
      <i class="fa aisa-ec-chevron fa-chevron-left"></i>&nbsp;&nbsp;${Back}
    </button>
  </div>
  <div class="col-xs-8 text-right aisa-button-bar">
    <button ng-repeat="action in actionMap[detailResult.table+':'+detailResult.sysId] | filter: {isDetailAction: true}" ng-click="execAction(action, detailResult, detailResultIndex)" class="btn btn-icon aisa-ua-detail aisa-ua-wide">
      <span class="aisa-ua-detail-label">{{action.actionLabel}}</span>
    </button>
    <button class="btn btn-icon aisa-preview-button" ng-click="detailResultNext()" ng-disabled="!detailResultHasNext()" data-toggle="tooltip" data-placement="bottom" alt="${Next result}" title="${Next result}" aria-label="${Displays next search result content}">
      <i class="icon-arrow-down"></i>
    </button>
    <button class="btn btn-icon aisa-preview-button" ng-click="detailResultPrev()" ng-disabled="!detailResultHasPrev()" data-toggle="tooltip" data-placement="bottom" alt="${Previous result}" title="${Previous result}" aria-label="${Displays previous search result content}">
      <i class="icon-arrow-up"></i>
    </button>
  </div>
  <div class="col-xs-12 text-right aisa-button-bar aisa-button-bar-narrow">
    <button ng-repeat="action in actionMap[detailResult.table+':'+detailResult.sysId] | filter: {isDetailAction: true}" ng-click="execAction(action, detailResult, detailResultIndex)" class="btn btn-icon aisa-ua-detail">
      <span class="aisa-ua-detail-label">{{action.actionLabel}}</span>
    </button>
  </div>
</div>
