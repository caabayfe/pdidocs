<div class="col-xs-8 col-md-10 cm-sub-name">
  <div class="col-xs-8 col-md-1 cm-sub-name"  data-ng-if="sub.image != null">
    <a ng-href="{{sub.image.profileLink == null ? c.getPageUrl(sub):sub.image.profileLink}}" aria-label="{{sub.image.userName}}">
      <div class="user-avatar" aria-hidden="true">             	
        <span class="image50px">
          <sn-avatar primary="sub.image" show-presence="false"/>
        </span>
      </div>
    </a>
  </div>
  <div class="cm-sub-name">
    <h3 class="cm-weight-normal m-t-none">
      <a data-ng-href="{{sub.image.profileLink == null ? c.getPageUrl(sub):sub.image.profileLink}}" 
         class="">{{c.getProcessedDisplaySubName(sub)}}</a></h3>
  </div>
</div>
<div class="col-xs-4 col-md-2 cm-align-end cm-subscribe-btn">
  <button id="{{::sub.type}}_subscribe-focus{{$index}}-{{sub.sub_obj_id}}" 
          class="cm-subscribe-hover transparent-button" 
          aria-label="{{::(c.formatMessage(c.data.msg.unsubscribe, [c.getProcessedDisplaySubName(sub)]))}}" 
          data-ng-click="c.doSubscribe('DELETE', sub, $index)" 
          data-ng-if="!sub.unsubscribed">
    <i class="fa fa-check-circle" aria-hidden="true"></i>
    <span class="hidden-xs">
      <span class="cm-show-me">${Subscribed}</span>
      <span class="cm-hide-me">${Unsubscribe}</span>
    </span>
  </button>
  <button id="{{::sub.type}}_unsubscribe-focus{{$index}}-{{sub.sub_obj_id}}"
          class="transparent-button"
          aria-label="{{::(c.formatMessage(c.data.msg.subscribe, [c.getProcessedDisplaySubName(sub)]))}}"
          data-ng-click="c.doSubscribe('POST', sub, $index)" 
          data-ng-if="sub.unsubscribed">
    <i class="fa fa-circle-o" aria-hidden="true"></i>
    <span class="hidden-xs">${Subscribe}</span>
  </button>
</div>
<div class="col-xs-12 col-md-10 cm-sub-desc">{{sub.description}}</div>
