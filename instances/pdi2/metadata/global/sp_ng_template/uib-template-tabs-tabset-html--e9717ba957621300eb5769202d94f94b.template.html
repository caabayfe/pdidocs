<div>
  <div class="cab-tabset-container">
  <ul class="nav nav-{{type || 'tabs'}} grow" ng-class="{'nav-stacked': vertical, 'nav-justified': justified}" ng-transclude></ul>
  <div class="nav nav-{{type || 'tabs'}}" ng-class="{'nav-stacked': vertical, 'nav-justified': justified}"><button class="btn btn-default btn-sm form-modal-icon edit-button" ng-click="$parent.formModel.cab.onEdit()" tabindex="0"><i class="icon-edit"></i><span class="sr-only">${Open Change record for editing}</span></button></div>
  </div>
  <div class="tab-content">
    <div class="tab-pane" 
         ng-repeat="tab in tabs" 
         ng-class="{active: tab.active}"
         uib-tab-content-transclude="tab">
    </div>
  </div>
</div>
