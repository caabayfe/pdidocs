<div class="aisa-result-container" id="{{result.sysId}}">
	<div class="row col-md-12">
		<div class="col-md-1 aisa-result-icon">
			<i class="fa fa-shopping-cart push" aria-hidden="true"></i>
		</div>
		<div class="col-md-11">
			<div class="aisa-result-title">
				<a ng-click="displayDetail($index, $event)" href="{{getSpLink(result)}}">
          <span class="aisa-result-icon"><i class="fa fa-shopping-cart" aria-hidden="true"></i></span>
          <span>{{getResultField(result, 'name').displayValue}}</span>
        </a>
			</div>
			<div class="aisa-result-snippet">
				<span ng-bind-html="result.text"></span>
			</div>
          	<div class="aisa-ua-action-bar">
				<span class="aisa-ua-button-spacing" ng-repeat="action in actionMap['sc_cat_item:'+result.sysId] | filter: { isCardAction: true }">
					<button class="btn btn-default aisa-ua-button" ng-click="execAction(action, result, $index)">{{action.actionLabel}}</button>
				</span>
          	</div>
		</div>
	</div>
</div>
