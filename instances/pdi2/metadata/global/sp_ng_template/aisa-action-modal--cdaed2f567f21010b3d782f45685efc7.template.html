<div aria-labelledby="aisaActionModalLabel" aria-modal="true" id="aisaActionModal" role="dialog" sn-modal-accessibility-focus="">
  <div class="modal-header">
    <button focus-this-element="true" aria-label="${'Close modal}" class="btn btn-icon close icon-cross pull-right" ng-click="cancel()"/>
    <h3 class="modal-title" id="aisaActionModalLabel">{{actionModal.title}}</h3>
  </div>
  <div class="modal-body">
    <ng-include src="actionModal.bodyTemplate" />
  </div>
  <div class="modal-footer">
    <button class="btn btn-default" ng-click="cancel()" sn-last-pseudo-element-in-modal="">{{actionModal.cancelText}}</button>
    <button class="btn btn-primary" ng-click="ok()" sn-last-pseudo-element-in-modal="">{{actionModal.submitText}}</button>
  </div>
</div>
