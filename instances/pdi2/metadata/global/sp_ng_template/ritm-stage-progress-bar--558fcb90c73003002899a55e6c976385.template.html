<div class="m-n flex-item">
  <div aria-valuenow="{{data.percentComplete}}" aria-valuemin="0" aria-valuemax="100" role="progressbar" aria-label="{{::data.current_stage_msg}}">
    {{::data.display_value}}
  </div>
</div>
<table id="workflow.progress" border="1" cellpadding="0" cellspacing="0"
       style="width:100%; margin-top: 2px; background-color: transparent;" role="presentation">
  <tr ng-if="showValue">
    <td colspan="data.choiceList.length" style="width:100%; font-size:10px; border:none; text-align:center; background: #000066 url('progress_pctnotdone.gifx') repeat-x;">
      {{data.showValue==='true' ? data.percentComplete+'%' : ' '}}
    </td>
  </tr>
  <tr id="progress" role="list" aria-label="{{data.approval_stages_msg}}">
    <td role="listitem" ng-repeat="stage in data.choiceList" ng-if="stage.isVisible" nowrap="true" style="width:{{data.increment}}%; border-left:none; border-top:none; border-bottom:none; border-right: 1px solid white;  background: #000066 url('{{stage.image}}') repeat-x; line-height: 2;">
    &nbsp;<span class="sr-only">{{stage.title + '(' + stage.state + ')'}}</span>
    </td>
  </tr>
</table>
