<div class="panel" id="small-wishlist">
  <div class="panel-body" ng-if="c.data.cartItems.length > 0">
    <ul class="media-list" ng-if="c.data.cartItems.length > 0" role="menu">
      <li class="media" ng-repeat="item in c.data.cartItems | orderBy: orderByDate :-1 track by item.sys_id" role="presentation">
        <div class="sc-wishlist-cart-body">
          <a ng-href="{{::item.item_url}}" ng-class="::{'a-disabled': !item.can_order}"  aria-label="{{::item.name}}" ng-keydown="c.onKeyDown($event)" role="menuitem">
            <div class="sn-flexbox">
              <div class="sc-cart-item-img">
              	<img ng-show="item.picture" ng-src="{{::item.picture}}" alt="" class="img-responsive item-image m-r-md"/>
              </div>
          	<div>
            	<div class="catalog-text-wrap">{{::item.name}}</div>
          		<p class="sc-wishlist-text catalog-text-wrap">{{::item.short_description}}</p>
          </div>
            </div>
         </a>
        <div class="btn-group btn-group-sm" aria-hidden="true">
             <button type="button" class="btn btn-clear" ng-click="c.removeItem(item)" data-toggle="tooltip" data-placement="top"  data-container="body" title="${Remove Item} {{::item.name}}"  ng-keydown="c.onKeyDown($event)">
           		<i class="fa fa-times-circle btn-remove" aria-hidden="true"></i>
          	</button>
            </div>
        </div>
      </li>
    </ul>
  </div>
  <div class="panel-body" ng-show="c.data.cartItems.length == 0">
    <div class="empty-state-content small-cart">
      <span class="icon icon-sp-wishlist small-cart"></span>
      <div class="h4">${Your Wish List is empty}</div>
      <p>${Once you have added items to your Wish List, you can view them from here.}</p>
    </div>
  </div>
  <div class="panel-footer">
		<a type="button" class="btn btn-default btn-block" ng-href="?id=sc_wishlist" ng-keydown="c.onKeyDown($event)">${View Wish List}</a>
  </div>
</div>
