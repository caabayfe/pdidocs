<!-- Catalog Item record -->
<div class="aisa-detail-container">
  <div class="row col-md-12">
    <div ng-if="detailResult._record.picture" class="col-md-3">
      <img title="{{detailResult._record.name}}" src="{{detailResult._record.picture}}" class="aisa-record-image" />
    </div>
    <div ng-class="{'col-md-9': detailResult._record.picture, 'col-md-12': !detailResult._record.picture}">
      <div class="aisa-record-short-description row">
        <h2>{{detailResult._record.name}}</h2>
      </div>
      <div class="row">
        {{detailResult._record.short_description}}
      </div>
      <div class="row">
        <span class="article-content" ng-bind-html="detailResult._record.description"></span>
      </div>
      <div ng-if="detailResult._record.url" class="row">
        <a ng-href="{{detailResult._record.url}}" target="_blank">{{c.data.i18nMsgs['CLICK_HERE']}}</a>
      </div>
    </div>
  </div>
</div>
