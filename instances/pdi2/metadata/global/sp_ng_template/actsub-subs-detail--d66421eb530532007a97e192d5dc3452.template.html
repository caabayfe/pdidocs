<!-- Q&A kind of Template-->
<div class="col-xs-8 col-md-10 cm-sub-name">
  <div class="cm-sub-name-row">
    <div class="content-icon" aria-hidden="true">
      <i class="fa {{sub.content_details.content_type_id ? c.getUiPageMapping(sub.content_details.content_type_id, 'icon_class') : 'fa-comments'}}" data-ng-if="!c.showAnsweredIcon(sub)"></i>
      <i class="fa fa-check-circle cm-green" aria-hidden="true" data-ng-if="c.showAnsweredIcon(sub)"></i>
    </div>
    <div class="content-header">
      <header>
        <h4 class="font-normal m-t-none m-b-none">
          <a class="" data-ng-href="{{c.getPageUrl(sub)}}">{{c.getProcessedDisplaySubName(sub)}}</a>
        </h4>
        <h5 class="cm-subhead">
          <a data-ng-href="{{$root.portal.url_prefix}}?id=community_forum&sys_id={{sub.content_details.forum.sys_id}}" 
             class="">{{sub.content_details.forum ? sub.content_details.forum.name : ''}}</a>
        </h5>
      </header>
      <div class="info">
        <span class="">${By} <a data-ng-href="{{$root.portal.url_prefix}}?id=community_user_profile&user={{sub.content_details.author.sys_id}}" 
                                class="">{{sub.content_details.author.name}}</a></span>
        <span class="csm-separator-dot" aria-hidden="true">&bull;</span>
        <span class="">${Updated } <sn-time-ago timestamp="sub.content_details.updated_utc"/></span> 
      </div>
    </div>
  </div>
</div>
<div class="col-xs-4 col-md-2 cm-align-end cm-subscribe-btn">
  <a id="{{::sub.type}}_subscribe-focus{{$index}}" class="cm-subscribe-hover" href="" aria-label="{{::(c.formatMessage(c.data.msg.unsubscribe, [c.getProcessedDisplaySubName(sub)]))}}" title="${unsubscribe}" data-ng-click="c.doSubscribe('DELETE', sub, $index)" data-ng-if="!sub.unsubscribed">
    <i class="fa fa-check-circle" aria-hidden="true"></i>
    <span class="hidden-xs"><span class="cm-show-me">${Subscribed}</span><span class="cm-hide-me">${Unsubscribe}</span></span>
  </a>
  <a id="{{::sub.type}}_unsubscribe-focus{{$index}}" href="" aria-label="{{::(c.formatMessage(c.data.msg.subscribe, [c.getProcessedDisplaySubName(sub)]))}}"  data-ng-click="c.doSubscribe('POST', sub, $index)" data-ng-if="sub.unsubscribed">
    <i class="fa fa-circle-o" aria-hidden="true"></i><span class="hidden-xs">${Subscribe}</span>
  </a>
</div>
