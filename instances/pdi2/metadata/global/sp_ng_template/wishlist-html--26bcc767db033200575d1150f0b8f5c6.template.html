<div>
  <h2 ng-show="c.data.cartItems.length > 0" class="h3" id="main-wishlist-header" tabindex="-1">${Your Wish List}</h2>
  <div ng-show="c.data.cartItems.length > 0" class="panel panel-primary b">
    <table id="cart" class="table table-hover table-condensed" aria-describedby="id-wishlist-caption">
      <caption style="display:none" id="id-wishlist-caption"><span class="sr-only">${Your Wish List}</span></caption>
      <thead>
        <tr>
          <th id="id-item-header" scope="col" class="wrapper padder-md">${Item}</th>
          <th id="id-time-header" scope="col" class="wrapper padder-md hidden-xs">${Added at}</th>
          <th id="id-item-controls" scope="col" class="wrapper padder-md"><span class="sr-only">${Item Controls}</span></th>
        </tr>
      </thead>
      <tbody>
        <tr class="item-row" ng-repeat="item in c.data.cartItems | orderBy: orderByDate :-1 track by item.sys_id">
          <th id="id-item-{{::item.sys_id}}" headers="id-item-header" scope="row" data-th="Product" class="break-word wrapper-md th-row-data" scope="row">
            <div class="row">
              <a ng-href="{{::item.item_url}}" aria-labelledby="sc_cat_item_{{::item.sys_id}}" aria-describedby="sc_cat_item_short_desc_{{::item.sys_id}}" ng-class="::{'a-disabled': !item.can_order}" class="block">
                <div>
              		<div class="sn-flexbox">
                    		<div class="col-sm-3 col-xs-4">
                      			<img ng-if="item.picture" ng-src="{{::item.picture}}" class="img-responsive item-image" alt=""/>
                    		</div>
                    		<div class="col-sm-9 col-xs-8">
                    			<div class="nomargin h4 catalog-text-wrap"><div ng-href="{{::item.item_url}}" ng-class="::{'a-disabled': !item.can_order}" id="sc_cat_item_{{::item.sys_id}}">{{::item.name}}</div></div>
                			<p class="catalog-text-wrap sc-wishlist-text" id="sc_cat_item_short_desc_{{::item.sys_id}}">{{::item.short_description}}</p>
                    		</div>
              		</div>
                </div>
             </a>
            </div>
          </th>
          <td headers="id-time-header id-item-{{::item.sys_id}}" class="col-sm-2 wrapper hidden-xs">
            <p>
              <i class="sc-wishlist-text fa fa-clock-o" aria-hidden="true"></i><sn-time-ago timestamp="::item.sys_updated_on" class="sc-wishlist-text"/>
            </p>
          </td>
          <td headers="id-item-controls id-item-{{::item.sys_id}}" class="media-right col-xs-1 wrapper">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-clear" ng-click="c.removeItem(item)" data-toggle="tooltip" data-placement="top"  data-container="body" title="${Remove Item} {{::item.name}}" aria-label="${Remove Item}">
              	<i class="fa fa-times-circle btn-remove" aria-hidden="true"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="panel-footer clearfix">
      <div class="pull-right sc-btn-group">
        <button class="btn btn-default sc-remove-btn sc-btn m-r-xs" ng-click="c.clearCart()">${Clear Wish List}</button>
        <a class="btn btn-primary sc-btn text-muted" href="?id=sc_home">${View the Catalog}</a>
      </div>
    </div>
  </div>

  <div ng-show="c.data.cartItems.length == 0" class="panel panel-default b">
    <div class="panel-body">
      <div class="empty-state-content">
        <span class="icon icon-sp-wishlist"><span class="sr-only">${Wish List icon}</span></span>
        <h2 class="h3" id="empty-wishlist-heading" tabindex="-1">${Your Wish List is empty}</h2>
      	<p>${Once you have added items to your Wish List, you can view them from here.}</p>
        <a class="btn btn-primary" href="?id=sc_home">${View the Catalog}</a>
      </div>
    </div>
  </div>
</div>
