<table aria-label="${Notification Preference}">
  <thead>
    <tr class="hidden-sm hidden-xs cm-settings-item-head">
      <th class="col-md-10 col-lg-11">
        ${Activities}
      </th>
      <th class="cm-align-end col-md-2 col-lg-1">
        ${Email}
      </th>
    </tr>
    <tr class="visible-sm visible-xs cm-settings-item-head">
      <th class="col-xs-9 col-sm-6">
        ${Activities}
      </th>
      <th class="cm-align-end col-xs-3 col-sm-6">
        ${Email}
      </th>
    </tr>
  </thead>
  <tbody>
    <tr role="row" class="cm-settings-item hidden-sm hidden-xs self-clear" data-ng-repeat="pref in c.selectedSubObject.genPreferences.activities track by pref.activity_type_id">
      <td id="switch_label_{{subObj.sys_id}}{{pref.activity_type_id}}" class="col-xs-9 col-sm-8 cm-item-name">
        <label id="switch{{subObj.sys_id}}{{pref.activity_type_id}}">{{pref.label}}</label>
      </td>
      <td class="cm-item-checkbox cm-align-end col-md-2 col-md-offset-2 col-lg-1 col-lg-offset-3">
        <span class="input-group-checkbox">
          <input id="checkbox{{subObj.sys_id}}{{pref.activity_type_id}}"
                 data-ng-model="pref.pref_code.email"
                 data-ng-change="c.prefChanged(pref)"
                 ng-disabled="!c.enableNotifications"
                 class="checkbox visually-hidden"
                 ng-keypress="c.checkBoxKeyPress($event)"
                 type="checkbox"
                 name="switch{{subObj.sys_id}}{{pref.activity_type_id}}"
                 aria-label="{{pref.label}}">
          <span aria-hidden="true" class="checkbox-label" ng-click="c.checkBoxKeyPress($event)" role="checkbox"></span>
        </span>
      </td>
    </tr>
    <tr class="cm-settings-item visible-sm visible-xs" data-ng-repeat="pref in subObj.genPreferences.activities track by $index">
      <td class="col-xs-8 col-sm-6 cm-item-name">
        <label id="switch1{{subObj.sys_id}}{{pref.activity_type_id}}">{{pref.label}}</label>
      </td>
      <td class="cm-item-checkbox cm-align-end col-xs-4 col-sm-3 col-sm-offset-3">
        <div class="input-switch">
            <input id="checkbox1{{subObj.sys_id}}{{pref.activity_type_id}}"
                   type="checkbox"
                   ng-keypress="c.checkBoxKeyPress($event)"
                   name="switch1{{pref.activity_type_id}}" 
                   data-ng-model="pref.pref_code.email" 
                   data-ng-change="c.savePreferences(pref)" 
                   data-ng-disabled="!c.enableNotifications"
                   aria-label="{{pref.label}}">
            <span aria-hidden="true" class="switch" ng-click="c.checkBoxKeyPress($event)" role="none"></span>
         </div>
      </td>
    </tr>
  </tbody>
</table>
<div class="cm-settings-item loading-div" ng-show="c.activityLoading">
  <div class="l-container">
    <div class="cm-content-main text-alignment">
      <p>
        <i class="fa fa-spinner fa-spin fa-3x fa-fw" aria-hidden="true"></i>
        ${Loading}...
      </p>
    </div>
  </div>
</div>
