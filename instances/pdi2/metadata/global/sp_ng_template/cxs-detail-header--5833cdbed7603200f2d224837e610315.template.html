<div class="cxs-result-chrome row col-md-12">
  <div class="col-xs-4 text-left cxs-button-bar">
    <button type = 'button' id="cxs_back_to_results" class="btn btn-icon" ng-click="backToResults()" title="${Back}" aria-label="${Navigates back to search results}">
      <i class="fa cxs-ec-chevron fa-chevron-left"></i>&nbsp;&nbsp;${Back}
    </button>
  </div>
  <div class="col-xs-8 text-right cxs-button-bar">
    <button ng-click="sendFeedback(thisHelpedActionDetails(cxs.display.result).actionValue, cxs.display.result)" class="btn btn-icon cxs-hlp-btn cxs-wide-action" role="checkbox" aria-checked="{{!!isRelevant(cxs.display.result)}}" ng-if="thisHelpedActionDetails(cxs.display.result).actionLabel">
      <i aria-hidden="true" ng-class="['cxs-action-button-icon',{'icon-empty-circle': !isRelevant(cxs.display.result), 'icon-check-circle': isRelevant(cxs.display.result)}]" id="cxs_overlay_result_action" action-value="{{thisHelpedActionDetails(cxs.display.result).actionValue}}"></i>
      <span class="cxs-hlp-btn-label">{{thisHelpedActionDetails(cxs.display.result).actionLabel}}</span>
    </button>&nbsp;
    <span ng-if="cxs.display.result.related_links[0].sp_link && orderActionDetails(cxs.display.result).actionLabel">
    <a class="btn btn-default cxs-button-order" ng-href="{{cxs.display.result.related_links[0].sp_link+'&referrer=contextual_search'}}" ng-mouseup="sendFeedback(orderActionDetails(cxs.display.result).actionValue, cxs.display.result)" ng-attr-aria-label="{{i18n.format(c.data.i18nMsgs.catalog.order, cxs.display.result.related_links[0].title)}}">{{orderActionDetails(cxs.display.result).actionLabel}}</a>
    &nbsp;
    </span>
    <button class="btn btn-icon cxs-preview-button" ng-click="toNext()" ng-disabled="!hasNext()" data-toggle="tooltip" data-placement="bottom" alt="${Next result}" title="${Next result}" aria-label="${Displays next search result content}">
      <i class="icon-arrow-down"></i>
    </button>
    <button class="btn btn-icon cxs-preview-button" ng-click="toPrev()" ng-disabled="!hasPrev()" data-toggle="tooltip" data-placement="bottom" alt="${Previous result}" title="${Previous result}" aria-label="${Displays previous search result content}">
      <i class="icon-arrow-up"></i>
    </button>
  </div>
  <div class="col-xs-12 text-right cxs-button-bar cxs-narrow-action">
    <button ng-click="sendFeedback(thisHelpedActionDetails(cxs.display.result).actionValue)" class="btn btn-icon cxs-hlp-btn" role="checkbox" aria-checked="{{!!isRelevant(cxs.display.result)}}" ng-if="thisHelpedActionDetails(cxs.display.result).actionLabel">
      <i aria-hidden="true" ng-class="['cxs-action-button-icon',{'icon-empty-circle': !isRelevant(cxs.display.result), 'icon-check-circle': isRelevant(cxs.display.result)}]" id="cxs_overlay_result_action_mobile" action-value="{{thisHelpedActionDetails(cxs.display.result).actionValue}}"></i>
      <span class="cxs-hlp-btn-label">{{thisHelpedActionDetails(cxs.display.result).actionLabel}}</span>
    </button>
  </div>
</div>
