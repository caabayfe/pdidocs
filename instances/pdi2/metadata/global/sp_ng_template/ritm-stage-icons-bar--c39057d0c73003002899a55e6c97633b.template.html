<div ng-if="data.choiceList.length > 0" class="requested-items-flex-container"><button class="flex-item btn" role="button" ng-click="toggle($event, item)" aria-expanded="{{data.expand}}"
    aria-label="{{data.display_value}}" ng-if="data.process_started"
    data-original-title="{{data.display_value}}" data-toggle="tooltip" ><img ng-if="!data.expand" src="images/filter_hide16.gifx"  alt="" class="toggle"/><img ng-if="data.expand" src="images/filter_reveal16.gifx" alt="" class="toggle"/></button><p ng-if="!c.data.expand"
   class="m-n flex-item"
   ng-class="{'pl': data.process_started}">
   {{::data.display_value}}
</p>

  <!--div class="flex-item" ng-if="!data.expand">
    <span ng-repeat="stage in data.choiceList" tabindex="0" aria-label="{{stage.displayValue}}">
      <img id="stage.{{stage.value}}" title="{{stage.displayValue}}" aria-hidden="true"
           class="nopadding" src="images/heisenberg_icons/stage_icons/{{stage.image}}" alt="{{stage.label}}" aria-hidden="true"/>
    </span>
  </div-->
  <div class="flex-item" ng-if="data.expand" role="list">
    <div ng-repeat="stage in data.choiceList" role="listitem">
      <div class="stage-on" style="padding-inline-start: {{(stage.level)?stage.level*10:0}}px;">
        <img id="stage.{{stage.value}}" title="{{stage.displayValue}}" aria-hidden="true"
             class="nopadding" src="images/heisenberg_icons/stage_icons/{{stage.image}}" alt=""/>
        <span>{{stage.displayValue}}</span>
        <span ng-if="stage.approvers.length >0" class="m-l-lg text-sm"> ${Approvers}</span>
        <ul class="text-xs unstyled-list">
          <li ng-repeat="approver in stage.approvers">{{::approver}}</li>
        </ul>
      </div>
    </div>
  </div>
</div>
