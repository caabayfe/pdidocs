<div class="cxs-result-container" id="{{result.id}}">
	<div class="row col-md-12">
		<div class="col-md-1 cxs-result-icon">
			<i class="fa fa-shopping-cart push" aria-hidden="true"></i>
		</div>
		<div class="col-md-11">
			<div class="cxs-result-title">
				<a ng-attr-id="{{cxs.RESULT_TITLE_ID}}{{$index}}" ng-click="displayDetail($index, $event)" href="{{getSpLink(result)}}" ><span class="cxs-result-icon"><i class="fa fa-shopping-cart" aria-hidden="true"></i></span><span ng-bind-html="result.title"></span></a>
				<span ng-if="isRelevant(result)" class="cxs-lozenge">{{thisHelpedActionDetails(result).actionLabel}}</span>
			</div>
			<div class="cxs-result-snippet">
				<span ng-bind-html="result.snippet"></span>
			</div>
			<div ng-if="hasValidSpLink(result)" class="cxs-button-order-pad">
				<a class="btn btn-default" ng-href="{{getSpLink(result)}}" ng-attr-aria-label='{{i18n.format(c.data.i18nMsgs.catalog.order, result.title)}}'>{{orderActionDetails(result).actionLabel}}</a>
			</div>
		</div>
	</div>
</div>
