default_value: |-
  /*
   The following variables are available in this script scope:
   - restMessage: name of the REST service to be executed
   - restMethod: name of the REST method to be executed
   - requestTimeOut: timeout in milliseconds for the REST request
   - input: text to be anonymized
   - prefix: prefix to be added in the anonymized string in response
   - includeMapping: boolean, indicates if mapping between masked and un-masked data should be included
   */
   
   (function executeRestMessage() {
       var requestPayload;
       /* requestPayload should have the request payload for the Rest API call*/
       /* add your transform script here to create the payload and assign it to requestPayload*/
   
       /* execute Rest request*/
       /* set any request parameters or methods below, in case needed for the Rest API execution*/
       try {
           var request = new sn_ws.RESTMessageV2(restMessage, restMethod);
           request.setRequestBody(JSON.stringify(requestPayload));
           request.setHttpTimeout(requestTimeOut);  // Set timeout in milliseconds
           var response = request.execute();
           var responseBody = response.getBody();
           var statusCode = response.getStatusCode();
           if (!(statusCode >= 200 && statusCode < 300)) {
               return {
                   errorMessage: responseBody,
                   errorCode: statusCode
               };
           }
   
           /* process the response here and return the output in the following format*/
           /* { output: anonymized_string_here,
                  anonymizationMapping:{
                     maskedValue: OriginalText,
                     maskedValue: OriginalText,
                  }
           } */
           return {
               output: '',
              anonymizationMapping: {}
           };
       } catch (e) {
           /* handle exception here, throw error in the below format, update the values if required*/
           return {
            errorMessage: e.message,
            errorCode: 500
           };
       }
   })();
