default_value: |2-
   //Complete the translate function according to the desired translation rule.
   //The function should return a String of name/value pairs that describe the properties of the translated endpoint.
   //In case a translation did not take place, the function should return null, as in the example below.
   //Example:
   // translate: function() {
   //  if(this.ep.getData().ip_address === '1.1.1.1'){
   //   this.ep.getData().ip_address='2.2.2.2';
   //  }
   //  else{
   //   return null;
   //  }
   //  var nvp = new NameValuePairs(this.ep.getData());
   //  return nvp.string;
   // },
   
   var TranslationRule = Class.create();
   TranslationRule.prototype = {
       initialize: function(endpointSysId) {
     this.ep = new CIData();
     this.ep.loadFromCI(endpointSysId);
       },
    
    translate: function() {
     var nvp = new NameValuePairs(this.ep.getData());
     return nvp.string;
    },
   
       type: 'TranslationRule'
   };
