default_value: |-
  (function runScript(functionName, scriptId){
    if (functionName === 'update') {
     runUpdateHealthMonitorScripts(scriptId);
     
    } else if (functionName === 'insert'){ 
     runInsertHealthMonitorScripts(scriptId);
    }
    
   })(functionName, scriptId);
   
   function runInsertHealthMonitorScripts(scriptId) {
       // modify this example if states are dynamic or if you have more monitors 
  	 var MONITOR_NAME = 'PUT YOUR--- MONITOR NAME HERE';
       var MONITOR_SYS_ID  = 'PUT YOUR MONITOR CONFIGURATION SYS ID';


       var healthMonitorCommon = new EvtMgmtHealthMonitorCommon();
  	 healthMonitorCommon.createNewState(MONITOR_NAME, '', '', '', '', MONITOR_SYS_ID, '');
   }


   function runUpdateHealthMonitorScripts(scriptId) {
  	 
      // modify this example if states are dynamic or if you have more monitors 
      var healthMonitorCommon = new EvtMgmtHealthMonitorCommon();
      var monitorGr = healthMonitorCommon.getMonitorConfigRecord(scriptId);
  	if(monitorGr.next()) {
  		 var shouldRun = healthMonitorCommon.shouldRun(monitorGr.sys_id, monitorGr);
  		 if(shouldRun) {
  	                 var stateGr = healthMonitorCommon.getAllConfigStates(monitorGr.sys_id);
  			 if(stateGr.next()) {
  				 //   CALL TO YOUR IMPLEMENTATION IS HERE 
                   
  				 var monitorValue  =  getMonitorValue();
  				 // add  additional information and description
                   var additional_info = {};
                   additional_info['other_info'] = '' + monitorValue;
  				 var description = gs.getMessage('monitor value: {0} ', monitorValue);
  				 handleAlertAndState(monitorValue, monitorGr, stateGr, description , additional_info);
  			 }
  		 }
  	}



  	function getMonitorValue() {
           // IMPLEMENT MONITOR VALUE CALCULATION
           return 1;
       }

  	function handleAlertAndState(value, monitorGr, stateGr, description , additional_info) {
          var healthMonitorCommon = new EvtMgmtHealthMonitorCommon();
  	    var severity = healthMonitorCommon.calculateSeverity(value, monitorGr.sys_id, monitorGr, additional_info);		
  		var newState = healthMonitorCommon.getNextEventAlertStatus(stateGr.sys_id, stateGr, severity);	

          var alertGenerator = new EvtMgmtEventAlertGenerator();


  		if (newState == 'Open') { 

  			alertGenerator.openEvent('',severity,description,
  									additional_info, monitorGr,stateGr,monitorGr.name,stateGr.name,'');


  		} else if (newState == 'Closed'){ 
              alertGenerator.closeEvent('',severity,description,
  									additional_info, monitorGr,stateGr,monitorGr.name,stateGr.name,'');
  		}
  		        
  		// Update monitor configuration last run
  		healthMonitorCommon.updateConfigLastRunState(monitorGr.sys_id, ''); 
  		// Update monitor state status
  		if (newState != 'Do Nothing') {
  			healthMonitorCommon.updateState(stateGr.sys_id, severity, newState, value, '', description);
          }
  	}
  }
