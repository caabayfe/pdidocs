  /* The input for the Script Batch Adapter can be accessed through the global variable 'batch' (its array)
   The function should set the result to 'output' variable for each element of batch array in same order.
   batch: Array of input sets.
   ouput: Pre initialized array (of the same size) of batch array.
   
   Example Script 
   (function(batch, output) {
       for (var i = 0; i < batch.length; i++) {
   
           //step1: access the input variables
           var a = batch[i].input; //Value of the Rule/Symbol of this adapter. 
           var b = batch[i].var1; //additional input variable var1 specified by user
           var c = batch[i].var2; //additional input variable var2 specified by user
   
           //step2: Your script/code goes here.
           var d = a + b + c;
   
           //step3: set the output for each elements
           output[i] = d;
       }
   
   })(batch, output);
