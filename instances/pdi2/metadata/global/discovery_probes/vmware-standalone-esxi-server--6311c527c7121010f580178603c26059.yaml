description: |-
  Probe to get information about an ESXi server. The sensor will fire a probe for each type of object managed by the server:   
              VMs, explored by the "VMWare - vCenter VMs" probe,
              datastores, explored by the "VMWare - vCenter Datastores" probe, and 
              networks, explored by the "VMWare - vCenter Networks" probe.
              esx resource pools, explored by the "VMWare - vCenter Clusters" probe.
              
              This probe's implementation is located in a MID server script include named StandaloneESXProbe.
