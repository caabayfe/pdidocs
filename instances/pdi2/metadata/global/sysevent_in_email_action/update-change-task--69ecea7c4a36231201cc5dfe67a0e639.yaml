description: |-
  This inbound email action is triggered when an email is sent to ServiceNow and:

  1. The email is a reply.
  2. The email being replied to was sent by ServiceNow due to creation or update of a Change Task.


  This inbound email action can update the following fields on a Change Task:

  assigned_to
  priority

  In addition to being able to explicitly set the values of the above fields within the email, the whole email is added to the Change Task as a comment.


  Example reply email: this reply will update comments for Change Task with "We need this now." It will also set priority to "1" if the sender has the itil role.

  -----

  From: 	Fred Luddy <fred.luddy@example.com>
  Subject: 	Re: Change task CTASK0010002 has been assigned to you
  Date: 	June 11, 2013 3:10:54 PM PDT
  To: 	        ServiceNow

  We need this now.

  priority: 1

  On Jun 11, 2013, at 3:08 PM, IT Service Desk wrote:

  Ref:MSG0000014

  -----
