description: |-
  This inbound email action is triggered when an email is sent to ServiceNow and:

  1. The email is a reply.
  2. The email being replied to was sent by ServiceNow due to creation or update of a Problem.


  This inbound email action can update the following fields on a Problem:

  assigned_to
  priority

  In addition to being able to explicitly set the values of the above fields within the email, the whole email is added to the Problem as a comment.


  Example reply email: this reply will update comments for the request with "Let's have Don take care of this one." It will also assign the problem to "Don Goodliffe" if the sender has the itil role.

  -----

  From: 	Fred Luddy <fred.luddy@example.com>
  Subject: 	Re: Problem PRB0040001 has been assigned to you
  Date: 	June 11, 2013 2:38:49 PM PDT
  To: 	        ServiceNow

  Let's have Don take care of this one.

  assign: Don Goodliffe

  On Jun 11, 2013, at 2:37 PM, IT Service Desk wrote:

  Ref:MSG0000008

  -----
