description: |-
  This inbound email action is triggered when an email is sent to ServiceNow and:

  1. The email is a reply.
  2. The email being replied to was sent by ServiceNow due to an update or creation of an Incident.


  This inbound email action can update the following fields on an Incident:

  assigned_to
  priority
  category
  short_description

  In addition to being able to explicitly set the values of the above fields within the email, the whole email is added to the Incident as a comment.


  Example reply email: this reply will update comments for the Incident with "Our engineers are on this - should see resolution in a couple hours.", assign the Incident to David Loo, and set priority to "2".

  -----

  From: 	Fred Luddy <fred.luddy@example.com>
  Subject: 	Re: Incident INC0010008 has been assigned to you
  Date: 	June 10, 2013 10:47:00 AM PDT
  To: 	        ServiceNow

  Our engineers are on this - should see resolution in a couple hours.

  priority: 2
  assigned_to: david.loo

  On Jun 10, 2013, at 10:43 AM, IT Service Desk wrote:

  Short Description: A new occurrence of network outage
  Click here to view Incident: INC0010008
  Severity: 3 - Low
  Priority: 4 - Low
  Category: Inquiry / Help
  Comments:
   
  Ref:MSG0000034

  -----
