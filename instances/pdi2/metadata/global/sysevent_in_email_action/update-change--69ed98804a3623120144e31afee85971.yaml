description: |-
  This inbound email action is triggered when an email is sent to ServiceNow and:

  1. The email is a reply.
  2. The email being replied to was sent by ServiceNow due to creation or update of a Change Request.


  This inbound email action can update the following fields on a Change Request:

  assigned_to
  priority

  In addition to being able to explicitly set the values of the above fields within the email, the whole email is added to the Change Request as a comment.


  Example reply email: this reply will update comments for the Change with "Eric owns this." It will also assign the Change to "Eric Schroeder" if the sender has the itil role.

  -----

  From: 	Fred Luddy <fred.luddy@example.com>
  Subject: 	Re: Change CHG0000004 has been assigned to you
  Date: 	June 11, 2013 3:03:13 PM PDT
  To: 	        ServiceNow

  Eric owns this.

  assign: eric.schroeder

  On Jun 11, 2013, at 3:01 PM, IT Service Desk wrote:

  Ref:MSG0000013

  -----
