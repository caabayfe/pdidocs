description: |-
  markdown_toolbar:

  Overrides the Markdown editor's toolbar for this specific field only, taking priority over the "glide.ui.markdown.editor.toolbar" system property.

  Format: item ids separated by spaces, commas, or semicolons; | inserts a divider between groups.
  Example: heading | bold italic | ul ol | link quote code | download

  Available ids: heading, bold, italic, strike, highlight, subscript, superscript, code, ul, ol, tasklist, link, table, codeblock, quote, hr, download, fullscreen.

  Leave unset to fall back to the "glide.ui.markdown.editor.toolbar" system property (or the editor's built-in default if that's also blank). Does not restrict what Markdown syntax is supported when typed — it only controls which buttons are shown.
label: Markdown Toolbar
name: markdown_toolbar
