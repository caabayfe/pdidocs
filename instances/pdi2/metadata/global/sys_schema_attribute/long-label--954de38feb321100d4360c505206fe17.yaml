description: Long or short labels refer to the label that is displayed for reference fields on a form. For example, if the field contains the caller's email address, the long label would be "Caller Email" while the short label would just be "Email." Usually the placement of the field on the form makes it clear what the field represents. The global property (glide.short.labels) is used to specify the type of labels that are displayed for all reference fields on any form. This global property can be overridden for any field by setting the short_label=true or long_label=true attribute for the field in the Dictionary.
label: Long label
