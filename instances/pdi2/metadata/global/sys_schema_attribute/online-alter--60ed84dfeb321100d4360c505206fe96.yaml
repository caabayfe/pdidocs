description: Tables with the onlineAlter attribute perform MySQL database operations using online schema changes. Online schema changes provides a lock-free table upgrade when adding, modifying, or removing columns and when adding or dropping indexes. Without online schema changes, these changes to the database lock write access during execution. Online schema changes use additional system resources. The Online alter (onlineAlter) attribute is available with the Calgary release and is enabled by default for all tables. Oracle databases do not lock tables by default and do not use online schema changes.
