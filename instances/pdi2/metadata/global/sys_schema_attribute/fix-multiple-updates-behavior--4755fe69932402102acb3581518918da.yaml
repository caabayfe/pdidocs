applies_to_description: Applying the attribute to the table will enforce the new update behavior for all fields with defaulting types that the table contains. Applying the attribute to a field will enforce the new update behavior if the field has a defaulting type. Update behavior of fields with non-defaulting types will not be affected.
column_on_table: ''
column_type: a54edbb1c0a80006014da86b91525bf3
description: Some field types have incorrect behavior with the update operation. For e.g. A Date or Date/Time field will be updated if two back-to-back updates are performed even when no fields are specified to be updated. This attribute will change the behavior of fields with these defaulting types to enforce correct updates.
label: Fix Multiple Updates Behavior
name: fix_multiple_updates_behavior
