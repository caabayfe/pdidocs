description: The fields of the table are used to perform the lookup using a 'matcher'. Approvals are specified as fields in the table that have an attribute of 'approval_user=<field_name>', where <field_name> indicates the field in the table that contains the user(s) for this approval type. Fields with this attribute contain an integer value that indicates the sequence for the approvals. All approval fields with the same sequence number indicate that multiple approvals are required before continuing. Approvals are requested in the order of the sequence numbers. For example, all approvals with sequence number 100 must be approved before approvals with sequence number 200 are requested.
