description: Applicable to columns in tables in Table-Per-Partition (TPP) extension model. Set this attribute to true to mark a column to be synchronized on migration to TPP. Adding this property after migration or without ever migrating will have no effect.
label: Synchronize across partitions
name: synchronizePartitions
on_table: ''
read_roles: ''
remove_roles: ''
sys_name: Synchronize across partitions
sys_policy: ''
update_roles: ''
value_description: |-
  True to mark a column to be synchronized on migration to partitioned extension model (TPP). This attribute has no effect on a column in a table already in TPP.
  Setting this attribute to false is equivalent to not having this attribute at all (as false is the default).
