category: STRING
description: |-
  <p>Removes white space from the beginning and end of the input String.</p>
              <p><b>Input:</b></p>
              <p>
              <ul>
              <li><strong>String</strong></li>
              </ul>
              </p>
              <p><b>Output:</b></p>
              <p>
              <ul>
              <li><strong>String</strong> - Transformed String with trimmed white space.</li>
              </ul>
              </p>
              <p><b>Example:</b></p>
              <p>
              Input:
              <pre>"      Example input string.       "</pre>
              Result:
              <pre>"Example input string."</pre>
              </p>
              <p>Note: Does not remove white space within the input String. If input data type is not String, the data is not transformed at runtime.</p>
              <p><a href="/api/now/v1/context_doc_url/CSHelp:String-Transform-Functions" target="_blank">Read More.</a></p>
