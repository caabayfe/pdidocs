description: |-
  This Utility was created to debug and test the Metric Cache on MID
  Usage examples:

  var mcu = new MetricsCacheUtils();
  ms.log(mcu.getCacheSize());
  --------------------------------
  var mcu = new MetricsCacheUtils();
  var numOfRecords = mcu.getNumberOfActiveRecords();
  ms.log(numOfRecords);
  --------------------------------

  var mcu = new MetricsCacheUtils();
  var listOfCacheEntries = mcu.getActiveRecordsByAgentId('agent-2');

  for (var i=0; i<listOfCacheEntries.size(); i++) {
  	var cacheEntry = listOfCacheEntries.get(i);
  	ms.log(cacheEntry.getKey());
  	/*The return value is Metric2CiCacheEntry object*/
  	ms.log(cacheEntry.getValue().getCiType());
  }

  --------------------------------
  var mcu = new MetricsCacheUtils();
   mcu.printRecordsByAgentId('agent-2');
  --------------------------------

  var mcu = new MetricsCacheUtils();
   mcu.printMetric2CiCacheAll();

  -------------------------------------------------
  var mcu = new MetricsCacheUtils();
  mcu.getModelInfo("ciSysId", "resourceId", "metricTypeId");
  mcu.getNumOfModels();
  mcu.getAllModels();
name: MetricsCacheUtils
sys_name: MetricsCacheUtils
