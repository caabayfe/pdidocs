description: Base class for scripted probes - probes built extending this class should implement the run method, supplying the desired functionality.  Probe parameters are accessible by calling the getParameter methods.  Results would be returned by calling createOutputResult.  The result would be in the output field of the resulting ECC payload.  If this is called from a Orchestration activity, the output would be accessible in the sensor script of the activity in activity.output.
