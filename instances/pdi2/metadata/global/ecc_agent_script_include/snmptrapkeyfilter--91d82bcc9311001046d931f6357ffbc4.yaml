description: |-
  This script is used by the Event Management SNMP trap listener.
  The script will be executed only if the MID server parameter mid.snmp.event.oid.keys is defined with values.
  The script returns a list of oid values that will be used to compose the message key.
  The script receives the following parameters:
  oidList: List of oids that are defined in the MID server parameter: mid.snmp.event.oid.keys
  event: Event object (after parsing the trap into the event)
  trap: org.snmp4j.CommandResponderEvent (the seed trap)
   
  The script returns:
  List of oids that will be used to compose the message key
name: SnmpTrapKeyFilter
sys_name: SnmpTrapKeyFilter
