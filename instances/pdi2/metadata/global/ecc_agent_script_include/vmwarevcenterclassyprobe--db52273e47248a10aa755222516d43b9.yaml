description: |-
  Implementation of the "VMWare - vCenter VMs" probe.
  Probe to get information about availability of vCenter by creation of Vcenter Session. 
  1) If the session creation is successful, the probe indicates vCenter availability and triggers subsequent probes for detailed vCenter discovery.
  2) If the session creation fails, the probe indicates vCenter unavailability and terminates the Vcenter discovery.
name: VMWarevCenterClassyProbe
