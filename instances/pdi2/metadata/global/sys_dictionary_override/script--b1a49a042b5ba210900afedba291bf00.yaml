default_value: |-
  /*** Do not modify ***/
  /* Ensuring that schedulers run in domain context in a domain separated instance */
  if (GlidePluginManager.isActive("com.glide.domain") == true && !current.can_iterate) {
      current.setValue('can_iterate', true);
      current.setValue('source_table', 'sys_error');
  }
  current.setValue('state', 'running');
  current.update();

  var application = current.getValue('source_application');
  var result = global.ErrorManager.aggregateCounts(application, null, current.sys_id);

  current.setValue('state', result.success ? 'completed' : 'failed');
  current.update();

  if (!result.success)
      gs.error('Error Aggregation Schedule failed for ' + application + ' with error: ' + result.message);
default_value_override: 'true'
