<div>
  <ul role="list" aria-label="${Files to be uploaded}">
    <li role="listitem" ng-repeat="file in options.shared.files">
    	<span class="fa fa-file-o">
        <span class="file-name">{{file.name}}</span>
      </span>
    </li>
  </ul>
  <div ng-if="data.contexts.length > 1">
  	<label for="encryption_picker_select">
  	  ${Current encryption context}
  	</label>
  	<select id="encryption_picker_select" class="form-control"
						name="encryption_picker_select" ng-model="options.shared.context"
						ng-change="setPreferenceValue()"
						ng-options="item as item.label for item in data.contexts "></select>
  </div>
</div>
