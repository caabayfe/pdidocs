<div class="modal-body" style="padding: 0">
    <div role="status">
		<div ng-repeat="m in c.$$uiNotification" class="alert"
			ng-class="{'alert-danger' : m.type == 'error', 'alert-success' : m.type != 'error', 'visible' : m.visible}"
			ng-init="c.revealNotification(m)">
			<!-- ngIf: m.type == 'error' -->
			<span ng-if="m.type == 'error' " class="fa fa-exclamation-triangle m-r-xs ng-scope"></span>
			<span ng-bind-html="m.message"></span>
			<button class="btn btn-link close fa fa-close pull-right" ng-click="c.dismissNotifications()" ng-show="$first"
				ng-class="{'alert-danger' : m.type == 'error', 'alert-success' : m.type != 'error'}" aria-label="{{::c.closeMsg}}"></button>
		</div>
    </div>
    <sp-widget widget="instance"></sp-widget>
</div>
