<div id="mrvs_active_row">
  <div ng-if="::!c.isNative" class="modal-header">
    <button type="button" class="close pull-right" ng-click="c.dismiss()" data-toggle="tooltip" data-placement="bottom" title="{{c.data.close_modal_label}}" aria-label="{{c.data.close_modal_label}}" role="button" autofocus>×</button>
    <h2 class="modal-title h4">{{c.data.modal_title}}</h2>
  </div>
  <div class="modal-body">
    <sp-model form-model="c.data.active_row" mandatory=""></sp-model>
  </div>
  <div ng-if="::!c.isNative" class="modal-footer">
  	<button class="btn btn-default" ng-disabled="disableControls()" ng-click="c.dismiss()">${Cancel}</button>
    <button id="mrvs_save_button" class="btn btn-primary" ng-disabled="disableControls()" ng-click="c.saveRow()">{{c.data.primary_action_label}}</button>
    <span ng-if="validating" style="padding-left:4px">${Validating...}</span>
  </div>
</div>
