<ul ng-if="user.logged_in" class="nav navbar-nav">
  <!-- chat, avatar, and logout -->
  <li ng-if="showAvatar" class="hidden-xs dropdown">
    <a href class="toggle-dropdown" data-toggle="dropdown" data-placement="bottom" data-toggle-second="tooltip" aria-expanded="false" data-original-title="{{::user.name}}" aria-label="{{::data.profileBtnMsg}}: {{::user.name}}" id="profile-dropdown"  role="button" aria-haspopup="true" ng-click="removeTooltip()">
      <span class="navbar-avatar" aria-hidden="true"><sn-avatar ng-if="showAvatarIcon" class="avatar-small-medium" primary="user.sys_id"></sn-avatar></span>
      <span ng-if="options.showUsername == true" class="visible-lg-inline">{{::user.name}}</span>
      <i ng-if="options.showUsername != true" class="m-l-xs fa fa-caret-down" aria-hidden="true"></i>
    </a>
    <ul class="dropdown-menu" role="menu" aria-label="{{::data.profileBtnMsg}}">
      <li class="header-menu-item" role="presentation"><a tabindex="-1" ng-href="{{::profile_url}}" role="menuitem">${Profile}</a></li>
      <li class="header-menu-item" ng-if="data.isimpersonationenabled && data.isImpersonating" role="presentation">
        <a tabindex="-1" href="javascript:void(0)" ng-click="endImpersonate()" role="menuitem">${End Impersonation}</a>
      </li>
      <li class="header-menu-item" ng-if="data.isEmployeeProfilesEnabled" role="presentation">
        <a tabindex="-1" ng-href="?id=preferences" role="menuitem">${Preferences}</a>
      </li>
      <li class="header-menu-item" ng-if="data.isimpersonationenabled && (data.canImpersonate || data.isImpersonating)" role="presentation">
        <a tabindex="-1" href="javascript:void(0)" ng-click="impersonate()" role="menuitem">${Impersonate}</a>
      </li>
      <li class="header-menu-item" ng-if="::!(isViewNative || isViewNativeTablet)" role="presentation"><a tabindex="-1" href="{{::portal.logoutUrl}}" role="menuitem">${Logout}</a></li>
    </ul>
  </li>
  <li ng-if="showXSAvatar" class="visible-xs-block"><a role="menuitem" ng-href="{{::profile_url}}" ng-click="collapse()">
    <span class="navbar-avatar"><sn-avatar class="avatar-small-medium" primary="avatarProfile"></sn-avatar></span>{{::user.name}}</a>
  </li>
  <li class="visible-xs-block" ng-if="data.isEmployeeProfilesEnabled">
     <a ng-href="?id=preferences">${Preferences}</a>
  </li>
  <li class="visible-xs-block" ng-if="options.isimpersonationenabled && data.isImpersonating">
    <a href="javascript:void(0)" ng-click="endImpersonate()">${End Impersonation}</a>
  </li>
  <li class="visible-xs-block" ng-if="options.isimpersonationenabled && (data.canImpersonate || data.isImpersonating)">
    <a href="javascript:void(0)" ng-click="impersonate()">${Impersonate}</a>
  </li>
  <li ng-if="::!(isViewNative || isViewNativeTablet)" class="visible-xs-block"><a ng-href="{{::portal.logoutUrl}}" ng-click="collapse()">${Logout}</a></li>
</ul>
