<div class="panel panel-default">
	<h1 class="padder-md h3">
    ${Cloning Requests}
    <span class="text-base">
  	  <i class="fa fa-close pull-right text-base" tabindex="0" ng-click="c.close()" aria-label="${Close modal}" title="${Close modal}"></i>
     </span>
  </h1>
	<div class="wrapper-md clearfix b-t">
    <span id="status">
      {{data.name}}
    </span>
	<uib-progressbar title="status" class="progress" ianimate="true" value="data.status"><span class="b">{{data.status}}%</span></uib-progressbar>
    <div role="status" aria-live="polite">
      <span class="sr-only">{{data.status}}% ${completed} , {{data.message}}</span>
    </div>
    <small><em>{{data.message}}</em></small>
    <a ng-repeat="(key, value) in data.reqMap" href="/{{data.portalSuffix}}?id=sc_request&table=sc_request&sys_id={{::value}}">{{::key}}{{$last ? '.' : ', '}}</a>
    <button class="btn btn-primary pull-right" ng-disabled="data.status < 100" ng-click="c.close()">${OK}</button>
  </div>
</div>
<now-message key="Cloning" value="${Cloning}"></now-message>
