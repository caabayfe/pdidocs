<div ng-if="options.cartTemplate">
	<div ng-include="options.cartTemplate"></div>

  <sp-widget widget="c.checkoutCartModal" ng-if="c.checkoutCartModal"></sp-widget>
  <sp-widget widget="c.saveCartModal" ng-if="c.saveCartModal"></sp-widget>
</div>

<div ng-if="!options.cartTemplate">
  <div class="alert alert-danger" role="alert">
    <strong>${Error}: </strong>
    ${Please provide a cart template to render.}
  </div>
</div>
<now-message key="Done" value="${Done}"></now-message>
<now-message key="Your Cart" value="${Your Cart}"></now-message>
<now-message key="Proceed to Checkout" value="${Proceed to Checkout}"></now-message>
<now-message key="Checkout" value="${Checkout}"></now-message>
<now-message key="Ordering..." value="${Ordering...}"></now-message>
<now-message key="Cart updated" value="${Cart updated}"></now-message>
