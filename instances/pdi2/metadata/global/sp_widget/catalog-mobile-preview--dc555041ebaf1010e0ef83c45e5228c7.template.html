<div class="smartphone">
  <div class="content" ng-show="c.data.isMobilePluginInstalled">
    <div class="navBar">
      <button type="button"
              class="btn backBtn"
              ng-if="c.showBackButton"
              ng-click="c.handleNavBarButtonClick(0)">
        <i class="fa {{c.navBackIcon}}"></i>
      </button>
      <div class="title">
        	{{c.title}}
      </div>
      <button type="button"
              class="btn navBtn"
              ng-click="c.handleNavBarButtonClick(1)">
        	{{c.navButtonTitle}}
      </button>
    </div>
    <iframe scrolling="no"
            frameBorder="0";
            ng-src="{{c.itemURL}}"
            sandbox="allow-scripts allow-popups allow-same-origin allow-modals"
			title="{{c.data.iframeTitle}}">
    </iframe>
    
    <div class="btn-group navBottom" role="group">
      <button type="button" class="btn" ng-repeat="button in c.bottomButtons" ng-disabled="true"
              style="background-color: {{button.backgroundColor}};color: {{button.textColor}};"
              ng-click="c.handleBottomButtonClick($index)">
        {{button.title}}
      </button>
    </div>
  </div>
  <div class="alert alert-warning" ng-show="!c.data.isMobilePluginInstalled">
    <div>
      ${The following plugin 'ServiceNow NowMobile App Screens and Applet Launcher' is not installed}
    </div>
  </div>
</div>
