<div ng-repeat="c in ::data.categories" ng-if="::c.items.length">
  <div class="h4"><a ng-href="?id={{::data.sc_category_page}}&sys_id={{::c.sys_id}}">{{::c.title}}</a></div>
  <ul class="row item-list-style-type-none item-card-row" role="list" aria-label="{{::c.title}} ${items}">
    <li class="item-card-column" ng-repeat="item in ::c.items" role="listitem">
      <div class="panel item-card panel-{{::options.color}} b">
        <a target="{{::item.target}}" ng-href="{{::getItemHREF(item)}}" ng-click="onClick($event, item)" class="panel-body block height-100">
          <div>
            <div class="h4 m-t-none m-b-xs text-overflow-ellipsis" style="padding-bottom:1px">{{::item.name}}<span ng-if="item.content_type == 'external'" class="text-primary"><span class="sr-only">${External Link}</span> ➚</span></div>
            <img ng-src="{{::item.picture}}" ng-if="::item.picture" alt="" class="m-r-sm m-b-sm item-image pull-left" aria-hidden="true"/>
            <div class="text-muted item-short-desc catalog-text-wrap">{{::item.short_description}}</div>
          </div>
        </a>
      </div>
    </li>
  </ul>
</div>
