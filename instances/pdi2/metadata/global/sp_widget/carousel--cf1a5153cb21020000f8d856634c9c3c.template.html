<div class="pull-in">
  <uib-carousel interval="options.interval">
    <uib-slide ng-repeat="slide in ::data.slides" active="slide.active">
      <div class="container">
        <a ng-if="slide.url" ng-href="{{::slide.url}}">
          <img ng-src="{{::slide.background}}" style="margin:auto; width:100%;" alt="{{::slide.alt_text || slide.name}}">
        </a>
        <img ng-if="!slide.url" ng-src="{{::slide.background}}" style="margin:auto; width:100%;" alt="{{::slide.alt_text || slide.name}}">
      </div>
    </uib-slide>
  </uib-carousel>
</div>
