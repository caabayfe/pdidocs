<div ng-if="(data.catalogs.length > 0)" ng-class="{'row': options.use_full_width === 'false', 'full-width': isSCCartFixed && options.use_full_width === 'true'}">
  <div ng-class="{true:'col-lg-9 col-md-9 col-sm-12'}[options.use_full_width === 'false']">
    <sp-panel title="{{::options.title}}" ng-if="!c.isNativeMobile">
      <ul class="catalog-item-list" aria-label="{{::options.title}}" role="list">
        <li class="list-group-item" ng-repeat="a in data.catalogs track by a.sys_id" role="listitem">
          <div class="row">
            <div ng-if="::a.picture">
              <div class="col-xs-8">
                <a href="{{::a.href}}&referrer=related_items" ng-bind="::a.name"></a>
                <div class="text-overflow" ng-bind="::a.short_description"></div>
              </div>
              <div class="col-xs-4">
                <img alt="{{a.altText}}" class="img-responsive center-block" ng-src="{{::a.picture}}"> 
              </div>
            </div>
            <div class="col-xs-12" ng-if="::!a.picture">
              <a href="{{::a.href}}&referrer=related_items" ng-bind="::a.name"></a>
              <div class="text-overflow " ng-bind="::a.short_description"></div>
            </div>
          </div>
        </li>
      </ul>
    </sp-panel>
  </div>

  <div ng-if="c.isNativeMobile">
    <div id="catalog-title" class="h4" ng-bind="::options.title"></div>
    <div id="catalog-margin-last">
      <div class="panel panel-mobile" ng-repeat="a in data.catalogs track by a.sys_id">
        <div class="row" >
          <div ng-if="::a.picture">
            <div class=" col-xs-8">
              <div ><a class="link" href="{{::a.href}}&referrer=related_items" ng-bind="::a.name"></a></div>
              <div class="m-t" class="text-overflow" ng-bind="::a.short_description"></div>
            </div>
            <div class="col-xs-4">
              <img alt="{{a.altText}}"  class="img-responsive" ng-src="{{::a.picture}}"> 
            </div>
          </div>
          <div class="col-xs-12" ng-if="::!a.picture">
            <div><a class="link" href="{{::a.href}}&referrer=related_items" ng-bind="::a.name"></a></div>
            <div class=" text-overflow" ng-bind="::a.short_description"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
