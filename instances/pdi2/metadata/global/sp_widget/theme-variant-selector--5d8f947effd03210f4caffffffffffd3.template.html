<div ng-if="::c.options.display != 'dropdown' && data.themeVariantMappings && data.themeVariantMappings.length">
  <label>${Theme}</label>
  <div class="radio-group">
    <div class="theme-option"
         ng-class="'sp-theme-variant-mapping-' + (variantMapping.sys_id || 'default')"
         ng-init="applyVariantCss(variantMapping.sys_id, data.variantStyles[variantMapping.sys_id])"
         ng-keypress="handleVariantKeypress($event, variantMapping)"
         ng-repeat="variantMapping in data.themeVariantMappings"
         tabindex="0">
      <label>
        <input type="radio"
               name="theme_variant_mapping"
               ng-value="variantMapping.sys_id"
               ng-model="data.themeVariantMappingId"
               ng-change="setUserThemeVariant(data.themeVariantMappingId)"
               ng-checked="variantMapping.sys_id === data.themeVariantMappingId">
        <div class="theme-option-wrapper">
          <div class="theme-diagram">
            <div class="theme-primary">
              <div class="theme-navbar">
                <div class="theme-user"/>
              </div>
            </div>
            <div class="theme-main-body">
              <div ng-repeat="n in [1,2,3]">
                <hr/>
                <hr/>
              </div>
            </div>
          </div>
          <div class="theme-option-label">
            <span>{{variantMapping.name}}</span>
            <i class="fa fa-check-circle"></i>
          </div>
        </div>
      </label>
    </div>
  </div>
</div>
<ul ng-if="::c.options.display === 'dropdown' && c.data.themeVariantMappings" class="nav navbar-nav" aria-label="${Header}" role="list">
  <li>
    <a href class="variant-popup-link" data-toggle="dropdown" aria-expanded="false" aria-label="${Theme Settings}" id="variant-dropdown" role="button" aria-haspopup="true">
      <span class="nav-link">${Theme}</span>
    </a>
    <ul class="dropdown-menu" aria-label="${Theme Options}">
      <li ng-repeat="variant in data.themeVariantMappings">
        <a href="javascript:void(0)" ng-click="setUserThemeVariant(variant.sys_id)">
          <i class="fa fa-check" ng-class="{'selected': c.data.themeVariantMappingId == variant.sys_id}"></i>
          <span>{{variant.name}}</span>
        </a>
      </li>
    </ul>
  </li>
</ul>
