<div id="agenda-item-form-widget" class="panel-shift">
	<div class="panel panel-default">
		<div class="panel-body">
          	<div ng-if="agendaItem">
            	<div ng-if="agendaItemCtrl.canReadTask()">
					<sp-model form_model="data.f" mandatory="mandatory" correct-form-focus></sp-model>
				</div>
            	<div ng-if="!agendaItemCtrl.canReadTask()" class="panel panel-default">
					<div class="panel-body wrapper-lg text-center">${Record not found}</div>
				</div>
          	</div>
			<div id="cab-form-tab" ng-if="!agendaItem" class="no-record-msg-box">
              	<div class="icon-history" ng-if="meeting.pending()">
                	<span class="no-record-msg">${The meeting has not started. A record will display once the meeting begins.}</span>
                    <br><br>
					<span><button ng-if="meeting.host()" class="start-end-btn" ng-click="meeting.start()">${Start meeting}</button></span>
                </div>
                <div class="icon-history" ng-if="!meeting.loading && meeting.inProgress() && meeting.agendaComplete()">
					<span class="no-record-msg">${The agenda has been completed.}</span>
					<br><br>
					<span ><button ng-if="meeting.host()" class="start-end-btn" ng-click="meeting.end()" focus-this="true">${End meeting}</button></span>
				</div>
                <div class="icon-history" ng-if="meeting.complete()">
					<span class="no-record-msg">${The meeting has finished.}</span>
                </div>
              	<div class="icon-history" ng-if="meeting.canceled()">
                    <span class="no-record-msg">${This meeting has been cancelled.}</span>
                </div>
          	</div>
		</div>
	</div>
</div>
