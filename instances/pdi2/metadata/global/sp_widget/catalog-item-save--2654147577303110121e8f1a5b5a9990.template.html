<div id="sc_cat_item_save" ng-class="{'panel panel-default': !c.isNative}">
   <div ng-if="::!c.isNative" class="modal-header">
      <button type="button" class="close pull-right" ng-click="c.cancel()" data-toggle="tooltip" data-placement="bottom" title="{{m.closeModal}}" aria-label="{{m.closeModal}}" role="button" autofocus>×</button>
      <h2 class="modal-title h4">{{m.saveDraft}}</h2>
   </div> 
   <div class="modal-body">
     <p ng-if="::(c.data.modalInfoMessage && !c.isNative)" class="alert alert-info" role="alert">{{c.data.modalInfoMessage}}</p>
     <p ng-bind-html="::c.data.modalMessage"></p>
     <p ng-if="::(c.errorMessage && !c.isNative)" class="alert alert-danger" role="alert">{{c.errorMessage}}</p>
      <form>
         <div class="form-group">
            <label for="draft_item_name" ><span class="field-decorations"><span class="fa fa-asterisk mandatory sp-field-label-padding" title="Required"></span>{{m.label}}</span></label>
            <input sn-focus="true" ng-model="c.data.draftName" id="draft_item_name" type="text" class="form-control" required="true" >
         </div>
      </form>
      <div ng-if="::!c.isNative" class="modal-footer">
         <button  class="btn btn-default" ng-click="c.cancel()" >{{m.cancel}}</button>
         <button  class="btn btn-default  btn-primary" ng-click="c.save()" ng-disabled="!c.data.draftName">{{m.save}}</button>
      </div>
   </div>
</div>
