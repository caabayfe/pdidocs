<div id="homepage-search" class="hidden-xs wrapper-md"  ng-init="c.trackPage()">
  <div class="wrapper-md">
  	<h2 class="text-center font-thin text-4x m-b-lg sp-tagline-color" ng-bind="options.title" ng-if="options.title"></h2>
  	<div ng-if="options.short_description" class="text-center m-b-lg sp-tagline-color h4" ng-bind="options.short_description"></div>
    <div class="search-bar">
      <sp-widget widget="data.typeAheadSearch"></sp-widget>
    </div>
    <div class="m-t text-a-c">
      <a class="sp-tagline-color text-lg text-u-l"
        	ng-href="?id=sc_category">
        ${Browse by Categories}
      </a>
    </div>
  </div>
</div>
