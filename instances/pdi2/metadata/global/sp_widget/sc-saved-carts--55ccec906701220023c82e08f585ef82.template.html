<div class="panel panel-default" ng-class="{'hidden-xs': c.data.savedCarts.length == 0}" ng-if = "$root.hasSavedCarts || $root.hasRequestsOrApprovals">

  <div class="panel-heading bundle-title">
    <h2 class="h6 panel-title bundle-title-content" id="saved-bundles-header" tabindex="-1">${My Saved Bundles}</h2>
  </div>

  <div ng-if="c.data.savedCarts.length == 0" class="panel-body bundles-container" >
 		${You have no saved bundles }
  </div>
  <ul ng-if="c.data.savedCarts.length > 0" class="list-group bundles-container" role="list" aria-labelledby="saved-bundles-header">
    <li class="list-group-item "
         ng-repeat="cart in c.data.savedCarts | orderBy: 'order'" role="listitem">
      <div class="row">
        <div class="col-sm-8 col-xs-7">{{cart.name}}</div>
        <div class="col-sm-4 col-xs-5 text-a-r">
            <button ng-click="c.removeBundle(cart)" class="btn-link no-padder" aria-label="${Remove} {{cart.name}} bundle">${Remove}</button>
            <span>|</span>
            <button id="open-cart-{{cart.sys_id}}" class="btn-link no-padder" ng-click="c.loadCart(cart)" aria-label="${Open} {{cart.name}} bundle">${Open}</button>
        </div>
      </div>
    </li>
  </ul>

  <script type="text/ng-template" id="myModalContent.html">
    <div class="modal-header">
        <h1 class="h3 modal-title">{{bundleName}}
	    <span class="text-base">
  		<i class="fa fa-close pull-right text-base" autofocus="true" tabindex="0" ng-click="$dismiss()" data-toggle="tooltip" data-placement="bottom" title="${Close modal}" aria-label="${Close modal}" role="button"></i>
   	    </span>
	</h1>
    </div>
    <div class="modal-body">
    	<div ng-if="cartCount > 0">
        <p><strong>${Replace Cart}</strong> ${will remove the current contents of your cart and replace it with the bundle.}</p>
        <p><strong>${Add to Cart}</strong> ${will add the contents of the bundle into your cart without removing its current contents.}</p>
      </div>
      <table id="cart" class="table table-hover table-condensed" aria-describedby="id-caption-bundles">
      	<caption class="h4" id="id-caption-bundles">${Items In Bundle}</caption>
        <thead>
          <tr>
            <th id="id-header-product" scope="col">${Product}</th>
            <th id="id-header-price" scope="col">${Price}</th>
            <th id="id-header-quantity" scope="col">${Quantity}</th>
            <th id="id-header-subtotal" scope="col">${Subtotal}</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="item in bundleItems track by item.sys_id | orderBy: 'order'">
            <td headers="id-header-product">
              <div class="row">
                <div class="col-sm-2 hidden-sm hidden-xs">
              	  <img ng-show="item.picture" ng-src="{{item.picture}}" alt="" class="img-responsive"/>
    		</div>
                <div class="col-sm-10 catalog-text-wrap">
                  <h4 class="nomargin">{{item.name}}</h4>
                  <p class="hidden-xs">{{item.short_description}}</p>
                </div>
              </div>
            </td>
            <td headers="id-header-price">
              <span ng-if="item.show_price">
                <strong>{{item.display_price}}</strong>
              </span>
              <div ng-if="item.show_recurring_price">
                <span class="sr-only">${Recurring price} {{item.display_recurring_price}} {{item.recurring_frequency_display}}</span>
              	<span aria-hidden="true">+ {{item.display_recurring_price}} {{item.recurring_frequency_display}}</span>
              </div>
            </td>
            <td headers="id-header-quantity">
              <span ng-if="item.show_quantity">
                <span>{{item.quantity}}</span>
              </span>
              <span ng-if="!item.show_quantity">
                <span class="sr-only">${Quantity not applicable}</span>
                <span aria-hidden="true">--</span>
              </span>
            </td>
            <td headers="id-header-subtotal">
              <span ng-if="item.show_price">
                <strong>{{item.subtotal_price}}</strong>
              </span>
              <div ng-if="item.show_recurring_price">
                <span class="sr-only">${Recurring subtotal price} {{item.recurring_subtotal_price}} {{item.recurring_frequency_display}}</span>
              	<span aria-hidden="true">+ {{item.recurring_subtotal_price}} {{item.recurring_frequency_display}}</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button ng-if="cartCount > 0" class="btn btn-default" ng-click="replaceCartWithBundle(cartID)">${Replace Cart}</button>
      <button class="btn btn-primary" ng-click="addBundleToCart(cartID)">${Add to Cart}</button>
    </div>
  </script>
</div>
