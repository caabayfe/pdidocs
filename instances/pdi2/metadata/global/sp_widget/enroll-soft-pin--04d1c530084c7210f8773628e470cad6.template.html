<div ng-if="!data.enrollmentEnabled" class="alert alert-warning">
    {{::data.disabledMessage}}
</div>
<div ng-if="data.enrollmentEnabled" class="panel panel-{{::options.color}} b">
    <div role="alert" class="alert alert-danger alert-dismissible" ng-if="c.error">
        <button type="button" class="close" ng-click="reloadPage()" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <span>{{c.resultMessage}}</span>
    </div>
    <div role="alert" class="info-msg alert alert-info alert-dismissible" ng-if="c.changeSuccess">
        <span>{{c.resultMessage}}</span>
    </div>
    <div class="panel-heading">
        <div ng-hide="c.changeSuccess || c.error">
            <h1 class="panel-title">
                <b>{{::data.enrollMsg}}</b>
            </h1>
        </div>
    </div>
    <div class="panel-body">
        <div ng-hide="c.changeSuccess || c.error">
            <label class="field-label" for="soft_pin">{{::data.softPinMsg}}</label>
            <div class="m-b-sm">
                <div class="input-group pin-group input-group-advanced">
                    <input id="soft_pin" name="soft_pin" class="form-control" ng-required="true" ng-keypress="c.message = ''" ng-click="c.message = ''" type="password" ng-model="c.soft_pin" autocomplete="off" />
                    <span class="input-advanced">
                        <button id="mask_icon" type="button" class="btn btn-default icon-preview input-group-append mask_btn sn-tooltip-basic" ng-Click="c.renderMaskIcon()" aria-label="${Show Password}" data-toggle="tooltip" data-container="body" data-original-title="${Show password}"></button>
                    </span>
                </div>
            </div>
            <div class="m-b-sm soft-pin-rules">
                <label class="field-label" for="soft_pin_rules">{{::data.softPinRulesMsg}}</label>
                <ul class="softpin-rules-list" ng-repeat="rule in data.softPinRules">
                    <li>{{rule}}</li>
                </ul>
            </div>
            <div class="m-b-sm err-hint" role="alert" ng-show="c.errorMessage() || c.resultMessage">
                <span class="text-danger">{{c.errorMessage()}}</span>
            </div>

            <div class="m-b-xl">
                <button type="submit" class="btn btn-primary pull-right m-b-lg m-t-sm" ng-disabled="c.disableSubmit()" id="submit" name="submit" ng-click="c.action()">${submit}</button>
            </div>
        </div>
    </div>
</div>
