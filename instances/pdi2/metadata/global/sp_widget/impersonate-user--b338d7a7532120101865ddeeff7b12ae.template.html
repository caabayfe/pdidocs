<div class="container-fluid" ng-init="getRecentImpersonation()">
  <div class="row">
    <div class="record-picker">
      <sn-reference-picker field="c.data.toImpersonate" ref-table="sys_user" display-column="name" sn-on-change="impersonate(c.data.toImpersonate.value)"
                           sn-options="{placeholder:'${Search for user}'}" sn-page-size="20" additional-display-columns="user_name"
                           ed="{searchField:'name;sys_id;user_name',for_impersonation:true, reference:'sys_user', qualifier:'active=true^locked_out=false^ORlocked_outISEMPTY^web_service_access_only=false^ORweb_service_access_onlyISEMPTY'}" >
      </sn-reference-picker>
    </div>
  </div>
  <div class="row top-buffer">
    <div class="panel panel-default" ng-if="recentImpersonations.length > 0 || false">
      <div class="panel-heading">
        <h4 class="panel-title h5">
          ${Recent Impersonations}
        </h4>
      </div>
      <a ng-if="c.data.realUser != null" ng-bind="c.data.realUserDisplayName" href="javascript:void(0)" class="list-group-item ng-binding ng-scope" ng-click="impersonate(c.data.realUser)"></a>
      <a ng-bind="rec.user_display_value" ng-repeat="rec in recentImpersonations" href="javascript:void(0)" class="list-group-item ng-binding ng-scope"
         ng-click="impersonate(rec.user_sys_id)"></a>
    </div>
  </div>
</div>
