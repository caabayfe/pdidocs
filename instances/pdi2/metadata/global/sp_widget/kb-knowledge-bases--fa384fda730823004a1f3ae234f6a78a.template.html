<div ng-if="c.data.kbArr.length > 2" ng-class="{'hidden-xs' : hideCategoryWidgetInXS}" class="panel panel-{{::options.color}} category-widget no-border">
  <div class="panel-primary panel-heading">
    <h2 class="h4 panel-title" ng-bind="::c.options.title">
    </h2>
  </div>
  <div class="list-group category-list">
    <div class="list-group-item text-overflow-ellipsis" ng-include="'kb-template.html'"></div>
  </div>
</div>
<script type="text/ng-template" id="kb-template.html">
  <select id="kbSelect" class="sn-select-basic" ng-change="changeKB(selectedKB)" ng-model="selectedKB" ng-options="kb.title for kb in c.data.kbArr" autofocus="true" role="combobox" ng-attr-aria-expanded="{{isExpanded}}">
</select>
</script>
