<span class="fa fa-asterisk mandatory" title="${Reason for rejection}">
	    <span class="sr-only">${Reason for rejection}</span>
    </span>
    <label for="rejection-comment">
        ${Reason for rejection}
    </label>
    <textarea id="rejection-comment" ng-model="comment" ng-style="{'resize': 'vertical'}" ng-change="mandatoryComment()" ng-required="true" class="form-control" ng-class="{'has-error' : isCommentEmpty}"></textarea>
    <div ng-if="isCommentEmpty" class="error-message">
        ${Comment is mandatory to reject a record}
    </div>
