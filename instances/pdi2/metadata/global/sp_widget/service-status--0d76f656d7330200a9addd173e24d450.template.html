<div ng-if="data.service" class="panel panel-{{::c.options.color}} b">
  <div class="panel-heading">
    <h2 class="panel-title">{{::c.data.serviceDisplay}} <span class="text-muted">(${last 90 days})</span></h2>
  </div>
  <div class="panel-body">
    <div class="description">${Color bar indicators flow left to right, from oldest to most recent status}
      <span role="button" data-toggle="tooltip" data-placement="right" tabindex="0" class="fa fa-question-circle nav-help-msg" title="{{c.data.navHelpMsg}}" aria-label="{{c.data.navHelpMsg}}"></span>
    </div>
    <ul class="pills-group">
      <li ng-repeat="day in ::c.data.days" ng-switch="day.id">
        <div role="img" ng-style="::{'background-color': day.color}" ng-class="[(day.count > 0) ? 'multiple-issues' : '', day.id]" class="day status-img" data-toggle="tooltip" data-placement="top" title="{{::day.msg}} {{::day.date}}"  aria-label="{{::day.msg}} {{::day.date}}" tabindex="{{::$last ? 0 : -1}}">
          <i aria-hidden="true" ng-switch-when="no-issues" class="fa fa-check"></i>
          <i aria-hidden="true" ng-switch-when="planned-maintenance" class="fa fa-info"></i>
          <i aria-hidden="true" ng-switch-when="outage" class="fa fa-exclamation"></i>
          <i aria-hidden="true" ng-switch-when="degredation" class="fa fa-minus"></i>
          <i aria-hidden="true" ng-switch-when="multiple" class="fa fa-plus"></i>
        </div>
      </li>
    </ul>
  </div>
</div>
