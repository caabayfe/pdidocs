<div class="container">
  <div class="row">
    <div class="col-sm-8">
      <div class="panel panel-default domain-settings" aria-label=".">
        <div class="panel-heading">
          <h3>Configure Domain Center</h3>
        </div>
        
        <div class="panel-body">
          <div>
            <label><strong>Data separation: </strong></label>
            <label>{{c.data.data_separation == 'true' ? 'Enabled' : 'Disabled'}}</label>
          </div>
          <div>
            <label><strong>Process separation: </strong></label>
            <label>{{c.data.process_separation == 'true' ? 'Enabled' : 'Disabled'}}</label>
          </div>
          <div>
            <label><strong>Enables detail domain logging </strong></label>
          </div>
          <div>
            <div>
            	<input type="radio" name="verbose" ng-model="c.data.verboseLogging" ng-value="'true'" ng-checked="c.data.verboseLogging == 'true'"/>
            	<label>Yes</label>
            </div>
            <div>
            	<input type="radio" name="verbose" ng-model="c.data.verboseLogging" ng-value="'false'" ng-checked="c.data.verboseLogging == 'false'"/>
            	<label>No</label>
            </div>
          </div>
        </div>
        <div class="panel-body">
          <div class="row">
            <h4 class="panel-title">Select tables that are to be used by large table audits</h4>
          </div>
          <div class="row">
            <div class="col-lg-12 col-md-12">
              <div class="col-lg-5 col-md-5">
                <label>Available </label>
                <select multiple size="10" class="form-control" aria-label="List of long running tables" ng-model="c.data.tables_to_be_shown">
                  <option ng-repeat="table in c.data.tables track by table.name" >{{table.name}}</option>
                </select>
              </div>
              <div class="col-lg-2 col-md-2 text-center pt-50">
                <div class="domain-settings-controls">
                  <button class="btn btn-default" ng-click="c.addTable()" aria-label="Move table from available list to selected list">
                  	 <i class="fa fa-chevron-right"></i>
                  </button>
                  <button class="btn btn-default mt-10" ng-click="c.removeTable()" aria-label="Move table from selected list to available list">
                     <i class="fa fa-chevron-left"></i>
                  </button>
                </div>
              </div>
              <div class="col-lg-5 col-md-5">
                <label>Selected </label>
                <select multiple size="10" class="form-control" aria-label="List of selected tables"  ng-model="c.data.selected_tables">
                  <option ng-disabled="table.isSNBigTable" ng-repeat="table in c.data.selectedTables track by table.name" >{{table.name}}</option>
                </select>
              </div>
            </div>
            <div class="col-lg-12 col-md-12 text-center pt-10">
              <span class="text-danger" ng-show="c.table_required" role="alert" id="validation-large-tables">Out of box, cmdb, task, task_sla and sys_email are considered big tables, and are required</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="panel panel-default domain-settings-update" aria-label=".">
        <button name="update" ng-click="c.update()" class="btn btn-primary domain-settings-update-button">
          Update
        </button>
      </div>
    </div>
  </div>
</div>
