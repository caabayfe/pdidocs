comments: |-
  Start Listener action appears when the LDAP Server definition is active (active = true) AND the Listener is inactive (listener = false) AND there is no active listener thread
  			
  			Note:  For clustered environments we will start the listener on the system specified in the System ID field of the LDAP Configuration record.
  			
  			Action sets the Listener field to true, updates the current record and returns the user to the server definition form
  			
  			A business rule (Start/Stop Listener) takes action based on the current active/listener field values to Start the appropriate listener thread
condition: current.canRead() && current.active && !current.listener && !(new LDAPUtils().hasListener(current))
