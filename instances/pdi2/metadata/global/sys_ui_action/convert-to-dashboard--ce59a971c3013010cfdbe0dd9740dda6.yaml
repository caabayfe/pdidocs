action_name: convert_to_dashboard
active: 'true'
client: 'true'
comments: |-
  The condition below checks if a given sys_portal_page (based on its sys id) can be converted to a Responsive Dashboard.
  Converting Criteria: if the page is a homepage (personal or public) without an already associated Responsive Dashboard or Tab

  Criteria Details:
  	- personal homepage => has a user associated and has no view
  	- global homepage => has no user associated and has a view
  	- the homepage is not associated with Pa Dashboard or PA tab

  => basically we allow converting homepage to a dashboard if it is neither a tab nor associated with a dashboard
  @return true if the homepage can be converted to Dashboards, otherwise, false

  keep in mind:
  - Homepages that have already associated dashboards will be skipped (no additional dashboards will be created and they will not be included in the constructed link)
  - When creating the dashboards we are migrating the permissions of the homepage also - and we store them in the dashboard permissions table
condition: 'new SNC.PortalPagesMigration().canConvertHomepageToDashboard(current.sys_id) '
