action_name: unify_actions
active: 'true'
client: 'false'
comments: |-
  This will merge Form Action Layout Items, Global UI Actions, and Global DAs into a single consolidated list. 
  This will make it easy to control the display of actions in the layout including order, hiding, and color treatment. 
  After merging, actions will no longer automatically be inherited. This means new global actions will need to be manually added to the layout. This cannot be undone.
condition: current.isValidRecord() && current.canWrite() && current.use_layout_items_only == false
