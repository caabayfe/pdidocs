<div ng-if="item.type == 'sc'" class="sc">
  <a href="{{item.url}}" ng-attr-target="{{item.legacy == 'true' && item.portal == 'catalog' ? '_blank' : ''}}" class="h4 text-primary m-b-sm block catalog-description-wrapper" onclick="window.GlideWebAnalytics.trackEvent('Service Catalog', 'Catalog Search Results Page', 'Item Clicked');">
    <i ng-if="item.picture" class="ta-img" style="background-image:url('{{item.picture}}?t=small')"></i>
    <i ng-if="!item.picture && item.icon" class="ta-icon" style="background-image:url('{{item.icon}}');"></i>
    <i ng-if="!item.picture && !item.icon" class="ta-icon fa fa-shopping-cart"></i>
    <span ng-bind-html="highlight(escapeHTML(item.name), escapeHTML(data.q))" class="item-name"></span>
  </a>
  <div ng-style="getBGImage(item)" ng-if="item.picture" class="img-responsive m-r item-image pull-left"></div>
  <p ng-bind-html="highlight(escapeHTML(item.short_description), escapeHTML(data.q))"></p>
  <span class="text-muted m-r-sm" ng-if="data.showPrices && item.price != '$0.00'">{{item.price}}</span>
</div>

<div ng-if="item.type == 'sc_content'">
  <h4>
    <a ng-if="item.content_type == 'external' || (item.content_type == 'dynamic' && !item.portalUrl)" ng-href="{{::item.url}}" target="_blank" class="m-b-sm block" onclick="window.GlideWebAnalytics.trackEvent('Service Catalog', 'Catalog Search Results Page', 'Item Clicked');">
      <span ng-bind-html="highlight(escapeHTML(item.name), escapeHTML(data.q))"></span> ➚
    </a>
    <a ng-if="item.content_type == 'dynamic' && item.portalUrl" ng-href="{{::item.portalUrl}}" class="m-b-sm block" onclick="window.GlideWebAnalytics.trackEvent('Service Catalog', 'Catalog Search Results Page', 'Item Clicked');">
      <span ng-bind-html="highlight(escapeHTML(item.name), escapeHTML(data.q))"></span>
    </a>
    <a ng-if="item.content_type == 'kb'" ng-href="?id=kb_article&sys_id={{::item.kb_article}}" class="m-b-sm block" onclick="window.GlideWebAnalytics.trackEvent('Service Catalog', 'Catalog Search Results Page', 'Item Clicked');">
      <i class="fa m-r-sm fa-file-text-o"></i>
      <span ng-bind-html="highlight(escapeHTML(item.name), escapeHTML(data.q))"></span>
    </a>
    <a ng-if="item.content_type == 'literal'" ng-href="?id={{item.page}}&sys_id={{item.sys_id}}" class="m-b-sm block" onclick="window.GlideWebAnalytics.trackEvent('Service Catalog', 'Catalog Search Results Page', 'Item Clicked');">
      <i class="fa m-r-sm fa-file-text-o"></i>
      <span ng-bind-html="highlight(escapeHTML(item.name), escapeHTML(data.q))"></span>
    </a>
  </h4>
  <div ng-style="getBGImage(item)" ng-if="item.picture" class="img-responsive m-r item-image pull-left"></div>
  <p ng-bind-html="highlight(escapeHTML(item.short_description), escapeHTML(data.q))"></p>
</div>
