schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	validateRegex(regexId: String!, value: String!): RegexInfo,
  	validateVariableRegex(questionId: String!, value: String!): RegexInfo,
  	getTopicDetails(topicIds: [String]!): [TopicDetails!],
  	getQuestionDetails(questionId: String!): QuestionDetails!,
  	getAIInferredDetails(documentId: String, catItemRef: String, actionType: String): AIInferredDetails
  }

  type RegexInfo {
  	result: Boolean,
  	errMsg: String
  }

  type Mutation {
  	saveProducer(recordProducerId: String!, requestBody: ProducerRequestBody): ProducerResponseObject,
  	submitProducer(recordProducerId: String!, requestBody: ProducerRequestBody): ProducerResponseObject
  }

  input ProducerRequestBody {
  	sysparm_edit_mode: String,
  	sysparm_item_guid: String,
  	sysparm_target_id: String,
  	variables: [KeyValue!],
  	parent_params: ProducerParentParams,
  	additional_params: [KeyValue!],
  }

  input KeyValue {
  	name: String!,
  	value: String!
  }

  input ProducerParentParams {
  	sysparm_parent_table: String,
  	sysparm_parent_sys_id: String
  }

  type ProducerResponse {
  	sys_id: String,
  	number: String,
  	record: String,
  	redirect_portal_url: String,
  	redirect_url: String,
  	table: String,
  	redirect_to: String,
  	parent_id: String,
  	parent_table: String
  }

  type ProducerResponseObject {
  	success: Boolean,
  	data: ProducerResponse,
  	message: String
  }

  type TopicDetails {
  	value: String!,
  	displayValue: String,
  	canRead: Boolean!,
  	active: String
  }

  type QuestionChoices{
  	value: String!,
  	displayValue: String!
  }

  type QuestionDetails{
  	type: String!,
  	internalType: Int!,
  	name: String!,
  	validateRegex: String,
  	choices: [QuestionChoices],
  	referringRecordId: String,
  	referringTable: String!,
  	targetRecordId: String!,
  	reference: String,
  	referenceDisplayField: String,
  	listTable: String,
  	listTableDisplayField: String,
  	refQualifier: String,
  }

  type AIInferredDetails {
  	hasAiInferredValue: Boolean
  }
