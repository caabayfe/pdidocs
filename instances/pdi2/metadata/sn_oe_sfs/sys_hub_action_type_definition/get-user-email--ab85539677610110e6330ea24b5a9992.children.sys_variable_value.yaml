  value: |-
    (function execute(inputs, outputs) {
      // 201 is created
      if(inputs.statusCode == 200) {
        var responseBody = JSON.parse(inputs.responseBody);
        gs.info("----> CC email - responseBody " + inputs.responseBody);
        outputs.email = responseBody.mail;
        outputs.status = "Success";
      } else {
        gs.error("Collab: failed get message! Status: " + inputs.statusCode + 
                 "\nMS Graph API Response: " + inputs.responseBody);
        outputs.status = "Error: " + inputs.responseBody;
      } 
    })(inputs, outputs);
