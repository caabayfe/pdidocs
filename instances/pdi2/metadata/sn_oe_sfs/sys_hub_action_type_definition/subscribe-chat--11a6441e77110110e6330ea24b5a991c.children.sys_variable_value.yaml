    (function execute(inputs, outputs) {
        var gtd = new GlideDateTime();
        gtd.addSeconds(3600); // only 1 hour is supported right now
        var utcDateTime = gtd.getValue();
        var dateArray = utcDateTime.split(" ");
        var expiration = dateArray[0] + "T" + dateArray[1] + "Z";   
        var clientState = inputs.clientState;
        
        inputs.subscriptionRequest.expirationDateTime = expiration;
        inputs.subscriptionRequest.clientState = sn_fd.GlideActionUtil.setEncryptedOutput(inputs.clientState);
      
    	outputs.payload = JSON.stringify(inputs.subscriptionRequest);
    })(inputs, outputs);
