  value: |-
    (function execute(inputs, outputs) {
        if (inputs.status == 200) {
            var res = JSON.parse(inputs.responseBody);
            outputs.status = "Success";
            outputs.users = res.value;
            var nextLink = res["@odata.nextLink"];
            outputs.skip_token = getSkipToken(nextLink);
        } else {
            outputs.error_message = inputs.responseBody;
            outputs.status = "Error";
        }
    })(inputs, outputs);

    function getSkipToken(nextLink) {
      if (nextLink) {
        var skipTokenParamArr = nextLink.split("&").filter(function(s) { return s.startsWith("$skiptoken=") });
        if (skipTokenParamArr.length > 0) {
          return skipTokenParamArr[0].substring(11); //length of '$skiptoken='
        }
      }
      return null;
    }
