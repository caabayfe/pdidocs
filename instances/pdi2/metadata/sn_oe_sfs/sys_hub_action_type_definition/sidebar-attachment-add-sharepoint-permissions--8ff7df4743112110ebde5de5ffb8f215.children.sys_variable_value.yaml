  value: |-
    (function execute(inputs, outputs) {
      var collabMembers = [];
      var memberGr = new GlideRecord('sys_cs_collab_member')
      memberGr.addQuery('collab_chat', inputs.collabChatId);
      memberGr.addActiveQuery();
      memberGr.query();

      while(memberGr.next()) {
        collabMembers.push(memberGr.getValue('collab_user'));
      }

      var recipients = []
      var userProfileGr = new GlideRecord('sys_cs_collab_provider_user_profile');
      userProfileGr.addQuery('collab_user', 'IN', collabMembers.toString());
      userProfileGr.addQuery('provider.name','Teams Provider');
      userProfileGr.addActiveQuery();
      userProfileGr.setLimit(collabMembers.length)
      userProfileGr.query();

      while(userProfileGr.next()) {
        var recipient = {email: userProfileGr.getValue('provider_user_id')};
        recipients.push(recipient);
      }

      var payload = {
        recipients: recipients,
        requireSignIn: true,
        roles: ["read"]
      }
      outputs.payload = JSON.stringify(payload);
    })(inputs, outputs);
