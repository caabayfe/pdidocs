  value: |-
    (function execute(inputs, outputs) {
      //200 existing link returned
      //201 new link generated
      gs.info('Permission Inputs - ' + JSON.stringify(inputs));
      if(inputs.statusCode == 201 || inputs.statusCode == 200) {
        outputs.status = 'Success';
      } else {
      	var responseBody = inputs.responseBody;
        gs.error("Collab: Failed add sharepoint permissions! Status: " + inputs.statusCode + 
                 "\nMS Graph API Response: " + responseBody);
        outputs.status = 'Error: ' + responseBody;
        outputs.error_message = 'Error Code: ' + inputs.errorCode + ' - Error Message: ' + inputs.errorMessage;
      }
    })(inputs, outputs);
