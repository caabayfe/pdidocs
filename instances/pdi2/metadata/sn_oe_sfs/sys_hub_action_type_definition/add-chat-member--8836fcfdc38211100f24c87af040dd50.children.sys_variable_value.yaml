  value: |-
    (function execute(inputs, outputs) {
        outputs.actiontype = "ADD_CHAT_MEMBER";
    	if(inputs.statusCode == 201) {
          outputs.status = "Success";
          var responseHeader = JSON.parse(inputs.responseHeader);
          var locations = responseHeader.Location[0].split('/');
          outputs.membership = locations[locations.length - 1];
        } else {
          outputs.status = "Error";
        }
    })(inputs, outputs);
