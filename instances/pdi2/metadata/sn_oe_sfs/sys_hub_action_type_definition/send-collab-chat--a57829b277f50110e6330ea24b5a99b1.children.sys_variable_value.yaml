  value: |-
    (function execute(inputs, outputs) {
      // 201 is created
      if(inputs.statusCode == 201) {
        var responseBody = JSON.parse(inputs.responseBody);
        outputs.message_id = responseBody.id;
        outputs.web_url = responseBody.webUrl;
        outputs.created = responseBody.created;
        outputs.modified = responseBody.modified;
        outputs.status = "Success";
      } else {
        gs.error("Collab: Failed chat create! Status: " + inputs.responseStatus + 
                 "\nMS Graph API Response: " + inputs.responseBody);
        outputs.status = "Error: " + inputs.responseBody;
      }
      outputs.actiontype = "SEND_MESSAGE";
    })(inputs, outputs);
