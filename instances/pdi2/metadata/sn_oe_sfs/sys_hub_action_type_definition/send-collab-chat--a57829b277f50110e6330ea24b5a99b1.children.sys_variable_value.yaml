  value: |-
    (function execute(inputs, outputs) {  
      var attachments = [];
      if(inputs.attachments) {
        attachments = JSON.parse(inputs.attachments).attachments;
      }
      
    	var v1Payload = {
          messageType: "message",
          body: {
              contentType: inputs.contentType,
              content: inputs.content
          },
          attachments: attachments
    	};
      outputs.payload = JSON.stringify(v1Payload);
      var betaPayload = {};
      if (inputs.message_ids.length !== 0){
            var betaPayload = {
            messageIds: inputs.message_ids,
            replyMessage: {
              body: {
                content: inputs.content,
            }
          }
        };
        outputs.payload = JSON.stringify(betaPayload);
      }
    })(inputs, outputs);
