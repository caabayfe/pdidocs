  value: |-
    (function execute(inputs, outputs) {
      //200 existing file is uploaded
      //201 new file is uploaded
      if(inputs.statusCode == 201 || inputs.statusCode == 200) {
        var pattern = /[^{\}]+(?=})/g;
        var responseBody = JSON.parse(inputs.responseBody);
        var id = responseBody.eTag.match(pattern)[0];
        var contentType = 'reference';
        var contentUrl = new sn_oe_sfs.CollabChatUtils().truncateAttachmentUrlParams(responseBody.webUrl);
    	var name = responseBody.name;    

        var sharepoint_attachment = {
        	id: id,
          	contentType: contentType,
          	contentUrl: contentUrl,
          	name: name
        }
        outputs.drive_item_id = responseBody.id;
        outputs.sharepoint_attachment = JSON.stringify(sharepoint_attachment);
        outputs.status = 'Success';
      } else {
      	var response = JSON.parse(inputs.responseBody)
        gs.error('Collab: Failed to upload sharepoint file! Status: ' + inputs.statusCode + 
                 '\nMS Graph API Response: ' + inputs.responseBody);
        outputs.status = 'Error: ' + inputs.responseBody;
        outputs.error_message = 'Error Code: ' + inputs.errorCode + ' - Error Message: ' + inputs.errorMessage;
      }
    })(inputs, outputs);
