  value: |-
    (function execute(inputs, outputs) {
      var response = JSON.parse(inputs.responseBody);
      outputs.status_code = inputs.statusCode;
      
      if (inputs.statusCode == 200) {
        var subscriptions = [];
        for(var i=0; i<response.value.length; i++) {
          if (response.value[i].applicationId == inputs.applicationID)
            subscriptions.push(response.value[i]);
        }
        outputs.subscriptions = JSON.stringify(subscriptions);
      } else {
        gs.error('Collab: failed to get chat subscription! status: ' + inputs.statusCode);
      }
    })(inputs, outputs);
