  value: |-
    (function execute(inputs, outputs) {
      var responseBody = inputs.responseBody;
      if(inputs.statusCode == 200) {
        var responseBodyObj = JSON.parse(responseBody);
        outputs.upload_url = responseBodyObj.uploadUrl;
        outputs.expiration_date_time = responseBodyObj.expirationDateTime;
        outputs.session_created = true;
      } else {
        gs.error('Collab: Failed to create SharePoint Upload Session! Status: ' + inputs.statusCode +
                 '\nMS Graph API Response: ' + responseBody);
        outputs.status = 'Error: ' + responseBody;
        outputs.error_message = 'Error Code: ' + inputs.errorCode + ' - Error Message: ' + inputs.errorMessage;
        outputs.session_created = false;
      }
    })(inputs, outputs);
