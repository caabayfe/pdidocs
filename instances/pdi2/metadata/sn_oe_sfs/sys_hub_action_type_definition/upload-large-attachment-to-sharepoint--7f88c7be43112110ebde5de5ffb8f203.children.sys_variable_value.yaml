  value: |-
    (function execute(inputs, outputs) {
      setAttachmentFlowActionOutputs(uploadLargeAttachment(inputs), outputs);
    })(inputs, outputs);

    function uploadLargeAttachment(inputs) {
      var fragmentCount = inputs.fragmentCount;
      var attachmentSysId = inputs.attachmentSysId;
      var attachmentGr;

      inputs.bytesPending = inputs.fileSize;
      inputs.bytesProcessed = 0;

      var response;

      if(fragmentCount > 1) {
        attachmentGr = readAttachmentGlideRecord(attachmentSysId)
      }

      for(var i = 0; i < fragmentCount;) {
        if(fragmentCount == 1) {
          return uploadToUploadSession(inputs.uploadUrl, inputs.contentLength, inputs.contentRange, attachmentSysId, true);
        } else {
          response = uploadAttachmentFragment(i, inputs, attachmentGr);
          if(response.status == 'Success') {
            if(!( ( fragmentCount - i ) == 1 )) {
              var contentLength = parseInt(response.contentLength);
              inputs.bytesPending = inputs.bytesPending - contentLength;
              inputs.bytesProcessed = inputs.bytesProcessed + contentLength;
              i++;
            } else {
              return response;
            }
          } else {
            return response;
          }
        }
      }
    }

    function readAttachmentGlideRecord(attachmentSysId) {
      attachmentGr = new GlideRecord('sys_attachment');
      attachmentGr.get(attachmentSysId);
      return attachmentGr;
    }

    function uploadAttachmentFragment(currentCounter, inputs, attachmentGr) {
      var fragmentCount = inputs.fragmentCount;
      var maxFragmentSize = inputs.maxFragmentSize;
      var fileSize = inputs.fileSize;

      var bytesProcessed = inputs.bytesProcessed;

      var contentLength = setContentLength(currentCounter, fragmentCount, maxFragmentSize, inputs.bytesPending);
      var contentRange = setContentRange(currentCounter, fragmentCount, maxFragmentSize, bytesProcessed, fileSize);
      var tempAttachmentSysId = generateTemporaryAttachment(currentCounter, fragmentCount, attachmentGr, bytesProcessed, maxFragmentSize, fileSize);

      response = uploadToUploadSession(inputs.uploadUrl, contentLength, contentRange, tempAttachmentSysId, false);
      deleteTemporaryAttachment(tempAttachmentSysId);

      return response;
    }

    function uploadToUploadSession(uploadUrl, contentLength, contentRange, attachmentSysId, isSingleUpload) {
      var request = new sn_ws.RESTMessageV2();
      request.setEndpoint(uploadUrl);
      request.setHttpMethod('PUT');
      request.setRequestHeader('Content-Length', contentLength);
      request.setRequestHeader('Content-Range', contentRange);
      request.setRequestBodyFromAttachment(attachmentSysId);
      var response = request.execute();

      if(checkResponseStatus(response.getStatusCode())) {
        response.status = 'Success';
        if(!isSingleUpload) {
          response.contentLength = contentLength;
        }
        return response;
      }
      response.status = 'Fail';
      return response;
    }

    function setContentLength(currentCounter, fragmentCount, maxFragmentSize, bytesPending) {
      var contentLength;

      if( (fragmentCount - currentCounter) > 1 ) {
        return contentLength = maxFragmentSize;
      }
      return contentLength = bytesPending;
    }

    function setContentRange(currentCounter, fragmentCount, maxFragmentSize, bytesProcessed, fileSize)  {
      var contentRange;

      if( (fragmentCount - currentCounter) > 1 ) {
        return contentRange = 'bytes ' + bytesProcessed + '-' + ( ( maxFragmentSize * (currentCounter + 1) ) - 1 ) + '/' + fileSize;
      }
      return contentRange = 'bytes ' + bytesProcessed + '-' + ( fileSize - 1 ) + '/' + fileSize;
    }

    function generateTemporaryAttachment(currentCounter, fragmentCount, attachmentGr, bytesProcessed, fragmentSize, fileSize) {
      if( (fragmentCount - currentCounter) > 1 ) {
        return new global.CollabChatGlobalUtils().createAttachmentFromBinaryData(attachmentGr, bytesProcessed, fragmentSize);
      } else {
        return new global.CollabChatGlobalUtils().createAttachmentFromBinaryData(attachmentGr, bytesProcessed, fileSize);
      }
    }

    function checkResponseStatus(statusCode) {
      if(statusCode == 202 || statusCode == 201 || statusCode == 200) {
        return true;
      }
      return false;
    }

    function deleteTemporaryAttachment(tempAttachmentSysId) {
      new GlideSysAttachment().deleteAttachment(tempAttachmentSysId);
    }

    function setAttachmentFlowActionOutputs(response, outputs) {
      var responseBody = response.getBody();

      if(response.status == 'Success') {
        var responseBodyObj = JSON.parse(responseBody);
        var pattern = /[^{\}]+(?=})/g;
        var id = responseBodyObj.eTag.match(pattern)[0];
        var contentType = 'reference';
        var contentUrl = new sn_oe_sfs.CollabChatUtils().truncateAttachmentUrlParams(responseBodyObj.webUrl);
        var name = responseBodyObj.name;

        var sharepoint_attachment = {
          id: id,
          contentType: contentType,
          contentUrl: contentUrl,
          name: name
        }
    	outputs.drive_item_id = responseBodyObj.id;
        outputs.sharepoint_attachment = JSON.stringify(sharepoint_attachment);
        outputs.upload_complete = true;
      } else {
          gs.error('Collab: Failed to upload to session! Status: ' + response.statusCode +
                 '\nMS Graph API Response: ' + responseBody);
        outputs.status = 'Error: ' + responseBody;
        outputs.error_message = 'Error Code: ' + response.getErrorCode() + ' - Error Message: ' + response.getErrorMessage();
        outputs.upload_complete = false;
      }
    }
