  value: |-
    (function execute(inputs, outputs) {
        var payload = {
            channel: inputs.chatId,
            ts: inputs.messageId,
            text: inputs.content
        }

        var attachments = inputs.attachments;

        if (attachments != null && attachments.length > 0)
            payload.attachments = attachments;

        outputs.payload = JSON.stringify(payload);
    })(inputs, outputs);
