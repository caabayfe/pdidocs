  value: |-
    (function execute(inputs, outputs) {
     
    	var chatId = inputs.collabchatsysid;
    	var members = sn_collab.CollabChatScriptObject.getCollabChatMembers(chatId, 0);

    	for (var i = 0; i < members.length; ++i) {
    		var member =  members[i];
    		var userSysId = member['userSysId'];

    		if (userSysId != null && userSysId.length > 0 && !sn_collab.CollabChatScriptObject.hasPermission(userSysId, inputs.documenttable, inputs.documentid)) {
    			sn_collab.CollabChatScriptObject.removeMemberFromChat(chatId, userSysId, member['collabUser'], inputs.token);
    		}
    	}
    })(inputs, outputs);
