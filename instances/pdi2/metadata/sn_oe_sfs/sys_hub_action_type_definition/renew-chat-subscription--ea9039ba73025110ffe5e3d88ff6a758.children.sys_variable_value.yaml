  value: |-
    (function execute(inputs, outputs) {
    	var util = new sn_oe_sfs.CollabChatUtils();
        inputs = util.trimStringInputs(inputs);
        var mandatoryInputs = {
            subscription_id: "Subscription ID",
            expiration_date_time: "Expiration Date Time",
        };

        util.checkMandatoryInputs(inputs, mandatoryInputs);
        var subscriptionPayload = {};
        var expirationDateTime = util.convertDateToUTC(inputs.expiration_date_time);
        var encryptionCertificate = inputs.encryption_certificate;
        var encryptionCertificateId = inputs.encryption_certificate_id;


        if (inputs.expiration_date_time) {
            if (util.validateDate(inputs.expiration_date_time.toString().trim())) {
                subscriptionPayload["expirationDateTime"] = expirationDateTime;
            } else {
                throw new Error("Date Time format is not valid. Provide Expiration Date Time in valid date time format (yyyy-mm-dd hh:mm:ss).");
            }
        }
        
        if (encryptionCertificate && encryptionCertificateId) {
            subscriptionPayload["encryptionCertificate"] = encryptionCertificate;
            subscriptionPayload["encryptionCertificateId"] = encryptionCertificateId;
        } 
        outputs.payload = JSON.stringify(subscriptionPayload);
        outputs.subscription_id = inputs.subscription_id;
    })(inputs, outputs);
