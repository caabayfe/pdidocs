  value: |-
    (function execute(inputs, outputs) {
        var payload = {chatType: inputs.chatType,
                         members: []
                        };
        if (inputs.title) {
          payload.topic = inputs.title.replaceAll(':', '-');
        }
        for (var userIndex = 0; userIndex < inputs.userList.length; ++userIndex) {
          payload.members[userIndex] = {
            '@odata.type': '#microsoft.graph.aadUserConversationMember',
            roles: ['owner'],
            'user@odata.bind': "https://graph.microsoft.com/v1.0/users('" + inputs.userList[userIndex] + "')"};
        }
        outputs.payload = JSON.stringify(payload);
    })(inputs, outputs);
