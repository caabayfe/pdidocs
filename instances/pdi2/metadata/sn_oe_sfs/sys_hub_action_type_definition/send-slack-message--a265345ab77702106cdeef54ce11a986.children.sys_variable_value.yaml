  value: |-
    (function execute(inputs, outputs) {
        var payload = {};

        payload.channel = inputs.channel;
        payload.text = inputs.text;

        if (inputs.parentMsgExternalId != '') {
            payload.thread_ts = inputs.parentMsgExternalId;
        }

        var attachments = inputs.attachments;

        if (attachments != null && attachments.length > 0){

    		payload.blocks = [];
    		setTimeout(() => {
         	console.log("Wait slack to process attachment");
       }, 5000);
    		var attachmentsArray = JSON.parse('[' + attachments + ']');
    		attachmentsArray.forEach(attachmentArray => {
    		const isImage = attachmentArray.name.includes('.png') || attachmentArray.name.includes('.jpg')
    						attachmentArray.name.includes('.jpeg') || attachmentArray.name.includes('.jif');
    		if (isImage){
    			const imageBlock = {
    				"type": "image",
    				"title": {
    					"type": "plain_text",
    					"text": attachmentArray.title,
    				},
    				"block_id": attachmentArray.name,
    				"slack_file": {
    					"url": attachmentArray.url_private,
    				},
    				"alt_text": attachmentArray.name
    			}
    			const textBlock = 	{
    			"type": "rich_text",
    			"elements": [
    				{
    					"type": "rich_text_section",
    					"elements": [
    						{
    							"type": "text",
    							"text": inputs.text
    						}
    					]
    				}
    			]
    		}
    			payload.blocks.push(imageBlock, textBlock);
    		} else {
    			payload.text += " "+ attachmentArray.permalink; 
    		}
    		
    	})
    }   
        outputs.payload = payload;
    })(inputs, outputs);
