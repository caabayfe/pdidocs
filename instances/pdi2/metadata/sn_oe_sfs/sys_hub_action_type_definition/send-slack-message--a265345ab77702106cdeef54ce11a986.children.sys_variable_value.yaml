  value: |-
    (function execute(inputs, outputs) {
        if(inputs.statusCode == 200) {
            var responseBody = JSON.parse(inputs.responseBody);
            outputs.message_id = responseBody.ts;
            outputs.status = "Success";
      } else {
            gs.error("Collab: Failed to create a slack conversation! Status: " + inputs.responseStatus + 
                 " Slack API Response: " + inputs.responseBody);
        outputs.status = "Error: " + inputs.responseBody;
      }
      outputs.actiontype = "SEND_MESSAGE";
    })(inputs, outputs);
