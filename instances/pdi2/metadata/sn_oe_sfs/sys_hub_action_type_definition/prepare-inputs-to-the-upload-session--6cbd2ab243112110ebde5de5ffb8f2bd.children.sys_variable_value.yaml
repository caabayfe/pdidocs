  value: |-
    (function execute(inputs, outputs) {
      var fileSize = inputs.fileSize;

      if(inputs.fragmentCount == 1) {
        setupInitialPayload(fileSize, fileSize);
      }

      function setupInitialPayload(fragmentSize, fileSize) {
        outputs.content_length = fragmentSize;
        outputs.content_range = 'bytes 0-' + (fragmentSize - 1) + '/' + inputs.fileSize;
      }
    })(inputs, outputs);
