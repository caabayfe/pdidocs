  value: |-
    (function execute(inputs, outputs) {
        if (inputs.statusCode == 200) {
            var responseBody = JSON.parse(inputs.responseBody);
            var file = responseBody.files && responseBody.files.length > 0 ? responseBody.files[0] : {};
            outputs.slack_attachment = JSON.stringify(file);
            outputs.status = 'Successful';
        } else {
            outputs.status = 'Error';
            outputs.error_message = 'Error Code: ' + inputs.errorCode + ' - Error Message: ' + inputs.errorMessage;
        }

    })(inputs, outputs);
