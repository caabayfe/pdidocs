  value: |-
    (function execute(inputs, outputs) {
        try {
            if (inputs.statusCode == '204') {
                outputs.status = 'Success';
            } else {
            	outputs.status = 'Error';
                var response = inputs.responseBody ? JSON.parse(inputs.responseBody) : "";
                if (response.error && response.error.message)
                	outputs.error_message = response.error.message;
            }
        } catch (e) {
            outputs.status = 'Error';
            outputs.error_message = 'Encountered an error. Check log for more details.';
            gs.error(e);
        }
    })(inputs, outputs);
