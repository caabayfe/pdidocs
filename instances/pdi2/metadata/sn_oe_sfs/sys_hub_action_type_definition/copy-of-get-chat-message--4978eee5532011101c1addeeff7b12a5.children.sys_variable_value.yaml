  value: |-
    (function execute(inputs, outputs) {
      // 201 is created
      if(inputs.statusCode == 200) {
        var responseBody = JSON.parse(inputs.responseBody);
        gs.info("Collab-CC2: ------------>>> " + JSON.stringify(responseBody));
        outputs.content = responseBody.body.content;
        outputs.content_type = responseBody.body.contentType;
        outputs.attachments = JSON.stringify(responseBody.attachments);  
        outputs.mentions = JSON.stringify(responseBody.mentions);
        outputs.reactions = JSON.stringify(responseBody.reactions);
        outputs.from = {
          id: responseBody.from.user.id,
          displayName: responseBody.from.user.displayName,
          userIdentityType: responseBody.from.user.userIdentityType
        };
        outputs.status = "Success";
      } else {
        gs.error("Collab: failed get message! Status: " + inputs.statusCode + 
                 "\nMS Graph API Response: " + inputs.responseBody);
        outputs.status = "Error: " + inputs.responseBody;
      } 
    })(inputs, outputs);
