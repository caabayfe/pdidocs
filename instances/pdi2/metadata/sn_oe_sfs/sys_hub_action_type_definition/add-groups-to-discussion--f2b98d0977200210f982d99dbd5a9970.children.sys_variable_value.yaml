  value: |-
    (function execute(inputs, outputs) {
    	
    	var documentId = inputs.documentid;
    	var documentTable = inputs.documenttable;
    	var collabChatSysId = inputs.collabchatsysid;
      	var token = inputs.token;	
    	var groupMap = inputs.groupmap;	

    	var getMembersOfGroup = function(groupId) {
    		var members = [];
    		var gr = new GlideRecord('sys_user_grmember');		
    		gr.addQuery('group',groupId);
    		gr.addQuery('user.active',true);
    		gr.query();
    		while(gr.next()) {
    			members.push(gr.getValue('user'));			
    		}
    		return members;		
    	};

    	var checkForMemberAccess = function(userId, documentId, documentTable, isCheckRequired) {
    		if (!isCheckRequired) {
    			return true;
    		}
    		try {
    			return sn_collab.CollabChatScriptObject.hasPermission(userId, documentTable, documentId);																		
    		} catch(ex) {				
    			gs.error("Error checking for member access:  " + ex);
    		}
    	};	
    	
    	var addMembersToDiscussion = function(groupSysId, isCheckRequired) {	
    			var resolvedGroupMembers = [];
    			var membersWithAccess = [];			
    			var groupMemberResolverPresent = false;		
    			var customSystemMessagePresent = false;		
    			var extensions = new GlideScriptedExtensionPoint().getExtensions("sn_oe_sfs.SidebarGroupMemberResolver");        
    			
    			try {
    				for (var j=0; j<extensions.length; j++) {				
    				if (extensions[j].applies(groupSysId, documentId, documentTable)) {
    					groupMemberResolverPresent = true;
    					resolvedGroupMembers = extensions[j].getResolvedMembers(groupSysId, documentId, documentTable);
    					var customSystemMessage = extensions[j].getSystemMessage(groupSysId, documentId, documentTable);
    					if (customSystemMessage != undefined && customSystemMessage != null && customSystemMessage != "") {						
    						customSystemMessagePresent = true;							
    					}
    					break;
    				}
    			}
    		} catch(ex) {
    			gs.error("Exception while fetching extension point: " + ex);
    			groupMemberResolverPresent = false;
    		} 
    			
    		if (!groupMemberResolverPresent) {
    			resolvedGroupMembers = getMembersOfGroup(groupSysId);
    		}	
    		
    		resolvedGroupMembers.forEach(function(userId) {
    			if (checkForMemberAccess(userId, documentId, documentTable, isCheckRequired)) {			
    				membersWithAccess.push(userId.toString());
    			}
    		});
    						
    		var gr = new GlideRecord("sys_user_group");
    		gr.get(groupSysId);	
    		var groupName = gr.getValue('name');
    		var systemMessage = "";

    		if (membersWithAccess.length > 0) {
    			sn_collab.CollabChatScriptObject.addMembersToChat(collabChatSysId, membersWithAccess, [], token, [groupSysId], true);												
    			if (groupMemberResolverPresent) {				
    				systemMessage = customSystemMessagePresent? customSystemMessage : gs.getMessage("Priority members of {0} joined the discussion.", groupName);									
    			} else {
    				systemMessage = gs.getMessage("{0} joined the discussion.", groupName);					
    			}
    		} else {
    			if (resolvedGroupMembers.length > 0) {
    				systemMessage = gs.getMessage("No members of {0} joined the discussion because they don’t have access to the record.", groupName);
    			} else {
    				systemMessage = customSystemMessagePresent? customSystemMessage : gs.getMessage("Group {0} contains no members.", groupName);
    			}
    		}
    		sn_collab.CollabChatScriptObject.sendSystemMessage(collabChatSysId, systemMessage);
    	};

    	var groupMapObj = JSON.parse(groupMap);
        for (var groupId in groupMapObj) {
            if (documentTable && documentId) {
                addMembersToDiscussion(groupId, groupMapObj[groupId]);
            } else {
    			// for standalone discussions don't check record access
                addMembersToDiscussion(groupId, false);
            }
    	}

    })(inputs, outputs);
