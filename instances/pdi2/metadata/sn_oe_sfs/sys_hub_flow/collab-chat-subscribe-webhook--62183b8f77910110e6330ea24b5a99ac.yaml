copied_from_name: Subscribe Webhook
description: |-
  <p id="short_desc">
    Creates a webhook subscription for the specified team's channel.
  </p>
  <p><strong>Inputs</strong> :</p>
  <ul id="inputs">
         <li>
      <strong>Webhook Registry Record Name</strong> - Name of the record in 'Webhook Registry' where Callback URL and Client State are stored.
    </li>
      <strong>Change Type</strong> - Type of change in the subscribed resource
      that will raise a change notification. Supported values are: created,
      updated, deleted. Multiple values can be combined using a comma.
    </li>
     <li>
      <strong>Team ID</strong> - Unique ID of the team.
    </li>
    <li>
      <strong>Channel ID</strong> - Unique ID of the channel.
    </li>
   
    <p></p>
  </ul>
  <p><strong>Outputs</strong> :</p>
  <ul id="outputs">
    <li>
      <strong>Subscription</strong> - Object containing these details of the
      subscription: -
      <ul>
        <li><strong> ID </strong> - Unique ID of the subscription.</li>
        <li>
          <strong> Resource </strong> - Specifies the resource that will be
          monitored for changes.
        </li>
        <li>
          <strong>Creator ID </strong> - Unique ID of the user or service
          principal that created the subscription.
        </li>
        <li>
          <strong>Change Type </strong> - Type of change in the subscribed
          resource that will raise a change notification.
        </li>
        <li>
          <strong>Notification URL </strong> - URL of the endpoint that receives
          change notifications.
        </li>
        <li>
          <strong> Expiration Date Time </strong> - Date and time in UTC when the
          webhook subscription expires.
        </li>
      </ul>
      .
    </li>
    <li>
      <strong>Status</strong> - If the request is executed successfully, Status is
      set to “Success”. If there is a failure in Microsoft Teams Graph, Status is
      set to “Error”.
    </li>
    <li>
      <strong>Error Message</strong> - Reason for error. Populated only when an
      error occurs.
    </li>
  </ul>
  <p></p>
  <p><strong>Error Messages</strong> :</p>
  <ul id="error_messages">
    <li>Unauthorized.</li>
    <li>Access token is empty. Check Oauth Token and scope permission.</li>
    <li>Invalid access token.</li>
    <li>Invalid Webhook Registry Record Name.</li>
    <li>Access denied to the specified resource.</li>
    <li>Expiration date time should be greater than current time.</li>
    <li>Expiration date time can only be 60 minutes in the future.</li>
    <li>Invalid Change Type.</li>
    <li>Invalid Notification URL scheme.</li>
    <li>Invalid Notification URL.</li>
    <li>Subscription validation request failed.</li>
    <li>Invalid Resource.</li>
    <li>
      Subscription for specified resource is not supported in specified API
      version.
    </li>
    <li>Subscription limit reached for the specified resource.</li>
  </ul>
  <p></p>
  <p>
    To use this subflow, the corresponding Microsoft Teams Graph connection and
    credential must be created and associated with the Microsoft Teams Graph
    Connection & Credential alias.
    <a
      target="_blank"
      href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias"
      >Learn More</a
    >
  </p>
  <p></p>
  <p>
    <strong>Note</strong>: Requires a subscription for production use.
    <a
      target="_blank"
      href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information"
      >Read More</a
    >.
  </p>
