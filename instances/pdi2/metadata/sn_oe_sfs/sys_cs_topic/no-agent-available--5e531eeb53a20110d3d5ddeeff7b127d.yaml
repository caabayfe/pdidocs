t.getRequesterLang())","input_prompt_format_type":"Text","input_prompt_validaton_script":"","confirm_msg_on_default_value":{"msg":"","val_for_confirm":true},"nlu_text_input":false,"nlu_confirmation_prompt":true,"acknowledge_msg":"vaVars.previous_graph_node=\"Task Number___95d09506a92548158c1605814043dcd8\";var ackMsg=null;ackMsg=null;(function() {vaInputs.__silent_ScriptedAction_a3d5c445ab094cdcb32250ad964620ac.reset();})();ackMsg;"},{"name":"__silent_ScriptedAction_cc62e227f6dd4804aeaf3dbe74f259f4","applicable":"vaVars.previous_graph_node==\"Interaction Number___975a0f59aa104801b0f3928fbad8ae54\"","direction":"Input","required":true,"prompt_msg":"vaVars.previous_graph_node=\"evaluate___cc62e227f6dd4804aeaf3dbe74f259f4\";(function execute() {(function execute() {\n    var addMessage = function(val){\n        if(message) {\n            return message + ''<br/>'' + val;\n        }\n        return val;\n    }\n    var getGlideRecord = function(tableName){\n        return new GlideRecord(tableName);\n    }\n    var getInteraction = function(interactionNumber){\n        var gr = getGlideRecord(''interaction'');\n        gr.addQuery(''number'', interactionNumber);\n        gr.query();\n        return gr;\n    }\n    var getWorkItemFromInteraction = function(interactionSysId){\n        var gr = getGlideRecord(''awa_work_item'');\n        gr.addQuery(''document_id'', interactionSysId);\n        gr.query();\n        return gr;\n    }\n    var VIRTUAL_AGENT_SYS_ID = ''2e94fca9c3123010d81b6e221f40dd08'';\n    var MSG_WORK_ITEM_GENERATED = ''{0} work item generated. '';\n    var MSG_INTERACTION_TO_VIRTUAL_AGENT = ''The interaction is assigned to Virtual Agent. '';\n    var MSG_WORK_ITEM_NOT_GENERATED = ''Work item is not created. '';\n    var MSG_CHECK_FOR_BUSINESS_RULES = ''Check for Business rules on awa_work_item table or time out configuration based on the reason for canceling the work items. '';\n    var MSG_NO_QUEUE_EXIST = ''No queue exist for Interaction with type: {0}. '';\n    var MSG_INTERCTION_NOT_FOUND = ''Interaction not found with number {0}. '';\n    var MSG_AGENT_AVAILABLE = ''Right now Agents are available for Service Channel: {0}'';\n    var MSG_NO_AGENT_AVAILABLE = ''Right now no Agent available for Service Channel: {0}. '';\n    var MSG_NO_AGENT_AVAILABLE_WITH_SKILLS = ''Right now no Agent available for Service Channel: {0} with required skills. '';\n    var MSG_AGENT_AVAILABLE_WITH_SKILLS = ''Right now Agents are available for Service Channel: {0} with required skills. '';\n    var MSG_WORK_ITEM_STATUS = ''Associated work item is in {0} state'';\n    var MSG_WORK_ITEM_STATUS_CANCELLED = ''Associated work item is in cancelled state with reason {0}'';\n    var MSG_AVAILABLE_QUEUES = ''Below queues are available. Please validate the schedule and utilization conditions: '';\n    var message = '''';\n    var interactionGr = getInteraction(vaInputs.interaction_number);\n    if (interactionGr.next()) {\n       var interactionType = interactionGr.type;\n       if (interactionGr.getValue(''assigned_to'') == VIRTUAL_AGENT_SYS_ID) {\n            message = addMessage(gs.getMessage(MSG_INTERACTION_TO_VIRTUAL_AGENT));\n            vaVars.output_message = message;\n            return;\n       }\n       var workItemGr = getWorkItemFromInteraction(interactionGr.getUniqueValue());\n       var count = workItemGr.getRowCount();\n       if (count > 1) {\n           message = addMessage(gs.getMessage(MSG_WORK_ITEM_GENERATED, count));\n           message = addMessage(gs.getMessage(MSG_CHECK_FOR_BUSINESS_RULES));\n       } else if (count == 0) {\n            message = addMessage(gs.getMessage(MSG_WORK_ITEM_NOT_GENERATED));\n            var queueGr = new GlideRecord(''awa_queue'');\n            queueGr.addEncodedQuery(''active=true^service_channel.workitem_table=interaction^service_channel.type=''+interactionType);\n            queueGr.orderBy(''order'');\n            queueGr.query();\n            if (queueGr.getRowCount() == 0){\n          