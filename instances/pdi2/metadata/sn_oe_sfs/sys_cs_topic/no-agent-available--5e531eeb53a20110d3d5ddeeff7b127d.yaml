           vaVars.output_message = message;\n                   return;\n               }\n               var skillEnabled = gs.getProperty(''glide.awa.skill_level.evaluate'');\n               if (skillEnabled && skillEnabled == ''true'') {\n                   var skills = [];\n                   var skillGr = new GlideRecord(''interaction_m2m_skill'');\n                   skillGr.addQuery(''interaction'', interactionGr.getUniqueValue());\n                   skillGr.query();\n                   while (skillGr.next()) {\n                       skills.push(skillGr.getUniqueValue());\n                   }\n                   skills.sort(function(a, b) {\n                       return a.localeCompare(b);\n                   });\n                   while (channelCapacityGr.next()){\n                       channelCapacityGr.getValue(''ap_agent'');\n                       var userSkillGr = new GlideRecord(''sys_user_has_skill'');\n                       userSkillGr.addQuery(''user'', channelCapacityGr.getValue(''ap_agent''));\n                       userSkillGr.addQuery(''skill'', ''IN'', skills.toString().replaceAll(''['').replaceAll('']''));\n                       userSkillGr.query();\n                       if (userSkillGr.getRowCount() != skills.length) {\n                           continue;\n                       }\n                       var userSkills = [];\n                       while (userSkillGr.next()) {\n                           userSkills.push(userSkillGr.getValue(''skill''));\n                       }\n                       userSkills.sort(function(a, b) {\n                           return a.localeCompare(b);\n                       });\n                       if (userSkills.toString() == skills.toString()) {\n                            message = addMessage(gs.getMessage(MSG_AGENT_AVAILABLE_WITH_SKILLS, serviceChannelGr.getValue(''name'')));\n                            vaVars.output_message = message;\n                            return;\n          