client_callable: 'false'
description: |-
  This script holds the functionality to fetch recommended topics.


  Following are the steps to get top 3 recommended topics: 
  1. Generate a list of intent-topic associations.
  2. Get the request ID of the latest analysis ran.
  3. Get the report for the corresponding request ID. 
  4. The report holds the recommendations; sort the recommendations by matches in descedning fashion.
  5. Iterate through that sorted list and select the top 3 that have associate topic Ids (based on intent property) from step 1
