  value: |-
    (function populateBreadCrumbs(pageId, pageParams) {
    	function getLabel(){
    		var sysId = pageParams.sysId;
    		if(sysId.startsWith('-')) return gs.getMessage('New Record');
    		var gr = new GlideRecord('sys_cs_branding_setup');
    		if(gr.get(sysId)) return gr.getDisplayValue();
    		return sysId;
    	}
        return [{
            'label': gs.getMessage('General'),
            'route': 'general',
    		'params': null,
    		'fields': null
        }, {
            'label': gs.getMessage('Branding Settings'),
            'route': 'list',
    		'params': null,
    		'fields': {
    			'table': 'sys_cs_branding_setup'
    		}
        }, {
            'label': getLabel(),
            'route': 'branding-settings',
    		'fields': null,
    		'params': null
        }];
    }(pageId, pageParams));
