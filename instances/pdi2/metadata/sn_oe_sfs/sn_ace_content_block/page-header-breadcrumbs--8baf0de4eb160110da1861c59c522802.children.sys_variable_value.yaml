  value: |-
    (function populateBreadCrumbs(pageId, pageParams) {
    	var configId = pageParams.configId;
    	var patternId = pageParams.patternId;

    	if(!configId || !patternId) {
    		return [];
    	}
    	
    	var ciUtil = new sn_oe_sfs.CIUtil();

    	var deflectionConfigDetails = ciUtil.getDeflectionConfigDetails(configId);
    	var deflectionPatternDetails = ciUtil.getActivityPatternDetails(patternId);

    	var translations = new sn_oe_sfs.CIAdminConsoleTranslations().getTranslations();

    	var deflectionConfigName = deflectionConfigDetails.name || translations.create_deflection_configuration;
    	var deflectionPatternName = deflectionPatternDetails.name || translations.create_deflection_pattern;

    	return [
    		{
    			page: 'virtual-agent',
    			label: translations.virtual_agent,
    		}, 
    		{
    			page: 'deflection-settings',
    			label: translations.deflection_configurations,
    		}, 
    		{
    			page: 'deflection-configuration',
    			label: deflectionConfigName,
    			fields: {
    				deflectionconfigurationId: configId
    			},
    			params: {
    				timestamp: new Date().getTime()
    			}
    		},
    		{
    			label: deflectionPatternName
    		}
    	];	
    }(pageId, pageParams));
