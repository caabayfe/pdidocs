  value: |-
    (function populateBreadCrumbs(pageId, pageParams) {
        var translations = new sn_oe_sfs.CIAdminConsoleTranslations().getTranslations();
    	var results = [];
    	var page = {};
    	var fields = {};
    	page['page'] = 'general';
    	page['label'] = translations.general;
    	results.push(page);
    	page = {};
    	page['page'] = 'channel-settings',
        page['label'] =  translations.channels_and_integrations;
    	results.push(page);
    	page = {};
    	if(pageParams.channelname == 'teams'){
    		page['page'] = 'va-channel-integrations',
    		page['label'] =  translations.manage_teams_channel;
    		fields['channel'] = 'teams';
    		page['fields'] = fields;
    		results.push(page);
    	}
    	else if(pageParams.channelname == 'slack'){
    		page['page'] = 'va-channel-integrations',
    		page['label'] =  translations.manage_slack_channel;
    		fields['channel'] = 'slack';
    		page['fields'] = fields;
    		results.push(page);
    	}
    	else if(pageParams.channelname == 'workplace'){
    		page['page'] = 'va-channel-integrations',
    		page['label'] =  translations.manage_workplace_channel;
    		fields['channel'] = 'workplace';
    		page['fields'] = fields;
    		results.push(page);
    	}
    	page = {};
        page['label'] =  pageParams.botname;
    	results.push(page);
    	return results;
    }(pageId, pageParams));
