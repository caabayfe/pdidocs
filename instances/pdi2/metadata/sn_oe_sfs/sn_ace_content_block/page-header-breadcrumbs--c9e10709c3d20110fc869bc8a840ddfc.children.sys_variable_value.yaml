  value: |-
    (function populateBreadCrumbs(pageId, pageParams) {
    	var deflectionConfigurationId = pageParams.deflectionconfigurationId;
    	if(!deflectionConfigurationId) {
    		return [];
    	}

    	var deflectionConfigDetails = new sn_oe_sfs.CIUtil().getDeflectionConfigDetails(deflectionConfigurationId);
    	var translations = new sn_oe_sfs.CIAdminConsoleTranslations().getTranslations();

    	var deflectionConfigName = deflectionConfigDetails.name || translations.create_deflection_configuration;

    	return [
    		{
    			page: 'virtual-agent',
    			label: translations.virtual_agent
    		}, 
    		{
    			page: 'deflection-settings',
    			label: translations.deflection_configurations
    		}, 
    		{
    			label: deflectionConfigName
    		}
    	];	
    }(pageId, pageParams));
