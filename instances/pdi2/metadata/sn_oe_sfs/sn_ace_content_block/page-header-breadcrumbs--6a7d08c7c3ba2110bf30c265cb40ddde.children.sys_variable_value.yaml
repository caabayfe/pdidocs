  value: |-
    (function populateBreadCrumbs(pageId, pageParams) {
        var translations = new sn_oe_sfs.CIAdminConsoleTranslations().getTranslations(); 
    	if (pageParams.channelType == 'messenger') {
    		return [{            
    				page: 'general',            
    				label: translations.general       
    			},        
    			{            
    				page: 'channel-settings',            
    				label: translations.channels_and_integrations        
    			},
    			{            
    				page: 'channel-self-configured-edit-integration',            
    				label: translations.channel_self_configured_edit_integration    
    			}
    		];
    	}
    	else if (pageParams.channelType == 'line') {
    		return [{            
    				page: 'general',            
    				label: translations.general       
    			},        
    			{            
    				page: 'channel-settings',            
    				label: translations.channels_and_integrations        
    			},
    			{            
    				page: 'channel-self-configured-edit-integration',            
    				label: translations.channel_line_self_configured_edit_integration    
    			}
    		];
    	}
    }(pageId, pageParams));
