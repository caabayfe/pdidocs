design_definition: '{"type":"FlowTopic","type":"FlowTopic","triggers":[{"type":"Trigger","name":"9cde5b7f4ea84704840b82e22097e6f1","triggerType":"request","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"id":"9cde5b7f4ea84704840b82e22097e6f1"}],"goals":[{"name":"primary","trigger_id":"9cde5b7f4ea84704840b82e22097e6f1","nodes":[{"type":"StartGoal","type":"StartGoal","goal_id":"primary","greeting_msg":{"type":"String","type":"String","mode":"string","value":""},"id":"0fb3b6ff9e344abe92e34537af851c2f","name":"Start"},{"type":"TerminateGoal","type":"TerminateGoal","goal_id":"primary","confirmation_msg":{"type":"String","type":"String","mode":"string","value":""},"id":"3bbf2e8af7a94cea8af9fe2ee06aa232","name":"End"},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    var addMessage = function(val){\n        if(message) {\n            return message + ''<br/>'' + val;\n        }\n        return val;\n    }\n    var getGlideRecord = function(tableName){\n        return new GlideRecord(tableName);\n    }\n    var getInteraction = function(interactionNumber){\n        var gr = getGlideRecord(''interaction'');\n        gr.addQuery(''number'', interactionNumber);\n        gr.query();\n        return gr;\n    }\n    var getWorkItemFromInteraction = function(interactionSysId){\n        var gr = getGlideRecord(''awa_work_item'');\n        gr.addQuery(''document_id'', interactionSysId);\n        gr.query();\n        return gr;\n    }\n    var VIRTUAL_AGENT_SYS_ID = ''2e94fca9c3123010d81b6e221f40dd08'';\n    var MSG_WORK_ITEM_GENERATED = ''{0} work item generated. '';\n    var MSG_INTERACTION_TO_VIRTUAL_AGENT = ''The interaction is assigned to Virtual Agent. '';\n    var MSG_WORK_ITEM_NOT_GENERATED = ''Work item is not created. '';\n    var MSG_CHECK_FOR_BUSINESS_RULES = ''Check for Business rules on awa_work_item table or time out configuration based on the reason for canceling the work items. '';\n    var MSG_NO_QUEUE_EXIST = ''No queue exist for Interaction with type: {0}. '';\n    var MSG_INTERCTION_NOT_FOUND = ''Interaction not found with number {0}. '';\n    var MSG_AGENT_AVAILABLE = ''Right now Agents are available for Service Channel: {0}'';\n    var MSG_NO_AGENT_AVAILABLE = ''Right now no Agent available for Service Channel: {0}. '';\n    var MSG_NO_AGENT_AVAILABLE_WITH_SKILLS = ''Right now no Agent available for Service Channel: {0} with required skills. '';\n    var MSG_AGENT_AVAILABLE_WITH_SKILLS = ''Right now Agents are available for Service Channel: {0} with required skills. '';\n    var MSG_WORK_ITEM_STATUS = ''Associated work item is in {0} state'';\n    var MSG_WORK_ITEM_STATUS_CANCELLED = ''Associated work item is in cancelled state with reason {0}'';\n    var MSG_AVAILABLE_QUEUES = ''Below queues are available. Please validate the schedule and utilization conditions: '';\n    var message = '''';\n    var interactionGr = getInteraction(vaInputs.interaction_number);\n    if (interactionGr.next()) {\n       var interactionType = interactionGr.type;\n       if (interactionGr.getValue(''assigned_to'') == VIRTUAL_AGENT_SYS_ID) {\n            message = addMessage(gs.getMessage(MSG_INTERACTION_TO_VIRTUAL_AGENT));\n            vaVars.output_message = message;\n            return;\n       }\n       var workItemGr = getWorkItemFromInteraction(interactionGr.getUniqueValue());\n       var count = workItemGr.getRowCount();\n       if (count > 1) {\n           message = addMessage(gs.getMessage(MSG_WORK_ITEM_GENERATED, count));\n           message = addMessage(gs.getMessage(MSG_CHECK_FOR_BUSINESS_RULES));\n       } else if (count == 0) {\n            message = addMessage(gs.getMessage(MSG_WORK_ITEM_NOT_GENERATED));\n            var queueGr = new GlideRecord(''awa_queue'');\n            queueGr.addEncodedQuery(''active=true^service_channel.workitem_table=interaction^service_channel.type=''+interactionType);\n            queueGr.orderBy(''order'');\n            queueGr.query();\n            if (queueGr.getRowCount() == 0){\n              message = addMessage(gs.getMessage(MSG_NO_QUEUE_EXIST, interactionType));\n              vaVars.output_message = message;\n              return;\n            } \n            message = addMessage(gs.getMessage(MSG_AVAILABLE_QUEUES));\n            while (queueGr.next()) {\n                var url = vaVars.base_url+''awa_queue.do?sys_id=''+queueGr.getUniqueValue();\n                message = addMessage(''<a href='' + url + ''>''+queueGr.getValue(''name'')+''</a>'');\n            }  \n       } else if (count == 1) {\n           if (workItemGr.next()) {\n               var state = workItemGr.getValue(''state'');\n               if (state == ''cancelled'') {\n                    message = addMessage(gs.getMessage(MSG_WORK_ITEM_STATUS_CANCELLED , workItemGr.getValue(''cancelled_reason'')));\n               } else{\n                    message = addMessage(gs.getMessage(MSG_WORK_ITEM_STATUS , workItemGr.getValue(''state'')));\n               }\n               var queue = workItemGr.getValue(''queue'');\n               var queueGr = new GlideRecord(''awa_queue'');\n               queueGr.get(queue);\n               var serviceChannel = queueGr.getValue(''service_channel'');\n               var serviceChannelGr = new GlideRecord(''awa_service_channel'');\n               serviceChannelGr.get(serviceChannel);\n               var defaultCapacity = serviceChannelGr.getValue(''default_capacity'');\n               var channelCapacityGr = new GlideRecord(''awa_agent_presence_capacity'');\n               channelCapacityGr.addQuery(''channel'', serviceChannel);\n               channelCapacityGr.addEncodedQuery(''aca_presence_state.available_to_receive_work_items=true'');\n               channelCapacityGr.addQuery(''ac_workload'', ''<'', defaultCapacity);\n               channelCapacityGr.query();\n               if (channelCapacityGr.getRowCount() == 0){\n                   message = addMessage(gs.getMessage(MSG_NO_AGENT_AVAILABLE , serviceChannelGr.getValue(''name'')));\n                   vaVars.output_message = message;\n                   return;\n               }\n               var skillEnabled = gs.getProperty(''glide.awa.skill_level.evaluate'');\n               if (skillEnabled && skillEnabled == ''true'') {\n                   var skills = [];\n                   var skillGr = new GlideRecord(''interaction_m2m_skill'');\n                   skillGr.addQuery(''interaction'', interactionGr.getUniqueValue());\n                   skillGr.query();\n                   while (skillGr.next()) {\n                       skills.push(skillGr.getUniqueValue());\n                   }\n                   skills.sort(function(a, b) {\n                       return a.localeCompare(b);\n                   });\n                   while (channelCapacityGr.next()){\n                       channelCapacityGr.getValue(''ap_agent'');\n                       var userSkillGr = new GlideRecord(''sys_user_has_skill'');\n                       userSkillGr.addQuery(''user'', channelCapacityGr.getValue(''ap_agent''));\n                       userSkillGr.addQuery(''skill'', ''IN'', skills.toString().replaceAll(''['').replaceAll('']''));\n                       userSkillGr.query();\n                       if (userSkillGr.getRowCount() != skills.length) {\n                           continue;\n                       }\n                       var userSkills = [];\n                       while (userSkillGr.next()) {\n                           userSkills.push(userSkillGr.getValue(''skill''));\n                       }\n                       userSkills.sort(function(a, b) {\n                           return a.localeCompare(b);\n                       });\n                       if (userSkills.toString() == skills.toString()) {\n                            message = addMessage(gs.getMessage(MSG_AGENT_AVAILABLE_WITH_SKILLS, serviceChannelGr.getValue(''name'')));\n                            vaVars.output_message = message;\n                            return;\n                       }\n                   }\n                   message = addMessage(gs.getMessage(MSG_NO_AGENT_AVAILABLE_WITH_SKILLS , serviceChannelGr.getValue(''name'')));\n               } else {\n                   message = addMessage(gs.getMessage(MSG_AGENT_AVAILABLE , serviceChannelGr.getValue(''name'')));\n               } \n           }\n       }\n    } else {\n        message = addMessage(gs.getMessage(MSG_INTERCTION_NOT_FOUND,vaInputs.interaction_number));\n    }\n    vaVars.output_message = message;\n})()\n","id":"cc62e227f6dd4804aeaf3dbe74f259f4","name":"evaluate","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"InputPrompt","type":"InputPrompt","variable_id":"24b0a84f106b4ef39c7a258d0fabdfd0","message":{"type":"String","type":"String","mode":"string","value":"gs.getMessageLang(\"Please enter Interaction Number\", vaContext.getRequesterLang())"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true},"skippable":{"type":"Applicability","type":"Applicability","mode":"script","value":"false"},"id":"975a0f59aa104801b0f3928fbad8ae54","name":"Interaction Number","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"formatType":"Text","validationScript":""},{"type":"TextOutputPrompt","type":"TextOutputPrompt","value":[{"type":"String","type":"String","mode":"string","value":"{{vaVars.output_message}}"}],"id":"ca63c928a8864ffc8ff6704efbbc2517","name":"output","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"Decision","type":"Decision","name":"Decision","branches":[{"type":"Branch","type":"Branch","label":"Exit","expression":{"type":"Applicability","type":"Applicability","mode":"query","value":"re_enter="},"id":"f8e1ab71