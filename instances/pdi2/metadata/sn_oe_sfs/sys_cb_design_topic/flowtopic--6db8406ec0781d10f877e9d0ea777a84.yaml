            "dataSourceType": "script",
            "script": "(function execute() {\n    gs.info(\"1--- \" + vaVars.iar_config_list);\n    gs.info(\"1--- \" + vaVars.iar_config_names);\n    // check if prediction server is up\n    var predictionServerUp = sn_oe_sfs.IARHealthCheck.checkIsPredictionServerUp() ? \"PASSED\" : \"FAILED\";\n\n    // check for existing configurations\n    var configsExist = sn_oe_sfs.IARHealthCheck.checkConfigsExist() ? \"PASSED\" : \"FAILED\";\n\n    // check for active configurations\n    var configsActive = sn_oe_sfs.IARHealthCheck.checkActiveConfigExists() ? \"PASSED\" : \"FAILED\";\n\n    var headers = [\n        'Test',\n        'Result'\n    ];\n    var rows = [];\n    rows.push([\n        'Prediction server is up', predictionServerUp\n    ]);\n    rows.push([\n        'There are existing IAR configurations', configsExist\n    ]);\n    rows.push([\n        'There is an active IAR configuration', configsActive\n    ]);\n    return {\n        columnHeaders: headers,\n        columnValues: rows\n    };\n})()",
