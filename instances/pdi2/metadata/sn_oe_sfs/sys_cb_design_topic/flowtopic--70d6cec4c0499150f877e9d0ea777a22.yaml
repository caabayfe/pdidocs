t","type":"TextOutputPrompt","value":[{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    return \"I have found an Auto-Resolution configuration for \" + vaVars.config_name + \".\";\n})()"}],"id":"f786e492543a46b884f92682da48c008","name":"IAR configuration name","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"Decision","type":"Decision","name":"Decision","branches":[{"type":"Branch","type":"Branch","label":"Retried < 3 times","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    vaVars.retry_task_search_count += 1;\n    return vaVars.retry_task_search_count < 3;\n})()\n"},"id":"8b8a10bdd0c14cf5badba894394447e0","name":"Retried < 3 times"},{"type":"Branch","type":"Branch","label":"Retried 3 times","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.retry_task_search_count == 3;\n})()\n"},"id":"7ea4ab5b3d404a5398f0e271eff0463c","name":"Retried 3 times"}],"id":"eb392a3078d54509bc3c30c1aea28f8d","goal_id":"primary"},{"type":"TextOutputPrompt","type":"TextOutputPrompt","value":[{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    return \"Unable to find the task with number \" + vaInputs.task_number + \". Please try again.\";\n})()\n"}],"id":"9afe98a9b8144656b59a3607418501da","name":"Retry task search","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"TextOutputPrompt","type":"TextOutputPrompt","value":[{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    return \"Sorry, I am not able to find the task with the number \" + vaInputs.task_number + \".\";\n})()\n"}],"id":"2b6f2f4ddafe4ef3af2f7c9529a9a4fa","name":"Unable to find task","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"secure":false},{"type":"Decision","type":"Decision","name":"Decision","branches":[{"type":"Branch","type":"Branch","label":"IAR invocation failed","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return !vaVars.iar_invocation_succeeded;\n})()\n"},"id":"97eb870171784650ac099a3593d11c4d","name":"IAR invocation failed"},{"type":"Branch","type":"Branch","label":"IAR invocation succeeded","expression":{"type":"Applicability","type":"Applicability","mode":"script","value":"(function execute() {\n    return vaVars.iar_invocation_succeeded;\n})()\n"},"id":"3b5d079c092d4bf1819bb334da4292e8","name":"IAR invocation succeeded"}],"id":"25cd2099525e4179a3d65d08750666a6","goal_id":"primary"},{"type":"ChoiceInputPrompt","type":"ChoiceInputPrompt","expression_mode":"simple","metadataScript":"","cardName":"","cardFields":[],"id":"bd9e71c6074d488ea529c08fbd58d8f4","name":"Reroute confirmation","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"variable_id":"d94a19fbc23d4881b00817009b354d12","message":{"type":"String","type":"String","mode":"string","value":"gs.getMessageLang(\"Since the task was assigned to a bot user and IAR invocation succeeded, I can reroute you to the Diagnose IAR Flow Failure topic. Would you like to proceed?\", vaContext.getRequesterLang())"},"skippable":{"type":"Applicability","type":"Applicability","mode":"script","value":"false"},"nlu_entity_binding":{"type":"NLUEntityBinding","allow_text_input":false,"use_confirmation_prompt":true}},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    vaVars.global_task_number = vaInputs.task_number;\n    vaSystem.switchTopicById(\"c3bc9400c09d5190f877e9d0ea777a39\");\n})()\n","id":"84a9b0145a364bb98d434f851e0cecfb","name":"Reroute to Flow Failure topic","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"query","value":"reroute_confirmation=reroute"}},{"type":"ScriptedAction","type":"ScriptedAction","script":"(function execute() {\n    var grConfig = new GlideRecord(\"sys_cs_auto_resolution_configuration\");\n    grConfig.get(vaVars.config_sys_id);\n    var errors = JSON.parse(vaVars.errors);\n    \n    if (grConfig.iar_invocation == \"api\") {\n        // check that if business rule exists, it is inactive\n        var configBr = sn_oe_sfs.IARIssueNotAssignedDiagnostic.checkBrExists(vaVars.config_sys_id);\n        if (!gs.nil(configBr) && sn_oe_sfs.IARIssueNotAssignedDiagnostic.checkBrActive(configBr)) {\n            errors.push(\"Configuration trigger is set to on demand, but it has an active business rule\");\n        }\n    }\n    else if (grConfig.iar_invocation == \"business_rule\") {\n        // check that business rule exists\n        var configBr = sn_oe_sfs.IARIssueNotAssignedDiagnostic.checkBrExists(vaVars.config_sys_id);\n        if (gs.nil(configBr)) {\n            errors.push(\"No business rule exists for this Auto-resolution configuration\");\n        }\n        \n        else {\n            // check that business rule is active\n            if (!sn_oe_sfs.IARIssueNotAssignedDiagnostic.checkBrActive(configBr))\n                errors.push(\"Business rule is not active\");\n            \n            // check that business rule order is highest\n            if (!sn_oe_sfs.IARIssueNotAssignedDiagnostic.checkBrOrderIsHighest(configBr)) \n                errors.push(\"Business rule order is not the highest\");\n            \n            // check that there is only 1 trigger business rule associated with the configuration\n            if (!sn_oe_sfs.IARIssueNotAssignedDiagnostic.checkConfigHasOneBr(configBr, vaVars.config_name)) \n                errors.push(\"There is more than 1 trigger business rule associated with this Auto-resolution configuration\");\n        }      \n    }\n\n    // check that config conditions match incident condition\n    if (!sn_oe_sfs.IARIssueNotAssignedDiagnostic.checkTaskAndConfigConditionsMatch(vaVars.task_sys_id, vaVars.config_sys_id, vaVars.config_name)) {\n        errors.push(\"Task created does not match the entry conditions on Auto-resolution configuration\")\n    }\n    \n    vaVars.errors = JSON.stringify(errors);\n})()","id":"9b1971d1f9c94c0ea39a7cfb6e38d2fb","name":"Run checks","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"}},{"type":"TextOutputPrompt","type":"TextOutputPrompt","value":[{"type":"String","type":"String","mode":"script","value":"(function execute() {\n    var errors = JSON.parse(vaVars.errors);\n    if (errors.length == 0) {\n        vaVars.iar_invocation_succeeded = true;\n        var assignedTo = sn_oe_sfs.IARIssueNotAssignedDiagnostic.getTaskAssignedTo(vaVars.config_sys_id);\n        return \"After running checks, IAR invocation succeeded and the task should be assigned to \" + assignedTo + \".\";\n    }\n    else {\n        var result = \"After running checks, IAR invocation failed. The error(s) are as follows:\\n\";\n        while (errors.length != 0) {\n            result += \"- \" + errors.shift();\n            if (errors.length != 0) {\n                result += \"\\n\";\n            }\n        }\n        return result;\n    }\n})()"}],"id":"d84aefe43b434ee1b2f88a497433f17a","name":"Result","goal_id":"primary","applicability":{"type":"Applicability","type":"Applicability","mode":"script","value":"true"},"secure":false}],"edges":[{"type":"Edge","source_node_id":"4a0a528f521b458c8bc47d2ddbd06d0c","target_node_id":"5b4a4854f67a46ec926e8a34d10cbcb1","id":"205a7f4c590c41658fd2d69676865df9"},{"type":"Edge","source_node_id":"84a9b0145a364bb98d434f851e0cecfb","target_node_id":"d6949f2427b84faf894e7b7498997ade","id":"2399d95c7c1f4a698fbf985827d15d83"},{"type":"Edge","source_node_id":"f786e492543a46b884f92682da48c008","target_node_id":"9b1971d1f9c