api_name: global.Fetch Information Session Workspace Settings
batch_exclude: 'false'
description: fetch workspace settings
mutates_server_data: 'false'
name: Fetch Information Session Workspace Settings
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "queryConditions",
      "label": "QueryConditions",
      "description": "query condition",
      "fieldType": "string",
      "mandatory": true 
    }
  ]
query: |-
  query($queryConditions: String!) { 
    	GlideRecord_Query { 
  			information_session_tab_workspace_setting(queryConditions: $queryConditions) { 
  				_results { 	 
  				         sys_id { 
          					value
         					 },
          				workspace {
          					value
          				}
          				first_color_threshold {
            					value
          				}, 
          				second_color_threshold {
            					value
          				},
                                         is_active {
                                                 value
                                         },
                                         u_threshold_levels {
                                                  value
                                        }
  				}
  			}
  	} 
  }
required_translations: |-
  [ {
    "message" : "QueryConditions",
    "comment" : ""
  }, {
    "message" : "query condition",
    "comment" : ""
  } ]
