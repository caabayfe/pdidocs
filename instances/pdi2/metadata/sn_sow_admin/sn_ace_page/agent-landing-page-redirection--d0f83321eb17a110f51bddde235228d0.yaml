required_translations: '[{"message":"","comment":""},{"message":"Configure","comment":""},{"message":"Configure SOW homepage destination rule","comment":""},{"message":"System properties","comment":""},{"message":"Configure system property glide.next_experience.user_selected_landing page_enabled","comment":""},{"message":"Homepage destination rule","comment":""},{"message":"Configure system property to set default homepage","comment":""},{"message":"Configure system property glide.login.home","comment":""},{"message":"<div><p style=\"margin:0rem\">Irrespective of the value of this property, a tier 2 agent is redirected to SOW. </p><ul style=\"margin:0rem\"><li>If you set this property to true, the tier 2 agent is redirected to SOW and will see a tier 2 landing page.</li><li>If you set this property to false, the tier-2 agent is redirected to SOW, but will see the tier1 landing page instead of the tier 2 landing page.</li></ul></div>","comment":""},{"message":"Set the default homepage that should be displayed on login. Set the property to “now/nav/ui/home”. If the property is left blank, the last visited page is displayed on login.","comment":""},{"message":"Page Header Title","comment":""},{"message":"<p style=\" margin-top: 8px;\">You can redirect an agent (itil user) to the Service Operations Workspace landing page after logging in to the ServiceNow instance. To learn about redirecting an agent to the SOW landing page, see our SOW documentation.</p>","comment":""},{"message":"Landing page redirection for an agent","comment":""},{"message":"SOW Landing Page","comment":""},{"message":"Configure system property to enable use of user criteria records for UX Framework","comment":""},{"message":"Configure system property glide.ux.user_criteria_enabled","comment":""},{"message":"glide.ux.user_criteria_enabled","comment":""},{"message":"Set this property to true to enable redirection on login to a landing page of your choice.","comment":""},{"message":"glide.login.home","comment":""},{"message":"glide.next_experience.user_selected_landing_page_enabled","comment":""},{"message":"Activate this destination rule to redirect an agent to SOW after logging in to the ServiceNow instance. ","comment":""}]'
