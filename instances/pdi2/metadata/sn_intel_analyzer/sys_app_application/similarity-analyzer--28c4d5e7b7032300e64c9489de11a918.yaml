description: The Similarity Analyzer provides Trend Definition forms that allows administrators to configure what types of trends they'd like to be on the look out for within similar records. For example, you may want to scan similar records for a common value, or related record. You can even set thresholds for what you warrant as a true trend. For example, was the same Knowledge Article attached more that 3 times? The Similarity Analyzer service is used in conjunction with Agent Assist Recommendations and can be extended for any use case requiring the analysis of a cluster or group of records.
