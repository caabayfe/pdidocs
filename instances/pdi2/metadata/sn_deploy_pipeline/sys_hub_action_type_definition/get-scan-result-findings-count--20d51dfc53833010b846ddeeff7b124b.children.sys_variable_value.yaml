  value: |-
    (function execute(inputs, outputs) {
      var resultIdToUse = '';
      var resultId = inputs['result_id'];
      var findingUrl = inputs['scan_finding_url'];
          
      // use result_id if passed.
      if(!gs.nil(resultId)) {
        resultIdToUse = resultId;
      } else if(!gs.nil(findingUrl)) {
    	var pattern = /result=([^|^]+)/;
        var decodedUrl = gs.urlDecode(findingUrl);
        var match = decodedUrl.match(pattern); // findingUrl will have resultID, Ex: result=<id>
        
        if(match) {
          resultIdToUse = match[1];
        }
      }
      
      outputs['result_id_to_use'] = resultIdToUse;
    })(inputs, outputs);
