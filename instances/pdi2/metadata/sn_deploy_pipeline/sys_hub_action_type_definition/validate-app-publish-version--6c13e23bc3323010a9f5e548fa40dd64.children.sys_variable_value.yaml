  value: |-
    (function execute(inputs, outputs) {
      outputs['status_code'] = inputs.status_code;
      outputs['error_message'] = inputs.error_message;
      
      try {
        var parsedResponse = JSON.parse(inputs.response_body);
        
         if(inputs.status_code === 200) {
            var result = parsedResponse.result;
          
          	outputs['is_valid'] = result.isValid;
          	outputs['validation_details'] = result.details;
          	outputs['is_published_app_version_available'] = result.isPublishedAppVersionAvailable; 
         } else {
           	var error = parsedResponse.error;
          	var message = error.message || '';
          
          	outputs['validation_details'] = gs.getMessage("Validate App Publish Version Api responded with status {0}. {1}", [inputs.status_code, message]);
         }    
      } catch(err) {
        outputs['is_valid'] = false;
        outputs['validation_details'] = gs.getMessage("Unable to validate version. Validate App Publish Version Api responded with status {0}", inputs.status_code);
      }
    })(inputs, outputs);
