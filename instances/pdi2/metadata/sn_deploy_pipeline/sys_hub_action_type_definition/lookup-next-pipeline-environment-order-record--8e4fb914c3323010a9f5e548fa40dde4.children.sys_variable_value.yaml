  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      // initialize processed records
      var parsedProcessedRecords = inputs.processed_pipeline_environment_order_records ? JSON.parse(inputs.processed_pipeline_environment_order_records) : [];
      
      // initialize deployment flow utils 
      var deploymentFlowUtils = new DeploymentFlowUtils(inputs.pipeline_sys_id, parsedProcessedRecords);
      
      // fetch next pipeline environment order record to process
      var nextPipelineEnvironmentOrderRecordInfo = deploymentFlowUtils.getNextPipelineEnvironmentOrderRecordInfo();
      var updatedProcessedRecords = deploymentFlowUtils.getProcessedPipelineEnvironmentOrderList();
      
      outputs['record_found'] = false;
      outputs['updated_pipeline_environment_order_records'] = JSON.stringify(updatedProcessedRecords);
      
      if(nextPipelineEnvironmentOrderRecordInfo) {    
        outputs['record_found'] = true;
        outputs['pipeline_environment_order_record'] = nextPipelineEnvironmentOrderRecordInfo.pipelineEnvironmentOrderSysId;
        outputs['environment'] = nextPipelineEnvironmentOrderRecordInfo.environmentSysId;
        outputs['order'] = nextPipelineEnvironmentOrderRecordInfo.order;
        outputs['environment_name'] = nextPipelineEnvironmentOrderRecordInfo.environmentName;
        outputs['instance_type'] = nextPipelineEnvironmentOrderRecordInfo.instanceType;
      }
    })(inputs, outputs);
