  value: |-
    (function execute(inputs, outputs) {
    try {
        if(inputs.error_code != '0'){
          outputs.has_error = true; 
          outputs.error_message = inputs.error_message;
        } else {
          var response = JSON.parse(inputs.response);
          outputs.is_installed = response.result.length > 0; 
          outputs.has_error = false; 
          outputs.error_message = "";
        }

    } catch (e) {
        outputs.has_error = true;
        outputs.error_message = e.message; 
    }
    })(inputs, outputs);
