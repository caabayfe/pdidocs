  sys_updated_by: admin
  sys_updated_on: 2023-07-17 07:28:00
  value: |-
    (function execute(inputs, outputs) {

        outputs.processed_template_string = '';

        if (inputs.change_template !== '') {

            var sysTemplateRecord = new GlideRecord('sys_template');
            ifRecordExists = sysTemplateRecord.get(inputs.change_template);

            if (!ifRecordExists) {
                gs.warn('CMDB-intg: Configured invalid Change template sys_id - {0}', inputs.change_template);
            } else if (sysTemplateRecord.getValue('table') !== 'change_request') {
                gs.warn('CMDB-intg: Configured Change template sys_id - {0} is not created from table change_request ', inputs.change_template);
            } else {
                outputs.processed_template_string = sysTemplateRecord.getValue('template');
            }
        }

    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
