  value: |-
    (function execute(inputs, outputs) {
      var validator = new DeploymentRequestPayloadValidator();
      var payload = inputs.payload;
      
      if (typeof inputs.payload === "string") {
        try{
          payload = JSON.parse(inputs.payload);
        } catch (e) {
          outputs.is_valid = false;
          outputs.error_message = gs.getMessage('Error parsing the payload');
          return;
        }
      }

      var result = validator.validate(payload); 
      
      if(result.is_valid){
        var payloadFields = DeploymentPipelineConstants.deploymentRequest.payloadFields;
      	
        outputs.is_valid = true;
      	setObject(outputs, payloadFields.required, payload);
      	setObject(outputs, payloadFields.optional, payload);
      } else {
        outputs.is_valid = false;
        outputs.error_message = result.error_message;
      }
      
      function setObject(objectToSet, fields, data) {
        for(var key in fields){
        	objectToSet[fields[key]] = data[fields[key]]; 
        }
      }
      
    })(inputs, outputs);
