- document: sys_hub_step_instance
  document_key: 7fa6c875c723101020dab6c427c2608c
  order: '600'
  sys_class_name: sys_variable_value
  sys_created_by: admin
  sys_created_on: 2020-09-29 17:47:57
  sys_id: 08b6c875c723101020dab6c427c2609c
  sys_mod_count: '3'
  sys_tags: ''
  sys_updated_by: admin
  sys_updated_on: 2020-09-30 15:29:01
  value: |-
    (function execute(inputs, outputs) {
        var servicenowLDSBatchingUtil = new ServiceNowLDSBatchingUtil();
        var servicenowLDSErrorHandler = new ServiceNowLDSErrorHandler();
        var languageDetector = new sn_ml.LanguageDetector();
        var texts = inputs.texts;
        var splitArrays = servicenowLDSBatchingUtil.batchBulkDetectTexts(texts);
        var response = {};
        var RESTCalls = 0;
        outputs.status = 'Success';

        for (var i = 0; i < splitArrays.length; i++) {
            var textsToDetect = splitArrays[i];
            var detections = [];
            var ldsResponse = languageDetector.detectLanguage(textsToDetect);
            RESTCalls = RESTCalls + 1;
            if (ldsResponse['statusMessage'] === 'SUCCESS' && ldsResponse['statusCode'] == 200) {
                for (var j = 0; j < ldsResponse.detections.length; j++) {
                    var ldsResponseNode = ldsResponse.detections[j];
                    var detection = {};
                    detection["detected_language"] = {
                        "code": ldsResponseNode.detectedLanguage.language,
                        "confidence": ldsResponseNode.detectedLanguage.confidence
                    };
                    detection["status"] = "Success";

                    detection["alternatives"] = [];
                    for (var k = 0; k < ldsResponseNode.alternatives.length && k < 4; k++) {
                        var alternative = {
                            "code": ldsResponseNode.alternatives[k].language,
                            "confidence": ldsResponseNode.alternatives[k].confidence
                        };
                        detection["alternatives"].push(alternative);
                    }
                    detections.push(detection);
                }
            } else {
                var errorObj = servicenowLDSErrorHandler.detectLanguageHandler(ldsResponse.statusMessage);
                outputs.status = "Error";
                for (var j = 0; j < textsToDetect.length; j++) {
                    var detection = {
                        "status": "Error",
                        "error_code": errorObj.errorCode,
                        "error_message": errorObj.errorMessage
                    };
                    detections.push(detection);
                }
                gs.error("Error while detecting the language of text using ServiceNow Language Detection Service. Error:" + ldsResponse.statusMessage + " Response received:" + ldsResponse);
            }

            for (var detect_index = 0; detect_index < detections.length; detect_index++) {
                response[textsToDetect[detect_index]] = detections[detect_index];
            }
        }
        var rearrangeResultFromScript = servicenowLDSBatchingUtil.rearrangeJSONResult(texts, response);
        outputs.detections = rearrangeResultFromScript;
        outputs.rest_calls = RESTCalls;
    })(inputs, outputs);
