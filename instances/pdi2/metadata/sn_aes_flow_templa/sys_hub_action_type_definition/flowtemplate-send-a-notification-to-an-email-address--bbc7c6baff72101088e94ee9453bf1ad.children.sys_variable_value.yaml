  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      
      var inputScope = inputs.flow_scope_sys_id;
      var newFlow = inputs.new_flow_sys_id;
      var emailSubject = inputs.email_subject;
      var emailTo = inputs.email_to;
      var emailBody = inputs.email_body;
      var triggerTable = inputs.trigger_table;
      
      //update trigger table
      sn_flow.FlowTemplates.updateFlowTrigger(newFlow, 'table', triggerTable);
      
      // update email subject
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'ah_subject', emailSubject);

      // update email To
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'ah_to', emailTo);
        
      // update email body
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'ah_body', emailBody);
            
    })(inputs, outputs);
