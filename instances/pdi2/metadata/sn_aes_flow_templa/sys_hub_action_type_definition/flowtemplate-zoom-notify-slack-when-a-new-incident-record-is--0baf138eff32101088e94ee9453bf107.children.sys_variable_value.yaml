  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      var inputScope = inputs.flow_scope_sys_id;
      var triggerTable = inputs.trigger_table;
      var newFlow = inputs.new_flow_sys_id;
      var slackChannel = inputs.slack_channel;
      var zoomUserId = inputs.zoom_user_id;
      var zoomConnection = inputs.zoom_connection;
      var slackConnection = inputs.slack_connection;
      
      //update trigger table
      sn_flow.FlowTemplates.updateFlowTrigger(newFlow, 'table', triggerTable);

      // update zoom user id
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'user_id', zoomUserId);
       
      // update slack channel
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '3', 'ah_channel', slackChannel);
      
      //update active zoom and slack connection
      new global.FlowTemplatesHelper().activateConnection(zoomConnection);
      new global.FlowTemplatesHelper().activateConnection(slackConnection);
    })(inputs, outputs);
