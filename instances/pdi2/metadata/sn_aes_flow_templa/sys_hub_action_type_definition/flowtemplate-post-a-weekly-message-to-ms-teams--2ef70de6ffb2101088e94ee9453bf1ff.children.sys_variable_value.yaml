  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      function formatWeekly(strInput) {
      	if (strInput.length === 0) 
          return "00";
        else if (strInput.length === 1) 
          return "0" + strInput;
        else
          return strInput;
      };
      
      var inputScope = inputs.flow_scope_sys_id;
      var newFlow = inputs.new_flow_sys_id;
      var msTeamsWebhookUrl = inputs.msteams_webhook_url;
      var msTeamsTitle = inputs.msteams_title;
      var msTeamsMessage = inputs.msteams_message;
      var weeklyDay = inputs.weekly_day;
      var weeklyHour = inputs.weekly_hour;
      var weeklySecond = inputs.weekly_second;
      var weeklyMinute = inputs.weekly_minute;
     
      var weeklyDayValue = -1;
      // 1 = Monday, 2 = Tuesday, 7 = Sunday
      if (weeklyDay.toUpperCase() === "MONDAY") {
        weeklyDayValue = 1;
      } else if (weeklyDay.toUpperCase() === "TUESDAY") {
        weeklyDayValue = 2;
      } else if (weeklyDay.toUpperCase() === "WEDNESDAY") {
        weeklyDayValue = 3;
      } else if (weeklyDay.toUpperCase() === "THURSDAY") {
        weeklyDayValue = 4;
      } else if (weeklyDay.toUpperCase() === "FRIDAY") {
        weeklyDayValue = 5;
      } else if (weeklyDay.toUpperCase() === "SATURDAY") {
        weeklyDayValue = 6;
      } else if (weeklyDay.toUpperCase() === "SUNDAY") {
        weeklyDayValue = 7;
      }
      
      if (weeklyDayValue !== -1) {
        sn_flow.FlowTemplates.updateFlowTrigger(newFlow, 'day_of_week', weeklyDayValue);  
      }

      var value = "1970-01-01 " + formatWeekly(weeklyHour) + ":" + formatWeekly(weeklyMinute) + ":" + formatWeekly(weeklySecond);
      sn_flow.FlowTemplates.updateFlowTrigger(newFlow, 'time', value);
      
      // update MS Teams webhookURL
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'ah_webhook_url', msTeamsWebhookUrl);

      // update MS Teams Title
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'ah_title', msTeamsTitle);
        
      // update MS Teams Title
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'ah_message', msTeamsMessage);
      
    })(inputs, outputs);
