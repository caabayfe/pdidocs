  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      
      var inputScope = inputs.flow_scope_sys_id;
      var newFlow = inputs.new_flow_sys_id;
      var smsFrom = inputs.from;
      var smsTo = inputs.to;
      var textMessage = inputs.text_message;
      var triggerTable = inputs.trigger_table;
      var twilioConnection = inputs.twilio_connection;

      //update trigger table
      sn_flow.FlowTemplates.updateFlowTrigger(newFlow, 'table', triggerTable);

      // here 1 is the order of the action instance record for the newFlow
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'from', smsFrom);

      // here 1 is the order of the action instance record for the newFlow
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'to', smsTo);
        
      // here 1 is the order of the action instance record for the newFlow
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '1', 'text_message', textMessage);  

      //update active twilio connection
      new global.FlowTemplatesHelper().activateConnection(twilioConnection);
      
    })(inputs, outputs);
