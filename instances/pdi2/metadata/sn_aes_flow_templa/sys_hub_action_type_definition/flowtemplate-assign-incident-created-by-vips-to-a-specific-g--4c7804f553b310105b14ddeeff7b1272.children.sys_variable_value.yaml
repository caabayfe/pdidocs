  value: |-
    (function execute(inputs, outputs) {
    // ... code ...
      var inputScope = inputs.flow_scope_sys_id;
      var triggerTable = inputs.trigger_table;
      var newFlow = inputs.new_flow_sys_id;
      var assignmentGroupVIP = inputs.assignment_group_vip;
      var assignmentGroupOthers = inputs.assignment_group_others;

      //set trigger table
      sn_flow.FlowTemplates.updateFlowTrigger(newFlow, 'table', triggerTable);
      
      
      // update assignment group for VIPs
      var group = new GlideRecord("sys_user_group");
      group.get(assignmentGroupVIP);
      var display = group.getDisplayValue();
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '2', 'values', 'assignment_group={"display":"' + display +'","value":"' + assignmentGroupVIP + '"}');
      
      
      // update record table for vips
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '2', 'table_name', triggerTable);

      
      // update assignment group for others
      var group = new GlideRecord("sys_user_group");
      group.get(assignmentGroupOthers);
      var display = group.getDisplayValue();
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '4', 'values', 'assignment_group={"display":"' + display +'","value":"' + assignmentGroupOthers + '"}');
        
      // update record table for others
      sn_flow.FlowTemplates.updateFlowActions(newFlow, '4', 'table_name', triggerTable);
        
    })(inputs, outputs);
