description: |-
  <p>Checks if the Dynamic Translation plugin is installed and configured for a Translation Service Provider.</p>
  <p>Note: <ul>
                           <li>If the input is empty, checks if a default Translation Service Provider is configured.</li>
                           <li>If a translator is provided, checks if  that Translation Service Provider is configured
  </ul></p>
  <p>
  	<b>Inputs:</b>
  </p>
  <ul>
  	<li>
  		<strong>Translator</strong> - Translation Service Provider to verify if it is configured.
  	</li>
  </ul>
  <p>
  	<b>Outputs:</b>
  </p>
  <ul>
  			<li><strong>Detection Enabled</strong> - Flag that indicates whether getDetectedLanguage() method is enabled.</li>
  			<li><strong>Translation Enabled</strong> -  Flag that indicates whether getTranslation() method is enabled.</li>
  			<li><strong>Batch Detection Enabled</strong> - Flag that indicates whether getDetectedLanguages() method is enabled.</li>
  			<li><strong>Batch Translation Enabled</strong> -  Flag that indicates whether getTranslations() method is enabled.</li>
  	
  </ul>

  <p><a target="_blank"
         href="/api/now/v1/context_doc_url/Dynamic_Translation_Spoke">Learn
          More</a></p>
