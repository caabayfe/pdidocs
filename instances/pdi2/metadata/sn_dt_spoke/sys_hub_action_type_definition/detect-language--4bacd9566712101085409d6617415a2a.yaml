description: |-
  <p>Detects the language of text using the configured translation service provider.</p>
  <p>
  	<b>Inputs:</b>
  </p>
  <ul>
  	<li><strong>Text</strong> - Text to use to detect the language.</li>
  	<li><strong>Translator</strong>  - Translation service used to detect the language of text (not case-sensitive)</li>
      <li><strong>Source</strong> - Origin from where the action is triggered</li>
  </ul>
  <p>
  	<b>Outputs:</b>
  </p>
  <ul>
  	<li>
  		<strong>Detected Language</strong> - Object containing parameters that describe the detected language.
  		<ul>
  			<li> <strong>Code</strong> - Language code of the detected language.</li>
  			<li> <strong>Confidence</strong> - Float value indicating the confidence level of the detected language result.</li>
  			<li> <strong>Name</strong> - Language code of the detected language.</li>
  		</ul>
  	</li>
  	<li>
  		<strong>Alternatives</strong> - Array of objects containing the description of other languages that may also be a match.
                  <br/><strong>Alternative :</strong>
  		<ul>
  			<li> <strong>Code</strong> - Language code of the detected language.</li>
  			<li> <strong>Confidence</strong> - Float value indicating the confidence level of the detected language result.</li>
  			<li> <strong>Name</strong> - Language code of the detected language.</li>
  		</ul>
  	</li>
  	<li>
  		<strong>Translator</strong> -Translation service used to detect the language.
  	</li>
  	<li>
  		<strong>Error Message</strong> - Reason for error. Populated only when an error occurs.
  	</li>
  	<li>
  		<strong>Error Code</strong> - Code for error. Populated only when an error occurs.
  	</li>
  </ul>
  <p>
  	<b>Error Codes - Error Messages:</b>
  </p>
  <ul>
      <li>40000 - Text is missing or invalid.</li>
      <li>40001 - Dynamic Translation plugin is not installed</li>
      <li>40003 - Translator (\"translator\" field) is invalid.</li>
      <li>40004 - <translator> translator is not configured.</li>
      <li>40005 - <translator> translator is inactive.</li>
      <li>40006 - Additional parameters are invalid.</li>
      <li>40009 - Maximum time limit has been exceeded.</li>
      <li>40011 - Default translator is not configured for detection.</li>
      <li>40013 - <translator> translator is not configured for detection.</li>
      <li>40050 - Error code to populate error messages from Translator instead of standardized error messages.</li>
      <li>40051 - Unknown error occurred.</li>
      <li>40052 - Text has exceeded its maximum length.</li>
      <li>40055 - Request is not authorized because credentials are missing or invalid.</li>
  </ul>

  <p>To use this action, install the Dynamic Translation plugin and configure the Dynamic Translation framework for a translation service provider. <a target="_blank"  href="/api/now/v1/context_doc_url/Dynamic_Translation_Spoke">Learn More</a></p>
