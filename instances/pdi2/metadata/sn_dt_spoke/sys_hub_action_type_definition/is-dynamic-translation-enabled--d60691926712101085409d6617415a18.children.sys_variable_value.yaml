  value: |-
    (function execute(inputs, outputs) {
        var translator;
        if (inputs.translator) {
            translator = inputs.translator;
        }
        try {
            var response = sn_dt_api.DynamicTranslation.isEnabled(translator);
            outputs.detection = response.detection;
            outputs.translation = response.translation;
          	outputs.batch_detection = response.batchDetection;
          	outputs.batch_translation = response.batchTranslation;
        } catch (error) {}
    })(inputs, outputs);
