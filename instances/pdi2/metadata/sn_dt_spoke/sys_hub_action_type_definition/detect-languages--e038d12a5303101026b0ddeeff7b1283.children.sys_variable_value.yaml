  value: |-
    function getDetections(detectedResponse) {
        var detections = [];
        for (var i = 0; i < detectedResponse.detections.length; i++) {
            var detection = {};
            detection["isError"] = detectedResponse.detections[i].isError;
            if (detectedResponse.detections[i].isError) {
                detection["error_code"] = detectedResponse.detections[i].code;
                detection["error_message"] = detectedResponse.detections[i].message;
            }
            else {
                detection["detected_language"] = detectedResponse.detections[i].detectedLanguage;
                detection["alternatives"] = detectedResponse.detections[i].alternatives;
            }
            detections.push(detection);
        }
        return detections;
    }
    (function execute(inputs, outputs) {
        var translator;
        if (inputs.translator) {
            translator = inputs.translator;
        }
        var event = {
            "source": "DT Spoke"
        };
        if (inputs.source) {
            event.eventName = inputs.source;
        }
        
        var texts = inputs.texts;
        try {
            var detectedResponse = sn_dt_api.DynamicTranslation.getDetectedLanguages(texts, {
                "translator": translator,
                "event": event
            });
            outputs.detections = getDetections(detectedResponse);
            outputs.translator = detectedResponse.translator;
            outputs.status = detectedResponse.status;
        } catch (error) {
            outputs.status = 'Error';
            outputs.error_code = '40051';
            outputs.error_message = gs.getMessage('Unknown error occured');
            if (error.message) {
                if (error.message === '"sn_dt_api" is not defined.') {
                    outputs.error_code = '40001';
                    outputs.error_message = gs.getMessage('Dynamic Translation plugin is not installed');
                } else {
                    var errorDetails = JSON.parse(error.message);
                    outputs.error_code = errorDetails.code;
                    outputs.error_message = errorDetails.message;
                    if (errorDetails.detections) {
                        outputs.detections = getDetections(errorDetails);
                    }
                }
            }
        }
    })(inputs, outputs);
