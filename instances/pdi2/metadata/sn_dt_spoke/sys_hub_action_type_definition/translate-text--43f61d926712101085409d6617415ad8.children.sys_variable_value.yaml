  value: |-
    (function execute(inputs, outputs) {
        var additionalParameters;
        var translator;
        var sourceLanguage;
        var targetLanguages;

        if (inputs.translator) {
            translator = inputs.translator;
        }
        if (inputs.sourceLanguage) {
            sourceLanguage = inputs.sourceLanguage;
        }
        // Include only non-null, non-empty string parameters
        var filteredAdditionalParameters = inputs.additionalParameters && inputs.additionalParameters.filter(function (p) {
            return p.parameterValue;
        });
        if (filteredAdditionalParameters && filteredAdditionalParameters.length > 0) {
            additionalParameters = filteredAdditionalParameters;
        }
        if (inputs.targetLanguages) {
            targetLanguages = inputs.targetLanguages;
        }
        var event = {
            "source": "DT Spoke"
        };
        if (inputs.source) {
            event.eventName = inputs.source;
        }
        var text = inputs.textToTranslate;
        try {
            var translatedResponse = sn_dt_api.DynamicTranslation.getTranslation(text, {
                "targetLanguages": targetLanguages,
                "additionalParameters": additionalParameters,
                "translator": translator,
                "sourceLanguage": sourceLanguage,
                "event": event
            });
            outputs.translations = translatedResponse.translations;
            outputs.translator = translatedResponse.translator;
            if (translatedResponse.detectedLanguage) {
                outputs.detected_language = translatedResponse.detectedLanguage;
            }
        } catch (error) {
            if (error.message) {
                if (error.message === '"sn_dt_api" is not defined.') {
                    outputs.error_code = '40001';
                    outputs.error_message = gs.getMessage('Dynamic Translation plugin is not installed');
                } else if (typeof JSON.parse(error.message) === 'object') {
                    if ('message' in JSON.parse(error.message)) {
                        outputs.error_message = JSON.parse(error.message).message;
                    }
                    if ('code' in JSON.parse(error.message)) {
                        outputs.error_code = JSON.parse(error.message).code;
                    }
                } else {
                    outputs.error_message = gs.getMessage("Unknown error occurred");
                    outputs.error_code = "40051";

                }
            } else {
                outputs.error_message = gs.getMessage("Unknown error occurred");
                outputs.error_code = "40051";
            }
        }
    })(inputs, outputs);
