description: |-
  <p>Translate text to multiple languages using the configured translation service provider.</p>
  <p>Note : The action can translate a text string into multiple target languages.</p>
  <p>
  	<b>Inputs:</b>
  </p>
  <ul>
  	<li>
  		<strong>Text To Translate</strong> - Text to be translated.
  	</li>

  	<li> <strong>Target Languages</strong> - Array of language codes to use to translate the text.</li>
  	<li> <strong>Translator</strong> - Translation service to use to translate the text.</li>
  	<li> <strong>Source Language</strong> - Language code of the source text.</li>
  	<li> <strong>Additional Parameters</strong> - Array of JSON objects. Each object contains key-value pairs that provide additional information for performing the translation. Supported parameter is textType and its value should be html or plain.
            <ul>
                   <li> <strong>Parameter Name</strong> - Key Name</li>
                   <li> <strong>Parameter Value</strong> - Value of the associated key.</li>
            </ul>

  	</li>
      <li><strong>Source</strong> - Origin from where the action is triggered</li>
  </ul>
  <p>
  	<b>Outputs:</b>
  </p>
  <ul>
  	<li>
  		<strong>Translations</strong> - Array of objects containing texts translated to the given target languages.
  		
  		<ul>
  			<br/> Sample translations response
  				<br/>{
                          <br/>"Translations": {
                          	<br/>"Translation": [
                                  <br/> {
                                  <br/>"targetLanguage": "it",
                               	<br/>"translatedText": "Ciao amico" },
                                  <br/>{
                                  <br/>"targetLanguage": "fr",
                                  <br/>"translatedText": "Bonjour cher ami"}
                              ]
                       	}
                        }
  		</ul>
  	</li>
          <li>
  		<strong>Translator</strong> - Translation service used to translate the text.
  	</li>
  	<li>
  		<strong>Detected Language</strong> -  Returned only if source language code is not populated in the input.
  	</li>
  	<li>
  		<strong>Error Message</strong> - Reason for error. Populated only when an error occurs.
  	</li>
  	<li>
  		<strong>Error Code</strong> - Code for error. Populated only when an error occurs.
  	</li>
  </ul>
  <p>
  	<b>Error Codes - Error Messages:</b>
  </p>
  <ul>
      <li>40000 - Text is missing or invalid.</li>
      <li>40001 - Dynamic Translation plugin is not installed.</li>
      <li>40002 - Default translator is not configured for translation.</li>
      <li>40003 - Translator (\"translator\" field) is invalid.</li>
      <li>40004 - <translator> translator is not configured.</li>
      <li>40005 - <translator> translator is inactive.</li>
      <li>40006 - Additional parameters are invalid.</li>
      <li>40007 - Target languages ("targetLanguages" field) are invalid</li>
      <li>40008 - Source language ("sourceLanguage" field) is invalid</li>
      <li>40009 - Maximum time limit has been exceeded.</li>
      <li>40012 - <translator> translator is not configured for translation.</li>
      <li>40050 - Error code to populate error messages from Translator instead of standardized error messages.</li>
      <li>40051 - Unknown error occurred.</li>
      <li>40052 - Text has exceeded its maximum length.</li>
      <li>40053 - Source language is invalid</li>
      <li>40054 - Target language is invalid.</li>
      <li>40055 - Request is not authorized because credentials are missing or invalid.</li>
      <li>40056 - Text cannot be translated to target languages.</li>
  </ul>

  <p>To use this action, install the Dynamic Translation plugin and configure the Dynamic Translation framework for a translation service provider. <a target="_blank"  href="/api/now/v1/context_doc_url/Dynamic_Translation_Spoke">Learn More</a></p> 
