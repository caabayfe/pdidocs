<div class="tool-tip-breadcrumbs">
  <span class="nav-pills" ng-if="($index <= c.breadcrumbs.length-4)" ng-repeat="item in c.breadcrumbs track by $index">
    <a ng-if="!$last" ng-href="{{appendParamsToUrl(item.url)}}">{{item.label}}</a>
      <a class="a-disabled" ng-if="$last" ng-href="{{appendParamsToUrl(item.url)}}">{{item.label}}</a>
      <i aria-hidden="true" ng-if="$index != (c.breadcrumbs.length-4)" class="fa fa-chevron-right"></i>
  </span>
</div>
