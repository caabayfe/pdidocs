css_variables: "            //=New Variables\n                  //==Text color\n                  $text-primary:                          sp-rgb(--now-color_text--primary, #FFFFFF);\n                  $text-secondary:                        sp-rgb(--now-color_text--secondary, #C1C5CD);\n                  $text-tertiary:                         sp-rgb(--now-color_text--tertiary, #8F95A1);\n                  $text-white:                            sp-rgb(--now-color--neutral-0, #ffffff);\n\n                  //==Backgrounds\n                  $background-primary:                    sp-rgb(--now-color_background--primary, #07080B);\n                  $background-secondary:                  sp-rgb(--now-color_background--secondary, #151920);\n                  $background-tertiary:                   sp-rgb(--now-color_background--tertiary, #252A35);\n                  $sp-homepage-bg:                        sp-rgb(--now-color_background--tertiary, #07080B);\n\n                  //==borders\n                  $border-primary:                        sp-rgb(--now-color_border--primary, #7E8592);\n                  $border-secondary:                      sp-rgb(--now-color_border--secondary, #5E6574);\n                  $border-tertiary:                       sp-rgb(--now-color_border--tertiary, #454D5B);\n\n                  //==colors for selected\n                  $select-primary: \t                    sp-rgb(--now-color_selection--primary-2, #009669);\n                  $select-primary-lighter: \t            sp-rgb(--now-color_selection--primary-0, #002A1D);\n                  $select-primary-darker: \t            sp-rgb(--now-color_selection--primary-4, #99D5C3);\n\n                  //==Primary color\n                  $brand-primary-darkest:                 sp-rgb(--now-color--primary-3, #CECFFF);\n                  $brand-primary-darker:                  sp-rgb(--now-color--primary-2, #A9AAFF);\n                  $brand-primary-lighter:                 sp-rgb(--now-color--interactive-1, #5758A8);\n                  $brand-primary-lightest:                sp-rgb(--now-color--primary-0, #28284D);\n                  $brand-primary-opacity:\t\t\t\t sp-rgb(--now-color--primary-0, #E3E4F2); // (with opacity 0.5) PM decision\n\n                  //==Brand Darker colors\n                  $brand-danger-darker:                   sp-rgb(--now-color_alert--critical-3, #E46876) !default;\n                  $brand-warning-darker:                  sp-rgb(--now-color_alert--warning-3, #A19840) !default;\n                  $brand-moderate-darker:                 sp-rgb(--now-color_alert--moderate-3 , #9C80FF!) !default;\n                  $brand-low-darker:                      sp-rgb(--now-color_alert--low-3 , #93969F) !default;\n                  $brand-success-darker:                  sp-rgb(--now-color_alert--positive-3, #6CA25A) !default;\n                  $brand-info-darker:                     sp-rgb(--now-color_alert--info-3, #3F9CD1) !default;\n                  $brand-danger-hover:                    sp-rgb(--now-button--primary-negative--background-color--hover, #ED9AA4) !default;\n\n                  //==spacing according to Ryan's design\n                  $sp-space--xxs:                         2px;\n                  $sp-space--xs:     \t                    4px;\n                  $sp-space--sm:     \t                    8px;\n                  $sp-space--md:    \t                    12px;\n                  $sp-space--lg:     \t                    16px;\n                  $sp-space--xl:\t\t                    24px;\n                  $sp-space--xxl: \t                    32px;\n                  $sp-space--3xl: \t                    40px;\n\n                  //==Box shadow according to Ryan's design\n                  $sp-panel-box-shadow:                   0 4px 8px 0 rgba(23,40,52,0.08);\n\n                  //==Subnav background-color\n                  $sp-nav-subnav:                         $sp-navbar-divider-color;\n\n                  //==End new variables ----/\n\n\n                  // Define NavBar\n                  $sp-navbar-height: \t\t                60px;\n                  $sp-navbar-divider-color:               sp-rgb(--now-color_chrome--divider-10, #08080D ) !default;\n                  $sp-navbar-inverse-bg:                  $navbar-inverse-bg !default;\n                  $navbar-inverse-bg:                     sp-rgb(--now-color_chrome--brand-10, #181826 ) !default;\n                  $navbar-inverse-link-color:             sp-rgb(--now-color--neutral-2, #07080B ) !default;\n                  $navbar-inverse-link-hover-color:       sp-rgb(--now-color--neutral-0, #ffffff ) !default;\n                  $sp-logo-margin-x: \t\t                6px !default;\n                  $sp-logo-margin-y:\t\t                6px !default;\n                  $sp-tagline-color:\t\t                $text-color !default;\n\n                  // Define Body\n                  $body-bg:\t\t\t\t\t\t\t\t              $background-secondary!default;\n                  $sp-body-bg:\t\t\t                    $background-secondary;\n                  $table-hover:                         sp-rgb(--now-color_surface--brand-1, #1A1B33;\n\n                  $text-color:\t\t\t\t\t\t\t            $text-primary!default;\n                  $text-muted:\t\t\t\t\t\t\t            $text-tertiary!default;\n\n                  //## Gray and brand colors for use across Bootstrap.\n                  $gray-base:                             sp-rgb(--now-color--neutral-21, #000000);\n                  $gray-darker:                           sp-rgb(--now-color--neutral-18, #151920);\n                  $gray-dark:                             sp-rgb(--now-color--neutral-16, #252A35);\n                  $gray:                                  sp-rgb(--now-color--neutral-11, #4f5664);\n                  $gray-light:                            sp-rgb(--now-color--neutral-9, #6E7583);\n                  $gray-lighter:                          sp-rgb(--now-color--neutral-1, #F6F6F8);\n\n                  $brand-primary:                         sp-rgb(--now-color--primary-1, #8486FF) !default;\n                  $brand-danger:                          sp-rgb(--now-color_alert--critical-2, #DB3548) !default;\n                  $brand-warning:                         sp-rgb(--now-color_alert--warning-2, #817600) !default;\n                  $brand-moderate:                        sp-rgb(--now-color_alert--moderate-2, #7B56FF) !default;\n                  $brand-low:                             sp-rgb(--now-color_alert--low-2, #717681) !default;\n                  $brand-success:                         sp-rgb(--now-color_alert--positive-2, #3F8527) !default;\n                  $brand-info:                            sp-rgb(--now-color_alert--info-2, #007BC2) !default;\n\n                  $primary:                               $brand-primary;\n                  $warning:                               $brand-warning;\n                  $success:                               $brand-success;\n                  $info:                                  $brand-info;\n                  $danger:                                $brand-danger;\n                  $error:                                 $danger;\n\n                  $color-darkest:                         sp-rgb(--now-color--neutral-18, #151920);\n                  $color-darker: \t                      sp-rgb(--now-color--neutral-12, #454D5B);\n                  $color-dark:                            sp-rgb(--now-color--neutral-10, #5E6574);\n                  $color-disabled:                        sp-rgb(--now-color--neutral-6, #9FA5B0);\n                  $color-light:                           sp-rgb(--now-color--neutral-4, #C1C5CD);\n                  $color-lighter:                         sp-rgb(--now-color--neutral-2, #07080B);\n                  $color-lightest:                        sp-rgb(--now-color--neutral-0, #fff