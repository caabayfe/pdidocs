nverted navbar links\n                  $navbar-inverse-link-color:                 sp-rgb(--now-color--neutral-2, #07080B ) !default;\n                  $navbar-inverse-link-hover-color:           sp-rgb(--now-color--neutral-0, #ffffff ) !default;\n                  $navbar-inverse-link-hover-bg:              transparent !default;\n                  $navbar-inverse-link-active-color:          $navbar-inverse-link-hover-color !default;\n                  $navbar-inverse-link-active-bg:             sp-rgb(--now-color_chrome--divider-10, #08080D);\n                  $navbar-inverse-link-disabled-color:        sp-rgb(--now-color--neutral-3, #D3D6DC);\n                  $navbar-inverse-link-disabled-bg:           transparent;\n\n                  // Inverted navbar brand label\n                  $navbar-inverse-brand-color:                $navbar-inverse-link-color;\n                  $navbar-inverse-brand-hover-color:          $navbar-inverse-link-hover-color;\n                  $navbar-inverse-brand-hover-bg:             transparent;\n\n\n                  //== Navs\n                  //\n                  $nav-link-padding:                          $sp-space--sm $sp-space--lg;\n                  $nav-link-hover-bg:                         $background-secondary;\n                  $nav-disabled-link-color:                   $text-muted;\n                  $nav-disabled-link-hover-color:             $text-muted;\n\n                  //== Tabs\n                  $nav-tabs-border-color:                     transparent;\n                  $nav-tabs-link-hover-border-color:          transparent;\n                  $nav-tabs-active-link-hover-bg:             $select-primary;\n                  $nav-tabs-active-link-hover-color:          $text-white;\n                  $nav-tabs-active-link-hover-border-color:   $select-primary;\n                  $nav-tabs-justified-link-border-color:            transparent;\n                  $nav-tabs-justified-active-link-border-color:     $select-primary;\n\n                  //== Pills\n                  $nav-pills-border-radius:                   $border-radius-base !default;\n                  $nav-pills-active-link-hover-bg:            $select-primary;\n                  $nav-pills-active-link-hover-color:         $text-white;\n\n\n                  //== Pagination\n                  //\n                  $pagination-color:                          $link-color;\n                  $pagination-bg:                             $background-primary;\n                  $pagination-border:                    \t    $border-tertiary;\n\n                  $pagination-hover-color:                    $link-hover-color;\n                  $pagination-hover-bg:                       $background-secondary;\n                  $pagination-hover-border:                   $border-secondary;\n\n                  $pagination-active-color:                   $text-white;\n                  $pagination-active-bg:                      $brand-primary;\n                  $pagination-active-border:                  $brand-primary;\n\n                  $pagination-disabled-color:                 $text-muted;\n                  $pagination-disabled-bg:                    $background-primary;\n                  $pagination-disabled-border:                $border-tertiary;\n\n\n                  //== Pager\n                  //\n                  $pager-border-radius:                       $sp-space--lg;\n\n                  //== Form states and alerts\n                  //\n                  $state-success-text:                        $text-primary;\n                  $state-success-bg:                          sp-rgb(--now-color_alert--positive-0, #214615);\n                  $state-success-border:                      $brand-success;\n\n                  $state-info-text:                           $text-primary;\n                  $state-info-bg:                             sp-rgb(--now-color_alert--info-0, #00446B);\n                  $state-info-border:                         $brand-info;\n\n                  $state-warning-text:                        $text-primary;\n                  $state-warning-bg:                          sp-rgb(--now-color_alert--warning-0, #413B00);\n                  $state-warning-border:                      $brand-warning;\n\n                  $state-danger-text:                         $btn-danger-bg;\n                  $state-danger-bg:                           sp-rgb(--now-color_alert--critical-0, #7B1E28);\n                  $state-danger-border:                       $brand-danger;\n\n                  //== Popovers\n                  //\n                  $popover-bg:                                $background-primary;\n                  $popover-border-color:                      $border-tertiary;\n                  $popover-fallback-border-color:             $border-tertiary;\n                  $popover-title-bg:                          $background-secondary;\n\n\n                  //== Labels\n                  //\n                  $label-default-bg:                          sp-rgb(--now-color_alert--low-1, #555961);\n                  $label-primary-bg:                          $brand-primary-lightest;\n                  $label-success-bg:                          $state-success-bg;\n                  $label-info-bg:                             $state-info-bg;\n                  $label-warning-bg:                          $state-warning-bg;\n                  $label-danger-bg:                           $state-danger-bg;\n                  $label-color:                               $text-primary;\n                  $label-link-hover-color:                    $text-primary;\n\n\n                  //== Modals\n                  //\n                  $modal-inner-padding:                       $sp-space--lg;\n                  $modal-title-padding:                       $sp-space--lg;\n                  $modal-content-bg:                          $background-primary;\n                  $modal-content-border-color:                $border-tertiary;\n                  $modal-content-fallback-border-color:       $border-tertiary;\n\n                  $modal-backdrop-bg:                         $gray-base;\n                  $modal-backdrop-opacity:                    .5 !default;\n                  $modal-header-border-color:                 $border-tertiary;\n                  $modal-footer-border-color:                 $modal-header-border-color !default;\n\n                  //== Alerts\n                  //\n                  $alert-padding:                             $sp-space--lg;\n                  $alert-success-bg:            \t\t\t\t      $state-success-bg;\n                  $alert-success-text:          \t\t\t\t      $state-success-text;\n                  $alert-success-border:        \t\t\t\t      $state-success-border;\n\n                  $alert-info-bg:               \t\t\t\t      $state-info-bg;\n                  $alert-info-text:             \t\t\t\t      $state-info-text;\n                  $alert-info-border:           \t\t\t\t      $state-info-border;\n\n                  $alert-warning-bg:            \t\t\t\t      $state-warning-bg;\n                  $alert-warning-text:          \t\t\t\t      $state-warning-text;\n                  $alert-warning-border:        \t\t\t\t      $state-warning-border;\n\n                  $alert-danger-bg:             \t\t\t\t      $state-danger-bg;\n                  $alert-danger-text:           \t\t\t\t      $state-danger-text;\n                  $alert-danger-border:         \t\t\t\t      $state-danger-border;\n\n                  //== Progress bars\n                  //\n                  $progress-bg:                               $background-tertiary;\n                  $progress-bar-color:                        $text-white;\n\n                  //== List group\n                  //\n                  $list-group-bg:                          