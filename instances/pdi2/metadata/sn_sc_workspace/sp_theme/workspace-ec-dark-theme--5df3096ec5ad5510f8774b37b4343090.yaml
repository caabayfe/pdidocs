, #6CA25A);\n                  $btn-success-border:                    $btn-success-bg;\n\n                  $btn-info-color:                        $text-primary;\n                  $btn-info-bg:                           sp-rgb(--now-color_alert--info-1, #005F96);\n                  $btn-info-border:                       $btn-info-bg;\n\n                  $btn-warning-color:                     $color-lighter;\n                  $btn-warning-bg:                        sp-rgb(--now-color_alert--warning-1, #a19840);\n                  $btn-warning-border:                    $btn-warning-bg;\n\n                  $btn-danger-color:                      $color-lighter;\n                  $btn-danger-bg:                         sp-rgb(--now-color_alert--critical-3, #E46876);\n                  $btn-danger-border:                     $btn-danger-bg;\n\n                  $btn-link-disabled-color:               $text-muted;\n\n                  // Allows for customizing button radius independently from global border radius\n                  $btn-border-radius-base:                $border-radius-base;\n                  $btn-border-radius-large:               $border-radius-base;\n                  $btn-border-radius-small:               $border-radius-base;\n\n\n                  //== Forms\n                  //\n                  $input-bg:                              $background-primary;\n                  $input-bg-disabled:                     $background-secondary;\n                  $input-color:                           $text-primary;\n                  $input-border:                          $border-primary;\n\n                  $input-border-focus:                    sp-rgb(--now-color--focus-2, #647BFD);\n                  $input-color-placeholder:               $text-tertiary;\n\n                  $form-group-margin-bottom:              $sp-space--lg;\n                  $label-margin-bottom:                   $sp-space--xs;\n\n                  $legend-color