bile experience including its appearance, the layouts of individual screens, and the data you show on those screens."},{"message":"This quick onboarding tour will help you understand how to build an app in Mobile App Builder."},{"message":"Building an app in Mobile App Builder"},{"message":"To start building your mobile app screens, you must create or choose an application scope."},{"message":"An application scope ensures you can access the right records and data for creating workflows inside a mobile experience."},{"message":"Choose an application scope"},{"message":"Once you’ve chosen a scope, create a new mobile app config to configure a navigation bar. Then, add a launcher (a landing page for user events and content) to it so that users can access screens and record data in the mobile app experience."},{"message":"Add navigation options in your app"},{"message":"Now you can start creating different screens depending on the experience you want to provide and the data you want to show. Screen types include lists, calendars, maps, and more. After you create screens and connect them to your launcher or navigation bar, you can begin customizing their layout and appearance."},{"message":"Create screens to build the app''s foundation"},{"message":"You can show record information on the screens you created by connecting data to different UI elements such as sections, cards, and icons."},{"message":"To help users take action on the data, you can also add functions with icons or gestures."},{"message":"Customize your screens"},{"message":"When you want to preview your customizations in a mobile environment, follow the step-by-step instructions to download and set up one of the ServiceNow mobile apps on your device."},{"message":"After it''s set up, you can view all future customizations and changes by refreshing the app."},{"message":"Save and preview your app"},{"message":"Skip tour"},{"message":"This action cannot be undone."},{"message":"Changing the {0} will break all