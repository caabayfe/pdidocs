es like pictures, videos, and more."},{"message":"Use this record to display static images or links to videos in a launcher section."},{"message":"This is how a media section appears in the mobile app experience."},{"message":"This is a UI section that displays previews of charts, single scores, and other performance analytics widgets. Use it to show different visualizations for data sources and provide access to a specific chart or list screen."},{"message":"Horizontal"},{"message":"Vertical"},{"message":"Use these to provide navigational options and user actions throughout the mobile app experience."},{"message":"Card size"},{"message":"Create a custom card size if the standard (XS, S, M, L, & XL) do not meet your needs. All standard sizes have a card width of 304, except for XSmall, which has 148."},{"message":"Empty state"},{"message":"This is a visualization that displays in an empty space. Use it when no data is available to show."},{"message":"This is how an empty state appears in the mobile app experience."},{"message":"Launcher header"},{"message":"Use this record to add a custom message to the header of a launcher screen."},{"message":"This is how a launcher header appears in the mobile app experience."},{"message":"Related list map"},{"message":"This is a method for connecting related list items to their corresponding record screens. Use it to help users view the details for individual items on a related list."},{"message":"UI style"},{"message":"Manually modify the appearance of UI elements on a legacy card."},{"message":"This is a filtering option for a specific field. Use it to help users filter information on a screen after they set their preferred filtering criteria."},{"message":"This is how a filter condition appears in a filter in the mobile app experience."},{"message":"Input attribute"},{"message":"This is a method for getting data to use in an input. Use it to determine where the data comes from and how to manipulate it."},{"message":"This is h