api_name: global.Email Client - Quick Messages
batch_exclude: 'false'
description: Retrieve quick messages for an email draft associated with a target record.
mutates_server_data: 'false'
name: Email Client - Quick Messages
output_schema: ''
private: 'false'
props: |-
  [
   {
     "name": "targetTable",
     "label": "Target Table",
     "description": "Name of target table for this record",
     "readOnly": false,
     "fieldType": "table_name",
     "mandatory": true
   },
   {
     "name": "targetRecord",
     "label": "Target Record",
     "description": "Target Record Sys ID for this record",
     "readOnly": false,
     "fieldType": "string",
     "mandatory": true
   },
   {
      "name": "dirtyFields",
      "label": "Dirty Fields",
      "description": "Array of dirty fields inside the form",
      "readOnly": "false",
      "fieldType": "string",
      "mandatory": false,
      "defaultValue": "[]"
   }
  ]
query: |-
  query($targetTable: String!, $targetRecord: String!, $dirtyFields: [String!]) {
  	GlideEmail_Query {
  		getQuickMessages(table: $targetTable, id: $targetRecord, dirtyFields:  $dirtyFields) {
  			sysId
  			name
  			body
  		}
  	}
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Email Client - Quick Messages
sys_policy: ''
type: query
use_record_domain: 'false'
