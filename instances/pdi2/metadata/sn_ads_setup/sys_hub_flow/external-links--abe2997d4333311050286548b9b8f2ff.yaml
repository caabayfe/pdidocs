description: |-
  <p>External link process activity for Playbook Workspace Experience, that optionally waits for user to complete the flow data record.</p>
  <p><b>Inputs:</b></p>
  <ul>
      <li>
          <b>External Links</b> - [ { "title": "link title", "type": "document/video", "url": "link url" } ]<br />
          This will be displayed to the end user using Playbook Workspace Experience.
      </li>
      <li><b>Wait for user input</b> - When checked, does not wait for flow data to be in a completed state.</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
      <li><b>Record</b> - Flow Data Record.</li>
      <li><b>Automated</b> - True/False based on whether the flow waited for user input or not.</li>
  </ul>
