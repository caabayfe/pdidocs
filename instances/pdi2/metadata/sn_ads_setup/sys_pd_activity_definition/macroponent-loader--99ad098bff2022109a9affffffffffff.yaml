description: |-
  <p>With this task, Guided setup/Process authors can embed any UIB macroponent page using macroponent sys-id. Embedded page will be displayed in the playbook UI.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Macroponent Id</b> - Sys ID of macroponent page that will be displayed in Playbook experience.</li>
  <li><b>Props</b> - JSON object of the url parameter expected by macroponent page.</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul><li><b>Record</b> - Flow Data Record</li></ul>
  <p><b>Note:</b> If the embedded macroponent has navigation to different route in the same tab it might not work as expected, It may navigate user to differnt route.</p>
