  value: |-
    (function execute(inputs, outputs) {
        
        var users = inputs.users; 
        var incidentGr = inputs.incident;

        if (!users || (users && users.length == 0))
            outputs.error_message = gs.getMessage("Users should not be empty");
        if (!incidentGr || (incidentGr && !incidentGr.isValidRecord()))
            outputs.error_message = gs.getMessage("Incident Record is not valid");

        var allowedUsers = [];
        var sidebarChatUserUtil = new global.SidebarChatUserUtil();
        users.forEach(function(user) {
            var hasPermission = sidebarChatUserUtil.checkForPermission(user, incidentGr.getUniqueValue(), 'incident');
            if (hasPermission)
                allowedUsers.push(user);
        });

        outputs.allowed_users = allowedUsers;
    })(inputs, outputs);
