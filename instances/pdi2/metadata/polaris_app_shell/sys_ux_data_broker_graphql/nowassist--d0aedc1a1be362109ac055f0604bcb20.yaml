name: NowAssist
output_schema: ''
private: 'false'
props: ''
query: |-
  { 
      now { 
          nowAssistUtility {
              napActive
              # Enable once AIEX code is on track
              aielActiveForFulfiller
              napVoiceInputActive
              # Distinguishes LBF (ai_native_chat) from old NAP. aielActiveForFulfiller
              # is true for self_service_dialog too, so it cannot gate LBF-only data.
              getAielFulfillerExperience
              # Glide session domain, forwarded to the chat client so the conversation
              # is created in the domain the user is working in. Empty when domain
              # separation is off.
              getSessionDomain
          }
      }
  }
