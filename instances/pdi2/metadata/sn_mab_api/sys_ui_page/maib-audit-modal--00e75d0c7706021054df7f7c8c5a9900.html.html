<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<style>
	.modal-header{;
		display:none;
	}
	.modal-title{
		color:RGB(var(--now-alert--moderate--color,var(--now-color_alert--moderate-3,67,69,166)));
	}
	.modal-content{
		margin-top:250px;
		border-radius: 8px;
		border: 1px;
		height: 208px ;
	}

		font-size:24px !important;
		color:RGB(var(--now-alert--moderate--color,var(--now-color_alert--moderate-3,67,69,166)));

	}
	.icon-loading.icon-lg {
		margin-left: 50%;

<div class="modal-header" >
	<span class="icon-ai-sparkle-fill sparkle-icon"></span>
	<span class="modal-title h4">${gs.getMessage('Running audit...')}</span>
</div>
<div class="modal-body" >
	<span class="modal-title h4">${gs.getMessage('Running audit...')}</span>
	<button  data-dismiss="GlideModal" onclick="closeLoadingModal()" aria-label="Close" title="" class="btn btn-icon close icon-cross" id="maib_audit_modal_closemodal" data-original-title="Close"><span class="sr-only">Close</span></button><br/><br/><br/>
