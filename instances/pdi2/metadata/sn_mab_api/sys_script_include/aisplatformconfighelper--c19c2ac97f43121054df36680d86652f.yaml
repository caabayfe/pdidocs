description: |-
  The AisPlatformConfigHelper class manages configuration settings for various system tables. 

  It provides methods to retrieve the AIS datasource ID, search context configuration IDs, and default search result fields for a given table name. 

  The configurations are predefined and stored in the aisConfigs object.
