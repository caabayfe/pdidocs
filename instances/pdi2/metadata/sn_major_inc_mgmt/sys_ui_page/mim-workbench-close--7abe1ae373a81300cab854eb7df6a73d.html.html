<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
<style>
	.form-horizontal {
		margin-top: 5px;
		margin-bottom: 20px;
	}
	.close-incident-modal-textarea {
		resize: vertical;
		min-height: 120px
	}
	#dialog_buttons .btn{
		margin-left: 10px;
		padding-left: 15px;
		padding-right: 15px;
	}
	.control-label{
		padding-left: 0;
	}
</style>
<div class="form-horizontal">
	<div class="form-group" id="resolution-code-wrapper">
		<label class="col-sm-2 control-label" for="mim-resolution-code">
			<span mandatory="true" class="required-marker label_description"><span class="sr-only">${gs.getMessage('required')}</span></span> ${gs.getMessage('Resolution code')}
                </label>
		<div class="col-sm-4">
			<select id="mim-resolution-code" required="true"  class="form-control" onchange="closeIncidentModal.resolutionCodeOnChange()"><option value="">-- ${gs.getMessage("None")} --</option></select>
		</div>
	</div>
	<div class="form-group" id="resolution-notes-wrapper">
		<label class="col-sm-2 control-label" for="mim-resolution-notes">
                    <span mandatory="true" class="required-marker label_description"><span class="sr-only">${gs.getMessage('required')}</span></span> ${gs.getMessage('Resolution notes')}
                </label>
		<div class="col-sm-10">
			<textarea required="true" class="form-control close-incident-modal-textarea" id="mim-resolution-notes" type="text" onkeyup="closeIncidentModal.resolutionNotesOnChange()"></textarea>
		</div>
	</div>
</div>
<div id="dialog_buttons" class="clearfix pull-right">
	<button type="button" class="btn btn-default" onclick="closeIncidentModal.cancel()" title="${gs.getMessage('Close the dialog')}">${gs.getMessage('Cancel')}</button>
	<button type="button" class="btn btn-primary disabled" aria-disabled="true" id="mim-close-incident-button" onclick="closeIncidentModal.closeIncident()" title="${gs.getMessage('Close Major Incident')}">${gs.getMessage('Close Incident')}</button>
</div>
</j:jelly>
