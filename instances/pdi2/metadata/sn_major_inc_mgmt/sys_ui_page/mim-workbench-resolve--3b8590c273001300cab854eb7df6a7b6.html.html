<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<!-- To use <g:ui_reference/> in this UI page, below are the required JS.
		<g:requires name="scripts/functions.js" includes="true" />
		<g:requires name="scripts/functions_reference.js" includes="true" />
		<g:requires name="scripts/utils.js" includes="true" />
		<g:requires name="scripts/accessibility_tabindex.js" includes="true" />
		<g:requires name="scripts/slushbucket.js" includes="true" />
		<g:requires name="scripts/ac.js" includes="true" />
		<g:requires name="scripts/ac_derived_field_support.js" includes="true" />
		<g:requires name="scripts/popups.js" includes="true" />
		<g:requires name="scripts/classes/AutoComplete.js" includes="true" />
		<g:requires name="scripts/classes/SlushBucket.js" includes="true" />
		<g:requires name="scripts/classes/ajax/AJAXCompleter.js" includes="true" />
		<g:requires name="scripts/classes/ajax/AJAXReferenceControls.js" includes="true" />
		<g:requires name="scripts/classes/ajax/AJAXOtherCompleter.js" includes="true" />
		<g:requires name="scripts/classes/ajax/AJAXReferenceCompleter.js" includes="true" />
		<g:requires name="scripts/classes/ajax/AJAXReferenceCompleterMulti.js" includes="true" />
		<g:requires name="scripts/classes/ajax/AJAXTableCompleter.js" includes="true" />
		<g:requires name="scripts/classes/ajax/AJAXEmailClientCompleter.js" includes="true" />
		<j2:set var="jvar_theme" value="$[gs.getProperty('glide.css.theme.ui16')]"/>
		<g2:requires name="styles/css_includes_doctype.css" includes="true" params="c=$[gs.getCssCacheVersionString()]$[jvar_theme]" />
	-->
<style>
	.form-horizontal {
		margin-top: 5px;
		margin-bottom: 20px;
	}
	.resolve-modal-textarea {
		resize: vertical;
		min-height: 120px
	}
	#dialog_buttons .btn{
		margin-left: 10px;
		padding-left: 15px;
		padding-right: 15px;
	}
	.control-label{
		padding-left: 0;
	}
</style>
<div class="form-horizontal">
	<div class="form-group" id="resolution-code-wrapper">
		<label class="col-sm-2 control-label" for="mim-resolution-code">
			<span mandatory="true" class="required-marker label_description"><span class="sr-only">${gs.getMessage('required')}</span></span> ${gs.getMessage('Resolution code')}
                </label>
		<div class="col-sm-4">
			<select id="mim-resolution-code" required="true"  class="form-control" onchange="resolveModal.resolutionCodeOnChange()"><option value="">-- ${gs.getMessage("None")} --</option></select>
		</div>
	</div>
	<div class="form-group" id="resolution-notes-wrapper">
		<label class="col-sm-2 control-label" for="mim-resolution-notes">
                    <span mandatory="true" class="required-marker label_description"><span class="sr-only">${gs.getMessage('required')}</span></span> ${gs.getMessage('Resolution notes')}
                </label>
		<div class="col-sm-10">
			<textarea required="true" class="form-control resolve-modal-textarea" id="mim-resolution-notes" type="text" onkeyup="resolveModal.resolutionNotesOnChange()"></textarea>
		</div>
	</div>
</div>
<div id="dialog_buttons" class="clearfix pull-right">
	<button type="button" class="btn btn-default" onclick="resolveModal.close()" title="${gs.getMessage('Close the dialog')}">${gs.getMessage('Cancel')}</button>
	<button type="button" class="btn btn-primary disabled" aria-disabled="true" id="mim-resolve-button" onclick="resolveModal.resolve()" title="${gs.getMessage('Resolve Major Incident')}">${gs.getMessage('Resolve')}</button>
</div>
</j:jelly>
