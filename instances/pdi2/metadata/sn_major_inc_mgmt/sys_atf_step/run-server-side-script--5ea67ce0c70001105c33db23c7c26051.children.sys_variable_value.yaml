  value: |-
    (function(outputs, steps, params, stepResult, assertEqual) {
        var incident_sys_id = steps("27c7fb2473d33300c5e4660c4cf6a7c6").record_id;
        var incidentGr = new GlideRecord("incident");
        if (incidentGr.get(incident_sys_id)) {
            assertEqual({
                name: "state  validation",
                shouldbe: "6",
                value: incidentGr.getValue("state")
            });
            assertEqual({
                name: "Close notes validation",
                shouldbe: "Resolution notes copied from Parent Incident: Sample resolution notes",
                value: incidentGr.getValue("close_notes")
            });
            if (GlidePluginManager.isActive('com.snc.best_practice.incident.sandiego'))
                assertEqual({
                    name: "Close code validation",
                    shouldbe: "Solution provided",
                    value: incidentGr.getValue("close_code")
                });
            else
                assertEqual({
                    name: "Close code validation",
                    shouldbe: "Solved (Permanently)",
                    value: incidentGr.getValue("close_code")
                });
        }

    })(outputs, steps, params, stepResult, assertEqual);
