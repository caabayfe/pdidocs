  value: |-
    (function execute(inputs, outputs) {
      	try {
        	var analysisId = inputs.analysisId;
            var bias = inputs.bias;
            var isTune = inputs.tuneModel;
          	var result = {};
          
          	var analysisGr = new GlideRecord('nlu_analysis_definition');
          	analysisGr.get(analysisId);
          	
          	var solutionName = analysisGr.getDisplayValue('solution');
          	var solution = sn_ml.AgentZeroSolutionStore.get(solutionName);
    		var version = analysisGr.solution.version;
            
          	var result = {};
            if (isTune) {
              	result = new sn_nlu_workbench.NLUIARTuning(analysisId).tuneModel(bias);
            } else {
              	result = new sn_nlu_workbench.NLUIARTuning(analysisId).predictResults(version);
              	analysisGr.setValue('prediction', result.executionId);
              	analysisGr.update();
            }
          	outputs.status = result.status;
          	outputs.message = result.message;
        } catch (e) {
          outputs.status = 'failure';
          outputs.message = e.message;
        }
    })(inputs, outputs);
