schema: |-
  schema {
  	query: Query
  	mutation: Mutation
  }

  type Query {
  	getModelOptimizationChanges(executionId: String!, currentOutcome: [String]!, optimizedOutcome: String!, offset: Int!, limit: Int!, sortBy: String!, sortOrder: String!): ModelOptimizationResponse
  	getOptimizationNotifications(executionId: String!): OptNotificationsResponse
  	getTestRunData(executionId: String!): TestRunDataResponse 
  	getTestRunDataWithLabel(modelId: String!): TestRunDataResponseWithLabel 
  	getSuportedLanguages(releaseFeature: String!): ModelSupportedLanguage 
  	getConflictsCount(modelId: String!, type: ConflictType): ConflictCountResp
  	getConflictsCountForIntent(intentId: String!, type: ConflictType): ConflictCountResp
  	getConflictPairs(executionId: String!, intentPair: [String]!, filters: ConflictFilter, scope: String): ConflictPairsResponse
  	getBatchTestReportInfo(modelId: String!, isOptimize: Boolean, trainedVersion: String): ReportInfo
  	getTestSetQuality(models: [String]!, testSetId: String!, isOptimize: Boolean!): TestSetQualityResponse
  	getTestCoverage(model: String!): QualityValue
  	getExpertFeedbackModelList: ExpertFeedbackModelListResponse
  	getExpertFeedbackIntentList(modelId: String): ExpertFeedbackgetIntentListResponse
  	getNLUPerformanceOutcomeList(selectedIds: [String]!, encodedQuery: String!, includeDynamicTranslation: String!, offset: Int!, limit: Int!): NLUPerformanceOutcomeListResponse
  	getNLUPerformanceOutcomeStat(encodedQuery: String!, includeDynamicTranslation: String!): NLUPerformanceOutcomeStatResponse
  	getUnsupportedUtteranceCount(encodedQuery: String!): UnsupportedUtteranceCountResponse
  	getModelVersion(modelId: String!): ModelVersionResponse
  	getCapability(language: String!, modelVersion: String!): CapabilityResponse
  	getTestUtteranceCount(modelId: String!, intentName: String!): TestUtteranceCountResponse
  	getSkippedUtterancesCountForClone(modelId: String!, testSetId: String!): SkippedUtteranceCountResponse
  }

  type Mutation {
  	updateBatchTestSetStatus(testSetId: String!, stageTable: String!): String
  	updateFeedback(selectedIntent: String!, feedbackConfig: String!): UpdateFeedbackResponse
  	copyLabeledDataToBatchTest(modelId: String!, modelName: String!, testSetId: String!): TestSetQualityResponse
  	deleteTestUtterances(testUttrIds: [String]!): DeleteTestUtterancesResponse
  	copyTestSetData(sourceId: String!, targetId: String!): CopyTestSetResponse
  }

  type DeleteTestUtterancesResponse {
  	status: String,
  	count: Int
  }

  type TestUtteranceCountResponse {
  	status: String
  	message: String
  	count: Int
  }

  type UpdateFeedbackResponse {
  	status: String
  	message: String
  	reviewProgress: ExpertFeedbackProgress
  }

  type TestSetQualityResponse {
  	status: String
  	message: String
  	data: TestSetQualityResponseData
  }

  type  TestSetQualityResponseData {
  	qualityCheck: String
  	qualityData: [TestSetQualityData]
  }

  type TestSetQualityData {
  	name: String
  	type: String
  	value: QualityValue
  	message: String
  	skipedUtterances: String
  	title: String
  }

  type QualityValue {
  	total : Int
  	covered : Int
  	coverage : Float
  }

  type ConflictCountResp {
  	status: String!
  	count: Int
  	executionId: String
  	message: String
  }

  enum ConflictType {
  	critical
  	warning
  	high
  }

  type TestRunDataResponse {
  	status: String
  	message: String
  	data: TestRunData
  }

  type TestRunData{
  	currentCorrect: Int
  	currentCorrectAmongMultiple: Int
  	currentIncorrect : Int
  	currentSkipped: Int
  	recommendedCorrect: Int
  	recommendedCorrectAmongMultiple: Int
  	recommendedIncorrect : Int
  	recommendedSkipped: Int
  }

  type TestRunDataResponseWithLabel {
  	status: String
  	message: String
  	data: TestRunDataWithLabel
  }


  type TestRunDataWithLabel{
  	definitionId : String
  	executionId: String
  	selected_type: String
  	status: String
  	trainedVersion: String
  	publishedVersion: String
  	testTrainedVersion: String
  	current: [OutcomeCount]
  	optimized: [OutcomeCount]
  	isModelOptimizedEnough: Boolean	
  }

  type OutcomeCount {
  	id: String
  	title: String
  	value: Int	
  }

  type ModelOptimizationResponse {
  	status: String
  	count: Int
  	message: String
  	data: [ModelOptimizationResult]
  }


  type ModelOptimizationResult {
  	utterance: String,
  	expectedIntent: String,
  	currentPredictions: String,
  	optimizedPredictions: String
  }

  type ModelSupportedLanguage {
  	status: String
  	message: String
  	data: [String]
  }

  type OptNotificationsResponse {
  	status: String,
  	message: String,
  	notifications: [Notification]
  }

  type Notification {
  	type: String,
  	message: String
  }

  input ConflictFilter {
  	showModerate: Boolean
  	hideReviewed: Boolean
  }

  type UtteranceData {
  	id: String!
  	text: String!
  	original: String
  	readOnly: Boolean
  }

  type IntentData {
  	id: String!
  	name: String!
  }

  type UtterancePair {
  	sysId: String
  	ignored: Boolean
  	utterance1: UtteranceData
  	utterance2: UtteranceData
  	intent1: IntentData
  	intent2: IntentData
  }

  type ConflictPairsData {
  	critical: [UtterancePair]
  	high: [UtterancePair]
  }

  type ConflictPairsResponse {
  	status: String!
  	message: String
  	data: ConflictPairsData
  }

  type ReportInfo {
  	status: String
  	reportInfo: ReportData
  }

  type ReportData {
  	definitionId: String
  	executionId: String
  	status: String
  	hasCompletedReport: Boolean
  }

  type ExpertFeedbackModelData {
  	modelId: String!
  	displayName: String!
  	intentCount: Int!
  	name: String!
  	language: String!
  	lastTunedOn: String
  }

  type ExpertFeedbackModelList {
  	modelList: [ExpertFeedbackModelData]
  	hasPublishedModels: Boolean
  	uncategorizedUtterances: ExpertFeedbackProgress
  }

  type ExpertFeedbackModelListResponse {
  	status: String!
  	message: String
  	data: ExpertFeedbackModelList
  }

  # [TBD]
  type ExpertFeedbackReviewer {
  	userId: String
  	userName: String
  }

  type ExpertFeedbackProgress {
  	todo: Int
  	done: Int
  	further_review: Int
  }

  type ExpertFeedbackIntentData {
  	intentId: String!
  	name: String!
  	label: String!
  	reviewers: [ExpertFeedbackReviewer]
  	reviewProgress: ExpertFeedbackProgress
  }

  type ModelOptimizeInfo {
  	executionId: String
  	definitionId: String
  	status: String
  	lastTrainedVersionOptimizedOn: String
  	latestModelPublished: Boolean
  }

  type ExpertFeedbackgetIntentList {
  	optimizeData: ModelOptimizeInfo
  	labeledCountSinceLastOptimized: Int
  	intents: [ExpertFeedbackIntentData]
  }

  type ExpertFeedbackgetIntentListResponse {
  	status: String!
  	message: String
  	data: ExpertFeedbackgetIntentList
  }

  type NLUPerformanceOutcomeList {
  	id: String!
  	createdOn: String!
  	groupedUtterance: String
  	modelName: String
  	outcome: String
  	prediction: String
  	utterance: String!
  }

  type NLUPerformanceOutcomeListResponse {
  	status: String!
  	count: Int
  	message: String
  	data: [NLUPerformanceOutcomeList]
  }

  type NLUPerformanceOutcomeStat {
  	singleCorrect: Int!
  	correctAmongMultiple: Int!
  	singleIncorrect: Int!
  	incorrectAmongMultiple: Int!
  	noPrediction: Int!
  	singleUnknown: Int!
  	unsupported: Int!
  }

  type NLUPerformanceOutcomeStatResponse {
  	status: String!
  	data: NLUPerformanceOutcomeStat
  }

  type UnsupportedUtteranceCountResponse {
  	status: String!
  	count: Int!
  }

  type ModelVersionResponse {
  	version: String!
  }

  type NluProperty {
  	name: String!
  	value: String!
  }

  type CapabilityResponse {
  	status: String!
  	nluProperties: [NluProperty]
  }

  type CopyTestSetStat {
  	inserts: Int!
  	total: Int!
  }

  type CopyTestSetResponse {
  	status: String
  	data: CopyTestSetStat
  }

  type SkippedUtteranceCountResponse {
  	count: Int
  }
