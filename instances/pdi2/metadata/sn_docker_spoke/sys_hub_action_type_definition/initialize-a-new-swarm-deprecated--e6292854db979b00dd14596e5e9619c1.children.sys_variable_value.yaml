  value: |-
    (function execute(inputs, outputs) {
        inputs = new DockerUtils().trimStringInputs(inputs);

        var json_data = {};
        json_data.Spec = {};

        for (var key in inputs) {
            if (inputs[key]) {
                if (key === "ListenAddr" || key === "AdvertiseAddr" || key === "DataPathAddr" || key ===
                    "ForceNewCluster")
                    json_data[key] = inputs[key] ? inputs[key] : undefined;
            }
        }

        json_data.Spec.Name = inputs.Name ? inputs.Name : undefined;
        json_data.Spec.Labels = inputs.Labels ? new DockerUtils().parseJson(inputs.Labels, 'Labels') :
            undefined;
        json_data.Spec.Orchestration = inputs.Orchestration ? new DockerUtils().parseJson(inputs.Orchestration,
            'Orchestration') : undefined;
        json_data.Spec.Raft = inputs.Raft ? new DockerUtils().parseJson(inputs.Raft, 'Raft') : undefined;
        json_data.Spec.Dispatcher = inputs.Dispatcher ? new DockerUtils().parseJson(inputs.Dispatcher,
            'Dispatcher') : undefined;
        json_data.Spec.CAConfig = inputs.CAConfig ? new DockerUtils().parseJson(inputs.CAConfig, 'CAConfig') :
            undefined;
        json_data.Spec.EncryptionConfig = inputs.EncryptionConfig ? new DockerUtils().parseJson(inputs.EncryptionConfig,
            'EncryptionConfig') : undefined;
        json_data.Spec.TaskDefaults = inputs.TaskDefaults ? new DockerUtils().parseJson(inputs.TaskDefaults,
            'TaskDefaults') : undefined;
        outputs.payload = JSON.stringify(json_data);
    })(inputs, outputs);
