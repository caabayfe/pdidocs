copied_from_name: Inspect a Service
description: |-
  <p>Services are the definitions of tasks to run on a swarm. This action returns detailed information of a single service from a Docker Instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Service ID</b> - Service ID or name to be inspected.</li>
    <li><b>Insert Defaults</b> - If value is true then it will fill empty fields with default values in the response. Default is false.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Service</b> - Service object containing -
      <ul>
        <li>ID</li>
        <li>Version</li>
        <li>Created At</li>
        <li>Updated At</li>
        <li>Spec</li>
        <li>Endpoint</li>
        <li>Update Status</li>
        <li>ServiceStatus</li>
        <li>JobStatus</li>
      </ul>
    </li>
    <li><b>Service Information</b> - Information about the Service in JSON format, populated in case of success.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Message:</b></p>
  <ul>
    <li>service 'Service ID/Name' not found.</li>
    <li>Provided 'Service ID/Name' is invalid.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
