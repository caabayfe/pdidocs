copied_from_name: Look up Networks
description: |-
  <p>Networks are user-defined networks that containers can be attached to. This action returns a list of networks from the Docker Instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Filters</b> - JSON encoded value of the filters (a map[string][]string) to process on the networks list. Available filters:
      <ul>
        <li><b>driver</b> - Matches a network's driver. E.g. '{"driver":["overlay"]}'</li>
        <li><b>id</b> - Matches all or part of a network ID. E.g. '{"id":["q9f6ra8mkavlz9xvb31idldji"]}'</li>
        <li><b>label</b> - Key value of network label. E.g. '{"label":["MySQL"]}'</li>
        <li><b>name</b> - Matches all or part of a network name. E.g. '{"name":["ingress"]}'</li>
        <li><b>scope</b> - Filters networks by scope (swarm, global, or local). E.g. '{"scope":["global"]}'</li>
        <li><b>type</b> - Filters networks by type. The custom keyword returns all user-defined networks. E.g. '{"type":["custom"]}'</li>
      </ul>
    </li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Network</b> - Returns an array of Networks list.
      <ul>
        <li>Name</li>
        <li>Id</li>
        <li>Created</li>
        <li>Scope</li>
        <li>Driver</li>
        <li>Enable IPv6</li>
        <li>IPAM</li>
        <li>Internal</li>
        <li>Attachable</li>
        <li>Ingress</li>
      </ul>
    </li>
    <li><b>Networks List</b> - Returns an array of Networks list.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Message:</b></p>
  <ul>
    <li>Invalid filter 'filter key'.</li>
    <li> Provided filter key is invalid.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>
  <p><b>Additional Note:</b></p>
  <ul>
    <li>This action uses a different, smaller representation of a network than inspecting a single network.</li>
  </ul>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
