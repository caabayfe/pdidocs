  value: |-
    (function execute(inputs, outputs) {
        inputs = new DockerUtils().trimStringInputs(inputs);
        var json_data = {};
        var endpoint_config = {};
        var ipam_config = {};

        outputs.network_id = inputs.network_id;

        json_data['Container'] = inputs.container_id ? inputs.container_id : undefined;
        ipam_config['IPv4Address'] = inputs.endpointconfig.ipam_Config.ipv4_address ? inputs.endpointconfig
            .ipam_Config.ipv4_address : undefined;
        ipam_config['IPv6Address'] = inputs.endpointconfig.ipam_Config.ipv6_address ? inputs.endpointconfig
            .ipam_Config.ipv6_address : undefined;
        var linklocalips = inputs.endpointconfig.ipam_Config.link_local_ips;

        if (linklocalips.length <= 1 && linklocalips[0] != "") {
            ipam_config['LinkLocalIPs'] = [];
            for (var i in linklocalips)
                ipam_config.LinkLocalIPs.push(linklocalips[i]);
        }

        endpoint_config['IPAMConfig'] = ipam_config;

        var links = inputs.endpointconfig.links;
        if (links.length <= 1 && links[0] != "") {
            endpoint_config['Links'] = [];
            for (var j in links)
                endpoint_config.Links.push(links[j]);
        }

        var aliases = inputs.endpointconfig.aliases;
        if (aliases.length <= 1 && aliases[0] != "") {
            endpoint_config['Aliases'] = [];
            for (var k in aliases)
                endpoint_config.Aliases.push(aliases[k]);
        }

        endpoint_config['NetworkID'] = inputs.endpointconfig.network_id ? inputs.endpointconfig.network_id :
            undefined;
        endpoint_config['EndpointID'] = inputs.endpointconfig.endpoint_id ? inputs.endpointconfig
            .endpoint_id : undefined;
        endpoint_config['Gateway'] = inputs.endpointconfig.gateway ? inputs.endpointconfig.gateway :
            undefined;
        endpoint_config['IPAddress'] = inputs.endpointconfig.ip_address ? inputs.endpointconfig.ip_address :
            undefined;
        endpoint_config['IPPrefixLen'] = inputs.endpointconfig.ip_prefix_len ? inputs.endpointconfig
            .ip_prefix_len : undefined;
        endpoint_config['IPv6Gateway'] = inputs.endpointconfig.ipv6_gateway ? inputs.endpointconfig
            .ipv6_gateway : undefined;
        endpoint_config['GlobalIPv6Address'] = inputs.endpointconfig.global_ipv6_address ? inputs
            .endpointconfig.global_ipv6_address : undefined;
        endpoint_config['GlobalIPv6PrefixLen'] = inputs.endpointconfig.global_ipv6_prefix_len ? inputs
            .endpointconfig.global_ipv6_prefix_len : undefined;
        endpoint_config['MacAddress'] = inputs.endpointconfig.mac_address ? inputs.endpointconfig
            .mac_address : undefined;

        json_data['EndpointConfig'] = endpoint_config;
        outputs.payload = JSON.stringify(json_data);
    })(inputs, outputs);
