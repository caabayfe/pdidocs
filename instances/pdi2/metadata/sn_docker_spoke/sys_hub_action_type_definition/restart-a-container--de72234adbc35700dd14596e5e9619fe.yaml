description: |-
  <p>This action restarts a container in a Docker instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
  	<li><b>Container ID</b> - The ID  or name of the container to be restarted.</li>
  	<li><b>Time to Kill</b> - Time to wait before killing the container in seconds. Eg. 10</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  	<li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
  	<li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Message:</b></p>
  <ul>
  	<li>No such container: {Container ID}</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding F5 connection and credential must be created and associated with the F5 Connection & Credential alias. <a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
