description: |-
  <p>This action returns list of live stream of a container’s resource usage statistics.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Container ID</b> - The ID or name of the container.</li>
    <li><b>Stream</b> - Streams the output. If false, the stats will be output once and then it will disconnect.</li>
    <li><b>One Shot</b> - If true, only get a single stat instead of waiting for 2 cycles. Must be used with stream=false.</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Container Stats</b> - Object containing stats of the Container.
      <ul>
        <li>Name</li>
        <li>ID</li>
        <li>Read</li>
        <li>Preread</li>
        <li>Num Procs</li>
        <li>Pids Stats</li>
        <li>CPU Stats</li>
        <li>Pre CPU Stats</li>
        <li>Memory Stats</li>
      </ul>
    </li>
    <li><b>Container Stats Detail</b> - JSON Object containing detail stats of the Container.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <ul>
    <li>No such container.</li>
    <li>Server Error.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
