    (function execute(inputs, outputs) {
       inputs = new DockerUtils().trimStringInputs(inputs);
      if (inputs.status_code == 201) {
        outputs.status = "Success";
        outputs.volume_information = inputs.response;
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().createVolumeErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
