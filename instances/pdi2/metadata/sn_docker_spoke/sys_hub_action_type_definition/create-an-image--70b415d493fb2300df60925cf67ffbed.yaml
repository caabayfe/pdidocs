description: |-
  <p>This action creates an image in the Docker instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Repository Record</b> -  Repository record from Docker credentials table which contains the details about repository and respective credentials.</li>
    <li><b>Tag</b> - Tag or digest. This option can be used with input "Image name to Pull". Default value is set as 'latest'. E.g. "latest", "3.8". </li>
    <li><b>Platform</b>  - Platform information in case pulling an image.Format os[/arch[/variant]]. For eg. "linux/x64/dev"</li>

  </ul>

  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
    <li><b>Image Name</b> - Name of the docker image pulled.</li>
    <li><b>Image Tag</b> - The tag associated with the pulled docker image.</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <ul>
    <li>Pull access denied for, repository does not exist or may require 'docker login'.</li>
    <li>Unknown operating system or architecture: invalid argument.</li>
    <li>Incorrect/Invalid docker image link provided or Error processing tar file.</li>
    <li>User unauthorized: incorrect username or password.</li>
    <li>Image name or Image name-tag combination to pull not found.</li>
    <li>Tag cannot be empty.</li>
    <li>Mandatory inputs for Private Repository are missing in Docker Credentials table.</li>
    <li>One or more necessary inputs not provided.</li>
    <li>One or more provided inputs are invalid.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
