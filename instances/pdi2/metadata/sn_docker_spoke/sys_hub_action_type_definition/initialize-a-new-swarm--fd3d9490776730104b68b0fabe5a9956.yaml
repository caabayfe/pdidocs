copied_from_name: Initialize a New Swarm
description: |-
  <p>A swarm is a group of machines that are running Docker and joined into a cluster. This action initializes a new swarm in Docker Instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
  	<li><b>Listen Address</b> - Listen address used for inter-manager communication, and determining the networking interface used for the VXLAN Tunnel Endpoint (VTEP). This can either be an address/port or an interface/port. If the port number is omitted, the default swarm listening port is used. E.g. '192.168.1.1:4567' or 'eth0:4567'.</li>
  	<li><b>Default Address Pool</b> - Default Address Pool specifies default subnet pools for global scope networks.</li>
  	<li><b>Swarm Specification</b> - User modifiable swarm configuration.
  	<ul>
  	<li><b>Swarm Name</b> - Name of the swarm.</li>
  	<li><b>Labels</b> - User-defined key/value metadata.</li>
  	<li><b>Orchestration</b> - Orchestration configuration in swarm.</li>
  	<li><b>Raft</b> - Raft Configuration in Swarm like number of raft snapshots to retain.</li>
  	<li><b>Dispatcher</b> - Dispatcher configuration like dispatcher heartbeat.</li>
  	<li><b>CA Config</b> - Certificate configuration like validity period of CA.</li>
  	<li><b>Encryption Config</b> - Parameters related to encryption-at-rest.</li>
  	<li><b>Task Defaults</b> - Defaults for creating tasks in this cluster.</li>
  	</ul>
  	</li>
    <li><b>Additional Fields</b> - Additional fields or values you wish to add to the swarm details.</li>
  </ul>   
  <p><b>Outputs:</b></p>
  <ul>
  	<li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
  	<li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  	<li><b>Node ID</b> - The ID of the node created in Docker.</li>
  </ul>
  <p><b>Error Messages:</b></p>
  <ul>
  	<li>This node is already part of a swarm. Use "docker swarm leave" to leave this swarm and join another one.</li>
  	<li>Manager stopped: failed to listen on remote API address: listen tcp 'IP:port': bind: cannot assign requested address.</li>
  	<li>Swarm spec must be named "default".</li>
  	<li>JSON provided for 'input variable' is invalid.</li>
  	<li>Data path address must be a non-zero IP address or network interface (without a port number).</li>
  	<li>Advertise address must be a non-zero IP address or network interface (with optional port number).</li>
          <li>Manager stopped: failed to listen on remote API address: listen tcp: address tcp/abc: unknown port.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>
  <p><b>Additional Note:</b></p>
  <ul>
    <li>Refer the Docker Rest API documentation for the detailed description of fields and descriptions of each of the inputs.</li>
    <li>The api version 'v.1.37' only supports the name of the swarm to be 'default'.</li>
  </ul>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
