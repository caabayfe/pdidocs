copied_from_name: Look up Containers
description: |-
  <p>This action lists containers on Docker Instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Return All Containers</b> - Flag to indicate whether to list all containers. The default is to list only running containers.</li>
    <li><b>Limit</b> - Limits the output to the number provided and lists most recently created containers including the ones which are not running. E.g. 78</li>
    <li><b>Return Container Size</b> - Accepts 'true' or 'false' values, if set to 'true' will return the size of container as fields 'SizeRw' and 'SizeRootFs'.</li>
    <li><b>Filters</b> - Filters to process on the container list, encoded as JSON. E.g. {"status": ["paused"]}, {"id": ["Container ID"]}</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Containers</b> - Containers list containing -
      <ul>
        <li>ID</li>
        <li>Names</li>
        <li>Image</li>
        <li>Image ID</li>
        <li>Command</li>
        <li>Created</li>
        <li>Ports</li>
        <li>Size Rw</li>
        <li>Size Root Fs</li>
        <li>Labels</li>
        <li>State</li>
        <li>Status</li>
        <li>Host Config</li>
        <li>Network Settings</li>
        <li>Mounts</li>
      </ul>
    </li>
    <li><b>Containers List</b> - List of containers in JSON format in case of "Success".</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Messages:</b></p>
  <ul>
    <li>Provided value for Filter input is invalid or of incorrect format.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
