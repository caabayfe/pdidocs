  value: |-
    (function execute(inputs, outputs) {
      if (inputs.status_code == 200) {
        outputs.status = "Success";
        outputs.service_info = inputs.response;
        outputs.service = JSON.parse(inputs.response);
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().inspectServiceErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
