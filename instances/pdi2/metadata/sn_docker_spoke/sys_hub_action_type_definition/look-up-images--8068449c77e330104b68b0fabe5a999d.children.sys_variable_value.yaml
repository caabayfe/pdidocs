    (function execute(inputs, outputs) {
        if (inputs.status_code == 200) {
            outputs.status = "Success";
            outputs.images_list = inputs.response;
            outputs.images = JSON.parse(inputs.response);
        } else {
            outputs.status = "Error";
            outputs = new DockerErrorHandler().listImagesErrorHandler(inputs, outputs);
        }
    })(inputs, outputs);
