    (function execute(inputs, outputs) {
      if (inputs.status_code == 200) {
        outputs.status = "Success";
        gs.info(inputs.response);
        outputs.containers_list = inputs.response;   
        outputs.containers_object = JSON.parse(inputs.response);
      } else {
        outputs = new DockerErrorHandler().listContainersErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
