  value: |-
    (function execute(inputs, outputs) {
      inputs = new DockerUtils().trimStringInputs(inputs);
      var repo_name = inputs.repo_record.repository_name;
      var repo_type = inputs.repo_record.repository_type;
      var user_name = inputs.repo_record.user_name.toString();
      var password =  new global.ScopedEncrypter().decrypt(inputs.repo_record.password); 
      var email_address = inputs.repo_record.email.toString();
      var server_address = inputs.repo_record.server_address.toString();
      
              if (repo_type == "Private Repository") {
                             if(user_name && password && email_address && server_address) {
      	                        var jsonData = {
      		                                  "username": user_name,
      		                                  "password": password,
      		                                  "email": email_address,
      		                                  "serveraddress": server_address
      	                                     };
                             var finalJSON = JSON.stringify(jsonData);
                             outputs.encoded_value = gs.base64Encode(finalJSON);
                          } else {
                          new DockerUtils().invalidDetails();
                          }
              }  
      var json_data = {};
      json_data.Name = inputs.name ? inputs.name : undefined;
      json_data.Labels = inputs.labels ? new DockerUtils().parseJson(inputs.labels , "Labels") : undefined;
      json_data.TaskTemplate = inputs.task_template ? new DockerUtils().parseJson(inputs.task_template , "Task Template") : undefined;
      json_data.Mode = inputs.mode ? new DockerUtils().parseJson(inputs.mode , "Mode") : undefined;
      json_data.UpdateConfig = inputs.update_config ? new DockerUtils().parseJson(inputs.update_config , "Update Config") : undefined;
      json_data.RollbackConfig = inputs.rollback_config ? new DockerUtils().parseJson(inputs.rollback_config , "Rollback Config") : undefined;
      json_data.Networks = inputs.networks ? new DockerUtils().parseJson(inputs.networks , "Networks") : undefined;
      json_data.EndpointSpec = inputs.endpoint_spec ? new DockerUtils().parseJson(inputs.endpoint_spec , "Endpoint Specification") : undefined;

      var image_name ;
      if(json_data.TaskTemplate && json_data.TaskTemplate.ContainerSpec && json_data.TaskTemplate.ContainerSpec.Image)
         image_name = json_data.TaskTemplate.ContainerSpec.Image.split(":");
      else
         throw "Incorrect Task Template format.";
      if (image_name[0] == repo_name) {
      outputs.payload = JSON.stringify(json_data);
      } else
      {
        new DockerUtils().invalidImageName();
      }
      
      outputs.service_id = inputs.service_id;
      outputs.registry_authorization_credentials = inputs.registry_authorization_credentials;
      outputs.rollback = inputs.rollback;

    })(inputs, outputs);
