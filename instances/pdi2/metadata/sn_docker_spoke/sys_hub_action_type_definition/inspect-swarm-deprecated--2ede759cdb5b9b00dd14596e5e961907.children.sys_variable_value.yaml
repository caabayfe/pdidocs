  value: |-
    (function execute(inputs, outputs) {
      inputs = new DockerUtils().trimStringInputs(inputs);
      if (inputs.status_code == 200) {
        outputs.status = "Success";
        outputs.response = inputs.response;
        outputs.worker_token = JSON.parse(inputs.response).JoinTokens.Worker;
        outputs.manager_token = JSON.parse(inputs.response).JoinTokens.Manager;
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().inspectSwarmErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
