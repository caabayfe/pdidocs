  value: |-
    (function execute(inputs, outputs) { 
      inputs = new DockerUtils().trimStringInputs(inputs);

      var json_data = {};

      json_data.ListenAddr = inputs.listen_address ? inputs.listen_address : undefined;
      json_data.AdvertiseAddr = inputs.advertise_address ? inputs.advertise_address : undefined;
      json_data.DataPathAddr = inputs.data_path_address ? inputs.data_path_address : undefined;
      json_data.RemoteAddrs = inputs.remote_address ? inputs.remote_address.split(',') : undefined;
      json_data.JoinToken = inputs.join_token ? inputs.join_token : undefined;

      outputs.payload = JSON.stringify(json_data);

    })(inputs, outputs);
