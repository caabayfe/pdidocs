copied_from_name: Look up Volumes
description: |-
  <p>This action returns a list of volumes from Docker.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Filters</b> - JSON encoded value of the filters to process on the volumes list. Available filters:
      <ul>
        <li><b>dangling</b> - When set to true( or '1'), returns all volumes that are not in use by a container. When set to false (or '0'), only volumes that are in use by one or more containers are returned. E.g. '{"dangling":["true"]}'</li>
        <li><b>driver</b> - Matches volumes based on their driver.</li>
        <li><b>label</b> - Matches volumes based on the presence of a label alone or a label and a value. E.g. '{"label":["voltype"]}' or '{"label" : {"voltype=test"}}'</li>
        <li><b>name</b> - Matches all or part of a volume name. E.g. '{"name":["myvol1"]}'</li>
      </ul>
    </li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Volumes</b> - Volumes list containing -
      <ul>
        <li>Volumes
          <ul>
            <li>Name</li>
            <li>Driver</li>
            <li>Mountpoint</li>
            <li>Created At</li>
            <li>Status</li>
            <li>Labels</li>
            <li>Scope</li>
            <li>Options</li>
            <li>Usage Data</li>
          </ul>
        </li>
        <li>Warnings</li>
      </ul>
    </li>
    <li><b>Volumes List</b> - List of volumes based on the inputs provided.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Message:</b></p>
  <ul>
    <li>Invalid filter 'filter key'.</li>
    <li>Filter values provided is invalid or of incorrect format.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p><b>Additional Note:</b></p>
  <ul>
    <li>If any of the provided Filters input does not exist, the API returns "Status:Success" and "Volumes List : {"Volumes":[],"Warnings":null}'.".</li>
  </ul>
  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>
  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
