  value: |-
    (function execute(inputs, outputs) {
    	inputs = new DockerUtils().trimStringInputs(inputs);

    	var json_data = {};
    	var Spec = {};

    	json_data['ListenAddr'] = inputs.ListenAddr ? inputs.ListenAddr : undefined;

    	var DefaultAddrPool = inputs.DefaultAddrPool;
    	if (DefaultAddrPool.length <= 1 && DefaultAddrPool[0] != "") {
    		json_data['DefaultAddrPool'] = [];
    		for (var i in DefaultAddrPool)
    			json_data.DefaultAddrPool.push(DefaultAddrPool[i]);
    	}

    	Spec['Name'] = inputs.Spec.Name ? inputs.Spec.Name : undefined;

    	var Labels = {};
    	var LabelFlag = false;
    	for (var i in inputs.Spec.Labels)
    		if (inputs.Spec.Labels[i].key) {
    			Labels[inputs.Spec.Labels[i].key] = inputs.Spec.Labels[i].value;
    			LabelFlag = true;
    		}
    	Spec['Labels'] = Labels;

    	if (inputs.Spec.Orchestration.TaskHistoryRetentionLimit) {
    		var Orchestration = {};
    		Orchestration['TaskHistoryRetentionLimit'] = inputs.Spec.Orchestration.TaskHistoryRetentionLimit ?
    			parseInt(inputs.Spec.Orchestration.TaskHistoryRetentionLimit) : undefined;
    		Spec['Orchestration'] = Orchestration;
    	}

    	var RaftFlag = false;
    	if (inputs.Spec.Raft.SnapshotInterval || inputs.Spec.Raft.KeepOldSnapshots || inputs.Spec.Raft
    		.LogEntriesForSlowFollowers || inputs.Spec.Raft.ElectionTick || inputs.Spec.Raft.HeartbeatTick) {
    		var Raft = {};
    		Raft['SnapshotInterval'] = inputs.Spec.Raft.SnapshotInterval ? parseInt(inputs.Spec.Raft
    			.SnapshotInterval) : undefined;
    		Raft['KeepOldSnapshots'] = inputs.Spec.Raft.KeepOldSnapshots ? parseInt(inputs.Spec.Raft
    			.KeepOldSnapshots) : undefined;
    		Raft['LogEntriesForSlowFollowers'] = inputs.Spec.Raft.LogEntriesForSlowFollowers ? parseInt(inputs
    			.Spec.Raft.LogEntriesForSlowFollowers) : undefined;
    		Raft['ElectionTick'] = inputs.Spec.Raft.ElectionTick ? parseInt(inputs.Spec.Raft.ElectionTick) :
    			undefined;
    		Raft['HeartbeatTick'] = inputs.Spec.Raft.HeartbeatTick ? parseInt(inputs.Spec.Raft
    			.HeartbeatTick) : undefined;
    		RaftFlag = true;
    		Spec['Raft'] = Raft;
    	}

    	if (inputs.Spec.Dispatcher.HeartbeatPeriod) {
    		var Dispatcher = {};
    		Dispatcher['HeartbeatPeriod'] = inputs.Spec.Dispatcher.HeartbeatPeriod ? parseInt(inputs.Spec
    			.Dispatcher.HeartbeatPeriod) : undefined;
    		Spec['Dispatcher'] = Dispatcher;
    	}

    	var CAConfig = {};
    	CAConfig['NodeCertExpiry'] = inputs.Spec.CAConfig.NodeCertExpiry ? parseInt(inputs.Spec.CAConfig
    		.NodeCertExpiry) : undefined;
    	CAConfig['SigningCACert'] = inputs.Spec.CAConfig.SigningCACert ? inputs.Spec.CAConfig.SigningCACert :
    		undefined;
    	CAConfig['SigningCAKey'] = inputs.Spec.CAConfig.SigningCAKey ? inputs.Spec.CAConfig.SigningCAKey :
    		undefined;
    	CAConfig['ForceRotate'] = inputs.Spec.CAConfig.ForceRotate ? parseInt(inputs.Spec.CAConfig
    		.ForceRotate) : undefined;
    	CAConfig['ExternalCAs'] = [];
    	var ExternalCAsFlag = false;
    	for (var i in inputs.Spec.CAConfig.ExternalCAs) {
    		var ExternalCA = {};
    		ExternalCA.Protocol = inputs.Spec.CAConfig.ExternalCAs[i].Protocol ? inputs.Spec.CAConfig
    			.ExternalCAs[i].Protocol : undefined;
    		ExternalCA.URL = inputs.Spec.CAConfig.ExternalCAs[i].URL ? inputs.Spec.CAConfig.ExternalCAs[i]
    			.URL : undefined;
    		ExternalCA.CACert = inputs.Spec.CAConfig.ExternalCAs[i].CACert ? inputs.Spec.CAConfig.ExternalCAs[
    			i].CACert : undefined;

    		var ExternalCAOptions = {};
    		var ExternalCAOptionsFlag = false;
    		for (var j in inputs.Spec.CAConfig.ExternalCAs[i].Options)
    			if (inputs.Spec.CAConfig.ExternalCAs[i].Options[j].key) {
    				ExternalCAOptions[inputs.Spec.CAConfig.ExternalCAs[i].Options[j].key] = inputs.Spec
    					.CAConfig.ExternalCAs[i].Options[j].value;
    				ExternalCAOptionsFlag = true;
    			}
    		if (ExternalCAOptionsFlag == true)
    			ExternalCA['Options'] = ExternalCAOptions;

    		if (ExternalCA.Protocol || ExternalCA.URL || ExternalCA.CACert || ExternalCAOptionsFlag == true) {
    			ExternalCAsFlag = true;
    			CAConfig.ExternalCAs.push(ExternalCA);
    		}
    	}
    	var CAConfig = false;
    	if (inputs.Spec.CAConfig.NodeCertExpiry || inputs.Spec.CAConfig.SigningCACert || inputs.Spec.CAConfig
    		.SigningCAKey || inputs.Spec.CAConfig.ForceRotate || ExternalCAsFlag == true) {
    		Spec['CAConfig'] = CAConfig;
    		CAConfig = true;
    	}

    	var EncryptionConfig = {};
    	EncryptionConfig['AutoLockManagers'] = new DockerUtils().checkBooleanValue(inputs.Spec
    		.EncryptionConfig.AutoLockManagers);
    	Spec['EncryptionConfig'] = EncryptionConfig;

    	var TaskDefaults = {};
    	var LogDriver = {};
    	LogDriver['Name'] = inputs.Spec.TaskDefaults.LogDriver.Name ? inputs.Spec.TaskDefaults.LogDriver
    		.Name : undefined;

    	var LogDriverOptions = {};
    	var LogDriverOptionsFlag = false;
    	for (var i in inputs.Spec.TaskDefaults.LogDriver.Options)
    		if (inputs.Spec.TaskDefaults.LogDriver.Options[i].key) {
    			LogDriverOptions[inputs.Spec.TaskDefaults.LogDriver.Options[i].key] = inputs.Spec.TaskDefaults
    				.LogDriver.Options[i].value;
    			LogDriverOptionsFlag = true;
    		}
    	if (LogDriverOptionsFlag == true)
    		LogDriver['Options'] = LogDriverOptions;

    	var TaskDefaultsFlag = false;
    	if (inputs.Spec.TaskDefaults.LogDriver.Name || LogDriverOptionsFlag == true) {
    		TaskDefaults['LogDriver'] = LogDriver;
    		Spec['TaskDefaults'] = TaskDefaults;
    		TaskDefaultsFlag = true;
    	}

    	if (inputs.Spec.Name || LabelFlag == true || inputs.Spec.Orchestration.TaskHistoryRetentionLimit ||
    		RaftFlag == true || inputs.Spec.Dispatcher.HeartbeatPeriod || CAConfig == true || Spec
    		.EncryptionConfig.AutoLockManagers || TaskDefaultsFlag == true)
    		json_data['Spec'] = Spec;

    	if (inputs.additional_fields)
    		json_data = new DockerUtils().parseAdditionalFields(inputs.additional_fields,
    			json_data);

    	outputs.payload = JSON.stringify(json_data);
    })(inputs, outputs);
