  value: |-
    (function execute(inputs, outputs) {
      if (inputs.status_code == 200) {
        outputs.status = "Success";
        outputs.node_id = inputs.response.replace(/['"]+/g, '');
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().initSwarmErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
