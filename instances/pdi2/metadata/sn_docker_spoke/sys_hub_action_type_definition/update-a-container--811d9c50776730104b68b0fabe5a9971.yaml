copied_from_name: Update a Container
description: |-
  <p>This action updates a container in Docker.</p>
  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Container ID:</b> ID or name of the container.</li>
    <li><b>Block IO Weight:</b> Block IO weight (relative weight). Accepts an integer between 0 and 1000. E.g. 500</li>
    <li><b>Block IO Weight Device:</b> Block IO weight (relative device weight) in the form [{"Path": "device_path", "Weight": weight}]. E.g. [ {"Path":"\etc\", "Weight":30} ]</li>
    <li><b>Block IO Device Read Bps:</b> Limit read rate (bytes per second) from a device, in the form [{"Path": "device_path", "Rate": rate}]. E.g. [ {"Path": "/dev/sda", "Rate": "1024"} ]</li>
    <li><b>Block IO Device Write Bps:</b> Limit write rate (bytes per second) to a device, in the form [{"Path": "device_path", "Rate": rate}]. E.g. [ {"Path": "/dev/sda", "Rate": "1024"} ]</li>
    <li><b>Block IO Device Read IOps:</b> Limit read rate (IO per second) from a device, in the form [{"Path": "device_path", "Rate": rate}]. E.g. [ {"Path": "/dev/sda", "Rate": "1024"} ]</li>
    <li><b>Block IO Device Write IOps:</b> Limit write rate (IO per second) to a device, in the form [{"Path": "device_path", "Rate": rate}]. E.g. [ {"Path": "/dev/sda", "Rate": "1024"} ]</li>
    <li><b>Devices:</b> A list of devices to add to the container. Accepts JSON inputs in an array with three fields "PathOnHost", "PathInConatiner", "CgroupPermissions" E.g. [ { "PathOnHost": "/dev/nvidiactl", "PathInContainer": "/dev/nvidiactl", "CgroupPermissions": "rwm" }, { "PathOnHost": "/dev/nvidia-uvm", "PathInContainer": "/dev/nvidia-uvm", "CgroupPermissions": "rwm" }</li>
    <li><b>Device Cgroup Rules:</b> Accepts an array of list of cgroup rules to apply to the container.</li>
    <li><b>Device Requests:</b> A list of requests for devices to be sent to device drivers.</li>
    <li><b>Ulimits:</b> A list of resource limits to set in the container. For example: {"Name": "nofile", "Soft": 1024, "Hard": 2048}"</li>
    <li><b>Restart Policy:</b> The behavior to apply when the container exits. The default is not to restart. Accepts a JSON input with following fields:
      <ul>
        <li><b>Name:</b> Valid values : "" , "always", "unless-stopped", "on-failure".</li>
        <li><b>MaximumRetryCount:</b> If 'on-failure' is used, the number of times to retry before giving up.</li>
      </ul>
    </li>
    <li><b>Additional Fields</b> - Additional fields or values you wish to add to the container details.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Messages:</b></p>
  <ul>
    <li>You specified a kernel memory limit on a kernel older than 4.0. Kernel memory limits are experimental on older kernels, it won't work as expected and can cause your system to be unstable.</li>
    <li>You specified a kernel memory limit on a kernel older than 4.0. Kernel memory limits are experimental on older kernels, it won't work as expected and can cause your system to be unstable.,linux does not support CPU percent. Percent discarded.</li>
    <li>linux does not support CPU percent. Percent discarded.</li>
    <li>Minimum memoryswap limit should be larger than memory limit, see usage.</li>
    <li>Minimum memory limit allowed is 4MB.</li>
    <li>Conflicting options: Nano CPUs and CPU Period cannot both be set.</li>
    <li>Minimum kernel memory limit allowed is 4MB.</li>
    <li>Minimum memory reservation allowed is 4MB.</li>
    <li>Incorrect or Invalid value entered for Block IO Device Read Bps or Block IO Device Write Bps or Block IO Device Read IOps or Block IO Device Write IOps variable, kindly check and try again.</li>
    <li>Incorrect or Invalid value entered for Block IO Weight Device variable, kindly check and try again.</li>
    <li>Invalid QoS settings: linux does not support Maximum IO Bandwidth or Maximum IO IOps.</li>
    <li>No such container: 'container_id'</li>
    <li>Requested CPUs are not available - requested 4, available: 0-1</li>
    <li>Requested memory nodes are not available - requested 0-3, available: 0</li>
    <li>Conflicting options: Nano CPUs and CPU Quota cannot both be set.</li>
    <li>Cannot update container 'container_id': Conflicting options: Nano CPUs cannot be updated as CPU Period has already been set.</li>
    <li>Invalid value 'allowed_cpus_for_execution_value' for cpuset cpus.</li>
    <li>Invalid value 'cpuset_mems_value' for cpuset mems.</li>
    <li>Incorrect or Invalid value entered for Device Cgroups Rule variable, kindly check and try again.</li>
    <li>Incorrect or Invalid integer value entered for input variable, kindly check and try again.</li>
    <li>JSON provided for { Input Name } input is invalid.</li>
  </ul>
  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a>
  </p>
  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
