  value: |-
    (function execute(inputs, outputs) {
        inputs = new DockerUtils().trimStringInputs(inputs);

        var json_data = {};

        try {
            for (var key in inputs) {
                if (inputs[key]) {
                    if (key === "Hostname" || key === "Domainname" || key === "User" || key ===
                        "AttachStdin" || key === "AttachStdout" || key === "AttachStderr" || key ===
                        "Tty" || key === "OpenStdin" || key === "StdinOnce" || key ===
                        "Image" || key === "WorkingDir" || key === "NetworkDisabled" || key === "MacAddress" ||
                        key === "StopSignal")
                        json_data[key] = inputs[key] ? inputs[key] : undefined;

                    if (key === "Healthcheck" || key === "ExposedPorts" || key ===
                        "Env" || key === "Cmd" || key ===
                        "Volumes" || key === "Entrypoint" || key === "OnBuild" || key ===
                        "Labels" || key === "Shell" || key ===
                        "HostConfig" || key === "NetworkingConfig")
                        json_data[key] = inputs[key] ? new DockerUtils().parseJson(inputs[key], key) :
                        undefined;

                    if (key === "StopTimeout")
                        json_data[key] = inputs[key] ? parseInt(inputs[key]) : undefined;


                    outputs.payload = JSON.stringify(json_data);
                    outputs.name = inputs.name;
                }
            }

        } catch (err) {
            throw ('Invalid value provided in input variables, kindly check and try again');
        }

    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
