description: |-
  <p>This action returns detailed information about a swarm from Docker.</p>

  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Swarm Information</b> - Information about the swarm in JSON format, populated in case of success.</li>
    <li><b>Worker Token </b> - Token of the node that joined the swarm as a worker, populated in case of success.</li>
    <li><b>Manager Token</b> - Token of the node that joined the swarm as a manager, populated in case of success.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <ul>
    <li>This node is not a swarm manager. Use "docker swarm init" or "docker swarm join" to connect this node to swarm and try again.</li>
    <li>This node is not a swarm manager. Worker nodes can't be used to view or modify cluster state. Please run this command on a manager node or promote the current node to a manager.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
