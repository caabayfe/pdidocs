    (function execute(inputs, outputs) {
        if (inputs.status_code == '201') {
            outputs.status = "Success";
            outputs.network_id = JSON.parse(inputs.response)['Id'];
        } else {
            outputs.status = "Error";
            outputs = new DockerErrorHandler().createNetworkErrorHandler(inputs, outputs);
        }
    })(inputs, outputs);
