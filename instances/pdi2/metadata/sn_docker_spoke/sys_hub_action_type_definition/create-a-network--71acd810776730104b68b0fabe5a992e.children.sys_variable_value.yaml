  value: |-
    (function execute(inputs, outputs) {
        inputs = new DockerUtils().trimStringInputs(inputs);

        var json_data = {};

        json_data['Name'] = inputs.Name ? inputs.Name : undefined;
        json_data['Driver'] = inputs.Driver ? inputs.Driver : undefined;

        var Options = {};
        var optionsFlag = false;
        for (var i in inputs.Options) {
            if (inputs.Options[i].key) {
                Options[inputs.Options[i].key] = inputs.Options[i].value;
                optionsFlag = true;
            }
        }
        if (optionsFlag === true)
            json_data['Options'] = Options;

        var labels = {};
        var labelsFlag = false;
        for (var i in inputs.Labels) {
            if (inputs.Labels[i].key) {
                labels[inputs.Labels[i].key] = inputs.Labels[i].value;
                labelsFlag = true;
            }
        }
        if (labelsFlag === true)
            json_data['Labels'] = labels;

        var IPAM = {};
        IPAM['Driver'] = inputs.IPAM.Driver ? inputs.IPAM.Driver : undefined;

        var Config = {};
        var configFlag = false;
        IPAM['Config'] = [];
        for (var i in inputs.IPAM.Config) {
            var configElement = {};
            for (var j in inputs.IPAM.Config[i].config_element) {
                if (inputs.IPAM.Config[i].config_element[j].key) {
                    configElement[inputs.IPAM.Config[i].config_element[j].key] = inputs.IPAM.Config[i]
                        .config_element[j].value;
                    configFlag = true;
                }
            }
            if (configFlag === true)
                IPAM['Config'].push(configElement);
        }

        var IPAMOptions = {};
        var ipamoptionFlag = false;
        for (var i in inputs.IPAM.Options) {
            if (inputs.IPAM.Options[i].key) {
                IPAMOptions[inputs.IPAM.Options[i].key] = inputs.IPAM.Options[i].value;
                ipamoptionFlag = true;
            }
        }
        if (ipamoptionFlag === true)
            IPAM['Options'] = IPAMOptions;

        json_data['IPAM'] = IPAM;

        if (inputs.additional_fields)
            json_data = new DockerUtils().parseAdditionalFields(inputs.additional_fields,
                json_data);

        outputs.payload = JSON.stringify(json_data);

    })(inputs, outputs);
