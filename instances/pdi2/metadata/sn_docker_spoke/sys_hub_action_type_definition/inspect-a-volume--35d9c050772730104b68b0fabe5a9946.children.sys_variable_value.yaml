  value: |-
    (function execute(inputs, outputs) { 
       inputs = new DockerUtils().trimStringInputs(inputs);
      
      if (inputs.status_code == 200) {
        outputs.status = "Success";
        outputs.response = inputs.response;
        outputs.volume = JSON.parse(inputs.response);
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().inspectVolumeErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
