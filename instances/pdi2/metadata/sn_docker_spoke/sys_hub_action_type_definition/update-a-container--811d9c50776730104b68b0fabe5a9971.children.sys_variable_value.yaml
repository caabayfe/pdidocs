  value: |-
    (function execute(inputs, outputs) {
        inputs = new DockerUtils().trimStringInputs(inputs);
    	var json_data = {};

        json_data['BlkioWeightDevice'] = [];
        for (var i in inputs.BlkioWeightDevice)
          if (inputs.BlkioWeightDevice[i].Path && inputs.BlkioWeightDevice[i].Weight)
            json_data.BlkioWeightDevice.push(inputs.BlkioWeightDevice[i]);

        json_data['BlkioDeviceReadBps'] = [];
        for (var i in inputs.BlkioDeviceReadBps)
          if (inputs.BlkioWeightDevice[i].Path && inputs.BlkioWeightDevice[i].Rate)
            json_data.BlkioDeviceReadBps.push(inputs.BlkioDeviceReadBps[i]);

        json_data['BlkioDeviceWriteBps'] = [];
        for (var i in inputs.BlkioDeviceWriteBps)
          if (inputs.BlkioWeightDevice[i].Path && inputs.BlkioWeightDevice[i].Rate)
            json_data.BlkioDeviceWriteBps.push(inputs.BlkioDeviceWriteBps[i]);

        json_data['BlkioDeviceReadIOps'] = [];
        for (var i in inputs.BlkioDeviceReadIOps)
          if (inputs.BlkioWeightDevice[i].Path && inputs.BlkioWeightDevice[i].Rate)
            json_data.BlkioDeviceReadIOps.push(inputs.BlkioDeviceReadIOps[i]);

        json_data['BlkioDeviceWriteIOps'] = [];
        for (var i in inputs.BlkioDeviceWriteIOps)
          if (inputs.BlkioWeightDevice[i].Path && inputs.BlkioWeightDevice[i].Rate)
            json_data.BlkioDeviceWriteIOps.push(inputs.BlkioDeviceWriteIOps[i]);

        json_data['Devices'] = [];
        for (var i in inputs.Devices)
          if (inputs.Devices[i].PathOnHost || inputs.Devices[i].PathInContainer || inputs.Devices[i].CgroupPermissions)
            json_data.Devices.push(inputs.Devices[i]);

        var DeviceCgroupRules = inputs.DeviceCgroupRules;
        json_data['DeviceCgroupRules'] = [];
        for (var i in DeviceCgroupRules)
          if (DeviceCgroupRules[i])
            json_data.DeviceCgroupRules.push(DeviceCgroupRules[i]);

        json_data['DeviceRequests'] = [];
        for (var i in inputs.DeviceRequests) {
            var DeviceRequests = {};
            DeviceRequests['Driver'] = inputs.DeviceRequests[i].Driver ? inputs.DeviceRequests[i].Driver :
                undefined;
            DeviceRequests['Count'] = inputs.DeviceRequests[i].Count ? parseInt(inputs.DeviceRequests[i]
                .Count) : undefined;

            var DeviceIDs = inputs.DeviceRequests[i].DeviceIDs;
            DeviceRequests['DeviceIDs'] = [];
            for (var j in DeviceIDs)
              if (DeviceIDs[i])
                DeviceRequests.DeviceIDs.push(DeviceIDs[j]);

            var Capabilities = inputs.DeviceRequests[i].Capabilities;
            DeviceRequests['Capabilities'] = [];
            for (var j in Capabilities)
              if (Capabilities[i])
                DeviceRequests.Capabilities.push(Capabilities[j]);

            DeviceRequests['Options'] = {};
            for (var j in inputs.DeviceRequests[i].Options)
              if (inputs.DeviceRequests[i].Options[j].key)
                DeviceRequests.Options[inputs.DeviceRequests[i].Options[j].key] = inputs.DeviceRequests[i]
                .Options[j].value;

            json_data.DeviceRequests.push(DeviceRequests);
        }

        json_data['Ulimits'] = [];
        for (var i in inputs.Ulimits)
          if (inputs.Ulimits[i].Name || inputs.Ulimits[i].Soft || inputs.Ulimits[i].Hard)
            json_data.Ulimits.push(inputs.Ulimits[i]);

        var RestartPolicy = {};
        RestartPolicy['Name'] = inputs.RestartPolicy.Name ? inputs.RestartPolicy
            .Name : undefined;
        RestartPolicy['MaximumRetryCount'] = inputs.RestartPolicy.MaximumRetryCount ? parseInt(
            inputs.RestartPolicy.MaximumRetryCount) : undefined;
        json_data['RestartPolicy'] = RestartPolicy;

        if (inputs.additional_fields)
            json_data = new DockerUtils().parseAdditionalFields(inputs.additional_fields,
                json_data);

        outputs.payload = JSON.stringify(json_data);
    	outputs.container_id = inputs.container_id;
    })(inputs, outputs);
