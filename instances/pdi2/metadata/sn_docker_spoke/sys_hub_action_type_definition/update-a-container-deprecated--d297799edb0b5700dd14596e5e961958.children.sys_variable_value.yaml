  value: |-
    (function execute(inputs, outputs) {
    	inputs = new DockerUtils().trimStringInputs(inputs);

    	var json_data = {};

    	for (var key in inputs) {
    		if (inputs[key]) {
    			if (key === "CpuShares" || key === "Memory" || key === "BlkioWeight" || key === "DiskQuota" || key ===
    				"KernelMemory" || key === "MemoryReservation" || key === "MemorySwap" || key === "MemorySwappiness" ||
    				key === "NanoCPUs" || key === "PidsLimit" || key === "CpuCount" || key === "CpuPercent" || key ===
    				"IOMaximumIOps" || key === "IOMaximumBandwidth" || key === "CpuPeriod" || key === "CpuQuota" || key ===
    				"CpuRealtimePeriod" || key === "CpuRealtimeRuntime")
    				json_data[key] = inputs[key] ? parseInt(inputs[key]) : undefined;

    			if (key === "BlkioWeightDevice" || key === "BlkioDeviceReadBps" || key === "BlkioDeviceWriteBps" || key ===
    				"BlkioDeviceReadIOps" || key === "BlkioDeviceWriteIOps" || key === "Ulimits" || key === "Devices" || key ===
    				"DeviceCgroupRules" || key === "RestartPolicy")
    				json_data[key] = inputs[key] ? new DockerUtils().parseJson(inputs[key], key) : undefined;

    			if (key === "CgroupParent" || key === "CpusetCpus" || key === "CpusetMems" || key === "OomKillDisable" ||
    				key === "Init")
    				json_data[key] = inputs[key] ? inputs[key] : undefined;
    		}
    	}
    	outputs.payload = JSON.stringify(json_data);

    	outputs.container_id = inputs.container_id;
    })(inputs, outputs);
