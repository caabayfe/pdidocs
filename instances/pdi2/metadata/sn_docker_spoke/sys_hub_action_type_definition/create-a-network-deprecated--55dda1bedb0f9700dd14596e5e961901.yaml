description: |-
  <p>Networks are user-defined networks that containers can be attached to. This action creates a network on the Docker Instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Network Name</b> - Name of the network for identification.</li>
    <li><b>CheckDuplicate</b> - Accepts 'true' or 'false' values, if set to 'true' will check for networks with duplicate names.Since Network is primarily keyed based on a random ID and not on the name, and network name is strictly a user-friendly alias to the network which is uniquely identified using ID, there is no guaranteed way to check for duplicates. CheckDuplicate is there to provide a best effort checking of any networks which has the same name but it is not guaranteed to catch all name collisions.</li>
    <li><b>Driver</b> - Name of the network driver plugin to use. By default is "bridge" used.</li>
    <li><b>Internal</b> - Accepts 'true' or 'false' values, if set to 'true' will restrict external access to the network.</li>
    <li><b>Attachable</b> - Accepts 'true' or 'false' values, if set to 'true' will create globally scoped network which is manually attachable by regular containers from workers in swarm mode.</li>
    <li><b>Ingress</b> - Accepts 'true' or 'false' values, if set to 'true' will create Ingress network.This network provides the routing-mesh in swarm mode.</li>
    <li><b>IPAM</b> - IP Address Management(IPAM) driver specific configuration in JSON. E.g. {"Driver": "default","Config": [],"Options": {"foo": "bar"}.</li>
    <li><b>EnableIPv6</b> - Enable IPv6 on the network.</li>
    <li><b>Options</b> - Network specific options to be used by the drivers in JSON. E.g. {"com.docker.network.bridge.default_bridge": "true"}.</li>
    <li><b>Labels</b> - User-defined key/value metadata. E.g. {"com.example.some-label": "some-value"}.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
    <li><b>Networks ID</b> - The ID of the created network.</li>
  </ul>
  <p><b>Error Messages:</b></p>
  <ul>
    <li>Network plugin driver not found.</li>
    <li>Network already exists.</li>
    <li>Ingress network can only be global scope network. </li>
    <li>Network name must be valid as a DNS name component.</li>
    <li>Pool overlaps with other one on this address space.</li>
    <li>Only one instance of "host" network is allowed.</li>
    <li>Could not find an available, non-overlapping IPv6 address pool among the defaults to assign to the network.</li>
    <li>Cannot create a multi-host network from a worker node. Please create the network from a manager node.</li>
    <li>Provided IPAM value is invalid.</li>
    <li>Provided Options value is invalid.</li>
    <li>Provided Labels value is invalid.</li>
  </ul>
  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>
  <p><b>Additional Note:</b></p>
  <ul>
    <li> Refer the Docker Rest API documentation for the detailed description of fields and descriptions of each of the inputs.</li>
  </ul>
  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
