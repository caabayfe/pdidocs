  value: |-
    (function execute(inputs, outputs) {
    	inputs = new DockerUtils().trimStringInputs(inputs);
    	if (inputs.repo_record && inputs.repo_record.isValidRecord())
    		outputs.encoded_value = getEncodedCredentialValue(inputs.repo_record);

    	var json_data = new DockerUtils().createServicePayload(inputs);

    	var image_name;
    	if (json_data.TaskTemplate && json_data.TaskTemplate.ContainerSpec && json_data.TaskTemplate
    		.ContainerSpec.Image)
    		image_name = json_data.TaskTemplate.ContainerSpec.Image.split(":");
    	else
    		throw "Incorrect Task Template format or Image not provided in ContainerSpec of Task Template input.";

    	outputs.payloads = JSON.stringify(json_data);
    })(inputs, outputs);

    function getEncodedCredentialValue(repo_record) {
    	var repo_name = repo_record.repository_name;
    	var repo_type = repo_record.repository_type;
    	var user_name = repo_record.user_name.toString();
    	var password = repo_record.password.getDecryptedValue().toString();
    	var email_address = inputs.repo_record.email.toString();
    	var server_address = inputs.repo_record.server_address.toString();

    	if (repo_type != "Private Repository")
    		return "";

    	if (!user_name || !password || !email_address || !server_address)
    		new DockerUtils().invalidDetails();

    	var jsonData = {
    		"username": user_name,
    		"password": password,
    		"email": email_address,
    		"serveraddress": server_address
    	};
    	var finalJSON = JSON.stringify(jsonData);
    	return gs.base64Encode(finalJSON);
    }
