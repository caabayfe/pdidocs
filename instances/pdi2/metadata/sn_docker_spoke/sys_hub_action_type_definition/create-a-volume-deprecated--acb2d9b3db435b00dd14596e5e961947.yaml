description: |-
  <p>This action creates a volume in Docker.</p>

  <p><b>Inputs:</b></p>
  <ul>
  	<li><b>Name</b> - Name of the volume to be created. E.g. tardis</li>
         <li><b>Driver</b> - Name of the volume driver to use. If not specified, uses default value : local.  E.g. custom</li>
  	<li><b>Driver Options</b> -A mapping of driver options and values, in JSON form. These options are passed directly to the driver and are driver specific. E.g. {"type":"tmpfs"}</li>
        <li><b> Labels</b> - Metadata for volume in the form of key-value pair, JSON form. E.g. {"voltype":"vol_tmpfs"}</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
  	<li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
  	<li><b>Error Message</b> - Will be populated when the status is "Error".</li>
          <li><b>Volume Information</b> - Information about the volume in JSON format, populated in case of success.</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <ul>
      <li>Provided Name is invalid</li>
      <li>Provided Name already exists.</li>
     <li>Provided Driver not found.</li>
     <li>Provided key for Driver Options input is invalid.</li>
    <li>JSON provided for Driver Options input is invalid.</li>
    <li>JSON provided for Labels input is invalid.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p><b>Additional Note:</b></p>
  <ul>
  <li> Refer the Docker Rest API documentation for the detailed description of fields and descriptions of each of the inputs.</li>
  </ul>
  </b></p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>


  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
