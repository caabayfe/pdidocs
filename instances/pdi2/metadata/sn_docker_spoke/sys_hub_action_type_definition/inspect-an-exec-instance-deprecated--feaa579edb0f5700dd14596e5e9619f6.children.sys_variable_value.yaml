    (function execute(inputs, outputs) {
      if (inputs.status_code == 200) {
        outputs.status = "Success";
        outputs.exec_info = inputs.response;
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().inspectExecInstanceErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
