description: |-
  <p>This action searches for images on Docker Hub.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Search Term</b> - The string used to search for the docker images.</li>
    <li><b>Limit</b> - Sets the maximum number of search results to return.It should be between 1 to 100.</li>
    <li><b>Filters</b> - A JSON encoded value of the filters to process on the images list. Available filters:</li>
    <ul>
      <li>is-official: Accepts 'true' or 'false' values. If set to 'true' will return only official images. E.g. {"is-official":["true"]}</li>
      <li>is-automated: Accepts 'true' or 'false' values. If set to 'true' will return only images which have 'is-automated' flag set to 'true'. E.g. {"is-automated":["true"]}</li>
      <li>stars: Matches images that has at least the value entered for this option. E.g. {"stars":["10630"]}</li>
    </ul>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Images List</b> - List of images fetched based on the search criteria.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <ul>
    <li>Filter values provided is invalid or of incorrect format.</li>
    <li>Invalid filter.</li>
    <li>Provided range is invalid.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
