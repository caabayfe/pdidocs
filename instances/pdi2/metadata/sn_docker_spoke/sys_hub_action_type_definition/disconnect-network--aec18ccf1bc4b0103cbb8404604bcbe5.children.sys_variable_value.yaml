  value: |-
    (function execute(inputs, outputs) {
      if (inputs.status_code == 200) {
        outputs.status = "Success";   
      } else {
        outputs = new DockerErrorHandler().disconnectNetworkErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
