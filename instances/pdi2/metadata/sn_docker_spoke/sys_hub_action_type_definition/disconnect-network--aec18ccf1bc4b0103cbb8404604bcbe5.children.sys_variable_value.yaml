  value: |-
    (function execute(inputs, outputs) {
      inputs = new DockerUtils().trimStringInputs(inputs);
      var json_data = {};
      outputs.network_id = inputs.network_id;
      json_data['Container'] = inputs.container_id;
      json_data['Force'] = inputs.force;
      
      outputs.payload = JSON.stringify(json_data);
    })(inputs, outputs);
