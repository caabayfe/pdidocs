    (function execute(inputs, outputs) {
        if (inputs.status_code == 201) {
            outputs.status = "Success";
            outputs.execution_id = JSON.parse(inputs.response)['Id'];
        } else {
            outputs.status = "Error";
            outputs = new DockerErrorHandler().createExecInstanceErrorHandler(inputs, outputs);
        }
    })(inputs, outputs);
