  value: |-
    (function execute(inputs, outputs) {
        inputs = new DockerUtils().trimStringInputs(inputs);
        var json_data = {};

        var Cmd = inputs.Cmd;
        json_data['Cmd'] = [];
        for (var i in Cmd)
            json_data.Cmd.push(Cmd[i]);

        var Env = inputs.Env;
        json_data['Env'] = [];
        for (var i in Env)
            json_data.Env.push(Env[i]);

        if (inputs.additional_fields)
            json_data = new DockerUtils().parseAdditionalFields(inputs.additional_fields,
                json_data);

        outputs.payload = JSON.stringify(json_data);
        outputs.container_id = inputs.ContainerID;
    })(inputs, outputs);
