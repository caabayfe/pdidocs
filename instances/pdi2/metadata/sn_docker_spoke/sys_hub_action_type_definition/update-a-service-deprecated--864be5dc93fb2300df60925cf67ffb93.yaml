description: |-
  <p>Services are the definitions of tasks to run on a swarm.This action updates a service to the swarm on the docker instance.</p>
  <p><b>Inputs:</b></p>
  <ul>
  <li><b>Repository Record</b> - Repository record from Docker credentials table which contains the details about repository and respective credentials.</li>
    <li><b>Service ID:</b> ID or Name of service to be updated.</li>
    <li><b>Version:</b> The version number of the service object being updated.</li>
    <li><b>Registry Auth From:</b> X-Registry-Auth is base64-encoded auth configuration for pulling from private registries.If the X-Registry-Auth header is not specified, this parameter indicates where to find registry authorization credentials. The valid
      values are spec and previous-spec.</li>
    <li><b>Rollback:</b> The Rollback parameter is for setting it to previous to cause a server-side rollback to the previous service spec.</li>
    <li><b>Name:</b> Name of the service to be updated.</li>
    <li><b>Labels:</b> Labels( Key-Value pair) for the service to be created, in JSON format. E.g. '{"service":"service"}'.</li> 
     <li><b>Task Template</b> - Specification of the tasks to start as part of the new service. E.g. '{"ContainerSpec":{"Image":"name_of_user/name_of_image:tag"}}'. Value of the image (name_of_user/name_of_image) should be present in Docker Credentials table as Repository Name with other required fields if applicable.</li>
    <li><b>Mode:</b> Scheduling mode for the service (replicated or global, defaults to replicated). E.g. '{"Global": { } }'.</li>
    <li><b>Update Config:</b> Specification for the update strategy of the service. E.g. '{ "Parallelism": 2, "Delay": 100}'.</li>
    <li><b>Rollback Config:</b> Specification for the rollback strategy of the service. E.g. '{ "Parallelism": 1, "Delay": 100}'.</li>
    <li><b>Networks:</b> Array of network names or IDs to attach the service to. E.g. '[{ "Target": "5t4dwp9fm6jfganm649ifrh2e" } ]'.</li>
    <li><b>Endpoint Specification:</b> Properties that can be configured to access and load balance a service. E.g. '{"Ports": [{"Protocol": "tcp","PublishedPort": 8080,"TargetPort": 80}]}'.</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Messages:</b></p>
  <ul>
    <li>service 'service_id/name' not found.</li>
    <li>JSON provided for Labels input is invalid.</li>
    <li>JSON provided for Task Template input is invalid.</li>
    <li>JSON provided for Mode input is invalid.</li>
    <li>JSON provided for Update Config input is invalid.</li>
    <li>JSON provided for Rollback Config is invalid.</li>
    <li>JSON provided for Networks input is invalid.</li>
    <li>Networks values provided is invalid or of incorrect format.</li>
    <li>network 'network_id' not found.</li>
    <li>JSON provided for Endpoint Specification input is invalid.</li>
    <li>Provided published port in Endpoint Specification is already in use by other service.</li> 
    <li>Provided 'Service ID/Name' is invalid.</li>
    <li>Image name does not match to the Repository name from Docker Credentials table.</li>
  </ul>
   
  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>
   
  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a>
  </p>
  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
