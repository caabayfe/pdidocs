description: |-
  <p>This action joins a node to a swarm as a manager node or worker node based upon the token in Docker.</p>

  <p><b>Inputs:</b></p>
  <ul>
  	<li><b>Listen Address</b> - Address used for listening inter-manager communication. E.g. '192.168.1.1:4567' or 'eth0:4567'.</li>
  	<li><b>Advertise Address</b> - Externally reachable address advertised to other nodes. This can either be an address/port combination or an interface followed by a port number. If the port number is omitted, the port number from the listen address is used. If Advertise Address is not specified, it will be automatically detected when possible. E.g. '192.168.1.1:4567' or 'eth0:4567'.</li>
  	<li><b>Data Path Address</b> - Address or interface to use for data path traffic. If Data Path Address is unspecified, the same address as Advertise Address is used. E.g. '192.168.1.1' or 'eth0'</li>
  	<li><b>Remote Addresses</b> - Addresses of manager nodes already participating in the swarm. The values should be comma separated list.</li>
  	<li><b>Join Token</b> - Secret token for joining the swarm.</li>	
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
  	<li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
  	<li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>

  <p><b>Error Message:</b></p>
  <ul>
  	<li>This node is already part of a swarm. Use "docker swarm leave" to leave this swarm and join another one.</li>
  	<li>Listen address must be an IP address or network interface (with optional port number).</li>
  	<li>Data path address must be a non-zero IP address or network interface (without a port number).</li>
  	<li>Provided Remote Addresses are invalid.</li>
  	<li>Invalid join token.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
