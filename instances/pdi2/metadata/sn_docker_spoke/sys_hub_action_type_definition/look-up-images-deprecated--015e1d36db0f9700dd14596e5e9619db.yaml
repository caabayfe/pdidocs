description: |-
  <p>This action lists images from a Docker instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Show All Images</b> - Accepts 'true' or 'false' value.Docker adds layer of images based on commands run on the top of base image.if set as 'false',Only images from the final layer(no children) are shown.If set to 'true' then it shows all Docker intermediate Images.</li>
    <li><b>Filters</b> - A JSON encoded value of the filters to process on the images list. Available filters:
      <ul>
        <li>before=(<image-name>[:<tag>], <image id> or <image@digest>) - Returns images created before a specific image ID.</li>
        <li>dangling=true - Returns images as per the 'dangling' value provided. Dangling images are layers that have no relationship to any tagged images.</li>
        <li>label=key or label="key=value" of an image label - Returns images as per the 'label' values provided. E.g. {"Label":["nginx"]} </li>
        <li>reference=(<image-name>[:<tag>]) - Returns images as per the 'referece' values provided.</li>
        <li>since=(<image-name>[:<tag>], <image id> or <image@digest>). - Returns images created after a specific image ID.</li>
      </ul>
    </li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Images List</b> - List of images based on the inputs provided.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <ul>
    <li>Invalid filter</li>
    <li>Filter values provided is invalid or of incorrect format.</li>
    <li>Filter values provided is invalid or of incorrect format or no such image available.</li>
  </ul>
  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
