    (function execute(inputs, outputs) {
      if ((inputs.network_id != "" ) && (inputs.status_code == 200)) {
        outputs.status = "Success";
        outputs.response = inputs.response;
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().inspectNetworkErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
