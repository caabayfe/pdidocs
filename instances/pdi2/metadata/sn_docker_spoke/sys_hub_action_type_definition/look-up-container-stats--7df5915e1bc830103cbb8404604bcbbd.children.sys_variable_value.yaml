  value: |-
    (function execute(inputs, outputs) {
      if (inputs.status_code == '200') {
        outputs.status = "Success";
        outputs.container_stats = JSON.parse(inputs.response);
        outputs.container_stats_detail = inputs.response;
      } else {
       outputs.status = "Error";
       outputs = new DockerErrorHandler().lookupContainerStatsErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
