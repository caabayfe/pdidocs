description: |-
  <p>Networks are user-defined networks that containers can be attached to. This action returns detailed information of a single network from the Docker Instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Network ID</b> - Network ID or name to be inspected.</li>
    <li><b>Verbose</b> - Accepts 'true' or 'false' values, if set to 'true' will return detailed inspect output for troubleshooting.</li>
    <li><b>Scope</b> - Filter the network by scope (swarm, global, or local).</li>
  </ul>
  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Networks Information</b> - Information about the Network in JSON format, populated in case of success.</li>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
  </ul>
  <p><b>Error Messages:</b></p>
  <ul>
    <li>Network 'Network ID/Name' not found.</li>
    <li>Provided Network ID is invalid.</li>
    <li>Multiple networks are present with provided name.Use network ID instead of name.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
