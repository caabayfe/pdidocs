  value: |-
    (function execute(inputs, outputs) {
        inputs = new DockerUtils().trimStringInputs(inputs);
      
        var json_data = {};
      	json_data.Name = new DockerUtils().checkVolumeExists(inputs.name);
        json_data.Driver = inputs.driver ? inputs.driver : undefined;

        var driveropts = {};
        var driveroptsFlag = false;
        for (var i in inputs.driveropts) {
            if (inputs.driveropts[i].key) {
                driveropts[inputs.driveropts[i].key] = inputs.driveropts[i].value;
                driveroptsFlag = true;
            }
        }
        if (driveroptsFlag === true)
            json_data['DriverOpts'] = driveropts;

        var labels = {};
        var labelsFlag = false;
        for (var i in inputs.labels) {
            if (inputs.labels[i].key) {
                labels[inputs.labels[i].key] = inputs.labels[i].value;
                labelsFlag = true;
            }
        }
        if (labelsFlag === true)
            json_data['Labels'] = labels;

        outputs.payload = JSON.stringify(json_data);

    })(inputs, outputs);
