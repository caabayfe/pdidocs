    (function execute(inputs, outputs) {
      if (inputs.status_code == 201) {
        outputs.status = "Success";
        outputs.service_id = JSON.parse(inputs.response)['ID'];
      } else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().createServiceErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
