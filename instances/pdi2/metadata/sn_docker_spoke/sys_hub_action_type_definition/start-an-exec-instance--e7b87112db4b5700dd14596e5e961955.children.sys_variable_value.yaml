  value: |-
    (function execute(inputs, outputs) {
      if ((inputs.status_code == 200) && (inputs.response.indexOf('exec failed') == -1) && (inputs.response.indexOf('Error: Exec command') == -1)){    
        outputs.status = "Success";
      }
      else {
        outputs.status = "Error";
        outputs = new DockerErrorHandler().startExecInstanceErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
