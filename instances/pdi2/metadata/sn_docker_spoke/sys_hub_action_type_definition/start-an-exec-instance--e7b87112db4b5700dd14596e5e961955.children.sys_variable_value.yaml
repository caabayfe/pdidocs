  value: |-
    (function execute(inputs, outputs) { 
      inputs = new DockerUtils().trimStringInputs(inputs);

      var json_data = {};
      
      json_data.Detach = inputs.detach;
      json_data.Tty = inputs.tty;

      outputs.payload = JSON.stringify(json_data);
      outputs.execution_id = inputs.execution_id;

    })(inputs, outputs);
