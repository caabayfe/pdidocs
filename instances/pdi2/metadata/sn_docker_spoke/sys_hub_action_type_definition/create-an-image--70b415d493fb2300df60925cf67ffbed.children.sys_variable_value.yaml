  value: |-
    (function execute(inputs, outputs) {
      if (inputs.status_code == 200 && inputs.response.indexOf('Error processing tar file') == -1) {
        outputs.status = "Success";
        if(inputs.from_image){
        	outputs.image_name = inputs.from_image;
        } else if(inputs.repo) {
        	outputs.image_name = inputs.repo;
        }
        outputs.image_tag = inputs.tag;
      } else if (inputs.status_code == 200 && inputs.response.indexOf('Error processing tar file') != -1) {
        outputs.status = "Error";
        outputs = new sn_docker_spoke.DockerErrorHandler().createImageErrorHandler(inputs,outputs); 
      } else {
        outputs.status = "Error";
        outputs = new sn_docker_spoke.DockerErrorHandler().createImageErrorHandler(inputs,outputs);       
      }
    })(inputs, outputs);
