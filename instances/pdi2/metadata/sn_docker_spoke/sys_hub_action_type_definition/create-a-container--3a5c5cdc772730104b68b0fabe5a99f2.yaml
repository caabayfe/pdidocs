copied_from_name: Create a Container
description: |-
  <p>This action creates a container in a Docker instance.</p>

  <p><b>Inputs:</b></p>
  <ul>
    <li><b>Name</b> - Container name can only be alphanumerical values. E.g. test-container-10</li>
    <li><b>Image</b> - Docker image to use for creating the container. E.g. alpine:latest</li>
    <li><b>Environment Variables</b> - A list of environment variables to be set inside the container, in the format: ["VAR=value", ...]. A variable without '=' is removed from the environment, rather than assigning an empty value. E.g. ["JAVAPATH=/var/lib/java"]</li>
    <li><b>Command</b> - Command to run specified as a string or an array of strings. Command will run once container is in running state. E.g. ["whoami", "uname -a", "date"]</li>
    <li><b>Volumes</b> - An object mapping mount point paths inside the container.Volume is a type of storage facility provided in Docker to store data either inside the container or on the server by mapping it to container. E.g. {"/mnt":{}}</li>
    <li><b>Exposed Ports</b> - An object mapping ports to an empty object in the form.This port will be used for communication. E.g. {"22/tcp": { }}</li>
    <li><b>Healthcheck</b> - A test to perform to check that the container is healthy.</li>
    <li><b>Entrypoint</b> - The entry point for the container as a string or an array of strings. If the array consists of exactly one empty string then the entry point is reset to system default.</li>
    <li><b>On Build</b> - The ONBUILD metadata that is defined in the image's Dockerfile. For eg. ["ADD . /app/src"]</li>
    <li><b>Labels</b> - Any user-defined key/value metadata. E.g. {"com.example.vendor": "Acme"}</li>
    <li><b>Shell</b> - The shell for when RUN, CMD, and ENTRYPOINT uses a shell. E.g. ["string"]</li>
    <li><b>Host Config</b> - The container configuration depending on the host it is running on.</li>
    <li><b>Networking Config</b> - This container's networking configuration.</li>
    <li><b>Additional Fields</b> - Additional fields or values you wish to add to the container details.</li>
  </ul>

  <p><b>Outputs:</b></p>
  <ul>
    <li><b>Status</b> - Will be set to "Success" if the request succeeds or "Error" if a failure occurs.</li>
    <li><b>Error Message</b> - Will be populated when the status is "Error".</li>
    <li><b>Container ID</b> - The container ID of the container from Docker, generated after its sucessful creation.</li>
  </ul>

  <p><b>Error Messages:</b></p>
  <ul>
    <li>Invalid value provided in input variables, kindly check and try again.</li>
    <li>Conflict. The container name is already in use by container. You have to remove (or rename) that container to be able to reuse that name.</li>
    <li>Incorrect or Invalid value entered for the Volumes variable, kindly check and try again.</li>
    <li>Incorrect or Invalid value entered for the Host Config variable, kindly check and try again..</li>
    <li>Incorrect or Invalid value entered for the Healthcheck variable, kindly check and try again.</li>
    <li>Incorrect or Invalid value entered for the Networking Config variable, kindly check and try again.</li>
  </ul>

  <p><b>Note :</b> User may expect additional error messages based on the API response.</p>

  <p>To use this action, the corresponding Docker connection and credential must be created and associated with the Docker Connection & Credential alias.<a target="_blank" href="http://docs.servicenow.com/?context=CSHelp:credentials-connections-alias">Learn More</a></p>

  <p><b>Note</b>: Requires a subscription for production use. <a target="_blank" href="https://docs.servicenow.com/?context=CSHelp:IntegrationHub-licensing-information">Read More</a>.</p>
