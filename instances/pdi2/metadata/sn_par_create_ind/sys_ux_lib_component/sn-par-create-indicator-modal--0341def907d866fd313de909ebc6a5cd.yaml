required_translation_keys: '[{"message":"Automated"},{"message":"Use when you want to track data already available in ServiceNow. These indicators are updated automatically on a schedule using data collectors."},{"message":"Formula"},{"message":"Calculated from the scores of other indicators. Use when you need to apply a method or mathematical formula to one or more indicators."},{"message":"Manual"},{"message":"Use when the data is not available in ServiceNow and must be entered manually—typically from recurring reports or external sources like spreadsheets."},{"message":"External"},{"message":"Use when the data resides in an external database. These indicators query external systems via SQL without importing the full dataset."},{"message":"Data snapshots (recommended)"},{"message":"Captures data changes automatically and calculates scores in real time. Use this when you need flexible filtering, intraday analysis, and faster setup."},{"message":"Indicator source"},{"message":"Uses pre-aggregated scores collected on a set schedule. Use when you require advanced customization like scripted logic."},{"message":"Recommended"},{"message":"Create new indicator"},{"message":"Create"},{"message":"Cancel"},{"message":"Select the type of indicator you want to create."},{"message":"Source type"},{"message":"Select the source type to create the indicator."},{"message":"Name"},{"message":"Enter the name of your indicator."},{"message":"Description"}]'
