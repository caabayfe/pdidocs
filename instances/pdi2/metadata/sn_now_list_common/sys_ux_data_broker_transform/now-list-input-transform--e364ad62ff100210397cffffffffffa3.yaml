        {
          "name": "columnFilteringPopoverDisplay",
          "label": "Column filtering popover display. DO NOT USE.",
          "description": "DO NOT USE, DEPRECATED. Determines which actions users can take from a column header action popover. Users can access the popover to filter the list with data in the column, group the list by column data, both, or neither.",
          "readOnly": "false",
          "fieldType": "string",
          "mandatory": false,
          "defaultValue": ""
        },
        {
          "name": "enableLiveList",
          "label": "Enable live list",
          "description": "This feature will be usable only if the system property \"glide.lists.live_list_enabled\" is turned on. When it's on, this property allows users to subscribe to live list updates from the list header. However, if they subscribe to these updates, it may slow down their experience.",
          "readOnly": "false",
          "fieldType": "boolean",
          "mandatory": false,
          "defaultValue": false
        },
        {
          "name": "enableRelatedHierarchy",
          "label": "Allow viewing related lists inline",
          "description": "Allow users to view related lists of records with the chevron button in each row",
          "readOnly": "false",
          "fieldType": "boolean",
          "mandatory": false,
          "defaultValue": false
        },
        {
          "name": "liveUpdates",
          "label": "Live updates",
          "description": "Enable this feature by setting the system property \"glide.lists.live_list_enabled\" to true. When set to auto refresh, any changes to records in the current list view automatically appear in the list, and users can pause live updates by toggling the feature off in the list header to switch to manual refresh. When set to manual refresh, an indicator on the refresh button alerts users to refresh the page when new updates are available. Note that enabling auto or manual refresh for many lists may affect system performance.",
          "readOnly": "false",
          "fieldType": "string",
          "mandatory": false,
          "defaultValue": "off"
        },
        {
          "name": "enableOnlySingleSelection",
          "label": "Enable only single selection",
          "description": "Enables only single selection",
          "readOnly": "false",
          "fieldType": "boolean",
          "mandatory": false,
          "defaultValue": false
        },
        {
          "name": "enableCardClickOpen",
          "label": "Enable Card Click open",
          "description": "Enable Card Click open",
          "readOnly": "false",
          "fieldType": "boolean",
          "mandatory": false,
          "defaultValue": false
          },
          {
          "defaultValue": "",
