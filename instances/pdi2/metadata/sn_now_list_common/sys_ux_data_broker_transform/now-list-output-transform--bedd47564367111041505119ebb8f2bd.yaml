props: "\n      [\n        {\n        \"defaultValue\": \"{}\",\n        \"description\": \"The unique identifying list controller ID that gets automatically generated when a list controller is added to a page in UIB.\",\n        \"fieldType\": \"string\",\n        \"label\": \"aiListConfig\",\n        \"mandatory\": false,\n        \"name\": \"aiListConfig\",\n        \"readOnly\": false\n    },\n        {\n          \"name\": \"currentPage\",\n          \"label\": \"Current Page\",\n          \"fieldType\": \"number\",\n          \"mandatory\": true\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"enableInfiniteScroll\",\n\t\t\t\t\t\"label\": \"Enable Infinite Scroll\",\n\t\t\t\t\t\"description\": \"This lets users scroll through a list without selecting page buttons, so pagination will be hidden. \",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"boolean\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": false\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"enableColumnCalculations\",\n\t\t\t\t\t\"label\": \"Enable column calculations\",\n\t\t\t\t\t\"description\": \"Allows users to add column calculations to specific columns in the list\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"boolean\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": false\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"enableLiveList\",\n\t\t\t\t\t\"label\": \"Enable live list\",\n\t\t\t\t\t\"description\": \"This feature will be usable only if the system property \\\"glide.lists.live_list_enabled\\\" is turned on. When it's on, this property allows users to subscribe to live list updates from the list header. However, if they subscribe to these updates, it may slow down their experience.\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"boolean\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": false\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"enableRelatedHierarchy\",\n\t\t\t\t\t\"label\": \"Allow viewing related lists inline\",\n\t\t\t\t\t\"description\": \"Allow users to view related lists of records with the chevron button in each row.\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"boolean\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": false\n\t\t\t\t},\n\t\t\t\t{\n            \"name\": \"listType\",\n            \"label\": \"List type\",\n            \"description\": \"List type\",\n            \"readOnly\": \"false\",\n            \"fieldType\": \"string\",\n            \"mandatory\": false,\n            \"defaultValue\": \"default\"\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"layouts\",\n\t\t\t\t\t\"label\": \"Layouts\",\n\t\t\t\t\t\"description\": \"Select how to display data. List layout presents data in rows and columns. Gallery layout displays data in a card-based format. If you choose multiple layouts, users will be able to switch between them.\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"string\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": \"list\"\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"cardFieldMapping\",\n\t\t\t\t\t\"label\": \"Card field mapping\",\n\t\t\t\t\t\"description\": \"Define how your data appears on cards by selecting which fields to use as heading, body text, and more.\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"json\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": {\n\t\t\t\t\t\t\"media\": \"\",\n\t\t\t\t\t\t\"tagline\": \"state\",\n\t\t\t\t\t\t\"caption\": \"\",\n\t\t\t\t\t\t\"metadata\": \"priority\",\n\t\t\t\t\t\t\"heading\": \"number\",\n\t\t\t\t\t\t\"bodyText\": \"short_description\",\n\t\t\t\t\t\t\"supplementaryFields\": \"assigned_to,sys_class_name\",\n\t\t\t\t\t\t\"footer\": \"\",\n\t\t\t\t\t\t\"cardType\": \"default\",\n\t\t\t\t\t\t\"fullWidth\": false,\n\t\t\t\t\t\t\"aspectRatio\": \"1:1\",\n\t\t\t\t\t\t\"fit\": \"contain\"\n\t\t\t\t\t}\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"liveUpdates\",\n\t\t\t\t\t\"label\": \"Live updates\",\n\t\t\t\t\t\"description\": \"Enable this feature by setting the system property \\\"glide.lists.live_list_enabled\\\" to true. When set to auto refresh, any changes to records in the current list view automatically appear in the list, and users can pause live updates by toggling the feature off in the list header to switch to manual refresh. When set to manual refresh, an indicator on the refresh button alerts users to refresh the page when new updates are available. Note that enabling auto or manual refresh for many lists may affect system performance.\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"string\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": \"off\"\n        },\n        {\n\t\t\t\t\t\"name\": \"pageSysId\",\n\t\t\t\t\t\"label\": \"Page Sys ID\",\n\t\t\t\t\t\"description\": \"The unique identifying macroponent ID of the page this list appears on.\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"string\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": \"\"\n        },\n        {\n\t\t\t\t\t\"name\": \"listControllerId\",\n\t\t\t\t\t\"label\": \"List Controller ID\",\n\t\t\t\t\t\"description\": \"The unique identifying list controller ID that gets automatically generated when a list controller is added to a page in UIB.\",\n\t\t\t\t\t\"readOnly\": false,\n\t\t\t\t\t\"fieldType\": \"string\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": \"\"\n        },\n\t\t{\n\t\t\t\"name\": \"showListCreation\",\n\t\t\t\"label\": \"Show list creation\",\n\t\t\t\"fieldType\": \"boolean\",\n\t\t\t\"mandatory\": false\n        },\n        {\n          \"name\": \"featureFlags\",\n          \"label\": \"Feature flags\",\n          \"fieldType\": \"object\",\n          \"mandatory\": false\n        },\n        {\n          \"name\": \"graphqlData\",\n          \"label\": \"Lists GraphQL\",\n          \"fieldType\": \"object\",\n          \"mandatory\": true\n        },\n  \t\t\t{\n          \"name\": \"decodedQueryData\",\n          \"label\": \"Predicate Builder decodedQuery GraphQL\",\n\t\t\t\t\t\"description\": \"Query Model object from Predicate Builder GraphQL for decodedQuery in the header filter overview.\",\n          \"fieldType\": \"object\",\n          \"mandatory\": true\n        },\n\t\t\t\t{\n          \"name\": \"fixedDecodedQueryData\",\n          \"label\": \"Predicate Builder decodedQuery GraphQL\",\n\t\t\t\t\t\"description\": \"Query Model object from Predicate Builder GraphQL for fixedDecodedQuery in the header filter overview.\",\n          \"fieldType\": \"object\",\n          \"mandatory\": true\n        },\t\t\t\t\t\n        {\n          \"name\": \"limit\",\n          \"label\": \"Limit\",\n          \"fieldType\": \"number\",\n          \"mandatory\": true\n        },\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"nestBy\",\n\t\t\t\t\t\"label\": \"Nest by\",\n\t\t\t\t\t\"description\": \"\",\n\t\t\t\t\t\"readOnly\": \"false\",\n\t\t\t\t\t\"fieldType\": \"string\",\n\t\t\t\t\t\"mandatory\": false,\n\t\t\t\t\t\"defaultValue\": \"\"\n   \t\t\t },\n        {\n          \"name\": \"rowLimitOptions\",\n          \"label\": \"Row Limit Options\",\n          \"fieldType\": \"object\",\n          \"mandatory\": true\n        },\n        {\n            \"name\": \"recordCountLimit\",\n            \"label\": \"recordCountLimit\",\n            \"description\": \"Limit of record count.\",\n            \"readOnly\": false,\n            \"fieldType\": \"number\",\n            \"mandatory\": false,\n            \"defaultValue\": null\n        },\n        {\n          \"name\": \"requestMetadata\",\n          \"label\": \"Request Metadata\",\n          \"fieldType\": \"json\",\n          \"mandatory\": false\n        },\n        {\n          \"name\": \"selectedMenuItem\",\n          \"label\": \"Selected Menu Item\",\n          \"fieldType\": \"object\",\n          \"mandatory\": false\n        },\n        {\n            \"name\": \"transformScriptArgs\",\n            \"label\": \"Transform script arguments\",\n            \"description\": \"If there is a transform script defined, you can optionally provide arguments that can be accessed within the transform script\",\n            \"readOnly\": false,\n            \"fieldType\": \"object\",\n            \"mandatory\": false\n        },\n        {\n          \"name\": \"transformScriptSysId\",\n          \"label\": \"Transform Script\",\n          \"description\": \"If you would like to edit how the data is displayed, you can provide a sysID to a script that will be run after the default transform script. In your custom script, you can toggle feature flags, edit column or row ordering, add custom data, et cetera.\",\n          \"readOnly\": false,\n          \"fieldType\": \"reference\",\n          \"typeMetadata\": {\n            \"reference\": \"sys_script_include\"\n          }\n        }\n      ]\n    "
