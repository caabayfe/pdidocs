description: |2-
  
    Use this event handler to update row and column definitions properties after the list data is fetched without having to remove preset bindings to the presentational list.
    If you want to modify these properties every time the list data is fetched, then please use the transform script ('Customizations to run on data fetch') controller property instead.
    This event only updates list controller properties and does not affect the functionalities that are dependent on list output properties.
event_name: LIST_CTRL#UPDATE_ROW_COLUMN_PROPS
