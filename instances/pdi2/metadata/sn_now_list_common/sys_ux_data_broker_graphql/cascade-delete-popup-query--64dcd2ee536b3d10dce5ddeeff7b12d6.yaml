      "name": "objSysId",
      "label": "Object sys id",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "Sys id of the selected record"
    },
    {
      "name": "stackName",
      "label": "Stack name",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "defaultValue": "",
      "description": "Stack name required for the query"
    }
  ]
query: "query ($table: String!, $objSysId: String!, $stackName: String!) {\n  GlideCascadeDelete_Query {\n    result: getCascadeDeleteTables(\n      table: $table\n      objSysId: $objSysId\n      stackName: $stackName\n    ) {\n      cascadeRecords {\n        cascadeRecordName\n        cascadeTables {\n          numRecs\n          refTableName\n          recordDetails\n        }\n      }\n      limitExceeded\n      totalCount\n    }\n  }\n}\n        "
