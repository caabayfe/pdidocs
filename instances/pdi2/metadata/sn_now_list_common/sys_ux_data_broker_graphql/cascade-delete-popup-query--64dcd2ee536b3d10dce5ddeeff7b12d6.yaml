output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "table",
      "label": "Table",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "Name of the table where records are to be deleted"
    },
