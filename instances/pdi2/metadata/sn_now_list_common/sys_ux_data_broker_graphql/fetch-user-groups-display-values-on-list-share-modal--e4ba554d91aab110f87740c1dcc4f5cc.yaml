api_name: 'sn_now_list_common.Fetch user/groups display values on list share modal '
batch_exclude: 'false'
description: 'Fetch user/groups display values on list share modal '
mutates_server_data: 'false'
name: 'Fetch user/groups display values on list share modal '
output_schema: ''
private: 'false'
props: |-
  
  [  {
      "name": "groupcondition",
      "label": "Group Condition",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": false,
      "description": "The title of the list you want to create in My List."
    },
    {
      "name": "usercondition",
      "label": "User Condition",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": false,
      "description": "The table name of the list you want to create in My List."
    }]
query: |-
  query ($groupcondition: String, $usercondition: String ) {
  	GlideRecord_Query {
  		sys_user_group (queryConditions: $groupcondition, pagination: { limit: 1000}) {
  			_results  {
  				sys_id { value }
  				name { value }
  			}
          }
          sys_user (queryConditions: $usercondition, pagination: { limit: 1000}) {
  			_results {
  				sys_id { value }
  				name { value }
  			}
          }
  	}
  }
required_translations: |-
  [ {
    "message" : "Group Condition",
    "comment" : ""
  }, {
    "message" : "The table name of the list you want to create in My List.",
    "comment" : ""
  }, {
    "message" : "The title of the list you want to create in My List.",
    "comment" : ""
  }, {
    "message" : "User Condition",
