api_name: sn_now_list_common.List Menu GQL UX
batch_exclude: 'false'
description: This is the graphql schema for list menu query
mutates_server_data: 'false'
name: List Menu GQL UX
output_schema: ''
private: 'false'
props: |-
  [{
      "name": "configurationId",
      "label": "List Menu Configuration ID",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "The ID of the configuration from sys_ux_list_menu_config table you want to populate the list-menu with."
  },
  {
      "name": "listId",
      "label": "Selected List ID",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": false,
      "description": "The ID of the list that is currently selected in the menu."
  },
  {
      "name": "allowSharing",
      "label": "Allow Sharing",
      "fieldType": "boolean",
      "valueType": "boolean",
      "readOnly": false,
      "mandatory": false,
      "description": "Set to true to get shared list data."
  },
  {
      "name": "tinyId",
      "label": "Generated ID of a shared connected list",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": false,
      "description": "A generated ID that represents a shared connected list and its applied conditions. Used for compatibility with deprecated connected lists."
  }]
query: |-
  query ($configurationId: String!, $listId: String, $allowSharing: Boolean, $tinyId: String) {
  	GlideUxListMenuLayout_Query {
  	  	getListMenuLayout(configurationId: $configurationId, listId: $listId, allowSharing: $allowSharing, tinyId: $tinyId) {
  			listMenu {
  				canUserAccessList,
  				categoryItems {
  				  	isExpanded
  				  	displayValue
  					selectionPath
  				  	id
  				  	label
  				  	type
  				  	children {
  						...listMenuItem
  				  	}
  				}
  				isListIdValid
  				listOwner
  				menuItems {
  					...myListMenuItem
  				}
  				sharedMenuItems {
  					...myListMenuItem
  				}
  				targetTablePrefix
  				selectedListMenuItem {
  					...listMenuItem
  				}
  			}
  	  }
  	}
  }

  fragment myListMenuItem on GlideUxListMenuLayout_ListMenuItemType {
  	...listMenuItem
  	sharedUsers
  	sharedGroups
  	createdByUser
  }
  fragment listMenuItem on GlideUxListMenuLayout_ListMenuItemType {
  	columns
  	conditions
  	view
  	displayValue
  	selectionPath
  	id
  	label
  	order
  	table
  	targetTable
  	groupByColumn
  	fixedQuery
  	limit
  	maxColumns
  	runHighlightedValuesQuery
  	openedByLink
  	createdOn
  	featureFlags {
  		...featureFlags
  	}

  	  
  }
  fragment featureFlags on GlideUxListMenuLayout_ListMenuItemFeatureFlagsType{
  	hideHighlightedValues
  	hideHeader
  	hideListActions
  	hideTitle
  	hideRecordCountBadge
  	hideLastRefreshedText
  	hideRefreshButton
  	hideMenuButton
  	hideOptionToSaveAs
  	hideSharingButton
  	hidePanelButton
  	hidePanelFooter
  	hidePanelRestore
  	hidePanelAdvanced
  	hidePanelConditionDelete
  	hideQuickEdit
  	hideSelectAll
  	hideCheckboxHover
  	hideRowSelector
  	hideColumnGrouping
  	hideColumnResizing
  	hideColumnFiltering
  	hideColumnSorting
  	hideDragAndDrop
  	hideCellFilter
  	hideInlineEditing
  	hideHighlightContent
  	highlightContent {
  		patterns
  		color
  	}
  	hideLinks
  	overrideWordWrapUserPref
  	wordWrap
  	maxCharacters
  	hideReferenceLinks
  	hideEmptyStateImage
  	hidePagination
  	hidePages
  	hideRange
  	hideRowCount
  	hidePreviousPage
  	hideFirstPage
  	hideLastPage
  	hideNextPage
  	hideRowsPerPageSelector
  	hidePersonalization
  }
