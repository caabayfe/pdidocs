query: |-
  query snRecordListDataBroker($table: String, $columns: String, $view: String, $columnLimit: Int, $limit: Int, $offset: Int, $query: String, $fixedQuery: String, $actionConfigId: String, $source: String, $parentRecordSysId: String, $parentTable: String, $relatedListName: String, $recordCountLimit: Int, $ignoreTotalRecordCount: Boolean, $highlightedValueConfigId: String, $runHighlightedValuesQuery: Boolean = false, $pageId: String, $listControllerId: String, $listInstanceId: String, $ignoreColumnPreferences: Boolean, $isDeclarativeActionsRequired: Boolean, $configurationId: String, $listId: String, $listColumnsTarget: String, $allowSharing: Boolean, $tiny: String, $menuLoaded: Boolean, $includeLegacyListLayout: Boolean = false, $fetchUIScripts: Boolean = false, $nestBy: String, $appId: String, $enableInfiniteScroll: Boolean, $formView: String, $enableColumnCalculations: Boolean, $fuzzyCounts: String, $aiListConfig: String) {
    GlideClientScriptingEnvironment_Query {
      ClientScriptingEnvironment_Globals {
        g_language
        g_date_time_format
        g_decimal_separator
        g_user_grouping
        g_text_direction
        g_is_accessible
      }
    }
    GlideDomain_Query {
      user {
        roles
        allRoles
        sys_id
        userName
        firstName
        lastName
        title
        avatar
        departmentId
        email
      }
    }
    GlideUIScript_Query @include(if: $fetchUIScripts) {
      uiScripts {
        scripts {
          name
          description
          script
          sysId
        }
      }
    }
    GlideRegisteredModalQuery_Query {
      registeredModals {
        modals {
          component
          namespace
          api
        }
      }
    }
    GlideDomain_Query {
      session {
        notifications {
          type
          text
          notificationType
          notificationAttributes {
            attributeName
            attributeValue
          }
          childNotifications {
            type
            text
            notificationType
          }
        }
      }
    }
    GlideNowListLayoutComposite_Query {
     getNowListLayoutComposite(table: $table, columns: $columns, view: $view, columnLimit: $columnLimit, limit: $limit, offset: $offset, query: $query, fixedQuery: $fixedQuery, actionConfigId: $actionConfigId, source: $source, parentRecordSysId: $parentRecordSysId, parentTable: $parentTable, relatedListName: $relatedListName, recordCountLimit: $recordCountLimit, ignoreTotalRecordCount: $ignoreTotalRecordCount, highlightedValueConfigId: $highlightedValueConfigId, runHighlightedValuesQuery: $runHighlightedValuesQuery, pageId: $pageId, listControllerId: $listControllerId, listInstanceId: $listInstanceId, ignoreColumnPreferences: $ignoreColumnPreferences, isDeclarativeActionsRequired: $isDeclarativeActionsRequired, configurationId: $configurationId, listId: $listId, listColumnsTarget: $listColumnsTarget, allowSharing: $allowSharing, tiny: $tiny, menuLoaded: $menuLoaded, nestBy: $nestBy, appId: $appId, enableInfiniteScroll: $enableInfiniteScroll, enableColumnCalculations: $enableColumnCalculations, formView: $formView, aiListConfig: $aiListConfig, fuzzyCounts: $fuzzyCounts) {
        listMenuLayout {
          listMenu {
            canUserAccessList
            categoryItems {
              isExpanded
              displayValue
              selectionPath
              id
              label
              type
              children {
                ...listMenuItem
              }
            }
            isListIdValid
            listOwner
            menuItems {
              ...myListMenuItem
            }
            sharedMenuItems {
              ...myListMenuItem
            }
            targetTablePrefix
            selectedListMenuItem {
              ...listMenuItem
            }
          }
        }
        nowListLayout {
          columnDefinitions {
            columns {
              key
              label
              type
              display
              choices {
                key
                label
              }
              numberFormat
              showDelimiter
              dateTimeFormat
              opensInNew
              locale
              currency
              timeZone
              thresholdColors
              renderAsLink
              multiText
              numericFieldFormat
              metadata {
                isFilterable
                isGroupable
                isSortable
                isChoice
                internalType
                isEncrypted
                excludedOperators
                targetField
                referenceDisplayName
                columnAggregatesInfo {
                  id
                  label
                  isSelected
                }
              }
            }
          }
          rowDefinitions {
            rows {
              ... on GlideNowListLayoutComposite_NowListGroupedRowType {
                key
                type
                isAiGroupedRow
                groupedRowLabel
                groupedRowCount
                children {
                  ...nowListRowQuery
                }
                nowListGroupedRowMetaData {
                  groupQuery
                  groupByField
                  groupChoiceTable
                  groupLink
                }
              }
              ... on GlideNowListLayoutComposite_NowListRowType {
                ...nowListRowQuery
              }
            }
          }
          tableMetadata {
            count
            table
            query
            fixedQuery
            tableLabel
            isOmitCount
            isDBView
            areColumnsPersonalized
            isScriptableTable
            canCreateGlobalTags
            inlineEditingEnabled
            shouldFetchRecordCount
            dateFormat
            timeFormat
            dateTimeFormat
            omitCountData {
              hasNextPage
              omitCountRowCount
            }
            orderByColumn
            orderByIsDescending
            encodedQuery
            encodedConcatenatedQuery
            encodedFixedQuery
            preferences {
              name
              value
            }
            isGrouped
            groupCount
            isChoiceAggregate
            removedRecordsCount
            allSysIds
            groupedColumn
            viewName
            formViewName
            groupByDisplayValue
            liveListEnabled
            liveListThreshold
            listCountData {
              hasNextPage
          }
            m2MData {
            isM2M
            sourceField
            targetTable
            targetField
          }
          workspaceFuzzyCount
          isTextSearchPossible
          }
          legacyListLayout @include(if: $includeLegacyListLayout) {
            ...legacyListLayout
          }
        }
        declarativeActionsLayout {
          declarativeActions {
            ...daFields
            ... on GlideNowListLayoutComposite_DeclarativeActionGroupType {
              group
              groupId
              order
              groupedActions {
                ...daFields
              }
            }
          }
        }
        fuzzyListCount {
          count
        }
      }
    }
  }

  fragment myListMenuItem on GlideNowListLayoutComposite_ListMenuItemType {
    ...listMenuItem
    sharedUsers
    sharedGroups
    createdByUser
  }

  fragment listMenuItem on GlideNowListLayoutComposite_ListMenuItemType {
    columns
    fixedQuery
    conditions
    view
    displayValue
    selectionPath
    id
    label
    order
    table
    targetTable
    groupByColumn
    openedByLink
    createdOn
    featureFlags {
      ...featureFlags
    }
  }

  fragment featureFlags on GlideNowListLayoutComposite_ListMenuItemFeatureFlagsType {
    hideHighlightedValues
    hideHeader
    hideListActions
    hideTitle
    hideRecordCountBadge
    hideLastRefreshedText
    hideRefreshButton
    hideMenuButton
    hideOptionToSaveAs
    hideSharingButton
    hidePanelButton
    hidePanelFooter
    hidePanelRestore
    hidePanelAdvanced
    hidePanelConditionDelete
    hideQuickEdit
    hideSelectAll
    hideCheckboxHover
    hideRowSelector
    hideColumnGrouping
    hideColumnResizing
    hideColumnFiltering
    hideColumnSorting
    hideDragAndDrop
    hideCellFilter
    hideInlineEditing
    hideHighlightContent
    highlightContent {
      patterns
      color
    }
    hideLinks
    overrideWordWrapUserPref
    wordWrap
    maxCharacters
    hideReferenceLinks
    hideEmptyStateImage
    hidePagination
    hidePages
    hideRange
    hideRowCount
    hidePreviousPage
    hideFirstPage
    hideLastPage
    hideNextPage
    hideRowsPerPageSelector
    hidePersonalization
    liveUpdates
    enableInfiniteScroll
    showFilterOverview
    enableColumnCalculations
    enableRelatedHierarchy
  }

  fragment nowListRowQuery on GlideNowListLayoutComposite_NowListRowType {
    key
    type
    cells {
      name
      value {
        ... on GlideNowListLayoutComposite_NowListStringCellType {
          value
          label
          metadata {
            referenceSysId
            internalValue
            internalType
            recordClassName
            ...openRecord
          }
        }
        ... on GlideNowListLayoutComposite_NowListNumberCellType {
          type
          value
          label
          metadata {
            referenceSysId
            internalValue
            internalType
            recordClassName
            ...openRecord
          }
        }
        ... on GlideNowListLayoutComposite_NowListPercentCompleteCellType {
          type
          value
          targetFieldValue
          metadata {
            internalValue
            internalType
            ...openRecord
          }
        }
        ... on GlideNowListLayoutComposite_NowListBooleanCellType {
          type
          value
          metadata {
            internalValue
            internalType
            ...openRecord
          }
        }
        ... on GlideNowListLayoutComposite_NowListPillCellType {
          type
          pills {
            key
            label
          }
          metadata {
            internalValue
            internalType
          }
        }
        ... on GlideNowListLayoutComposite_NowListWorkflowCellType {
          type
          value
          renderer
          currentStageLabel
          stages
          showApprovers
          metadata {
            internalValue
            internalType
            ...openRecord
          }
        }
      }
    }
    highlightedData @include(if: $runHighlightedValuesQuery) {
      field
      value
      status
      showIcon
      iconName
      variantName
      colorName
      size
    }
    metadata {
      tags {
        name
        canEdit
        sysId
        viewableBy
        labelEntry
      }
    }
  }

  fragment openRecord on GlideNowListLayoutComposite_NowListCellMetadataType {
    openRecordMetadata {
      sysId
      displayValue
      table
      referenceKeyValue
      isFirstNonRef
    }
  }

  fragment legacyListLayout on GlideNowListLayoutComposite_ListLayoutType {
    metadata {
      isGrouped
    }
    layoutQuery {
      ...listLayoutQuery
    }
  }

  fragment rowQuery on GlideNowListLayoutComposite_QueryRowType {
    className
    uniqueId
    displayValue
    referenceKeyValue
    rowData {
      columnName
      columnData {
        displayValue
        value
        recordClassName
        referenceKeySysId
      }
    }
    tags {
      name
      canEdit
      sysId
      viewableBy
      labelEntry
    }
    highlightedData @include(if: $runHighlightedValuesQuery) {
      field
      value
      status
      showIcon
      iconName
      variantName
      colorName
      size
    }
    dbViewData {
      tableKey
      uniqueId
    }
  }

  fragment listLayoutQuery on GlideNowListLayoutComposite_ListLayoutQueryType {
    encodedQuery
    encodedFixedQuery
    encodedConcatenatedQuery
    table
    orderByColumn
    orderByIsDescending
    allSysIds
    count
    groupCount
    isChoiceAggregate
    isOmitCount
    inlineEditingEnabled
    shouldFetchRecordCount
    listCountData {
      hasNextPage
    }
    omitCountData {
      hasNextPage
      omitCountRowCount
    }
    queryRows {
      ... on GlideNowListLayoutComposite_GroupedQueryRowType {
        displayValue
        value
        field
        aggregateQuery
        groupChoiceTable
        count
        query {
          ...rowQuery
        }
      }
      ... on GlideNowListLayoutComposite_QueryRowType {
        ...rowQuery
      }
    }
  }

  fragment daFields on GlideNowListLayoutComposite_DeclarativeActionModelType {
    toolTip
    buttonType
    recordSelectionRequired
    confirmationRequired
    confirmationMessage
    assignmentId
    table
    view
    name
    icon
    animateIcon
    interactionId
    interactionInputMap
    label
    dependency
    requiresValue
    order
    modelFieldRequired
    groupBy
    group
    actionType
    actionComponent: actionComponentTag
    actionAttributes
    actionDispatch
    actionPayload
    clientScript
    modelConditions {
      field
      operator
      value
      newQuery
      or
    }
    payloadMap {
      name
      value
    }
    dynamicEvaluationEnabled
  }
