api_name: sn_now_list_common.Save User Preferences
batch_exclude: 'false'
description: Used to update multiple user preferences
mutates_server_data: 'true'
name: Save User Preferences
output_schema: ''
private: 'false'
props: |-
  [
    {
      "name": "preferences",
      "label": "Preferences",
      "fieldType": "object",
      "readOnly": false,
      "mandatory": true,
      "description": "User preferences to update"
    }
  ]
query: |-
  mutation($preferences: [GlideDomain_PreferenceArgument!]!) {
    GlideDomain_Mutation {
      user {
        setPreferences(preferences: $preferences) {
          name
          value
        }
      }
    }
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Save User Preferences
sys_policy: ''
type: query
use_record_domain: 'false'
