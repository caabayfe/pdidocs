description: |-
  A demo transform script that applies several context actions customizations to a list, including:
  1. add row actions
  2. add column header actions to Short Description and Number columns
  3. add cell actions to Assigned To column
  4. override cell actions for Assigned To cell when the record's Assigned To is empty
  5. override group actions for priority column's 'taskPriority1' group

  **TO BE USED ON DEFAULT LIST BUNDLE, NO PROP CHANGES**
