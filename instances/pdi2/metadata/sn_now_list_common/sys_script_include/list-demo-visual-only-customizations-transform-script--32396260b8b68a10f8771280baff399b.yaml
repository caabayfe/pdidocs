description: |-
  This is a demo transform script that applies several visual-only customizations (no actions or other interactables). This is not the kitchen sink demo, it's only a couple customizations, including:
  1. edits column labels
  2. edits column header tooltip (action will still be default sort)
  3. adds column header icons to two columns
  4. changes view of person column to avatar only
  5. highlights some content
  6. displays state as an icon

  **TO BE USED ON DEFAULT LIST BUNDLE, NO PROP CHANGES**
