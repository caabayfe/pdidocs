api_name: sn_vtb.Visual Board Fetch VTB Users
batch_exclude: 'false'
description: ''
mutates_server_data: 'false'
name: Visual Board Fetch VTB Users
output_schema: ''
private: 'false'
props: |-
  [
   {
   "name": "userIds",
      "label": "User ids of VTB users",
      "fieldType": "string",
      "valueType": "string",
      "readOnly": false,
      "mandatory": true,
      "description": "User ids of VTB users",
      "defaultValue": null
  }
  ]
query: |-
  query ($userIds: String!) {
    GlideVisualBoard_Query {
      getUsers(userIds: $userIds) {
       ...vtbUserType
      }
    }
  }


  fragment vtbUserType on GlideVisualBoard_VTBUserType {
    favorite_boards: favorites {
      image
      flyout
      color
      groupId
      module
      query
      icon
      title
      type
      separator
      targetSysId
      url
      view
      fixedQuery
      windowName
      id
      open
      table
      group
      order
    }
    sys_id: sysId
    initials
    name
    avatar
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Visual Board Fetch VTB Users
sys_policy: read
type: query
use_record_domain: 'false'
