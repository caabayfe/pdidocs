api_name: sn_vtb.Visual Board Fetch All Archive Cards
batch_exclude: 'false'
description: ''
mutates_server_data: 'false'
name: Visual Board Fetch All Archive Cards
output_schema: ''
private: 'false'
props: |-
  [
   {
   "name": "boardId",
      "label": "Board id",
      "fieldType": "json",
      "valueType": "string",
      "readOnly": false,
      "mandatory": false,
      "description": "Board id",
      "defaultValue": null
  }
  ]
query: |-
  query ($boardId: String!) {
      GlideVisualBoard_Query {
        getArchivedCards(boardId: $boardId) {
          thumbnail
        attachments {
          image_width: imageWidth
          image
          can_read:canRead
          src
          sys_id: sysId
          average_imageColor : averageImageColor
          thumb_src : thumbSrc
          sys_created_on : sysCreatedOn
          size_compressed : sizeCompressed
          image_height : imageHeight
          table_name : tableName
          size_bytes : sizeBytes
          sys_created_by : sysCreatedBy
          table_sys_id : tableSysId
          file_name : fileName
          state
          content_type : contentType
        }
        swim_lane_id: swimLaneId
        sys_id: sysId
        sla {
          slaName
          stage
          hasBreached
          percentage
          plannedEndTime
          taskId
        }
        checklist {
          owner
          document
          name
          can_delete : canDelete
          id
          items {
            name
            can_delete : canDelete
            id
            complete
            checklist_id : checklistId
            order
          }
          availableTaskTypes {
            value
            label
            reference
            missing
            image
            used
            raw_label : rawLabel
            selected
          }
          table
        }
        sys_updated_on: sysUpdatedOn {
          date_time: dateTime
        }
        labelsCount
        due_date_display_value : dueDateDisplayValue
        all_sla: allSla {
          sla_name: slaName
          stage
          has_breached: hasBreached
          percentage
          planned_end_time : plannedEndTime
          task_id : taskId
        }
        labels {
          color
          active
          id
          value
          order
        }
        lane_id : laneId
        removed
        primary_key_field : primaryKeyField
        record {
          name
          value {
            ... on GlideVisualBoard_StringType {
              string
            }
            ... on GlideVisualBoard_BooleanType {
              boolean
            }
            ... on GlideVisualBoard_TaskFieldType {
              display_value : displayValue
              is_multi_text: isMultiText
              is_choice_table : isChoiceTable
              can_read: canRead
              name
              is_reference: isReference
              can_write: canWrite
              label
              max_length: maxLength
              value
            }
          }
        }
        board_id : boardId
        task_id: taskId
        order
        }
      }
    }
required_translations: ''
schema_version: 1.0.0
sys_name: Visual Board Fetch All Archive Cards
sys_policy: read
type: query
use_record_domain: 'false'
