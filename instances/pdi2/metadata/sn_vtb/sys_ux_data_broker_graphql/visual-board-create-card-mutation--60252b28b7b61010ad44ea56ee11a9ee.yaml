api_name: sn_vtb.Visual Board Create Card Mutation
batch_exclude: 'false'
description: ''
mutates_server_data: 'true'
name: Visual Board Create Card Mutation
output_schema: ''
private: 'false'
props: |-
  [
   {
   "name": "createCardInput",
      "label": "Create card input",
      "fieldType": "json",
      "valueType": "object",
      "readOnly": false,
      "mandatory": false,
      "description": "Create card input",
      "defaultValue": null
  }
  ]
query: |-
  mutation ($createCardInput: GlideVisualBoard_CreateCardInputType!) {
    GlideVisualBoard_Mutation {
      createCard(createCardInput: $createCardInput) {
        ...vtbCardType
      }
    }
  }

  fragment vtbSLAType on GlideVisualBoard_ServiceLevelAgreementType {
    sla: slaName
    stage
    has_breached: hasBreached
    percentage: percentage
    planned_end_time: plannedEndTime
    task_id: taskId
  }

  fragment vtbChecklistType on GlideVisualBoard_ChecklistType {
    owner
    document
    name
    canDelete
    id
    items {
      name
      canDelete
      id
      complete
      checklistId
      order
    }
    availableTaskTypes {
      value
      label
      reference
      missing
      image
      used
      rawLabel
      selected
    }
    table
  }

  fragment vtbLabelType on GlideVisualBoard_VTBLabelType {
    color
    active
    id
    value
    order
  }

  fragment vtbCardType on GlideVisualBoard_VTBCardType {
    thumbnail
    attachments {
      image_width: imageWidth
      image
      can_read: canRead
      src
      sys_id: sysId
      average_image_color: averageImageColor
      thumb_src: thumbSrc
      sys_created_on: sysCreatedOn
      size_compressed: sizeCompressed
      image_height: imageHeight
      table_name: tableName
      size_bytes: sizeBytes
      sys_created_by: sysCreatedBy
      table_sys_id: tableSysId
      file_name: fileName
      state
      content_type: contentType
    }
    swim_lane_id: swimLaneId
    sys_id: sysId
    sla {
      ...vtbSLAType
    }
    checklist {
      ...vtbChecklistType
    }
    sysUpdatedOn {
      dateTime
    }
    labelsCount
    due_date_display_value: dueDateDisplayValue
    all_sla: allSla {
      ...vtbSLAType
    }
    labels {
      ...vtbLabelType
    }
    lane_id: laneId
    removed
    primary_key_field: primaryKeyField
    record {
      name
      value {
        ... on GlideVisualBoard_StringType {
          string
        }
        ... on GlideVisualBoard_BooleanType {
          boolean
        }
        ... on GlideVisualBoard_TaskFieldType {
          display_value: displayValue
          is_multi_text: isMultiText
          is_choice_table: isChoiceTable
          can_read: canRead
          name
          is_reference: isReference
          can_write: canWrite
          label
          max_length: maxLength
          value
        }
      }
    }
    board_id: boardId
    task_id: taskId
    order
  }
required_translations: ''
schema_version: 1.0.0
sys_name: Visual Board Create Card Mutation
sys_policy: read
type: query
use_record_domain: 'false'
