<?xml version="1.0" encoding="utf-8" ?>
<j:jelly trim="false" xmlns:j="jelly:core" xmlns:g="glide" xmlns:j2="null" xmlns:g2="null">
	<style>
		#conference_call_end .btn.btn-icon.close.icon-cross {
			display: none
		}

		#conference_call_end .modal-header {
			border: none
		}
		#page_timing_div {
			display: none !important;
		}
		.modal-footer {
			padding: 10px;
		}
		.container {
			text-align: center;
			position: relative;
			top: 20px;
		}
	</style>
	<script>
		var taskParams = {
			conferenceCallID: '${JS_STRING:RP.getParameterValue('sysparm_conference_call_id')}',
			focusTrap: '${JS_STRING:RP.getParameterValue('sysparm_focustrap')}',
			wb: '${JS_STRING:RP.getParameterValue('sysparm_wb')}'
		}
	</script>
	<div style="line-height: 23px;" id="container">
		<div>${gs.getMessage("Are you sure you want to end the conference?")}</div>
		<div class="modal-footer flex" style="text-align: right;">
			<button id="btn-conf-cancel" onclick="return continueCancel();" class="btn btn-default">${gs.getMessage("Cancel")}</button>
			<button id="btn-conf-ok" onclick="return continueOK();" class="btn btn-danger">${gs.getMessage("End")}</button>
		</div>
	</div>
</j:jelly>
