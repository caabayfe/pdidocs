graphql_query: |-
  query {
  	GlideListMenu_Query {
  	  	getListMenuLayout(workspaceId: "${sys_aw_master_config}") {
  			listMenu {
  				categoryItems {
  				  	isExpanded
  				  	displayValue
  				  	id
  				  	label
  				  	selectionPath
  				  	type
  				  	children {
  						...listMenuItem
  				  	}
  				}
  				menuItems {
  				  	...listMenuItem
  				}
  			}
  	  	}
  	}
  }
    
  fragment listMenuItem on GlideListMenu_ListMenuItemType {
  	columns
  	conditions
  	displayValue
  	id
  	label
  	order
  	table
  	targetTable
  	selectionPath
  }
key: listMenuWorkspaceAwareQuery
