<div role="dialog">
	<div class="modal-header">
		<h3 class="modal-title">${Confirmation}</h3>
    </div>
    <div class="modal-body">
        <div style="margin: 10px 0px 10px 0px;">
        	${Do you want to end this meeting}?
        </div>
    </div>
    <div class="modal-footer approval-modal-footer">
		<button class="btn btn-sm btn-default" type="button" ng-click="cancel()">${Cancel}</button>  
		<button class="btn btn-sm btn-primary" type="button" ng-click="ok()" focus-this="true">${End meeting}</button>
    </div>
</div>
