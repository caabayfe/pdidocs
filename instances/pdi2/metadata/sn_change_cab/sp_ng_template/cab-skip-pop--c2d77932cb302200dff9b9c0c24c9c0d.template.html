<div role="dialog">
	<div class="modal-header">
		<h3 class="modal-title">${Confirmation}</h3>
    </div>
    <div class="modal-body">
        <div style="margin-bottom: 10px;">
        	${The current agenda item has not been approved}.
            <br/><br/>
            ${Do you want to move to the next item}?
        </div>
    </div>
    <div class="modal-footer approval-modal-footer">
		<button class="btn btn-sm btn-default" type="button" ng-click="cancel()">${Cancel}</button>  
		<button class="btn btn-sm btn-primary" type="button" ng-click="ok()" focus-this="true">${Ok}</button>
    </div>
</div>
