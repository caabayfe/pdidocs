<div id="cab-mn-share-modal" role="dialog" trap-focus>
  	<div class="modal-header">
		<h4 class="modal-title">${Confirm Sharing}</h4>
    </div>
    <div id="cab-mn-share-modal-body" class="modal-body">
        <div style="margin-bottom: 10px;">${Are you sure you want to share the meeting notes?}</div>
    </div>
    <div class="approval-modal-footer modal-footer">
		<button id="cab-mn-share-modal-cancel" class="btn btn-sm btn-default" type="button" ng-click='cancel()'>${Cancel}</button>  
		<button id="cab-mn-share-modal-share" autofocus class="btn btn-primary btn-sm" type="button" ng-click='share()' focus-this="true">${Share}</button>
    </div>
</div>
