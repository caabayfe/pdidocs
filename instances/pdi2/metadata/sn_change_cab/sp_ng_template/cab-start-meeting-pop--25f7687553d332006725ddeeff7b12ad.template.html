<div role="dialog">
	<div class="modal-header">
		<h3 class="modal-title">${Confirmation}</h3>
    </div>
    <div class="modal-body">
        <div style="margin: 10px 0px 10px 0px;">
        	${Do you want to start this CAB meeting?}
        </div>
    </div>
    <div class="modal-footer approval-modal-footer">
		<button class="btn btn-primary" type="button" ng-click="cancel()">${No}</button>
		<button class="btn btn-default" type="button" ng-click="ok()">${Yes}</button>
    </div>
</div>
