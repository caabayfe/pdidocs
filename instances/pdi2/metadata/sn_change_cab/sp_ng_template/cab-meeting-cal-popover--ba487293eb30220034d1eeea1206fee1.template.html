<div class = "{{cab_a11y}}" id="cab_event_dialog_{{eventIndex}}" tabindex="{{tabindex}}" data-popover-index="{{eventIndex}}" role="dialog" aria-labelledby="cab_event_name_{{eventIndex}}">
<div class="popover-title">
	<table width="100%">
      <tr><td id = "cab_event_name_{{eventIndex}}" align="left">{{ev.meeting.name.value}}</td><td align="right"><button aria-label = "${Navigate to meeting page}" class="btn btn-default btn-sm popover-title-button" ng-click='onEventClick(ev.meeting.sys_id.value)' ng-keydown='onEventKeydown($event, ev.meeting.sys_id.value, eventIndex)' ng-disabled="!ev.meeting.hasAgendaItems">${Open}</button></td></tr>
      <tr ng-if="!ev.meeting.hasAgendaItems"><td colspan="2" class="popover-label">${This meeting has no agenda}</td></tr>
  </table>
</div>
<div class='popover-body'><table width="100%">
	<tr><td class="popover-label" align="right" style="padding-right: 8px; padding-bottom: 8px;">${CAB Manager}</td><td class="popover-value" style="padding-bottom: 8px;">{{ev.meeting.manager.display_value}}</td></tr>
    <tr><td class="popover-label" align="right" style="padding-right: 8px; padding-bottom: 8px;">${Start}</td><td class="popover-value" style="padding-bottom: 8px;">{{ev.meeting.start.display_value}}</td></tr>
	<tr><td class="popover-label" align="right" style="padding-right: 8px; pading-bottom: 8px;">${End}</td><td class="popover-value" style="padding-bottom: 8px;">{{ev.meeting.end.display_value}}</td></tr>
    <tr><td class="popover-label" align="right" style="padding-right: 8px;">${State}</td><td class="popover-value">{{ev.meeting.state.display_value}}</td></tr>
</table></div>
</div>
