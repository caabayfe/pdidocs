<div ng-attr-id="{{::dlgCtrl.content.id}}" class="modal-content" role="dialog">
	<div class="modal-header">
		<button type="button" class="btn close icon-cross" ng-click="dlgCtrl.close()" ng-attr-id="{{::dlgCtrl.content.id + '-close'}}"><span class="sr-only">${Close}</span></button>
		<h4 class="modal-title" style="pointer-events:none;">{{::dlgCtrl.content.title}}</h4>
	</div>
  	<div ng-attr-id="{{::dlgCtrl.content.id + '-body'}}" role="document" tabindex="0" class="modal-body" ng-bind-html="dlgCtrl.content.html" focus-this="true" ng-focus="dlgCtrl.modalBodyFocused()" prevent-focus-scroll="true"></div>
</div>
