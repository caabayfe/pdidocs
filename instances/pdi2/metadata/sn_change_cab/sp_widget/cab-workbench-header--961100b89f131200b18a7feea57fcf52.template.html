<div class="header" cab-loading>
	<div id="cab-meeting-header-container" class="container" role="region" aria-label="${CAB Header Widget}" focus-this="header.hasFocus" tabindex="0">
		<div class="header-timer">
			<sn-donut-timer x-aria-parent-label="${CAB Header Widget}" name="{{::data.meetingId}}" size="66px" minutes-label="true" show-before-start="false" max-display-value="9999" />
		</div>
		<div class="title" role="group" aria-labelledby="cab_header_title">
			<h1 id="cab_header_title" class="ng-cloak">{{meeting.record.name.display_value}}<br/>
				<small ng-if="!meeting.isCancelled()">{{meeting.duration_label}}</small>
				<small ng-if="meeting.isCancelled()">${This meeting has been cancelled}</small>
          	</h1>
		</div>
		<div ng-if="meeting.canManage() && meeting.isPending()">
			<button id="cab-start-meeting-btn" ng-click="meeting.start()" class="btn cab-start-meeting btn-start-meeting btn-primary">${Start meeting}</button>
		</div>
		<div class="nav-section">
			<ul class="nav nav-pills" aria-label="${Meeting toolbar}">
             	<li ng-if="meeting.canRequestHost()"><button id="cab-host-meeting-btn" class="btn btn-host btn-primary" ng-click="meeting.requestHost()" ng-disabled="meeting.hostRequested" ng-attr-aria-label="${host meeting}">${Host}</button></li>
				<li><button id="cab-meeting-notes-trigger" class="btn btn-trigger" ng-click="popup.meetingNotes.onClick()" aria-label="${Meeting Notes}" focus-this="popup.meetingNotes.hasFocus">${Meeting Notes}</button></li>
              	<li><button id="cab-attendees-trigger" class="btn btn-trigger" aria-label="{{ meetingIsCancelled() ? '${Attendees}' : '${Attendees}' + ' ' + meetingAttendees.attendanceCount()}}" ng-click="popup.attendees.onClick()" focus-this="popup.attendees.hasFocus">${Attendees} <span ng-if="!isMeetingCancelled()" class="badge">{{meetingAttendees.attendanceCount()}}</span></button></li>
              	<li><button id="cab-conference-info-trigger" class="btn btn-trigger" aria-label="${Conference Information}" ng-click="popup.conferenceInfo.onClick()" focus-this="popup.conferenceInfo.hasFocus">${Conference Information}</button></li>
			</ul>
		</div>
	</div>
</div>
