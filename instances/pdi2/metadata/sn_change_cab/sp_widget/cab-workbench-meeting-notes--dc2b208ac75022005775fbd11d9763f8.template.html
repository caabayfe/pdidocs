<div class="mn-container" id='cab-mn-container'>
  <div id="cab-mn-editor" ng-if="meetingNotes.canEdit()">
    <textarea id="cab-mn-editor-textarea" ui-tinymce="meetingNotes.editor.config" ng-model="meetingNotes.workingCopy"></textarea>
  </div>
  <div id="cab-mn-readonly" class="mn-static-notes" ng-if="!meetingNotes.canEdit()" ng-bind-html="meeting.record.meeting_notes.display_value" tabindex="0" focus-this="true"></div>
  <div class="row mn-footer">
		<span aria-live="polite" id='cab-mn-notification' class="noSelect fade-in-out pull-left mn-notification" ng-show="modalNotification.display">{{modalNotification.message}}</span>
		<span class="pull-right">
          	<button tabindex="0" ng-if="meetingNotes.edit.available()" id="cab-mn-edit-btn" ng-click="meetingNotes.edit.onClick()" class="btn btn-sm btn-default">${Edit}</button>
			<span ng-if="meetingNotes.canShare()" tabindex="0" ng-focus="meetingNotes.share.focusFix($event)">
				<button id="cab-mn-share-btn" ng-click="meetingNotes.share.onClick()" class="btn btn-sm btn-default" ng-disabled="!meetingNotes.share.available()" focus-this="meetingNotes.share.hasFocus">${Share}</button>
			</span>
    	</span>
  </div>
</div>
