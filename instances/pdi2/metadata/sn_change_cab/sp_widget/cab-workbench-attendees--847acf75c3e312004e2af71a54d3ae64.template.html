<div>
	<div><input type="text" placeholder="${Search}" id="attendeeSearchQuery" ng-model="attendeeSearch.query" ng-model-options="{debounce: 500}" ng-disabled="attendeeSearch.running" class="form-control" focus-this="!attendeeSearch.running"></div>
	<div class="scrollpane" ng-if="!attendeeSearch.running">
      	<div ng-if="attendeeSearch.results.length == 0 && attendeeSearch.performed">
          ${No matching attendees found}
      	</div>
      	<div ng-if="attendeeSearch.limitedInitialResults()">
          ${Showing first 50 attendees}
      	</div>
     	 <div role="list" ng-if="attendeeSearch.results.length > 0">
			<div role="listitem" ng-repeat="attendee in attendeeSearch.results track by attendee.sys_id.value" tabindex="0" ng-attr-id="{{::'avatar-' + attendee.sys_id.value}}">
            	<div ng-class="{'user user-last':$last, 'user':!$last, 'user-first':$first}">
                	<div class="avatar-card">
                    	<div class="avatar-wrapper" aria-hidden="true"><sn-avatar primary="attendee.__profile" show-presence="true"></sn-avatar></div>
                    	<div class="avatar-name">{{attendee.attendee.display_value}}<br/><small>{{attendee.attendance.display_value}}</small></div>
                	</div>
            	</div>
        	</div>
  	 	</div>
	</div>
</div>
