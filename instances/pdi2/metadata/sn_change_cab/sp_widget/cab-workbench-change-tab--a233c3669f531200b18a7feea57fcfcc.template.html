<div role="region" tabindex="0" ng-attr-aria-label="{{aria.panelDesc() || c.data.i18n.tabPanelDefault}}">
<div class="panel panel-default">
	<div class="panel-heading heading widget-heading" ng-class="{'meeting-not-started': !meeting.viewingChange()}">
		<div ng-if="aItm.canReadTask()" class="change-desc-wrap title">
			<span>{{change.number.display_value}} - <b>{{change.short_description.display_value}}</b></span>
		</div>
		<span ng-if="aItm.canReadTask()" class="pull-right">
			<div class="btn-group" role="tablist" aria-label="{{::c.data.i18n.currentChangeTabsGroup}}">
              	<button id="cab-form-tab" class="btn btn-primary btn-sm"
                        ng-if="!hideFormButton()"
						role="tab" aria-controls="cab-form-panel" aria-label="{{::c.data.i18n.showForm}}"
						ng-attr-tabindex="{{tab.selected(CAB.FORM_TAB) ? 0 : -1}}"
						ng-attr-aria-selected="{{tab.selected(CAB.FORM_TAB)}}"

						ng-class="{'focus-tab': tab.selected(CAB.FORM_TAB)}"
						ng-keydown="tab.onKeydown($event, CAB.FORM_TAB)"
						ng-click="tab.onClick($event, CAB.FORM_TAB)"

						uib-tooltip="{{::c.data.i18n.showForm}}" tooltip-placement="bottom" tooltip-append-to-body="true">
					<span class="glyphicon glyphicon-folder-close"></span>
					<span class="sr-only">{{::c.data.i18n.showForm}}</span>
				</button>
			  	<button id="cab-cal-tab" class="btn btn-primary btn-sm"
			  			ng-if="!hideCalendar()"
						role="tab" aria-controls="cab-cal-panel" aria-label="${Show calendar}"
						ng-attr-tabindex="{{tab.selected(CAB.CAL_TAB) ? 0 : -1}}"
						ng-attr-aria-selected="{{tab.selected(CAB.CAL_TAB)}}"

						ng-class="{'focus-tab': tab.selected(CAB.CAL_TAB)}"
						ng-keydown="tab.onKeydown($event, CAB.CAL_TAB)"
						ng-click="tab.onClick($event, CAB.CAL_TAB)"

						uib-tooltip="${Show calendar}" tooltip-placement="bottom" tooltip-append-to-body="true">
					<span class="glyphicon glyphicon-calendar"></span>
					<span class="sr-only">${Show calendar}</span>
			  	</button>
			</div>
		</span>
	</div>
	<div class="clearfix"></div>
</div>
<div class="panel-body tab-body">
	<div id="cab-form-panel" role="tabpanel" aria-labelledby="cab-form-tab"
		 ng-attr-tabindex="{{tab.selected(CAB.FORM_TAB) ? 0 : -1}}"
		 ng-attr-aria-hidden="{{!tab.selected(CAB.FORM_TAB)}}">
		<div ng-show="tab.selected(CAB.FORM_TAB)" class="row">
			<div class="col-xs-12 cols"><sp-widget widget="data.widget.form"></sp-widget></div>
		</div>
	 </div>
  	<div id="cab-cal-panel" role="tabpanel" aria-labelledby="cab-cal-tab"
		 ng-attr-tabindex="{{tab.selected(CAB.CAL_TAB) ? 0 : -1}}"
		 ng-attr-aria-hidden="{{!tab.selected(CAB.CAL_TAB)}}">
		<div ng-if="tab.selected(CAB.CAL_TAB)" class="row">
			<div class="col-xs-12 cols"><sp-widget widget="data.widget.calendar"></sp-widget></div>
	   </div>
	</div>
</div>
</div>
