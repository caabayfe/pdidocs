  It is the count on data source ICenter.LocalLoginsNotProtectedByMFA, which is using the table: 
  sys_user_login_history
  with the following conditions:
  Login Type = DB .or. Login Type = LDAP .and. Status = SUCCESS .and. MFA Enforced = false
