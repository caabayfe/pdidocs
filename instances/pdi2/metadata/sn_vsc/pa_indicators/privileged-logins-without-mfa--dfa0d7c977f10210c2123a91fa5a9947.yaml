description: |-
  Privileged logins without MFA  is measured daily as unit #.
  The goal for this indicator is not set.
  It is the count on data source ICenter.LocalLoginsOfPrivilegedUsersNotProtectedByMFA, which is using the table: 
  sys_user_login_history
  with the following conditions:
  Login Type = DB .or. Login Type = LDAP .and. Status = SUCCESS .and. MFA Enforced = false .and. Privileged User = true
  Additional conditions:
  Time of login on Today
