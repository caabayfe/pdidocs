description: |-
  Privileged Users Not Logged In Last 6 Months is measured daily as unit .
  The goal for this indicator is not set.
  It is the count distinct on data source ICenter.PrivilegedUsersNotLoggedInLastSixMonths, which is using the table: 
  sn_vsc_icenter_privileged_users_details
  with the following conditions:
  Active = true .and. Last login < javascript:gs.monthsAgo(6) .and. Web service access only = false .or. Web service access only is empty .and. Internal Integration User = false .or. Internal Integration User is empty
