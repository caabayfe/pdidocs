description: |-
  A common reusable util class to poll for status of a particular comparison within VSC ( scans, hardening settings, etc ) .


  Reuired properties or params  for getProcessStatus function  :

  {
    "payload"                                                                :  String type as the name suggests should have the date range separted by a comma  < start date, end date >( yy-mm-dd, yy-mm-dd ),
    "comparisonType"                                             :  String type to pull in the constants / config for the comaprison eg, "hardning_comparisons", etc
  }
