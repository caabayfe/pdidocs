required_translations: |-
  [ {
    "message" : "<p style=\"font-size: 14px;\">In addition to the common practices above, the Security center learning page has many additional resources such as functional guides to help gain value from the security tools offered. <a href=\"/now/security-center-hub/learning\" target=\"_blank\" rel=\"noopener\">Learn more.</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#1</span></p>\n<p><span style=\"font-size: 14px;\">ServiceNow recommends security best practices for you to complete</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#2</span></p>\n<p><span style=\"font-size: 14px;\">Best practices are updated each release and can be general or specialized</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#3</span></p>\n<p><span style=\"font-size: 14px;\">Help administrators complete privacy and security tasks seamlessly</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>In this tool, complete ServiceNow recommended security best practices. You will be guided step by step to complete each best practice in order to ensure your security is as strong as possible.</p>\n<p>We&rsquo;ll go through some of the high level features included in this product.</p>",
