required_translations: |-
  [ {
    "message" : "<p style=\"font-size: 14px;\">In addition to the common practices above, the Security center learning page has many additional resources such as functional guides to help gain value from the security tools offered. <a href=\"/now/security-center-hub/learning\" target=\"_blank\" rel=\"noopener\">Learn more.</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#1</span></p>\n<p><span style=\"font-size: 14px;\">Configure security hardening settings based on ServiceNow recommendations</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#2</span></p>\n<p><span style=\"font-size: 14px;\">Scan the instance against known insecure configurations and identify how to strengthen insecurities</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#3</span></p>\n<p><span style=\"font-size: 14px;\">Monitor overall security posture in one dashboard and across instances</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>In this tool, get all the details of your instance security health by configuring and monitoring security tools to fit your needs. Quickly visualize the security of your instance and identify how to improve it all in one place.&nbsp;</p>\n<p>We&rsquo;ll go through some of the high level features included in this product.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Key resources and best practices for securing your instance.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Understand your role as the data controller in the shared security model.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Watch a breadth of videos covering security, encryption options, data management, and more.</p>",
