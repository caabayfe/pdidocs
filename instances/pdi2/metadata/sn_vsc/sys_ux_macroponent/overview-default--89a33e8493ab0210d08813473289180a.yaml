  [ {
    "message" : "<p>Customer actions are security updates that need to be made to the instance. <a style=\"color: rgb(var(--now-color--link-2));\" href=\"/api/now/v1/context_doc_url/critical-updates\" target=\"_blank\" rel=\"noopener\">Learn more</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Instance hardening strengthens the security of individual instances by implementing various measures to protect against potential threats and vulnerabilities. <a style=\"color: rgb(var(--now-color--link-2));\" href=\"/api/now/v1/context_doc_url/sc-hardening\" target=\"_blank\" rel=\"noopener\">Learn more</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Use scan suites to automate testing security scan checks. Compare findings from any two suites using the scan comparison tool. Create a custom suite using checks that are most important to your organization. <a style=\"color: rgb(var(--now-color--link-2));\" href=\"/api/now/v1/context_doc_url/sc-scanning\" target=\"_blank\" rel=\"noopener\">Learn more</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Watch this video to see how the configuration console works.</p>\n<p>In the configuration console, use hardening to strengthen an instance&rsquo;s security to protect against potential threats. Use security scans to automate testing security scan checks, compare scan suites, or customize scan suites to best fit your organization needs. Lastly in the configuration console, Customer actions will surface security updates that need to be made to the instance.</p>",
    "code" : "",
    "comment" : ""
  }, {
