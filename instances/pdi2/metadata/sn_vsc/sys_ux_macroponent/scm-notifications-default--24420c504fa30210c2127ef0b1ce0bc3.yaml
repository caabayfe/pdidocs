required_translations: |-
  [ {
    "message" : "<p style=\"font-size: 14px;\">In addition to the common practices above, the Security center learning page has many additional resources such as functional guides to help gain value from the security tools offered. <a href=\"/now/security-center-hub/learning\" target=\"_blank\" rel=\"noopener\">Learn more.</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#1</span></p>\n<p><span style=\"font-size: 14px;\">Set up custom event policies to trigger security notifications</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#2</span></p>\n<p><span style=\"font-size: 14px;\">Ensures you won&rsquo;t miss when an important security event occurs</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#3</span></p>\n<p><span style=\"font-size: 14px;\">View when events or policies were triggered and who gets notified</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>A custom policy combines multiple conditions, each based on a unique trigger that determines when the policy will run. You may add conditions after you create the policy. <a title=\"Learn how to create a custom policy.\" href=\"/api/now/v1/context_doc_url/sc-rid:create-a-policy\" target=\"_blank\" rel=\"noopener\">Learn how to create a custom policy.</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>With this tool, customize specific monitoring notifications to alert you when security events occur. Set up thresholds and policies that when triggered will notify you. Get in depth information of when policies and thresholds are triggered and who gets notified.</p>\n<p>We'll go through some of the high level features included in this product.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "Admins can create security policies to monitor and alert users about specific events within their ServiceNow instance. For instance, a user being locked out will trigger an alert if the policy is configured on their instance. Custom policies can also be created to combine multiple conditions.",
    "code" : "",
    "comment" : ""
  }, {
