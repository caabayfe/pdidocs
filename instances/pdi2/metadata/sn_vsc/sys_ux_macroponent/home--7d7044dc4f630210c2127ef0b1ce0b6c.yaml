  [ {
    "message" : "<p>Review a collection of security metrics from various security products</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Security events track key events such as impersonating an administrator or exporting data that may be potential security risks. <a style=\"color: rgb(var(--now-color--link-2));\" href=\"/api/now/v1/context_doc_url/security-policies\" target=\"_blank\" rel=\"noopener\">Learn More</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Set up thresholds to get notified when any of the security metrics are exceeded. <a style=\"color: rgb(var(--now-color--link-2));\" href=\"/api/now/v1/context_doc_url/pa-threshold\" target=\"_blank\" rel=\"noopener\">Learn More</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>Watch this video to see how the monitoring console works.</p>\n<p>In the monitoring console, get wholistic visibility into all security metrics covering various products. You may also set up thresholds to be notified when any of these metrics exceed thresholds. Security event monitoring allows you to track key events such as impersonation or exporting data that may be potential security risks.</p>",
    "code" : "",
    "comment" : ""
