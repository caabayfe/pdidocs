required_translations: |-
  [ {
    "message" : "<a style=\"width: 100%; height: 100%; display: inline-block; margin: 0px; padding: 0px; color: transparent;\" href=\"/now/security-center-posture/best_practices_home\" target=\"_self\" rel=\"noopener\">\n<p>Link to Best Practices</p>\n</a>",
    "comment" : ""
  }, {
    "message" : "<p>Best Practices help administrators complete privacy and security configuration tasks effectively and efficiently. <a style=\"color: rgb(var(--now-color--link-2));\" href=\"/api/now/v1/context_doc_url/security-best-practices-manager\" target=\"_blank\" rel=\"noopener\">Learn more</a></p>",
    "comment" : ""
  }, {
    "message" : "<p>Get key performance indicators for your organization&rsquo;s security posture. <a style=\"color: rgb(var(--now-color--link-2));\" href=\"/api/now/v1/context_doc_url/scc-sec-posture-dashboard\" target=\"_blank\" rel=\"noopener\">Learn more</a></p>",
    "comment" : ""
  }, {
    "message" : "<p>Watch this video to see how the posture console works.</p>\n<p>The posture console is designed to quickly showcase your security health posture with an instance-wide dashboard made up of key performance indicators that are completely customizable. Maintain your security posture using guided best practices to complete privacy and security configuration tasks effectively and efficiently.</p>",
