  [ {
    "message" : "<div>Scan findings</div>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"font-size: 14px;\">In addition to the common practices above, the Security center learning page has many additional resources such as functional guides to help gain value from the security tools offered. <a href=\"/now/security-center-hub/learning\" target=\"_blank\" rel=\"noopener\">Learn more.</a></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#1</span></p>\n<p><span style=\"font-size: 14px;\">Scan instances against known insecure configurations to identify how to strengthen insecurities</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#2</span></p>\n<p><span style=\"font-size: 14px;\">Customize security checks in order to ensure security center addresses your needs </span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p style=\"margin: 0;\"><span style=\"font-size: 12px; color: grey;\">#3</span></p>\n<p><span style=\"font-size: 14px;\">Review findings and results or compare specific findings over time</span></p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p><strong>What next?</strong><br>Use the filters below to review scan findings by category. Review any finding to identify configurations that may need remediation.</p>",
    "code" : "",
    "comment" : ""
  }, {
    "message" : "<p>With this tool, check on your instance security by running scans and checks to help identify weaknesses and how to strengthen any vulnerabilities. Quickly get insight that fits your needs by customizing your security checks and comprehensively analyze findings.&nbsp;</p>\n<p>We'll go through some of the high level features included in this product.</p>",
    "code" : "",
