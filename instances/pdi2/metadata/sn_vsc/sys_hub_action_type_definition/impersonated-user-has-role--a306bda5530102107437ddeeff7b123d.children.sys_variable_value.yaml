  sys_updated_on: 2024-05-28 21:48:10
  value: |-
    (function execute(inputs, outputs) {
        var roles = inputs.roles;
        var userID = inputs.user.sys_id;
        outputs.has_role = false;
        if (!roles.isValidRecord()) {
            if (!roles.next()) {
                return;
            }
        }
        do {
            var hasRole = new GlideRecord('sys_user_has_role');
            hasRole.setLimit(1);
            hasRole.addQuery('role', roles.sys_id);
            hasRole.addQuery('user', userID);
            hasRole.query();
            if (hasRole.hasNext()) {
                outputs.has_role = true;
                return;
            }
        } while (roles.next());
    })(inputs, outputs);
  variable: 71aa7f6647032200b4fad7527c9a719b
