    (function execute(inputs, outputs) {
        if (sc_sp_event_trigger) {
            var gr = new GlideRecord('sys_user');
            gr.get('user_name', sc_sp_event_trigger.impersonated);
            outputs.impersonated_user = gr;
        }
    })(inputs, outputs);
