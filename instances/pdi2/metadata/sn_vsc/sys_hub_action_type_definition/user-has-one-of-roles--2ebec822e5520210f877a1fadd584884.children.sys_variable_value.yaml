  value: |-
    (function execute(inputs, outputs) {
        var roles = inputs.roles;
        var sc_event = sc_sp_event_trigger;
        outputs.has_role = false;
        if (!roles.isValidRecord()) {
            if (!roles.next()) {
                return;
            }
        }
        do {
            var hasRole = new GlideRecord('sys_user_has_role');
            hasRole.setLimit(1);
            hasRole.addQuery('role', roles.sys_id);
            hasRole.addQuery('user', sc_event.user.sys_id);
            hasRole.query();
            if (hasRole.hasNext()) {
                outputs.has_role = true;
                return;
            }
        } while (roles.next());
    })(inputs, outputs);
