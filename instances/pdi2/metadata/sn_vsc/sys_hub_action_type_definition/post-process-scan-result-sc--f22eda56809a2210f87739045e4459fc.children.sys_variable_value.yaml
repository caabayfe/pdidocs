  value: |-
    (function execute(inputs, outputs) {
        var findingMap = {};
        if (!inputs.findings || !inputs.scan_check_executions) {
          return;
        }
      	var findings = inputs.findings;
      	var checkExecutions = inputs.scan_check_executions;

    	  while(findings.next()) {
        	findingMap[findings.check] = true;
        }
        var checkSysIds = [];
        var baselineMap = {};
        var checkToExecution = {};

        while (checkExecutions.next()) {
            checkSysIds.push(checkExecutions.check.sys_id);
            checkToExecution[checkExecutions.check] = checkExecutions.sys_id.toString();
        }
        if (checkSysIds.length > 0) {
            var baselineGr = new GlideRecord('sn_vsc_hardening_baseline_configuration');
            baselineGr.addQuery('check', 'IN', checkSysIds.join(','));
            baselineGr.query();
            while (baselineGr.next()) {
                baselineMap[baselineGr.check] = {
                    aconf: baselineGr.aconf.toString(),
                    vconf: baselineGr.vconf.toString(),
                    sys_id: baselineGr.sys_id.toString(),
                    exec_sys_id: checkToExecution[baselineGr.check]
                };
            }
        }
        for (var check in baselineMap) {
          var gr = new GlideRecord("sn_vsc_hardening_baseline_result");
          gr.scan_check_execution = baselineMap[check].exec_sys_id;
          gr.configuration_number = baselineMap[check].aconf;
          gr.u_vconf_number = baselineMap[check].vconf;
          gr.vconf_number = baselineMap[check].vconf;
          gr.passed = !findingMap[check];
          gr.insert();
        }
    })(inputs, outputs);
