  value: |-
    (function execute(inputs, outputs) {
        do {
            if (inputs.impersonated_user.sys_id == inputs.users.sys_id) {
                outputs.is_impersonated = true;
                return;
            }
        } while (inputs.users.next());
        outputs.is_impersonated = false;
    })(inputs, outputs);
