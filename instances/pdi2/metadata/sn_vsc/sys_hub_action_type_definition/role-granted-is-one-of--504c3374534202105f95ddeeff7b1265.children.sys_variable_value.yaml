  value: |-
    (function execute(inputs, outputs) {
        var gr = sc_sp_event_trigger;
        var roles = inputs.roles;
        do {
            if (roles.sys_id == gr.role) {
                outputs.is_role = true;
                return;
            }
        } while (roles.next());
        outputs.is_role = false;
    })(inputs, outputs);
