description: This property defines a default behavior for the "retrieveAddress" API. When there are no roles given in property "glide.sc.req_for.roles",  the Client Callable Script Include 'ScriptServiceCatalogGetLocation' can be called by any unprivileged logged-in user and can retrieve the address of any other users in the system. If "glide.sc.req_for.roles.default" is not set to the recommended value of "deny" (allow) and the value of glide.sc.req_for.roles is empty, then any user can request items for other users allowing unauthorized resource access.
documentation_url: /api/now/v1/context_doc_url/sc-rid:deny-unauthorized-access-request-items
finding_type: scan_finding
name: Deny Unauthorized Access to Request Items
priority: '3'
resolution_details: Ensure the property "glide.sc.req_for.roles.default" is set to "deny".
