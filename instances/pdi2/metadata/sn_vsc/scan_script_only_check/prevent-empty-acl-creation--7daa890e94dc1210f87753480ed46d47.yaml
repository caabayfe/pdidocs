category: security
description: |-
  The glide.security.empty_acl.popup_window.enabled property controls whether users making form-based edits to ACL records (sys_security_acl) can create, update, or save an invalid ACL that has an invalid data condition, script, security attribute, or roles list, or otherwise does not have any configured (an "empty ACL"). As of the Xanadu release, an empty ACL will completely deny access. On versions prior to Xanadu, empty an ACL will allow unconditional access.

  When the glide.security.empty_acl.popup_window.enabled property is set to a secure value of "true", attempts to create, update, or save an invalid or empty ACL will be blocked, and a client-side model will be provided to configure a role or security attribute for the ACL. If the property is insecurely set to any other value, then such attempts will be allowed and no client-side model will be displayed.

  Note: This property is case sensitive. A value of "True" (capital "T") will be equivalent to "false". Additionally, this property will only function when the High Security (com.glide.high_security) plugin is installed and active.
documentation_url: /api/now/v1/context_doc_url/sc-rid:prevent-empty-acl-creation
finding_type: scan_finding
name: Prevent Empty ACL Creation
priority: '3'
resolution_details: Ensure the glide.security.empty_acl.popup_window.enabled property is set to "true" and ensure that the High Security (com.glide.high_security) plugin is active.
