active: 'true'
category: security
description: If "glide.security.url.whitelist.strict_check" is not set to the recommended value of "true" then all external URLs are allowed for redirection when "glide.security.url.whitelist" is empty. If "glide.security.url.whitelist" is not empty,  then only external URLs in the whitelist are allowed. Thus either setting "glide.security.url.whitelist.strict_check" to true OR ensuring "glide.security.url.whitelist" is set to a non-empty value with the allowed external URLs leaves the instance in a secure state.  If all external URLs are allowed for redirection, this could allow an attacker to redirect a user to a malicious website.
documentation_url: /api/now/v1/context_doc_url/sc-rid:url-whitelist-for-logout-redirects
finding_type: scan_finding
name: Enforce URL Allowlist Check
priority: '3'
resolution_details: Ensure the property "glide.security.url.whitelist.strict_check" is set to "true" or the property "glide.security.url.whitelist" is set to a value.
