active: 'true'
category: security
description: 'This property specifies the maximum number of recipients the instance can list in the To: line for a single email notification. Notifications that would exceed this limit instead create duplicate email notifications addressed to a subset of the recipient list. Each email notification has the same maximum number of recipients. If this property is set to an insecure value above the default value of 100, then its possible a denial of service could happen on the instance.'
documentation_url: /api/now/v1/context_doc_url/sc-rid:max-smtp-recipients
finding_type: scan_finding
name: Minimize SMTP Recipient Quantity
priority: '3'
resolution_details: Ensure the property "glide.email.smtp.max_recipients" is set to "100" or less.
