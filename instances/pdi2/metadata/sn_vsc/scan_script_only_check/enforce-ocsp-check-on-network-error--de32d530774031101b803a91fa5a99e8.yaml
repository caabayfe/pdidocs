active: 'true'
category: security
description: If "com.glide.communications.httpclient.ocsp_allow_network_error" is not set to the recommended value of "false", and the OCSP check is encountering a network error (e.g. a timeout or problem fetching the revocation information, etc) it will bypass the OSCP security check and consider it successful. This is dangerous and risky because an attacker with a revoked certificate can simply neglect to provide an OCSP response when a browser connects to it and the browser will mistakenly accept their revoked certificate, breaking the notion of PKI/digital certificate trust that is foundational to the web. Use of revoked certificates is often an indicator of malicious activity unless servers are out of sync.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enforce-ocsp-check
finding_type: scan_finding
name: Enforce OCSP Check on Network Error
priority: '3'
resolution_details: Ensure the property "com.glide.communications.httpclient.ocsp_allow_network_error" exists and is set to "false". If the property does not appear in the sys_properties table, add a new record.
run_condition: ''
score_max: '100'
score_min: '0'
score_scale: '1'
