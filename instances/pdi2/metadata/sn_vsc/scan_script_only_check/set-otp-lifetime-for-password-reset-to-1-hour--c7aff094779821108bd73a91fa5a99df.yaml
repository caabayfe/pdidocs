category: security
description: |-
  Control the time duration of the link in the password reset email.

  The property glide.pwd_reset.onetime.token.validity makes the link in the password reset email expire after the number of hours specified in the property. The validity time of a password reset token should be kept as short as possible while not disrupting normal user experience

  A longer validity time for password reset token gives malicious actors a wider window to perform account takeover if the email with the reset token is leaked or compromised.
