category: security
description: |-
  If "glide.cs.debug" is not set to the recommended value of "false", then chat server messages logging is enabled. This could lead to unintended sensitive information leak through system logs.
  Setting the property value to true enables logging chat server messages on system logs. As a lot of log messages are generated, it is advised to enable it only when troubleshooting chat server. After troubleshooting, the property should be disabled to avoid clogging system logs. 
  Setting the property to false, which is also the default value does not log chat server messages on system logs.
documentation_url: /api/now/v1/context_doc_url/sc-rid:disable-chat-server-debug
finding_type: scan_finding
name: Disable Chat Server Debugging
priority: '4'
resolution_details: Ensure the property "glide.cs.debug" is set to "false".
