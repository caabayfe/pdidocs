category: security
description: |-
  Use the glide.rest.table_api.admin_only_sys_fields system property to control write access to the fields generated by the system.

  The glide.rest.table_api.admin_only_sys_fields property controls write access to these fields:
  - sys_id
  - sys_created_by
  - sys_created_on
  - sys_updated_by
  - sys_updated_on

  When this property is set to true only an admin can write to these fields that are system-generated values. When the property is set to false or it doesn't exist in the System Properties [sys_properties] table, then a user who has create or write access to a table can write to these system values using the Table API (https://www.servicenow.com/docs/csh?topicname=c_TableAPI.html&version=latest).

  Users without the admin role could update fields such as sys_created_by or sys_updated_on. This access can impact the integrity of the created or updated record metadata, making records appear as if they were created by another user or updated at a different time.
documentation_url: /api/now/v1/context_doc_url/sc-rid:sc-restrict-write-access-on-system-fields-to-admin-users
finding_type: scan_finding
name: Restrict write access on system fields to admin users
priority: '4'
resolution_details: To prevent non-admin users from updating system fields on records, set the property "glide.rest.table_api.admin_only_sys_fields" to true.
