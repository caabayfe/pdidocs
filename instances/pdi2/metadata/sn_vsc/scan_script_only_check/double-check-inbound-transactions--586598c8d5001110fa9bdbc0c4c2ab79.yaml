description: Property provides an extra layer of security on form submission / field updates by ensuring only users with the proper permissions are allowed to update a form. If "glide.security.strict.updates" is not set to the recommended value of "true", then updates are not strict meaning they are able to modify fields visible to them regardless of whether they have the appropriate permissions.
