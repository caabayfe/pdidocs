category: security
description: This property performs authentication while retrieving data from tables/pages in the form of unload data on the instance. If "glide.basicauth.required.unl" is not set to the recommended value of "true", then this will disable Basic Authentication for the UNL format export processor. This also could be combined with a wrong role within the guest_user related property, this will lead to unauthenticated access to instance data.
documentation_url: /api/now/v1/context_doc_url/sc-rid:access-control-instance-security-hardening
finding_type: scan_finding
name: Require Authorization for Unload Requests
priority: '2'
resolution_details: Ensure the property "glide.basicauth.required.unl" exists in the sys_properties_table and is set to "true".
