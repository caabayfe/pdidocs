active: 'true'
category: security
description: The Glide Property 'glide.active.session.timeout.invalidate.session' controls if a timed out session is proactively invalidated before the Tomcat container invalidates the session. When this property is not set to 'true', there can be a small interval of time where a timed out session is not invalidated (60+ seconds, depending on queue size). If a session is hijacked, an attacker may be able to utilize a session during this small period of time.
documentation_url: /api/now/v1/context_doc_url/sc-rid:proactively-invaidate-inactive-sessions
finding_type: scan_finding
name: Proactively Invalidate Inactive Sessions
priority: '3'
resolution_details: Ensure the Glide Property 'glide.active.session.timeout.invalidate.session' exists and is set to the value 'true'. If the property does not appear in the sys_properties table, add a new record.
run_condition: new sn_vsc.VSCComplianceUtil().checkIfConfigNeedValidation('v')
score_max: '100'
score_min: '0'
score_scale: '1'
