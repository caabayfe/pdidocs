description: If the property "glide.export.query.enforce_field_acl" is set to "true", field ACLs will be checked against the incoming query, and reject the query if the user is unauthorized. If the property is false, ACLs will NOT be checked against incoming query and will continue to execute. This can result in information disclosure to unauthorized parties.
