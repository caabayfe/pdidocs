category: security
description: This property controls whether join queries are given domain separated conditions or not, in order to ensure they apply domain separation functionality for dot walked fields. If "glide.sys.domain.include_domain_condition_on_join"  is not set to the recommended value of "true" on an instance using domain separation, then sensitive information could be disclosed that is not to be shared with a specific domain. There may be moderate functional impact to the instance if components are reliant on the unsafe cross domain queries. Instances should be tested in subproduction environments before enabling.
documentation_url: /api/now/v1/context_doc_url/sc-rid:apply-domain-separation
finding_type: scan_finding
name: Apply Domain Separation on Dot Walked Fields
priority: '3'
resolution_details: Ensure the property "glide.sys.domain.include_domain_condition_on_join" is set to "true" when the Domain Separation plugin is active.
