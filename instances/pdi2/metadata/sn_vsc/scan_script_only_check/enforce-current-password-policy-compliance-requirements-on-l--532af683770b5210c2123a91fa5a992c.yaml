category: security
description: |-
  If the Glide Property "glide.apply.password_policy.on_login" is not set to the recommended value of "true", interactive users may continue to login to the instance with passwords that do not meet the current requirements set by the admin.

  Interactive users may continue to login to the instance with passwords that do not meet the current requirements set by the admin. This may mean that the users have weak passwords that do not meet up-to-date security requirements for passwords, potentially leading to an increased risk of brute force account logins by a malicious users.
