category: security
description: If the property "glide.ui.attachment.force_download_all_mime_types" is set to true, then the "glide.ui.attachment.download_mime_types" property will be overridden so that all MIME types will be downloaded rather than rendered by the browser. For example, downloading text/html forces an HTML file to be downloaded to the client as a file rather than viewed inline in the browser, preventing a XSS attack. XSS can lead to easily attained privilege escalation to higher roles such as admin where more lateral movement can be taken.
documentation_url: /api/now/v1/context_doc_url/sc-rid:download-mime-types
finding_type: scan_finding
name: Restrict Downloadable MIME Types
priority: '3'
resolution_details: Ensure the property "glide.ui.attachment.force_download_all_mime_types" is set to "true". If the property does not exist in the "sys_properties" table, the default value is "false".
