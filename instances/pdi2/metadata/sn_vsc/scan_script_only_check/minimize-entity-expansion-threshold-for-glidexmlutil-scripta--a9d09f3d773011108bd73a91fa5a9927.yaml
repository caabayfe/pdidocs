active: 'true'
category: security
description: This property controls the maximum amount of entity expansion within an XML Parser. If "glide.xmlutil.max_entity_expansion" is not set to the recommended value of 3000 or less, then the GlideXMLUtil parsing scriptable may be vulnerable to denial of service attacks.
documentation_url: /api/now/v1/context_doc_url/sc-rid:setting-entity-expansion-threshold
finding_type: scan_finding
name: Minimize Entity Expansion Threshold for GlideXMLUtil Scriptable
priority: '3'
resolution_details: |-
  Ensure the property "glide.xmlutil.max_entity_expansion" is set to "3000" or less. 

  If the instance is on Washington or later, the default implied value is 3000 if the sys_properties record does not exist. If the instance is not on Washington or later, the recommendaiton is for the instance admin to create a sys_properties record with name `glide.xmlutil.max_entity_expansion` and the value `3000`.
