description: '"gs.addErrorMessageNoSanitizationMessaging()" and "gs.addInfoMessageNoSanitization()" are used within the scripting environment for logging and notifications. Both of these are available in the sandbox if this property is not set to the recommended value of "false". The sandbox is a low privileged scripting environment available to unauthenticated and no role users. Both of these methods can be used to display unsanitized input to a user. Displaying unsanitized input to the user is dangerous, as unsanitized input may contain dangerous code that runs in the user''s browser. This can be utilized for traditional reflected XSS attacks. Reflected XSS attacks can be used in multiple scenarios, including session hijacking.'
documentation_url: /api/now/v1/context_doc_url/sc-rid:allow-glide-system-user-session-scriptable
finding_type: scan_finding
name: Restrict Access to GlideSystemUserSession Scriptable API
priority: '2'
resolution_details: Ensure the property "glide.sandbox.usersession.allow_unsanitized_messages" is set to "false". If a sys_properties record does not exist for this property, create one.
