description: |-
  The "sn_ext_usr_reg.allowed_email_domains" property defines which email addresses are allowed to self-register to a ServiceNow instance. The format should be a comma separated list of acceptable email domains such as "domain1.com,domain2.com" where emails such as example@domain2.com will be accepted. If "sn_ext_usr_reg.allowed_email_domains" is not set with a list of acceptable domains, then users with any email address are allowed to register accounts on the instances.

  If "sn_ext_usr_reg.allowed_email_domains" is not set with a list of acceptable domains, then users with any email address are allowed to register accounts on the instances.
