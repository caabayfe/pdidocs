category: security
description: The property "sn_g_app_creator.allow_global" controls which users can create applications in the global scope using the Guided Application Creator. If "sn_g_app_creator.allow_global" is set to the recommended value of "false," users need the role "sn_g_app_creator.global" to create an application in the global scope using Guided Application Creator. If "sn_g_app_creator.allow_global" is set to the insecure value of "true" then all users with only the base role "sn_g_app_creator.app_creator" can create an application in the global scope using Guided Application Creator.  Applications in the global scope do not contain scope protections allowing a developer to access greater features and functions beyond a specific scope. Limiting global application development to users with the additional role follows the principle of least privilege.
documentation_url: /api/now/v1/context_doc_url/sc-rid:restrict-global-app-dev-by-role
finding_type: scan_finding
name: Restrict Global App Development by Role
priority: '4'
resolution_details: Ensure the property "sn_g_app_creator.allow_global" is set to "false" or does not appear in the sys_properties table. If the property is not present in the sys_properties table the secure default will be used.
