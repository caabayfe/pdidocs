active: 'true'
category: security
description: |-
  Control whether query ACLs are applied to Glide DB functions using system properties.

  When the glide.db.encoded_query.check_function_field_query_acls system property is set to true, query ACLs (query_range and query_match) are validated by default on these Glide DB functions:

  glidefunction:position
  glidefunction:substring
  glidefunction:concat
  glidefunction:coalesce
  glidefunction:length

  To validate these query ACLS on additional functions, add those functions to the glide.db.encoded_query.force_query_range_on_functions system property.

  If the glide.db.encoded_query.check_function_field_query_acls system property exists and is not set to a value of true, a logged in user may be able to blindly infer data, leading to sensitive information disclosure.
documentation_url: /api/now/v1/context_doc_url/sc-rid:validate-query-acls-on-glide-db-functions
finding_type: scan_finding
name: Validate query ACLs on Glide DB functions
priority: '3'
resolution_details: |-
  Ensure the Glide Property "glide.db.encoded_query.check_function_field_query_acls" doesn't exist, or exists and is set to a value of "true".

  By default the below Glide DB Functions will always perform Query ACL validation:
   - glidefunction:position
   - glidefunction:substring
   - glidefunction:concat 
   - glidefunction:coalesce
   - glidefunction:length

  Instance admins can add additional functions to the property "glide.db.encoded_query.force_query_range_on_functions".
