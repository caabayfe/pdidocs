category: security
description: |-
  If the Glide Property "glide.stax.whitelist_enabled" does not exist in the sys_properties table or is not set to the recommended value of "true", then all external entities are allowed when the Glide Property "glide.stax.allow_entity_resolution" is set to the value of "true".

  If customizations do not require entity expansion, use the "glide.stax.allow_entity_resolution" property to completely disable external entity expansion. The XML completes parsing but doesn't include any internal or external entities.

  -   If you set "glide.stax.allow_entity_resolution" to true, all external entities attempt to resolve or expand subject entities, subject to the setting of the "glide.stax.whitelist_enabled" property.
  -   If you set "glide.stax.allow_entity_resolution" to false, all entity resolution and expansion is blocked. To learn more about this property, see https://www.servicenow.com/docs/csh?topicname=sc-disable-entity-expansion.html&version=latest.

  When "glide.stax.whitelist_enabled" is set to true, define a listing of comma-delimited FQDN in the "glide.xml.entity.whitelist" property, which is the only URLs that can be reached using XML Entity processing property. To learn more, see https://www.servicenow.com/docs/csh?topicname=sc-xml-entity-validation-url-allowlist.html&version=latest.

  An attacker can use this vulnerability to expand data exponentially in an External Entities Expansion (XXE) attack, quickly consuming all system resources.
documentation_url: /api/now/v1/context_doc_url/sc-rid:disable-entity-expansion
finding_type: scan_finding
name: Require XMLdoc2 entity validation with allowlistDisable Entity Expansion
priority: '1'
resolution_details: Ensure the property "glide.stax.whitelist_enabled" is set to "true" when the Glide Property "glide.stax.allow_entity_resolution" is set to the value of "true".
