category: security
description: |-
  The property 'glide.processors.check_access_before_process' enables ACL enforcement for creating or deleting dashboards. When the property is set to "true", access control checks are performed on the dashboards.

  When this property is set to "false", authenticated users can arbitrarily delete and add dashboards.
documentation_url: /api/now/v1/context_doc_url/sc-rid:ensure-dashboards-creation-and-deletion-requires-access-check
finding_type: scan_finding
name: Ensure Dashboards Creation/Deletion Requires Access Check
priority: '3'
resolution_details: Set the glide.processors.check_access_before_process system property to true. If the property does not appear in the System Properties [sys_properties] table, the fallback value is true.
