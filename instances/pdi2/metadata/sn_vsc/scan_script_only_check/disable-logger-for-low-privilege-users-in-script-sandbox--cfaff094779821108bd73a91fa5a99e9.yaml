category: security
description: If "glide.security.sandbox_no_logging" is set to "false", then logging will be available for low priviliged users using sandboxed scripts. With this ability, a low privileged user can inject logs allowing the malicious user to potentially obfuscate an attack. This property controls Glide System's ability to log scripts being executed in the sandbox environment.
documentation_url: /api/now/v1/context_doc_url/sc-rid:no-glide-sec-logger-sandbox
finding_type: scan_finding
name: Disable Logger for Low Privilege Users in Script Sandbox
priority: '4'
resolution_details: Ensure "glide.security.sandbox_no_logging" is set to "true" in order to prevent low privileged users using a sandboxed script to have logging functionality.
