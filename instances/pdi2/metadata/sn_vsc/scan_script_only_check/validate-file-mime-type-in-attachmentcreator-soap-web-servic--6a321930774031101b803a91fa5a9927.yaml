category: security
description: |-
  The "glide.attachment.enforce_security_validation" property determines whether Multipurpose Internet Mail Extensions (MIME) files undergo validation.

  If "glide.attachment.enforce_security_validation" is not set to the recommended value of "true", then there is no validation for attachment MIME-type, enabling malicious files to be uploaded with incorrect file extensions. When this property is set to "true", files are uploaded with the correct file type extension.

  If the property is set to false, there's no validation for MIME files during uploads. This could enable malicious files to be disguised by changing their file extension. It is a security best practice to validate file uploads at least with MIME type validation.
documentation_url: /api/now/v1/context_doc_url/sc-rid:validate-fle-mime-type
