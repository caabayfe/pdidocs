description: The property "glide.report.report_view.read_acl", when set to "enforce", enforces the READ ACL (table level) on reporting functions when there is no Report View ACL on the table/field. If this property is not set to "enforce" then ACLs could be bypassed, leading to potential sensitive information disclosure.
