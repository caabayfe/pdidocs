category: security
description: We flag a security control (like an ACL, or Security Data Filter record) as a finding to bring to your attention. This is because ServiceNow will at times release new security controls that will improve the instance’s security posture, but we don't want to automatically turn these security controls on, to prevent impact to the instance. This allows you to review the security control that was released and test it out before you activate it.
documentation_url: https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB1703437
finding_type: scan_finding
name: Deactivated Security Controls
priority: '2'
resolution_details: Inspect the security control to understand which table it is protecting. Make a decision to activate it, or mute that finding. It is recommended to test in a sub production environment first.
