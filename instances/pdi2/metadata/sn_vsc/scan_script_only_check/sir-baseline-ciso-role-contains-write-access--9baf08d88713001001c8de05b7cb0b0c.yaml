category: security
description: The base system SIR application allows users with the <sn_si.ciso> role to read and edit Security Incident records.  It is a common mis-conception that this role only provides read access to Security Incidents by default, but this is not true.  It may be worth reviewing whether or not senior leadership users require write / edit access to Security Incident records.
documentation_url: /api/now/v1/context_doc_url/CSHelp:components-installed-sir
finding_type: ''
name: SIR - Baseline CISO Role Contains Write Access
priority: '4'
resolution_details: |-
  Discuss whether or not senior leadership users actually require the ability to edit / write to Security Incident records - versus only being able to read Security Incident records.  

  By default, the <sn_si.ciso> role cotains the <sn_si.basic> role, granting the <sn_si.ciso> role read and write access to Security Incident records.  Consider de-coupling the <sn_si.basic> role from <sn_si.ciso> if senior leadership does not require write / edit permissions on Security Incident records.
