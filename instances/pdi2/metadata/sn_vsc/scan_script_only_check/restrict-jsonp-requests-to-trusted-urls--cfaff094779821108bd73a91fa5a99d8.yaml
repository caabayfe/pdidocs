category: security
description: |-
  This property specifies trusted URLs for the angularJS $http service to allow/reject JSONP requests. Property is necessary because this is a potentially breaking change for customers, so they need a way to add their trusted URLs. When this property is set to "true", only URLs defined in the Glide Property "angular.jsonp.inclusion_list.urls" are trusted and allowed.

  If "angular.jsonp.inclusion_list.enabled" is not set to the recommended value of "true", then JSONP requests are allowed to any URL.
documentation_url: /api/now/v1/context_doc_url/sc-rid:jsonp-request-inclusion-list
finding_type: scan_finding
name: Restrict JSONP Requests to Trusted URLs
priority: '3'
resolution_details: Ensure the property "angular.jsonp.inclusion_list.enabled" is set to "true".
