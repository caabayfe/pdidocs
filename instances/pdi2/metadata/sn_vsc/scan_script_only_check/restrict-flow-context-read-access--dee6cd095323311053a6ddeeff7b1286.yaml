description: When the Glide Property 'com.snc.process_flow.reporting.require_flow_access' is set to a value of true, there is an additional access check for a user trying to read a flow context. A user must have access to the parent flow to be able to read the flow context. There may be minor information disclosure if this property is not set securely.
