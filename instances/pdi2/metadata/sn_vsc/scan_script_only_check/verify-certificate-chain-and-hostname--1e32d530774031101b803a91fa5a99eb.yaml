category: security
description: When the Glide Property "com.glide.communications.httpclient.verify_hostname" is not set to the secure value of "true", the hostname and certificate chain presented by remote hosts during a TLS connection initiated from the ServiceNow instance are not validated. This could compromise the security of the TLS connection and allow person-in-the-middle attacks, where communications between two parties are intercepted. This may lead to sensitive data disclosure.
documentation_url: /api/now/v1/context_doc_url/sc-rid:verify-certificate-chain-and-hostname
finding_type: scan_finding
name: Verify Certificate Chain and Hostname
priority: '2'
resolution_details: Ensure com.glide.communications.httpclient.verify_hostname is set to the secure value of 'true'.
