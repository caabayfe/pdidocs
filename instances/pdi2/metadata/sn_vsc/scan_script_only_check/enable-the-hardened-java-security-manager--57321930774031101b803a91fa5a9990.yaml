description: This property contains Java classname of current Java security manager. ServiceNow has standardized on the Contextual Security Manager. If "glide.security.manager" is not set to the recommended value of "com.glide.sys.security.ContextualSecurityManager", then the instance may be using an obsolete Java security manager which is missing expected hardening policies. Without this hardening, it may be possible for a malicious actor with script execution access to achieve remote code execution on the instance.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-the-hardened-java-security-manager
finding_type: scan_finding
name: Enable the Hardened Java Security Manager
priority: '2'
resolution_details: Ensure the property "glide.security.manager" is set to "com.glide.sys.security.ContextualSecurityManager".
