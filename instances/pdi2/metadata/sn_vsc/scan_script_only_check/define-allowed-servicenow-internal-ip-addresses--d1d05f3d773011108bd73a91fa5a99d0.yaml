active: 'true'
category: security
description: |-
  If "glide.ip.authenticate.strict" is set to "true", then internal ServiceNow personelle and systems can only make inbound connections to the instance from essential IP ranges. This limit's ServiceNow's visibility into the instance to essential internal infrastructure, and prevents access by broader ServiceNow personelle such as support and sales staff via corporate networks.

  When set to "true", the "glide.ip.authenticate.allow.secured" property is used to grant internal ServiceNow inbound connections, including regular authenticated access and unauthenticated diagnostic pages. If not set to "true", then a broader ServiceNow internal IP range as defined in "glide.ip.authenticate.allow" is used to grant these internal ServiceNow inbound connections.
documentation_url: /api/now/v1/context_doc_url/sc-rid:strict-ip-restriction
finding_type: scan_finding
name: Define Allowed ServiceNow Internal IP Addresses
priority: '3'
resolution_details: Ensure the property "glide.ip.authenticate.allow.secured" contains only trusted values and that the property "glide.ip.authenticate.strict" is set to "true".
