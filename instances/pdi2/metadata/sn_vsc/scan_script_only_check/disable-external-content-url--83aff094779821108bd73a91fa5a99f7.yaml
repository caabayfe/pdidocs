description: If "glide.ui.url.external.content" is not set to the recommended value of "false", then Connect chat will retrieve external link metadata in order to render richer content in messages with links to Youtube, news articles, images, etc. This could lead to Server Side Request Forgery (SSRF) attacks.
documentation_url: /api/now/v1/context_doc_url/sc-rid:disable-ext-content-url
finding_type: scan_finding
name: Disable External Content URL
priority: '2'
resolution_details: Ensure the Glide Property "glide.ui.url.external.content" exists and is set to the value "false". If the property does not appear in the sys_properties table, add a new record.
