description: This property affects the expiry of the cookie. After each successful authentication, the cookie will expire after the number of days specified as the property value. If "glide.ui.user_cookie.life_span_in_days" is not set to the recommended value of 15 or less, then there is a higher risk that the cookie, if stolen, can be used for longer.
documentation_url: /api/now/v1/context_doc_url/sc-rid:session-window-timeout
