description: If "glide.security.diag_txns_acl" is not set to the recommended value of "true", then All users (authenticated or not) have access to diagnostic pages such as stats.do, xmlstats.do, threads.do and replication.do pages. These endpoints are intended to be used for monitoring instance health. Information exposed by these endpoints may be useful to potential attackers.
