description: This property toggles ACL validation for GlideAjax API calls. If "glide.script.secure.ajaxgliderecord" is not set to the recommended value of "true",  then ACL validation will not be completed for GlideAjax requests. This could lead to server-side resources being accessed by users without proper authorization.
