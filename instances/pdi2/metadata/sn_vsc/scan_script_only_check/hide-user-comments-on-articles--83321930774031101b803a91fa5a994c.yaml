description: When the Glide Property 'glide.knowman.show_user_feedback' is not set to 'never', feedback comments will be visible on knowledge articles to users with the roles defined in the Glide Property 'glide.knowman.show_user_feedback.roles'. Due to the potentially sensitive information in a feedback comment, an instance admin may not want the feedback to be visible. If this property is not set to 'never', there could be confidentiality impacts if sensitive information is disclosed in feedback.
