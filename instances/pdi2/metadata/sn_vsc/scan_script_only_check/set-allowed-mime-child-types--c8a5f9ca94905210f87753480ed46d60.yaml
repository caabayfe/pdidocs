category: security
description: Defines MIME file types whose file extension may not match the data within a uploaded file. This allows such files to bypass the MIME type checking. The property takes in a comma seperated list of file type pairs of the form "application/zip=application/java-archive". In this example, if the property is set to such a value, files with the extension zip which are technically jars are allow to pass the MIME type checking despite the inconsistency. If set improperly, this MIME type checking bypass can lead to the remote code execution of an uploaded file. As such, it should always be set to "" unless a valid use case arrises.
documentation_url: /api/now/v1/context_doc_url/sc-rid:set-allowed-mime-child-types
finding_type: scan_finding
name: Set Allowed MIME Child Types
priority: '3'
resolution_details: Ensure the property "glide.security.mime.type.allowed_child_types" is set to "".
