category: security
description: |-
  When the Glide Property 'glide.translated_html.sanitize_all_fields' is set to the value 'true', all translated_html elements will be sanitized using an HTML sanitizer. When the property is set to 'false', an element will only be sanitized if a dictionary attribute, html_sanitize, is set to true.

  Sanitizing HTML elements is best practice to ensure an attacker cannot embed malicious content that may lead to Cross Site Scripting (XSS) attacks.
