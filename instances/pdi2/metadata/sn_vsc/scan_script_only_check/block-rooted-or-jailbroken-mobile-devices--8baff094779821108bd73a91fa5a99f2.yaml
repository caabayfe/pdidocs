category: security
description: |-
  If "glide.sg.allow_rooted_jailbroken_device" is not set to the recommended value of "false", then the mobile app will allow users to use the app from jailbroken or rooted mobile devices. Jailbroken or rooted mobile devices run untrusted code at the system level that can bypass the platform's security model which our mobile apps rely on. Setting "allow_rooted_jailbroken_device" to "false" enables a limited client-side check to display an error message to the user if attempting to use the app from one of these devices. 

  This configuration maps to MASVS v1.4.2 requirement 8.1 at R-level.
documentation_url: /api/now/v1/context_doc_url/sc-rid:block-rooted-jailbroken-mobile-devices
