category: security
description: When a user is marked for "Password needs reset" they must provide a new password at the next authentication attempt. This property controls whether the password reset is mandatory before making API calls. If "glide.authenticate.api.user.reset_password.mandatory" is not set to the recommended value of "true", then user accounts marked as "Password needs reset" can still perform most common operations by querying the table API through basic authentication. This could allow information disclosure in the event that stale accounts are compromised.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enforce-pw-reset-api-requests
finding_type: scan_finding
name: Enforce Password Reset on API Requests
priority: '2'
resolution_details: Ensure the property "glide.authenticate.api.user.reset_password.mandatory" is set to "true".
