category: security
description: |-
  When communicating with another server, the instance with will negotiate with the server to decide which version of TLS to use and will generally pick the highest version that both support. When the property com.glide.communications.disable.deprecated.tls is set to true, the instance will only negotiate for communication via TLS versions 1.2 and up which is highly recommended. If this property is set to false and the server does not support modern versions of TLS (version 1.2 and up) then data may be transmitted over weak TLS 1 and TLS 1.1 protocol versions.

  Using outdated and unsupported TLS versions could result in loss and leakage of sensitive data.
documentation_url: /api/now/v1/context_doc_url/sc-disable-deprecated-tls-versions
finding_type: scan_finding
name: Disable Deprecated TLS versions
priority: '3'
resolution_details: Ensure com.glide.communications.disable.deprecated.tls is set to true, which is the default value.  If it changed to false, then weak TLS version and ciphers will be used.
