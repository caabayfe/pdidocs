active: 'true'
category: security
description: If "glide.basicauth.required.wsdl" is not set to the recommended value of "true", then this will disable Basic Authentication for WSDL requests. WSDL is a protocol that is used to describe web services such as instance table schemas, and is not a mechanism for sharing the data within tables. Setting this property to "true" allows for disclosure of table schemas to unauthenticated users.
documentation_url: /api/now/v1/context_doc_url/sc-rid:wsdl-request-authorization
finding_type: scan_finding
name: Require Authorization for WSDL Request
priority: '3'
resolution_details: Ensure the property "glide.basicauth.required.wsdl" exists in the sys_properties table and is set to "true".
