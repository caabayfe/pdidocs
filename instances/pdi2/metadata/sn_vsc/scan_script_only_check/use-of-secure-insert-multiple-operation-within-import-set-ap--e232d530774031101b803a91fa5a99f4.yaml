active: 'true'
category: security
description: |-
  This property controls whether GlideRecordSecure or GlideRecord is used for the Insert Multiple operation within Import Set API.

  If this property is set to "false", then GlideRecordSecure will be used to insert records and Table level ACLs will be evaluated.
  If this property is set to "true", then GlideRecord will be used to insert records and Table level ACLs will not be evaluated.

  If this property is not set to the recommended value of "false", then a low privilege user may be able to insert data into tables outside the scope of their privileged roles.
documentation_url: /api/now/v1/context_doc_url/sc-rid:use-of-secure-insert-multiple-oper
finding_type: scan_finding
name: Use of Secure Insert Multiple Operation within Import Set API
priority: '3'
resolution_details: |-
  Ensure that the property "com.glide.import_set_api.insert_multiple_optimize" is set to "false".

  If this property must be set to "true", then you must ensure that the "Import Set API Insert Multiple" REST Endpoint ACL (sys_id: 3101b770ff2211105cf343d0653bf182) is active and also audit user's who have the role "import_transformer".
