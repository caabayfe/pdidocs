category: security
description: The 'glide.security.enable_archive_table_acls' controls if ACLs added to archive tables are evaluated (true) or if only the ACLs of the original table (i.e. the table the archive table was created from) are evaluated (false). There is no reason for this property to not be true since the original table ACLs will be evaluated regardless of its value and since a customer can simply avoid additional ACLs for an archive table by not adding them. However, if the property is set to false, ACLs added to archived tables will be ignored, an action which is counterintuitive and may lead to authorization bypass.
documentation_url: /api/now/v1/context_doc_url/sc-rid:ensure-archive-table-acls-are-checked
finding_type: scan_finding
name: Ensure Archive Table ACLs are Checked
priority: '4'
resolution_details: Ensure the value of  'glide.security.enable_archive_table_acls'  is always true.
