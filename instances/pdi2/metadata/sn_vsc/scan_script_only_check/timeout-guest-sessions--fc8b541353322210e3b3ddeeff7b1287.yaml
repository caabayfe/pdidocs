category: security
description: |-
  Control the inactive session timeout for unauthenticated users with the "glide.guest.session_timeout" system property. Raise the value of this property to extend the period of time your instance persists sessions beyond the default of 30 minutes. Avoid excessively large timeout values, which can increase the number of sessions persisted by the instance, and cause minor availability concerns.

  Large timeout values can increase the number of concurrent sessions on your instance, causing minor availability concerns.
documentation_url: /api/now/v1/context_doc_url/sc-timeout-guest-sessions
finding_type: scan_finding
name: Timeout Guest Sessions
priority: '3'
resolution_details: Ensure the Glide Property 'glide.guest.session_timeout' is set to a default value of 30. It may be desirable to lower this value to 5 in rare cases of availability concerns on the instance.
