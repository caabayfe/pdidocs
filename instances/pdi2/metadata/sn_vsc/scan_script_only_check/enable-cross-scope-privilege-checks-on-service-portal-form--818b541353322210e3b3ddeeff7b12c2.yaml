active: 'true'
category: security
description: |-
  Use a system property to enforce cross scope privilege checks on the Service Portal form widget and prevent unauthorized retrieval of forms and table data between scopes.

  In Yokohama and later releases, queries enforce cross scope privilege checks on the table before reading the given sys_id information.
  When the glide.service_portal.enforce_cross_scope_check_in_form property is set to the recommended value of true, cross scope privilege checks are enforced on the table. When set to false, the cross-scope privilege check isn't enforced.

  A lack of cross scope privilege checks could lead to unauthorized retrieval of forms and table data between scopes.
documentation_url: /api/now/v1/context_doc_url/sc-enable-cross-scope-privilege-checks-on-service-portal-form
finding_type: scan_finding
name: Enable Cross Scope Privilege Checks on Service Portal Form
priority: '4'
resolution_details: Ensure the property "glide.service_portal.enforce_cross_scope_check_in_form" is set to "true" or does not exist in the sys_properties table. If a record does not exist in the sys_properties table, the value is "true".
run_condition: ''
