category: security
description: If "password_reset.captcha.ignore" is not set to the recommended value of "false", then a CAPTCHA challenge-response will not be used during the password reset process. CAPTCHAs help prevent automation attacks by prompting the user for a challenge-response that is not easily answered by automated systems. The CAPTCHA is disabled, an attacker may be more successful during  automated attacks against the password reset feature.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-captcha-pw-reset
finding_type: scan_finding
name: Enable Captcha in Password Reset
priority: '3'
resolution_details: Ensure the property "password_reset.captcha.ignore" is set to "false".
