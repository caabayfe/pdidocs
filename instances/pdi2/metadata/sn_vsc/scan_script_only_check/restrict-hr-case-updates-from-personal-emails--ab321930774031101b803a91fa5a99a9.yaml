description: When the Glide Property 'sn_hr_core.restrict_guest_email' is not set to 'true', a user can send an email from a personal account referencing the HR case to be included in the worknotes. This could result in minor confidentiality or integrity issues if the personal email is compromised or communicating insecurely. An admin may want to restrict the ability of users to respond to HR cases via their personal email, since they cannot be confident of the user accessing the personal email account.
documentation_url: /api/now/v1/context_doc_url/sc-rid:restrict-hr-caze-updates-from-persoal-emails
