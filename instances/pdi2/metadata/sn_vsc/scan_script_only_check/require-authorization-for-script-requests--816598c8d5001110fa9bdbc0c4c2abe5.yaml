category: security
description: This property determines if basic auth is required to invoke a scripted processor. Any records accessed by the scripted processor will still use other access controls, ie ACLs, before returning any data. If "glide.basicauth.required.scriptedprocessor" is not set to the recommended value of "true", then an attacker could access sensitive information such as an unauthenticated (guest) user attempting to access an email through the EmailDisplay sys_processor.
documentation_url: /api/now/v1/context_doc_url/sc-rid:script-request-authorization
finding_type: scan_finding
name: Require Authorization for Script Requests
priority: '2'
resolution_details: Ensure the property "glide.basicauth.required.scriptedprocessor" exists in the sys_properties table and is set to "true".
