category: security
description: This property is meant to be used with the "Limit Concurrent Sessions" plugin. When this plugin is installed and configured, the number of open sessions can be limited per user. When this property is set, the number of sessions will be tracked across all nodes instead of a single application nodes. If this property is not set to true, multiple sessions can be open across multiple nodes, increasing the likelihood of a successful session hijacking.
documentation_url: /api/now/v1/context_doc_url/sc-rid:glide-auth-limit-concurrent-sessions-all-nodes
finding_type: scan_finding
name: Limit Concurrent Sessions Across All Nodes
priority: '4'
resolution_details: Ensure "glide.authenticate.limit.concurrent.sessions.across.all.nodes" is set to "true" when the "com.glide.limit.concurrent.sessions" plugin is active.
