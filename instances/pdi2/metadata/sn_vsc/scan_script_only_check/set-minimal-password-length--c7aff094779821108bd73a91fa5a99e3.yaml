active: 'true'
category: security
description: |-
  If password policies are not enabled and enforcing a minimum password length of at least 12 characters, then a user can create a password with fewer than 12 characters.

  Setting the property to less than a value of 12 could lead to compliance issues and increases the risk of an attacker successfully brute forcing passwords.
documentation_url: /api/now/v1/context_doc_url/sc-rid:set-min-pw-length
finding_type: scan_finding
name: Set Minimal Password Length
priority: '3'
resolution_details: |-
  For every Password Credential Store in use on the instance, ensure that a Password Policy is being enforced, and that the Password Policy mandates a minimum password length of at least 12 characters.

  For every utilized Password Credential Store (the `pwd_cred_store` table), ensure that "Enable password policy" is checked on the record. Next, navigate to the Password Policy (`password_policy`) record referenced in the Password Credential Store record "Password policy" field. Ensure that the "Minimum Password Length" field is set to at least 12.

  Further instructions on configuring a password policy can be in the documentation: https://www.servicenow.com/docs/csh?topicname=enable-password-policies.html&version=latest.
run_condition: ''
score_max: '100'
