description: This property controls the number of minutes a user must wait to start a reset request after the last successful unlock account. If "password_reset.request.unlock_window" is not set to the recommended value of "1440" or more, it increases the opportunity for a malicious actor from brute forcing the user's password using automated tools.
documentation_url: /api/now/v1/context_doc_url/sc-rid-reset-pw-request-unlock-window
finding_type: scan_finding
name: Maximize Reset Password Request Unlock Window Duration
priority: '3'
resolution_details: Ensure the property "password_reset.request.unlock_window" is set to a value of "1440" or greater.
