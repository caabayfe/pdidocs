category: security
description: This property allows a customer to turn on or off interpolation protection specifically for nested Jelly expressions. Interpolation protection ensures that when Jelly expressions are used in JavaScript, they must be deemed safe by either falling under certain categories OR being marked as SAFE in the expression itself. This property was added to protect against possibly dangerous Jelly expressions which are nested in another Jelly expression.If "glide.ui.jelly.js_interpolation.protect_nested_expressions" is not set to the recommended value of "true", then Interpolated jelly experession may result in a malicious actor sending a crafted GET parameter to a Jelly page and cause the contents of that parameter to be evaluated as server-side JavaScript with admin privileges.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-jelly-js-interpolation-protection-nested-expressions
finding_type: scan_finding
name: Enable Jelly JS Interpolation Protection for Nested Expressions
priority: '1'
resolution_details: Ensure the Glide Property 'glide.ui.jelly.js_interpolation.protect_nested_expressions' exists and is set to the value 'true'. If the property does not appear in the sys_properties table, add a new record.
