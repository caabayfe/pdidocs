category: security
description: The MID Server Property 'alias_filtering_behavior' defines the behavior of Discovery aliases. When the behavior is not 'strict', then all credentials are used regardless of their aliases for Discovery schedules. This behavior might not be desirable in some circumstances, particularly for credentials with elevated privileges. Credential aliases provide more control over which credentials a Discovery schedule is allowed to use and prevents the unnecessary exposure of credentials with elevated privileges.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enforce-credential-alias
finding_type: scan_finding
name: Enforce Credential Alias Usage
priority: '4'
resolution_details: |-
  Set the MID Server Property 'alias_filtering_behavior' to the value 'strict'. 

  See https://docs.servicenow.com/bundle/tokyo-servicenow-platform/page/product/mid-server/reference/r_MIDServerProperties.html for instructions on creating/setting MID Server Properties.
