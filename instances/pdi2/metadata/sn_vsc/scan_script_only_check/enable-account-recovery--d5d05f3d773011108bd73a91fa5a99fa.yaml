description: This property controls the account recovery feature which binds the ability to bypass single sign-on to specifically designated administrators. If "glide.sso.acr.enabled" is not set to the recommended value of "true", then the local interactive log-ins (username or password based) will be remain enabled when single sign-on is enabled on the instance. Eliminating local interactive log-ins reduces the potential for unauthorized access to the instance.
documentation_url: /api/now/v1/context_doc_url/sc-rid:account-recovery
finding_type: scan_finding
name: Enable Account Recovery
priority: '3'
resolution_details: Ensure the property "glide.sso.acr.enabled" is set to "true".
