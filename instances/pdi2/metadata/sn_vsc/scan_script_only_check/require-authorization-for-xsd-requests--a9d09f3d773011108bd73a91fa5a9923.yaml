category: security
description: The glide property "glide.basicauth.required.xsd" controls whether authentication is required in order to make a XSD request to an instance. If "glide.basicauth.required.xsd" is not set to the recommended value of "true", then authentication is disabled for XSD requests on the instance. It allows unauthenticated access to XSD processor leaking sensitive information.
documentation_url: /api/now/v1/context_doc_url/sc-rid:xsd-request-authorization
finding_type: scan_finding
name: Require Authorization for XSD Requests
priority: '3'
resolution_details: Ensure the property "glide.basicauth.required.xsd" exists in the sys_properties table and is set to "true".
