description: HTML Sanitization is controlled using multiple configuration options within the instance. HTML Sanitization is enabled for HTML fields using the 'glide.html.sanitize_all_fields' and 'glide.translated_html.sanitize_all_fields' fields; however, individual fields can turn off sanitization. It is recommended that HTML fields where sanitization is disabled be reviewed to confirm whether this configuration is necessary.
