category: security
description: |-
  Reduce the risk of cookie/session-related hijacking of web apps using a system property.

  If glide.http.headers_config.enabled isn't set to true, then response header configurations defined in the HTTP Response Headers [sys_response_header] table aren't used. Security related HTTP response headers include Content Security Policy, which aids in XSS-related protections. For details on HTTP response headers, see HTTP Response Headers (https://www.servicenow.com/docs/csh?topicname=http-response-header.html&version=latest).

  The security risks of missing or incorrect, weak HTTP response headers may allow for XSS, CSRF and cookie/session related hijacking of web apps.
documentation_url: /api/now/v1/context_doc_url/sc-rid:sc-enable-http-response-headers-configuration
finding_type: scan_finding
name: Enable HTTP response headers configuration
priority: '3'
resolution_details: Ensure the property glide.http.headers_config.enabled is set to true.
