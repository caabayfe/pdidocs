category: security
description: If "glide.basicauth.required.excel" is not set to the recommended value of "true", then this will disable Basic Authentication for EXCEL format export processor. This also happens when combined with a wrong role within the guest_user related property (For example a high privileged user such as Admin). This will lead to unauthenticated access to instance data.
