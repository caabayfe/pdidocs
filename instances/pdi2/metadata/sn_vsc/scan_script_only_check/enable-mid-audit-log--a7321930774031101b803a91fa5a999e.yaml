category: security
description: |-
  The MID Server command audit log records details such as the command name, command hash, name of credential used and execution status. Once enabled, audit logs can be viewed users with the role agent_security_admin in the ecc_agent_command_audit_log table or by navigating to MID Server > Command Audit Logs.

  In the event of a security investigation, this table can be by incident response teams to audit the commands run on the MID server. Without this log there might not be sufficient details to respond to situations such as unauthorized account use.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-mid-audit-log
finding_type: scan_finding
name: Enable MID Audit Log
priority: '4'
resolution_details: |-
  Set mid.log.command_audit.enable to "true" in the ecc_agent_property table to turn on auditing for commands run by the MID server. 

  See the following documentation for editng this mid server property: https://docs.servicenow.com/csh?topicname=mid-audit-log.html&version=latest
