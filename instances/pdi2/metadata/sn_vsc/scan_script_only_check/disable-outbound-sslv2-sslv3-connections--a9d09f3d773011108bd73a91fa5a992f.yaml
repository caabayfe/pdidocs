name: Disable Outbound SSLv2/SSLv3 Connections
priority: '3'
resolution_details: Ensure the Glide Property 'glide.outbound.sslv3.disabled' exists and is set to the value 'true'. If the property does not appear in the sys_properties table, add a new record.
