description: This property controls the desired transport encryption protocol. If "glide.glide.outbound.sslv3.disabled" is not set to the recommended value of "true", then outbound MID server connections such as REST and SOAP requests will use SSL as the transport protocol. SSL was proven to be insecure in 2014.
documentation_url: /api/now/v1/context_doc_url/sc-rid:disabling-sslv2-sslv3
