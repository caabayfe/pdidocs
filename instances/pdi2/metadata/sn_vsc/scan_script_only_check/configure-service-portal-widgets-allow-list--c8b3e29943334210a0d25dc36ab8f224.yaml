category: security
description: The Glide Property 'glide.service_portal.widget.allow_list' determines the list of widgets that are allowed to attempt to access any table on the instance. ACLs for those tables will still be enforced. If there are misconfigured empty ACLs on tables on the instance, widgets in this list may allow access to those tables, leading to information disclosure. This property is only enforced if the widget makes use of SNCACLWidgetUtil, and the Glide Property 'glide.service_portal.widget.enforce_public_check' is set to 'true'.
documentation_url: /api/now/v1/context_doc_url/sc-rid:configure-service-portal-wid-allowlist
