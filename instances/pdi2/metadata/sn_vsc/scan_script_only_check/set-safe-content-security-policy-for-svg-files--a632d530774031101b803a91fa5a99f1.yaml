category: security
description: This property adds "script-src none" to the Content-Security-Policy header when SVGs are accessed via the ".iix" file extension, which prevents the exploitation of stored XSS from crafted file attachments stored within the instance. Without this policy, a malicious actor could trick a user into running arbitrary JavaScript code in their web browser leading to consequences such as data exfiltration or session takeover.
documentation_url: /api/now/v1/context_doc_url/sc-rid:set-safe-content
finding_type: scan_finding
name: Set Safe Content Security Policy for SVG Files
priority: '2'
resolution_details: Ensure that the property "com.glide.csp.self_script_src_svg" is set to "true".
