description: This property makes sure that Client-Callable Script Includes, also known as Ajax Script Includes, are not automatically made available to non-authenticated users. If "glide.script.ccsi.ispublic" is not set to the recommended value of "False", then it will allow Script Includes to be run as public scripts and allow unauthenticated users access to instance data.
documentation_url: /api/now/v1/context_doc_url/sc-rid:privacy-on-client-callable-script-includes
finding_type: scan_finding
name: Require Authentication by Default for Client-Callable Script Includes
priority: '2'
resolution_details: Ensure the property "glide.script.ccsi.ispublic" is set to "false".
