description: If "glide.security.strict.user_image_upload" is not set to the recommended value of "true", then ACLs are not enforced on image uploads to the Photo field. When the property is set to true, the table ACLs are enforced when uploading photos, only allowing authorized users to upload an image. This prevents an unauthorized user uploading an image to another user's profile.
