category: security
description: |-
  The property `glide.authenticate.multifactor.setup.bypass.count` dictates the number of times a user can skip the multifactor passcode setup requirement.

  Multifactor authentication protects against password-related attacks or weak passwords by requiring an additional form of verification. A high number of allowed multifactor setup bypasses increases the risk of account compromise as the account is not protected by multifactor. A small number of allowed bypasses reduces this window of time.
documentation_url: /api/now/v1/context_doc_url/sc-reduce-allowed-bypasses-for-multifactor-setup
finding_type: scan_finding
name: Reduce Allowed Bypasses for Multifactor Setup
priority: '4'
resolution_details: Ensure `glide.authenticate.multifactor.setup.bypass.count` is set to 0.
