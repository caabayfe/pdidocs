category: security
description: This property is meant to be used with the Limit Concurrent Sessions (com.glide.limit.concurrent.sessions) plugin. When the plugin is active and the property is set to "false", a user can have any number of concurrent interactive sessions on an instance. A greater number of open sessions means there is a great possibility for session hijacking to occur.
documentation_url: /api/now/v1/context_doc_url/sc-rid:glide-auth-limit-concurrent-interactive-sessions
finding_type: scan_finding
name: Limit Concurrent Interactive Sessions with Limit Concurrent Sessions Plugin
priority: '4'
resolution_details: Ensure the property "glide.authenticate.limit.concurrent.interactive.sessions" is set to "true" when the "com.glide.limit.concurrent.sessions" plugin is active.
