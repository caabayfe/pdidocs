category: security
description: This property enables certificate based authentication, a type of mutual authentication, for inbound connections to REST and SOAP APIs in the Now platform. Mutual authentication establishes trust between server and client by exchanging Secure Sockets Layer (SSL) certificates and validating the certificate with a trusted Certificate Authority (CA). This allows verification that a trusted source is connecting to the Now platform. Without this setting the instance is at risk person-in-the-middle, replay or spoofing attacks.
documentation_url: /api/now/v1/context_doc_url/sc-rid:certificate-based-authentication
finding_type: scan_finding
name: Certificate Based Authentication Not Enforced
priority: '3'
resolution_details: |-
  Enable mutual authentication for inbound web services. For first time set-up install the Certificate-based authentication plugin (com.glide.auth.mutual) for the Now platform and follow set up instructions. Ensure the property "glide.authenticate.mutual.enabled" is set to "true" to activate the plugin functionality. 

  Documentation and set-up instructions can be found here: https://docs.servicenow.com/csh?topicname=set-up-mutual-auth.html&version=latest.
