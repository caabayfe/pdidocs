category: security
description: |-
  Set glide.ui.escape_html_list_field to true to prevent HTML from being rendered in HTML fields in list view. Leaving HTML sanitization inactive platform wide (via system property) or by field (via a schema attribute), may lead to XSS style attacks. XSS attacks may allow a low privileged user to hijack the session of a high privileged user or interfere in standard web application behaviors, including redirects or defacement.

  When HTML sanitization is disabled platform wide (via Glide Properties) or per field (schema attribute), this may lead to XSS style attacks if low privileged users have access to write to an HTML field. XSS attacks may allow a low privileged user to hijack the session of a high privileged user or interfere in standard web application behaviors (redirects or defacement).
documentation_url: /api/now/v1/context_doc_url/sc-rid:escape-html
finding_type: scan_finding
name: Escape HTML in List Views
priority: '4'
resolution_details: Ensure the property "glide.ui.escape_html_list_field" is set to "true".
