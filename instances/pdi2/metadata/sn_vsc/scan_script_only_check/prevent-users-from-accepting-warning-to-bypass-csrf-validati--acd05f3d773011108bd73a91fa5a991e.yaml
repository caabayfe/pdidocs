active: 'true'
category: security
description: |-
  Use the `glide.security.csrf.strict.validation.mode`{.parmname} property to enable CSRF token strict validation. If the CSRF token doesn't match, it prevents resubmission of the request.

  The `glide.security.csrf.strict.validation.mode`{.parmname} property enables CSRF token strict validation which prevents the reuse of CSRF tokens. If this property is not set to the recommended value of true, then CSRF tokens could be reused which opens a door to CSRF attacks.
  To enforce strict validation of CSRF token, and prevents its reuse.

  Cross site Request Forgery is a significant security risk that violates the integrity of the instance data. An attacker can launch the CSRF attack on any instance user by abusing the trust of the instance user. With the help of social engineering attacks, a user can submit a malformed request to the instance on behalf of the attacker.
documentation_url: /api/now/v1/context_doc_url/sc-csrf-strict-validation
finding_type: scan_finding
name: Prevent Users From Accepting Warning To Bypass CSRF Validation
priority: '4'
resolution_details: Ensure the property "glide.security.csrf.strict.validation.mode" is set to "true". When this property does not exist, the default value is "true" starting in Xanadu.
