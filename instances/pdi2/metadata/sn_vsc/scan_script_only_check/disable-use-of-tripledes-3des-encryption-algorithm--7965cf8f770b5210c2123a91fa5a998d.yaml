active: 'true'
category: security
description: |-
  If glide.security.3des.encryption.allow is set to true to allow use of insecure, legacy, deprecated 3DES encryption, then this may lead to loss and leakage of sensitive information.

  More modern name for 3DES, is Triple-DES or TDES. Triple-DES is banned for encryption in federal systems. NIST withdrew SP 800-67 Rev. 2 on Jan 1, 2024. Going forward, TDES can only be used for historical purposes, such as decrypting old messages, key unwrapping, and MAC verification.

  Usage of outdated and weak encryption like 3DES may lead to loss and leakage of sensitive information.
documentation_url: /api/now/v1/context_doc_url/sc-disable-use-of-tripledes-3des-encryption-algorithm
finding_type: scan_finding
name: Disable Use of TripleDES/3DES Encryption Algorithm
priority: '3'
resolution_details: |-
  Ensure glide.security.3des.encryption.allow is set to false to disallow use of insecure 3DES encryption.

  Review KB1704481 (https://support.servicenow.com/kb?id=kb_article_view&sys_kb_id=78789f8347019a50f64de825126d43ad) for further information on setting this property
