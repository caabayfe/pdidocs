description: When the Glide Property 'glide.authenticate.session_access.log_audit_event' is set to 'true', session audit events will be created in the sys_session_access_audit table. It is best practice to log information about who accessed a session to assist in malicious actor investigations. Information logged will include user, session ID (non-sensitive), IP address, roles, and policies.
documentation_url: /api/now/v1/context_doc_url/sc-rid:log-session-audit
