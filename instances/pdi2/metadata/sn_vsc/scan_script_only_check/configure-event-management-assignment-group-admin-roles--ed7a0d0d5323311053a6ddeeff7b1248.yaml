category: security
description: The Glide Property 'evt_mgmt.connector_assignment_group_admin_roles' contains  comma separated string signifying the role names that have admin access over the assignment group field in connector instances. Changing the default roles in this list may open up unauthorized users to altering event integrations on the instance.
documentation_url: /api/now/v1/context_doc_url/sc-rid:configure-event-management-assignment
finding_type: scan_finding
name: Configure Event Management Assignment Group Admin Roles
priority: '4'
resolution_details: |-
  Set the Glide Property 'evt_mgmt.connector_assignment_group_admin_roles' to the value 'admin,evt_mgmt_admin,sn_sow_srm.srm_admin'. 

  Review any additional role values in this property to ensure that role warrants this access as described in the description.
