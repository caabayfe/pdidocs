active: 'true'
category: security
description: |-
  This configuration will enforce max lifespan on active HTTP sessions irrespective of inactive timeout. The configured value is in minutes and the value of zero will disable timing out the active sessions. This particular property is limited to UI session timeout.

  A larger maximum lifespan could allow an attacker to remain in a stolen session longer, increasing the possibility of a security incident.
documentation_url: /api/now/v1/context_doc_url/sc-rid:limit-ui-active-session-life-span
finding_type: scan_finding
name: Limit UI Active Session Life Span
priority: '3'
resolution_details: Set the Glide Property 'glide.ui.active.session.life_span' to a value greater than 0 and less than or equal to 720.
run_condition: new sn_vsc.VSCComplianceUtil().checkIfConfigNeedValidation('v');
score_max: '100'
score_min: '0'
score_scale: '1'
