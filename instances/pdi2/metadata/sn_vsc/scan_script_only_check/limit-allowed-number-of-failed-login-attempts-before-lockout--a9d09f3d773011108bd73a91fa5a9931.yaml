active: 'true'
category: security
description: |-
  The "SNC User Lockout Check" or "SNC User Lockout Check with Auto Unlock" script actions enable the administrator to manage the number of failed login attempts for a user. Two script actions are available that enable a site administrator to manage the number of times a user can provide correct password before getting locked out from the Now Platform. 

  Additionally, the "glide.user.max_unlock_attempts" property controls the number of allowed failed login attempts. If the value of "glide.user.max_unlock_attempts" is increased above the recommended value of "5", it will increase the number of login attempts an attacker could make against a given user.
documentation_url: /api/now/v1/context_doc_url/sc-rid:managing-failed-login-attempts
finding_type: scan_finding
name: Limit Allowed Number of Failed Login Attempts Before Lockout
priority: '2'
resolution_details: |-
  Ensure at least one of the script actions: "SNC User Lockout Check" or "SNC User Lockout Check with Auto Unlock" are enabled to manage failed login attempts. These script actions are stored in the "sysevent_script_action" table.

  Additionally, ensure the property "glide.user.max_unlock_attempts" is set to "5" or less.
