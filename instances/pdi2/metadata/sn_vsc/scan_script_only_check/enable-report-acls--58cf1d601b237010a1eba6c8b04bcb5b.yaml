category: security
description: ServiceNow administrators need to enable Report View ACLs to ensure data remains secure. Report View ACLs provide control around who can view reports protected by the Report View ACL. If Report View ACLs are left disabled, users may have access to report data that they should not.
documentation_url: https://support.servicenow.com/kb?id=kb_article_view&sys_kb_id=8f85bf691b9f74989f20ece7624bcb8b
finding_type: scan_finding
name: Enable Report ACLs
priority: '4'
resolution_details: |-
  ServiceNow has provided the ACL Assessment for Reports application to scan your instance and product an inventory of reports and users that will be affected when the Report View ACLs are enabled. 
  Install the ACL Assessment for Reports application from the ServiceNow store. Security Admin Role is required. 
