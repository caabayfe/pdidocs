category: security
description: |-
  The glide property glide.zta.high_assurance.session.max.login.failed_attempts represents the maximum number of failed authentication attempts are allowed before the user is logged out when reauthenticating through Continuous Authentication.

  A high number of allowed authentication attempts increases the likelihood of a brute force attack.
documentation_url: /api/now/v1/context_doc_url/sc-minimize-failed-login-attempts-for-high-assurance-sessions
finding_type: scan_finding
name: Minimize Failed Login Attempts for High Assurance Sessions
priority: '4'
resolution_details: Review the glide property glide.zta.high_assurance.session.max.login.failed_attempts and ensure it is set to small value, such as the default of 5.
