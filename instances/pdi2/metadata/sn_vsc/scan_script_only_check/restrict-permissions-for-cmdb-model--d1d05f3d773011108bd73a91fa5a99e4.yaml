description: This property is an additional access control to the CMDB model. If "csm_cmdb_model.customer_visible_flag" is not set to the recommended value of "true", then any user with the sn_esm_user role and out of the box ACLs will have permissions to the CMDB model.  Note that this role tends to be granted to external users. External users could unwillingly be given permissions to the CMDB model.
