description: An out of band verifier is an alternate delivery method for a one time code for situations such as a need to reset an multifactor token. If this method is enabled by administrators in the Service Now Multifactor plugin, this allows a one-time code to be delivered via email.  If used, one-time out of band verifiers should expire after 10 minutes to limit the validty window. A larger time window allows more time for the code to be compromised such as through phishing, social engineering or shoulder surfing attacks which could lead to bypass of multi factor authentication and unauthorized access to the account.
