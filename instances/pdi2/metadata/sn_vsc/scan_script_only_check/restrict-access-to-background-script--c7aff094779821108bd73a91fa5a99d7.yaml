description: This property holds the required role to access Script Background module. If "glide.script_processor.admin" is not set to the recommended and default value of "admin", then users having a lower privileged role will be able to run background scripts on the instance. This will lead to a complete bypass of the ACL system allowing full access to tables.
documentation_url: /api/now/v1/context_doc_url/sc-rid:restrict-access-background-script
finding_type: scan_finding
name: Restrict Access to Background Script
priority: '2'
resolution_details: Ensure the property "glide.script_processor.admin" is set to the "admin". This is the default value on instances.
