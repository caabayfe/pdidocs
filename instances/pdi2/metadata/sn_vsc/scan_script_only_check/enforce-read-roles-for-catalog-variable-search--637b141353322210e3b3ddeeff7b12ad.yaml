category: security
description: |-
  Use system properties to ensure that only catalog variables with an empty read role are indexed for search.

  When the property glide.ais.ingestion.ignore_catalog_variables_read_roles is set to the recommended value of false, only catalog variables with an empty read role are indexed for search. If this property is set to true then all variables are indexed for search regardless of any read roles specified on the variable.

  Users will be able to search for variables that they do not have read roles to access to causing information disclosure.
documentation_url: /api/now/v1/context_doc_url/sc-enforce-read-roles-for-catalog-variable-search
finding_type: scan_finding
name: Enforce Read Roles for Catalog Variable Search
priority: '4'
resolution_details: Ensure the property "glide.ais.ingestion.ignore_catalog_variables_read_roles" does not exist in the sys_properties table or exists and is set to "false".
