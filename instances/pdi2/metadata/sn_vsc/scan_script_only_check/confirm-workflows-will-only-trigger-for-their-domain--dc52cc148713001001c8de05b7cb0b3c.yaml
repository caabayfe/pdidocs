active: 'false'
category: security
description: |-
  Ensure that all Workflows are linked to a domain.  This will ensure each domain has it's own processes.

  https://docs.servicenow.com/csh?topicname=c_WorkflowsAndDomainSeparation.html
documentation_url: /api/now/v1/context_doc_url/CSHelp:workflows-domain-separation
finding_type: ''
name: Confirm Workflows will only trigger for their domain
priority: '3'
resolution_details: |-
  MSP instances are normally to allow separation of data and processes.

  Having Workflows in different domains will ensure that each domain can define their own business processes.

  Associating an Workflow with a domain is not sufficient you require the domain to be specified in the Condition or the Workflow Version.
run_condition: GlidePluginManager.isActive('com.glide.domain.msp_extensions.installer')
