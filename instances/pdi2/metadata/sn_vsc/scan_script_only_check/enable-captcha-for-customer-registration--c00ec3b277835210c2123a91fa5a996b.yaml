description: |-
  The property  "sn_customerservice.captchaEnabled" determines if captcha validation is enabled or disabled for customer registration on the Customer Service Management Portal.

  Captcha validation is considered a best practice to prevent potentially malicious bots from automatically submitting requests against an application.
documentation_url: /api/now/v1/context_doc_url/sc-enable-captcha-for-customer-registration
finding_type: scan_finding
name: Enable Captcha for Customer Registration
priority: '4'
resolution_details: Ensure the property "sn_customerservice.captchaEnabled" is set to "true". If the property is not in the "sys_properties" table, the default value is "true".
