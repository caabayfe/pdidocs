active: 'true'
category: security
description: |-
  The property "glide.authenticate.multifactor.email.otp.enabled" controls if a token for the second authentication factor can be sent via email.  Email is considered a weak MFA factor which an attacker is more likely to gain access into for defeating MFA. By setting this property to "false", the risk of an attacker successfully bypassing MFA when they have the user's password is reduced.

  If the property is false:
  1) The user will not see email OTP option on the MFA validation screen.
  If the property is true:
  1) The email factor is shown in cases where the email factor policy is inactive and no other 2fa registered.
  2) The email factor is shown if the email factor policy is active and evaluated to true.
  3) The email factor is not shown if the email factor policy is active and evaluated to false.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-email-otp-mfa
