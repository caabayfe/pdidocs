active: 'true'
category: security
description: |-
  The Impact Workspace module allows HTML in the following description fields: 
  - The customer_notes field of the sn_impact_common_capabilities_map and sn_impact_common_par_version_phase_app_mapping tables.
  - The manual_description field of the sn_impact_common_manual_capability_description table.
  When this system property contains a comma-separated list of HTML tags (for example, scripts), those tags and their contents are removed from the HTML portions of the listed fields. This helps sanitize the HTML in the description fields by removing HTML tags that are sources of HTML injection attacks. If this property is not set in the System Properties [sys_properties] table, the value defaults to a default list of denied HTML tags. If the property is empty, all HTML tags are allowed.

  If a HTML tag is removed from the default list it may increase the likelihood that these description fields are sources of HTML injection attacks. As such, at the very least, its value should contain the contents of the default list. Any additions will be dependent on the customer instance.
documentation_url: /api/now/v1/context_doc_url/sanitize-html-in-the-description-fields-of-the-impact-workspace-module
finding_type: scan_finding
name: Sanitize HTML in the Description Fields of the Impact Workspace Module
priority: '3'
resolution_details: Use the sn_impact_common.blacklist_tags_HTML_injection provide a comma-separated list of HTML tags which are removed from the description fields for the Impact Workspace module. This removal helps to prevent HTML injection attacks. At minimum, this list should contain the contents of the default list. If the property is not set in the System Properties [sys_properties] table, it defaults to the list script,iframe,object,embed,form,onerror,onload,style,img,video,audio,source,button.
