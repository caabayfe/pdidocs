category: security
description: When the Glide Property `glide.sys.permissive.impersonate` is set to a value of  `false`, only users with the `admin` role may impersonate. When this value is set to `true`, users may be able to make use of application components that expose impersonation APIs to impersonate a higher privileged user. This may result in unauthorized resource access if these application components are misconfigured.
documentation_url: /api/now/v1/context_doc_url/sc-rid:restrict-impersonation-to-admin
finding_type: scan_finding
name: Restrict Impersonation to Admin
priority: '3'
resolution_details: Ensure the Glide Property `glide.sys.permissive.impersonate` is set to a value of `false`. If this property does not exist, the default value is `false`. This value is safe-overridable. If the property is set to `false`, it cannot be changed going forward.
