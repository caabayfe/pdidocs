category: security
description: |-
  Disables support for embedding HTML code created using the [code] tag. If "glide.ui.security.allow_codetag" is not set to the value of "false", then rendered HTML in journal fields and forms will not be displayed. Setting "glide.ui.security.allow_codetag" to "true" with display embedded HTML code with may lead to cross-site scripting (XSS) attacks, though the risk is significantly reduced when "glide.ui.security.codetag.allow_script" is set to "false".

  Input validation must occur in the application to defend against cross-site scripting attacks. These attacks enable foreign scripts to execute on a user session in the logged in browser's context. Attackers can use it to steal session information and sensitive data. 

  The HTML language was not designed to separate script from formatting, so allowing user-controlled HTML in any system has inherent risk. The likelihood of vulnerability through a codetag is significantly reduced when "glide.ui.security.codetag.allow_script" is compliant, however some small risk remains. Disabling only the script portion of a codetag relies of sanitizing all known conventions of script in the HTML. The property "glide.ui.security.allow_codetag" will disable HTML code tags entirely.  While unlikely, if a new sanitization bypass was discovered, this control provides deeper mitigation by eliminating the functionality at the root of the risk.
documentation_url: /api/now/v1/context_doc_url/sc-rid:allow-embedded-html-code
