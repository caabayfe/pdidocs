category: security
description: |-
  This property escapes all the JS and HTML strings included in <j:jelly> ... </j:jelly> before they are written to the output stream, preventing several XSS issues from occurring. If "glide.ui.escape_all_script" is not set to the recommended value of "true", then escaping of scripts injected into Jelly is disabled.

  Without this mitigation, the platform becomes widely open to a variety of script injection attacks. An attacker could execute arbitrary Rhino scripts on the instance.
documentation_url: /api/now/v1/context_doc_url/sc-rid:escape-jelly
finding_type: scan_finding
name: Escape Jelly Script
priority: '2'
resolution_details: Ensure the property "glide.ui.escape_all_script" is set to "true".
