category: security
description: |-
  This property "com.glide.attachment.max_size" controls the maximum size of uploaded attachment. If "com.glide.attachment.max_size" is not set to the recommended value of 1024 or less, then the platform can accept large files that could fill up storage or cause a denial of service.

  Note: a real attachment size is calculated through multiplication 1024*1024*value of property "com.glide.attachment.max_size". 
  If the value of property "com.glide.attachment.max_size" is 1024 then the max allowed attachment size is 1Gb.
documentation_url: /api/now/v1/context_doc_url/sc-rid:max-allowed-attachment-size
finding_type: scan_finding
name: Minimize Allowed Attachment Size
priority: '3'
resolution_details: Ensure the property "com.glide.attachment.max_size" is set to "1024" or less.
