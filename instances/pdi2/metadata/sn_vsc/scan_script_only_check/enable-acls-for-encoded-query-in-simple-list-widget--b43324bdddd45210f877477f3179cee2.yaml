category: security
description: When the Glide Property "glide.service_portal.enable_acls_for_encoded_query_in_list" is not set to "true", a user may be able to bypass ACLs evaluation on a query condition in Simple List Widget. It is best practice to evaluate ACLs within queries to ensure a user has access to the fields being queried to prevent uanuthorized data leakage.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-acls-for-encoded-query-in-simple-list-widget
finding_type: scan_finding
name: Enable ACLs for Encoded Query in Simple List Widget
priority: '3'
resolution_details: Ensure the Glide Property "glide.service_portal.enable_acls_for_encoded_query_in_list" is set to "true". If the property does not exist in the "sys_properties" table, the default value is "true".
