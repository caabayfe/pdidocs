description: If "glide.cookies.http_only" is not set to the recommended value of "true", then the instance does not require the HTTPOnly attribute for sensitive cookies. The HTTPOnly attribute is used to prevent attacks, such as cross-site scripting, because it doesn't allow access to the cookie using a client-side script, such as JavaScript.
