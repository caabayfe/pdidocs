category: security
description: |-
  This property performs this authentication while importing data sources into the instance tables/pages.
  It restricts any guest users who are currently accessing this data. If "glide.basicauth.required.importprocessor" is not set to the recommended value of "true", then unauthenticated users could access import processor. Additional access controls, ie ACLs, are still enforced, but this value allows a guest user import request to be processed and not summarily denied.
documentation_url: /api/now/v1/context_doc_url/sc-rid:import-request-auth
finding_type: scan_finding
name: Require Authorization for Import Requests
priority: '3'
resolution_details: Ensure the property "glide.basicauth.required.importprocessor" exists in the sys_properties table and is set to "true".
