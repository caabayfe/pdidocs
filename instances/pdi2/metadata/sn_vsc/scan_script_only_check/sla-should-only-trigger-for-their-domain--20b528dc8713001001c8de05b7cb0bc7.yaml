category: security
description: Ensure that all SLA's are linked to a domain.  This will ensure each domain has it's own processes.
documentation_url: /api/now/v1/context_doc_url/CSHelp:domain-separation-sla
finding_type: ''
name: SLA should only trigger for their domain
priority: '3'
resolution_details: |-
  MSP instances are normally to allow separation of data and processes.

  Having SLA's in different domains will ensure that each domain can define their own schedule and SLA duration.

  Associating an SLA with a domain is not sufficient you require the domain to be specified in the Start Condition.
run_condition: GlidePluginManager.isActive('com.glide.domain.msp_extensions.installer')
