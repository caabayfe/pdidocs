category: security
description: The property 'glide.authenticate.session_access.mobile.refresh_token_interval' governs the length of time after which a mobile device user will be forced to re-authenticate. This only applies if the admin has configured the Identity Provider attributes (which can vary for each login) in the session access policy and the user authenticates via Single Sign On . The property value is an integer in seconds. The recommended value is 1800 (30 minutes). A large value may grant a larger timeframe for session access to be hijacked by an attacker.
documentation_url: /api/now/v1/context_doc_url/sc-rid:limit-policy-based-session-access
finding_type: scan_finding
name: Limit Policy Based Session Access Mobile Refresh Token Interval
priority: '3'
resolution_details: Ensure the Glide Property 'glide.authenticate.session_access.mobile.refresh_token_interval' is set to a value of '1800' or below.
