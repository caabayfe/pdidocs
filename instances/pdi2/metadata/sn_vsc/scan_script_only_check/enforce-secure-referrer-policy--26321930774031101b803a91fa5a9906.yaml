description: When the glide property  'com.glide.security.referrerpolicy' is set to 'default', this property ensures managing the Referrer-Policy HTTP header with the level of information sent that is appropriate for the specific Now Platform page request.  This prevents leaks of unauthorized data that may be accessible from other parts of the full URL such as the path and query string.
