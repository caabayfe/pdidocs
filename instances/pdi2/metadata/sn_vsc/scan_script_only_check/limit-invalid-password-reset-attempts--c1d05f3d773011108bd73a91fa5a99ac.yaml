category: security
description: Denotes the maximum number of unsuccessful password reset attempts that can be taken before the user is locked out of password reset process. The lockout period is determined by the value in "password_reset.request.max_attempt_window". If "password_reset.request.max_attempt" is not set to the recommended value of "3" or other reasonable small value, then it could be possible to perform brute force attack against password reset process.
documentation_url: /api/now/v1/context_doc_url/sc-rid:reset-pw-request-max-attempts
finding_type: scan_finding
name: Limit Invalid Password Reset Attempts
priority: '2'
resolution_details: Ensure the property "password_reset.request.max_attempt" is set to "3" or less.
run_condition: ''
