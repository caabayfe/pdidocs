category: security
description: The AjaxEvaluator processor executes these scripts in sandbox however there are several additional properties which can allow the scope of activities in the sandbox to expand or be turned off entirely. In a worst case scenario a user can easily execute scripts as an admin privilege. If "glide.script.allow.ajaxevaluate" is not set to the recommended value of "false", then the system API can be vulnerable to Client script execution through AJAX calls.
documentation_url: /api/now/v1/context_doc_url/sc-rid:disable-ajaxevaluate
finding_type: scan_finding
name: Disable AJAXEvaluate
priority: '2'
resolution_details: Ensure the property "glide.script.allow.ajaxevaluate" is set to "false".
