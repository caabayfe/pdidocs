description: If "glide.basicauth.required.xml" is not set to the recommended value of "true", then this will disable Basic Authentication for XML format export processor. This also happens when combined with a wrong role within the guest_user related property (For example a high privileged user such as Admin). This will lead to unauthenticated access to instance data.
