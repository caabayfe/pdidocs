category: security
description: The property "glide.authenticate.max.concurrent.interactive.sessions" controls the number of active sessions that can be open for a user when the Limit Concurrent Sessions (com.glide.limit.concurrent.sessions) plugin is enabled. It is recommended that this value be the default of "1" to reduce the number of sessions that can be left open for a user. A greater number of open sessions means there are more sessions that can potentially be hijacked.
documentation_url: /api/now/v1/context_doc_url/sc-rid:glide-auth-max-concurrent-interactive-sessions
finding_type: scan_finding
name: Minimize Concurrent Interactive Sessions with Limit Concurrent Sessions Plugin
priority: '4'
resolution_details: Ensure that property "glide.authenticate.max.concurrent.interactive.sessions" is set to "1" when the "com.glide.limit.concurrent.sessions" plugin is active.
