category: security
description: When the Glide Property 'glide.authenticate.only.allow.active.user.login' is not set to 'true', users in the sys_user table marked inactive can still login to the instance. Users may be marked inactive if they no longer have permission to login (such as during termination from a company). If the property is not set to 'true', then these users may still access the instance and any data they could previously access.
documentation_url: /api/now/v1/context_doc_url/sc-rid:prevent-inactive-users
