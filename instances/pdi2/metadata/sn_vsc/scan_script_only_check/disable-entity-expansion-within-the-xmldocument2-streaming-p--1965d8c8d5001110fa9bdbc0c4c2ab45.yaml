active: 'true'
category: security
description: If "glide.stax.allow_entity_resolution" is not set to the recommended value of "false", then this property allow XML entities to be expanded during parsing by the streaming parser (XMLDocument2). XML entity expansion can lead to attacks such as ability to read system files, and Denial of Service.
documentation_url: /api/now/v1/context_doc_url/sc-rid:disable-entity-expansion
finding_type: scan_finding
name: Disable Entity Expansion within the XMLDocument2 Streaming Parser
priority: '1'
resolution_details: Ensure the property "glide.stax.allow_entity_resolution" exists in the sys_properties table and is set to "false". If the property does not appear in the sys_properties list the default value is "true".
