category: security
description: If "com.glide.communications.httpclient.verify_revoked_certificate" is not set to the recommended value of "true", then certificate revocation will not be checked during TLS handshake, bypassing an important security check. This is dangerous and risky because an attacker with a revoked certificate can simply neglect to provide a valid certificate and hence break the notion of PKI/digital certificate trust that is foundational to the web.
documentation_url: /api/now/v1/context_doc_url/sc-rid:verify-certificate
finding_type: scan_finding
name: Verify Certificate Revocation
priority: '3'
resolution_details: Ensure the property "com.glide.communications.httpclient.verify_revoked_certificate" is set to "true".
