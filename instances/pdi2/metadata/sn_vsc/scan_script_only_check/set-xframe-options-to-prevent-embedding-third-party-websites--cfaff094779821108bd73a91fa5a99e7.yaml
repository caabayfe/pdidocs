description: If "com.glide.cs.embed.xframe_options" is not set to the recommended value of "DENY" or "SAMEORIGIN", then content of the web application could be embedded in a third-party site using an ALLOW-FROM uri. Allowing untrusted third-party sites could enable attacks such as clickjacking.
documentation_url: /api/now/v1/context_doc_url/sc-rid:xframe-options
finding_type: scan_finding
name: Set Xframe Options to Prevent Embedding Third-Party Websites
priority: '4'
resolution_details: Ensure the property "com.glide.cs.embed.xframe_options" is set to "DENY" or "SAMEORIGIN".
