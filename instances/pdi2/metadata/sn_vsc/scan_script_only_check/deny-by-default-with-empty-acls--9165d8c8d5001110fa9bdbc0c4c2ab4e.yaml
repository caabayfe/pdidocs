category: security
description: |-
  If "glide.sm.default_mode" is not set to the recommended value of "deny", then the instance's legacy security manager allows access to a resource when there are no ACLs defined for that resource or only wildcards table-level ACLs.

  By setting this to "allow" anything that does not have explicit ACLs set is susceptible to manipulation.
documentation_url: /api/now/v1/context_doc_url/sc-rid:default-deny
finding_type: scan_finding
name: Deny by Default with Empty ACLs
priority: '3'
resolution_details: Ensure the property "glide.sm.default_mode" is set to "deny".
