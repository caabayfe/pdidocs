description: When this property is set to 'true', roles marked as "privileged" must always be manually elevated by an admin user upon new session creation in order for the user to be granted the role's capabilities. When 'false', roles marked as "privileged" are automatically elevated upon an admin user new session, and do not need to be manually elevated (with exception of "security_admin"). Setting this property to secure value will add an extra layer of security validation to role elevation by privileged user.
