active: 'true'
category: security
description: This configuration will enforce max lifespan on active guest HTTP sessions irrespective of inactive timeout. The configured value is in minutes and the value of zero will disable timing out the active sessions. A larger maximum lifespan could allow an attacker to persist a stolen session for longer, increasing the scope of a security incident. This particular property is limited to Guest users, which have low privilege access to an instance.
documentation_url: /api/now/v1/context_doc_url/sc-rid:limit-guests-active-session
finding_type: scan_finding
name: Limit Guest's Active Session Life Span
priority: '3'
resolution_details: Set the Glide Property 'glide.guest.active.session.life_span' to a value greater than 0 and less than or equal to 720.
run_condition: new sn_vsc.VSCComplianceUtil().checkIfConfigNeedValidation('v')
