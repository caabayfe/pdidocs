category: security
description: |-
  Determines whether an application administration apps can inherit global access control list (ACL) rules. Useful when there are no scoped admin application ACLs defined for the record scope.

  If "glide.security.scoped_administration.honor_global_acl" is not set to the recommended value of "true",  then a low privilege user with permissions to the application could potentially access sensitive records.
documentation_url: /api/now/v1/context_doc_url/sc-rid:administer-scoped-admin-app-acls
finding_type: scan_finding
name: Enable Scoped Admin Application ACLs
priority: '4'
resolution_details: Ensure the property "glide.security.scoped_administration.honor_global_acl" is set to "true".
