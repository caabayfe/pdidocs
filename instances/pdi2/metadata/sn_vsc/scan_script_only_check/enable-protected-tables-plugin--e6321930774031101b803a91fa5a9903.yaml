category: security
description: |-
  When the Glide Property 'com.glide.security.protected_table.enabled' is set to 'true', The Protected Tables plugin will be utilized to prevent higher privilege users on an instance from tampering with log tables. The following logging tables will have special protections when this property is set to 'true':

  syslog (config not modifiable)
  syslog_transaction
  sys_outbound_http_log
  sysevent
  sys_audit
  sys_push_notification
  protected_table_configuration (config not modifiable)
  syslog_app_scope

  The integrity of logs is important for determining malicious activity on an instance by a customer admin.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-protected-tables
finding_type: scan_finding
name: Enable Protected Tables Plugin
priority: '3'
resolution_details: Set the Glide Property 'com.glide.security.protected_table.enabled' to 'true'. This requires a user with the "security_admin" role.
