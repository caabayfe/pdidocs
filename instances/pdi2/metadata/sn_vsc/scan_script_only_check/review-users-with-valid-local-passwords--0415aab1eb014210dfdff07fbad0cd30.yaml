active: 'true'
category: security
description: |-
  Users with local passwords may interact with the instance via API using the local credentials even if local logins are disallowed. This is needed for integration users to function correctly. 

  This check identifies users with locally set passwords, and it is recommended that the listed users be reviewed to ensure that only intended users (e.g., integration accounts) can authenticate with local authentication.
documentation_url: https://docs.servicenow.com/csh?topicname=r_ForcingLoginViaSSOOnly.html
finding_type: scan_finding
name: Review Users with Valid Local Passwords
priority: '3'
resolution_details: |-
  If the identified user should only log in with SSO, the password field for the identified user can be updated to be empty.

  If the identified user is intended to have a local password, this finding can be muted. Please note, if not enabled already for this user, please consider configuring Multi-Factor Authentication.
run_condition: ''
