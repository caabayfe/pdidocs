category: security
description: The `password_reset.request.max_attempt_window` property defines the number of minutes a user must wait to reset or change their password after exceeding the maximum number of unsuccessful attempts that is set with the password_reset.request.max_attempt property. A small number of minutes for the  `password_reset.request.max_attempt_window` property increases the risk of successfully brute forcing a password as a greater number of password reset attempts can be made. The default of 1440 minutes is recommended.
documentation_url: /api/now/v1/context_doc_url/sc-rid:reset-pw-req-max-attempts-window
finding_type: scan_finding
name: Control Lockout Time for Invalid Password Reset Attempts
priority: '2'
resolution_details: Ensure the property `password_reset.request.max_attempt_window` is set to "1440" or greater.
