active: 'true'
category: security
description: ACLs are evaluated cumulatively. If there are a number of ACLs on any given field and the Admin Overrides option is false (not selected) on one of them, then the effective admin overrides for all the ACLs are considered to be false. This causes admins to be unable to pass even the ACL where the override should be in effect. If "glide.security.admin.override.accessterm" is not set to the recommended value of "true" then, even if one of the ACL terms under the ACL rule is "Admin overrides" false, the entire rule evaluates to false.
documentation_url: /api/now/v1/context_doc_url/sc-rid:honor-admin-override-acls
finding_type: scan_finding
name: Honor Admin Override ACLs
priority: '4'
resolution_details: Ensure the property "glide.security.admin.override.accessterm" is set to "true".
