category: security
description: |-
  If the Multi SSO plugin is enabled on an instance, the v2 version should be enabled. The latest plugin enhances security and has more features, like Assertion encryption support, IDP-initiated Single Logout (SLO).

  If the latest version is not enabled, the new security features cannot be used and the instance is at risk of using an plugin which is deprecated.
documentation_url: /api/now/v1/context_doc_url/sc-rid:updated-version-multisso-plugin-enabled
finding_type: scan_finding
name: Enable Updated Version of Multi SSO Plugin
priority: '4'
resolution_details: Follow the steps in the KB https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0756504 to upgrade to the latest version, resulting in the property "glide.authenticate.multissov2_feature.enabled" set to "true".  This includes checking for and migrating any customization-related changes, then upgrading the version.
