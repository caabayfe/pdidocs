description: The "glide.sg.clear_pasteboard_when_backgrounded" property controls if text copied from ServiceNow mobile app is kept in the clipboard and pasteboard after the app is in background mode. If it is not set to the recommended value of "true", then sensitive information may be disclosed to the Android or iOS clipboard where it can be exposed to other applications on the device.
