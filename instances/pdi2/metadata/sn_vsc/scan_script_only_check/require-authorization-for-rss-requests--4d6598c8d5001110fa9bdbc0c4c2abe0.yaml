category: security
description: This property controls basic authorization for inbound RSS requests. If "glide.basicauth.required.rss" is not set to the recommended value of "true", then this will disable Basic Authentication for RSS format export processor. This also could be combined with a wrong role within the guest_user related property, this will lead to unauthenticated access to instance data.
documentation_url: /api/now/v1/context_doc_url/sc-rid:rss-request-authorization
finding_type: scan_finding
name: Require Authorization for RSS Requests
priority: '2'
resolution_details: Ensure the property "glide.basicauth.required.rss" exists in the sys_properties table and is set to "true".
