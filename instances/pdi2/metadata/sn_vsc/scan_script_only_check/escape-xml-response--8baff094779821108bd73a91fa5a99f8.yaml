category: security
description: If "glide.soaprequest.unescape_xml_response" is not set to the recommended value of "False", then XML responses will not be escaped. This can lead to XML injection attack. The injection of unintended XML content into an XML message can alter the intended logic of an application, and XML Injection can cause the insertion of malicious content into resulting documents.
documentation_url: /api/now/v1/context_doc_url/sc-rid:excape-xml-response
finding_type: scan_finding
name: Escape XML Response
priority: '3'
resolution_details: Ensure the property "glide.soaprequest.unescape_xml_response" is set to "false".
