description: 'The Email Filter (com.glide.email_filter) plugin installs email filtering within the instance. This filtering identifies existing headers, which enables the administrator to decide what to do with the email based on the associated header. This plugin adds a header to each message. The header can be used for filtering within the instance. This feature is very helpful for filtering out spam. Note: Please make sure prerequisite properties "glide.email.read.active" is set to true, as this control only applies when inbound email is enabled.'
