category: security
description: When the Glide Property 'glide.cms.dashboards.sharing_with_secure_search' is not set to 'true', a user can share a dashboard to groups and roles that they do not personally have access to. This property enforces ACLs on searching the sys_user, sys_user_role, and sys_user_group tables when sharing a dashboard. Oversharing a dashboard may result in minor confidentiality impacts in cases where a user shares a dashboard with a user, group, or role that should not access to the dashboard.
documentation_url: /api/now/v1/context_doc_url/sc-enforce-security-rules-to-sharing-dashboards
finding_type: scan_finding
name: Enforce Security Rules to Sharing Dashboards
priority: '4'
resolution_details: Set the Glide Property 'glide.cms.dashboards.sharing_with_secure_search' to 'true'.
