active: 'true'
category: security
description: When the Glide Property `glide.authenticate.oauth.post.token.expiration.cookie_auth.disabled` is not set to a value of `true`, a user may continue to utilize a session via cookies after the OAuth token used to create that session expires. This may increase the potential that the cookies are leaked and the session hijacked by a malicious user to access unauthorized resources.
documentation_url: /api/now/v1/context_doc_url/sc-rid:invalidate-session-after-oauth-token-expiration
finding_type: scan_finding
name: Invalidate Session After OAuth Token Expiration
priority: '3'
resolution_details: Ensure the Glide Property `glide.authenticate.oauth.post.token.expiration.cookie_auth.disabled` is set to a value of `true`. When the record does not exist in the `sys_properties` table, the default is `false`. A record is created for newly provisioned instances.
