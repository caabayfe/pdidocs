description: The scratchpad is an easy way to set information on the server that can be accessed in the browser. An admin can script anything to be on it, including arbitrary data from arbitrary records. If "glide.ui.escape_scratchpad" is not set to the recommended value of "true", then it is possible to execute malicious script like a cross-site scripting vulnerability.
documentation_url: /api/now/v1/context_doc_url/sc-rid:escape-scratchpad
finding_type: scan_finding
name: Escape Scripts in Scratchpad
priority: '3'
resolution_details: Ensure the property "glide.ui.escape_scratchpad" is set to "true".
