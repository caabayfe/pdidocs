active: 'true'
category: security
description: UserCookie v3 is generated only when property glide.ui.secure.cookies.use_kmf is disabled. UserCookie v3 is not secure due to storing secret key for HMAC in source code and identical for all customers. That can support malicious actors to use this one secret key for attempts to hijacking user sessions. By setting the property "glide.ui.secure.cookies.use_kmf" to "true"  UserCookie v3.1 will be used and secret key will be stored in security storage such as KMF.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-usercookie-v3-1
finding_type: scan_finding
name: Enable UserCookie Version 3.1
priority: '2'
resolution_details: Ensure the property "glide.ui.secure.cookies.use_kmf" exists and is set to "true".  If the property does not appear in the sys_properties table, add a new record.
