active: 'true'
category: security
description: If "glide.xml.entity.whitelist" is not set to the recommended value of "http://java.sun.com/j2ee/dtds/" and "glide.xml.entity.whitelist.enabled" is not set to "true", then a malicious external entity can be allowed which could cause an XXE attack. An attacker can use the DTD to include arbitrary HTTP requests that the server may execute. This could lead to additional attacks using the server's trust relationship with other entities. Extraneous values besides "http://java.sun.com/j2ee/dtds/" in the whitelist may be okay but are unnecessary for the out of the box platform state. These extra values should be reviewed by instance admins to determine if they are safe.
documentation_url: /api/now/v1/context_doc_url/allow-entity-validation-with-whitelisting-xmldoc2
finding_type: scan_finding
name: Restrict XML External Entities
priority: '1'
resolution_details: Ensure the Glide Property "glide.xml.entity.whitelist" exists and is set to "http://java.sun.com/j2ee/dtds/" and the Glide Property "glide.xml.entity.whitelist.enabled" exists and is set to the value "true". If the properties do not appear in the sys_properties table, add new records.
