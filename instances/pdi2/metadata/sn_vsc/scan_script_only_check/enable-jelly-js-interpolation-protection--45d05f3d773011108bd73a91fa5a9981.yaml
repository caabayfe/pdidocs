category: security
description: This property allows a customer to turn on or off interpolation protection. Interpolation protection ensures that when Jelly expressions are used in JavaScript, they must be deemed safe by either falling under certain categories OR being marked as SAFE in the expression itself. Without this mitigation enabled, a malicious actor can send a crafted GET parameter to a Jelly page and cause the contents of that parameter to be evaluated as server-side JavaScript with admin privileges. If "glide.ui.jelly.js_interpolation.protect" is not set to the recommended value of "true", then dangerous jelly expressions interpolated in JavaScript are allowed and user can execute code using jelly template.
documentation_url: /api/now/v1/context_doc_url/sc-rid:jelly-js-interpolation
finding_type: scan_finding
name: Enable Jelly JS Interpolation Protection
priority: '1'
resolution_details: Ensure the property "glide.ui.jelly.js_interpolation.protect" is set to "true".
