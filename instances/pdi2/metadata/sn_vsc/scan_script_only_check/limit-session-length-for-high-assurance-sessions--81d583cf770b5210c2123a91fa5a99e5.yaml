category: security
description: |-
  The glide property glide.zta.high_assurance.session.timeout denotes the high assurance session length in minutes. After the length of time specified in this property, end-users will need to re-authenticate. The default is 30 mins and the value must be between 1 and 480. Shorter session length reduces the risk of account takeover by forcing a user to reauthenticate.

  Shorter session length reduces the risk of account takeover by forcing a user to reauthenticate.
