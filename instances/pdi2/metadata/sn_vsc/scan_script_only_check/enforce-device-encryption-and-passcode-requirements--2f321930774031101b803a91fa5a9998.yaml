category: security
description: When the Glide Property 'glide.sg.device_encryption_enabled' is set to true, the ServiceNow mobile app will check that device encryption is enabled and that device passcode is enabled. If encryption or passcode is not enabled, the user will not be allowed to log into the instance on mobile. This property enforces FIPS 140-2 Encryption. Mobile device encryption and passcode are important security features for ensuring an unauthorized user cannot access the content of the device even if the device is physically obtained.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enforce-device-encryption-and-passcode
finding_type: scan_finding
name: Enforce Device Encryption and Passcode Requirements
priority: '3'
resolution_details: Set the Glide Property 'glide.sg.device_encryption_enabled' to 'true'.
