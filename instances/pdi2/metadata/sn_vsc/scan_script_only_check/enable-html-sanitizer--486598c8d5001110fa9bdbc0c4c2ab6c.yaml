category: security
description: |-
  This property controls sanitization behavior of HTML fields on a global level from a backend Java context. If "glide.html.sanitize_all_fields" is not set to the recommended value of "true", then, the ServiceNow instance is open to XSS in HTML fields.

  The ability to have XSS can lead to easily attained privilege escalation to higher roles such as admin.
documentation_url: /api/now/v1/context_doc_url/sc-rid:html-sanitizer
finding_type: scan_finding
name: Enable HTML Sanitizer
priority: '2'
resolution_details: Ensure the property "glide.html.sanitize_all_fields" is set to "true".
