description: If "glide.basicauth.required.schema" is not set to the recommended value of "true", then basic authorization is not required for all Inbound Table Schema Processor requests. The Inbound Table Schema Processor handles incoming schema requests for the platform. Omitting authentication from this processor will lead to unauthenticated access to instance data.
