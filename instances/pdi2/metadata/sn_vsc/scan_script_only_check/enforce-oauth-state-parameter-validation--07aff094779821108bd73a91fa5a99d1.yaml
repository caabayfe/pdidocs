category: security
description: The "glide.oauth.state.paramater.required system" property enables the "State" parameter to be required in an OAuth request for authorization code flow. Beginning in the Madrid release, the system property "glide.oauth.state.parameter.required" adds a "State" parameter for an OAuth request. For zbooted instances, the property is true. For upgraded instances, the property is not present, so the "State" parameter is not enabled. The "State" parameter is a string value, and should not contain special characters. The State parameter cannot be empty or " ". Not enabling the "State" parameter to "true" ensures that an attacker cannot perform CSRF attacks during authentication can allow an attacker to perform operations as the victim.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enforce-oauth-state-param-validation
finding_type: scan_finding
name: Enforce OAuth State Parameter Validation
priority: '3'
resolution_details: Ensure that the property "glide.oauth.state.parameter.required" is set to "true".
