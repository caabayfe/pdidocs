active: 'true'
category: security
description: |-
  When the "Zero Trust - Continuous Authentication" application is installed and activated, the high assurance session feature is applied to mobile sessions when this property is set to "false". If a continuous authentication policy is active, it will be checked for mobile sessions. To allow mobile sessions to bypass continuous authentication policies, set the value to "true".

  If not set to "false", the high assurance session feature will not be applied to mobile sessions. This means re-authentication will not happen as defined in policies for high role sessions. This increases the risk of session hijacking and persistent access if a session is compromised.
documentation_url: /api/now/v1/context_doc_url/sc-apply-continuous-authentication-policies-to-mobile-sessions
finding_type: scan_finding
name: Apply Continuous Authentication Policies to Mobile Sessions
priority: '4'
resolution_details: Set the Glide Property "glide.zta.high_assurance.mobile.session.allowed" to "false".  When a record does not exist in the "sys_properties" table, the default value is "false".
run_condition: ''
