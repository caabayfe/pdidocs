active: 'true'
category: security
description: The demo certificates provided by ServiceNow should not be used in production SAML configurations. The certificates are common among all instances with known passphrase. If one of the SAML properties utilizing a certificate keystore is active ( require_signed_authnrequest, require_signed_logoutrequest or encrypt_assertion ) then the demo data must not be used. Since demo data is shared among all instance, there is no integrity garuntee of requests signed with shared certificates. Any message encrypted by the IDP could be decrypted by any actor, if intercepted.
documentation_url: /api/now/v1/context_doc_url/sc-do-not-use-demo-certificates-active-saml-configurations-plugin
finding_type: scan_finding
name: Do Not Use Demo Certificates for Active SAML Configurations
priority: '4'
resolution_details: Set up a custom keystore, following the documentation. The value of glide.authenticate.sso.saml2.keystore should be set to the sys id of a custom, active keystore.
