description: |-
  Use the glide.live_profile.details property to designate whether a user should be able to view all detail fields, such as company name and phone numbers, in a live profile under the live feed feature.

  If "glide.live_profile.details" is set to the value of "Hide", then no live profile information is visible to user. If it is set to show, all information is visible. When glide.live_profile.details" is set to the value of "ACL", information is visible based on the user's profile ACLs.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-acls-to-control-live-profile-details
finding_type: scan_finding
name: Enable ACLs to Control Live Profile Details
priority: '3'
resolution_details: Ensure the property "glide.live_profile.details" is set to "ACL".
