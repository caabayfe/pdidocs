description: This property determines the user session timeout. This determines how long a user session stays active. If "glide.ui.session_timeout" is not set to the recommended value of "60" minutes or less, then the session may stay valid for long even without activity. This could provide too large of a time window to enable session hijacking attacks.
documentation_url: /api/now/v1/context_doc_url/sc-rid:session-activity-timeout
finding_type: scan_finding
name: Minimize Session Activity Timeout Duration
priority: '2'
resolution_details: Ensure the property "glide.ui.session_timeout" is set to "60" or less.
