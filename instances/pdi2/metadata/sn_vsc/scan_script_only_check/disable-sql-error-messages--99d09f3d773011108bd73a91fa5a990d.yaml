category: security
description: If "glide.db.loguser" is not set to the recommended value of "false", then sensitive server-side error messages could be displayed to end-users.  Error messages can include stack traces and information about the structure of the database that could provide an attacker the knowledge needed to perform successful SQL Injection should the preconditions exist. As defense in depth, these error messages should not be displayed to the end user.
documentation_url: /api/now/v1/context_doc_url/sc-rid:disabling-sql-error-messages
finding_type: scan_finding
name: Disable SQL Error Messages
priority: '4'
resolution_details: Ensure the property "glide.db.loguser" is set to "false".
