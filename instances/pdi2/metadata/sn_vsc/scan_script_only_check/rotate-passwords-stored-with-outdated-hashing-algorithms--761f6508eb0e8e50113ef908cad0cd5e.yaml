category: security
description: Passwords created in previous versions of the Now Platform may have used what is now considered a legacy or outdated hashing algorithm. User records created on old platform versions that have not rotated their passwords may still have passwords stored with a legacy hashing algorithm.
documentation_url: ''
finding_type: scan_finding
name: Rotate Passwords Stored with Outdated Hashing Algorithms
priority: '1'
resolution_details: |-
  If this user account is intended to have a local password configured, it is recommended that the password be rotated.

  If this user account is not intended to have a local password configured (e.g., the user is configured for SSO), the password field can be set to an empty value.
