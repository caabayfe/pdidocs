category: security
description: Record Producers that do not have additional server side validation may allow users to submit unexpected data to the associated table. This check identifies custom tables with a Record Producer but without an associated Business Rule.
documentation_url: ''
finding_type: scan_finding
name: Review Custom Tables with Record Producers and No Business Rule
priority: '2'
resolution_details: |-
  Review the associated table and record producer to determine whether additional server side input validation should be added to prevent unexpected data from being submitted. If it is relevant to implement additional server side input validation, a business rule can be created associated with the table.

  If it is not relevant for your business needs to implement additional server side input validation, this finding can be muted.
