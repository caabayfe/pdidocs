active: 'true'
category: security
description: If the property 'com.snc.platform.security.token.auth.cleanup' is set to the insecure value of 'false', expired API keys and HMAC secrets will not be deleted. This creates a potential for token reuse. If the token was expired due to leakage or compromise, reuse exposes the instance to anyone possessing the leaked token. Expired tokens are kept for the number of days defined by 'com.snc.platform.security.token.auth.days.expired.hmac_secret.is.kept' and 'com.snc.platform.security.token.auth.days.expired.api_key.is.kept'. Integers value of 0 and greater are valid values. A value of 0 would cause the expired tokens to be deleted in the same day. A high number of days increases the exposure period. The default of 7 days, or fewer, is recommended.
documentation_url: /api/now/v1/context_doc_url/sc-rid:set-automatic-token-cleanup-for-token-cred
finding_type: scan_finding
name: Set Automatic Token Cleanup for Token Credentials
priority: '3'
resolution_details: Ensure the property 'com.snc.platform.security.token.auth.cleanup' does not exist in the sys_properties table or is set to 'true'. Ensure the properties 'com.snc.platform.security.token.auth.days.expired.api_key.is.kept' and 'com.snc.platform.security.token.auth.days.expired.hmac_secret.is.kept' do not exist in the sys_properties table or are set to 7 or less, where 7 corresponds to the number of days.
run_condition: ''
score_max: '100'
score_min: '0'
score_scale: '1'
short_description: Set Automatic Token Cleanup for Token Credentials
sys_name: Set Automatic Token Cleanup for Token Credentials
sys_policy: read
