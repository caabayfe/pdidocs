category: security
description: |-
  JavaScript Content Access Control is used to allow or deny specific third-party JavaScript libraries.

  For instances initially provisioned on Tokyo or later, this check can be ignored as records on the associated table have "Deny" rules set out of the box. For instances initially provisioned prior to Tokyo, there may be "allow" rules in the JavaScript Access Control Tables.
   
  It is recommended that instance customizations be reviewed to ensure the library is not in use before blocking access. Please note that the [sys_js_content_provider_access_tracking] table can be reviewed to see the last date that the library was accessed.
documentation_url: https://docs.servicenow.com/csh?topicname=javascript-content-access-control.html
finding_type: scan_finding
name: Review Allowed JavaScript Libraries
priority: '4'
resolution_details: Review your customizations to determine whether you are using the detected library. If the library is not used in your customizations, change the "Action" to "Deny".
