category: security
description: Generally data from the production instance may contain sensitive information that you do not want in your sub-production instances. It is recommended that data from HR Profiles, HR Cases, HR tasks be excluded when cloning your production instance down to your sub production instance to help protect sensitive information. Login to the production instance and check to see if the HR tables are excluded in the exclude tables module under System Clones.
documentation_url: /api/now/v1/context_doc_url/CSHelp:exclude-table
finding_type: ''
name: HR Tables not excluded on clones from Prod
priority: '3'
resolution_details: |-
  1. Check to see if there are integrations directly to subproduction instances to populate user information from a test data source
  2. Check Production to see if Hr Profiles and other Hr specific tables are excluded
  3. Set up exclusions.
