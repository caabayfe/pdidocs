category: security
description: |-
  The properties glide.http.response.get_body.limit.enabled and glide.http.response.get_body.limit were introduced to enable new functionality that prevents OutOfMemoryExceptions being thrown as a result of a requests response body being too large. OutOfMemoryExceptions can cause denial of service (DOS) attacks as well as other issues that may aid attackers in compromising an instance.

  Not setting these properties to the recommended values could make your instance vulnerable to OutOfMemoryExceptions and denial of service attacks.
documentation_url: /api/now/v1/context_doc_url/sc-rid:limit-http-response-body
finding_type: scan_finding
name: Limit HTTP Response Body Size
priority: '4'
resolution_details: Ensure the property 'glide.http.response.get_body.limit.enabled' is set to true and 'glide.http.response.get_body.limit' is no more than 524288000 (500 mb)
run_condition: new sn_vsc.VSCComplianceUtil().checkIfConfigNeedValidation('v')
