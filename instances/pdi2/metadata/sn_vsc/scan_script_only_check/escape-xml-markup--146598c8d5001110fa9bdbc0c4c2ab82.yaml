category: security
description: This property escapes XML values at the parser level for the user interface. It prevents reflected and stored cross-site scripting attacks. If "glide.ui.escape_text" is not set to the recommended value of "true", then XML values will not be escaped at the parser level for the user interface; this will leave jelly templates susceptible to reflected and stored cross site scripting attacks. This property is not applicable in Service Portal.
documentation_url: /api/now/v1/context_doc_url/sc-rid:escape-xml
finding_type: scan_finding
name: Escape XML Markup
priority: '2'
resolution_details: Ensure the property "glide.ui.escape_text" exists in the sys_properties table and is set to "true".
