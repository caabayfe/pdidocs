description: If "glide.sg.blur_ui_when_backgrounded" is not set to the recommended value of "true", then the mobile app's UI is visible when viewed from the app switcher once the app has been backgrounded. Setting "glide.sg.blur_ui_when_backgrounded" to "true" provides a higher level of confidentiality and privacy on the local device by blurring this view when backgrounded.
documentation_url: /api/now/v1/context_doc_url/sc-rid:mobile-app-ui-obfuscation
finding_type: scan_finding
name: Require Obfuscation of Mobile App UI
priority: '4'
resolution_details: Ensure the property "glide.sg.blur_ui_when_backgrounded" is set to "true".
