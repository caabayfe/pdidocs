category: security
description: The Glide Property 'glide.service_portal.widget.table_allow_list' contains the list of tables allowed to be accessed by unauthenticated users through Service Portal widgets that make use of the additional security checks provided in the SNCACLWidgetUtil script include. This property is only enforced if the Glide Property 'glide.service_portal.widget.enforce_public_check' is 'true'. There may be unauthenticated information disclosure if uncessesary tables are listed in this property. Table ACLs will still be evaluated as previously occurred.
documentation_url: /api/now/v1/context_doc_url/sc-rid:configure-service-portal-widgets-table-allowlist
finding_type: scan_finding
name: Configure Service Portal Widgets Table Allow List
priority: '4'
resolution_details: Ensure the Glide Property 'glide.service_portal.widget.table_allow_list' is empty, or the list is restricted to the smallest number of tables with use cases for unauthenticated access.
