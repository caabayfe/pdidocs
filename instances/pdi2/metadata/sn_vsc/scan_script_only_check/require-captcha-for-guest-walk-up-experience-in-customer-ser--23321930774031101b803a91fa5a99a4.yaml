description: The captcha for the Guest Walk-up experience prevents unauthenticated guest users to create bookings by requiring users to complete a captcha verification. If captcha is not enabled, this could lead to automated creation of spam appointments to overwhelm the system or fill up all available booking spots creating a Denial of Service attack.
documentation_url: /api/now/v1/context_doc_url/sc-rid:require-captcha-for-guest-walk-up-experience
finding_type: scan_finding
name: Require Captcha for Guest Walk-up Experience in Customer Service Application
priority: '4'
resolution_details: If Guest Walk-up Experience for Customer Service application is active,  ensure sn_guest_walkup_cs.captcha.enabled to "true".
