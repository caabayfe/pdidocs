category: security
description: |-
  Use a system property to determine the minimum size of the private key used for Certificate Signing Request (CSR) generation with the Certificate Inventory Management application.

  The sn_disco_certmgmt.private_key_size system property determines the minimum size of the private key used for CSR generation with the Certificate Inventory Management application. Valid choices are 512, 1024, 2048, or 4096.

  Using keys smaller than 2048 can result in future information disclosure in the event the key is brute forced. Use a valid value greater than or equal to 2048 to future proof the key for a longer time period.
documentation_url: /api/now/v1/context_doc_url/sc-rid:sc-rid:sc-ensure-minimum-private-key-size
finding_type: scan_finding
name: Ensure minimum private key size
priority: '4'
resolution_details: Verify that this property is set to a value of 2048 or higher. Valid choices for this property are 512, 1024, 2048, or 4096. If the property doesn't exist in the System Properties [sys_properties] table, or the value is invalid, the value is 2048 by default.
