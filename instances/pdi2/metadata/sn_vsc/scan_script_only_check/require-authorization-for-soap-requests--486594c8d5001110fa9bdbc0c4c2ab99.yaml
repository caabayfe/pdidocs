category: security
description: The glide property 'glide.basicauth.required.soap' controls whether basic authentication is required to make a SOAP request to an instance.  If 'glide.basicauth.required.soap' is not set to the recommended value of 'true', then unauthenticated users performing SOAP operations will be mapped to the soap.guest user. This may enable an unauthenticated user to perform operations on the instance as if a logged in user to the instance. There may be additional impact if the user define within 'com.glide.soap.guest_user' is assigned additional roles.
documentation_url: /api/now/v1/context_doc_url/sc-rid:basic-auth-soap-requests
finding_type: scan_finding
name: Require Authorization for SOAP Requests
priority: '2'
resolution_details: Ensure the Glide Property 'glide.basicauth.required.soap' exists and is set to the value 'true'.  Alternatively, configure the instance for WS Security by setting the property 'glide.soap.require_ws_security' to 'true' and following the product documentation to configure WS Security Profiles. If the property does not appear in the sys_properties table, add a new record.
