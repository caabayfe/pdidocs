active: 'true'
category: security
description: |-
  If the property "glide.script.ui_page.customer_scoped.security_msgs_enabled" is not set to "true", then customers will not see security recommendations when configuring UI pages when either an ACL is missing, GlideRecord/GlideDBQuery APIs are used instead of GlideRecordSecure, or if the page is configured as public in the "sys_public" table. Recommendations will appear such as "We recommend UI Page use GlideRecordSecure instead of GlideRecord API", or "We recommend you add a role based Access Control to the UI Page".

  Failure to provide these recommendations will increase the likelyhood that an authorization error occurs, leading to potential information disclosure.
documentation_url: /api/now/v1/context_doc_url/sc-display-recommendations-for-high-risk-ui-pages
finding_type: scan_finding
name: Display Recommendations for High Risk UI Pages
priority: '3'
resolution_details: Ensure that the property "glide.script.ui_page.customer_scoped.security_msgs_enabled" is set to "true".
run_condition: ''
