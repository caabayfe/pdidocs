description: This property "password_reset.sms.use_notify" controls usage SMS code notification for enrollment and verification. If "password_reset.sms.use_notify" is set to the recommended value "true", then user will be notifed for password reset for SMS verification method and new device enrollment.  Using SMS code notification for enrollment and verification is more secure that default email notification.
