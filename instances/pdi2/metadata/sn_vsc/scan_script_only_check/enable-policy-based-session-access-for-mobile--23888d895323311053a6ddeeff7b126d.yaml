category: security
description: The Zero Trust - Policy Based Session Access plugin allows security admins to reduce user access in a session based on IP, Location, Identity provider attributes and user attributes using adaptive authentication policies. When this property is enabled (set to 'true'), then users logging in via mobile device will have their roles restricted as configured by the plugin policies. Instance admins may wish to restrict high privileged access when users login via mobile device, possible indicating an unsafe environment for sensitive operations.
documentation_url: /api/now/v1/context_doc_url/sc-rid:enable-policy-based-session
finding_type: scan_finding
name: Enable Policy Based Session Access for Mobile
priority: '3'
resolution_details: Set the Glide Property 'glide.authenticate.session_access.mobile.enabled' to 'true'.
