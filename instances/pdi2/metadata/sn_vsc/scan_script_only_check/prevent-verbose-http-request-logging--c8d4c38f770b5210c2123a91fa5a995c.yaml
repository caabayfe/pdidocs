active: 'true'
category: security
description: |-
  The two properties `glide.outbound_http_log.override` and `glide.outbound_http_log.override.level` work together to control the level of logging for outbound HTTP requests. When `glide.outbound_http_log.override` is set to "true", the log level for requests and responses is controlled by `glide.outbound_http_log.override.level`. If the override level is set to "all" or "elevated", then request and response headers are logged

  The headers logged through verbose settings for these properties can include sensitive information such as Authorization headers or cookies which can be used like credentials to access the requested resource. Any user who has access to the Outbound HTTP Logs table (sys_outbound_http_log) can view this information changing their scope of access. The severity would depend on what type of outbound requests are made.
documentation_url: /api/now/v1/context_doc_url/sc-prevent-verbose-http-request-logging
finding_type: scan_finding
name: Prevent Verbose HTTP Request Logging
priority: '3'
resolution_details: Ensure `glide.outbound_http_log.override` is not set to "true" and `glide.outbound_http_log.override.level` is not set to "all" or "elevated". If these properties do not appear in the sys_properties table, they are in a secure state.
run_condition: ''
score_max: '100'
