active: 'true'
category: security
description: |-
  Use a system property and restricted binding to ensure that an access token generated using that entity can't be used for UI calls.

  Use the glide.oauth.enforce_restricted_binding_for_ui system property and enable restricted binding for an OAuth entity to prevent the access tokens generated by that entity from being used for UI calls (For example, incident_list.do).

  When restricted binding is turned off, the access token generated can be used for UI calls regardless of the value of the system property.

  When the Glide Property "glide.oauth.enforce_restricted_binding_for_ui" isn't set to true or restricted binding is turned off, then a user with the access token to access an API (e.g., mobile API) can get a session issued and use it to access other restricted resources on the instance (e.g., incident_list.do)
documentation_url: /api/now/v1/context_doc_url/sc-restricted-binding-functionality-in-case-bearer-authorization
finding_type: scan_finding
name: Restricted Binding functionality in case Bearer Authorization
priority: '3'
resolution_details: Ensure that glide.oauth.enforce_restricted_binding_for_ui is set to true and Enforce Token Restrictions is set to true in all OAuth entity entries. For details on OAuth entity entries, see OAuth Inbound (https://docs-preview.corp.service-now.com/bundle/zurich-platform-security/page/integrate/authentication/concept/oauth-inbound.html).
