conditions: requires_authentication=false^EQ
description: Rest API Endpoints are defined in the [sys_ws_operation] table and can be configured to be available without authentication. Depending on the endpoint's functionality, this may allow unauthenticated users to perform unexpected actions or interact with unexpected data.
documentation_url: https://docs.servicenow.com/csh?topicname=c_CustomWebServices.html
finding_type: scan_finding
name: Review Public REST API Endpoints
priority: '2'
resolution_details: |-
  Review the identified REST API endpoint and confirm whether allowing unauthenticated users to use it is necessary for your specific use cases.

  If unauthenticated access is NOT required for your business needs, setting the "Requires Authentication" value to "true" for the respective REST API endpoint is recommended.

  If unauthenticated access is required for your business needs, this finding can be "muted" for the endpoint.
