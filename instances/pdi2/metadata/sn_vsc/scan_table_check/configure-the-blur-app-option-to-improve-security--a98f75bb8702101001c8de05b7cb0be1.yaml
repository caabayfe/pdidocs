conditions: name=glide.sg.blur_ui_when_backgrounded^value=false^EQ
description: As a security feature, administrators can configure the mobile app to blur when not in focus on a mobile device. When you double-click the home button on your mobile device to close apps or navigate back to where you left off, the ServiceNow app appears blurred.
documentation_url: /api/now/v1/context_doc_url/CSHelp:device-security-mobile
finding_type: ''
name: Configure the blur app option to improve security
priority: '3'
resolution_details: |-
  The blur app option should be enabled.
  Blur the mobile app when not in focus on a mobile device using the system property 'glide.ui.sg.blur_ui_when_backgrounded' and set the value to 'true' to enable the blur app option.
