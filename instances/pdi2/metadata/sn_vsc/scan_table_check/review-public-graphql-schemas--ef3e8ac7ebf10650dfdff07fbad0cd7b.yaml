finding_type: scan_finding
name: 'Review Public GraphQL Schemas '
priority: '2'
resolution_details: |-
  GraphQL Schemas are defined in the [sys_graphql_schema] table and can be configured to be available without authentication. Depending on the endpoint's functionality, this may allow unauthenticated users to perform unexpected actions or interact with unexpected data.Review the identified GraphQL Schema and confirm whether allowing unauthenticated users to use it is necessary for your specific use cases.

  If unauthenticated access is NOT required for your business needs, setting the "Requires Authentication" value to "true" for the respective GraphQL Schema is recommended.

  If unauthenticated access is required for your business needs, this finding can be "muted" for the endpoint.
