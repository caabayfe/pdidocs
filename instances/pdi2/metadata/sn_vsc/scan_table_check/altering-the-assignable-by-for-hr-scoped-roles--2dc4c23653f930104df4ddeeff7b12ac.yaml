finding_type: scan_finding
name: Altering the "Assignable By" for HR Scoped Roles
priority: '3'
resolution_details: OOTB the primary HR Roles are restricted to only be assignable by the HR Admin (i.e. Users with the sn_hr_core.admin Role). It is recommended that this configuration is not altered as the HR Admin (sn_hr_core.admin) Role itself is highly secure in the interests of protecting access to HR data.
