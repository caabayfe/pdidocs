category: security
conditions: role.name=admin^ORrole.name=security_admin^contains.name=sn_hr_ef.admin^EQ
description: After system configuration, ensure that only the Employee Document Management Administrator [sn_hr_ef.admin] role has access to HR Employee files, this is commonly combined with the HR Administrator [sn_hr_core.admin] role.
documentation_url: /api/now/v1/context_doc_url/CSHelp:remove-hr-admin-role
finding_type: scan_finding
name: Remove Employee Document Management Admin from IT System Administrator
priority: '2'
resolution_details: Remove the Employee Document Mangement Administrator role from System Administrator [admin] role to prevent the System Administrator from viewing sensitive HR information.  Go to the role record then in the Contains Roles related list remove sn_hr_ef.admin but before you do that ensure you have at least two users with that role already.
run_condition: GlidePluginManager.isActive('com.sn_hr_core')
score_max: '100'
