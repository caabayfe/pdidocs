name: Require an app PIN for the mobile app
priority: '3'
resolution_details: |-
  Require an app PIN
  Require users to enter a six digit PIN each time they sign in from their mobile device. 
  Requiring an app PIN is controlled by the glide.sg.require_mobile_application_pin system property - set the value to 'true' to require an app PIN.

  Note: The mobile app is automatically locked after 5 minutes of inactivity. Users accessing the mobile app after a period of inactivity need to enter their PIN code.
