active: 'false'
advanced: 'true'
category: security
conditions: role.name=admin^contains.name=sn_si.admin^EQ
description: |-
  The Security Incident Response (SIR) Administration role, "sn_si.admin" should be removed from the platform System Administrator "admin" role. The sn_si.admin role is added to the admin role during SIR activation. This is required in order to allow the platform Admin to assist in SIR configuration and implementation. After implementation this represents a security risk in that Security Incidents contain sensitive information.

  Note: The 'com.snc.security_incident' plugin will need to be installed
documentation_url: /api/now/v1/context_doc_url/CSHelp:lockdown-security-admin
finding_type: scan_finding
name: Remove Security Incident Admin Role from Platform Admin
priority: '2'
resolution_details: Consider removing the Security Incident Response (SIR) Administrator "sn_si.admin" role from the platform System Administrator "admin" role as explained in "Lock down security administration" documentation.
run_condition: GlidePluginManager.isActive('com.snc.security_incident')
score_max: '100'
score_min: '0'
score_scale: '1'
short_description: Remove Security Incident Admin Role from Platform Admin
sys_name: Remove Security Incident Admin Role from Platform Admin
sys_policy: read
table: sys_user_role_contains
