description: |-
  Insider Threat.
  Is there any account with Roles assigned and related ACLs configured to enable prohibited data manipulation like deleting records or changing. In order to protect against insiders with elevated or privileged access, access lists and roles should be monitored especially for deletion, the role assignment should be thoroughly reviewed to prevent unlogged/undocumented accounts with extra rights. This is valid throughout the whole platform and is not depending on any specific plugins or prerequirements.
documentation_url: /api/now/v1/context_doc_url/CSHelp:Roles-Access
finding_type: ''
name: Accounts, breaching Access Right Concepts, using ACLs and Roles
priority: '2'
resolution_details: 'All accounts having privileged access, including admin or security_admin, should be examined thoroughly to make sure that such an access level is required. If the access has been granted for a special purpose or for a specific task, the access should be revoked after the task is done or the time period is over. All the accounts having a role with Elevated privilege set to true, including security_admin and admin, should be verified and discussed. This definition will identify those accounts as findings. '
