description: To have the mobile app clear the pasteboard when the app enters the background, add the system property glide.sg.clear_pasteboard_when_backgrounded.
documentation_url: /api/now/v1/context_doc_url/CSHelp:device-security-mobile
finding_type: ''
name: Configure the mobile app to clear the copy/paste clipboard
priority: '3'
resolution_details: |-
  Copy/paste should be restricted.
  By default, content that you copy in the mobile app remains on your device clipboard even when the mobile application is running in the background. 
  Set the value of the system property 'glide.sg.clear_pasteboard_when_backgrounded' to 'true' to clear the clipboard information when the application is running in the background.
