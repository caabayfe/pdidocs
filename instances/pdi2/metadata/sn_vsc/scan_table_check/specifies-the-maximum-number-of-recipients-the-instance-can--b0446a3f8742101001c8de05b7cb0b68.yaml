conditions: name=glide.email.smtp.max_recipients^value>=100^EQ
description: |-
  Property Name: glide.email.smtp.max_recipients

  Specifies the maximum number of recipients the instance can list in the To: line for a single email notification. Notifications that would exceed this limit instead create duplicate email notifications addressed to a subset of the recipient list.
documentation_url: /api/now/v1/context_doc_url/CSHelp:avaiable-system-properties
finding_type: ''
name: Specifies the maximum number of recipients the instance can list
priority: '4'
resolution_details: Add this property and set the value to less than 100 to not share the email ids between a large number of recipients. Prevents sharing of email addresses in case of issues in query while dynamically populating the recipients.
