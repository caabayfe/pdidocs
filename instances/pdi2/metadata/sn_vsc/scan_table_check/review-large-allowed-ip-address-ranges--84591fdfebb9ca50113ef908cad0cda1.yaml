conditions: active=true^type=allow^EQ
description: |-
  This check identifies IP Address Access Control Ranges that contain a large amount of IP Addresses. 

  Note that if you are seeing a large number of false positives, consider adjusting the largestExpectedCIDRBlock variable for your specific business needs. 

  Additionally, please note that CIDR blocks contain a larger amount of IP addresses as the number decreases. For example, the CIDR block size 8 is larger (contains more IP addresses) than the CIDR block size 16.
documentation_url: https://docs.servicenow.com/csh?topicname=t_AccessControl.html
finding_type: scan_finding
name: Review Large Allowed IP Address Ranges
priority: '2'
resolution_details: |-
  Consider reviewing these ranges to confirm that they are configured correctly.

  If the detected IP Ranges are false positives, consider adjusting the largestExpectedCIDRBlock variable for your specific business needs or muting individual false positive findings.
