conditions: name=glide.pop3readerjob.create_caller^value=true^EQ
description: An administrator can set an email property to automatically create users from incoming email. The administrator provides a list of trusted domains to prevent untrusted users from being automatically created.
documentation_url: ''
finding_type: ''
name: Enable automatic user creation
priority: '2'
resolution_details: Set property "glide.pop3readerjob.create_caller" to "false", which will prevent the instance from creating a new sys_user record when an email is recieved and their domain is within the 'Trusted domains for creating users from incoming emails' property (glide.user.trusted_domain).  Instead the instance associates the new ticket to the Guest user record, if the guest user account is not disabled.
