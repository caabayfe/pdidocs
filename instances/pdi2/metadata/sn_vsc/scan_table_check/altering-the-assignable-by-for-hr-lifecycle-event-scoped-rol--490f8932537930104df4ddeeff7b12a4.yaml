conditions: name=sn_hr_le.activity_reader^ORname=sn_hr_le.activity_set_manager^ORname=sn_hr_le.activity_writer^ORname=sn_hr_le.admin^ORname=sn_hr_le.case_reader^ORname=sn_hr_le.case_writer^assignable_by.name!=sn_hr_le.admin^EQ
description: |-
  All Roles have an "Assignable By" field, with the Lifecycle Event HR Roles OOTB being restricted for allocation by LE Admin only. Changes to this configuration can present a security risk to HR data, and a risk to the Lifecycle Event itself by inexperienced Users.

  http://docs.servicenow.com/csh?topicname=c_ManageRoles.html
documentation_url: /api/now/v1/context_doc_url/CSHelp:manage-hr-roles
finding_type: scan_finding
name: Altering the "Assignable By" for HR Lifecycle Event Scoped Roles
priority: '3'
resolution_details: OOTB the primary HR Roles are restricted to only be assignable by the LE Admin (i.e. Users with the sn_hr_le.admin Role). It is recommended that this configuration is not altered as the LE Admin (sn_hr_le.admin) Role itself is highly secure in the interests of protecting access to HR data, and also ensuring only Users with appropriate experience are able to modify Lifecycle Events.
run_condition: GlidePluginManager.isActive('com.sn_hr_lifecycle_events')
score_max: '100'
score_min: '0'
score_scale: '1'
